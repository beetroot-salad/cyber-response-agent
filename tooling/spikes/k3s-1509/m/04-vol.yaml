apiVersion: v1
kind: Pod
metadata: {name: vjob, namespace: jobs, labels: {zone: job, claim: c1}}
spec:
  runtimeClassName: gvisor-job
  automountServiceAccountToken: false
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers: [{name: c, image: "busybox:1.36.1", command: ["sleep","3600"], volumeMounts: [{name: work, mountPath: /work}]}]
  volumes:
  - name: work
    ephemeral:
      volumeClaimTemplate:
        spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 1Gi}}}
