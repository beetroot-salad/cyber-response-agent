apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: gvisor-job}
handler: runsc-job
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: gvisor-box}
handler: runsc-box
---
apiVersion: v1
kind: Namespace
metadata: {name: jobs}
---
apiVersion: v1
kind: Pod
metadata: {name: p-job, namespace: jobs, labels: {zone: job}}
spec:
  runtimeClassName: gvisor-job
  automountServiceAccountToken: false
  containers: [{name: c, image: "busybox:1.36.1", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: p-box, namespace: jobs, labels: {zone: box}}
spec:
  runtimeClassName: gvisor-box
  automountServiceAccountToken: false
  containers: [{name: c, image: "busybox:1.36.1", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: p-runc, namespace: jobs, labels: {zone: control-ref}}
spec:
  automountServiceAccountToken: false
  containers: [{name: c, image: "busybox:1.36.1", command: ["sleep","3600"]}]
