apiVersion: v1
kind: Namespace
metadata: {name: control}
---
apiVersion: v1
kind: Pod
metadata: {name: proxy, namespace: control, labels: {app: proxy}}
spec:
  containers: [{name: c, image: "busybox:1.36.1", command: ["sh","-c","mkdir -p /w; echo proxy-ok > /w/index.html; httpd -f -p 8080 -h /w"]}]
---
apiVersion: v1
kind: Service
metadata: {name: proxy, namespace: control}
spec: {selector: {app: proxy}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: Pod
metadata: {name: worker, namespace: control, labels: {app: worker}}
spec:
  containers: [{name: c, image: "busybox:1.36.1", command: ["sh","-c","mkdir -p /w; echo worker-ok > /w/index.html; httpd -f -p 8080 -h /w"]}]
---
apiVersion: v1
kind: Service
metadata: {name: worker-np, namespace: control}
spec: {type: NodePort, selector: {app: worker}, ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]}
---
apiVersion: v1
kind: Pod
metadata: {name: peer-job, namespace: jobs, labels: {zone: job}}
spec:
  runtimeClassName: gvisor-job
  containers: [{name: c, image: "busybox:1.36.1", command: ["sh","-c","mkdir -p /w; echo peer-ok > /w/index.html; httpd -f -p 8080 -h /w"]}]
