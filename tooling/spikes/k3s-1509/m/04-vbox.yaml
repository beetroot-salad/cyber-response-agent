apiVersion: v1
kind: Pod
metadata: {name: vbox, namespace: jobs, labels: {zone: box, claim: c1}}
spec:
  runtimeClassName: gvisor-box
  automountServiceAccountToken: false
  securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
  containers: [{name: c, image: "busybox:1.36.1", command: ["sleep","3600"], volumeMounts: [{name: work, mountPath: /work}]}]
  volumes: [{name: work, persistentVolumeClaim: {claimName: vjob-work}}]
