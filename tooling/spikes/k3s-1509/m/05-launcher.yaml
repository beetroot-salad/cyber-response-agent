apiVersion: v1
kind: ServiceAccount
metadata: {name: launcher, namespace: control}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: job, namespace: jobs}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: launcher, namespace: jobs}
rules:
- {apiGroups: [""], resources: [pods], verbs: [create, delete, get, list, watch]}
- {apiGroups: [""], resources: [pods/exec], verbs: [create, get]}
- {apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list]}
- {apiGroups: [""], resources: [secrets], verbs: [create, delete]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: launcher, namespace: jobs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: launcher}
subjects: [{kind: ServiceAccount, name: launcher, namespace: control}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: job-templates}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: jobs}}
    resourceRules:
    - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods, pods/ephemeralcontainers]}
  variables:
  - {name: s, expression: "object.spec"}
  - {name: kind, expression: "has(object.metadata.labels) && 'zone' in object.metadata.labels ? object.metadata.labels['zone'] : ''"}
  - {name: claim, expression: "has(object.metadata.labels) && 'claim' in object.metadata.labels ? object.metadata.labels['claim'] : ''"}
  - {name: job, expression: "has(object.metadata.labels) && 'job' in object.metadata.labels ? object.metadata.labels['job'] : ''"}
  validations:
  - {expression: "request.operation == 'CREATE' && (!has(request.subResource) || request.subResource == '')", message: "only pod creation"}
  - {expression: "variables.kind in ['job','box'] && variables.claim != ''", message: "kind and claim labels"}
  - {expression: "has(variables.s.runtimeClassName) && variables.s.runtimeClassName == (variables.kind == 'job' ? 'gvisor-job' : 'gvisor-box')", message: "runtime class"}
  - {expression: "!has(variables.s.nodeName)", message: "nodeName"}
  - {expression: "!has(variables.s.nodeSelector) && !has(variables.s.affinity)", message: "node selector/affinity"}
  - {expression: "!has(variables.s.tolerations) || variables.s.tolerations.all(t, has(t.key) && t.key in ['node.kubernetes.io/not-ready','node.kubernetes.io/unreachable'] && has(t.effect) && t.effect == 'NoExecute')", message: "tolerations (only the defaulted ones)"}
  - {expression: "!(has(variables.s.hostNetwork) && variables.s.hostNetwork) && !(has(variables.s.hostPID) && variables.s.hostPID) && !(has(variables.s.hostIPC) && variables.s.hostIPC) && !(has(variables.s.hostUsers) && variables.s.hostUsers)", message: "host namespaces"}
  - {expression: "has(variables.s.serviceAccountName) && variables.s.serviceAccountName == 'job' && has(variables.s.automountServiceAccountToken) && variables.s.automountServiceAccountToken == false", message: "service account and token"}
  - {expression: "variables.s.dnsPolicy == 'None' && has(variables.s.dnsConfig) && has(variables.s.dnsConfig.nameservers) && variables.s.dnsConfig.nameservers == ['127.0.0.1'] && !has(variables.s.dnsConfig.searches) && !has(variables.s.dnsConfig.options)", message: "dnsPolicy"}
  - {expression: "!has(variables.s.initContainers) && !has(variables.s.ephemeralContainers) && size(variables.s.containers) == 1", message: "container count"}
  - {expression: "!has(variables.s.shareProcessNamespace) && !has(variables.s.hostAliases)", message: "process namespace / host aliases"}
  - {expression: "has(variables.s.securityContext) && has(variables.s.securityContext.runAsNonRoot) && variables.s.securityContext.runAsNonRoot == true && has(variables.s.securityContext.runAsUser) && variables.s.securityContext.runAsUser == 1000 && has(variables.s.securityContext.seccompProfile) && variables.s.securityContext.seccompProfile.type == 'RuntimeDefault' && !has(variables.s.securityContext.sysctls)", message: "pod security context"}
  - expression: >-
      variables.s.containers.all(c, c.image == 'docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662' && has(c.command) && c.command == ['sleep','3600'] && !has(c.args)
        && has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false
        && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true
        && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop == ['ALL'] && !has(c.securityContext.capabilities.add)
        && !has(c.securityContext.privileged) && !has(c.securityContext.procMount) && !has(c.securityContext.runAsUser)
        && (!has(c.ports) || c.ports.all(p, !has(p.hostPort) && !has(p.hostIP)))
        && (!has(c.volumeMounts) || c.volumeMounts.all(m, m.name in ['work','pass'] && !has(m.subPath) && !has(m.subPathExpr) && !has(m.mountPropagation))))
    message: "container fields"
  - expression: >-
      !has(variables.s.volumes) || variables.s.volumes.all(v,
        (variables.kind == 'job' && v.name == 'work' && has(v.ephemeral) && has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) && v.ephemeral.volumeClaimTemplate.spec.storageClassName == 'local-path') ||
        (variables.kind == 'job' && v.name == 'pass' && has(v.secret) && has(v.secret.secretName) && v.secret.secretName == 'pass-' + variables.claim) ||
        (variables.kind == 'box' && v.name == 'work' && has(v.persistentVolumeClaim) && variables.job != '' && v.persistentVolumeClaim.claimName == variables.job + '-work'))
    message: "volumes"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: job-templates}
spec:
  policyName: job-templates
  validationActions: [Deny]
