base_story: 'On 2026-08-30, the threshold alert counted three Falco `Sudo execution`
  events on `soc-playground`, beginning at 09:54:51.724Z and triggering at 09:59:51.646Z.
  By the branch point, the investigation had resolved the alert reference, requested
  the underlying Falco actor/parent/command details, checked CMDB for the host, and
  checked change management for authorization. The direct CMDB lookup returned 404,
  while the broader host-list query succeeded; the active-change query for 09:54Z
  returned empty and the broader change-list response was minimal. Both the legitimate-training
  and adversary-privilege-escalation hypotheses remained active, with no resolved
  actor, command classification, or authorization finding.

  '
discriminator:
  predicate: Across the three Falco `Sudo execution` events backing this alert, are
    the sudo command lines limited to read-only diagnostics, or do they include account
    persistence and credential-file access?
  holding_system: elastic
  envelope:
    system: elastic
    verb: esql
    params:
      query: "FROM logs-falco.alerts-*\n| WHERE @timestamp >= \"2026-08-30T09:54:51.724Z\"\
        \n    AND @timestamp <= \"2026-08-30T09:59:51.646Z\"\n    AND host.name ==\
        \ \"soc-playground\"\n    AND falco.rule == \"Sudo execution\"\n| KEEP @timestamp,\n\
        \       falco.output_fields.user.name,\n       falco.output_fields.proc.name,\n\
        \       falco.output_fields.proc.pname,\n       falco.output_fields.proc.cmdline,\n\
        \       falco.output_fields.container.id\n| SORT @timestamp ASC\n| LIMIT 10\n"
