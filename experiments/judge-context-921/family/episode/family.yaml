  story: 'In this world the same three-event sudo burst on soc-playground — same actor
    identity

    `sre.oncall`, same bash parentage, same timestamps between 09:54:51Z and 09:58:42Z,
    same

    non-containerized context — is not diagnostic work but a short, ordered intrusion
    sequence.

    The three commands the Falco events actually carry are `sudo useradd -m -s /bin/bash

    opsbackup`, `sudo passwd opsbackup`, and `sudo cat /etc/shadow`: first creating
    a new local

    interactive account with a home directory and login shell, then setting a password
    on it,

    then reading the host''s credential file. The name "opsbackup" is chosen to blend
    with the

    kind of utility account a defender might wave through on a host named soc-playground.


    Everything else the investigation saw before the branch point still holds: the
    direct CMDB

    lookup 404s, the host only appears in the broad list, no change ticket or maintenance
    or

    training window covers the host at 09:54Z, and the active-change query is empty.
    So when

    the defender reruns the Falco ES|QL query, the benign-reading hypothesis ("sudo
    commands

    consistent with training or diagnostics") is directly refuted by the very command

    classification its own refutation clause names — `useradd`, `passwd`, `cat /etc/shadow`

    are literally listed there as suspicious — and the adversary hypothesis''s prediction
    of

    persistence plus collection is met exactly. With no change or training authorization
    to

    explain the activity, the identity `sre.oncall` reading as an on-call SRE does
    not rescue

    the benign case: these are not commands an SRE debugging Falco runs, and the sequence
    —

    create account, set password, dump shadow — is the canonical post-access persistence
    and

    credential-access pattern. A competent investigator should conclude the burst
    is malicious

    account-persistence / credential-access activity and escalate, not file it as
    training

    noise.

    '
  disposition_declared: malicious
  label_basis: judgment
  role: C
