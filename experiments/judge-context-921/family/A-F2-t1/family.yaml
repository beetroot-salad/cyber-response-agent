- world_id: training_sandbox
  axis: CMDB registers soc-playground as a SOC-owned, low-criticality sandbox/training-range
    host with no outbound trust edges — a standing designation that is itself the
    pre-approved authorization source for simulated attack activity, where the captured
    world had no CMDB record at all.
  overlay:
    patches:
      cmdb:
        soc-playground:
          role: training-range
          criticality: low
          owner: soc-team
          designation: sandbox/training
          trust_edges_outbound: []
    elastic: {}
  story: 'In this world soc-playground is not an orphan VPS: it is the SOC team''s
    registered

    attack-simulation range. CMDB carries a full record — role training-range, criticality

    low, owner soc-team, designation sandbox/training, no outbound trust edges — so
    the host

    is exactly the kind of pre-approved source that h-001''s first authorization anchor

    (approved-source-list) names, and that anchor now resolves instead of 404ing.
    The

    designation retroactively explains every oddity the investigation flagged. The
    scripted

    one-liner appending a key literally named "fake_key_0_${ts}_attacker" with comment

    "attacker@elsewhere" is scenario debris from a persistence exercise: the key body
    is not

    valid key material and cannot authenticate anyone, which is what a deliberate
    training

    marker looks like, not what real adversary persistence looks like. Container

    1df4bcd65ee4 was an ephemeral exercise container, torn down when the scenario
    ended,

    which is why docker inspect finds nothing. The remaining gaps reconcile the same
    way:

    the host-state inventory tracks the production fleet, not the training range,
    and

    standing simulation activity on a designated sandbox runs under the CMDB designation

    itself rather than through per-event production change requests — so the empty

    change-mgmt result is expected here, not damning. The ±15m Falco context already

    gathered shows the single write with no follow-on exploitation, matching a simulation

    and undercutting h-002''s adversary-controlled-bash reading. A competent investigator
    who

    re-checks CMDB in this world receives the designation, watches it satisfy the
    sandbox

    anchor, reads the fake-key artifact as the exercise marker it is, and should land
    on

    benign authorized training activity — the verdict flips from the capture''s malicious,

    and it flips because of this fact.

    '
