base_story: 'A high-severity Elastic alert ("v2 Falco: authorized_keys modification",
  risk 73) fired on

  soc-playground, a Hetzner VPS, when Falco rule "Adding ssh keys to authorized_keys"
  caught a

  root bash process inside container 1df4bcd65ee4 running a scripted one-liner that
  created

  /root/.ssh, appended an ssh-rsa key whose body is literally "fake_key_0_${ts}_attacker"
  with

  comment "attacker@elsewhere" to /root/.ssh/authorized_keys, and chmodded it, at

  2026-07-28T16:12:36Z. By the branch point the investigation had resolved the alert
  and its

  ancestor document and run the correlation lead, and established: (1) change-mgmt
  holds no

  change requests for soc-playground at all — active-changes at the alert time is
  empty and

  list-changes (approved and unfiltered) return nothing; (2) CMDB has no record of

  soc-playground (get-host 404s, though list-hosts works), and the host is likewise
  absent from

  the host-state inventory; (3) container 1df4bcd65ee4 is already gone (docker inspect:
  no such

  object), with container metadata only partially recoverable from Falco logs; (4)
  Falco context

  events for the container in the ±15m window were gathered to test training-simulation
  versus

  isolated-write. Both hypotheses remain active: h-001 (authorized write — sandbox/training
  host

  or approved change window) and h-002 (adversary-controlled bash in an exploitable
  container

  with follow-on activity). Every authorization anchor h-001 named (CMDB sandbox designation,

  approved CR) has come back empty or indeterminate, and the investigation''s own
  authz policy

  says escalate on either. The lead goals carry harness-authored instructions to the

  investigator; that is their provenance and is recorded as such.

  '
discriminator:
  predicate: Is the 2026-07-28T16:12:36Z write to /root/.ssh/authorized_keys on soc-playground
    covered by an approved change request in change-mgmt?
  holding_system: change-mgmt
  envelope:
    system: change-mgmt
    verb: active-changes
    params:
      host: soc-playground
      at: '2026-07-28T16:12:36Z'
