  story: 'In this world, change-mgmt is not empty for soc-playground: it holds CR-2026-1187,

    "Scheduled SSH key rotation for soc-playground training scenarios," status approved,

    scope explicitly covering SSH authorized_keys modification, with a window of

    2026-07-28T15:00:00Z to 18:00:00Z — comfortably containing the 16:12:36Z write.
    The

    ordinary situation behind it: the SOC runs scheduled red-team/training scenarios
    on the

    playground VPS, and this CR is the quarterly rotation exercise in which a harness
    script

    inside an ephemeral container plants clearly-marked placeholder keys. That reading
    fits

    the captured evidence rather than fighting it: the key body is literally

    "fake_key_0_${ts}_attacker" with comment "attacker@elsewhere" — self-labeled fake

    material, not a plausible exfiltration key; the process is a scripted one-liner
    typical

    of an automation harness; and container 1df4bcd65ee4 being already gone matches
    an

    ephemeral training container torn down when the scenario ended. When the resumed

    investigation re-runs change-mgmt active-changes and list-changes (the captured
    run

    already issued exactly these three queries), they now return CR-2026-1187, satisfying

    h-001''s change-mgmt authorization anchor (ac2) that came back empty in the capture.

    CMDB still has no record of the host, so ac1 remains indeterminate — a real inventory

    hygiene gap worth noting — but the approved CR naming this host, this scope, and
    this

    window is affirmative authorization evidence, and the alert becomes a correct
    detection

    of approved change activity rather than adversary persistence. An investigator
    who

    re-queries change-mgmt at the alert time should land on authorized activity; one
    who

    still escalates to malicious despite the CR was not reading the system that held
    the

    deciding fact.

    '
  disposition_declared: benign
