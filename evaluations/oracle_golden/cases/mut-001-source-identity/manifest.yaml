case_id: mut-001-source-identity
kind: mutation
base_case: case-001-ssh-bruteforce-canary

# --- calibration metadata (#711) — see defender/docs/oracle-calibration.md ---
# INHERITED from the base case, and required to be: this case reuses case-001's
# envelopes byte-for-byte, so putting it on the other side of the split would put
# one capture on both sides. For the same reason it is not a second unit — it is
# case-001's unit shown again, and the reporter must not count it twice.
split: dev
unit:
  activity_family: brute-force/T1110.001
  host_pair: office-ws-1->canary-1
capture_environment: playground-v2@409583061
state_classes:
  cmdb: "0"
  identity: "0"
  threat-intel: "0"
  change-mgmt: "0"

# A DERIVED case: no environment, no capture, no new telemetry. The mutated
# operation was never fired, so there is no hidden/ tree — a mutation case scores
# the PROJECTION's response to a story edit, not observed ground truth. The
# labels in expected.yaml are the mutated values the projection must carry.
derivation:
  from: case-001-ssh-bruteforce-canary/oracle_visible
  changed: story.md only — two causal entities altered
  unchanged: leads.jsonl + samples/ (still scoped to canary-1, same query windows)

mutation:
  source.ip: 172.18.0.15 -> 172.18.0.30
  user.name: root -> admin

# What this case discriminates: the envelopes still point at the ORIGINAL
# operation's window. A projection that copies case-001 or reads off the query
# window emits the old values; one that reasons from the story emits the new
# ones. `must_not_emit` in expected.yaml is the leak check for the former.
#
# It discriminates a second way, missed in the seed labels: l-004 and l-006 filter
# on `source.ip == "172.18.0.15"` in every one of their queries, so moving the
# attacker to .30 moves the activity OUT of those envelopes and their class
# becomes `0`. They were left labelled `+event` (inherited from case-001 instead
# of re-derived from the mutated story), which scored a correctly-empty projection
# as two disagreements — a mutation case that did not itself mutate.
discriminates: entity-copying vs. story-tracking projection

result_classes_covered: ["+event", "0"]
lead_source: inherited from case-001 (captured from defender run oracle-fidelity-1)

# THE CONTRACT — enforced by `score.py`, which exits non-zero on a violation. Only the
# forbidden half (`must_not_emit`, in expected.yaml) was ever checked; the case's whole
# positive claim — that the projection TRACKS the mutated story — rested on a sentence in
# `projections[].result`. Both committed projections already satisfy every line below, so
# this records measured behaviour rather than inventing a bar.
expectation:
  # The sharper of the two discriminators: every query in l-004 and l-006 hard-filters
  # `source.ip == "172.18.0.15"`, so moving the attacker to .30 puts the activity outside
  # those envelopes entirely. A projection that copies case-001 emits the old burst here.
  empty_leads: [l-004, l-006]
  # The mutation has to actually land. Without this, a projection that emitted nothing
  # anywhere would pass the leak check perfectly by saying nothing at all.
  must_emit: ["172.18.0.30", "admin"]

projections:
  - tag: glm-5.2_effort-none
    oracle_model: glm-5.2
    oracle_effort: none
    oracle_prompt: defender/learning/pipeline/oracle/prompt.md
    produced_by: replay.py (production oracle seam, oracle_visible only)
    result: >
      9/9 class agreement after the l-004/l-006 relabel; mutated src/user emitted;
      originals CLEAN (no leak); 1 wrong volunteered value (l-002 `alerts: 1` for
      a success-after-failures rule the mutated story never fires)

caveats:
  - >
    The seed manifest recorded 7/9 and attributed the two disagreements to
    heterogeneous-lead jitter shared with case-001. That was wrong: l-004 and
    l-006 diverged because the labels had not been re-derived from the mutated
    story. The projection was right and the labels were not.
  - The leak check matches whole emitted values and their whitespace-delimited
    tokens, never bare substrings — so a forbidden token like `root` is not
    tripped by an unrelated path such as `/root/.ssh/authorized_keys`.
  - >
    must_not_emit catches copied ORIGINALS; it does not catch invented values that
    are neither original nor true. l-002's fabricated alert row is caught by
    observed_fields instead.
