      §7 FK-10 (human): drive a reviewed, ceiling-held `inconclusive` close through to the
      ticket bridge and assert the closing comment carries `disposition: inconclusive`,
      `outcome: stands` and the SEVENTH cause sentence — "the challenge review examined the
      ceiling claim and found nothing further measurable" — verbatim, and that
      `case_ticket.py:304-313`'s membership check (which imports REPORT_CAUSES) accepts it;
      a machinery-failed `inconclusive` (stands + failure_kind + CAUSE_REVIEW_INCOMPLETE, FK-9's
      co-occurrence) renders through the same reader without claiming a settled finding.
    rows: >-
      R7 obligation (both case_ticket edges — the same reader, the same unmoved-mirror
      concern): `case_ticket` reads report_md's outcome/cause/failure_kind for its closing
      comment (G19) and checks REPORT_CAUSES membership only; d26's prose-rewording list does
      not name scripts/case_history/case_ticket.py.

  # =========================================================================================
  # §7-APPLY (70-resolutions.md) — three demands minted from the human's decisions.
  # =========================================================================================

  - id: s_fk10_ceiling_held_commits_its_own_cause
    kind: domain-outcome
    form: test
    discharged_by: test_ceiling_held_inconclusive_commits_the_seventh_cause_and_a_confident_holds_does_not
    binds:
      - _route
      - REPORT_CAUSES
      - "interacts(_close_investigation_async->report_md)"
      - "read_composer_reply.domain.distinguished[holds]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[inconclusive]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[malicious]"
    seed_docstring: >-
      REPORT_CAUSES has exactly seven members: the six shipped sentences verbatim plus "the
      challenge review examined the ceiling claim and found nothing further measurable". A
      composer `holds` on an `inconclusive` close commits `outcome: stands` with THAT sentence
      as `cause` (and the ticket's closing comment carries it — s_case_ticket…); a composer
      `holds` on a `malicious` close still commits `cause: CAUSE_STORY_SETTLED` and never the
      new sentence; no other arm (null ask, repeat, spent pool, machinery failure) carries it.
      Frontmatter headroom with the new member: a5.
  - id: s_fk6_ceiling_sentence_names_a_recorded_id
    kind: shape
    form: test
    discharged_by: test_the_ceiling_sentence_asks_for_a_recorded_id
    binds:
      - "interacts(challenge_gate->composer).payload"
      - composer_projection
      - citable_refs
    seed_docstring: >-
      The host's ceiling sentence in the composer's user message (M2, `inconclusive` only)
      states that the missed measurement must be named by an id ALREADY IN THE RECORD — a
      `v-`/`e-`/`l-`/`h-` id — and the ask's `target` is read through the same `citable_refs`
      guard: the sentence and the guard agree, so following the sentence literally cannot
      produce the uncitable name the guard refuses. Routing of an uncitable name is unchanged
      (rg3: `Unreadable` → stands/inconclusive/CAUSE_REVIEW_INCOMPLETE/`unreadable`, d7).
  - id: s_fk8_every_reader_of_the_reviewed_split_agrees
    kind: coherence
    form: test
    discharged_by: test_every_reader_of_the_reviewed_split_agrees_on_both_populations
    binds:
      - "interacts(visualize_runtime->review_record)"
      - "interacts(visualize_runtime->review_trace)"
      - "interacts(visualize_runtime->NO_REVIEW_DISPOSITIONS)"
      - "interacts(visualize_run->report_md)"
      - _BYPASS_NOTE
    seed_docstring: >-
      R8's join census for FK-8's re-key — every consumer of `_was_reviewed`'s answer, derived
      by search (visualize_runtime.py:546 the reviewed list and its count; :585/:600 the
      per-attempt bypassed flag and its `_BYPASS_NOTE` vs role-trace rendering; :359 the
      constant read that goes away; visualize_run.py:108-133 the cause-keyed headline;
      tests/test_923_readers.py:250-254 the bare-dict callers; test_visualize_review_gate's
      fixtures): over one run dir of each population (pre-#992 inconclusive with no traces;
      post-change reviewed inconclusive with three trace files) every one of those readers
      resolves the SAME answer — the count, the section guard, the per-attempt roles/bypass
      note and the headline badge never disagree — and no reader still keys on
      `NO_REVIEW_DISPOSITIONS` for the split.

structure:
  # THE AXIS REGISTRY — every `key_axes` / `interpolates` member below is one of these. The
  # brief's "round" (review_trace rows) is a row FIELD, not a path axis; the record's `turn`
  # is minted from `ReviewState.turns` (+1 on the commit arms) and IS a path axis.
  axes: [run_dir, turn, role]

  actors:
    # --- the change's own actors (provenance: design) -------------------------------------
    - {id: _close_investigation_async, frame: leg,         provenance: design}  # close_tool.py:405 — the close's body behind both lanes; M1's branch :507, M4's commit :557-564
    - {id: challenge_gate,             frame: leg,         provenance: design}  # challenge_gate.py:429 — reads investigation.md :466-467, dispatches the three stages, routes
    - {id: _route,                     frame: leg,         provenance: design}  # challenge_gate.py:367 — already takes `disposition` (G3); M3 moves its three FORCED arms
    - {id: _fail,                      frame: leg,         provenance: design}  # challenge_gate.py:312 — six sites :471,474,512,517,530,535 (G2); M3 threads the disposition
    - {id: composer_projection,        frame: leg,         provenance: design}  # review/projector.py:227 — M2 adds `disposition` and the second host sentence
    - {id: support_projection,         frame: leg,         provenance: design}  # review/projector.py:269 — the lens cut, UNCHANGED (d5)
    - {id: run_investigation,          frame: composition, provenance: design}  # driver/__init__.py — resolves stages :512-516, the ONLY forced=True caller :312-314
    - {id: visualize_runtime,          frame: leg,         provenance: design}  # scripts/visualize/visualize_runtime.py — _was_reviewed :347, _BYPASS_NOTE :340, render_review_gate :516
    - {id: visualize_run,              frame: leg,         provenance: design}  # scripts/visualize/visualize_run.py::_gate_badge_html :108-133 (x14)
    # --- the grounded neighbourhood (provenance: code) — what reality imposes ------------
    - {id: live_review_stages,         frame: composition, provenance: code}    # review_roles.py:229 — one Agent per role via _make_live_stage :149; prompts read once per role
    - {id: RequestLogger,              frame: leg,         provenance: code}    # runtime/observe.py::RequestLogger — live stages' wire rows (agent_id review:{lens}); fakes write nothing (F1)
    - {id: replay_drive,               frame: composition, provenance: code}    # tests/e2e/_replay_harness.py::drive :434-560 — binds a `holds` bundle when review_stages is None (G4)
    - {id: read_report,                frame: leg,         provenance: code}    # defender/_report.py::read_report :93 — case_ticket, evals/held_out, learning branch/episode.verdicts read through it
    - {id: case_ticket,                frame: leg,         provenance: code}    # scripts/case_history/case_ticket.py:298-313 — closing comment carries disposition+outcome; cause ∈ REPORT_CAUSES membership
    - {id: validate_report,            frame: leg,         provenance: code}    # defender/_artifact_schema.py::validate_report — REPORT_FRONTMATTER_MAX=512, REPORT_FILE_MAX=8192, on every commit :369-374
    - {id: review_cost_by_lens,        frame: leg,         provenance: code}    # scripts/visualize/visualize_messages.py:281 — the review-cost reader of llm_requests.jsonl
    - {id: lint_half_read_table,       frame: leg,         provenance: code}    # scripts/lint/lint_half_read_table.py — fingerprints _close_investigation_async's literal branches (G20)

  boundaries:

    # ===== the seam ==========================================================================
    - id: close_investigation
      provenance: design
      # The close's entry, reached over TWO vias: the sync host lane `close_investigation`
      # (close_tool.py:567, returns CloseResult) and the model lane `_tool_close_investigation`
      # (:584, registered by register_close_tool :755 with sequential=True, returns
      # `result.message` only — x15). Both funnel into `_close_investigation_async`, so the
      # ordered refusals are shared; the difference is WHO may pass `forced` and what comes back.
      facets:
        access:
          constraints_by_via:
            host:
              trust: operator
              constraints: [enum-membership, host-only-refusal-unless-forced, terminal-check, flagged-rows-window, entry-price, structure-check, returns-CloseResult]
            tool:
              trust: attacker-influenced
              constraints: [enum-membership, host-only-refusal, terminal-check, flagged-rows-window, entry-price, structure-check, sequential, returns-message-only]

    # ===== the set M1 shrinks ===================================================================
    - id: NO_REVIEW_DISPOSITIONS
      provenance: design
      # close_tool.py:81 — `("inconclusive", HOST_ONLY_DISPOSITION)` today; design → `("unresolved",)`.
      # Code readers: :507 (the bypass branch) and visualize_runtime.py:331,336 → _was_reviewed
      # (G1). The five distinguished members are the whole DISPOSITION_ENUM: d2 drives each on its
      # own lane; only `unresolved` commits without a stage call after M1.
      facets:
        domain:
          type: str
          refinement: {nl: "A tuple of DISPOSITION_ENUM members that skip the live review. Membership is tested by value, never keyed on `forced` (#923 J4)."}
          default: "('inconclusive', 'unresolved')"
          distinguished: [inconclusive, unresolved, benign, false-positive, malicious]
          falsy_valid: false
          documented_alternatives: []

    # ===== the run-dir sinks ====================================================================
    - id: report_md
      provenance: design
      # `<run_dir>/report.md` — written by `_commit` (close_tool.py:342-402, write_guarded
      # mode=replace, record FIRST, report SECOND), rendered by render_report :195-283, validated
      # by validate_report on every commit. The delta changes its CONTRACT: `disposition:
      # inconclusive` now co-occurs with `outcome: stands` + a `failure_kind` (F7) and with a
      # `ceiling_test:` block on the reviewed path (M4). Frontmatter cap 512 B; worst reviewed
      # inconclusive 457 B (G13).
      facets:
        identity:
          key_axes: [run_dir]
          evidence: {nl: "One report per run: the path is the fixed name `report.md` under the run dir (close_tool.py:_commit, `deps.run_dir / 'report.md'`); a second commit is refused by the terminal check (#50), so the single writer never writes twice."}
          sharing: unique-key
        payload:
          parts:
            - {role: frontmatter, source: "template:render_report", slots: {disposition: GateVerdict, outcome: CLOSE_RETURNS, cause: REPORT_CAUSES, failure_kind: GateVerdict, ceiling_test: conclude_ceiling_test_rows}}
            - {role: body, source: "template:render_report", slots: {receipt_notes: conclude_ceiling_test_rows, runtime_evidence: _CloseFields}}
          invariants: [all-slots-bound]
          nl: "The analyst-facing report: host-chosen frame (disposition/outcome/cause/failure_kind) plus the priced receipts (ref/state/cap in frontmatter, note lines in the body) and the runtime_evidence block; a literal `</report>` is refused by the schema."
    - id: review_record
      provenance: design
      # `<run_dir>/review_record.{turn}.json` — `{verdict, reviewed_disposition, detail(framed),
      # failure_kind}` (_record_dict :306-317). TWO writers: the commit arms (close_tool.py:357-361,
      # turn = state.turns+1) and the challenged arm (challenge_gate.write_review_record :146 via
      # close_tool.py:543-545, turn = state.turns, already incremented in _route). After M1 an
      # `inconclusive` attempt writes a REAL verdict here (F1). Reader: visualize_runtime only
      # (test_923_readers:222-240 pins no consumer outside the runtime view).
      facets:
        identity:
          key_axes: [run_dir, turn]
          evidence: {nl: "Path template `review_record.{turn}.json` under the run dir (challenge_gate.review_record_path); `turn` read off the two writer sites named above — the numbering formulas are what s61 pins contiguous."}
          sharing: unique-key
    - id: review_trace
      provenance: design
      # `<run_dir>/wire_logs/review_{role}_trace.jsonl` — one file per REVIEW_ROLES member, rows
      # `{round, ok|skipped|incomplete, …, raw_reply?}`; the sole writer is `_write_trace_row`
      # (challenge_gate.py:256-270, guarded append, guarded_mkdir of wire_logs/), reached from the
      # gate's lens/composer rows and from `_mark_traces_incomplete` (one row per role on every
      # `_fail`, G21). `round` = state.turns at gate entry.
      facets:
        identity:
          key_axes: [run_dir, role]
          evidence: {nl: "Path template `wire_logs/review_{role}_trace.jsonl` (challenge_gate.review_trace_path); role ∈ REVIEW_ROLES; rows append across attempts, distinguished by their `round` field."}
          sharing: serialized-append
    - id: llm_requests_jsonl
      provenance: code
      # `<run_dir>/wire_logs/llm_requests.jsonl` — RequestLogger's stream; LIVE review stages write
      # `review:{lens}` rows through the run's logger (_make_live_stage), fake bundles write
      # nothing. After M1 an inconclusive close is a NEW writer disposition (F1) but the writer's
      # handling is untouched (#41 dropped); test_replay_skeleton:171-178 pins zero `review:` rows
      # in a hermetic replay (#72).
      facets:
        identity:
          key_axes: [run_dir]
          evidence: {nl: "Fixed file name under the run dir (profile `wire_log` resource: observe.RequestLogger); rows append per request."}
          sharing: serialized-append

    # ===== the three stage seams and their prompts =============================================
    - id: support
      provenance: design
      # `ReviewStages.support` — the support lens; its payload is `support_projection(companion,
      # salt)`: the companion WITHOUT `conclude`/`closed_loops` (INFERENCE_COMPANION_KEYS, C3), so
      # no ceiling receipt, rationale or note reaches it (d5). Prompt: support.md, UNTOUCHED.
      facets:
        payload:
          parts:
            - {role: system, source: "const:support_md"}
            - {role: user, source: "template:support_projection", slots: {companion: investigation_md}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The blind lens reading request over the observation-only projection, framed on the call's own salt."
    - id: ablation
      provenance: design
      # `ReviewStages.ablation` — the support lens again with one strong-move edge withheld;
      # dispatched ONLY when `ablation_target(companion)` is non-None, else a `skipped` trace row
      # and two stages run (G12/x10, a2).
      facets:
        payload:
          parts:
            - {role: system, source: "const:support_md"}
            - {role: user, source: "template:support_projection", slots: {companion: investigation_md}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The same observation-only projection minus the ablated edge; the lens is not told anything is missing."
    - id: composer
      provenance: design
      # `ReviewStages.composer` — M2's surface. System: composer.md (read once per role by
      # role_prompt). User: `composer_projection(companion, readings, salt, ablated=…)` today =
      # _COMPOSER_ASK + `## Lens readings` (each framed) + optional host ablation note OUTSIDE any
      # frame + `## The investigation's own account (host-rendered)` = UNTRUSTED_NOTE + framed
      # json.dumps(companion). M2 adds a `disposition` parameter and a second host sentence beside
      # _COMPOSER_ASK, outside every frame, keyed inconclusive/confident.
      facets:
        payload:
          parts:
            - {role: system, source: "const:composer_md"}
            - {role: user, source: "template:composer_projection", slots: {host_sentence: NO_REVIEW_DISPOSITIONS, lens_readings: support, ablation_note: ablation, companion: investigation_md}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The composer's input: the disposition-keyed host sentence and _COMPOSER_ASK outside every frame, each lens reading individually framed, the whole companion (receipts, notes, ceiling_rationale included) inside the call's salted untrusted frame."
    - id: composer_md
      provenance: design
      # runtime/review/prompts/composer.md — M2 reframes it disposition-neutral. Pinned phrases
      # that must survive (x9): "opposite disposition"; no issue numbers. Line 28-30 already
      # offers `{"finding":"gap","ask":null}` (x5 refuted the design's "the prompt does not offer
      # that shape").
      facets: {}
    - id: support_md
      provenance: code
      # runtime/review/prompts/support.md — untouched (O5); "confident conclusion" there is inert
      # framing because a lens never sees `conclude`. Pinned phrase (x9): "do not see".
      facets: {}
    - id: SKILL_md
      provenance: design
      # defender/SKILL.md — the investigator's system prompt: :514 "confident finding", :521-522
      # "Commits immediately, no review", :553-557 "anything but `inconclusive` passes", :567-572
      # fail-closed + "do not pre-emptively call `inconclusive` to route around a challenge".
      # Not hash-pinned by any test (G16). Every roster naming the four model members must keep
      # `unresolved` (G15).
      facets: {}

    # ===== the review's own contracts ===========================================================
    - id: ReviewStages
      provenance: design
      # review_roles.py:189-226 — three fields support/ablation/composer; `stage(role)` raises
      # UnboundReviewStage for an unbound field; the fully-unbound spellings are `None` (the
      # driver's fall-through) and `ReviewStages()`; both land in _dispatch's STAGE_ERROR arm
      # (x12, a1). PARTIAL binding is what the harness's `bundle()` builds routinely — FK-2.
      facets:
        domain:
          type: object
          refinement: {nl: "A bundle of up to three stage callables; the gate reads one per REVIEW_ROLES member through `stages.stage(role)` inside `_dispatch`'s fault arm."}
          default: live_review_stages
          distinguished: [fully-bound, none, empty-ReviewStages, partially-bound]
          falsy_valid: false
          documented_alternatives: []
    - id: REVIEW_ROLES
      provenance: design
      # challenge_gate.py:45 — `("support", "ablation", "composer")`, the one home for the trace
      # roster; `_mark_traces_incomplete` iterates it (G21). Unchanged by the design (d8).
      facets: {}
    - id: ReviewState
      provenance: design
      # challenge_gate.py:116-131 — per-run, in `deps.review_state["state"]`: turns, raised_asks,
      # closed, disposition. Writers: `_route` (raised_asks + turns, CHALLENGED only :419-420),
      # `_commit` (closed, disposition :391-393). SHARED across a confident→inconclusive re-close
      # on one run (F2) — the design's CAUSE_TURN_BUDGET_SPENT / NOTHING_LEFT_TO_ASK reachability.
      facets: {}
    - id: Bounds
      provenance: code
      # challenge_gate.py:75-104 — extra_turns=EXTRA_TURN_BOUND=2 (>0, < DEFAULT_TOOL_RETRIES),
      # stage_timeout=DEFENDER_REVIEW_STAGE_TIMEOUT_SECONDS (450), base_request_limit. No knob
      # gains a documented alternative from this change (brief: crosses_validation n/a), so this
      # stays a facetless read-only input rather than a domain that mints obligations nobody asked for.
      facets: {}
    - id: read_composer_reply
      provenance: design
      # review/reply.py:123-180 — `read_composer_reply(text, refs=citable_refs(companion))`:
      # FINDINGS={holds,gap}; ask target ∈ citable_refs; ASK_PROSE_MAX=500; a `holds` carrying an
      # ask and a `gap` whose ask is neither an object nor null are `Unreadable`. ONE contract for
      # both dispositions (M2). The members are the reply SHAPES the arms turn on; values from
      # rg1/rg2/rg3.
      facets:
        domain:
          type: str
          refinement: {nl: "The composer's reply as one JSON object `{finding, review, ask}`; the reader pulls exactly those three keys via .get and never inspects extras (rg1)."}
          default: holds
          distinguished: [holds, gap-with-ask, gap-null-ask, gap-omitted-ask, gap-empty-string-ask, holds-with-ask, uncited-target, not-json, finding-outside-vocabulary, extra-keys, ask-at-prose-cap, ask-over-prose-cap]
          falsy_valid: false
          documented_alternatives: []
    - id: citable_refs
      provenance: design
      # review/reply.py:79 — the ids an ask may name: vertices, edges, hypotheses, lead ids the
      # investigation recorded; exact-match membership (C7). FK-1 asks whether a lead a
      # `ceiling_test` receipt already priced is a legal target (judge: yes — membership only).
      facets:
        domain:
          type: str
          refinement: {nl: "A frozenset of recorded ids; membership is exact — no case, whitespace or receipt-aware normalisation."}
          default: recorded-id
          distinguished: [recorded-id, unrecorded-id, receipted-lead, case-variant]
          falsy_valid: false
          documented_alternatives: []
    - id: GateVerdict
      provenance: design
      # challenge_gate.py:296-309 — outcome ∈ CLOSE_RETURNS, disposition, cause ∈ REPORT_CAUSES|
      # NO_CAUSE, detail, material, turns_used, failure_kind ∈ FAILURE_KINDS|None. Producers:
      # `_route._verdict` (4 arms) and `_fail` (6 sites). No new field (d23).
      facets: {}
    - id: CloseResult
      provenance: design
      # close_tool.py:178 — the sync host lane's return; outcome ∈ CLOSE_RETURNS, message,
      # material, record_path, cause, detail, turns_used, failure_kind. Never reaches the model (x15).
      facets: {}
    - id: CLOSE_RETURNS
      provenance: design
      # close_tool.py:74 — (challenged, stands, forced-inconclusive). No new member: a standing
      # inconclusive commits `stands` (d23).
      facets: {}
    - id: REPORT_CAUSES
      provenance: design
      # close_tool.py:140 — six sentences (CAUSE_NOT_REVIEWED, STORY_SETTLED, REVIEW_INCOMPLETE,
      # EVIDENCE_CANNOT_DISCRIMINATE, TURN_BUDGET_SPENT, NOTHING_LEFT_TO_ASK). No seventh (d23,
      # FK-10 open on wording). `_fail` hardcodes CAUSE_REVIEW_INCOMPLETE at all six sites (rg3).
      facets: {}
    - id: HOST_ONLY_DISPOSITION
      provenance: design
      # close_tool.py — `"unresolved"`, the host's verdict: refused as a model argument
      # (`_refuse_if_host_only_verdict_misused` :591-623, C9); the only member left in
      # NO_REVIEW_DISPOSITIONS after M1; what `_route`/`_fail`'s FORCED arms stop returning for
      # an inconclusive close (M3).
      facets: {}
    - id: FORCED_INCONCLUSIVE
      provenance: design
      # close_tool.py:72 — the outcome name `"forced-inconclusive"` (NOT a disposition): what the
      # FORCED arms return for a confident close and never for an inconclusive one after M3.
      facets: {}
    - id: _CloseFields
      provenance: design
      # close_tool.py:320-340 — the commit's scalar bundle; `ceiling_test` is populated on the
      # bypass site today (:526-529) and, after M4, on the reviewed site (:557-562) when
      # `verdict.disposition == "inconclusive"`; `runtime_evidence` already flows on both (C14).
      facets: {}
    - id: conclude_ceiling_test_rows
      provenance: code
      # skills/invlang/validate/_gating.py:1194-1218 — the receipts M4 reuses VERBATIM from the
      # bypass path; dedup keyed on (state, ref|cap), per-row lead-anchored consistency check
      # refuses an inconsistent state (rg4). Reused, not changed.
      facets: {}
    - id: _refuse_if_entry_price_is_owed
      provenance: design
      # close_tool.py:626-701 — the price gate: reads investigation.md ONCE via
      # parse_dense_companion (pinned by test_tacit_authz_hardening_991:202-246), returns the parsed
      # CompanionBody M4's receipts come from; refuses BEFORE any stage runs (d20, a4). Its
      # ordering ahead of the review is the design's key flow; its predicate is unchanged.
      facets: {}

    # ===== the companion document ================================================================
    - id: investigation_md
      provenance: design
      # `<run_dir>/investigation.md` — read TWICE on an inconclusive close after M1: the price
      # gate's parse (receipts) and the gate's own read_text_utf8 + parse_investigation
      # (challenge_gate.py:466-467, EmptyInvestigation/TEXT_READ_ERRORS → the projector `_fail`
      # arm). Sequential tool, one process, no writer between the two reads (F3/G18) — the
      # `rewritten-between-reads` member is reachable ONLY through a fault fixture (FK-17/18/19).
      facets:
        domain:
          type: str
          refinement: {nl: "The investigator's invlang document; an inconclusive that reaches the gate has a companion with paying ceiling_test rows, hence non-empty (x6/a4)."}
          default: paying-companion
          distinguished: [absent-or-empty, unreadable-at-second-read, non-utf8-at-second-read, rewritten-between-reads, over-cap-ceiling-note]
          falsy_valid: false
          documented_alternatives: []

    # ===== the run page's readers M1 moves ======================================================
    - id: _was_reviewed
      provenance: design
      # visualize_runtime.py:347-359 — splits reviewed/unreviewed attempts on
      # `reviewed_disposition ∉ NO_REVIEW_DISPOSITIONS`, the CONSTANT, not the record (G17). After
      # M1 every pre-#992 inconclusive run dir (record stands/inconclusive, cause NOT_REVIEWED, no
      # traces — the five Measurement runs among them) renders as reviewed here while the headline
      # badge (cause-keyed) says not reviewed (F6, x7). FK-8/FK-14: re-key on the record (judge A).
      facets:
