    outcome: {nl: "Where the reviewed commit happens, an inconclusive close asserts that the verdict's disposition equals the disposition that entered the gate, so a routing arm that still hands back the host's own verdict raises rather than committing `unresolved`."}
    premises: [78]
    rows: "#78 — what the driver does with the raise is reality-lane (author probe P1, open); the assertion at the commit site is the pin."

