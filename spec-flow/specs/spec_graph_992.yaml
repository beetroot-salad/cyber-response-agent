                        # docstrings NON-RECURSIVELY over this one directory, so every #992 test file
                        # lives here (not under tests/e2e/). PHASE E (80-author-digest.md) authored one
                        # test per `form: test` demand, named by its `discharged_by`, across five
                        # UNMARKED modules (CI-selected, never `pytest.mark.gate` — G8):
