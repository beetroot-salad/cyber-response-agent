  - id: s_ceiling_test_note_overflow_on_reviewed_path
    kind: negative   # positive control: the same path with the rendered notes AT the cap commits (d18/s90 territory)
    form: test
    discharged_by: test_reviewed_inconclusive_ceiling_note_overflow_is_refused
    binds:
      - "interacts(_close_investigation_async->report_md)"
      - "interacts(_close_investigation_async->report_md).payload"
      - _refuse_if_entry_price_is_owed
      - "investigation_md.domain.distinguished[over-cap-ceiling-note]"
      - "drives(_close_investigation_async->challenge_gate)"
    resolution: >-
      §7 R6 (human, AGAINST the judge's parity recommendation) — RE-SCOPED FROM PARITY TO A FIX.
      The `ceiling_test` `note` is unbounded model-authored body text (render_report's own
      docstring, close_tool.py:237-244) and a6 shows the hole is real TODAY: the entry-price
      gate accepts a 9000-character note (`_check_inconclusive_gating` → no error) and the
      close then refuses at the commit — `ModelRetry: report.md is 9255 bytes, over the
      8192-byte limit` — on an append-only companion, i.e. a permanently stranded run. The
      demand: the accumulated RENDERED `ceiling_test` note lines are BOUNDED at the entry-price
      gate — `_check_inconclusive_gating`, collected at BOTH boundaries (the investigation.md
      write gate and the close) — with the same refusal shape the same function already uses
      for the over-cap receipt block ("disposition inconclusive blocked: the accumulated
      `ceiling_test` receipts are N bytes, over the M-byte bound — …") and the baseline block
      ("… render N bytes of `report.md` body, over the 2048-byte bound — …"): an over-cap note
      is refused BEFORE any stage runs (no trace row, no record) and never reaches the commit;
      at-cap notes commit on the reviewed path with the notes rendered in full. CAP VALUE
      (spine's assumption, handoff.deviations): 2048 bytes over the rendered note block — the
      bound this codebase already applies to the sibling model-authored body family in the
      same report (`_MAX_RUNTIME_EVIDENCE_BODY_BYTES = 2048`, _gating.py:1314, "sized well
      under the file cap with the frontmatter, the ceiling notes and the close's own sentence
      still to fit beside it"); 512 + 2048 + 2048 = 4608 leaves 3584 B of the 8192 B file cap.
      The `</report>` literal in a note is ALREADY refused by `_gating` (close_tool.py:233-235)
      and stays a row of this test.
    rows: >-
      R6 obligation as the gate leaf wrote it: M4 makes the REVIEWED close a NEW caller of
      render_report carrying REAL `ceiling_test` rows (C6), so this pre-existing, documented
      hazard is newly reached by this graph's own delta; s90 pins only the frontmatter byte cap.

