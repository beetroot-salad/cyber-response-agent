  # PHASE D-GATE — minted by the gate leaf from the R6/R7 residue `spec-graph gate` cannot
  # discharge by address-matching alone (rules.md: "Test obligations ... Minted as an
  # executable demand from phase D's residue and reviewed at §7"). Reviewed, not authored,
