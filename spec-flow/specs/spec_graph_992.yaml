base: 67d29090          # main — the base every line anchor below was re-pinned against (10-brief).

# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. `inconclusive` stops bypassing the challenge review. M1 shrinks
# `NO_REVIEW_DISPOSITIONS` (close_tool.py:81) to `("unresolved",)`; M2 gives the composer a
# disposition-keyed host sentence in its USER message (composer_projection gains `disposition`;
# composer.md loses its confident framing); M3 threads the reviewed disposition into `_route`
# and `_fail` so no arm hands an `inconclusive` close back as `unresolved` (STANDS/inconclusive
# with the same cause; CHALLENGED and holds unchanged; a routing miss asserts at the commit);
# M4 carries `ceiling_test` receipts on the reviewed commit path keyed on the VERDICT's
# disposition; M5 leaves every confident-path behaviour as it was.
#
# WHAT A COLD READER MUST NOT RE-DERIVE FROM THE DOC:
#   1. C16 IS REFUTED (G4/x1, executed). Every e2e replay through `drive` already reaches the
#      gate BOUND and, after M1, commits stands/CAUSE_STORY_SETTLED with three `ok` trace rows —
#      never STAGE_ERROR. Only test_797_retirement.py:312 and an explicit `_spec923.close(stages=None)`
#      reach the gate unbound. The suite must not be "repaired" against a fault that does not occur.
#   2. THE COMPOSER-UNREADABLE SITE CARRIES `failure_kind: unreadable`, NOT `error` (rg3, executed):
#      `_fail` hardcodes `cause=CAUSE_REVIEW_INCOMPLETE` at all six sites and the kind is the
#      stage outcome's. The primary answerer's `error` on FK-15/FK-16 is corrected here.
#   3. M4 SOURCES RECEIPTS FROM THE PRICE GATE'S PARSE (design M4, C14, G18), not from the gate's
#      own second read. The primary's #9/#34/#36 answers said the reverse; the corrected value is
#      the report carries the PRICED rows, the composer judges the second read.
#   4. THE PER-CLOSE REVIEW FLOOR IS TWO CALLS (G12/x10, executed): the ablation lens is skipped
#      with a `skipped` trace row (no `ok` key) when `ablation_target` is None.
#   5. SIX TEST FILES ARE DARK IN CI (G8): `pytestmark = pytest.mark.gate` on test_923_* and
#      test_tacit_*_991; CI's only pytest step deselects `gate`. Nothing #992 pins may live there.
#
# NAME RECONCILIATION (three coining passes → one namespace). Actors and boundaries are named
# what the code names them: `_close_investigation_async` (the close's body; the brief's
# "close_investigation" ENTRY is the boundary `close_investigation`, the seam with two vias),
# `challenge_gate`, `_route`, `_fail`, `composer_projection`, `support_projection`,
# `run_investigation` (profile contextAliases.driver), `visualize_runtime`, `visualize_run`.
# The stage seams keep the extraction's ids `support`/`ablation`/`composer` (fields of
# `ReviewStages`); sinks are `report_md`, `review_record`, `review_trace`, `llm_requests_jsonl`.
# Axes are declared ONCE below: `run_dir`, `turn`, `role` — the brief's "round" is a ROW field of
# review_trace, not a path axis. Claim ids: C1–C17 inherited (design doc), G1–G24 (10-brief),
# x1–x15 (20-demands), rg1–rg4 (46-reground), a1–a4 (this assembly's own executions).
#
# THE GATE BLOCK IS WRITTEN (gate leaf, phase D step 6, from `spec-graph gate --residue` and
# 60-residue.md) AND §7 IS APPLIED (70-resolutions.md, 2026-09-13/14): 8 human decisions, two of
# them AGAINST the judge's recommendation — FK-10 (a SEVENTH REPORT_CAUSES member, "the challenge
# review examined the ceiling claim and found nothing further measurable", for the ceiling-held
# arm; d10's cause and d23's "exactly six" both move) and R6 (the `ceiling_test` note is CAPPED
# at the entry-price gate, not left to parity — a6 shows a 9000-char note strands a run today).
# Every fork, silent branch and residue item carries its `resolved_by` in handoff.forks; the five
# cells the assembler left unbound are bound or closed by citation; `spec-graph lint/gate/claims/
# actors` all exit clean against the recorded state.
# ===========================================================================================

demands:
  # 28 inherited from 20-demands.md verbatim in id, kind, form and `discharged_by` (25 test,
  # 3 clause). `binds` is EXTENDED where assembly pulled a per-cell address into existence that
  # the demand's docstring seed already exercises (a demand at facet altitude does not discharge
  # an R3/R4 cell) — every extension is named in the demand's `assembly_note`. `premises` lists
  # the settled phase-C premises the demand carries as rows (45-dispositions numbering); the
  # `rows` sentence says what each row adds to the seed, for phase E. Then the phase-D block:
  # `s_*` demands minted one per settled premise NO inherited demand held (17 test, 1 clause).

  # ---- demand #0: the return-value contract ------------------------------------------------
  - id: d0_inconclusive_close_return_contract
    kind: behavior
    form: test
    discharged_by: test_inconclusive_close_return_contract
    binds:
      - "interacts(run_investigation->close_investigation).response"
      - "interacts(_close_investigation_async->report_md)"
      - "interacts(_close_investigation_async->review_record)"
      - CloseResult
      - CLOSE_RETURNS
      - "close_investigation.access[tool]"
    assembly_note: >-
      +`close_investigation.access[tool]` — the seed's last clause ("the tool lane returns exactly
      result.message", x15) is the model-lane cell; d2 exercises the host cell.
    resolution: >-
      §7 FK-10 (human): the `cause` on `stands` is one of SIX named causes now — the five the
      seed lists plus the seventh REPORT_CAUSES member for the ceiling-held arm
      (s_fk10_ceiling_held_commits_its_own_cause); CAUSE_NOT_REVIEWED stays `unresolved`'s alone.

  # ---- O1 / M1: the review is spent -------------------------------------------------------
  - id: d1_inconclusive_spends_the_review
    kind: behavior
    form: test
    discharged_by: test_inconclusive_spends_the_review
    binds:
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[inconclusive]"
      - "drives(_close_investigation_async->challenge_gate)"
      - "interacts(challenge_gate->support)"
      - "interacts(challenge_gate->ablation)"
      - "interacts(challenge_gate->composer)"
      - "interacts(challenge_gate->review_trace)"
      - "ReviewStages.domain.distinguished[fully-bound]"
    assembly_note: "+`ReviewStages.domain.distinguished[fully-bound]` — the seed drives a fully bound bundle."
  - id: d2_no_review_set_is_exactly_unresolved
    kind: domain-outcome
    form: test
    discharged_by: test_no_review_set_is_exactly_unresolved
    binds:
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[unresolved]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[inconclusive]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[benign]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[false-positive]"
      - "NO_REVIEW_DISPOSITIONS.domain.distinguished[malicious]"
      - "drives(_close_investigation_async->challenge_gate)"
      - "close_investigation.access[host]"
      - "close_investigation.access[tool]"
    assembly_note: >-
      +both `close_investigation.access` cells — the seed drives the four model members through
      the model lane and `unresolved` through `forced=True` (the host lane); a confident member
      on the forced lane still spends the review (the parity R3 asks for, per cell).

  # ---- O1 / M2: the composer's ceiling question --------------------------------------------
  - id: d3_composer_user_message_carries_the_ceiling_question
    kind: shape
    form: test
    discharged_by: test_composer_user_message_carries_the_ceiling_question
    binds: ["interacts(challenge_gate->composer).payload", composer_projection]
    premises: [1]
    rows: >-
      #1 — the host sentence is keyed on the disposition ARGUMENT the close was called with; a
      document whose conclude block reads confident while the close says `inconclusive` gets the
      ceiling sentence only, the confident conclude block riding as companion content (if the
      price gate refuses the mismatch first the row collapses into d20 — author probe P13 LANDED
      in phase E: `pays_every_price(malicious)` closed `inconclusive` reaches the gate, the row stands).
  - id: d4_composer_md_is_disposition_neutral
    kind: behavior
    form: test
    discharged_by: test_composer_md_is_disposition_neutral
    binds: [composer_md, "interacts(challenge_gate->composer).payload"]
    assembly_note: >-
      STRENGTHENED per 45-dispositions SB-1: the assertion covers every confident-question
      sentence of composer.md (lines 1-2, 9 "judge whether the conclusion follows", 25-26, 32
      "when the evidence carries the conclusion"), not only the opening sentence — grep-level:
      no "conclusion follows", "confident disposition", "evidence carries the conclusion" —
      while keeping test_796_reply's pinned phrases (x9: "opposite disposition"; support's
      "do not see" untouched).
  - id: d5_ceiling_claim_withheld_from_lenses
    kind: negative      # positive control: d6
    form: test
    discharged_by: test_ceiling_claim_withheld_from_lenses
    binds:
      - "interacts(challenge_gate->support).payload"
      - "interacts(challenge_gate->ablation).payload"
      - support_projection
    premises: [80]
    rows: "#80 — a sparse inconclusive companion (no strong move) reads on the lens path exactly as a confident one; the lens cut is unchanged (F9/G12)."
  - id: d6_ceiling_claim_reaches_composer_inside_untrusted_frame
    kind: shape
    form: test
    discharged_by: test_ceiling_claim_reaches_composer_inside_untrusted_frame
    binds: ["interacts(challenge_gate->composer).payload", composer_projection]
    premises: [79, 88]
    rows: >-
      #79 — a receipt note written to steer the reviewer arrives verbatim, framed, and the
      `CeilingReceipt.note` docstring stops saying it gates nothing (d26); #88 — a note that
      addresses the reviewer directly changes neither the reply contract nor the record: the
      frame is the defence.
  - id: d7_reply_contract_shared
    kind: behavior
    form: test
    discharged_by: test_reply_contract_shared_on_inconclusive
    binds:
      - "interacts(challenge_gate->composer).response"
      - read_composer_reply
      - citable_refs
      - "read_composer_reply.domain.distinguished[uncited-target]"
      - "read_composer_reply.domain.distinguished[holds-with-ask]"
      - "citable_refs.domain.distinguished[unrecorded-id]"
    premises: [86]
    rows: >-
      FK-6 (settled A by rg3): an ask naming an id the record never recorded is `Unreadable` →
      stands/inconclusive/CAUSE_REVIEW_INCOMPLETE/`failure_kind: unreadable` — never
      CAUSE_EVIDENCE_CANNOT_DISCRIMINATE; FK-13 (settled by rg1): unrecognised extra top-level
      keys on a `holds` reply are ignored, on `inconclusive` exactly as on `malicious`; FK-5
      (settled by rg2): `ask: null` ≡ omitted key (readable, → d11's arm), `ask: ""` is
      `Unreadable` (→ d14's arm); #86 — shape only, engagement is the Measurement's.
    assembly_note: "+three per-cell addresses the seed names (uncited target, holds carrying an ask, an unrecorded id)."
  - id: d8_review_roster_unchanged
    kind: negative      # positive control: d1
    form: test
    discharged_by: test_review_roster_unchanged
    binds: [ReviewStages, REVIEW_ROLES, composer_md, support_md]

  # ---- O2 / M3: the challenge, and the routing arms -----------------------------------------
  - id: d9_gap_with_ask_challenges_inconclusive
    kind: behavior
    form: test
    discharged_by: test_gap_with_ask_challenges_inconclusive
    binds:
      - "interacts(run_investigation->close_investigation).response"
      - _route
      - ReviewState
      - "interacts(_close_investigation_async->review_record)"
      - "read_composer_reply.domain.distinguished[gap-with-ask]"
      - "citable_refs.domain.distinguished[recorded-id]"
      - "citable_refs.domain.distinguished[receipted-lead]"
    resolution: >-
      §7 FK-1 (auto, judge's A): an ask naming a lead a `ceiling_test` receipt already priced
      is a LEGAL target — `challenged`, exactly as any citable ask; no host-side discount, no new
      `_route` arm. The cell is now bound as a row of this sweep. SB-2 (auto): its three-attempt
      row (three numbered records, three rounds of trace rows, one terminal report) is s62's.
    premises: [19, 45]
    rows: >-
      #19 — a citable ask for a dimension of a recorded-but-never-led entity is a legal gap →
      challenged, nothing extra recorded first; #45 — the second inconclusive close after a
      challenge is reviewed again against the inherited turns/raised_asks; FK-1 (judge: A,
      NON-MATERIAL, open at §7) — an ask naming a lead a `ceiling_test` receipt already priced is
      a legal target (membership is the guard; no host-side discount) — pin as a row ONLY if §7
      takes A; its cell `citable_refs.domain.distinguished[receipted-lead]` is left UNBOUND so the
      gate names it.
    assembly_note: "+`read_composer_reply[gap-with-ask]` and `citable_refs[recorded-id]` — the seed's composer `gap` with a citable ask."
  - id: d10_holds_commits_inconclusive_story_settled
    kind: domain-outcome
    form: test
    discharged_by: test_holds_commits_inconclusive_ceiling_examined   # RENAMED at §7 (was test_holds_commits_inconclusive_story_settled): the cause is no longer CAUSE_STORY_SETTLED
    binds:
      - _route
      - "interacts(_close_investigation_async->report_md)"
      - "read_composer_reply.domain.distinguished[holds]"
      - REPORT_CAUSES
    resolution: >-
      §7 FK-10 (human, AGAINST the judge's recommendation): a composer `holds` on an
      `inconclusive` close commits `disposition: inconclusive`, `outcome: stands`, `cause:` THE
      SEVENTH REPORT_CAUSES MEMBER — "the challenge review examined the ceiling claim and found
      nothing further measurable" — no `failure_kind`, record `verdict: stands`. The seed's
      CAUSE_STORY_SETTLED is the CONFIDENT holds arm's sentence only (s_fk10 pins the pair).
    premises: [16]
    rows: >-
      #16 — a `holds` whose review prose disputes the receipts still commits story-settled; the
      dispute rides only as the record's framed `detail`; FK-7 (judge: A, non-material) — a
      record that already settles the case is the same `holds` row: the ceiling review judges the
      ceiling, not the verdict (the honest limit, routed to Measurement).
    assembly_note: "+`read_composer_reply[holds]` — the seed's finding."
  - id: d11_null_ask_gap_stands_cannot_discriminate
    kind: domain-outcome
    form: test
    discharged_by: test_null_ask_gap_stands_cannot_discriminate
    binds:
      - _route
      - "interacts(_close_investigation_async->report_md)"
      - "interacts(challenge_gate->review_trace)"
      - "read_composer_reply.domain.distinguished[gap-null-ask]"
      - "read_composer_reply.domain.distinguished[gap-omitted-ask]"
    assembly_note: "+the two readable no-ask spellings rg2 proved identical (`ask: null`, omitted key)."
  - id: d12_repeat_ask_stands_nothing_left_to_ask
    kind: domain-outcome
    form: test
    discharged_by: test_repeat_ask_stands_nothing_left_to_ask
    binds: [_route, ReviewState, "interacts(_close_investigation_async->report_md)"]
    premises: [17, 49]
    rows: >-
      #17 — the host's `raised_asks` watermark, not the composer's memory, decides a repeat;
      #49 — the watermark carries across a confident→inconclusive switch on one run (F2).
  - id: d13_spent_pool_stands_turn_budget_spent
    kind: domain-outcome
    form: test
    discharged_by: test_spent_pool_stands_turn_budget_spent
    binds: [_route, Bounds, ReviewState, "interacts(_close_investigation_async->report_md)"]
    premises: [48]
    rows: >-
      #48 — the inherited `turns` is the confident attempt's spend; FK-11 (judge: A, non-material)
      — manufactured novelty that defeats the watermark still ends at `Bounds.extra_turns` with
      CAUSE_TURN_BUDGET_SPENT and never `unresolved`: the bound is the safety property.
  - id: d14_machinery_failure_stands_review_incomplete
    kind: behavior
    form: test
    discharged_by: test_machinery_failure_stands_review_incomplete
    binds:
      - _fail
      - "interacts(_close_investigation_async->report_md)"
      - "interacts(_close_investigation_async->review_record)"
      - "interacts(challenge_gate->review_trace)"
      - "ReviewStages.domain.distinguished[none]"
      - "ReviewStages.domain.distinguished[empty-ReviewStages]"
      - "read_composer_reply.domain.distinguished[not-json]"
      - "read_composer_reply.domain.distinguished[finding-outside-vocabulary]"
      - "read_composer_reply.domain.distinguished[gap-empty-string-ask]"
      - "investigation_md.domain.distinguished[unreadable-at-second-read]"
      - "investigation_md.domain.distinguished[non-utf8-at-second-read]"
      - "ReviewStages.domain.distinguished[partially-bound]"
    resolution: >-
      §7 FK-2 (human, with the judge): a PARTIALLY bound bundle is a supported shape; when the
      unbound role is dispatched (ablation unbound on a companion WITH a strong move) the review
      fails uniformly — stands/inconclusive/CAUSE_REVIEW_INCOMPLETE/`error`, incomplete rows on
      all roles (x12/a1) — one more row of this sweep; when the unbound role is skipped the
      review completes. The cell is now bound.
    premises: [24, 25, 26, 27, 28, 29, 31, 32, 33, 35]
    rows: >-
      Every row commits stands/inconclusive/CAUSE_REVIEW_INCOMPLETE with the stage's kind and an
      `incomplete` row on EVERY role (G21). #24 support raises → `error`, whole review fails as a
      unit; #25 ablation times out → `timeout`; #26 composer fails after both lenses `ok` →
      `error`, incomplete rows beside the lenses' ok rows; #27 all three fail → the first fault's
      kind, indistinguishable in report/record from a single fault; #28 provider unreachable for
      one role → as #24/#26; #29 ablation `skipped` row and `incomplete` row coexist; #31 support
      and composer faults → support's kind (checked first; the composer never runs after a lens
      fault); #32 mixed ok/incomplete rows on one round; #33/#35 investigation.md unreadable or
      not UTF-8 at the gate's second read → the projector arm, `error` (x6, a3). Phase E FOLDED #33
      into #35 (F-7): a read fault (EACCES/removed/locked) on the file the price gate just read is
      unreachable in-process without a hook between the two reads — the price gate would refuse
      first (x6/a4) — so the non-UTF-8 byte is the ONE primitive that fails the gate's strict
      second read alone, and it discharges both cells (`unreadable-at-second-read`,
      `non-utf8-at-second-read`) through one projector-arm row. FK-15/FK-16
      (settled by rg3): a non-JSON reply and a finding outside {holds,gap} are `unreadable`, NOT
      `error`; rg2: `ask: ""` is `unreadable`. FK-2 (judge: A, MATERIAL-small, open at §7): a
      PARTIALLY bound bundle whose unbound role is dispatched fails exactly like the unbound case
      (x12, a1) — its cell `ReviewStages.domain.distinguished[partially-bound]` is left UNBOUND so
      the gate names the human's confirmation that partial binding is a supported shape.
    assembly_note: "+eleven per-cell addresses, each a fault the seed enumerates."
  - id: d15_inconclusive_never_leaves_as_unresolved
    kind: negative      # positive controls: d17 (the same arms on a confident close do commit unresolved) and d24 (the driver still can)
    form: test
