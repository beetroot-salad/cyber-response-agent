                # (O1–O5, M1–M5, 13 claims) + the 2026-09-13 drift addendum (C14–C17), mirrored at
                # `.spec-flow/design-992.md`. TWO CORRECTIONS RIDE OVER IT (handoff.refuted): the
                # addendum's C16 is REFUTED — `_replay_harness.drive` binds a `holds` composer bundle
                # by default, so no "judgement for write-tests" is owed — and the design's
                # "three review calls is the floor" is two when no strong belief move cites an edge.
