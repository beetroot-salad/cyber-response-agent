    note: >
      F-L's fourth premise, and the census gap J12 flagged: `learning/core/persist.py:197` is a
      SECOND, error-partition intake gate the brief's N1/N2 never censused. Read at phase E:
      `_copy_shared_inputs` runs `validate_companion` — the error-severity partition — over the
      investigation on the copy path and raises `RunUnprocessable` on any finding, so the
      uniform outcome reaches past the verbs the runtime drives. This closes half of J12; the
      `Companion.leads` half stays deferred.
      NARROWED AT THE PHASE-E REPAIR ROUND. This note and the test's docstring both used to add
      "and the run lands in the failed queue for a human rather than being read under
      first-wins by a loop that cannot see the defect" — one grain above what the demand
      observes, which is `_copy_shared_inputs` raising and staging nothing. Where an
      unprocessable run then goes is the drain's business and no claim here covers it, so the
      routing sentence is withdrawn rather than asserted. The observable is that the defective
      document does not reach the loop; the control is that a repeat-free run stages cleanly.
  - id: D36
    kind: coherence
    form: waiver
    cites: [C9, C11]
    binds:
      - "interacts(narration_crosscheck_from_run->lead_bucket)"
    outcome:
      nl: >
        No test observes first-wins at `narration_crosscheck_from_run`, by §7's examined
        decision: the site reduces the companion to `_lead_ids_from_companion`, a SET of lead
        ids (C9, read at base), so two rows sharing one id produce the identical set under
        first-wins and last-wins alike and the survivor rule is provably unobservable there.
        The waiver rests on an executed claim of unobservability, not on a shared-shape
        argument — which is why this one site is waived and the three siblings in D33 are not.
    rejected:
      - nl: >
          Anchoring O3 here, as the design doc originally did by calling this "the learning
          loop's join surface": refuted at base. The join surface is `joined`/`actor_view`,
          which read the two on-disk tables and never call the parser.

  # --- Minted at the PHASE-E REPAIR ROUND, on phase F's verified findings. D37/D38 are the two
  # seams withdrawn from D33; D39 is the settled premise three phases absorbed in silence. -----
  - id: D37
    kind: coherence
    form: waiver
    cites: [J15, C11]
    binds:
      - "interacts(frontier_from_text->lead_bucket)"
    outcome:
      nl: >
        No test observes first-wins at `frontier_from_text`, by an executed decision that
        replaces a green test which could not fail for its stated reason. `derive_frontier`
        reads the companion through `effective_vertex_state` (`:V` rows plus every
        `:R attr_updates` row, `_walkers.iter_attr_updates`) and `outstanding_authz_contracts`
        (hypotheses). NOT ONE of the cells `_lead_header_record` writes from a `:L findings`
        row — `name`, `target`, `loop`, `tests_hypotheses`, `query_details`,
        `outcome.failure_reason` — reaches either. The only lead-derived content the frontier
        sees is the refinement rows a `:R` block wrote into the bucket, which are identical
        whichever `:L findings` row survives. Executed over the repeat, first-row-only and
        later-row-only documents in two fixture families, including one that stands the
        refinement block BEFORE the repeating findings block and one that opens a slot on each
        row's differing target: `slots` identical at all six (J15). THIS IS THE UNCOVERED SEAM
        AND IT IS RECORDED AS ONE. `frontier_from_text` is also the reader behind
        `scripts/lessons/lessons_frontier.py`, one of N3's two subprocess re-exec entry points
        (see `handoff.deferred`), so the waiver covers the out-of-process reader too — the
        unobservability is a property of the reduction, not of the process it runs in.
    rejected:
      - nl: >
          Keeping the parametric equality assertion §7 chose over a skip. Executed: it is true
          under first-wins, under last-wins and under today's blend, so it certifies that the
          reader treats two documents alike and never that it keeps the first row. Shipping it
          green is worse than the waiver, because the waiver is legible as absent coverage.
  - id: D38
    kind: coherence
    form: waiver
    cites: [J15, C11]
    binds:
      - "interacts(review_reply->lead_bucket)"
    outcome:
      nl: >
        No test observes first-wins at `review_reply`, on the same executed argument that waives
        `narration_crosscheck_from_run` (D36) and by the same mechanism: `citable_refs`
        (runtime/review/reply.py:90) reduces the companion's findings to `{lead["id"] for lead
        in companion["findings"]}` — a frozenset of ids unioned with the vertex, edge and
        hypothesis ids. Two rows sharing one id contribute that one id under every survivor
        rule, so the reduction is provably blind to which row won. Executed over the repeat,
        first-row-only and later-row-only documents: identical at all three (J15). Recorded as
        an uncovered seam rather than shipped as a green equality.
    rejected:
      - nl: >
          Treating this as covered because D36's argument is "the same shape". It is the same
          shape, and that is why it is a waiver rather than a test — the shared shape is an
          argument for not testing, never for counting an untestable assertion as coverage.
  - id: D39
    kind: survival
    form: test
    discharged_by: test_a_lead_bucket_an_earlier_refinement_block_seeded_survives_the_fold
    cites: [J19]
    binds:
      - "interacts(project_findings_block->lead_bucket)"
      - "interacts(apply_attr_update->lead_bucket)"
      - "lead_bucket.identity"
      - "interacts(project_findings_block->lead_header_record)"
    note: >
      A SETTLED PREMISE THREE PHASES ABSORBED IN SILENCE (`test_f46_a_lead_is_referenced_before_
      a_block_that_declares_it_twice`, 40-premise-file.py:339, answered at 42-answers.py:876),
      with its positive control orphaned beside it. It reached no demand, no §7 record and no
      `handoff.drops` entry while every conservation count stayed arithmetically perfect — which
      is the failure mode this round exists to close. The brief names the same hazard in its
      attachment table (10-brief.md:270): `lead_bucket` is "the per-id bucket the skip must not
      create-then-abandon". D26 pins the adjacent property, publication ORDER, not bucket
      identity or seeded-content survival.
      NO FIXTURE COULD SEE IT, and the shape was fixed at extraction: 20-demands' D12 note
      specifies a repeating findings block FOLLOWED BY a `:R` block, and every later fixture
      inherited that ordering. D39's document reverses it. `_lead_header_record`'s own docstring
      states the mechanism the demand pins — the outcome fields are returned separately "so the
      caller cannot merge them with a plain `dict.update`, which would overwrite the lead's
      whole outcome and discard resolution buckets an earlier `:R` block already projected onto
      it" — and `lead_bucket`'s `setdefault` returns the same dict object on every call.
      It discriminates: a first-wins fold implemented as `proj.findings[rid] = identity` passes
      D0a (whose differential compares two documents with no interposed `:R`), passes D26 (the
      key already exists, so ordering is untouched) and silently destroys the seeded bucket.
      J19 (executed at base): the seeded `outcome.attribute_updates` survive today's blend and
      today's blend takes the LATER row's identity, so the survival half is green at base and
      the identity half is red. Both are asserted together; either alone is satisfiable by the
      wrong implementation.

structure:
  axes: [run_id, lead_id]

  actors:
    - {id: run_investigation,            frame: composition, provenance: code}
    - {id: append_block,                 frame: leg, provenance: code}
    - {id: fix_row,                      frame: leg, provenance: code}
    - {id: close_investigation,          frame: leg, provenance: code}
    - {id: parse_dense_companion,        frame: leg, provenance: code}
    - {id: project_findings_block,       frame: leg, provenance: design}   # F-46's site
    - {id: warn_repeated_ids,            frame: leg, provenance: code}
    - {id: project_lead_subblock,        frame: leg, provenance: code}
    - {id: project_lead_plan_subblock,   frame: leg, provenance: code}
    - {id: project_resolution_block,     frame: leg, provenance: code}
    - {id: apply_attr_update,            frame: leg, provenance: code}
    - {id: project_resolutions_block,    frame: leg, provenance: code}
    - {id: diagnose,                     frame: leg, provenance: code}
    - {id: check_attr_update_keys,       frame: leg, provenance: code}     # F-47's site
    - {id: check_append_only,            frame: leg, provenance: code}
    - {id: check_screen_structure,       frame: leg, provenance: code}
    - {id: check_lead_refs,              frame: leg, provenance: code}
    - {id: render_diagnostic,            frame: leg, provenance: code}
    - {id: flagged_diagnostics,          frame: leg, provenance: code}
    - {id: new_row_shape_reason,         frame: leg, provenance: code}
    - {id: narration_crosscheck_from_run, frame: leg, provenance: code}
    - {id: judge_compare,                frame: leg, provenance: code}
    - {id: frontier_from_text,           frame: leg, provenance: code}
    - {id: compaction_detect_loop,       frame: leg, provenance: code}
    - {id: compaction_fold_boundary,     frame: leg, provenance: code}
    - {id: review_projector,             frame: leg, provenance: code}
    - {id: review_reply,                 frame: leg, provenance: code}
    - {id: disposition_entry_price,      frame: leg, provenance: code}
    - {id: corpus_load_one,              frame: leg, provenance: code}
    - {id: persist_run,                  frame: leg, provenance: code}

  boundaries:

    # --- the run's one model-authored transcript (brief SR1) ---------------
    - id: investigation_md
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "`_investigation_path` is `deps.run_dir / \"investigation.md\"` (tools.py:722) — one file per run dir, no interpolated axis beyond the run"}
          sharing: serialized-append

    # --- the projector's lead buckets (brief SR2) --------------------------
    - id: lead_bucket
      provenance: design
      facets:
        identity:
          key_axes: [lead_id]
          evidence: {nl: "`lead_bucket(lead_id)` (parser.py:977-982) keys the per-id bucket; published as `list(proj.findings.values())` at parser.py:1908, an insertion-ordered dict, so the order is first-mention order and a first-wins fix does not change it (brief F2)"}
          sharing: unique-key

    # --- slot 2 of the parser's return, and the diagnostic fields ----------
    - id: parse_warnings
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the ParseWarning families `parse_dense_companion` returns in slot 2, and the rule by which the F-46 family is emitted"}
          default: one-warning-per-extra-row
          distinguished: ["repeated-lead-id-in-one-block"]
          falsy_valid: false
          documented_alternatives:
            - {value: "one-warning-per-repeated-id", crosses_validation: unknown}
    - id: severity
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`Diagnostic.severity`; the dataclass default is `error` and `_parse_diagnostic` sets none, so every lifted parse warning refuses the write"}
          default: error
          distinguished: ["error", "warning"]
          falsy_valid: false
          documented_alternatives: []
    - id: fix
      provenance: design
      facets:
        domain:
          type: "tuple[str, ...]"
          refinement: {nl: "`Diagnostic.fix` — the suggestion candidates, `()` when every candidate is withheld; never None"}
          default: "()"
          distinguished: ["()"]
          falsy_valid: true
          documented_alternatives:
            - {value: "per-candidate-withholding", crosses_validation: unknown}
            - {value: "withheld-case-says-so-in-the-message", crosses_validation: unknown}
            # F-M half one: the offer gate counts cells and never asks whether the candidate is
            # LEGAL, so `attrs."class"` is offered, pastes, and makes the next parse an error
            # (J11). Widening it may also withhold fixes that apply today — unprobed.
            - {value: "re-split-candidates-through-row-cells-not-split-cells", crosses_validation: unknown}
    - id: locus
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`Diagnostic.locus.row_text`; the reused repeated-id check emits `self._warn(block, -1, \"\")`, and `_addressable` (tools.py:755-756) drops a locus-less WARN diagnostic entirely"}
          default: ""
          distinguished: [""]
          falsy_valid: true
          documented_alternatives:
            - {value: "offending-row-text", crosses_validation: unknown}

    # --- the F-47 row surfaces --------------------------------------------
    - id: raw_row
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the author's `:R attr_updates` row as `locus.row_text` carries it — the line already rstripped (J7), quoting, escapes and inter-cell padding intact. Members are the irregularity CLASSES the rebuild must survive, one per phase-C premise"}
          default: no-irregularity
          distinguished:
            - "escaped-pipe-right-of-key"
            - "quoted-pipe-right-of-key"
            - "quoted-kv-pipe"
            - "inter-cell-padding"
            - "intra-cell-value-padding"
            - "quoted-pipe-left-of-key-and-padding"
            # MINTED AT THE PHASE-E REPAIR ROUND. 65-reground probed it by accident and routed
            # it forward in prose; nothing here held it. The one cell position where the
            # shipped mechanism corrupts the author's bytes (J16) — distinct from the QUOTED
            # left-of-key member above, which base preserves (J6/C16).
            - "escaped-pipe-left-of-key"
            - "escaped-pipe-inside-the-key-cell"
            - "even-trailing-backslash-run"
            - "odd-trailing-backslash-run"
            - "legal-short-row"
            - "quoted-legal-keyword"
            - "mid-token-quote"
            - "invisible-character-strip-does-not-remove"
          falsy_valid: false
          documented_alternatives: []
    - id: suggestion_row
      provenance: design
      facets:
        access:
          constraints_by_via:
            validator_offer:
              trust: derived
              constraints: [declared-width-equality]
            fix_row_paste:
              trust: attacker-influenced
              constraints: [declared-width-equality]
    - id: attr_updates_block
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "the header a `:R attr_updates` block declares; both in-repo headers are `[resolved_by|target|key|value]`, four columns, none optional (C18)"}
          default: header-declares-four-required-columns
          distinguished: ["header-declares-an-optional-trailing-column"]
          falsy_valid: false
          documented_alternatives:
            - {value: "declared-width-is-the-headers-full-column-count", crosses_validation: true}
            - {value: "rebuild-then-pad-trailing-optionals-to-declared-width", crosses_validation: unknown}
    - id: attr_update_keys
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "the two repair routes `_check_attr_update_keys` offers for an illegal key: the fixed literal `class` and the `attrs.<key>` splice that carries the author's own key content"}
          default: class
          distinguished: ["class", "attrs.<key>"]
          falsy_valid: false
          documented_alternatives:
            - {value: "quoted-legal-keyword-accepted", crosses_validation: unknown}

    # --- what the two gates each count as a row (fork F-B) -----------------
    - id: block_rows
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "the rows of one `:L findings` block as each gate admits them: `_warn_repeated_ids` (parser.py:1504-1508) skips only rows with no readable id, `_project_findings_block` (:1694) additionally drops rows with no name"}
          default: row-carries-both-id-and-name
          distinguished: ["first-row-has-id-and-no-name", "row-has-no-readable-id"]
          falsy_valid: false
          documented_alternatives:
            - {value: "sweep-every-projected-record-up-front", crosses_validation: false}
            - {value: "compare-only-rows-that-land", crosses_validation: true}

    # --- the grandfathering question (fork F-L) ----------------------------
    - id: current_text
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the committed document `diagnose` receives as the append-only baseline; today it reaches `_check_append_only` (validate.py:3512) and nothing else, so every parse warning of the FULL proposed text refuses regardless of what was already committed"}
          default: not-consulted-by-the-new-family
          distinguished: ["legacy-repeat-already-committed"]
          falsy_valid: true
          documented_alternatives:
            - {value: "scope-the-warning-to-uncommitted-blocks", crosses_validation: unknown}
            - {value: "ship-retroactive-with-a-preflight-scan", crosses_validation: unknown}

    # --- what "same lead id" means (fork F-A) ------------------------------
    - id: lead_id
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the `id` cell of a `:L findings` row, as the repeated-id comparison reads it. The runtime assigns globally unique ids (C7), but this is text a model retypes"}
          default: l-NNN-as-the-runtime-assigns-it
          distinguished: ["quoted-spelling-of-a-bare-id", "quote-wrapped-padded-id", "case-variant-id"]
          falsy_valid: false
          documented_alternatives:
            - {value: "normalise-unquote-strip-casefold-before-comparing", crosses_validation: unknown}

    # --- the first-wins strands downstream gates read (fork F-K) -----------
    - id: lead_header_record
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "`_lead_header_record` (parser.py:600-650) splits a `:L findings` row into identity / outcome / query_details: `name` and `target` unconditionally, `loop`/`mode`/`trust_root_reached`/`screen_result`/`status` only when non-empty (`loop` through `int()`), `fail_reason` to `outcome.failure_reason`, `window` to `query_details.time_window` (J5). Members are the first-wins STRAND CASES — the author splits one lead's information across two rows and O3 keeps only the first"}
          default: every-cell-on-one-row
          distinguished:
            - "loop-only-on-the-later-row"
            - "target-only-on-the-later-row"
            - "screen-verdict-only-on-the-later-row"
            - "tests-only-on-the-later-row"
            - "fail-reason-only-on-the-later-row"
            - "system-only-on-the-later-row"
          falsy_valid: true
          documented_alternatives:
            - {value: "suppress-secondary-findings-on-a-lead-carrying-a-repeated-id-diagnostic", crosses_validation: unknown}

    # --- the tokenizer, the rejoin it replaces, and the gates --------------
    - {id: split_cells, provenance: code, facets: {}}
    - {id: swap_cell,   provenance: code, facets: {}}
    - {id: flagged_row_set, provenance: code, facets: {}}
    - id: model_context
      provenance: code
      facets:
        payload:
          parts:
            - {role: system, source: "const:UNCHANGED_NOTICE"}
            - {role: user,   source: "template:render_diagnostic", slots: {message: locus, use: fix}}
          invariants: [all-slots-bound]
          nl: "what the model is shown for a flagged row: the message, the `row:` line when the message does not already embed it, and `use:` plus indented alternates under `if d.fix:` — reached through three surfaces (the refusal at _artifact_schema.py:282, `flagged_write_refusal` at tools.py:790, `_warning_return` at tools.py:806)"
    - id: validate_investigation
      provenance: code
      facets:
        access:
          constraints_by_via:
            # ONE VIA, and the second one was DELETED at the phase-E repair round rather than
            # left standing beside the refutation that voids it. `close_path` used to sit here
            # carrying the identical `full-document-diagnose` constraint; `close_investigation`
            # does not call `validate_investigation` at all (J14, executed twice — the verb
            # validates `report.md` and nothing else). An implementer reading this block
            # top-down would have built a gate the run proved absent, and `spec-graph gate`
            # exited 0 on it because the obligation naming the cell carried a resolving
            # `discharged_by`. See handoff.refuted and handoff.deferred.
            decide_write:
              trust: derived
              constraints: [full-document-diagnose]
    - {id: INVESTIGATION_FILE_MAX, provenance: code, facets: {}}

  interacts:
    # the parser's two return surfaces
    - {from: parse_dense_companion, to: parse_warnings, mode: write, via: api, provenance: design}
    - {from: parse_dense_companion, to: lead_bucket,    mode: write, via: api, provenance: design, interpolates: [lead_id]}
    - {from: parse_dense_companion, to: attr_updates_block, mode: read, via: api, provenance: design}
    - {from: parse_dense_companion, to: split_cells,    mode: invoke, via: api, provenance: design}
    # the F-46 site and the check it reuses
    - {from: project_findings_block, to: lead_bucket,        mode: write, via: api, provenance: design, interpolates: [lead_id]}
    - {from: project_findings_block, to: lead_header_record, mode: read,  via: api, provenance: design}
    - {from: project_findings_block, to: block_rows,         mode: read,  via: api, provenance: design}
    - {from: project_findings_block, to: lead_id,            mode: read,  via: api, provenance: design}
    - {from: warn_repeated_ids,      to: block_rows,     mode: read,  via: api, provenance: code}
    - {from: warn_repeated_ids,      to: lead_id,        mode: read,  via: api, provenance: code}
    - {from: warn_repeated_ids,      to: parse_warnings, mode: write, via: api, provenance: design}
    # the other five writers into a lead bucket (brief SR2)
    - {from: project_lead_subblock,      to: lead_bucket, mode: write, via: api, provenance: code, interpolates: [lead_id]}
    - {from: project_lead_plan_subblock, to: lead_bucket, mode: write, via: api, provenance: code, interpolates: [lead_id]}
    - {from: project_resolution_block,   to: lead_bucket, mode: write, via: api, provenance: code, interpolates: [lead_id]}
    - {from: apply_attr_update,          to: lead_bucket, mode: write, via: api, provenance: code, interpolates: [lead_id]}
    - {from: project_resolutions_block,  to: lead_bucket, mode: write, via: api, provenance: code, interpolates: [lead_id]}
    # the readers of the fused bucket (census N1/N2, claim C11) — every one drops its warnings
    # except corpus_load_one. CORRECTED AT THE AMENDMENT ROUND: this line said "none of them is
    # bound by a demand but compaction_detect_loop", which was phase D's state. All eleven are
    # addressed now — D3, D19, D20, D21, D22, D33 and D12 by test, D36/D37/D38 by cited waiver.
    - {from: narration_crosscheck_from_run, to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: judge_compare,           to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: frontier_from_text,      to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: compaction_detect_loop,  to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: compaction_fold_boundary, to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: review_projector,        to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: review_reply,            to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: disposition_entry_price, to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: corpus_load_one,         to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: check_screen_structure,  to: lead_bucket, mode: read, via: api, provenance: code}
    - {from: check_lead_refs,         to: lead_bucket, mode: read, via: api, provenance: code}
    # diagnose lifts the warnings and owns the baseline
    - {from: diagnose, to: parse_warnings, mode: read, via: api, provenance: design}
    - {from: diagnose, to: severity,       mode: read, via: api, provenance: design}
    - {from: diagnose, to: current_text,   mode: read, via: api, provenance: code}
    - {from: check_append_only, to: current_text, mode: read, via: api, provenance: code}
    # the F-47 site
    - {from: check_attr_update_keys, to: fix,               mode: write, via: api, provenance: design}
    - {from: check_attr_update_keys, to: suggestion_row,    mode: write, via: validator_offer, provenance: design}
    - {from: check_attr_update_keys, to: raw_row,           mode: read,  via: api, provenance: design}
    - {from: check_attr_update_keys, to: attr_updates_block, mode: read, via: api, provenance: design}
    - {from: check_attr_update_keys, to: attr_update_keys,  mode: read,  via: api, provenance: design}
    - {from: check_attr_update_keys, to: split_cells,       mode: invoke, via: api, provenance: design}
    - {from: check_attr_update_keys, to: severity,          mode: write, via: api, provenance: code}
    - {from: check_attr_update_keys, to: swap_cell,         mode: remove, via: api, provenance: design}
    # the rendered sink
    - {from: render_diagnostic, to: fix,           mode: read,  via: api, provenance: design}
