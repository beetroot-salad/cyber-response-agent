tests: defender/tests   # the suite this graph derives. Top-level files only (`suite_files`
                        # globs one level). The new file is `test_invlang_amendment_954.py`
                        # (the subsystem's `test_invlang_*.py` convention); D4's pointer lands
                        # in the EXISTING `test_invlang_parser_characterization.py`.
schema_version: 2
design: "954"   # gh#954, most recent comment (intent + design, F-46 + F-47), plus the phase-A
                # grounding corrections comment.
base: 505b8d1c  # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# The change: two defects in the invlang parser/validator.
#   F-46 — a `:L findings` block that lists one lead id TWICE folds both rows into one bucket,
#          silently, field by field, last row winning. The fix warns (the existing repeated-id
#          check) and keeps the FIRST row, skipping later rows for an id this block landed.
#   F-47 — the repair suggestion `_check_attr_update_keys` offers is rebuilt from PARSED cells
#          and rejoined with a bare `"|".join`, so an escaped or padded cell comes back a
#          different shape and the model's paste earns a SECOND refusal. The fix rebuilds from
#          the row's raw text and withholds any candidate that does not re-split to the
#          declared width.
#
# §7 HAS RUN THREE TIMES, and every phase after it has run too. CORRECTED AT THE PHASE-E
# AMENDMENT ROUND: these lines opened "§7 HAS NOT RUN … it carries NO `gate:` block" for four
# rounds after both halves stopped being true — the first prose an implementer meets,
# describing the assembler's output as if it were this file. What stands now: the gate leaf
# attached the `gate:` block below (`evaluated`, `obligations`, `holes`, `pre_discharged`),
# §7 resolved all sixteen `handoff.forks` entries, and the author leaf, the repair round and
# the prose round each rewrote parts of this file. SEVEN OF THE DECISIONS ARE THE HUMAN'S:
# the four fork resolutions taken at §7 (F-F, F-K, F-L, F-M), plus — at the phase-F and prose
# rounds — repair this suite rather than hand its findings to the implementer, file the
# ungated close verb as out of scope (#961), and narrow the formation universal to the verbs
# the AGENT writes invlang bytes through with the harness writer filed (#964). The 28
# dispositions-level forks are grouped into those sixteen entries; each fork-bearing address
# now carries the demand or the cited waiver that answers it, and the mapping block at the
# head of `gate.holes` names every pairing.
#
# ELEVEN PROBES WERE EXECUTED AT BASE FOR THIS ASSEMBLY (claims J1-J11), AND THE LEDGER HAS
# GROWN SINCE — corrected at the amendment round, because the count was stated once and never
# re-stated: J14 was executed at phase E and J15-J19 plus the N6 census at the repair round,
# so nineteen J-claims and six N-censuses stand below, not eleven and five. Of the original
# eleven, six CORRECT an input frontier, and four of those corrections change what a test
# must assert:
#
#  1. J6 — THE RAW-TEXT MECHANISM IS UNDER-SPECIFIED IN A WAY THAT CAN REINTRODUCE F-47 IN
#     MIRROR IMAGE. No primitive returns raw cell spans (`_split_cells` strips and unescapes by
#     construction), so the obvious rebuild is `row.split("|")`. That passes D8's padding
#     trigger and D9's quoted trigger — the quoted pipe there sits to the RIGHT of `key` — and
#     MISINDEXES the key cell the moment a pipe-bearing cell stands to its LEFT. Executed:
#     `l-001|"v-001|v-002"| bogus |hello` splits naively to 5 tokens whose index 2 is
#     `v-002"`. D8's discriminating case is therefore AMENDED to combine a quoted pipe BEFORE
#     the key cell with padding; the padding-only trigger it carried does not discriminate.
#  2. J3 + J4 — A LEGACY DOCUMENT WEDGES BOTH VERBS THAT WRITE INVLANG BYTES, and the
#     dispositions' mechanism for it is half right. Executed: a committed document already
#     carrying an in-block repeat makes `validate_investigation` refuse every PROPOSAL that
#     RETAINS the repeat — an ordinary block append and a `:T close` block append alike, both
#     of them `append_block` writes — and ACCEPT one that removes it. The wedge is
#     not that `fix_row` fails validation — a repair that removes the repeat would pass — it is
#     that `fix_row` never reaches the write gate: `_tool_fix_row` refuses first unless
#     `old_row` is in the currently-flagged set, which is WARN-severity `:R attr_updates` rows
#     ONLY. An error-severity repeat is never in that window.
#     CORRECTED AT PHASE E BY J14, AND THE CORRECTION BELONGS HERE BECAUSE THIS BLOCK IS READ
#     FIRST: the phrase this run carried for three phases — "unrecoverable through ANY VERB" —
#     was inferred from the PROPOSAL parity above and is false of the verbs. The close VERB
#     never reaches this gate; it validates `report.md` only, so a run holding the defective
#     document CLOSES, commits a report and stands (#961). The wedge is over the two writing
#     verbs, by two different gates.
#  3. J8 — F-E's asymmetry is REACHABLE, with a corrected trigger. `l-001|v-001|a\|b|hello`
#     (escaped pipe INSIDE the key cell, row still four cells) offers `…|class|hello` at 4
#     cells and `…|attrs.a|b|hello` at 5 — exactly one candidate fails. The odd-trailing-
#     backslash trigger the fork also names is NOT reachable: the escape eats the delimiter,
#     the row splits to 3 under a 4-column header and is refused as a shape error before the
#     key check runs at all.
#  4. J1 — F-B's reading (a) is ILL-TYPED as worded. `_warn_repeated_ids(block, rows)` consumes
#     PROJECTED RECORDS; `block.rows` is a list of raw row STRINGS, so `r.get("id")` is None for
#     every one and a literal sweep of `block.rows` compares nothing. The fork is real but it is
#     "which record list is the check handed", not "up front or after".
#  5. J7 — `locus.row_text` is the row line ALREADY rstripped: `…|bogus|  hello  ` arrives as
#     `…|bogus|  hello`. O8's byte-identity is against that stripped text, and no rebuild can
#     preserve trailing padding. The dispositions' F-N correction over-states the target.
#  6. J9 / J10 — PO-J1 and PO-J2 are CLOSED by probe. An even-length trailing backslash run
#     pairs up and both candidates re-split to the declared width (F-I re-classifies as settled,
#     no human needed). A legal short row under a `value?` header gets a full-width fix today
#     that pastes cleanly, so the raw-text rebuild really does remove a working repair (F-F).
#
# ---------------------------------------------------------------------------
# NAME RECONCILIATION — grounding (10-brief), demand extraction (20-demands) and the
# dispositions' address derivations coined ids independently. Unified by ROLE + ORIGIN against
# the code, and against `spec_graph_836-invlang-warn.yaml`, which models the same subsystem:
#
#   `Diagnostic.severity` / `Diagnostic.fix` / `Diagnostic.locus` (20-demands' spelling, left
#       deliberately dangling for this phase) resolve to the boundaries `severity`, `fix` and
#       `locus` — the dataclass FIELD names, which are also the kwargs the code threads
#       (`fix=`, `locus=`) and the spelling 836 already committed for `severity`. `Diagnostic`
#       itself is not a boundary here: nothing in this change contracts the record as a whole.
#   `lead_bucket` is the brief's SR2 root and 20-demands' `lead_bucket` unified: `companion
#       ["findings"]` is the published list, `lead_bucket(id)` (parser.py:977) is the addressed
#       cell, and they are one sink keyed by role+origin. Its identity axis is `lead_id`.
#   `validate_investigation` is a BOUNDARY (836's spelling), not the actor 20-demands' D2 bind
#       implied. CORRECTED AT THE PHASE-E PROSE ROUND, because this block is the first prose an
#       implementer reads and it stated the generalisation the run later refuted. In this change
#       it is the surface the TWO VERBS THAT WRITE INVLANG BYTES are gated by — `append_block`
#       and `fix_row`, both over `decide_write` (J2, J3) — which is the F-L FORMATION scope
#       point. Its `access` facet therefore carries ONE via, not two: `close_path` was deleted
#       along with `interacts(close_investigation->validate_investigation)` because the close
#       VERB does not call `validate_investigation` at all (J14, executed twice). D2 binds
#       `append_block`'s edge onto the boundary and the surviving cell. Do not read "the write
#       gate is uniform" as "every verb validates": the close verb is ungated and filed (#961).
#   `check_attr_update_keys`, `project_findings_block`, `warn_repeated_ids`, `split_cells`,
#       `swap_cell`, `lead_header_record`, `new_row_shape_reason`, `flagged_diagnostics`,
#       `render_diagnostic` drop the private symbol's leading underscore, as the corpus does
#       throughout.
#   `narration_crosscheck_from_run` is KEPT as structure and DROPPED as D3's anchor: the brief
#       refuted it (it reduces the companion to a SET of lead ids, so first-wins vs last-wins is
#       unobservable there). D3 re-anchors on `compaction_detect_loop`, the one cleanly
#       observable pure-Python reader (brief F5).
#   `raw_row` / `suggestion_row` are minted here for the two halves 20-demands had no address
#       for: the author's row as it stands (the rebuild's input) and the candidate the check
#       emits (the guard's subject). The F-47 trigger classes are `raw_row`'s domain members —
#       one per phase-C premise — so an unexercised class is an R4 firing, not a silence.
#   `lead_header_record.domain.distinguished` names first-wins STRAND CASES (`loop-only-on-the-
#       later-row`, …), one per F-K premise. The members are cases, not cell values, because the
#       exercise obligation is per strand; said plainly here rather than left to be guessed.
#   AXES: `run_id`, `lead_id`. `flagged_row_set` is deliberately FACETLESS here (836 gave it an
#       identity keyed on `on_disk_line`): in this change it is a scope question — which rows
#       the repair window can reach — not a sink whose writers can collide.
# ---------------------------------------------------------------------------

demands:

  # --- Demand #0, both surfaces (20-demands D0a/D0b) ------------------------
  - id: D0a
    kind: behavior
    form: test
    discharged_by: test_repeated_lead_id_returns_a_first_wins_bucket_and_an_error_diagnostic
    binds:
      - "interacts(parse_dense_companion->parse_warnings)"
      - "interacts(parse_dense_companion->lead_bucket)"
      - "interacts(diagnose->parse_warnings)"
      - "severity.domain.distinguished[error]"
      - "locus.domain.distinguished[]"     # row_text == "" — F1/F-C's provisional pin, C19
    note: >
      Surface A of the return-value contract. `parse_dense_companion(text)` gains one
      ParseWarning per EXTRA row (not one per block, not one per id — C19) and slot 1 carries
      exactly one bucket for that id holding the FIRST row's values in identity, outcome and
      query_details alike. `diagnose` lifts each warning to a Diagnostic at the dataclass
      default severity `error`. The locus pin (`row_text == ""`, `row_index == -1`) is fork
      F-C's recommendation (a), pinned so the choice is recorded rather than inherited; F-C
      also asks for the duplicate COUNT on a three-row repeat, which D23 carries (minted at
      phase E once §7 took F-C (a) — the helper fires once per EXTRA row). "No demand yet
      carries it" stood here after D23 was minted and is corrected at the amendment round.
  - id: D0b
    kind: behavior
    form: test
    discharged_by: test_withheld_suggestion_is_an_empty_fix_tuple_on_a_still_flagged_row
    binds:
      - "interacts(check_attr_update_keys->fix)"
      - "fix.domain.distinguished[()]"
      - "locus"
      - "severity.domain.distinguished[warning]"
    note: >
      Surface B. `fix` is `tuple[str, ...] = field(default_factory=tuple)` (C20), so "withheld"
      is `()` and a test asserting `is None` asserts a shape the type forbids. Withholding
      changes `fix` and nothing else — the Diagnostic is still emitted, still carries its locus,
      still warn severity. The all-or-nothing reading is fork F-E, RESOLVED at §7 to (a)
      all-or-nothing made (a)-plus — the withheld case says so in the MESSAGE — and bound here
      and by D7; "is NOT decided here" described the pre-§7 state and is corrected at the
      amendment round. The per-candidate reading stays on `fix.domain.documented_alternatives`
      as the reading not taken.

  # --- F-46, O1-O5 (20-demands D1-D5) ---------------------------------------
  - id: D1
    kind: behavior
    form: test
    discharged_by: test_repeated_lead_id_in_one_block_is_named_in_a_parse_diagnostic
    binds:
      - "interacts(parse_dense_companion->parse_warnings)"
      - "parse_warnings.domain.distinguished[repeated-lead-id-in-one-block]"
      - "lead_bucket.identity"
    note: >
      O1. The assertion is on the id appearing in the message prose (the existing check
      interpolates `{rid!r}`), not on an exact sentence. Positive control for D5.
  - id: D2
    kind: behavior
    form: test
    discharged_by: test_repeated_lead_id_refuses_the_write_and_commits_nothing
    binds:
      - "severity.domain.distinguished[error]"
      - "interacts(append_block->validate_investigation)"
      - "interacts(append_block->investigation_md)"
      - "validate_investigation.access[decide_write]"
    note: >
      O2. Driven through the real write gate, not through `diagnose` alone: that surface's own
      contract is that WARN findings are not returned through it at all, so a non-None return is
      the observable that the F-46 family landed on the refusing side. Re-addressed from
      20-demands' `interacts(validate_investigation->Diagnostic.severity)`, which read the gate
      as an actor; it is the boundary the two INVLANG-WRITING verbs are gated by — `append_block`
      and `fix_row`, both over `decide_write` (J2, J3). "All three verbs" stood here for three
      phases and is corrected at the phase-E prose round: the close verb never reaches this
      boundary (J14) and is filed as #961. GATE LEAF: bind on
      `validate_investigation.access[decide_write]` added to discharge R3's per-cell parity
      obligation on that via — this test already drives `append_block` through `decide_write`,
      it just had not named the cell.
  - id: D3
    kind: behavior
    form: test
    discharged_by: test_non_validating_reader_sees_the_first_rows_values
    binds:
      - "interacts(parse_dense_companion->lead_bucket)"
      - "interacts(compaction_detect_loop->lead_bucket)"
    note: >
      O3. RE-ANCHORED. 20-demands bound `narration_crosscheck_from_run`; the brief refuted that
      site as an oracle — it reduces the companion to a SET of lead ids, so two fused rows
      produce the identical set under either rule. `compaction_detect_loop` takes `max(loop)`
      over `findings[].loop` with warnings dropped (brief F5) and is the one cleanly observable
      pure-Python difference. THE OTHER TEN READERS ARE NO LONGER UNBOUND, and this note said
      they were until the amendment round: R7 fired on each of them and every firing has since
      been answered — `review_projector` (D19), `compaction_fold_boundary` (D20),
      `judge_compare` (D21), `corpus_load_one` (D22) and `disposition_entry_price` (D33) by
      tests; `narration_crosscheck_from_run` (D36), `frontier_from_text` (D37) and
      `review_reply` (D38) by cited waivers on executed unobservability; `check_lead_refs` and
      `check_screen_structure` through D12's declaredness obligation. C11's point stands — O3's
      payoff is over the class — but the class is now covered or waived member by member.
  - id: D4
    kind: behavior
    form: test
    discharged_by: test_relisting_a_lead_with_fail_reason_keeps_its_projected_buckets
    binds:
      - "interacts(parse_dense_companion->lead_bucket)"
      - "interacts(parse_dense_companion->parse_warnings)"
    note: >
      O4, regression half one — the EXISTING characterization test at
      defender/tests/test_invlang_parser_characterization.py:433, re-executed at base for this
      assembly (C12): 1 passed. Pointer only; do not rewrite it.
    rejected:
      - nl: >
          Applying first-wins ACROSS blocks, as the issue body prescribes, would silently
          discard every amendment — the branch the design explicitly refuses.
  - id: D4b
    kind: behavior
    form: test
    discharged_by: test_relisting_a_lead_overwrites_a_conflicting_non_empty_cell
    binds:
      - "interacts(parse_dense_companion->lead_bucket)"
      - "lead_bucket.identity"
    note: >
      O4, regression half two — RAISED at extraction because D4's anchor does not pin last-wins
      (C12): its two rows differ only empty -> `timeout`, so a "merge but never overwrite a
      non-empty value" implementation ships green. The two blocks must differ on a NON-EMPTY
      shared column and the later block must win (C13). Phase E: assert on the bucket keys the
      projection actually writes — `lead["loop"]` is an `int`, `window` lands at
      `query_details["time_window"]` and `fail_reason` at `outcome["failure_reason"]` (J5).
  - id: D5
    kind: negative
    form: test
    discharged_by: test_a_block_without_a_repeated_id_gains_no_diagnostic
    binds:
      - "interacts(parse_dense_companion->parse_warnings)"
    note: >
      O5. Its required positive control on the same address under the complementary condition is
      D1 (same block shape, ids repeated); without that pairing this passes vacuously.

  # --- F-47, O6-O9 (20-demands D6-D9) ---------------------------------------
  - id: D6
    kind: shape
    form: test
    discharged_by: test_suggestion_splits_back_to_the_declared_column_count
    binds:
      - "interacts(check_attr_update_keys->fix)"
      - "interacts(check_attr_update_keys->attr_updates_block)"
      - "suggestion_row.access[validator_offer]"
      - "raw_row.domain.distinguished[escaped-pipe-right-of-key]"
      - "attr_update_keys.domain.distinguished[class]"
      - "attr_update_keys.domain.distinguished[attrs.<key>]"
    note: >
      O6. The assertion re-splits every candidate through the SAME splitter the parser uses
      (`_cells._split_cells`, `unescape_delim=True`), never `f.count("|")` — that reasoning is
      what produced the defect. Probed at base (C15, re-executed J-series): the escaped-pipe
      row's fixes split to 5 under a 4-column header. Per the doc's Oracle note this trigger is
      unattested (C18), so D6 does not stand alone — D7 carries the weight.
  - id: D7
    kind: behavior
    form: test
    discharged_by: test_withheld_suggestion_is_an_empty_fix_tuple_on_a_still_flagged_row
    binds:
      - "interacts(check_attr_update_keys->fix)"
      - "locus"
      - "interacts(render_diagnostic->fix)"
      - "interacts(render_diagnostic->model_context).payload"
      - "fix.domain.distinguished[()]"
    note: >
      O7, and the suite's load-bearing pin: D6's trigger is a path no writer has taken, D7's
      observable is what reality can produce. Same test function as D0b deliberately — the
      return contract and O7's observable are one assertion set. Three things assert together
      because withholding must not un-flag the row: `fix == ()`, `locus is not None` (else
      `_addressable` drops the whole diagnostic and the row is never flagged at all — F8), and
      `render_diagnostic` emits no `use:` line.
  - id: D8
    kind: behavior
    form: test
    discharged_by: test_suggestion_differs_from_the_authors_row_in_the_key_cell_only
    binds:
      - "interacts(check_attr_update_keys->fix)"
      - "locus"
      - "raw_row.domain.distinguished[inter-cell-padding]"
      - "raw_row.domain.distinguished[quoted-pipe-left-of-key-and-padding]"
      - "raw_row.domain.distinguished[escaped-pipe-left-of-key]"
      - "suggestion_row.access[validator_offer]"
    cites: [J6, J7, J16, C17]
    note: >
      AMENDED AGAIN AT THE PHASE-E REPAIR ROUND with a third row, `escaped-pipe-left-of-key`.
      65-reground surfaced a LIVE corruption while probing Q2 and routed it forward in writing;
      §7 recorded nothing, no demand bound it, no `holes` entry named it, no `drops` entry
      dropped it, and the domain had no member for it. J16 (executed) confirms: `_swap_cell`
      builds its candidates from `_row_dict`'s UNESCAPED cells and `"|".join`s them back, so
      `l-001|bastion\|01|owner|svc.config-mgmt` comes back as `l-001|bastion|01|class|…` at FIVE
      cells under a four-column header — the suggestion offered to the model is already wrong
      before any paste is attempted (the paste gate catches it today, so it is not exploitable,
      which is why it is a spec gap rather than a shipped exploit). It is NOT covered by the
      quoted-left row: J6 established that quoting SURVIVES the fold and the backslash does not
      (C16), so the quoted row discriminates misindexing and this one discriminates escape
      loss; D6 exercises the escape in the value cell, to the RIGHT. This is the one cell
      position where today's mechanism corrupts the author's bytes, and it was the one position
      the suite did not cover.
      O8, AMENDED at phase D. 20-demands' trigger was inter-cell padding alone (C17); J6 shows
      that trigger does not discriminate the mechanism the design actually needs — a naive
      `row.split("|")` rebuild satisfies it and still misindexes the key cell. The
      discriminating case COMBINES a quoted pipe standing to the LEFT of the key cell with
      padding: `l-001|"v-001|v-002"| bogus |hello`, whose naive split gives 5 tokens with
      `v-002"` at index 2. Both members are bound; the padding case stays because it is the
      attested-shaped half. Assert cell-by-cell against `locus.row_text` — which is the line
      already rstripped (J7), so trailing padding is not part of the contract.
  - id: D9
    kind: behavior
    form: test
    discharged_by: test_quoted_pipe_cells_round_trip_unchanged
    binds:
      - "interacts(check_attr_update_keys->fix)"
      - "interacts(parse_dense_companion->attr_updates_block)"
      - "raw_row.domain.distinguished[quoted-pipe-right-of-key]"
      - "raw_row.domain.distinguished[quoted-kv-pipe]"
    note: >
      O9, regression. Both forms the doc names, re-executed here: `"curl|bash"` and
      `cmd="curl|bash"` each still split to 4 and each still appears byte-identical in both
      candidates. The quoted form survives today only because `_row_dict` does not unquote
      (C16) — incidental, not a guard, which is why it is pinned rather than assumed.
  - id: D10
    kind: behavior
    form: test
    discharged_by: test_the_backslash_pipe_escape_is_still_accepted_by_the_splitter
    binds:
      - "interacts(parse_dense_companion->split_cells)"
    note: >
      RAISED at extraction from the design's normative sentence "The escape stays accepted.
      Removing it is a tokenizer change with a far wider blast radius than the defect
      justifies." That forbids the tokenizer-side fix and nothing else in O1-O9 does.
  - id: D12
    kind: coherence
    form: test
    discharged_by: test_the_surviving_lead_stays_declared_for_every_reader_that_names_it
    binds:
      - "lead_bucket.identity"
      - "interacts(check_lead_refs->lead_bucket)"
      - "interacts(check_screen_structure->lead_bucket)"
      - "interacts(disposition_entry_price->lead_bucket)"
      - "lead_header_record.domain.distinguished[screen-verdict-only-on-the-later-row]"
    cites: [N6]
    note: >
      EXTENDED AT THE PHASE-E REPAIR ROUND to the second declaredness reader. The obligation
      says "every reader that checks for it" and the first pass drove exactly one
      (`check_lead_refs`), which the blind reader flagged: an obligation quantified over a class
      and discharged at one member. N6 (census) closes the quantifier instead of hoping — the
      string `undeclared lead` is emitted at one site (validate.py:142) and exactly one other
      production reader asks whether an id is a declared lead at all
      (`_check_false_positive_gating`, validate.py:2429, reached through
      `disposition_entry_price`); the third site that touches lead-id membership reduces the
      companion to a SET of ids (`_lead_ids_from_companion`, C9) and is D36's waived seam. Both
      in-process readers are now driven, each with the complementary condition that proves the
      channel can say "undeclared".
      THE OBLIGATION IS WORDED AT THE WIDTH IT IS DRIVEN, restated at the phase-E prose round
      because a cold reader met "every reader" in the test's NAME and counted two in its body.
      What this demand owes is: BOTH in-process readers that DECIDE a lead id's declaredness —
      a closed two-member class N6 enumerated, not an open quantifier over readers in general.
      The one excluded site is excluded deliberately and is recorded, not forgotten: it cannot
      observe the property at all (it reduces to a set of ids), and its exclusion is a cited
      waiver with its own demand id (D36), not a silence.
      RAISED at extraction from the design's "Why warn-and-project rather than reject the block"
      section, which argues the case at length and mints no obligation. It discriminates: an
      implementation that DROPS both colliding rows passes D1, D2 and D5 while making every
      later block naming that lead report "undeclared lead". NARROWED at phase D per F-K: the
      assertion is "no UNDECLARED-LEAD error is raised against the surviving lead", NOT
      "the repeated-id diagnostic is the only finding" — on a document that also trips the
      screen-structure gate the broader assertion is false while the implementation is correct.
      Re-addressed from `interacts(diagnose->lead_bucket)` to the reader that actually decides
      declaredness (`_check_lead_refs`, validate.py:120-124).

  # --- Minted at the GATE LEAF (phase D, step 6) to discharge R3/R4/R7 obligations. Kind and
  # binds are the rule's obligation; witness prose seeded the test's docstring at phase E. These
  # were the "minted list" §7 reviewed alongside the forks in `handoff.forks` — §7 has since run
  # (three times) and reviewed it; none of them decides a fork, each pins a fact this leaf's
  # ledger (J1-J13) already established. Tense corrected at the amendment round. -----------------
  - id: D13
    kind: parity
    form: test
