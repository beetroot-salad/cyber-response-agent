  - id: materialize
    provenance: design
    facets:
      payload:
        parts:
        - {role: arg, source: 'arg:alert'}
        - {role: arg, source: 'arg:run_id'}
        - {role: kwarg, source: 'request:tenant_id'}
        - {role: kwarg, source: 'arg:model'}
        - {role: kwarg, source: 'arg:world'}
        invariants: []
        nl: >-
