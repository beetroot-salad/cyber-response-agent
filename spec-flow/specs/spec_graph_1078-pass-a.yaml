- id: C-R4
  kind: behavior
  claim: >-
    Assumption (the first §7 sketch): os.link(tmp, final)'s own refusal can tell a planted alias from
    an ordinary occupied name, so a link-based create lane could drop the _refuse_unless_plain precheck.
  probe: >-
    link_probe.py s1-s5 — os.link(tmp, final) where final is a planted symlink (dangling and non-dangling),
    a directory, an existing plain file, and an existing hard-link alias
  probe_kind: executed
  observed: >-
    all five scenarios RAISE FileExistsError (errno 17/EEXIST), identically, regardless of what occupies
    `final`'s name. os.link never dereferences or overwrites an existing destination of ANY type — the
    refusal is atomic and unconditional. But the errno gives NO way to tell a planted alias from an ordinary
    lost create-race (a plain file another writer just created): today's lane gets that distinction from
    _refuse_unless_plain's lstat precheck + _mark_alias, which a link-based lane would still need, unchanged,
    ahead of the os.link call — os.link itself buys no reduction in that precheck's necessity.
  verdict: refuted
  verdict_note: >-
    os.link refuses uniformly and atomically on an occupied name (a real safety property), but does not
    replace the existing alias-vs-race-loser precheck
  source: >-
    72-resolution-probes.md (§7 probe leaf; `claim:` sentence and vocab verdict written at the fold from
    the recorded observation)
  note: >-
    DO NOT RETRY: this is the refuted part of the hard-link create mechanism. The mechanism that meets
    the complete-or-absent observable is C-R22..C-R24 (O_TMPFILE + fchmod + os.link with dst_dir_fd),
    with _refuse_unless_plain kept as the precheck (C-R23).
