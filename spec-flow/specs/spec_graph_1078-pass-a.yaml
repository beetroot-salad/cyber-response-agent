#
#   AXES (declared once): tenant_id (<root>/<T>), run_id (<base>/<run_id>), case_id
#        (<sessions>/<case>.db), episode_id (<episodes root>/<source>-n<msg>, casefolded).
#
#   TOKENS for distinguished members that are not safe address text: `empty` = '',
#   `trailing-newline` = 'acme\n', `63-chars`/`64-chars` = grammar ids of that length; the
#   DEFENDER_DATA_ROOT and DEFENDER_EPISODES_BASE members name path CLASSES (see each note).
