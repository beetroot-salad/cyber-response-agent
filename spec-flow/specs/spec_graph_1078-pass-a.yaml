# READ THIS FIRST — what this graph is, and what it deliberately does NOT decide
#
# scope     — PASS (A) ONLY, per the doc's own Order section ("three write-tests passes; a guard
#             is deleted only in the pass that makes the deletion safe") and the spine's
#             decomposition record (resolves extraction fork F1). Pass (B) (episodes under the
#             tenant) and pass (C) (learning under the tenant) demands are CARRIED, not dropped
#             and not waived: `form: clause`, `pass: B|C|B,C`, their ledger kind and binds
#             verbatim, `deferred_test:` naming the test the later chain mints. A clause leaves
#             every obligation it binds OPEN — which is exactly "deferred" — where a `form: test`
#             pointer to a test this chain never writes would dangle at check_binds and silently
#             answer the gate's triggers. Elements/edges tagged `pass: B|C` exist only so those
#             clauses resolve; gate firings on them are the later chains' residue.
#
# demands   — 207: the 151 of `20-demands.md` (ids verbatim; 87 pass A in their ledger form, 64
#             pass B/C as deferred clauses), then 56 `sNNN` minted one per SETTLED premise of
#             `45-dispositions.md` (NNN = the premise's index in 40-premise-file.py), each
#             `discharged_by` the premise's OWN test name so phase F's premise-disposition walk
#             joins by name, with the settled assertion verbatim as `seed_docstring`.
#             Demand #0 (`d0_return_contract`) is RESOLVED at §7 (F0 = J29, reading (a) + verbatim
#             message pass-through); `provisional` is cleared.
#             The 61 forks + 2 silent branches of 45-dispositions are RESOLVED at §7 (70-resolutions.md)
#             and each `handoff.forks` entry carries its reading and resolved_by; formerly carried open (J01..J63, with the graph slot each owns),
#             beside the demand-ledger forks F0, F2..F8 (open) and F1 (resolved: pass A).
#
# structure — the demand-implied address space (`provenance: design`) attached to the grounded
#             neighbourhood (`provenance: code`) the brief established: shared roots S1-S7, the
#             co-writers and readers no demand asked for (`_family_base_world_id`,
#             `refuse_distant_source`, `run_investigation`, `visualize_*`, `lint_run_records`'
#             DEFAULT_TENANT_ID exemption), and the removals as `mode: remove` edges
#             (resolve_runs_base, ensure_tenant, DEFAULT_TENANT_ID, the launcher's
#             DEFENDER_RUNS_BASE export, generate_case's env default).
#
# claims    — 128: the doc's 80 inherited (ids verbatim, `source: discuss`, full text from
#             intent-design.md's `claims:` block; the brief's re-verification folded in under
#             `regrounded:`), the brief's G1-G26, the extraction leaf's C85-C98, and the
#             re-ground leaf's C-P1..C-P8 (47-probes.md; typed here from the probe record).
#
# gate      — written by the gate leaf (60-residue.md); its holes carry their §7 resolutions.
#
