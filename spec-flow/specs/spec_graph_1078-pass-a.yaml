  boundaries:
  - id: tenant_id
    provenance: design
    facets:
      domain:
        type: str
        refinement:
          nl: >-
            A tenant id matches ^[a-z][a-z0-9-]{0,62}$ under re.fullmatch, checked at setup, at the request
            and on every record read. There is NO default (O1): `default: null` below is the design's
            stated absence, not an unfilled slot.
        default: null
        distinguished: [default, playground, defender, a, 63-chars, 64-chars, ../x, A, a/b, empty, 1abc,
          trailing-newline]
        falsy_valid: false
        documented_alternatives: []
      access:
        constraints_by_via:
          argv:
            trust: operator
            constraints: [fullmatch-grammar, require-row]
          setup-argv:
            trust: operator
            constraints: [fullmatch-grammar, empty-data-root]
          record:
            trust: derived
            constraints: [fullmatch-grammar, tenant-location, require-row, never-minted]
          row:
            trust: derived
            constraints: [fullmatch-grammar, row-shape]
          api:
            trust: derived
            constraints: [fullmatch-grammar, outside-defender-dir]
          stamp:
            trust: attacker-influenced
            constraints: [never-read]
          held_out-argv:
            trust: operator
            constraints: [fullmatch-grammar, require-row]
          generate_case-argv:
            trust: operator
            constraints: [fullmatch-grammar, require-row]
    note: >-
      Token members: `63-chars`/`64-chars` are ids of that length drawn from the grammar; `empty` is '';
      `trailing-newline` is 'acme\n' (which re.match with a '$' anchor accepts); `default` is the #1077
      bootstrap value (fork J28: not reserved). Cells: `argv` = run.py --tenant; `setup-argv` = tenant.py
      setup <id>; `record` = the runs-base record tenant_of_run_dir reads (host-only witness, C38); `row`
      = the tenant row require_tenant reads; `api` = the TenantPaths constructor's argument; `stamp` =
      provenance.json's tenant_id, box-writable (C7), the REJECTED source; `held_out-argv` / `generate_case-argv`
      = D4's two --tenant entries, whose refusal point is fork J32 — `unknown` on purpose. The pass-(C)
      selector tools' --tenant is the (C) chain's cell. §7: J32 (auto) decided the held_out-argv and generate_case-argv
      cells — refuse at entry, grammar then row (J49) — so they are no longer `unknown`.
  - id: DEFENDER_DATA_ROOT
    provenance: design
    facets:
      domain:
        type: path
        refinement:
          nl: >-
            A required absolute path: unset or empty is refused naming the variable (J01, NO DEFAULT DATA
            ROOT), a relative value is refused (C57), and the value is returned .resolve()d. The learning-state
            refusal (O13) runs here (J24). `default: null` is the design's stated absence.
        default: null
        distinguished: [unset, relative, symlink, empty, regular-file, missing-parent]
        falsy_valid: false
        documented_alternatives:
        - value: /workspace/.defender-data
          crosses_validation: true
    note: >-
      §7: NO DEFAULT DATA ROOT (J01, human) — `default` is null and `unset`/`empty` are refused (falsy_valid:
      false now decided). `missing-parent` is accepted and created whole (J07, auto). The documented value
      /workspace/.defender-data is the devcontainer's compose setting (D8), now the only value an operator
      is told to set.
  - id: data_root
    provenance: design
    facets:
      identity:
        key_axes: [tenant_id]
        evidence:
          nl: >-
            One folder per tenant, <data root>/<tenant id>/, read off D1 (create_tenant creates <root>/<id>/;
            TenantPaths.dir == root/T) and the data model. O10 keeps the root single-entry in this step.
        derivations: []
        sharing: unique-key
    note: >-
      The profile resource `tenant_root` (declared by the brief in the worktree's UNCOMMITTED .claude/spec-flow.json)
      is this boundary plus tenant_dir and tenant_row; the graph uses the code's name, `data_root`, which
      create_tenant/require_tenant/TenantPaths thread as their first parameter.
  - id: tenant_dir
    provenance: design
    facets: {}
    note: >-
      <data root>/<T>/ (TenantPaths.dir). Its children are fixed layout names (tenant.json, runs/, sessions/,
      episodes/, learning/), so it carries no identity of its own.
  - id: tenant_row
    provenance: design
    facets:
      identity:
        key_axes: [tenant_id]
        evidence:
          nl: >-
            One row file per tenant at <root>/<T>/tenant.json (D1, data model); the create is exclusive
            (write_guarded mode='create').
        derivations: []
        sharing: unique-key
      payload:
        parts:
        - {role: field, source: 'arg:tenant_id'}
        - {role: field, source: 'clock:created_at'}
        invariants: []
        nl: >-
          The row is a JSON object {tenant_id, created_at}; tenant_id equals the folder's name (fork F5).
    note: >-
      New run-records kind `tenant_row` in docs/run-records-kinds.tsv (D1); a TSV row adds 'tenant.json'
      to the lint's literal ban set (G12). §7 J16 + J08: its create is complete-or-absent, and a rowless
      own folder is 'setup unfinished'.
  - id: runs_base
    provenance: code
    facets:
      identity:
        key_axes: [run_id]
        evidence:
          nl: >-
            One <run_id>/ directory per run under the base (run_common.materialize_run_dir, RunPaths),
            beside the fixed-name record _tenant.json and <run_id>.run-end.json sidecars (brief S2). After
            pass A the base is <root>/<T>/runs for a fresh run and EpisodePaths(ep).runs for a sibling
            (D2 step 2).
        derivations: []
        sharing: unique-key
    where: profile resource runs_base
    note: >-
      Location MODIFIED by D2 ($DEFENDER_RUNS_BASE -> runs_base_for(T)); its reader edges are the delta.
  - id: runs_base_record
    provenance: code
    facets:
      identity:
        key_axes: []
        evidence:
          nl: >-
            One record per runs base at the fixed name _tenant.json (TENANT_RECORD_NAME, _tenant.py);
            the create is exclusive and a loser re-reads the winner (C93). Its key is the runs base's
            own location, so no axis varies within one base.
        derivations: []
        sharing: unique-key
      payload:
        parts:
        - {role: field, source: 'request:tenant_id'}
        - {role: field, source: 'mint:base_world_id'}
        - {role: field, source: 'clock:created_at'}
        invariants: []
        nl: >-
          #1077's record {tenant_id, base_world_id, created_at}, UNCHANGED in shape; its tenant_id is
          now minted from the request, not DEFAULT_TENANT_ID (R8 candidate: the value's derivation changed
          while every reader keys on it).
    where: defender/_tenant.py; run-records kind `tenant`
    note: '§7 J16/J63: its create is COMPLETE-OR-ABSENT (s7_j16_create_lane_complete_or_absent).'
  - id: provenance
    provenance: code
    facets: {}
    where: <run_dir>/provenance.json (the stamp)
    note: >-
      Box-writable (C7): the forged-stamp demand pins that no tenant is ever read from it (tenant_id.access[stamp]).
  - id: session_store
    provenance: code
    facets:
      identity:
        key_axes: [case_id]
        evidence:
          nl: >-
            SessionPaths(runs_base).sessions_dir/<case>.db (C11); a fork writes its rows into its SOURCE's
            store (C67), so under pass A a fork of a <T>/runs run writes <T>/sessions.
        derivations: []
        sharing: serialized-append
    where: profile resource session_store
  - id: episode_dir
    provenance: code
    facets:
      identity:
        key_axes: [episode_id]
        evidence:
          nl: >-
            $DEFENDER_EPISODES_BASE/<episode_id>/ with episode_id = f'{source}-n{msg}'.casefold() (brief
            S4, cli.py:202-212); (B) moves it to <T>/episodes/<episode_id>/.
        derivations: []
        sharing: unique-key
    where: profile resource episode_dir
  - id: DEFENDER_EPISODES_BASE
    provenance: code
    facets:
      domain:
        type: path
        refinement:
          nl: >-
            The configured episodes root; no default (unset is LauncherRefused, C33). In (A) episodes_root
            re-keys the inside-runs refusal onto TenantPaths(root, T).runs and adds the data-root overlap
            refusal (D4); (B) deletes both.
        default: null
        distinguished: [inside-tenant-runs, equal-data-root, containing-data-root, inside-data-root-other,
          tenant-episodes, tenant-episodes-sub, outside-data-root, old-runs-base-episodes, symlink-into-data-root]
        falsy_valid: false
        documented_alternatives: []
    note: >-
      Members are pass A's re-keyed check (D4 row 3): `tenant-episodes` is D4's explicit carve-out (fork
      J44 would refuse it), `tenant-episodes-sub` is J45, `old-runs-base-episodes` is settled s059, `symlink-into-data-root`
      settled s060. `default: null`: the knob has no default (C33). §7: J44 (human) REFUSES `tenant-episodes`
      in pass (A), and J45 dissolves with it (`tenant-episodes-sub` refused too).
  - id: DEFENDER_RUNS_BASE
    provenance: code
    facets: {}
    note: >-
      Retired as an operator knob (D2): its only surviving role is D5's derived export run_dir.parent,
      read in the box by defender-invlang (N9).
  - id: DEFENDER_LEARNING_STATE_DIR
    provenance: code
    facets: {}
    note: Unchanged in pass A; read only by setup's adoption after (C).
  - id: DEFAULT_TENANT_ID
