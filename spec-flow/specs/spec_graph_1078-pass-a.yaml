# NAME RECONCILIATION — grounding (10-brief), extraction (20-demands) and the dispositions
# (45) coined ids independently; these are the joins, keyed by role+origin.
#
#   brief S1 "data root / tenant folder" / profile `tenant_root` (worktree-only, uncommitted)
#        / demands `data_root`, `tenant_dir`, `tenant_row`  -> data_root (the root; the code
#        threads `data_root=`), tenant_dir (<root>/<T>/, TenantPaths.dir), tenant_row
