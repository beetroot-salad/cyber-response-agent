- id: d0_return_contract
  kind: behavior
  form: test
  pass: A
  binds: [require_tenant, tenant_of_run_dir, create_tenant, TenantPaths, run.main, branch.cli.main, tenant.setup]
  discharged_by: test_d0_return_contract
  seed_docstring: >-
    require_tenant returns a TenantRow whose tenant_id equals the requested id and whose created_at is
    the row's; tenant_of_run_dir returns the tenant id as a str; create_tenant returns the TenantRow it
    wrote; TenantPaths accessors return absolute Paths under .dir. The owner functions (TenantPaths, create_tenant,
    require_tenant, tenant_of_run_dir, ensure_runs_base_record, resolve_data_root, refuse_bad_tenant_id)
    refuse by raising one ValueError subclass whose message names the refused value; run.py main surfaces
    a tenant refusal as SystemExit carrying a '[run.py] ...' message before the preflight, exactly as
    _resume_target does today; the branch launcher surfaces it as LauncherRefused; tenant.py setup returns
    0 when every kind of its pass adopted, was already in place, or had nothing to adopt, and 1 when any
    kind was refused or a racing entry was re-listed; a selector tool given no --tenant exits non-zero
    before touching any state. Every entry passes the owner's refusal message through verbatim, never
    rephrased.
  source: 20-demands.md (demand ledger)
  note: >-
    RESOLVED at §7 (F0 = J29, resolved_by: human): F0's provisional reading is final, plus one rule —
    entries pass the owner's message through verbatim. J11 (unwritable root) and settled s004/s120/s121's
    message naming take this shape.
