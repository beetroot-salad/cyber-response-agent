#        with its knob DEFENDER_EPISODES_BASE and resolver actors episodes_root/episode_dir_for
#   brief S5 "learning state root" / demands `learning_state_root`     -> learning_state_root
#        (profile `learning_queue` / `pending_dir` / `learning_run_dir` are its (C) members)
#   brief S6 "process env / box env knobs" / profile `box_env`       -> box_env + the three
