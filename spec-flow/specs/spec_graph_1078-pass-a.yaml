- id: C1
  kind: referential
  claim: >-
    run_common.resolve_runs_base() reads $DEFENDER_RUNS_BASE (default /tmp/defender-runs) and refuses
    a base equal to learning_state_root(), for the budget pool's sake
  probe: read run_common.py:30-45 at ed5386bc
  probe_kind: read
  observed: >-
    as stated; exact equality only; the message names the runtime budget pool spent by unenforced learning
    agents
  verdict: holds
  source: discuss
  regrounded:
    status: re-verified
    probe: read run_common.py:30-45
    observed: equality-only refusal against learning_state_root(), budget-pool message :39-44
- id: C2a
  kind: census
  claim: >-
    D4 (plus materialize, D5's exporters, generate_case) lists every production code reader of resolve_runs_base
    / DEFENDER_RUNS_BASE
  probe: >-
    pyrefly-refs run_common.py:33 resolve_runs_base; grep DEFENDER_RUNS_BASE over defender/**/*.py and
    bin/, no tests (files unchanged by #1109/#1097)
  probe_kind: search
  observed: >-
    16 refs/6 files (grep floor 11): run_common:104, held_out:205, branch/cli:156,237,1605, branch/review:193,
    judge/family:798; env readers generate_case:332, bin/defender-invlang:17; writers run_common:268,
    box/_docker:145, branch/cli:709; allowlist box_codec:33
  verdict: holds
  source: discuss
  regrounded:
    status: re-verified
    probe: spec-graph trace resource runs_base (753 lines; 152 non-test floor lines read)
    observed: >-
      resolved: writer run.py:478; readers held_out:205, branch/cli:156,237,1605, review:193, judge/family:798
