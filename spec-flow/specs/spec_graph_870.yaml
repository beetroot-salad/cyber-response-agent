# =====================================================================================

structure:

  # THE AXIS REGISTRY. Every `key_axes` / `interpolates` member below is one of these, or a
  # `derivations` value derived from one; a member outside this list is an R0 finding.
  # `stderr_digest` is DELIBERATELY NOT AN AXIS: it is `stderr.strip()[:160]`, a NON-INJECTIVE
  # derivation of `stderr_text`, and registering it as an axis of its own would have hidden
  # exactly the over-merge FK-13 is about.
  axes: [tree_root, system, pitfall_id, stderr_text, run_id, lead_id, query_index]

  actors:

    # --- the delta's own frames ------------------------------------------------------
    - {id: collect_general_failures,  frame: leg, provenance: design}   # learning/leads/lead_extraction.py — M5' adds ONE branch, before the systemless guard at :111
    - {id: run_pitfalls,              frame: leg, provenance: design}   # learning/leads/pitfalls_curator.py:202 — the tick; M6/M8/M9 all land inside it
    - {id: _build_pitfalls_handoffs,  frame: leg, provenance: design}   # pitfalls_curator.py:42 — the handoff builder, #0's producer
    - {id: _split_batch_by_membership, frame: leg, provenance: design}  # pitfalls_curator.py:167 — M8; its INPUT changes (F3), its return type does not
    - {id: _graveyard_dropped_rows,   frame: leg, provenance: design}   # pitfalls_curator.py:178 — M9's classifier
    - {id: rotate_pitfalls,           frame: leg, provenance: design}   # learning/core/persist.py:410 — stamps the consumed category F4 renames

    # --- merged code this round drives but does not change ---------------------------
    - {id: merge_pitfalls,            frame: leg, provenance: code}     # persist.py:360 — the #840 collapse; M5' changes its INPUT, never it
    - {id: _has_lead_author_work,     frame: leg, provenance: code}     # drains.py:135 — the WAKE gate, the second reader of the same count (FK-3)
    - {id: _executed_query,           frame: leg, provenance: code}     # draft_synthesis.py:45 — renders `verb: bash` / params.command (C12/G17); the doc's `:43-50` cite has drifted
    - {id: declared_systems,          frame: leg, provenance: code}     # learning/leads/declared_systems.py — #869's resolver, merged (N8)
    - {id: curator_agent,             frame: leg, provenance: code}     # the spawned pitfalls curator (AgentRole.LEAD_AUTHOR); writes via the file tools and holds a bash `rm` grant
    - {id: commit_corpus,             frame: leg, provenance: code}     # learning/author/shared.py — `git add -- defender/skills`, the whole pathspec
    - {id: drain_retire,              frame: leg, provenance: code}     # learning/author/drain.py:137 — the SECOND graveyard writer, with an incompatible reason shape (FK-11)
    - {id: lead_author_run,           frame: leg, provenance: code}     # lead_author.py — the sibling lane; its rule REFUSES the reducer surface (C16/G20)
    - {id: query_tool,                frame: leg, provenance: code}     # runtime/query_tool.py — resolve_query_id's caller and the table's other writer
    - {id: _record_shim_failure,      frame: leg, provenance: code}     # runtime/tools.py:269 — the ONLY writer of a ∅.bash-shim row, under four conjunctive preconditions (G7)
    - {id: lead_repository,           frame: leg, provenance: code}     # learning/lead_repository.py::joined -> lead_extraction.extract_from_joined — the LEARNING-side reader of the table
    - {id: gather_subagent,           frame: leg, provenance: code}     # reads the corpus before every reduce (corpus_dirs=('lessons','skills','examples'), G23) — O3's read leg

    # --- the composition frames ------------------------------------------------------
    - {id: lead_author_drain,         frame: composition, provenance: code}   # drains.py:298 _drain_lead_author -> :280 _drain_pitfalls -> :260 _invoke_pitfalls -> DYNAMIC IMPORT (G18/FF-8)
    - {id: run_investigation,         frame: composition, provenance: code}   # runtime/driver.py — the runtime half of the cross-process seam (FF-7)

  boundaries:

    # =================================================================================
    # THE NEW SURFACE — the whole point of the round
    # =================================================================================

    - id: reducer_surface
      provenance: design
      facets:
        identity:
          key_axes: [tree_root]
          evidence: {nl: "ONE literal path — `defender/skills/gather/defender-sql.md` — with no
            per-system component at all, which is N7's decision made into a path template. Read off
            M6's own text and off the reader instruction it exists to serve
            (`skills/gather/SKILL.md:141`, 'Read {defender_dir}/skills/gather/defender-sql.md
            before you write the SQL'). `tree_root` is the ONLY key axis because the drain worktree
            and the process checkout are different objects for the same relative path
            (`paths.with_repo_root(wt)`), which is #869's finding carried forward. Writers today:
            NONE (G10, searched) — this round mints the first."}
          sharing: serialized-append
          # `serialized-append`, not `unique-key`: every tick writes the SAME path, accumulating
          # bullets under `## Common pitfalls`. The serialization is the tick, not a lock — the
          # pitfalls channel has `drain_lock: None` by design (brief R1), and
          # `two_curation_ticks_run_against_one_corpus_tree` is an UNRESOLVED silent branch (FK-10).
        payload:
          parts:
            - {role: surface, source: "const:reducer"}
            - {role: path,    source: "const:defender/skills/gather/defender-sql.md"}
            - {role: failures, source: "const:the merged per-mistake records, most-repeated first"}
          invariants: [all-slots-bound]
          nl: >-
            The reducer handoff entry — the one addressed at this surface. THREE PARTS, AND THE
            ABSENCE OF A FOURTH IS THE CONTRACT: there is no `system` part, which is what N7
            declines and `reducer_handoff_carries_no_system` asserts. Whether the key is OMITTED or
            carries `""` is fork F1 and is not settled here; `run_pitfalls:225`'s bare subscript
            `kept = {h["system"] for h in handoffs}` (FF-3/G15) KeyErrors on the omitted reading,
            so the two mechanisms are coupled to that line either way.
        access:
          constraints_by_via:
            write-tool:
              trust: attacker-influenced
              constraints: [confine]
              # G13, EXECUTED: `build_write_allow(defender/skills, suffix='.md')` compiles to
              # `<resolved skills dir>/[^\x00]*\.md` and MATCHES this path. The confinement is to
              # `.md` under the tree — no depth or segment narrowing, so this cell is NOT a gate
              # on the reducer surface and `_pitfalls_path_rule` is the SOLE one.
            bash:
              trust: attacker-influenced
              constraints: [confine]
              # `_rm_skills_grant` — `rm defender/skills/<seg>+`, `pins_path=True`. It MATCHES
              # `rm defender/skills/gather/defender-sql.md`. This cell is live and in-process and
              # is entirely independent of `_pitfalls_path_rule`; the deletion happens on disk in
              # the drain worktree and is caught at the commit gate ONLY IF M7's allowance falls
              # through to the delete branch. FK-1(c).
            commit-gate:
              trust: operator
              constraints: [denylist, confine]
              # `_verify_corpus_scope` (whose `_in_corpus` admits every `.md` under
              # defender/skills at ANY depth) -> `_pitfalls_path_rule` -> `commit_corpus`'s
              # `defender/skills` pathspec. ONE route in (C16/G8: 9 refs / 5 files, four of them
              # tests). This round adds a BRANCH inside that route, not a second route.
            read-tool:
              trust: attacker-influenced
              constraints: [confine]
              # The gather subagent's corpus read (`corpus_dirs=('lessons','skills','examples')`,
              # G23) — confined to the corpus dirs and otherwise unfiltered. This is the cell that
              # makes O3 reachable AND makes FK-4 real: a bullet on a system's execution.md is read
              # when working that system; a bullet here is read before EVERY system's reduce.
      note: >-
        THE ONE CORPUS TARGET WITH NO AUDIT BEHIND IT. C13/G11 (refuted) removes the #632
        correspondence audit; FF-12 records that no scaffold rule or lint covers the file
        (`_scaffold_rules` is scoped to `skills/{system}/SKILL.md`) and that it carries YAML
        frontmatter plus three `##` sections and NO `## Common pitfalls` section today; and this
        lane has no content rule where the sibling lane has `_skills_content_rule`. FK-2 is the
        decision.

    # =================================================================================
    # THE PITFALLS CHANNEL — three files, three roles (#869's `learning_queue`, split)
    # =================================================================================

    - id: pitfalls_queue
      provenance: design
      facets:
        identity:
          key_axes: [pitfall_id]
          evidence: {nl: "`<state>/_pending_pitfalls/pitfalls.jsonl`; `id_key: pitfall_id`, row id
            template `{run_dir.name}:{lead_id}:{query_index}` (lead_extraction.py:120). Read off
            `config.LoopPaths.pitfalls` and confirmed by the brief's R1 census (G9,
            `spec-graph trace resource learning_queue` plus resolved pyrefly-refs over
            append/read/rotate/merge_pitfalls). `drain_lock: None` — no drain-role lock; the lane
            runs inside the lead-author tick."}
          sharing: serialized-append
        payload:
          parts:
            - {role: system,         source: "const:the row's system field — NORMALIZED TO \"\" for a sentinel row (M5')"}
            - {role: query_id,       source: "const:the recorded query_id, ∅.bash-shim for a reducer row"}
            - {role: stderr_digest,  source: "template:{stderr_text}"}
            - {role: occurrences,    source: "const:the merged repeat count"}
          invariants: [all-slots-bound]
          nl: >-
            The queued pitfall row. M5' changes exactly one field's VALUE — `system` becomes `""`
            for a sentinel row — and that one change moves the merge key, the record count, and
            therefore both threshold gates (C17/G21). The five failure keys the handoff carries
            downstream (query_id, goal, executed_query, stderr_digest, occurrences) are unchanged.

    - id: consumed_ledger
      provenance: design
      facets:
        identity:
          key_axes: [pitfall_id]
          evidence: {nl: "`pitfalls.consumed.jsonl`, written by the same locked rewrite that
            removes the row from the queue (`_rewrite_queue`, the single wholesale queue rewriter,
            #719 D9, reached only through `rotate_queue_locked`). Same row id as the queue."}
          sharing: serialized-append
        payload:
          parts:
            - {role: consumed_category, source: "const:consumed_committed | consumed_unattributable"}
            - {role: consumed_commit,   source: "template:{commit_sha}"}
          invariants: []
          nl: >-
            The rotated row. `persist.py:106` attaches `consumed_commit` only when the category is
            `consumed_committed` AND the sha is truthy — so the category is what licenses the
            provenance, and a row stamped committed while nothing about it was committed carries a
            sha it has no relationship to. F4 renames the other category.

    - id: graveyard
      provenance: design
      facets:
        identity:
          key_axes: [pitfall_id]
          evidence: {nl: "`pitfalls.deadletter.jsonl`. Its own docstring says nothing in production
            reads it back (G22, searched: frontend grep = 0 hits; the only non-test references are
            the three writers). Append-only and UNBOUNDED — FF-5."}
          sharing: serialized-append
        domain:
          type: str
          refinement: {nl: "`deadletter_reason` — the class a row's uncurated exit is filed under.
            TODAY IT IS ONE STRING for all three classes: G5/C9 reproduced a 5-row tick in which
            the systemless row, the undeclared-name row and the malformed '../evil' row all carry
            'system not in the declared adapter set', which names no system to be undeclared and is
            simply false of two of the three."}
          default: "system not in the declared adapter set"
          distinguished: [no-system, malformed-system, undeclared-system, batch-error]
          falsy_valid: false
          documented_alternatives: []
      note: >-
        `batch-error` IS A REAL MEMBER TODAY AND NOTHING BOUND IT UNTIL FK-11 (resolved, auto):
        `batch_error_retirement_names_its_class` now does, and pins the vocabulary CLOSED at four. Two
        writers append to this one file with two incompatible reason shapes: M9's closed
        three-class vocabulary from `_graveyard_dropped_rows`, and `drain.retire`'s
        `deadletter_reason: str(e)` — a raw free-text exception message — from the attempts-ceiling
        path. That ceiling shape is the one a REDUCER row most plausibly gets, because its system
        is neither missing nor malformed nor undeclared: it is `""` by design after M5'. A human
        triaging one file sees three named classes and a traceback string. §7 TOOK the fourth
        reason `batch-error:<exception-class-name>`, applied where `_retire_pitfalls_batch` calls
        `drain.retire`. Declining would have been defensible but would then have had to be SAID,
        because the doc's text reads as if three classes are exhaustive.

    - id: pitfall_key
      provenance: design
      facets:
        identity:
          key_axes: [system, stderr_text]
          evidence: {nl: "`persist.pitfall_key(row) -> (system, stderr_digest)` (persist.py:323),
            the identity `merge_pitfalls` folds on. `system` is in the delta: M5' normalizes it to
            `\"\"` for every sentinel row, which is what collapses N attributed records into one
            (C8/G4, executed: 3 records -> 1 record, occurrences=3). PO-R2 (executed) establishes
            the OTHER branch: a content-less digest — absent, empty, whitespace-only, zero-width,
            or nothing but the `exit=N; ` envelope — keys to `(system, \"\\x00\"+pitfall_id)`,
            which is a SENTINEL MEANING 'no digest' and never merges with anything."}
          derivations:
            - {value: stderr_digest,        fn_of: stderr_text, injective: false}
            - {value: empty_digest_sentinel, fn_of: pitfall_id, injective: true}
          sharing: unique-key
      note: >-
        THE NON-INJECTIVE DERIVATION IS FK-13, STATED FORMALLY. `stderr_digest` is
        `stderr.strip()[:160]`, so two genuinely different diagnoses sharing a 160-character
        prefix — plausible for verbose engine errors with a long common preamble — merge into ONE
        record with the second cause's occurrences folded silently into the first's count. Before
        M5' that collision was bounded WITHIN a system; normalizing pools every reducer mistake
        into one namespace, so the same collision now merges across all of them. The doc frames F2
        as purely fixing over-SPLITTING and never prices the amplification. PO-R2 bounds the
        question from below (empty digests cannot cause it); the non-empty case is §7's.
        `injective: true` on the second derivation is what PO-R2 proved: each content-less row
        keys to itself, forever `occurrences: 1`.

    - id: consumed_category
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the durable label a rotated pitfalls row carries. The existing
            vocabulary is consumed_committed | consumed_idempotent | consumed_skip |
            consumed_retired | consumed_undeclared; after M9 the pitfalls lane emits exactly two of
            them."}
          default: consumed_committed
          distinguished: [consumed_committed, consumed_unattributable]
          falsy_valid: false
          documented_alternatives:
            - {value: consumed_undeclared, crosses_validation: true}
              # The PRE-RENAME literal, and the revert F4 keeps on the table. `crosses_validation:
              # true` is grounded on C19 (searched): nine writers stamp the field, one stripper
              # (`author/shared.without_consumed_category`), and EXACTLY ONE comparison —
              # persist.py:106, `== 'consumed_committed'`, which decides whether to attach
              # consumed_commit. Nothing branches on the outgoing literal, so the shipped default
              # survives either spelling and the rename needs no read-compat shim. What C19 does
              # NOT settle is whether to TAKE it — the doc conditioned the rename on no deployment
              # having emitted such rows and asked for the condition to be checked, not assumed.

    # =================================================================================
    # THE GATE, THE RULE AND THE STATUS SHAPES
    # =================================================================================

    - id: _pitfalls_path_rule
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the corpus path form the pitfalls commit gate rules on, one branch per
            form. BRANCH ORDER IS THE CONTRACT AND IT IS WHAT THIS ROUND CHANGES (C14/G14,
            executed): today (1) `not _is_system_execution_md(path)` raises, (2)
            `Path(path).parent.name not in systems` raises, (3) `'D' in xy` raises — so the
            deletion refusal is LAST and is unreachable for any path the first two branches
            already refused. #869 modelled this rule facetless because its whole contract was
            'execution.md only'; M7 adds a branch, so it now has a domain of its own."}
          default: refuse-everything-that-is-not-a-declared-systems-execution-md
          distinguished: [reducer-literal, system-execution-md, undeclared-system, skill-md,
                          catalog-template, near-spelling]
          falsy_valid: false
          documented_alternatives: []
      note: >-
        THE SOLE GATE. G13 (executed): the curator agent's own write grant already admits every
        `.md` under `defender/skills` at any depth, including this file, `gather/SKILL.md` and
        `gather/queries/**`; `_in_corpus` hands all of them to this rule (FF-11); and this rule is
        the only thing between them and `commit_corpus`. Raising in it retires the WHOLE batch
        (FF-4) — one disallowed path costs every row on the tick, including the batch's only record
        of a reducer mistake (settled premise #21). `_is_system_execution_md` has exactly ONE
        production consumer, this rule (C16/G8).

    - id: git_status_xy
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the two-character git-status porcelain code the rule is handed
            alongside the path. `_git.git_status`'s parser CONSUMES a rename/copy record's
            <origPath> field but never appends it to the returned (xy, path) list, so U4's deletion
            refusal — keyed entirely on these records — structurally cannot see a rename's origin."}
          default: unknown
          # THE ONE `unknown` IN THIS GRAPH, AND IT IS A CONFESSION, NOT A NULL. This domain has no
          # default in the ordinary sense — the rule is handed whatever record `_git.git_status`
          # emits — and WHICH shapes a curator edit actually produces at this base was not
          # established by grounding: the demands use `' M'` for the admit case and `'D '` for the
          # delete case, C14's probe drove `( M | D )`, and FK-1(d) observes that M7's text
          # enumerates none of them. A lookup, not a decision: `route: re-ground`.
          distinguished: ["D ", " D", "R ", "RM", "MM", "??"]
          falsy_valid: false
          documented_alternatives: []
      note: >-
        MINTED BY THE ASSEMBLER FROM FK-1(d), AND EVERY MEMBER IS UNBOUND BY DESIGN. M7's text
        enumerates no status shape at all: a `path`-keyed match admits `??` and `R `, an `xy`-keyed
        match refuses a legitimate curator edit, and the rename-origin discard means an `R ` record
        whose DESTINATION is the reducer literal passes the rule while deleting a system's surface
        with no record. `reducer_surface_deletion_refused` pins `'D '` only. THE TWO READINGS OF
        FK-1 BIND DIFFERENT ADDRESSES — path survival plus status-shape closure lands here; the
        "document survives" reading lands on a content rule at `reducer_surface` instead (FK-2).
        The judge recommends the first and routing the rename-origin defect to its own issue,
        because fixing `_git.git_status` touches every actor rule at once.

    - id: _skills_path_rule
      provenance: code
      facets: {}
      # The SIBLING lane's rule, unchanged this round and modelled facetless on purpose: #869's
      # graph owns its domain (six members) and re-declaring it here would re-fire R4 over a
      # contract this delta does not touch. What this round needs from it is one executed fact —
      # it REFUSES `defender/skills/gather/defender-sql.md` at `_is_in_scope` (C16/G20, executed;
      # CATALOG_REL is `defender/skills/gather/queries/`, so gather's top-level prose is out of the
      # lead-author's scope entirely) — which is what makes `reducer_surface_has_one_writing_lane`
      # a parity demand rather than a hope.

    - id: skills_tree
      provenance: code
      facets:
        identity:
          key_axes: [tree_root, system]
          evidence: {nl: "The committed corpus under `defender/skills/`, carried forward from #869
            with its key unchanged. Path templates read off the writers:
            skills/{system}/execution.md (pitfalls curator), skills/{system}/SKILL.md and
            skills/{system}/_draft/… (lead-author). `tree_root` is a key axis because the drain
            worktree and the process checkout are different objects for the same relative path.
            `commit_corpus` interpolates tree_root ONLY — it stages the whole `defender/skills`
            pathspec rather than the rule's own `changed` list, which is why a rule that merely
            SKIPS a path is not a gate for that path."}
          sharing: unique-key
        access:
          constraints_by_via:
            pitfalls-gate:
              trust: attacker-influenced
              constraints: [denylist, confine]
              # `_pitfalls_path_rule`: execution.md-only shape, adapter-set membership, deletion
              # refusal. M7 adds one literal allowance IN FRONT of the first two.
            lead-author-gate:
              trust: attacker-influenced
              constraints: [denylist, confine]
              # `_skills_path_rule` + `_skills_content_rule`. The second half is the asymmetry
              # FK-2 turns on: this lane has a CONTENT rule beside its path rule and the pitfalls
              # lane has none.
      note: >-
        Only the two OFFLINE gate cells are modelled here. The agent-side write-tool and bash cells
        are modelled on `reducer_surface`, where this round actually opens something; #869's graph
        carries the full four-cell model for this tree and this delta does not change it.

    # =================================================================================
    # THE HANDOFF, THE PROMPT AND THE HUMAN-VISIBLE RECORDS
    # =================================================================================

    - id: pitfalls_handoff
      provenance: design
      facets:
        payload:
          parts:
            - {role: surface,  source: "const:system | reducer"}
            - {role: path,     source: "template:defender/skills/{system}/execution.md | const:defender/skills/gather/defender-sql.md",
               slots: {system: skills_tree}}
            - {role: system,   source: "const:the queued row's system field — SYSTEM SHAPE ONLY"}
            - {role: failures, source: "const:the merged per-mistake records"}
          invariants: [all-slots-bound]
          nl: >-
            The curator's prompt payload and the place a name becomes a PATH. Three changes this
            round: `execution_md_path` becomes `path` on BOTH shapes (the key is gone from the
            return value and from `lead_pitfalls.md:17,30,38` — G16 bounds the ripple at 1 producer,
            3 prompt lines, 6 test files and 2 spec artifacts, with no other production reader);
            `surface` is added as the discriminator on every entry; and `system` is present on the
            system shape only. AT MOST ONE reducer entry per tick, whatever the row count. ORDERING
            IS UNPINNED (F1) — the prompt reads the entries in order and today's builder emits them
            sorted by system name; an independent reader of the live doc already misread `surface`
            as a file name rather than as the discriminator, which is precisely the confusion M6's
            prompt rewrite must prevent, since `lead_pitfalls.md` is the one consumer of this key
            that is a model.
      note: >-
        C23 (read): every string in this payload reaches the curator RAW as well as JSON-encoded —
        `structured_json_body` appends `'\n\n'.join(_string_values(value))` after the encoded body,
        and the whole thing sits inside one run-salted untrusted frame whose reader contract says
        to treat every byte inside as data. The posture is UNCHANGED by this round and is recorded
        as `no-consequence` for the demands; it is written down because M5'/M6 route a NEW content
        class through it — a raw bash command, bounded by SHIM_COMMAND_MAX_CHARS, chosen by whoever
        chose the alert data. This boundary is R6's rendered sink for this delta.

    - id: lead_pitfalls_prompt
      provenance: design
      facets: {}
      # `defender/learning/.../lead_pitfalls.md` — facetless on purpose: its observable is that the
      # prompt NAMES both edit targets and the section, which `prompt_names_both_targets`'s
      # docstring pins; there is no composition contract a rule could read. It is the OTHER reader
      # of the same decision `_pitfalls_path_rule` enforces, which is why the demand is `coherence`
      # and not `behavior`: the two drift apart silently, and the model is the one that pays.

    - id: loop_log
      provenance: design
      facets: {}
      # FK-6, and it is UNRESOLVED. `run_pitfalls:226-229` builds its operator line from
      # `{s for r in records if (s := ...)}` — TRUTHY systems only — so the systemless row is never
      # NAMED, only counted in the closing `({n} undeclared)`; G5 reproduced exactly that (row `s1`
      # retired unnamed). A reducer-only tick is systemless BY CONSTRUCTION, so it contributes
      # nothing to the named-systems text and an operator reading the log cannot tell a reducer
      # lesson was taught. With O7 (#903) leaving the graveyard unread, this line and the commit
      # message are the ONLY human-visible records this lane produces.

    - id: pitfalls_commit_message
      provenance: design
      facets: {}
      # FK-6's second half. `_pitfalls_commit_message` says "learning(lead-author): execution.md
      # pitfalls" / "Folded … into per-system execution.md ## Common pitfalls" UNCONDITIONALLY, so
      # on a tick that taught ONLY the reducer surface it misdescribes the commit's contents. Four
      # existing test files assert the message verbatim, which makes this a merge-blocking detail
      # for the implementer whichever way §7 goes.

    # =================================================================================
    # THE CROSS-PROCESS INPUT ROOT AND THE SCREENS IN FRONT OF IT
    # =================================================================================

    - id: executed_queries_table
      provenance: code
      facets:
        identity:
          key_axes: [run_id, lead_id, query_index]
          evidence: {nl: "`<run_dir>/executed_queries.jsonl` plus its `gather_raw/{lead}/{seq}.json`
            payload sidecar. The row id template `{run_dir.name}:{lead_id}:{query_index}` is read
            off lead_extraction.py:120, which is also the pitfalls channel's `pitfall_id`. A
            CROSS-PROCESS root: written by the runtime process, read by the learning process, with
            NO import edge across the seam (FF-7) — censused by reading both ends, not by following
            calls."}
          sharing: serialized-append
        payload:
          parts:
            - {role: query_id, source: "const:∅.bash-shim for a terminal-reducer failure, else the resolved {system}.{verb}"}
            - {role: system,   source: "const:the system the call was dispatched to, or '' when the registry does not declare it"}
            - {role: exit_code, source: "const:the translated shim exit"}
          invariants: [all-slots-bound]
          nl: >-
            The row the whole lane routes on. `_record_shim_failure` writes it under FOUR
            conjunctive preconditions — `isinstance(deps, GatherDeps)`, `deps.lead_id is not None`,
            `result.rc != 0`, and `permission.command_shape.terminal_reducer(...)` — and it is the
            ONLY writer of a `∅.bash-shim` row anywhere in the tree (G7: 26 grep hits, 1 definition,
            1 writer, 24 in tests). PO-R1 (executed, 17 command shapes) settles the fourth
            precondition: `terminal_reducer` is FULLY STRUCTURAL — exactly one pipeline, whose LAST
            stage's `argv[0]` equals the string "defender-sql" — so no lookalike binary, embedded
            string, quoted filename or connector shape is misclassified, and a reduce piped onward
            into `head`/`grep` NEVER records at all.

    - id: resolve_query_id
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "the model-supplied query_id as it reaches the writer: returned verbatim
            unless it is `∅.`-prefixed, carries a forbidden character, or names a foreign system
            prefix. UNCHANGED BY THIS ROUND — U3 rests on merged code (#869 M3) and this round only
            break-attempts it."}
          default: "{system}.{verb}"
          distinguished: [reserved-sentinel, foreign-prefix, near-miss-verbatim, empty, none]
          falsy_valid: false
          documented_alternatives: []
      note: >-
        THE NEAR MISS IS THE SHARP MEMBER. C15 (executed) re-ran C1's alphabet at this base and
        widened it: every reserved, traversal, empty and None value falls back to the untagged
        `'elastic.esql'`, `'gather.bash-shim'` falls back on the foreign prefix — and
        `'elastic.bash-shim'` is returned VERBATIM, well-formed, model-supplied and one substring
        away from the sentinel. U3's discharge therefore depends on the router comparing the WHOLE
        value, which the doc states only as "the sentinel id".

    - id: _is_system_name
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "#868's shape check on a candidate system NAME (not a path): refuse
            empty, a leading dot, and any value carrying / \\ or NUL, so a traversal never becomes
            a set lookup. M9's classifier reads it to separate `malformed-system` from
            `undeclared-system`, which is a NEW consumer of a merged predicate."}
          default: none-every-candidate-is-checked
          distinguished: [traversal, empty, dotfile, separator-bearing, whitespace-only,
                          non-ascii-lookalike]
          falsy_valid: false
          documented_alternatives: []
      note: >-
        THE LAST TWO MEMBERS ARE FK-12's AND THEY BIND DIFFERENT REASONS UNDER THE TWO READINGS.
        `whitespace-only`: every reader on this path applies `str(r.get("system") or "").strip()`
        BEFORE the shape check, so it normalizes to `""` upstream and routes to `no-system` — IF
        that is where the strip happens, which one copy asserts and the other hedges.
        `non-ascii-lookalike`: `_is_system_name` does not reject non-ASCII at all on one reading,
        giving `undeclared-system:<lookalike>`, while a `[a-z0-9-]` character class would give
        `malformed-system`. Both are cheap executed is-questions and the judge routed them to the
        implementer as executed assertions inside `deadletter_reason_malformed_system` rather than
        deciding them.

    - id: pitfalls_threshold
      provenance: code
      facets:
        domain:
          type: int
          refinement: {nl: "`LEARNING_PITFALLS_THRESHOLD` (config.py:530), lowered from 5 by #823
            M4. It gates on `len(merge_pitfalls(rows))` — DISTINCT MISTAKES, not rows and not
            occurrences — at BOTH readers: `run_pitfalls:205-211` (the tick) and
            `drains._has_lead_author_work:135-147` (the wake). The comment records the number as 'a
            reasoned floor rather than a measured one'."}
          default: 3
          distinguished: [3, 0, 1]
          falsy_valid: true
          documented_alternatives: []
          # `0` is the falsy member and it is VALID (every tick curates) — the `x or DEFAULT`
          # swallow shape R4 exists for. `1` is retire/curate-on-first. Neither is bound by a
          # demand; only `distinguished[3]` is.
      note: >-
        FK-3 LIVES ON THIS BOUNDARY AND IS RESOLVED BY THE HUMAN: a `system == ""` record now
        clears on its own `occurrences`, and no longer contributes to the distinct COUNT, at BOTH
        readers. What follows is the defect that decision closes. The gate was anti-correlated with
        evidence quality after M5': a DIAGNOSED reducer mistake repeated N times is ONE record and can never
        clear a threshold of 3 on its own (the motivating incident — one lead, one unchanging
        `Binder Error`, eight varied attempts), while N SILENT reducer failures are N records and
        DO clear it (PO-R2, executed: 3 content-less rows -> 3 records -> threshold cleared) while
        carrying nothing a curator could name a fix from. On main those inflated batches produce
        ZERO handoffs and graveyard as `consumed_undeclared`; after M6 they instead produce a
        reducer handoff full of undiagnosable failures, which `lead_pitfalls.md`'s "skip that
        failure; never invent one" rule turns into a no-edit tick — landing straight in FK-7, which
        is resolved: those rows are HELD, neither rotated nor graveyarded, until an edit confirms
        the teaching. The two arms are `the_motivating_incident_reaches_the_curator_alone` and
        `silent_reducer_failures_alone_do_not_open_the_lane`.

    - id: adapters_dir
      provenance: code
      facets: {}
      # `<tree_root>/defender/scripts/adapters`, globbed for `*_adapter.py` through
      # `verbs._system_of`. Facetless here: #869's graph owns its contract, and this round needs
      # exactly one fact from it — the set is the SEVEN adapters and `gather` is not among them
      # (C11/G6, searched, with its alphabet recorded), so the reducer surface's own directory can
      # never satisfy the membership branch and the literal allowance must precede it.

  interacts:

    # ---- M5': the lane opens at collection --------------------------------------------
    - {from: collect_general_failures, to: executed_queries_table, mode: read,  via: api, provenance: design}
      # THE ROUTING INPUT. Read through `lead_repository.joined` -> `extract_from_joined`, which is
      # a PROCESS boundary with no import edge (FF-7): the runtime writes the row, the learning
      # process reads it. C21 (read) records that the shim writer passes `payload_text=''`
      # precisely so the sidecar EXISTS and `extract_from_joined`'s raw-ref gate keeps the row —
      # i.e. the systemless guard at :111 really is the only thing between a reducer failure and
      # the queue. THAT CLAIM CLOSED ON A READ AND OWES AN EXECUTED PROBE (see claims note).
    - {from: collect_general_failures, to: pitfalls_queue, mode: write, via: fs, provenance: design,
       sends: payload, interpolates: [pitfall_id]}
      # The one branch M5' adds, before the systemless guard. C22 (read): a shim row falls past the
      # catalog-id and draft-candidate guards BY CONSTRUCTION ('∅' fails `_SAFE_ID_SEGMENT`; the
      # sentinel is not a catalog id), so this touches one of `collect_general_failures`' four
      # guards and not the other three.

    # ---- the tick ---------------------------------------------------------------------
    - {from: run_pitfalls, to: pitfalls_queue,     mode: read,  via: fs,  provenance: design}
    - {from: run_pitfalls, to: pitfalls_threshold, mode: read,  via: env, provenance: design}
    - {from: run_pitfalls, to: _pitfalls_path_rule, mode: invoke, via: api, provenance: design}
    - {from: run_pitfalls, to: git_status_xy,      mode: read,  via: api, provenance: design}
    - {from: run_pitfalls, to: lead_pitfalls_prompt, mode: read, via: fs, provenance: design}
    - {from: run_pitfalls, to: pitfalls_handoff,   mode: write, via: api, provenance: design, sends: payload}
    - {from: run_pitfalls, to: reducer_surface,    mode: write, via: fs,  provenance: design,
       sends: payload, interpolates: [tree_root]}
      # THE LANE'S OWN EDGE onto the new surface: the handoff that names it, the rule that admits
      # it, and the commit that carries it. The physical write is the agent's
      # (`curator_agent -> reducer_surface`, below); this edge is what the demands bind.
    - {from: run_pitfalls, to: skills_tree,        mode: write, via: fs,  provenance: design,
       interpolates: [tree_root, system]}
    - {from: run_pitfalls, to: consumed_ledger,    mode: write, via: fs,  provenance: design,
       interpolates: [pitfall_id]}
    - {from: run_pitfalls, to: graveyard,          mode: write, via: fs,  provenance: design,
       interpolates: [pitfall_id]}
    - {from: run_pitfalls, to: loop_log,           mode: write, via: stdout, provenance: design}
    - {from: run_pitfalls, to: pitfalls_commit_message, mode: write, via: git, provenance: design}

    # ---- the handoff builder and the partition ----------------------------------------
    - {from: _build_pitfalls_handoffs, to: pitfalls_handoff, mode: write, via: api, provenance: design,
       sends: payload}
    - {from: _build_pitfalls_handoffs, to: skills_tree,  mode: read,  via: api, provenance: design}
    - {from: _build_pitfalls_handoffs, to: loop_log,     mode: write, via: stdout, provenance: design}
      # FF-6: the dropped-systems line is built from a TRUTHY comprehension, so the systemless row
      # is counted and never named. FK-6.
    - {from: _split_batch_by_membership, to: pitfalls_handoff, mode: read, via: api, provenance: design}
      # F3's SEAM, AND IT IS THE FORK ITSELF. Today the function answers from `kept: set[str]`,
      # derived at the call site as `kept = {h["system"] for h in handoffs}` (run_pitfalls:225 — a
      # BARE SUBSCRIPT, which KeyErrors on a system-less reducer entry: FF-3/G15). The judge's
      # provisional is to pass the handoff list and move the derivation inward; a `reducer_emitted:
      # bool` and a builder-computed curated id set are the two other seams, and the last of them
      # arguably deletes this function. THIS EDGE IS DRAWN ON THE PROVISIONAL READING and moves if
      # §7 picks another.
    - {from: _executed_query, to: pitfalls_handoff, mode: write, via: api, provenance: code,
       sends: payload}

    # ---- M9's classifier and the rotation ---------------------------------------------
    - {from: _graveyard_dropped_rows, to: graveyard,     mode: write, via: fs,  provenance: design,
       interpolates: [pitfall_id]}
    - {from: _graveyard_dropped_rows, to: _is_system_name, mode: read, via: api, provenance: design}
    - {from: rotate_pitfalls, to: pitfalls_queue,   mode: write, via: fs, provenance: design,
       interpolates: [pitfall_id]}
    - {from: rotate_pitfalls, to: consumed_ledger,  mode: write, via: fs, provenance: design,
       sends: payload, interpolates: [pitfall_id]}
    - {from: rotate_pitfalls, to: consumed_category, mode: read, via: api, provenance: design}

    # ---- the merge, and the second reader of the same count ----------------------------
    - {from: merge_pitfalls, to: pitfall_key,     mode: read, via: api, provenance: design}
    - {from: merge_pitfalls, to: pitfalls_queue,  mode: read, via: fs,  provenance: code}
    - {from: _has_lead_author_work, to: pitfalls_queue,     mode: read, via: fs,  provenance: code}
    - {from: _has_lead_author_work, to: pitfalls_threshold, mode: read, via: env, provenance: code}
      # THE UNMOVED READER OF A MOVED COUNT. `_has_lead_author_work` gates the WAKE on
      # `len(merge_pitfalls(read_pitfalls(paths)))` — the same arithmetic M5' changes — and no
      # demand observes it at its own edge today. FK-3.

    # ---- the agent, the commit gate, and the pre-existing delete grant ------------------
    - {from: curator_agent, to: reducer_surface, mode: write,  via: write-tool, provenance: code,
       interpolates: [tree_root]}
    - {from: curator_agent, to: skills_tree,     mode: write,  via: write-tool, provenance: code,
       interpolates: [tree_root, system]}
    - {from: curator_agent, to: reducer_surface, mode: remove, via: bash, provenance: code}
      # NOT THIS ROUND'S SUBTRACTION — `provenance: code`, and the brief's census is explicit that
      # nothing is deleted by this round. This is `_rm_skills_grant` (`rm defender/skills/<seg>+`,
      # `pins_path=True`), a LIVE in-process grant entirely independent of `_pitfalls_path_rule`,
      # which M7 makes reachable for a NEW path. The deletion happens on disk in the drain
      # worktree; U4 holds at the COMMIT boundary and only if M7's allowance falls through to the
      # delete branch. Modelled as `mode: remove` so R5 asks the question rather than leaving it to
      # FK-1's prose.
    - {from: commit_corpus, to: reducer_surface, mode: write, via: git, provenance: code,
       interpolates: [tree_root]}
    - {from: commit_corpus, to: skills_tree,     mode: write, via: git, provenance: code,
       interpolates: [tree_root]}
      # `git add -- defender/skills` — THE WHOLE PATHSPEC, never the rule's own `changed` list.
      # `_verify_corpus_scope` raises on a newly-dirty NON-`.md` file under the corpus (so it does
      # not ride the commit — the settled premise that said otherwise is corrected at FK-5), but
      # `baseline_stray` snapshots only files OUTSIDE `defender/skills/*.md`, so pre-existing dirt
      # INSIDE the corpus is indistinguishable from this tick's edit and is sha-stamped onto this
      # tick's rows. Inherited, pre-dates M7, recorded rather than minted.
    - {from: gather_subagent, to: reducer_surface, mode: read, via: read-tool, provenance: code}
      # O3's READ LEG and the reason the round exists: `skills/gather/SKILL.md:141` instructs the
      # subagent to Read this file before it writes the SQL, and `GATHER_DEF` carries
      # `corpus_dirs=('lessons','skills','examples')` (G23). It is also FK-4: this is the ONE file
      # every lead's reduce for every system reads, where a system's execution.md is read only when
      # working that system. N7 decided ATTRIBUTION; nothing decided AMPLIFICATION.
    - {from: gather_subagent, to: skills_tree, mode: read, via: read-tool, provenance: code}

    # ---- the sibling lane -------------------------------------------------------------
    - {from: lead_author_run, to: skills_tree,      mode: write,  via: fs,  provenance: code,
       interpolates: [tree_root, system]}
    - {from: lead_author_run, to: _skills_path_rule, mode: invoke, via: api, provenance: code}

    # ---- the runtime half of the cross-process seam ------------------------------------
    - {from: _record_shim_failure, to: executed_queries_table, mode: write, via: fs, provenance: code,
       sends: payload, interpolates: [run_id, lead_id, query_index]}
    - {from: query_tool, to: executed_queries_table, mode: write, via: fs, provenance: code,
       sends: payload, interpolates: [run_id, lead_id, query_index]}
    - {from: query_tool, to: resolve_query_id, mode: invoke, via: api, provenance: code}
    - {from: lead_repository, to: executed_queries_table, mode: read, via: fs, provenance: code}
      # THE UNMOVED READER OF THE MOVED SOURCE: `joined` -> `extract_from_joined` is what hands
      # `collect_general_failures` its rows, and #841's remerge is documented as the one reader that
      # must not take the split. M5' changes what the lane does with a sentinel row; nothing
      # observes this reader at its own edge.
    - {from: lead_author_run, to: pitfalls_queue, mode: read, via: fs, provenance: code}
      # GROUNDED BY THE R8 CENSUS (60-residue.md item, confirmed — 47-census-merge-pitfalls.md):
