    probe: "spec-graph trace resource learning_queue at 05390bad; pyrefly-refs over append_pitfalls / read_pitfalls / rotate_pitfalls / merge_pitfalls; grep -n 'pitfalls|deadletter' defender/learning/frontend/*.py; hand-classification of every `floor` line the trace emitted"
