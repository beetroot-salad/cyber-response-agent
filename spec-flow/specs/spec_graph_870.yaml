  # ---- the re-grounding probes (46-reground.md) ----------------------------------------

  - id: PO-R1
    kind: behavior
    claim: >-
      `terminal_reducer` is a structural test — exactly one pipeline (no top-level `&&`/`||`/`;`
      connector), whose LAST stage's `argv[0]` is exactly the string "defender-sql" — never a
      substring or name-lookalike match. It settles both
      `a_reduce_that_fails_but_is_not_the_command_that_reports` (a non-terminal reduce never
      satisfies it) and `terminal_reducer_shape_spoofed_by_a_crafted_bash_command` (no crafted
      command shape — lookalike binary, embedded string, extra connector — is misclassified as a
      terminal reduce).
    probe: >-
      Drove `defender.runtime.bash_exec.parse(cmd)` ->
      `defender.runtime.permission.command_shape.terminal_reducer(pipelines)` over 17 real command
      strings covering: canonical single pipe; multi-stage pipe ending in reducer; reducer piped
      into `head`/`grep` (non-terminal); text merely containing "defender-sql" (echo string, quoted
      filename); lookalike binaries (`defender-sql-x`, `./defender-sql`, `mydefender-sql`,
      `python3 defender-sql`); connector-joined pipelines (`&&`, `;`, `||`) with the reducer as the
      second/last statement; a bare single-stage reducer; and a reducer whose SQL argument text
      itself contains a literal `|` inside a quoted string.
    probe_kind: executed
    observed: >-
      terminal_reducer=True for: the canonical `cat payload | defender-sql 'SELECT 1'`; the
      multi-stage `cat | jq | defender-sql`; the bare single-stage reducer; and the reducer whose
      SQL argument contains a quoted `|`. terminal_reducer=False for ALL of: reducer piped into
      `head -40`; reducer piped into `grep`; `echo 'run defender-sql now'`;
      `cat defender-sql-notes.txt`; `defender-sql-x`; `./defender-sql`; `mydefender-sql`;
      `defender-sqlx`; `python3 defender-sql`; and every connector-joined pair (`&&`, `;`, `||`,
      reducer-first-then-echo), each of which parses to npipelines=2.
    verdict: holds
    disposition: >-
      RE-TYPED BY THE ASSEMBLER: arrived as `kind: is-question`, which is not in the schema's closed
      vocabulary. It is a claim about what existing code does over an input, executed — `behavior`.
      Its SPOOFING half reads as a break-attempt, and at `reachability` grain its verdict would be
      `unrefuted` rather than `holds`; recorded here rather than silently converted, because a
      reachability verdict is never "confirmed". Closes FK-16 and reinstates discount D2. The one
      residue worth keeping: a reduce piped onward NEVER records, so a lead that habitually
      truncates its reduce output produces no reducer lesson at all (FK-15's non-coverage note).

  - id: PO-R2
    kind: behavior
    claim: >-
      A content-less `stderr_digest` (absent, empty, whitespace-only, zero-width-only, or nothing
      but the `exit=N; ` envelope) keys via `pitfall_key` to `(system, "\x00" + pitfall_id)` —
      unique per row — so it merges with NOTHING, including another content-less row carrying the
      identical shape. A silent reducer failure can never accumulate `occurrences > 1`. Consequence
      for the curation threshold: `run_pitfalls` gates on `len(merge_pitfalls(rows))`, which counts
      each content-less row as one full distinct "mistake", so a run of silent reducer failures
      alone can clear the threshold even though `_build_pitfalls_handoffs` then drops every one of
      them (system == "" fails its membership filter), producing zero handoffs and a
      `consumed_undeclared` batch.
    probe: >-
      Drove `defender.learning.core.persist.pitfall_key` and `merge_pitfalls` over 10 rows with
      `system=""`: stderr_digest absent, `""`, whitespace-only, envelope-only with trailing space
      (`"exit=1; "`), envelope-only without (`"exit=1;"`), negative-code envelope with padding
      (`"exit=-7;   "`), zero-width-char-only (U+200B x2), plus two rows sharing one real diagnosis
      ("Binder Error…") and one row with a genuinely different real diagnosis ("Parser Error…").
