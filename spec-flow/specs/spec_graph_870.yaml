    observed: "51 surfaces; the globs are */SKILL.md, */execution.md, gather/queries/**/*.md and */verb-roster.md. gather-dir members: ['skills/gather/SKILL.md','skills/gather/verb-roster.md'] — defender-sql.md is NOT among them. audit_read_surfaces iterates model_read_surfaces, so it never reads the file"
