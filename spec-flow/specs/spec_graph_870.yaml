    docstring_seed: >-
      On a tick that emits a reducer handoff AND the curator's commit actually changes the reducer
      literal, the shim rows behind it rotate as consumed_committed carrying the commit sha and
      appear in no deadletter entry — today they land in dropped_ids, because the curated set is
      computed as `row.system in kept` and a reducer row has no system (C18/C9's row s1): taught on
      the same tick it was buried. FK-7 (resolved): system rows keep `kept`-membership unchanged;
      the reducer row's curated condition is ASYMMETRIC and requires both the handoff AND a
      confirmed edit — a handoff alone is not enough. The no-edit half is
      `a_no_edit_reducer_tick_holds_its_rows`'s own arm, not this demand's.
    note: >-
      FK-7 RESOLVED BY §7 (asymmetric: handoff-emitted for system rows, handoff-emitted AND
      commit-confirmed for the reducer row). F3 REMAINS OPEN: what `_split_batch_by_membership`
      takes under M8 — the handoff list, a `reducer_emitted: bool`, or the curated id set computed
      by the builder — are three different seams and the last arguably deletes the function; the
      binds address moves with the answer, and FK-7's resolution narrows but does not pick among
      them (any of the three seams can carry the AND condition). This demand as written asserts
      the handoff-plus-edit reading; F3's seam choice is still §7's.

  - id: a_no_edit_reducer_tick_holds_its_rows
    kind: negative
    form: test
    fork: F3
    binds: [_split_batch_by_membership, "interacts(run_pitfalls->pitfalls_queue)", "interacts(commit_corpus->reducer_surface)"]
    positive_control: curated_reducer_row_is_not_graveyarded
    discharged_by: test_a_no_edit_reducer_tick_holds_its_rows
    source: "FK-7 (resolved by §7), the no-edit arm"
    docstring_seed: >-
      A tick that emits a reducer handoff, but whose curator declines to edit (`lead_pitfalls.md`'s
      "skip that failure; never invent one" rule applies, or the commit's changed-path set does not
      contain the reducer literal), leaves the shim rows behind it STILL in the queue afterward —
      neither consumed_committed nor graveyarded. A handoff alone is not curation; only a confirmed
      edit is. Without this arm a reducer row would be discarded on the same tick it was merely
      OFFERED, before anything was ever taught — the data-loss shape FK-7 exists to close.
      TWO ARMS, AND THE SECOND IS THE DISCRIMINATING ONE (added at phase F, F1): FK-7's
      criterion is a CONJUNCTION, and an arm that fails both conjuncts together cannot tell it
      apart from the loose reading "a handoff was emitted and the tick committed something". So
      the second arm COMMITS — a mixed batch whose curator teaches a declared system's
      execution.md and SKIPS the reducer entry, which `lead_pitfalls.md`'s "skip that failure;
      never invent one" rule makes a first-class outcome and PO-R2 makes frequent. Under the
      loose reading the shim rows rotate as consumed_committed carrying ELASTIC's sha, a sha of
      a commit containing nothing about them; the system row that WAS taught is asserted
      consumed in the same drive, so the arm is not green on a dead tick.

