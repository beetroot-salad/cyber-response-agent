    observed: "append_pitfalls 34 refs/11 files (1 production: lead_author.py:602); read_pitfalls 19/9 (production: drains.py:147,288 + pitfalls_curator.py:202); rotate_pitfalls 4/2 (pitfalls_curator.py:246,278,283); merge_pitfalls 9/5 (drains.py:35,147; lead_author.py:607; pitfalls_curator.py:57,207). drain.retire reached from drains.py:272. frontend grep: 0 hits. The trace's ~50 `retire`/`_tick` floor lines are same-named unrelated symbols, each read and rejected"
