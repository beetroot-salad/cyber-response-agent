      # (`lead_author_run` unmoved while `run_pitfalls` moves) that the original 51-trigger baseline
      # did not carry, because the edge itself was ungrounded until this census ran.

    # ---- the merged resolver -----------------------------------------------------------
    - {from: declared_systems, to: adapters_dir, mode: read, via: fs, provenance: code}
    - {from: drain_retire, to: graveyard,      mode: write, via: fs, provenance: code,
       interpolates: [pitfall_id]}
      # THE SECOND GRAVEYARD WRITER, with `deadletter_reason: str(e)` — raw free text where M9's
      # vocabulary is three closed classes. FK-11.
    - {from: drain_retire, to: pitfalls_queue, mode: write, via: fs, provenance: code,
       interpolates: [pitfall_id]}

  drives:

    - {from: lead_author_drain, to: run_pitfalls,   provenance: code, multiplicity: serial}
      # THE PRODUCTION ENTRY, AND NO STATIC CENSUS SEES IT (G18/FF-8): loop.py --lead-author-drain
      # -> _drain_lead_author:298 -> _drain_pitfalls:280 -> _invoke_pitfalls:260 ->
      # importlib.import_module(_CURATOR_MODULES['pitfalls_curator']) -> run_pitfalls. Established
      # by reading both ends; `pyrefly-refs` on run_pitfalls resolved 24 refs / 10 files, ALL of
      # them the definition or a test.
    - {from: lead_author_drain, to: lead_author_run, provenance: code, multiplicity: serial}
    - {from: run_pitfalls, to: merge_pitfalls,             provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: _build_pitfalls_handoffs,   provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: curator_agent,              provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: _split_batch_by_membership, provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: _graveyard_dropped_rows,    provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: rotate_pitfalls,            provenance: design, multiplicity: serial}
    - {from: run_pitfalls, to: commit_corpus,              provenance: code,   multiplicity: serial}
    - {from: run_pitfalls, to: declared_systems,           provenance: code,   multiplicity: serial}
    - {from: lead_author_run, to: commit_corpus,           provenance: code,   multiplicity: serial}
    - {from: run_investigation, to: gather_subagent,       provenance: code,   multiplicity: concurrent}
      # `runtime/driver.py:704` states it: "sibling leads are dispatched CONCURRENTLY (one `gather`
      # tool call per …)". So the queries-table writers below run under a genuine interleaving —
      # which is inherited machinery (N8), not this round's, but it is what the e2e demand drives
      # through.
    - {from: gather_subagent, to: _record_shim_failure,    provenance: code,   multiplicity: serial}

