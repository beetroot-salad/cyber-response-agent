    probe_kind: executed
    observed: "every reserved, traversal, empty and foreign-prefix value returned 'elastic.esql'; only the well-formed 'elastic.esql' passed through verbatim"
    verdict: unrefuted
    disposition: >-
      Re-executed at this base by the brief as G1 (widened alphabet) and by extraction as C15,
      which adds the near-miss 'elastic.bash-shim'. U3's centre rests on the pair. Unified here on
      the doc's id per 20-demands' accounting; G1 is this entry.

