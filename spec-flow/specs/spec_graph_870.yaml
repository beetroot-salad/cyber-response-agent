    - "FK-4 — the reducer surface is ONE file every system's reduce reads (1 promotion). N7 decided ATTRIBUTION ('written without naming elastic'); it did not decide AMPLIFICATION ('read before every system's reduce, forever'), and the Scale dive's 'no fan-out' is about the write axis. Judge: restate the cost in the doc, bind it with FK-2's content rule and a prompt requirement that reducer bullets be payload-shape-scoped in their own text. No mechanism change. RESOLVED (auto): restate N7's cost in the doc — the real cost is CROSS-SYSTEM REACH, not 'written without naming elastic'. Doc prose; no demand, no address changes. MINTED AT PHASE F (F3, human): the prompt requirement is now carried by `prompt_names_both_targets` — a reducer bullet must be PAYLOAD-SHAPE-SCOPED in its own text, asserted on the paragraph that names the reducer target. FK-4's finding is also what corrects FK-2's rationale, which declined bullet sanitization on the ground that this is \"the same exposure every execution.md already carries\" — it is not, and the decline is re-affirmed on the ground that does hold. resolved_by: auto, extended at phase F by the human"
