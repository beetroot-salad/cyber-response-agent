  - id: G12
    kind: behavior
    claim: "N1's premise — `∅.above-repeat-guard` rows stay dropped at enqueue — is false for the attributed half, and `∅.repeat-trip` rows (always attributed) are in the same position."
    probe: "collect_general_failures over agent-fixable ExecutedLeads for each of the three sentinel ids with system in ['elastic','']; then read query_tool._system_of_record:232-250, the ABOVE_GUARD writers at :341,:417-424, the repeat-trip writer at :488-497, and record_query.persist_payload:120-136"
    probe_kind: executed
    observed: "∅.above-repeat-guard system='elastic' -> 1 row; system='' -> 0. ∅.repeat-trip system='elastic' -> 1 row; system='' -> 0. _system_of_record returns the model's string verbatim when the registry declares that system, '' otherwise; the repeat-trip row is written BELOW _grant_check so its system is always a dispatched, declared one. Both record exit_code=USAGE_EXIT_CODE(64) -> agent-fixable, and append_query_row always persists an (empty) sidecar, so extract_from_joined keeps them"
    verdict: refuted
    disposition: "FK-8. Not a mechanism refutation — M5' keys on the shim id alone — but it inverts the expected value of nonshim_systemless_row_still_dropped's positive arm depending on how §7 answers."

