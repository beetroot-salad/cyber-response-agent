  - id: G11
    kind: behavior
    claim: "The doc's security dive states a committed defender-sql.md edit can turn the #632 correspondence audit red. It cannot: the file is not a model_read_surface."
    probe: "verb_roster.model_read_surfaces(defender_dir) at 05390bad; membership test for 'skills/gather/defender-sql.md'; read verb_roster.py:96-113 and audit_read_surfaces:175-213"
