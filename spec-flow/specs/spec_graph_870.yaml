base: 05390bad8116e802c39e52156f569d1181051ade   # = origin/main. write-code-from-spec diffs against it.

# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# WHAT THIS ROUND DOES. Today a failed terminal `… | defender-sql …` reduce writes exactly one
# row into the run's queries table under the reserved sentinel `∅.bash-shim`
# (`runtime/tools.py:269`, the ONLY writer — G7). If that reduce happened to be attributed to a
# declared system the row reaches the pitfalls queue and is taught as THAT SYSTEM's mistake; if it
# was not attributed it is dropped at `lead_extraction.py:111` and nothing is taught at all. This
# round opens a lane for it: the row is admitted on the sentinel id alone with its `system`
# NORMALIZED TO "" (M5'), the curator is handed a second edit target —
# `defender/skills/gather/defender-sql.md`, the reducer surface — through a handoff entry
# discriminated by `surface` (M6), one literal allowance is added to `_pitfalls_path_rule` (M7),
# the batch partition stops keying on `row.system in kept` so a taught reducer row is not
# graveyarded on the tick that taught it (M8), and the three retirement classes stop sharing one
# false reason string (M9).
#
# THREE THINGS A COLD READER MUST NOT ASSUME.
#
#   1. THE #632 BACKSTOP DOES NOT COVER THIS FILE. Comment 2's security dive says a committed
#      `defender-sql.md` edit turns the correspondence audit red. It does not:
#      `verb_roster.model_read_surfaces` globs `*/SKILL.md`, `*/execution.md`,
#      `gather/queries/**/*.md` and `*/verb-roster.md` — 51 surfaces, and this file is in none of
#      them (C13/G11, REFUTED, executed). This round therefore opens the ONE corpus write target
#      with no correspondence audit, no scaffold rule (FF-12) and no lane content rule (the sibling
#      lead-author lane has `_skills_content_rule`; the pitfalls lane has nothing). FK-2 is where
#      that lands. A demand written from the doc's sentence cannot go green.
#
#   2. U4 IS NOT INHERITED BY THE NEW PATH. The doc says "U4 unchanged — the deletion branch is
#      untouched, and the reducer surface inherits it." `_pitfalls_path_rule` checks `if "D" in xy`
#      LAST, after the shape and membership branches (C14/G14, executed), so a literal allowance
#      that RETURNS EARLY silently exempts the one path this round adds. The inheritance holds only
#      if the allowance FALLS THROUGH. `reducer_surface_deletion_refused` pins it; FK-1 owns the
#      rest of the decision (rename records, `??`/`R ` status shapes, the live bash `rm` grant).
#
#   3. N1's STATED FACT IS FALSE FOR HALF ITS POPULATION. "`∅.above-repeat-guard` rows stay dropped
#      at enqueue" is false for the ATTRIBUTED half, and `∅.repeat-trip` rows — never mentioned in
#      N1 — always carry a declared system by construction and are in the same position (C? / G12,
#      REFUTED, executed). Both classes already fold into that system's `execution.md` today. M5'
#      keys on `query_id == BASH_SHIM_QUERY_ID` so it neither causes nor fixes this. FK-8 owns
#      whether N1 is restated or the round widens — AND THE ANSWER FLIPS THE EXPECTED VALUE of
#      `nonshim_systemless_row_still_dropped`'s positive arm.
#
# STATE OF THIS ARTIFACT. Phase E has run: the gate leaf wrote `gate:`, §7 resolved all sixteen
# live decisions (five by the human — FK-1, FK-2, FK-3, FK-7, FK-8 — and eleven auto, plus the
# four demand forks F1-F4), and this phase assembled the suite at `defender/tests/test_870_*.py`
# and minted the ten demands 60-residue.md's open obligations and §7's auto-resolutions called
# for. Every `form: test` demand names a test that exists; every fork entry in `handoff.forks`
# carries the reading taken and its `resolved_by`. F3 is the one decision deliberately LEFT to
# write-code-from-spec, and `handoff.deviations` says so in the words of the phase that left it.
#
# ---------------------------------------------------------------------------
# NAME RECONCILIATION — the three coining passes, unified (phases/graph-gate.md)
#
# Grounding (`10-brief.md`), demand extraction (`20-demands.md`) and the dispositions
# (`45-dispositions.md`) coined ids independently, and #869's graph — the immediately preceding
# spec on this same lane — already owns stable ids for most of these objects. Keyed by role+origin:
#
#   * `pitfalls_queue` / `consumed_ledger` / `graveyard` — #869 modelled all three as ONE boundary,
#     `learning_queue`, whose payload facet actually described the CONSUMED row. This round's
#     demands address the three files separately (`interacts(run_pitfalls->pitfalls_queue)`,
#     `->consumed_ledger`, `->graveyard` all appear in one demand's binds), so the boundary is
#     SPLIT along the three roles the brief's R1 census names: `pitfalls.jsonl`,
#     `pitfalls.consumed.jsonl`, `pitfalls.deadletter.jsonl`. The brief calls the whole channel
#     `learning_queue` after the project profile's resource root; that root is the union of these
#     three plus findings/observations, and it is not a contract surface of its own here.
#   * `curator_agent` — the demands write `drives(run_pitfalls->pitfalls_curator)`; #869 coined
#     `curator_agent` for the same spawned agent (`pitfalls_curator` is the MODULE, which is also
#     the leg `run_pitfalls` lives in). Unified onto #869's `curator_agent`, because the module
#     name is already spent on the actors `run_pitfalls` / `_build_pitfalls_handoffs`.
#   * `pitfalls_handoff` — the demands write `interacts(run_pitfalls->pitfalls_curator).payload`
#     for the handoff list the curator is prompted with; that object is #869's `pitfalls_handoff`
#     boundary. Unified. (An id cannot be both the actor a `drives` edge lands on and the boundary
#     an `interacts` edge lands on without the graph carrying it twice.)
#   * `skills_tree`, `resolve_query_id`, `_pitfalls_path_rule`, `_skills_path_rule`,
#     `_is_system_name`, `consumed_category`, `loop_log`, `executed_queries_table`,
#     `declared_systems`, `run_pitfalls`, `_build_pitfalls_handoffs`, `rotate_pitfalls`,
#     `lead_author_run`, `lead_author_drain`, `commit_corpus`, `drain_retire`,
#     `collect_general_failures`, `gather_subagent`, `query_tool` — all carried FORWARD FROM #869
#     unchanged, so the two graphs diff against each other rather than degenerating to remove+add.
#   * AXES: #869 registered [tree_root, system, kebab, pitfall_id]. This graph keeps
#     `tree_root`, `system`, `pitfall_id`, drops `kebab` (no catalog path in this delta) and adds
#     `stderr_text` (the merge key's real coordinate — see `pitfall_key`) plus
#     `run_id` / `lead_id` / `query_index` (the queries-table row id template read off
#     `lead_extraction.py:120`). `stderr_digest` is registered as a DERIVATION of `stderr_text`,
#     never as an axis of its own, which is the formal statement of FK-13's over-merge.
#   * CLAIM IDS: the brief re-executed six inherited claims under its own G-ids. Per
#     `20-demands.md`'s own accounting the pair is ONE claim, unified on the doc's id: G1→C1,
#     G2→C7, G3→C10, G4→C8, G5→C9, and G6+G10 (the two halves) →C11. Each unified entry below
#     carries the brief's re-executed probe (the later, wider instrument) and names the G-id it
#     ran under. The other 17 G-claims, C12-C23 and PO-R1/PO-R2 are their own entries. 24 + 18 + 2
#     inputs, 7 absorbed → 37 ledger entries.
#
# ---------------------------------------------------------------------------
# DELTA — change kinds, assigned FROM THE DESIGN (rules.md, Procedure 1)
#
# There is no code diff to census: the implementation does not exist. Change kinds are read off
# the five mechanisms, and `provenance: design` marks delta membership. Walked over the guide-word
# grid so the no-ops are enumerated rather than silent:
#
#   M5' | MODIFY actor    `collect_general_failures` — a sentinel branch before the systemless guard
#       | MODIFY edge     interacts(collect_general_failures->pitfalls_queue) — the row's `system`
#       |                 is normalized to "" at collection, which MOVES the merge key
#       | ADD    edge     interacts(collect_general_failures->executed_queries_table) — the read that
#       |                 was always there in fact but is now the lane's routing input (FF-7)
#   M6  | ADD    boundary `reducer_surface` — defender/skills/gather/defender-sql.md gains its FIRST
#       |                 writer (G10: readers today = 1 model instruction, 1 prose mention, 1
#       |                 existence-only CI assertion; writers = none)
#       | MODIFY facet    pitfalls_handoff.payload — `execution_md_path` -> `path` + `surface`;
#       |                 `system` present on the system shape only (#0, provisional under F1)
#       | ADD    edge     interacts(run_pitfalls->reducer_surface) and its payload
#   M7  | ADD    facet    _pitfalls_path_rule.domain — the rule gains a branch, so its contract is
#       |                 no longer "execution.md only" and #869's facetless model no longer holds
#       | ADD    boundary `git_status_xy` — the status-shape domain M7's text does not enumerate
#   M8  | MODIFY actor    `_split_batch_by_membership` — its INPUT changes (F3: it cannot answer
#       |                 from `kept: set[str]` alone)
#   M9  | ADD    facet    graveyard.domain — three named reason classes where one false string stood
#       | MODIFY property consumed_category — `consumed_undeclared` -> `consumed_unattributable` (F4)
#   ----| REMOVE          NOTHING. The brief's census is explicit: "Nothing is deleted by this
#       |                 round. R5's removal question has no subject here." The ONE `mode: remove`
#       |                 edge below is `provenance: code` — the curator's PRE-EXISTING bash `rm`
#       |                 grant, which M7 makes reachable for a new path (FK-1c).
#
# ---------------------------------------------------------------------------

demands:

  # =====================================================================================
  # #0 — THE RETURN CONTRACT. Not a demand of its own: the handoff entry
  #      `_build_pitfalls_handoffs` returns is pinned by `handoff_entry_shape`, and it is
  #      simultaneously the curator's instruction, M8's partition input and U3's observable.
  #      Pinned reading (PROVISIONAL — fork F1):
  #        {"surface": "system",  "system": "elastic", "path": ".../elastic/execution.md", "failures": [...]}
  #        {"surface": "reducer",                      "path": ".../gather/defender-sql.md", "failures": [...]}
  #      `system` OMITTED (not "") on the reducer shape, ordering UNPINNED — the doc's jsonc shows
  #      the key absent and no sentence makes that normative. F1 IS NOW SETTLED (FK-9, auto):
  #      the key is OMITTED and the reducer entry sorts LAST, after the system entries' by-name
  #      order. `handoff_entry_shape` and `reducer_handoff_carries_no_system` assert both halves,
  #      and `run_pitfalls:225`'s bare subscript must stop being a bare subscript for either.
  # =====================================================================================

  # ---- M5' — the lane opens on the sentinel id (O3, O3b, U3) --------------------------

  - id: shim_row_enqueues_normalized
    kind: behavior
    form: test
    binds: [collect_general_failures, "interacts(collect_general_failures->pitfalls_queue).payload"]
    discharged_by: test_shim_row_enqueues_with_its_system_normalized
    source: "M5' / O3"
    docstring_seed: >-
      collect_general_failures over an agent-fixable ∅.bash-shim ExecutedLead carrying
      system='elastic' emits one queue row whose system is "" and whose query_id is the sentinel:
      the sentinel test is unconditional, so attribution succeeding does not change where the
      mistake belongs (F1), and the row is normalized where it is collected (F2).

  - id: unattributed_shim_row_enqueues
    kind: behavior
    form: test
    binds: [collect_general_failures, "interacts(collect_general_failures->pitfalls_queue).payload"]
    discharged_by: test_an_unattributed_shim_row_reaches_the_queue
    source: "M5' / O3"
    docstring_seed: >-
      The same lead with system='' also emits a row — the sentinel test runs BEFORE the systemless
      guard at lead_extraction.py:111, which drops it today (C10), so no ∅.bash-shim row from a
      reduce that opened no run payload has ever enqueued.

  - id: shim_rows_merge_to_one_record
    kind: behavior
    form: test
    fork: F2
    binds: [pitfall_key, merge_pitfalls, "pitfalls_queue.identity"]
    discharged_by: test_three_attributed_shim_failures_merge_to_one_mistake
    source: "M5' / F2 (C8/G4)"
    docstring_seed: >-
      Three ∅.bash-shim rows sharing one stderr_digest, collected from reduces attributed to
      elastic, cmdb and nothing, merge to ONE record with occurrences=3 — the collapse #840 exists
      for, which keying on the attributed system splits into three bullets of one lesson (C8).
    note: >-
      FORK F2 IS UNRESOLVED AND IT MOVES THIS DEMAND'S SEAM. The normalization is specified "at
      collection", which does not reach rows ALREADY queued under an attributed system — the
      population C10 shows reaching the queue today. If §7 decides the duplicates matter, the
      normalization moves to the handoff builder (or the merge key drops `system` for sentinel
      rows) and this demand binds a different address. Settled premise #35
      (`legacy_attributed_and_post_deploy_normalized_shim_records_stay_split_across_the_deploy_boundary`)
      instantiates the fork rather than creating a new one.

  - id: nonshim_systemless_row_still_dropped
    kind: negative
    form: test
    binds: [collect_general_failures, "interacts(collect_general_failures->pitfalls_queue)"]
    positive_control: shim_row_enqueues_normalized
    discharged_by: test_the_new_lane_admits_only_the_shim_sentinel
    source: "M5' / N1, RESTATED per FK-8 (resolved by §7)"
    docstring_seed: >-
      A systemless ∅.above-repeat-guard row and a systemless ordinary row still enqueue nothing:
      M5' opens one lane keyed on one sentinel, and N1's dispatch-level rejections stay
      unattributable — the mistake there is at least as likely to be evidence about us as about
      the agent. Driven alongside, as the negative control's own positive evidence (FK-8): the
      SAME sentinel carrying a DECLARED system — ∅.above-repeat-guard and ∅.repeat-trip both —
      still enqueues and folds into that system's execution.md, unchanged by this round. The
      lane's exception is the sentinel id, not the dispatch-level rejection class N1 names.
    rejected:
      - {nl: "admitting every sentinel row now that the systemless guard has an exception (N1)"}
      - {nl: "widening the round to also route the attributed half of ∅.above-repeat-guard / ∅.repeat-trip through the reducer lane — declined at FK-8"}
    note: >-
      FK-8 RESOLVED BY §7: do not widen. G12 (refuted, executed) showed N1's original sentence was
      false for the ATTRIBUTED half of `∅.above-repeat-guard` — and every `∅.repeat-trip` row,
      which always carries a declared system by construction — both of which already reach the
      queue and fold into that system's execution.md today, unaffected by M5'. N1 is RESTATED
      above rather than shipped as originally written; documenting the attributed halves' existing
      behavior in full is filed as its own issue (out of this round). The negative control is
      driven with the systemless case per the docstring; the positive attributed-sentinel case
      rides along in the same demand rather than becoming a second one.

  - id: infra_shim_failure_never_enqueues
    kind: negative
    form: test
    binds: [collect_general_failures, "interacts(collect_general_failures->pitfalls_queue)"]
    positive_control: shim_row_enqueues_normalized
    discharged_by: test_an_infra_shim_failure_never_reaches_the_queue
    source: "M5' / N9 (C20/G19)"
    docstring_seed: >-
      A ∅.bash-shim row from a reducer that exited EXIT_NO_RUNTIME carries error_class 'infra' and
      enqueues nothing, while the same row at exit 2 (→64) and exit 1 both enqueue: a broken
      deployment is not a lesson any corpus file should carry (N9, C20).

  - id: an_unmapped_shim_exit_does_not_teach
    kind: negative
    form: test
    binds: [collect_general_failures, "interacts(collect_general_failures->pitfalls_queue)",
            "interacts(_record_shim_failure->executed_queries_table)"]
    positive_control: shim_row_enqueues_normalized
    discharged_by: test_an_unmapped_shim_exit_does_not_teach
    source: "FK-15 (auto-resolved by §7) — the negative control beside infra_shim_failure_never_enqueues"
    docstring_seed: >-
      A reducer killed by a signal — exit 137, a code the translation table does not map —
      teaches nothing: its class is not `agent-fixable`, so no row reaches the queue. At this
      base `_shim_exit_code` returns an unmapped rc unchanged and `error_class_for_exit` calls
      everything non-zero outside `INFRA_EXIT_CODES` agent-fixable, so a kill is taught as a
      reduce mistake. Exit 2 and exit 1 ride in the same drive as positive controls.
    rejected:
      - {nl: "treating every unmapped exit as agent-fixable, which teaches a lesson from what may be a signal kill"}
    note: >-
      G19/C20 sampled exactly four codes {2, 1, 69, 0}; 137 is the unsampled remainder and the
      EXPECTED VALUE HERE IS §7's DECISION, not a probe's observation — no ledger claim covers
      what an unmapped code should do, and FK-15's resolution is what makes "does not teach"
      the contract. Whether `_shim_exit_code` or `error_class_for_exit` grows the case is the
      implementer's; the demand observes the row, not the table.

  - id: model_spelled_shim_id_does_not_route
    kind: negative
    form: test
    binds: [resolve_query_id, _build_pitfalls_handoffs, "interacts(run_pitfalls->reducer_surface)"]
    positive_control: reducer_handoff_names_the_surface
    discharged_by: test_no_model_supplied_query_id_reaches_the_reducer_surface
    source: "U3 (C1/C15/G1)"
    docstring_seed: >-
      U3's break attempt: for every model-supplied query_id in {'∅.bash-shim',
      '∅.above-repeat-guard', '∅', '∅.BASH-SHIM', '../x', '', None} the value recorded on the row
      is the untagged 'elastic.esql', and for the near-miss 'elastic.bash-shim' — which
      resolve_query_id passes through VERBATIM (C15) — the row is routed as an ordinary elastic
      pitfall, never to the reducer surface. The routing key is equality with BASH_SHIM_QUERY_ID,
      not a suffix, a substring or an is_sentinel test alone.

  - id: reducer_handoff_names_the_surface
    kind: behavior
    form: test
    binds: ["interacts(run_pitfalls->reducer_surface)", _build_pitfalls_handoffs]
    discharged_by: test_a_genuine_shim_row_yields_the_reducer_handoff
    source: "M5'/M6 — O3b"
    docstring_seed: >-
      A queue holding one genuine ∅.bash-shim row produces exactly one handoff entry, with
      surface='reducer' and path='defender/skills/gather/defender-sql.md' — the file
      skills/gather/SKILL.md:141 instructs the subagent to Read before it writes the SQL, which is
      the same before-the-attempt criterion that put system pitfalls in execution.md.
    rejected:
      - {nl: "skills/gather/failure-modes.md — read after a bad result, not before the attempt"}

  - id: e2e_reducer_failure_reaches_the_surface
    kind: behavior
    form: test
    binds: [run_investigation, run_pitfalls, "interacts(run_pitfalls->reducer_surface)",
            "interacts(gather_subagent->reducer_surface)", "reducer_surface.access[read-tool]"]
    discharged_by: test_e2e_a_failed_reducer_pipe_becomes_a_reducer_handoff
    source: "O3's own oracle"
    docstring_seed: >-
      O3's own oracle, end to end: a replay run whose gather lane fails a terminal
      `cat <payload> | defender-sql …` leaves a ∅.bash-shim row in the pitfalls queue, and the next
      curation tick hands the curator a handoff whose path is the reducer surface. Asserted on the
      queue row AND the handoff target — "the drop counter is 0" would pass a build that never
      wrote the row.
    note: >-
      THE ONE REPLAY-DRIVEN DEMAND, and it crosses the process boundary FF-7 names: the row is
      written by the runtime process and read by the learning process with NO import edge between
      them. THE THRESHOLD IS PART OF THE ORACLE, not a fixture detail: FK-3 is resolved, so the
      scenario drives THREE failing reduces of one unchanging diagnosis — one merged record,
      `occurrences=3` — which clears a threshold of 3 on its own. Under the record-counting
      reading it never could and this demand was unreachable end to end, which is what made FK-3
      a decision about whether the lane fires at all. PHASE E ALSO CLOSED G23 HERE: the last arm
      drives the gather role's REAL read gate, compiled against the tree the tick committed into,
      as a break attempt with a positive control — the committed lesson is readable and the paths
      outside the corpus are not. O3's own reachability claim is executed rather than believed.

  # ---- M6 — one reducer surface, and a prompt that knows about it (O3b, N7, #0) -------

  - id: attributed_shim_row_routes_to_reducer
    kind: behavior
    form: test
    binds: [_build_pitfalls_handoffs, "interacts(run_pitfalls->reducer_surface)"]
    discharged_by: test_an_attributed_shim_row_is_never_taught_as_a_systems_mistake
    source: "M6 / F1 (C10)"
    docstring_seed: >-
      A queued row carrying system='elastic' AND query_id='∅.bash-shim' — the population that
      reaches the queue TODAY (C10) — produces no failure entry under
      defender/skills/elastic/execution.md and appears under the reducer entry instead. O3b's
      oracle: the partition key is query_id, unconditionally, so the doc's system=="" routing would
      have left this mis-routing live (F1).

  - id: reducer_handoff_carries_no_system
    kind: negative
    form: test
    fork: F1
    binds: ["interacts(run_pitfalls->reducer_surface).payload"]
    positive_control: attributed_shim_row_routes_to_reducer
    discharged_by: test_the_reducer_handoff_names_no_system
    source: "M6 / N7"
    docstring_seed: >-
      Driven with shim rows attributed to elastic and cmdb, no part of the reducer handoff — the
      entry or any of its failures — carries either name: N7 declines the attribution at the shape
      seam, and the attribution survives in the run's executed_queries table anyway.
    rejected:
      - {nl: "carrying the attributed system onto the reducer handoff — it would also require re-keying pitfall_key (F2/N7)"}
    note: >-
      FORK F1 IS SETTLED (FK-9, auto): the reducer entry OMITS the `system` key. This demand
      asserts BOTH grains — the value grain ("names no system", over the entry and its failures)
      and the KEY grain (`"system" not in entry`) — and
      `run_pitfalls:225`'s bare subscript `kept = {h["system"] for h in handoffs}` (FF-3/G15)
      KeyErrors on the omitted-key reading, so M6 and M8 cannot land independently of that line
      whichever way it goes.

  - id: handoff_entry_shape
    kind: shape
    form: test
    fork: F1
    binds: ["interacts(run_pitfalls->pitfalls_handoff).payload", _build_pitfalls_handoffs]
    discharged_by: test_every_handoff_entry_carries_surface_and_path
    source: "#0"
    docstring_seed: >-
      Over a mixed batch, every handoff entry carries a 'surface' of 'system' or 'reducer' and a
      'path'; no entry carries 'execution_md_path'; only the system shape carries 'system'; and
      each entry's failures keep the five keys query_id / goal / executed_query / stderr_digest /
      occurrences.
    note: >-
      ADDRESS RECONCILED: the extraction wrote `interacts(run_pitfalls->pitfalls_curator).payload`;
      the object is #869's `pitfalls_handoff` boundary, and `pitfalls_curator` is spent on the
      spawned agent that a `drives` edge lands on (see NAME RECONCILIATION). F1 owns both the
      `system`-key question and the ORDERING, which this demand does not assert.

  - id: at_most_one_reducer_entry
    kind: uniqueness
    form: test
    binds: ["interacts(run_pitfalls->reducer_surface)", _build_pitfalls_handoffs]
    discharged_by: test_many_reducer_mistakes_share_one_handoff_entry
