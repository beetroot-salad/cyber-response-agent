    observed: "all four match. The pattern is `<resolved skills dir>/[^\\x00]*\\.md` — no depth or segment narrowing (build_scoped_write_allow, which would narrow, is not the builder this role uses)"
    verdict: holds
    disposition: "Feeds reducer_surface.access[write-tool] and FK-14: any identity disagreement between this grant and _pitfalls_path_rule is a bypass, not a defence-in-depth gap."

  - id: G14
    kind: behavior
    claim: "_pitfalls_path_rule refuses a deletion only in its LAST branch, after both refusals M7's literal allowance must precede."
