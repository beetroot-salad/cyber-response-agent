claims:

  # ---- inherited from the design doc, re-executed by the brief, unified on the doc's id ----

  - id: C1
    source: discuss
    kind: reachability
    claim: >-
      A model-supplied query_id cannot spell a reserved `∅.` sentinel, so routing the reducer lane
      on BASH_SHIM_QUERY_ID cannot be steered by the model.
