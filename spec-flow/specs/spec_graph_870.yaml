# THE LEDGER. 37 entries: 6 inherited-and-unified (C1, C7-C11), 17 brief-only (G-ids),
# 12 raised at extraction (C12-C23), 2 from the re-grounding probes (PO-R1, PO-R2).
#
# ALL FIVE INSTRUMENT FINDINGS WERE PAID DOWN AT PHASE E, NOT CARRIED. `spec-graph claims`
# gates `probe_kind` against `kind`, and behavior/primitive/reachability demand `executed`:
#   * G14 and C22 — `behavior`, closed on `read`. RE-RUN EXECUTED on their own terms. G14's new
#     probe is a branch-CLASSIFIED matrix (which branch raised, not merely that one did), which
#     is strictly wider than C14's and is the instrument FK-1's fall-through question needs.
#   * G23 and C21 — `reachability`, closed on `read`. RE-RUN as executed break attempts with
#     positive controls. G23's drive is also the last arm of the e2e demand; C21's covers the
#     UNATTRIBUTED arm C10 could not reach.
#   * G15 — `behavior`, closed on `read`, and now `verdict: deferred`. Its sentence predicts a
#     runtime outcome (a KeyError on a system-less reducer handoff) over an input that does not
#     exist until M6 lands, so no probe at this base can run it. It transfers to
#     write-code-from-spec (`handoff.deferred`); no spend-point cites it, and six tests drive
#     `run_pitfalls` over a batch containing a shim row, so a bare subscript at :225 fails them.
# PO-R1/PO-R2 arrived typed `kind: is-question`, which is not in the schema's closed vocabulary;
# both are claims about what existing code does over an input and are typed `behavior` here, with
# the re-typing recorded on each entry. PO-R1's spoofing half reads as a break-attempt whose
