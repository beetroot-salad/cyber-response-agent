     outcome: {nl: "WAIVED at the §7 seam. Whether the shipped clerk prompt and the invlang row grammar survive a substitution to either documented alternative is a LIVE-MODEL integration question this suite's architecture does not answer either way: the deterministic fakes stand in for the model response regardless of which model the knob names, so a green suite would say nothing and a red one would say nothing. A later live-model eval pipeline can still probe it; nothing structural is foreclosed. An operator switching off the shipped default should treat per-model prompt robustness as unvalidated."},
     cites: [C14, C31, C20],
     binds: ["DEFENDER_CLERK_MODEL.domain.alternatives[kimi-k2.6]",
             "DEFENDER_CLERK_MODEL.domain.alternatives[deepseek-v3]"],
     rejected: [{nl: "a suite arm per alternative — it would exercise the fake, not the model, and read as coverage of exactly the thing it cannot reach."}]}

  # AR-1 — the stamp reader's site, and the foreign-id refusal [47] owes on its own.
  - {id: d_document_state_at_refuses_a_foreign_message_id, minted_from: "AR-1 / premise [47]",
     kind: negative, form: test,
     discharged_by: test_996_document_state_at_refuses_a_foreign_message_id,
     binds: [document_state_at, "interacts(document_state_at->session_store)",
             "interacts(document_state_at->document_state)", "session_store.identity"]}

  # AR-2 — `fence_count` is the truncation authority; `byte_len` is demoted.
  - {id: d_byte_len_is_diagnostic_only, minted_from: AR-2, kind: negative, form: test,
     discharged_by: test_996_fence_count_is_the_truncation_authority_and_byte_len_is_diagnostic,
     binds: ["interacts(store_handle->document_state).payload", document_state_at,
             seed_investigation]}

  # AR-3 — a model close over a non-empty queue.
  - {id: d_model_close_refused_while_pending_is_non_empty, minted_from: AR-3, kind: behavior,
     form: test,
     discharged_by: test_996_a_model_close_is_refused_while_pending_is_non_empty,
     binds: ["interacts(close_investigation->investigation_md).response", pending,
             "interacts(close_investigation->main_facing_text)"]}

  # AR-4 — every clerk-call fault shape but the one the design names, plus the deadline.
  - {id: d_every_clerk_call_fault_pends_at_either_call_site, minted_from: AR-4, kind: behavior,
     form: test,
     discharged_by: test_996_a_fault_at_either_clerk_call_site_pends_the_prose,
     binds: ["interacts(clerk_caller->clerk)", "interacts(clerk_caller->clerk).response", pending,
             "drives(record->fix_row)"]}
  - {id: d_a_clerk_call_deadline_pends_like_a_fault, minted_from: AR-4, kind: behavior, form: test,
     discharged_by: test_996_a_clerk_call_that_never_returns_pends_like_a_fault,
     binds: ["interacts(clerk_caller->clerk)", pending, "interacts(main->record_receipt)"]}

  # AR-5 — the config half cluster M left open.
  - {id: d_a_missing_clerk_prompt_asset_aborts_at_startup, minted_from: AR-5, kind: behavior,
     form: test,
     discharged_by: test_996_a_missing_clerk_prompt_asset_aborts_at_startup,
     binds: [clerk_instructions, "interacts(clerk_caller->clerk_instructions)"]}

  # AR-6 — the trace's own failure.
  - {id: d_the_trace_append_is_best_effort, minted_from: AR-6, kind: behavior, form: test,
     discharged_by: test_996_the_trace_append_never_fails_a_record,
     binds: ["interacts(clerk_caller->clerk_trace)", "interacts(main->record_receipt)",
             "interacts(record->investigation_md)"]}

  # AR-7 — D7's missing classification arm, in three sentences.
  - {id: d_a_diagnosticless_refusal_surfaces_and_holds, minted_from: AR-7, kind: behavior, form: test,
     discharged_by: test_996_a_refusal_with_no_diagnostic_surfaces_and_holds_the_block,
     binds: ["interacts(record->investigation_md).response", "interacts(main->record_receipt)",
             pending]}
  - {id: d_a_mixed_refusal_converges_per_round, minted_from: AR-7, kind: behavior, form: test,
     discharged_by: test_996_a_mixed_refusal_converges_to_a_judgment_stop_per_round,
     binds: ["interacts(clerk_caller->clerk)", structural_diagnostics, judgment_diagnostics]}
  - {id: d_structural_owns_the_no_companion_early_return, minted_from: AR-7, kind: parity, form: test,
     discharged_by: test_996_structural_owns_the_no_companion_early_return,
     binds: [diagnose, structural_diagnostics, judgment_diagnostics,
             "drives(diagnose->structural_diagnostics)"]}
  - {id: d_partition_halves_are_disjoint, minted_from: "phase E (author-raised)", kind: parity,
     form: test,
     discharged_by: test_996_a_judgment_line_is_never_in_the_structural_half,
     binds: [structural_diagnostics, judgment_diagnostics,
             "drives(diagnose->judgment_diagnostics)"]}

  # AR-8 — the repair verb's own refusal, and the escape.
  - {id: d_a_fix_row_refusal_ends_the_round_with_a_named_reason, minted_from: AR-8, kind: behavior,
     form: test,
     discharged_by: test_996_a_fix_row_refusal_ends_the_round_with_a_named_reason,
     binds: ["drives(record->fix_row)", "interacts(main->record_receipt)"]}
  - {id: d_an_unrepairable_row_names_the_forced_close_escape, minted_from: AR-8, kind: behavior,
     form: test,
     discharged_by: test_996_an_unrepairable_row_names_the_forced_close_escape,
     binds: ["interacts(record->main_facing_text)", "interacts(main->record_receipt)",
             "disposition.domain.distinguished[unresolved]"]}

  # AR-9 — the S6-dropped block's disposal.
  - {id: d_a_dropped_conclude_block_is_held_on_pending, minted_from: AR-9, kind: behavior, form: test,
     discharged_by: test_996_a_dropped_conclude_block_is_held_on_pending,
     binds: [pending, "interacts(clerk_caller->clerk).payload"]}

  # AR-13 — O1 against flow 1.1.
  - {id: d_main_sees_a_repair_outcome_not_the_raw_refusal, minted_from: AR-13, kind: negative,
     form: test,
     discharged_by: test_996_main_sees_a_repair_outcome_not_the_raw_gate_refusal,
     binds: ["interacts(main->record_receipt)", "interacts(record->investigation_md).response",
             flagged_write_refusal]}

  # AR-14 — S2 overclaims; the boundary is stated and the relay is CAPPED, not filtered.
  - {id: d_clerk_text_relayed_to_main_is_length_capped, minted_from: AR-14, kind: behavior, form: test,
     discharged_by: test_996_clerk_text_relayed_to_main_is_length_capped,
     binds: ["interacts(record->record_receipt).payload", "interacts(main->record_receipt)",
             last_gaps]}

  # AR-18 — the re-hand tells the clerk the prose may already be compiled. A PROMPT guarantee.
  - {id: d_the_rehand_says_the_prose_may_already_be_compiled, minted_from: AR-18, kind: behavior,
     form: clause,
     outcome: {nl: "On a re-hand the clerk is given the document so far AND an explicit instruction that the pended prose may already be compiled in it. The sharp case is a call that had already committed rows moments before the transport failed: the fault pends the prose with no awareness of what the document contains, and the re-hand would otherwise treat every pended entry as uncompiled by definition. Stated honestly, this is a PROMPT guarantee and not a runtime one — it turns the duplicate-row outcome into something the validation run can measure rather than a silent structural failure."},
     binds: [clerk_instructions, "interacts(clerk_caller->clerk).payload", pending],
     rejected: [{nl: "tracking committed row ids per pended prose — a second mechanism beside the queue, and one whose bookkeeping the fault path is by construction unable to complete."}]}

  # ---- KNOWN-RED BY DESIGN (spine-decisions.md). Owed for `main`'s shape. Both demands are
  # GREEN at `7fa49f04` once the port lands and go RED only at the rebase onto `main`, so they
  # are marked `known_red:` for that reason and not for being unrunnable here. ----------------
  - {id: d_judgment_partition_dedups_grounding_on_main, minted_from: "F-BASE / C36 refuted (G8, F6)",
     known_red: "GREEN at this base once the split lands; RED at `main` (13dcde51). `main:294` runs `_check_authz_row_grounding`
       in the STRUCTURAL region and `:307-308` emits `gated` filtered against `already = set(grounding)`,
       so `diagnose != structural + judgment` byte-for-byte there, and grounding lines that are
       positionally structural but need a MAIN-held fact would be retried every round — the exact
       refusal D7 exists to stop. Clean at this base, which is why the sibling parity demand passes here.",
     kind: parity, form: test,
     discharged_by: test_996_the_judgment_partition_survives_mains_grounding_dedup,
     binds: [diagnose, structural_diagnostics, judgment_diagnostics,
             "drives(diagnose->judgment_diagnostics)"]}
  - {id: d_entry_price_helper_forced_parameter_on_main, minted_from: "F-BASE / G12",
     known_red: "GREEN at this base once the split lands; RED at `main` (13dcde51). `_refuse_if_entry_price_is_owed` gains a
       `forced=` parameter and a `raise ModelRetry` inside itself on main, so mechanism 2's
       insertion point (immediately after a call it describes as return-and-inspect) moves and a
       model close never reaches it. What a framework-forced close observes there is unstated.",
     kind: behavior, form: test,
     discharged_by: test_996_the_conclude_gate_still_runs_when_the_price_helper_takes_forced,
     binds: ["drives(close_investigation->entry_price)",
             "interacts(close_investigation->investigation_md)",
             "disposition.domain.distinguished[unresolved]"]}

  # ---- deliberately deferred to prose (`form: clause` — each leaves its obligation open) ----
  - {id: clerk_never_fills_an_open_slot, kind: behavior, form: clause,
     outcome: {nl: "No row the clerk writes fills a slot MAIN's prose left open: the clerk writes `??` or the candidate set the prose names, and a slot it could not settle becomes a GAP in the receipt."},
     binds: [clerk_instructions, "interacts(clerk_caller->clerk).response"],
     rejected: [{nl: "the issue's fix #3 as written — every fact the prose OR A GATHER SUMMARY grounds becomes a row — which would hand slot-settling judgment to the clerk (D1, re-scoped by v2's P16)."}]}
  - {id: rows_are_attributed_to_main, kind: behavior, form: clause,
     outcome: {nl: "Rows the clerk lands are attributed to MAIN by every downstream reader — `deps.authored_paths`, the review projector, the grader — because a row is MAIN's assertion compiled; `clerk_trace.jsonl` is the provenance."},
     binds: ["interacts(record->investigation_md)", "interacts(clerk_caller->clerk_trace)"],
     rejected: [{nl: "a separate clerk attribution on the row itself — considered and kept as-is (v2:61, review finding 13)."}]}
  - {id: compaction_apply_writes_notes_the_port, kind: coherence, form: clause,
     outcome: {nl: "`compaction.apply_writes` is unchanged, and its docstring records that under the port MAIN's `record` calls carry prose only, so the clerk's rows are not reconstructible from the transcript."},
     binds: ["interacts(compaction->main_transcript)"],
     rejected: [{nl: "making `scripts/testing/compaction_dryrun.py` clerk-aware (v2:65)."}]}
  - {id: rows_not_reconstructible_from_the_transcript, kind: survival, form: clause,
     outcome: {nl: "Nothing in production rebuilds `investigation.md` from MAIN's transcript once `record` carries prose only: `fence_count_at` is deleted and `compaction.apply_writes` has no production caller."},
     binds: ["interacts(compaction->main_transcript)", frontier_at_branch, main_transcript]}
  - {id: validation_run_bar, kind: behavior, form: clause,
     outcome: {nl: "Before merge, a GLM 5.3 Flash clerk at n=6 on both fixtures shows no `benign` close on F2, F1 correct at least at the current arm's rate, whole-run cost at most 0.6x current, and the F2 benign attempts and refusals recounted from the wire logs so the zero-false-negative result is shown to survive D1, D5 and D7."},
     binds: [clerk_instructions, DEFENDER_CLERK_MODEL]}
  - {id: glm_refuses_effort_none, kind: domain-outcome, form: clause,
     outcome: {nl: "One live call re-verifies that `glm-5p3-flash` refuses `reasoning_effort=none`, which is why the clerk's shipped effort is `low`."},
     binds: ["DEFENDER_CLERK_EFFORT.domain.distinguished[none]"]}
  - {id: neighbours_unchanged, kind: survival, form: clause,
     outcome: {nl: "Gather, the challenge review, `report.md` rendering and the learning pipeline complete unchanged: the `:T conclude` consumers — the close's ceiling receipts, the review projector's companion keys, the learning comparator — still read what the clerk now authors."},
     binds: ["interacts(review_projector->investigation_md)",
             "interacts(learning_compare->investigation_md)",
             "interacts(close_investigation->investigation_md)"]}

structure:
  # The registry. `20-demands.md` and `45-dispositions.md` coined `run_dir`, `session_id` and
  # `message_id` independently; `case_id`, `agent_id`, `seq`, `record_call` and `model_name` join
  # them here — see NAME RECONCILIATION above. Every `key_axes`/`interpolates` member is one of these.
  axes: [run_dir, case_id, session_id, agent_id, seq, message_id, record_call, model_name]

  actors:
    # --- the legs the design introduces --------------------------------------------------
    - {id: record,                 frame: leg,         provenance: design} # runtime/tools/_clerk.py::record (the new MAIN verb)
    - {id: clerk_caller,           frame: composition, provenance: design} # runtime/clerk.py::ClerkCaller — fans the round loop
    - {id: store_handle,           frame: leg,         provenance: design} # session_store.py::StoreHandle.append, gains the stamp
    - {id: document_state_at,      frame: leg,         provenance: design} # session_store.py::document_state_at (new reader)
    - {id: structural_diagnostics, frame: leg,         provenance: design} # validate/__init__.py::structural_diagnostics
    - {id: judgment_diagnostics,   frame: leg,         provenance: design} # validate/__init__.py::judgment_diagnostics
    # --- existing legs whose SEMANTICS the design alters (rules.md Procedure: `modify`) ----
    - {id: close_investigation,    frame: leg,         provenance: design} # runtime/close_tool.py — gains the conclude gate
    - {id: entry_price,            frame: leg,         provenance: design} # close_tool.py::_refuse_if_entry_price_is_owed (:436)
    - {id: circuit_breaker,        frame: leg,         provenance: design} # runtime/circuit_breaker.py:174-186 (D15 rewrite)
    - {id: budget_enforcer,        frame: leg,         provenance: design} # hooks/budget_enforcer.py:34,37,266
    - {id: orient,                 frame: leg,         provenance: design} # runtime/orient.py:87,174,176 — drops the grammar
    - {id: seed_investigation,     frame: leg,         provenance: design} # runtime/branch/_seed.py::seed_investigation
    - {id: frontier_at_branch,     frame: leg,         provenance: design} # runtime/branch/_frontier.py::frontier_at_branch (:330)
    - {id: learning_branch_cli,    frame: composition, provenance: design} # learning/branch/cli.py:1297
    - {id: replay_harness,         frame: composition, provenance: design} # tests/e2e/_replay_harness.py:272,436,537
    - {id: run_investigation,      frame: composition, provenance: design} # runtime/driver/__init__.py — gains `clerk=`
    - {id: visualize_messages,     frame: leg,         provenance: design} # scripts/visualize/visualize_messages.py:14,188,192
    - {id: visualize_data,         frame: leg,         provenance: design} # scripts/visualize/visualize_data.py:160,169
    - {id: model_key,              frame: leg,         provenance: design} # scripts/pricing.py::model_key (:19-30)
    - {id: preflight_role_models,  frame: leg,         provenance: design} # run.py::preflight_role_models (:184-211)
    - {id: validator_state,        frame: leg,         provenance: design} # validate/_state.py:1081-1088
    - {id: validator_gating,       frame: leg,         provenance: design} # validate/_gating.py:154-187,218,666-676
    - {id: validator_closure,      frame: leg,         provenance: design} # validate/_closure.py:168-180
    - {id: validator_structure,    frame: leg,         provenance: design} # validate/_structure.py:363-370,546-550 (G5)
    - {id: validator_predictions,  frame: leg,         provenance: design} # validate/_predictions.py:96-98 (G5)
    # --- the grounded neighborhood (10-brief.md): co-writers, siblings, consumers ----------
    - {id: main,                   frame: composition, provenance: code}   # the MAIN agent — drives `record` over many turns
    - {id: append_block,           frame: leg,         provenance: code}   # tools/_document.py::_tool_append_block (:237, write :284)
    - {id: fix_row,                frame: leg,         provenance: code}   # tools/_document.py::_tool_fix_row (:532, write :643)
    - {id: write_file,             frame: leg,         provenance: code}   # tools/_files.py::_tool_write_file — LATENT (F16)
    - {id: edit_file,              frame: leg,         provenance: code}   # tools/_files.py::_tool_edit_file — LATENT (F16)
    - {id: lead_zero,              frame: leg,         provenance: code}   # lead_zero/_capture.py::_declare_l_finding (:347)
    - {id: diagnose,               frame: leg,         provenance: code}   # validate/__init__.py::diagnose (:255-298)
    - {id: check_vocab_class_cells, frame: leg,        provenance: code}   # validate/_structure.py — 7fa49f04's OWN gate ([27])
    - {id: selection_ingest,       frame: leg,         provenance: code}   # runtime/selection.py::ingest (:100, append :122)
    - {id: fold_frontier,          frame: leg,         provenance: code}   # runtime/selection.py:76 — synthesized fold row
    - {id: correlation_inject,     frame: leg,         provenance: code}   # driver/_build.py:357 — synthesized correlation row
    - {id: gather_recorder,        frame: leg,         provenance: code}   # driver/_build.py:411-413
    - {id: run_end_flush,          frame: leg,         provenance: code}   # driver/__init__.py:203-204
    - {id: selection_render,       frame: leg,         provenance: code}   # runtime/selection.py::render -> hydrate(role="send")
    - {id: observe_write_trace,    frame: leg,         provenance: code}   # runtime/observe.py::write_trace
    - {id: request_logger,         frame: leg,         provenance: code}   # runtime/observe.py::RequestLogger
    - {id: compaction,             frame: leg,         provenance: code}   # runtime/compaction.py::apply_writes (:248, literal :262)
    - {id: review_projector,       frame: leg,         provenance: code}   # runtime/review/projector.py::parse_investigation
    - {id: learning_compare,       frame: leg,         provenance: code}   # learning/pipeline/judge/compare.py:59
    - {id: lessons_frontier,       frame: leg,         provenance: code}   # scripts/lessons/lessons_frontier.py:729
    - {id: narration_crosscheck,   frame: leg,         provenance: code}   # learning/lead_repository.py::narration_crosscheck_from_run
    - {id: provider_for,           frame: leg,         provenance: code}   # runtime/providers/__init__.py::provider_for (:46-57)
    - {id: grant_gate,             frame: leg,         provenance: code}   # the compiled-policy audit over `_all_policies` (F12)
    - {id: verb_roster_audit,      frame: leg,         provenance: code}   # verb_roster.model_read_surfaces (:122) — F18

  boundaries:
    # ===== the document, the store, and the stamp =========================================
    - id: investigation_md
      provenance: code
      facets:
        identity:
          key_axes: [run_dir]
          evidence: {nl: "`<run_dir>/investigation.md`, no interpolation, one document per run — read off `_run_paths.py:124-125` (`RunPaths.investigation`) and confirmed by `spec-graph trace resource investigation_md` in this worktree (G2: six writer symbols, seven call sites)."}
          derivations: []
          sharing: serialized-append
    - id: session_store
      provenance: code
      facets:
        identity:
          key_axes: [case_id, session_id, agent_id, seq]
          evidence: {nl: "the DDL's only uniqueness constraint is `UNIQUE (session_id, agent_id, synthesized, seq)` (session_store.py:128-138), over one `<runs_base>/../sessions/<case>.db` per case; `seq` is recomputed `MAX(seq)+1` per insert (`_next_seq`, :603-609) — read verbatim by PO-4."}
          derivations: []
          sharing: serialized-append
    - id: document_state
      provenance: design
      facets:
        identity:
          key_axes: [message_id]
          evidence: {nl: "v2:74 — one row per `kind='request'` message of the main session, keyed on that message's id. PO-4 (executed) establishes the floor this key sits on: the `message` table it borrows discipline from has NO id-keyed uniqueness constraint, so re-entrancy today rests entirely on `ingest()`'s `last_render_len` length slice, not on the DB."}
          derivations: []
          sharing: unique-key
        payload:
          parts:
            - {role: stamp, source: const:DOCUMENT_READER_TUPLE}
          invariants: [all-slots-bound]
          nl: "two integers and nothing else — `(byte_len, fence_count)` read from the document before `BEGIN IMMEDIATE` and inserted in the same transaction (S5: the table carries no document content)."
    - id: document_reader
      provenance: design
      facets: {}
    # ===== the clerk seam and its trace =====================================================
    - id: clerk
      provenance: design
      facets:
        payload:
          parts:
            - {role: system, source: const:CLERK_INSTRUCTIONS}
            - {role: user,   source: template:CLERK_TURN, slots: {grammar: invlang_grammar_block, document: investigation_md, pending: pending, gaps: last_gaps}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the clerk's turn: grammar + catalog, the document so far, `pending` (each prose with its held block and owed lines), this prose, `last_gaps`, and on a retry the refusal. Nothing else (D5) — and no gather summary or raw bytes (S2)."
    - id: clerk_trace
      provenance: design
      facets:
        identity:
          key_axes: [run_dir, record_call]
          evidence: {nl: "v2:76 — `<run_dir>/wire_logs/clerk_trace.jsonl`, one row per `record` call, `n` counting calls within the run. The throwaway wrote it at the RUN ROOT (`_clerk.py:156`, G22/F13); D4/S4 relocate it under `wire_logs/`, which is what earns it the existing `names_wire_log_dir` component deny."}
          derivations: [{value: n, fn_of: record_call, injective: true}]
          sharing: serialized-append
        payload:
          parts:
            - {role: row, source: const:CLERK_TRACE_ROW}
          invariants: [all-slots-bound]
          nl: "{n, phase_header, repair_rounds, rounds, refusals[], stopped_on_judgment, held, gaps[], prose_chars, rows_chars, committed, pending, ids[]} — the only provenance binding a landed row to the clerk that compiled it."
        access:
          constraints_by_via:
            bash:      {trust: derived, constraints: [names_wire_log_dir-component-deny]}
            read-tool: {trust: derived, constraints: [names_wire_log_dir-component-deny]}
    - id: llm_requests
      provenance: code
      facets:
        identity:
          key_axes: [run_dir, agent_id]
          evidence: {nl: "`<run_dir>/wire_logs/llm_requests.jsonl`, rows keyed by `agent_id`; the existing namespaces are published at `agent_role.py:42-43` (`gather:`, `review:`) and NO `CLERK` symbol exists at this base (G22). O5 adds `clerk:{n}`."}
          derivations: []
          sharing: serialized-append
    - id: clerk_seam
      provenance: design
      facets:
        # CLUSTER N, ANSWERED BY THE HUMAN AT §7 (HD-1). Mechanism 5 says
        # `run_investigation(clerk=…)` "mirrors `review_stages=`", and G19/F9 showed the two
        # candidate seams behaving OPPOSITELY: `review_stages` is always defaulted to a fake
        # (`_replay_harness.py:537`) while `store_factory` is left `None` (:436). The gate called
        # this the one hole blocking the SUITE rather than a test — under the second shape every
        # existing replay scenario starts making live provider calls the moment `record` is
        # registered. THE READING TAKEN: mirror `review_stages` exactly.
        access:
          constraints_by_via:
            harness:    {trust: operator, constraints: [scripted-clerk-default]}
            production: {trust: operator, constraints: [live-clerk-caller-built]}
    # ===== the receipt and MAIN's two text surfaces =========================================
    - id: record_receipt
      provenance: design
      facets:
        payload:
          parts:
            - {role: repair,   source: const:REPAIR_LINE}
            - {role: appended, source: const:APPEND_BLOCK_RETURN}
            - {role: outcome,  source: const:OUTCOME_LINE}
            - {role: flagged,  source: template:FLAGGED_SECTION, slots: {diagnostics: flagged_write_refusal}}
