# visualize_run.py's by-model cost breakdown does not yet call clerk_cost_by_model, so a run's
# HTML summary omits the clerk's spend from that one table (report.md's own accounting is
# unaffected — see lint_vulture_baseline.json's annotation on clerk_cost_by_model). Waived
