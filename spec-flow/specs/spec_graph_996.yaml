# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. MAIN loses the invlang grammar and both document verbs and gains ONE verb,
# `record`, that takes prose. Inside `record`, a zero-grant CLERK role compiles that prose into
# invlang rows and lands them through the existing `_tool_append_block` writer with MAIN's own
# deps; a repair round drives `_tool_fix_row` first when a warn window is open; a round loop
# (budget 6) retries structural refusals and STOPS on a judgment-only refusal, holding the block
# on `pending`. One receipt string carries the ordered sections back to MAIN. Beside the flow:
# `StoreHandle.append` stamps a `document_state` row (byte_len, fence_count) per MAIN request
# row, which replaces the transcript walk branch/resume used to reconstruct the document with;
# the close gains a conclude gate; a `clerk_trace.jsonl` lands under `wire_logs/`; the model
# gains a pricing row and a Fireworks alias.
#
# WHAT PHASE D DID, AND WHAT IT DELIBERATELY DID NOT DO.
#
#   1. THE FORKS ARE UNRESOLVED AND STAY UNRESOLVED HERE. `45-dispositions.md` dispositioned 87
#      premises into 16 settled, 42 forks, 29 silent branches, 0 drops, and collapsed the open
#      ones into clusters A-Z; the human seam (§7) runs AFTER the gate. This file represents the
#      still-open ones the way 947 did — as structure whose cells no demand answers (`pending`'s
#      `unbounded` alternative with `crosses_validation: unknown` is cluster I; `clerk_seam`'s two
#      access vias with `constraints: unknown` are cluster N; `DEFENDER_CLERK_MODEL`'s two
#      documented alternatives are v2:64's untuned models) and as `handoff.forks` entries. NO
#      READING WAS PICKED for any of them. An unanswered R3/R4/R0 cell below is a fork made
#      mechanical, not an oversight.
#
#   2. THE TEN RE-GROUND PROBES ARE FOLDED IN AS FACT, NOT AS OPEN QUESTIONS. `46-probes-a.md`
#      and `46-probes-b.md` executed PO-1..PO-10 against live code at this base. Where a probe
#      settles something, THIS ARTIFACT CARRIES THE PROBED FACT, not the superseded reading:
#        * PO-1 CLOSES CLUSTER D and phase-A's premise [24]: pydantic_ai bundles both
#          `ToolReturnPart`s of one `ModelResponse` into ONE `ModelRequest`, so two `record`
#          calls in one MAIN turn land as ONE `kind='request'` row. D6's arithmetic is sound as
#          written; the demands are written against "one row per turn's tool-return message".
#        * PO-2 CLOSES [39] BY CONSTRUCTION: `_tool_append_block`'s `write_guarded(p, new_text)`
#          takes the default `mode="replace"` — stage under O_EXCL|O_NOFOLLOW, then a single
#          `os.replace`, i.e. `write_atomic`'s own idiom. A torn concurrent read is impossible,
#          so D6's read-before-BEGIN-IMMEDIATE races nothing and owes no demand.
#        * PO-3 REFUTES copy2's fail-closed reading of [45]: `scan_fences` never raises and
#          returns fence_count 0 for `''` and for header-only text. `(0, 0)`, no special case.
#        * PO-4 REFUTES copy2's [51]: there is no `message_id` primary key; `seq` is recomputed
#          `MAX(seq)+1` per insert, so a re-ingest DUPLICATES SILENTLY rather than raising, and
#          the only re-entrancy guard anywhere is `ingest()`'s `last_render_len` length slice.
#          Cluster E's recommendation ("inherit the message insert's idempotency rule") rests on
#          a rule that does not exist.
#        * PO-5 REFUTES BOTH of copy2's [8]/[9]: two DISJOINT mechanisms. `provider_for` raises
#          synchronously and is already wired to `preflight_role_models`'s startup fail-fast over
#          `AGENTS`; `pricing.model_key` never raises for any input and silently mis-prices an
#          unmatched model. Registering the clerk role into AGENTS buys the first; nothing in
#          this port fixes the second.
#        * PO-6: `record("")` does NOT refuse — zero bytes appended, file created, ordinary
#          receipt lead.
#        * PO-7: `scan_fences` counts ONLY well-formed ```invlang spans — a ```yaml block and an
#          inline unterminated mention count zero — but a COMPLETE invlang fence reproduced
#          verbatim inside prose IS counted, uniformly by author. Decides [22].
#        * PO-8: a same-block `:V` id collision is diagnosed at ERROR severity — the WHOLE append
#          is refused and nothing lands. Not warn-and-land.
#        * PO-9 REFUTES A DESIGN RATIONALE, not a reading: `_frontier_recall` structurally cannot
#          fire on a fence-less append (`_document.py:379`'s fast-path guard returns `""` before
#          frontier derivation runs). D9 cites the #919 lessons recall as half its reason for
#          receipt section (1) being `_tool_append_block`'s return VERBATIM; on MAIN's prose-only
#          step-1 append that half is vacuous. See handoff.refuted and demand
#          `d_the_receipt_names_no_verb_main_lacks`.
#        * PO-10: the close gate, the entry-price helper and the conclude/ceiling check all go
#          through `parse_dense_companion`/`diagnose`; none substring-matches raw text.
#
#   3. KNOWN-RED BY DESIGN, CARRIED NOT DROPPED. The base is `7fa49f04` and the port lands on
#      `main`. Two demands PASS HERE once the port lands and are marked `known_red:` because they
#      fail at `main`, not because they are unrunnable here (spine-decisions.md):
#      `d_judgment_partition_dedups_grounding_on_main`
#      (C36 refuted at main by G8/F6 — `main:294` emits `_check_authz_row_grounding` in the
#      STRUCTURAL region and `:307-308` emits `gated` filtered against `already = set(grounding)`,
#      so the judgment tail is not a byte-identical suffix and grounding lines classified
#      structural would be retried every round) and
#      `d_entry_price_helper_forced_parameter_on_main` (G12 — `_refuse_if_entry_price_is_owed`
#      gains `forced=` and raises `ModelRetry` internally, moving mechanism 2's insertion point).
#      Deleting either would hide the exact defect the human accepted when choosing this base.
#
#   4. NAME RECONCILIATION — addresses re-sited so they RESOLVE (R0 would have called every one
#      of them dangling). `20-demands.md` and `45-dispositions.md` coined ids independently; the
#      re-sitings, keyed by role+origin:
#        * `drives(record->clerk)` -> `interacts(clerk_caller->clerk)`. `drives` is Actor->Actor
#          and the clerk is an LLM seam (a boundary with a payload facet), not an actor; the
#          thing that CALLS it is `ClerkCaller`. `record` drives `clerk_caller`; `clerk_caller`
#          invokes `clerk`. Every `interacts(record->clerk)…` address moved with it.
#        * `interacts(main->record).response` -> the boundary `record_receipt` and its two edges
#          (`record` writes it, `main` reads it). The receipt is a real payload with an ordered
#          section grammar; addressing it as an edge response hid the R1 obligation demand #0 IS.
#        * `X.tools` / `ClerkCaller.pending` / `ClerkCaller.last_gaps` / `StoreHandle.document_reader`
#          / `AgentRole.CLERK` / `SCHEMA_VERSION.domain.default` / `DEFENDER_CLERK_EFFORT.domain.default`
#          / `pricing.model_key` / `glm_5_3_flash_price_row` / `providers.FIREWORKS.aliases` /
#          `_MAIN_TAIL_TOOLS` (bare) — none is an address form in schema.md. Re-sited to the
#          boundaries `MAIN_DEF`/`CLERK_DEF`, `pending`, `last_gaps`, `document_reader`,
#          `AgentRole.domain.distinguished[clerk]`, `SCHEMA_VERSION.domain.distinguished[2]`,
#          `DEFENDER_CLERK_EFFORT.domain.distinguished[none]`, `pricing_table.domain.distinguished[…]`,
#          `fireworks_aliases.domain.distinguished[glm-5p3-flash]`,
#          `_MAIN_TAIL_TOOLS.domain.distinguished[…]`.
#        * `main_instructions` was doing two jobs and is SPLIT: `main_instructions` is the prompt
#          surface (defender/SKILL.md, what mechanism 3/4 change) and `main_facing_text` is the
#          runtime refusal surface D15 and mechanism 6 govern. `main_facing_gate_text_speaks_prose`
#          binds ten PRODUCER edges into the second — eight from P13 plus G5's two.
#        * `interacts(budget_enforcer->record)` -> `interacts(budget_enforcer->_MAIN_TAIL_TOOLS)`
#          plus the roster's own domain cell: the budget hook reads a NAME TABLE, it does not
#          reach the verb.
# ===========================================================================================

demands:

  # ---- #0 the return-value contract (D9; F0a/F0b settled, F-RECEIPT-FLAGGED still open) ----
  # AMENDED AT PHASE E (AR-12): section (1) is VERBATIM-MODULO-D15. `_tool_append_block`'s warn
  # return ends with a `fix_row` instruction deliberately (F4), and D14 takes that verb off
  # MAIN's roster — so relaying it byte-for-byte trips one of O1's own failing conditions.
  # AF-2 stands unchanged on the other point: `FLAGGED:` renders ONCE, as section (3).
  # AMENDED AT PHASE F (repair round 2, `95-repairs-2.md` finding 4): the contract is carried by
  # TWO tests because its sections cannot co-exist on one fixture. Section (3) renders only while
  # the window is open at return, and v2:83's step-0 return is BEFORE the prose is appended — so
  # the state that makes (3) render is the state that forbids (1) and (2). The order of (1)/(2)/
  # (4) is `record_receipt_contract`'s; (3)'s position and AF-2's render-ONCE rule are
  # `flagged_section_renders_once`'s, on the step-0 fixture where a double render is reachable.
  - {id: record_receipt_contract, kind: behavior, form: test,
     discharged_by: test_996_record_receipt_sections_in_order,
     binds: ["interacts(record->record_receipt).payload", "record_receipt.payload",
             "interacts(main->record_receipt)", "interacts(record->investigation_md)"]}
  - {id: flagged_section_renders_once,
     minted_from: "AF-2 / F-RECEIPT-FLAGGED — phase-F repair 2 split of `record_receipt_contract`",
     kind: behavior, form: test,
     discharged_by: test_996_the_flagged_section_renders_once_and_after_the_repair_line,
     binds: ["interacts(record->record_receipt).payload", "record_receipt.payload",
             "interacts(main->record_receipt)"]}

