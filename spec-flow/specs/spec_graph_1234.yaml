  seed_docstring: 'A world draw document holds bucket, systems, investigator findings each with contrast_evidence
    (whose resolving pointers are the finding''s citations; `evidence` is retired on this shape) and a boolean on_verdict_path,
    world findings each with their own systems, and deployment gaps naming what was blocked, how and evidence pointers;
    it indexes every filed finding across the three lists in filing order before any drop, and records each filed
    finding''s one ledger lane (a routing fate or one drop reason, precedence: pointers unresolved, names only another
    run, no two-run pair) in place of a drop count; it holds no episode_outcome.'
  provisional_lifted: true
  resolutions: T1/A1, T9/A13, NA08 (AM7)
