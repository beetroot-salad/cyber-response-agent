handoff:
  principles:
  - docs/principles.md (profile conventions.principles), as written.
  - 'P-a (design): a gap is never teachable.'
  - 'P-b (design): judge inputs are derived on read from the immutable archive; nothing derived is stored but the
    wire log.'
  - 'P-c (design): no finding''s eligibility depends on another world''s reply.'
  tensions:
  - id: T1
    name: one pointer shape
    ruling: adopt (A)
    amendment: A1
    dissolves: M02, M03, M06 (18 forks); F-10, F-11, F-12 lifted
  - id: T2
    name: one record owns each fact about a call
    ruling: adopt (A)
    amendment: A2
    dissolves: 'M07, M10 (12 forks); J1/J2 settled; outage (real-error) is not a gap; J5: sentinels join their ledger
      partner on the `system` column; A2''s in-order pairing later replaced by A12'
  - id: T3
    name: usable when all reads succeed
    ruling: adopt (A)
    amendment: A3
    dissolves: M04 (+M05 with T2); control check after the unchanged gates (door first at 463833df); F-07 lifted
  - id: T4
    name: retired shapes refused at every reader
    ruling: adopt (A)
    amendment: A4
    dissolves: M12, M13 (7 forks); old pages render a named refusal; questioner gate gains I10's hold; F-13, F-16
      lifted
  - id: T5
    name: reply validation is the one enforcement point
    ruling: adopt (A)
    amendment: A5
    dissolves: M11, M15 (6 forks); D11's steered-`none` risk accepted; F-08 lifted
  - id: T6
    name: one owner for graded and queued
    ruling: adopt (A)
    amendment: A6
    dissolves: M01 (9 forks); per-world queueing -> append -> queued; d10b replaced
  - id: T7
    name: draws
    ruling: option A, unanimity
    amendment: A7
    dissolves: M09 (5 forks + F-03, F-04, F-09); d05i/d05k flip, d05l re-pinned per T9; multi-draw stays supported
  - id: T8
    name: one identity per call
    ruling: adopt (A)
    amendment: A12
    dissolves: MA01, MA03; fail-closed writes on both call records + host-written call id; exact join; inherited
      = no id of this run; d03d replaced
  - id: T9
    name: a finding is what one draw filed
    ruling: adopt (A)
    amendment: A13
    dissolves: MA05, MA06; index before drop; one lane per filed finding; per-draw routing; family by union
  - id: T10
    name: J3 row blocked everywhere
    ruling: adopt (A)
    amendment: A14
    dissolves: MA02; overrides J3's user-record-only scope
  - id: T11
    name: A1's quantifiers
    ruling: adopt (A)
    amendment: A15
    dissolves: MA04
  forks:
  - id: M5-residual
    resolution: (i) keep the manifest-only plan rule plus the prompt instruction 'cite family.yaml only where the
      flaw is in the plan'; the leak is accepted
    resolved_by: human (70-resolutions)
    demands:
    - d06a_design_finding_to_questioner
