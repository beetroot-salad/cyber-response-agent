# spec_graph_1234 — the judge grounded in contrast with reference runs (#1234).
# Assembled by the write-tests phase-D assembler at base 463833df (12-base-drift.md overlays the
# 301f196c frontiers; CHANGED facts win). The `gate:` block, the g* demands, claims GT-1..GT-10, `actor_waivers` and the
# F-14 / FX / GT-3 rulings are the gate leaf's (76-residue.md, 77-gate-probes.md, 78-gate-resolutions.md).
#
# Demand blocks:
#   d*   — 20-demands.md's 91 pinned demands, re-pinned to the rulings: the three pinned-demand
#          lists (47-dissolve.md, 47-dissolve-amended.md, 45-dispositions-final.md) applied as
#          ruled; stale drift text replaced (signature, page entry, noise = pre-flight record).
#          Renamed ids keep `renamed_from`; replaced readings keep `was`.
#   s_*  — one per settled premise of 43-answers-final.py (156): seed = 45-dispositions-final
#          Settled > 45-dispositions-amended Settled (verbatim) > the NA-cluster recommendation for
#          the 21 auto-resolved members (`resolved_by: auto`). 17 premises dropped (handoff.drops).
#   g*   — minted by the gate leaf from the rules' obligations (gate.obligations names each; 23 demands).
#   n_*  — minted from the tensions' "New" items no settled premise covers (T8 runtime writers,
#          I-1 writer parity and census, the A10 shared stage contract, the door ordering).
#   f_*  — minted by the phase-F repair leaf (94-repair.md) from the human's Phase F rulings
#          (78-gate-resolutions.md R1-R7, relayed by 92-reconciliation.md): R2, R3 (two), R5.
#
# Name reconciliation (role + origin; claim NM-1):
#   world_bucket          -> WORLD_BUCKETS (judge/run.py:140)
#   AUTHOR_RESULT         -> _NON_BUCKET_RESULT_KEYS (author/shared.py:164)
#   _majority (combiner)  -> _world_answers (judge/__init__.py:346); unanimity per A7
#   interacts(grade_episode->JudgeReply|family_reply) -> interacts(_run_world_draws->...)
#   interacts(grade_episode->EpisodeGrade|user_record) -> interacts(_write_judge_yaml->...)
#   interacts(render->episode_archive).payload -> interacts(_run_world_draws->JUDGE_DEF).payload
#   10-brief's "the record" / 20-demands' "judge.yaml" -> EpisodeGrade; "row state" -> world_row_state;
#   "the table" -> executed_queries; "the ledger" -> served_ledger; "the manifest" -> family_manifest.
#   Discharge names without the test_1234_ prefix are prefixed (premise name kept on the demand).
#
# Claim normalisations (each recorded on its claim as `normalised:`): behavior claims a read had
# closed are closed on their 463833df executed re-runs (G01, G09, G13-G16, G19, G21, G23, G24,
# G32, G33, G37, E-10, E-21; G16/G33 narrowed to the executed part); G02, G25, G26, G35, C15
# reworded structurally; G05 one word; E-24 retyped reachability and refuted (OB3); probe
# records keep their ids, "read plus executed" closes on executed, J4/K8/K9 are census/search.
# C13, G03, G07, OB4, K3, AP-10 restated to 463833df (`was:` kept). Every claim carries `drift:`
# where 12-base-drift classed it.
schema_version: 2
design: .spec-flow/design.md as amended by .spec-flow/design-amendments.md (A1-A15; an amendment wins); human rulings
  in .spec-flow/frontiers/70-resolutions.md
base: 463833df
tests: defender/tests/learning/judge/contrast_contracts
demands:
- id: d00a_episode_grade_contract
