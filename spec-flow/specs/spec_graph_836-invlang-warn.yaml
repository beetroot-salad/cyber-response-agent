tests: defender/tests   # the suite this graph is the derivation of. Top-level files only
                        # (`suite_files` globs one level): #810's sibling suite
                        # `test_append_only_write_lane_810.py` lives there, the e2e replay
                        # harness is importable from there, and every `discharged_by` below
                        # must land in a top-level file of this directory or its demand reads
                        # as a prose orphan.
schema_version: 1
design: "836"   # gh#836 + `.spec-flow/issue-836-design.md` — "Discussion outcome — intent +
                # design": O1-O6, N1-N6, M1-M7.
base: c0dca747  # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# The change: a rejected `append_block` costs a full section rewrite. One check family
# (`_check_attr_update_keys`) becomes WARN-severity: the block LANDS, the model is told which
# row is wrong, and every further write on `investigation.md` is refused until the row is
# repaired by a new verb `fix_row(old_row, new_row)`. `ident` becomes a third legal refinement
# key so the operation the model keeps reaching for exists.
#
# THE HUMAN SEAM (§7) HAS RUN — `.spec-flow/frontiers/70-resolutions.md` is this spec's
# CONTROLLING DOCUMENT wherever it conflicts with anything else here, including the design doc.
# 17 forks in, 17 resolved (8 human-decided H1-H8, 9 auto-resolved A1-A9), 26 obligations
# minted, 4 non-obligations (N7-N10), 2 follow-ups filed (FU-1, FU-2). Every `handoff.forks`
# entry below was written BEFORE that seam and is kept as the decision record it was; the
# resolution each one took is stated in `70-resolutions.md` and carried into the demands and
# the `gate.holes` entries above. Demand #0's provisional reading was CONFIRMED (A1), not
# flipped, so phase C's classification did NOT re-run.
#
# FIVE CORRECTIONS OVERRIDE THE DESIGN DOC AND THE PHASE-A BRIEF. They are ledger entries, not
# footnotes, and each changes what this spec demands:
#
#  1. `b6` — the pin is `pydantic-ai-slim >=1.107` and the installed version is 1.107.0, NOT
#     2.19. The `prepare=`-returning-None mechanism was re-probed live at 1.107.0 and holds
#     (claim b6/p7; 15-reground-b6.md). Only the version label was wrong.
#  2. `c2` — the doc's refusal-family counts (attr-key 14 / parse 6 / ref 6 / provenance 5 /
#     gating 2 against "17 unique refusals") sum to 33 > 17: they count per-refusal
#     occurrences. Under global-unique dedup the split is 26 lines — attr-key 7, parse 6,
#     provenance 5, gating 5, ref 3. `c1` ("all are key='ident'") holds absolutely, 7/7. The
#     "dominant family" framing survives; the margin does not (claims c2 refuted, g8 holds).
#  3. The brief's F2 / red flag 2 is REFUTED ON MECHANISM. `compaction.apply_writes` is dead
#     code (zero production callers, vulture-baselined UNWIRED). The live surface is
#     `driver.py:419 _fold_decision` -> `compaction.frontier_text(inv_text, fold_through)`, a
#     TRUNCATED PREFIX: a flagged row below the fold cut is simply absent from the model's
#     re-entry view (claims cp1-cp5, cp3 executed). The consequence the brief flagged is real;
#     its cause was not. Demand `gate_refusal_names_every_flagged_row` is the recovery channel
#     (F-N), not `read_file(tail=...)` and the model's memory.
#  4. `x1` IS REFUTED. `_check_append_only` protects only `:V`/`:E` cores — it never looks at
#     `:R` rows — so a `:V` row substituted for a flagged `:R` row draws ZERO diagnostics under
#     every construction tried: a fresh id is accepted outright (rt9), a colliding id is
#     swallowed by the parser's first-declaration-wins fold before append-only ever sees it
#     (rt8), and an embedded ``` delimiter makes the injected row vanish from parsing with no
#     warning at all (rt11 — silent content loss, worse than either). O3/SEC1 therefore has NO
#     enforcement of its own today; it rests entirely on a `new_row` shape guard that does not
#     exist. That is fork F-C, and `no_verb_mutates_committed_record` may not be discharged by
#     citing x1.
#  5. R1 DOES NOT ACHIEVE WHAT IT WAS CHOSEN FOR. Tail tier only exempts `fix_row` from
#     `should_refuse`; `driver._budget_short_circuit` checks an UNCONDITIONAL `tail_exhausted`
#     hard-kill FIRST, gated only by `BUDGET_EXEMPT_TOOLS = {close_investigation}` — so a
#     tail-tier `fix_row` at the ceiling raises `BudgetKill` and the run ends unclosed
#     (bd1/bd2/bd6, executed). "Turn budget" is not a distinct mechanism: it is either
#     pydantic-ai's `request_limit` (`UsageLimitExceeded`, no exemption for anything, not even
#     the close) or the review gate's `extra_turns`, which FORCES an inconclusive close
#     (bd4/bd5). All of this is fork F-A's material, and O5 is scoped accordingly below.
#
# ONE MORE FINDING NO FORK CARRIED, surfaced by probe PR-5 and computed here by R2: at 1.107.0
# two tool calls in ONE model response run CONCURRENTLY (thread pool for sync bodies, event-loop
# interleave for async). Both read `investigation.md`'s pre-call state before either writes, so a
# same-turn `fix_row` + `append_block` pair silently LOSES one of the two writes — no exception,
# no torn bytes, both calls reporting success to the model (rt1 refuted, rt2 holds). The fix
# exists in the pinned floor and is unused: `Agent.tool(..., sequential=True)` (rt3). This is why
# `drives(run_investigation->fix_row).multiplicity` is `concurrent`, and R2 fires on
# `investigation_md.identity` because of it. It is residue for the gate leaf and §7, not a
# question this file answers.
#
# NAMES THIS SPEC MINTS ON THE PRODUCTION SIDE (phase E, from §7's answers — an implementation
# that spells them otherwise makes `check_binds` skip the concept SILENTLY):
#   fix_row(old_row, new_row)          the repair verb (runtime/tools.py::_tool_fix_row)
#   warn_diagnostics(text) -> tuple[Diagnostic, ...]   the derived window (M3)
#   Diagnostic.severity: "error" | "warning", default "error"   (M1)
#   UNCHANGED_LEAD = "No changes were made"   the shared refusal-lead constant (H2) every new
#       refusal path starts with — `defender._artifact_schema`, alongside `UNCHANGED_NOTICE`,
#       which it is the leading fragment of
#
# ---------------------------------------------------------------------------
# NAME RECONCILIATION — grounding (10-brief), demand extraction (20-demands) and the
# dispositions' address derivations (45-dispositions) coined ids independently. Unified by
# ROLE + ORIGIN against the code:
#
#   `append_block` / `fix_row` / `close_investigation` are the TOOL BODIES
#       (`tools.py::_tool_append_block`, `::_tool_fix_row`, `close_tool.py::
#       _close_investigation_async`). The corpus drops a private symbol's leading underscore
#       for the id, as it does throughout; the same applies to `check_attr_update_keys`,
#       `check_append_only`, `seed_vertex_state`, `apply_attr_updates`,
#       `check_benign_open_slots`, `effective_vertex_state`, `closed_for_investigation_write`.
#   `fix_row` (ACTOR, the body) vs `fix_row_offer` (BOUNDARY, the `prepare=`-gated
#       ToolDefinition the model is shown) are DELIBERATELY SPLIT: M4's whole security posture
#       is "prepare is ergonomics, the body is the guard" (SEC3), and one id for both makes
#       that sentence unassertable.
#   `flagged_row_set` = M3's derived window. 20-demands bound `warn_diagnostics` and
#       `Locus.row_text`; `Locus.row_text` is not an address form, so the identity lives here
#       as a facet with `row_text` as a NON-INJECTIVE derivation of `on_disk_line` (PR-1).
#   `model_context` = the tool-result channel back to the model (byte count, rendered warning,
#       repair instruction, refusal prose, `BUDGET_REFUSAL_MESSAGE`). 20-demands spelled this
#       `interacts(...).response`; a response is what the boundary hands back, and the thing
#       under contract here is what the VERB writes into the model's transcript — F-E is
#       entirely about that sink, and R1/R6 only see it if it is a boundary.
#   `severity` / `attr_update_keys` / `old_row` / `new_row` are the four valued inputs the
#       change adds or widens. 20-demands' `severity.domain.default` and
#       `fix_row.domain.distinguished[]` are not address forms; they resolve here as
#       `severity.domain.distinguished[error]` and `new_row.domain.distinguished[]`.
#   `validate_investigation` carries an ACCESS facet whose two vias are its two named
#       production exports (`decide_write` and `_decide_investigation_write`, brief F6) — the
#       parity question is per-cell, not per-boundary.
#   AXES: `run_id`, `on_disk_line`, `vertex_id`, `tool_name`, plus the derivation `row_text`.
#       No earlier pass declared an axis registry at all; `on_disk_line` vs `row_text` is the
#       distinction PR-1 refuted byte-equality on, and it is registered so the two extraction
#       passes cannot coin one name for both.
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE RETURN CONTRACT. CLOSED at §7: fork f1 (the refusal channel) was CONFIRMED, not
  # flipped (A1) — all four refusal paths raise `ModelRetry` like the three existing verbs,
  # `fix_row` returns a success string. Fork F-E (the accept-path warning) was closed by H2:
  # ordering is pinned, an ACCEPT leads with bytes written and "the block LANDED".
  # =========================================================================

  - id: return_contract
    kind: behavior
    form: test
    binds: ["interacts(append_block->model_context).payload",
            "interacts(fix_row->model_context).payload",
            "warn_diagnostics",
            "validate_investigation",
            "validate_companion"]
    discharged_by: test_return_contract_shapes
    # docstring seed: warn_diagnostics returns a tuple of Diagnostics; validate_investigation
    # still returns str|None; validate_companion returns only error-severity messages; a
    # warn-family append_block returns a success string carrying the byte count, the rendered
    # warning and the repair instruction; every refusal on the write lane raises ModelRetry.

  # =========================================================================
  # M1 — Diagnostic.severity
  # =========================================================================

  - id: diagnostic_severity_defaults_to_error
    kind: shape
    form: test
    binds: ["severity.domain.distinguished[error]", "Diagnostic"]
    discharged_by: test_diagnostic_severity_defaults_to_error
  - id: attr_key_check_is_the_only_warning
    kind: parity
    form: test
    binds: ["severity.domain.distinguished[warning]",
            "interacts(check_attr_update_keys->severity)",
            "interacts(diagnose->severity)"]
    discharged_by: test_only_attr_update_key_family_warns
    rejected: [{nl: "N1 — parse errors, strong-move provenance, dangling refs and the gating checks stay refusals; nothing is written and the model re-sends."},
               {nl: "N5 — citation relevance in `:T resolutions` is not in scope; _check_strong_move_provenance keeps checking presence only (claim p15)."}]
  - id: append_block_mixes_warn_and_error_defects
    kind: behavior
    form: test
    binds: ["interacts(append_block->investigation_md)",
            "severity.domain.distinguished[error]"]
    discharged_by: test_append_block_mixes_warn_and_error_defects
    # settled premise: refused in full, nothing written — M2 narrows only the warn path.

  # =========================================================================
  # M2 — the write gate and persist stop denying on warnings
  # =========================================================================

  - id: write_gate_accepts_warn_only_document
    kind: behavior
    form: test
    binds: ["validate_investigation", "interacts(append_block->investigation_md)",
            "investigation_md.access[append_block]"]
    discharged_by: test_validate_investigation_returns_none_on_warn_only
    # gate leaf, R3: rebound to also name investigation_md.access[append_block] — the per-cell
    # address R3 fires on. Substance (decide-write/encodable/size-bound/warn-severity-permissive)
    # is this demand's own; closed-for-investigation-write and diagnose-error-severity are
    # append_block_gated_while_flagged's and append_block_mixes_warn_and_error_defects's.
  - id: validate_artifact_contract_unchanged
    kind: seam
    form: test
    binds: ["validate_artifact"]
    discharged_by: test_validate_artifact_still_returns_str_or_none
  - id: validate_companion_filters_to_errors
    kind: behavior
    form: test
    binds: ["validate_companion"]
    discharged_by: test_validate_companion_drops_warnings
  - id: persist_accepts_warn_only_document
    kind: behavior
    form: test
    binds: ["interacts(persist_run->investigation_md)", "validate_companion"]
    discharged_by: test_persist_copy_path_accepts_warn_only_document
    # O2. Observed failing by: learning/core/persist.py:207 raising RunUnprocessable.
  - id: two_validator_entry_points_stay_in_parity
    kind: parity
    form: test
    binds: ["validate_investigation.access[decide_write]",
            "validate_investigation.access[decide_investigation_write]"]
    discharged_by: test_two_validator_entry_points_stay_in_parity
    # brief F6 + claim g4: `_decide_investigation_write` invokes validate_investigation rather
    # than reimplementing it, so M2 is visible through both entries. Kept as a cheap regression.
  - id: close_report_validator_unchanged
    kind: coherence
    form: test
    binds: ["interacts(close_investigation->validate_artifact)", "validate_artifact"]
    discharged_by: test_close_report_validator_meets_a_diagnostic_it_never_saw_before
    # settled: vacuously unchanged — the new severity is scoped to an investigation.md-specific,
    # :R-specific check that report.md's validation never runs.
  - id: severity_is_never_document_content
    kind: coherence
    form: test
    binds: ["interacts(persist_run->investigation_md)", "Diagnostic"]
    discharged_by: test_persist_reads_document_written_under_different_severity_semantics
    # settled (copy2's migration answer discounted against p1/g5): severity is assigned per
    # check family at diagnose time and is never document content, so a document of any age is
    # validated under current semantics. Pinned so no migration mechanism is invented later.

  # =========================================================================
  # M3 — the window is DERIVED, not stored
  # =========================================================================

  - id: window_is_derived
    kind: behavior
    form: test
    binds: ["warn_diagnostics", "investigation_md.identity"]
    discharged_by: test_window_is_derived_from_the_on_disk_document
  - id: no_new_agentdeps_field
    kind: seam
    form: test
    binds: ["AgentDeps", "interacts(register_tools->AgentDeps)"]
    discharged_by: test_agentdeps_gains_no_window_field
  - id: window_survives_a_fresh_deps_object
    kind: behavior
    form: test
    binds: ["warn_diagnostics", "investigation_md"]
    discharged_by: test_window_survives_a_fresh_deps_object
    # M3's own argument. NOTE the asymmetry PR-10 found: the WINDOW survives a fresh AgentDeps
    # (it is on disk); the terminal-closed flag does NOT (bd7/bd8) — fork F-M, CLOSED by A8:
    # latent only because no resume feature exists today.
  - id: flagged_row_identity_is_row_text
    kind: shape
    form: test
    binds: ["warn_diagnostics", "flagged_row_set.identity"]
    discharged_by: test_flagged_row_identity_is_the_row_as_parsed
    # docstring seed must pin PR-1's refutation: the identity is the PARSED row text, which
    # `_tokenize_fence`'s per-row `.strip()` (parser.py:90) has already normalised — it is NOT
    # the on-disk line whenever that line carries leading/trailing whitespace (pr1b refuted).
    # Zero-width (U+200B) and bidi (U+202E) content survives untouched (pr1c) and rows past 200
    # characters print whole (pr1d).
  - id: window_absent_file_is_an_empty_window
    kind: behavior
    form: test
    binds: ["warn_diagnostics", "interacts(register_tools->flagged_row_set)"]
    discharged_by: test_prepare_read_before_investigation_md_exists
    # settled: the derivation must tolerate the file not existing on turn 1 and treat absence
    # as "nothing flagged" — `prepare=` runs on EVERY model request (20-demands red flag 5).
  - id: warn_diagnostics_over_an_empty_document
    kind: behavior
    form: test
    binds: ["warn_diagnostics"]
    discharged_by: test_warn_diagnostics_over_empty_investigation_md
  - id: every_gate_flags_the_same_row_set
    kind: parity
    form: test
    binds: ["interacts(append_block->flagged_row_set)",
            "interacts(close_investigation->flagged_row_set)",
            "interacts(register_tools->flagged_row_set)"]
    discharged_by: test_every_gate_flags_the_same_row_set
    # settled: all derivation sites compute one function over one on-disk text.
  - id: offer_and_body_disagree_about_the_window
    kind: behavior
    form: test
    binds: ["fix_row_offer", "interacts(fix_row->flagged_row_set)"]
    discharged_by: test_offer_and_body_disagree_about_the_window
    # settled: being offered the tool is never evidence the window is still open; the body
    # re-derives at call time and refuses with an explicit "nothing is currently flagged".
  - id: window_recomputed_after_fix
    kind: behavior
    form: test
    binds: ["warn_diagnostics", "interacts(fix_row->flagged_row_set)"]
    discharged_by: test_window_is_recomputed_after_each_fix_row
  - id: repair_order_is_unconstrained
    kind: behavior
    form: test
    binds: ["flagged_row_set", "interacts(fix_row->flagged_row_set)"]
    discharged_by: test_repair_order_across_two_flagged_rows_unconstrained
  - id: partial_repair_leaves_the_other_row_flagged
    kind: behavior
    form: test
    binds: ["interacts(fix_row->flagged_row_set)", "interacts(append_block->investigation_md)"]
    discharged_by: test_partial_repair_leaves_other_row_flagged
  - id: window_reopens_after_a_later_defect
    kind: behavior
    form: test
    binds: ["flagged_row_set", "interacts(append_block->flagged_row_set)"]
    discharged_by: test_window_reopens_after_a_later_unrelated_defect
    # settled: no stored state means no residue from a fully-repaired earlier episode.

  # =========================================================================
  # M4 — fix_row. Every guard the design states is on `old_row`; `new_row` is UNGUARDED and
  # that is fork F-C, sharpened by x1's refutation (rt8/rt9/rt11).
  # =========================================================================

  - id: fix_row_signature
    kind: seam
    form: test
    binds: ["fix_row", "old_row", "new_row"]
    discharged_by: test_fix_row_takes_old_row_and_new_row_only
    # M4: no path, no free-form anchor.
  - id: fix_row_repairs_a_flagged_row
    kind: behavior
    form: test
    binds: ["interacts(fix_row->investigation_md)", "interacts(fix_row->flagged_row_set)"]
    discharged_by: test_fix_row_repairs_a_flagged_row
    # THE positive control for every negative below (fix_row_only_flagged_rows,
    # no_verb_mutates_committed_record, fix_row_refused_after_close, fix_row_body_is_the_guard).
  - id: fix_row_only_flagged_rows
    kind: negative
    form: test
    binds: ["interacts(fix_row->investigation_md)", "flagged_row_set"]
    discharged_by: test_fix_row_old_row_names_text_never_flagged
    # N2 + settled premise: refused as a SCOPE violation, not merely a match failure — SEC1's
    # discharge depends on old_row being scoped to the flagged set (claim r2/g10).
  - id: fix_row_matches_a_whole_line
    kind: behavior
    form: test
    binds: ["interacts(fix_row->investigation_md).payload", "old_row"]
    discharged_by: test_fix_row_matches_a_whole_line_not_a_substring
    # RESOLVED BY H4 (F-D closed, reading (b)). M4's literal "exactly once" wording CHANGES:
    # the whole-line rule stays, the multiplicity moves to fix_row_applies_to_every_flagged_
    # occurrence, and the flagged-set restriction to fix_row_refuses_a_match_outside_the_
    # flagged_set. The demand id was renamed with the wording so it cannot read as a pin on
    # a rule the human withdrew.
  - id: fix_row_empty_new_row_deletes
    kind: domain-outcome
    form: test
    binds: ["new_row.domain.distinguished[]", "interacts(fix_row->investigation_md)"]
    discharged_by: test_fix_row_with_empty_new_row_deletes_the_line
    # O5's escape, and the falsy member of new_row's domain (falsy_valid: true).
  - id: fix_row_deletion_may_empty_its_block
    kind: behavior
    form: test
    binds: ["new_row.domain.distinguished[]", "check_append_only"]
    discharged_by: test_fix_row_deletion_empties_its_block
    cites: [pr8]
    # SETTLED BY PROBE PR-8 (F-H closes): a header-only `:R attr_updates` block validates
    # completely clean — 0 diagnostics with or without a baseline, fence count unchanged 2->2,
    # `_check_append_only` returns []. O5's deletion escape is unconditional for this family.
  - id: fix_row_empty_old_row_refused
    kind: domain-outcome
    form: test
    binds: ["old_row.domain.distinguished[]", "interacts(fix_row->investigation_md)"]
    discharged_by: test_fix_row_old_row_is_empty
  - id: fix_row_old_row_spans_more_than_one_line
    kind: behavior
    form: test
    binds: ["old_row", "interacts(fix_row->investigation_md)"]
    discharged_by: test_fix_row_old_row_spans_more_than_one_line
  - id: fix_row_old_row_is_a_suggested_alternative
    kind: behavior
    form: test
    binds: ["old_row", "flagged_row_set"]
    discharged_by: test_fix_row_old_row_is_a_suggested_alternative
    # settled: a `use:` alternative is what the row could become, not what it is.
  - id: fix_row_old_row_matches_no_line
    kind: behavior
    form: test
    binds: ["interacts(fix_row->investigation_md)", "interacts(fix_row->model_context).payload"]
    discharged_by: test_fix_row_old_row_matches_no_line
  - id: fix_row_swapped_arguments_refused
    kind: behavior
    form: test
    binds: ["old_row", "new_row"]
    discharged_by: test_fix_row_old_row_and_new_row_swapped
    # settled: every stated guard is on old_row, so a swap puts unflagged text in the guarded
    # slot — no special detection is needed, and none may be invented.
  - id: fix_row_repeated_identical_call_refused
    kind: behavior
    form: test
    binds: ["interacts(fix_row->investigation_md)", "flagged_row_set"]
    discharged_by: test_fix_row_repeated_identical_call
    # settled: idempotent-safe by construction, deliberately indistinguishable from
    # never-flagged text.
  - id: fix_row_faces_decide_write
    kind: behavior
    form: test
    binds: ["interacts(fix_row->validate_investigation)", "validate_investigation"]
    discharged_by: test_fix_row_result_goes_through_decide_write
  - id: fix_row_over_the_size_bound_refused
    kind: behavior
    form: test
    binds: ["INVESTIGATION_FILE_MAX", "interacts(fix_row->INVESTIGATION_FILE_MAX)"]
    discharged_by: test_fix_row_new_row_pushes_document_past_size_bound
    # settled: same bound every write faces (p8); the deletion escape only ever shrinks.
  - id: append_block_size_bound_unchanged_by_fix_row
    kind: coherence
    form: test
    binds: ["interacts(append_block->INVESTIGATION_FILE_MAX)"]
    discharged_by: test_append_block_size_bound_unchanged_by_fix_row
    cites: [p8]
    # gate leaf, R7 MINT: INVESTIGATION_FILE_MAX itself is unchanged (still 65536, no
    # design-provenance edit) and append_block's own reader edge is unmoved/code-provenance;
    # fix_row is simply a second reader of the same constant. Cheap regression, "known noise
    # mode" — this reader is unaffected because the value it reads did not move.
  - id: fix_row_refused_after_close
    kind: negative
    form: test
    binds: ["interacts(fix_row->closed_for_investigation_write)",
            "closed_for_investigation_write"]
    discharged_by: test_fix_row_refused_once_the_close_committed
    # SEC2/RS15. Positive control: fix_row_repairs_a_flagged_row (pre-close). Fork F-M, CLOSED
    # by A8 as a CONDITIONAL discharge: the flag this rests on is in-process only (bd7/bd8) —
    # latent, no resume feature exists; the suite must state the discharge as conditional (FU-2).
  - id: fix_row_prepare_hides_it_when_the_window_is_closed
    kind: behavior
    form: test
    binds: ["interacts(register_tools->fix_row_offer)", "fix_row_offer"]
    discharged_by: test_fix_row_is_offered_only_while_the_window_is_open
    cites: [b6]
  - id: fix_row_body_is_the_guard
    kind: negative
    form: test
    binds: ["interacts(fix_row->investigation_md)", "fix_row_offer"]
    discharged_by: test_fix_row_called_with_the_window_closed_is_refused_by_the_body
    # SEC3. A model that saw the definition on an earlier turn can still emit the call.
