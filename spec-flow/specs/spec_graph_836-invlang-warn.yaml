  - id: bd10
    kind: census
    claim: append=True is granted by exactly one AgentDefinition in the tree — MAIN_DEF
    probe: grep -rn 'ToolSet(' and 'AgentDefinition(' over all non-test defender/ .py files, every match read
    probe_kind: search
    observed: >
      nine non-test ToolSet( sites; only driver.py:298 (MAIN_DEF) sets append=True. GATHER_DEF,
      SUPPORT/COMPOSER, curator, judge, actor, lead-author, oracle and verify-forward do not.
      register_tools gates append_block's registration on tools.append, and
