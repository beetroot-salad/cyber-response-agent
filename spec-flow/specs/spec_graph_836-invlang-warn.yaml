  # ==== PR-2/10/12: budget, terminal state, grants (10) ====
  - id: bd1
    kind: behavior
    claim: >
      tier-based should_refuse never refuses a tail-tier tool, so a tail-tiered fix_row is never
      should_refuse-blocked regardless of tool_calls or wall-clock state
    probe: >
      appended 'fix_row' to _MAIN_TAIL_TOOLS, then called tier() and should_refuse() far over
      max_tool_calls and again with wall-clock tripped
    probe_kind: executed
    observed: >
      tier(fix_row, MAIN) = tail; should_refuse(over cap, fix_row/tail) = False;
      should_refuse(over cap, query/core) = True; should_refuse(wall-clock tripped, fix_row) =
      False. This is the half of R1 that works.
    verdict: holds
  - id: bd2
    kind: behavior
    claim: >
      a distinct, UNCONDITIONAL tail_exhausted hard-kill sits ahead of should_refuse in
      driver._budget_short_circuit, gated only by BUDGET_EXEMPT_TOOLS and not by tier
    probe: >
      read driver.py:104-122, then executed it against a synthetic run_dir/deps at tool_calls ==
      max_tool_calls + TAIL_ALLOWANCE, once for a tail-tiered fix_row and once for
      close_investigation
    probe_kind: executed
    observed: >
      source order is `if tool_name in BUDGET_EXEMPT_TOOLS: return None`, THEN `if
      tail_exhausted(...): raise BudgetKill`, THEN should_refuse. Executed: fix_row ->
      BudgetKill('budget tail exhausted at fix_row'); close_investigation -> not killed. The
      judge DISCOUNTED this mechanism as unproven; it is true. g17 never saw it because g17 is
      scoped to budget_enforcer.py and this lives in driver.py.
    verdict: holds
  - id: bd3
    kind: behavior
    claim: >
      the wall-clock bound is not a fifth exit — it is the second disjunct inside tail_exhausted,
      plus a softer check inside should_refuse that only ever blocks core-tier tools
    probe: executed tail_exhausted() and should_refuse() just past wall_clock_timeout and past wall_clock_timeout + grace
    probe_kind: executed
    observed: >
      tail_exhausted(inside grace) = False; tail_exhausted(beyond grace) = True;
      should_refuse(wall-clock tripped, fix_row/tail) = False
    verdict: holds
  - id: bd4
    kind: referential
    claim: >
      pydantic-ai UsageLimits(request_limit=...) is a separate terminal path: on
      UsageLimitExceeded the run ends with truncated_by=TRUNCATED_BY_REQUEST_LIMIT and no forced
      close, unlike the UnexpectedModelBehavior handler
    probe: read driver.py:670-749 (_drive_agent's try/except block)
    probe_kind: read
    observed: >
      :687 usage_limits=UsageLimits(request_limit=challenge_gate.raised_request_limit(bounds));
      :691-695 the UsageLimitExceeded branch sets truncated_by and exit_reason and calls no
      close, where :696-730's UnexpectedModelBehavior handler explicitly calls
      _close_investigation_async. :735-738's BudgetKill branch also forces no close. This path
      has NO per-tool exemption at all — not even close_investigation — because the framework
      enforces it before a next model turn exists.
    verdict: holds
  - id: bd5
    kind: referential
    claim: >
      no standalone 'turn budget' mechanism exists distinct from the request ceiling
    probe: grep for turn_budget / 'turn budget' / TURN_BUDGET outside tests; read challenge_gate.py:44,76,128-131,394-438
    probe_kind: read
    observed: >
      the two entities using turn language are challenge_gate.EXTRA_TURN_BOUND=2, folded
      ADDITIVELY into the same ceiling via raised_request_limit = base_request_limit +
      extra_turns (the same value threaded into UsageLimits at driver.py:687), and
      Bounds.extra_turns / state.turns, whose exhaustion FORCES an inconclusive close
      (CAUSE_TURN_BUDGET_SPENT) — the opposite of 'the close is refused'. The only mechanism
      matching '25-early-resolutions.md red flag 3' is bd4's.
    verdict: holds
  - id: bd6
    kind: behavior
    claim: >
      R1's stated obligation — a budget-tripped run holding an outstanding warning can still call
      fix_row and can therefore still reach a close — holds unconditionally
    probe: synthesis of bd1 + bd2 + bd3's executions against R1's obligation text
    probe_kind: executed
    observed: >
      PARTIALLY REFUTED. R1 protects fix_row from should_refuse (tier-based, metered) but not
