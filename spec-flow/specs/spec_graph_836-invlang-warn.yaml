      discharged_by: append_block_size_bound_unchanged_by_fix_row

  holes:
    - rule: R0
      element: investigation_md.access[fix_row]
      resolution: >
        CLOSED BY H3 (§7): the shape guard ships, and the artifact's one formal `unknown`
        closes with it. The record of what was open, kept because the reading was forced
        rather than preferred — the artifact's one formal `unknown`, holding fork F-C: whether SEC3 is
        discharged by full-document re-validation alone (reading a — but x1 is refuted, so
        O3/SEC1 rests on a property `_check_append_only` does not have: rt8/rt9/rt10/rt11 each
        found a distinct way a substituted or malformed `:V`/`:E` row passes append-only
        undetected or silently vanishes) or by a new shape guard on `new_row` (reading b,
        JUDGE'S RECOMMENDATION — makes SEC3 true by construction). §7 decides; see F-C in
        `handoff.forks` for the full option set.
      cites: [x1, rt8, rt9, rt10, rt11]
      resolved_to: fix_row_new_row_is_a_single_row_of_the_same_block
    - rule: R2
      element: investigation_md.identity
      resolution: >
        CLOSED BY H6 (§7): register both write verbs `sequential=True`. No B/C fork carried
        this; it was fresh residue from the gate's own probes.
        `drives(run_investigation->append_block)` and `drives(run_investigation->fix_row)` are
        both `multiplicity: concurrent`, and rt1/rt2/rt3 executed the consequence: two
        same-response tool calls run CONCURRENTLY against the real `write_guarded` primitive,
        both read the pre-call state, one write is silently dropped every trial, and both calls
        report success to the model; `Agent.tool(..., sequential=True)` exists and is unused.
        NOTE for the mechanical gate: several demands bind the bare edges
        `interacts(append_block->investigation_md)` / `interacts(fix_row->investigation_md)`
        (no `.identity` suffix), which satisfies `spec-graph gate`'s root-match — but none of
        them assert atomicity or no-lost-update under a genuine interleaving, so this is
        recorded here explicitly rather than left to ride as mechanically clean. §7 decides:
        register both write verbs `sequential=True`, or accept the loss as documented behaviour
        (see the untitled "RESIDUE THIS PHASE SURFACED" entry in `handoff.forks`). The human
        took the first, knowing it changes the pre-existing `append_block` path.
      cites: [rt1, rt2, rt3]
      resolved_to: write_verbs_execute_sequentially_within_one_response
    - rule: R2
      element: flagged_row_set.identity
      resolution: >
        CLOSED BY H4 (§7): matching compares against the STRIPPED row text the renderer
        emits — F-F's first option. It was subsumed by F-F's then-open ought-question. `row_text` is a non-injective
