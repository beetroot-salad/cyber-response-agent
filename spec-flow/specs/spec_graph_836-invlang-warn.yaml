handoff:

  # EVERY FORK BELOW IS RESOLVED — see `70-resolutions.md`, which is authoritative; these
  # entries are the relay text the human read, kept verbatim so the merge-gate reader can see
  # what was put to them and disagree with the answer. Resolutions, by fork:
  #   F-A -> H1 (option d + the handler fix)        F-B -> H5 (gate at the top of the close)
  #   F-C -> H3 (the `new_row` shape guard)         F-D -> H4 (every flagged occurrence)
  #   F-E -> H2 (option i, ordering pinned)         F-G -> H7 (fail open, logged)
  #   F-I -> H8 (item 4 refused) + A4 (N7-N9)       F-J -> A5 (ride append=True)
  #   f1  -> A1 (CONFIRMED)                         F-F -> A2 (settled as fact by PR-1)
  #   F-H -> A3 (deletion may empty its block)      F-K -> A6 (N10, accepted exposure)
  #   F-L -> A7 (six rosters, four prose sites)     F-M -> A8 (SEC2 conditional; FU-2)
  #   F-N -> applied (the gate refusal is the recovery channel)
  #   R2 concurrent lost update -> H6 (sequential=True)   R6 frame gap -> A9 (FU-1)
  # `forks:` is the decision channel: the nine
  # MATERIAL forks come first (a human must choose), then the five the judge recorded with a
  # recommendation the orchestrator can apply, then the two the probes closed, then the
  # residue this phase surfaced that no fork carried. Each entry is written for a cold relay —
  # the situation, what each reading buys and costs, the recommendation, and the demands it
  # mints or drops.
  forks:
    - "F-A — A RUN THAT RUNS OUT OF TURNS, WALL-CLOCK OR MODEL REQUESTS WHILE A ROW IS FLAGGED.
       MATERIAL, OPEN, resolved_by: human. M5 makes close_investigation refuse while any row is
       flagged; R1 resolved only the tool-call limb (fix_row takes tail tier). PROBE PR-2 HAS
       NOW LANDED AND IT UNDERCUTS R1: `_budget_short_circuit` checks an UNCONDITIONAL
       `tail_exhausted` kill AHEAD of should_refuse, gated only by BUDGET_EXEMPT_TOOLS =
       {close_investigation}, so a tail-tier fix_row at the ceiling raises BudgetKill and the run
       ends unclosed (bd2/bd6, executed). `UsageLimitExceeded` (the real referent of 'turn
       budget' — no distinct mechanism exists, bd4/bd5) ends the run with NO exemption for
       anything, not even the close. Retry exhaustion instead FORCE-closes, through the same
       routine M5's gate slots into, from a handler whose guard is a bare `except Exception`
       that only logs — so M5's refusal would be swallowed and no report.md written. All three
       land the run at persist as an UNCLOSED run: _SHARED_COPY_ARTIFACTS requires report.md and
       dead-letters before investigation.md is validated at all, so O2's guarantee does not
       cover them and the dead-letter reason is the wrong one. Options: (a) leave unspecified —
       ships free, O2 silently uncovered, and demand `window_always_closable` must stay scoped
       as it is written above; (b) grandfather the close at termination — buys O2, costs O4
       outright and lands a flagged row in report.md's run, the cross-run corpus and the
       reviewer's projection (the design already rejected this shape once); (c) terminal
       auto-repair (delete flagged rows on the forced-close path) — buys O2 and O4 literally,
       costs a new mechanism and silently erases model-authored content on a path the model
       never chose; (d) exempt the INTERNALLY-triggered close only — buys O4 for every
       model-driven close and O2 for the framework-driven one, costs one stated exception to a
       negative universal. JUDGE'S RECOMMENDATION: (d) plus fixing the forced-close handler to
       surface rather than swallow the gate's refusal. Mints (under c or d) a close-path demand
       distinguishing model-invoked from framework-invoked close, plus a demand that the
       forced-close handler does not swallow a refusal. 6 premises."
    - "F-B — WHERE M5'S CLOSE-SIDE GATE SITS AMONG close_investigation's THREE EXITS. MATERIAL,
       OPEN, resolved_by: human. M5 places the check by analogy only ('beside the
       false_positive_entry_price read at close_tool.py:393') — but that read lives inside ONE
       disposition's branch (g19), and the `inconclusive` exit commits early, before the
       challenge gate runs at all. Top-of-function (after the disposition-enum and
       terminal-closed checks, before any disposition branch): O4 becomes a real universal, the
       reviewer's model calls are never spent on a close that will be refused, and the
       inconclusive escape cannot dodge the gate; costs — it also gates the framework's forced
       close (F-A's one caller that must be exempt), and the model hears about the flagged row
       before it hears that its disposition string was invalid. Literal-M5: smallest diff,
       matches the doc's words, costs O4 on two of three exits and spends a review gate on a
       doomed close. JUDGE'S RECOMMENDATION: gate at the top, paired with F-A's forced-close
       exemption. Demand `close_investigation_gated_while_flagged` is written against the
       universal reading and re-opens against the literal one. 5 premises (incl.
       test_append_block_over_size_bound_while_flagged, whose over-bound remedy prose offers a
       verb M5 blocks)."
    - "F-C — `new_row` IS UNGUARDED: SEC3's REAL BOUNDARY, AND NOW O3's ONLY ENFORCEMENT.
       MATERIAL, OPEN, resolved_by: human. Every guard M4 states is on old_row; nothing
       constrains what new_row may be, and fix_row is the first verb that rewrites a line INSIDE
       an already-open fence. THE PROBES CHANGED THIS FORK'S WEIGHT: claim x1 ('fix_row cannot
       reach a committed :V/:E record') is REFUTED — _check_append_only never inspects :R rows
       (rt10), a fresh-id :V substituted for the flagged row is accepted with zero diagnostics
       (rt9), a colliding-id one is swallowed by the parser before append-only sees it (rt8),
       and one carrying the document's own fence delimiter deletes content silently (rt11).
       PR-3 adds that a row with one cell too FEW emits no diagnostic at any severity. Reading
       (a), the doc as written — rely on full-document re-validation alone: no new code, and
       O3/SEC1 then rests on a property `_check_append_only` provably does not have. Reading
       (b), add a shape guard on new_row — one predicate (single line, no fence delimiter,
       parses as a row of the same block with that block's cell count) makes SEC3 true by
       construction and makes every construction above unreachable rather than merely unprobed;
       costs one more refusal the model can hit and a restructuring capability nobody asked for.
       JUDGE'S RECOMMENDATION: (b). Mints `fix_row_new_row_is_a_single_row_of_the_same_block`
       (positive control: an ordinary key repair; negatives: embedded newline, fence delimiter,
       :V declaration, wrong cell count in BOTH directions). Under (b),
       `no_verb_mutates_committed_record` becomes dischargeable; under (a) it must be rewritten
       or waived, because the suite would otherwise assert a property the code does not have.
       4 premises. THIS IS THE ARTIFACT'S ONE `unknown` INVARIANT: investigation_md.access[fix_row]."
    - "F-D — `old_row` NON-UNIQUENESS VERSUS O5's 'ALWAYS-AVAILABLE ESCAPE'. MATERIAL, OPEN,
       resolved_by: human. M4 says old_row must match 'as a whole line, exactly once' and SEC1's
       discharge says whole-line uniqueness refuses an ambiguous match; O5 says fix_row(old, '')
       is always available. They collide: a flagged row whose text is not unique — two
       byte-identical bad rows from one block, the same refinement written twice, or the model
       having quoted the row in its own prose — can be neither repaired nor deleted, and with M5
       the run is then unclosable. (a) Refuse as ambiguous: strongest safety story, costs O5
       outright in exactly the case the model is most likely to produce. (b) Apply to every
       occurrence when every match is in the flagged set: restores O5, and cannot touch an
       unflagged line because the flagged set is :R attr_updates-only (r2/g10); costs the
       literal wording 'exactly once'. (c) Scope uniqueness to the flagged set only: handles the
       quoted-in-prose case, still stuck on flagged-vs-flagged. JUDGE'S RECOMMENDATION: (b)
       restricted to the flagged set. Mints `fix_row_applies_to_every_flagged_occurrence` plus a
       negative that a match outside the flagged set still refuses. Under (a),
       `window_always_closable` must be re-scoped AGAIN and O5 loses its unconditional form —
       do not let the test assert a guarantee the mechanism withdraws. The formal slot carrying
       this fork is `flagged_row_set.identity.sharing: unique-key`. 3 premises."
    - "F-E — THE ACCEPT-PATH WARNING: NO RENDERING CHANNEL, AND THE MODEL MUST TELL IT FROM A
       REFUSAL. MATERIAL, OPEN, resolved_by: human. THIS IS THE ISSUE'S COST LEVER. Flow 1 says a
       warn-family append_block returns 'byte count + rendered warning + repair instruction';
       M2 says warnings are 'not returned through the write gate at all'; brief F4 shows
       `_render_diagnostic` is private to _artifact_schema and reachable only on the DENY path;
       brief F5 shows the accept path therefore needs a SECOND diagnose pass in the tool body —
       two passes per accepted append, not the one the Scale deep-dive assumed. And every
       existing refusal on this artifact carries UNCHANGED_NOTICE because it is minted inside
       _artifact_schema; M4's and M5's refusals are raised in tool bodies OUTSIDE that module,
       so nothing structurally makes them say nothing was written. (i) Tool body re-derives over
       the bytes it just wrote, in memory, and renders through a renderer promoted to
       module-public: deterministic message, no second disk read, no race; costs one exported
       symbol and a second diagnose over <=64KB. (ii) Return the warning through the write gate
       after all: costs demand `validate_artifact_contract_unchanged` and M2's stated invariant.
       (iii) Leave the accept-path message unspecified: costs the entire saving — a model that
       reads 'warning' as 'refusal' re-emits the block, which is exactly what #836 exists to
       stop. JUDGE'S RECOMMENDATION: (i), with the ordering pinned explicitly — an accept leads
       with bytes written and an explicit 'the block LANDED'; a refusal leads with 'no changes
       were made'. Mints the accept-path return shape, a parity demand that every new refusal
       carries the unchanged-notice invariant, and the two-passes-per-append correction to the
       Scale note. RELAY THIS WITH DEMAND #0 (fork f1): it resolves #0's accept side. 3 premises."
    - "F-F — DOES THE WARNING SHOW THE MODEL THE ROW'S EXACT BYTES? MATERIAL, OPEN — but the
       is-question is now SETTLED and only the ought remains. PR-1 executed it (pr1a-pr1e): the
       rendered `row:` line is byte-identical to the on-disk line for ordinary rows, for rows
       carrying U+200B or U+202E, and for a 274-character row printed whole; the 'message already
       embeds the row' suppression NEVER fires for this family. ONE SHAPE BREAKS IT: leading or
       trailing whitespace, because `_tokenize_fence` (parser.py:90) strips every row before
       `Locus.row_text` is populated — the model is shown a line that is provably not the one on
       disk, and a copy-pasted old_row would fail a whole-line match. That is a PARSER-layer
       fact, upstream of both the diagnostic and the renderer. The remaining choice is the
       design's: EITHER fix_row matches modulo the same normalisation the parser already applies
       (cheap, and it makes the round-trip total), OR the flagged row's capture keeps the raw
       line (a change to Locus.row_text, with a blast radius beyond this issue), OR the
       whitespace case is accepted as a known unrepairable row and O5's escape is documented as
       having an exception. The doc states none of the three. Mints, whichever way:
       `test_fix_row_old_row_differs_by_whitespace_or_line_ending` as a REAL assertion rather
       than a hedge. 4 premises + test_flagged_row_below_the_frontier_cut."
    - "F-G — WINDOW DERIVATION FAILURE: FAIL-OPEN OR FAIL-CLOSED. MATERIAL, OPEN, resolved_by:
       human. M3 makes the window a pure function of the on-disk document and never says what
       happens when that function cannot run — the file is unreadable, or the validator itself
       raises — on the three paths that call it (the model-request path via prepare=, the write
       path, the close path). Fail-closed protects O4 but turns an unrelated read error into an
       unclosable run, the same wedge R1 was resolved to avoid. Fail-open keeps the run moving;
       its stated cost (silently dropping the gate O4 rests on) is smaller than it looks,
       because a document that cannot be diagnosed also cannot be WRITTEN — append_block and
       fix_row both run the full validator, so an undiagnosable document is one this system did
       not produce. JUDGE'S RECOMMENDATION: fail-open on all three paths, with the failure
       logged, and a demand pinning it (`window_derivation_failure_does_not_wedge_the_run`).
       FOR THE RELAY: the file simply being ABSENT is a different, already-settled case (empty
       window, fix_row hidden — demand `window_absent_file_is_an_empty_window`) and is not what
       this fork is about. 1 premise."
    - "F-I — WHAT M6 MINTS BY MAKING `ident` WRITABLE. MATERIAL, OPEN, resolved_by: human, ONE
       decision covering four questions. N3 says legalizing ident 'changes no downstream
       behaviour' — true today because nothing reads the effective identifier (c3/g9). But N3's
       argument was made about a field that could never be written; after M6 it is writable and
       attacker-influenced (values flow from alert content), and R2 gives it a slot of its own.
       (1) Two vertices converging on one effective identifier — no uniqueness constraint exists
       or is proposed. (2) A document carrying BOTH `key=ident` and the old `attrs.ident`
       spelling — they occupy different slots and neither is read, so precedence is undecided.
       (3) An unresolved `??` in the identifier slot is invisible to `_check_benign_open_slots`,
       which iterates attributes only — that is R2's decision made visible, not an oversight.
       JUDGE'S RECOMMENDATION: record (1), (2) and (3) as explicit NON-OBLIGATIONS in the
       N-series so they cannot re-enter as assumptions, and pin (3) as the positive control on
       demand `ident_legalization_changes_no_downstream_behavior`. (4) IS NOT A CHOICE but an
       implementation obligation R2 did not state, and PR-11 executed it: a refinement naming a
