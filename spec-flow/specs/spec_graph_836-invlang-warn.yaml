  # ==== PR-1: does the warning show the model the row's exact bytes? (5) ====
  - id: pr1a
    kind: behavior
    claim: the rendered `row:` line for an ordinary flagged row equals the on-disk line, byte for byte
    probe: diagnose() over a key='ident' :R attr_updates row, rendered through _artifact_schema._render_diagnostic
    probe_kind: executed
