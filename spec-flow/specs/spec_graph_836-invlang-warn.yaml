    verdict: holds
  - id: pr1b
    kind: behavior
    claim: >
      the rendered `row:` line for a flagged row with on-disk trailing whitespace equals the
      on-disk line, byte for byte
    probe: the same harness with three trailing ASCII spaces on the flagged row
    probe_kind: executed
    observed: >
      REFUTED — rendered_len=33 vs on_disk_len=36. Traced to parser.py:89-118 (_tokenize_fence),
      which does `stripped = raw.strip()` per source line and appends `stripped`, never `raw`,
      to cur.rows; Locus.row_text is populated from block.rows, so the three spaces never reach
      the Diagnostic and the renderer cannot re-emit what it was never given. The mismatch is a
      PARSER-layer fact, not a renderer-layer one — any fix belongs in how row_text is captured.
      This is the one shape that breaks M4's intended copy-paste round-trip.
    verdict: refuted
  - id: pr1c
    kind: behavior
    claim: >
      the rendered `row:` line for a flagged row carrying a zero-width or bidi control character
      equals the on-disk line, byte for byte
    probe: the same harness with U+200B and with U+202E embedded mid-cell
    probe_kind: executed
    observed: >
      byte-equal for both — but incidentally: str.strip() removes only White_Space characters,
      and U+200B / U+202E are category Cf, so the very mechanism that broke pr1b leaves these
      untouched. The residual ergonomic note stands: a model cannot retype content it cannot see.
    verdict: holds
  - id: pr1d
    kind: behavior
