    # F-repair HD-3 (94-hd-repairs.md): site :425's warning-side counterpart is anchored to
    # the SAME PARAGRAPH as the #810 sentence, not to word presence anywhere in the file — the
    # property pinned is that a warning means the block DID land and the next write is BLOCKED
    # until the row is repaired, phrasing left to the implementer.
  - id: invlang_skill_documents_ident
    kind: behavior
    form: clause
    binds: ["invlang_SKILL_md", "attr_update_keys.domain.distinguished[ident]"]
    outcome: {nl: "skills/invlang/SKILL.md's `:R` section documents key=ident as a legal refinement key and states that the `:V` declaration is immutable."}
  - id: no_invlang_validate_subcommand
    kind: negative
    form: clause
    binds: ["defender_invlang_cli"]
    outcome: {nl: "defender-invlang gains no `validate` subcommand; the write gate stays the model's only validator."}
    rejected: [{nl: "N6 — a standalone validate subcommand was examined and declined."}]

  # =========================================================================
  # THE READER SET — what a warn-only document does downstream (O2's other half)
  # =========================================================================

  - id: learning_mirror_carries_a_warn_only_document_onward
    kind: coherence
    form: test
    binds: ["interacts(persist_run->learning_run_dir)", "validate_companion",
            "interacts(prologue_extract->investigation_md)",
            "interacts(forward_check->investigation_md)",
            "interacts(run_common_cross_check->investigation_md)"]
    discharged_by: test_the_learning_mirror_carries_a_warn_only_document_onward
    cites: [b5, r4]
    # O2 is discharged AT THE COPY GATE and nowhere else: nothing downstream persists "this
    # document was warned", so nothing downstream has a stated behaviour difference.
    # gate leaf, R7: rebound to also name the three unmoved readers this settled disposition's
    # own docstring already scopes — "the prologue scan, the forward check, the judge's reads"
    # (30-premises-author.md) and "the run-level cross-check against the lead table"
    # (test_the_unmoved_readers_of_a_warn_only_document). One test, driven through the mirror,
    # observed at each reader's own edge — per-reader discipline, not boundary altitude.

  # =========================================================================
  # §7 — THE HUMAN SEAM'S OWN OBLIGATIONS (70-resolutions.md). 26 minted across eight human
  # decisions and nine auto-resolutions; the ones already present above keep their ids and
  # the mapping is stated in 80-author-digest.md. Everything below was minted at §7 and did
  # not exist when phase D's gate leaf wrote the `gate:` block.
  # =========================================================================

  # ---- H1: a run that ends while a row is flagged -------------------------
  - id: close_gate_distinguishes_model_invoked_from_framework_invoked
    kind: behavior
    form: test
    binds: ["interacts(close_investigation->flagged_row_set)",
            "interacts(close_investigation->report_md)"]
    discharged_by: test_close_gate_distinguishes_model_invoked_from_framework_invoked
    cites: [bd2, bd6]
    # H1, option (d). Gate every close the MODEL invokes; exempt the framework-invoked forced
    # close, which by construction has no model left to repair with. ONE written-down
    # exception to O4's negative universal, and it is written down here so it does not read
    # as a bug. Without it a flagged run dead-letters at persist for a MISSING report.md
    # before investigation.md is validated at all — O2 uncovered, and misattributed.
  - id: forced_close_failure_is_distinguishable_from_a_committed_close
    kind: behavior
    form: test
    binds: ["close_investigation", "interacts(close_investigation->report_md)"]
    discharged_by: test_forced_close_failure_is_distinguishable_from_a_committed_close
    cites: [bd4]
    # F-repair HD-1 (94-hd-repairs.md), renaming what §7 minted as
    # `forced_close_handler_surfaces_a_gate_refusal`. That name promised the wrong mechanism:
    # H1's FIRST limb exempts the framework-invoked close from the gate entirely, so on this
    # path no gate refusal is ever constructed and none can be "surfaced" — H1's second limb
    # is SUBSUMED by its first. What the test actually pins (and always did) is narrower and
    # real: the retry-exhaustion handler force-closes from a bare `except Exception` that only
    # logs, so at c0dca747 a forced close that FAILED and one that committed are
    # indistinguishable in the run's own exit record. Asserted as "the two can be told apart",
    # not as one particular string. `91-blind.md` red flag 2, written from the tests alone
    # with no access to this decision, landed on the same rename independently: "'Surfaces a
    # failure instead of swallowing it' would be the accurate name." If the forced-close
    # exemption is ever narrowed so a gate refusal becomes reachable on this path, THAT is
    # when a gate-refusal-specific surfacing demand is owed — this one does not cover it.

  # ---- H2: the accept path's rendering channel ----------------------------
  - id: accept_return_leads_with_bytes_and_says_the_block_landed
    kind: shape
    form: test
    binds: ["interacts(append_block->model_context).payload"]
    discharged_by: test_accept_return_leads_with_bytes_and_says_the_block_landed
    # H2, F-E option (i), ORDERING PINNED: an accept leads with bytes written and an explicit
    # "the block LANDED". The distinction is what the 8% saving is made of — a model that
    # reads "warning" as "refusal" re-emits the block, which is what #836 exists to stop.
  - id: refusal_leads_with_the_unchanged_notice
    kind: parity
    form: test
    binds: ["interacts(append_block->model_context).payload",
            "interacts(fix_row->model_context).payload",
            "interacts(close_investigation->model_context).payload"]
    discharged_by: test_refusal_leads_with_the_unchanged_notice
    # H2's other half, across ALL FOUR new refusal paths (append while flagged, close while
    # flagged, fix_row on unflagged text, fix_row after the close). Parity is the point: the
    # model tells an accept from a refusal by the FIRST sentence.
  - id: two_diagnose_passes_per_accepted_append
    kind: behavior
    form: test
    binds: ["interacts(append_block->model_context).payload", "warn_diagnostics"]
    discharged_by: test_the_accept_path_derives_its_warning_after_the_gate_returned_none
    cites: [p5]
    # H2, recorded against the Scale note. Made OBSERVABLE rather than counted: the write gate
    # returns None for a warn-only document, so the warning in the tool's return can only have
    # come from a SECOND derivation in the tool body over the bytes it just wrote — two passes
    # per accepted append, not the one the design's Scale deep-dive assumed.

  # ---- H3: the `new_row` shape guard --------------------------------------
  - id: fix_row_new_row_is_a_single_row_of_the_same_block
    kind: negative
    form: test
    binds: ["investigation_md.access[fix_row]", "new_row",
            "interacts(fix_row->investigation_md).payload"]
    discharged_by: test_fix_row_new_row_is_a_single_row_of_the_same_block
    cites: [x1, rt8, rt9, rt11, pr3]
    # H3 closes fork F-C on reading (b), and CLOSES THE ARTIFACT'S ONE `unknown`
    # (investigation_md.access[fix_row]). Single line, no fence delimiter, parses as a row of
    # the same block with that block's cell count. FORCED, not preferred: x1 is refuted, so
    # without this guard O3/SEC1 ships as a negative universal with no enforcer.
  - id: fix_row_new_row_shape_guard_admits_an_ordinary_repair
    kind: behavior
    form: test
    binds: ["investigation_md.access[fix_row]", "new_row"]
    discharged_by: test_fix_row_new_row_shape_guard_admits_an_ordinary_repair
    # The paired POSITIVE CONTROL for the negative above, on the same address under the
    # complementary condition: a guard that refused everything would leave every negative arm
    # green.

  # ---- H4: `old_row` non-uniqueness ---------------------------------------
  - id: fix_row_applies_to_every_flagged_occurrence
    kind: behavior
    form: test
    binds: ["flagged_row_set.identity", "interacts(fix_row->investigation_md)"]
    discharged_by: test_fix_row_applies_to_every_flagged_occurrence
    cites: [r2, g10]
    # H4, F-D reading (b). Deleting both identical bad rows closes the window, so O5 stays
    # literally true; the flagged set is `:R attr_updates`-only, so no committed record is
    # reachable. ALSO ANSWERS the R2 hole on flagged_row_set.identity in substance.
  - id: fix_row_refuses_a_match_outside_the_flagged_set
    kind: negative
    form: test
    binds: ["flagged_row_set", "interacts(fix_row->investigation_md)"]
    discharged_by: test_fix_row_refuses_a_match_outside_the_flagged_set
    # H4's rider, and what keeps the multiplicity safe: the reachable case is the model
    # having quoted the row in its own prose. Positive control: fix_row_repairs_a_flagged_row,
    # and the same call succeeds inline once the prose copy is gone.
  - id: fix_row_matches_the_rendered_stripped_row_text
    kind: shape
    form: test
    binds: ["flagged_row_set.identity", "interacts(fix_row->investigation_md).payload"]
    discharged_by: test_fix_row_matches_the_rendered_stripped_row_text
    cites: [pr1b]
    # H4's normalisation rider, forced by pr1b (REFUTED byte-equality). `_tokenize_fence`
    # strips every row before `Locus.row_text` is populated, so a raw-line comparison would
    # make every trailing-whitespace row permanently unmatchable — and with M5 the run
    # permanently unclosable. This is R2's `row_text`-is-non-injective firing, answered.

  # ---- H5: where the close-side gate sits ---------------------------------
  - id: close_gate_precedes_every_disposition_branch
    kind: behavior
    form: test
    binds: ["interacts(close_investigation->flagged_row_set)",
            "interacts(close_investigation->report_md)"]
    discharged_by: test_close_gate_precedes_every_disposition_branch
    cites: [g19, p11]
    # H5, F-B resolved to gate-at-top: after the disposition-enum and terminal-closed checks,
    # BEFORE any disposition branch. The doc's literal "beside the false_positive_entry_price
    # read" placement leaves O4 failing on two of three exits — the `inconclusive` exit
    # commits early, before the challenge gate runs at all.
  - id: close_gate_precedes_the_review_spend
    kind: behavior
    form: test
    binds: ["drives(close_investigation->challenge_gate)",
            "interacts(close_investigation->flagged_row_set)"]
    discharged_by: test_close_gate_precedes_the_review_spend
    cites: [g19]
    # H5's other half: a close refused for a flagged row never spends a review. The gate's
    # stage calls are real model calls in production, so "refused" and "refused after paying
    # for a review" are the same to every assertion except one that RECORDS the calls.

  # ---- H6: two write calls in one model response --------------------------
  - id: write_verbs_execute_sequentially_within_one_response
    kind: uniqueness
    form: test
    binds: ["investigation_md.identity", "drives(run_investigation->append_block)",
            "drives(run_investigation->fix_row)"]
    discharged_by: test_write_verbs_execute_sequentially_within_one_response
    cites: [rt1, rt2, rt3]
    # H6, and the answer to the R2 hole on investigation_md.identity that phase D left as
    # fresh residue with no prior fork. `Agent.tool(..., sequential=True)` exists in the
    # pinned floor and is unused. Knowingly changes behaviour on the pre-existing
    # `append_block` path — a fix beyond #836's stated scope, accepted with that cost stated.
  - id: a_repair_and_an_append_in_one_response_both_persist
    kind: uniqueness
    form: test
    binds: ["investigation_md.identity", "interacts(fix_row->investigation_md)",
            "interacts(append_block->investigation_md)"]
    discharged_by: test_a_repair_and_an_append_in_one_response_both_persist
    cites: [rt2]
    # H6's worked case. Under the concurrent default one of the two writes is silently
    # dropped — no exception, no torn bytes, both calls reporting success — so a same-turn
    # `fix_row(old, "")` + `append_block` pair could discard the repair while telling the
    # model it landed: the window looks closed and is not.

  # ---- H7: window derivation failure --------------------------------------
  - id: window_derivation_failure_does_not_wedge_the_run
    kind: behavior
    form: test
    binds: ["warn_diagnostics", "interacts(register_tools->flagged_row_set)",
            "interacts(append_block->flagged_row_set)",
            "interacts(close_investigation->flagged_row_set)"]
    discharged_by: test_window_derivation_failure_does_not_wedge_the_run
    # H7: fail OPEN on all three paths, logged. Failing closed converts a transient read error
    # into an unclosable run — the wedge class H1 had just removed — on a path where the model
    # has done nothing wrong. ABSENCE of the file is a DIFFERENT, already-settled case
    # (window_absent_file_is_an_empty_window) and is not what this fork decided.

  # ---- A2: what the rendered warning shows --------------------------------
  - id: warning_renders_the_flagged_row_byte_exactly
    kind: shape
    form: test
    binds: ["interacts(append_block->model_context).payload", "flagged_row_set.identity"]
    discharged_by: test_warning_renders_the_flagged_row_byte_exactly
    cites: [pr1a, pr1c, pr1e]
    # A2 — settled as FACT by PR-1, not offered as a choice. Ordinary, zero-width and bidi
    # rows render byte-identical and the "message already embeds the row" suppression never
    # fires for this family. The one break — trailing whitespace — is H4's rider above.
  - id: renderer_does_not_truncate_a_long_flagged_row
    kind: shape
    form: test
    binds: ["interacts(append_block->model_context).payload"]
    discharged_by: test_renderer_does_not_truncate_a_long_flagged_row
    cites: [pr1d]
    # A2. `_render_diagnostic` applies no length check at all; the 200-char truncation its
    # docstring mentions belongs to `ParseWarning.format()`, a different family. This settles
    # the one point the two escalation copies asserted opposite answers on.

  # ---- A5: which agents are offered the repair verb -----------------------
  - id: exactly_one_agent_definition_is_offered_fix_row
    kind: parity
    form: test
    binds: ["main_toolset", "interacts(register_tools->main_toolset)", "fix_row_offer"]
    discharged_by: test_exactly_one_agent_definition_is_offered_fix_row
    cites: [bd10, r3]
    # A5, F-J: ride `append=True`, no new capability bit, matching N4's posture of not
    # widening the write surface. PR-12 censused it — nine non-test ToolSet sites, one grant
    # (MAIN_DEF) — so the test is written against a census rather than a guess. The registry
    # PICKS the subjects; what is asserted is that registration is wired to the grant, driven
    # by building a MAIN-shaped definition with `append=False` and observing the verb vanish.

structure:

  # `tool_name` is registered although no key_axes member uses it: it is the axis the SIX
  # by-name write-verb rosters (brief g6) all key on, and naming it once is how a later pass
  # cannot coin a second name for it. `row_text` is deliberately NOT an axis — it is a
  # non-injective DERIVATION of `on_disk_line`, and that distinction is PR-1's finding.
  axes: [run_id, on_disk_line, vertex_id, tool_name]

  actors:
    - {id: run_investigation,      frame: composition, provenance: code}    # driver.py::run_investigation — fans the write verbs over one document
    - {id: append_block,           frame: leg,         provenance: code}    # tools.py::_tool_append_block (:451-502) — main's only writer since #810
    - {id: fix_row,                frame: leg,         provenance: design}  # tools.py::_tool_fix_row — THE NEW VERB (the body, not the offer)
    - {id: close_investigation,    frame: leg,         provenance: code}    # close_tool.py::_close_investigation_async (:320-405)
    - {id: register_tools,         frame: leg,         provenance: code}    # tools.py::register_tools (:548-556) — where `prepare=` lands (first site in the repo, g15)
    - {id: warn_diagnostics,       frame: leg,         provenance: design}  # M3's derivation over the on-disk document — the window IS this function
    - {id: diagnose,               frame: leg,         provenance: code}    # skills/invlang/validate.py::diagnose (:998) — one production caller (g3)
    - {id: check_attr_update_keys, frame: leg,         provenance: code}    # validate.py:628-666 — the ONLY family that warns (M1)
    - {id: check_append_only,      frame: leg,         provenance: code}    # validate.py:438-464 — compares :V/:E cores ONLY (rt8/rt10)
    - {id: seed_vertex_state,      frame: leg,         provenance: code}    # validate.py — effective-state construction site 1 (:V declarations)
    - {id: apply_attr_updates,     frame: leg,         provenance: code}    # validate.py ~700-725 — construction site 2 (:R refinements); M6 widens it
    - {id: check_benign_open_slots, frame: leg,        provenance: code}    # validate.py:737 — _effective_vertex_state's SOLE consumer (p3/g9)
    - {id: persist_run,            frame: leg,         provenance: code}    # learning/core/persist.py — the copy gate O2 names (:205-212)
    - {id: challenge_gate,         frame: leg,         provenance: code}    # challenge_gate.py:490 — the review projection + ablation target
    - {id: invlang_corpus,         frame: leg,         provenance: code}    # skills/invlang/corpus.py:131 — rglobs investigation.md across every run
    - {id: prologue_extract,       frame: leg,         provenance: code}    # learning/core/prologue.py:6-11 — line scan for the prologue
    - {id: forward_check,          frame: leg,         provenance: code}    # learning/author/verify_forward/forward.py:28
    - {id: run_common_cross_check, frame: leg,         provenance: code}    # run_common.py:118 — cross-check against :L rows
    - {id: visualize_data,         frame: leg,         provenance: code}    # scripts/visualize/visualize_data.py:159-171 — by-name phase tagging
    - {id: budget_enforcer,        frame: leg,         provenance: code}    # hooks/budget_enforcer.py — tier()/should_refuse()/BUDGET_REFUSAL_MESSAGE
    - {id: budget_short_circuit,   frame: leg,         provenance: code}    # driver.py:104-122 — the UNCONDITIONAL tail_exhausted kill (bd2)
    - {id: vulture_lint,           frame: leg,         provenance: code}    # scripts/lint/lint_vulture_baseline.json's checker — CI-blocking (F12)
    - {id: replay_harness,         frame: leg,         provenance: code}    # tests/e2e/_replay_harness.py — the project's declared harness, an execution context

  boundaries:

    # ---- SR1: investigation.md — the change's centre ----
    - id: investigation_md
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "Path template `<run_dir>/investigation.md`, one per run, no
            interpolation beyond the run dir — `_run_paths.RunPaths.investigation` (:36) is the
            sole path constructor and `permission/files.py::_is_run_dir_file` keys the artifact
            on the RESOLVED path being exactly that. Read off the resource, not the writers."}
          sharing: serialized-append
          # serialized-append, validator-enforced (`_check_append_only`) — and R2's own rule
          # says a serialized-append sink owes an atomic/serialized-append demand under a
          # GENUINE INTERLEAVING whatever the declared multiplicity. rt1/rt2 executed that
          # interleaving: two calls in one response both read the pre-call state and the last
          # write wins, silently. No demand binds that yet — deliberately: it is gate residue.
        payload:
          parts:
            - {role: appended_block, source: model}
            - {role: old_row,        source: old_row}
            - {role: new_row,        source: new_row}
          invariants: [all-slots-bound]
          nl: "What a write verb puts into the document. `append_block` appends model-authored
            invlang text after the last fence close; `fix_row` is the FIRST verb that rewrites a
            line INSIDE an already-open fence, and the parser has never had to validate a
            mid-fence splice. Every guard M4 states is on `old_row`; `new_row`'s shape is
            unconstrained, which is fork F-C."
        access:
          constraints_by_via:
            append_block:
              trust: attacker-influenced
              constraints: [closed-for-investigation-write, decide-write, encodable,
                            size-bound, diagnose-error-severity]
            fix_row:
              trust: attacker-influenced
              constraints: unknown
              # THE ARTIFACT'S ONE `unknown`, and it is a real hole, not a gap in the write-up:
              # `old_row` is guarded (flagged-set membership, whole-line, exactly once) and
              # `new_row` is not. x1 claimed the flagged set's `:R`-only shape made a committed
              # record unreachable; rt8/rt9/rt11 REFUTED it. Whether a `new_row` shape guard
              # ships is fork F-C — decide it, then pin it.
            bash:
              trust: attacker-influenced
              constraints: [no-writer-shaped-grant, tokenizer-denies-redirection,
                            duckdb-external-access-locked]
              # rt4/rt5 hold; rt6 is the correction — the permission gate ALLOWS write-shaped
              # `defender-sql` (it never parses the SQL); duckdb's own sandbox is what refuses.
            write_file:
              trust: attacker-influenced
              constraints: [not-granted-to-main]
              # r3/p9/g12: ToolSet.write gates BOTH write_file and edit_file, and MAIN_DEF has
              # `write=False` (driver.py:298). N4 keeps it that way.

    - id: report_md
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "`<run_dir>/report.md`, written once by `close_tool.write_guarded(...,
            mode='replace')` at close_tool.py:336 — the close's only artifact write (p11)."}
          sharing: unique-key

    - id: learning_run_dir
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "persist.py copies investigation.md into the learning run dir after
            `validate_companion(...) == []` (:205-212). M2 changes that predicate, so what
            enters this root changes (brief SR3)."}
          sharing: unique-key

    # ---- the derived window: M3's whole data model ----
    - id: flagged_row_set
      provenance: design
      facets:
        identity:
          key_axes: [on_disk_line]
          evidence: {nl: "M3's data-model table names `row_text` the identity of a flagged row,
            and `fix_row` addresses a row by that text. Read off the resource, the key is the
            ON-DISK LINE — that is what `fix_row` must match and what the model copies out of
            the warning. PR-1 executed the two against each other: they are byte-equal for
            ordinary, zero-width, bidi and 274-character rows, and NOT equal when the on-disk
            line carries leading/trailing whitespace, because `_tokenize_fence` (parser.py:90)
            calls `raw.strip()` per row before `Locus.row_text` is ever populated."}
          derivations:
            - {value: row_text, fn_of: on_disk_line, injective: false}
          sharing: unique-key
          # `sharing: unique-key` is what M4's "matched as a whole line, exactly once" ASSUMES.
          # Fork F-D is precisely whether it holds: two byte-identical bad rows in one block
          # give one key two rows, and then the row can be neither repaired nor deleted.

    # ---- the model-facing channel: F-E's sink, and R6's ----
    - id: model_context
      provenance: design
      facets:
        payload:
          parts:
            - {role: bytes_written,      source: append_block}
            - {role: landed_or_unchanged, source: const:UNCHANGED_NOTICE}
            - {role: rendered_warning,   source: template:_render_diagnostic}
            - {role: flagged_row,        source: flagged_row_set}
            - {role: repair_instruction, source: const:FIX_ROW_INSTRUCTION}
            - {role: budget_survivors,   source: budget_refusal_message}
          invariants: [all-slots-bound]
          nl: "Everything a write verb hands back to the model: the byte count on an accept, the
            rendered warning and the repair instruction that make the 8% saving real, and the
            refusal prose on a deny. The FRAME as well as the slots is under contract here —
            `flagged_row` is model- and alert-influenced content (the value channel R6 asks
            about), and the accept path has no renderer today at all (brief F4/F5): the tool
            body needs a SECOND diagnose pass and a renderer that is currently private to the
            deny path. That is fork F-E, this issue's own cost lever."

    # ---- the four valued inputs ----
    - id: severity
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "Diagnostic.severity — 'error' | 'warning', default 'error'. Assigned
            per check family, never read off the document (p1/g5), so no document is ever
            'written under the old semantics'."}
          default: error
          distinguished: ["error", "warning"]
          falsy_valid: false
          documented_alternatives: []

    - id: attr_update_keys
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "The `key` cell of a `:R attr_updates` row. Legal today: `class` and
            `attrs.*` — `_apply_attr_updates` applies nothing else, so a bad-key row is inert
            (b1/p2). M6 adds `ident`. Cells reach the comparison whitespace-TRIMMED and NOT
            case-folded (pr9), so `' ident '` becomes legal with `ident` and `Ident`/`IDENT` do
            not. A blank key is invisible to this check entirely and is refused one layer up by
            the parser (pr4)."}
          distinguished: ["ident", "class", ""]
          falsy_valid: false
          documented_alternatives:
            - {value: "attrs.ident", crosses_validation: true}
              # The validator's own `use:` suggestion, and the spelling that stays legal after
              # M6. It crosses: both spellings remain valid and land in DIFFERENT slots
              # (`attributes["ident"]` vs R2's `identifier`). Precedence between them is
              # fork F-I — nothing reads either today (c3/g9), which is why the doc calls
              # `attrs.ident` "a shadow field nothing reads".

    - id: old_row
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`fix_row`'s first argument: the whole line to replace. Required, no
            default. Must be one of the CURRENTLY-flagged rows, matched as a whole line,
            exactly once — the empty string is not one of them, and neither is a `use:`
            alternative, a multi-line string, or a line the window never flagged."}
          distinguished: [""]
          falsy_valid: false
          documented_alternatives: []

    - id: new_row
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`fix_row`'s second argument: what the line becomes. Required, no
            default. The EMPTY STRING is the distinguished falsy member and it is VALID — it
            deletes the line, and it is O5's always-available escape. Its shape is otherwise
            unconstrained (F-C)."}
          distinguished: [""]
          falsy_valid: true
          documented_alternatives: []

    # ---- the effective vertex state M6 widens ----
    - id: effective_vertex_state
      provenance: code
      facets:
        identity:
          key_axes: [vertex_id]
          evidence: {nl: "`_effective_vertex_state` returns a dict keyed by vertex id, built at
            TWO sites: `_seed_vertex_state` from the `:V` declarations, then
            `_apply_attr_updates` over the `:R` refinements. R2 (human) adds a third top-level
            `identifier` slot beside `classification` and `attributes`. PR-11 executed the gap
            between the two sites: `_apply_attr_updates` runs unconditionally, so a refinement
            naming a vertex no `:V` ever declared FABRICATES the entry — there is no existence
            check between them."}
          sharing: unique-key

    # ---- validator surfaces ----
    - id: validate_investigation
      provenance: design
      facets:
        access:
          constraints_by_via:
            decide_write:
              trust: derived
              constraints: [size-bound, encodable, warn-severity-permissive]
            decide_investigation_write:
              trust: derived
              constraints: [size-bound, encodable, warn-severity-permissive]
              # brief F6: a SECOND named production export onto the same validator, kept
              # because the frames suite drives it directly. g4 says it invokes
              # validate_investigation rather than reimplementing it, so parity holds by
              # construction — the per-cell demand is the cheap regression that keeps it true.
    - {id: validate_artifact,  provenance: code,   facets: {}}   # `str | None`, contract UNCHANGED by M2
    - {id: validate_companion, provenance: design, facets: {}}   # filters to errors; one production caller, persist.py:207 (p6)
    - {id: Diagnostic,         provenance: design, facets: {}}   # gains `severity`; one consumer outside validate.py, _render_diagnostic (g5)
    - {id: closed_for_investigation_write, provenance: code, facets: {}}   # RS15; all three existing verbs call it (p10)
    - {id: INVESTIGATION_FILE_MAX, provenance: code,
       facets: {domain: {type: int, refinement: {nl: "64 KiB byte bound on investigation.md
         (_artifact_schema.py:46) — every write faces it, and the deletion escape only ever
         shrinks the document."}, default: 65536, distinguished: [], falsy_valid: false,
         documented_alternatives: []}}}

    # ---- registration / grants ----
    - {id: fix_row_offer, provenance: design, facets: {}}
      # The `prepare=`-gated ToolDefinition the model is SHOWN. Split from the `fix_row` actor
      # on purpose: prepare is ergonomics, the body is the guard (SEC3). b6 (at 1.107.0, not
      # 2.19) is what makes hiding work at all.
    - {id: main_toolset,  provenance: code,   facets: {}}   # ToolSet(read, bash, append, close) — driver.py:298; sole append=True grant (bd10)
    - {id: AgentDeps,     provenance: code,   facets: {}}   # unchanged — M3 adds no field

    # ---- budget rosters ----
    - id: main_tail_tools
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`_MAIN_TAIL_TOOLS` (budget_enforcer.py:225) — the by-name tail-tier
            allowlist. `tier()` returns 'tail' only for its members; everything else is 'core'
            and is permanently refused once a cap trips (g17). R1 adds `fix_row`."}
          default: core
          distinguished: ["fix_row"]
          falsy_valid: false
          documented_alternatives: []
    - id: budget_exempt_tools
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "`BUDGET_EXEMPT_TOOLS` (budget_enforcer.py:32) — the ONLY set the
            unconditional `tail_exhausted` hard-kill in `driver._budget_short_circuit` honours,
            and it has exactly one member. R1 deliberately did NOT add fix_row, which is why
            O5 is scoped rather than unconditional (bd2/bd6)."}
          default: not-exempt
          distinguished: ["close_investigation"]
          falsy_valid: false
          documented_alternatives: []
    - {id: budget_refusal_message, provenance: design, facets: {}}   # names append_block + close as the survivors; wrong set while a window is open

    # ---- the remaining by-name rosters and the prose sites (F-L) ----
    - {id: visualize_roster,      provenance: design, facets: {}}   # visualize_data.py:159,167
    - {id: replay_harness_roster, provenance: design, facets: {}}   # _replay_harness.py:246 `_is_investigation_write`
    - {id: vulture_baseline,      provenance: design, facets: {}}   # scripts/lint/lint_vulture_baseline.json:49 — IN-REPO, CI-blocking
    - {id: defender_SKILL_md,     provenance: design, facets: {}}   # :419, :425, :457
    - {id: invlang_SKILL_md,      provenance: design, facets: {}}   # the `:R` section
    - {id: defender_invlang_cli,  provenance: code,   facets: {}}   # no `validate` subcommand (N6; p14/g18)

  interacts:

    # ---- writes into investigation.md (the delta: append_block's semantics change, fix_row is new)
    - {from: append_block, to: investigation_md, mode: write, via: api, provenance: design, sends: payload, interpolates: [run_id]}
    - {from: fix_row,      to: investigation_md, mode: write, via: api, provenance: design, sends: payload, interpolates: [run_id]}

    # ---- the moved readers of investigation.md
    - {from: warn_diagnostics,   to: investigation_md, mode: read, via: fs, provenance: design}
    - {from: close_investigation, to: investigation_md, mode: read, via: fs, provenance: design}
    - {from: persist_run,        to: investigation_md, mode: read, via: fs, provenance: design}

    # ---- the UNMOVED readers (brief g2's census; R7's question, one demand per reader edge)
    - {from: challenge_gate,        to: investigation_md, mode: read, via: fs,  provenance: code}
    - {from: invlang_corpus,        to: investigation_md, mode: read, via: fs,  provenance: code}
    - {from: prologue_extract,      to: investigation_md, mode: read, via: fs,  provenance: code}
    - {from: forward_check,         to: investigation_md, mode: read, via: fs,  provenance: code}
    - {from: run_common_cross_check, to: investigation_md, mode: read, via: fs, provenance: code}
    - {from: check_append_only,     to: investigation_md, mode: read, via: api, provenance: code}

    # ---- the window
    - {from: fix_row,           to: flagged_row_set, mode: write, via: api, provenance: design, interpolates: [row_text]}
      # `interpolates: [row_text]` against `key_axes: [on_disk_line]` is PR-1's refutation in
      # formal slots: row_text is a NON-INJECTIVE derivation, so the writer does not cover the
      # key. R2's coverage arm computes it; the whitespace case is the counterexample.
    - {from: append_block,       to: flagged_row_set, mode: read, via: api, provenance: design}
    - {from: close_investigation, to: flagged_row_set, mode: read, via: api, provenance: design}
    - {from: register_tools,     to: flagged_row_set, mode: read, via: api, provenance: design}
      # `prepare=` runs on EVERY model request, so this read is on the hot path and must
      # tolerate the file not existing on turn 1 (20-demands red flag 5).

    # ---- the validator chain
    - {from: append_block, to: validate_investigation, mode: invoke, via: decide_write, provenance: design}
    - {from: fix_row,      to: validate_investigation, mode: invoke, via: decide_write, provenance: design}
    - {from: persist_run,  to: validate_companion,     mode: invoke, via: api, provenance: design}
    - {from: close_investigation, to: validate_artifact, mode: invoke, via: api, provenance: code}
    - {from: append_block, to: closed_for_investigation_write, mode: invoke, via: api, provenance: code}
    - {from: fix_row,      to: closed_for_investigation_write, mode: invoke, via: api, provenance: design}
    - {from: close_investigation, to: closed_for_investigation_write, mode: invoke, via: api, provenance: code}
    - {from: append_block, to: INVESTIGATION_FILE_MAX, mode: read, via: api, provenance: code}
    - {from: fix_row,      to: INVESTIGATION_FILE_MAX, mode: read, via: api, provenance: design}

    # ---- the other two artifacts
    - {from: close_investigation, to: report_md,         mode: write, via: fs, provenance: code, interpolates: [run_id]}
    - {from: persist_run,         to: learning_run_dir,  mode: write, via: fs, provenance: code, interpolates: [run_id]}

    # ---- the model-facing channel
    - {from: append_block,        to: model_context, mode: write, via: api, provenance: design, sends: payload}
    - {from: fix_row,             to: model_context, mode: write, via: api, provenance: design, sends: payload}
    - {from: close_investigation, to: model_context, mode: write, via: api, provenance: design, sends: payload}
    - {from: budget_enforcer,     to: model_context, mode: write, via: api, provenance: design, sends: payload}

    # ---- severity, the key vocabulary, the arguments
    - {from: diagnose,               to: severity,          mode: read,  via: api, provenance: design}
    - {from: check_attr_update_keys, to: severity,          mode: write, via: api, provenance: design}
    - {from: check_attr_update_keys, to: Diagnostic,        mode: write, via: api, provenance: design}
    - {from: check_attr_update_keys, to: attr_update_keys,  mode: read,  via: api, provenance: design}
    - {from: apply_attr_updates,     to: attr_update_keys,  mode: read,  via: api, provenance: design}
    - {from: fix_row,                to: old_row,           mode: read,  via: argv, provenance: design}
    - {from: fix_row,                to: new_row,           mode: read,  via: argv, provenance: design}

    # ---- effective vertex state: TWO construction sites, ONE consumer
    - {from: seed_vertex_state,      to: effective_vertex_state, mode: write, via: api, provenance: code,   interpolates: [vertex_id]}
    - {from: apply_attr_updates,     to: effective_vertex_state, mode: write, via: api, provenance: design, interpolates: [vertex_id]}
    - {from: check_benign_open_slots, to: effective_vertex_state, mode: read, via: api, provenance: code}

    # ---- registration and grants
    - {from: register_tools, to: fix_row_offer, mode: write, via: api, provenance: design}
    - {from: register_tools, to: main_toolset,  mode: read,  via: api, provenance: code}
    - {from: register_tools, to: AgentDeps,     mode: read,  via: api, provenance: design}

    # ---- budget
    - {from: budget_enforcer,      to: main_tail_tools,       mode: read, via: api, provenance: design}
    - {from: budget_enforcer,      to: budget_refusal_message, mode: read, via: api, provenance: design}
    - {from: budget_short_circuit, to: budget_exempt_tools,   mode: read, via: api, provenance: code}

    # ---- the remaining rosters and prose sites
    - {from: visualize_data,  to: visualize_roster,      mode: read, via: api, provenance: design}
    - {from: replay_harness,  to: replay_harness_roster, mode: read, via: api, provenance: design}
    - {from: vulture_lint,    to: vulture_baseline,      mode: read, via: api, provenance: design}

  drives:
    - {from: run_investigation, to: append_block,        provenance: code,   multiplicity: concurrent}
    - {from: run_investigation, to: fix_row,             provenance: design, multiplicity: concurrent}
      # CORRECTED SLOT, and it is load-bearing: rt1 EXECUTED two tool calls in one model
      # response at pydantic-ai-slim 1.107.0 and they ran concurrently (thread pool for sync
      # bodies, event-loop interleave for async). rt2 showed the consequence with the real
      # `write_guarded` primitive: both bodies read the same pre-image, the last write wins,
      # and BOTH calls report success. `Agent.tool(..., sequential=True)` exists in the pinned
      # floor and is unused (rt3). R2 reads this slot.
    - {from: run_investigation, to: close_investigation, provenance: code,   multiplicity: concurrent}
    - {from: run_investigation, to: register_tools,      provenance: code,   multiplicity: serial}
    - {from: budget_short_circuit, to: fix_row,          provenance: design, multiplicity: serial}
      # every tool call passes the short-circuit first — which is why a tail-tier fix_row still
      # dies at the ceiling (bd2).
    - {from: diagnose, to: check_attr_update_keys,       provenance: design, multiplicity: serial}
    - {from: diagnose, to: check_append_only,            provenance: code,   multiplicity: serial}
    - {from: check_benign_open_slots, to: seed_vertex_state,  provenance: code,   multiplicity: serial}
    - {from: check_benign_open_slots, to: apply_attr_updates, provenance: design, multiplicity: serial}
    - {from: close_investigation, to: challenge_gate,    provenance: code,   multiplicity: serial}
      # F-B: whether M5's gate runs BEFORE this drive (never spending a review on a close that
      # will be refused) is the open ordering question.
    - {from: replay_harness, to: fix_row,                provenance: design, multiplicity: serial}
      # the declared harness is an execution context for the new verb — and cannot express it
      # until `_is_investigation_write` moves (brief F11).

# ---------------------------------------------------------------------------
# THE LEDGER. Every claim any input frontier raised, with its id preserved. Ids were coined
# independently by five passes and COLLIDED, so three families are prefixed and the mapping is
# stated once here:
#   r*/c*/b*/x1/d1  the design doc's inherited sweep (15)
#   p1-p18          demand extraction (20-demands.md)
#   g1-g20          phase-A grounding (10-brief.md)
#   cp1-cp5         the compaction re-ground (35-reground-compaction.md, was p1-p5)
#   pr1a-pr1e       probe PR-1 (46-probe-pr1.md, was c1-c5)
#   pr3/4/8/9/11    probes PR-3/4/8/9/11 (47-probes-validator.md)
#   bd1-bd10        probes PR-2/10/12 (48-probes-budget.md, was b1-b10)
#   rt1-rt11        probes PR-5/6/7 (49-probes-runtime.md)
# Verdicts are normalised to the closed vocabulary (`holds | refuted | unrefuted | unprobed |
# deferred`): the inputs' `holds-with-correction`, `holds-with-note` and `refines-c2` each
# carry their qualifier into `observed` instead, where it cannot be mistaken for a verdict.
# Instruments are the ones ACTUALLY used; where a phase-A claim was filed as `behavior` and
# closed on a read, it is either retyped to the referential fact it really asserts (g13, g14,
# p15, bd7, bd9, rt3, rt10) or re-closed on the execution a later probe supplied (p5, p18).
# ---------------------------------------------------------------------------

claims:

  # ==== inherited from the design doc's sweep (15) ====
  - id: r1
    kind: referential
    claim: >
      append_block concatenates, then runs the whole resulting document through decide_write ->
      validate_investigation -> diagnose, and on any diagnostic the deny reason carries
      UNCHANGED_NOTICE and write_guarded never runs
    probe: read runtime/tools.py:451-502 and _artifact_schema.py:221-262
    probe_kind: read
    observed: >
      confirmed at c0dca747; re-verified by grounding as g11 over the same lines plus
      permission/files.py:340-397
    verdict: holds
    source: discuss
  - id: r2
    kind: referential
    claim: >
      _check_attr_update_keys walks only :R attr_updates blocks that declare a `key` column, so
      a flagged row is never a :V/:E row
    probe: read skills/invlang/validate.py:628-666
    probe_kind: read
    observed: >
      the loop skips any block where block.name != 'attr_updates' or 'key' not in cols;
      re-verified as g10
    verdict: holds
    source: discuss
  - id: r3
    kind: referential
    claim: main's ToolSet grants read/bash/append/close — no write_file, no edit_file
    probe: read runtime/driver.py:298 and runtime/agent_definition.py:26-44
    probe_kind: read
    observed: ToolSet(read=True, bash=True, append=True, close=True); re-verified as p9/g12
    verdict: holds
    source: discuss
  - id: r4
    kind: referential
    claim: >
      learning/core/persist.py re-validates investigation.md on the copy path and its error
      branch constructs RunUnprocessable before the copy proceeds
    probe: read learning/core/persist.py:205-212
    probe_kind: read
    observed: validate_companion(src.read_text('utf-8'), None); the error branch is the gate O2 names
    verdict: holds
    source: discuss
  - id: c1
    kind: census
    claim: all bad-refinement-key refusals across every local run are key='ident'
    probe: >
      regex sweep over 8 runs' llm_requests.jsonl, deduped by refusal text, extracting
      the refused key
    probe_kind: search
    observed: >
      Counter({'ident': 14}) — 14 of 14 under the doc's per-occurrence unit; 7 of 7 under
      grounding's global-unique unit (g7). Holds absolutely under both.
    verdict: holds
    source: discuss
  - id: c2
    kind: census
    claim: >
      17 unique invlang refusals across 8 runs; families are attr-key 14, parser-error 6,
      dangling ref 6, provenance 5, gating 2
    probe: the same sweep, classifying each '- ' diagnostic line
    probe_kind: search
    observed: >
      REFUTED ON UNITS AND COUNTS (25-early-resolutions.md, ledger correction 2): the family
      counts sum to 33 against a stated total of 17, so they count per-refusal occurrences, not
      unique refusals. Re-swept under global-unique diagnostic-line dedup: 26 lines — attr-key
      7, parse 6, provenance 5, gating 5, undeclared-ref 3 (g8). Attr-key still leads, by 7 to
      6 rather than 14 to 6; the gating count (2 vs 5) and the ref count (6 vs 3) reconcile
      under neither unit. The design's 'the dominant family is one missing capability' framing
      survives; only the margin shrinks.
    verdict: refuted
    source: discuss
  - id: c3
    kind: census
    claim: the effective vertex identifier has no reader other than append-only's _vertex_core
    probe: grep over defender/ for '"identifier"' and '.identifier', excluding tests
    probe_kind: search
    observed: >
      validate.py:412 (_vertex_core, reads the DECLARED value) and parser.py:153 (writes it);
      g9 adds schema.py:30, a TypedDict field declaration the doc's regex could not see and not
      a reader
    verdict: holds
    source: discuss
  - id: b1
    kind: behavior
    claim: a bad-key :R attr_updates row is inert — it changes no effective vertex state
    probe: _effective_vertex_state over a fixture with key='ident' vs key='attrs.ident'
    probe_kind: executed
    observed: >
      bad -> {'classification': 'artifact/config', 'attributes': {}}; good -> attributes
      {'ident': '/root/.ssh/authorized_keys'}
    verdict: holds
    source: discuss
  - id: b2
    kind: behavior
    claim: >
      repairing OR deleting a landed :R attr_updates row in place does not trip append-only
    probe: diagnose(repaired, baseline) and diagnose(deleted, baseline) against an on-disk baseline holding the bad row
    probe_kind: executed
    observed: both return [] — no append-only violation; fence count unchanged (1 -> 1)
    verdict: holds
    source: discuss
  - id: b3
    kind: behavior
    claim: the same in-place edit of a :V row DOES trip append-only
    probe: mutate v-002's ident in the :V declaration, run _check_append_only
    probe_kind: executed
    observed: >
      append-only violation — committed vertex v-002 was mutated in place. NOTE the boundary
      rt8 later drew around this: it holds for a MUTATION of a committed core, not for an
      INSERTION of a new record (rt9) nor for a second declaration of an existing id (rt8).
    verdict: holds
    source: discuss
  - id: b4
    kind: behavior
    claim: >
      a landed warn-family row re-fires on every subsequent append — so the gate is forced,
      not chosen
    probe: diagnose(baseline + a fresh valid block, baseline) where the baseline holds the bad row
    probe_kind: executed
    observed: the key='ident' diagnostic is returned again on the next append
    verdict: holds
    source: discuss
  - id: b5
    kind: behavior
    claim: persist's surface refuses a doc holding the bad row and accepts it once repaired
    probe: validate_companion(bad, None) and validate_companion(repaired, None)
    probe_kind: executed
    observed: bad -> one attr_updates diagnostic; repaired -> []
    verdict: holds
    source: discuss
  - id: b6
    kind: behavior
    claim: >
      pydantic-ai's prepare= hides a tool from the model when it returns None, at the version
      this project actually runs
    probe: >
      two-tool Agent on TestModel, prepare returning tool_def or None off deps, re-executed on
      defender/.venv (1.107.0) AND on the stray system python3 (2.19.0)
    probe_kind: executed
    observed: >
      CORRECTED LABEL (25-early-resolutions.md, ledger correction 1): the doc said 'pydantic-ai
      2.19'. defender/pyproject.toml:17 floors pydantic-ai-slim at >=1.107, uv.lock pins
      1.107.0, and defender/.venv imports 1.107.0; the 2.19.0 reading came from
      /usr/local/lib/python3.11/site-packages via the bare python3 on $PATH — a different
      interpreter entirely. Both give window=False -> ['always_tool'], window=True ->
      ['always_tool','gated_tool']. The MECHANISM holds at the real floor; only the version
      string was wrong.
    verdict: holds
    source: discuss
  - id: x1
    kind: reachability
    claim: fix_row cannot reach a committed :V/:E record
    probe: >
      break-attempt: substitute a well-formed :V row for a flagged :R attr_updates row, once
      with an id colliding with a committed vertex, once with a fresh id, once with the
      document's own fence delimiter embedded, and run diagnose + _check_append_only (PR-7)
    probe_kind: executed
    observed: >
      REFUTED. The doc's argument rested on _check_append_only still running on the result
      (b2/b3) — but _check_append_only compares :V/:E CORES ONLY and never inspects :R rows
      (rt10). Fresh id: accepted with zero diagnostics, both vertices genuinely present (rt9).
      Colliding id: zero diagnostics, because the parser's `_extend_by_id` first-declaration-
      wins fold drops the second declaration before append-only can see a collision (rt8).
      Embedded ``` delimiter: zero diagnostics and the injected row VANISHES from the parsed
      document — silent, warning-free content loss (rt11). Every construction tried lands
      clean; O3/SEC1 has no enforcement of its own today.
    verdict: refuted
    source: discuss
  - id: d1
    kind: behavior
    claim: the warn+gate loop actually reduces main's output tokens on a live run
    probe: deferred to a post-merge rerun of fresh-authkeys-20260810
    probe_kind: executed
    observed: >
      not run — the projected saving on the measured run is 1,067 tokens (8% of main's output),
