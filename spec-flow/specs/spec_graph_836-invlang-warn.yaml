      ['bash','read_file','append_block'].
    verdict: holds

  # ==== PR-5/6/7: concurrency, the bash lane, and append-only's real boundary (11) ====
  - id: rt1
    kind: behavior
    claim: >
      two tool calls in ONE model response execute SEQUENTIALLY against re-read state at
      pydantic-ai-slim 1.107.0
    probe: >
      Agent + FunctionModel emitting a single ModelResponse with two ToolCallParts (a synthesized
      fix_row and append_block, both read-fresh/write shaped), async and sync bodies, both call
      orders, instrumented with thread name and perf_counter
    probe_kind: executed
    observed: >
      REFUTED — execution is CONCURRENT by default. Async bodies interleave on the event loop,
      sync bodies run in the AnyIO worker thread pool, and in every trial BOTH reads happen
      before EITHER write, so neither body sees the other's write.
    verdict: refuted
  - id: rt2
    kind: behavior
    claim: >
      the concurrent scheduling produces a genuine lost update when the tool bodies use the real
      production write primitive (defender._io.write_guarded)
    probe: the rt1 harness rebuilt over read_text_utf8 / write_guarded; three trials
    probe_kind: executed
    observed: >
      all three trials: identical pre-image in both reads (no tearing — write_guarded's atomic
      replace is clean at the byte level), and the final disk content contains exactly ONE of
      the two intended changes. The losing call's write_guarded returns normally and the tool
      still reports its success string to the model. A same-turn fix_row + append_block pair
      silently drops one write and tells the model both landed.
    verdict: holds
  - id: rt3
    kind: referential
    claim: >
      pydantic-ai exposes an opt-in for ordered execution (Agent.tool(..., sequential=True)) and
      runtime/tools.py does not use it
    probe: inspect.signature(Agent.tool); re-ran the rt1/rt2 harness with sequential=True; grep for 'sequential' in runtime/
    probe_kind: read
    observed: >
      the signature includes `sequential: bool = False`; with it True on both tools, the second
      body read the first's write and both changes survived, in emission order. grep over
      runtime/tools.py and runtime/*.py returns no hits — main's real append_block, and any
      future fix_row, register with the concurrent default.
    verdict: holds
  - id: rt4
    kind: behavior
    claim: >
      main's bash grant set, as compiled at run time by compile_policy_for(MAIN_DEF, run_dir),
      contains no writer-shaped grant
    probe: executed compile_policy_for(MAIN_DEF, run_dir) and printed policy.bash_allow
    probe_kind: executed
    observed: >
      bash_allow = cat (scoped), wc, tail, head, grep (all STDIN_VIEWERS, extractor
      OPENS_NOTHING), defender-invlang, defender-lessons, defender-sql, echo, true. The separate
      write_allow lane is [investigation.md] only, reached exclusively through append_block.
    verdict: holds
  - id: rt5
    kind: behavior
    claim: >
      every direct shell-redirection write construction against investigation.md is denied, at the
      permission gate and independently at the tokenizer
    probe: >
      decide_bash() over a compiled MAIN policy for echo/cat/printf > file, >> file, sed -i, tee,
      cp, mv, dd of=, python3 -c open(...,'w'), rm — all targeting <run_dir>/investigation.md
    probe_kind: executed
    observed: >
      every attempt allow=False; _PipelineBuilder.feed_token raises BashExecError on any `>`
      token except `2>/dev/null` and `2>&1`, and _parse() turns that into a deny
    verdict: holds
  - id: rt6
    kind: behavior
    claim: >
      defender-sql is permission-gate-ALLOWED to run write-shaped SQL against an arbitrary path,
      and the boundary that actually stops it lives in scripts/gather_tools/sql.py's duckdb
      session, not in runtime/permission/
    probe: >
      decide_bash() for COPY ... TO, ATTACH, EXPORT DATABASE and SET enable_external_access=true
      against the compiled MAIN policy, then actually ran sql.py with the same SQL over valid
      stdin JSON on the venv's duckdb 1.5.4
    probe_kind: executed
    observed: >
      all four constructions allow=True — defender-sql's extractor is OPENS_NOTHING and the gate
      never parses the SQL argument. Every execution then failed inside duckdb ('file system
      operations are disabled by configuration' / 'the configuration has been locked'), because
      sql.py:161-162 sets enable_external_access=false and lock_configuration=true before the
      user's SQL. investigation.md was unchanged after every attempt. The negative HOLDS in
      practice; the boundary the obligation NAMED does not.
    verdict: holds
  - id: rt7
    kind: referential
    claim: >
      defender-invlang and defender-lessons, the other two shims on main's bash lane, expose no
      write-capable subcommand or attacker-controlled path argument
    probe: read the two argparse surfaces and the two shim scripts under defender/bin/
    probe_kind: read
    observed: >
      invlang's subcommands are all read-only queries over a loaded corpus and its shim hardcodes
      corpus_root ahead of "$@"; lessons_fm.py offers frontmatter grep only
    verdict: holds
  - id: rt8
    kind: behavior
    claim: >
      a :V row substituted for a flagged :R attr_updates row, with an id colliding with a
      committed vertex but a different core, is caught by _check_append_only as a mutation
    probe: diagnose(proposed, current) and _check_append_only(...) over a minimal two-vertex document
    probe_kind: executed
    observed: >
      REFUTED — both return []. parse_dense_companion folds both :V blocks through _extend_by_id,
      which is first-declaration-wins (parser.py:609-627), so the SECOND v-001 declaration is
      dropped before the companion is built and no collision is ever exposed to append-only's
      core comparison. The parser absorbs it, silently.
    verdict: refuted
  - id: rt9
    kind: behavior
    claim: >
      a :V row substituted for a flagged :R attr_updates row with a FRESH id is accepted with no
      diagnostic — append-only does not object to a new record inserted at a flagged row's position
    probe: the rt8 harness with the injected :V declaring a never-seen v-999
    probe_kind: executed
    observed: >
      diagnose() -> [], _check_append_only(...) -> [], and both v-001 and v-999 are genuinely
      present as vertex records. b2/b3 cover repair-in-place and mutation-in-place; the vertex/
      edge loop has no 'unexpected new id' check at all — it only ever looks for MISSING or
      MUTATED committed ids.
    verdict: holds
  - id: rt10
    kind: referential
    claim: >
      _check_append_only's coarse fence-count guard compares only the total number of fenced
      blocks and structurally cannot protect an individual :R row's content
    probe: read validate.py:438-455 against the rt8/rt9 fixtures
    probe_kind: read
    observed: >
      cur_fences and new_fences both derive from len(INVLANG_FENCE_RE.findall(text)) — a
      whole-document block count, blind to which rows a block carries. Removing or replacing one
      row inside an existing fenced block never changes it.
    verdict: holds
  - id: rt11
    kind: behavior
    claim: >
      replacing the flagged row with a :V row whose line-leading text contains the document's own
      fence delimiter is caught by the fence-count guard
    probe: the rt8/rt9 fixture family with three literal backticks leading the injected row
    probe_kind: executed
    observed: >
      REFUTED, and worse than a gap: fence counts match 1 == 1, the regex treats the injected
      row's own ``` as the block's CLOSING delimiter, and the injected row plus the real trailing
      fence fall outside any match. parse_dense_companion(proposed).vertices -> [v-001] only —
      the injected row VANISHES from the parsed document with zero warnings. diagnose() -> [] and
      _check_append_only(...) -> []. Silent, warning-free content loss, which neither 'accepted'
      nor 'refused' review language covers.
    verdict: refuted

gate:

  # Computed by `spec-graph gate --residue` (31 triggers over R1-R4/R7) plus the R0 formal
  # `unknown` finding and the two judgment halves this leaf ran by hand (R5's tightening
  # extension, R6's chooser/sanitizer walk — R0's bidirectional reconciliation is folded into
  # the R0 entry below). Nothing here is resolved by a human yet: §7 runs after this phase.
  # Every `holes` entry below carries `resolution: "OPEN — ..."` and a `cites` grounding it —
  # per check_claims, a hole closed by judgment alone (no `resolved_to`) is a spend-point and
  # an uncited one is `asserted`, not a pass.
  evaluated:
    - {rule: R0, fired: true}
      # Formal half: the tool's one finding (investigation_md.access[fix_row]'s `unknown`,
      # unheard) is recorded below. Judgment half (bidirectional prose reconciliation): read
      # against the design's own O1-O5/N1-N6/M1-M7 sentences as carried through the brief,
      # 20-demands.md and every fork's own restatement of them — no normative sentence was
      # found binding no element beyond what the nine open forks and the two R2 holes below
      # already carry, and no delta element traces to no sentence (the six-roster grounded
      # neighbourhood is code-provenance, not design-normative, and needs no design sentence).
    - {rule: R1, fired: true}
    - {rule: R2, fired: true}
    - {rule: R3, fired: true}
    - {rule: R4, fired: true}
    - {rule: R5, fired: true}
      # Judgment extension: the delta TIGHTENS (M5 refuses writes/close while a row is
      # flagged) rather than removing anything, so the question is whether a security-critical
      # caller is left constructible in a state the tightening was supposed to close. It is:
      # F-A's retry-exhaustion path force-closes through a bare `except Exception` handler that
      # only logs, swallowing M5's refusal. Recorded as a hole below, citing F-A's own claims.
    - {rule: R6, fired: true}
      # Chooser/sanitizer walk over every value reaching model_context: the refusal-family
      # renders (gate_refusal_names_rows_and_alternatives, gate_refusal_names_every_flagged_row,
      # warn_block_lands) echo a flagged row's on-disk text back into the model's transcript.
      # pr1a/pr1c already establish NO sanitizer sits between the on-disk row and the render
      # (byte-identical echo, including control/bidi characters) — chooser is model-authored,
      # attacker-influenced content, sanitizer column empty. Recorded as a hole below: this is
      # a probe obligation (does a hostile row corrupt the refusal message's own frame), not a
      # decision, and no claim yet answers it.
    - {rule: R7, fired: true}

  obligations:
    - rule: R3
      element: investigation_md.access[append_block]
      witness: >
        append_block's own write-gate contract (closed-for-investigation-write, decide-write,
        encodable, size-bound, diagnose-error-severity) is exercised in substance by
        write_gate_accepts_warn_only_document (decide-write/warn-severity-permissive, itself
        parity-checked against fix_row's cell via validate_investigation.access[decide_write]),
        append_block_gated_while_flagged (closed-for-investigation-write) and
        append_block_mixes_warn_and_error_defects (diagnose-error-severity) — but no demand
        named this per-cell address, so check_binds saw it as an orphan. Rebound
        write_gate_accepts_warn_only_document's `binds` to add investigation_md.access
        [append_block]; the constellation of demands above remains the substance discharging
        it, per-cell discipline is now satisfied by the address, not by inventing a new test.
      discharged_by: write_gate_accepts_warn_only_document
    - rule: R3
      element: investigation_md.access[write_file]
      witness: >
        Unlike bash (bash_cannot_construct_a_write_reaching_investigation_md), no demand names
