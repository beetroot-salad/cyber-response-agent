    probe: grep over the repo, excluding tests, for _effective_vertex_state / effective_vertex
    probe_kind: search
    observed: >
      two hits — the definition at validate.py:727 and the single call at validate.py:738
      inside _check_benign_open_slots, which iterates classification and attributes and refuses
