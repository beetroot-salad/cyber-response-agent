        (fix_row_over_the_size_bound_refused already covers fix_row's own contract). MINTED
        append_block_size_bound_unchanged_by_fix_row, a cheap coherence regression pinning that
        append_block's existing size-bound refusal is unaffected by fix_row sharing the
        constant — R7's "known noise mode": this reader is unaffected because the constant it
