       gather script is present. RESOLVED: the ORIENT-time call is conditional/injectable, so the 62-of-95 `drive()` sites that omit `verbs=` are unaffected (`d49`).
       resolved_by: auto"
    - "K13 — a degenerate ancestor-id predicate returns other people's documents (P1a, executed).
