tests: defender/tests/e2e   # the suite this graph is the derivation of. Every demand below is
                            # observable only from a DRIVEN run (the ORIENT block MAIN receives,
                            # the run-dir tables written before the first model turn), and the
                            # only hermetic way to reach the backend is the harness's injected
                            # `verbs=` seam — so phase E writes every test into this one dir.
                            # `suite_files` globs one level: a test parked in defender/tests/
                            # instead loses its docstring and reports as a prose orphan.
schema_version: 1
design: "808"   # gh#808, comment by beetroot-salad 2026-08-10T11:54:46Z — "Revised design —
                # supersedes the earlier comment". The body and the first comment are context
                # only; where the two disagree the revision wins, and where the revision
                # disagrees with the brief or an executed probe, THE PROBE WINS (see `refuted`).
base: 643f2dd4  # the fork commit write-code-from-spec's gate diffs against

# ===========================================================================================
# READ THIS FIRST
#
# The change: a HARNESS-EXECUTED LEAD-0. Before MAIN's first model turn the runtime resolves
# the alert's ancestor documents itself (item 1, sync, no subagent) and dispatches one tightly
# bounded correlation gather lead (item 3), writing both into the run's own leads/queries
# tables under reserved lead ids so the learning loop and the review gate cite them like any
# other lead. Item 2 (parsing the rule's join keys) is an explicit NON-obligation — `d24` is
# the negative demand that pins the deferral.
#
# The `gate:` block below is the gate leaf's (phase D, step 6): `gate.evaluated` records all
# eight rules' outcomes and `gate.pre_discharged` credits the hits an existing `form: test`
# demand already answers, each citing an executed/probed claim. The 34 still-unanswered
# triggers, the 3 formal `unknown`s, R0's prose-reconciliation hit, R5's clean judgment call and
# R6's chooser/sanitizer walk are TYPED AND ROUTED in `.spec-flow/frontiers/60-residue.md`, not
# resolved here — §7 is the human seam and has not run. `spec-graph gate` (bare) will still
# report findings against this file; every one of them is accounted for in that residue file.
# Nothing below has been through the human seam yet: every fork in `handoff.forks` is OPEN.
#
# NAMES THIS SPEC MINTS ON THE PRODUCTION SIDE (phase E must use them verbatim, or
# `check_binds` skips the concept silently — schema.md, "Coin ids from the code's name"):
#   runtime/lead_zero.py                    — the module `d14`'s seam demand pins
#   lead_zero.<entry point>                 — ONE ORIENT-time entry point; its name is fork F1
#   the reserved ids `l-000` (item 1) and the correlation id (F5 — UNNAMED, an R0 hole)
#
# ===========================================================================================
# NAME RECONCILIATION — grounding (10-brief), demand extraction (20-demands) and the
# dispositions' address derivations (45-dispositions + the two 46-reground payloads) coined ids
# independently. Unified here by ROLE+ORIGIN, against the code:
#
#   `gather_dispatch` = runtime/tools_gather.py::_run_gather. 20-demands binds
#       `drives(lead_zero->_run_gather)`; the profile's contextAliases already maps the file
#       stem `tools_gather` -> `gather_dispatch` and spec_graph_807 uses that id, so the graph
#       keeps `gather_dispatch` and every `_run_gather` bind is rewritten to it.
#   `gather_raw` SPLIT INTO TWO BOUNDARIES. The brief's resource table lists two sub-paths
#       under one name and 20-demands binds both through the single id `gather_raw`, which
#       collapses two different contracts onto one address:
#         `lead_sidecar`     = gather_raw/{lead_id}.lead.json — the LEADS TABLE row, claimed
#                              O_CREAT|O_EXCL by hooks/record_lead.claim_lead, keyed [lead_id],
#                              and the carrier of item 3's harness-authored contract (goal +
#                              what_to_summarize). `d8`/`d11`/`d12`/`d14`/`d16`/`d25` bind it.
#         `gather_payloads`  = gather_raw/{lead_id}/{seq}.json — the raw payload sidecars,
#                              keyed [lead_id, seq] by query_tool._persist_payload.
#       Keeping them fused would have let a demand on the sidecar read as an answer to R2's
#       question about the payload tree's seq allocation, and vice versa.
#   `orientation`  = runtime/orient.py::orientation (the ACTOR that assembles the block);
#   `orient_block` = the rendered ORIENT text it returns (the BOUNDARY). 20-demands uses both
#       names already; they are one role each and are kept distinct on purpose — `d15` is
#       precisely the claim that the actor performs no I/O of its own.
#   `elastic_query` = the elastic search surface reached through the injected registry. The
#       brief calls it `elastic_adapter`; `elastic_adapter` is kept as the ACTOR (the verb
#       implementations, the only production caller of `confine_index`) and `elastic_query` as
#       the BOUNDARY the verbs reach. Its access facet is keyed BY VERB (`verb-query`,
#       `verb-alerts`, `verb-esql`) because the verbs are this boundary's real access
#       surfaces and they do NOT enforce the same constraints — `esql` is not index-confined
#       at all (g6/r19/P2). 20-demands' `elastic_query.access[verb-alerts]` /
#       `[verb-query]` spellings are therefore kept verbatim.
#   `verb_registry` = runtime/verbs.ModuleVerbRegistry. A SECOND access surface, keyed by
#       CALLER PATH, and the change's real security question: P2 executed the split — six of
#       the eight named screens live in `QueryCapture` and are NOT inherited by a direct
#       `registry.verbs(system)[verb]` call, which is exactly the shape lead-0 takes.
#   `lead_id` = the lead-identifier namespace itself, modelled as a boundary because the
#       change alters its CONTRACT (ids stop being all model-minted) while five existing
#       readers keep the old reading. This is where K11 lives; R7 is the rule that sees it.
#   `run_dir_listing` = the run-dir name listing scripts/workspace_map.py renders into message
#       0. Not a name any producer coined — minted here because a flagged fact
#       ("executed_queries.jsonl becomes a NEW name in message 0's listing") had no address.
#   `claim_lead` / `confine_index` are boundaries, not actors: what the change binds is each
#       one's CONTRACT (a return-code domain; an index-expression domain), not its execution.
#
#   AXES: `lead_id`, `seq`, `session_id`. 20-demands declared no `axes:` list at all while
#       binding `gather_raw.identity` and `executed_queries.identity` — the join-breaker the
#       registry exists to prevent. `agent_id` (= f"gather:{lead_id}") is registered as an
#       injective DERIVATION of `lead_id`, not as an axis of its own.
#
#   CORRECTED SLOT: 20-demands' `d5` ("one backend call regardless of ancestor count") is
#       carried VERBATIM as the design's own sentence, but the judge's K3/K5 clusters and c4
#       (a comma-joined multi-index expression is refused WHOLE) make it false as written:
#       two backing indices cannot share one call, and F4's surviving arm adds a shell-alert
#       fetch. The demand is not silently reworded here — that is §7's call — but the
#       structure carries the two facts and the fork is recorded.
# ===========================================================================================

demands:

  # =========================================================================================
  # #0 — THE RETURN CONTRACT, RESTATED AGAINST THE RESOLVED SHAPE (75-reclassified.md §"Restated
  # demand #0"). No longer `provisional`: F1 is closed. Both of the old clauses are SUPERSEDED —
  # K10 moves item 3's summary off the ORIENT-text path entirely, and "it never raises" is
  # contradicted by P3 plus K7's routing, which put BudgetKill / RunAborted / breaker-trip on
  # lead-0's own frame. It gains the three binds it did not carry: the QueryCapture seam, the
  # `status` value, and the handler at the lead-0 call site.
  # =========================================================================================
  - {id: d0_lead_zero_return_contract, kind: behavior, form: test,
     binds: ["lead_zero", "interacts(lead_zero->orient_block).payload",
             "drives(run_investigation->lead_zero)", "interacts(lead_zero->verb_registry)"],
     discharged_by: test_lead_zero_returns_section_text_entities_and_status,
     rejected: [{nl: "a rendered `str` return: it cannot carry the entity sets d17 binds"},
                {nl: "singular host/user/source-ip entities: K9 binds SETS, because the issue's
       own worked example resolves to two users from two source IPs"},
                {nl: "'the entry point never raises': P3 + K7 put the propagating arms on
       lead-0's own frame, and d41 is the handler that answers them"},
       {nl: "a status whose only checked value is succeeded-with-entities. `failed` and
       `succeeded-empty` were named in this demand's prose and exercised only indirectly
       through d22's dispatch gating, so nothing pinned that they are distinct VALUES rather
       than two spellings of 'no entities' — which is the distinction K13 makes load-bearing.
       All four are now asserted by value at the entry point"},
       {nl: "entities that are deduplicated only in prose. The four resolved documents name
       dev.dana three times; a per-document bind carries it three times over. And the sort on
       source_ips is NUMERIC BY OCTET — 172.18.0.4 before 172.18.0.15 — which is the opposite
       of what a lexicographic string sort produces"},
       {nl: "driving the four status arms against ONE run_dir, which is how this demand's own
       first cut of them was written. The shell predicate is identical across arms and the
       injected answer is not part of the request key, so QueryCapture's repeat guard refused
       arms 3 and 4 (a7, executed: it trips on the third) and STATUS_TRUNCATED became
       unsatisfiable for exactly the implementations d10 requires. Each arm has its own run
       dir, and each proves its injected envelope arrived before it reads a status; the guard
       is production behaviour and is not disabled, stubbed or dodged by varying predicates"}]}

  # ---- item 1: the ancestor resolution ----------------------------------------------------
  - {id: d1_runs_before_first_model_turn, kind: behavior, form: test,
     binds: ["drives(run_investigation->lead_zero)", "interacts(lead_zero->orient_block)",
             "lead_id.domain.distinguished[l-000]", "lead_id.domain.distinguished[l-00c]"],
     discharged_by: test_lead_zero_resolves_before_main_first_request}

  - {id: d60_shell_alert_fetch_by_alert_id, kind: behavior, form: test,
     binds: ["interacts(lead_zero->elastic_query).payload", "signal_index",
             "elastic_query.access[verb-alerts]",
             "signal_index.domain.alternatives[a signal_index diverging from ELASTIC_ALERTS_INDEX]"],
     discharged_by: test_item_one_fetches_the_shell_alert_by_alert_id_against_its_own_signal_index,
     rejected: [{nl: "F4 arm (a) — extending the alert projection to carry
       kibana.alert.group.id: brief R3/g17 (executed) show nothing under defender/ produces
       the run-dir alert.json, so it cannot be demanded of shipped code"},
       {nl: "building the shell predicate from ancestor_events: that is the ancestor fetch,
