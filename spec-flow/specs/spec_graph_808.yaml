       RESOLVED: mint a ceiling. The character budget itself was not named, so `d51` asserts the property — elided, announced, and pointing at the persisted payload — rather than a magic number.
       resolved_by: auto"
    - "K18 — is the intent obligation's 'count' satisfied by prose? d25 is already a clause
