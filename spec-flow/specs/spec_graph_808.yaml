structure:

  # `session_id` is registered although only `session_store.identity` keys on it — the
  # ordering premise (item 3's dispatch makes lead-0's the SECOND session in a store whose
  # first has ingested nothing) has no address without it. `agent_id` is a DERIVATION of
  # `lead_id` (f"gather:{lead_id}"), not an axis.
  axes: [lead_id, seq, session_id]

  actors:
    - {id: run_investigation,  frame: composition, provenance: code}   # runtime/driver.py::run_investigation — the composition frame that fans every lead
    - {id: orientation,        frame: leg,         provenance: code}   # runtime/orient.py::orientation — one production caller, driver.py:91 inside _user_prompt (g1)
    - {id: lead_zero,          frame: leg,         provenance: design} # runtime/lead_zero.py — THE DELTA'S ONLY NEW ACTOR
    - {id: gather_dispatch,    frame: leg,         provenance: code}   # runtime/tools_gather.py::_run_gather
    - {id: query_tool,         frame: leg,         provenance: code}   # runtime/query_tool.py::QueryCapture.wrap_tool_execute — the model's query path
    - {id: elastic_adapter,    frame: leg,         provenance: code}   # scripts/adapters/elastic_adapter.py — the verb bodies; the sole confine_index caller (g6)
    - {id: main_agent,         frame: leg,         provenance: code}   # MAIN — reads message 0, authors the :L rows at PLAN
    - {id: lead_repository,    frame: leg,         provenance: code}   # learning/lead_repository.py — load_leads/load_queries/joined
    - {id: cross_check_tables, frame: leg,         provenance: code}   # run_common.py:105, from run.py:350 — the narration cross-check
    - {id: build_case,         frame: leg,         provenance: code}   # evals/oracle_golden/build_case.py:78 — takes joined() unfiltered (P4a)
    - {id: invlang_validate,   frame: leg,         provenance: code}   # skills/invlang/validate.py::_check_lead_refs (P6)
    - {id: budget_enforcer,    frame: leg,         provenance: code}   # hooks/budget_enforcer.py — where tool_calls/subagent_spawns actually increment (P5a)
    - {id: closed_ticket_tool, frame: leg,         provenance: code}   # learning/pipeline/judge/closed_ticket_tool.py:359 — the sibling queries-table writer (g4)
    - {id: workspace_map,      frame: leg,         provenance: code}   # scripts/workspace_map.py — builds message 0's run-dir listing
    - {id: scrub,              frame: leg,         provenance: code}   # runtime/scrub.py::scrub — the other walker of the run dir
    - {id: visualize_run,      frame: leg,         provenance: code}   # scripts/visualize/visualize_run.py — reads sessions in creation order
    - {id: replay_harness,     frame: composition, provenance: code}   # tests/e2e/_replay_harness.py::drive — 95 call sites, 62 without verbs= (g8)

  boundaries:

    # ---- the ORIENT surface -------------------------------------------------------------
    - id: orient_block
      provenance: code
      facets:
        payload:
          # The sections `orientation()` joins, in assembly order (orient.py:116-152). The
          # delta adds exactly one part.
          parts:
            - {role: header,            source: const:ORIENT_HEADER}
            - {role: raw_alert,         source: orient._raw_alert}
            - {role: workspace,         source: scripts.workspace_map}
            - {role: invlang_catalog,   source: orient._catalog}
            - {role: invlang_grammar,   source: orient._invlang_grammar}
            - {role: lessons,           source: orient._build_lessons_section}
            - {role: corpus_vocab,      source: orient._build_corpus_vocab_section}
            - {role: lead_zero_section, source: template:LEAD_ZERO_SECTION,
               slots: {resolved_ancestors: "interacts(lead_zero->elastic_query).response",
                       backing_index: ancestor_events,
                       group_id: alert_group_id}}
          invariants: [all-slots-bound]
          nl: "Message 0's precomputed orientation. Every OTHER externally-sourced span here
            is salt-wrapped as untrusted — `_raw_alert` returns wrap(text, 'untrusted', salt)
            and test_orient asserts the salted open/close tags bracket an injection string
            (r12) — and the design has no sentence for lead-0's. Lead-0 injects raw `message`
            strings from logs-system.auth-*: attacker-authored SSH session text entering the
            prompt. K1 is the open decision (one outer wrap over the whole section INCLUDING
            its `_(unavailable: …)` notes, versus per-document wraps that nest identical
            salt-derived tags, versus no wrap at all); the wrap performs no escaping of its
            own delimiter shape (a2), so nesting is strictly worse than one outer wrap. This
            is the profile's danger lens landing directly on the change."

    - id: message_history
      provenance: code
      facets:
        payload:
          parts:
            - {role: message_zero,       source: driver._user_prompt,
               slots: {orientation: orient_block}}
            - {role: correlation_summary, source: gather_dispatch}
          invariants: [all-slots-bound]
          nl: "The message list MAIN is handed for each request. Item 3's summary must arrive
            in it before MAIN's second request — that is d23's whole observable."
        access:
          constraints_by_via:
            store-hydrate:
              trust: derived
              constraints: [selection-render-rebuilds-from-store, requires-store-not-none]
            correlation-injection:
              trust: derived
              constraints: [store-write-before-second-request, requires-store-not-none]
              # RESOLVED at §7 round 1 (K10): build a real injection mechanism that writes the
              # summary INTO the session store, so the hydrated list carries it, and handle the
              # `store is None` case. `d23` binds this cell. The store-less arm is NOT closed —
              # §7 named the cost without choosing between "item 3 does not dispatch at all in
              # that configuration" and "its result is folded in by some other seam" — and it
              # stays an OPEN FORK in handoff.forks rather than being invented here. Was
              # UNKNOWN, and it was the change's load-bearing mechanism (K10, brief R2). The
              # design names ProcessHistory as the seam and glosses it as "returns the message
              # list"; it returns `selection.render(...)` = hydrate(store, …), a list rebuilt
              # FROM THE STORE, so a plain append is discarded — and with `store is None` the
              # capability is never installed at all. No sentence in the design says how the
              # summary reaches MAIN, so the policy is undecided, not merely unstated.

    # ---- the backend ---------------------------------------------------------------------
    - id: elastic_query
      provenance: code
      facets:
        payload:
          parts:
            - {role: native_query, source: template:DOC_FETCH_BY_ID,
               slots: {ids: ancestor_events, group_id: alert_group_id}}
            - {role: index,        source: signal_index}
            - {role: limit,        source: RETURNED_DOC_CAP}
            - {role: sort,         source: const:SORT_ORDERS}
          invariants: [all-slots-bound]
