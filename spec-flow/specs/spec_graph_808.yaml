       backend call is made. To be minted as a NEGATIVE demand on
       interacts(lead_zero->elastic_query).payload with the ordinary batched fetch as its
       positive control. RESOLVED: REFUSE the fetch when no usable ancestor id survives; render the unavailable note. Forecloses 'detect afterwards' (impossible, P1c) and 'rely on the shortfall note' (demonstrated not to fire).
       resolved_by: human"
    - "K14 — nothing ties a returned document to the ancestor that asked for it (P1c, executed).
       d7 is writable per-document over _source fields only, and K3's shortfall signal can be a
       COUNT and nothing more. RESOLVED by K9: a per-hit correspondence field. Carried as a CLAUSE (`d54`) and red-flagged — the field is named nowhere, and the injected verb seam replaces the adapter that would carry it.
       resolved_by: auto"
    - "K15 — does a harness _run_gather call get the tool path's bookkeeping? g19: the gather
