       route a harness-side re-claim through claim_lead directly (a3). RESOLVED, OVERRULING the recommendation: the harness writes lead-0's declaring `:L findings` row AND the leads table gains a PROVENANCE FIELD. The field's name and value were left unnamed (obligation N1); phase E pins `provenance` / `harness`.
       resolved_by: human"
    - "K12 — the hermetic replay suite's preconditions. The design's own determinism rationale is
       inverted by its placement: 62 of 95 drive() sites omit verbs= and 60 omit gather= (g8).
       Recommendation: make lead-0 seam-aware — item 1 rides the injected verbs= seam (so
       orientation()/_user_prompt gain that parameter, a seam demand), with no registry injected
