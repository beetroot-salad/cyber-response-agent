handoff:

  forks:
    # ALL 25 ENTRIES HAVE NOW BEEN THROUGH §7 — round 1 (70-resolutions.md, 9 decisions + 1
    # waiver) and round 2 (71-resolutions-r2.md, 14 clusters, opened by the post-§7
    # re-classification because gate FOLDING is a coverage instrument and was used as a triage
    # one). Each entry keeps the recommendation it carried and gains the decision taken. The
    # forks STILL OPEN after both rounds are listed at the end of this block.
    - "F1 / K10 — what does lead_zero's entry point return? Recommendation: a structured result
       carrying `text` + `entities` (a rendered str cannot carry the entities d17 binds),
       EXTENDED by K9 (entities as deduplicated, deterministically sorted SETS: hosts, users,
       source_ips) and by K10 (a three-state resolution status: failed | succeeded-empty |
       succeeded-with-entities). Demand #0 is marked provisional against this. RESOLVED: a structured result carrying `text`, `entities` and a `status` — entities as deduplicated, deterministically sorted SETS (K9, round 2), status distinguishing failed / succeeded-empty / succeeded-truncated / succeeded-with-entities. `d0` loses `provisional` and is restated in 75-reclassified.md. THE ENTRY POINT'S NAME was decided by neither round; phase E pins `resolve_lead_zero`.
       resolved_by: human"
    - "F2 / K10 — where is item 3's async dispatch issued? Recommendation: run_investigation's
       own async frame right after _user_prompt returns, awaited before MAIN's second request;
       orientation() is sync (r10) and ORIENT/PLAN are prompt phases, not runtime states (r17).
       RESOLVED to the recommendation: `run_investigation`'s own async frame right after `_user_prompt` returns, awaited before MAIN's second request.
       resolved_by: auto"
    - "K10 (the run's biggest catch) — HOW does item 3's summary reach MAIN? The design's named
       seam does not do what the doc says (c8's note, brief R2): the processor returns a
       store-hydrated list, so a plain append is DISCARDED, and with `store is None` the
       capability is never installed. The summary must be written INTO the session store, and
       the design must say what happens when there is no store. Encoded as
       `message_history.access[correlation-injection].constraints: unknown`. RESOLVED: build a real injection mechanism — write item 3's summary INTO the session store so the hydrated list carries it. STILL OPEN: what it does when `store is None`; §7 named the cost without choosing an arm (obligation N2).
       resolved_by: human"
    - "F3 / K7 — is 'bound to the alerts index only' enforced or prose? Recommendation: enforce
       minimally by dispatching item 3 with a narrowed verb_grant that EXCLUDES esql, leaving
       elastic.alerts (which is confine_index'd). Under prose-only, d19 degrades to a clause and
       both its rejected: clauses become unassertable. RESOLVED: route lead-0 through the model's QueryCapture path, inheriting all eight screens, and enforce 'alerts index only' with a narrowed grant that EXCLUDES esql.
       resolved_by: human"
    - "K7 (second half) — declare the harness's own authority explicitly rather than inheriting
       run_investigation's default registry by accident: today lead-0 would execute under
       GATHER's grant only because that is what the default happens to be, and P2 shows the
       direct-registry path inherits none of the tool's six screens. RESOLVED with F3/K7: lead-0 holds its own QueryCapture bound to the reserved id 'l-000' rather than inheriting `run_investigation`'s default registry by accident.
       resolved_by: human"
    - "F4 / K5 — the group.id open dependency. REDUCED BY THE BRIEF, not resolved: nothing under
       defender/ produces the run-dir alert.json (g17/R3), so 'the alert projection must start
       carrying group.id' cannot be demanded of shipped code and F4 collapses to its second arm
       (fetch the shell alert by alert_id against the alert's own signal_index). RESOLVED to the reduced arm: lead-0 fetches the shell alert by `alert_id` against the alert's own `signal_index`.
       resolved_by: auto"
    - "F10 / K5 — when does the fallback fire? The design says 'No group → fall back' and is
       silent on group-present-but-zero-building-blocks. Recommendation: fall back on 'no group
       OR no building blocks', and state plainly that item 1 is AT MOST TWO backend calls,
       replacing 'one call either way'. RESOLVED: fall back on 'no group OR no building blocks'; item 1 is AT MOST TWO backend calls.
       resolved_by: auto"
    - "F9 / K4 — is group.index ordering part of the contract, and what orders the FALLBACK?
       Recommendation: contract chronological presentation on BOTH paths — primary sorts
       client-side by kibana.alert.group.index (the adapter cannot, r3/a1), fallback asks for
       sort='asc' (a1) or sorts client-side; malformed/missing/duplicate group.index falls back
       to @timestamp ascending and never raises. RESOLVED: CHRONOLOGICAL, sorted CLIENT-SIDE, on BOTH paths. Forecloses backend order (the adapter's default is newest-first) and split semantics; `group.index` stays unusable for sorting at the backend.
       resolved_by: human"
    - "K2 — is the .ds- → datastream mapping a closed table or an open rewrite? d6 rejects the
       substring test and specifies no general rule. Recommendation: open rewrite with a bounded
       derivation (`<datastream-name>-*` from the .ds- shape, never a bare logs-*), re-checked
       through confine_index, with an explicit no-match arm that passes the string through
       UNCHANGED so the gate refuses it. RESOLVED to the recommendation: open rewrite with a bounded derivation, re-checked through confine_index, and a no-match arm that passes the string through UNCHANGED.
       resolved_by: auto"
    - "K3 — 'one call, not N' versus completeness. d5 is false as written (c4: a comma-joined
       multi-index expression is refused whole; RETURNED_DOC_CAP clamps at 20). Recommendation:
       one call per distinct mapped backing index, an explicit shortfall note whenever
       returned < len(ancestor_events) or truncated is set, and d22's gate reading
       complete-or-truncated as distinct states. RESOLVED: an explicit shortfall note whenever `returned < len(ancestor_events)` or `truncated` is set, ALSO distinguishing P1b's unparseable body. That second half is a CLAUSE (`d36`) and red-flagged — it needs an adapter-side field no decision authorises.
       resolved_by: auto"
    - "K1 — what trust framing wraps lead-0's ORIENT text? Recommendation: ONE outer
       wrap(..., 'untrusted', salt) over the whole section INCLUDING its `_(unavailable: …)`
       notes (a2: nesting identical tags is strictly worse), plus a separate wrap of the entity
       values interpolated into item 3's harness-authored goal — the design's safety argument
       for item 3 is authorship, and authorship does not reach the values. RESOLVED in two halves: round 1 — one outer untrusted frame over item 1's block, `executed_queries` waived; round 2 — SANITIZE wrap-delimiter shapes in ancestor content BEFORE wrapping, because the frame alone is the only boundary and `wrap()` escapes nothing of its own delimiter shape.
       resolved_by: human"
    - "K8 — run-ending arms versus 'orientation must never break the run'. P3 (executed) settles
       the mechanism: both arms re-raise and a direct awaiter sees it, while _user_prompt sits
       outside every handler. Recommendation: no exception escapes _user_prompt; cap lead-0's
       breaker contribution at one per-system failure (two failures is exactly
       PER_SYSTEM_FAIL_LIMIT — g10/E2); pin the ordering render-from-memory-then-write so the
       run dir and the ORIENT text cannot disagree about whether item 1 happened. RESOLVED: the lead-0 call site takes its OWN handler so the run degrades rather than ending before MAIN's first prompt (obligation N3, `d41`).
       resolved_by: auto"
    - "F6 / K8 — item 3's reduced request budget names no number and d21 is vacuous at 39.
       Encoded as GATHER_REQUEST_LIMIT.domain.documented_alternatives[…].crosses_validation:
       unknown. Recommendation: 8. RESOLVED: EIGHT.
       resolved_by: auto"
    - "F5 / K11 — the reserved correlation lead id is UNNAMED, and no proactive exclusion from
       MAIN's range exists. Encoded as lead_id.access[harness-reserved].constraints: unknown. It
       is the join key the learning loop and the review gate cite, so §7 must name it.
       RESOLVED: `l-000` (item 1) and `l-00c` (item 3), both claimed at run start BEFORE MAIN's first turn.
       resolved_by: auto"
    - "K11 — reserved ids, narration and downstream attribution. Recommendation: keep the schema
