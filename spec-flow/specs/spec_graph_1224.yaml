# ==========================================================================================
# spec_graph_1224.yaml — issue #1224 "branching through a live oracle", write-tests run 1, PHASE E
# (author leaf, the §7 fold). Re-assembled from the phase-D graph (assembler + gate leaves; see
# git history for its header) by applying `.spec-flow/frontiers/70-resolutions.md` exactly:
# 25 human-resolved material clusters, 4 dissolved by Amendment 2, 25 auto (48-rejudge.md's
# reading), F-02 (human), flips D1-D4, waivers W-01..W-07, holes H-01..H-06, settled S1..S22.
#
# demands — four blocks, in this order:
#   (1) d00a..d19e — 20-demands' 112; every form:test pointer names its test in
#       defender/tests/live_oracle_1224/ (`discharged_by`); `seed_docstring` carries the re-pinned
#       prose where 48/70 re-pinned it; d14c, d17c, d17d are INVERTED (`inverted:` names the settled
#       assertion); renamed tests keep `renamed_from`. Provisionals tied to answered forks are lifted
#       (`provisional_lifted`); F-01, F-11, F-19, F-21 keep theirs (70: outside any cluster).
#   (2) s_* — the settled premises (form: test, the premise's own test); re-pinned ones say so.
#   (3) b_* — bound-now clauses PROMOTED to form: test at their premise test, the cluster's
#       reading appended to the bound clause; five stay `form: clause` recording a flip's drop
#       (b_p170, b_p205, b_p206, b_p208: D1; b_p105: D2).
#   (4) f_* — the 55 cluster decisions, now RESOLVED records (form: clause, `resolved_by`).
#   then MINTED at this fold: premise demands for premises that carried none (their cluster's
#   reading; binds taken from the cluster's f_* where the premise had none, `binds_from`), the 50
#   test obligations O-01..O-52 (O-05, O-06 dissolved) and PCO-01..PCO-11 (`obligation:`), and the
#   waivers W-01..W-07 plus H-06's recorded narrowing (form: waiver, `cites`).
#
# coined names — every name the design leaves to the implementer (fork F-01) is spelled ONCE, in
#   defender/tests/live_oracle_1224/_spec1224.py (`COINED` and its module docstring).
#
# gate — obligations: one entry per covered element of each minted O-xx / PCO-xx, pointing at its
#   demand. holes: H-01..H-06 carry `resolution` (+ `resolved_to` where a demand answers), and every
#   waived R7 edge is a hole resolved to its waiver demand (the spec_graph_1049 precedent).
# structure — H-01: tenant_adapter's collision-lookup cell deleted (M12=A: no tenant lookup) [done at the
#   phase-F repair, R-02, with family_base_cache/exploration_cache dropped, rate_limiter per process and
#   world_base_store + world_record added: Amendment 2];
#   H-02: run_query.access[host-check] set to the run-query constraint list; H-06: the five
#   as_of-blind adapters added as actors with their read edge, closed by the M23 waiver.
# handoff — forks: every cluster with its resolver and reading; drops: the eight flip-dropped
#   premises; deferred: the follow-ups 70 records; deviations: known CI hits and red flags.
# ==========================================================================================

