  boundaries:
  - id: tenant_adapter
    provenance: code
    facets:
      access:
        constraints_by_via:
          sibling-query-tool:
            trust: attacker-influenced
            constraints:
            - grant-decide-per-call
            - as-of-carried
            - confine-index
            - read-endpoint-allowlist
          launcher-review-read-side:
            trust: attacker-influenced
            constraints:
            - grant-at-construction-only
            - read-endpoint-allowlist
          run-query:
            trust: attacker-influenced
            constraints:
            - grant-decide-per-call
            - read-verbs-only
            - as-of-bound
            - rate-limit-per-process-slice
            - oracle-side-ledger
        nl: 'The 8 adapters (elastic, change_mgmt, cmdb, host_state, identity, tacit_knowledge, threat_intel, ticket). sibling-query-tool: today''s
          sibling path; as_of is CARRIED on every call (registry.py:394) but honoured by 3 of 8 adapters only — change_mgmt, cmdb, identity, threat_intel
