  probe: cd /tmp && PYTHONPATH=/wt-issue-1224 /workspace/defender/.venv/bin/python /wt-issue-1224/.spec-flow/probes/PR/pr1_provider_outage.py
    (output .spec-flow/probes/PR/pr1_provider_outage.out.txt); the fake-equivalence re-run .spec-flow/probes/PR/pr1b_fake_equivalence.py (output
    pr1b_fake_equivalence.out.txt). Real stack end to end (run_stage -> build_stage_agent -> providers.build_for_effort -> pydantic_ai model ->
    anthropic / openai SDK httpx client) against a local 127.0.0.1 stub HTTP server answering a fixed status, and against a closed local port;
    dummy credentials; a 200 control per provider.
  probe_kind: executed
  observed: 'Both providers the repo builds (Anthropic via AnthropicModel, Fireworks via OpenAIChatModel) give the same outcome. The 200 control
    returns the text. For 500, 503, 529 (Anthropic) / 502 (Fireworks) and 429 (retry-after 0) the stub saw 3 requests (the first plus the SDK''s
    2 retries, about 1.3 s of backoff), then run_stage raised defender.learning.core.config.RunUnprocessable (a wrapper; message `<stage> (<label>)
    failed: ModelHTTPError("status_code: 503, model_name: claude-sonnet-4-5, body: {...}")`) whose __cause__ is pydantic_ai.exceptions.ModelHTTPError
    (MRO ModelHTTPError > ModelAPIError > AgentRunError > RuntimeError; .status_code an int, .model_name, .body the parsed provider body); its
    own __cause__ is the SDK class (anthropic.InternalServerError / OverloadedError / RateLimitError; openai.InternalServerError / RateLimitError).
    A 401 is not retried (1 request) and gives the same ModelHTTPError with status_code 401, so the class does not separate an outage from an
    auth fault; the status does. Connection refused (closed port): 3 attempts in about 1.3 s, then RunUnprocessable with __cause__ pydantic_ai.exceptions.ModelAPIError
    (str "Connection error.", .model_name set, no status_code; MRO ModelAPIError > AgentRunError), chained to anthropic/openai.APIConnectionError
    > httpx2.ConnectError > httpcore2.ConnectError. The pydantic-ai layer adds no retry of its own for these. Fake equivalence: a FunctionModel
