claims:
- id: g1
  kind: census
  claim: Exactly four bash=True learning roles build deps with NO box=; all bind through `bind` (curator
    via for_run). oracle/verify_forward have empty ToolSets.
  probe: enumerate + read the four bind sites + ToolSet decls at HEAD (search backs the exactly-four completeness,
    see g13)
  probe_kind: search
  observed: actor_engine.py:86, judge/engine_pydantic.py:99, lead_author_engine.py:84, curator_engine.py:203
    — none pass box=.
  verdict: holds
  reverifies:
  - c1
  - r1
- id: g2
  kind: census
  claim: deps.box is reached at exactly one execution site; write/edit tools run in-process with no transport.
    One existing box= passthrough precedent exists.
  probe: grep deps.box across runtime/learning/evals/run.py excluding tests
  probe_kind: search
  observed: runtime/tools.py:153 deps.box.run_parsed sole executor; _tool_write_file/_tool_edit_file write
    in-process; tools_gather.py:276 threads box=deps.box.
  verdict: holds
  reverifies:
  - c4
- id: g3
  kind: referential
  claim: The inert default lives on AgentDeps._for_run which bind funnels through; box defaulted to a
    fresh inert BoxExecutor when absent.
  probe: read tools.py:84-111, agent_definition.py:215-231
  probe_kind: read
  observed: box field default_factory=BoxExecutor (tools.py:87); _for_run box=box if not None else BoxExecutor()
    (:110); bind passes box= and cwd_anchor.
  verdict: holds
  reverifies:
  - c3
- id: g4
  kind: referential
  claim: The inert transport raises BoxFault mapped to ModelRetry at the tool boundary.
  probe: read box.py:188-192, tools.py:143-167
  probe_kind: read
  observed: _unattached raises BoxFault (box.py:188); _tool_bash catches → ModelRetry (tools.py:161-162);
    a denied command refused earlier at permission.decide_bash.
  verdict: holds
  reverifies:
  - c2
