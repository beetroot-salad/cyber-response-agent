  forks:
  - 'RESOLVED §7 R1 (F1 box_delivery_absence, F11 fifth_bash_enabled_role): box= is REQUIRED — a loud
    TypeError at construction — on the 3 bash-reaching Subagents/invoke seams and the CuratorDeps.for_run->bind
    passthrough; the inert BoxExecutor() stays only as N5''s fail-closed default elsewhere. The M6/O6 census
    asserts attachment on the production construction seam. A future fifth path is an N7-style recorded
    residual. Tests: test_box_delivery_absence_does_not_silently_re_dead_the_lane,
    test_fifth_bash_enabled_role_outside_the_four_named_construction_paths, test_census_observes_box_attachment_on_production_path.'
  - 'RESOLVED §7 R2 (F2, F3, F6, F13, F15 — teardown/lifetime/identity): (F2) keep the shared run-cycle
    box alive until BOTH legs finish, tear down once at run end. (F13) a failed stop_box BLOCKS finish_batch/cleanup
    and aborts loudly (S7). (F3) refuse-and-surface a LIVE same-name; a stopped-own reap is logged loudly
    (po4: the liveness read cannot tell safe-to-reap from unknown → an ownership/cause signal is owed).
    (F6/F15) accepted residuals CONTINGENT on decision-5 ''not scheduled'' (handoff note, not a test).'
  - 'RESOLVED §7 R3 (F4 startup-fault-absorbed): loud abort with the startup-BoxFault class added to the
    systemic-fault set so it bypasses the drain''s per-item logged-skip-returns-0 idiom (matches dec5).
    ''Not scheduled'' contingency flagged. Test: test_startup_fault_absorbed_by_an_existing_per_item_continue_idiom.'
  - 'RESOLVED §7 R4 (F5, F10, F9, SB1 — mount scope): (F5) tighten the run-cycle learning_run_dir mount
    rw->RO (no in-box writer; parity is not a justification). (F10/SB1) accept read-reachability of untriggered
    siblings via the whole-<wt> ro infra mount as a recorded cost; pin the WRITE-refused observable. (F9)
    bind containment to BOTH the gate''s textual anti-traversal AND the mount (authoritative backstop, po63).'
  - 'RESOLVED §7 R5 (SB2 empty-present gather_raw): add decision-9''s third case — dir-absent -> host-side
    is_dir() skip BEFORE composing --mount (an absent --mount type=bind source is refused at create, DC1);
    present-with-entries -> read one back; present-empty -> mount, SKIP readback, record the host-side
    existence check as the non-absence proof. Test: test_gather_raw_mount_exists_but_has_no_entry_to_read_back_at_sentinel_time.'
  - 'RESOLVED §7 R6 (F7 box placement vs fused dispatch): REFACTOR the drain dispatch to decide-all ->
    create one box over the triggered union -> run-all (a control-flow change to _maybe_trigger_author,
