structure:
  axes:
  - run_id
  - batch_id
  - triggered_corpus
  actors:
  - id: actor
    frame: leg
    provenance: code
  - id: judge
    frame: leg
    provenance: code
  - id: curator
    frame: leg
    provenance: code
  - id: lead_author
    frame: leg
    provenance: code
  - id: run_one
    frame: composition
    provenance: code
  - id: run_worktree_batch
    frame: composition
    provenance: code
  - id: runtime_run
    frame: composition
    provenance: code
  boundaries:
  - id: run_cycle_box
    provenance: design
    facets:
      identity:
        key_axes:
        - run_id
        evidence:
          nl: the run-cycle container name is caller-composed from run_id plus a tier-distinguishing component
            (M8); the mount set derives from run_id (learning_run_dir = runs_dir/run_id, rw) plus the
            judged run's ro gather_raw. Read off orchestrate.py:281 and box.py:245-250/269-293.
        derivations:
        - value: container_name
          fn_of: run_id
          injective: true
        sharing: unique-key
  - id: drain_box
    provenance: design
    facets:
      identity:
        key_axes:
        - batch_id
        - triggered_corpus
        evidence:
          nl: the drain container name is batch_id=uuid4().hex[:12] (orchestrate.py:507, satisfies is_valid_run_id);
            the mount set is the TRIGGERED corpora under the worktree leaf repo_root/.worktrees/{slug}-{batch_id}
            (branch.py:63), keyed per invocation. Read off g8/g10.
        derivations:
        - value: container_name
          fn_of: batch_id
          injective: true
        sharing: unique-key
  - id: runtime_box
    provenance: code
    facets:
      identity:
        key_axes:
        - run_id
        evidence:
          nl: 'the runtime container name keys on run_id alone (box.py:245-250, grammar-restricted per
            #698); learning_run_dir.name == run_dir.name == run_id, so a run-cycle box would claim this
            same name absent a caller-distinguishing component (M8/O7).'
        derivations:
        - value: container_name
          fn_of: run_id
          injective: false
        sharing: unique-key
  - id: run_cycle_box.env
    provenance: design
    facets: {}
  - id: drain_box.env
    provenance: design
    facets: {}
  - id: runtime_box.env
    provenance: code
    facets: {}
  - id: box_request
    provenance: design
    facets: {}
  - id: box_request.env
    provenance: design
    facets: {}
  - id: sandboxed
    provenance: design
    facets: {}
  - id: cwd_anchor
    provenance: design
    facets: {}
  - id: census_seam
    provenance: design
    facets: {}
  - id: unboxed_opt_out
    provenance: design
    facets:
      domain:
        type: str
        refinement:
          nl: DEFENDER_ALLOW_UNSANDBOXED — unset (empty) means a box is REQUIRED; the loud opt-out value
            '1' reaches unboxed_executor (box.py:341). Operator-only, greppable.
        default: ''
        distinguished:
        - '1'
        falsy_valid: false
        documented_alternatives: []
