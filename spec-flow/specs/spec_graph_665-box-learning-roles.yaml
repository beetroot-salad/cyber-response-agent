demands:
- id: return_contract
  kind: behavior
  form: test
  binds:
  - interacts(actor->run_cycle_box).response
  - interacts(curator->drain_box).response
  discharged_by: test_boxed_lane_returns_command_output
  disposition: resolved
  fork: F0
  resolution: 'R9 CORRECTED by RF-D1 (Phase-F seam): the boxed learning bash lane matches the runtime
    boxed lane byte-for-byte modulo the untrusted wrap (clause a stands). An EXECUTED command (ANY exit
    code, non-zero included) returns _wrap(_format_bash_result(rc,out,err), untrusted, salt); a TRANSPORT
    fault (container gone / undeliverable exec / unparseable reply — decode_response raises BoxFault)
    RAISES ModelRetry, inherited free per M4 (the learning agent-run loop catches ModelRetry natively via
    pydantic_ai, rc2, exactly as the runtime driver does). Clause (b) — "every fault subtype inside the
    envelope" — is STRUCK: it contradicted clause (a) and the phase-C 3/3 consensus and would have mandated
    a learning-only BoxFault->wrap divergence the runtime lane lacks. The executed->wrap / transport->raise
    split is pinned by test_bash_lane_nonzero_exit_returns_wrapped_envelope (positive) and
    test_bash_lane_transport_fault_raises_not_wrapped (negative); the judge is identical
    (test_judge_boxed_output_wrap_is_the_intended_zero_shape).'
