      byte, exactly as the scrub verdict is; the judge reads it as "no record" and grades the
      world as today, and the rest of the world archives.
    note: >-
      RE-RESOLVED by the dissolve pass: the archive is a COPY, not an interpreter. F-G's
      "skipped and reported" arm existed only because the record had its own lane with its own
