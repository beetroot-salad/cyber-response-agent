  - id: archive_skips_and_reports_an_unreadable_sidecar              # F-G + F-AB + F-U
    kind: domain-outcome
    form: test
    source: "70-resolutions-round2.md forks F-G / F-AB (auto) and F-U (human); re-resolved by the dissolve pass"
    binds:
      - "interacts(archive_episode->run_end_sidecar).response"
      - "run_end_sidecar.access[fs-host-write]"
      - "run_end_json.domain.distinguished[absent]"
    discharged_by: test_an_unreadable_sidecar_is_copied_verbatim_and_the_judge_reads_no_record
    seed_docstring: >-
