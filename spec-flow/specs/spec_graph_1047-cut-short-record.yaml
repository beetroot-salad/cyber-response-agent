  - id: one_interpreter_for_the_exit_class
    kind: coherence
    form: test
    source: "20-demands.md"
    binds:
      - "normalized_truncated_by"
      - "interacts(archive_episode->normalized_truncated_by)"
      - "interacts(read_world_facts->normalized_truncated_by)"
      - "interacts(close_case_ticket->normalized_truncated_by)"
      - "interacts(archive_episode->run_end_json)"
      - "interacts(read_world_facts->run_end_json).response"
      - "interacts(close_case_ticket->truncated_by)"
      - "interacts(learning_refusal_gate->truncated_by)"   # GROWN at §7 round 2 per fork F-E
    discharged_by: test_every_reader_of_the_exit_class_takes_the_owners_answer
    seed_docstring: >-
      The archive writer, the judge's reader and the ticket lane give one answer to what an exit
      value means: a value the owner refuses is refused identically at all three, and none of them
      carries its own membership test.
    note: >-
      kind: coherence deliberately — bound PER READER EDGE, because a demand at the owner's own
      altitude is green when two of the three readers moved (schema.md). Two reconciliations:
      (1) the fourth address was `interacts(close_case_ticket->session_store).response`, which F3's
      resolution deleted (no store read at all) — re-pointed to the in-process value edge;
      (2) fork F-E RESOLVED (§7 round 2, human): the FOURTH reader
      `run_common.learning_refusal_gate` is NAMED here, as a bind correction so this coherence
      demand cannot ship green while missing a real reader — but its BEHAVIOUR stays divergent
      on purpose (it refuses on any non-None value where the ticket lane falls back), because
      "can this feed training data" and "how should the ticket close" are different questions
      with different acceptable risk postures. The test pins both halves.

      THE DEMAND'S STATED LIMIT, recorded at phase F rather than dropped (this is an examined
      admission, not a new decision). F-M resolved the owner to STRICT exact membership, which
      makes `normalized_truncated_by(v)` behaviourally identical to `v in TRUNCATED_BY_VALUES`
      and to a per-class `==` chain. So this demand's discriminator survives in two directions
      and is gone in a third: a consumer MORE LENIENT than the owner is caught (the padded /
      case-variant / confusable arms), a consumer that passes raw values through is caught (the
      archive arm asserts `None`), and a consumer that RE-IMPLEMENTS THE OWNER'S RULE EXACTLY —
      `truncated_by == "aborted" elif …` inside `close_case_ticket`, or
      `raw if raw in TRUNCATED_BY_VALUES else None` inside `read_world_facts` — is caught by
      NOTHING: not by this test, and not by `lint_borrowed_vocabulary`, whose own docstring says
      it cannot see equality against a bare literal (the premise half of flagged fact F8 / claim
      h11, which the author lens refuted and no phase re-checked). Premise P-E1 named exactly
      this discriminator problem and routed it to probe obligation PO-7, which was never
      dispatched in either re-ground round; PO-7 is carried in `handoff.deferred`. The residual
      is a DRIFT hazard — the second interpreter diverges the day the vocabulary or the owner
      changes — not a live behavioural bug, and F-I's stated purpose ("makes the fallback arm
      reachable by design rather than by accident of comparison") ships with no test that can
      tell the design from the accident. The structural alternative, NOT built here because it
      is a new obligation rather than a conservation of one: make the owner the only symbol
      permitted to reference `TRUNCATED_BY_VALUES` outside `session_store`, which
      `lint_borrowed_vocabulary` CAN see because it is a constant borrow rather than a literal
      comparison.

