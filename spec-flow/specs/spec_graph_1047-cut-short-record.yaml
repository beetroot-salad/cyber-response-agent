    discharged_by: test_a_world_whose_model_closed_and_was_then_cut_short
    seed_docstring: >-
      A world whose model had already closed when the exit class was stamped keeps its verdict:
      the row is graded normally, carries no cut_short key, and still counts toward the family's
      verdict word — the third row shape is filed only for a world cut short WITHOUT deciding.
    note: >-
      Reading A (the exit class is an unconditional trump) was rejected: probe p21 (EXECUTED)
      confirmed the collision is reachable on all five exit classes with zero test coverage on
      the `ReviewState.of(deps).closed` skip branch, and discarding the verdict makes the third
      row shape's own reason string ("the host's report is not a verdict") literally false about
      that world. Positive control on the same exit class with `closed_before_cut` false:
      `cut_short_row_shape`.

  - id: run_end_record_distinguishes_a_model_close                   # F-A, the record's field set
    kind: shape
    form: test
    source: "70-resolutions-round2.md fork F-A (human); premise `test_the_record_must_distinguish_a_host_written_close_from_the_models_own`"
    binds:
      - "run_end_json"
      - "interacts(archive_episode->run_end_json)"
      - "interacts(_grade_world->world_row).payload"
    discharged_by: test_the_record_must_distinguish_a_host_written_close_from_the_models_own
    seed_docstring: >-
      The run-end record carries a second field, `closed_before_cut`, and it is what separates a
      host-written close from the model's own: two worlds with the same exit class and the same
      report differ in their rows only because the record says whether the model had decided.
    note: >-
      The archived `report.md` carries no discriminator of its own — the value pair
      `unresolved` + `CAUSE_NOT_REVIEWED` is incidental, not designed (probe p21), and
      `validate_report` admits whatever the box writes (claim h3). The host is the only party
      that knows, so the host-written record is where the fact has to travel.

  - id: driver_records_whether_the_model_had_already_closed          # F-A + F-B, the write site
    kind: behavior
    form: test
    source: "70-resolutions-round2.md forks F-A + F-B (human, reading B); probes p21 and p25, both EXECUTED"
    binds:
      - "run_investigation"
      - "_close_a_run_cut_short"
      - "interacts(run_investigation->run_end_sidecar)"
      - "run_end_sidecar"
    discharged_by: test_the_driver_records_whether_the_model_had_already_closed_when_the_exit_was_stamped
    seed_docstring: >-
      The record's second field is written by the DRIVER, at the moment the exit class is stamped
      and BEFORE the forced report: a run whose ReviewState.of(deps).closed is true when the cut
      lands records closed_before_cut true, and one whose model never closed records false.
    note: >-
      `_run_summary`'s seven keys do not carry this value (probe p21), so the field is threaded
      out of the driver rather than plumbed from an existing one. Probe p25 (EXECUTED) drove
      three arms of `run.py`'s tail that raise and skip everything after them — one of which
      loses the summary itself — which is why the write is driver-sited rather than tail-sited,
      independently of F-B's ordering question. The BEFORE-the-forced-report ordering is what
      closes `missing_run_end_grades_as_today`'s crash window.

  - id: failed_run_end_write_suppresses_the_forced_report            # F-H, the second clause
    kind: behavior
    form: test
    source: "70-resolutions-round2.md fork F-H (auto), second clause — coupled to F-B's resolution"
    binds:
      - "_close_a_run_cut_short"
      - "run_end_sidecar.access[fs-host-write]"
      - "interacts(run_investigation->run_end_sidecar)"
      - "interacts(_close_a_run_cut_short->report_md)"
      - "truncated_by.domain.distinguished[retry-exhausted]"
    cites: [h1, h2]
    discharged_by: test_a_failed_run_end_write_is_a_reason_not_to_write_the_forced_report
    seed_docstring: >-
      A run-end write that FAILS is swallowed — the run does not break over it — and it is also a
      reason NOT to write the forced `unresolved` report: a forced-close-set run whose record
      write raised leaves no report.md either, so the report-without-a-record shape is never
      produced from inside this piece's own mechanism.
    note: >-
      MINTED AT PHASE F. F-H's resolution has two clauses and only the first
      (swallow-and-continue, log loudly) and the ordering half of the second reached the graph as
      `run_end_sidecar.access[fs-host-write].constraints`; the SUPPRESSION clause — "if the
      record write itself fails, the forced-close path treats that as a reason not to write the
      forced report (closing the window F-B was about)" — was applied by no demand, constraint,
      waiver or test. The ordering alone closes F-B's window for a KILLED process, not for a
      FAILED write: a swallowed write failure followed by the forced report produces exactly the
      configuration claim h2 observed executing (forced report, no record, `verdict_word` flips
      `caught -> survived`), which is the pre-#1047 bug and the reason F-B and F-H were relayed
      to the human together. The suite otherwise pins that dangerous state as ACCEPTABLE —
      `missing_run_end_grades_as_today` says an absent record grades as today — while omitting
      the clause that prevents reaching it by a failed write, so this demand is the half that
      fell out, not a new decision.

