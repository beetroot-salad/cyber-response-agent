  - id: archive_io_error_propagates_raw_and_may_half_build_a_world   # F-U
    kind: domain-outcome
    form: waiver
    source: "70-resolutions-round2.md fork F-U (human): match existing behaviour, no special-casing"
    binds:
      - "run_end_json.access[fs-archive-guarded-write]"
      - "interacts(archive_episode->run_end_sidecar).response"
      - "interacts(archive_episode->run_end_json)"
    cites: [p11]
    outcome:
      nl: >-
        A real I/O error on the new record's read or write — anything outside
        ENOENT/ENOTDIR/EBADF/ELOOP, which are the four `pathlib._IGNORED_ERRNOS` that fold into
        "absent" — escapes `archive_episode` as a BARE `OSError`, AFTER `guarded_mkdir` has
        already created `worlds/<label>/`. The world is then left half-built: a directory holding
        some of its roles and not others. This is pre-existing behaviour of the destination
        screen across the six artifacts already archived there (claim p11, EXECUTED: EIO and
        EACCES propagate raw; only ENOENT folds), and the seventh leaf this piece adds inherits
        it rather than introducing it. No special-casing is added.
    rejected:
      - nl: >-
          Handling it explicitly (skip-and-report, as F-G does for an unreadable sidecar) was
          rejected by the human: it would make this one artifact more robust than the six it sits
          beside, for no reason the design states.
      - nl: >-
          Minting a demand that a raw OSError at the new leaf must not leave a half-archived
          world was the leaf's other honest option and is NOT taken: it would make this piece own
          an archive-wide transactionality model it did not introduce.
    note: >-
      MINTED AT PHASE F. F-U is one of the run's four human-decided forks and was the only one
      with no waiver, no demand outcome and no handoff entry — its whole record was two sentences
      inside `note:` fields on `archive_skips_and_reports_an_unreadable_sidecar`, a demand about
      a DIFFERENT fault (an unreadable sidecar). Two live consequences are named rather than
      smoothed. (1) THE SKIP/RAISE BOUNDARY IS UNPINNED: F-G says an unreadable sidecar is
      skipped-and-reported, F-U says an I/O error propagates raw, and the line between them is
      `pathlib._IGNORED_ERRNOS`, a stdlib private this run discovered by execution.
      `test_an_unreadable_sidecar_is_skipped_and_reported_rather_than_archived` drives only the
      skip side, so an implementer who folds EIO into "skip" (more robust) or into "refuse the
      world" (more conservative) greens the suite either way and the human's "match existing
      behaviour" is unobservable. Pinning it would mean asserting on a stdlib private, which is
      why it is waived rather than tested. (2) THE HALF-ARCHIVE HAZARD contradicts
      `archive.py:206-213`'s own stated invariant ("a half-archive is not a partial answer but a
      wrong one") — deliberately accepted, and recorded HERE so `write-code-from-spec` does not
      meet it as a surprise.

