# ==========================================================================================
# STRUCTURE — the address space.
#   `provenance: design` == the delta (rules.md, Procedure): demand-implied structure, assigned
#   from the DESIGN, not from a code diff. `provenance: code` == the grounded neighbourhood
#   `10-brief.md` §4 censused, which the delta attaches to and which no demand asked for.
#   Change kinds, in the delta grammar's terms:
#     add    — `normalized_truncated_by` (boundary+facet), `run_end_sidecar`, `run_end_json`,
#              `gradable`'s empty member becoming reachable, the `http-note` access cell, and
#              every `provenance: design` edge below.
#     modify — `close_case_ticket` (gains a parameter and branches on it), `_grade_world` (a
#              fourth early return, ordered ahead of `_missing_required_input`),
#              `read_world_facts` (reads a new record), `archive_episode` (writes a new leaf),
#              `run_main` (writes the sidecar, threads the value into the ticket lane),
#              `grade_family` (its measuring set can now be empty in practice).
#     remove — NOTHING. This piece subtracts no element, which is why R5's computed arm is
#              expected quiet and its judgment arm (the tightening extension) is the live half:
#              the ticket lane's decider TIGHTENS from "is there a usable report" to "what was
#              the exit class", and F-K is the caller that tightening leaves unreachable.
# ==========================================================================================
structure:

  # The axis registry. Every `key_axes` / `interpolates` member below is one of these — a member
  # outside this list is an R0 finding, and two passes coining two names for one axis is the
  # join-breaker it exists to prevent.
  axes:
    - episode_id     # the episode archive's identity; `<episodes_base>/<episode_id>/`
    - world_label    # the per-world label: `worlds/<label>/`, and the sibling run dir's suffix
    - run_id         # a run dir's NAME (`<episode_id>-<label>` for a sibling). The sidecar
                     # interpolates it, the ticket key is it (claim n4), the scrub verdict
                     # already interpolates it (`scrub.verdict_path`)
    - case_id        # the per-run `uuid4().hex` the session store FILE is named by — a different
                     # namespace from the ticket key (claim n4)
    - session_id     # the fork's `uuid4().hex`, the store row's PRIMARY KEY, minted inside the
                     # child (claim h10, refuted) and recorded only in the box-writable pointer

  actors:
    # --- the host-side run, its driver, and the launcher that fans it ---------------------
    - id: run_main                      # defender/run.py::main + _run_investigation_lifecycle
      frame: composition
      provenance: code
      note: >-
        The host-side tail. Under F2 reading A it writes the run-end sidecar; under F3 reading A
        it threads `summary["truncated_by"]` into the ticket lane (claim n10). WHERE the sidecar
        write can sit is fork F-B: probe #25 found two steps in this frame's own tail
        (`logger.close()`, `stop_and_scrub`) that raise and skip everything after them, so no
        placement inside run.py's tail is safe — an argument for the driver owning the write
        that is independent of F-B's ordering question.
    - id: run_investigation             # defender/runtime/driver/__init__.py::run_investigation
      frame: leg
      provenance: code
    - id: _close_a_run_cut_short        # defender/runtime/driver/__init__.py:330-365
      frame: leg
      provenance: code
      note: >-
        CONDITIONAL, not unconditional (probe #21 / claim p21): it returns early when
        `ReviewState.of(deps).closed`, keeping the model's own disposition and writing nothing.
        That skip branch has zero test coverage today, and it is one of fork F-A's two routes.
    - id: start_family                  # defender/learning/branch/cli.py::start_family
      frame: composition
      provenance: code
      note: "the sibling fan; `_default_spawn` is blocking `subprocess.run(...).returncode` (h14)."
    # --- the co-writers of the exit-class column the brief censused (10-brief.md §4) -------
    - id: dispatch_correlation          # defender/runtime/lead_zero/_items.py::dispatch_correlation
      frame: leg
      provenance: code
      note: "stamps the correlation lead's gather session via its nested `stamp_terminator` (:471-475)."
    - id: _stamp_gather_terminator      # defender/runtime/driver/_build.py:528 (nested in build_agent)
      frame: leg
      provenance: code
      note: >-
        CORRECTS the project profile's `session_store` writer census, which names
        `_make_store_render_processor` for this site; the symbol that actually calls
        `set_truncated_by` at `_build.py:538` is `_stamp_gather_terminator` (claim a1).
    - id: stamp_dead_fork               # defender/runtime/branch/__init__.py::stamp_dead_fork
      frame: leg
      provenance: code
      note: "writes truncated_by='store' on a forked session no run ever drives (claim h21, flagged fact F3)."
    # --- the ticket lane ------------------------------------------------------------------
    - id: close_case_ticket             # defender/scripts/case_history/ticket_writer.py::close_case_ticket
      frame: leg
      provenance: design
      note: "MODIFY: gains the `truncated_by` parameter (F3-A) and branches on it before the report."
    - id: open_case_ticket              # defender/scripts/case_history/ticket_writer.py::open_case_ticket
      frame: leg
      provenance: code
      note: "the ticket key's only existing producer — it writes under `run_dir.name` (claim n4, fork F-D)."
    # --- the archive ----------------------------------------------------------------------
    - id: archive_episode               # defender/learning/branch/archive.py::archive_episode
      frame: leg
      provenance: design
      note: "MODIFY: gains a seventh `_single_files`-shaped entry, sourced from the host sidecar (F2-A)."
    - id: verify_family                 # defender/learning/branch/cli.py::verify_family
      frame: composition
      provenance: code
      note: "decides archive membership by `_scrub_ran` ALONE — not by exit class (probe #23 / claim p23)."
    # --- the grading lane -----------------------------------------------------------------
    - id: _grade_world                  # defender/learning/judge/family.py::_grade_world
      frame: leg
      provenance: design
      note: "MODIFY: a fourth `(row, None)` early return, ordered AHEAD of `_missing_required_input` (F5-A)."
    - id: grade_family                  # defender/learning/judge/family.py::grade_family
      frame: composition
      provenance: design
    - id: read_world_facts              # defender/learning/judge/family.py::read_world_facts
      frame: leg
      provenance: design
      note: "MODIFY: reads `worlds/<label>/run_end.json` through `json_mapping` (family.py:519)."
    # --- the unmoved readers reality imposes: no demand asked for any of these -------------
    - id: route_finding                 # defender/learning/judge/enqueue.py::route_finding
      frame: leg
      provenance: code
      note: "carries `ungradable_reason` onto the ledger's disposition entry (claim n8)."
    - id: _render_family_mechanical_rows  # defender/learning/judge/run.py:700-713
      frame: leg
      provenance: code
      note: >-
        Renders a HARDCODED field list (declared/verdict/bucket/withheld_reason/difference_shown/
        reachable_by_capture/ungradable). A new `cut_short` row key would be invisible to the
        family-level judge, which could not tell a cut-short world from a malformed one. No demand
        owns this; `47-reground-probes.md` red flag 5 says F-J/F-X should own it or waive it.
    - id: enqueue_report                # defender/learning/judge/enqueue.py::enqueue_report
      frame: leg
      provenance: code
      note: >-
        Derives BOTH degradations probe #28 found on an empty gradable set: `alert_rule_key`
        silently becomes the literal "unkeyed" (`persist.py:118-130`), and `family_pattern` falls
        back to the holding-system name, which `enqueue.py:791-797`'s own comment says makes every
        family-level finding permanently unselectable. Both pre-existing; #1047 is what makes the
        empty set reachable in practice (claim h2).
    - id: learning_refusal_gate         # defender/run_common.py::learning_refusal_gate
      frame: leg
      provenance: code
      note: >-
        FORK F-E's fourth reader of the exit class: refuses the corpus on `truncated_by is not
        None`, unconditionally — so for a value the ticket table does not name, the two lanes treat
        one run oppositely. `one_interpreter_for_the_exit_class` does not bind it; §7 decides.
    - id: enqueue_curation              # defender/run_common.py::enqueue_curation
      frame: leg
      provenance: code
    - id: ends_on_complete_pair         # defender/runtime/session_store.py::ends_on_complete_pair
      frame: leg
      provenance: code
      note: >-
        ZERO production callers (claim h6, partly refuted): the column has no production reader
        today, so this change's readers are its first.
    - id: predicted_disposition         # defender/evals/held_out.py::predicted_disposition
      frame: leg
      provenance: code
      note: "fork F-AA (RESOLVED, §7 round 2): keeps reading a host-forced report as the model's own, unchanged by this piece — named by the waiver `forced_close_set_unchanged` and pinned by `s116`."
    - id: _report_disposition           # defender/learning/ops/trace_lesson.py::_report_disposition
      frame: leg
      provenance: code
      note: "fork F-AA's second reader — no longer unnamed: the waiver `forced_close_set_unchanged` binds its edge and names it in its outcome (RESOLVED, §7 round 2)."
    - id: verdicts                      # defender/learning/branch/episode.py::verdicts
      frame: leg
      provenance: code
      note: "id reconciled from 20-demands.md's `branch/episode.py::verdicts`; no production caller (n11)."
    - id: sibling_union                 # defender/learning/judge/render.py::sibling_union
      frame: leg
      provenance: code
    - id: _pass_lessons_commit          # defender/learning/judge/__init__.py::_pass_lessons_commit
      frame: leg
      provenance: code
    # --- the walkers of the runs base the new sidecar leaf lands in (probe #32's census) ----
    - id: index_runs                    # defender/evals/held_out.py::index_runs
      frame: leg
      provenance: code
    - id: in_context_cases              # defender/learning/ops/trace_lesson.py::in_context_cases
      frame: leg
      provenance: code
    - id: _entries_of                   # defender/scripts/visualize/visualize_episode.py:853
      frame: leg
      provenance: code
    - id: materialize_run_dir           # defender/run_common.py::materialize_run_dir
      frame: leg
      provenance: code
      note: "the runs base's only existing writer (project profile, `runs_base` census)."
    - id: generate_case                 # defender/evals/oracle_golden/generate_case.py
      frame: composition
      provenance: code
      note: >-
        AN EXECUTION CONTEXT NO DEMAND ASKED FOR, surfaced by `spec-graph actors`: it RE-EXECUTES
        `defender/run.py` as a subprocess (`DEFENDER_RUN`, `Runner = Callable[...,
        subprocess.CompletedProcess]`, :56/:71/:90), so it drives `run_main` — and therefore the
        sidecar write — in a process whose runs base is the estate runner's record directory, not
        the operator's. Probe #32 deliberately scoped that directory OUT of its walker census;
        the relocated-anchor class is exactly what the actors check exists to catch, so it is
        modelled rather than waived.

  boundaries:

    # ---------------------------------------------------------------------------------------
    # THE EXIT-CLASS VALUE — one vocabulary, four carriers, six consumers
    # ---------------------------------------------------------------------------------------
    - id: truncated_by
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              A member of TRUNCATED_BY_VALUES (session_store.py:54-63) or None when the run was not
              cut short. Four carriers hold it and they can disagree: the store column (stamped
              best-effort, claim h20), the driver's in-process summary (`_run_summary`, seven keys,
              driver:176-186), the host-side sidecar, and the archived record. On the setup-failure
              arm (driver:586-606) the summary says "store" and the column was never stamped at all.
          default: "None"
          distinguished:
            - "request-limit"    # UsageLimitExceeded; in the forced-close set
            - "retry-exhausted"  # UnexpectedModelBehavior; in the forced-close set
            - "aborted"          # RunAborted; writes no report.md
            - "budget"           # BudgetKill; writes no report.md
            - "store"            # (sqlite3.Error, StoreError); writes no report.md
            - "dead-end"         # lead-only today (tools_gather.py:550); no arm in the per-class table
            - "None"             # a real member: "this run was not cut short" (settled premise 3)
          falsy_valid: true      # the real member is Python None and it is VALID, not a rejection
          documented_alternatives: []
    # ---------------------------------------------------------------------------------------
    - id: normalized_truncated_by
      provenance: design
      note: >-
        THE NEW SEAM. Id reconciled from `20-demands.md`'s `session_store.normalized_truncated_by`
        — the dotted spelling parses to root `session_store` in the gate's address grammar. Claim
        h11: `lint_borrowed_vocabulary` is self-arming on the defining module gaining a membership
        function, so this seam is what starts the gate biting on the new consumers (flagged fact F8).
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The OWNER'S INPUT domain — every spelling a caller can hand it, as opposed to
              `truncated_by.domain`, which is the value vocabulary consumers branch on. The
              function's parameter is typed `object`: non-strings are inputs too, and the settled
              premises pin them to None.
          default: "None"        # the answer an input outside TRUNCATED_BY_VALUES receives
          distinguished:
            - ""                 # the falsy input (settled premise 4)
            - "request_limit"    # the underscore near-miss (settled premise 7)
            - " request-limit "  # F-M RESOLVED (strict): owner_is_strict_about_near_member_spellings binds it
            - "REQUEST-LIMIT"    # F-M RESOLVED (strict): owner_is_strict_about_near_member_spellings binds it
            - "аborted"          # F-M RESOLVED (strict): owner_is_strict_about_near_member_spellings binds it
            - "context-limit"    # F-Y RESOLVED: owner_refuses_a_future_vocabulary_member binds it
          falsy_valid: false     # the empty string is NOT a member; it answers None
          documented_alternatives: []
    # ---------------------------------------------------------------------------------------
    - id: run_end_sidecar
      provenance: design
      note: >-
        F2 reading A's host-owned source, at the `scrub.verdict_path` precedent
        (`tree.parent / f"{tree.name}<suffix>"`, scrub.py:124-129). Outside every box's rw bind
        (settled premise 83, claims h23/n2). The SUFFIX is unnamed by any resolution — F6 named the
        ARCHIVED record (`run_end.json` / `RUN_END_NAME`), not this one.
      facets:
        identity:
          key_axes: [run_id]
          evidence:
            nl: >-
              Read off the precedent F2's resolution chose: `scrub.verdict_path(tree) =
              tree.parent / f"{tree.name}.scrub-verdict.json"` (runtime/scrub.py:124-129), one
              sidecar per run dir, the name a pure function of the run dir's own name. Probe #32
              (claim p32) re-verified that for a production run `tree.parent` IS the runs base and
              for a sibling it is `<episode_dir>/runs`.
          derivations:
            - {value: sidecar_name, fn_of: run_id, injective: true}
          sharing: unique-key
        payload:
          # RESOLVED at §7 round 2 (fork F-A, human, reading B). TWO parts, both host-observed
          # at the same moment, in the DRIVER's own frame — `_run_summary`'s seven keys carry
          # neither today (claim p21), so this is a signature change on `run_investigation`,
          # not a plumbing pass.
          parts:
            - {role: truncated_by,      source: "const:driver_exit_class"}
            - {role: closed_before_cut, source: "const:ReviewState.of(deps).closed"}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            The host-side run-end record: what the sibling's own host process observed about how
            its run ended, written where no box has a bind. `truncated_by` is null for a run that
            was not cut short (settled premise 33 pins the write as unconditional, with null as
            valid CONTENT); `closed_before_cut` says whether the model had already published its
            own verdict when the exit class was stamped.
        access:
          constraints_by_via:
            fs-host-write:
              trust: operator
              # RESOLVED at §7 round 2. F-H (auto): a failed write SWALLOWS and continues, logged
              # loudly — every precedent for a post-run write in this tree is best-effort and
              # propagating would break an otherwise-successful run — and, coupled to F-B, a
              # failed record write is a reason NOT to write the forced report, which closes the
              # window F-B was about. F-F (auto, round-2 probe #11 EXECUTED): `write_guarded`,
              # which refuses both symlinks and hard links, never `copy2`.
              #
              # `failed-write-suppresses-the-forced-report` ADDED AT PHASE F: F-H's second clause
              # had no constraint, demand, waiver or test. `before-the-forced-report` is only the
              # ORDERING half of it — ordering closes F-B's window for a KILLED process, not for
              # a write that raised and was swallowed. Pinned by
              # `failed_run_end_write_suppresses_the_forced_report`.
              constraints: [write_guarded, best-effort, before-the-forced-report,
                            failed-write-suppresses-the-forced-report]
    # ---------------------------------------------------------------------------------------
    - id: run_end_json
      provenance: design
      note: "the archived per-world record at `worlds/<label>/run_end.json` (F6 resolved auto: the doc's own spelling, `RUN_END_NAME`)."
      facets:
        identity:
          key_axes: [episode_id, world_label]
          evidence:
            nl: >-
              Read off `archive_episode`'s own destination composition (archive.py:223-320, one
              `worlds/<label>/` per archived world under one episode dir) plus claim h16's
              collision check — `run_end` has 12 hits tree-wide and not one is a file of this
              name — and claim h17's writer census of `worlds/<label>/` (archive_episode, the
              judge's draw writer, verify_family's mkdir; `_single_files` is exactly six roles and
              includes no run-end record).
          derivations: []
          sharing: unique-key
        payload:
          # RESOLVED at §7 round 2 (fork F-A): the archived copy carries whatever the sidecar
          # carried, and the sidecar's field set is now decided. The archive normalises
          # `truncated_by` through the owner on the way in, which is what makes settled premise
          # 69 ("no plant produces a row value the owner would not") true by construction.
          parts:
            - {role: truncated_by,      source: "normalized_truncated_by"}
            - {role: closed_before_cut, source: "const:run_end_sidecar"}
          invariants: [all-slots-bound]
          nl: "the host's own record of how this world's run ended, written by the archive, never copied out of the box's bind."
        domain:
          type: str
          refinement:
            nl: >-
              The STATES the judge's read can meet at `worlds/<label>/run_end.json`. The record is
              read through `json_mapping` (family.py:519), so absent, unreadable, undecodable and
              non-mapping all answer None (demand #0a). Each member below is one settled premise or
              one open fork arm; two of the nine are bound by no demand on purpose.
          default: "absent"
          distinguished:
            - "absent"         # missing_run_end_grades_as_today (and settled premises 28/86/92/110)
            - "empty"          # settled premise 14 — zero bytes
            - "no-key"         # settled premise 17 — a mapping without `truncated_by`
            - "null"           # settled premise 18 — `truncated_by: null`, the valid "not cut short"
            - "extra-keys"     # settled premise 19 — tolerated; the producer is host-side
            - "wrong-typed"    # settled premise 20 — a non-string value
            - "undecodable"    # settled premise 22 — undecodable bytes
            - "truncated-json" # F-Y RESOLVED: judge_refuses_truncated_json_and_a_json_list binds it
            - "json-list"      # F-Y RESOLVED: judge_refuses_truncated_json_and_a_json_list binds it
          falsy_valid: true    # `truncated_by: null` is a valid record, not a malformed one
          documented_alternatives: []
        access:
          constraints_by_via:
            fs-archive-guarded-write:
              trust: operator
              # RESOLVED at §7 round 2 by round-2 probe #11 (EXECUTED). F-F (auto): unconditional
              # overwrite THROUGH the guarded seam — a pre-existing regular file is replaced, a
              # symlink or hard link at the destination is refused, so a planted file cannot
              # block the host's own record from landing nor redirect it. F-U (human): a real I/O
              # error inherits the existing archive's raw-OSError behaviour with no special-casing,
              # because only ENOENT/ENOTDIR/EBADF/ELOOP fold into "absent" for the other six
              # artifacts and this leaf is not made more robust than the six it sits beside.
              constraints: [write_guarded, destination-screen, overwrite-unconditionally]
    # ---------------------------------------------------------------------------------------
    - id: world_row
      provenance: design
      facets:
        payload:
          parts:
            - {role: world,             source: "const:world_label"}
            - {role: declared,          source: "const:normalized_disposition"}
            - {role: holding_system,    source: "const:manifest_discriminator"}
            - {role: ungradable,        source: "const:true"}
            - {role: cut_short,         source: "normalized_truncated_by"}
            - {role: ungradable_reason, source: "template:CUT_SHORT_REASON",
               slots: {label: world_label, exit: truncated_by}}
          invariants: [all-slots-bound]
          nl: >-
            The third row shape (demand #0a, F1 reading A): `cut_short` is a TOP-LEVEL key beside
            `ungradable`, matching how `malformed` spells tier 2's discriminator; no `malformed`
            key; the reason is `f"world {label!r}: its run ended {value}; the host's report is not
            a verdict"`. `_grade_world`'s early returns are `(row, None)` and the row is built at
            family.py:1149-1151, so an early-returning row carries NO `pattern` — which is what
            makes `enqueue_report`'s `family_pattern` fall back (probe #28).
          note: >-
            `roles-disjoint-sources` is deliberately NOT claimed: `cut_short` and
            `ungradable_reason` legitimately derive from the same exit value.
    # ---------------------------------------------------------------------------------------
    - id: gradable
      provenance: design
      note: >-
        The set of worlds `is_gradable_row` admits — the input every per-pass derivation reads.
        It is `provenance: design` because this piece is the first change that can EMPTY it in
        practice: before #1047 a host-forced world still counted as measuring (claim h2).
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              Cardinality classes of the gradable set, not values. Probe #28 settled that nothing
              crashes on the empty one — the sibling-union walk is already short-circuited
              (`__init__.py:583`), the lessons commit returns None, `verdict_word` computes
              `undecidable` on an already-tested path, `max(..., default=0)` holds — and surfaced
              the two silent degradations that fire exactly there.
          default: "non-empty"
          distinguished:
            - "empty"    # F-J RESOLVED (F-X folded in): the waiver all_cut_short_episode_degrades_generic_keys binds it. Not "does anything
                         # crash" (answered: no) but "is silently losing every finding from an
                         # all-cut-short episode acceptable, or does it need its own guard/waiver".
          falsy_valid: true
          documented_alternatives: []
    # ---------------------------------------------------------------------------------------
    - id: verdict_word
      provenance: code
      facets: {}
      note: >-
        Facetless on purpose: this piece asserts only that a cut-short world does not MOVE it
        (claim h7 — `is_gradable_row -> graded -> measuring` already excludes an ungradable row).
        The degenerate "nothing left to measure" case is modelled on `gradable`, not here.
    - id: report_md
      provenance: code
      facets: {}
      note: >-
        Facetless: waiver `report_md_gains_no_field` says it gains nothing, and its trust story
        lives on `run_dir.access` (it sits inside the box's rw bind — flagged fact F4, claim h4).
        Claim h3: `validate_report` admits an unknown frontmatter key, which is why the first
        draft's design (put the exit class here) was refused. Claim h8's corrected census is 14
        production reader modules, five of which are modelled below as unmoved readers.
    - id: run_dir
      provenance: code
      facets:
        access:
          constraints_by_via:
            box-rw-bind:
              trust: attacker-influenced
              constraints: []          # NONE, and that is the load-bearing fact: the box is root on
                                       # this bind (`_lifecycle.py:57-58`, flagged fact F4), so it
                                       # can rewrite report.md, plant a run_end.json, and rewrite
                                       # both fields of session_store_pointer.json after the host
                                       # wrote them. The bind list is claim h23: run_dir rw,
                                       # defender_dir ro, a /tmp tmpfs, and nothing else.
            host-write-guarded:
              trust: operator
              constraints: [write_guarded, destination-screen]
                                       # every host write into this tree goes through
                                       # `_io.write_guarded`; the archive additionally screens every
                                       # destination leaf (archive.py:243-273, flagged fact F5).
    - id: session_store
      provenance: code
      note: >-
        The sqlite database at `<runs_base>.parent/sessions/<case_id>.db`. NOTHING in this piece
        reads it: F2 reading B (archive reads the source store) and F3 reading B (ticket lane
        recovers the case id from the pointer) were both rejected. Kept in the graph because the
        design is DEFINED by not reading it, and because the four co-writers below are the census
        `10-brief.md` §4 established.
      facets:
        identity:
          key_axes: [case_id, session_id]
          evidence:
            nl: >-
              Read off the DDL and the path helper: `session_store.py:127-134` makes `session_id
              TEXT PRIMARY KEY` the row identity with no world, run or label column, and
              `:674-678` names the file `runs_base.parent/"sessions"/f"{case_id}.db"`. Claim h15
              is the consequence and it is REFUTED as the design assumed it: `StoreHandle.fork`
              copies `case_id` and `agent_id` from the parent and sets `head_message_id`, so N
              sibling forks of one source session differ only by a random `session_id` — the key
              does not cover `world_label`, which is why the launcher cannot resolve "this world's
              session" (claim h10) and why repair (b) was not soundable (claim h21 / flagged F3).
          derivations:
            - {value: store_filename, fn_of: case_id, injective: true}
          sharing: unique-key
    - id: session_store_pointer
      provenance: code
      facets: {}
      note: >-
        `<run_dir>/session_store_pointer.json` (POINTER_FILENAME, session_store.py:663). Written by
        the host during store setup, BEFORE the box exists — and then rewritable by the box, which
        is root on the bind (flagged fact F4). The only run_dir -> case_id mapping there is (claim
        n4), and therefore the one input F3 reading B would have taken. Modelled with a writer and
        NO reader: the absence of a read edge is the design's negative universal, made addressable.
    - id: ticket_store
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence:
            nl: >-
              Read off the two ends of the ticket lane: `open_case_ticket` writes under
              `run_dir.name` as the ticket key, and `case_ticket.read_case_record` recomputes the
              same value as `case_id = run_dir.name` — but only AFTER `require_report` succeeds
              (10-brief.md §4's ticket_store census; claim n4 on the namespace split from the
              store's own `case_id`). Fork F-D is exactly that gate: an `aborted` run has no
              report.md (claim h1), so the identity exists but today's only path to it does not.
          derivations: []
          sharing: unique-key
        access:
          constraints_by_via:
            http-transition:
              trust: operator
              constraints: [config-mapping-template, report-derived-identity]
                                       # `POST /tickets/{key}/transitions`, rendered from the
                                       # operator's own close mapping, addressed via
                                       # `read_case_record` (claim n9: this is the ONLY write
                                       # ticket_writer makes today).
            http-note:
              trust: operator
              # RESOLVED at §7 round 2. F-D by round-2 probe #30 (EXECUTED): `run_dir.name` IS a
              # report-independent identity in the same namespace `open_case_ticket` writes
              # under, so the note has an addressee on the arm that needs it —
              # `run-dir-derived-identity`, NOT `report-derived-identity` (which `http-transition`
              # has and which must not hold here: the note's whole purpose is the arm with no
              # report). `config-mapping-template` holds by construction — the note renders from
              # the operator's own mapping.yaml exactly as the transition does. F-L (auto): a
              # failed call is swallowed and its outcome written to `ticket_write.json`. F-R
              # (auto): an unconfigured lane makes no call for any exit class.
              # F4's reading B (no call at all, receipt only) is NOT taken; the fallback it held
              # in reserve is not needed.
              constraints: [config-mapping-template, run-dir-derived-identity, best-effort,
                            outcome-recorded-in-receipt]
    - id: ticket_write_json
      provenance: code
      facets:
        payload:
          # RESOLVED at §7 round 2 (fork F-L, auto): the receipt records the outcome of whatever
          # call the lane made — the close transition OR the escalation note — success or failure
          # alike, because a swallowed note failure with no record is invisible to the operator.
          parts:
            - {role: key,    source: "const:run_dir.name"}
            - {role: status, source: "const:ticket_lane_outcome"}
            - {role: url,    source: "template:TICKET_URL", slots: {key: run_id}}
            - {role: ok,     source: "const:ticket_lane_outcome"}
          invariants: [all-slots-bound]
          nl: >-
            `<run_dir>/ticket_write.json` — the lane's own receipt. CORRECTED at phase E
            (62-reground-round2.md red flag 2): it is a plain `write_text` into the box's rw bind
            (`ticket_writer.py:145`), NOT a `write_guarded` write as this slot previously said.
            It is an OUTPUT and never an input — settled premise 75 pins that a forged receipt
            claiming a prior closure suppresses nothing.
    - id: _CUT_SHORT_WITH_A_MODEL_STILL_OWED_A_CLOSE
      provenance: code
      facets: {}
      note: >-
        `driver/__init__.py:324-327` = {request-limit, retry-exhausted} (claim h1). Waived
        unchanged, so deliberately facetless — a domain facet here would obligate an exercise per
        member for a set this piece declines to touch. `forced_close_set_does_not_decide_the_ticket`
        is the parity demand that makes the waiver safe: what a ticket does must not move when this
        set later widens.
    - id: _missing_required_input
      provenance: code
      facets: {}
      note: >-
        `family.py:1107` — the existing tier-1 presence check over the ledger artifact, report.md,
        investigation.md and alert.json (claim n7). F5 reading A puts the cut-short check AHEAD of
        it, which is what makes the exit class observable for the three classes that write no
        report at all.
    - id: review_record
      provenance: code
      facets: {}
      note: "`<run_dir>/review_record.<n>.json`; waived unchanged. No edge: nothing in this piece reads or writes it."
    - id: runs_base
      provenance: code
      note: >-
        The production runs base — and, for a sibling, `<episode_dir>/runs` (`sibling_runs_base`,
        cli.py:641-652). The new sidecar lands here as a LEAF beside every run dir. Probe #32
        (claim p32) censused eight walkers of this tree and found every one screens non-directory
        entries, and that the leaf is not even a new KIND of entry: a `.scrub-verdict.json` sidecar
        has sat beside every run dir since that verdict shipped. Four of the eight are modelled as
        actors below; the full list is in claim p32, not re-typed here.
      facets:
        identity:
          key_axes: [run_id]
          evidence:
            nl: >-
              Every entry under the base is named by a run id: `materialize_run_dir` creates
              `<runs_base>/<run_id>/` and `scrub.verdict_path` puts `<runs_base>/<run_id>.scrub-
              verdict.json` beside it (scrub.py:124-129, re-read for probe #32). The new sidecar
              takes the same shape, so the run id is the whole key on both writers.
          derivations:
            - {value: sidecar_name, fn_of: run_id, injective: true}
          sharing: unique-key

