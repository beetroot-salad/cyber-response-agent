                # AUTHORITATIVE TEXT is the issue's intent+design comment as CORRECTED by
                # `70-resolutions.md` (§7, early invocation: forks F1-F7 all resolved) — the
                # doc's own archive mechanism (h10) and ticket mechanism (h22/n4) are REFUTED
                # and replaced there. Assembled at phase D from `10-brief.md`, `20-demands.md`
                # and `45-dispositions.md` (amended post-re-ground), with `47-reground-probes.md`
                # and `70-resolutions.md` read for grounding.
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`).
                        # check_binds scans its docstrings NON-RECURSIVELY over `*.py` in this
                        # ONE directory, so every `discharged_by` below must land there, not
                        # under `tests/e2e/`. Planned phase-E modules, following the corpus's
                        # per-issue convention (`test_921_family_facts.py`,
                        # `test_992_close_contract.py`, `test_947_triplet_archive.py`).
                        # WRITTEN AT PHASE E — six modules plus one shared machinery module:
                        #   defender/tests/_spec1047.py                    (builders + fakes)
                        #   defender/tests/test_1047_vocabulary_owner.py   (the owner seam)
                        #   defender/tests/test_1047_grading_lane.py       (O1)
                        #   defender/tests/test_1047_archive_record.py     (O3 + the driver's write)
                        #   defender/tests/test_1047_ticket_lane.py        (O2)
                        #   defender/tests/test_1047_forgery_universals.py (the security dive)
                        #   defender/tests/test_1047_unmoved_readers.py    (the R7 coherence set)
                        # Every `discharged_by` below now names a test that EXISTS and is RED
                        # against `59bdea44` except where noted in `80-author-digest.md`.
base: 59bdea44          # origin/main@59bdea44285f37c3380dfa436c87a0c698e5b877 == this worktree's
                        # HEAD (verified, claim a2). EVERY file:line anchor in the three input
                        # frontiers was probed against this tree. The `ed890678` base the phase-A
                        # leaves found (claims h12/n1) has been reset away; h12/n1 are kept in the
                        # ledger as refuted-and-repaired, not deleted.

# ==========================================================================================
# READ THIS FIRST — how this graph is organised, and what it deliberately does NOT decide
#
# demands   — 87. The 28 resolved demands of `20-demands.md` (ids kept verbatim, three `binds`
#             addresses RE-POINTED by name reconciliation — see "NAME RECONCILIATION" below),
#             then 59 `sNN_*` demands minted one-per-SETTLED-PREMISE from `45-dispositions.md`
#             §1 (60 settled, minus premise #37 whose own disposition says no demand is needed —
#             recorded in `handoff.drops`). Each settled demand is `discharged_by` the premise's
#             OWN test name, so phase E's author and phase F's premise-disposition conservation
#             walk join by name.
#             The 30 fork premises and 29 silent branches mint NO demand here. They are §7's.
#             Where a fork's outcome would determine an invariant field, that field is written
#             `unknown` with the fork id beside it; where it would determine whether a value is
#             exercised, the value is modelled as a `distinguished` member NO demand binds, so
#             the gate computes an R4 hole per open arm and the residue names the fork. Six
#             `unknown` fields and seven unbound domain members trace back to nine forks.
# structure — the demand-implied address space (`provenance: design`) attached to the grounded
#             neighbourhood (`provenance: code`) `10-brief.md` §4 established: the four
#             co-writers of the `truncated_by` column, the three unmoved readers of the exit
#             class (F-E's fourth reader among them), the five unmoved readers of `report.md`
#             (F-AA's two among them), the three unmoved readers of the graded row
#             (`_render_family_mechanical_rows`' fixed field list among them), the three unmoved
#             readers of the gradable set (F-J's two new degradations among them), and the four
#             walkers of the runs base the new sidecar leaf lands in (probe #32's census).
#             None of those consumers was asked for by a demand; every one of them is why R7
#             exists.
# claims    — 43. The brief's 19 (h1, h4, h6, h8-h23), the extraction's 13 (n1-n13), three
#             inherited from the design doc that the three input frontiers CITE but do not
#             re-mint (h2, h3, h7 — reconstructed from their citations, see their entries), the
#             five re-ground probes the amended dispositions rest on (p21, p23, p25, p28, p32),
#             two raised at assembly (a1, a2), and h5 — RESTORED by the gate leaf directly from
#             gh issue #1047's intent+design comment (`50-graph-digest.md` red flag 6 named it
#             recoverable only from the doc itself, which this pass fetched and read). Inherited
#             ids are kept.
#             Two transcription decisions, both flagged in `50-graph-digest.md`: the brief's
#             free-text verdicts ("partly-refuted", "holds-on-origin-main", "refuted-as-stated")
#             are normalised into schema.md's closed vocabulary with the original wording moved
#             verbatim into `observed`; and the instrument each claim ACTUALLY used is recorded
#             as-is, so the several `behavior`/`reachability` claims closed on `probe_kind: read`
#             stay visible as the findings `spec-graph claims` will call them.
# gate      — WRITTEN by this pass (phases/graph-gate.md, "Charge — the gate leaf"). 49 slot-
#             computed firings (R1 x4, R2 x3, R3 x4, R4 x23, R7 x15) plus 8 hand-caught findings
#             (three unheard `unknown` access cells the mechanical R0 arm cannot see because a
#             demand's bare bind silences it, two probe-obligation instrument corrections, one
#             R5 judgment hole, one review_record citation gap, one gate-minted negative demand
#             for the unowned tier-split direction) are routed below and in `60-residue.md`: 10
#             minted test obligations, 18 design holes for §7, 6 re-grounds, 1 waiver candidate,
#             22 pre-discharge credits, all cited. `spec-graph gate` (bare) now exits clean.
#
# NAME RECONCILIATION (three coining passes, unified here by role+origin)
#   `session_store.normalized_truncated_by` (20-demands)  -> boundary `normalized_truncated_by`
#        The module-qualified spelling parses to root `session_store` in the gate's address
#        grammar, which would let a demand on the OWNER answer a trigger on the STORE. The code
#        symbol is `normalized_truncated_by`; that is the id.
#   `branch/episode.py::verdicts` (20-demands)            -> actor `verdicts`
#   `interacts(close_case_ticket->session_store).response` (20-demands, written before F3 was
#        resolved) -> `interacts(close_case_ticket->truncated_by)`. Under F3 reading A the ticket
#        lane reads NO store: it takes the driver's in-process summary value. Keeping the old
#        address would have modelled the one read the design's negative universal forbids.
#        Both demands that carried it are re-pointed, and say so in their `note`.
#   `run_end_json` (20-demands) / `worlds/<label>/run_end.json` (brief §4)  -> one boundary.
#   `run_end_sidecar` (20-demands) / "a sidecar beside its run dir" (70-resolutions F2-A) -> one.
#   `truncated_by` names the exit-class VALUE (the vocabulary every lane branches on);
#        `session_store` names the sqlite database that is one of its carriers. The brief used
#        the first for the column and the second for the file; they are split here because the
#        design's whole point is that the value now travels on a path the store is not on.
#   Axis names: `world_label` (brief: "label", demands: "<label>"), `run_id` (brief:
#        "run_dir.name"), `case_id`, `session_id`, `episode_id` — declared once in `axes:`.
# ==========================================================================================

demands:

  # ----------------------------------------------------------------------------------------
  # THE GRADING LANE (O1) — 20-demands.md §Demands, "The grading lane (O1)"
  # ----------------------------------------------------------------------------------------
  - id: cut_short_row_shape                       # DEMAND #0a
    kind: behavior
    form: test
    source: "20-demands.md demand #0a (F1 resolved auto, reading A)"
    binds:
      - "_grade_world"
      - "interacts(read_world_facts->run_end_json).response"
      - "interacts(_grade_world->world_row).payload"
    discharged_by: test_a_cut_short_world_files_the_third_row_shape
    seed_docstring: >-
      A world whose archived run_end.json says its run was truncated — and whose model had NOT
      already closed — returns the third row shape: ungradable: True, cut_short carrying the
      normalized exit value, and an ungradable_reason naming the exit, with no `malformed` key,
      so tier 1 still means absent and tier 2 still means malformed.
    note: >-
      AMENDED AT PHASE E per fork F-A's resolution (70-resolutions-round2.md, human, reading B):
      the record's FIELD SET grows a second field, `closed_before_cut: bool`, and the third row
      shape is filed only when the world was cut short WITHOUT deciding. F1 resolved the row's
      KEY LAYOUT, not its field set; `run_end_json.payload.parts` is now known and written out
      below. This is a reading-flip on demand #0a and the contract's own rule asks for a Phase C
      re-run; the author applied it directly instead — a deliberate, flagged scope decision
      recorded in `80-author-digest.md` for the merge-gate human.

  - id: cut_short_world_is_ungradable
    kind: behavior
    form: test
    source: "20-demands.md"
    binds:
      - "grade_family"
      - "interacts(_grade_world->world_row).payload"
      - "truncated_by.domain.distinguished[request-limit]"
    discharged_by: test_a_request_limit_world_is_ungradable_not_a_verdict
    seed_docstring: >-
      grade_family over an episode whose world b ended `request-limit` files row b ungradable
      with a reason naming the exit, instead of grading the host's forced `unresolved` report
      as b's verdict about the case.
    note: "paired positive control for the two forgery negatives below (phase-F pairing rule)."

  - id: cut_short_does_not_move_verdict_word
    kind: behavior
    form: test
    source: "20-demands.md"
    binds: ["grade_family", "verdict_word"]
    discharged_by: test_a_cut_short_world_does_not_move_the_family_verdict_word
    seed_docstring: >-
      verdict_word is computed over the remaining measuring worlds: the control episode's word
      is unchanged by world b's run being cut short, where today a host-forced unresolved report
      on b flips caught to survived.
    note: >-
      Rides is_gradable_row -> graded -> measuring (family.py:1388, :1504-1512), which claim h7
      confirms already excludes an ungradable row; the demand pins the OBSERVABLE, not the path.
      The DEGENERATE case — every measuring world cut short, so the set is empty — is fork F-J
      and is NOT bound here; it is modelled as `gradable.domain.distinguished[empty]`.

  - id: forged_run_end_in_run_dir_changes_nothing
    kind: negative
    form: test
    source: "20-demands.md"
    binds:
      - "archive_episode"
      - "interacts(archive_episode->run_dir)"
      - "interacts(read_world_facts->run_end_json).response"
      - "run_dir.access[box-rw-bind]"
    discharged_by: test_a_forged_run_end_record_in_the_run_dir_does_not_reach_the_grade
    seed_docstring: >-
      A run_end.json planted in world b's run dir before the archive never reaches the judge:
      the archived record is the host's own, and b grades exactly as the control did.
    note: >-
      `run_dir.access[box-rw-bind]` added at assembly: schema.md's rule for kind:negative is that
      it binds EVERY surface the content could reach, and the box's rw bind is the via the content
      arrives on (flagged fact F4). paired positive control: cut_short_world_is_ungradable.

  - id: forged_truncated_by_frontmatter_changes_nothing
    kind: negative
    form: test
    source: "20-demands.md"
    binds:
      - "report_md"
      - "interacts(_grade_world->world_row).payload"
      - "interacts(_grade_world->report_md)"
    discharged_by: test_a_planted_truncated_by_line_in_report_frontmatter_changes_nothing
    seed_docstring: >-
      A `truncated_by:` line spliced into world b's report.md frontmatter — which validate_report
      admits (claim h3) — changes neither b's row nor the family's verdict word.
    note: "paired positive control: cut_short_world_is_ungradable."

  - id: tier_split_survives
    kind: shape
    form: test
    source: "20-demands.md"
    binds: ["interacts(_grade_world->world_row).payload", "world_row"]
    discharged_by: test_the_third_row_shape_keeps_the_two_tiers_separable
    seed_docstring: >-
      The cut-short row carries no `malformed` key and an absent input still carries none either,
      so `test_921_family_facts.py:631`'s absent-vs-malformed split reads the same after the
      change as before it.
    note: >-
      This pins ONE direction only. `45-dispositions.md` red flag 6 recorded the other
      direction — a world ungradable for a PRE-EXISTING reason must not spuriously acquire a
      `cut_short` key — which no lens owned and no premise in the merged 121 covered. NO LONGER
      UNOWNED (label swept at phase F): `tier_split_survives_the_other_direction` was minted for
      it and is discharged by
      `test_a_pre_existing_ungradable_reason_does_not_acquire_a_cut_short_key`, one of the twelve
      tests that pass as regression pins at `59bdea44`. `handoff.deviations` carries the closure.

  - id: missing_run_end_grades_as_today
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "interacts(read_world_facts->run_end_json).response"
      - "run_end_json.domain.distinguished[absent]"
    discharged_by: test_a_world_with_no_run_end_record_grades_as_it_does_today
    seed_docstring: >-
      An archive written before this change — a world with no run_end.json at all — grades
      exactly as it does today: no cut_short key, no new ungradable reason, the same verdict
      and bucket.
    note: >-
      Fork F-B RESOLVED (§7 round 2, human, reading B; label swept at phase F) — but the cost
      this note names is real and is what the resolution had to close. Claim h2 observed that
      "grades as today" for a world carrying a host-forced `unresolved` report and NO record means
      the report is graded as a verdict and verdict_word flips caught->survived: the pre-#1047
      bug, reopened inside the piece's own crash window. TWO constraints close it, and this demand
      is safe only with both: the write is DRIVER-SITED and ordered BEFORE the forced report
      (`driver_records_whether_the_model_had_already_closed`), which covers a process KILLED
      between the two writes; and a FAILED record write suppresses the forced report
      (`failed_run_end_write_suppresses_the_forced_report`, F-H's second clause, minted at phase
      F), which covers the write that raised and was swallowed. Without the second, this demand
      affirmatively pins the dangerous state as acceptable while nothing prevents reaching it.

  - id: cut_short_check_precedes_missing_report_check
    kind: behavior
    form: test
    source: "20-demands.md (added by F5's resolution, reading A)"
    binds:
      - "_grade_world"
      - "interacts(read_world_facts->run_end_json).response"
      - "_missing_required_input"
      - "interacts(_grade_world->_missing_required_input)"
    discharged_by: test_an_aborted_budget_or_store_world_names_its_exit_not_a_missing_report
    seed_docstring: >-
      A world whose run ended aborted, budget or store — none of which write a report.md — still
      returns the third row shape naming that exit class, rather than the generic tier-1 reason
      "missing its report.md"; the cut-short check runs first for all five exit classes, not only
      the two that also produce a forced report.

  # ----------------------------------------------------------------------------------------
  # THE ARCHIVE LANE (O3) — mechanism replaced by F2's resolution (reading A, the sidecar)
  # ----------------------------------------------------------------------------------------
  - id: archive_writes_run_end_from_the_host
    kind: behavior
    form: test
    source: "20-demands.md (F2 resolved human, reading A)"
    binds: ["archive_episode", "interacts(archive_episode->run_end_json)"]
    discharged_by: test_the_archive_writes_each_worlds_run_end_record_itself
    seed_docstring: >-
      archive_episode writes worlds/<label>/run_end.json for each archived world, carrying the
      exit class the sibling's own host-side process recorded in its sidecar, copied in the same
      screened way the scrub verdict already is — never read from anything the box wrote inside
      the run dir.

  - id: archive_never_copies_a_same_named_entry
    kind: negative
    form: test
    source: "20-demands.md"
    binds:
      - "interacts(archive_episode->run_dir)"
      - "interacts(archive_episode->run_end_json)"
      - "run_dir.access[box-rw-bind]"
    discharged_by: test_a_forged_run_end_file_in_the_run_dir_is_never_the_archived_one
    seed_docstring: >-
      A run dir holding a file at the archived record's own name is archived with the host's own
      record, byte-for-byte — the planted file's content never appears in worlds/<label>/.
    note: "paired positive control: archive_writes_run_end_from_the_host."

  - id: exit_class_source_is_host_held
    kind: seam
    form: test
    source: "20-demands.md (F2 resolved human, reading A)"
    binds:
      - "archive_episode"
      - "interacts(archive_episode->run_end_sidecar).response"
      - "run_end_sidecar"
    discharged_by: test_the_worlds_exit_class_is_read_from_a_source_no_box_can_write
    seed_docstring: >-
      The value the archive writes is taken from a host-owned sidecar beside the run dir, outside
      every box's rw bind; with the run dir emptied of every file a box could have written, the
      archived record still names the exit — and still says whether the model had already closed.
    note: >-
      AMENDED AT PHASE E per fork F-A's resolution: BOTH fields of the record are host-held, so
      the negative universal is re-checked over the new one too. A second field is a second
      forgery surface if anything ever reads it from the run dir, which is why the emptied-run-dir
      arm asserts on `closed_before_cut` as well as on `truncated_by`.

  # ----------------------------------------------------------------------------------------
  # THE TICKET LANE (O2) — source replaced by F3's resolution (reading A, the in-process value)
  # ----------------------------------------------------------------------------------------
  - id: ticket_aborted_leaves_open_with_escalation   # DEMAND #0b, arm 1
    kind: domain-outcome
    form: test
    source: "20-demands.md (F4 resolved human, reading A)"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[aborted]"
      - "interacts(close_case_ticket->ticket_store)"
      - "ticket_store.access[http-note]"
    discharged_by: test_an_aborted_run_leaves_its_ticket_open_with_the_escalation
    seed_docstring: >-
      A run whose exit class is `aborted` leaves its ticket open and records the breaker's
      escalation — the environment appears unreachable, escalate with the visibility gap named —
      rather than transitioning the ticket to any resolution — and it defers to a genuine model
      close: a run whose `closed_before_cut` is true closes off its own verdict instead.
    note: >-
      AUTHORABLE AS OF §7 ROUND 2. Fork F-D is CONFIRMED VIABLE by round-2 probe #30 (EXECUTED):
      `open_case_ticket` keys on `run_dir.name` (`ticket_writer.py:97`) and `read_case_record`
      recomputes the identical expression (`case_ticket.py:157`), gated on `require_report` only
      by code POSITION, not semantics — so the note has an addressee on an arm with no report.md.
      `ticket_store.access[http-note].constraints` gains `run-dir-derived-identity` and
      `config-mapping-template`; `report-derived-identity` deliberately does NOT hold here.
      F-L (swallow the failure, always write the outcome to the receipt) and F-R (an unconfigured
      lane stays silent) are resolved and have their own demands below. AMENDED per F-A.

  - id: ticket_request_limit_closes_unresolved
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[request-limit]"
      - "interacts(close_case_ticket->ticket_store)"
    discharged_by: test_a_request_limit_run_closes_its_ticket_unresolved
    seed_docstring: >-
      A run whose exit class is `request-limit` closes its ticket `unresolved` off the host's
      forced report, exactly as it does today.
    note: >-
      Fork F-K RESOLVED (§7 round 2, auto, reading b; label swept at phase F): this arm's
      sub-case — the forced close itself failed, so there is no report to build the close payload
      from — takes the leave-open-with-escalation shape instead, pinned by
      `ticket_forced_close_failed_leaves_open_with_escalation`. This demand is that demand's
      positive control.

  - id: ticket_retry_exhausted_closes_unresolved
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[retry-exhausted]"
      - "interacts(close_case_ticket->ticket_store)"
    discharged_by: test_a_retry_exhausted_run_closes_its_ticket_unresolved
    seed_docstring: >-
      A run whose exit class is `retry-exhausted` closes its ticket `unresolved` off the host's
      forced report, exactly as it does today.

  - id: ticket_budget_leaves_open
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[budget]"
      - "interacts(close_case_ticket->ticket_store)"
    discharged_by: test_a_budget_kill_leaves_its_ticket_open_and_makes_no_transition
    seed_docstring: >-
      A run killed by the budget leaves its ticket open and makes no transition call at all — the
      missing report IS the escalation, and that stays true once the lane keys on the exit class.

  - id: ticket_store_leaves_open
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[store]"
      - "interacts(close_case_ticket->ticket_store)"
    discharged_by: test_a_store_fault_leaves_its_ticket_open_and_makes_no_transition
    seed_docstring: >-
      A run ended by a store fault leaves its ticket open and makes no transition call, as it
      does today.
    note: >-
      `47-reground-probes.md` red flag 4: there is a SIXTH producer of `truncated_by="store"` —
      the setup-failure arm at `driver/__init__.py:586-606` returns it in the summary WITHOUT
      ever reaching `_flush_run_end`, so on that path the summary and the store column disagree.
      Under F3's resolution this lane reads the summary, so it is the store column that lies;
      any demand phrased as "the store's truncated_by" would be wrong for this arm.

  - id: ticket_no_exit_class_uses_the_report
    kind: domain-outcome
    form: test
    source: "20-demands.md"
    binds:
      - "close_case_ticket"
      - "truncated_by.domain.distinguished[None]"
      - "interacts(close_case_ticket->report_md).response"
    discharged_by: test_a_run_that_was_not_cut_short_still_closes_off_its_report
    seed_docstring: >-
      A run with no exit class recorded closes its ticket from the report exactly as it does
      today — the ordinary completed run is untouched by this change.

  - id: ticket_unmapped_exit_class_falls_back
    kind: domain-outcome
    form: test
    source: "20-demands.md (F7 resolved auto, reading A)"
    binds: ["close_case_ticket", "truncated_by.domain.distinguished[dead-end]"]
    discharged_by: test_an_exit_class_the_table_does_not_name_takes_the_report_driven_fallback
    seed_docstring: >-
      An exit value the per-class table does not name — `dead-end`, or any string a future writer
      adds — takes the report-driven fallback rather than silently leaving the ticket in whichever
      state the last arm happened to reach.
    note: >-
      Fork F-E RESOLVED (§7 round 2, human; label swept at phase F): the divergence this creates
      is INTENTIONAL and stays. `run_common.learning_refusal_gate` REFUSES on any non-None value,
      so for an unmapped value the two lanes treat the same run oppositely — "can this feed
      training data" and "how should the ticket close" are different questions with different
      acceptable risk postures. The structural half landed as a bind correction: the unmoved
      reader edge `interacts(learning_refusal_gate->truncated_by)` is now named by
      `one_interpreter_for_the_exit_class`, whose test pins the divergence AS a divergence.

  - id: ticket_report_presence_fallback_stays
    kind: behavior
    form: test
    source: "20-demands.md"
    binds: ["close_case_ticket", "interacts(close_case_ticket->report_md).response"]
    discharged_by: test_a_run_with_no_exit_class_and_no_usable_report_still_leaves_the_ticket_open
    seed_docstring: >-
      The report-presence branch stays the fallback: a run with no store row and no usable
      report.md leaves its ticket open and writes no receipt, the behaviour
      ticket_writer.py:119-123 has today.

  - id: forced_close_set_does_not_decide_the_ticket
    kind: parity
    form: test
    source: "20-demands.md (the O2 thesis, stated independently of any arm)"
    binds:
      - "close_case_ticket"
      - "_CUT_SHORT_WITH_A_MODEL_STILL_OWED_A_CLOSE"
      - "interacts(close_case_ticket->ticket_store)"
      - "ticket_store.access[http-transition]"
    discharged_by: test_adding_an_exit_to_the_forced_close_set_cannot_change_what_a_ticket_does
    seed_docstring: >-
