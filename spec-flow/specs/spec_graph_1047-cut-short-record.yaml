# CLAIMS — 42. Ids inherited verbatim. Two transcription rules, applied uniformly:
#   * `verdict` is normalised into schema.md's closed vocabulary {holds, refuted, unrefuted,
#     unprobed, deferred}; the source frontier's own free-text verdict is preserved word-for-word
#     at the head of `observed`, so nothing is lost and nothing is smoothed.
#   * `probe_kind` records the instrument that was ACTUALLY used. Several `behavior` and
#     `reachability` claims were closed on `probe_kind: read`; they are left that way on purpose —
#     `spec-graph claims` is meant to call them, and `50-graph-digest.md` lists them as red flags
#     rather than hiding them behind a comfortable `referential`.
