    - {from: close_case_ticket, to: normalized_truncated_by, mode: invoke, via: api, provenance: design}
      # FORK F-I RESOLVED (§7 round 2, auto; label swept at phase F): the call sits in
      # close_case_ticket's OWN frame — it normalises its own parameter as its first act rather
      # than trusting the caller, which is what makes the fallback arm reachable by design rather
