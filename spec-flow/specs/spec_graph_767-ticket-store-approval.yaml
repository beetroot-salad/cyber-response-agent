  - {id: n8_screen_envelope_binding_out_of_scope, kind: coherence, form: clause,
     stakeholder: operator, binds: [ticket_screen, "ticket_screen.payload"],
     outcome: {nl: "ticket_screen's existing binding of the stub's envelope — tickets, key,
       comments, author — is the stub adapter's own and stays in code, outside O5's scope."},
     note: "downgraded: it scopes o5_no_vendor_literals_in_code rather than adding an observable."}
  - {id: n11_narrative_unconstrained, kind: negative, form: clause, stakeholder: analyst,
     binds: [case_record_to_comment,
             "case_record_to_comment.domain.distinguished[narrative-exactly-the-no-notes-marker]"],
     outcome: {nl: "What the narrative says is not constrained beyond the wire bound and the fence
       strip: it is plain text in one field under the agent's author, and a narrative whose text is
       exactly the no-notes marker is indistinguishable on the wire from an empty one."},
     fork: "FK44, FK51",
     unknown: "whether the design wants any structural boundary a human approver can read against
       (FK44's cheap version is a fixed host-authored prefix line — new mechanism, not a test).",
     note: "downgraded: the testable half is s5_text_cannot_become_a_field."}
  - {id: d7_briefing_rewrite, kind: coherence, form: test, stakeholder: a later run,
     discharged_by: test_767_ticket_skill_md_describes_the_approval_lane,
     binds: [ticket_skill_md],
     settled_premise: 69,
     fork: FK43,
     note: "UPGRADED AT PHASE E from `form: clause`. §7 FK55 split the item in two and kept this
       half IN the suite: SKILL.md is MODEL-FACING prose and D4 makes three of its sentences
       false, so its rewrite is an observable obligation rather than a deferral. FK43 is applied
       in the test — the tag is RELEASE-FOR-READING, not an endorsement of the verdict — and so
       is FK42's meaning sentence (what a person approves is the record AS DISPLAYED, visibly
       truncated when cut). The other half of FK55, `defender/docs/case-history-write-path.md`,
       is deliberately NOT in the suite: it is human-facing architecture prose named by no D-row
       and is a `finalize`-stage concern (probe auth_P9 open). ADDED AT PHASE F (RF-C): that
       backlog item also owns one sentence at `case-history-write-path.md:89` — 'the
       `ticket_write.json` receipt (`{key, status, url, ok}`) is the seam the read PR / offline
       enrichment keys on' — which is VOID after D2, because the consumer it names was #317's
       lane and #922 deleted it. It is the one checked-in statement that contradicts c5's
       zero-readers census (see ticket_write_receipt's payload note), so `finalize` must strike
       it rather than leave a document declaring a contract for a file nothing reads. Extended
       by settled premise 69
       (RF3/g14: the ranges at HEAD are 46-48, 64-67, 76-81; line 78 carries a duplicated
       '`run.py` / `run.py`', and D7's own ranges omit lines 58-60)."}

  # ---- Minted at phase E from §7's own resolutions (70-resolutions.md) -------------------------
  # Three executable demands the human's answers created, one waiver the human accepted, and the
  # eight N-rows the resolutions directed be RECORDED rather than tested. Each names the
  # resolution it comes from; none of them existed at the gate, because each is an answer.
  - {id: d_predicates_fail_closed_by_construction, kind: seam, form: test, stakeholder: a later run,
     minted_from: "70-resolutions.md R1 (FAM-1's downstream consequence)",
     discharged_by: test_767_approval_predicates_cannot_be_built_in_a_serving_state,
     binds: [is_approved, is_agent_comment, case_ticket, case_history_mapping, ticket_screen,
             "case_history_mapping.domain.distinguished[invalid-yaml]",
             "case_history_mapping.domain.distinguished[missing-comment-section]",
             "case_history_mapping.domain.distinguished[missing-approved-section]",
             "case_history_mapping.domain.distinguished[unmigrated-pre-767]",
             "case_history_mapping.domain.distinguished[empty-comment-author]",
             "case_history_mapping.domain.distinguished[approved-label-non-string]",
             "mapping_comment.domain.distinguished[absent]",
             "mapping_comment.domain.distinguished[author-renders-empty]",
             "mapping_approved.domain.distinguished[absent]",
             "mapping_approved.domain.distinguished[non-string]"],
     note: "the R5 judgment hole's `resolved_to`. §7 R1 decided FAM-1 fail-closed on both sides
       AND, along with it, that the predicates must be SAFE BY CONSTRUCTION once it lands: the
       constructor raises in the unsafe state rather than merely behaving when configured right.
       The test carries FK20's read-side extension too — O7 is stated for the WRITE only, so the
       screen degrades (everything unapproved, everything agent-authored, every record KEPT per
       N5) rather than raising into the model's turn or refusing the whole gather call."}
  - {id: d_author_alias_keeps_history_withheld, kind: negative, form: test, stakeholder: a later run,
     minted_from: "70-resolutions.md R4 (FK10, 'pin as a security test')",
     discharged_by: test_767_an_author_rename_does_not_unhide_history,
     binds: [is_agent_comment, mapping_comment, ticket_screen,
             "mapping_comment.domain.alternatives[renamed-comment-author]",
             "is_agent_comment.domain.distinguished[author-renamed-between-runs]"],
     positive_control: o2_approved_serves_latest,
     note: "resolves `mapping_comment.domain.alternatives[renamed-comment-author]`'s
       crosses_validation hole: §7 R4 added `mapping.comment.author_aliases: []`, a list of
       superseded author spellings `is_agent_comment` matches alongside the current identity, so
       an operator's rename does not un-hide an unapproved ticket's old agent comments. This is
       FK10's half that fails OPEN and is O2's exact named failure witness."}
  - {id: d_failed_ticket_read_puts_no_content_in_the_turn, kind: negative, form: test,
     stakeholder: a later run, minted_from: "70-resolutions.md Part 2, FK36",
     discharged_by: test_767_a_failed_ticket_read_puts_no_content_in_the_turn,
     binds: [ticket_screen, "interacts(query_tool->case_history_store).response",
             "interacts(query_tool->ticket_screen).response"],
     positive_control: o2_approved_serves_latest,
     note: "FK36's resolution, exactly as written: assert only what O2 gives — a failed ticket
       read puts NO ticket content into the model's turn or the capture — and leave the error's
       class and the run's fate to the query tool's pre-existing envelope, which this lane
       changes neither of."}
  - {id: w_no_notes_marker_collision, kind: domain-outcome, form: waiver, stakeholder: analyst,
     binds: ["case_record_to_comment.domain.distinguished[narrative-exactly-the-no-notes-marker]"],
     outcome: {nl: "A narrative whose text is exactly the no-notes marker is indistinguishable on
       the wire from an empty one, and nothing in the doc demands they be distinguishable; the
       collision is accepted as a residual rather than tested."},
     cites: [c3],
     note: "§7 Part 3's one accepted waiver candidate (FK51). Same class as FK44 and the same
       answer: S5 — a narrative can look like anything, including host text."}
  - {id: n_hostile_alert_can_elide_a_listing, kind: negative, form: clause,
     stakeholder: a later run,
     binds: [alert_json, payload_view,
             "interacts(open_case_ticket->case_history_store).payload",
             "alert_json.domain.distinguished[oversized-rule-description]",
             "payload_view.domain.distinguished[single-ticket-over-the-ceiling]"],
     outcome: {nl: "N4 and N5 COMPOSE, and the composition is accepted rather than reversed. The
       bridge open carries the alert's `rule.description` into the ticket's summary unbounded
       (N4's examined no), and an unapproved ticket stays visible for correlation (N5's stated
       benefit). One hostile detection-rule description therefore makes its own ticket — and any
       listing that contains it — exceed the whole-payload ceiling the model's view enforces and
       elide entirely, destroying the correlation benefit using attacker-influenced input alone.
       c7 (executed twice) is why the ceiling is whole-payload and not per item, so there is no
       per-ticket exemption to fall back on. This is recorded as an ACCEPTED DENIAL-OF-CORRELATION
       risk: no bound is added to the open, N4's own waiver stands, and N4's revisit trigger — if
       a rule description ever carries event text — is the condition under which it is reopened."},
     cites: [c7],
     note: "§7 R7 (FK47), one of the twelve material decisions the human answered directly: 'accept
       as a known, examined availability risk; no code change; record the composition as an
       accepted denial-of-correlation, not reversed.' Recorded as a row rather than left in the
       resolutions file so the next reader to touch N4 or N5 sees that the pair was examined
       TOGETHER. `adv_PO8` stays in the ledger as an unprobed mechanism claim about where the
       ceiling applies — it is no longer a decision gate, because the decision is made."}
  - {id: n_platform_key_provenance_deferred, kind: behavior, form: clause, stakeholder: operator,
     binds: ["case_history_store.identity", record_case_ticket],
     outcome: {nl: "This spec is scoped to the PLAYGROUND identity: case_id = run_dir.name and
       the own-case exclusion is deps.run_id. On the platform the ticket pre-exists with a
       vendor-minted key, and how the writer or the screen would learn it is deferred and
       unowned — recorded here rather than left implicit, because the platform is the doc's
       stated motive. The key is a PARAMETER of record_case_ticket now (d2_writer_seam), so the
       later change is a call-site edit rather than a re-design."},
     note: "§7 R8 (FK04)."}
  - {id: n_legacy_resolution_is_host_vocabulary, kind: negative, form: clause, stakeholder: analyst,
     binds: [ticket_screen, "interacts(query_tool->ticket_screen).response"],
     outcome: {nl: "A legacy `resolution` written by the pre-#767 close lane is still served by
       list-tickets and get-ticket, and D4 is NOT extended to it: c3 (executed) establishes that
       such a field carries the HOST's cause sentence plus a disposition, never the model's body,
       so screening it would buy nothing and widen ticket_screen's binding to the stub envelope
       N8 deliberately scopes out. The e2e fixture calls POST /admin/reset so no legacy record is
       present in the suite itself."},
     cites: [c3],
     note: "§7 R9 (FK05). The observable half — the field is served untouched — is asserted by
       d0_screen_shape's test; this row is the examined no the doc was missing."}
  - {id: n_killed_run_leaves_an_uncommented_ticket, kind: negative, form: clause,
     stakeholder: analyst, binds: ["drives(run_main->record_case_ticket)", update_ticket_flag],
     outcome: {nl: "A run killed mid-lifecycle leaves an open, uncommented ticket and nothing
       reconciles it; a retried open against the same case_id would 409. O4's witness is scoped
       to a run that COMPLETES its lifecycle, and no record-on-crash mechanism is built."},
     cites: [c8],
     note: "§7 R11 + FK34. The scoping's observable half is o4_run_under_flag_always_comments'
       second arm (a run whose lifecycle raises reaches no post-step)."}
  - {id: n_read_transport_out_of_scope, kind: negative, form: clause, stakeholder: a later run,
     binds: ["interacts(query_tool->case_history_store)"],
     outcome: {nl: "Gather's read-transport behaviour — timeouts, retries, what a hung read costs
       the run — is pre-existing machinery this lane does not touch, and no obligation here binds
       it. Recorded as an examined no rather than left a silence, so it is visibly not this
       change's problem."},
     note: "§7 Part 2, FK37."}
  - {id: n_approver_is_the_whole_control, kind: negative, form: clause, stakeholder: analyst,
     binds: [approver, case_record_to_comment, ticket_screen],
     outcome: {nl: "Text a model read from an unapproved ticket and reproduced in its own record
       carries no provenance label: the approver is the whole control against round-tripped
       content, because the laundering path terminates at a human — the run's own comment lands
       on its own unapproved case. Provenance labelling would be new mechanism with no reader."},
     note: "§7 Part 2, FK45. Its mechanism half is d_two_hop_chain_closed_by_approval's test."}
  - {id: n_comment_author_names_no_human_identity, kind: negative, form: clause,
     stakeholder: operator, binds: [mapping_comment, is_agent_comment],
     outcome: {nl: "The mapping's `comment.author` must name an identity no human account can
       carry. On a vendor that is an account-provisioning fact, not a defender check — defender
       has no directory of human identities to check against, so the broad 'anything not a
       person' reading is unimplementable. The assumption carries O2 and S5 both, and writing it
       down is the whole fix."},
     note: "§7 Part 2, FK46. The empty-identity case is excluded by construction
       (d_predicates_fail_closed_by_construction / FK19)."}
  - {id: n_no_sibling_isolation, kind: negative, form: clause, stakeholder: a later run,
     binds: [ticket_screen, "interacts(query_tool->case_history_store)"],
     outcome: {nl: "No read isolation is offered between a sibling world and its parent's
       in-flight write, and none is needed: whatever a sibling sees is screened by D4
       identically, so O2 holds at every instant. Only completeness is at risk, and precedent is
       advisory."},
     note: "§7 Part 2, FK48."}
  - {id: n_run_dir_captures_out_of_scope, kind: negative, form: clause, stakeholder: a later run,
     binds: [query_capture],
     outcome: {nl: "An old run dir holding a ticket capture written before D4 existed is out of
       scope: O2 binds every read path INTO THE STORE, and a file in a run dir is not one. S3′'s
       'only code' claim is about readers of the store, not about historical artifacts."},
     note: "§7 Part 2, FK50. Probe auth_P3 stays open — if `ticket_reads/` turns out to have a
       writer at HEAD, the model's `cat` grant makes it a live read path and this becomes a
       Tier-1 item rather than a clause."}

structure:
  # The registry. `20-demands.md` coined no axes; the brief's SR1/SR4 key the store on the case and
  # the capture on the run, lead and sequence, and the dispositions' FK02/FK03 turn entirely on the
  # store's own comment ORDER. Every `key_axes` / `interpolates` member below is declared here.
  axes: [case_id, run_id, signature_id, alert_timestamp, comment_author, comment_order,
         lead_id, query_seq]

  actors:
    # --- the legs the design adds or changes ------------------------------------------------
    - {id: record_case_ticket, frame: leg,         provenance: design}  # D2: scripts/case_history/ticket_writer.py::record_case_ticket
    - {id: approver,           frame: leg,         provenance: design}  # the person: D6's route, or the vendor UI (N3)
    - {id: run_main,           frame: composition, provenance: design}  # run.py::main — it FANS the post-steps; R2 places the uniqueness demand here, never on a leg
    - {id: open_case_ticket,   frame: leg,         provenance: design}  # exists (ticket_writer.py:101) but O1/D1 change its payload contract
    - {id: close_case_ticket,  frame: leg,         provenance: design}  # REMOVED by D2's rename — its `mode: remove` edge is R5's trigger
    - {id: query_tool,         frame: leg,         provenance: design}  # runtime/query_tool.py::QueryCapture._execute — D4 attaches at _screen_ticket_payload (r5)
    - {id: forward_check,      frame: leg,         provenance: design}  # learning/author/verify_forward/forward.py — D5 deletes its lane
    # --- the grounded neighborhood (10-brief.md): co-writers, sibling surfaces, consumers -----
    - {id: ticket_adapter,     frame: leg,         provenance: code}    # scripts/adapters/ticket_adapter.py — the UNMOVED reader of the same store (SR1)
    - {id: close_tool,         frame: leg,         provenance: code}    # runtime/close_tool.py — report.md's only writer (c4), always stamps a host `cause` (c3)
    - {id: offline_collectors, frame: composition, provenance: code}    # the collectors joining on executed_queries.jsonl / gather_raw/ (F9)

  boundaries:
    # ===== the store: one resource, three doors ==============================================
    # SR1 unified with 20-demands' `case_history_store`, keyed by role+origin: ONE host and one
    # route set, reached over three vias that differ only by HTTP method and by which transport
    # function is called. Modelling it once is what lets R3 ask the parity question g2/RF4
    # answers `no` to.
    - id: case_history_store
      provenance: design
      facets:
        payload:
          parts:
            - {role: open,     source: template:MAPPING_OPEN,     slots: {summary: alert_json, labels: mapping_open, signature: alert_json}}
            - {role: comment,  source: template:MAPPING_COMMENT,  slots: {author: mapping_comment, body: case_record_to_comment}}
            - {role: approval, source: template:MAPPING_APPROVED, slots: {label: mapping_approved}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the three things that cross to the store: the bridge open (the mapping's whole `open:` section, unfiltered — g7), the agent's comment (`{author, body}` and nothing else — S1), and a person's approved label. `roles-disjoint-sources` is load-bearing here and not decorative: r6 records that the `close:` section D1 deletes already spends a `comment:` key, so `comment` and `approval` must resolve through DIFFERENT mapping sections or the writer binds the wrong one (FK27 / 20-demands F5)"
        access:
          constraints_by_via:
            adapter-http:    {trust: attacker-influenced, constraints: [confine-read-endpoint, guard-outbound-capture-record]}
            host-curl:       {trust: operator, constraints: []}
            operator-labels: {trust: operator, constraints: unknown}
          nl: "the model's door is the adapter's `http_get`/`http_get_obj` → `_request:360` → `guard_outbound` → `confine_read_endpoint`, whose `ticket` entry is GET-only (SR6, c2). The host writer's door is `ticket_writer._request` calling `transport.docker_exec_curl` DIRECTLY (ticket_writer.py:62-77) — it reaches `guard_outbound` at neither call site, so its POSTs are confined by nothing and, because `guard_outbound` IS the capture recorder, recorded by nothing either (g2, F3, RF4). D6's operator route inherits that same bypass, and its own policy is undecided (FK38, FK39)"
        identity:
          key_axes: [case_id]
          evidence: {nl: "the writer keys every call on `case_id`, and on the playground `case_id = run_dir.name` — read off ticket_writer.py:101/:126 and run.py:531/:576 (c1, r1, r3). `POST /tickets` 409s on a duplicate key and `POST /tickets/{key}/comments` appends uncapped (c8), which is why `sharing` is the append one. FK04 is the fork this evidence cannot close: the doc's stated motive is a platform where the ticket PRE-EXISTS with a vendor-minted key, and neither the writer's `run_dir.name` nor the screen's `deps.run_id` can learn one"}
          derivations: [{value: case_id, fn_of: run_id, injective: true}]
          sharing: serialized-append
    # The playground server's own route set — a DIFFERENT origin from the seam above, and a
    # different artifact to fix. D6 adds a route here and a via there.
    - id: ticket_stub
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the routes `playground-v2/ticket-server/app.py` serves. At HEAD: GET /health, GET /tickets, GET /tickets/{key}, POST /tickets, POST /tickets/{key}/transitions, POST /tickets/{key}/comments, POST /admin/reset — no label-edit route of any kind and no PATCH/PUT handler, so those are 405 by absence (g1, c8). D6 adds `POST /tickets/{key}/labels`"}
          default: unknown   # FK38/FK39: D6 names the route and its purpose and no error behaviour at all
          distinguished: [existing-ticket, unknown-ticket-key, duplicate-label]
          falsy_valid: false
          documented_alternatives: []

    # ===== the mapping config, and the three sections the demands bind =======================
    - id: case_history_mapping
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`knowledge/environment/systems/case-history/mapping.yaml`, resolved by `case_ticket._mapping_path:80-83` from `$DEFENDER_DIR` or `Path(__file__).parents[2]`. The sole loader is `_load_mapping:86-100` and at HEAD it validates existence, YAML syntax and dict-ness ONLY — g6: NO content refusal exists to extend, so D1's refusal is entirely new mechanism. `$DEFENDER_DIR` is the seam a hostile-mapping control drives through and it already works (g15)"}
          default: "the checked-in file: source/open/close/annotate/enrich, `reporter: defender`, `close.author: defender`, `close.comment` (c15, r6)"
          distinguished: [shipped-default, non-dict, invalid-yaml, missing-comment-section,
                          missing-approved-section, unmigrated-pre-767, retains-close-section,
                          empty-comment-author, approved-label-non-string,
                          open-labels-can-render-approved]
          falsy_valid: false
          documented_alternatives: []
    - id: mapping_open
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the `open:` section. g7: `alert_to_open_payload:205` hands the WHOLE section to `_render` and every key under it becomes an outbound field, filtered only for labels that render down to a bare literal prefix (:206-208). That is why FAM-2's scope question is load-bearing — a refusal pinned to two named templates is a guard over a fixed subset of an open set"}
          default: "`sig:{rule.id}` and `evt:{timestamp}` label templates, plus status/summary/description/reporter"
          distinguished: [sig-template, evt-template, operator-added-label-template]
          falsy_valid: false
          documented_alternatives: []
    - id: mapping_comment
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "D1's NEW top-level `comment: {author, body}` section. It is a different element from `close.comment`, which r6 records as already existing inside the section D1 deletes and which has no reader after D5 — the writer binds the top-level keys EXPLICITLY, never by search (FK27 / 20-demands F5)"}
          default: unknown   # FAM-1: the doc never says what the writer does when the section cannot supply the identity
          distinguished: [absent, author-renders-empty]   # a comment's OWN author shapes (authorless, a third identity) are is_agent_comment's members, not this section's
          falsy_valid: false
          documented_alternatives:
            - {value: renamed-comment-author, crosses_validation: unknown}
    - id: mapping_approved
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "D1's NEW `approved: {label}` section — the one vendor spelling the whole design routes through. O5 puts it here precisely so an operator can change it with no code edit; FK10 is the judge's finding that the same invitation, applied to `comment.author`, fails OPEN"}
          default: unknown   # the design never names the tag's literal spelling, and the mapping at HEAD has no `approved:` section (r6/g6) — there is no value to read off the resource
          distinguished: [absent, non-string, differently-spelled-tag]
          falsy_valid: false
          documented_alternatives:
            - {value: renamed-approved-label, crosses_validation: unknown}

    # ===== the two mapper predicates D4 introduces ===========================================
    - id: is_approved
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`is_approved(ticket)` — true iff the ticket's labels carry the mapping's approved label. Two things the doc does not settle: the MATCH's tolerance (exact, whitespace-trimmed, case-folded, unicode-normalised — FK22) and the value on a ticket the predicate cannot decide about (FAM-1). Fail-open here serves every agent comment in the store to a model, which is O2's exact named failure mode"}
          default: unknown   # FAM-1 (FK11, FK14, FK17): undecided, and the direction is a security decision
          distinguished: [no-labels-field, tag-spelled-differently, approved-section-missing,
                          undecidable-record-in-a-listing]
          falsy_valid: true
          documented_alternatives: []
    - id: is_agent_comment
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "`is_agent_comment(comment)` — keyed on the author field the mapping names (O3, S5: author is a field, not text). FK15 is the family's sharpest instance: the two escalation copies use the words 'fail closed' and 'safe' for OPPOSITE behaviours, so the phrase must never appear unqualified in this test's docstring"}
          default: unknown   # FAM-1 (FK15, FK16, FK23) + FK10's author-rename direction, which fails OPEN
          distinguished: [authorless-comment, third-identity-author, author-renamed-between-runs,
                          comments-not-a-list]
          falsy_valid: true
          documented_alternatives: []

    # ===== the read path: the screen, the capture, the view =================================
    - id: ticket_screen
      provenance: design
      facets:
        payload:
          parts:
            - {role: envelope, source: const:STUB_TICKET_ENVELOPE}
            - {role: screen,   source: template:PER_TICKET_SCREEN, slots: {approved: is_approved, agent: is_agent_comment, store: case_history_store}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the screen returns the envelope it received — `screen_list`'s `{**payload, 'tickets': kept, 'total': len(kept)}` and `screen_get`'s `(payload, 0, '')` — with each surviving ticket's `comments` rewritten IN PLACE and no field added, removed or annotated anywhere else (D4's no-marker rule). The envelope half (`tickets`, `key`, `comments`, `author`) is the stub adapter's own binding and stays in code (N8)"
        access:
          constraints_by_via:
            list-tickets: {trust: attacker-influenced, constraints: [own-case-exclusion, drop-agent-comments-when-unapproved, keep-only-latest-agent-comment-when-approved, no-marker]}
            get-ticket:   {trust: attacker-influenced, constraints: [own-case-exclusion, drop-agent-comments-when-unapproved, keep-only-latest-agent-comment-when-approved, no-marker]}
          nl: "the same per-ticket step on both verbs, applied AFTER the own-case exclusion in both (c6, r5: `_screen_ticket_payload` dispatches TICKET_GET to `screen_get` and TICKET_LIST to `screen_list`). Per-cell discharge is the point — a constraint pinned on one verb and silently absent on the other is the canonical fail-open R3 exists for"
    - id: query_capture
      provenance: code
      facets:
        identity:
          key_axes: [run_id, lead_id, query_seq]
