base: a77335d5          # main. write-code-from-spec's gate diffs against it.

# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. The host stops closing tickets and starts RECORDING into them: `close_case_ticket`
# becomes `record_case_ticket`, one `POST /tickets/{key}/comments` and no transition (D2); the
# comment body is `"{disposition} — {cause}\n\n{narrative}"` rendered by a new
# `case_record_to_comment` off a `CaseRecord` that splits `reason` into a host `cause` and the
# report's `narrative` (D3); a person marks a case approved with a mapping-configured label
# (D6's new stub route, or the vendor UI); and a later run's gather sees agent-authored comments
# ONLY from approved cases, through a new per-ticket step in `ticket_screen` that `query_tool`
# applies on `list-tickets` and `get-ticket` after the own-case exclusion (D4). The mapping gains
# `comment: {author, body}` and `approved: {label}` and loses `close`/`annotate`/`enrich`, with a
# loader that refuses a mapping whose `open.labels` template can render the approved label (D1);
# the dead `resolution`-decoding lane — `verify_forward`'s subprocess reader and nine
# `case_ticket` symbols — is deleted, closing the second model-facing read path structurally (D5).
# D7 rewrites `skills/ticket/SKILL.md`; D8 re-pins O6 on the REAL program set.
#
# WHAT PHASE D DID, AND WHAT IT DELIBERATELY DID NOT DO.
#
# WHAT PHASE E DID TO THIS FILE (step 8, the author leaf). §7 RAN, and
# `.spec-flow/frontiers/70-resolutions.md` IS THE AUTHORITY for every fork this file still
# carries a `fork:`/`unknown:` tag for. Those tags are kept as the HISTORICAL record of what
# was open at the gate — they are NOT live questions any more, and the resolution each one
# received is applied in the named test's assertions and restated in its docstring (which is
# what check_binds reads). Phase E did not rewrite them in place because the resolutions file
# is the durable record and a second, paraphrased copy here would be the join-breaker this
# graph's own name-reconciliation rule exists to prevent. Phase E DID:
#   * point every `discharged_by` at a real test function (all 58 exist; the names were already
#     correct, so none moved);
#   * flip `d7_briefing_rewrite` from `form: clause` to `form: test` — §7 FK55 keeps SKILL.md's
#     rewrite IN the suite (its sibling, `defender/docs/case-history-write-path.md`, stays a
#     `finalize`-stage concern and is deliberately NOT in the suite);
#   * mint THREE new executable demands the resolutions created —
#     `d_predicates_fail_closed_by_construction` (§7 R1's safe-by-construction consequence, the
#     R5 judgment hole's `resolved_to`), `d_author_alias_keeps_history_withheld` (§7 R4/FK10's
#     "pin as a security test") and `d_failed_ticket_read_puts_no_content_in_the_turn` (FK36);
#   * mint the ONE waiver §7 accepted (FK51) and the EIGHT N-row clauses the resolutions
#     directed be recorded (FK04, FK05, FK34, FK37, FK45, FK46, FK48, FK50).
#
# WHAT PHASE F REPAIRED (the reconciler's five conservation gaps, `.spec-flow/frontiers/
# 92-reconciliation.md`; the fixes themselves are in 93-reconciliation-fixes.md). None of them
# reopened a decision — each landed something §7 had already decided but that no row carried:
#   * RF-A — §7 R7 (FK47) was the NINTH "record it" instruction of the same shape as the eight
#     clauses above, and the only material decision with no landing. Minted the clause
#     `n_hostile_alert_can_elide_a_listing`; gave the R4 hole on
#     `alert_json.domain.distinguished[oversized-rule-description]` its `resolution`/`resolved_to`;
#     struck "probe adv_PO8 before deciding" from `n4_open_alert_fields_unbounded`'s `unknown`.
#   * RF-B — §7 R6's "a failed open does not suppress the record" was to be PINNED AS A TEST and
#     nothing in the suite made an open fail. Added the arm to
#     `test_767_run_under_flag_leaves_an_agent_comment`; FK32/FK33 dropped from
#     `o4_run_under_flag_always_comments`'s `unknown`.
#   * RF-C — phase A's one `no-consequence` tag (F2, the receipt) carries three decisions;
#     re-tagged on `ticket_write_receipt`'s payload note, with D7's backlog half recording that
#     `case-history-write-path.md`'s receipt-is-a-seam sentence is void after D2.
#   * RF-D — `auth_P9` widened back to RFA3's tree-wide census, with the six files in
#     `handoff.deferred` as a stated cost for write-code-from-spec.
#   * RF-E — `handoff.forks`' blanket "ALL 57 ENTRIES ARE UNRESOLVED" header replaced; the three
#     entries phase F gave a row (FK32, FK33, FK47) carry a "→ landed" note. The other 54 are
#     deliberately untouched — rewriting them is the join-break phase E correctly declined.
#
#   1. [AS PHASE D LEFT IT — superseded by the phase-E block above, which says where the
#      answers now live.] THE 55 NON-CONSENSUS PREMISES ARE UNRESOLVED HERE. `45-dispositions.md`
#      dispositioned 71 premises: 16 settled, 35 forks, 20 silent branches, 0 drops. The human seam
#      (§7) runs AFTER the gate. This file represents the 55 the way the dispositions record them —
#      as structure whose cells no demand answers (an `is_approved` whose default on an undecidable
#      ticket is `unknown`, an `access[operator-labels]` whose constraints are `unknown`, a
#      `documented_alternatives` entry whose `crosses_validation` is `unknown`), as `fork:`/
#      `unknown:` annotations on the demands whose ASSERTED VALUE moves, and as `handoff.forks`
#      entries (all 57: FK01–FK55 plus FK-X1, FK-X2). NO READING WAS PICKED. An unanswered
#      R0/R3/R4 cell below is a fork made mechanical, not an oversight.
#
#   2. PHASE D MINTED 16 DEMANDS. Fourteen carry settled-premise assertions no inherited demand
#      held (`d_*` ids, each tagged with its premise number); two are the follow-up premises
#      `45-dispositions.md` routed "before phase D" — `d_loader_refusal_positive_control` (without
#      it `o1_loader_refuses_approved_label` passes against a loader that refuses everything) and
#      the clause `n6_approve_action_is_unattributable_on_the_playground`. Premise 69 was folded
#      into the existing `d7_briefing_rewrite` (its coverage must include SKILL.md lines 58–60, the
#      one sentence D4 falsifies and D7's own ranges omit — RF3/g14). Premise 67 is the single
#      `handoff.drops` entry, with its reason.
#
#   3. NAME RECONCILIATION across the three coining passes (grounding, demand extraction, the
#      dispositions' address derivations):
#      * The brief's SR1 "ticket store HTTP surface (`case-history` / `ticket`)" and the demands'
#        `case_history_store` are ONE boundary, keyed by role+origin: one host, one route set,
#        reached over three vias that differ only by HTTP method and by which transport function
#        is called. Modelling it once is what lets R3 ask the parity question g2/RF4 answers `no`
#        to — the host writer's `docker_exec_curl` door meets neither `guard_outbound`'s
#        confinement nor its capture recorder, while the adapter's door meets both.
#      * `ticket_stub` (the playground server's own route set, `playground-v2/ticket-server/app.py`)
#        stays DISTINCT from `case_history_store` (the seam defender crosses). Different origin,
#        different artifact to fix; D6 adds a route to the first and a via to the second.
#      * The brief coins no boundary ids of its own — SR1–SR9 are resource sections. Each maps:
#        SR1→`case_history_store`+`ticket_stub`, SR2→`case_history_mapping`(+`mapping_open`,
#        `mapping_comment`, `mapping_approved`), SR3→`report_md`/`CaseRecord`/`read_case_record`/
#        `alert_json`, SR4→`ticket_screen`/`query_capture`/`payload_view`, SR5→`verb_grants`,
#        SR6→`confinement_allowlist`, SR7→`bash_program_set`, SR8→`vulture_baseline`,
#        SR9→`ticket_writer_seam`+`TicketWriterDeps`.
#      * `case_ticket` is ONE element (the mapper module) — the loader, the renderers and D4's two
#        predicates all live in it. It is NOT modelled a second time as an actor: two names for
#        one module is the join-breaker the registry exists to prevent. The predicates
#        `is_approved` / `is_agent_comment` ARE separate boundaries, because O5/D4 give them their
#        own contract and `d4_predicates_in_mapper` binds them.
#      * `case_id` and `run_id` are BOTH axes and are deliberately not collapsed. On the playground
#        `case_id == run_dir.name == run_id` (c1/r1) and the store's identity facet records that as
#        an injective derivation; FK04 is the fork that asks whether the equality survives the
#        platform, and PR1 is the probe that asks whether a sibling world's `run_id` is its
#        parent's. Collapsing them would erase both questions.
#      * `20-demands.md`'s F5 / the dispositions' FK27 — the `comment` id collision — is carried,
#        not papered over: `mapping_comment` is the NEW top-level section, and `close.comment`
#        (which r6 records as already existing inside the section D1 deletes) is a different
#        element with no reader after D5. The store's payload facet gives them disjoint sources so
#        `roles-disjoint-sources` is the invariant that would catch a writer binding the wrong one.
#
#   4. CHANGE KINDS ARE FROM THE DESIGN, NOT FROM A DIFF — there is no code diff; this is a
#      pre-implementation run. `provenance: design` marks every element or edge the design adds or
#      modifies (the delta the rules scope on); `provenance: code` marks the grounded neighborhood
#      it attaches to. Removals are `mode: remove` edges (R5's own trigger): `close_case_ticket`'s
#      transition write, `forward_check`'s cross-process read, the mapping's `close`/`annotate`/
#      `enrich` sections, and `cited_covering_policy`.
#
#   5. THE GATE RECORD IS NOT HERE. `gate:` is the gate leaf's (phase D, step 6). This file is the
#      address space it computes over.
#
# SETTLED-PREMISE MAP (the premise→demand edge phase F reconciles; 16 settled, 1 dropped).
#   P5  →d_failed_write_leaves_no_capture_record      P6  →d_receipt_io_failure_warns
#   P16 →d_non_dict_mapping_refused_first             P39 →d_approved_ticket_without_agent_comment_unchanged
#   P40 →d_each_query_screened_at_call_time           P41 →d_capture_not_retroactively_scrubbed
#   P43 →d_sibling_world_reads_through_the_same_screen (PR1 open)
#   P44 →d_archived_world_carries_only_screened_capture
#   P49 →d_capture_carries_the_screened_payload       P52 →d_first_fence_wins
#   P54 →d_host_shaped_narrative_line_carried_verbatim
#   P61 →d_two_hop_chain_closed_by_approval           P67 →handoff.drops (no demand; RF2 is the live issue)
#   P68 →d_checked_in_censuses_move_together          P69 →d7_briefing_rewrite (extended, RF3/g14)
#   P70 →d_approved_label_is_served_to_the_model
#   follow-ups →d_loader_refusal_positive_control (FK-X1), n6_approve_action_is_unattributable_on_the_playground (FK-X2)
# ===========================================================================================

demands:
  # ---- Demand #0 — the return-value contract (20-demands.md, provisional on four forks) -------
  - {id: d0_record_return, kind: behavior, form: test, stakeholder: operator,
     discharged_by: test_767_record_case_ticket_returns_and_receipts,
     binds: [record_case_ticket, "interacts(record_case_ticket->case_history_store).response",
             ticket_write_receipt, "interacts(record_case_ticket->ticket_write_receipt).payload"],
     fork: FK29, unknown: "the receipt's success `status` word — `\"closed\"` (r1, today's literal)
       vs `\"commented\"`; 20-demands F1, judged under FK29. The failure branch IS written (r1/c14
       refute copy2's reading, RFJ3)."}
  - {id: d0_comment_render, kind: shape, form: test, stakeholder: analyst,
     discharged_by: test_767_case_record_to_comment_shape,
     binds: [case_record_to_comment, "interacts(record_case_ticket->case_history_store).payload",
             mapping_comment],
     fork: "FK01, FK06", unknown: "what `(no notes)` replaces (20-demands F2 — the narrative
       segment or the whole `\\n\\n{narrative}` tail) and what an EMPTY report renders (FK06);
       both move the whole asserted body string."}
  - {id: d0_screen_shape, kind: behavior, form: test, stakeholder: a later run,
     discharged_by: test_767_screen_ticket_comment_shape,
     binds: [ticket_screen, "interacts(query_tool->ticket_screen).response",
             "interacts(query_tool->ticket_screen).payload"],
     fork: "FK02, FK05, FK14, FK16", unknown: "which agent comment is `the latest` (FK02), whether
       `every other field untouched` survives a legacy `resolution` field (FK05), and what the
       envelope is on a ticket with no `labels` key or a malformed `comments` field (FAM-1)."}

  # ---- O1 — the disposition and the tag are a person's ---------------------------------------
  - {id: o1_open_payload_status_open, kind: shape, form: test, stakeholder: analyst,
     discharged_by: test_767_open_payload_status_and_labels,
     binds: ["interacts(open_case_ticket->case_history_store).payload", mapping_open,
             mapping_approved]}
  - {id: o1_no_host_verdict_write, kind: negative, form: test, stakeholder: analyst,
     discharged_by: test_767_no_host_payload_sets_verdict,
     binds: ["interacts(open_case_ticket->case_history_store).payload",
             "interacts(record_case_ticket->case_history_store).payload", mapping_approved],
     positive_control: o1_open_payload_status_open,
     note: "census: exactly two POST sites in the writer after D2 (c1, r3, S1)."}
  - {id: o1_loader_refuses_approved_label, kind: domain-outcome, form: test, stakeholder: operator,
     discharged_by: test_767_mapping_loader_refuses_approved_label_template,
     binds: [case_history_mapping, mapping_open, mapping_approved,
             "case_history_mapping.domain.distinguished[open-labels-can-render-approved]",
             "mapping_open.domain.distinguished[sig-template]",
             "mapping_open.domain.distinguished[evt-template]",
             "mapping_open.domain.distinguished[operator-added-label-template]"],
     positive_control: d_loader_refusal_positive_control,
     fork: "FAM-2 (FK24, FK25, FK26, FK27)",
     unknown: "how wide the refusal is — one template, two, or every label-producing key under
       `open:`. g7 is why it matters: `alert_to_open_payload` ships the WHOLE section unfiltered."}

  # ---- O2 / S3 / S3′ — agent text only from approved cases -----------------------------------
  - {id: o2_unapproved_no_agent_comment, kind: negative, form: test, stakeholder: a later run,
     discharged_by: test_767_unapproved_ticket_serves_no_agent_comment,
     binds: [ticket_screen, "interacts(query_tool->ticket_screen).response", is_agent_comment,
             is_approved, "ticket_screen.access[list-tickets]", "ticket_screen.access[get-ticket]"],
     positive_control: o2_approved_serves_latest,
     fork: "FAM-1, FK10, FK22",
     unknown: "the adversarial control's expected outcome under a confusable tag (FK22) and under
       an author-spelling change (FK10 — the author half fails OPEN and is O2's exact witness)."}
  - {id: o2_approved_serves_latest, kind: behavior, form: test, stakeholder: a later run,
     discharged_by: test_767_approved_ticket_serves_latest_agent_comment,
     binds: [ticket_screen, is_approved, is_agent_comment],
     fork: "FK02, FK03", unknown: "which of two agent comments survives (store list order vs a
       `created` sort), and the tie-break when `created` collides."}
  - {id: o2_both_verbs_screened, kind: parity, form: test, stakeholder: a later run,
     discharged_by: test_767_approval_screen_applies_on_both_ticket_verbs,
     binds: [ticket_screen, query_tool, "interacts(query_tool->case_history_store)",
             "ticket_screen.access[list-tickets]", "ticket_screen.access[get-ticket]"],
     note: "per-cell binding added at phase D: R3's discharge is per (constraint × via), never
       facet-wide — a constraint pinned on `list-tickets` and silently absent on `get-ticket` is
       the canonical fail-open this demand exists for."}
  - {id: s3p_single_model_facing_reader, kind: negative, form: test, stakeholder: a later run,
     discharged_by: test_767_query_tool_is_only_ticket_reader,
     binds: [query_tool, ticket_screen, cited_covering_policy, forward_check,
             "interacts(forward_check->case_history_store)"],
     positive_control: o2_approved_serves_latest,
     note: "census demand over c5/c13. RFJ5: O2's own text ('on every read path into the store,
       not only the query tool's') already DECIDES the second-consumer question (FK49); this
       demand is the census that pins the population at one."}

  # ---- O3 — attributable writes ---------------------------------------------------------------
  - {id: o3_comment_author_identity, kind: shape, form: test, stakeholder: analyst,
     discharged_by: test_767_comment_carries_mapping_author,
     binds: ["interacts(record_case_ticket->case_history_store).payload", mapping_comment,
             is_agent_comment],
     fork: "FAM-1 (FK12, FK19), FK46",
     unknown: "what the writer does when the mapping cannot supply the identity (missing section,
       empty render) and whether the configured identity must be provably not a person's."}

  # ---- O4 — what a person needs to approve ----------------------------------------------------
  - {id: o4_first_line_disposition, kind: behavior, form: test, stakeholder: analyst,
     discharged_by: test_767_comment_first_line_is_proposed_disposition,
     binds: [case_record_to_comment, "interacts(record_case_ticket->case_history_store).payload"]}
  - {id: o4_run_under_flag_always_comments, kind: behavior, form: test, stakeholder: analyst,
     discharged_by: test_767_run_under_flag_leaves_an_agent_comment,
     binds: ["drives(run_main->record_case_ticket)", "drives(run_main->open_case_ticket)",
             update_ticket_flag,
             "interacts(record_case_ticket->case_history_store)",
             "interacts(open_case_ticket->case_history_store)",
             "interacts(open_case_ticket->case_history_store).payload"],
     fork: "FK09, FK32, FK34",
     unknown: "the precondition's scope — `a run under the flag with a reachable store` or
       `… that COMPLETES its lifecycle`. FK09/FK34 are the live half; FK32 and FK33 are CLOSED
       (§7 R6) and now exercised: the test's third part fails the open two ways — a 409 on the
       create and a raising transport — and asserts the comment POST still fires against the
       same key.",
     note: "PHASE F (RF-B): the independence of the two post-steps was decided at §7 R6 and
       'pinned as a test', but nothing in the suite made an open fail, so `if the open worked:
       record(...)` — or a short circuit on the 409 the real stub answers for a duplicate key
       (c8) — greened the whole suite while making the PLATFORM path, where the ticket
       pre-exists and there is no open at all, unreachable. The arm added here is driven at the
       writer's `TicketWriterDeps` seam, because `run.py`'s `ticket_writer=` seam is a fake that
       cannot reach a store."}
  - {id: o4_unreadable_report_records_the_fact, kind: domain-outcome, form: test,
     stakeholder: analyst,
     discharged_by: test_767_unreadable_report_still_comments,
     binds: [record_case_ticket, report_md, case_record_to_comment,
             "report_md.domain.distinguished[unreadable]",
             "report_md.domain.distinguished[empty]",
             "report_md.domain.distinguished[no-parsable-disposition]"],
     fork: FK06, unknown: "which of the three members takes the unreadable branch, and whether
       `(unreadable)` is a literal at all (the doc says `a host sentence saying so`)."}
  - {id: o4_narrative_is_report_body, kind: behavior, form: test, stakeholder: analyst,
     discharged_by: test_767_narrative_is_the_fence_stripped_report_body,
     binds: [CaseRecord, report_md, case_record_to_comment, "CaseRecord.payload"],
     fork: FK01, unknown: "`carried verbatim up to the wire bound` — under a surviving 472-char
       `_TICKET_REASON_MAX` (r2) the report body is two sentences and the 4096 bound never fires."}

  # ---- O5 — vendor spellings live in the mapping ----------------------------------------------
