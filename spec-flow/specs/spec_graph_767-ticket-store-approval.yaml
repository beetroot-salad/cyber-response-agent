  # true when the gate ran, not a live state — the entries are deliberately NOT rewritten in
  # place, for the same reason `handoff.deviations` gives for the `fork:`/`unknown:` tags: a
  # second, paraphrased copy of the resolutions here is the join-breaker this graph's own
  # name-reconciliation rule exists to prevent. Three entries carry a "→ landed" note because
  # phase F gave them a row that did not exist before (FK32/FK33, FK47); the other 54 are read
  # through 70-resolutions.md, which says what each was decided to be.
