  - id: a_gap_row_pays_by_naming_a_source_or_a_capability
    kind: domain-outcome
    form: test
    source: "J1 resolved HUMAN at §7 round 2 (neither candidate the design offered), WIDENED HUMAN at §7 round 4 to cover an unavailable capability"
    binds:
      - '_DISPOSITION_GATES.domain.distinguished[inconclusive]'
      - 'ceiling_test.domain.distinguished[host-without-data-source]'
      - 'ceiling_test.domain.distinguished[data-source-without-host]'
      - 'ceiling_test.domain.distinguished[capability-without-data-source]'
      - 'interacts(decide_write->investigation_md)'
      - 'interacts(close_investigation->investigation_md)'
    discharged_by: test_a_bare_host_row_does_not_pay_where_a_source_row_and_a_capability_row_do
    seed_docstring: >-
      A row pays when it names an unretrieved DATA SOURCE or an unavailable CAPABILITY; a host
      is permitted but never required. A row naming a host and neither does NOT pay — it states
      something, so the rejected weaker predicate accepts it, and it names no check anyone can
      go make. A row naming a source and no host DOES pay: that class, no system in this
      deployment exposes the predicate, has no host to name and is the finding the issue exists
      to surface. A row naming a capability the run did not have and no source at all DOES pay
      too: the issue's own framing is capability-shaped, and the one shipped escalation-shaped
      close states its gap that way in its own prose (a sandbox it could not detonate in). All
      three directions are asserted at BOTH collection sites, because a predicate that drifts
      between the write gate and the close reopens the bypass the two-boundary collection
      closed; the bare-host row is what keeps the widened predicate falsifiable.
    rejected:
      - {nl: "`row-states-something`, M1's own words — strictly weaker; a host-only row pays it."}
      - {nl: "`row-names-host-and-data-source`, O1's words and the judge's recommendation — it refuses the deployment-wide gap, which is the finding class the issue exists to produce."}
      - {nl: "keeping the predicate at DATA SOURCE alone and relabelling the escalation fixture's missing sandbox as an unretrieved data source (§7 round 4). It forces a real case into a shape that does not fit, which is how a rule starts collecting compliant rows that mislead — and it made the fixture repair AUTHOR a claim a human had to vouch for, where the widened predicate lets it lift a sentence the document already wrote."}
    note: >-
      WIDENED AT §7 ROUND 4 (human). The accepted cost: `capability` is the looser of the two
      words, and it stays falsifiable only because `host-without-data-source` remains a refused
      input in the same test — a build that reads any sentence about a limitation as a
      capability claim pays for `web-1 could not be fully checked` and fails there. Executed
      against a scratch build of both predicates: the settled one passes, and the rejected
      `_row_states_something` one leaves the bare-host row unrefused at both boundaries, in the
      unit test and on both shipped documents.

  - id: a_confusable_empty_marker_does_not_pay
