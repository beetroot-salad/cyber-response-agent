    seed_docstring: >-
      A shipped document concluding `inconclusive` PAYS the entry price at BOTH boundaries, and
      what makes it pay is J1's settled predicate as §7 round 4 widened it — a row naming an
      unretrieved DATA SOURCE or an unavailable CAPABILITY — collected through the real gate
      and never through a predicate the test owns. Two cheap repairs are forbidden by the
      shape: re-concluding under an unpriced keyword fails the NAMED census (the documents that
      conclude the priced keyword are listed, so one leaving fails here instead of quietly
      leaving a filter), and satisfying the gate with a row that merely states something fails
      the mutation control (the same document, its gap rows replaced by a row naming a host and
      neither a source nor a capability, must be REFUSED at both boundaries; BOTH paying
