    rejected:
      - {nl: "keying the branch on `forced` — every model-authored `inconclusive` close would newly spend a live review, an unrequested change to the common path arriving disguised as a bug fix."}
      - {nl: "`disposition in {...} or forced:` — the disjunction. It preserves the common path AND passes a suite that only ever pairs `forced=True` with the verdict that also skips by name, and it lets the host commit ANY verdict unreviewed. Rejected implicitly by J4 and made observable at §7 round 4."}
    note: >-
      REPAIRED AT §7 ROUND 4 ON BOTH HALVES — the human's resolution had reached this demand as
      a note twice, and phase F executed the counterexample: a build reading
      `if disposition in {"inconclusive", "unresolved"} or forced:` passed the ENTIRE suite,
