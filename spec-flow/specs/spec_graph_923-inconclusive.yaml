schema_version: 2
design: "923"   # gh issue #923. THE AUTHORITATIVE TEXT IS THREE COMMENTS READ IN ORDER: the
                # intent+design doc, the "Correction — the design doc above is refuted on its
                # producer census" comment (R1-R7), and the "Design revision — corrections
                # folded, forks resolved" comment, which SUPERSEDES the affected parts of the
                # first. Read with `gh issue view 923 --comments`. The body's own §1/§2 are out
                # of scope (N3); this spec covers §3 + §4 only.
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`).
                        # check_binds scans its docstrings; every `discharged_by` below names a
                        # test that does not exist yet — the expected phase-D state.
base: b8a63e66          # main. write-code-from-spec's gate diffs against it.

# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE, as the design revision leaves it. Six mechanisms, six obligations, eight
# non-obligations:
#
#   M1  an `inconclusive` row in `_DISPOSITION_GATES` (_gating.py:224), priced.       (O1,O4)
#   M2  a FIFTH `disposition` enum member, `unresolved`, appended last (F1). FIVE producer
#       sites move onto it — challenge_gate.py:399/410/416 (the three overrules),
#       challenge_gate.py:311 `_fail` (SIX call sites — :470/473 the projector, :511/516 the
#       lens loop, :529/534 the composer; R1's 'seven' counted the definition line, and C16
#       already carried the right answer — CAUSE_REVIEW_INCOMPLETE, the
#       FOURTH forced cause), driver/__init__.py:301 (retry exhaustion) — PLUS the
#       no-review bypass at close_tool.py:414, which must stop keying on the literal
#       `"inconclusive"`.                                                          (O2,O3,O5)
#   M3  `unresolved` joins `UNTRAINED_DISPOSITIONS` (directions.py:174).                 (O5)
#   M4  ordering: nothing to reorder. The price is collected at close_tool.py:390, ahead
#       of every disposition branch and ahead of the review.                             (O1)
#   M5  NEW (F2). The close tool REFUSES `unresolved` as a model-supplied argument.      (O6)
#   M6  NEW (R6). Three previously uncensused surfaces are in scope: visualize_runtime.py:339
#       (`UNREVIEWED_DISPOSITION`), _artifact_schema.py:150-159 (a THIRD disposition
#       validation boundary), and two hand-enumerated model-facing prompt rosters
#       (defender/SKILL.md:485-508 and its :522 sentence, skills/invlang/SKILL.md:416).
#   M7  NEW (§7 round 4, a HUMAN DESIGN CHANGE taken during the spec phase). A MALFORMED
#       VERDICT IS NEVER COERCED. On WRITE both gates refuse with retry text — already the
#       shipped behaviour, and each gate carries a comment saying it deliberately does not use
#       the forgiving reader. On READ the shared reader stops coercing and stops substituting a
#       placeholder: the run is marked MALFORMED and left for human judgement. In training
#       routing, "unknown verdict" and "deliberately untrained" become DISTINCT states.
#       It CHANGES SHIPPED READ-PATH BEHAVIOUR; see the three demands minted for it and the
#       deviation recorded in `handoff.deviations`.
#
#   M1 AND M2 ARE ONE COMMIT (F4/R3). The price gate at close_tool.py:390 carries NO
#   `forced` exemption and none is added, so M1 alone refuses the framework's own
#   retry-exhaustion close, which writes no report.md, which dead-letters the run at persist.
#
# WHY THIS SPEC IS SHAPED THE WAY IT IS — THIS DESIGN HAS BEEN REFUTED THREE TIMES ON ONE
# FAULT SHAPE: A CENSUS OR A REQUIREMENT STATED AT THE WRONG PRECISION.
#
#   1. R1 — the producer census. The doc named three gate arms; there are four, because
#      `_fail` commits `inconclusive` from six call sites. O2's oracle ("exercise all three
#      gate force arms") would have shipped GREEN with the arm most likely to fire in
#      production still manufacturing the analyst-facing verdict. O2 was REPLACED, not
#      extended, for exactly this reason: an enumeration of named arms is the shape that hid it.
#   2. R6 — the surface census. The doc named two disposition-validating boundaries; there
#      are three, plus two model-facing prompt rosters it never mentioned.
#   3. J1 (45-dispositions) — the requirement's own precision. O1 demanded a row naming
#      "host plus data source"; M1 priced "at least one `ceiling_test` row that states
#      something", and `_row_states_something` (C3) excludes only `none` and `""`. A
#      host-only row PAYS M1 AND FAILS O1. RESOLVED AT §7 ROUND 2, AND AT NEITHER OF THE
#      TWO: **a row pays when it names a specific DATA SOURCE that was not retrieved; a
#      host is permitted but NEVER required.** Host-and-source would have refused the
#      deployment-wide gap — no system in this deployment exposes predicate P — which has
#      no host to name and is the finding class this issue exists to surface. Accepted
#      cost, on the record: `auditd not collected` pays without saying where.
#   4. C18's site census (J11, re-ground, CORRECTED AGAIN AT §7 ROUND 3): the census of
#      record is **29 sites / 17 modules, 18 of them disposition-bearing** (11 not). The
#      doc said 28/16; the assembler said 18/10; the re-ground published 27/17/18 by
#      re-summing C18's own hit LIST after that list had already dropped two exact hits
#      (`learning/core/directions.py:144` and `learning/author/lessons/run.py:251`, both
#      four-literal matches in files C18 already cites, both learning-DIRECTION reads and so
#      both in the not-disposition bucket). The re-ground RAN the correct grep, got 29, and
#      dismissed the delta as collateral. Re-executed on this base: 29 hits / 17 files.
#      29/17/18 supersedes 27, 28 and 18/10. THE CORRECTION LAYER IS WHERE THIS FAULT SHAPE
#      NOW LIVES: re-resolve a census, never re-sum a citation list.
#   5. C12's reader list (phase E, executed): `_run_paths.py` contains NO reference to
#      `review_record` at all — the only readers are close_tool, challenge_gate and the
#      runtime visualizer. C12's CONCLUSION survives (nothing under learning/ reads it) and
#      its LIST does not. The demand bound to that edge is written as an induced-fault
#      drive rather than as an assertion about the named module, because a test asserting
#      the verdict of a reader that does not exist asserts about a symbol resolving to
#      nothing.
#
#   EXPECT MORE. Where an invariant field below reads `unknown`, it is a finding with a
#   named question behind it, never a null this assembly could not be bothered to fill.
#
# WHAT IS STRUCK AND MUST NOT REACH A TEST DOCSTRING OR A RATIONALE (design revision):
#   * P4 / C9 — "the gate cannot hold a named target at force time" — REFUTED. Arms 2 and 3
#     both force while holding `review.ask.target`; arm 2 interpolates it into `detail`. The
#     decision it was offered in support of survives on an INDEPENDENT reason: a target
#     already asked that returned nothing new is not a deployment gap.
#   * P3 / C5's site list — superseded by M2's five sites.
#   * O2's original three-arm oracle — REPLACED. Any enumerator inheriting the doc's version
#     reproduces the bug it missed.
#
# NAME RECONCILIATION (grounding, demand extraction and the dispositions' address derivations
# coined ids independently; this is the unification, keyed by role+origin):
#   * CLAIM IDS COLLIDED. The discuss doc's ledger is C1-C15. BOTH phase-A leaves then
#     continued at 16: `10-brief.md` coined C16-C28 and `20-demands.md` coined its own
#     C16-C24 for DIFFERENT claims. `45-dispositions.md` reads the brief's numbering as the
#     continuation of the doc's (it cites C19 for the host check, C18 for the reader census,
#     C6/C12/C3 for the doc's). So: C1-C15 = the doc, C16-C28 = the brief, and the demand
#     leaf's nine are RENAMED D16-D24 — which is what `20-demands.md` itself calls them
#     ("see D-claim C16"). Every citation in this file uses the unified namespace.
#   * ACTORS. `run_investigation` is the driver limb (`runtime/driver/__init__.py`; profile
#     `contextAliases.driver`), `decide_write` the `investigation.md` write gate (the invlang
#     validator: `_gating.py:290` `_check_disposition_gating` + `_structure.py:531`),
#     `decide_report_write` the `report.md` frontmatter write gate (`_artifact_schema.py:150-159`)
#     — the third boundary R6 found and the doc did not know about.
#   * BOUNDARY IDS ARE THE CODE'S OWN NAMES: `disposition` (`_vocab.py:41 DISPOSITION_VALUES`),
#     `_DISPOSITION_GATES` (`_gating.py:224`), `UNTRAINED_DISPOSITIONS` (`directions.py:174`),
#     `ceiling_test` (the `:T conclude` row list), `REPORT_CAUSES` (`close_tool.py:121-128`).
#   * AXES. The registry is EMPTY, and that is grounded, not lazy: `10-brief.md`'s deferred-
#     censuses paragraph records that `spec-graph trace resource` was not run because NONE of
#     the seven shared roots is a path-interpolating write sink — they are value domains and
#     one frontmatter field. No writer interpolates anything, no boundary claims an identity
#     facet, so R2 has nothing to fire on and no `key_axes`/`interpolates` member exists to
#     fall outside the registry.
# ===========================================================================================

demands:

  # =========================================================================================
  # #0 — THE RETURN-VALUE CONTRACT. The change has no single return value; it has one
  # committed value and two refusal shapes. F1 settled the member's spelling (`unresolved`,
  # appended LAST to DISPOSITION_VALUES — safe only because it sorts last; C22/D22 pins that
  # the refusal text and the tool schema render ONE ordering).
  # =========================================================================================

  - id: fifth_member_is_the_committed_verdict
    kind: behavior
    form: test
    source: "demand #0; fork F1 resolved auto at §7 — provisional flag REMOVED"
    binds:
      - 'disposition.domain.distinguished[unresolved]'
      - 'interacts(close_investigation->report_md)'
    discharged_by: test_a_host_terminated_close_commits_the_fifth_member_verbatim
    seed_docstring: >-
      Every host-terminated close commits the literal string `unresolved` into `report.md`'s
      frontmatter `disposition` field, verbatim and unnormalized. The `outcome` name does NOT
      move with it: `CloseResult.outcome` stays `forced-inconclusive` (close_tool.py:59) — the
      outcome name is not the verdict, and a test that asserts on `outcome` is asserting about
      the wrong field.

  # =========================================================================================
  # O1 — THE ENTRY PRICE (M1, M4). "Every close committed as `inconclusive` names at least one
  # specific unreachable source — host plus data source — or is refused", at BOTH boundaries.
  #
  # *** J1 IS RESOLVED (§7 round 2, human) AND IT SITS UNDER EVERY DEMAND IN THIS SECTION. ***
  # A row pays when it names a specific DATA SOURCE that was not retrieved. A HOST IS PERMITTED
  # BUT NEVER REQUIRED. Neither candidate the design offered was taken: "a row that states
  # something" is strictly weaker (a host-only row pays it) and "host plus data source" refuses
  # the deployment-wide gap this issue exists to surface. The discriminating pair lives in
  # `a_gap_row_pays_by_naming_a_source_or_a_capability`; every other O1 demand below leans on it, and a
  # build implementing the weaker predicate passes all of them without it.
  # The predicate is additionally HARDENED three ways (J24 + J25 + J28, human): confusable and
  # zero-width normalization through the shared normalizer, distinct rows, and a bound on the
  # accumulated text.
  # =========================================================================================

  - id: inconclusive_owes_a_named_gap_at_the_close
    kind: behavior
    form: test
    source: "O1"
    binds:
      - '_DISPOSITION_GATES.domain.distinguished[inconclusive]'
      - 'interacts(close_investigation->investigation_md)'
      - 'ceiling_test.domain.distinguished[absent]'
    discharged_by: test_an_inconclusive_close_naming_no_gap_is_refused_at_the_close
    seed_docstring: >-
      A close supplying `inconclusive` whose parsed `:T conclude` carries no `ceiling_test`
      row that pays the price is refused at `close_investigation`, by a `ModelRetry` whose
      text names the owed row. The refusal covers the no-companion and the unparseable-
      companion cases alike (S1, S2): no companion means no stating row, which means no
      payment. Model-free and falsifiable.
    note: >-
      J1 OPEN — what "pays" means here is exactly the contradiction above. Write the assertion
      against whichever predicate §7 settles; do not smuggle a choice in through the fixture.

  - id: the_price_is_collected_at_both_boundaries
    kind: parity
    form: test
    source: "O1 (both-boundaries oracle); brief F5 — one table, two collection sites"
    binds:
      - 'investigation_md.access[write-gate]'
      - 'investigation_md.access[close]'
      - 'interacts(decide_write->investigation_md)'
      - 'interacts(close_investigation->investigation_md)'
      - 'interacts(decide_write->_DISPOSITION_GATES)'
      - 'interacts(close_investigation->_DISPOSITION_GATES)'
    discharged_by: test_the_same_document_is_refused_at_the_investigation_md_write_gate
    seed_docstring: >-
      The one document that is refused at the close is refused at the `investigation.md` write
      gate too, and for the same owed row: the price is a property of the TABLE
      (`_DISPOSITION_GATES`), collected at both boundaries from one definition, not a branch
      written twice. Asserted per collection site, never once at the table's altitude — a
      constraint pinned on one surface and silently absent on its sibling is this repo's
      canonical fail-open.

  - id: a_paid_inconclusive_close_commits
    kind: behavior
    form: test
    source: "O1 — the POSITIVE CONTROL for the two negatives above and for C3's marker"
    binds:
      - 'interacts(close_investigation->report_md)'
      - 'ceiling_test'
      - 'ceiling_test.domain.distinguished[host-and-data-source]'
    discharged_by: test_an_inconclusive_close_naming_a_host_and_a_data_source_commits
    seed_docstring: >-
      An `inconclusive` close whose `ceiling_test` block names a host AND the data source that
      could not be reached commits: the price is payable, the report lands, and the row's text
      arrives in the frontmatter unchanged. Without this control every refusal demand above
      passes on a build where the price gate refuses everything.

  - id: the_empty_marker_does_not_pay
    kind: domain-outcome
    form: test
    source: "O1; C3 (the doc's own executed probe on `_row_states_something`)"
    binds:
      - 'ceiling_test.domain.distinguished[none]'
      - 'ceiling_test.domain.distinguished[]'
    discharged_by: test_neither_none_nor_a_blank_row_pays_the_inconclusive_price
    seed_docstring: >-
      The honest empty marker `none` and the blank string both project as stating nothing, so
      neither pays the price: a close carrying only such a row is refused exactly as one
      carrying no row at all. These are the two inputs C3 probed; the whitespace, case and
      unicode-confusable spellings around them are NOT covered here — see probe P10 and J24.

  - id: the_price_is_category_blind
    kind: domain-outcome
    form: test
    source: "N2 made observable — the trigger is the verdict, not `termination.category`"
    binds:
      - '_DISPOSITION_GATES.domain.distinguished[inconclusive]'
    discharged_by: test_every_termination_category_owes_the_same_row
    seed_docstring: >-
      The price is owed on the verdict alone. An `inconclusive` close owes the same row
      whether it terminates on `exhaustion`, `data-ceiling`, `severity-ceiling` or the
      misspelling `severity_ceiling` — the free-text category cannot silently disable it,
      which is the whole reason the trigger moved off `conclude.termination.category` (P1)
      and onto a closed validated enum.

  - id: the_price_precedes_the_disposition_branch_and_the_review
    kind: behavior
    form: test
    source: "M4; brief F6"
    binds:
      - 'interacts(close_investigation->investigation_md)'
      - 'challenge_gate'
    discharged_by: test_a_close_owing_the_price_is_refused_before_any_stage_is_called
    seed_docstring: >-
      A close that owes the price is refused before any review stage is dispatched and before
      any disposition branch is taken: no reviewer model call is spent on a close that is
      going to be refused anyway. Drive a close owing the row and assert the review stages
      were never called, not merely that the close failed.

  # =========================================================================================
  # O2 — NO HOST PATH PRODUCES `inconclusive` (M2). REPLACED at §7. The universal is the
  # point; the five-site exercise is COVERAGE, and the census assertion is the obligation.
  # =========================================================================================

  - id: every_gate_force_arm_emits_the_new_state
    kind: domain-outcome
    form: test
    source: "O2 (replaced) — M2 sites 1-3, the three overrules at challenge_gate.py:399/410/416"
    binds:
      - 'challenge_gate'
      - 'disposition.domain.distinguished[unresolved]'
    discharged_by: test_all_three_gate_overrule_arms_commit_the_new_state
    seed_docstring: >-
      Each of the gate's three overrule arms — evidence-cannot-discriminate,
      nothing-left-to-ask, turn-budget-spent — commits `unresolved`, and `cause` stays the
      four-way distinguisher that tells the operator which arm fired. The arms keep their
      causes (N8); only the verdict moves.
    rejected:
      - {nl: "the doc's original oracle, which enumerated three arms and would have shipped green with `_fail` still committing `inconclusive` — deleted, not extended"}

  - id: the_review_failure_arm_emits_the_new_state
    kind: domain-outcome
    form: test
    source: "O2 (replaced) — M2 site 4, `_fail`; fork F3 resolved HUMAN: yes, `_fail` moves"
    binds:
      - 'challenge_gate'
      - 'disposition.domain.distinguished[unresolved]'
    discharged_by: test_a_review_that_timed_out_raised_or_was_unreadable_emits_the_new_state
    seed_docstring: >-
      `challenge_gate._fail` — reached when a review stage times out, raises, returns text
      outside its own output contract, or has no reviewer bound to the bundle at all —
      commits `unresolved`, from every one of its six call sites (the projector, each lens,
      the composer). `CAUSE_REVIEW_INCOMPLETE` keeps its name (N8) and is the FOURTH forced
      cause. This is the producer the design's original census missed entirely and the arm
      most likely to fire in production.

  - id: retry_exhaustion_emits_the_new_state
    kind: domain-outcome
    form: test
    source: "O2 (replaced) — M2 site 5, driver/__init__.py:301"
    binds:
      - 'drives(run_investigation->close_investigation)'
      - 'disposition.domain.distinguished[unresolved]'
    discharged_by: test_the_drivers_retry_exhaustion_close_commits_the_new_state
    seed_docstring: >-
      The driver's retry-exhaustion limb — `forced=True`, no model left — commits `unresolved`
      and still takes the immediate no-review path: it does not fall through into
      `challenge_gate(..., stages=None)`, whose fault path would route to `_fail` and
      re-commit `inconclusive` inside the fault-exit handler. That fall-through is what M2 as
      originally drafted would have created (C28/R4), and this test is what refuses it.

  - id: no_host_path_reaches_inconclusive
    kind: negative
    form: test
    source: "O2 (replaced) — the CENSUS half, which is the actual obligation"
    binds:
      - 'challenge_gate'
      - 'drives(run_investigation->close_investigation)'
      - 'interacts(close_investigation->report_md)'
    discharged_by: test_no_host_arm_passes_inconclusive_to_the_close
    seed_docstring: >-
      No non-test call site in the shipping tree supplies `inconclusive` to a close other than
      the investigating model's own tool argument. This is a universal, not a list: it is
      what catches a SIXTH producer the way an enumeration of five names cannot. Its paired
      positive control is `model_close_still_reaches_inconclusive` — without that, a build
      where nothing can close at all passes this vacuously.
    note: >-
      J9/J10 OPEN. Two unresolved questions the human owes an answer to before phase E fixes
      the instrument: (a) does the census cover BOTH spellings (`inconclusive` and
      `unresolved`) or only the old one — the judge recommends both; (b) is it a token check
      or a dataflow property — a grep-shaped census is satisfied by an f-string, an alias or a
      constant under another name, and this codebase already hid a producer behind a helper
      (`_fail`). `spec-flow:symbol-refs` resolves references past grep and is the recommended
      instrument. J31 asks the same universal concretely: the judge's answer is a RULE, not a
      list — any caller passing `forced=True` is the host, any other caller is not.

  - id: model_close_still_reaches_inconclusive
    kind: behavior
    form: test
    source: "O2 (replaced) — the paired positive the negative above needs to be non-vacuous (S16)"
    binds:
      - 'interacts(close_investigation->report_md)'
      - 'disposition.domain.distinguished[inconclusive]'
    discharged_by: test_the_investigating_models_own_close_still_commits_inconclusive
    seed_docstring: >-
      The investigating model reporting that it could not settle the case still commits
      `inconclusive` — priced by M1, and the only remaining producer of that verdict. The
      whole change is a partition of one keyword into two, and this is the half that stays.

  - id: the_new_state_never_spends_a_review
    kind: behavior
    form: test
    source: "O6 / M5; fork F2 resolved HUMAN — refuse at the tool boundary, the host owns this verdict. Provisional flag REMOVED"
    binds:
      - 'disposition.access[close-tool]'
      - 'interacts(close_investigation->report_md)'
      - 'challenge_gate'
    discharged_by: test_a_model_authored_new_state_close_is_refused_without_spending_a_review
    seed_docstring: >-
      A close tool call supplying `unresolved` is refused, nothing is committed, and no review
      stage is dispatched — the model is offered the member by the tool schema (it derives
      from the tuple, C19/C20/D20) and held to a narrower set by the host. That divergence is
      deliberate (N7) and this is its witness: assert BOTH that the schema advertises the
      member and that the host refuses it, or the witness records only half of what it exists
      to pin.
    note: >-
      J5 AND J12 OPEN, and both change what this test asserts. J5: the design places M5's
      refusal NOWHERE in the close's existing ordered-refusal sequence; the judge recommends
      the host-check position (close_tool.py:352-359), ahead of the price gate at :390 and far
      ahead of the review, because it is a pure argument-value check and that is the only
      placement that preserves the no-review-on-a-doomed-close guarantee. J12: M5's matching
      precision (exact vs normalized) is unstated; the judge reads C19 as forcing exact —
      `unresolved` becomes an ENUM MEMBER under F1, so the ordinary membership check at :352
      accepts it and M5 must be an ADDITIONAL check layered on top. J26/J27: whether "consumes
      no turn and advances no review state" is a guaranteed property of M5 or an inherited
      side effect is undecided; if only incidental, a refactor loses it silently.

  # =========================================================================================
  # O3 — THE COMMITTED REPORT IS PARTITIONABLE. F6 resolved auto: the gap set is the reports
  # STILL SPELLED `inconclusive` — model-authored and priced. Under that reading O3 is
  # discharged by construction once O2 holds.
  # =========================================================================================

  - id: the_report_partitions_host_terminated_from_gap_naming
    kind: domain-outcome
    form: test
    source: "O3, read per F6 (resolved auto). Provisional flag REMOVED"
    binds:
      - 'interacts(close_investigation->report_md)'
      - 'disposition.domain'
    discharged_by: test_no_host_terminated_run_appears_in_the_gap_set
    seed_docstring: >-
      Partition committed reports on `disposition` alone: no run the host terminated appears
      among the reports spelled `inconclusive`, and every report spelled `inconclusive` names
      a gap. The distinction is readable from the committed report by itself, with no second
      field and no access to the run's history.

  # =========================================================================================
  # O4 — THE RULE CANNOT BE DISABLED BY A SPELLING.
  # =========================================================================================

  - id: an_unknown_disposition_is_refused_not_skipped
    kind: behavior
    form: test
    source: "O4"
    binds:
      - 'disposition.access[close-tool]'
      - 'disposition.domain.distinguished[not-a-disposition]'
      - 'disposition.domain.distinguished[Unresolved]'
      - 'interacts(close_investigation->report_md)'
    discharged_by: test_an_unknown_disposition_is_refused_at_the_tool_boundary
    seed_docstring: >-
      A verdict the vocabulary does not know — a garbage string, or a case/spelling variant of
      a real member — is REFUSED at the tool boundary, not silently skipped past the check it
      should have triggered. The refusal names the ordered tuple. The non-string case matters
      too: `isinstance(str)` is tested first, so a list or an int denies instead of raising
      out of the gate.
    note: >-
      J40 OPEN, and it is an ALTITUDE finding, not a substance one. The premise asks about
      EVERY boundary that validates a disposition and there are THREE (C11 the close tool,
      C20 the invlang document vocabulary, C21 the `report.md` frontmatter write gate — the
      last two are what R6/M6 newly pulled into scope). This demand binds only the close-tool
      cell, because that is the only cell the doc's O4 covers. The other two cells fire R3
      unanswered ON PURPOSE. The judge's reading is that the answer is determinate (refused at
      all three) and only the assertion needs widening.

  - id: the_advertised_vocabulary_is_the_owners_tuple_in_one_order
    kind: shape
    form: test
    source: "N7; C19/C20/D20/D22 — the tool schema and the refusal are read in ONE round trip"
    binds:
      - 'disposition.domain'
    discharged_by: test_the_tool_schema_and_the_refusal_render_one_ordering
    seed_docstring: >-
      The close tool's JSON-schema enum and the host's refusal text render the owner's tuple
      in ONE ordering, so a model correcting itself is never handed two orderings of one
      closed vocabulary. `unresolved` is appended LAST and that placement is load-bearing:
      the tuple is alphabetical, the refusal is rendered from the ordered tuple and never from
      `sorted(DISPOSITION_ENUM)`, and a member that did not sort last would have to be
      INSERTED, not appended.

  # =========================================================================================
  # O5 — A HOST-TERMINATED RUN TRAINS NOTHING (M3).
  # =========================================================================================

  - id: the_new_state_selects_no_training_direction
    kind: domain-outcome
    form: test
    source: "O5 / M3"
    binds:
      - 'UNTRAINED_DISPOSITIONS'
      - 'UNTRAINED_DISPOSITIONS.domain.distinguished[unresolved]'
      - 'run_cycle'
    discharged_by: test_a_run_in_the_new_state_dispatches_no_learning_leg
    seed_docstring: >-
      `unresolved` is a member of `UNTRAINED_DISPOSITIONS`, and a run carrying it dispatches
      no learning leg — no box, no actor leg, no judge leg. THE SET MEMBERSHIP IS THE
      CONSTRUCTION AND THE ASSERTION; the empty direction list is its consequence, not the
      oracle.
    note: >-
      J6 AND J7 ARE BOTH ABOUT THIS TEST'S ABILITY TO FAIL, and both were promoted by the
      judge. J6: `directions_for` returns `[]` for ANY unrecognized string, so "the new state
      selects no direction" is true on a build where M3 was never applied and on a typo — the
      doc's own O5 oracle cannot fail. The repair is to assert set membership AND the union
      invariant (below), with `directions_for(...) == []` as the consequence. J7: driving this
      through the OBVIOUS fixture — the retry-exhaustion close — may test nothing either,
      because `run_common.learning_refusal_gate` already refuses any run with `truncated_by`
      set, independently of M3, and the retry-exhaustion producer sets it. The judge
      recommends driving O5 through the GATE-OVERRULE producer (S20), which does not, and
      keeping retry exhaustion as a second explicitly-labelled case. PROBE P9 confirms the
      `truncated_by` asymmetry and must land before this test is written.

  - id: the_direction_union_invariant_holds
    kind: coherence
    form: test
    source: "O5 / M3; SR3's declared invariant at directions.py:176-178 (C8, C26)"
    binds:
      - 'UNTRAINED_DISPOSITIONS'
      - 'disposition.domain'
      - 'interacts(directions_router->disposition)'
    discharged_by: test_every_disposition_selects_a_direction_or_declares_itself_untrained
    seed_docstring: >-
      The union of every learning direction's `dispositions` is exactly
      `DISPOSITION_ENUM - UNTRAINED_DISPOSITIONS` — every member of the vocabulary either
      selects a training direction or declares itself untrained, and none does both or
      neither. This is the invariant that makes O5's oracle discriminating: adding the member
      to the enum and nowhere else BREAKS it, which is why a member "present in the vocabulary
      but declared nowhere else" is structurally impossible (S21).

