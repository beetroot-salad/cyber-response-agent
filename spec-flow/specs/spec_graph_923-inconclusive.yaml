    seed_docstring: >-
      The no-review bypass matches BOTH uncertain verdicts — `inconclusive` and `unresolved` —
      and no others, and the `forced` flag buys no bypass of its own: a CONFIDENT verdict
      closed on the host's forced lane still spends its review. Driven over the WHOLE
      vocabulary with a cell PER MEMBER rather than as the set of members that skip, and the
      roster is asserted to cover the enum exactly, so a sixth member joining the vocabulary
