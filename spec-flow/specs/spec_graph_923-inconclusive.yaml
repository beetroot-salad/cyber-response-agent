    - {id: invlang_cli,          frame: leg,         provenance: code}    # skills/invlang/cli.py:41,47 — `choices=` on two read-only query subcommands (brief F13: no-consequence, but it still owes a verdict)
    - {id: ticket_lane,          frame: leg,         provenance: code}    # scripts/case_history/case_ticket.py:116,207,240 — the resolution line decodes to a disposition (J15)
    - {id: report_reader,        frame: leg,         provenance: code}    # defender/_report.py:108-112::read_report — `normalized_disposition`, UNKNOWN_DISPOSITION fallback
    - {id: learning_validate,    frame: leg,         provenance: code}    # learning/core/validate.py:33-36
    - {id: held_out,             frame: leg,         provenance: code}    # evals/held_out.py:57
    - {id: trace_lesson,         frame: leg,         provenance: code}    # learning/ops/trace_lesson.py:107-108
    - {id: visualize_primitives, frame: leg,         provenance: code}    # scripts/visualize/visualize_primitives.py:136
    - {id: run_paths,            frame: leg,         provenance: code}    # defender/_run_paths.py — the review_record reader that does NOT move (C12)

  boundaries:

    # =======================================================================================
    - id: disposition
      provenance: design
      # `_vocab.py:41 DISPOSITION_VALUES` — one definition, one frozenset, one normalizer.
      # M2/F1 appends a fifth member. The ACCESS facet below is the important half: this is
      # not one boundary with one gate, it is one value vocabulary reached over FOUR write
      # surfaces, three of which validate it and one of which is an analyst's text field.
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The closed disposition enum. Today `('benign', 'false-positive', 'inconclusive',
              'malicious')` (C11, executed); M2 appends `'unresolved'` LAST (F1). Only the
              members this change is ABOUT are listed as distinguished — `benign`,
              `false-positive` and `malicious` are untouched by every mechanism and would
              otherwise mint obligations no demand asks for. Two of the four listed members are
              INPUT CLASSES rather than enum members, and are written as the literal a test
              would supply: `Unresolved` is the case/spelling variant J12 asks about, and
              `not-a-disposition` stands for any value outside the vocabulary entirely (O4).
              Both exist here because the boundary must be exercised with them, and neither is
              ever a legal committed value.
          default: inconclusive
          distinguished: ['unresolved', 'inconclusive', 'Unresolved', 'not-a-disposition']
          falsy_valid: false
          documented_alternatives: []
        access:
          constraints_by_via:
            close-tool:
              # runtime/close_tool.py:352-359 — `isinstance(str) and in DISPOSITION_ENUM`,
              # refusal text rendered from the ORDERED tuple. M5 adds the host-only refusal
              # HERE, layered on top: once `unresolved` is an enum member, the membership check
              # accepts it (C19), so M5 cannot BE the membership check.
              trust: attacker-influenced
              constraints: [enum-membership, non-string-refusal, no-normalization, host-only-refusal]
            invlang-doc:
              # skills/invlang/vocab.py:10 -> _structure.py:531 — validates the document's
              # `conclude.disposition` against the SAME tuple. THE FIFTH MEMBER IS ADMITTED
              # HERE FOR FREE (C20), and `unresolved` carries no price row, so a model that
              # writes it into its conclude block gets a legal document at the boundary the
              # two-boundary price exists to close. J2 — the largest open fork in the run.
              trust: attacker-influenced
              constraints: [enum-membership, host-only-refusal]
              # J2 RESOLVED (human, §7 round 2): the document keyword refuses `unresolved` too.
              # Left admitted, the member is legal here for free (same tuple, C20) and carries
              # no price row — a model writing it into its conclude block would get a legal
              # document at the very boundary the two-boundary price exists to close.
            report-frontmatter:
              # defender/_artifact_schema.py:150-159 — exact `isinstance(str) and in
              # DISPOSITION_ENUM` with its own refusal text. The THIRD validating boundary
              # (C21); the doc's census named two. M6 pulls it in scope; J40 asks whether O4's
              # assertion reaches it.
              trust: derived
              constraints: [enum-membership]
            ticket-resolution:
              # scripts/case_history/case_ticket.py:240 — an analyst-editable resolution line
              # is decoded into a disposition. A FOURTH authoring surface, and the only one
              # whose writer is neither the host nor the investigating model.
              trust: operator
              constraints: [enum-membership, host-only-refusal]
              # ESTABLISHED (J15, re-ground executed) AND DECIDED (J2, §7 round 2). The decoder
              # validates by BARE ENUM MEMBERSHIP through `normalized_disposition` and returns
              # `None` silently for anything else — never raises. Demonstrated before and after
              # simulating the widened enum: once `unresolved` is a member, an analyst's
              # hand-typed `unresolved — I stalled, can't get to a verdict` decodes cleanly and
              # is indistinguishable from a host-forced close, on a field whose in-code comment
              # calls it analyst-editable and read back by the benign judge.
              # J2 RESOLVED (human): this is the THIRD authoring surface and it REFUSES the
              # host-only verdict, as a universal rather than true-at-one-door. Its refusal is
              # written for a PERSON, not for a model — the only surface whose author is neither
              # the host nor the investigating model.

    # =======================================================================================
    - id: _DISPOSITION_GATES
      provenance: design
      # skills/invlang/validate/_gating.py:224 — the entry-price table. TWO rows today
      # (`benign`, `false-positive`, C6); M1's is the THIRD, not a fifth member of the enum.
      # `lint_half_read_table` watches this literal and requires each value be a bare `Name`
      # (F12), so M1's row must be a module-level `_Price` binding, not an inline call, or the
      # lint silently drops its other findings (S23).
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The table is keyed by disposition and collected at both the `investigation.md`
              write gate (`_gating.py:290`) and the close (`close_tool.py:390`) from one
              definition (C6). Only the row M1 adds is distinguished; the two existing rows are
              untouched and both existing meta-tests are parametrized over the table's
              complement, so M1 re-partitions them BY CONSTRUCTION and they stay green (C26).
              THE ROW'S PRICE PREDICATE IS SETTLED — see the refinement continuation below.
              *** J1 RESOLVED (human, §7 round 2), AND IT IS NEITHER CANDIDATE THE DESIGN
              OFFERED. *** A row pays when it names a SPECIFIC DATA SOURCE that was not
              retrieved. A host is PERMITTED but NEVER REQUIRED. The deployment-wide gap — no
              system in this deployment exposes predicate P — has no host to name, and it is
              the finding class this issue exists to surface, so host-and-source would have
              refused exactly the findings the change is for. Accepted cost, on the record:
              `auditd not collected` pays without saying where, so a single-host gap can read
              as deployment-wide and the channel loses scope information it could have carried.
              This goes BEYOND the shipped severity-ceiling rule, which demands a source only
              in its message and never in its check. The predicate is additionally HARDENED
              three ways (J24+J25+J28, human): the states-something check normalizes zero-width
              and lookalike characters through the same normalizer the disposition keywords go
              through, rows must be DISTINCT, and the accumulated row text is BOUNDED.
          default: unpriced
          distinguished: ['inconclusive']
          falsy_valid: false
          documented_alternatives:
            # The two predicates the design offered and the human did NOT take. Kept, not
            # deleted: a later reader finding `_row_states_something` in the code has to be able
            # to see that the weaker predicate was considered and refused, and the R0 findings
            # that carried them are answered rather than forgotten.
            - value: 'row-states-something'
              crosses_validation: false
              # REJECTED. M1's own words, and strictly weaker: `_row_states_something`
              # (_gating.py:31) excludes only `none` and `""` (C3), so a row naming a host and
              # NO data source pays. It is the weaker predicate that let the two shipped
              # fixtures state their gaps in prose in the first place, and P10 shows it also
              # admits a Unicode-confusable spelling of the empty marker.
              # Discriminated by `a_gap_row_pays_by_naming_a_source_or_a_capability`.
            - value: 'row-names-host-and-data-source'
              crosses_validation: false
              # REJECTED. O1's words, and the standard `_check_ceiling_test_scope` (C1) already
              # enforces under `termination.category == severity-ceiling` alone. It refuses the
              # deployment-wide gap, which is the finding class the issue exists to produce —
              # the explicit reason the human settled against the judge's recommendation.

    # =======================================================================================
    - id: ceiling_test
      provenance: design
      # The `:T conclude` model-authored row list. Stored, not derived; already written by real
      # runs. M1 makes at least one paying row MANDATORY on every `inconclusive` close.
      facets:
        domain:
          type: list[str]
          refinement:
            nl: >-
              Distinguished members name the ROW CLASSES the price predicate must be exercised
              against, written as the value a single row carries, plus `absent` for the
              list-level case (no block, or no companion at all). `none` and `""` are the two
              inputs C3 actually probed and both project as stating nothing.
              `host-and-data-source` is a paying row and the positive control. EVERY member
              now carries a settled verdict under J1 and J24/J25/J28, and each has a demand:
              `host-without-data-source` does NOT pay (J1 — a host is permitted, never
              required, and a source is), `whitespace-only-or-confusable` does NOT pay (J24 —
              hardened at BOTH boundaries across all four of P10's executed spellings; the
              demand is the outcome and NOT the mechanism the resolution suggested, which was
              measured and reaches only two of the four), `non-string-row` does NOT pay (P1, executed: a silent False, refusing
              closed), and `repeated-row` does NOT pay for more than one gap (J25 — rows must
              be distinct; the gate offered this as a waiver candidate and the human WITHDREW
              the waiver and chose to harden). A source-only row DOES pay and is the second
              positive control.
          default: absent
          distinguished:
            - 'none'
            - ''
            - 'absent'
            - 'host-and-data-source'
            - 'host-without-data-source'   # J1 RESOLVED — does NOT pay. The row that pays the weaker predicate and names no check anyone can go make.
            - 'data-source-without-host'   # J1 RESOLVED — DOES pay. The deployment-wide gap the issue exists to surface; it has no host to name.
            - 'capability-without-data-source'  # J1 WIDENED at §7 round 4 — DOES pay. A row naming a capability the run did not have (an execution sandbox, a traffic-content inspector) and no data source at all. The issue's own framing is capability-shaped and the shipped escalation document states its gap this way in its own prose.
            - 'whitespace-only-or-confusable'  # J24 RESOLVED — does NOT pay. P10 executed: zero-width, Cyrillic and fullwidth spellings of `none` pay TODAY; the check is hardened through the shared normalizer.
            - 'non-string-row'             # P1 executed — does NOT pay: a silent `False`, no exception, refusing the close CLOSED. Reachable only against a programmatically built companion.
            - 'repeated-row'               # J25 RESOLVED — the waiver was WITHDRAWN and the human chose to harden: rows must be DISTINCT, so repetition does not pay for more than one gap.
            - 'over-the-size-bound'        # J28 RESOLVED — does NOT pay. The accumulated row text is bounded; the rows are mandatory on every priced close and ride the report, the judge prompt and the ticket egress.
            - 'parser-significant-content'  # J29 executed — round-trips INERT through every sink probed, with ONE exception: `cause` absent, where the raw row lands in the ticket `resolution` a person and the judge model read back. MINTED AS A DEMAND at §7 round 3 (human): `a_gap_row_reaching_the_ticket_resolution_is_sanitized`.
          falsy_valid: false
          documented_alternatives: []

    # =======================================================================================
    - id: investigation_md
      provenance: design
      # The model-authored companion. Its `:T conclude` block is what both price boundaries
      # read. The access facet is the two-boundary collection, per cell — a price pinned at one
      # surface and absent at its sibling is precisely what the both-boundaries oracle exists
      # to refuse.
      facets:
        access:
          constraints_by_via:
            write-gate:
              # skills/invlang/validate: `_check_disposition_gating` (:290) collects the price;
              # `_check_ceiling_test_scope` (:496) is the untouched severity-ceiling rule (N1);
              # `_structure.py:531` validates the concluded keyword against the vocabulary.
              trust: attacker-influenced
              constraints: [entry-price, severity-ceiling-scope, enum-membership]
            close:
              # runtime/close_tool.py: the flagged-row window (:381, `forced`-exempt), the price
              # gate (:390, NOT `forced`-exempt — F7/R3, which is why M1 and M2 are one commit),
              # and the whole invlang structure check (:410, `forced`-exempt). The order is
              # load-bearing and documented in place.
              trust: attacker-influenced
              constraints: [entry-price, flagged-row-window, invlang-structure]

    # =======================================================================================
    - id: report_md
      provenance: design
      # The committed analyst-facing artifact, and the security asset: it rides verbatim into
      # the judge model's prompt and its body rides out through the ticket bridge's HTTP egress
      # (close_tool.py:90-99). Deliberately NO identity facet: this change touches the
      # frontmatter's VALUE, not where the file lands, and there is no path template or axis to
      # derive (see `axes:` above). R2 is silent for that reason and not by omission.
      facets:
        payload:
          parts:
            - {role: disposition,  source: const:DISPOSITION_VALUES}
            - {role: cause,        source: const:REPORT_CAUSES}
            - {role: ceiling_test, source: template:conclude_rows, slots: {rows: ceiling_test}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            The committed frontmatter, split by WHO CHOSE each field. `disposition` is a
            host-chosen member of a closed enum and `cause` is one composed sentence drawn from
            the closed six-member `REPORT_CAUSES` set (`close_tool.py:121-128`) — both exist as
            closed sets precisely because alert data is attacker-influenced. The ONLY slot
            carrying model-authored text is the `ceiling_test` rows lifted from the companion,
            where model text already lives. M1 is what turns that slot from occupied-by-two-
            fixtures into occupied-on-every-priced-close, which is J28/J29's whole subject.

    # =======================================================================================
    - id: UNTRAINED_DISPOSITIONS
      provenance: design
      # learning/core/directions.py:174. Today `{false-positive}`; M3 adds `unresolved`. The
      # declared invariant at :176-178 — union of every direction's dispositions is exactly
      # DISPOSITION_ENUM minus this set — is enforced by an existing test and is what makes
      # O5's oracle able to fail at all.
      facets:
        domain:
          type: frozenset[str]
          refinement:
            nl: >-
              The dispositions that select no training direction. `inconclusive` today routes
              into BOTH directions (`benign-direction` at :122, `malicious-direction` at :154);
              a run the host terminated is evidence about the run, not the world, and must
              route into neither. Adding the member to the enum and NOT to this set breaks the
              union invariant, which is exactly why the invariant is the discriminating
              assertion and `directions_for(...) == []` is not.
          default: false-positive
          distinguished: ['unresolved']
          falsy_valid: false
          documented_alternatives: []

    # =======================================================================================
    - id: review_record
      provenance: design
      # `review_record.{turn}.json`. Writers: challenge_gate.write_review_record and close_tool.
      # Readers: close_tool, challenge_gate, _run_paths, visualize_runtime — and NOTHING under
      # learning/ (C12, re-checked). No identity facet: the change moves the VALUE of the
      # `reviewed_disposition` field, not the record's per-turn path, so R2 has nothing to ask
      # and R7/R8 are the rules that see this.
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The record's `reviewed_disposition` field — the ONE disposition field it has.
              `visualize_runtime._was_reviewed` (:339) answers "was this reviewed?" by
              comparing it against the hardcoded literal `inconclusive`, and its own docstring
              is singular ("the ONE disposition close_tool commits WITHOUT a review"). Once the
              host's verdict moves, a gate-forced record carries the new member and would
              render as REVIEWED — arguably correct, but a verdict someone must take, not an
              adaptation. What the record should hold for a forced close is J33; whether it can
              express "pass 1 reviewed, pass 2 forced" at all is J34; any answer needing a
              SECOND field is proposing a schema change, because there is only one.
          default: inconclusive
          distinguished: ['unresolved']
          falsy_valid: false
          documented_alternatives: []

    # =======================================================================================
    - id: no_review_bypass
      provenance: design
      # runtime/close_tool.py:414 — `if disposition == "inconclusive":`, the arm that commits
      # with no review at all. It is what makes the driver's `forced=True` close cheap. Under
      # M2 the driver emits the new member, MISSES this literal, falls through to
      # `challenge_gate(deps, <new>, stages=None)` which dispatches review roles it does not
      # have, faults into `_fail`, and re-commits `inconclusive` INSIDE THE FAULT-EXIT HANDLER
      # where the driver's own comment says no model is left (C28 / R4). M2 must move it.
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The key this branch matches on. Today the string literal `"inconclusive"`. The
              design revision offered TWO repairs and presented them as interchangeable — "key
              it on `forced`, or match both states" — and J4 is the finding that THEY ARE NOT.
              *** J4 RESOLVED (human, §7 round 2): MATCH BOTH VERDICTS. *** The branch matches
              `inconclusive` and `unresolved`, and is NOT keyed on `forced`. This preserves
              today's behaviour exactly — a model-authored uncertain close still skips the
              review because the gate only ever reviewed CONFIDENT closes, and the
              host-terminated close skips because no reviewer is bound to it. Keying on
              `forced` would push model-authored uncertain closes into a live review: an
              unrequested behaviour change to the common path arriving disguised as a bug fix.
              J13 and J33/J34 follow mechanically — `UNREVIEWED_DISPOSITION` becomes the same
              two-verdict set (`visualize_runtime`'s duplicated literal is coupled to this
              branch by COPY, not by import, C24/D24, which is why the reader demand asserts
              both verdicts at it), and the review record keeps its existing fields with the
              forced arm recording the committed verdict.
              OWED, AND MINTED BELOW: a test that fails when this branch's verdict list drifts
              from the enum — `the_no_review_bypass_matches_both_verdicts`.
          default: inconclusive
          distinguished: ['inconclusive', 'unresolved']
          falsy_valid: false
          documented_alternatives:
            - value: 'keyed-on-forced'
              crosses_validation: false
              # REJECTED. Every MODEL-authored `inconclusive` close would stop taking the bypass
              # and newly spend a live review — cost, latency, and a new path to CHALLENGED or
              # CAUSE_STORY_SETTLED on a close that commits immediately today. The shipped
              # behaviour does NOT survive it unchanged, which is the reason it was refused.
            - value: 'match-both-states'
              crosses_validation: true
              # TAKEN. Preserves today's cheap unreviewed commit for the model's own close.
              # P11 executed and REFUTED the one cost anyone had priced against it: the
              # half-read-table lint fires only on a branch against one key of an ARMED
              # module-level dict table, and this site is a scalar equality check with no such
              # table — so neither option was additionally penalized by that lint.

    # =======================================================================================
    - id: prompt_rosters
      provenance: design
      facets: {}
      # THE TWO HAND-ENUMERATED, MODEL-FACING ROSTERS M6 PULLS IN SCOPE, AND WHAT IS TOLD TO
      # THE MODEL IS THE POINT: `defender/SKILL.md:485-508` (the runtime system prompt's
      # §REPORT — four members with a paragraph of meaning each), its `:512` sentence ("Two of
      # them carry an ENTRY PRICE"), its `:522` sentence documenting the `_fail` arm ("A review
      # that cannot run fails closed: the confident disposition is recorded as `inconclusive`"
      # — which N8 reworders, since that arm now labels a host-terminated state), and
      # `skills/invlang/SKILL.md:416` ("Two keywords carry an ENTRY PRICE"). No facet: these
      # are prose, with no typed contract for a slot predicate to read. `close_tool.py:548-552`
      # already names this staleness and defers it as "a prompt change, not this one" — under
      # M1+M2 it IS this one. J8 is the open question of whether the LIST is complete.

    # =======================================================================================
    - id: REPORT_CAUSES
      provenance: design
      facets: {}
      # runtime/close_tool.py:121-128 — six members. FOUR of them accompany a forced
      # `inconclusive`, not three: CAUSE_EVIDENCE_CANNOT_DISCRIMINATE, CAUSE_NOTHING_LEFT_TO_ASK,
      # CAUSE_TURN_BUDGET_SPENT and CAUSE_REVIEW_INCOMPLETE (C17). The design's "the three gate
      # causes stay as they are" under-counts by one. N8: CAUSE_REVIEW_INCOMPLETE keeps its
      # name. No facet and no obligation: NO READER PARTITIONS ON `cause` (C13, refuted and
      # re-confirmed by SR4's reader sweep), so §4's harm is prospective — this is minting a
      # type ahead of its consumer, not plugging a leak (N4).

    # =======================================================================================
    - id: ticket_egress
      provenance: code
      # The ticket bridge's HTTP egress (`close_tool.py:90-99`). Grounded neighbourhood: no
      # demand asked for it, the Security deep dive names it as the asset's exit, and M1 is
      # what enlarges the population of model-authored gap text that rides it.
      facets:
        payload:
          parts:
            - {role: resolution, source: template:report_body, slots: {rows: ceiling_test}}
          invariants: [all-slots-bound]
          nl: >-
            The committed report's body, leaving the process. Today two fixture documents carry
            `ceiling_test` rows; after M1 every priced close does, and nothing new bounds,
            escapes or constrains that text (J28). A row carrying a frontmatter delimiter or
            other parser-significant content is re-parsed downstream by `_report.py`, the
            ticket lane and `evals/held_out.py` (J29). The design's Security deep dive does not
            mention `ceiling_test` at all.

