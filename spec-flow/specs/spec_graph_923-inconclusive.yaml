      closes undemonstrated.
      THE §7-ROUND-4 WIDENING CHANGES WHAT THAT DOCUMENT OWES AND SHRINKS THE ACCEPTED COST.
      Its real gap is a CAPABILITY and its own prose already says so — "confirming C2 would
      require sandbox detonation or traffic-content inspection, and neither is in the runtime
      tool surface" — so the row it now owes LIFTS a sentence the run wrote, exactly as
      golden-v2sshd's two do, rather than relabelling one. A human who knows the case should
