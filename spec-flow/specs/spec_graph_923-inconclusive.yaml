    note: >-
      THIS DEMAND IS BOUND AT EIGHTEEN EDGES AND POINTS AT ONE TEST (the `binds:` list above holds
      eighteen, `_READERS` holds eighteen and pytest collects eighteen; "nineteen" was a
      phase-B carry-over never reconciled down, corrected at §7 round 3). That is an altitude risk
      the phase-E author must pay down by writing one discriminating case per named edge, not
      one table assertion that passes when any subset agrees. THREE OPEN ITEMS RIDE HERE.
      (a) J11: the doc defers the reader census to "implementation time"; C18 already did the
      work but ITS OWN ARITHMETIC DOES NOT RECONCILE — see the `unknown` recorded against
      C18's count in the ledger and the R0 hole it owes. (b) J13: what
      `UNREVIEWED_DISPOSITION` should BECOME is not stated anywhere; its own docstring is
      singular ("the ONE disposition close_tool commits WITHOUT a review") and after J4 there
      may be two. It is decided WITH J4, not before it. (c) J8: M6's roster list is the FOURTH
      short enumeration this design has offered, on a doc whose history is short enumerations;
      the phase-B author lens found more hand-enumerated rosters than M6 names (run-artifacts.md,
