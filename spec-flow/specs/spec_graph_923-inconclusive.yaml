  - id: the_untrained_set_is_not_what_refuses_a_truncated_run
    kind: behavior
    form: test
    source: "probe P9, executed (J7) — the producer O5 must NOT be driven through"
    binds:
      - 'UNTRAINED_DISPOSITIONS'
      - 'drives(run_investigation->close_investigation)'
    discharged_by: test_the_retry_exhausted_run_is_refused_before_the_untrained_set_is_consulted
    seed_docstring: >-
      The driver's retry-exhaustion limb sets a truncation marker, and the one refusal predicate
      both enqueues consult refuses any truncated run outright — before a disposition is read at
      all. So the obvious fixture for O5 tests nothing: it would pass with the untrained set
      untouched and go on passing if someone deleted the membership entirely. THREE RUNS, because
      one proves nothing: the truncation refusal is IDENTICAL for the host's untrainable verdict
      and for a trainable one (the guard never reads the disposition), and the same tree with no
      marker CLEARS the gate outright — which also says the host's own verdict is not what THIS
      gate excludes, so the untrained set is a structurally separate decision made later.
    note: >-
      REPAIRED AT §7 ROUND 3. The first version restated the literal the gate returns on its own
      first line: `run_dir`, `alert.json` and the disposition argument were all inert, there was
      no run it let through, and it read identically on a build with the guard deleted — a demand
