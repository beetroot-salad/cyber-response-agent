      A FOURTH place a disposition can be authored cannot appear without this failing. The
      surfaces are named by a census resolved against the vocabulary's OWNER — every shipping
      module referencing the enum, the ordered tuple, invlang's re-export or the shared
      normalizer — and the assertion is that the census set has not grown. The enumeration is
      how the subjects are picked, never what is asserted about them: what each authoring
