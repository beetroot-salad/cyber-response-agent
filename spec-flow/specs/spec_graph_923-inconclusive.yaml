      spelled with, in ALL FOUR spellings P10 measured paying — a zero-width-laced `none`, a
      Cyrillic `o`, a trailing joiner and a fullwidth spelling — and at BOTH collection sites.
      The paired control is an ordinary paying row whose host name carries a non-ASCII character,
      so this cannot pass on a build that refuses every non-ASCII row.
    note: >-
      EXTENDED AT §7 ROUND 3 (human), on two axes, and the mechanism clause is deliberately gone
      from the demand. MEASURED: the normalizer the resolution named — `_vocab
      .normalized_disposition` → `strip_zero_width` — catches 2 of these 4; NFKC would reach the
      fullwidth one; the Cyrillic homoglyph needs a confusable/skeleton fold that exists nowhere
