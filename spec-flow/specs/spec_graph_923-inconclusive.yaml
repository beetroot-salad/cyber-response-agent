  - id: the_price_keys_on_the_committed_keyword
    kind: behavior
    form: test
    source: "probe P5, executed — decides J19 outright"
    binds:
      - '_DISPOSITION_GATES.domain.distinguished[inconclusive]'
      - 'interacts(close_investigation->_DISPOSITION_GATES)'
    discharged_by: test_the_entry_price_is_owed_by_the_keyword_the_close_commits
    seed_docstring: >-
      The price follows the close's disposition ARGUMENT, never the document's
      `conclude.disposition`. A document can conclude one keyword while the close commits a
      different, differently-priced one, and nothing refuses the disagreement — which is what
      makes the two-boundary collection necessary rather than redundant, because `report.md` is
      written from the argument and `report.md` is what the learning loop, the evals and the
      ticket lane read. A zero-width-laced keyword still OWES: the price dispatch is a WRITE
      gate and fails CLOSED on a value that is not a member, never handing it the unpriced
      branch.
    note: >-
      THE LACED-KEYWORD ASSERTION IS THE WRITE-SIDE HALF OF THE §7-ROUND-4 DESIGN CHANGE, and
      it is what stops "a malformed verdict is never coerced" from being implemented by gutting
      the shared normalizer. EXECUTED against two scratch builds carrying M1: removing the
      coercion and nothing else makes a laced `inconclusive` take the UNPRICED branch and this
      demand goes red; removing it and failing the dispatch CLOSED on a non-member passes both
      this and `a_malformed_verdict_is_marked_not_coerced_on_read`. That is #722's mechanism
      restated at the altitude the design change put it at.

  - id: every_authoring_surface_refuses_the_host_only_verdict
    kind: parity
    form: test
    source: "J2 resolved HUMAN at §7 round 2 — all three surfaces, as one rule; J15 re-ground supplied the third"
    binds:
      - 'disposition.access[close-tool]'
      - 'disposition.access[invlang-doc]'
      - 'disposition.access[ticket-resolution]'
      - 'disposition.domain.distinguished[unresolved]'
    discharged_by: test_every_authoring_surface_refuses_the_host_only_verdict
    seed_docstring: >-
      All THREE surfaces from which a disposition can be authored refuse `unresolved` — the
      close tool's argument, the invlang document's `conclude.disposition` keyword, and the
      analyst-editable ticket resolution line. "Only the host produces this verdict" is a
      universal, not a property of one door. Each surface is driven and each verdict asserted
      AT THAT SURFACE: a check that the vocabulary refuses it somewhere is green when two of
      three moved. The ticket refusal is written FOR A PERSON — that surface's author is
      neither the host nor a model, and model-facing retry phrasing is not something an analyst
      can act on: it names the value refused AND the field the person edited AND what that
      field may carry instead, and it does not render the owner's full tuple (which offers the
      host-only verdict back to the person who was just refused it) or reuse the model's
      tool-argument vocabulary.
    note: >-
      THE PERSON-FACING CLAUSE IS AN ORACLE AT §7 ROUND 4, NOT A RATIONALE. It reached the
      suite twice as a note and once as a two-phrase blacklist that the single word
      `unresolved` satisfied — absence of two spellings is not a message written for anybody.
      It is now stated as what a WRONG build fails, and the same oracle runs at the reader edge
      that meets this refusal (`every_literal_disposition_reader_verdicts_the_new_member`'s
      `ticket_lane->disposition` case), because a message check on one of the two leaves the
      other free to raise a bare word. MUTATION-VERIFIED against three scratch refusals: the
      bare word fails, the model's own retry text fails, a sentence written for an analyst
      passes.

