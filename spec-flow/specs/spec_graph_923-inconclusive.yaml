      - 'disposition.domain.distinguished[unresolved]'
      - 'interacts(challenge_gate->disposition)'
      - 'interacts(run_cycle->disposition)'
    discharged_by: test_a_review_broken_by_the_content_under_review_stops_training_on_that_case
    seed_docstring: >-
      A review that times out, raises, or answers outside its own contract lands in the verdict
      the untrained set excludes, so content that reliably breaks a review is an OFF-SWITCH for
      learning from that case. That exclusion is accepted here as a denial of TRAINING beside
      the denial of verdict it was already accepted as, and it is asserted rather than implied:
      the broken-review close is DRIVEN through the real gate; its run is NOT refused by the
      truncation guard (that arm sets no marker, P9 executed), so the untrained-set membership is
      demonstrably what excludes it; and the paired control is the same run dir with a review
      that HOLDS, which trains — so the empty routing is the review outcome and nothing else.
    note: >-
      THE COMPOSITION, WHICH NOBODY RE-ASKED AFTER F3. M3's justification — "a run the host
      terminated is evidence about the run, not the world" — was written when M2 meant retry
      exhaustion alone. F3 then widened M2 to `challenge_gate._fail`, whose modes J30 established
      are reachable from the attacker-influenced content under review. TODAY the same close
      commits `inconclusive` and `directions_for` selects BOTH directions (executed on this
      base), so this is a real change in what shaped content can do. J30 remains recorded OPEN on
      its own O3 lane; this demand carries the training half the human minted it for, and if the
      honest answer is that exclusion stays correct, this is where that is written down."

  - id: a_gap_row_reaching_the_ticket_resolution_is_sanitized
    kind: negative
    form: test
    source: "J29 re-ground (executed); `20-demands` #7's dropped half; resolved HUMAN at §7 round 3 — 'mint the demand'"
    binds:
