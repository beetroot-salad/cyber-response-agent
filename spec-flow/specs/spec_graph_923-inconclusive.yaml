      human REFUSED narrowing the demand to the mechanism (it would ship two documented ways to
      pay with an invisible row) and REFUSED a second field-specific normalization spelling (a
      second spelling is how this repo's rules have already drifted). Extending the SHARED
      normalizer is the route; its existing callers need checking when it moves. Second axis:
      this bound the close alone where J1, J25 and J28 each bind both, and a confusable-blind
      write gate passing the whole suite is this module's own canonical fail-open.

