  # =========================================================================================
  # MINTED AT §7 ROUND 4 FROM A HUMAN'S DESIGN CHANGE, taken during the spec phase rather than
  # chosen from the options the round offered. **A MALFORMED VERDICT IS NEVER COERCED.**
  #
  # Today `_vocab.normalized_disposition` strips zero-width characters and answers with what a
  # human would SEE, while the two write gates deliberately do not use it and refuse instead —
  # each carries a comment saying so. The read side now aligns with the write side:
  #
  #   * WRITE — unchanged. Refuse, with actionable retry text, while there is an author to ask.
  #   * READ  — do not coerce and do not substitute a placeholder. Mark the run MALFORMED and
  #             leave it for human judgement.
  #
  # TWO IMPLEMENTATION POINTS ARE DELIBERATELY LEFT TO CODE REVIEW AND ARE NOT PINNED BELOW:
  # where the malformed mark lives (reuse the existing path for runs that are NOT CONSUMED
  # rather than invent a second one, so a person actually finds it), and that ONE malformed run
  # is skipped-and-flagged rather than stopping a batch — the learning loop reads many runs at
  # once.
  #
  # THIS CHANGES SHIPPED READ-PATH BEHAVIOUR and the merge-gate human should review it as a
  # design decision in its own right, not as a spec detail. Accepted, on the record: someone
  # shaping alert content can now make runs demand human attention rather than make them read
  # wrongly. That is the safe direction — loud instead of wrong — but it is a nuisance channel
  # and it is entered knowingly.
  #
  # IT ALSO DISSOLVES J24'S LOOSENING REGRESSION rather than patching it: the route that
  # resolution pointed at (a confusable fold inside the shared normalizer) would have made a
  # homoglyph spelling of a real member EQUAL to that member at four validating boundaries at
  # once. Nothing loosens now, because the shared reader stops coercing and the gap row gets
  # its own check — free text has no correct spelling to reject against.
  #
  # AND IT KILLS A FAKE ORACLE AT THE SOURCE. `directions_for` returns the same empty list for
  # an unknown verdict and for a deliberately untrained one, which is WHY the training
  # exclusion test was vacuous. Under this rule they are distinct states and that test
  # discriminates because the CODE does, not because the assertion was rewritten again.
  # =========================================================================================

  - id: a_malformed_verdict_is_refused_at_both_write_gates
    kind: parity
    form: test
    source: "§7 round 4 — human design change, the WRITE half"
    binds:
      - 'disposition.access[close-tool]'
      - 'disposition.access[report-frontmatter]'
      - 'interacts(close_investigation->disposition)'
      - 'interacts(decide_report_write->disposition)'
    discharged_by: test_a_malformed_verdict_is_refused_at_both_write_gates
    seed_docstring: >-
      A verdict that only READS as a member — zero-width characters inside it, or a homoglyph
      standing in for a letter — is refused at BOTH write gates with retry text an author can
      act on, and nothing is committed; the clean spelling of the same member is accepted at
      both. Already the shipped behaviour, pinned because the read half is implemented by
      moving the shared reader onto the gates' answer and the obvious way to write that patch
      is to move the gates onto the reader's instead.
    note: >-
      MUTATION-VERIFIED BY EXECUTION, per gate independently: routing either gate through
      `normalized_disposition` turns it red on the zero-width spelling. The write-side
      consequence is asserted at `the_price_keys_on_the_committed_keyword`: a malformed keyword
      must fail CLOSED at the price dispatch (it still OWES) rather than take the unpriced
      branch — executed, a build that removes the coercion and nothing else passes this demand
      and fails that one, which is the whole reason both are written down.

  - id: a_malformed_verdict_is_marked_not_coerced_on_read
    kind: coherence
    form: test
    source: "§7 round 4 — human design change, the READ half"
    binds:
      - 'interacts(report_reader->report_md)'
      - 'interacts(learning_validate->report_md)'
      - 'interacts(held_out->report_md)'
      - 'interacts(trace_lesson->report_md)'
      - 'interacts(ticket_lane->report_md)'
      - 'interacts(ticket_lane->disposition)'
    discharged_by: test_a_malformed_committed_verdict_is_marked_not_coerced
    seed_docstring: >-
      A committed verdict that is not a member of the vocabulary is never coerced into the
      member it resembles: every reader of the finished run gives it the SAME answer it gives a
      value that was never a member at all, none of them hands a member downstream, and the
      refusal quotes the raw bytes so the invisible character is visible to whoever judges it.
      The paired positive control is the clean spelling of the same member, read back as that
      member by every one of those readers.
    note: >-
      Bound per reader edge rather than at the vocabulary's own altitude, for this schema's own
      reason: a coherence demand at the source's altitude is green when two of three readers
      moved. WHERE the malformed mark is recorded and the batch-skip behaviour are NOT bound —
      the human left both to code review. MUTATION-VERIFIED: red at HEAD on the zero-width
      spelling (which reads back as `malicious` today), green on a build whose shared
      normalizer stops stripping.

  - id: an_unknown_verdict_and_an_untrained_one_are_distinct_states
    kind: domain-outcome
    form: test
    source: "§7 round 4 — human design change, the training-routing half; kills J6's fake oracle at the source"
    binds:
      - 'UNTRAINED_DISPOSITIONS'
      - 'UNTRAINED_DISPOSITIONS.domain.distinguished[unresolved]'
      - 'interacts(directions_router->disposition)'
      - 'interacts(directions_router->UNTRAINED_DISPOSITIONS)'
    discharged_by: test_an_unknown_verdict_and_a_deliberately_untrained_one_are_distinct_states
    seed_docstring: >-
      "This verdict trains nothing" and "I could not read this verdict" are DIFFERENT answers
      from the training router, and the host's own verdict is the first of them: `unresolved`
      routes exactly as the shipped deliberate exclusion `false-positive` does, and a garbage
      string or a malformed spelling of a real member routes as neither that nor a trainable
      member. Asserted as distinctness rather than as a shape, because the requirement is
      settled and the mechanism is not — raise, a typed result or a sentinel all satisfy it.
    note: >-
      THIS IS WHY `the_new_state_selects_no_training_direction` WAS VACUOUS, repaired in the
      CODE rather than in the assertion. `directions_for` gives one answer to two questions
      today, so `directions_for(unresolved) == []` is true on a build where M3 was never
      applied, true of a typo and true of a malformed report. MUTATION-VERIFIED: a build that
      adds the member to the untrained set and leaves the router as it is fails this; the
      design change plus a distinguishing router passes it.

structure:

  axes: []
  # DELIBERATELY EMPTY, and grounded rather than skipped. `10-brief.md`'s deferred-censuses
  # paragraph records that `spec-graph trace resource` was NOT run because none of the seven
  # shared roots this change touches is a path-interpolating write sink — they are value
  # domains (`DISPOSITION_VALUES`, `_DISPOSITION_GATES`, `UNTRAINED_DISPOSITIONS`,
  # `REPORT_CAUSES`), one frontmatter field, one document block, and one per-turn record whose
  # PATH this change does not touch. No writer below carries `interpolates:`, no boundary
  # claims an `identity` facet, and declaring a value domain under `specGraph.resources` would
  # put a non-path root in a path census. R2 therefore has nothing to fire on, and that is a
  # computed silence with a reason, not an omission.

  actors:

    # --- the change's own actors (provenance: design) -------------------------------------
    - {id: close_investigation,  frame: leg,         provenance: design}  # runtime/close_tool.py::close_investigation — M1's price gate (:390), M2's bypass (:414), M5's refusal, the commit (:452)
    - {id: challenge_gate,       frame: leg,         provenance: design}  # runtime/challenge_gate.py::challenge_gate — the three overrules (:399/410/416) and `_fail` (:311, six call sites)
    - {id: run_investigation,    frame: composition, provenance: design}  # runtime/driver/__init__.py — the retry-exhaustion limb (:301), `forced=True`; profile contextAliases.driver
    - {id: decide_write,         frame: leg,         provenance: design}  # skills/invlang/validate — the investigation.md write gate: _gating.py:290 price dispatch + _structure.py:531 vocabulary
    - {id: decide_report_write,  frame: leg,         provenance: design}  # defender/_artifact_schema.py:150-159 — the report.md frontmatter write gate. THE THIRD VALIDATING BOUNDARY, R6/M6
    - {id: directions_router,    frame: leg,         provenance: design}  # learning/core/directions.py::directions_for — M3
    - {id: visualize_runtime,    frame: leg,         provenance: design}  # scripts/visualize/visualize_runtime.py::_was_reviewed — M6; UNREVIEWED_DISPOSITION at :339

    # --- the grounded neighbourhood the change attaches to (provenance: code) --------------
