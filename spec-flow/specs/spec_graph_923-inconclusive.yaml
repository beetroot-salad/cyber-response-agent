      - 'ceiling_test.domain.distinguished[over-the-size-bound]'
    discharged_by: test_a_gap_row_reaching_the_ticket_resolution_is_sanitized
    seed_docstring: >-
      The ONE surface a `ceiling_test` row is not inert on. With `cause` absent the report BODY
      becomes the outbound ticket `resolution` — a field read back by a PERSON and by the judge
      model — and today the raw row lands there with its frontmatter delimiter, its spoofed
      second verdict and its injected instruction intact. SANITIZING IS NOT DELETION: the
      legitimate half of the row must still arrive in `payload["resolution"]` itself, on the
      same lane and in the same string the negatives are read off, and an ordinary gap claim
      with nothing hostile in it must arrive whole. The size bound is driven INTO this field
      rather than inherited — an over-bound claim is trimmed, and what survives is the HEAD of
      the claim rather than a substituted string, so truncation is visible as truncation. The
      second control is `cause` PRESENT, where the row provably cannot reach the field at all.
    note: >-
      MINTED AT §7 ROUND 3 (human). Every other sink was probed and HOLDS, and none of that is
      softened here: `split_frontmatter` never re-parses a second delimiter block, `format_map`
      does not re-substitute braces inside a substituted value, `json.dumps` escapes the payload
      correctly and the argv is list-form, and `evals/held_out` never reads the body. This is the
      residue. It has no demand today because `20-demands` #7 classified the design's Security
      asset paragraph `no-consequence` and kept only its report-field half — the paragraph's own
      statement also names the judge prompt and the HTTP egress, and that is the half J29's
      re-ground later fell into. M1 is what makes it routine: the entry price takes the population
      reaching this field from two fixture documents to every model-authored uncertain close.
      REPAIRED AT §7 ROUND 4 — THIS DEMAND WAS ITSELF VACUOUS, the third time a repair for
      vacuity was vacuous on this run. Its stated "cannot pass on an emptied channel" control
      read the committed report's own `ceiling_test` frontmatter — a different artifact on a
      different lane, which no sanitizer of the ticket resolution would touch — and phase F
      EXECUTED the build that exploits it: substituting any fixed host string for the
      cause-absent reason passed all seven assertions while the analyst's and the judge model's
      copy of the gap claim was gone. Both controls now read the payload the negative is about,
      and `over-the-size-bound` is exercised here for the first time (the only length assertion
      was already green at HEAD on a 347-character resolution). MUTATION-VERIFIED: the
      substituting build fails on the positive; a build that flattens, strips the
      parser-significant tokens and trims to a bound passes."

