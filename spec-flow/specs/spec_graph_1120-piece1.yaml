  boundaries:
    # ---- the acceptance frame (D1, O3)
    - id: accept_tenant
      provenance: design
      facets:
        # One cell per tenant-taking entry point after piece 1 (F8 closed by correction 3). The
        # constraint names are the design's; today's divergent per-surface constraints (brief,
        # "Sibling surfaces": run_start / launcher / sibling_run / policy_cli / ticket_adapter /
        # validate_scaffold / census_lint) are what the parity replaces (K7: held_out and
