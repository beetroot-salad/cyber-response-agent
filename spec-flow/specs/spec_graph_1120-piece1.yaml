# ==========================================================================================
# spec_graph_1120-piece1.yaml — issue #1120 "the tenant frame", write-tests PIECE 1 ONLY
# (doc Order step 1: D1 accept_tenant/Tenant, D2 settings under the data root, D7
# scaffold/setup/check, D9 fixture + census lint). Assembled at phase D (assembler leaf) from
# `.spec-flow/frontiers/10-brief.md`, `20-demands.md`, `45-dispositions.md`, the human's
# decisions `15-design-corrections.md` (H1-H3, which override the doc) and the re-ground
# `46-reground.md` (J-PO1/J-PO2); then RE-ASSEMBLED (the §7 fold) over `70-resolutions.md`
# (the human's M1-M11, N9, N12 and design changes DC1/DC2; auto N1-N19), `47-dc2-delta.md`
# (the per-demand keep/waiver/rewrite table, 5 mints, P-DC2-1) and `71-resolutions-addendum.md`
# (MF1 and NF1-NF8). Later inputs override earlier ones; 70/47/71 override 20 and 45.
# AUTHORITATIVE DESIGN TEXT: `.spec-flow/doc-1120.md` read through `15-design-corrections.md`
# and `70-resolutions.md` (DC1, DC2), scoped by `.spec-flow/scope-piece1.md`.
#
# READ THIS FIRST — the §7-resolved graph
#
# DC2 (human): setup never FETCHES knowledge — the operator clones the tenant repo on the host into
# <root>/<id>/knowledge and `tenant.py setup <id>` ADOPTS it: the one-tenant guard (MF1: its rowless
# inner scan admits exactly the name knowledge), then — V18 (human) states setup's rule — THE FOLDER
# RULES (links and special files, agent/.tenant-id presence + match, knowledge/'s top-level allow-list
# — V3 as widened by V12 and V15 —, the settings files parse, systems/case-history/mapping.yaml
# included, which run start does not read) + RUN START'S OWN READINESS FUNCTION
# (run_tenant.resolve_run_tenant: the grant table loads, gather holds a query verb, the lead-zero
# agreement — V14, superseding the rule lists of DC1 as refined by V1 and V10), then the row LAST
# (rules-first: a refused setup writes nothing). No --from, copy, staging, rename or git call. The grant gap is
# check's, never setup's (DC1: a gap does not stop runs, A1); so is "agent/.tenant-id is committed"
# (V11), which fails closed when git cannot answer (V16). (Was, before §7-verify: "then
# accept_tenant + the folder-intrinsic 'tables load' rule (DC1, NF1)" — overturned by V1/V10/V14.)
#
# demands   — 148 (106 form: test, 21 form: waiver, 21 form: clause), in eight blocks:
#               (1) the 48 of 20-demands.md, ids verbatim except NF8's renames; 3 waived (DC2).
#               (2) the 10 non-material mints of the first assembly, re-read under DC2 at §7
#                   (2 waived, several narrowed or renamed).
#               (3) the 17 formerly PROVISIONAL material-fork clauses — §7 decided every group:
#                   11 are form: test at the human's reading, 6 are form: waiver (DC2).
#               (4) 30 `sNNN` settled-premise pointers (discharged_by = the premise's own test
#                   name, for phase F's join by name); 10 waived (DC2), 3 rewritten.
#               (5) 21 `x1078_*` SUPERSEDING ENTRIES (H3) — the 20 of the first assembly plus 47's
#                   x1078_s7_j08_rowless_own_folder (MF1 supersedes pass-A J08's positive leg).
#                   spec-graph HAS NO SUPERSEDE VOCABULARY (claim PD2): no checked slot names a
#                   foreign graph's demand. So each entry is a `form: clause`, `kind: survival`
#                   demand binding THIS graph's substitute addresses, and the supersession —
#                   old graph, old demand id, old test, old address, the carrying demand here,
#                   and any part left uncarried — lives ONLY in its outcome.nl. No invented key.
#                   No checker joins these to the pass-A graph (red flag; handoff.deviations).
#               (6) 4 test MINTS of the fold (47 "Minted demands"): the adopt path, the absent
#                   knowledge/ refusal, the narrowed guard, the unreadable-entry refusal.
#               (7) 9 PHASE-E MINTS (the author, over 60-residue.md's open obligations):
#                   N17's selector usage error, check's all-withheld cell, the carriers of
#                   the two uncarried x1078 equalities (runs_base_for, the #1077 rename
#                   proof), the two H2 survival demands (replay harness, path-only
#                   tests), and the three R7 coherence demands (RunTenant, tenant_row,
#                   the nine settings loaders).
#               (8) 9 PHASE-E RE-WORK MINTS (§7-verify, 73-resolutions-verify.md, rounds 1
#                   to 3): the human's V2 as RELOCATED by V11 (a clone's uncommitted
#                   .tenant-id is check's finding), V3 as WIDENED by V12 and V15 (knowledge/'s
#                   top-level allow-list), V10 (setup refuses an all-withheld table), V14's
#                   three (setup refuses a health-check-only table; setup's refusal is run
#                   start's, word for word; setup reaches run start's readiness function) and
#                   V16 (check fails closed when git cannot answer), and the author items V5
#                   (a first setup's folder rules) and V7 (the box's uncovered-agent-half
#                   remedy). V1 and V4 rewrite existing demands in place.
#             Every WAIVER is `form: waiver` citing claim DC2 — never a drop — and names in its
#             outcome.nl the addresses it used to bind that left the structure with DC2. Every
#             REWRITE's new observable sits in a "§7 fold (47 row N ...)" comment above it (a
#             form: test demand is a pointer and may not carry outcome.nl). Old ids of NF8's
#             renames and old test names are in those comments.
#
# structure — the demand-implied address space (`provenance: design`) attached to the
#             grounded neighbourhood (`provenance: code`) of the brief: shared roots S1-S8,
#             the nine settings-half loaders (F14/G11) and five RunTenant consumers (F15/G23)
#             as UNMOVED readers (R7 asks each), and the removals as `mode: remove` edges from
#             their callers with the consumers the design does not re-wire in structure left
#             LIVE (R5 asks each for its survival demand): the two lints, the replay harness,
#             episodes_root, the TenantDirError catchers and the 58 path-only test files.
#             DC2 WITHDREW setup's fetch surface: tenant_source and knowledge_partial and
#             setup's edges to them, to git and to tenant_id_file are gone (not kept as dead
#             design); DC1 withdrew setup -> tenant.check. M7's two access cells are decided,
#             so no `unknown` remains. refuse_foreign_data_root is design-modified (MF1).
#
# claims    — 120 (106 + the gate leaf's GT1-GT4 + §7-verify's V1-V3, V10-V12, V14-V16 and V18): the brief's 78 (C1-C45 inherited `source: discuss` — 20-demands' 45 are the
#             same ids, folded, the brief's verdict governing C27/C28/C43 per corrections 1 and
#             4), 20-demands' K1-K20, 46-reground's J-PO1/J-PO2, PD1-PD3 (the first assembly),
#             and the fold's DC1, DC2 (discharge: what every waiver cites) and P-DC2-1 (47's
#             executed probe behind MF1, verbatim); V1-V3, V10-V12, V14-V16 and V18 are §7-verify's
#             human decisions (discharge reads of 73-resolutions-verify.md, rounds 1 to 4).
#
# gate      — holes written by the gate leaf (60-residue.md); obligations written by phase E:
#             22 entries over the residue's 27 open firings (R5's 7 firings fall on 2
#             elements), each discharged by a block-(7) mint; plus 8 R4 entries for the cells
#             §7-verify's V2/V11, V3/V12, V14 and V16 added, each discharged by a block-(8) mint.
#
# ==========================================================================================
# NAME RECONCILIATION — the brief (10), extraction (20) and the dispositions (45) coined ids
# independently; pass-A's ids are reused where the role is the same (the x1078_* entries name
# pass-A addresses, so the join must hold across both graphs). Keyed by role+origin:
#
#   brief S1 / profile tenant_root / 20 data_root, tenant_row      -> data_root (the root folder,
#        identity on tenant_id), tenant_row (<root>/<T>/tenant.json) — pass-A ids, same roles.
#   brief S2 / profile tenant_knowledge / 20 knowledge_dir, knowledge_partial
#        -> knowledge_dir (<T>/knowledge, operator-placed under DC2); knowledge_partial
#        (<T>/.knowledge.partial) WITHDRAWN by DC2, named only in the waivers' outcome.nl;
#        20 settings_half / agent_half kept (<T>/knowledge/{settings,agent}).
#   20 tenant_source (setup's --from)                                -> WITHDRAWN by DC2 (no --from).
#   brief S3 "the lab" / 20 tenants_root                           -> tenants_root (the checkout
#        lab root knowledge/tenants/). 20's four `--tenants-root` cells
#        `run.main.access[--tenants-root]`, `branch.cli.main.access[...]`,
#        `add_tenant_arguments.access[...]`, `sibling_argv.access[...]` are RE-COINED onto that
#        surface as `tenants_root.access[<lane>]`: the flag is the via, the root is what it reaches.
#   brief S4 / 20 tenant_template; brief S5 / 20 tenant_fixture    -> same ids.
#   brief S8 "the box's agent-half bind" / 20 start_box             -> start_box (code name).
#   20 EPISODES_BASE_ENV (the cli.py constant NAME)                  -> DEFENDER_EPISODES_BASE
#        (the knob, as pass-A and the profile spell it).
#   20 `caller` in interacts(caller->accept_tenant).response        -> run.main (a real driver).
#   20 tenant_dir                                                    -> tenant_dir HERE MEANS
#        `_tenants.tenant_dir`, the checkout-lab resolver D1 removes. It is NOT pass-A's
#        `tenant_dir` (TenantPaths.dir, the tenant folder); that folder is reached here as the
#        data_root identity cell / Tenant.dir. Same spelling, different element, across graphs.
#   pass-A TenantPaths (an ACTOR there)                              -> TenantPaths is a BOUNDARY
#        here: the removed PUBLIC class surface, target of `mode: remove` edges, so R5 computes
#        its live dependents. Under M4 the class survives PRIVATELY as pre_acceptance_guard.
#   accept_tenant, tenant.check                                      -> each is BOTH an actor
#        (it reads the row, the halves, the census) and a boundary (its access facet is the
#        refusal-parity surface the entry points reach). Same code name for both roles, on
#        purpose; check_gate keys actors and boundaries separately.
#   M4's pre-acceptance owner                                        -> pre_acceptance_guard, a
#        design boundary NAMED BY ROLE: M4 decided a private layout class in _tenant.py (J03 +
#        O11a in its constructor); its spelling is phase E's, so no symbol is coined here.
# axes: tenant_id only — the one key the shared root (data_root) interpolates.
# ==========================================================================================
schema_version: 2
design: '1120'   # gh issue #1120 piece 1 — .spec-flow/doc-1120.md read through
                 # .spec-flow/frontiers/15-design-corrections.md (H1-H3), scoped by scope-piece1.md
tests: defender/tests/tenant_1120_piece1   # DERIVED (claim PD3): check_binds and the null stub
                 # scan the named directory FLAT (glob('*.py')), so 20-demands' split homes
                 # (defender/tests/test_1120_*.py + defender/tests/e2e/test_1120_run_settings.py)
                 # cannot be one `tests:`. Every piece-1 test file lives in this one directory,
                 # pass-A's pattern (defender/tests/tenant_1078_pass_a); the e2e replay carries
                 # an in-file `pytestmark = pytest.mark.e2e` as tests/e2e files do.
base: a1c65801   # a1c658010436be63a1dee3d5daae9ee4830c36b8 — the spec branch's fork point
demands:
  # ======================================================================================
  # (1) 20-demands.md — the 48, ids verbatim except NF8's three renames (old id in the comment).
  #     §7 fold notes ("§7 fold (47 row N ...)") carry each REWRITE's new observable: a form: test
  #     demand is a pointer and may not carry outcome.nl, so the comment is where it lives until
  #     phase E writes it into the test's docstring.
  # ======================================================================================
  # ---- #0: the return-value contract. `provisional` DROPPED: F1 is N6 (non-material, auto),
  # reading (a) — tenant.row is the TenantRow, the row FILE's path is a separate property.
  # N16 (auto): a refusal renders the refused value escaped (repr-style) and bounded; entry
  # points pass that message through unchanged ("verbatim" = not re-worded).
  - {id: accept_tenant_return_contract, kind: behavior, form: test,
     binds: [accept_tenant, Tenant, "interacts(run.main->accept_tenant).response", tenant_row, TenantRefused],
     discharged_by: test_1120_accept_tenant_returns_a_frozen_tenant_whose_members_are_its_layout}
  # ---- D1: accept_tenant's checks, in order
  - {id: accept_tenant_check_order, kind: behavior, form: test, binds: [accept_tenant],
     discharged_by: test_1120_accept_tenant_reports_the_earliest_failing_check}
  # + control-chars (N16, auto): a control-character id is refused and rendered escaped.
  - {id: accept_refuses_bad_id, kind: domain-outcome, form: test,
     binds: ["tenant_id.domain.distinguished[../x]", "tenant_id.domain.distinguished[A]",
             "tenant_id.domain.distinguished[a/b]", "tenant_id.domain.distinguished[empty]",
             "tenant_id.domain.distinguished[64-chars]", "tenant_id.domain.distinguished[1abc]",
             "tenant_id.domain.distinguished[trailing-newline]",
             "tenant_id.domain.distinguished[control-chars]"],
     discharged_by: test_1120_accept_tenant_refuses_an_off_grammar_id_before_touching_the_root}
  # + missing-created-at (refused naming tenant.json) and extra-key (ACCEPTED, the key dropped):
  # N18 (auto) "follows today's code", made concrete by J-PO2 (46-reground, executed).
  - {id: accept_refuses_bad_row, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->tenant_row)", "tenant_row.domain.distinguished[absent]",
             "tenant_row.domain.distinguished[corrupt]", "tenant_row.domain.distinguished[other-tenant]",
             "tenant_row.domain.distinguished[directory]",
             "tenant_row.domain.distinguished[missing-created-at]",
             "tenant_row.domain.distinguished[extra-key]"],
     discharged_by: test_1120_accept_tenant_refuses_an_absent_corrupt_or_foreign_row}
  # §7 fold (47 row 5; N12 re-read under DC2): the ABSENT cell's TenantRefused names
  # <root>/<id>/knowledge and the remedy "clone the tenant repo into it, then tenant.py setup <id>"
  # (replacing `setup --from`); every entry point passes it through verbatim. The symlink, file and
  # tenant-dir-symlink cells are unchanged (N13: an operator-placed symlinked knowledge/ is refused here).
  - {id: accept_refuses_knowledge_not_real, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->knowledge_dir)", "knowledge_dir.domain.distinguished[absent]",
             "knowledge_dir.domain.distinguished[symlink]", "knowledge_dir.domain.distinguished[file]",
             "knowledge_dir.domain.distinguished[tenant-dir-symlink]"],
     discharged_by: test_1120_accept_tenant_refuses_a_knowledge_folder_that_is_not_a_real_unlinked_directory}
  - {id: accept_refuses_missing_half_or_setting, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->settings_half)", "interacts(accept_tenant->agent_half)", REQUIRED_SETTINGS,
             "settings_half.domain.distinguished[absent]", "agent_half.domain.distinguished[absent]",
             "settings_half.domain.distinguished[symlink]", "REQUIRED_SETTINGS.domain.distinguished[missing]",
             "REQUIRED_SETTINGS.domain.distinguished[directory]"],
     discharged_by: test_1120_accept_tenant_refuses_a_missing_half_or_required_settings_file}
  - {id: accept_refuses_links_in_halves, kind: negative, form: test,
     binds: ["interacts(accept_tenant->settings_half)", "interacts(accept_tenant->agent_half)",
             "settings_half.domain.distinguished[symlink-inside]", "settings_half.domain.distinguished[hardlink-inside]",
             "agent_half.domain.distinguished[symlink-inside]", "agent_half.domain.distinguished[hardlink-inside]"],
     discharged_by: test_1120_accept_tenant_refuses_a_symlink_or_hard_link_inside_either_half}
  - {id: accept_accepts_local_clone, kind: behavior, form: test,
     binds: ["knowledge_dir.domain.distinguished[local-clone-hardlinked-git]", "interacts(accept_tenant->knowledge_dir)"],
     discharged_by: test_1120_accept_tenant_accepts_a_plain_local_clone_whose_git_objects_are_hard_linked}
  # + nested-git (N15, auto, reading (a)): only knowledge/.git is skipped; a .git nested inside
  # a half is walked and its links refused. RE-WORK (73): driven over a real clone committing
  # .tenant-id, whose .github/ and .git are admitted top-level names (V3, widened by V12).
  - {id: accept_link_walk_scope, kind: domain-outcome, form: test,
     binds: ["knowledge_dir.domain.distinguished[link-outside-halves]", "agent_half.domain.distinguished[nested-git]"],
     discharged_by: test_1120_accept_tenant_walks_links_in_settings_and_agent_only}
  # Base cells (absent / other-id / exact match) + control-chars (N16). M8 decided (human, (a)): the
  # byte rule (at most one LF or CRLF, bounded read) is accept_tenant_id_file_byte_rule; under DC2 an
  # absent file is a folder-rule refusal naming it (setup writes nothing into knowledge/).
  - {id: accept_checks_tenant_id_file, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->tenant_id_file)", "tenant_id_file.domain.distinguished[absent]",
             "tenant_id_file.domain.distinguished[other-id]", "tenant_id_file.domain.distinguished[matching]",
             "tenant_id_file.domain.distinguished[control-chars]"],
     discharged_by: test_1120_accept_tenant_refuses_an_agent_tenant_id_that_is_absent_or_names_another_tenant}
  - {id: accept_refuses_settings_under_mounted_tree, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->defender_dir)", "box_mounted.domain.distinguished[contains-settings]",
             "defender_dir.domain.distinguished[contains-data-root]"],
     discharged_by: test_1120_accept_tenant_refuses_settings_under_defender_dir_or_a_box_mounted_path}
  - {id: accept_accepts_unversioned_folder, kind: domain-outcome, form: test,
     binds: ["knowledge_dir.domain.distinguished[plain-folder]"],
     discharged_by: test_1120_accept_tenant_accepts_an_unversioned_knowledge_folder}
  # ---- O3: one acceptance frame
  # N10 (auto): the census also reports dataclasses.replace(t, ...) and type(t)(...) — Tenant's
  # __post_init__ checks a module-private sentinel; copy/pickle of an accepted Tenant is allowed.
  - {id: o3_tenant_built_only_by_accept_tenant, kind: negative, form: test, binds: [Tenant, accept_tenant],
     discharged_by: test_1120_tenant_is_constructed_only_inside_accept_tenant}
  # N10 (auto): the census uses RESOLVED references (pyrefly / spec-flow:symbol-refs), so a
  # from-import alias and a module-attribute call count; getattr/importlib by string is the floor.
  - {id: o3_resolve_data_root_only_from_entry_points, kind: negative, form: test,
     binds: [resolve_data_root, run.main, branch.cli.main, held_out.main, tenant.setup,
             tenant.check, policy_cli.main, validate_scaffold.main, materialize_run,
             tenant_of_run_dir],
     discharged_by: test_1120_resolve_data_root_is_called_once_and_only_from_entry_points}
  # §7 fold (47 row 15; DC2, M7 decided, MF1 Q2 rules-first): F8 closed by correction 3 — the 8
  # tenant-taking entry points + tenant.py check (all four cells) + scaffold (bad-id cell only).
  # tenant.py setup's cells: the bad id, the knowledge link (ANY setup over a symlinked knowledge/,
  # first run or re-run — no longer F12's re-run-only construction) and the mounted tree; each exits 1
  # with accept_tenant's message verbatim and writes nothing (no row). Still no "no row" cell for setup.
  # M7 (human, "keep as they are") folds in from o3_matrix_fork_dependent_cells: validate_scaffold prints
  # accept_tenant's refusal as its WARN, skips that tenant's config check and reads nothing of it;
  # policy_cli takes a tenant for gather only; every row that resolves the data root gains the
  # learning-state-overlap cell (scaffold's row keeps the bad-id cell only). The two M7 access cells now
  # carry decided constraints, so binding them no longer silences an unknown.
  - {id: o3_entry_point_refusal_matrix, kind: parity, form: test,
     binds: ["accept_tenant.access[run.main]", "accept_tenant.access[branch.cli.main]",
             "accept_tenant.access[tenant.setup]", "accept_tenant.access[tenant.check]",
             "accept_tenant.access[tenant.scaffold]",
             "accept_tenant.access[policy_cli.main]", "accept_tenant.access[validate_scaffold.main]",
             "DEFENDER_DATA_ROOT.domain.distinguished[learning-state-overlap]"],
     discharged_by: test_1120_every_tenant_taking_entry_point_refuses_what_accept_tenant_refuses}
  # HELD-OUT-NO-TENANT (human, PR #1157): held_out takes no tenant, so its half went first;
  # GENERATE-CASE-REMOVED (human, PR #1157) then removed the other subject.
  - id: o3_no_row_only_acceptance
    kind: behavior
    form: waiver
    binds: [accept_tenant]
    cites: [C-GC1]
    outcome:
      nl: >-
        WAIVED: both subjects are gone (human, PR #1157). held_out takes no tenant
        (HELD-OUT-NO-TENANT) and generate_case is removed (GENERATE-CASE-REMOVED: "Remove
        generate_case"), so no entry point accepts a tenant by its row alone; run.py's refusal of
        a row without knowledge is the O3 matrix's. Was form: test, discharged_by
        test_1120_held_out_and_generate_case_refuse_a_tenant_with_a_row_but_no_knowledge.
  # ---- D1: removals, plumbing, survivals
  # + request_tenant (F11, non-material, auto: removed; held_out/generate_case call accept_tenant).
  # The four --tenants-root cells re-coined onto tenants_root (NAME RECONCILIATION).
  - {id: d1_removed_symbols, kind: negative, form: test,
     binds: [default_tenants_root, entry_tenant, entry_tenant_args, TenantDir, tenant_dir, TenantPaths, request_tenant,
             "tenants_root.access[run.main]", "tenants_root.access[branch.cli.main]",
             "tenants_root.access[add_tenant_arguments]", "tenants_root.access[sibling_argv]", template_dir],
     discharged_by: test_1120_the_tenants_root_surface_is_gone_and_template_dir_stays}
  - {id: d1_operator_commands_read_data_root_settings, kind: coherence, form: test,
     binds: ["interacts(policy_cli.main->settings_half)",
             "interacts(validate_scaffold.main->settings_half)"],
     discharged_by: test_1120_operator_commands_read_the_data_root_tenants_settings_not_the_checkouts}
  # F17 (auto): Tenant.id; RunTenant.tenant_id stays as a delegating property.
  - {id: d1_run_tenant_carries_tenant, kind: shape, form: test,
     binds: [RunTenant, Tenant, "interacts(run.main->RunTenant)"],
     discharged_by: test_1120_run_tenant_is_the_accepted_tenant_plus_its_grants_and_dispatch}
  - {id: d1_child_process_reaccepts, kind: behavior, form: test,
     binds: [sibling_argv, "drives(branch.cli.main->run.main)", DEFENDER_DATA_ROOT],
     discharged_by: test_1120_a_child_gets_the_tenant_id_inherits_the_data_root_and_re_accepts}
  - {id: d1_no_tenant_value_in_box_env, kind: negative, form: test, binds: [BOX_ENV_ALLOWLIST],
     discharged_by: test_1120_no_tenant_or_data_root_key_enters_the_box_env}
  # Core (record locations flagged; settings/knowledge/agent joins clean). M5 decided (human, (a)):
  # the per-attribute owner table; the factory-local and RunTenant.tenant-chain tagging is
  # d1_owner_lint_tags_accept_tenant_locals_and_chains.
  - {id: d1_owner_lint_scopes_record_locations, kind: behavior, form: test,
     binds: [lint_run_records, _OWNER_CLASS_ORIGINS, Tenant],
     discharged_by: test_1120_run_records_lint_owns_tenant_record_locations_but_not_knowledge_settings_or_agent}
  # §7 fold (47 row 23; DC2, M4 decided): `tenant.py setup acme` (no --from) with DEFENDER_DATA_ROOT
  # inside the checkout's defender/ and an adopted acme/knowledge placed there exits 1, [tenant.py]
  # naming the defender/ tree; no row is written and knowledge/ is byte-identical (the guard refuses
  # AFTER the operator's placement and never removes it — red flag, handoff.deviations). Positive
  # control: <checkout>/.defender-data with an adopted knowledge/ exits 0. held_out and the launcher
  # are d1_pre_acceptance_guards_on_every_path's. Grown binds: pre_acceptance_guard (M4's private
  # layout class carries O11a), knowledge_dir (the byte-identical pin).
  - {id: d1_o11a_survives_absorption, kind: survival, form: test,
     binds: [tenant.setup, create_tenant, accept_tenant, pre_acceptance_guard,
             "defender_dir.domain.distinguished[contains-data-root]", knowledge_dir],
     discharged_by: test_1120_a_data_root_inside_the_checkouts_defender_tree_is_still_refused}
