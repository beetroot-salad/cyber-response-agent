  # ======================================================================================
  # (8) PHASE-E RE-WORK MINTS (§7-verify, 73-resolutions-verify.md, over 92-reconciliation.md's
  #     findings; round 2 over the author's re-work red flags): the human's V2 (relocated by V11),
  #     V3 (widened by V12) and V10, and the author items V5 and V7. Each observable lives in its
  #     test's docstring (a form: test demand is a pointer).
  # ======================================================================================
  # V2 (human; overrides NF4; D4's committed-.tenant-id rule) as RELOCATED by V11 (human, 73 round
  # 2): the rule is CHECK's. A git clone whose agent/.tenant-id holds the right bytes but is not what
  # its repo's HEAD commits (never added, staged only, or the wrong tenant's committed id overwritten
  # by hand): a row-less first setup exits 0 and writes the row, accept_tenant returns a Tenant
  # (presence + match only, no git call — M8, V11); `check <id>` exits 1 naming agent/.tenant-id,
  # also with GIT_DIR exported at a repo that DOES commit it (J-PO1: the answer is the clone's own
  # repo's); `check --folder <knowledge>` over the clone (a git work tree, as in tenant CI) exits 1
  # naming it; the clone's git state is untouched. A committed clone checks clean both ways; a plain
  # folder (not a git work tree) checks clean with --folder. RENAMED from
  # accept_refuses_an_uncommitted_tenant_id_in_a_clone (test was
  # test_1120_accept_tenant_refuses_a_clones_tenant_id_that_its_repo_does_not_commit).
  - {id: d7_check_refuses_an_uncommitted_tenant_id_in_a_clone, kind: domain-outcome, form: test,
     binds: ["interacts(tenant.check->tenant_id_file)", "interacts(tenant.check->git)",
             "tenant_id_file.domain.distinguished[untracked-in-clone]",
             "tenant_id_file.domain.distinguished[staged-in-clone]",
             "tenant_id_file.domain.distinguished[modified-in-clone]",
             "git.domain.distinguished[exported-git-dir]", "tenant.check.access[id]",
             "tenant.check.access[folder]", tenant.setup],
     cites: [V2, V11, J-PO1],
     discharged_by: test_1120_check_refuses_a_clones_tenant_id_that_its_repo_does_not_commit}
  # V3 (human; replaces M9 5(i) under DC2; overrides NF7) as WIDENED by V12 (human, 73 round 2): the
  # folder rules refuse any top-level entry of knowledge/ outside settings/, agent/, .github/, .git,
  # README.md, .gitignore and .gitattributes, naming it — accept_tenant, `check <id>`, `check
  # --folder` (a folder rule needs no data root) and a row-less first setup (writes nothing); the
  # census lint's cell is d9_lint_and_check_share_one_rule's. Refused cells: .env, secrets/, docs/. A
  # clone holding exactly the seven names (README.md, .gitignore, .gitattributes committed) is
  # accepted. Test renamed from
  # test_1120_accept_tenant_refuses_a_knowledge_entry_other_than_settings_agent_github_and_git.
  # WIDENED by V15 (human, 73 round 3; A6): archive/ is admitted too (the lab repo's archive, outside
  # both halves, never mounted) — the accepted control clone holds the EIGHT names, a file committed
  # under archive/ among them.
  - {id: accept_refuses_an_extra_top_level_knowledge_entry, kind: domain-outcome, form: test,
     binds: ["interacts(accept_tenant->knowledge_dir)", "knowledge_dir.domain.distinguished[extra-top-level-entry]",
             "knowledge_dir.domain.distinguished[allow-listed-top-level-file]",
             "knowledge_dir.domain.distinguished[local-clone-hardlinked-git]", tenant.setup,
             "tenant.check.access[id]", "tenant.check.access[folder]"],
     cites: [V3, V12, V15],
     discharged_by: test_1120_accept_tenant_refuses_a_knowledge_entry_outside_the_allow_list}
  # V10 (human, 73 round 2; extends V1 over M6): an all-withheld table grants gather nothing, so
  # require_gather_query refuses every run — setup ("can it run?") refuses it: a first setup and a
  # re-run each exit 1 naming settings/verb-grants.yaml, writing nothing (the first run's refusal not
  # the guard's); check ("is it well-formed?", M6) over the same finished tenant exits 0.
  # RE-WORK (73 round 3) V14 (human) keeps this cell and supersedes V10's rule ("gather granted") with
  # run start's own predicate (gather holds a query verb) — see the three V14 demands below.
  - {id: d7_setup_refuses_an_all_withheld_table, kind: domain-outcome, form: test,
     binds: [tenant.setup, "grant_census.access[setup]", "grant_census.domain.distinguished[all-withheld]",
             "tenant.check.access[id]", tenant_row],
     cites: [V10],
     discharged_by: test_1120_setup_refuses_an_all_withheld_table_that_check_accepts}
  # RE-WORK (73 round 3) V14 (human, 92r2 #1; SUPERSEDES V1's and V10's rule lists): setup calls run
  # start's own readiness function. The executed case: the template's table with its health-check rows
  # granted to gather — total, lead-zero clean, not all-withheld, yet require_gather_query refuses
  # every run. A first setup and a re-run each exit 1 naming settings/verb-grants.yaml, writing nothing
  # (the first run's refusal not the guard's); check <id> and check --folder over the same finished
  # tenant exit 0 (M6: well-formed).
  - {id: d7_setup_refuses_a_health_check_only_table, kind: domain-outcome, form: test,
     binds: [tenant.setup, "grant_census.access[setup]", "grant_census.domain.distinguished[health-check-only]",
             "tenant.check.access[id]", "tenant.check.access[folder]", tenant_row],
     cites: [V14],
     discharged_by: test_1120_setup_refuses_a_health_check_only_gather_grant_that_check_accepts}
  # V14 parity ("any run-start refusal is setup's refusal, named"): over one finished tenant whose table
  # gather can query nothing through (health-check only; all withheld), the production
  # require_gather_query's message over the production run_grants is the oracle — setup exits 1
  # carrying it verbatim and writes nothing, and the REAL run.main (seams recording) refuses carrying
  # it verbatim before preflight, materialize or lifecycle. The lead-zero half is V1's cells.
  - {id: d7_setup_refusal_is_run_starts_own, kind: domain-outcome, form: test,
     binds: ["interacts(run.main->run_tenant.resolve_run_tenant)", run.main, tenant.setup,
             "grant_census.domain.distinguished[health-check-only]",
             "grant_census.domain.distinguished[all-withheld]"],
     cites: [V14],
     discharged_by: test_1120_setup_refuses_what_run_start_refuses_in_run_starts_own_words}
  # V14 census: a resolved-reference call graph of defender/ (tests excluded) and scripts/ finds a path
  # from tenant.py's setup function to run start's readiness function (today
  # runtime/run_tenant.resolve_run_tenant), directly or through any helper; its positive control is
  # run.main's own path to it; planted in a tmp copy of tenant.py, an aliased call and a helper chain
  # are found and a hand-copied rule list (run_grants + require_gather_query + correlation_dispatch)
  # is NOT.
  - {id: d7_setup_reaches_run_start_readiness, kind: behavior, form: test,
     binds: ["interacts(tenant.setup->run_tenant.resolve_run_tenant)", run_tenant.resolve_run_tenant,
             tenant.setup, run.main],
     cites: [V14],
     discharged_by: test_1120_setup_reaches_run_starts_own_readiness_function}
  # RE-WORK (73 round 3) V16 (human, 92r2 #3): when check's committed-.tenant-id git read cannot answer
  # about a SOUND clone (its repo commits acme's id), check <id> and check --folder <clone> each exit 1
  # naming "cannot verify .tenant-id is committed" and git's reason — never a skip, never exit 0. Cells:
  # no git on PATH; the clone owned by another uid, refused by git as dubious ownership (built with
  # chown: runs only as root, skipped in CI); a .git/config git cannot parse (any git error). A re-run
  # of setup in the same state exits 0 and writes nothing (no git call, V11); repaired, both checks
  # exit 0.
  - {id: d7_check_fails_closed_when_git_cannot_answer, kind: domain-outcome, form: test,
     binds: ["interacts(tenant.check->git)", "git.domain.distinguished[absent]",
             "git.domain.distinguished[dubious-ownership]", "git.domain.distinguished[read-error]",
             "tenant.check.access[id]", "tenant.check.access[folder]", tenant.setup],
     cites: [V16, V11],
     discharged_by: test_1120_check_fails_closed_when_git_cannot_say_the_tenant_id_is_committed}
  # V5 (92 #3; MF1 Q2 rules-first, NF6, 47 row 15 and P3): over a row-less own folder, a FIRST setup
  # exits 1 naming the path — a symlinked knowledge/ (to a valid folder), a file knowledge/, a symlink
  # in settings/, a hard link in agent/, a FIFO in settings/ (never opened), an unparseable
  # lead-zero.yaml or mapping.yaml — the refusal never the one-tenant guard's, no row, the data-root
  # census unchanged; the fixture placed as-is sets up.
  # V18 (human, 73 round 4, on 92r3 #1): the mapping.yaml cell STAYS. Run start's readiness function
  # accepts an unparseable mapping.yaml (92r3 #1, executed: only case_ticket._load_mapping refuses it,
  # on --update-ticket, after the run dir is materialized), so the cell pins the FOLDER rule "the
  # settings files parse", carried by accept_tenant.access[tenant.setup] (now bound here) — not by
  # grant_census.access[setup], which V14 made [run-start-readiness].
  - {id: d7_setup_first_run_applies_every_folder_rule, kind: domain-outcome, form: test,
     binds: [tenant.setup, "interacts(tenant.setup->accept_tenant)", "knowledge_dir.domain.distinguished[symlink]",
             "knowledge_dir.domain.distinguished[file]", "settings_half.domain.distinguished[symlink-inside]",
             "agent_half.domain.distinguished[hardlink-inside]",
             "settings_half.domain.distinguished[non-regular-entry]", "grant_census.access[setup]",
             "accept_tenant.access[tenant.setup]", refuse_foreign_data_root, tenant_row],
     cites: [V18],
     discharged_by: test_1120_a_first_setup_applies_every_folder_rule_before_it_writes_the_row}
  # V7 (92 #5; F13's refusal-wording consequence): with docker-outside-of-Docker shared mounts that
  # cover the run dir and the defender dir but not the tenant's agent half, composing the box refuses
  # (BoxFault) naming the agent half, its remedy naming DEFENDER_DATA_ROOT and never "the tenants
  # root" (_lifecycle.py's remedy text today); the same tenant under the shared mount composes.
  - {id: d2_box_refusal_names_the_data_root_for_an_uncovered_agent_half, kind: behavior, form: test,
     binds: [start_box, agent_half, DEFENDER_DATA_ROOT],
     discharged_by: test_1120_an_agent_half_off_every_shared_mount_is_refused_naming_the_data_root_not_the_tenants_root}
