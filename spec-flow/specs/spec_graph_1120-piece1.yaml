gate:
  # spec-graph gate --residue computed 126 firings (R3 19, R4 73, R5 18, R7 16); the full
  # per-firing routing table lives in 60-residue.md. This block credits what an existing
  # demand already discharges (`pre_discharged`) and records the judgment rules' verdicts
  # (`evaluated`). Genuinely open items (obligation/hole with no existing demand to point
  # at) are NOT written here — check_lint requires `discharged_by`/`resolved_to` to resolve
  # to an existing demand, and minting is §7/phase E's job, not this leaf's; they stay in
  # 60-residue.md only, so `spec-graph gate` (bare) still reports them as UNANSWERED and
  # that is the residue file's routed answer to why, not an oversight.
  evaluated:
  - {rule: R0, fired: true}    # judgment: N17's usage-error sentence unbound (hole below); two x1078
                                # clauses (runs_base_for==Tenant.runs, the #1077 rename proof) self-flagged
                                # "gap for the gate leaf" at line 2683 — both routed as obligations, 60-residue.md
  - {rule: R1, fired: false}   # 0 triggers computed — no `sends` edge into a payload facet in the delta
  - {rule: R2, fired: false}   # 0 triggers computed — tenant_row has no identity facet (domain only), so
                                # create_tenant's serial single-writer shape never reaches R2's predicate;
                                # N1's residual (two concurrent first setups racing the row) is instead
                                # covered directly by test_1120_two_concurrent_first_setups_leave_one_row_and_one_refusal_naming_it
  - {rule: R3, fired: true}    # 19/19 firings pre-discharged by exact access-cell binds — see pre_discharged
  - {rule: R4, fired: true}    # 72/73 firings pre-discharged by exact domain-cell binds; 1 open
                                # (grant_census.domain.distinguished[all-withheld], M6-answered, 60-residue.md)
  - {rule: R5, fired: true}    # 11/18 firings genuinely discharged (see pre_discharged — NOT via
                                # d1_removed_symbols, which is a negative/removal-only test and does not
                                # itself prove a dependent's workflow survives); 7 open (tenant_dir's
                                # replay_harness dependent, tenants_root's path_only_tests dependent) —
                                # `spec-graph gate` reads these as answered anyway (d1_removed_symbols's
                                # root-level binds satisfy the loose non-exact match); 60-residue.md
                                # flags the gap the mechanical check cannot see.
                                # Tightening half considered: M4's private layout class constructor
                                # (pre_acceptance_guard) is safe-by-construction — d1_pre_acceptance_guards_on_every_path
                                # asserts every one of its 5 callers (create_tenant, require_tenant,
                                # tenant_of_run_dir, tenant.setup, accept_tenant) runs the guard before
                                # any read; MF1's guard tightening is covered by
                                # d7_guard_admits_only_the_placed_knowledge_in_a_rowless_own_folder.
  - {rule: R6, fired: true}    # judgment: walked every refusal-text sink whose chooser is operator/
                                # attacker-influenced (tenant id, entry names inside settings/agent,
                                # tenant_id_file bytes, clone paths). Sanitizer is uniform: N16's
                                # escape(repr-style)+bound policy, already exercised by
                                # accept_refuses_bad_id, accept_tenant_id_file_byte_rule,
                                # accept_names_an_unreadable_entry and d1_refusal_catchers_take_tenant_refused.
                                # No frame slot (a refusal's literal template text) takes an
                                # attacker/model-chosen value raw — no new obligation.
  - {rule: R7, fired: true}    # 16/16 firings open — coherence demands not yet minted; 60-residue.md
                                # groups them into 3 proposed mints (RunTenant x4, tenant_row x3,
                                # settings_half x9); `spec-graph gate` reports all 16 UNANSWERED, correctly.
  - {rule: R8, fired: false, cites: [GT3]}   # judgment: searched for a reader that keys/joins on a
                                # field whose shape or derivation this delta changes (dict index, a
                                # correlation across two artifacts) — found none; RunTenant.tenant's type
                                # change (TenantPaths -> Tenant, M4/M5) and tenant_row's unchanged shape
                                # (N18) are read, not keyed, everywhere a reader touches them (R7 already
                                # routes the readers). See claim GT3.
  pre_discharged:
  - {rule: R3, element: 'accept_tenant.access[run.main]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[branch.cli.main]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[held_out.main]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[tenant.setup]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[tenant.check]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[tenant.scaffold]', by: o3_entry_point_refusal_matrix, cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[policy_cli.main]', by: [o3_entry_point_refusal_matrix, o3_matrix_fork_dependent_cells], cites: [GT1]}
  - {rule: R3, element: 'accept_tenant.access[validate_scaffold.main]', by: [o3_entry_point_refusal_matrix, o3_matrix_fork_dependent_cells], cites: [GT1]}
  - {rule: R3, element: 'tenants_root.access[run.main]', by: d1_removed_symbols, cites: [GT1]}
  - {rule: R3, element: 'tenants_root.access[branch.cli.main]', by: d1_removed_symbols, cites: [GT1]}
  - {rule: R3, element: 'tenants_root.access[add_tenant_arguments]', by: d1_removed_symbols, cites: [GT1]}
