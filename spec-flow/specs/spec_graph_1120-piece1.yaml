        access:
          constraints_by_via:
            run.main:            {trust: operator, constraints: [accept-tenant-checks, box-mounted-runs, grants-load, require-gather-query, lead-zero-agreement]}
            branch.cli.main:     {trust: derived,  constraints: [runs-base-record-id, accept-tenant-checks, episodes-base-refusal]}
            tenant.setup:        {trust: operator, constraints: [one-tenant-guard, accept-tenant-checks, settings-files-parse, run-start-readiness]}   # V18 (human, 73 round 4): setup = run start's own readiness function (V14) + the folder rules (accept-tenant-checks: links and special files, .tenant-id presence + match, the top-level allow-list; settings-files-parse: mapping.yaml included, which run start does not read); never check's census; rules first, then the row (MF1 Q2). Was [one-tenant-guard, accept-tenant-checks, tables-load] (DC1/NF1, pre-V1)
            tenant.check:        {trust: operator, constraints: [accept-tenant-checks, grant-census]}
            tenant.scaffold:     {trust: operator, constraints: [tenant-id-grammar]}
            # M7 DECIDED at §7 (human, 70-resolutions: "keep as they are"; was `unknown`, correction 3):
            policy_cli.main:        {trust: operator, constraints: [accept-tenant-checks, gather-role-only]}
            validate_scaffold.main: {trust: operator, constraints: [accept-tenant-checks, advisory-warn-verbatim, skips-tenant-config-check]}
    - {id: Tenant, provenance: design, facets: {}}               # frozen (id, data_root, row) + nine path properties (D1)
    - {id: TenantRefused, provenance: code, facets: {}}          # _tenant.py:56; accept_tenant's single refusal type
    - {id: RunTenant, provenance: design, facets: {}}            # = Tenant + RunGrants + CorrelationDispatch|None (D1); modified
    - {id: pre_acceptance_guard, provenance: design, facets: {}} # M4 DECIDED (human): the PRIVATE layout class in _tenant.py that TenantPaths becomes, J03 + O11a in its constructor; NAMED BY ROLE, its spelling is phase E's
    - {id: run_tenant.resolve_run_tenant, provenance: code, facets: {}}   # run start's own readiness function (V14); also an actor above — setup and run.main invoke it
    # ---- the id, the row, the root
    - id: tenant_id
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "A tenant id matches ^[a-z][a-z0-9-]{0,62}$ under re.fullmatch (TenantId, unchanged by piece 1, S262); there is no default. Token members: 63-chars and 64-chars are grammar ids of that length, empty is the empty string, trailing-newline is 'acme' plus a newline, control-chars an id carrying an escape character (N16)."}
          default: null
          distinguished: ['../x', 'A', 'a/b', 'empty', '63-chars', '64-chars', '1abc', 'trailing-newline', 'control-chars']
          falsy_valid: false
          documented_alternatives: []
    - id: tenant_row
      provenance: code
      facets:
        domain:
          type: file
          refinement: {nl: "<root>/<T>/tenant.json, the TenantRow (a frozen pydantic model); unchanged by piece 1 (N18). J-PO2: an extra key is dropped and accepted; a missing created_at is refused as TenantRefused naming the file. unwritable-folder: <root>/<id>/ (made by the operator's clone) not writable by setup's user, so the row cannot be created (s033, DC2)."}
          default: null
          distinguished: ['absent', 'corrupt', 'other-tenant', 'directory', 'missing-created-at', 'extra-key', 'unwritable-folder']
          falsy_valid: false
          documented_alternatives: []
    - id: data_root
      provenance: code
      facets:
        identity:
          key_axes: [tenant_id]
          evidence: {nl: "One folder per tenant, <data root>/<tenant id>/, read off D1's layout table (Tenant.dir is data_root/id) and today's create_tenant (_tenant.py:276, guarded_mkdir of <root>/<id>); the operator-placed knowledge/ sits under the same <root>/<id>/ (DC2; the operator's clone creates <root>/<id> itself, P-DC2-1 leg C). The one-tenant guard (C6, K3) keeps the root single-entry in piece 1 (N1, decision 7); its rowless inner scan admits exactly knowledge (MF1)."}
          derivations: []
          sharing: unique-key
    - id: DEFENDER_DATA_ROOT
      provenance: code
      facets:
        domain:
          type: path
          refinement: {nl: "Required, absolute, resolved once per entry point by resolve_data_root (the only reader, G18), which also refuses an overlapping DEFENDER_LEARNING_STATE_DIR (F9) until D11. unset and empty are refused naming the variable; there is no default."}
          default: null
          distinguished: ['unset', 'empty', 'relative', 'symlink', 'inside-defender', 'learning-state-overlap']   # missing-parent (J07) and unwritable-parent left with setup's own root creation (DC2; 47 rows 31, 88, 124)
          falsy_valid: false
          documented_alternatives:
            - {value: /workspace/.defender-data, crosses_validation: true}   # devcontainer compose:28 (C14): under the checkout, outside defender/
    # ---- the knowledge folder (profile tenant_knowledge; brief S2) — NEW under the data root (D2), OPERATOR-PLACED (DC2)
    - id: knowledge_dir
      provenance: design
      facets:
