# spec_graph_1080-scripts-split.yaml — issue #1080 (scripts split: defender/scripts/ keeps entry points only)
# Assembled at write-tests phase D (assembler leaf) from .spec-flow/frontiers/10-brief.md (A-ground),
# 20-demands.md (A-extract), 45-dispositions.md (C-judge) and 46-reground.md (C-reground). Base 80888efb.
#
# STATUS: section 7 is RESOLVED (2026-10-03, human via AskUserQuestion; every decision matched the judge's recommendation).
# Record: .spec-flow/frontiers/70-resolutions.md. The material forks M-A..M-H and dF0 are closed. A demand or structure element that
# existed only under a provisional reading no longer carries `provisional: true`; a demand's `rides:` names the fork that governed it
# and a structure element's `resolved_fork:` the same. handoff.forks carries each fork's reading taken and `resolved_by: human | auto`;
# every gate.holes entry carries its `resolution`; gate.obligations carries OB1-OB10.
#
# SCOPE CUT (2026-10-04, human; decomposition): #1080 ships the reshaping half only. 112 of the 237 demands are PARKED with owner issues
# (the 108 of 95-cut.md, plus s106, s107, s136 and s202, parked on the spine's decision after the author's first pass; a `parked:` block on
# each demand; the schema has no parked state, so this is a free-form key). 125 stay: 117 tests, 3 clauses and 5 waivers (the 2 F4 waivers
# minted at round 2 among them). Kept demands that need a suite edit carry `cut_edit:`, and a `parked_cells:` block (94 F-1/F-2) holding
# their pre-cut seed, the binds the kept test no longer exercises and the pre-cut test under spec-flow/specs/parked/1080/pre_cut/; their
# seed_docstring and binds state only what the IN half must do. Structure and gate entries whose boundary is an OUT module are
# kept (parked demands still bind them) and annotated. Round-2 record: .spec-flow/frontiers/75-resolutions-r2.md; the cut: 95-cut.md.
#
# NAME RECONCILIATION (boundary ids unified by role + origin across the three coining passes:
# grounding's S-ids, extraction's binds, the judge's premise anchors):
#   S1  run_dir          -> run_dir, plus the run-scoped records it holds: executed_queries
#                           (query rows, serialized-append on run_id), gather_raw (payload files, unique
#                           on run_id/lead_id/seq), runtime_html (the run page record, unique on run_id).
#                           20-demands' run_dir_tables_808 is the TEST suite, kept as its own id.
#   S2  runs_base        -> runs_base.
#   S3  run_mirror       -> run_mirror (the mirrored page tree, the shared root) AND mirror_root (the
#                           function in visualize_run that derives it; moves) — two roles, two ids.
#   S4  episode_dir      -> episode_dir.     S5 wire_log, S6 session_store, S7 ticket_store -> same ids.
#   S8  tenant_settings  -> one id, dual-role: the runtime module (actor: it reads the tenant settings
#                           tree) and the settings tree / module surface (boundary) importers reach.
#   S9  lessons corpus   -> lessons_content (the defender/lessons/ folder; undeclared in the profile on
#                           purpose — the brief's reason holds); lessons_engine is the NEW home of the
#                           lessons_fm/lessons_frontier engine (outside defender/lessons/, dF9).
#   S10 elastic_corpus   -> elastic_corpus (the tenant data the Elastic adapter reads; unchanged) vs
#                           elastic_integration (the NEW product Elastic module, M-C) — two ids.
#   Dual-role ids (actor and boundary, same module): sql, faults, visualize_run, visualize_episode,
#     lessons_fm, lessons_frontier, workspace_map, payload_view, record_query, append_query_row,
#     persist_payload, _venv, _mirror_write, _stub_transport, ticket_writer, case_ticket, verbs,
#     tenant_settings, defender_sql, defender_lessons.
#   Location-derived values keep a module-qualified id (visualize_primitives.REPO_ROOT,
#     lessons_fm.REPO_ROOT, _venv._DEFENDER_DIR, ...); a dropped __main__ block is <module>.__main__.
#   confinement.py's split: guard_outbound / confine_read_endpoint / normalize_endpoint / ... move with
#     the generic check (integrations); READ_ENDPOINT_ALLOWLIST and confine_host_state_call are the
#     M-B remainder (two ids so the fold can place each half). guard_outbound carries the access facet.
#   record_query's split: record_query (the module and its readers' surface) vs append_query_row and
#     persist_payload (the row/payload writers M-E places) vs QUERY_ROW_COLUMNS / *_QUERY_ID / ... (the
#     flat-tier query rules that keep byte-identical values, dF11).
#   J-PO3's launchers -> the access vias on sql and lessons_fm: box-bash, host-bash (attacker-influenced
#     model-written commands), orient-shim (derived), operator-shell (M-H (a): the wrapper's one import-root bootstrap).
#   45 M-x <-> 20-demands dF: M-A = dF1 + dF2 (brief RX1); M-B = brief RX2 (no dF); M-C = dF6;
#     M-D = dF4; M-E = dF5; M-F = dF8; M-G = dF7; M-H relates to dF3 (and conflicts with its wording).
#   axes: run_id, lead_id, seq, episode_id, tenant — declared once; every identity key_axes names them.
#
