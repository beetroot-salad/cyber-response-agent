     # declares (`fakesys`).

  # ---- deliberate prose deferrals: clauses, not tests ----

  - id: fixture_repos_declare_their_systems
    kind: coherence
    form: clause
    binds: [adapters_dir, skills_tree, catalog_dir, harness_lead,
            "interacts(harness_lead->skills_tree)"]
    outcome:
      nl: >-
        Every shared fixture builder AND eval tree-builder that drives a full entry point gives
        its repo sources that declare the systems its tree names — `_repo.seed_skills_repo`,
        whose catalog is seeded under `wazuh` (a name M5 forbids) and which creates no
        `defender/scripts/adapters/`; `_drain719.make_repo`, which seeds `elastic` and documents
        the outgoing SKILL.md predicate in prose at `:148-153`; and `defender/evals/harness_lead.py`,
        which materialises a defender tree with no `scripts/` directory at all and copies only
        `*/SKILL.md`. WHICH EXITS A FIXTURE HAS DEPENDS ON THE LANE ITS SUITE DRIVES (NF2,
        corrected at the phase-F repair — F5): the marker exit exists only where the tree is
        read through the UNION. A fixture whose suite drives `run_pitfalls` is read through the
        ADAPTER HALF ALONE, where a one-line `execution.md` declares nothing at all — and per
        C17r that covers 2 of the 3 `seed_skills_repo` suites (`test_pitfalls_curator`,
        `test_pitfalls_dedup_840`) and the pitfalls leg among `_drain719`'s 7. So `wazuh` has
        TWO exits wherever the pitfalls lane reads it (rename, or a stub adapter) and three on
        the union lane (rename, stub adapter, or a COMMITTED marker); `harness_lead`, which
        drives the lead-author lane (FK-12), may take the marker exit and needs one COMMITTED
        marker file. A fixture given only the marker while its suite drives the pitfalls lane
        is not declared at all, which is the shape this clause used to license.
    rejected:
      - {nl: "leaving the fixtures on the old predicate by making the new one Optional at the seams"}
      - {nl: "holding the ripple at the two shared builders and shipping a harness that takes the
              disjunctive raise on EVERY eval scenario the day this merges (FK-12's declined half)"}
     # C17r/G9: 3 suites over `seed_skills_repo`, 7 over `_drain719`, and 18 test modules + 2
     # shared helpers driving the touched seams. FK-12 (§7, auto-resolved as non-material): the
     # harness IS inside the ripple. It did not reach the human because the alternative ships a
     # harness that raises on every eval scenario this merges — not a real choice, and a one-line
     # fix under the union. NF1 SHARPENS THE FIX AND IT IS RECORDED HERE: the harness's rescue
     # marker must be COMMITTED in the tree it materialises, not merely written into it, or the
     # committed-tree marker read leaves the harness exactly where FK-12 found it.

  - id: no_catalog_migration
    kind: coherence
    form: clause
    binds: [catalog_dir, skills_tree]
    outcome:
      nl: >-
        The membership check evicts nothing from the committed tree: all five catalog system
        directories are adapter-set members (C14), the only two `skills/<x>/_draft/` trees belong
        to `elastic` and `cmdb` (C22), the union equals the adapter set exactly (C31), and the
        id-prefix invariant holds 34/34 over the whole in-scope corpus (C35). No migration
        accompanies this change, and any eviction a run reports is a regression, not a cleanup.
     # N2, widened past the doc's own finding, which checked only the catalog and never the skills
     # tree M5 also gates.

  # ---- §7 waivers: examined nos, minted by the human, kept in the artifact ----

  - id: collect_general_failures_stays_unscreened
    kind: coherence
    form: waiver
    binds: ["interacts(collect_general_failures->_draft_candidate_segments)",
            collect_general_failures, _draft_candidate_segments]
    cites: [S1, S2]
    outcome:
      nl: >-
        `collect_general_failures`, the second caller of `_draft_candidate_segments`, does NOT
        gain membership: the shared predicate keeps answering "is this a draft candidate at all"
        for it while answering "is this a draft candidate for a declared system" for
        `synthesize_drafts`, and this suite pins no assertion at that caller's edge. The two
        callers of one predicate stay deliberately different, and the asymmetry is written down
        here rather than discovered by the next reader.
    rejected:
      - {nl: "membership inside the predicate, threaded to both callers — one predicate, one
              meaning, M2 held literally. Declined because the polarity INVERTS: this caller
              queues a pitfall for what the predicate REJECTS (S2), so every undeclared-prefixed
              query would newly BECOME a queued pitfalls row, which M6 then drops and FK-2 then
              retires — an instructed-then-dropped loop manufactured by this very change."}
     # FK-8 (§7): A DECLINED OBLIGATION, RECORDED AS A WAIVER — an examined no, not a
     # `handoff.drops` silence, and a later reader is invited to disagree with it.
     # ONE OF THE TWO REASONS ON RECORD IS REFUTED, AND THE WAIVER RESTS ON THE OTHER. The §7
     # record also says "the caller runs before M2's resolution point, so membership there would
     # either violate M2 or move the boundary". S1 (read, this leaf) refutes that: `run()` builds
     # `LeadAuthorDeps` at `lead_author.py:381` — before `_run_locked` — and `collect_general_failures`
     # is called at `:415`, AFTER `deps.synthesize` at `:404`, so a boundary-resolved `systems`
     # value is already in scope there. The POLARITY reason (S2) is untouched and is the judge's
     # own primary; the waiver stands on it alone. Recorded so a later reader re-opening FK-8
     # argues with the reason that actually holds.

  - id: scrub_is_unaffected_by_the_declared_set
    kind: coherence
    form: waiver
    binds: ["interacts(scrub->skills_tree)", scrub]
    cites: [D2]
    outcome:
      nl: >-
        `scrub` (`runtime/scrub.py::scrub`), an unmoved reader of `skills_tree`, is waived
        specifically — no coherence demand is written at its edge. It classifies every walked
        entry by file TYPE only (regular file, directory, or unreadable) and never reads,
        derives, or keys on a system name anywhere in its contract, so widening what
        `declared_systems` reports changes nothing it does.
    rejected:
      - {nl: "a boundary-wide waiver on skills_tree, which R7 explicitly warns against — the
              other unmoved readers (gather_subagent, discover_system_drafts) are NOT waived;
              each is dismissed or demanded on its own evidence"}
     # The gate leaf's waiver candidate, CONFIRMED at §7 on claim D2 (read-probed). This is R7's
     # own intended per-reader dismissal — "this reader is unaffected because …, with a claim
     # behind it" — at the reader's own edge, which is the only altitude at which it is honest.

  # =========================================================================
  # Minted at phase D (gate leaf) — judgment obligations the tool does not compute.
  # =========================================================================

  - {id: empty_declared_set_refuses_the_lead_author_lane, kind: behavior, form: test,
     discharged_by: test_an_empty_declared_set_refuses_the_lead_author_lane,
     binds: [lead_author_run, "systems.domain.distinguished[frozenset()]",
             "interacts(lead_author_run->skills_tree)"]}
     # R5 JUDGMENT EXTENSION (gate leaf, phase D). 35 §1 part 7 / RF6 states the empty-set
     # refusal as a per-boundary universal — "AT EACH BOUNDARY an empty declared set is a
     # refusal to run the lane" — but empty_declared_set_refuses_the_lane pins it only at
     # run_pitfalls. lead_author_run, the COMMIT gate, is left constructible in exactly the
     # unsafe state RF6 named, one boundary over: an empty resolved set spent as an ordinary
     # membership "no" would have _skills_path_rule refuse every catalog/system-skill path one
     # file at a time — a silent per-file "no", not a loud lane refusal, which is precisely the
     # failure O4 named. Assert: with systems == frozenset(), lead_author_run commits nothing,
     # raises loud, and the corpus is untouched — never a quiet per-path refusal that looks like
     # ordinary membership enforcement.

  - {id: catalog_readers_agree_under_the_id_prefix_gate, kind: coherence, form: test,
     discharged_by: test_directory_and_id_prefix_derivations_agree_on_the_gated_catalog,
     binds: [catalog_dir, "interacts(iter_query_templates->catalog_dir)",
             "interacts(resolve_cli->catalog_dir)"]}
     # R7 (gate leaf, phase D). catalog_dir moves under this delta — RF2's
     # catalog_id_prefix_equals_directory now enforces id-prefix == directory AT THE COMMIT
     # GATE — and two readers key on `system` from opposite halves of the same path:
     # iter_query_templates derives it from the DIRECTORY, resolve_cli from the id: PREFIX.
     # catalog_id_prefix_equals_directory pins the WRITER; nothing pins the READERS at their OWN
     # edges, which R7 requires (a boundary-altitude demand reads as discharged for "two of
     # three moved," which is exactly the altitude collapse this rule exists to catch). Drive
     # both readers over the committed corpus — established templates plus an agent-authored
     # file the new gate now admits — and assert both derivations report the SAME system for
     # every entry. Deferred half, not this demand's: whether either JOIN can go EMPTY at write
     # time is the R8 census `handoff.deferred` already carries to write-code-from-spec; this
     # demand is the R7 half only — agreement between the two readers, not join-non-emptiness.

structure:

  axes: [tree_root, system, kebab, pitfall_id]
  # `tree_root` is an axis, not plumbing: the process's own checkout and the drain worktree are
  # two different address spaces for the same relative path, and #0 part 3 makes the resolver's
  # single parameter the coordinate that separates them.

  actors:

    # --- the delta's own frames ---
    - {id: declared_systems,          frame: leg,         provenance: design}   # M1's resolver — does not exist yet
    - {id: defender_paths,            frame: leg,         provenance: design}   # defender/_paths.py::DefenderPaths — gains adapters_dir
    - {id: run_pitfalls,              frame: leg,         provenance: design}   # learning/leads/pitfalls_curator.py::run_pitfalls — site 1
    - {id: _build_pitfalls_handoffs,  frame: leg,         provenance: design}   # pitfalls_curator.py:63-110 — site 1's handoff half
    - {id: rotate_pitfalls,           frame: leg,         provenance: design}   # learning/core/persist.py:410-427 — RF7's writer
    - {id: lead_author_run,           frame: leg,         provenance: design}   # learning/leads/lead_author.py::run — site 2
    - {id: synthesize_drafts,         frame: leg,         provenance: design}   # learning/leads/draft_synthesis.py:107-137 — site 3, HOST-side
    - {id: query_tool,                frame: leg,         provenance: design}   # runtime/query_tool.py::QueryCapture — M3's writer

    # --- the grounded neighborhood: co-writers, unmoved readers, drivers ---
    - {id: lead_author_drain,         frame: composition, provenance: code}     # learning/core/drains.py::_drain_lead_author — the fan, and J3's `finally`
    - {id: author_agent,              frame: leg,         provenance: code}     # the spawned lead author (runtime/tools.py::_tool_write_file/_tool_edit_file)
    - {id: curator_agent,             frame: leg,         provenance: code}     # the spawned pitfalls curator, same two file tools
    - {id: commit_corpus,             frame: leg,         provenance: code}     # learning/author/shared.py:224-241 — `git add -- defender/skills` (F6)
    - {id: drain_retire,              frame: leg,         provenance: code}     # learning/author/drain.py::retire — the graveyard writer
    - {id: discover_system_drafts,    frame: leg,         provenance: code}     # lead_author.py:191-209 — reads EVERY child of skills_dir (FK-4)
    - {id: collect_general_failures,  frame: leg,         provenance: code}     # lead_extraction.py — the predicate's SECOND caller (FK-8)
    - {id: gather_subagent,           frame: leg,         provenance: code}     # reads skills/gather/SKILL.md as its ENTIRE system prompt (F12, FK-1)
    - {id: scrub,                     frame: leg,         provenance: code}     # runtime/scrub.py::scrub — the box-teardown walk over the tree
    - {id: iter_query_templates,      frame: leg,         provenance: code}     # _corpus.py:109 — derives `system` from the DIRECTORY
    - {id: resolve_cli,               frame: leg,         provenance: code}     # lead_neighbors.py:61-64 — derives `system` from the `id:` PREFIX
    - {id: _system_of_record,         frame: leg,         provenance: code}     # query_tool.py:243-256 — N1's unmoved reader
    - {id: descriptor_catalog,        frame: leg,         provenance: code}     # hooks/inject_system_skill_description.py:42-51
    - {id: verb_registry,             frame: leg,         provenance: code}     # runtime/verbs.py:300-317 — the grant check + systems()
    - {id: harness_lead,              frame: composition, provenance: code}     # defender/evals/harness_lead.py — FK-12's execution context

  boundaries:

    # --- the value the whole spec asserts against ---
    - id: systems
      provenance: design
      facets:
        domain:
          type: "frozenset[str]"
          refinement: {nl: "the systems the tree being written to declares — the union of the
            adapter glob (working tree) and the execution.md marker (committed tree), derived per
            boundary and never stored. TWO VALUES LIVE IN ONE TICK (NF2): the path-composition
            lane is handed the union, the pitfalls lane the adapter half alone"}
          default: none-resolved-per-boundary
          distinguished: ["frozenset()"]
          falsy_valid: true
          documented_alternatives:
            - {value: adapter-only-at-the-pitfalls-lane, crosses_validation: false}
              # NF2 — RESOLVED at §7: ADOPTED. C40 shows an MCP system can never reach the
              # pitfalls queue (a row's `system` is narrowed to the adapter registry at the
              # writer), so the union buys nothing at M6 while newly permitting the curator to
              # edit an MCP system's execution.md — the marker file itself. Adapter-only closes
              # that self-reference structurally. THE PRICE, PAID DELIBERATELY: two membership
              # values in one tick, against M2's "one value, threaded" — a documented exception,
              # not a slip, and both call sites carry it in their own demands
              # (`pitfalls_resolves_systems_once`, `lead_author_resolves_systems_once`).
              # crosses_validation false: the alternative changes what `_pitfalls_path_rule`
              # admits, so the shipped default does not survive it. Pinned by
              # `pitfalls_lane_resolves_the_adapter_half_only`.
            - {value: six-reserved-names-excluded, crosses_validation: false}
              # FK-10 — RESOLVED at §7: DECLINED. No exclusion list; the tree's sources are
              # authoritative (N4/N5). `crosses_validation` was the one genuinely UNESTABLISHED
              # crossing in this graph and is now grounded at `false`: an exclusion list changes
              # what the resolver may emit, so the shipped default does not survive it — which is
              # part of why it was declined. The self-reference the exclusion would have closed is
              # closed by NF2's answer instead, structurally rather than by a name list.
              # THE LIVE EDGE THIS LEAVES, STATED SO IT IS NOT DISCOVERED: nothing excludes a
              # match against `gather`, `invlang`, `handbook`, `advisory`, `connect`, `judge`. A
              # `gather_adapter.py`, or a committed `defender/skills/gather/execution.md`, makes
              # `gather` declared — and FK-1's refusal of the six non-system `SKILL.md` writes
              # then LIFTS for it, re-opening the lead-author lane onto the gather subagent's
              # entire system prompt. Coherent (a real adapter means a real system) and coupled:
              # FK-1 and FK-10 were answered in opposite directions on purpose.

    # --- the two sources ---
    - id: adapters_dir
      provenance: code
      facets:
        domain:
          type: Path
          refinement: {nl: "<tree_root>/defender/scripts/adapters — the adapter half, globbed for
            *_adapter.py through runtime.verbs._system_of; a source, never a sink"}
          default: "<tree_root>/defender/scripts/adapters"
          distinguished: [absent, regular-file, unreadable]
          falsy_valid: false
          documented_alternatives: []
      # The three distinguished members are the three states in which `Path.glob` returns `[]`
      # with NO exception (J1 ×2, P2) — i.e. the states M1's raise cannot inherit from the
      # primitive. `spec-graph`'s own R4 is what forces each to be exercised individually.

    - id: skills_tree
      provenance: code
      facets:
        identity:
          key_axes: [tree_root, system]
          evidence: {nl: "The committed corpus the runtime reads as instructions, and — under the
            resolved #0 — the MARKER SOURCE as well; the same object in both roles, which is RF1's
            whole finding. Path templates read off the writers: skills/{system}/SKILL.md
            (lead-author lift), skills/{system}/execution.md (pitfalls curator),
            skills/{system}/_draft/{kebab}.md. `tree_root` is a key axis because the drain
            worktree and the process checkout are different objects for the same relative path
            (drains.py:401 `paths.with_repo_root(wt)`). `commit_corpus` interpolates tree_root
            ONLY — it stages the whole `defender/skills` pathspec rather than the rule's own
            `changed` list (F6), which is why a rule that merely SKIPS a path is not a gate for
            that path."}
          sharing: unique-key
        domain:
          type: Path
          refinement: {nl: "<tree_root>/defender/skills — read by the resolver as the marker
            source FROM THE COMMITTED TREE (NF1): the existence of <name>/execution.md at HEAD,
            at EXACTLY ONE directory of depth, never a read of its body and never a stat of the
            working tree. This is the half of the union that does NOT see the tree as it stands,
            and the asymmetry with adapters_dir is deliberate"}
          default: "<tree_root>/defender/skills"
          distinguished: [absent, unreadable, nested-execution-md]
          falsy_valid: false
          # `nested-execution-md` is ADDED AT THE PHASE-F REPAIR (F1): a COMMITTED `execution.md`
          # deeper than `<name>/execution.md` — `defender/skills/<declared>/_draft/<any>/…` or
          # `defender/skills/gather/queries/<declared>/<any>/…`, both of which the commit gate
          # ADMITS at this base (X1) and whose parent directory name is model-chosen. It is a
          # distinguished member and not an alternative because there is no choice on record: a
          # depth-unbounded read is a defect, and the member exists so R4 forces the address to
          # be driven rather than left to the implementer's recursion.
          # Pinned by `marker_source_is_exactly_depth_one` (read side) and
          # `marker_is_not_agent_committable` (write side).
          # RE-READ UNDER NF1: for the MARKER source these two members are states of the committed
          # read — `absent` is "no defender/skills at HEAD", `unreadable` is "the committed-tree
          # read fails". `declared_systems_absent_dir_raises` binds both and its raise is
          # unchanged; the git fault taxonomy behind "the read fails" is a primitive claim this
          # spec does not own (handoff.deferred).
          documented_alternatives:
            - {value: committed-tree-marker-read, crosses_validation: false}
              # NF1 — RESOLVED at §7: ADOPTED, and this OVERRIDES the judge's recommendation of
              # the working tree (the run's one override). A plantable, uncommitted `execution.md`
              # cannot declare a system: the read is `git show HEAD:…`-shaped, forgery-proof under
              # any ordering and any worktree hygiene, at one git call per resolution.
              # WHAT IT BUYS: phase C's executed planted-marker break (C33) is closed
              # STRUCTURALLY rather than by ordering discipline plus an undocumented `finally`.
              # WHAT IT COSTS, ACCEPTED: a freshly scaffolded MCP system stays undeclared until
              # the connect branch merges; one git call per resolution; and the union becomes
              # ASYMMETRIC — the adapter half still reads the working tree. The graph states that
              # asymmetry (`marker_read_is_from_the_committed_tree`, the header) rather than
              # letting a reader assume one source for both.
              # crosses_validation false is unchanged and is now a statement about the OLD default:
              # the working-tree reading does not survive this.
            - {value: marker-content-signature, crosses_validation: false}
              # NF4 — RESOLVED at §7 (auto, non-material): DECLINED — marker EXISTENCE, not a
              # content signature. All 7 execution.md files carry no frontmatter at all (C30), so
              # a content key would require migrating every one of them, which N2 explicitly
              # forecloses. STRENGTHENED BY NF1's CHOICE: with a committed-tree read the marker's
              # integrity is the commit gate (`marker_is_not_agent_committable`), so the content
              # signature buys less than it did under a working-tree read.
              # RECORDED COST: the pitfalls curator edits execution.md BY DESIGN and may alter a
              # marker's content freely — it simply cannot create one under an undeclared
              # directory, and now cannot get one committed either.
        access:
          constraints_by_via:
            write-tool:
              trust: attacker-influenced
              constraints: [confine]
              # C33, executed: `build_write_allow(skills, suffix=".md")` compiles to
              # `…/defender/skills/[^\x00]*\.md` and MATCHES skills/mcpsys/execution.md. The
              # confinement is to `.md` under the tree — it is not a membership gate.
            host-write:
              trust: attacker-influenced
              constraints: [denylist]
              # synthesize_drafts' mkdir+write_text from a model-supplied query_id, BEFORE the
              # agent is spawned. Guards today: `_SAFE_ID_SEGMENT` (\A[A-Za-z0-9][A-Za-z0-9._-]*\Z)
              # and an is_relative_to check. M4 adds membership to this cell.
            commit-gate:
              trust: attacker-influenced
              constraints: [denylist, confine]
              # `_skills_path_rule` through `_verify_corpus_scope`: out-of-scope refusal, the
              # protected-surface branch, the delete-prohibition, the half-promote branch. M5 adds
              # membership and RF2 adds the id-prefix content check.
            pitfalls-gate:
              trust: attacker-influenced
              constraints: [confine]
              # `_pitfalls_path_rule`: execution.md only, plus (today) a re-derived SKILL.md probe
              # that M6 replaces and `consumers_do_not_rederive` forbids re-deriving.

    # --- the catalog, nested UNDER a non-system directory ---
    - id: catalog_dir
      provenance: code
      facets:
        identity:
          key_axes: [tree_root, system, kebab]
          evidence: {nl: "defender/skills/gather/queries/{system}/{kebab}.md and
            .../{system}/_draft/{kebab}.md — read off draft_synthesis.py:107-137 and the committed
            corpus census (C13r: 28 established templates + 1 draft, zero prefix mismatches). The
            `skills/<x>` segment of EVERY path here is `gather`, which declares no adapter (G7) —
            which is why the membership key for this form is the segment after `queries/`."}
          sharing: unique-key

    # --- the sinks that carry a payload contract ---
    - id: executed_queries_table
      provenance: code
      facets:
        payload:
          parts:
            - {role: query_id, source: "template:{system}.{kebab-name}",
               slots: {system: systems, kebab: catalog_dir}}
            - {role: system, source: "const:the system the call was dispatched to"}
          invariants: [all-slots-bound]
          nl: "The queries table's routing identity. `defender/CLAUDE.md` states the schema —
            query_id is {system}.{kebab-name} — and nothing enforces it, so a granted call to
            elastic tagged fakesys.hunt-creds records the phantom verbatim. The row is written
            once and read by the lead-author tick that later composes paths from it."

    - id: learning_queue
      provenance: code
      facets:
        identity:
          key_axes: [pitfall_id]
          evidence: {nl: "{state_root}/_pending_pitfalls/pitfalls.jsonl, its .consumed and its
            .deadletter sibling — read off config.LoopPaths.pitfalls:104-115. The channel has no
            drain_lock by design (config.py:110-113)."}
          sharing: serialized-append
        payload:
          parts:
            - {role: consumed_category, source: "const:consumed_committed"}
            - {role: consumed_commit, source: "template:{commit_sha}"}
          invariants: []
          nl: "The consumed row rotate_pitfalls writes. `_rewrite_queue:106` attaches
            consumed_commit only when the category is consumed_committed AND the sha is truthy —
            so the category is what licenses the provenance, and a row stamped committed while
            nothing about it was committed carries a sha it has no relationship to (P9)."

    - id: pitfalls_handoff
      provenance: code
      facets:
        payload:
          parts:
            - {role: system, source: "const:the queued row's system field"}
            - {role: execution_md_path, source: "template:defender/skills/{system}/execution.md",
               slots: {system: systems}}
            - {role: failures, source: "const:the merged per-mistake records"}
          invariants: [all-slots-bound]
          nl: "The curator's prompt payload, and the place a name becomes a PATH. The
            execution_md_path slot must be bound from a declared name; `_build_pitfalls_handoffs`
            strips whitespace from the row's system field BEFORE the predicate (J5), so
            'elastic ' is admitted today while 'Elastic' is not — an asymmetry FK-6 must settle."

    - id: loop_log
      provenance: code
      facets: {}
      # Facetless on purpose: O3's observable is that a line NAMING the dropped names and the
      # source consulted is emitted, which the demand's own docstring pins; the line has no
      # composition contract a rule could read. `_build_pitfalls_handoffs` already logs dropped
      # systems by name and run_pitfalls logs the all-dropped case.
      # STALE COMMENT CORRECTED AT THE PHASE-F REPAIR (F10.1): this said "`_draft_candidate_segments`
      # drops SILENTLY (F7) — that gap is FK-3, OPEN". FK-3 is RESOLVED (§7, human): O3 reaches
      # site 3 and `draft_synthesis_reports_its_refusals` mints the surface, with
      # `interacts(synthesize_drafts->loop_log)` as its address. A reader of this boundary was
      # being told a fork is open that is not. The site-3 drop is still silent AT THIS BASE —
      # that is the demand's red, not an open question. FK-4's fourth site is closed the same
      # way (`interacts(discover_system_drafts->loop_log)`, minted at the phase-F repair).

    # --- the screens and gates, each a contract with a domain of its own ---
    - id: resolve_query_id
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the model-supplied query_id, as it reaches the writer: returned
            verbatim unless it is ∅.-prefixed or carries one of six forbidden characters"}
          default: "{system}.{verb}"
          distinguished: [foreign-prefix, own-prefix, no-verb]
          falsy_valid: false
          documented_alternatives:
            - {value: full-schema-shape, crosses_validation: false}
              # FK-7 — RESOLVED at §7: ADOPTED, the full `{system}.{kebab-name}` shape. Pinned by
              # `query_id_enforces_the_full_schema_shape`; closes D1 (executed). Below is the
              # situation it closes. M3 is stated as ONE comparison (prefix == system). Three values pass
              # a prefix-only rule while violating the schema: 'elastic' (no separator — D1,
              # executed: it passes VERBATIM today), 'elastic.' (empty remainder) and
              # 'elastic.foo.bar' (which `_draft_candidate_segments`' split(".",1) turns into the
              # kebab 'foo.bar', a second unvalidated model-supplied path component at site 3).
              # The full-shape rule changes what a caller records, so the default does not survive
              # it; C13r/C35's 34/34 census is a ready positive control.
            - {value: case-folded-equality, crosses_validation: false}
              # FK-6 — RESOLVED at §7: DECLINED. Exact codepoint equality, no folding and no NFC,
              # keeping the existing `.strip()`. It spans two sites and nothing in the doc, brief,
              # demands or corrections discussed it as an obligation OR as a non-obligation, which
              # is why it went to the human rather than being settled by reading. Exact equality
              # fails CLOSED everywhere; folding would introduce a second name space every gate
              # would then have to agree on. A case-variant or Unicode-confusable prefix is
              # REFUSED, never folded onto a real system. THE WHITESPACE/CASE ASYMMETRY IS STATED,
              # NOT FIXED (J5): `_build_pitfalls_handoffs` already strips, so `'elastic '` is
              # admitted at site 1 while `'Elastic'` is refused. Pinned by
              # `query_id_prefix_is_compared_by_exact_codepoints`, which asserts both halves.

    - id: _skills_path_rule
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the in-scope corpus path form the lead-author commit gate rules on,
            one branch per form; the three predicates key on FIXED OFFSETS (a prefix test, an
            exact-two-segment test, a parts[1]=='_draft' test), so extra path depth cannot move
            which predicate owns the system segment (C24, upgraded to disjoint-by-construction).
            The `execution-md` member is the ONE that does not key on a fixed offset: it is the
            BASENAME at any depth under defender/skills (F1, phase-F repair), because the two
            depth-unbounded in-scope limbs otherwise admit a marker whose parent directory name
            is model-chosen"}
          default: in-scope-shape-only
          distinguished: [system-skill, catalog, system-draft, execution-md, no-id,
                          non-system-skill-md]
          falsy_valid: false
          documented_alternatives:
            - {value: name-field-checked, crosses_validation: true}
              # NF3 — RESOLVED at §7 (auto, non-material): LEAVE. The crossing R4 owes is pinned
              # by `id_prefix_rule_spares_idless_surfaces`, which asserts the id-less surfaces
              # (every SKILL.md, SCHEMA.md) are spared — so a `name:` that disagrees with its
              # directory is still admitted, and the advertised combination demonstrably works.
              # The reasoning that kept it off the human's list: The 12 system SKILL.md files carry
              # `name: defender-<system>`, not `id:`, so RF2's words do not reach them. No runtime
              # consumer reads the field (`read_description` reads `description`;
              # `descriptor_catalog` enumerates from the adapter registry) and
              # `validate_scaffold.check_skill` already FAILs on a mismatch — so the shipped
              # default stays valid under the extension; the cost is that 2 of 12 files
              # (`advisory`, `connect`) do not carry `defender-<dir>` and would need an exception
              # or a migration N2 forbids.
      # `non-system-skill-md` was DELIBERATELY UNBOUND while FK-1 was open. §7 answered it —
      # REFUSE ALL SIX — so the member is now BOUND by `non_system_skill_md_is_refused`, and its
      # R4 hole carries that demand as its `resolved_to`. The refusal is a behaviour change on a
      # path that is legal today (G4 committed exactly that edit) and it costs the loop its only
      # writer onto `gather/SKILL.md`, another agent's entire system prompt.

    - id: _pitfalls_path_rule
      provenance: design
      facets: {}
      # No facet of its own: its whole contract is execution.md-only (unchanged) plus the
      # membership question, which is `systems`' domain and the `pitfalls-gate` access cell.

    - id: _is_system_name
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "a candidate system NAME, not a path — #868's shape check, split out of
            _is_real_system unchanged: refuse empty, a leading dot, and any value carrying / \\ or
            NUL, so a traversal never becomes a set lookup"}
          default: none-every-candidate-is-checked
          distinguished: [traversal, empty, dotfile, separator-bearing]
          falsy_valid: false
          documented_alternatives:
            - {value: applied-at-the-resolver, crosses_validation: false}
              # FK-5 — RESOLVED at §7: ADOPTED. Filter at the resolver AND log each refusal.
              # J4 (executed) shows the adapter glob admits a directory, a dotfile, the
              # suffix-only name and `.._adapter.py`, from which `_system_of` derives 'dir',
              # '.hidden', '' and '..' — and sites 2 and 3 have NO character-class check to
              # re-apply, so "every consumer re-checks" was aspirational. Filtering at the source
              # makes the set well-formed by construction (and is a prerequisite for #870 R2,
              # which spends the set as directory names). Accepted cost: this predicate moves
              # beside the resolver — which FK-11 answers in the same direction (both learning-
              # side). The alternative changes what the resolver may EMIT, so the default does not
              # survive it. Pinned by `resolver_refuses_shape_anomalous_names`.
              # THIS RESOLUTION IS THE ONLY THING CLOSING R6's LOG SINK. The dropped-names log
              # line renders a raw system name; filtering at the resolver is what sanitizes it.
              # Re-opening FK-5 re-opens that gap with nothing else pinning it.

    - id: _draft_candidate_segments
      provenance: design
      facets: {}
      # RF3/FK-8's object: ONE predicate asked twice per tick with OPPOSITE polarity — a query it
      # ACCEPTS becomes a draft, a query it REJECTS becomes a queued pitfall. Modelled as a
      # boundary with two readers precisely so R7 asks the question the design never did.

    - id: consumed_category
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the durable label a rotated pitfalls row carries; the existing
            vocabulary is consumed_committed | consumed_idempotent | consumed_skip |
            consumed_retired"}
          default: consumed_committed
          distinguished: [consumed_committed]
          falsy_valid: false
          documented_alternatives:
            - {value: consumed_undeclared, crosses_validation: false}
              # FK-2 — RESOLVED at §7: ADOPTED. A dropped row takes the distinct terminal category
              # `consumed_undeclared` plus the graveyard record; pinned by
              # `dropped_row_takes_the_undeclared_category`. Below is the gate it cleared.
              # UN-GATED by PO-R. The gate read "do not act before PO-R lands —
              # if a mixed batch already excludes the dropped row from batch_ids, the row is stuck
              # in pending today and the change is larger than a category rename." P9 (executed):
              # `batch_ids` is computed from the RAW rows before any dropping, the dropped id IS
              # inside it, pending goes to empty, and no path leaves an undeclared row stuck. So a
              # terminal drop category plus the graveyard is unblocked and is the right size —
              # what remains is the human's choice between it, reuse of `consumed_skip` (which
              # already means something else to every reader) and leaving the row queued to be
              # re-dropped every tick (which N5 and #870's amendment both argue against).

    - id: resolver_fault_class
      provenance: design
      facets:
        domain:
          type: "type[Exception]"
          refinement: {nl: "the class declared_systems raises when a source is unresolvable —
            load-bearing in TWO directions, because the drain routes on the class, not on the
            message"}
          default: LeadAuthorError
          distinguished: [LeadAuthorError]
          falsy_valid: false
          documented_alternatives:
            - {value: _LeadAuthorRetry, crosses_validation: false}
              # FK-17 — RESOLVED at §7: the retriable class is DECLINED. TERMINAL (today's
              # `LeadAuthorError` shape) PLUS a RE-DRIVABLE `failed/` graveyard — the third option
              # PO-K's probe surfaced. It agrees with #870's amendment and #903's view, and it
              # reuses FK-2's graveyard vocabulary so both legs of the tick speak one language.
              # Pinned by `membership_refusal_is_terminal_and_recorded`, whose demand states the
              # record EXISTS without asserting the view that reads it. Below is why this was a
              # real choice rather than a ratification.
              # REWRITTEN by PO-K: the judge's provisional ("quarantine is
              # retriable, confirm it") is REFUTED. `_quarantine_lead_author_failure` ->
              # `quarantine_marker` writes author-queue/failed/<case>.json and unlinks the queued
              # marker on the FIRST tick, never re-claimed (P6: run() called exactly once over 5
              # ticks); `LEAD_AUTHOR_MAX_RETRIES` (3 TOTAL attempts, not 3 retries) governs only
              # `_LeadAuthorRetry`, which a membership refusal never raises. #870's deployment-skew
              # rescue does not exist today. The three options: terminal (today's shape — one
              # durable failed/ record, no burned attempts, the same graveyard vocabulary FK-2
              # wants); retriable (automatic rescue IF the adapter lands within 3 ticks, at 3
              # spawns per permanently-undeclared name, and reaching that branch today requires
              # the resolver to raise OSError/SubprocessError — exactly what
              # `resolver_failure_is_not_swallowed_as_a_successful_tick` forbids on the sibling
              # leg); or terminal plus a re-drivable failed/ queue, which decouples the rescue
              # from a tick budget at the cost of machinery this issue does not otherwise need.
              # F1/FK-11 rides on the same slot and is ALSO RESOLVED at §7: the resolver lives
              # LEARNING-side and raises `LeadAuthorError`, importing `ADAPTER_SUFFIX` and
              # `_system_of` from `runtime.verbs` at MODULE level. The class must not be an
              # OSError subclass (J2) or `_run_curator_module`'s swallow turns the failure into a
              # green tick; `learning -> runtime.verbs` is the established import direction (C27),
              # so a resolver in runtime/verbs.py could not raise LeadAuthorError without
              # inverting it. FK-5's shape predicate moves to the same side, for the same reason.
              # OUT OF THE RESOLVER'S CONTRACT, AND NOT PINNED: an import-time `ImportError` from
              # `runtime.verbs` breaks the resolver's own import before any source is read and
              # dead-letters loudly — accidental rather than designed. See handoff.deviations.

  interacts:

    # ---- the resolver's two sources, its log line and its fault ----
    - {from: declared_systems, to: adapters_dir,        mode: read,   via: fs,     provenance: design}
    - {from: declared_systems, to: skills_tree,         mode: read,   via: fs,     provenance: design}
    - {from: declared_systems, to: loop_log,            mode: write,  via: stdout, provenance: design}
    - {from: declared_systems, to: resolver_fault_class, mode: invoke, via: api,   provenance: design}
    - {from: defender_paths,   to: adapters_dir,        mode: read,   via: api,    provenance: design}
    - {from: defender_paths,   to: skills_tree,         mode: read,   via: api,    provenance: design}

    # ---- site 1: the pitfalls lane ----
    - {from: run_pitfalls, to: systems,        mode: read,  via: api,    provenance: design}
    - {from: run_pitfalls, to: skills_tree,    mode: read,  via: fs,     provenance: design}
      # The read `consumers_do_not_rederive` closes: `_pitfalls_path_rule` re-derives membership
      # from the tree the agent just wrote into (C33 — RAISES before the plant, ADMITS after).
    - {from: run_pitfalls, to: _pitfalls_path_rule, mode: invoke, via: api, provenance: design}
    - {from: run_pitfalls, to: learning_queue, mode: read,  via: fs,     provenance: design}
    - {from: run_pitfalls, to: loop_log,       mode: write, via: stdout, provenance: design}
    - {from: _build_pitfalls_handoffs, to: systems,          mode: read,  via: api, provenance: design}
    - {from: _build_pitfalls_handoffs, to: _is_system_name,  mode: read,  via: api, provenance: design}
    - {from: _build_pitfalls_handoffs, to: loop_log,         mode: write, via: stdout, provenance: design}
    - {from: _build_pitfalls_handoffs, to: pitfalls_handoff, mode: write, via: api, provenance: design,
       sends: payload}
    - {from: _build_pitfalls_handoffs, to: skills_tree,      mode: remove, via: fs, provenance: design}
      # THE SUBTRACTION: the `(skills_dir / system / "SKILL.md").is_file()` probe, gone. Its live
      # dependents are every other reader and writer of this tree, which is what R5 asks about;
      # `pitfalls_admits_declared_without_skill_md` is the survival demand.
    - {from: rotate_pitfalls, to: learning_queue,   mode: write, via: fs,  provenance: design,
       sends: payload, interpolates: [pitfall_id]}
    - {from: rotate_pitfalls, to: consumed_category, mode: read, via: api, provenance: design}
    - {from: curator_agent,  to: skills_tree, mode: write, via: write-tool, provenance: code,
       interpolates: [tree_root, system]}

    # ---- site 2: the lead-author lane ----
    - {from: lead_author_run, to: systems,           mode: read,   via: api, provenance: design}
    - {from: lead_author_run, to: skills_tree,       mode: read,   via: fs,  provenance: design}
    - {from: lead_author_run, to: catalog_dir,       mode: read,   via: fs,  provenance: design}
    - {from: lead_author_run, to: _skills_path_rule, mode: invoke, via: api, provenance: design}
    - {from: author_agent,    to: skills_tree, mode: write, via: write-tool, provenance: code,
       interpolates: [tree_root, system, kebab]}
    - {from: author_agent,    to: catalog_dir, mode: write, via: write-tool, provenance: code,
       interpolates: [tree_root, system, kebab]}
    - {from: commit_corpus,   to: skills_tree, mode: write, via: git, provenance: code,
       interpolates: [tree_root]}
      # `git add -- defender/skills` — the whole pathspec, not the rule's `changed` list (F6).
      # Its `interpolates` is honestly tree_root only; the key-coverage question that raises is
      # answered by the demands bound at skills_tree.identity, and it is the reason a rule that
      # merely SKIPS a shape is not a gate for that shape.

    # ---- site 3: host-side draft synthesis ----
    - {from: synthesize_drafts, to: systems,                 mode: read,  via: api, provenance: design}
    - {from: synthesize_drafts, to: _draft_candidate_segments, mode: read, via: api, provenance: design}
    - {from: synthesize_drafts, to: executed_queries_table,  mode: read,  via: fs,  provenance: design}
    - {from: synthesize_drafts, to: catalog_dir,             mode: write, via: fs,  provenance: design,
       interpolates: [tree_root, system, kebab]}
    - {from: synthesize_drafts, to: loop_log, mode: write, via: stdout, provenance: design}
      # FK-3 (§7). THIS EDGE DOES NOT EXIST IN THE CODE — the demand mints it. Site 3 drops
      # SILENTLY today: `_draft_candidate_segments` returns None and nothing is logged (F7), and
      # RF5 already recorded that this site has no natural place to hang the line. O3 is
      # unqualified, so all three composition sites report a membership refusal;
      # `draft_synthesis_reports_its_refusals` is the demand and this is its address.

    # ---- M3's writer ----
    - {from: query_tool, to: resolve_query_id,       mode: invoke, via: api, provenance: design}
    - {from: query_tool, to: executed_queries_table, mode: write,  via: fs,  provenance: design,
       sends: payload}

    # ---- the neighborhood: readers reality imposes and no demand asked for ----
    - {from: discover_system_drafts, to: loop_log, mode: write, via: stdout, provenance: design}
      # MINTED AT THE PHASE-F REPAIR (the blind reader's Q7 gap). THIS EDGE DOES NOT EXIST IN
      # THE CODE, exactly like FK-3's site-3 edge: today `discover_system_drafts` walks the tree
      # and a skipped child leaves no trace at all. FK-3 resolved that O3 reaches every
      # composition site; FK-4 then grew that census from three sites to four without the
      # reporting obligation following, so this site was left silent by inheritance rather than
      # by decision. `discover_system_drafts_screens_membership` is the demand and this is its
      # address.
    - {from: discover_system_drafts, to: skills_tree, mode: read, via: fs, provenance: design}
      # FK-4 (§7): IN SCOPE — the edge MOVES INTO THE DELTA (was `provenance: code`) because the
      # human put a membership filter here, making this a fourth composition site rather than an
      # unmoved reader. Today it walks EVERY child of skills_dir and hands the agent
      # {"system": <dirname>, "skill_path": "defender/skills/<dirname>/SKILL.md"} with no filter
      # (C29, executed). It is handed this lane's UNION (NF2). Its R7 hole is resolved to
      # `discover_system_drafts_screens_membership`; it is no longer an unmoved reader, so R7 no
      # longer fires on it and the hole entry stays as the decision record.
    - {from: gather_subagent, to: skills_tree, mode: read, via: fs, provenance: code}
      # FK-1 (§7): the WRITE lane onto this file closes (`non_system_skill_md_is_refused`); this
      # READ stays exactly as it is, pinned at its own edge by
      # `gather_prompt_source_survives_the_refusal`. `skills/gather/SKILL.md` is loaded WHOLE as
      # this subagent's entire system prompt on every dispatch (F12), and it satisfies
      # `_is_system_skill_md` today — which is why the refusal had to be decided, not assumed.
      # It becomes maintainer-written, with no loop-side writer at all.
    - {from: scrub, to: skills_tree, mode: read, via: fs, provenance: code}
      # The box-teardown walk. Named so its dismissal is on its own evidence rather than blanket.
    - {from: iter_query_templates, to: catalog_dir, mode: read, via: fs, provenance: code}
      # Derives `system` from the DIRECTORY (parent.parent.name under _draft, else parent.name).
    - {from: resolve_cli, to: catalog_dir, mode: read, via: fs, provenance: code}
      # Derives `system` from the `id:` PREFIX. Two readers of one value keying on different
      # halves — which is why RF2's rule belongs at the gate and not only at the writer, and it is
      # the R8 census this run owes.
    - {from: collect_general_failures, to: _draft_candidate_segments, mode: read, via: api,
       provenance: code}
      # FK-8 (§7): DECLINED — this caller does NOT gain membership, and the decline is carried as
      # `Demand {form: waiver}` (`collect_general_failures_stays_unscreened`), not as a drop.
      # The predicate's second caller, asked with OPPOSITE polarity (S2): it queues a pitfall for
      # what the predicate REJECTS, so screening here would MANUFACTURE pitfalls rows that M6
      # then drops and FK-2 then retires.
      # CORRECTION TO THE RECORD (S1, read at §7-application): the fork's other stated reason —
      # "it runs earlier in _run_locked than the point M2 resolves membership" — is FALSE at this
      # base. `build_lead_author_deps` runs in `run()` (lead_author.py:381), before `_run_locked`,
      # and this caller is at `:415`, after `deps.synthesize` at `:404`. A boundary-resolved
      # `systems` value IS in scope here. The waiver rests on polarity alone.
    - {from: collect_general_failures, to: learning_queue, mode: write, via: fs, provenance: code,
       interpolates: [pitfall_id]}
    - {from: drain_retire, to: learning_queue, mode: write, via: fs, provenance: code,
       interpolates: [pitfall_id]}
    - {from: _system_of_record,  to: adapters_dir, mode: read, via: fs, provenance: code}
    - {from: descriptor_catalog, to: adapters_dir, mode: read, via: fs, provenance: code}
    - {from: verb_registry,      to: adapters_dir, mode: read, via: fs, provenance: code}
      # The doc's own census of the three existing consumers of the declared set, all agreeing on
      # ModuleVerbRegistry.systems(). The delta adds a FOURTH consumer that answers a wider
      # question — that divergence is NF2, and these three edges are how the gate saw it.
      # NF2 (§7) SETTLES IT: the wider question is asked only on the path-composition lane, so
      # these three stay adapter-only and stay correct. Each is dismissed on its OWN evidence at
      # `gate.holes` — `_system_of_record` on C40 (pre-discharged by `runtime_dispatch_unchanged`),
      # `verb_registry` on C40/G17, `descriptor_catalog` on S3 — never blanket-waived at the
      # boundary, which is what R7 warns against.
    - {from: harness_lead, to: skills_tree, mode: write, via: fs, provenance: code,
       interpolates: [tree_root, system]}
      # FK-12 (§7, auto-resolved): IN SCOPE — `fixture_repos_declare_their_systems` names it.
      # It materialises a defender tree from the real one and copies `*/SKILL.md` — but no
      # `scripts/` directory at all and no `execution.md`, so under the disjunctive raise every
      # scenario it drives takes the raise path and the marker half does not rescue it. The
      # alternative shipped a harness that raises on EVERY eval scenario the day this merges,
      # which is why it did not need the human. Under NF1 the rescue marker must be COMMITTED in
      # the materialised tree, not merely written into it.

  drives:
    - {from: lead_author_drain, to: lead_author_run, provenance: code, multiplicity: serial}
    - {from: lead_author_drain, to: run_pitfalls,    provenance: code, multiplicity: serial}
      # Markers first, then pitfalls, against ONE worktree, with `_discard_worktree_changes` in a
      # `finally` after every marker and after the pitfalls leg (J3). Serial is what makes
      # `uncommitted_residue_does_not_cross_lanes` a deterministic drive rather than a race.
    - {from: lead_author_drain, to: drain_retire,    provenance: code, multiplicity: serial}
    - {from: run_pitfalls,    to: _build_pitfalls_handoffs, provenance: design, multiplicity: serial}
    - {from: run_pitfalls,    to: curator_agent,   provenance: design, multiplicity: serial}
    - {from: run_pitfalls,    to: rotate_pitfalls, provenance: design, multiplicity: serial}
    - {from: run_pitfalls,    to: commit_corpus,   provenance: code,   multiplicity: serial}
    - {from: lead_author_run, to: synthesize_drafts, provenance: design, multiplicity: serial}
      # HOST-side and BEFORE the agent spawns and before baseline_stray is taken (F1) — the
      # ordering that makes C12 the host's write rather than the agent's.
    - {from: lead_author_run, to: author_agent,     provenance: design, multiplicity: serial}
    - {from: lead_author_run, to: discover_system_drafts, provenance: code, multiplicity: serial}
    - {from: lead_author_run, to: collect_general_failures, provenance: code, multiplicity: serial}
    - {from: lead_author_run, to: commit_corpus,    provenance: code,   multiplicity: serial}
    - {from: harness_lead,    to: lead_author_run,  provenance: code,   multiplicity: serial}

