  - {id: pitfalls_path_rule_membership, kind: behavior, form: test,
     discharged_by: test_pitfalls_path_rule_refuses_an_undeclared_directory,
     binds: [_pitfalls_path_rule, systems, "interacts(run_pitfalls->skills_tree)",
             "skills_tree.access[pitfalls-gate]"]}
     # The last gate asks the same question the handoff builder does, FROM THE SAME THREADED
     # VALUE — the rule stops re-deriving membership from the working tree (C33). NF2 (§7) settles
     # WHICH value: the ADAPTER HALF ALONE, the same value `_build_pitfalls_handoffs` is handed.
     # "The same question the handoff builder does" is now a statement about these two consumers
