       resolution: "ADOPTED (human, §7) — THE COMMITTED TREE, AND THIS OVERRIDES THE JUDGE'S RECOMMENDATION (the run's one override). A plantable, uncommitted execution.md cannot declare a system, so phase C's executed planted-marker break (C33) is closed STRUCTURALLY rather than by ordering discipline resting on an undocumented `finally`. READING TAKEN, AND ITS CONSEQUENCE FOR EVERY READER OF THIS GRAPH: the union is now ASYMMETRIC — the adapter half reads the WORKING tree, the marker half the COMMITTED tree — and the graph states that rather than letting anyone assume one source. Accepted costs: a scaffolded MCP system stays undeclared until its branch merges, and one git call per resolution. The judge's compensating demand `uncommitted_residue_does_not_cross_lanes` is RETAINED at lower altitude and must NOT be read as discharging marker integrity.",
