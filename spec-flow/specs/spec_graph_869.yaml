     # handoff and its commit.
     # THE FIXTURE TRAP, CORRECTED AT THE PHASE-F REPAIR (F10.2). `45` recorded it as "`ticket`
     # must be declared by its ADAPTER ALONE and given no `execution.md`, or the test passes
     # through the marker half" — and under NF2 that reason does not hold: this lane resolves
     # the ADAPTER HALF ALONE and never consults the marker source, so a seeded marker could not
     # have declared `ticket` here in the first place. THE FIXTURE IS STILL CORRECT; only its
     # stated reason was stale, which is what a later reader "simplifying" the fixture on the
     # strength of it would have acted on. The reason that holds: with no `execution.md`
     # committed, the path the tick commits is one the CURATOR created, so
     # `execution.md in head_files` observes this drive rather than the fixture. The trap that
     # carries the demand is the absent `SKILL.md` — the probe M6 deletes.

  # =========================================================================
  # O3 / RF7 — reported, never silently absorbed; and the durable record too.
  # =========================================================================

  - {id: undeclared_names_reported, kind: behavior, form: test,
     discharged_by: test_dropped_names_are_named_in_the_log,
     binds: [_build_pitfalls_handoffs, _skills_path_rule, _pitfalls_path_rule, loop_log,
             "interacts(run_pitfalls->loop_log)"],
     rejected: [{nl: "distinguishing an adapter that will exist tomorrow from an invented name —
                      from inside a tick they are indistinguishable and both go to human review
                      (N5)"}]}
     # A tick that drops rows naming `gather` and `fakesys` emits a line naming BOTH and the
     # reason, and — 35's alteration — the SOURCE CONSULTED. AT THIS LANE THAT SOURCE IS ONE:
     # the adapters directory, and never `defender/skills`.
     # CORRECTED AT THE PHASE-F REPAIR (F2 — the fix is at the DEMAND, not at the test). `35`
     # altered this demand to "name the source consulted, since there are now two" while the
     # union still governed every site; §7 then resolved NF2 and handed THIS lane the adapter
     # half alone, and this demand was never re-read. Read literally it requires the
     # implementation to print `defender/skills` on a line explaining a decision taken WITHOUT
     # reading `defender/skills` — and to tell an operator the wrong thing about which half came
     # back without the name, which is the exact failure the "source consulted" clause was added
     # to prevent. The demand now asks for the source this lane actually consulted, and the
     # marker source is asserted ABSENT from the line.
     # WHAT THIS DEMAND DOES NOT REACH is site 3, and §7 closed that: FK-3 says O3 REACHES site
     # 3, so `draft_synthesis_reports_its_refusals` mints the surface there — and FK-4's fourth
     # site is closed at its own demand (`discover_system_drafts_screens_membership`). Every
     # composition site reports a membership refusal; this demand owns site 1's, and the parity
     # across them is not this demand's to assert.
     # FK-16 (auto-resolved, §7) rides here: for a delete under an undeclared directory,
     # MEMBERSHIP FIRES FIRST and the reason reported follows the EXISTING vocabulary — so the
     # line carries the name and the registry reason (which is what feeds #870's retirement
     # reasons), stated as a decision rather than left as an implementation accident.
     # RE-PINNED AT SITE 2 BY THE PHASE-F REPAIR (F3). FK-16's premise is explicit that its site
     # is `lead_author._skills_path_rule` — M5's in-scope test is where membership is NEW. At
     # `_pitfalls_path_rule` membership (`_is_real_system`) ALREADY precedes the delete branch
     # at this base, so an assertion there certifies existing behaviour and leaves the decision
     # unpinned exactly where an implementer could put the new check after the old one: a `D `
     # on `defender/skills/fakesys/SKILL.md` would then report "agent deleted an established
     # template", the undeclared name absorbed into an unrelated reason — O3's own failure shape
     # and the arm FK-16 chose against. Both sites are driven; site 2 is the load-bearing one,
     # and a `D ` under a DECLARED system is its control (the delete-prohibition still fires).
     # `catalog_id_prefix_equals_directory`'s ordering pin is a different check and does not
     # cover this.

  - {id: dropped_rows_are_never_labelled_committed, kind: shape, form: test,
     discharged_by: test_a_dropped_row_is_never_labelled_committed,
     binds: [rotate_pitfalls, consumed_category,
             "consumed_category.domain.distinguished[consumed_committed]",
             "interacts(rotate_pitfalls->learning_queue).payload"]}
     # RF7, and P9 moves it: bind the MIXED batch, not the all-dropped one. Executed (C38/P9):
     # with two `elastic` rows and one undeclared `elastik` row and a real commit, ALL THREE
     # consumed rows carry `consumed_category: consumed_committed` and
     # `consumed_commit: 62a71c08a409` — a commit whose only content was `elastic/execution.md`.
     # The dropped row is not merely mis-categorised, it carries the sha of a commit that contains
     # NOTHING about it; `_rewrite_queue:106` attaches the provenance precisely BECAUSE the
     # category claims a commit, so fixing the category withdraws the false provenance as a side
     # effect. The all-dropped control is milder (sha `None`, C37) and cannot see this.
     # WHICH category the dropped row takes is FK-2, and §7 answered it — see
     # `dropped_row_takes_the_undeclared_category`. This demand stays the NEGATIVE half (never
     # `consumed_committed`, never a sha it has no relationship to); that one is the positive.
     # IMPLEMENTATION NOTE (47 red flag 4): `rotate_pitfalls(batch_ids, commit_sha)` stamps ONE
     # category for ONE id list, so the fix splits the batch at the call site — it is not a
     # string rename.

  - {id: dropped_row_takes_the_undeclared_category, kind: domain-outcome, form: test,
     discharged_by: test_a_dropped_row_takes_a_terminal_undeclared_category,
     positive_control_for: dropped_rows_are_never_labelled_committed,
     binds: [rotate_pitfalls, drain_retire, consumed_category,
             "consumed_category.domain.alternatives[consumed_undeclared]",
             "interacts(rotate_pitfalls->learning_queue).payload"]}
     # FK-2 (§7): a dropped row takes a DISTINCT TERMINAL CATEGORY — `consumed_undeclared` — and
     # the row goes to the GRAVEYARD record for human review. Same mixed batch as the demand
     # above (two `elastic` rows, one `elastik` row, a real commit): the two declared rows carry
     # `consumed_committed` + the real sha, the dropped row carries `consumed_undeclared` and NO
     # `consumed_commit` at all, and a durable record of it exists for a human to act on.
     # REJECTED, and why: reusing `consumed_skip` (it already means something else to every one of
     # the 12 assertion sites C39 censused), and leaving the row queued to be re-dropped every
     # tick (N5 and #870's amendment both argue against it, and it is the only reading that does
     # not bound the queue).
     # UN-GATED, not merely recommended: PO-R/P9 (executed) showed `batch_ids` is computed from
     # the RAW rows before any dropping, so the dropped id IS inside it, pending goes to empty,
     # and no path leaves an undeclared row stuck — the gate the judge put on this fork is
     # cleared, and the change is the right SIZE.
     # C39 makes this ADDITIVE: no existing assertion in the tree flips.

  - {id: empty_declared_set_refuses_the_lane, kind: behavior, form: test,
     discharged_by: test_an_empty_declared_set_refuses_the_lane,
     binds: [run_pitfalls, "systems.domain.distinguished[frozenset()]",
             "interacts(run_pitfalls->learning_queue)"]}
     # RF6 (human-resolved): the empty set is NOT spendable as a gate. `run_pitfalls` against a
     # tree whose declared set is empty leaves every queued row in `pitfalls.jsonl`, writes
     # nothing to `pitfalls.consumed.jsonl`, and fails loud. This is the half M1 buys at the
     # resolver and the consumers spend at `pitfalls_curator.py:201` as an ordinary falsy test —
     # C37, executed: rc 0, curator never spawned, pending 2 -> 0, both rows stamped committed.

  - {id: membership_refusal_is_terminal_and_recorded, kind: domain-outcome, form: test,
     discharged_by: test_a_membership_refusal_is_terminal_and_leaves_a_re_drivable_record,
     binds: [lead_author_run, resolver_fault_class,
             "resolver_fault_class.domain.alternatives[_LeadAuthorRetry]",
             "drives(lead_author_drain->lead_author_run)"],
     rejected: [{nl: "the RETRIABLE class (_LeadAuthorRetry) — automatic rescue only if the
                      adapter lands inside a 3-attempt, time-based window, at 3 spawns per
                      permanently-undeclared name, and reachable today only by raising the very
                      OSError/SubprocessError class that
                      resolver_failure_is_not_swallowed_as_a_successful_tick forbids on the
                      sibling pitfalls leg"},
                {nl: "leaving the refusal on today's shape with no durable re-drivable record,
                      which makes a deployment-skew marker need a human to reconstruct it"}]}
     # FK-17 (§7): TERMINAL, PLUS RE-DRIVABLE TO THE GRAVEYARD. The judge's provisional
     # ("quarantine is retriable — confirm it") was REFUTED OUTRIGHT by PO-K/P6 before this
     # reached the human, so this is a genuine three-way choice made, not a ratification.
     # Drive the real marker queue over several ticks with the lane refusing on membership:
     # the marker is quarantined on the FIRST tick to `author-queue/failed/<case>.json` carrying
     # the refusal reason and the name, the queued marker is unlinked, `run()` is invoked exactly
     # ONCE across the following ticks, and no `LEAD_AUTHOR_MAX_RETRIES` attempt is burned (P6:
     # the 3-attempt ceiling governs `_LeadAuthorRetry`, a class a membership refusal never
     # raises; `LEAD_AUTHOR_MAX_RETRIES` is 3 TOTAL attempts, not 3 retries).
     # THE DEMAND STATES THAT THE RECORD EXISTS; IT DOES NOT ASSERT THE VIEW THAT READS IT.
     # Re-driving that record is #870's amendment and #903's view, neither of which is in this
     # tree — this spec pins the durable artifact and its terminality, and stops there.
     # Same graveyard vocabulary as FK-2's pitfalls-side answer, deliberately: one shape across
     # both legs.

  # =========================================================================
  # Non-obligations and the cross-site universal.
  # =========================================================================

  - {id: runtime_dispatch_unchanged, kind: survival, form: test,
     discharged_by: test_runtime_system_of_record_is_unchanged,
     binds: [_system_of_record, "interacts(_system_of_record->adapters_dir)"]}
     # N1, bound at the READER'S OWN EDGE because that is what R7 asks: `_system_of_record` still
