       cites: [C30, C40]}
    - {rule: R4, element: "systems.domain.alternatives[six-reserved-names-excluded]",
       witness: "The same fork as the R0 entry above (FK-10) fires both rules on the same element — recorded twice here, counted once as one fork.",
