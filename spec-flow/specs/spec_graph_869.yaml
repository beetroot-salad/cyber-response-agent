    - {rule: R4, element: "resolve_query_id.domain.alternatives[full-schema-shape]",
       witness: "FK-7: does M3 enforce the whole {system}.{kebab-name} shape or only the prefix? D1 (executed) shows the no-separator case passes verbatim today.",
       resolution: "ADOPTED (human, §7) — THE FULL {system}.{kebab-name} SHAPE. READING TAKEN: 'elastic' (no separator), 'elastic.' (empty remainder) and 'elastic.foo.bar' (whose remainder becomes a second unvalidated path component at site 3) all fall back to {system}.{verb}. Closes D1, which is executed and live at this base; a prefix-only rule would leave a model-supplied string in the filename position of a host-side mkdir+write_text — the shape of the very finding this issue exists to close, one field over.",
