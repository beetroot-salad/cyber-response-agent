       cites: [C30, C31]}
    - {rule: R4, element: "systems.domain.alternatives[adapter-only-at-the-pitfalls-lane]",
       witness: "NF2: union at all three membership sites, or adapter-only at the pitfalls lane? C40 shows the union buys nothing at M6 while newly permitting the curator to edit an MCP system's own marker file.",
       resolution: "ADOPTED (human, §7, taking the judge's recommendation) — ADAPTER-ONLY AT THE PITFALLS LANE, the union at the path-composition gates. READING TAKEN: this is TWO MEMBERSHIP VALUES IN ONE TICK, a deliberate exception to M2's 'one value, threaded', with C40 as its stated reason. Both call sites must document it (`pitfalls_resolves_systems_once`, `lead_author_resolves_systems_once`) or a later reader will conflate the sets and read this lane's demands as covering the other's.",
