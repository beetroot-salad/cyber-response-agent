       resolution: "ADOPTED (human, §7) — FILTER AT THE RESOLVER, AND LOG EACH REFUSAL. READING TAKEN: `_is_system_name` moves beside the resolver (learning-side, with it — FK-11 answers the layering question in the same direction) and screens every candidate BOTH sources produce, so the set can never CARRY 'dir', '.hidden', '' or '..'. THIS RESOLUTION IS THE ONLY THING CLOSING R6's LOG SINK — the dropped-names line renders a raw system name and filtering at the source is its sanitizer, so a later reader cannot revisit FK-5 without re-opening that gap with nothing else pinning it. AMENDED (human, #915) — THE SIDE IS REVERSED; NOTHING ELSE IS. The predicate is now `runtime.verbs.is_system_name` and this artifact's `_is_system_name` resolves against nothing. WHAT THE AMENDMENT DOES NOT TOUCH: the filter still runs AT THE RESOLVER, on BOTH resolution points, and every refusal is still logged with the source directory it came from — so R6's log sink stays closed by exactly the mechanism this resolution named, and the sentence above about re-opening it still binds. WHAT IT CHANGES: where the predicate is DEFINED. #908's probe found the learning-side version admitting `my sys` and a non-ASCII name that `_adapter_path` refuses — a name DECLARED a system that cannot RESOLVE as one — because it screened against an alphabet of its own while claiming to hold names to the dispatch seam's. The seam is where the alphabet is enforced, so it is the only place a single definition makes the two unable to disagree. SCOPE: this amends the layering for the SHAPE HALF ALONE. `declared_systems` and `adapter_declared_systems` remain learning-side, so FK-11's answer stands for them unchanged.",
       resolved_to: resolver_refuses_shape_anomalous_names}
    - {rule: R4, element: "consumed_category.domain.alternatives[consumed_undeclared]",
