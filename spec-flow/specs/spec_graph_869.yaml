  - {id: pitfalls_admits_declared_without_skill_md, kind: behavior, form: test,
     discharged_by: test_a_declared_system_with_no_skill_md_is_admitted,
     binds: [_pitfalls_path_rule, _build_pitfalls_handoffs, skills_tree,
             "interacts(_build_pitfalls_handoffs->skills_tree)"]}
     # What the SUBTRACTION buys, and #870 R2's prerequisite: a tree that declares `ticket`
