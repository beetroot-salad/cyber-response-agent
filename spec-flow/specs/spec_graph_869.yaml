# ---------------------------------------------------------------------------
# READ THIS FIRST — WHICH DOCUMENT WINS
#
# The design doc (`00-intent-design.md`) is NOT authoritative on demand #0. Phase B refuted its
# central premise and a human resolved three forks; `35-design-corrections.md` §1 is the resolved
# contract, AS FURTHER RESOLVED at the §7 human seam (`70-resolutions.md`), and this graph is
# built against both:
#
#   declared_systems(repo_root) -> frozenset[str]
#     = the ADAPTER source  (<root>/defender/scripts/adapters/*_adapter.py through verbs._system_of)
#                           read from the WORKING tree
#     ∪ the MARKER source   (<root>/defender/skills/<name>/execution.md)
#                           read from the COMMITTED tree (NF1, §7) — an uncommitted marker,
#                           however it got onto disk, declares nothing — at EXACTLY ONE
#                           directory of depth: `<name>` is the segment directly under
#                           `defender/skills/`, and a committed `execution.md` nested any
#                           deeper declares nothing at all (`marker_source_is_exactly_depth_one`,
#                           minted at the phase-F repair; the obvious `git ls-tree -r … `
#                           filtered on the basename gets this WRONG by default)
#   Either source unresolvable -> RAISES (the disjunctive reading O4 forces). Both present, union
#   empty -> an honest frozenset() plus a log line naming BOTH directories. The empty set is NOT
#   spendable as a gate (RF6). Resolved ONCE, before the agent is spawned, never re-derived (RF1).
#   Every name the resolver EMITS has passed `_is_system_name`, and each refused entry is logged
#   (FK-5, §7) — the set can never carry `''`, `'..'`, `'.hidden'` or a directory name.
#
# THE UNION IS ASYMMETRIC, AND THE ASYMMETRY IS THE DESIGN, NOT AN ACCIDENT. The adapter half
# answers from the tree as it stands; the marker half answers from the tree as it was last
# committed. A reader who assumes ONE source for both will mis-read every demand below that
# drives a planted or a scaffolded marker. `marker_read_is_from_the_committed_tree` is the demand
# that states it.
#
# AND THERE ARE TWO MEMBERSHIP VALUES IN ONE TICK (NF2, §7) — a deliberate exception to M2's
# "one value, threaded", with C40 as its reason:
#   * the PITFALLS lane (`_build_pitfalls_handoffs`, `_pitfalls_path_rule`) is handed the
#     ADAPTER HALF ALONE, resolved at its OWN named call —
#     `adapter_declared_systems(repo_root) -> frozenset[str]`, minted at the phase-F repair
#     (F4) because NF2 requires a second resolution point and no input had named it. Three
#     properties ride on that call and none is inherited from the union: it does NOT raise
#     when the MARKER source is unresolvable (it never consults it), emptiness is measured on
#     the ADAPTER HALF rather than the union, and FK-5's shape filter and per-refusal log line
#     apply on that path too. C40: a row's `system` is narrowed to the adapter registry at the
#     writer, so an MCP system can never reach that queue — the union buys nothing there while
#     newly permitting the curator to edit an MCP system's own `execution.md`, the marker file.
#   * the PATH-COMPOSITION gates (`_skills_path_rule`, `synthesize_drafts`,
#     `discover_system_drafts`) are handed the UNION.
#   Both call sites carry this in their own comments. A later reader who conflates the two sets
#   will read `path_composition_parity` as covering a marker-only name at the pitfalls gate; it
#   does not, and cannot.
#
# Phase C's probe leaf (`47-reground.md`) post-dates the judge and overrides it twice:
#   * PO-K OVERTURNS FK-17. `_quarantine_lead_author_failure` is TERMINAL on the first tick; the
#     3-attempt ceiling governs `_LeadAuthorRetry`, a class a membership refusal never raises. A
#     marker refused for naming an undeclared name is NOT rescued when the adapter later lands.
#   * PO-A. CPython 3.11.15 lists the whole scandir before the first yield, so a truncated set is
#     unreachable — AND an unreadable adapters dir is a silent `[]` too, a THIRD case beyond J1's
#     absent/regular-file pair. So M1's "absent or unreadable -> raises" is NOT obtainable from
#     `Path.glob`: every demand asserting it names the explicit per-source check that produces it
#     (`resolver_distinguishes_absent_from_empty_without_the_glob`).
#
# WHAT §7 DECIDED (`70-resolutions.md` — the authority; every hole below now carries its
# `resolution`). THIRTY fork records over 27 live fork identities were reconciled to a
# disposition and NONE is left open: 14 human-resolved here, 3 human-resolved earlier at the
# early-exit seam (RF1/RF2/RF6+RF7, already folded into `35`), 7 auto-resolved as non-material,
# 4 settled by executed probe, 2 subsumed. (Recounted from the `handoff.forks` block's own
# content at the phase-F repair — F9. This sentence and the `handoff:` preamble both read
# "twenty-nine … 13 human-resolved", one short in the field the merge-gate human reads to see
# which choices were made without them: `70-resolutions.md`'s §7 count is 14, which
# `handoff.forks`' own comment already said two paragraphs later.) One human answer OVERRIDES the judge: NF1 takes the committed tree. One obligation is
# DECLINED and carried as `Demand {form: waiver}` (FK-8), never as a silence. The structural homes
# the gate reads are unchanged in shape — the same ten `documented_alternatives`, the same
# formerly-unbound distinguished member, the same R7 firings — but each now records a decision:
#   * ADOPTED, each with a demand of its own: NF1 (committed-tree marker read), NF2 (adapter-only
#     at the pitfalls lane), FK-2 (`consumed_undeclared`), FK-5 (filter at the resolver),
#     FK-7 (full `{system}.{kebab-name}` shape), FK-17 (terminal + a re-drivable graveyard);
#   * REJECTED, and pinned as rejected so the crossing is stated either way: FK-6 (no case or
#     Unicode folding), FK-10 (no reserved-name exclusion), NF3 (the id rule does not reach
#     `name:`), NF4 (marker EXISTENCE, not a content signature);
#   * FK-1 refuses all six non-system `SKILL.md` writes — the formerly-unbound
#     `_skills_path_rule.domain.distinguished[non-system-skill-md]` is now BOUND;
#   * FK-4 adds `discover_system_drafts` as a FOURTH composition site (its edge moves into the
#     delta), FK-3 mints a reporting surface at site 3 where none existed, FK-12 puts
#     `evals/harness_lead.py` inside the fixture ripple;
#   * FK-8 is DECLINED (a waiver), and the `scrub` per-reader R7 dismissal is CONFIRMED as a
#     waiver on claim D2.
#
# NAMES THIS SPEC MINTS ON THE PRODUCTION SIDE (the implementer must build them under exactly
# these names or the suite cannot import):
#   declared_systems(repo_root) -> frozenset[str]      # LEARNING-side (FK-11, §7), raising
#                                                      # LeadAuthorError, importing ADAPTER_SUFFIX
#                                                      # and _system_of from runtime.verbs at
#                                                      # MODULE level (C27's direction, J2's class)
#   adapter_declared_systems(repo_root) -> frozenset[str]
#                                                      # NF2's SECOND resolution point — the value
#                                                      # the PITFALLS lane is handed. Minted at the
#                                                      # phase-F repair (F4), beside the union
#                                                      # resolver and on the same side
#   _is_system_name(name) -> bool                      # M6's shape half, split out of _is_real_system
#                                                      # and applied AT THE RESOLVER too (FK-5),
#                                                      # on BOTH resolution points
#     SUPERSEDED BY #914 — this symbol no longer exists. It is now
#     `runtime.verbs.is_system_name`, RUNTIME-side, which reverses the layering FK-5 (§7)
#     adopted below. The record of that decision stands as written; see handoff.deviations.
#   DefenderPaths.adapters_dir                          # M2's boundary name (skills_dir exists)
# AND ONE IT DELETES: `pitfalls_curator._is_real_system`, with the two stale in-code
# justifications at `:47` and `:144` that C34 refuted (they argue the census that chose SKILL.md
# over execution.md, and that census no longer holds: 7 of 7 systems have an execution.md).
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # M1 / O4 — the resolver as a value. Demand #0, resolved (35 §1, eight parts).
  # =========================================================================

  - {id: declared_systems_returns, kind: behavior, form: test,
     discharged_by: test_declared_systems_unions_the_adapter_glob_and_the_marker,
     binds: [declared_systems, systems, "interacts(declared_systems->adapters_dir)",
             "interacts(declared_systems->skills_tree)"]}
     # #0 parts 1-3. The return is a `frozenset[str]` — deliberately NOT
     # `ModuleVerbRegistry.systems()`'s sorted tuple — and it is the UNION of the two sources,
     # both rooted at the ONE tree-root parameter. The fixture must carry a marker-only system
     # and an adapter-only system, or the union is indistinguishable from either half.
     # FIXTURE TRAP ADDED BY NF1 (§7): the marker-only system's `execution.md` must be COMMITTED
     # in the fixture repo. A fixture that only writes it to disk exercises nothing — the marker
     # half no longer reads the working tree.

  - {id: declared_systems_union_marker, kind: behavior, form: test,
     discharged_by: test_a_marker_only_system_is_declared,
     binds: [declared_systems, systems, "interacts(declared_systems->skills_tree)"]}
     # RF1. A tree whose `skills/mcpsys/` holds a COMMITTED `execution.md` and whose adapters
     # directory holds no `mcpsys_adapter.py` declares `mcpsys` — the MCP-routed system of record
     # `connect/mcp.md` onboards WITHOUT an adapter is declared, not silently retired.
     # NF1 (§7) narrows this: the marker must be committed. A scaffolded-but-unmerged MCP system
     # stays undeclared until the `connect` branch lands — the accepted cost of the committed-tree
     # read, recorded here rather than discovered at implementation time. This demand is
     # `marker_read_is_from_the_committed_tree`'s positive control.

  - {id: marker_read_is_from_the_committed_tree, kind: behavior, form: test,
     discharged_by: test_the_marker_half_reads_the_committed_tree_and_the_adapter_half_does_not,
     positive_control: declared_systems_union_marker,
     binds: [declared_systems, "skills_tree.domain.alternatives[committed-tree-marker-read]",
             "interacts(declared_systems->skills_tree)",
             "interacts(declared_systems->adapters_dir)"]}
     # NF1 (§7, OVERRIDING the judge's recommendation of the working tree). ONE drive, BOTH arms,
     # because the asymmetry is the observable: in a tree where `defender/skills/mcpsys/execution.md`
     # exists on disk but is NOT committed, `mcpsys` is NOT declared; commit it and it is. In the
     # SAME tree an uncommitted `scripts/adapters/newsys_adapter.py` IS declared, because the
     # adapter half reads the working tree. A test that drives only the marker arm cannot tell a
     # committed-tree read from a resolver that ignores markers altogether, and a test that drives
     # only the negative arm passes against a resolver that returns frozenset().
     # WHY THE OVERRIDE: this closes phase C's executed planted-marker break (C33) STRUCTURALLY.
     # An `execution.md` the agent plants mid-tick is refused not because the resolution happened
     # first, and not because a `finally` swept the worktree, but because it was never committed.
     # Marker integrity is now the commit gate (`marker_is_not_agent_committable`) plus this read
     # — and `uncommitted_residue_does_not_cross_lanes` does NOT discharge it (see that demand).

  - {id: marker_source_is_exactly_depth_one, kind: negative, form: test,
     discharged_by: test_the_marker_source_is_exactly_depth_one,
     positive_control: declared_systems_union_marker,
     binds: [declared_systems, "skills_tree.domain.distinguished[nested-execution-md]",
             "interacts(declared_systems->skills_tree)"]}
     # MINTED AT THE PHASE-F REPAIR (F1, human-resolved — BOTH halves; this is half (i)). The
     # marker address is `<root>/defender/skills/<name>/execution.md` and nothing deeper: a
     # COMMITTED `execution.md` nested below that declares nothing, and in particular does not
     # declare its own parent directory's name.
     # THE COMPOSITION IT CLOSES. Two individually-pinned facts jointly admit a forged marker.
     # (a) `marker_is_not_agent_committable` refuses the exact two-segment form at the commit
     # gate. (b) `_is_in_scope` is `_is_catalog_path or _is_system_skill_md or
     # _is_system_skill_draft`, and two of those three are DEPTH-UNBOUNDED — so the lane may
     # commit `defender/skills/elastic/_draft/mcpsys/execution.md` and
     # `defender/skills/gather/queries/elastic/mcpsys/execution.md`, whose parent directory
     # names are entirely model-chosen (X1, executed at this base: both ADMITTED, and the
     # write-allow regex already matches them — C33). If the marker half is then written as the
     # obvious `git ls-tree -r … -- defender/skills` filtered on the basename, `mcpsys` becomes
     # declared on the next tick (X2, executed) while EVERY other control in this spec holds:
     # the file really is committed (NF1 satisfied) and really does predate the resolution
     # (`membership_resolved_before_the_agent` satisfied).
     # The spec must not rest on the implementer getting the recursion right, so the depth is a
     # demand of its own; F1's half (ii) is the belt at the other end
     # (`marker_is_not_agent_committable` now refuses the basename at ANY depth), and neither
     # half is asked to carry the composition alone.
     # FIXTURE: both nested paths must be COMMITTED — an uncommitted one is refused by
     # `marker_read_is_from_the_committed_tree` for a different reason and would assert nothing
     # about depth. The wrong answer is computed in-test from the same committed tree, so the
     # fixture is shown to separate the two readings rather than asserting a difference no tree
     # exhibits.
     # PROVENANCE OF THE GAP, recorded because it is a process finding as much as a spec one:
     # `40-premises.md`'s red flag 1 named this exact class and routed it to the orchestrator
     # for a strong-author follow-up; it reached no downstream file until phase F's cold walk.

  - {id: declared_systems_union_is_a_noop_here, kind: parity, form: test,
     discharged_by: test_the_union_equals_the_adapter_set_on_the_committed_tree,
     binds: [declared_systems, systems]}
     # RF1's positive control and N2's guarantee, as a test rather than a reassurance (C31): on
     # the committed tree both sources yield the SAME seven names — zero marker-only, zero
     # adapter-only — so the widening evicts nothing and admits nothing, and any divergence a
     # run reports is a regression.

  - {id: declared_systems_absent_dir_raises, kind: behavior, form: test,
     discharged_by: test_declared_systems_raises_when_either_source_is_unresolvable,
     binds: [declared_systems, "adapters_dir.domain.distinguished[absent]",
             "skills_tree.domain.distinguished[absent]",
             "skills_tree.domain.distinguished[unreadable]"],
     rejected: [{nl: "returning frozenset() and letting the caller not know the difference"},
                {nl: "the CONJUNCTIVE reading — raising only when BOTH sources are unresolvable,
                      which would return the marker half alone and silently retire every
                      adapter-backed system (35 §1.5, derived from O4, not chosen)"}]}
     # NF1 (§7) RE-READS the two `skills_tree` members this binds. `absent` and `unreadable` are
     # states of the MARKER SOURCE, and the marker source is now the committed tree — so `absent`
     # is "no `defender/skills` at HEAD" and `unreadable` is "the committed-tree read fails", not
     # a `stat` on a working-tree directory. The adapter members are unchanged (that half still
     # reads the working tree). The disjunctive raise is unchanged in either reading: either
     # source unresolvable raises. The exact git fault taxonomy behind "unresolvable" is a
     # `primitive` claim this spec does not own — see `handoff.deferred`.

  - {id: resolver_distinguishes_absent_from_empty_without_the_glob, kind: behavior, form: test,
     discharged_by: test_the_resolver_tests_each_source_rather_than_trusting_the_glob,
     positive_control: declared_systems_empty_dir_reports,
     binds: [declared_systems, "interacts(declared_systems->adapters_dir)",
             "adapters_dir.domain.distinguished[absent]",
             "adapters_dir.domain.distinguished[regular-file]",
             "adapters_dir.domain.distinguished[unreadable]"]}
     # J1 + P2 — THE demand that makes #0 part 5 obtainable. `Path.glob('*_adapter.py')` returns
     # `[]` with no exception for an absent path (J1), for a regular file (J1) AND for an
     # unreadable directory under a real non-root uid (P2, `except PermissionError: return`). All
     # three of M1's "absent or unreadable" states are SILENT EMPTY SETS, so the raise comes from
     # an explicit per-source test or not at all. The unreadable arm is pinned even though this
     # loop runs as uid 0 in its container: the production uid is not this design's to fix.
     # P1 closes the fourth state — a partially-yielded set is unreachable on this interpreter,
     # so no wrapper is owed and the demand needs no truncation arm.

  - {id: declared_systems_empty_dir_reports, kind: behavior, form: test,
     discharged_by: test_declared_systems_reports_an_empty_union,
     binds: [declared_systems, "systems.domain.distinguished[frozenset()]",
             "interacts(declared_systems->loop_log)"]}
     # #0 part 6. Both sources present, union empty -> an honest `frozenset()` plus ONE log line
     # naming BOTH directories. The falsy member is a valid answer at the resolver and is never a
     # silent one. What the CONSUMERS may do with it is a different demand — see
     # `empty_declared_set_refuses_the_lane`.

  - {id: declared_systems_no_adapter_import, kind: negative, form: test,
     discharged_by: test_declared_systems_imports_no_adapter_and_reads_no_marker_body,
     positive_control: declared_systems_returns,
     binds: [declared_systems, "interacts(declared_systems->adapters_dir)",
             "interacts(declared_systems->skills_tree)"]}
     # C2/G1: the adapter half is a COLD glob — a directory whose `*_adapter.py` files raise on
     # import still yields their names, and no adapter module appears in `sys.modules` afterwards.
     # 35 extends it to the marker half: a `stat`, never a read of `execution.md`'s body (which
     # is also why NF4's content-signature alternative is a real cost, not a free upgrade).

  - {id: resolver_failure_is_not_swallowed_as_a_successful_tick, kind: behavior, form: test,
     discharged_by: test_a_resolver_failure_is_not_a_successful_tick,
     binds: [run_pitfalls, resolver_fault_class,
             "resolver_fault_class.domain.distinguished[LeadAuthorError]",
             "interacts(run_pitfalls->loop_log)", "interacts(run_pitfalls->learning_queue)"]}
     # J2/G12, executed at this base: `_run_curator_module` catches `(SubprocessError, OSError)`,
     # logs "(continuing)" and returns `None`, which `_invoke_pitfalls` maps to rc 0 — so an
     # `OSError` out of the resolver is a GREEN tick with the queue rotated, which is O4's own
     # named failure. The resolver's fault must not present to that handler as an OSError.
     # KNOWN LIMIT (47 red flag 2, a composition finding no premise asked about): the SAME
     # exception class has opposite dispositions on the two legs — an `OSError` on the marker leg
     # reaches `_LeadAuthorRetry` and burns 3 bounded attempts, while on the pitfalls leg it maps
     # to rc 0. This demand pins the pitfalls leg only; the lead-author leg is FK-17, now
     # RESOLVED at §7 (terminal + a re-drivable graveyard) and pinned by
     # `membership_refusal_is_terminal_and_recorded`.

  - {id: resolver_refuses_shape_anomalous_names, kind: behavior, form: test,
     discharged_by: test_the_resolver_never_emits_a_shape_anomalous_name,
     binds: [declared_systems, _is_system_name,
             "_is_system_name.domain.alternatives[applied-at-the-resolver]",
             "interacts(declared_systems->adapters_dir)",
             "interacts(declared_systems->loop_log)"]}
     # FK-5 (§7): FILTER AT THE RESOLVER, AND LOG EACH REFUSAL. `_is_system_name` moves beside
     # `declared_systems` (learning-side, with it — FK-11) and is applied to every candidate BOTH
     # sources produce, so the set can never CARRY a malformed name. J4 (executed) is the fixture:
     # an adapters directory holding a DIRECTORY named `dir_adapter.py`, a `.hidden_adapter.py`,
     # the suffix-only `_adapter.py` and `.._adapter.py` yields `'dir'`, `'.hidden'`, `''` and
     # `'..'` from `_system_of` today. None may appear in the returned frozenset; each refusal is
     # named in the log line with the source it came from.
     # THIS ALSO CLOSES R6's ONLY OPEN FRAME SLOT, and it is the only thing that does (70's Red
     # flags): the dropped-names log line renders a raw system name with no sanitizer between the
     # chooser (the adapter glob / the marker read, both attacker-influenced per J4) and the sink.
     # Filtering at the SOURCE is that sanitizer. A later reader who revisits FK-5 reopens the log
     # sink with nothing else pinning it.
     # The marker half is filtered too: a committed `defender/skills/.hidden/execution.md` is
     # refused by the same predicate, not admitted because it came from the other source.

  - {id: pitfalls_adapter_half_resolution_point, kind: domain-outcome, form: test,
     discharged_by: test_the_adapter_half_resolution_point_is_its_own_call,
     binds: [declared_systems, systems, _is_system_name, run_pitfalls,
             "systems.domain.alternatives[adapter-only-at-the-pitfalls-lane]",
             "interacts(declared_systems->adapters_dir)",
             "interacts(declared_systems->loop_log)"]}
     # MINTED AT THE PHASE-F REPAIR (F4, human-resolved). NF2's SECOND RESOLUTION POINT GETS A
     # NAME AND A SIGNATURE: `adapter_declared_systems(repo_root) -> frozenset[str]`, the value
     # the pitfalls lane is handed. The artifact mints two production symbols and this was not
     # one of them — `pitfalls_lane_resolves_the_adapter_half_only` pins WHICH SET each lane
     # gets and no input named the CALL that produces the second one, so three properties rode
     # on an unstated choice. Each is pinned here and none is inherited from the union:
     #   1. THE DISJUNCTIVE RAISE IS NOT INHERITED. `declared_systems_absent_dir_raises` binds
     #      the union resolver; §1.5 of `35` derived the disjunctive reading from O4 for a
     #      SINGLE-VALUE world. This call never consults the marker source, so an unresolvable
     #      MARKER source is not its fault to raise — driven on one tree with no
     #      `defender/skills` at all, where the union raises and this call answers. Its own
     #      source stays mandatory (a missing adapters directory raises here too), which is the
     #      control against "this call never raises".
     #   2. EMPTINESS IS MEASURED ON THE ADAPTER HALF, NOT THE UNION.
     #      `empty_declared_set_refuses_the_lane` seeds BOTH sources empty and cannot tell them
     #      apart. A tree with committed markers and no adapters genuinely declares systems and
     #      must STILL refuse the whole pitfalls lane — a live consequence of NF2 that no input
     #      stated. The union is non-empty in the same drive.
     #   3. FK-5's SHAPE FILTER AND ITS PER-REFUSAL LOG LINE APPLY ON THIS PATH.
     #      `resolver_refuses_shape_anomalous_names` drives `declared_systems` only, and this
     #      path is the ONLY thing closing R6's log sink for the pitfalls lane's own
     #      dropped-names line — the one whose sanitizer FK-5 placed at the source. J4's four
     #      derived values are driven again here, `cmdb` surviving as the control.

  # =========================================================================
  # M2 / O1 — resolve once at the boundary, thread inward non-Optional.
  # =========================================================================

  - {id: adapters_dir_named_once, kind: seam, form: test,
     discharged_by: test_paths_owns_both_source_directory_names,
     binds: [adapters_dir, skills_tree, "interacts(defender_paths->adapters_dir)",
             "interacts(defender_paths->skills_tree)"]}
     # C25/G14: `DefenderPaths` owns `skills_dir` and `catalog_dir` but NO `adapters_dir`, and the
     # literal "scripts/adapters" is spelled at four sites. #0 part 3 moves this demand: the
     # resolver takes ONE tree root, so `DefenderPaths` must own BOTH directory names and a
     # worktree-rooted `LoopPaths` must answer for the worktree at BOTH.

  - {id: pitfalls_resolves_systems_once, kind: seam, form: test,
     discharged_by: test_run_pitfalls_resolves_systems_before_the_curator_is_spawned,
     binds: [run_pitfalls, systems, "interacts(run_pitfalls->systems)",
             "drives(run_pitfalls->curator_agent)"]}
     # 35 strengthens "once at its boundary" to "once, BEFORE the curator is spawned" (C33).
     # CALL SITE 1 OF 2 FOR NF2 (§7) — READ THIS WITH `lead_author_resolves_systems_once`. The
     # value resolved HERE is the ADAPTER HALF ALONE, not the union: `_build_pitfalls_handoffs`
     # and `_pitfalls_path_rule` are both handed it. This is a deliberate exception to M2's "one
     # value, threaded" — two membership values live in one tick — and C40 is its reason (a row's
     # `system` is narrowed to the adapter registry at the writer, so an MCP system can never
     # reach this queue; the union would buy nothing here while newly permitting the curator to
     # edit an MCP system's own `execution.md`). `pitfalls_lane_resolves_the_adapter_half_only`
     # is the demand. Do NOT "fix" this into one value without re-opening NF2.

  - {id: lead_author_resolves_systems_once, kind: seam, form: test,
     discharged_by: test_lead_author_resolves_systems_before_the_agent_is_spawned,
     binds: [lead_author_run, systems, "interacts(lead_author_run->systems)",
             "drives(lead_author_run->author_agent)"]}
     # `build_lead_author_deps` resolves once from `paths` and threads it non-Optional into
     # `synthesize_drafts`, `discover_system_drafts` and `_skills_path_rule`; a `LeadAuthorDeps`
     # built for a worktree carries THAT worktree's set. Ordering: before `_spawn_author_agent`,
     # not merely before use.
     # CALL SITE 2 OF 2 FOR NF2 (§7) — READ THIS WITH `pitfalls_resolves_systems_once`. The value
     # resolved HERE is the UNION (adapter ∪ committed marker), and it governs all three
     # path-composition consumers on this lane. It is NOT the value the pitfalls lane is handed;
     # the two sets are different questions asked in the same tick, deliberately, with C40 as the
     # reason. A reader who assumes one set will read this lane's demands as covering the pitfalls
     # gate. They do not.

  - {id: consumers_do_not_rederive, kind: negative, form: test,
     discharged_by: test_no_membership_consumer_reprobes_the_tree,
     positive_control: pitfalls_resolves_systems_once,
     binds: [synthesize_drafts, _skills_path_rule, _pitfalls_path_rule, _build_pitfalls_handoffs,
             systems]}
     # PROMOTED from hygiene to a load-bearing control (C33, executed): with `skills/mcpsys/`
     # empty `_pitfalls_path_rule` RAISES; after planting the marker file as the agent would, the
     # SAME call ADMITS. The adapter half was safe by construction (the adapters directory is
     # outside both the write-allow regex and `_verify_corpus_scope`'s `defender/skills/**.md`
     # prefilter); the marker half was not. The fault content is a planted marker, not a
     # merely-disagreeing set.
     # AFTER NF1 (§7) this demand is still required and its altitude has NOT changed, but its
     # REASON has: a consumer that re-derives the marker half from the WORKING tree would now be
     # answering a different question than the resolver did, not merely an earlier one. The test
     # drives a consumer with a set that contradicts the tree under it — which is exactly the
     # fault a working-tree re-derivation produces — so the demand bites harder, not less.
     # NF2 NOTE: `synthesize_drafts` and `_skills_path_rule` answer from the UNION they were
     # handed; `_pitfalls_path_rule` and `_build_pitfalls_handoffs` answer from the ADAPTER HALF
     # they were handed. "No consumer re-derives" is about the argument, never about the two
     # arguments being equal.

  - {id: pitfalls_resolves_from_worktree, kind: behavior, form: test,
     discharged_by: test_pitfalls_resolves_the_tree_it_commits_into,
     binds: [run_pitfalls, systems, "interacts(declared_systems->adapters_dir)",
             "skills_tree.identity"]}
     # The `tree_root` key axis, as a test. Driven with `paths.repo_root` pointing at a worktree
     # whose sources declare a system the process's own checkout does not, `run_pitfalls` admits
     # it — exactly as `skills_dir` is already threaded (`pitfalls_curator.py:200`), and unlike
     # `_build_pitfalls_handoffs`'s own default, which still anchors on the process-global
     # `SKILLS_DIR` (G14).

  - {id: membership_resolved_before_the_agent, kind: behavior, form: test,
     discharged_by: test_a_marker_planted_during_the_tick_does_not_declare_its_system,
     binds: [run_pitfalls, lead_author_run, systems, "interacts(author_agent->skills_tree)",
             "skills_tree.access[write-tool]"]}
     # RF1's ordering property, with an executed break attempt behind it (C33). An agent that
     # plants `defender/skills/mcpsys/execution.md` during its own tick does not thereby declare
     # `mcpsys`: every gate in that tick answers from the set resolved BEFORE the spawn, and the
     # planted path is still refused.
     # NF1 (§7) DEMOTES THIS FROM SOLE CONTROL TO ONE OF THREE, and phase C's answers do not say
     # so (see 75-resolved-graph.md's re-classification list). Under the committed-tree marker
     # read the planted marker declares nothing in ANY tick, at ANY ordering, because it was never
     # committed. Keep this demand — ordering is still required, and it is the only control that
     # covers the ADAPTER half, which still reads the working tree — but do NOT author it, or read
     # it, as "the one thing standing between a planted marker and a declared system". The
     # observable is unchanged; the reason it holds is now overdetermined, and the test should say
     # which control it is exercising.

  - {id: uncommitted_residue_does_not_cross_lanes, kind: survival, form: test,
     discharged_by: test_uncommitted_residue_does_not_cross_lanes,
     binds: [lead_author_drain, lead_author_run, run_pitfalls, "skills_tree.identity",
             "drives(lead_author_drain->run_pitfalls)"]}
     # J3 — the BETWEEN-LANE half of resolve-before-spawn, named in no design sentence, no brief
     # and no demand until phase C found it. `membership_resolved_before_the_agent` is a PER-LANE
     # control (two spawns, two resolutions); `_discard_worktree_changes` (`git reset --hard` +
     # `git clean -fdq`) in a `finally` at `drains.py:254,295` is what stops lane 1's residue from
     # reaching lane 2 at all, and `commit_corpus` stages the whole `defender/skills` pathspec
     # (F6), so a change that removes or narrows that `finally` changes what lane 2 can commit.
     #
     # RETAINED AT LOWER ALTITUDE (§7, and this is load-bearing for how phase E authors it). The
     # judge minted this demand as NF1's COMPENSATING control: under a working-tree marker read,
     # the union's safety provably rested on this `finally`. The human took the COMMITTED tree
     # instead, so that is no longer true — marker integrity is `marker_read_is_from_the_committed_tree`
     # plus `marker_is_not_agent_committable`, and a refused-but-written `skills/<x>/execution.md`
     # surviving the sweep would declare nothing anyway. THIS DEMAND MUST NOT BE AUTHORED, READ OR
     # CITED AS DISCHARGING MARKER INTEGRITY. It is kept because J3 governs MORE than the marker:
     # it is an undocumented cross-lane mechanism four phase-C premises turn on, and every OTHER
     # corpus file a refused lane leaves behind — a `SKILL.md`, a `_draft/`, a catalog template —
     # is still exposed to lane 2's `git add -- defender/skills` without it. Drive that: lane 1
     # refuses and leaves a NON-marker corpus file behind; lane 2 must not commit it.

  - {id: pitfalls_lane_resolves_the_adapter_half_only, kind: domain-outcome, form: test,
     discharged_by: test_the_pitfalls_lane_is_handed_the_adapter_half_and_the_gates_the_union,
     binds: [run_pitfalls, lead_author_run, systems,
             "systems.domain.alternatives[adapter-only-at-the-pitfalls-lane]",
             "interacts(run_pitfalls->systems)", "interacts(lead_author_run->systems)"]}
     # NF2 (§7). TWO MEMBERSHIP VALUES IN ONE TICK — a deliberate, documented exception to M2's
     # "one value, threaded", with C40 as the reason it costs nothing. One drive over ONE tree
     # that carries a MARKER-ONLY system (`skills/mcpsys/execution.md`, committed; no
     # `mcpsys_adapter.py`), observing both lanes:
     #   * the pitfalls lane does NOT declare `mcpsys` — a queued row naming it is dropped and
     #     reported, and `_pitfalls_path_rule` refuses `skills/mcpsys/execution.md`, which is what
     #     keeps the curator out of an MCP system's own marker file;
     #   * the lead-author lane DOES declare it — `_skills_path_rule` admits
     #     `skills/mcpsys/SKILL.md` and `synthesize_drafts` mints for `mcpsys.<kebab>`.
     # A test that drives only one lane, or that uses a tree where the two sources agree (which
     # every real tree does today — C31), asserts nothing: the split is invisible unless the
     # fixture contains a name the two sources disagree about.
     # THE COST, RECORDED: `path_composition_parity` cannot use a marker-only name, and no demand
     # in this spec asserts that the two values are equal, because under NF2 they are not.

  # =========================================================================
  # M3 / O2 / U3 — the queries-table row names the system the call was dispatched to.
  # =========================================================================

  - {id: qid_foreign_prefix_refused, kind: behavior, form: test,
     discharged_by: test_resolve_query_id_refuses_a_foreign_prefix,
     binds: [resolve_query_id, "resolve_query_id.domain.distinguished[foreign-prefix]",
             "interacts(query_tool->executed_queries_table).payload"]}
     # The mechanism that closes the ONE reachable instance (C12/C12r/G3, reproduced at this
     # base): `resolve_query_id('elastic','esql','fakesys.hunt-creds')` returns it VERBATIM today,
     # and the host then mints `fakesys/_draft/hunt-creds.md`. Refused exactly like a reserved or
     # traversal-bearing id — a shape rule at the writer, no registry lookup (the #855 posture).

  - {id: qid_own_prefix_survives, kind: behavior, form: test,
     discharged_by: test_resolve_query_id_keeps_a_matching_prefix,
     positive_control_for: qid_foreign_prefix_refused,
     binds: [resolve_query_id, "resolve_query_id.domain.distinguished[own-prefix]"]}
     # The new rule refuses a DISAGREEING prefix, not model-supplied ids as a class.

  - {id: qid_fallback_is_the_untagged_value, kind: behavior, form: test,
     discharged_by: test_refused_query_id_lands_on_the_untagged_value,
     binds: [resolve_query_id, "resolve_query_id.domain.distinguished[no-verb]"]}
     # C18/G10, re-executed at this base: the fallback is `{system}.{verb}`, or `{system}.ad-hoc`
     # when the call names no verb — the same value an untagged call already records, which is why
     # enforcement cannot strand a legitimate call.

  - {id: queries_row_records_dispatched_system, kind: shape, form: test,
     discharged_by: test_granted_call_records_its_own_system,
     binds: [executed_queries_table, "interacts(query_tool->executed_queries_table).payload"]}
     # O2 at the sink. A granted, successful query to `elastic` tagged
     # `query_id='fakesys.hunt-creds'` writes a row whose `query_id` is `elastic.esql` — the
     # schema `defender/CLAUDE.md` already states and nothing enforces, enforced where the value
     # is RECORDED. The row is append-only and read by later ticks, which is M4's reason to exist.

  - {id: query_id_enforces_the_full_schema_shape, kind: domain-outcome, form: test,
     discharged_by: test_resolve_query_id_enforces_the_whole_schema_shape,
     positive_control: id_prefix_rule_admits_the_committed_corpus,
     binds: [resolve_query_id, "resolve_query_id.domain.alternatives[full-schema-shape]",
             "interacts(query_tool->executed_queries_table).payload"]}
     # FK-7 (§7): M3 enforces the WHOLE `{system}.{kebab-name}` shape, not only the prefix. Three
     # values pass a prefix-only rule while violating the schema, and each must fall back to
     # `{system}.{verb}`: `'elastic'` (no separator — D1, executed: it passes VERBATIM today),
     # `'elastic.'` (empty remainder), and `'elastic.foo.bar'` (whose remainder
     # `_draft_candidate_segments`' `split('.',1)` turns into the kebab `'foo.bar'` — a second
     # unvalidated model-supplied path component at site 3). Closing D1 is the point: a
     # prefix-only rule leaves a model-supplied string in the filename position of a host-side
     # `mkdir` + `write_text`, which is the shape of the finding this whole issue exists to close.
     # C13r/C35's 34/34 census is the free positive control — no committed id is evicted.

  - {id: query_id_prefix_is_compared_by_exact_codepoints, kind: domain-outcome, form: test,
     discharged_by: test_the_prefix_comparison_folds_nothing,
     binds: [resolve_query_id, "resolve_query_id.domain.alternatives[case-folded-equality]",
             _build_pitfalls_handoffs, pitfalls_handoff]}
     # FK-6 (§7): EXACT CODEPOINT EQUALITY — no case folding, no NFC, no confusable mapping — and
     # the existing `.strip()` STAYS. The alternative is pinned as REJECTED rather than left
     # undiscussed, which is R4's "pin the crossing either way": a `query_id` prefixed `Elastic.`
     # or with a Cyrillic `е` on a call dispatched to `elastic` is REFUSED (falls back to
     # `elastic.esql`), never folded onto the real system. Failing closed is the whole reason:
     # folding would introduce a second name space every gate would then have to agree on.
     # THE ASYMMETRY IS STATED, NOT FIXED (J5): `_build_pitfalls_handoffs` strips whitespace from
     # a queued row's `system` BEFORE the predicate, so `'elastic '` is admitted at site 1 while
     # `'Elastic'` is refused everywhere. Both halves are asserted in one test so the asymmetry is
     # a recorded decision rather than an implementation accident a later reader "fixes".

  # =========================================================================
  # M4 / U1 — draft synthesis screens membership (site 3, the HOST-side writer).
  # =========================================================================

  - {id: draft_synthesis_refuses_undeclared, kind: behavior, form: test,
     discharged_by: test_synthesize_drafts_refuses_an_undeclared_system,
     binds: [synthesize_drafts, systems, "interacts(synthesize_drafts->catalog_dir)",
             "skills_tree.access[host-write]"]}
     # The site the design's own table calls reachable TODAY. `synthesize_drafts` mkdir+writes
     # `<catalog>/<system>/_draft/<suffix>.md` from a model-supplied `query_id` BEFORE the agent
     # is spawned and before `baseline_stray` is taken (F1); the only guards between are
     # `_SAFE_ID_SEGMENT` and an `is_relative_to` check, neither of which is a membership question.

  - {id: draft_synthesis_mints_declared, kind: behavior, form: test,
     discharged_by: test_synthesize_drafts_still_mints_for_a_declared_system,
     positive_control_for: draft_synthesis_refuses_undeclared,
     binds: [synthesize_drafts, "interacts(synthesize_drafts->catalog_dir)"]}
     # The screen refuses undeclared names, not drafting. NOTE FOR PHASE E (G9/R7): this is where
     # `test_lead_author_synth.py:53,75,78,127`'s `stub-cmdb.network-map` and `custom.tagged`
     # positive controls land. 45 settles that those assertions were WRONG under U1, not merely
     # flipped: they are rewritten to assert refusal, never deleted, skipped or loosened.

  - {id: draft_synthesis_screens_preexisting_rows, kind: behavior, form: test,
     discharged_by: test_synthesize_drafts_screens_a_row_recorded_before_the_writer_rule,
     binds: [synthesize_drafts, _draft_candidate_segments,
             "interacts(synthesize_drafts->executed_queries_table)"]}
     # Why depth is still worth having behind M3: the queries table is append-only, so a row
     # carrying a foreign-prefixed `query_id` recorded BEFORE the writer rule existed keeps it
     # forever, and `synthesize_drafts` reads those rows.

  - {id: draft_synthesis_reports_its_refusals, kind: behavior, form: test,
     discharged_by: test_synthesize_drafts_names_what_it_refused,
     positive_control: draft_synthesis_mints_declared,
     binds: [synthesize_drafts, loop_log, "interacts(synthesize_drafts->loop_log)"]}
     # FK-3 (§7): O3 REACHES SITE 3. This demand MINTS A REPORTING SURFACE WHERE NONE EXISTS —
     # `_draft_candidate_segments` returns `None` and site 3 drops SILENTLY today (F7), so unlike
     # `undeclared_names_reported` (which pins an existing log line) this one requires the
     # implementer to add the edge `interacts(synthesize_drafts->loop_log)`, which is why that
     # edge carries `provenance: design` and exists nowhere in the code yet.
     # The observable: a tick whose executed leads carry `fakesys.hunt-creds` mints no draft AND
     # emits a line naming `fakesys` and the reason. O3 is unqualified and a universal discharged
     # at two of three sites is not discharged — this was the ONE fork in the run where two
     # independent readers stated directly opposite outcomes, so the resolution is recorded here
     # rather than inferred from O3's wording.
     # NOT ASSERTED: what happens when the log WRITE ITSELF fails. The judge offered that as a
     # secondary ("out of scope"); it was not separately put to the human, so this demand neither
     # requires nor forbids anything there.

  - {id: discover_system_drafts_screens_membership, kind: behavior, form: test,
     discharged_by: test_discover_system_drafts_hands_out_no_undeclared_directory,
     binds: [discover_system_drafts, systems, loop_log,
             "interacts(discover_system_drafts->skills_tree)",
             "interacts(discover_system_drafts->loop_log)",
             "drives(lead_author_run->discover_system_drafts)"]}
     # FK-4 (§7): IN SCOPE — a FOURTH composition site. `discover_system_drafts` walks every child
     # of `skills_dir` and hands the agent `{"system": <dirname>, "skill_path":
     # "defender/skills/<dirname>/SKILL.md"}` with no membership filter (C29, executed), so a
     # `_draft/` under an undeclared directory becomes work the agent is INSTRUCTED to do and the
     # commit gate then refuses — an instructed-then-rejected loop with no retirement path. It
     # gains the union (this lane's value, NF2) and skips undeclared directories.
     # VACUOUS ON TODAY'S TREE by construction (C22: only `elastic/_draft` and `cmdb/_draft`
     # exist, both declared), so the test is a CONSTRUCTED FIXTURE — a `gather/_draft/x.md` — not
     # a drive of the committed corpus. That is what makes the demand real rather than green by
     # accident, and it is one `mkdir` away from live.
     # Its edge moves into the delta (provenance: code -> design) because the human moved it.
     # O3 REACHES THIS SITE TOO, ADDED AT THE PHASE-F REPAIR (the blind reader's Q7 gap). FK-3
     # resolved that a membership refusal is reported at every composition site and FK-4 then
     # GREW that census from three sites to four — this one — without the reporting obligation
     # following. Nothing pinned a trace here: a skipped directory left only "no work was handed
     # out", which from outside is indistinguishable from a tree that had none, and this site
     # is the one whose silence turns into an instructed-then-rejected loop's missing half. The
     # skipped name is named on a line of its own, `repr`'d for the reason
     # `resolver_refuses_shape_anomalous_names` gives, with the SAME walk over the SAME tree
     # with the name declared as its control. Like FK-3's, this MINTS the edge
     # (`interacts(discover_system_drafts->loop_log)`, provenance: design) — it exists nowhere
     # in the code.
     # THE OTHER HALF OF Q7's GAP — visibility at the commit gate's own raise — is pinned where
     # the raise happens, by `undeclared_names_reported`'s site-2 arm (the message carries the
     # undeclared NAME rather than an unrelated reason). Neither site is exempt; both are closed.

  # =========================================================================
  # M5 / RF2 / U1 / U2 — the lead-author commit gate (site 2).
  # =========================================================================

  - {id: skills_path_rule_refuses_undeclared_system_skill, kind: behavior, form: test,
     discharged_by: test_skills_path_rule_refuses_an_undeclared_system_skill,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[system-skill]",
             "interacts(lead_author_run->skills_tree)", "skills_tree.access[commit-gate]"]}
     # G4, executed: today this gate ACCEPTS AND COMMITS a brand-new
     # `defender/skills/fakesys2/SKILL.md`. Site 2 mints phantom SYSTEM directories, not only
     # catalog ones — a second, independent route the doc's U1/U2 sentences do not name.

  - {id: skills_path_rule_refuses_undeclared_catalog, kind: behavior, form: test,
     discharged_by: test_skills_path_rule_refuses_an_undeclared_catalog_system,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[catalog]",
             "interacts(lead_author_run->catalog_dir)"]}
     # The catalog form is keyed on the segment after `queries/`, and THAT segment must name a
     # declared system — see the demand below for why the key cannot be `skills/<x>/`.

  - {id: skills_path_rule_admits_declared_catalog, kind: behavior, form: test,
     discharged_by: test_skills_path_rule_still_admits_the_real_catalog,
     positive_control_for: skills_path_rule_refuses_undeclared_catalog,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[catalog]",
             "interacts(lead_author_run->catalog_dir)"]}
     # F2's control, and the reason F2 is a demand rather than an assumption: EVERY catalog path's
     # `skills/<x>` segment is `gather`, which declares no adapter (G7/R4), so M5 read literally
     # refuses the entire committed catalog. `consequence_if_wrong` is "the lead author commits
     # nothing at all", and this is the test that catches it.

  - {id: skills_path_rule_refuses_undeclared_draft, kind: behavior, form: test,
     discharged_by: test_skills_path_rule_refuses_an_undeclared_system_draft,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[system-draft]",
             "interacts(lead_author_run->skills_tree)"]}
     # The third in-scope form. A universal discharged at two of three forms is not discharged.

  - {id: non_system_skill_md_is_refused, kind: behavior, form: test,
     discharged_by: test_the_lane_cannot_commit_a_non_system_skill_md,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[non-system-skill-md]",
             "interacts(lead_author_run->skills_tree)", "skills_tree.access[commit-gate]"],
     rejected: [{nl: "carving the six reserved names out of M5 with a literal exception list —
                      the shape N4/N5 exist to avoid, and the shape FK-10 separately declined"}]}
     # FK-1 (§7): REFUSE ALL SIX. M5 keys on membership with no exception, so the lead-author lane
     # loses write access to `advisory/`, `connect/`, `gather/`, `handbook/`, `invlang/` and
     # `judge/`'s `SKILL.md` — none of which any source declares. Drive the gate over
     # `defender/skills/gather/SKILL.md`: it is `_is_system_skill_md`-shaped and ADMITTED today
     # (C23 read, G4 executed a real commit of exactly that edit), and it must now raise.
     # THIS IS A BEHAVIOUR CHANGE ON A PATH THAT IS LEGAL TODAY, and it is the point: N3 protected
     # those directories' EXISTENCE, never this lane's write access to them. `gather/SKILL.md` is
     # the gather subagent's ENTIRE system prompt (F12) and becomes maintainer-written — no
     # loop-side writer at all. Recorded as the accepted cost, not discovered later.
     # THE LIVE EDGE FK-10 LEAVES OPEN (70's Red flags): FK-1 refuses these six, and FK-10
     # declined a reserved-name exclusion at the resolver. So a maintainer who ever adds
     # `gather_adapter.py` — or commits `skills/gather/execution.md` — makes `gather` declared,
     # and this refusal lifts, re-opening the lead-author lane onto that prompt. Coherent (a real
     # adapter means a real system) and deliberate, but it must be STATED, not discovered.

  - {id: gather_prompt_source_survives_the_refusal, kind: coherence, form: test,
     discharged_by: test_the_gather_subagent_still_loads_its_own_prompt,
     binds: [gather_subagent, "interacts(gather_subagent->skills_tree)"]}
     # FK-1's READ SIDE, bound at this reader's OWN edge because that is what R7 asks — a demand
     # at `skills_tree` would read as discharged while this reader went stale. `skills/gather/
     # SKILL.md` is loaded WHOLE as the gather subagent's entire system prompt on every dispatch
     # (F12). FK-1 closes the WRITE lane onto that file; the READ path must be untouched. Drive
     # the change (a lane that now refuses the write) and observe THIS reader: the subagent still
     # resolves and loads its prompt, unchanged, from the same path. The refusal removes a writer,
     # never a reader — and this is the demand that catches an implementation that "closes the
     # lane" by moving or renaming the file.

  - {id: marker_is_not_agent_committable, kind: negative, form: test,
     discharged_by: test_the_marker_is_the_one_file_the_lane_cannot_commit,
     positive_control: skills_path_rule_admits_declared_catalog,
     binds: [_skills_path_rule, "_skills_path_rule.domain.distinguished[execution-md]",
             "interacts(lead_author_run->skills_tree)", "skills_tree.access[commit-gate]"]}
     # RF1's load-bearing half (C32, executed over all seven candidate markers): `execution.md` is
     # the ONE per-system file `_is_in_scope` refuses while admitting `SKILL.md`, `_draft/` and
     # every catalog path. That refusal — not the filesystem, not the write tool — is what stops
     # an agent that mints a marker from minting a declared system.
     # NF1 + NF4 (§7) make this demand MORE central, not less. With the marker read from the
     # committed tree, the commit gate IS the marker's integrity: NF4 chose marker EXISTENCE over
     # a content signature explicitly because "the marker's integrity is the commit gate" once the
     # read is committed-tree. Every path by which an agent could make a marker COUNT now runs
     # through this refusal. If a later change admits `execution.md` here, the union's whole
     # marker half is forgeable by the lane whose gate reads it.
     # WIDENED AT THE PHASE-F REPAIR (F1, human-resolved — half (ii)): THE REFUSAL IS BY
     # BASENAME AT ANY DEPTH under `defender/skills`, not by the exact two-segment form. NO
     # LATER CHANGE WAS NEEDED FOR THE SENTENCE ABOVE TO COME TRUE — the rule admits it TODAY.
     # `_is_system_execution_md` is `_is_system_file(path, "execution.md")`, an exact-two-segment
     # test, and it is deliberately absent from `_is_in_scope`; but `_is_in_scope`'s other two
     # limbs are depth-unbounded, so `defender/skills/<declared>/_draft/<any>/execution.md` and
     # `defender/skills/gather/queries/<declared>/<any>/execution.md` are ADMITTED at this base
     # (X1, executed), with a model-chosen parent directory name. Nothing else refuses them: the
     # protected-surface branch owns SCHEMA.md and _draft/README.md, the delete-prohibition needs
     # a `D`, the half-promote branch computes a twin that does not exist, and RF2's id rule is
     # REQUIRED to spare an id-less file — which an `execution.md` is.
     # THE CONTROL FOR THE WIDENING, on the same addresses: a sibling `.md` in those same nested
     # directories for the same declared system is still admitted, so what fired is the basename
     # rule and not a blanket refusal of depth — which would be a different behaviour change
     # nobody decided.
     # `marker_source_is_exactly_depth_one` is the other end of the same composition: that one
     # closes the READ, this one closes the WRITE, and (ii) also removes the spec's dependence
     # on the implementer getting the resolver's recursion right.

  - {id: marker_write_is_admitted_but_never_lands, kind: behavior, form: test,
     discharged_by: test_the_marker_write_is_admitted_and_still_never_lands,
     binds: [_skills_path_rule, "interacts(author_agent->skills_tree)",
             "skills_tree.access[write-tool]"]}
     # THE HONEST CAVEAT, PINNED (C33 REFUTES "the agent cannot write the marker"):
     # `build_write_allow(skills, suffix=".md")` compiles to `…/defender/skills/[^\x00]*\.md`,
     # which MATCHES `defender/skills/mcpsys/execution.md`. The file therefore appears in the
     # worktree; the tick still commits nothing and raises. The boundary is the commit gate, never
     # the write tool, and a test that only asserted the write is denied would pin a guard that
     # does not exist. 45 records that no phase-C premise drives this: phase E authors it from C32
     # and C33 directly.
     # UNDER NF1 (§7) THERE IS NOW A SECOND REASON THE PLANT NEVER LANDS, and the test should keep
     # them separate: the write is admitted, the COMMIT is refused (this demand), and even had it
     # landed on disk unrefused it would still declare nothing until committed
     # (`marker_read_is_from_the_committed_tree`). Assert the write-admitted half here; do not
     # fold the two controls into one assertion, or a regression in either reads as green.

  - {id: catalog_id_prefix_equals_directory, kind: shape, form: test,
