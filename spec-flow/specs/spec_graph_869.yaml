  - {id: path_composition_parity, kind: parity, form: test,
     discharged_by: test_every_path_composition_site_refuses_an_undeclared_name,
     binds: [_pitfalls_path_rule, _skills_path_rule, synthesize_drafts, discover_system_drafts,
             "skills_tree.access[write-tool]", "skills_tree.access[host-write]",
             "skills_tree.access[commit-gate]", "skills_tree.access[pitfalls-gate]",
             "interacts(discover_system_drafts->skills_tree)"]}
     # U1's discharge standard, as one test over the census: the SAME undeclared name, driven at
     # each site that spends a name as a path component, produces a write at NONE of them. Bound
     # per access cell so the parity is per-surface and cannot be discharged facet-wide.
     # FK-4 (§7) GREW THE CENSUS TO FOUR. `discover_system_drafts` joins it: it hands the agent
     # `{"system": <dirname>}` for every child of `skills_dir` with no filter today (C29,
     # executed: a `gather/_draft/` yields `('gather', 'defender/skills/gather/SKILL.md')`). It
     # gets no `skills_tree.access[...]` cell of its own because it composes a path and hands it
     # onward WITHOUT writing — its cell is the handoff, and it is bound by its edge instead.
     # FIXTURE TRAP ADDED BY NF2 (§7), and this demand is where the two membership values will
     # bite first: the name driven here must be undeclared under BOTH readings. A MARKER-ONLY name
     # is declared at the three union sites and undeclared at the pitfalls gate, so using one here
