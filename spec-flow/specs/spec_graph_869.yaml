  - {id: pitfalls_handoff_drops_undeclared, kind: behavior, form: test,
     discharged_by: test_pitfalls_handoff_drops_an_undeclared_system,
     binds: [_build_pitfalls_handoffs, _is_system_name, systems,
             "interacts(_build_pitfalls_handoffs->pitfalls_handoff)"]}
     # The issue's headline, executed on base (G2): a queued row with `system: "gather"` yields
     # `execution_md_path: defender/skills/gather/execution.md` today, because `gather` carries a
     # `SKILL.md`. Under the union it is still dropped — probed: no adapter AND no `execution.md`.

  - {id: pitfalls_handoff_keeps_declared, kind: behavior, form: test,
     discharged_by: test_pitfalls_handoff_keeps_a_declared_system,
     positive_control_for: pitfalls_handoff_drops_undeclared,
     binds: [_build_pitfalls_handoffs, pitfalls_handoff,
             "interacts(_build_pitfalls_handoffs->pitfalls_handoff)"]}

  - {id: pitfalls_shape_still_refuses_traversal, kind: survival, form: test,
     discharged_by: test_system_name_shape_still_refuses_a_traversal,
     binds: [_is_system_name, "_is_system_name.domain.distinguished[traversal]",
             "_is_system_name.domain.distinguished[empty]",
             "_is_system_name.domain.distinguished[dotfile]",
             "_is_system_name.domain.distinguished[separator-bearing]"]}
     # #868's shape check survives the split intact and stays load-bearing against `".."`:
