    and whichever of `visualize_primitives`, `visualize_data`, `visualize_messages` and `visualize_runtime`
    stay under `scripts/visualize/` — are in no category and import no gated name: each one's own source,
    planted at its own path, draws no finding, and the same source with a gated import added is flagged
    there. "Imports no gated name" is pinned by name, whatever module the name is imported from: no import
    statement in a staying module, from any module, binds one of `_run_paths`' own names that the lint
    gates — `_run_handle`'s re-export of `RunPaths` included, which the lint does not trace — and the same
    source with `from defender._run_handle import RunPaths` added is caught.
  note: >-
    Fork J10 RESOLVED (owner, §7): `CATEGORIES[n_f_deferred]` is j10_lint_names_the_n_f_deferred_category's (brief R1). Brief R1(a): render.py is listed
    names-only but its RUN_LAYOUT uses are record reads (G13) — admitted by design (D4 keeps `_sibling_row`),
    a label error only. Brief R1(b) (G12) RESOLVED at phase-F §7 R5 (owner; 93-resolutions-F.md): the record-reading
    parts of `scripts/visualize/visualize_primitives.py` (and of `visualize_data` / `visualize_messages` /
    `visualize_runtime` where they read records) move into the run service with the run page; what stays
    outside — the styling (`CSS`) and the constants `learning/frontend/build.py` and the N-d episode page
    import — imports no gated name and is filed in no category (a names-only or not-a-run entry would admit
    a record reader and keep O1 green). Which functions move is the implementer's census, under that pin.
    N1 (phase F's second §7, auto; 98-resolutions-F2.md): the pin is BY NAME, whatever module the name is
    imported from. The lint flags only an import from `defender._run_paths` and does not trace re-exports
    (J12), and `_run_handle` re-exports `RunPaths` (E3-N1), so the lint alone would pass a staying helper that
    kept its record reads and only changed where it imports `RunPaths` from. The test therefore also takes
    each staying module's import bindings in every scope, relative ones included, and its attribute reads
    off an imported module, through `_astlib`'s scope-aware resolver (the repo's owner of that question,
    `lint_hand_rolled_name_resolution`); it resolves each to its object, counts it only when that object IS
    `_run_paths`' own (a same-named unrelated object does not count), and asks the lint whether that name is
    gated (default-deny plus F6's helper list, not a hard-coded set). Its control plants
    `from defender._run_handle import RunPaths`. A literal path join (`run_dir / "report.md"`)
    imports no gated name and stays N-e's declared blind spot.
