    `defender.runtime.branch` resolves through its new path without `ImportError` or `AttributeError`.
    The importers are G1's twelve files, each imported in a fresh interpreter: `evals/held_out.py`,
    `learning/branch/cli.py`, `learning/branch/review.py`, `learning/branch/seams.py`, `learning/judge/family.py`,
    `learning/judge/render.py`, `scripts/case_history/ticket_writer.py`, `run.py`, and the four lazy
