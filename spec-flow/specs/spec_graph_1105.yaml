    when a run that `list_run_ids` returned is removed before the tracer's `open_run` on it, the trace
    skips that run and continues. It does so alike for the non-case-stable `caseA`, where `open_run` raises
    `ValueError`, and for a case-stable twin, where `open_run` returns a handle and the lessons file is
    absent: both give the same output, no row for the pruned run and the rows for the rest. A present
    bad tenant record still stops the trace with `TenantRecordCorrupt`, and so does a present directory
    for which `open_run` raises `ValueError` for another reason (a record naming another tenant), so the
    skip keys on the directory being gone, never on the exception type.
