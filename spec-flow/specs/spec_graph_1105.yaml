    from G1 and G2 (census, both hold). d1_old_paths_gone proves the old paths are gone; this is the
    survival half it could not carry.
- id: p007_open_run_refuses_an_unreadable_record_or_unsearchable_base_as_value_error
  kind: domain-outcome
  form: test
  source: 70-resolutions.md J4 (owner)
  binds:
  - tenant_record.domain.distinguished[unreadable_eacces]
  - runs_base.domain.distinguished[unsearchable]
  - interacts(open_run->tenant_record)
  - interacts(open_run->runs_base)
  discharged_by: test_1105_open_run_record_present_but_unreadable_by_permissions
  seed_docstring: >-
    `open_run` refuses inside the `ValueError` family when it cannot read what it must read. For a
    `_tenant.json` with mode 000, and for a runs base the process cannot search (mode 444) with and
    without a record in it, `open_run` raises an exception `e` with `isinstance(e, ValueError)` for a
    case-stable id and for the non-case-stable `caseA`. It never raises a raw `OSError`, returns no `Run`,
    and never falls back to the default tenant. The reader is a non-root user, since root ignores the
    mode bits.
  note: >-
    J4 (owner): always refuse inside the ValueError family. Base (author-P1, dep-PO14): read_tenant folds
    EACCES into TenantRecordCorrupt, but `Run.at(base/'caseA')` under an unsearchable base raises raw
    PermissionError, so the non-case-stable unsearchable cell is RED against base by design (design
    amendment 3). `runs_base[unsearchable]` (no search bit) is a member added at D-amend, distinct from
    J3's `unlistable` (no read bit).
