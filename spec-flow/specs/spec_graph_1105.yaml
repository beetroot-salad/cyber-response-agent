  - interacts(source_alert_screen->source_run_dir)
  discharged_by: test_1105_manifest_source_run_id_disagrees_with_the_source_folder_name
  seed_docstring: >-
    the doors after the launcher never split a path. Given a manifest whose `source_run_dir` string, split
    into parent and name, would name a different base and id than its `source_runs_base` and `source_run_id`,
    a sibling's `run.py --resume` and the source-alert screen each call `open_run(Path(source_runs_base),
    source_run_id)` and nothing else, and the questioner opens the source with the base and id the launcher
    resolved. A source moved or deleted after launch makes a sibling's resume end `truncated_by="store"`
    with `BranchError` (D6), not open whatever now sits at the old path.
  note: >-
    J5 (owner): dissolves P026 (one source of truth), P024 and P035 (symlink divergence). The questioner
    runs inside the launcher's process and AUTHORS the manifest (cli.py:1704), so its door is "handed
    the launcher's resolved identity, opens once, never splits" rather than "reads the manifest". The
    episode_source_doors_refuse_bad_present_record seed is amended to this door rule.
- id: p027_launcher_refuses_a_source_folder_name_that_fails_the_id_shape
  kind: domain-outcome
  form: test
  source: 70-resolutions.md J6 (owner)
  binds:
  - run_id.domain.distinguished[run (1)]
  - run_id.domain.distinguished[straße]
  - interacts(episode_tool->open_run)
  - interacts(episode_tool->LauncherRefused)
  discharged_by: test_1105_imported_source_folder_whose_name_fails_the_id_shape
  seed_docstring: >-
    for an imported source folder with no tenant record beside it whose name fails `is_valid_run_id`,
    the launcher refuses at the source-open step with `LauncherRefused` whose message names the folder
    and tells the operator to rename it to a valid run id; no episode directory is created, the questioner
    is not asked and no sibling launches. For `run (1)`, `my case` and `_import` this is the refusal class
    base already raises through the derived episode id, with a clearer message; the case-fold cell — `straße`,
    and `Kase` spelled with U+212A KELVIN SIGN, whose case-fold passes and which base launches — is the
    new refusal. The positive control: the same folder renamed `run-1` opens as today.
  note: >-
    J6 (owner), CORRECTED at phase-F §7 R2 (owner; 93-resolutions-F.md): the §7 question rested on a false
    premise (RF4 'the launcher accepts any directory today'). E2-J6 (executed at base): `_launch` derives
    `episode_id_for(name, mid)` = `f"{name}-n{mid}".casefold()` and `refuse_bad_episode_id` applies
    `is_valid_run_id`, so `run (1)`, `my case` and `_import` are already refused with `LauncherRefused("[branch]
    episode id '<name>-n59' is not usable …")` before anything is spent, while `straße` (episode `strasse-n59`)
    and U+212A `Kase` (`kase-n59`) LAUNCH (rc 0, three sibling spawns). The fourth O4 change is therefore the
    same refusal class as base with a clearer message — naming the folder and asking for a rename — plus
    the case-fold edge case, not a new behaviour class (design amendment 4, corrected). K11: no run minted
    with such a name is unrefuted, not confirmed. RED against base by design: the ASCII cells fail only
    on the 'rename' wording, the case-fold cell on the launch itself.
