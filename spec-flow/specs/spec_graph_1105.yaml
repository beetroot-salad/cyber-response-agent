- id: p040_verify_family_over_a_sibling_that_never_materialized
  kind: behavior
  form: test
  source: 98-resolutions-F2.md N3 (auto); 70-resolutions.md J1 (auto)
  binds:
  - run_id.domain.distinguished[missing_case_stable]
  - interacts(verify_family->open_run)
  - interacts(archive_episode->open_run)
  discharged_by: test_1105_verify_family_over_a_sibling_that_never_materialized
  seed_docstring: >-
    `verify_family` over a family in which one sibling never materialized — its case-stable run id names no
    directory and no scrub-verdict sidecar, the shape a sibling whose `run.py --resume` died before
    materialize leaves (RG-2's loser) — under a default `tenant_record` behaves as at base: `open_run` hands
    back that id's handle without checking a directory, and verify returns and records in `review.yaml` the
    outcome `incomplete` with a reason naming that sibling's label, and archives both finished siblings'
    worlds in full. The positive control: the same family with the third sibling finished is `accepted` and
    archives all three.
  note: >-
    J1 (auto) applied to P040 (45-dispositions.md, silent branch; test name as 45 gave it): D3 verbatim —
    `open_run` does not check a case-stable id's directory — and verify/archive behave as today (O4). Moved
    off p001's note at phase F's second §7 (97 N3: p001's test never drives verify or archive). Base measured
    (E3-P040): `verify_family` returns and records `incomplete`, reason `sibling(s) ['c'] have no scrub
    verdict recording a completed walk …`, and archives worlds `a` and `b` in full. GREEN at base by design
    (parity) and a recorded null-stub pass. It reddens if #1105's new `open_run` call at verify's top refuses
    a missing sibling directory (outcome and archive lost), or if the missing sibling is dropped from the
    family (outcome `accepted`) — both mutants measured (E3-P040). Beside it: p119 (a DELETED sibling on
    re-archive) and p059 (a non-case-stable sibling, refused up front).
