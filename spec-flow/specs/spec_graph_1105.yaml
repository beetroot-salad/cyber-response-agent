    `world_token_for`, `Overlay`, `parse_overlay`, `BranchError`, `ElasticEntry`, `World`, `resume_world_from`,
    `PATCHABLE_SYSTEMS`) each resolve on the service's public surface, or as a `Family` method for the
    functions D1 turns into methods.
