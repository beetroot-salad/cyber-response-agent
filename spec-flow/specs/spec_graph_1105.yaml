  holes:
  - rule: R2
    element: curation_queue.identity
    resolution: 'Not a fresh obligation: lc-O6 (executed, holds) establishes the curation marker is `<case_id>.json`, written by atomic replace — two enqueues of one case collapse to one file by construction, and a later run of the same case replaces it rather than colliding. No demand minted by this pass.'
    cites:
    - lc-O6

  - rule: R2
    element: run_dir.identity
    resolution: 'Not a fresh obligation: G7 (read, holds) establishes every production sibling run id is `f''{episode_id}-{label}''`, and `refuse_bad_episode_id`/`refuse_unnameable_world` enforce case-stability and case-exclusivity on `label` before a sibling is minted — the composition is injective in `label` by construction (a validated-input guarantee, not a runtime collision a test could usefully drive). No demand minted by this pass.'
    cites:
    - G7

  - rule: R2
    element: tenant_record.identity
    resolution: 'Not a fresh obligation: RG-2 (executed, holds) establishes that a losing concurrent `ensure_tenant` raises `TenantRecordCorrupt` on the winner''s zero-length file — a pre-existing race in `<ep>/runs/_tenant.json` under `start_family`''s barrier, its own issue, out of #1105''s scope. P022 (fork J4) is the reader-side window onto the same race and is tracked there, not here. §7: WAIVED by the owner (70-resolutions.md, Waivers) — recorded as waiver_rg2_tenant_record_creation_race.'
    cites:
    - RG-2
    resolved_to: waiver_rg2_tenant_record_creation_race

  - rule: R7
    element: interacts(Run->tenant_record)
    resolution: 'Dismissed: G3/C7 (executed, both hold) establish `Run.for_tenant` is the primitive `open_run` step 3 calls and `materialize_run_dir`''s own read-back — not an independent sibling reader that could disagree with `open_run`''s reading. No direct `for_tenant` caller outside `open_run`/`materialize_run_dir` was found in this graph''s structure (readers of `tenant_record`: `Run`, `_family_base_world_id`, `list_run_ids` [negative], `open_run`).'
    cites:
    - G3
    - C7

