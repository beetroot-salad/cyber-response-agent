- id: j5_launcher_records_the_source_identity_once
  kind: behavior
  form: test
  source: 70-resolutions.md J5 (owner re-frame)
  binds:
  - source_run_dir.access[launcher]
  - interacts(episode_tool->source_run_dir)
  - interacts(episode_tool->open_run)
  discharged_by: test_1105_episode_source_argument_shapes
  seed_docstring: >-
    the launcher is the only door that takes a path. Given the source spelled as an absolute path, with
    a trailing slash, as `.` from inside the run directory, as a relative path through `..`, and as a
    symlink into another runs base, it resolves the path once and calls `open_run(resolved.parent, resolved.name)`
    once. The family manifest it writes records the source's identity: `source_runs_base` is the resolved
    parent, `source_run_id` is the resolved folder name, and `source_run_dir` equals their join. For the
    symlinked source, the identity names the link target's base and folder, so that base's tenant record
    is the one every door consults.
  note: >-
    J5 (owner re-frame, design amendment 5). AM-1 (executed at base): the manifest records `source_run_dir
    = str(resolved source)` and `source_run_id = source.name` (cli.py:1294,1717-1718) and NO runs-base
    field; `_FAMILY_FIELDS` is closed, so a `source_runs_base` key is refused as unknown today. The pinned
    shape therefore GROWS the manifest by `source_runs_base` (the name is the graph's coinage — write-code-from-spec
    reconciles it) and keeps `source_run_dir` for the readers that already key on it (seed, judge rows,
    questioner header). RED against base by design. Legacy manifests without the field are refused
    (J5a, owner): j5a_resume_and_alert_screen_refuse_a_legacy_manifest. The field is a declared O4 change
    (phase-F §7 R3, R3a): existing manifest fixtures gain it through a default in `_triplet_947.family_doc`,
    or, where a test builds the manifest dict by hand, by adding the key to that literal (o4_test_diff_scope).
- id: j5_later_doors_reopen_the_source_by_manifest_identity
  kind: parity
  form: test
  source: 70-resolutions.md J5 (owner re-frame)
