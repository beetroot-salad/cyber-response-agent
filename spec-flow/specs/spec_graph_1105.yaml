demands:
- id: open_run_return_contract
  kind: behavior
  form: test
  source: 20-demands.md
  binds:
  - interacts(caller->open_run).response
  - open_run
  discharged_by: test_1105_open_run_returns_tenant_handle_when_case_stable_and_bare_handle_otherwise
  seed_docstring: >-
    `open_run(runs_base, run_id)` returns a `Run` in both of these cases: For a case-stable `run_id`,
    the `Run` holds `runs_base`: its `run_dir` is `runs_base / run_id`, and `run.facts.scrub_verdict.path`
    and `run.facts.run_end.path` resolve to `<runs_base>/<run_id>.scrub-verdict.json` and `.run-end.json`.
    For a valid but non-case-stable `run_id` naming an existing directory, the `Run` holds no `runs_base`:
    `run.documents.report.path` resolves inside the directory, and `run.facts.scrub_verdict.path` raises
    `ValueError`.
  note: >-
    DEMAND #0 — non-provisional (20-demands.md): D3 steps 1-3 state it outright. Demands fork F1 (non-material,
    RESOLVED auto at §7 — the refusal type follows J4's ValueError-family rule): a missing case-stable dir returns a handle, a missing non-case-stable
    one raises ValueError from Run.at — both halves pinned (K6).
- id: open_run_opens_valid_non_case_stable
  kind: domain-outcome
  form: test
  source: 20-demands.md
  binds:
  - run_id.domain.distinguished[caseA]
  - run_id.domain.distinguished[turnN-A]
  - run_id.domain.distinguished[20260728T161745Z-fresh-case]
  discharged_by: test_1105_open_run_opens_valid_ids_that_are_not_case_stable
  seed_docstring: >-
    `open_run` returns a `Run` whose `run_dir` is `runs_base / run_id` for `run_id` `caseA`, `turnN-A`
    and `20260728T161745Z-fresh-case`, each an existing directory, under a base with no tenant record.
- id: open_run_refuses_unsafe_ids
  kind: domain-outcome
  form: test
  source: 20-demands.md
  binds:
  - run_id.domain.distinguished[../x]
  - run_id.domain.distinguished[has space]
  - run_id.domain.distinguished[_bindtest]
  - run_id.domain.distinguished[héllo]
  - run_id.domain.distinguished[.hidden]
  - run_id.domain.distinguished[]
  discharged_by: test_1105_open_run_refuses_unsafe_ids_with_plain_value_error
  seed_docstring: >-
    for `run_id` `../x`, `has space`, `_bindtest`, `héllo`, `.hidden` and the empty string, `open_run`
    raises an exception `e` with `type(e) is ValueError`, never `TenantRecordCorrupt`, and returns no
    `Run`.
  note: 'PIN: `type(e) is ValueError`, never TenantRecordCorrupt (K4: it subclasses ValueError).'
- id: open_run_checks_id_before_record
  kind: behavior
  form: test
  source: 20-demands.md
  binds:
  - open_run
  - tenant_record
  discharged_by: test_1105_open_run_refuses_a_bad_id_before_reading_a_corrupt_record
  seed_docstring: >-
    under a base whose `tenant_record` (`_tenant.json`) is corrupt, `open_run(runs_base, "../x")` raises
    plain `ValueError` (`type(e) is ValueError`). The id check runs before the record is read. The positive
    control: the same base with a valid id raises `TenantRecordCorrupt`.
- id: open_run_absent_record_uses_default
  kind: domain-outcome
  form: test
  source: 20-demands.md
  binds:
  - tenant_record.domain.distinguished[absent]
  discharged_by: test_1105_open_run_opens_under_a_base_with_no_tenant_record
  seed_docstring: >-
    with no `tenant_record` under `runs_base`, `open_run` returns a `Run` for a case-stable id, built
