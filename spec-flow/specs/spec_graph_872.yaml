     probe: "probe_B2_crossing.py + probe_B3_ungated_drive.py — a 300-entry scalar leaf shared pairwise 15 levels deep and sunk to depth 64 by a chain (64 objects total). Checked admissible by the container reading first, then encoded (the gate's own order: PRE-VALIDATE, dumps, wire), and separately driven end to end through `agent_run(capabilities=False)` — d57's own un-gated arm. One process each, RLIMIT_AS 2 GB, RLIMIT_CORE 0.",
