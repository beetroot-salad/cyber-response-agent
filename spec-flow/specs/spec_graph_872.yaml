     note: "re-confirms R3's mechanism correction with the pipeline assembled as §7 decided it rather than as a bare library call."}

  - {id: cN2, kind: primitive, probe_kind: executed, verdict: refuted,
     claim: "REFUTES design-872-r3.md M2's `wire_json` identity: `pydantic_core.to_json(value)` is NOT byte-for-byte what `ToolReturnPart.model_response_str` sends.",
     probe: "probe_S2_wire.py — 22 value classes through `to_json(v)` and through `ToolReturnPart(content=v).model_response_str()`, compared as bytes; plus `inspect.getsource` of `model_response_str`.",
     observed: "7 of 22 diverge, by three mechanisms. Non-finite floats: to_json `{\"x\":NaN}` / `{\"x\":Infinity}` (inf_nan_mode defaults to 'constants'), wire `{\"x\":null}`. bytes values: to_json `{\"x\":\"ab\"}`, wire `{\"x\":\"YWI=\"}` (base64). Empty list: to_json `[]` (2 B), wire `''` (0 B). model_response_str calls `tool_return_ta.dump_json`, a `TypeAdapter(Any)`.",
     note: "THE LEAF'S LARGEST FINDING. O2 is a byte-identity obligation and the design rules the bytes with the wrong instrument, so every oracle written against `to_json` would agree with the gate and both would differ from the wire. Mints d71; changes d70's arm."}

