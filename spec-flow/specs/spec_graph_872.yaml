    - id: queries_table
      provenance: code
      facets:
        identity:
          key_axes: [run_id, lead_id, seq]
          evidence: {nl: "`executed_queries.jsonl` (_run_paths.py:110-111), re-spelled as _QUERIES_TABLE at judge/closed_ticket_tool.py:128. Rows key on (lead_id, seq); the twelve frozen keys are read off the row literal at record_query.py:137-150, not recalled: lead_id, seq, system, verb, query_id, params, raw_command, payload_path, exit_code, error_class, payload_status, payload_digest. FORWARD RISK: the unmerged #877 (e9b798ce) ADDS payload_sha256 beside payload_digest, taking the frozen set to 13 (B9/r15) — an addition, not a rename."}
          sharing: serialized-append
      note: >-
        S2. Atomicity here is THREAD-CONFINEMENT, not a lock (record_query.py's own docstring: the
        function contains no `await`, and `_tool_bash` is synchronous). It is a case-answer-key file
        denied to a CONFINED agent (permission/files.py:246-247). N4 writes NO row for a foreign
        result, so such a result has no `(lead_id, seq)` — the axes every other run-dir sink is keyed
        on, which is precisely what leaves f5 open. THREE INDEPENDENTLY SPELLED WRITERS (F16), which
