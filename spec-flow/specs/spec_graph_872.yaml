  # O7 / M6 — the seam the design gives no seam for
  # =========================================================================

  - id: d20_foreign_toolset_installs_through_the_declared_seam
    kind: seam
    form: test
    binds: ["interacts(run_investigation->toolset_seam)", "drives(run_investigation->toon_gate_capability)",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_foreign_toolset_injected_at_the_entry_point_reaches_the_model_through_the_gate
    source: "O7, M6, r17/B2 — a dependency the design gives no seam makes the seam part of the contract"
    note: >-
      Deliberately NOT "run_investigation accepts a toolset= parameter". The demand is an outcome: a
      test installs a foreign dict-returning toolset through the declared seam, the model calls it,
      and the substituted text is read off the ToolReturnPart the model received — with no
      `monkeypatch.setattr` anywhere (the profile ratchets new setattr sites). Signature inspection
