            bash:      {trust: attacker-influenced, constraints: [confine, cap-8kb]}  # the model's `cat` lane: read_shapes appends GATHER_RAW_SHAPE only when raw=True — driver.py:338 (gather) passes True, :334 (main) passes False. is_captured_payload selects the 8 KB cap (tools.py:93-94)
