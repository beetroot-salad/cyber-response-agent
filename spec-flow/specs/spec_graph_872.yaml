        obligation is parity (O9a), not repair. Recorded so a later reader does not mistake M7's five
        refusal predicates for a general hardening of the tool-return path.
    cites: [S11, H9]
    note: >-
      NOT AN OUGHT, AND THE SUSPICION THAT IT MIGHT BE IS WORTH ANSWERING DIRECTLY. Three things make
      this bookkeeping rather than judgment: the sentence is ALREADY an accepted examined no in
      `design-872-r3.md` and §7 did not touch it; the convention is established by three siblings
      (N7→d34, N5→d31, N2→d27); and an address EXISTS —
      `interacts(toon_gate->tool_result).response` is exactly what d34 binds, and
      `distinguished[circular]` is already bound by d57. The gate's hole entry says N9 is "bound to the
      gate actor for want of a truer address"; there was a truer address all along, which is why this
