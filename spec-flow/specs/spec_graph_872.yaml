  - id: d67_a_substituted_view_and_a_gather_summary_share_one_frame_identity
    kind: coherence
    form: test
    resolved_by: human            # §7 r3 (f2 = B) — residue item 6
    binds: ["interacts(gather_dispatch->invocation_salt)", "interacts(toon_gate->invocation_salt)",
            "interacts(toon_gate->untrusted_frame)"]
    discharged_by: test_a_substituted_view_and_a_gather_summary_in_one_run_are_each_independently_framed
    source: "60-residue.md item 6 (R7), unblocked by §7 r3"
    note: >-
      THE UNMOVED SALT READER THAT DOES NOT DISAGREE BY DESIGN, and the cheap one of the three salt
      firings. `_persist_gather_summary` frames with `_wrap(output, 'untrusted', deps.salt)`
      (tools_gather.py:568) — the run's STANDING salt, the same one d17a expects the gate to use.
      The demand is that a substituted view and a gather summary in one run carry the SAME FRAME
      IDENTITY, which is O6's own word "invocation-scoped" made observable: not that the code read
      `ctx.deps.salt`, but that the two delimiters match. The two readers that DO disagree by design
      — the review lenses and the learning stages, each with its own per-stage salt — are not this
      demand's and are the examined no at d68.

      SUPERSEDED, POST-SEAM, BY A CONCURRENT FIX RATHER THAN BY THIS CHANGE — `fix(frames): a
      frame's salt is minted after its content, so no framed party holds it` (#875) landed on
      `main` while this branch was in flight and retired the run's one standing salt entirely:
      `AgentDeps.salt`, `bind(salt=...)` and `_persist_gather_summary`'s shared token are gone,
      replaced by `_untrusted.wrap_fresh`, which mints AFTER content is in hand and per call. The
      vulnerability #875 closes is exactly what this demand's OLD reading would have kept open for
      a foreign result specifically: sharing one salt across the gate's frame and gather's summary
      frame is the shape F-1 reproduces (a foreign payload closing the shared frame early plants a
      tag gather itself later echoes back into MAIN's trusted region). So the literal text above —
      "the SAME FRAME IDENTITY" — is now the WRONG answer to O6's own question, and the demand's
      discharge was re-read rather than the demand renamed: the same test function now asserts each
      frame is independently well-formed AND carries a DIFFERENT delimiter, which is what
      "invocation-scoped" means once every span mints its own salt. d68's framing (the review
      lenses and learning stages "disagree by design" while this reader "agrees") is likewise
      stale prose this correction did not re-derive — every untrusted-tag reader now mints its own
      salt, so the distinction d68 draws has collapsed; flagged here rather than silently left for
      a reader to trust.

