                            # "the ToolReturnPart the model received, not an internal variable"
                            # (O1), and the only in-tree way to observe that is a driven run —
                            # the replay harness's FunctionModel sees the request messages (B16/F7).
schema_version: 1
design: "872"   # `.spec-flow/design-872-r3.md` — "Intent + design (r3) — corrected against the
                # re-grounding refutation". It supersedes r2, whose FAULT ARM was refuted on executed
                # evidence by phase C's re-grounding leaf (`toons.dumps` raises a `BaseException` past
                # `except Exception` on a non-`str` key, and SIGSEGVs on a self-referential container),
                # which in turn superseded `.spec-flow/design-872.md`. 9 obligations (O1-O9, O9 NEW),
                # 7 mechanisms (M1-M7, M7 the pre-validator, M2/M3 rewritten), 9 examined
