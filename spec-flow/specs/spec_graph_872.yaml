  - id: d47_the_json_arm_is_the_pre_existing_wire_baseline
    kind: coherence
    form: clause
    binds: ["interacts(toon_gate->wire_ruler).response"]
    outcome:
      nl: "On every passthrough arm the fidelity the model gets is the PRE-EXISTING wire baseline's, not a better one: `to_json` base64s `bytes` and ISO-formats a `datetime` exactly as it does today, so a bytes-bearing payload's JSON fallback is lossy in the same way it already was. O2 pins the passthrough arm to the run with no gate installed — the gate promises never to do worse, never to do better."
    rejected:
      - {nl: "a demand that the JSON arm be lossless — it would be a new obligation on the pre-existing baseline, not a property of this change"}
    cites: [B7, r10]
    note: "silent branch 16 — converged across all three readers, and right against intent."

