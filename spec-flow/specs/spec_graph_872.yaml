  - id: d35_gate_reaches_every_agent_build_agent_core_builds
    kind: seam
    form: test
    fork: P2
    binds: ["drives(build_agent_core->main_agent)", "drives(build_agent_core->gather_agent)",
            "drives(build_agent_core->review_lens)", "drives(build_agent_core->learning_stage_agent)",
            "drives(build_agent_core->judge_agent)", "interacts(toon_gate->registered_tools)"]
    discharged_by: test_every_build_function_routes_through_the_site_that_installs_the_gate
    note: >-
      DISCHARGED BY DRIVING THE FIVE BUILD FUNCTIONS, NOT BY DRIVING THE SHARED SITE FIVE TIMES
      (`92-reconciliation.md` F5). The resolution states exactly one reason for reading A — "no
      build path can be silently missed; there are five and the original census found one" — and the
      failure that census actually found is a build path that constructs its OWN agent. A test that
      calls `build_agent_core` five times with five `AgentDefinition`s establishes that the gate's
      construction is definition-independent and says nothing about whether `build_agent`,
      `build_gather_agent`, `build_stage_agent`, `build_judge_agent` and `review_roles`' injected
      `build` still ROUTE through it — an enumeration standing in for driving, which is the failure
      `rules.md` names. Each function is now called as itself. None of them takes the `toolset=` seam
      (r5 gave that to `run_investigation`), so the four that return an agent are driven with the
      foreign toolset supplied at RUN time — pydantic-ai applies a capability's `get_wrapper_toolset`
      to run-level toolsets as well as build-time ones, executed against 1.107.0 — and the review
      lens is driven through `live_review_stages(build=...)`, the declared DI seam whose production
      default IS `build_agent_core` (`review_roles.py:249`), which builds, binds and RUNS the lens's
      own agent. A SECOND DEFECT SURFACED WITH IT: three of the five registry roles (GATHER, ACTOR,
      JUDGE) carry a non-empty `verb_grant` or require a read confine, so a definition stripped only
      of `tools` made `bind` raise before the gate was reached — three of the five paths were red for
      a reason that was not this demand's, and would have stayed red against a correct
      implementation. The strip now covers the grants that scope the tools, which is the same rule
      the helper already followed for `write_shapes`/`bash_shapes`.
    readings:
      A: "UNIVERSAL INSTALL, THREADED TOOLSET — the gate capability is constructed inside `build_agent_core`, so all five build paths get it and only the foreign TOOLSET threads from `run_investigation`. Buys: no build path can be silently missed (there are five and the original census found one), O6's universality is reachable, all 14 tools on all 8+ agents are covered. Costs: the learning stages and review lenses each have their own deps binding and the frame needs a salt on all of them (unprobed); `d21` must then be asserted on more than the main lane."
      B: "BOTH THREAD FROM THE ENTRY POINT — only agents `run_investigation` reaches carry the gate. Buys a bounded blast radius matching the demand set's investigation framing and keeps d20/d21 a two-site contract. Costs: O6 is unmet for every learning-stage agent's foreign output, SILENTLY — the same shape as the forward hazard N7 exists to prevent; and `build_agent` must grow the parameter `build_gather_agent` already has (B2/F6)."
    resolved_reading: "A for the gate's installation, B for the toolset seam"
    resolved_by: human            # §7 r5
    resolution: >-
      §7 r5 — SPLIT, AND THE SPLIT IS THE DECISION: reading A for the CAPABILITY (construct the
      gate at the single `Agent(...)` in `build_agent_core`, so no build path can be silently
      missed — there are five and the original census found one) and reading B for the TOOLSET
      (thread only the foreign toolset from `run_investigation`). This demand binds all five
      `drives(build_agent_core->*)` edges under A and keeps them. What the human accepted with it,
      recorded as an examined no at d68: the learning stages and the review lenses each have their
      own deps binding and the frame needs a salt on all of them — UNPROBED — and the offline lane
      is in scope for the install but undriven by this change's tests.
    source: >-
      M6 names one build path; `build_agent_core` (driver.py:272) is the single `Agent(...)` site for
      FIVE — `build_agent` (:609, MAIN), `build_gather_agent` (:416, called at :667 and
      lead_zero.py:795, one per lead), `build_stage_agent` (_pydantic_stage.py:25, six learning
      stages), `build_judge_agent` (engine_pydantic.py:98), and the three review lenses
      (review_roles.py:265-288, through an injected `build` seam defaulting to `build_agent_core`).
      `build_agent` takes NO `extra_capabilities`; `build_gather_agent` does.

  # =========================================================================
  # O8 — the ruler
