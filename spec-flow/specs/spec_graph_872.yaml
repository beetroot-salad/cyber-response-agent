  - id: d43_hazardous_payload_that_clears_the_bar_meets_the_same_guard
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_a_payload_that_is_both_hazardous_and_clears_the_byte_bar_meets_the_identical_guard
    positive_control: d13_hazard_free_payload_substitutes
    source: "settled #13 — the two checks compose: the byte gate runs first and M3 runs after it, and nothing exempts a clearing payload from the hazard guard"
    note: >-
      CHANGED BY THE r3 CORRECTION — a FLIPPED DISPOSITION (`R12`, settled #13). The judge's "the
      byte-ratio corpus and the hazard corpus were never the same payload, so the fixture must be
      built or the test is vacuous" is REFUTED BY EXECUTION: all 40 committed fixtures carry at
      least one `r11` hazard (they are real ES|QL results with message text and timestamps), 40 of
      40 clear the bar bare and 32 of 40 still clear it with the 67-byte frame applied. `fx-33` is
      the strongest instance — framed ratio 0.4041, carrying LF, colon, comma and an embedded
      double quote. NOTHING NEEDS FIXTURING, and d12's fixture and this demand's can be the same
      committed file. The vacuity risk the note used to name is inverted: a fixture that FAILS the
      bar would make this green for the wrong reason, and the corpus no longer forces one on us.

  - id: d45_the_verdict_is_per_call_and_carries_no_run_state
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->tool_result).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_each_call_is_gated_independently_with_no_cross_call_or_run_position_state
    source: "settled #16, #20, #22, #27 — M1-M3 are a pure function of one call's own value; no doc text introduces run-position-dependent behaviour"
    note: >-
      Consequences the phase-C readers converged on and this demand's docstring should carry: the
      first tool call of a run behaves as a later one; two byte-identical payloads from the same tool
      get identical verdicts; the second of two differing payloads is unaffected by the first call's
      decision; two foreign calls resolved on one turn are each governed by the same independent
      rule. AND THE ONE THAT IS NOT COMFORTABLE (silent branch 6): because each call is gated
      independently, a RETRIED call may legitimately land on the other side of the bar, so
      idempotence is not guaranteed and O1's saving is non-deterministic across retries. The
      encoder's own re-entrancy under concurrent invocation is a library question, not this design's
      logic — probe R8, and the design admits no sentence about it (D7).

  - id: d38_the_gates_own_action_is_observable
    kind: behavior
    form: test
    fork: P6
    binds: ["gate_run_record", "interacts(toon_gate->gate_run_record)"]
    discharged_by: test_a_run_records_what_the_gate_examined_substituted_and_saved
    readings:
      A: "NO SIGNAL — rely on the positive controls every negative already names (d27->d23, d28->d1, d29->d23, d30->d16, d21->d20, d12->d13). Buys nothing to build. Costs: the controls prove the SUITE can drive a substitution, not that the shipped runtime ever does, and nothing in production distinguishes a dead gate from an idle one."
      B: "A RUN-LEVEL RECORD — the gate records, per run, FOUR categories: examined / REFUSED-BY-GUARD / substituted / bytes saved. Buys: O1 becomes observable at the operator's altitude; a dead gate is visible; the import-failure arm gets a defined observable ('examined 0' vs no record at all); and O9's refusal count becomes visible instead of silent. Costs: it needs a sink, which drags f5 along with it, and it must not become a new undeclared run-dir root (S5/D3)."
    changed_by_r3: >-
      A FOURTH observable category now exists — refused-by-guard —
      because M7 turns three probed crash classes into SILENT passthroughs. This is exactly the
      observable the re-grounding leaf's fork 4 said P6-B would get for free once the guard existed.
      P6 STAYS OPEN and so does fork 4; what is settled is that the fourth category is real
      whichever reading P6 takes, so reading A now costs strictly more than it did in r2: under A a
      gate that refuses every foreign payload is indistinguishable from one that never fires.
    resolved_reading: B
    resolved_by: human            # §7 r1 — the carriage bundle
    resolution: >-
      §7 r1 — READING B, AND THE SINK IS THE ONE f5 PICKED: the gate's counters ride on the SAME
      wire-log record that carries the substituted return's `metadata`. No new run-dir root, which
      is what P6-B needed f5 to supply and what f5-A would have made a header. Four categories,
      the fourth (refused-by-guard) real whichever way P6 went, because M7 turned three probed
      crash classes into silent passthroughs.
    unresolved: >-
      ONE HALF OF THIS CARD WAS NOT DECIDED, and it is named rather than absorbed: the
      recommendation bundled an explicit decision on IMPORT FAILURE (degrade to permanent
      passthrough AND record it, since a hard startup failure turns a cost optimisation into an
      availability dependency). §7 r1 took P6=B and the sink; it did not answer what the gate does
      when `toons` will not import. Silent branch 28 stays `resolved_by: pending` for the same
      reason, and `70-resolutions-r2.md` carries it in its open list.
    source: >-
      P6 — O1 is an OPERATOR COST obligation and after a run nothing tells the operator whether the
      gate fired, how many results it substituted or how many bytes it saved. Two facts make that
      more than cosmetic: the gate is inert on the shipped tree (r17/B2), and EVERY negative demand
      in this set (d21, d27, d28, d29, d30) is satisfied by a gate that never fires at all. So a gate
      that DIES — an ImportError on `toons`, a provenance predicate that never matches (P1), a
      capability missing from one of five build paths (P2) — is indistinguishable from a gate that
      had nothing to do.
    note: >-
      `gate_run_record` is minted by a phase-C PROMOTION, not by a design sentence. R0's
      bidirectional reconciliation must read it as a fork awaiting §7, not as invented scope.

  # =========================================================================
  # O9 — AVAILABILITY. NEW IN r3, and the whole of it is the demand delta the correction produced.
  # Ten demands discharge O9's three-part oracle; d58 replaces the dead threshold demand. Every one
  # is `form: test`, and every one has an executed probe behind it rather than a design sentence.
  # THE INSTRUMENT THAT MAKES d48-d50 AND d55 DRIVABLE IS A SPY ENCODER'S CALL COUNT on the existing
  # `interacts(toon_gate->toon_encoder)` seam — "the encoder was not called" needs no new boundary,
  # and inferring it from the return value would be untestable (a refusal and a fault look alike
  # from the outside, which is the whole reason r2's arm shipped wrong).
  # =========================================================================

  - id: d48_non_str_or_non_utf8_key_is_refused_before_the_encoder
    kind: behavior
    form: test
    binds: ["tool_result.domain.distinguished[non-text-keys]", "tool_result.domain.distinguished[unencodable-key]",
            "interacts(toon_gate->toon_encoder).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_non_str_or_non_utf8_mapping_key_is_refused_and_the_encoder_is_never_called
    source: "O9(b), M7 — `S1` (84 cases), `S8`"
    note: >-
      The admission rule is the whole of `S1` and it has two halves, both of which this demand
      pins: `isinstance(k, str)` — SUBCLASSES INCLUDED, so `type(k) is str` is the wrong predicate
      and a `str` subclass key must still be ADMITTED — and `k.encode('utf-8')` succeeding, which a
      lone surrogate fails. FOUR STRUCTURAL POSITIONS, because the fault class is not stable across
      them: a non-`str` key raises `PanicException` in mapping position and a plain `TypeError` in
      row position, and a surrogate raises `PanicException` / `UnicodeEncodeError` the same way. A
      test that places the hazard at one position only would pass over an implementation that
      guards one encoder path. The observable is the SPY ENCODER'S CALL COUNT: 0.

  - id: d49_reference_cycle_is_refused_before_the_encoder
    kind: behavior
    form: test
    binds: ["tool_result.domain.distinguished[circular]", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_container_reachable_from_itself_is_refused_and_the_encoder_is_never_called
    source: "O9(b), M7 — `R11`/`S2`, `S8`"
    note: >-
      The one refusal that is not an optimisation: `toons.dumps` does not raise on a self-referential
      container, it SIGSEGVs, and no `except` clause of any breadth catches a signal (`R11`, four
      shapes, all KILLED BY SIGNAL 11). The demand is stated over ALL SEVEN dict/list placements
      `S2` found the hazard reachable through, and the encoder call count is again the observable —
      "the gate returned the original" is satisfied by an implementation that crashed the encoder
      in a subprocess and recovered, which is not what M7 says. Its anti-vacuity control is d53.

  - id: d50_the_validator_walks_exactly_the_encoders_containers
    kind: parity
    form: test
    binds: ["tool_result.domain.distinguished[tuple]", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_the_validators_container_set_equals_the_encoders
    source: "O9, M7's totality argument — `S2` (30 cases across 15 container kinds)"
    note: >-
      THE TOTALITY ARGUMENT, MADE EXECUTABLE, and it is the demand that stops M7 being a guess about
      someone else's recursion. `toons.dumps` recurses into exactly `dict` and `list`, subclasses
      included, and enters NOTHING else — a hazard inside a tuple, a `collections.abc.Mapping`, a
      `Sequence`, a dataclass, a namedtuple, an object attribute, a `deque` or a generator is
      unreachable because the container is emitted as `null` without being entered. So the demand
      is two-sided: a hazard inside one of those is NOT refused (refusing it would be a false
      positive over an input the encoder handles fine), and a hazard inside a `dict` or `list`
      SUBCLASS IS refused. An implementation keying on `type(v) is dict` passes the first half and
      fails the second, which is exactly the drift this demand exists to catch.

  - id: d51_depth_over_the_configured_cap_is_refused
    kind: domain-outcome
    form: test
    fork: f9
    binds: ["toon_gate_max_depth.domain", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_payload_one_level_over_the_configured_depth_cap_is_refused_and_one_under_it_is_admitted
    resolved_by: human            # §7 r6 — f9's two values
    resolution: >-
      §7 r6 — THE CAP IS 64, and this demand does NOT change: it stays parameterized on whatever
      cap is configured and asserts no constant. 64 is roughly 20x the real corpus's depth 3 (`S9`)
      and well under the lowest observed crash floor — a segfault at depth 900 on a 512 KB thread
      stack (`S4`). What the value closes is the GRAPH, not the suite: `toon_gate_max_depth.domain.default`
      was `unknown` and could not close until §7 answered (hole H4).
    source: "O9(b), M7 — `S3` (a deep ACYCLIC payload segfaults), `S4` (the crash depth is not a constant)"
    note: >-
      PARAMETERIZED ON THE CAP, AND IT ASSERTS NO DEPTH CONSTANT — that is the load-bearing half.
      `S4` executed the reason: the crash depth scales with the thread's stack (8 MB dies at 12 000,
      1 MB at 2 000, 512 KB at 900) and `threading.stack_size()` reports `0` in this runtime, so a
      test pinning a specific safe depth would be pinning a property of the machine it happens to
      run on. The observable is one level over the configured cap refused and one level under it
      admitted, at more than one configured cap. `S3` is why the cap exists at all: the payload is
      ACYCLIC, so d49's predicate does not see it.

  - id: d52_node_budget_refuses_a_bounded_input_that_expands
    kind: domain-outcome
    form: test
    fork: f9
    binds: ["toon_gate_max_nodes.domain", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_shallow_acyclic_payload_whose_node_count_exceeds_the_budget_is_refused
    resolved_by: human            # §7 r6
    resolution: >-
      §7 r6 — THE BUDGET IS 100 000, and like d51 this demand does not change: parameterized on the
      configured budget, asserting no constant. 100 000 is roughly 200x the real corpus's peak of
      517 nodes (`S9`) and far below the 2**24 nodes of expansion that take the process (`S7`).
      `toon_gate_max_nodes.domain.default` leaves `unknown` with it — the second half of hole H4.
    source: "O9(b), M7 — `S7`: 29 objects sharing children pairwise produce 132 MB at k=20 and take the process at k=24"
    note: >-
      THE BUDGET IS NOT THE DEPTH CAP, and the fixture is what proves it: the expansion bomb is 29
      objects at depth 28, so a depth cap admits it and the process dies. It is neither a cycle nor
      a bad key nor deep, so d48, d49 and d51 all pass it through. A validator WITHOUT a node budget
      cannot even terminate on it — it would visit 2**28 nodes itself — so this demand also pins
      that the walk's own cost is bounded, which is the second reason M7 precedes the encoder rather
      than wrapping it.
      WHAT THIS DEMAND'S TEST DISCRIMINATES AND WHAT IT DOES NOT, both verified by construction
      against hand-written stubs (`cE1`): it DOES separate a visit count from a UNIQUE-OBJECT one —
      a memoising walk reports 29 nodes here, admits, and fails the `dumps_calls == 0` assertion,
      while an unpruned unique-counter fails the wall clock. It does NOT separate a value count from
      a CONTAINER-ONLY one, because at a budget of 1000 both refuse this fixture: its containers are
      what multiply. That second reading is `d81`, and it is the one that reproduces the incident.

  - id: d53_benign_shared_structure_is_not_refused
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_one_leaf_object_referenced_three_times_encodes_round_trips_and_substitutes
    positive_control_for: [d49_reference_cycle_is_refused_before_the_encoder]
    source: "O9(c), M7's path-scoped cycle check — `S7`'s shared-leaf control, `S8`"
    note: >-
      THE ANTI-VACUITY CONTROL FOR d49, and the demand that fails the cheap wrong implementation.
      M7's cycle check is PATH-SCOPED: a container is refused when it is reachable from ITSELF ON
      THE CURRENT PATH, not when it has been seen before. A global seen-set passes d49 and refuses
      this payload — one leaf dict referenced three times in a row list, which encodes to
      `values[3]{x,y}:` and round-trips exactly (`S7`, executed). Ordinary foreign data shares
      structure; a gate that refuses it is a gate that refuses everything interesting while passing
      its own safety demand.

  - id: d54_the_guard_refuses_nothing_in_the_committed_corpus
    kind: survival
    form: test
    binds: ["interacts(toon_gate->model_view).payload", "toon_gate_max_depth.domain",
            "toon_gate_max_nodes.domain", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_the_guard_refuses_no_committed_fixture_and_changes_no_verdict
    source: "O9(c) — `S9`: 40 fixtures x 2 arms, 0 refusals, max depth 3, max nodes 517"
    note: >-
      O9(c) IS THE CLAUSE THAT STOPS THE OTHER TWO BEING BOUGHT BY REFUSING EVERYTHING. Both arms of
      all 40 committed fixtures are admitted, and the gate's verdict with the guard installed is
      IDENTICAL to the un-guarded bar's on 40 of 40 — the second half is what makes this a survival
      demand rather than a smoke test. `S9` imported the real `build_fixtures.toon_input` rather than
      replicating it, so P5's import hazard (J1) applied to this demand's fixtures exactly as it did
      to the dead d2's.
      RESOLVED AT §7 r10 (P5 = A): THE FIXTURE PAYLOADS AND THE EIGHT-LINE RE-ZIP ARE VENDORED INTO
      THE SUITE. No import from `experiments/`, no `sys.path` mutation, no dependence on `/tmp` —
      which is what removes `build_fixtures.py:15`'s `sys.path.insert(0, "/workspace")` from the
      suite's path and closes hole H2's live half. The cost the human took with it: a duplicated
      helper, so the duplicate-helpers lint needs an INLINE SUPPRESSION NAMING THIS FORK, and the
      vendored fixtures drift if the corpus is ever regenerated. The experiment file itself is left
      untouched, so its cited numbers stand unre-run.

  - id: d55_encoder_faults_are_caught_at_baseexception_breadth
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->toon_encoder).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_baseexception_from_the_encoder_passes_through_and_a_control_flow_exception_is_reraised
    source: "O9, M3's breadth correction — `S5` (PanicException's MRO, and 200 caught panics), `S8`"
    note: >-
      TWO ASSERTIONS, AND THE SECOND IS THE ONE A NAIVE FIX BREAKS. (1) A `BaseException` out of the
      encoder is a passthrough: `pyo3_runtime.PanicException`'s MRO is
      (PanicException, BaseException, object) and `issubclass(PanicException, Exception)` is False,
      which is precisely how r2's arm shipped unimplementable. (2) A CONTROL-FLOW exception is
      RE-RAISED, not swallowed — `CancelledError`, `KeyboardInterrupt`, `GeneratorExit`,
      `SystemExit`, and the house's `BudgetKill`; the shape is `query_tool._decide_guarded`'s, which
      already does exactly this in this tree. Widening to `except BaseException` without the
      re-raise turns a cancelled run into a silently-substituted one. `S5` also establishes the arm
      is DURABLE rather than one-shot: after 200 consecutive caught panics `dumps` still encodes and
      round-trips, so the test may reuse one encoder across cases.

  - id: d56_a_raising_decoder_passes_through
    kind: behavior
    form: test
    binds: ["tool_result.domain.distinguished[hazard-in-key]", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_view_the_encoder_produced_that_the_decoder_cannot_read_passes_through
    source: "O9, M3's missing arm — `R7` (14 of 56 key pairs mis-round-trip), `S5` (42 cases: 34 clean, 4 catchable panics, 4 mismatches)"
    note: >-
      THE BOX r2's DIAGRAM DOES NOT HAVE. r2 has `loads(dumps(x)) != x`, an INEQUALITY; it has no
      "`loads` raises" branch, and `loads` raises on views `dumps` ITSELF PRODUCED — `ToonDecodeError`
      on `x[2]{a,b}y` as a key, `PanicException` ("begin > end when slicing") on `}` and `}:`.
      PRE-VALIDATION CANNOT COVER THIS: a `}` key is a legal, UTF-8-encodable `str` that M7 admits by
      design, so the guard is the only thing between it and an escaped fault. The probed BOUND is
      what makes a guard sufficient: across the hazard alphabet `loads` never crashes the process —
      its worst outcome is a catchable `PanicException` — so unlike the encoder's cycle case there is
      no signal to survive here.

  - id: d57_process_outcome_is_identical_with_and_without_the_gate
    kind: parity
    form: test
    binds: ["interacts(toon_gate->tool_result).response", "interacts(toon_gate->model_view).payload",
            "tool_result.domain.distinguished[circular]"]
    discharged_by: test_every_input_class_kills_or_survives_the_run_identically_with_and_without_the_gate
    source: "O9(a) and N9 — `S11`: 8 cases, run with the gate and with `capabilities=[]`, identical case for case"
    note: >-
      THE DEMAND THAT KEEPS O9 HONEST INSTEAD OF OVER-PROMISING, and it is a PARITY demand precisely
      because it is not an immortality one. Three probed classes still kill the run — a circular
      container and a 50 000-deep container die in `PydanticSerializationError` inside pydantic-ai's
      own tool-return serialization, and the expansion bomb takes SIGKILL from the OOM killer —
      IDENTICALLY with the gate installed and with no capability at all. r2's failure was an
      over-promise ("fails safe by construction"), so the replacement is stated as a differential:
      survives-or-dies, and how, is the same on both arms. ONE PROBED DIVERGENCE, and the test must
      not assert it away: on a `}`-in-key payload the guarded run prints a Rust panic line to STDERR
      that the ungated run does not. Model-visible text is identical; process stderr is not.

  - id: d58_the_gate_honours_the_configured_bar_either_side
    kind: domain-outcome
    form: test
    fork: "f6, P5, f7"
    resolved_by: human            # §7 r10 (f6=A, P5=A) and r7 (f7=B — the addresses below are re-spelled)
    binds: ["toon_gate_max_ratio.domain", "toon_gate_max_ratio.domain.distinguished[85]",
            "toon_gate_max_ratio.domain.alternatives[90]", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_payload_just_under_the_configured_bar_substitutes_and_one_just_over_it_passes_through
    resolution: >-
      THREE RESOLUTIONS LAND ON THIS DEMAND AND NONE CHANGES WHAT IT ASSERTS. r10 (f6 = A) leaves
      the assertion alone and moves the work to prose. r10 (P5 = A) settles where its fixtures come
      from: vendored into the suite, no import from `experiments/`. r7 (f7 = B) RE-SPELLS THE
      ADDRESSES IT BINDS — the bar is an INTEGER PERCENT read through the existing `env_int`
      (`DEFENDER_TOON_GATE_MAX_PERCENT=85`), so `toon_gate_max_ratio.domain.type` moved float -> int
      and the two cells are now `distinguished[85]` and `alternatives[90]`. The binds above are
      written AFTER that move, which is the ordering f7-B forces: re-spell the boundary, then bind.
      The demand still runs at more than one configured bar and still asserts NO CONSTANT.
    source: "M2 as rewritten in r3 — `S9`, `r8`. REPLACES d2 AND d26, which are dead."
    note: >-
      ASSERTS THE RELATION, NEVER THE CONSTANT. At a configured bar, a payload whose ratio is just
      under it substitutes and one just over it passes through; the demand is run at MORE THAN ONE
      bar, including `0.90`, which is why it re-binds both of the dead demands' addresses and keeps
      R4 discharged on them rather than re-firing. The reason it is not d2 with a parameter: d2
      pinned the 1.5pp owned/unowned window, and that window is measured between two ENCODINGS OF
      ONE POPULATION — `measure_rulers.py:128` builds the "unowned" arm from the same 40 owned
      payloads re-zipped (J2, R12, S9) — so it bears on no foreign source and the human dropped it
      as unevidenced. What survives is the mechanism: `<=` is inclusive, so a payload exactly at the
      bar substitutes and one byte over passes through, whichever spelling ships (silent branch 20).
      The BOUNDARY's `default`, `distinguished[85]` and `alternatives[90]` are spelled as f7-B
      spells them so the addresses resolve; what has not changed is that no demand asserts them.

  # =========================================================================
  # MINTED AT §7 (`.spec-flow/frontiers/70-resolutions-r2.md`). Eleven demands, each traceable to
  # one numbered resolution and to the residue item or fork cost it closes. Four are `form: waiver`
  # — a human's examined no, kept in the artifact with its rationale and its citations, never a
  # silence in `handoff.drops`. Nothing here is minted from a recommendation: every one of these is
  # something the resolution record states the human took or accepted.
  # =========================================================================

  - id: d59_the_provenance_label_is_defined_and_defaults_to_foreign
    kind: domain-outcome
    form: test
    resolved_by: human            # §7 r2 — P1 = B mints it
    binds: ["toolset_provenance_label", "toolset_provenance_label.domain.distinguished[unlabelled]",
            "interacts(toon_gate->toolset_provenance_label)"]
    discharged_by: test_an_unlabelled_toolset_is_treated_as_foreign_and_only_the_composition_root_marks_owned
    source: "§7 r2 (P1 = B) — 'Mints a demand for what the label is, who may set it, and what an unlabelled toolset defaults to'"
    note: >-
      THE WHOLE COST OF P1 READING B, and the human took B knowing it. Three things the test must
      pin, because the resolution names three and a test pinning one goes green over an
      implementation that got the other two wrong. (1) WHAT THE LABEL IS: the gate reads
      `ToolsetTool.toolset` / `tool_def.metadata`, both readable at the seam (`r7`, executed).
      (2) WHO MAY SET IT: the decided default is "foreign unless installed by DEFENDER'S OWN
      COMPOSITION ROOT", so `owned` is a property of the installation site, not a string a toolset
      can assert about itself. (3) WHAT AN UNLABELLED TOOLSET DEFAULTS TO: FOREIGN — the
      `distinguished[unlabelled]` member, and the safe direction, because an unlabelled foreign
      source is then gated and framed rather than silently exempt. The observable is the
      model-visible text for a same-named tool installed each way in one run, read off the parts
      the model got. The mislabel hazard in the other direction is d60, an accepted limitation.

  - id: d60_a_foreign_source_installed_with_an_owned_label_is_an_accepted_limitation
    kind: negative
    form: waiver
    resolved_by: human            # §7 r2
    binds: ["toolset_provenance_label.domain.alternatives[owned-label-set-by-the-installer]"]
    outcome:
      nl: >-
        A foreign source installed with an OWNED label is treated as owned — it is not gated, and
        under f2 reading B it is never framed — and this change describes and tests no defence
        against that. The limitation is accepted and recorded, the way N7 records native returns:
        the label is trusted because the installation site is trusted, and nothing in the gate
        re-derives foreignness from the source itself.
    rejected:
      - {nl: "a demand that the gate independently verify a toolset's provenance — nothing in the tree can distinguish an owned label set by defender's composition root from one set by a caller that reached the same seam, and inventing a verifier is scope §7 did not grant"}
      - {nl: "P1 reading A (provenance-blind), which removes the mislabel hazard by removing the label — at the cost of silently changing the model-visible text of every owned tool that ever returns a dict, which is exactly what O2 forbids"}
    cites: [r7, H3]
    note: >-
      `crosses_validation: unknown` on this alternative was an R0 hole in `60-residue.md` (item 15)
      and an R4 hole (item 15's other rule) precisely because nothing defended the crossing. §7 r2
      did not defend it either — it ACCEPTED it, which is a different thing from leaving it open,
      and this waiver is where the difference is recorded. A later reader who finds the hazard has
      the human's own decision to disagree with rather than a silence to mistake for an oversight.

  - id: d61_every_foreign_result_is_stringified_before_it_is_framed
    kind: behavior
    form: test
    resolved_by: human            # §7 r3 — f2 = B needs a step no design sentence supplies
    binds: ["interacts(toon_gate->untrusted_frame)", "interacts(toon_gate->tool_result).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_dict_an_int_and_none_are_stringified_before_the_frame_and_the_frame_never_raises
    source: "§7 r3 (f2 = B) — 'needs the stringify step no design sentence supplies' (`r12`, executed)"
    note: >-
      THE STEP f2 READING B REQUIRES AND THE DESIGN NEVER WROTE. `_untrusted.wrap` raises
      `TypeError` on a dict, an int and `None` (`r12`, executed), and under B the PASSTHROUGH branch
      must be framed too — so a value that is not already a `str` has to become one first, on every
      branch, including the refused-by-guard one. The observable is the model-visible text for each
      of those three shapes: framed, with the tool's own wire JSON between the delimiters and no
      raise anywhere on the path. THE TRAP THIS DEMAND EXISTS TO CATCH: an implementation that
      stringifies with `str(value)` produces Python `repr` text — single quotes, `None`, `True` —
      which is neither the wire JSON nor recoverable, and it would pass a test that only asserted
      "the result is framed". The stringification is the wire serialization (`to_json`), which is
      also what makes d0's "the JSON content is unchanged inside the frame" checkable.

  - id: d62_o6_does_not_reach_refusals_raises_native_or_output_typed_returns
    kind: survival
    form: waiver
    resolved_by: human            # §7 r3 — the recorded non-obligation B is scoped by
    binds: ["interacts(toon_gate->untrusted_frame)", "interacts(toon_gate->tool_result).response"]
    outcome:
      nl: >-
        O6's "foreign tool output is tagged untrusted" is met only for values the WRAPPER RETURNS.
        Four classes of foreign-influenced text stay unframed and are out of scope: a call the
        outermost budget hook answers WITHOUT calling the handler; a tool that raises, whose
        ModelRetry/ValidationError becomes a ToolRetryError before `call_tool` is reached; a native
        / server-side return, which crosses no interception point at all; and an output-typed
        tool's return, which the library combines after `get_wrapper_toolset` has seen the toolset.
        None of the four crosses the seam f2 reading B lives at, so B buys a scoped universal, not
        a universal.
    rejected:
      - {nl: "reading f2-B as O6 discharged for all foreign output — the mechanism cannot deliver it, and a later reader who takes the unscoped sentence at face value inherits four unframed classes believing they are covered"}
    cites: [B5, H9]
    note: >-
      Written the way N7 is written, and for the same reason: the danger is not the gap but a later
      reader not knowing there is one. d34 already records native returns and d42 the output-typed
      ones; this waiver is what states that O6 SPECIFICALLY does not reach them, plus the two
      classes no earlier demand named — the budget refusal and the raise.

  - id: d63_the_offline_reader_shows_the_original_json_beside_the_view
    kind: coherence
    form: test
    resolved_by: human            # §7 r8 — Card 18, reading B
    binds: ["interacts(visualize_messages->tool_return_part)", "interacts(visualize_messages->wire_log)"]
    discharged_by: test_the_rendered_runtime_page_shows_the_original_json_of_a_substituted_call
    source: "§7 r8 — 'A new demand requires the offline reader to surface the original JSON' (`S5`, executed end to end)"
    note: >-
      THE DEMAND THAT STOPS O5 BEING TRUE AND UNOBSERVABLE. Measured before the seam ran (`S5`):
      `load_messages` is a tolerant JSONL reader and returns `metadata` VERBATIM, but
      `_request_entries` builds a fixed-key entry — `{kind, turn, phase, tool, is_error, content,
      tools}` — and the field is dropped one layer past the reader. The page renders (46 198 chars)
      with the TOON view visible, the original JSON absent and the word `metadata` absent from the
      whole page. Reading A ("it still renders") was on the table and was NOT taken: under f1-C plus
      f5-B it would have left O5 discharged only against `wire_logs/llm_requests.jsonl`, a file
      denied to every agent and read by no tool in the tree except the one that drops the field —
      H1's "a dead gate reads as an idle one" arriving by a second route. Reading B is scoped: the
      page shows `metadata` WHERE IT IS PRESENT and changes nothing where it is absent.
      TRAP FOR THE AUTHOR, and it is not this demand's defect to fix: `visualize_messages` ->
      `visualize_data` -> `visualize_messages` is an IMPORT CYCLE, so the wire log's only reader is
      not importable as its own module head. Pre-existing; a test that imports it first raises
      `ImportError`.

  - id: d64_a_raw_nul_byte_is_refused_before_the_encoder
    kind: domain-outcome
    form: test
    resolved_by: human            # §7 r9 — re-grounding fork 2, reading B
    binds: ["tool_result.domain.distinguished[nul-byte]", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_payload_carrying_a_raw_nul_is_refused_and_the_encoder_is_never_called
    source: "§7 r9 — 'add NUL to the pre-validator's refusal predicate, folded into M7's guard' (`R10`, executed)"
    note: >-
      A FIFTH REFUSAL REASON IN M7, AND THE ONLY SECURITY-SHAPED ONE IN AN AVAILABILITY CONTROL —
      worth saying out loud, because the design's own Security deep dive says the pre-validator is
      not a security control and must not be sold as one. What it buys is O2 back for this class:
      measured, the encoder emits a NUL RAW AND UNQUOTED, `loads` returns the original exactly, the
      byte gate clears at 0.6125 and the gate SUBSTITUTES — so the model reads a bare U+0000 on the
      substitute arm where the passthrough arm shows the six printable characters `\u0000`. That is
      a model-visible difference between gated and un-gated text, which is the one thing O2 was
      written to forbid. #851's NUL refusal does not reach this seam — all three callers of
      `decide_bash` take a model-authored bash command, never a tool return (`R10` refuted it) — so
      nothing else in the tree covers it. The clause is cheap because the walk already exists: M7
      traverses every mapping key and every container for the key and cycle checks, and the string
      scan rides along. TWO OBSERVABLES, and the second is what makes it a refusal rather than a
      round-trip failure: the spy encoder's CALL COUNT IS 0, and the model-visible text is
      byte-identical to the no-gate run's.

  - id: d65_metadata_survives_the_history_the_run_rebuilds_before_sending
    kind: coherence
    form: test
    resolved_by: human            # §7 r1 (f1 = C) + r8 (P-obs = A) — residue item 4
    binds: ["interacts(process_history->tool_return_part)"]
    discharged_by: test_a_substituted_calls_metadata_survives_the_send_history_rebuild
    source: "60-residue.md item 4 (R7), unblocked by §7 r1 and r8"
    note: >-
      BOUND AT THIS READER'S OWN EDGE, NEVER AT `tool_return_part`'S ALTITUDE — a demand at the
      boundary reads green when two of the four readers moved, which is the escape R7 computes.
      The send history is REBUILT FROM THE STORE PER REQUEST (MAIN's `ProcessHistory` returns
      `selection.render(...)`, which discards the live list and returns `hydrate(store, ...,
      role='send')`), so this reader is the one that decides what the model actually sees for a
      substituted call. `R2` settled that `metadata` survives the rebuild — WHICH IS EXACTLY WHY
      THE MISSING DEMAND WAS DANGEROUS: the fact is settled and nothing pinned it, so a later change
      to the processor would break O5 with the suite green. §7 r8 makes this edge load-bearing a
      second time, because the dispatched request messages are where O1/O2/O3/O8 are now read.

  - id: d66_metadata_survives_the_session_stores_round_trip
    kind: coherence
    form: test
    resolved_by: human            # §7 r1 (f1 = C) — residue item 5
    binds: ["interacts(session_store_handle->tool_return_part)"]
    discharged_by: test_a_substituted_calls_metadata_survives_persist_and_hydrate_through_the_store
    source: "60-residue.md item 5 (R7), unblocked by §7 r1"
    note: >-
      THE PERSIST HALF OF THE SAME ROUND TRIP d65 pins the read half of. The store writes the part
