     observed: "On the k=28 bomb — A: REFUSED 'node budget exhausted', dumps_calls 0, 0.3 ms. B: ADMITTED at 29 unique objects, dumps_calls 1 (d52's assertion fails, and 29 is the incident's own object count). C: 2**29-1 steps at 2.75M steps/s, killed at 95 s against d52's 90 s clock, so `not outcome.timed_out` fails. B passes d49 (cycle refused), d51 (depth refused), d53 (shared leaf admitted) and the corpus shape unchanged — d52's test is the ONLY thing in the suite that sees it.",
