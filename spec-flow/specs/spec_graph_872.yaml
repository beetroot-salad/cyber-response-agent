# ---------------------------------------------------------------------------
# CLAIMS — the ledger. Every load-bearing statement about reality-as-it-is, with the probe that
# tested it and what the probe observed. Three sources, ids kept verbatim:
#   inherited (discuss-issue's sweep and the three r1 frontiers): c1-c12, G1-G14, x1-x10, H0-H16
#   raised in the corrected doc:                                  r1-r18
#   raised by this run's frontiers:  B1-B17 (10-brief-r2), r19-r27 (20-demands-r2), J1-J3 (45-dispositions)
#   MINTED AND NOT YET RUN:          R2-R12, the eleven `route: re-ground` probes a leaf is running
#                                    in parallel right now. Each is `verdict: unprobed` and names
#                                    what it gates. NOTHING CITES THEM — a citation resting on an
#                                    unprobed claim is a finding, not a pass.
#
# INSTRUMENT RECONCILIATION DONE AT ASSEMBLY, and it is not cosmetic: `spec-graph claims` gates a
# claim's recorded `probe_kind` against the set its `kind` admits, and mis-typing is how the whole
# ledger is evaded. Where a frontier typed a claim `census`/`referential` and recorded
# `probe_kind: executed` for what was a scripted SEARCH (an AST pass, a grep, a `git log -S`), the
# instrument is recorded here as `search`, with the script named in `probe`. Where a frontier's
# SENTENCE predicted runtime behavior but its probe was a read, the claim is either narrowed to what
# the read established (with a note naming the executed claim that carries the behavioral half) or
# left `unprobed`. Every such adjustment says so in its own `note`.
# ---------------------------------------------------------------------------

