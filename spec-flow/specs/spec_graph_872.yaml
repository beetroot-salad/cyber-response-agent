    - id: wire_log
      provenance: code
      facets:
        identity:
          key_axes: [run_id, agent_id, seq]
          evidence: {nl: "`wire_logs/llm_requests.jsonl`, composed at observe.py:265-281 (wire_log_path). ONE RequestLogger per investigation, shared by MAIN, the gather subagent and all three review lenses (driver.py:940; build_gather_agent takes the logger at :417 and forwards it at :434; review_roles.build_stages passes the run's logger to each staged build at :279 — a bundle minting its own logger was the #787 defect). Records are separated only by an `agent_id` FIELD and a per-agent sequence (observe.py:130, :137-143). Whether `tool_call_id` is unique across those agents and across a model-issued retry is UNPROBED — probe R5."}
          sharing: serialized-append
