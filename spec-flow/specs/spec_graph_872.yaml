    - {from: main_agent,           to: request_logger,     provenance: code, multiplicity: serial}
    - {from: gather_agent,         to: request_logger,     provenance: code, multiplicity: serial}
    - {from: review_lens,          to: request_logger,     provenance: code, multiplicity: serial}
