base: 12763db2  # = main e46b3839 + 08d05582 (the evidence corpus) + 12763db2 (the `toons` dependency).
                # write-code-from-spec's gate diffs against this.

# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# The change: a TOON re-encoding gate on the tool-return seam. A `WrapperToolset` subclass
# returned from an `AbstractCapability.get_wrapper_toolset` overrides `call_tool`; when a FOREIGN
# tool's return is a dict/list whose TOON form is <= 85% of its wire-JSON bytes and round-trips
# exactly, the model is handed the TOON view instead of the JSON.
#
# THE THING THAT MAKES THIS SPEC UNUSUAL, AND WHY THE STRUCTURE BELOW LOOKS THE WAY IT DOES:
#
#   * O1 IS CURRENTLY UNDRIVABLE. All 14 registered tools are annotated `-> str` except
#     `query -> Any`, and `query`'s dict is discarded by QueryCapture at every candidate seam
#     (B1, r2, r6). `run_investigation`'s 14 DI seams admit no toolset and no capability (B2/r17).
#     So O7/M6 MINT THE SEAM ITSELF as part of the contract, and `d20` is deliberately extracted as
#     drive-and-observe ("install a foreign toolset through the declared seam and read the
#     model-visible text"), never as "a parameter exists" — the shape phase B was told to hunt.
#   * THE BLAST RADIUS IS 14 TOOLS ACROSS 8+ AGENTS. `build_agent_core` (driver.py:272) is the
#     single `Agent(...)` construction site and it serves FIVE build paths: MAIN, the gather
#     subagent (one per lead), the three review lenses, the six learning stages, and the judge.
#     Each carries its own deps subclass, its own salt, its own run root and its own wire-log
#     family. Where the capability installs is fork P2 — promoted here, undecided.
#   * THE MODEL-VISIBLE TEXT HAS AN UNLISTED CO-AUTHOR: the SESSION STORE. MAIN's `ProcessHistory`
#     processor ends by returning `selection.render(...)`, which discards the live message list and
#     returns `hydrate(store, session_id, role="send")` — the send history is REBUILT FROM THE STORE
#     PER REQUEST (driver.py:493,:526-557; selection.py:132-147; session_store.py:917-934). The
#     profile declares that store with eleven writers and eleven readers. Whether
#     `ToolReturnPart.metadata` survives that round trip is UNPROBED (claim R2) and it is the single
#     fact f1 reading C and f5 reading B both rest on.
#
# STATE OF THIS FILE — SECOND PASS, after phase C's re-grounding refutation was folded in:
#   * THE FAULT ARM WAS REFUTED BY EXECUTION AND THE HUMAN ELECTED TO FOLD THE CORRECTION IN.
#     `47-reground.md` proved the r2 key flow does not fail safe (`PanicException` is a
#     `BaseException`; a self-referential container SIGSEGVs), and `55-corrections-r3.md` hardened
#     the mechanism into M7, the pre-validator, over twelve further probes (`S1`-`S12`). The demand
#     delta it produced is applied here: 39 unchanged, 10 changed, 2 DEAD (recorded in
#     `handoff.drops`, each naming the address that re-binds it), 11 new -> 60. §7 then took it to
#     69 by the same accounting rule: 2 more dead, 11 more minted, every death naming its re-bind.
#   * THE THRESHOLD DEMAND IS GONE, PER THE HUMAN. `0.85` is no longer asserted by any demand:
#     `d2` and `d26` are dead and `d58` replaces both, pinning the gate's behaviour EITHER SIDE OF A
#     CONFIGURED BAR and no constant. The boundary keeps its spelled default so the addresses stay
#     resolvable; what changed is that nothing pins them.
#   * THE ELEVEN RE-GROUND PROBES HAVE RUN. `R2`-`R12` carry the verdicts `47-reground.md` executed
#     and the instruments it used; `S1`-`S12` are this correction's own. Four claims came back
#     REFUTED AS WRITTEN (`R6`, `R9`, `R10`, `S6`, `S10`) — carried, not deleted.
#   * §7 (THE HUMAN SEAM) HAS RUN, and this file is its enactment. EIGHTEEN forks went in — f1, f2,
#     f5, f6, P1-P6, P-obs (eleven the human's), the re-grounding leaf's fork 2 / fork 3 / fork 4,
#     the r3 leaf's f7 (the bar's knob form), f8 (M3's oracle) and f9 (the cap and budget values),
#     plus Card 18 (the offline reader), raised by the pre-seam leaf after the packet was written.
#     FIFTEEN were resolved by the human across ten decisions, THREE auto (P3, P4, re-grounding
#     fork 4), NONE open. The 31 silent branches follow their forks: 28 auto, 3 still pending with
#     the reason named in place. The resolution record is
#     `.spec-flow/frontiers/70-resolutions-r2.md`, and it is conservation-counted against both the
#     forks and `60-residue.md`'s 26 routed items.
#   * THE DEMAND DELTA §7 PRODUCED: 2 dead (d15a with fork f5 reading A, d37 subsumed by f8's new
#     oracle) and 11 minted (d59-d69), of which FOUR are `form: waiver` — a human's examined no,
#     kept in the artifact with its rationale and citations. 60 -> 69. The structure moved too, and
#     that is the part a reader is most likely to miss: `toon_sidecar` and two edges are GONE with
#     f5-A, `toon_gate_max_ratio` moved float -> int with f7-B (`distinguished[85]`,
#     `alternatives[90]`), and three `unknown` defaults are now answered — depth 64, nodes 100 000,
#     and the provenance label defaulting to `foreign`.
#   * THE GATE LEAF HAD RUN BEFORE IT: the `gate:` block below is its record, updated with each
#     hole's outcome. What it could not answer was routed in `.spec-flow/frontiers/60-residue.md`,
#     one entry per hit; 20 of the 26 are settled and SIX ARE STILL OPEN and named there — the nan,
#     inf and toolreturn members, N9's unbound sentence, the `render` footer waiver candidate, and
#     the two unmodelled subprocess driver contexts.
#
# NAMES RECONCILED AT ASSEMBLY (grounding, demand extraction and the dispositions' address
# derivations coined these independently — keyed by role+origin):
#   `toon_gate_ratio` (10-brief-r2)      == `toon_gate_max_ratio` (20-demands-r2)  -> toon_gate_max_ratio
#   `run_dir` as the f5-A sink (20-demands-r2) == `toon_sidecar` (S5, 10-brief-r2) -> toon_sidecar
#        (`run_dir` is kept, as the existing tree the sidecar would land in — a different element)
#   `tools_gather` (brief)               == profile contextAlias `gather_dispatch`  -> gather_dispatch
#   the demands' `wire_log`              == S3 `wire_log` == the profile resource   -> wire_log
#        (SPLIT: the six learning stages write a DIFFERENT family — `learning_wire_log`, per f5)
#   `queries_table` (S2) == `executed_queries.jsonl` == judge's `_QUERIES_TABLE`    -> queries_table
#   the axis the demands called `tool_call` == the join key f5-B calls `tool_call_id` -> tool_call
#   the axis `run_dir` (20-demands-r2's registry) — RENAMED `run_id`: it is the run's identity, and
#        `run_dir` is a boundary here, so one name could not be both.
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE RETURN CONTRACT AT THE SEAM. Split: the passthrough half is NOT forked and is pinned;
  #      the substitute half is fork f1 and is carried unresolved.
  # =========================================================================

  - id: d0_passthrough_carries_the_tools_own_json_unchanged
    kind: behavior
    form: test
    resolved_by: human            # §7 r3 — f2 = B
    binds: ["interacts(toon_gate->tool_result).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_passthrough_carries_the_tools_own_json_unchanged_inside_the_frame
    source: "design-872-r2 § 'The return contract at the seam', RE-EXPRESSED by §7 r3 (f2 = B)"
    note: >-
      CHANGED BY §7 r3. As written this demand asserted `result is original` — object identity —
      because O2 is stated as byte-identity and identity was the only reading that guaranteed it.
      **f2 landed on B**, and B breaks that by construction: every foreign result the wrapper
      returns is stringified and framed, so the passthrough branch can no longer return the object
      it was handed. The human's decision voids `result is original` and re-reads O2's
      byte-identity as "THE JSON CONTENT IS UNCHANGED INSIDE THE FRAME". That is what this demand
      now asserts and what its test must drive: the bytes between the frame's delimiters are the
      tool's own wire JSON, byte for byte, on every passthrough arm. The identity assertion is not
      merely weakened, it is GONE — a test still asserting `is` would pin a contract §7 rejected.
      d9 carries the same re-reading at the parity altitude, and d61 pins the stringify step B
      needs and no design sentence supplied.

  - id: d0b_substitute_return_shape
    kind: behavior
    form: test
    fork: f1
    resolved_reading: C
    resolved_by: human            # §7 r1 — the carriage bundle
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->tool_return_part).payload"]
    discharged_by: test_substitute_branch_return_shape
    readings:
      A: "bare `toons.dumps(x)` — drops every framing demand at this seam (d3, d17a, d17b, d18 fall), and leaves O5 to f5 reading A, which has no path template, no key axis and no writer symbol"
      B: "`_untrusted.wrap(toon, 'untrusted', ctx.deps.salt)` — keeps d17a and makes d3 live: the frame costs a fixed 67 bytes (r20) and 8 of the 40 committed unowned fixtures clear the bar on encoder bytes and fail it on delivered bytes"
      C: "`ToolReturn(return_value=<toon>, metadata={'json': <original>})` — mints the attributability demand and is the ONLY reading that makes f5 reading B available (r19, executed)"
    resolution: >-
      §7 r1 — READING C, WITH B's FRAME APPLIED TO `return_value`. The gate returns
      `ToolReturn(return_value=<framed TOON>, metadata={"json": <original>})`. Taken as one
      decision with f5=B, P6=B and the persistence cost accepted (re-grounding fork 3 = A).
    note: >-
      RESOLVED AT §7 (r1), and the two costs C carries were on the table when it was taken.
      (1) An outer hook that discards `call_tool`'s return discards the metadata with it —
      `QueryCapture` does exactly that for `query` today (r6) — so attributability is silently
      unmet for that tool family unless P6's reporting covers it. THE HUMAN ACCEPTED THAT
      LIMITATION; it is recorded as an examined no at d69, not left as a silence. (2) C's
      dependence on `ToolReturnPart.metadata` surviving persist -> `hydrate` was discharged by
      probe R2 before the seam ran, so there is no degraded path back to A. The persisted record
      grows ~38% over not gating at all (3465 B against 2518) while `compaction.payload_chars`
      reports a 59% saving — accepted at r1 and written into the design's Scale deep dive.

  # =========================================================================
  # O1 — the cheaper encoding reaches the model
  # =========================================================================

  - id: d1_foreign_dict_row_reaches_model_as_toon
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_foreign_dict_row_clearing_the_bar_reaches_the_model_as_toon
    source: O1
    positive_control_for: [d28_render_is_not_hooked]

  # d2_bar_separates_owned_from_unowned IS DEAD — the threshold demand, dropped as unevidenced per
  # the human's instruction (55-corrections-r3). It pinned the 1.5pp owned/unowned window and `0.85`
  # as a contract; the window is measured between two ENCODINGS OF ONE POPULATION (J2, R12, S9), so
  # it bears on no foreign source. Its binds are re-bound by d58, which runs the same boundary
  # parameterized on the configured bar — so R4 on `distinguished[0.85]` stays discharged rather than
  # re-firing. Death recorded in `handoff.drops`.

  - id: d3_delivered_bytes_honour_the_bar
    kind: shape
    form: test
    fork: "f1, f2"
    resolved_reading: framed
    resolved_by: human            # §7 r1 (f1=C with B's frame) + r3 (f2=B) — both put the frame inside the comparison
    binds: ["interacts(toon_gate->model_view).payload", "toon_gate_max_ratio.domain"]
    discharged_by: test_the_bytes_the_model_receives_clear_the_bar_the_gate_measured
    readings:
      no-frame: "under f1 reading A the delivered bytes ARE the encoder's bytes and this demand collapses into d1"
      framed: "under f1-B, f1-C-with-frame or f2-B the frame's 67 bytes are inside the comparison, or a payload that clears only before framing is not substituted"
    resolution: >-
      LIVE, on the `framed` reading, by both of its forks at once: r1 applies B's frame to
      `return_value` and r3 frames every foreign result. The code must carry a DELIVERED-bytes
      measurement, not an encoder-bytes one — 8 of the 40 committed unowned fixtures clear on
      encoder bytes and fail on delivered bytes, and below ~447 B of wire JSON the framed view can
      exceed the JSON it replaced, inverting O1.
    source: "r20 — 8 of 40 committed unowned fixtures clear on encoder bytes and fail on delivered bytes; below ~447 B of wire JSON the framed view can exceed the JSON it replaced, inverting O1"

  # =========================================================================
  # O2 — the five passthrough arms, each driven
  # =========================================================================

  - id: d4_non_dict_return_passes_through_unencoded
    kind: domain-outcome
    form: test
    binds: ["tool_result.domain.distinguished[str]", "tool_result.domain.distinguished[scalar]",
            "tool_result.domain.distinguished[none]", "tool_result.domain.distinguished[content-block]",
            "tool_result.domain.distinguished[bytes]", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_str_scalar_none_and_content_block_returns_never_reach_the_encoder
    source: "O2, x8/r10 — the type admission must precede both the byte gate and the round-trip"
    note: >-
      The type admission examines the TOP-LEVEL shape only (settled #4): once admitted, a
      list-of-lists, a mapping-of-mappings or a mixed list runs the identical byte gate and round
      trip. `bytes` and a content-block object are enumerated members, not new rules (settled #26,
      #1) — and the content-block arm returns the wrapped toolset's object itself.
      THE WIDENING HAZARD BELONGS BESIDE THIS RULE and is now its own clause at `d79`: admitting a
      container the encoder does not ENTER makes `toons.dumps` return the literal `'null'`, which
      clears the bar, with only M3's round trip between total data loss and the model (`R3`, `S2`).
      It was recorded as a rider inside silent branch 29 and nowhere else (`92-reconciliation.md`
      F10).
      NOT DECIDED, AND THE TEST DOES NOT CLAIM IT: what the content-block arm DELIVERS. `d4`'s own
      sentence above has it returning the wrapped toolset's object itself, while f2=B stringifies
      and frames every foreign exit; the two give different delivered shapes and §7 answered
      neither. The test asserts the model-visible bytes for `str`, scalar, `None` and `bytes`, and
      for the content block asserts only that the encoder was never called. Relayed.

  - id: d5_encoder_exception_passes_through
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->toon_encoder).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_raising_toon_encoder_emits_json
    source: "M3's breadth correction (r3) — `except Exception` is the exact clause the refutation walked through"
    note: >-
      CHANGED BY THE r3 CORRECTION, in two ways that both bear on how phase E writes the test.
      (1) BREADTH: the arm is `BaseException` with control-flow exceptions re-raised
      (`query_tool._decide_guarded`'s shape); d55 is the demand that pins the breadth and the
      re-raise separately. (2) REACHABILITY NARROWS: the panic classes no longer reach this arm at
      all, because M7 refuses a non-`str` key and a cycle BEFORE the encoder is called (d48, d49).
      So the fault this test reaches the arm with must be one M7 ADMITS — not a non-`str` key. The
      probed instance is a legal `str` key the decoder chokes on (`S5`) or an encoder fault inside
      an admitted payload; a test that reaches this arm with `{1: 'x'}` is testing d48 and will go
      green for the wrong reason.

  - id: d6_baseline_serialization_error_passes_through
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->wire_ruler).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_pydantic_serialization_error_on_the_baseline_emits_json
    source: "M3, r10 — the fault value is an arbitrary object, the ONLY input `to_json` raises on"
    note: >-
      ITS TWO ORIGINAL ASSERTIONS ARE PURE DIFFERENTIALS, WHICH IS WHY IT WAS THE ONE NULL-STUB PASS
      WITH NO CONTROL, and the control is a design consequence rather than a design call
      (`90-mechanical.md` §7 item 1, answered at `92-reconciliation.md` F7). `loads_calls == 0` and
      "the failure class is unchanged" are both satisfied by a gate that does nothing at all. The key
      flow FIXES the order — pre-validate -> `dumps` -> `to_json` -> bar — and d10 pins that chain
      with its own test, so the encoder is reached BEFORE the baseline serialization is attempted;
      executed on this demand's own fixture, `toons.dumps` SUCCEEDS (`'rows[1]{a,b}:\n  null,1'`,
      the arbitrary object silently nulled) and `ToolReturnPart.model_response_str` then raises. So
      `dumps_calls == 1` is determined by the design and is 0 for a null gate. The test asserts it,
      with a guard that fails loudly if the encoder ever starts raising on this fixture instead.

  - id: d7_over_the_bar_passes_through
    kind: domain-outcome
    form: test
    binds: ["tool_result.domain.distinguished[nested]", "tool_result.domain.distinguished[non-uniform-list]",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_nested_payload_and_one_toon_enlarges_pass_through

  - id: d8_roundtrip_inequality_passes_through
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->toon_encoder).response", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_silently_coerced_value_fails_the_round_trip_and_emits_json
    source: "O3, M3, r10 — a `set`, `bytes` and an arbitrary object are each nulled silently by toons"
    note: >-
      CHANGED TWICE. (1) THE r3 CORRECTION gave this demand a second arm, the one where THE
      COMPARISON ITSELF RAISES — `S6` executed it, and the arm is a passthrough like every other,
      inside M3's `BaseException` guard rather than outside it. (2) §7 r4 RESOLVED f8 ON READING B,
      SO THE ORACLE THIS DEMAND DRIVES IS NO LONGER PYTHON `==`: it is
      `to_json(loads(toon)) == to_json(value)`, and the comparison's fault arm changes shape with
      it. Under `==` the probed fault was a value whose `__eq__` raises (`S6`); under B there is no
      `__eq__` call at all and the probed fault is `to_json` RAISING — a lone surrogate key is the
      executed instance (`S1`), and M7 already refuses that one before the encoder, so the arm the
      test must reach is a `to_json` fault inside a payload M7 ADMITS. Both arms stay passthroughs
      and both stay inside the guard. d37 is DEAD, subsumed by this oracle (handoff.drops).

  - id: d9_passthrough_is_byte_identical_to_no_gate
    kind: parity
    form: test
    binds: ["interacts(toon_gate->model_view).payload"]
    discharged_by: test_every_passthrough_arm_is_byte_identical_with_and_without_the_gate
    source: "O2's oracle, stated once over all five arms — SIX now, with the refused-by-guard arm"
    note: >-
      CHANGED BY THE r3 CORRECTION: O2's parity extends to the NEW PASSTHROUGH BRANCH — a payload
      M7 refuses. The docstring must say that the object is returned identically there too
      (`result is original`), because the refusal arm is the one a reader will assume returns
      something synthesized. `S11` is the executed control at the process level (d57); this demand
      is the byte-level one.
      ANTI-VACUITY CONSTRAINT, converged across all three phase-C readers (silent branch 25): the
      comparison is meaningful only over calls that actually reach `call_tool`. Defender's outermost
      hook may answer a call WITHOUT calling the handler (F3, driver.py:203-213), so a
      budget-refused call is parity-preserving for a reason that has nothing to do with the gate and
      would pass this test over a gate that was never installed. `r26` shows the comparison is real
      and currently green for dict/int/str.
      CHANGED AGAIN BY §7 r3 (f2 = B), WHICH IS THE READING THAT BREAKS THE DEMAND AS WRITTEN. "Byte
      identical with the gate and without it" cannot survive a change that frames every foreign
      result the wrapper returns, so O2's oracle is RE-READ the way the resolution states it: the
      JSON content is unchanged INSIDE THE FRAME. The parity assertion is now over the framed
      content — the bytes between the delimiters equal the no-gate run's bytes on every one of the
      six passthrough arms, refused-by-guard included — and NOT over the delivered string, which
      differs by exactly the 67-byte frame. A test written against the un-re-read sentence fails on
      a correct implementation; one written against the delivered string passes over a gate that
      never framed anything. d0 carries the same re-reading at the return-contract altitude.

  # =========================================================================
  # O3 — fidelity
  # =========================================================================

  - id: d10_roundtrip_runs_only_after_the_byte_gate
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_a_payload_failing_the_byte_gate_is_never_decoded
    source: "M3 — 'evaluated after the byte gate so the decode cost is not paid on the ~85%'"
    note: >-
      CHANGED BY THE r3 CORRECTION AND EXTENDED AGAIN AT §7 r4: the ordering demand grows at BOTH
      ends. The full order is now pre-validate -> dumps -> to_json -> bar -> loads -> to_json(both
      sides) -> compare — f8 reading B adds the second serialization AFTER the bar, so the ordering
      claim "the decode cost is not paid on the payloads that fail the byte gate" now covers the
      re-serialization too. `d10` already pinned the chain, so B extends it rather than reopening
      it. The r3 half: the ordering demand EXTENDS AT THE FRONT, and the observable that carries
      the new step is a spy encoder's CALL COUNT OF 0 for a refused payload — the same instrument
      d48/d49/d50 use, and the only one that distinguishes "refused before the encoder" from
      "encoded and then discarded". Original observable unchanged: one encode, zero decodes,
      counted at the seam, never inferred from source order.

  - id: d11_empty_view_never_reaches_the_model
    kind: domain-outcome
    form: test
    binds: ["tool_result.domain.distinguished[empty-dict]", "tool_result.domain.distinguished[empty-list]",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_payload_whose_toon_form_is_empty_is_not_substituted
    source: "r22 — `toons.dumps({}) == ''`; it clears the bar and round-trips, so M3 cannot see it"
    note: >-
      CHANGED BY THE r3 CORRECTION — a FLIPPED DISPOSITION (`R3`, silent branch 8), and the demand
      must not conflate the two empty shapes, because they are opposites. The empty DICT encodes to
      ZERO BYTES, clears any bar and round-trips, and substituting it is the empty-view case this
      demand exists to forbid. The empty LIST encodes to `'[0]:'` — 4 bytes against 2 — ratio 2.0,
      and it passes through ON THE BAR, not on the empty-view rule. A test that asserts one outcome
      over "an empty payload" pins a false symmetry; the empty list's passthrough is not evidence
      that the empty-view floor works. The one hard floor f6 keeps under every reading.

  # d37_fidelity_is_type_and_order_preserving IS DEAD — SUBSUMED, not dropped. §7 r4 resolved f8
  # on reading B, so M3's oracle IS `to_json(loads(toon)) == to_json(value)` and the three escapes
  # d37 existed to catch are caught by the oracle itself: field reordering (`R7`), an integer
  # >= 2**63 rendered in float notation (`S6`) and a lying `__eq__` (`S10`). d37's binds
  # (`interacts(toon_gate->toon_encoder).response`, `interacts(toon_gate->model_view).payload`) are
  # RE-BOUND BY d8, which binds the identical pair and now drives the serialized comparison — so no
  # obligation is lost with the demand. P4 was the same question at a narrower grain and is
  # `resolved_by: auto` on r4. Death recorded in `handoff.drops`.

  # =========================================================================
  # O4 — no value authors structure
  # =========================================================================

  - id: d12_no_value_authors_row_or_field_structure
    kind: negative
    form: test
    fork: P3
    resolved_reading: B
    resolved_by: auto             # §7 a1 — P3 is settled by probe R7 and already bound at d36; non-material
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_hazard_values_forge_no_row_and_no_field_boundary
    positive_control: d13_hazard_free_payload_substitutes
    source: "O4, r11 — the 15-value hazard corpus driven THROUGH the gate, not through the encoder alone"
    note: >-
      O4 is written over VALUES ("No value inside a payload can author payload structure"), and
      `r11`'s corpus put every hazard in a value. Fork P3 asks whether the guard covers KEYS — in a
      foreign dict-row payload the keys are equally attacker-supplied and in TOON they become the
      header line, the one line that declares how many fields each row has. d36 carries reading B.
      This demand is also what catches a regressing encoder (d14), because M3's round trip is O4's
      POSITIVE CONTROL, not its guard: an encoder that emits a literal newline inside a row can
      round-trip symmetrically while the view the model reads has forged rows (settled #24).

  - id: d13_hazard_free_payload_substitutes
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->model_view).payload"]
    discharged_by: test_the_same_shape_without_hazard_values_substitutes_and_is_readable

  - id: d36_hazard_values_in_a_field_name
    kind: negative
    form: test
    fork: P3
    resolved_reading: B
    resolved_by: auto             # §7 a1
    binds: ["tool_result.domain.distinguished[hazard-in-key]", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_hazard_value_in_a_foreign_dict_rows_field_name_forges_no_field_boundary
    positive_control: d13_hazard_free_payload_substitutes
    resolution: >-
      §7 a1 — AUTO-RESOLVED to the packet's reading (B), and recorded rather than dropped: P3 is
      not a separate decision. Probe `R7` settled the fact (quoting is at parity between key and
      value position) and `d36` already binds the address, so the two readings differ only in how
      wide the same observable is phrased — non-material by §7's own test. The reading taken is B:
      O4 is restated over any attacker-supplied text in the payload, keys included.
    source: "P3 reading B — O4 restated over any attacker-supplied text in the payload, key or value"
    note: >-
      CHANGED BY THE r3 CORRECTION, and its discharge now has a second half nobody had written down.
      `R7` (executed) settles the ENCODE side against the judge's fear: quoting is AT PARITY between
      key and value position — every hazard is quoted identically, LF is escaped in both, and no
      case produced a forged view that still compared equal. So P3-B needs no key sanitiser. But the
      DECODE side is a live fault: a `}` in a key is a perfectly legal `str` that M7 ADMITS, `dumps`
      emits `[2]{"}",z}:` and `loads` raises `PanicException` on the view it just produced (`R7`,
      reproduced at `S5`). PRE-VALIDATION CANNOT COVER IT — the key is valid UTF-8 text — so the
      guard is the only thing that does, and d56 is the arm. This demand's fixture must therefore
      carry hazards in BOTH positions and assert both outcomes: no forged structure, and a
      decoder fault that passes through rather than escaping.

  - id: d14_encoder_version_pin
    kind: coherence
    form: clause
    binds: ["toon_encoder"]
    outcome:
      nl: >-
        The TOON encoder stays pinned to the 0.7 minor, because O4's whole argument is a probed
        property of this encoder and the similarly named py-toon-format 0.1.0 emits a literal
        newline inside a row; d12 is what catches a regressing encoder, so no separate version
        assertion is written.
    rejected:
      - {nl: "a test asserting the installed version string — it certifies a field and would pass over a gate nothing installed"}
    cites: [c4, r11]
    note: >-
      Converged phase-C answer (silent branch 21): the bar is applied live to whatever the installed
      encoder emits, so a permitted encoder change costs a saving rather than correctness. The
      DISTRIBUTION-name half is a §7 one-liner if the human wants it (a second installed package
      could satisfy the `toons` import name) — `d12` is the standing catch.

