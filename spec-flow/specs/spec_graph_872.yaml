  - id: d74_the_encoder_import_is_deferred_and_cannot_take_down_a_build_path
    kind: behavior
    form: test
    resolved_by: auto             # P6's import arm, settled as a FACT — S-5
    binds: ["toon_encoder", "interacts(toon_gate->toon_encoder)"]
    discharged_by: test_a_missing_toons_wheel_refuses_the_gate_without_killing_any_build_path
    source: "silent branch 28 / P6's untaken half, settled post-seam by cN10 and cN11"
    note: >-
      THE OBSERVABLE THIS ARM IMPLIES IS A FACT, NOT A DECISION — which is exactly the question
      `70-resolutions-r2.md` left open. The `toons` import is DEFERRED (function-scope, at the seam),
      never module-scope, and its failure refuses the gate's own work rather than propagating.
      BOTH HALVES ARE NOW DRIVEN, and only the first used to be (`92-reconciliation.md` F8):
      blocking `toons` on the meta path and asserting `build_agent_core` still builds an agent on
      every one of its five build paths drives the DEFERRAL, since a module-scope import would fail
      the child at import time — that is the negative arm, because with the gate at the single
      `Agent(...)` a module-scope `import toons` kills MAIN, the gather subagent, the three review
      lenses, the six learning stages and the judge together. It does NOT drive the refusal: an
      implementation that defers the import and then raises at the first foreign call passed it and
      failed the demand. The child now also makes a foreign call and asserts what the model got —
      text, containing the tool's own wire JSON, with nothing raised. WHAT IS STILL NOT PINNED is the
      CHANNEL of the "actionable message": the note's own word, and no resolution names a sink. The
      tree's two precedents disagree (`openai_compat.py:53` RAISES a RuntimeError, which this arm
      forbids; `sql.py:179` prints to stderr), and this demand's own note already rejects a run-record
      `degraded` field as unpinnable. Relayed rather than guessed — a test that picked a sink would be
      a test deciding a design question, which is the F1 shape. TWO PROBED FACTS SETTLE IT. PACKAGING: `toons` is
      not a core dependency (core is `pyyaml` alone); it ships only in
      `[project.optional-dependencies].runtime`, ALONGSIDE `pydantic-ai-slim`, and
      `defender/runtime/driver.py` — which holds `build_agent_core` and the only production `Agent(` —
      imports pydantic-ai at module scope, so a process that can reach the gate's install site
      NECESSARILY has the extra and "encoder missing at a live seam" is not reachable through a
      supported configuration. PRECEDENT: the tree's only two consumers of that same extra both defer
      and refuse LOUDLY — `runtime/providers/openai_compat.py:53` raises a RuntimeError naming the
      reinstall command, `scripts/gather_tools/sql.py:179` prints to stderr and returns
      EXIT_NO_RUNTIME. Neither degrades silently. TWO READINGS REJECTED. A silent degrade to permanent
      passthrough with no record: the H1 shape, and the tree has no precedent for it. A run-record
      `degraded` field as a REQUIRED observable: it defends a state the packaging already prevents, so
      nothing could drive it in a supported install and the demand would be unfalsifiable — harmless to
      add, but not pinnable. Card 6 recommended "degrade AND record" against a belief that the
      alternative was a hard startup failure; the real alternatives are "kill six build paths" and
      "refuse this feature", and the tree answered that twice already.

