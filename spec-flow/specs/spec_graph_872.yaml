  interacts:

    # --- THE DELTA: the gate's own surfaces -------------------------------------------
    - {from: toon_gate, to: tool_result,   mode: read,   via: api, provenance: design}
      # `call_tool(name, tool_args, ctx, tool)` — the tool's own value in EVERY capability order (r6).
    - {from: toon_gate, to: registered_tools, mode: read, via: api, provenance: design}
      # the blast radius: 14 registrations, on every agent build_agent_core builds (B1). Output-typed
      # tools are excluded BY THE LIBRARY'S composition, not by this gate (B5/F9 -> d42).
    - {from: toon_gate, to: toolset_provenance_label, mode: read, via: api, provenance: design}
      # fork P1 reading B only. Under reading A this edge does not exist and d19 falls.
    - {from: toon_gate, to: toon_encoder,  mode: invoke, via: api, provenance: design}
    - {from: toon_gate, to: wire_ruler,    mode: invoke, via: api, provenance: design}
    - {from: toon_gate, to: toon_gate_max_ratio, mode: read, via: env, provenance: design}
      # `via: env` since §7 r7 (f7 = B): the bar is an integer percent read through the existing
      # `env_int` (DEFENDER_TOON_GATE_MAX_PERCENT), the same house form the two M7 bounds use. Under
      # reading A or C this would have been `api` or a raw `os.environ` read outside `_env.py`.
    - {from: toon_gate, to: toon_gate_max_depth, mode: read, via: env, provenance: design}
    - {from: toon_gate, to: toon_gate_max_nodes, mode: read, via: env, provenance: design}
      # M7's two bounds. `via: env` because both are integers and fit `env_int` — the house form the
      # bar CANNOT use (f7). The read happens before the encoder is invoked, which is the whole of
      # d10's extended ordering.
    - {from: toon_gate, to: untrusted_frame, mode: invoke, via: api, provenance: design}
      # fork f1-B / f2. Under f1-A this edge does not exist and d17a/d17b/d18 fall with it.
    - {from: toon_gate, to: invocation_salt, mode: read, via: api, provenance: design}
    - {from: toon_gate, to: tool_return_part, mode: write, via: api, provenance: design, sends: payload, transport: llm}
      # fork f1 reading C.
    - {from: toon_gate, to: model_view,    mode: write,  via: api, provenance: design, sends: payload, transport: llm}
    # `toon_gate->toon_sidecar` and `toon_gate->gather_raw` ARE GONE, removed at §7 r1 with fork
    # f5 reading A. Both existed for ONE UNDECIDED WRITE — the handoff deviation that flagged them
    # said so, and said "under f5-B neither edge exists". The human took B, so the gate writes
    # nothing to the filesystem at all: it returns, and the record it rides on is the wire log's.
    # Three computed triggers retire with them (R1 on the sidecar's payload, R2 on
    # `toon_sidecar.identity`, R3 on both sidecar access cells), and `gather_raw` leaves this
    # change's delta entirely — its R2 and R3 firings were this edge's, so the "mechanical blind
    # spot" the assembler had to route by hand (R2 computing as answered on `gather_raw.identity`
    # while the key-coverage half stayed suppressed) is moot rather than merely unfixed.
    - {from: toon_gate, to: gate_run_record, mode: write, via: api, provenance: design}
      # fork P6 reading B, RESOLVED AT §7 r1 — and the `via` moved `fs` -> `api` with f5. P6-B
      # needed a sink and f5 supplied it: the gate's counters (examined / refused-by-guard /
      # substituted / bytes saved) ride on the SAME wire-log record that carries the substituted
      # return's `metadata`. No new run-dir root, which is the constraint d38's own reading names.

    # --- THE DELTA: the composition-root seam (O7/M6) ---------------------------------
    - {from: run_investigation, to: toolset_seam, mode: read,  via: api, provenance: design}
    - {from: replay_harness,    to: toolset_seam, mode: write, via: api, provenance: design}
      # the harness SUPPLIES it — the eighth entry in a `seams` dict that already threads seven (B16).

    # --- the model-visible text's other authors ---------------------------------------
    - {from: query_capture,      to: model_view, mode: write, via: api, provenance: code, sends: payload, transport: llm}
      # QueryCapture renders and salt-wraps `query`'s payload and DISCARDS call_tool's return (r5/r6/B12).
