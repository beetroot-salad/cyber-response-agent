# this file's own judgment: where an entry says `auto`, either the packet's own triage called the
# fork non-material and the reading taken is recorded (P3, P4, re-grounding fork 4 — the three
# auto-resolutions), or the entry is a SILENT BRANCH whose disposition follows from the fork it was
