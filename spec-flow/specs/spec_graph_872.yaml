    # landed inside `gather_raw`, 11 of 40 fixtures overflowed it and the truncated head did not
    # parse as JSON, and the read allowlist is a filename SHAPE, so off-shape it was unreadable by
    # every agent and on-shape it was indistinguishable from a query payload.

    - id: registered_tools
      provenance: code
      facets:
