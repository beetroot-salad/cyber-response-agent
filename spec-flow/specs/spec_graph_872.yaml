  # ===================== minted by the post-seam residue leaf (75-residue-settled.md) =====================
  # Seven demands from ten executed probes. These settle the residue items §7 left OPEN — they do not
  # re-decide anything §7 decided. Where a settled item follows MECHANICALLY from a decision already
  # taken (f2=B, f1=C, f5=B), the entry says so and is labelled a consequence, not a resolution.

  - id: d70_a_non_finite_float_is_not_a_divergence_the_gate_introduces
    kind: parity
    form: test
    resolved_by: auto             # settled by probe, not by judgment — S-1/S-2/S-3
    binds: ["tool_result.domain.distinguished[nan]", "tool_result.domain.distinguished[inf]",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_nan_or_infinite_float_reaches_the_model_identically_with_and_without_the_gate
    source: "`60-residue.md` items 1 and 2 / silent branch 14, settled post-seam by cN1, cN2, cN4, cN6"
    note: >-
      THIS ITEM DISSOLVED RATHER THAN RESOLVING, and the reason is d71. A payload carrying NaN or
      ±infinity reaches the model with the SAME information gated and un-gated, because the loss is
      pydantic-ai's, not the gate's: `tool_return_ta.dump_json` — the serializer
      `ToolReturnPart.model_response_str` actually uses — renders every non-finite float as `null`
      BEFORE any gate exists, and `toons` nulls it identically. Un-gated text for a NaN payload is
      `{x: null}`; the TOON view is `x: null`. The test is PARAMETERIZED over nan/+inf/-inf in scalar
      and row position and asserts the PARITY as DECODED-CONTENT identity, which holds on either arm
      and is what "the same information" means at this seam.
      THE ARM IS NOW ASSERTED, AND THAT IS A §7 CORRECTION (`92-reconciliation.md` F2). The earlier
      reading of this demand forbade asserting an arm because the arm was contingent on a serializer
      the design misidentifies — and the test then asserted the PASSTHROUGH arm anyway, which is the
      arm the un-corrected serializer produces, so d70 pinned the one thing it was minted not to pin.
      §7 removed the contingency by spelling M3's oracle with the same wire tool-return serializer
      d71 pins for the other two `to_json` sites: both sides of the round trip render `null`, the
      comparison is EQUAL, and M3 does not veto. What decides the arm is then the delivered-bytes bar
      (d3), and it SPLITS these payloads — the 40-row forms are 59.9% delivered and SUBSTITUTE, the
      scalar forms are 7 B of view against 10 B of JSON but 74 against 77 once the frame is counted
      on both sides (96.1%) and PASS THROUGH ON THE BAR. The test re-derives both by measurement and
      asserts that at least one substitution happened, so a gate taking the other ruler on either
      fails. TWO READINGS REJECTED. A non-finite refusal predicate in M7's walk: available in the walk
      that already runs (S-1 part D) but it would defend O2 against a divergence that does not exist
      once the serializer is right. Asserting the passthrough arm UNIVERSALLY, which the pre-f8
      reading implied: green only against the wrong serializer for the row forms.
      `70-resolutions-r2.md` called the NaN half "worse than it was" after f8=B removed the
      arithmetic reason for the JSON arm; probed, the ground moved further still. The committed
      corpus contains ZERO floats of any kind (cN6), so neither hazard is exercised by it.

  - id: d71_the_wire_ruler_and_the_stringify_step_use_the_tool_return_serializer
    kind: behavior
    form: test
    resolved_by: auto             # a design misidentification found by probe — S-2
    binds: ["interacts(toon_gate->wire_ruler)", "interacts(toon_gate->model_view).payload",
            "interacts(toon_gate->tool_result).response", "wire_ruler"]
    discharged_by: test_the_byte_gate_and_the_stringify_step_measure_the_bytes_the_model_receives
    source: "REFUTES design-872-r3.md M2's `wire_json` identity — cN2, cN3, executed over 22 value classes"
    note: >-
      THREE SITES, ALL THREE NAMED. The design spells `to_json` at three places and this demand
      rules ALL of them the same way: the byte gate's denominator, f2=B's stringify step, and M3's
      ROUND-TRIP ORACLE must each be the TOOL-RETURN serializer (`tool_return_ta.dump_json`, what
      `ToolReturnPart.model_response_str` calls), NOT `pydantic_core.to_json`. THE THIRD WAS ADDED AT
      §7 (`92-reconciliation.md` F2): this demand originally corrected two sites and said nothing
      about the oracle, and its own title scoped it that way, while its rationale ("the serialization
      the model is actually charged for"; "the ruler and the thing it rules agree with each other
      while both differ from the wire") reads as general. Leaving one site unruled decided an arm by
      accident — d70's eight assertions flip on it — so the ruling is now explicit and the test
      drives the oracle site with a payload the two serializers disagree on and the byte gate admits
      (a 40-row non-finite form at 59.9% delivered: EQUAL under the wire serializer, so substitute;
      unequal under `pydantic_core.to_json`, so passthrough). THE LARGEST SINGLE CORRECTION THIS LEAF
      FOUND, and it is upstream of three other demands. M2 asserts the two are "byte for byte" the same; they are not, in 7 of
      22 probed value classes, by three independent mechanisms — non-finite floats (`NaN`/`Infinity`
      constants vs `null`), `bytes` values (utf-8 text vs BASE64: `{"x":"ab"}` against `{"x":"YWI="}`),
      and the empty list (`[]`, 2 B, against the EMPTY STRING, 0 B). The test drives one payload from
      each mechanism and asserts the gate's ruler equals the bytes the model receives. WHY IT MATTERS
      MORE THAN ITS SIZE: O2 is a BYTE-IDENTITY obligation and the design measures the bytes with the
      wrong instrument, so the error is invisible to every oracle written against `to_json` — the ruler
      and the thing it rules would agree with each other and both differ from the wire. It also decides
      d70's arm, and d0's passthrough demand must be read against it. TWO READINGS REJECTED. Keeping
      `to_json` and accepting the drift: it breaks O2 on the PASSTHROUGH arm, which is where O2 is
      strongest, since under f2=B every exit is stringified — a bytes-valued payload would reach the
      model as text where the un-gated run sent base64. `to_json(..., inf_nan_mode='null')`: repairs one
      of the three mechanisms and leaves the bytes and empty-list divergences standing. NOT A FORK — the
      design states an identity, the identity is false, and the true serializer is named in
      pydantic-ai's own source.

  - id: d72_a_pre_wrapped_toolreturn_is_unwrapped_framed_and_its_metadata_preserved
    kind: domain-outcome
    form: test
    resolved_by: auto             # forced by f2=B + f1=C + f5=B; the fault menu is executed — S-4b/S-7a
    binds: ["tool_result.domain.distinguished[toolreturn]",
            "interacts(toon_gate->tool_return_part).payload"]
    discharged_by: test_a_tool_body_that_returns_its_own_toolreturn_is_unwrapped_framed_and_loses_nothing
    source: "`60-residue.md` item 3 / silent branch 12, settled post-seam by cN7, cN8, cN9, cN14 and H16"
    note: >-
      A CONSEQUENCE, NOT A RESOLUTION. When a foreign tool body itself returns
      `ToolReturn(return_value=..., metadata=...)`, the gate unwraps it, gates and frames
      `return_value` like any other foreign result, and returns a `ToolReturn` whose metadata carries
      BOTH the body's own metadata and the gate's original JSON under a RESERVED key. FOUR WRONG
      IMPLEMENTATIONS, EACH EXECUTED, EACH A NEGATIVE ARM. (A) Passing the ToolReturn through returns a
      foreign result UNFRAMED, which f2=B forbids — this is the "opt-out" the residue named. (B)
      Nesting it as `return_value` serializes the dataclass to the model, leaking the body's PRIVATE
      metadata into model-visible text as `{"return_value":...,"metadata":{...},"kind":"tool-return"}`;
      `metadata` is documented as not sent to the LLM, and the naive f1=C without a type check inverts
      that. (C) Re-wrapping while dropping the inner metadata destroys application data the gate did not
      author. (E) Mutating `return_value` in place keeps the body's metadata but LOSES the gate's
      `{"json": original}`, so O5 is silently unmet. The reserved-key half is its own arm: a body whose
      metadata already carries the gate's key collides, and BOTH merge orders lose data (cN9), so the
      test pins the key as a SHAPE, not a string. HOW THE READING WAS FORCED rather than chosen: the
      residue read this as an open opt-out because R4 established only that `call_tool` receives the
      ToolReturn OBJECT. It still does — re-confirmed on a REAL `WrapperToolset` after R4's duck-typed
      stand-in proved to measure nothing (cN14) — but the decisions already taken eliminate every
      reading but one. N13/d69 accepts metadata loss caused by an OUTER hook; it does not license the
      gate to cause it.

