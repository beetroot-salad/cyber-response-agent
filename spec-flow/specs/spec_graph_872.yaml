#
# THE COUNT LEAVING §7. EIGHTEEN forks: the four that came in open, the seven promoted in phase C,
# the three the re-grounding leaf raised, the three the r3 correction raised — seventeen relayed as
# cards — plus CARD 18, raised by the pre-seam leaf after the packet was written and decided with
# P-obs. 15 resolved by the human across ten decisions, 3 auto, 0 open. Beside them: 31 silent
