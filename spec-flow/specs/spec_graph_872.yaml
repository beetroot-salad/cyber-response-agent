     note: "TWO DEMANDS REST ON THIS. d56: the decode side is covered by a BaseException guard ALONE — pre-validation cannot help, the keys involved are legal UTF-8 strs that M7 admits by design. d55: the arm is DURABLE, not one-shot, so a test may reuse one encoder across cases."}

