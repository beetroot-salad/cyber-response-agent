    - "re-ground fork 4 — P6 GAINS A SECOND REASON AND A DEFINED OBSERVABLE. R11's segfault and R3's panic made P6's 'a dead gate is indistinguishable from an idle one' sharper than the judge could state it: before M7 a gate could die by KILLING THE RUN, which is at least loud. M7 turns those into SILENT passthroughs, which are not. Once the guard exists, 'examined N, refused-by-guard M, substituted K, bytes saved B' is the observable P6-B asks for and the guard supplies for free — d38's fourth category. Recommendation: P6-B with the refusal count as its fourth field. No new decision if the fault arm lands on pre-validation, which it now has — recorded so the two are not chosen apart. RESOLVED — §7 a3, AUTO. Not a separate decision: it is P6 with one extra field, and r1 decided P6 on reading B. The reading taken is the one this entry recommends — P6-B with the guard's refusal count as its fourth observable — and d38 already carried the fourth category as real whichever way P6 went. Recorded rather than dropped so a later reader can see a choice was made here. resolved_by: auto"

    # ---- raised by the r3 CORRECTION (55-corrections-r3.md) — three, all new --------------------
    - "f7 — THE BAR'S KNOB FORM. `_env.py` carries `env_int`, `env_bool`, `env_str` and NO `env_float`, and the tree's one float-valued knob (bash_exec.py:278, DEFENDER_BOX_TIMEOUT) reads `os.environ` raw and bypasses `_env.py` entirely (B8/F13, re-executed). A add `env_float` — a new house primitive in a shared module for one consumer. B express the bar as an integer percent through the existing `env_int` (DEFENDER_TOON_GATE_MAX_PERCENT=85) — no new primitive, but the knob's unit stops matching the design's ratio, and `toon_gate_max_ratio.domain.type` moves from float to int with `distinguished`/`alternatives` re-spelled. C raw `float(os.environ.get(...))` following bash_exec's precedent — no new primitive and no centralized default or test_env.py coverage either. NO RECOMMENDATION, deliberately: this is a house-convention choice and inventing a primitive is what the charge forbids. The depth cap and the node budget are integers and need no such decision whichever way this goes. RESOLVED — §7 r7, READING B: the bar is an INTEGER PERCENT through the existing `env_int` (DEFENDER_TOON_GATE_MAX_PERCENT=85). No new house primitive in a shared module for one consumer. THE COST IS PAID IN THE GRAPH AND WAS PAID BEFORE d58'S BINDS WERE WRITTEN: `toon_gate_max_ratio.domain.type` moved float -> int, `distinguished[0.85]` -> `distinguished[85]`, `alternatives[0.90]` -> `alternatives[90]`, and the gate's R4 obligation entries re-spell with them. The depth cap and node budget were always integers and f7 never reached them. resolved_by: human"
    - "f8 — M3's ORACLE, AND IT CHANGES WHAT O3 IS. Under Python `==` the obligation is REFUTED for two probed classes: a lying `__eq__` substitutes a view that lost its data (S10) and an int >= 2**63 renders wrong digits (S6), both with M3 green. A keep `==` and record both as known limits — the reachability is a foreign toolset returning OBJECTS rather than JSON data, which an MCP server cannot do and an in-process FunctionToolset can. B compare the two sides SERIALIZED (`to_json(loads(toon)) == to_json(value)`), which catches all three probed escapes including field reordering and costs nothing measured — 40 of 40 fixtures still substitute (S12) — and SUBSUMES d37. C keep `==` and add a post-decode type predicate. Recommendation: B, because it is the only reading with an executed cost measurement; relayed as the human's because it changes what O3's oracle IS and because A is defensible on reachability grounds. IF A IS TAKEN, handoff.deviations already carries the cost. RESOLVED — §7 r4, READING B: compare SERIALIZED, `to_json(loads(toon)) == to_json(value)`. Catches all three probed escapes — the lying `__eq__` (S10), the integer >= 2**63 rendered in float notation (S6) and field reordering (R7) — at zero measured corpus cost (S12: 40 of 40 fixtures still substitute). SUBSUMES d37, which is dead (handoff.drops), and the comparison gains its own fault arm (`to_json` raises on a surrogate key), folded into d8. THIS DECISION ALSO DECIDES P4, which is the same question at a narrower grain. resolved_by: human"
    - "f9 — THE CAP AND BUDGET VALUES. M7 needs a depth cap and a node budget and the probes bound them only FROM BOTH SIDES: the real corpus needs depth 3 and 517 nodes (S9); the encoder dies at depth 900 on a 512 KB thread stack and at 12 000 on 8 MB (S4), and at 2**24 nodes of expansion (S7). `threading.stack_size()` reports 0 in this runtime, so the headroom is not introspectable. Any cap in between is defensible and THE SUITE MUST NOT PIN ONE — d51 and d52 parameterize both, exactly as d58 parameterizes the bar. RECORDED RATHER THAN RECOMMENDED: the values are an operator judgment about how deep a legitimate foreign payload may be, and nothing in the evidence answers it. `toon_gate_max_depth.domain.default` and `toon_gate_max_nodes.domain.default` are `unknown` in the structure above and this fork is where they are decided. RESOLVED — §7 r6: DEPTH 64, NODE BUDGET 100 000. Roughly 20x and 200x the real corpus's needs (depth 3, 517 nodes) and well under the crash floors (segfault at depth 900 on a 512 KB stack; process death at 2**24 nodes of expansion). NO TEST PINS THE NUMBER — d51 and d52 stay parameterized on the configured value and assert no constant. This closes hole H4: both boundaries' `domain.default` were `unknown` and could not close until it was answered. resolved_by: human"

