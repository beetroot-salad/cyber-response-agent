  - id: d15b_both_encodings_in_the_wire_log
    kind: behavior
    form: test
    fork: f5
    resolved_reading: B
    resolved_by: human            # §7 r1 — the carriage bundle
    binds: ["interacts(request_logger->wire_log)", "interacts(request_logger->tool_return_part)",
            "interacts(toon_gate->model_view).payload",
            "DEFENDER_LLM_LOG_MAX_CHARS.domain.distinguished[0]"]
    discharged_by: test_both_encodings_are_recoverable_from_the_wire_log_joined_by_agent_seq_and_tool_call_id
    resolution: >-
      §7 r1 — READING B, TAKEN WITH f1=C. No new sink: the original JSON is recovered from the
      wire-log record, joined `(agent_id, seq, tool_call_id)`, and the six learning stages' separate
      trace family (`learning_wire_log`) is named in the demand. §7 r8 SPLIT THE ORACLES around it:
      attributability (O5) is read off the wire log alone, while the ENCODING obligations
      (O1/O2/O3/O8) are read off the dispatched request messages — d39 carries that half. The wire
      log is a file no agent can read and the tree's only reader of it drops `metadata`, which is
      why r8 also minted d63.
    note: >-
      Reading B, and it works only because f1 landed on C. THREE CORRECTIONS PHASE C MADE TO THIS
      DEMAND. (1) "The wire log" is not one thing: within one investigation MAIN, the gather subagent
      and all three review lenses share ONE `RequestLogger` and therefore one
      `wire_logs/llm_requests.jsonl` (driver.py:940, :417, :434; review_roles.py:279), separated only
      by an `agent_id` FIELD and a per-agent sequence — so the join key is `(agent_id, seq,
      tool_call_id)`, not `tool_call_id` alone, and whether `tool_call_id` is unique across those
      agents and across a model-issued retry is UNPROBED (probe R5). (2) The six learning stages
      write a DIFFERENT family (`learning_wire_log`), so a learning-stage substitution is silently
      unattributable unless the demand names it. (3) The log pins `ensure_ascii=True` (observe.py:30),
      so the assertion is RECOVERABLE-AFTER-DECODE, never byte-identical — pin the decode step or the
      demand pins a falsehood. All three readers converged that under B, O5 holds ONLY at the default
      trim (`DEFENDER_LLM_LOG_MAX_CHARS=0`), which is why that member is bound here.

  - id: d16_recovered_json_equals_the_tools_own_return
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->tool_result).response", "interacts(toon_gate->tool_return_part).payload"]
    discharged_by: test_the_recovered_json_equals_the_value_the_tool_returned
    note: >-
      Holds under both f5 readings. Drive a substitution and compare against the tool's OWN RETURN
      OBJECT, not against a re-encode of the view — which is also what `tool_return_part`'s
      `roles-disjoint-sources` invariant says formally: if the metadata carried a re-encode of the
      view rather than the tool's own object, O5 is vacuous.

  # =========================================================================
  # O6 — the untrusted frame (fork f2, unresolved)
  # =========================================================================

  - id: d17a_substituted_view_is_framed
    kind: behavior
    form: test
    fork: f2
    reading: A
    resolved_by: human            # §7 r3 — f2 = B, which SUPERSETS this demand rather than dropping it
    binds: ["interacts(toon_gate->untrusted_frame)", "interacts(toon_gate->model_view).payload", "invocation_salt"]
    discharged_by: test_the_substituted_view_the_model_sees_is_inside_an_untrusted_frame
    resolution: >-
      LIVE. §7 r3 took f2 = B, and B is a superset of A rather than its alternative: "every foreign
      result the wrapper returns is framed" includes the substituted ones. This demand survives as
      B's substitute-branch instance — it is the one that pins WHICH frame (the invocation's
      standing salt, shared with every other untrusted span in the run), where d17b pins the
      cross-branch parity. Reading A's own cost — an attacker padding to either side of the bar to
      choose whether their output is framed — is what B removes.
    note: >-
      Reading A: the frame is scoped to the substitute branch, and O6 is then unmet for the ~85% that
      pass through — an attacker who controls a foreign payload's bytes controls whether their own
      output is framed, by padding to either side of the bar. Two converged phase-C answers that need
      no human input once f2 lands: the frame uses the INVOCATION's standing salt (O6's own word is
      "invocation-scoped"), and every framed span in one run therefore shares one frame identity.
      Note the altitude: the observable is that a substituted view and another untrusted span in the
      same run carry the SAME DELIMITER — not that the code read `ctx.deps.salt`.

      SUPERSEDED, POST-SEAM, BY #875 (see d67's own amendment for the full account): the run's one
      standing salt is retired — `_untrusted.wrap_fresh` mints a fresh salt per frame, after its
      content is known. What survives of this demand is the SHAPE obligation (a substituted view
      reaches the model inside one well-formed, singular `<run-{salt}-untrusted>` span); the "shares
      one frame identity with every other untrusted span" half is exactly the vulnerability #875
      closes and is no longer a property this gate should have. `d17b`'s cross-branch parity (every
      exit is framed, whichever branch it takes) is unaffected by this correction.

  - id: d17b_every_foreign_result_is_framed
    kind: parity
    form: test
    fork: f2
    reading: B
    resolved_reading: B
    resolved_by: human            # §7 r3
    binds: ["interacts(toon_gate->model_view).payload", "interacts(toon_gate->untrusted_frame)"]
    discharged_by: test_every_foreign_result_substituted_or_not_is_framed
    resolution: >-
      §7 r3 — MINTED LIVE, ON READING B, SCOPED TO THE WRAPPER'S OWN RETURN VALUES. Three things
      ride on that scoping and each is now written down rather than assumed: the stringify step B
      needs is d61; the text O6 does NOT reach — refusals, raises, native returns and output-typed
      tools — is an examined no at d62; and M7's refused-by-guard third branch, which did not exist
      when f2 was posed, is IN SCOPE, so a refused payload is framed like every other passthrough
      and d9 extends to it. Two demands changed with it: `d0`'s `result is original` is VOID and
      O2's byte-identity is re-read as "the JSON content is unchanged inside the frame".
    note: >-
      Reading B. Needs a stringify step no sentence in the design supplies (`wrap` raises TypeError
      on a dict, an int and None — r12), COLLIDES WITH d0 AND d9 BY CONSTRUCTION (the passthrough
      branch can no longer return `result is original`, and O2's byte-identity must be re-read as
      "the JSON content is unchanged inside the frame"), and makes d3 live for EVERY foreign result.
      PHASE C SHARPENED WHAT B MEANS: a budget refusal and a raising tool are not results the wrapper
      ever sees — the outermost hook may answer without calling the handler (F3) and a
      ModelRetry/ValidationError out of the hook chain becomes ToolRetryError (B5) — so B, if picked,
      must be SCOPED EXPLICITLY to values the wrapper returns, and O6's "universal over foreign
      output" stays unmet for refusals, raises, native returns (N7/d34) and output-typed tools
      (F9/d42). Picking B on universality grounds without that scoping buys a universal the mechanism
      cannot deliver.

  - id: d18_exactly_one_frame_and_no_early_close
    kind: negative
    form: test
    binds: ["interacts(toon_gate->untrusted_frame)", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_result_is_framed_exactly_once_and_a_value_cannot_close_the_frame
    positive_control: d13_hazard_free_payload_substitutes
    source: "r25 — `wrap` escapes nothing: framing a framed string nests, and a value carrying the closing delimiter survives verbatim"
    note: >-
      ITS BOUND, RECORDED RATHER THAN WIDENED (the R3-card re-run, `97-r3-probe.md`). This demand drives the
      double frame WITHIN A SINGLE CALL: one run, one install, one `call_tool`, and the delivered
      text carries exactly one delimiter pair. Two questions about a SECOND frame sit outside that,
      and the probe answers them differently. (1) REPLAY / RETRY RE-ENTRY — SETTLED, and the
      demand needs nothing: on a real `WrapperToolset` the gate's `call_tool` is handed the tool
      body's own raw return in every re-entry vector and an already-framed `str` in none, so the
      framed view is never re-admitted (silent branches 5 and 26, closed on execution). A retried
      call IS a fresh `call_tool` invocation, but on fresh raw bytes, which is `d45`'s territory
      and not a double frame. (2) A DOUBLE INSTALL — REACHABLE, and this demand does NOT reach it:
      pydantic-ai merges run-level `capabilities=` additively and de-duplicates only two library
      capability types, so the same gate capability installed twice nests, the outer sees the
      inner's framed `str`, and the model gets two frames (measured, `cR1`). THAT SECOND BOUND IS
      NOW SOMEONE ELSE'S DEMAND RATHER THAN AN OPEN QUESTION: relay card R5 was resolved by the
      human — demand idempotence, driven through `extra_capabilities` — and `d80` asserts it. This
      demand is unchanged and still drives one call in one run with one install; what changed is
      that the route it cannot see is covered instead of recorded.

  - id: d19_foreignness_keys_on_the_toolset_not_a_name_list
    kind: behavior
    form: test
    fork: P1
    binds: ["interacts(toon_gate->tool_result).response", "interacts(toon_gate->model_view).payload",
            "interacts(toon_gate->toolset_provenance_label)"]
    discharged_by: test_an_owned_agent_tool_result_is_untouched_while_a_foreign_one_is_gated
    readings:
      A: "PROVENANCE-BLIND — the gate runs over every dict/list return, owned or foreign; `foreign` is the scope of the OBLIGATION, not of the mechanism. This demand FALLS and d22 carries the weight alone. Cost: an owned tool that ever returns a dict has its model-visible text silently changed, which is exactly what O2 forbids — and 13 of the 14 registered tools are annotated `-> str` with nothing enforcing it (B1), so every owned tool becomes a substitution site the moment its body drifts."
      B: "PROVENANCE-GATED — the gate reads `ToolsetTool.toolset` / `tool_def.metadata` (r7, executed) and substitutes only for results it marks foreign. Costs a demand for what the label IS, who may set it, and what an UNLABELLED toolset defaults to; a foreign source installed with an owned label is treated as owned and, under f2, never framed. No defence against that is described anywhere."
    resolved_reading: B
    resolved_by: human            # §7 r2
    resolution: >-
      §7 r2 — READING B, PROVENANCE-GATED, with the default "FOREIGN UNLESS INSTALLED BY DEFENDER'S
      OWN COMPOSITION ROOT". The gate reads the label and substitutes only for results it marks
      foreign, which is what keeps O2 true for the 13 of 14 owned tools annotated `-> str` with
      nothing enforcing it. Two things B costs and the human took: the label itself owes a demand
      for what it is, who may set it and what an unlabelled toolset defaults to — that is d59 — and
      the mislabel hazard (a foreign source installed with an OWNED label is treated as owned and,
      under f2-B, never framed) is an ACCEPTED LIMITATION, recorded the way N7 records native
      returns, at d60.
    source: "M1 bullet 3 / r7"
    note: >-
      THE SAME NAME IS THE DISCRIMINATOR AND ONE RUN CANNOT CARRY IT — a library constraint, found
      by execution, not an omission (`92-reconciliation.md` F4). The demand's own sentence, and the
      accepted P1 text's rider, asked for an owned `@agent.tool` and a foreign toolset's tool OF THE
      SAME NAME in ONE run, because a name list would pass a same-named foreign tool. pydantic-ai
      refuses that registration outright — `UserError: FunctionToolset defines a tool whose name
      conflicts with existing tool from the agent: 'fetch_rows'` (executed against 1.107.0) — so two
      tools of one name never coexist on one agent, and the rider as written is undrivable. The test
      used to register `fetch_rows` foreign and `own_rows` owned, which a name-list implementation
      passes, and the escape was closed only by COMPOSITION with a sibling test in the same module:
      weaker than the demand and invisible to a reader of either. THE FORM IT TAKES NOW: one tool
      NAME, one payload, TWO RUNS, opposite verdicts — any implementation that is a function of the
      name gives the same answer twice and fails whichever answer it gives, and only a reader of the
      toolset's own label gives two. The one-run arm is kept as well, at the two names the library
      permits, because it is the only place both verdicts are read out of a SINGLE dispatched
      history: a gate that got provenance right per-build and wrong per-call passes the two-run arm.
      The library constraint is recorded in `handoff.deviations`.

