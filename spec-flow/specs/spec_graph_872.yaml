  - id: d77_the_render_footers_absolute_path_is_an_accepted_limitation
    kind: negative
    form: waiver
    resolved_by: human            # post-seam relay card R1 — the human took reading A
    binds: ["interacts(payload_view_render->model_view).payload"]
    outcome:
      nl: >-
        `payload_view.render`'s `_footer` computes `run_dir / payload_rel` and inlines that
        ABSOLUTE on-disk path into model-visible text, at two sites inside the function, on
        every path all three production importers reach. The limitation is accepted and
        recorded rather than repaired: the chooser is the RUN DIR'S OWN LAYOUT — the operator —
        not the foreign payload, so nothing an attacker-influenced payload contains reaches the
        footer and this is not an injection vector. What it discloses is local filesystem
        layout to the model, unconditionally, and it is pre-existing and unchanged by this
        delta. #872 hooks `call_tool`; N3 and `d28` deliberately leave `render` unhooked, and
        `d28` is the demand that pins the gate does not reach it.
    rejected:
      - {nl: "declaring it out of scope with no record — R6's trust walk would then have found an unsanitized slot reaching a rendered sink and routed it nowhere, which is the shape of a walk not having run"}
      - {nl: "repairing the footer inside #872 — the change does not own that seam, and a repair here would be scope no resolution granted"}
    cites: [c6, B11]
    note: >-
      TWO LEAVES LEFT THIS A *CANDIDATE* AND NEITHER DECLINED IT — `60-residue.md` asked for a
      waiver or an explicit out-of-scope and got neither at §7; `75-residue-settled.md` relayed
      it unsettled because no probe can supply a scope judgment. The human has now taken it, so
      this entry is where the difference between "accepted" and "left open" is recorded. What a
      probe DID settle and this waiver rests on: the chooser is the operator, so materiality is
      low-to-moderate and bounded — not zero, because `_footer`'s text is model-visible by
      construction and the disclosure is unconditional.

  - id: d78_the_gate_declares_its_encoder_and_toolset_seams_at_the_composition_root
    kind: seam
    form: test
    resolved_by: auto             # the author charge's standing rule, applied at assembly
    binds: ["interacts(toon_gate->toon_encoder)", "interacts(run_investigation->toolset_seam)",
            "drives(toon_gate_capability->toon_gate)"]
    discharged_by: test_the_gate_declares_its_encoder_and_toolset_seams_at_the_composition_root
    source: "phases/author.md — 'If the design gives a dependency no seam, the seam is part of the contract — pin it as a demand'"
    note: >-
      TWO SEAMS, ONE DEMAND, AND NEITHER IS A TEST CONVENIENCE. (1) THE TOOLSET SEAM is O7/M6's
      own, already carried by `d20`/`d21`/`d44`; this entry is what states that the harness's
      `seams` dict threads it as its EIGHTH entry, which is the second of the two threading
      sites `d20`'s note names. (2) THE ENCODER SEAM is new here. O9(b)'s oracle is stated as
      "for a payload the validator refuses, the encoder is NEVER CALLED — observable on a spy
      encoder's call count, not inferred from the return value", and a refusal and a fault are
      indistinguishable from outside the gate, which is exactly how r2's arm shipped
      unimplementable. The project profile forbids `monkeypatch.setattr`, so a constructor
      argument on the capability plus a `toon_encoder=` seam on `build_agent_core` is the only
      route the house allows. It is ALSO the segfault containment the suite could not be
      written without: `toons.dumps` SIGSEGVs on a self-referential container and on a deep
      acyclic one, so every refusal test hands the gate a sealed encoder and the real Rust
      encoder stays unreachable from the assertion even when the implementation under test
      walks the value wrongly. Discharged by `d20`'s test, which drives the toolset seam end to
      end; the encoder seam is discharged by construction across `d48`-`d52`, `d55`, `d64` and
      `d10`, every one of which reads a call count through it. NOT MINTED: an
      `install_toon_gate=False` build flag. §7 r5 installed the gate unconditionally, so a
      production off-switch would be a fail-open knob a test asked for — the no-gate arm of
      every byte-level parity demand is `ToolReturnPart.model_response_str()` computed from the
      real serializer, and the process-level arm is `S11`'s own bare `Agent(capabilities=[])`.

  # ===================== minted at PHASE F, by the cold reconciler's reading =====================
  # One demand. Not a new judgment and not a new scope: a hazard this run EXAMINED and recorded,
  # given the element its three siblings already have. `92-reconciliation.md` F10.

  - id: d79_widening_the_type_admission_past_dict_and_list_is_a_forward_constraint
    kind: negative
    form: clause
    resolved_by: auto             # the run's own convention, applied evenly — the hazard was already examined
    binds: ["tool_result.domain.distinguished[tuple]", "interacts(toon_gate->toon_encoder).response"]
    outcome:
      nl: >-
        The type admission admits EXACTLY `dict` and `list` at the top level, and widening it —
        to `Sequence`, to `Mapping`, or to any protocol the encoder does not ENTER — is out of
        scope for this change and is a forward constraint on the next one. Measured (`R3`,
        `S2`): `toons.dumps` of a container it does not enter returns the literal string
        `'null'`, four bytes, which CLEARS the bar against any non-trivial JSON baseline. The
        only thing between that and TOTAL DATA LOSS reaching the model is M3's round trip — a
        single check, on a payload whose entire content has already been discarded. A widening
        that landed with M3 intact would be silent; one that landed with M3 relaxed for any
        reason would be catastrophic and invisible.
    cites: [R3, S2]
    note: >-
      THE RUN'S OWN CONVENTION, APPLIED EVENLY — not a new finding (`92-reconciliation.md` F10).
      Three sibling forward constraints of exactly this shape are clause demands with binds and
      citations: N7 -> `d34` (native returns), `d42` (output-typed tool returns) and `d46` (the
      pydantic-ai minor). This one lived as a rider sentence inside a `handoff.forks` list entry
      (silent branch 29), the least-read slot in the artifact, and `d4`'s note — where the type
      admission actually lives — did not carry it. The hazard was examined and the examination had
      no element; this is the element. Nothing about the DECIDED behaviour changes: `d4` and `d50`
      already pin that a tuple is passed through un-entered, and `d50` binds the same member as the
      false-positive half of its parity demand. What this adds is the recorded NO, which is a
      different artifact from either — `d50` could be satisfied by a gate that later widened the
      admission and still declined to refuse a hazard inside a tuple.

  # ============== minted at PHASE F, by the human's resolution of relay card R5 ==================
  # One demand. The R3-card re-run (`.spec-flow/frontiers/97-r3-probe.md` §6) priced a double frame
  # and relayed the design question it could not decide; the human decided it. This is the decision,
  # given the element every other decision in this file has.

  - id: d80_one_frame_however_many_times_the_gate_is_installed
    kind: negative
    form: test
    resolved_by: human            # relay card R5, resolved after `97-r3-probe.md` reported it
    binds: ["interacts(toon_gate->untrusted_frame)", "interacts(toon_gate->model_view).payload",
            "drives(toon_gate_capability->toon_gate)"]
    discharged_by: test_a_foreign_result_is_framed_once_however_many_times_the_gate_is_installed
    positive_control: d13_hazard_free_payload_substitutes
    cites: [cR1, cR2, cR3]
    source: >-
      relay card R5 (`.spec-flow/frontiers/97-r3-probe.md` §6), resolved by the human: DEMAND
      IDEMPOTENCE, DRIVEN THROUGH `extra_capabilities`. The card asked whether the gate must
      detect its own frame or whether single installation is an assumption the composition root
      silently carries; the answer is the former, stated over the model-visible text.
    resolution: >-
      The gate is IDEMPOTENT AT THE FRAME: a foreign result reaches the model carrying exactly one
      frame however many times the gate capability is installed, and under two installs it reaches
      the model as the same bytes one install delivers. HOW that is achieved is not decided here
      and the demand does not reach it — a gate that recognises an already-framed `str` and returns
      it unchanged, and a composition root that collapses a duplicate install, both satisfy it.
      The obligation is over the delivered text because that is where the cost lands: `d18`'s own
      hazard is that a later reader parses two spans where one was meant, and a nested frame is
      also two encoder passes over one payload.
    note: >-
      THE ROUTE IS THE POINT, AND IT IS A PRODUCTION SEAM RATHER THAN A TEST RIG.
      `build_agent_core(extra_capabilities=...)` appends straight into the list the gate is
      installed from (`driver.py:295-299`) and has four production call sites (`driver.py:436`,
      `:646`, `:669`, `lead_zero.py:797`), so the composition that produces a double frame is one
      caller away and — until this demand — invisible to every test in the suite: `d18` drives one
      call in one run with one install, and `d45` speaks only about the BAR being non-idempotent
      across retries, which is a different property about a different thing.
      NOTHING IN THE SHIPPED TREE DOES IT TODAY (`cR1`: no `agent.run(...)` site passes
      `capabilities=`, one install per run even with a build-time AND a run-time toolset), which is
      why this is a forward guarantee rather than a bug fix — and why the anti-vacuity evidence had
      to be executed rather than reasoned: `cR2` drove the seam against a gate with no idempotence
      and measured two installs and two frames, one capability object or two.
      THE TEST INSTALLS THE COMPOSITION ROOT'S OWN CAPABILITY, RECOVERED OFF THE CONTROL RUN'S
      AGENT (`cR3`), rather than constructing one by name. No resolution ever spelled a public
      constructor for the capability — `d78` pins the encoder and toolset seams and neither is a
      capability factory — so spelling one here would mint a production symbol and a signature at
      the last authoring step, under a decision that was about idempotence and not about a new
      public name.

  - id: d81_the_budget_charges_every_value_the_walk_visits
    kind: domain-outcome
    form: test
    fork: f9
    resolved_by: auto             # not a new decision: the instrument every f9 number came from already counts this way
    binds: ["toon_gate_max_nodes.domain", "interacts(toon_gate->toon_encoder).response",
            "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_payload_under_the_budget_in_containers_and_over_it_in_values_is_refused
    positive_control: d54_the_guard_refuses_nothing_in_the_committed_corpus
    cites: [cE1, cE2, cE3, cE4]
    source: >-
      `.spec-flow/frontiers/100-encoder-audit.md` §2 — the encoder audit run against the host
      memory-exhaustion investigation of 2026-08-14, which traced 10 OOM kills to `toons.dumps`
      on this suite's own DAG fixture.
    note: >-
      THE UNIT OF THE BUDGET, AND UNTIL THIS DEMAND NOTHING DROVE IT. `d52` pins that the budget
      is not the depth cap and that a seen-set of UNIQUE OBJECTS is not a visit count — verified
      by construction (`cE1`): a memoising walk reports 29 nodes on `S7`'s bomb, admits it, and
      fails `d52`'s `dumps_calls == 0`, while an unpruned unique-counter never terminates and
      fails its wall clock. What no test saw is a SECOND reading of the same knob: charge only the
      dict/list containers the walk RECURSES INTO, and leave every scalar entry free. `d52`'s bomb
      does not discriminate it — at a budget of 1000 both readings refuse it, because that
      fixture's containers are the thing that multiplies.
      THE COST OF THE FREE READING IS THE INCIDENT ITSELF (`cE2`). `toons` emits one line per
      value carrying the full indent — 136 bytes for a scalar entry at depth 64 against ~9 in
      JSON — so the output is proportional to VALUES. 64 objects (a 300-entry leaf shared 15
      levels deep, sunk to the cap) pass a container-only budget at 65 583 containers and abort
      the process inside the Rust encoder (`memory allocation of 2147483648 bytes failed`,
      SIGABRT, rc 134, uncatchable, so `d55`'s arm never runs) while the UN-GATED arm of the same
      payload returns cleanly under the identical ceiling. That is `O9(a)`'s parity broken by an
      admitted input, which is the one thing M7 exists to prevent.
      IT IS A CORRECTION, NOT A DECISION, which is why it resolves `auto` and does not re-open f9:
      `r3_validator.prevalidate` — the instrument behind `S8`, `S9` and §7 r6's own 100 000 —
      decrements the budget ABOVE its container check, so it has always charged every value. That
      is why `S9` reports 517 nodes on a corpus whose deepest fixture holds 108 containers, and it
      is why 100 000 is unchanged and `d54` still passes: both readings admit all 80 corpus arms
      (`cE3`). Like `d51` and `d52` this demand asserts NO CONSTANT — it is stated at two
      configured budgets over two payloads with an identical container count.

# ---------------------------------------------------------------------------
# STRUCTURE — the address space. `provenance: design` is this change's delta (rules.md, Procedure);
# `provenance: code` is the grounded neighborhood the brief carries and no demand asked for.
# ---------------------------------------------------------------------------

structure:

  # THE AXIS REGISTRY. Every `key_axes` / `interpolates` member below is one of these; a member
  # outside this list is an R0 finding. `run_id` is the rename: 20-demands-r2 registered the axis as
  # `run_dir`, which is also a boundary here, and one name could not be both.
  axes: [run_id, lead_id, seq, agent_id, tool_call, session_id, learning_run_dir, trace_name]

  actors:

    # --- the delta -------------------------------------------------------------------
    - {id: toon_gate,            frame: leg,         provenance: design}   # the WrapperToolset subclass's `call_tool` — M1's site (f4, decided at r6)
    - {id: toon_gate_capability, frame: composition, provenance: design}   # AbstractCapability.get_wrapper_toolset — the only attachment above the combined toolset (B5/B17: no in-tree precedent)

    # --- the composition roots -------------------------------------------------------
    - {id: run_investigation,    frame: composition, provenance: code}     # driver.py:905-921 — 5 required + 9 optional seams, none a toolset or capability (B2/r17). One production caller: run.py:238.
    - {id: replay_harness,       frame: composition, provenance: code}     # tests/e2e/_replay_harness.py:474 — the SECOND threading site; its `seams` dict already carries seven (B16/F7)
    - {id: build_agent_core,     frame: composition, provenance: code}     # driver.py:272 — THE single `Agent(...)` construction site (driver.py:314), serving five build paths. Fork P2 decides where the gate installs.

    # --- the 8+ agents one investigation and one learning cycle build ------------------
    - {id: main_agent,           frame: leg,         provenance: code}     # build_agent (driver.py:609) — takes NO extra_capabilities today
    - {id: gather_agent,         frame: leg,         provenance: code}     # build_gather_agent (driver.py:416; :667 and lead_zero.py:795) — ONE PER LEAD; already takes extra_capabilities
    - {id: review_lens,          frame: leg,         provenance: code}     # review_roles.py:265-288 — three lenses, through an injected `build` seam defaulting to build_agent_core (:268)
    - {id: learning_stage_agent, frame: leg,         provenance: code}     # build_stage_agent (_pydantic_stage.py:25) — SIX stages, each with its own deps subclass and trace family
    - {id: judge_agent,          frame: leg,         provenance: code}     # build_judge_agent (engine_pydantic.py:98)

    # --- the capability stack every agent carries: [Hooks, *extra(ProcessHistory), QueryCapture] ---
    - {id: budget_hooks,         frame: composition, provenance: code}     # _make_hooks' @hooks.on.tool_execute (driver.py:203-213) — OUTERMOST, and may answer a call WITHOUT calling the handler (F3)
    - {id: query_capture,        frame: composition, provenance: code}     # QueryCapture.wrap_tool_execute (query_tool.py:404) — the INNERMOST wrap hook and still outside every WrapperToolset (F2/B3)
    - {id: process_history,      frame: composition, provenance: code}     # the ProcessHistory capability installed on every agent; MAIN's returns selection.render -> hydrate (P-obs)

    # --- the neighborhood: writers, readers and consumers ------------------------------
    - {id: request_logger,           frame: leg, provenance: code}   # observe.py:110 RequestLogger — ONE per investigation, shared by MAIN + gather + all three review lenses (driver.py:940, :417, :434; review_roles.py:279)
    - {id: stage_request_logger,     frame: leg, provenance: code}   # _pydantic_stage.py:99-101 — the learning lane's SEPARATE logger family
    - {id: payload_view_render,      frame: leg, provenance: code}   # payload_view.render — N3's subject; three production importers (B11/F14)
    - {id: record_query,             frame: leg, provenance: code}   # scripts/gather_tools/record_query.py — persist_payload (:85) and append_query_row (:136)
    - {id: tool_bash,                frame: leg, provenance: code}   # runtime/tools.py:261 — the gather bash lane, the second caller of append_query_row
    - {id: lead_zero,                frame: leg, provenance: code}   # lead_zero.py:329-357 — writes the gather_raw payload AND assembles the 12-key row INLINE, bypassing both helpers (F16/S1/S2)
    - {id: judge_closed_ticket_tool, frame: leg, provenance: code}   # judge/closed_ticket_tool.py:128,351,355 — the THIRD, independently spelled queries-table writer, and the ticket_reads mirror at :302
    - {id: gather_dispatch,          frame: leg, provenance: code}   # runtime/tools_gather.py (profile contextAlias) — _persist_gather_summary (:391-398), framed BEFORE persistence (:568-569, F15)
    - {id: session_store_handle,     frame: leg, provenance: code}   # runtime/session_store.py StoreHandle — the profile declares eleven writers and eleven readers on this root
    - {id: lead_repository,          frame: leg, provenance: code}   # learning/lead_repository.py stage_tables — copies gather_raw AND the queries table into the learning run dir
    - {id: visualize_messages,       frame: leg, provenance: code}   # scripts/visualize/visualize_messages.py:38 load_messages — the wire log's only reader

  boundaries:

    # =====================================================================================
    # The delta's own surfaces
    # =====================================================================================

    - id: tool_result
      provenance: design
      facets:
        domain:
          type: any
          refinement: {nl: "the value `call_tool` receives — the tool's OWN return, in every capability order (r6). The re-encoder admits only `dict` and `list`; the type admission examines the TOP-LEVEL shape only and must precede both the byte gate and the round trip, because `toons.dumps` of a str returns it unchanged and round-trips (x8/r10)."}
          default: unknown            # a tool return has no default; `unknown` is the honest slot value, not a null
          falsy_valid: true
          distinguished:
            - "str"                # d4 — passthrough, encoder never called
            - "scalar"             # d4
            - "none"               # d4
            - "content-block"      # d4 — settled #1: passthrough with object identity
            - "bytes"              # d4 — settled #26: not a dict and not a list, so the type admission's rule, not the list's
            - "empty-dict"         # d11 — `toons.dumps({}) == ''` clears the bar AND round-trips (r22); the one hard floor
            - "nested"             # d7
            - "non-uniform-list"   # d7
            - "cjk"                # d25 — 51% in characters, 102% in bytes (r24)
            - "empty-list"         # d11 — R3 settled it: `'[0]:'`, 4 B against 2, ratio 2.0. It passes through ON THE BAR, not on the empty-view rule — the opposite of the empty dict
            - "tuple"              # d50 — R3/S2: a tuple is not entered at all; `dumps` emits the literal `'null'` (4 B), which CLEARS the bar, so only M3 stops total data loss if admission ever widens
            - "nan"                # BOUND by d70 (post-seam). R3 settled the mechanism (`toons` emits `'x: null'`; `nan != nan` fails M3's equality, so the JSON arm) and no demand binds it. Test obligation, 60-residue
            - "inf"                # BOUND by d70 (post-seam). R3 settled it and FLIPPED the reason: `toons` silently NULLS +/-inf rather than raising, so it is the same loss arm as NaN, not an exception arm (discount D2 reinstated). Test obligation, 60-residue
            - "non-text-keys"      # d48 — R3/S1: the fault class splits by encoder path (PanicException in mapping position, TypeError in row position). M7 refuses before the encoder
            - "unencodable-key"    # d48 — S1's SECOND half: a lone surrogate is a `str` and is not UTF-8 encodable; `isinstance(k, str)` alone is not the admission rule
            - "hazard-in-key"      # d36 (fork P3) — the header line is the one line that declares a row's arity; probe R7
            - "nul-byte"           # UNBOUND — R10 REFUTED the claim that #851's gate covers this seam: its three callers all take a model-authored bash command, none a tool return. The NUL clears the bar at 0.6125, M3 passes it, and the model reads a RAW U+0000 where the passthrough arm shows six printable characters. That difference is re-grounding FORK 2 and is a §7 decision, not a test to mint here
            - "circular"           # d49, d57 — R11/S2: not a raise, a SIGSEGV, in all 7 dict/list placements. M7 refuses it; the run still dies in pydantic-ai's own serialization, identically without the gate (S11)
            - "toolreturn"         # BOUND by d72 (post-seam, 75-residue-settled.md). R4 (executed) confirmed silent branch 12: a tool body that pre-wraps its own dict in a `ToolReturn` hands `call_tool` the ToolReturn OBJECT and OPTS OUT of the gate entirely, dict intact and metadata preserved. No demand binds it. Test obligation, 60-residue
          documented_alternatives: []
      note: >-
        Fifteen of these nineteen members are now bound by a demand — the r3 delta bound five of the
        nine the first pass could not (empty-list -> d11, tuple -> d50, non-text-keys and the new
        unencodable-key -> d48, circular -> d49/d57) and added one member of its own. The three that
        remained unbound after §7 (nan, inf, toolreturn) were SETTLED POST-SEAM BY PROBE in
        `75-residue-settled.md` — nan and inf by d70 (the non-finite loss is pydantic-ai's own
        tool-return serialization, not the gate's: cN2/cN4), toolreturn by d72 (five readings
        executed, four fail, the survivor forced by f2=B + f1=C + f5=B). All nineteen are now bound.
        nul-byte is a §7 decision (re-grounding fork 2), not an obligation. Each is a real member of
        the domain the seam admits and each now has an executed probe behind its disposition.

    - id: tool_return_part
      provenance: design
      facets:
        payload:
          parts:
            - {role: return_value, source: derived:toon_view}          # what the model reads — a `str` bypasses `tool_return_ta` entirely and is sent unchanged (B7/r21)
            - {role: metadata_json, source: const:the_tools_own_return} # what the application keeps — provably off the Anthropic and OpenAI wire (H5), and IS in the wire log
          invariants: [roles-disjoint-sources]
          nl: >-
            Under fork f1 reading C the substituted return is one `ToolReturn` carrying both
            encodings, unpacked by `_agent_graph` into `ToolReturnPart(content=return_value,
            metadata=metadata)` (r19, executed). `roles-disjoint-sources` is the formal statement of
            d16: the metadata half must be the TOOL'S OWN RETURN OBJECT, never a re-encode of the
            view — a re-encode makes O5 vacuous while looking identical.
      note: >-
        This boundary is the whole of f1-C and f5-B, and it is the one every existing reader of the
        message history meets without being asked. Whether `metadata` survives the session store's
        persist -> `hydrate` round trip is UNPROBED (claim R2).

    - id: model_view
      provenance: design
      facets:
        payload:
          invariants: [all-slots-bound]
          nl: >-
            The text the model actually receives for a tool call. `provenance: design` because THIS
            change is what puts a second author on it. WHICH ARTIFACT settles it is fork P-obs: the
            dispatched request messages (which are `hydrate(store, ..., role='send')`'s output, not
            the live list) or the wire-log record (which is `ensure_ascii`-escaped, so every byte
            comparison would need a decode O2 never mentions).
      note: "co-authored: `toon_gate` (design), `query_capture`, `payload_view_render` and `process_history` all write here."

    - id: toon_encoder
      provenance: design
      facets: {}
      note: >-
        `toons` 0.7.0, declared at 12763db2 (B13/r4), pinned to the 0.7 minor because O4's argument
        is a probed property of THIS encoder (d14). Facetless: it is a library call, not a contract
        surface with a domain of its own. Two open library questions ride on it — re-entrancy under
        concurrent async invocation (probe R8; `sequential=True` is set on only 2 of the 14
        registrations, so the framework admits concurrent tool calls — D7) and whether `dumps` can
        return a non-`str` for an admitted dict/list (probe R9).

    - id: wire_ruler
      provenance: design
      facets: {}
      note: >-
        `pydantic_core.to_json` — byte for byte what `ToolReturnPart.model_response_str` sends
        (B7/F8). Fork f3 is DECIDED (r8): measuring against `json.dumps` defaults inflates the
        baseline with `ensure_ascii` escapes and two-byte separators and books a win that does not
        exist on the wire. It raises `PydanticSerializationError` only on an arbitrary object — not
        on a `datetime`, a `set` or `bytes`, which it base64s or ISO-formats (r10).

    - id: toon_gate_max_ratio
      provenance: design
      facets:
        domain:
          type: int              # WAS float. Moved by §7 r7 (f7 = B): the bar is an INTEGER PERCENT
          refinement: {nl: "an integer percent in (0,100]; substitute only when 100 * bytes(toon) <= percent * bytes(wire_json), both sides measured in UTF-8 bytes. Read through the existing `env_int` as DEFENDER_TOON_GATE_MAX_PERCENT."}
          default: 85
          distinguished: [85]
          falsy_valid: false
          documented_alternatives:
            - {value: 90, crosses_validation: true}   # FLIPPED with the ruler decision: false under json.dumps (2 leaks), true under the wire ruler (r8)
      note: >-
        RE-SPELLED BY §7 r7, AND THE RE-SPELLING CAME BEFORE d58's BINDS WERE WRITTEN — that
        ordering is the whole content of f7 reading B's cost. The knob had no house form: `_env.py`
        offers `env_int`, `env_bool`, `env_str` and NO `env_float`, and the tree's one float-valued
        knob (`bash_exec.py:278`, `DEFENDER_BOX_TIMEOUT`) reads `os.environ` raw and bypasses
        `_env.py` entirely (B8, re-executed by the r3 leaf). The human took B — an integer percent
        through the existing `env_int`, `DEFENDER_TOON_GATE_MAX_PERCENT=85` — so NO NEW HOUSE
        PRIMITIVE is added to a shared module for one consumer, and the cost is that the knob's unit
        stops matching the design's ratio and this boundary's `domain.type` moved float -> int with
        both cells re-expressed: `distinguished[0.85]` -> `distinguished[85]` and
        `alternatives[0.90]` -> `alternatives[90]`. d58 binds the NEW addresses; the old ones no
        longer resolve and any prose still spelling them is stale. The values are unquoted integers
        now — the quoting that kept `0.90` from parsing to `0.9` is no longer needed and would make
        the address a string that does not match. Reconciled name: 10-brief-r2 called this
        `toon_gate_ratio`.
        WHAT DID NOT CHANGE: no demand asserts these slots. `85` is the value the measurements were
        taken at, not a contract — d2 and d26 are dead, §7 r10 (f6 = A) left the mechanism alone and
        moved the correction to prose, and d58 binds all three addresses parameterized on whatever
        bar is configured.

    # --- M7's two bounds. NEW in r3, and both `default: unknown` on purpose ---------------
    - id: toon_gate_max_depth
      provenance: design
      facets:
        domain:
          type: int
          refinement: {nl: "the maximum nesting depth M7 admits, counted over dict|list only — the encoder's own traversal set (S2). A payload one level over it is refused before the encoder is called."}
          default: 64                 # DECIDED AT §7 r6 (fork f9). Was `unknown` — half of hole H4, and no probe could close it: the probes bound the value from BOTH SIDES and no safe constant is derivable from evidence. 64 is roughly 20x the real corpus's depth 3 (S9) and well under the lowest observed crash floor, a segfault at depth 900 on a 512 KB thread stack (S4); on 8 MB the encoder survives 10 000 and dies at 12 000, and `threading.stack_size()` reports 0 in this runtime, so the headroom is not introspectable and the cap is a CHOSEN bound rather than a measured one.
          distinguished: []           # still deliberately empty: d51 is parameterized on the configured cap and exercises either side of it, so no single member is distinguished. Pinning one would be pinning a property of the machine the suite runs on — and §7 r6 explicitly kept the suite parameterized.
          falsy_valid: false          # a cap of 0 refuses every container, which is not a configuration the design admits ("a bound chosen far below every observed crash depth")
          documented_alternatives: []
      note: >-
        An integer, so unlike the bar it fits the existing `env_int` house form and needs no new
        primitive — f7 does not reach it. Bound by d51 and d54. THE VALUE IS THE GRAPH'S, NOT THE
        SUITE'S: §7 r6 supplied 64 so this slot could stop being `unknown`, and d51 still asserts no
        depth constant.

    - id: toon_gate_max_nodes
      provenance: design
      facets:
        domain:
          type: int
          refinement: {nl: "the maximum number of VALUES M7 visits before refusing — every entry the walk reaches, scalars included, not only the dict/list containers it recurses into. This is what `r3_validator.prevalidate` counts (its decrement sits above the container check), which is why S9 reports 517 on a corpus whose deepest fixture holds 108 containers. The walk's own worst case as well as the encoder's, and the encoder's is the reason for the unit: `toons` emits one line per VALUE with the full indent on it, so a container-only budget bounds nothing about the output (d81, cE2). A shallow, acyclic payload over the budget is refused."}
          default: 100000             # DECIDED AT §7 r6 (fork f9), with the depth cap — "decided with the depth cap or neither is decided". Was `unknown`, the other half of hole H4. 100 000 is roughly 200x the real corpus's peak of 517 nodes (S9) and far below the 2**24 nodes of expansion at which 29 objects sharing children pairwise take the process (S7); at k=20 the same shape already reaches 132 MB of TOON.
          distinguished: []           # as with the depth cap: d52 is parameterized on the configured budget and asserts no constant
          falsy_valid: false          # a budget of 0 refuses every container
          documented_alternatives: []
      note: >-
        NOT THE DEPTH CAP, and that is why it is a second boundary rather than a second member: the
        expansion bomb is 29 objects at depth 28, so a depth cap admits it and the process dies
        (S7). It is also what bounds the VALIDATOR's own cost — without it the walk would visit
        2**28 nodes on that input. Bound by d52, d54 and d81. §7 r6 supplied the value; d52 still
        asserts no node constant.
        THE UNIT WAS WRONG IN THIS SLOT UNTIL THE ENCODER AUDIT AND THE VALUE IS NOT: the
        refinement said "dict/list nodes" where the instrument every f9 number came from charges
        every VALUE, and the two readings disagree on exactly one thing — a payload of 64 objects
        that a container-only budget admits at 65 583 containers and that then aborts the process
        in the encoder (cE2). 100 000 is unchanged, S9's 517 is unchanged (it was always the value
        count), and all 80 corpus arms are admitted under both readings (cE3). d81 is the demand
        that drives the unit; f9 is not re-opened.

    - id: toolset_seam
      provenance: design
      facets:
        domain:
          type: toolset
          refinement: {nl: "the DI seam M6 mints on the composition root: a foreign toolset (or the capability that installs one), threaded the way the nine existing optional seams are"}
          default: "none"
          distinguished: ["none"]      # the falsy member: a seam that defaults to something is how a test hook becomes a production hole
          falsy_valid: true
          documented_alternatives: []
      note: "two threading sites, not one: run.py:238 and _replay_harness.py:474's `seams` dict (B2/B16)."

    - id: toolset_provenance_label
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "how the gate decides a result is FOREIGN: `ToolsetTool.toolset` / `tool_def.metadata`, readable at the seam (r7, executed — `meta={'trust':'untrusted'}` on a `.with_metadata()` toolset)"}
          default: "foreign"           # DECIDED AT §7 r2 (fork P1 = B): "foreign unless installed by defender's own composition root". Was `unknown` because no design sentence said the gate consults provenance at all; the human's decision is that it does, and that the SAFE direction is the default — an unlabelled source is gated and framed rather than silently exempt.
          distinguished: ["unlabelled"]   # bound by d59: what an UNLABELLED toolset defaults to was the whole of P1 reading B's cost, and r2 answered it — foreign
          falsy_valid: false
          documented_alternatives:
            - {value: "owned-label-set-by-the-installer", crosses_validation: unknown}   # STILL `unknown`, and now deliberately so: a foreign source installed with an owned label is treated as owned and, under f2-B, never framed. §7 r2 ACCEPTED that as a limitation rather than defending it — recorded as the examined no at d60, which is what this entry's R0/R4 holes now resolve to.
      note: >-
        Minted by fork P1 and KEPT BY §7 r2, which resolved P1 on reading B — so this boundary is no
        longer a phase-C promotion awaiting a decision, it is the decided mechanism's own surface.
        The design's key-flow diagram still has NO foreignness box; `design-872-r3.md` gains the box
        with the resolution rather than the graph carrying an element the doc does not mention.
        `r6` (executed) shows `call_tool` receives OWNED tools' values too — it saw `query`'s dict —
        which is exactly why the label has to exist under B. d59 pins the label, its authority and
        its default; d60 records the mislabel hazard the human accepted.

    - id: gate_run_record
      provenance: design
      facets: {}
      note: >-
        Fork P6 reading B's run-level record (examined / substituted / bytes saved). MINTED BY A
        PHASE-C PROMOTION, NOT BY A DESIGN SENTENCE — R0's bidirectional reconciliation must read it
        as a fork awaiting §7, not as invented scope. Under reading A it does not exist and the
        negatives rest on their positive controls. If it does exist it needs a sink, which drags f5
        along with it, and it must not become a new undeclared run-dir root (S5/D3).

    # `toon_sidecar` IS GONE, REMOVED AT §7 r1 (fork f5 = B). It was fork f5 reading A's new
    # run-dir sink and nothing else: it had NO path template, NO writer symbol and NO key axis
    # (S5/D3), its `identity` carried `key_axes: [tool_call]` with no `evidence` — the one finding
    # a clean `spec-graph gate` re-run kept on purpose — and its `access[read-tool]` constraints
    # were `unknown` because the PLACEMENT was undecided. The human took reading B: the original
