  - id: d33_reading_accuracy_not_claimed
    kind: coherence
    form: clause
    fork: f6
    resolved_reading: A
    resolved_by: human            # §7 r10 — the corpus arm
    resolution: >-
      §7 r10 — READING A: accept the mechanism, correct the prose. The margin claim is restated as
      a SHAPE separation, not a provenance one, and `0.85` (now `85`, per f7=B) is recorded as a
      chosen constant with a shape rationale and no demand behind it. `design-872-r3.md`'s Margin
      deep dive carries the correction. B WAS EXPLICITLY REJECTED — adding a structural condition
      to defend the claim would exclude exactly the small flat payloads `r22` probed substituting
      losslessly, which is changing the mechanism to protect a story the mechanism never needed.
      C — re-grounding the bar against a real foreign population — is recorded as FOLLOW-UP, in
      `handoff.deferred`, because no such population exists in this tree. d11 stays the one hard
      floor under every reading.
    binds: ["interacts(toon_gate->model_view).payload"]
    outcome:
      nl: >-
        Nothing here claims the model reads TOON as accurately as JSON — the A/B's 100%-in-both-arms
        result is a ceiling effect — and, corrected against r22, nothing claims the byte gate is a
        structural proxy either: it admits small non-tabular payloads, so what a substitution
        establishes is that the view is cheaper on the wire and round-trips, not that it is tabular.
    rejected:
      - {nl: "the r2 sentence 'it establishes that a substituted payload is uniform-tabular' — refuted by r22 below 500 bytes"}
    cites: [r22]
    note: >-
      Clause because the model-accuracy half is about a remote API this suite cannot observe; the
      corrected half is pinned by d11 and routed to §7 as fork f6, WHICH WIDENED IN PHASE C: the
      corpus's `unowned` arm is the same 40 owned payloads re-zipped (claim J2), so the 1.5pp window
      that is now 15%'s sole justification measures two encodings of ONE population and bears on no
      foreign source at all. c11 (bytes overstate the token win by ~1.4x) is `deferred` and is NOT
      cited here for that reason — it needs a live FIREWORKS_API_KEY and the real kimi tokenizer.

