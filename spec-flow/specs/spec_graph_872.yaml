    - "P1 — does the gate key on provenance AT ALL? O1/O2/O6 are all stated over FOREIGN results and the design's own key-flow diagram has no foreignness box; M1 says provenance is READABLE at the seam (r7) but no sentence says the gate CONSULTS it. A provenance-blind (d19 falls; an owned tool that ever returns a dict has its model-visible text silently changed — exactly what O2 forbids, and 13 of 14 tools are annotated `-> str` with nothing enforcing it). B provenance-gated (d19 is drivable; mints a demand for what the label is, who may set it, and what an UNLABELLED toolset defaults to). Recommendation: B, default 'foreign unless installed by defender's own composition root', with the mislabel hazard recorded as an accepted limitation the way N7 records native returns. RESOLVED — §7 r2, READING B, PROVENANCE-GATED, default 'FOREIGN UNLESS INSTALLED BY DEFENDER'S OWN COMPOSITION ROOT'. Mints d59 for what the label is, who may set it and what an unlabelled toolset defaults to. The mislabel hazard — a foreign source installed with an owned label is treated as owned and, under f2-B, never framed — is an ACCEPTED LIMITATION, recorded the way N7 records native returns, at d60. resolved_by: human"
