  - id: d41_an_already_written_queries_row_is_unchanged_by_the_gate
    kind: coherence
    form: test
    binds: ["interacts(record_query->queries_table)", "interacts(lead_zero->queries_table)",
            "interacts(judge_closed_ticket_tool->queries_table)"]
    discharged_by: test_a_queries_row_written_before_the_wrapper_sees_the_return_is_unchanged_by_the_gates_decision
    source: "settled #6 — 'derived, never authoritative' forbids a row's correctness from depending on what the gate later decides for the model-visible text"
    note: >-
      Bound per WRITER EDGE, not at the boundary, for the reason coherence always is: the table has
      three independently spelled writers — `record_query.append_query_row` (reached by
      `query_tool.py:493` and the gather bash lane at `tools.py:261`), `lead_zero.py:344-357` which
      assembles the twelve keys INLINE, and `judge/closed_ticket_tool.py:351,355` which appends its
      own — and a demand at the table's altitude is green when two of the three agree.
      TWO OF THE THREE ARE DRIVEN AND THE THIRD IS OUT OF REACH BY CONSTRUCTION
      (`92-reconciliation.md` F9). The test used to exercise the `append_query_row` lane alone, so
      it was green when ONE of three agreed — weaker than the altitude this note argues against. The
      differential now spans that lane AND `lead_zero._record_manual_row`, called through the
      module's own function so the twelve inline keys are compared rather than a test's copy of
      them, and it asserts both lead ids are present before comparing. The judge's appender writes a
      file of the same NAME in the LEARNING run dir (`run_dir / "executed_queries.jsonl"` where
      `run_dir` is the learning run's), which no investigation writes and which the gate cannot reach
      from this altitude — so its absence is a REACH fact, not a lane the test declined to drive.

  - id: d30_no_message_level_rewriter
    kind: negative
    form: test
    binds: ["interacts(request_logger->wire_log)", "interacts(toon_gate->model_view).payload",
            "interacts(process_history->model_view).payload"]
    discharged_by: test_the_recorded_history_of_a_substituted_call_is_not_rewritten_in_place
    positive_control: d16_recovered_json_equals_the_tools_own_return
    source: "N8, H10/H11/H12 — each rewriter satisfies O1 and destroys O5, and defender already installs ProcessHistory on every agent"
    note: >-
      N8's PHRASING IS CORRECTED HERE, and the correction matters for what this test may assert.
      Defender's persistence is APPEND-ONLY: `selection.ingest` only ever calls `store.append`
      (selection.py:103-129) and a fold mints a NEW synthesized `ModelRequest` parented onto the
      lineage root (selection.py:36-81) rather than mutating prior rows. Nothing is rewritten in
      place. What changes is WHICH ROWS THE SEND-RENDER REACHES — both processors also withhold the
      final round when the request ceiling is hit (driver.py:540-542, :571-573). The oracle problem
      N8 points at is real; "overwriting the run's history in place" overstates the mechanism, so
      assert over the recorded rows, not over an in-place mutation that cannot happen.

  - id: d39_encoding_claims_are_settled_at_the_dispatched_request_messages
    kind: coherence
    form: test
    fork: P-obs
    binds: ["interacts(process_history->model_view).payload", "interacts(toon_gate->model_view).payload",
            "interacts(process_history->session_store)"]
    discharged_by: test_a_substituted_return_survives_the_history_the_run_rebuilds_before_sending
    readings:
      A: "THE DISPATCHED REQUEST MESSAGES — literally what the model received; survives the `hydrate` rebuild by construction because it IS the rebuilt list; observable today with no new seam (the harness's FunctionModel sees exactly those messages). Cost: `metadata` (f1-C) survives here only if the store round-trips it (probe R2)."
      B: "THE WIRE-LOG RECORD — one artifact for both O1 and O5. Cost: the log pins `ensure_ascii=True`, so every byte comparison must undo escaping first — O2's 'compared as bytes, not as equivalent content' becomes 'compared as bytes after unescaping', a weaker claim than O2 states, and d9, d24 and d25 each grow a decode step."
    resolved_reading: "A for O1/O2/O3/O8; B for O5 alone"
    resolved_by: human            # §7 r8 — the offline record
    resolution: >-
      §7 r8 — THE ORACLES ARE SPLIT. The encoding obligations (O1, O2, O3, O8) are read off the
      DISPATCHED REQUEST MESSAGES, which this demand binds — observable today through the replay
      harness's `FunctionModel`, no new seam, and it survives the `hydrate` rebuild by construction
      because it IS the rebuilt list. Attributability (O5) is read off the WIRE LOG alone (d15b).
      Taking B for everything would have silently weakened O2 from byte-identity to
      byte-identity-after-unescaping, which is the trade the split refuses. r8 also minted d63,
      because the wire log's only reader survives a part carrying `metadata` and drops the field.
    source: >-
      P-obs — O1, O2, O3 and O8's oracles are all phrased over "the ToolReturnPart the model
      received" and O1 adds "not off an internal variable", but in THIS runtime that phrase does not
      name one artifact: MAIN's `ProcessHistory` processor returns `selection.render(...)`, which
      discards the live message list and returns `hydrate(store, session_id, role='send')`
      (driver.py:493, :526-557; selection.py:132-147; session_store.py:917-934). An oracle reading
      the wrapper's own return value would be testing an internal variable — which O1 forbids.

