  - id: d24_json_side_is_the_wire_serialization
    kind: behavior
    form: test
    binds: ["interacts(toon_gate->wire_ruler).response", "toon_gate_max_ratio.domain"]
    discharged_by: test_a_fixture_whose_verdict_differs_between_rulers_takes_the_wire_rulers_verdict
    source: "O8, r23 — fx-01 clears 15% under json.dumps (81.7%) and fails under the wire ruler (86.2%)"
    note: >-
      CHANGED BY THE r3 CORRECTION: WHICH fixture's verdict differs between the rulers is a function
      of the bar, so the fixture selection is PARAMETERIZED ON THE CONFIGURED BAR rather than fixed
      at 0.85. `r23`'s fx-01 (81.7% under `json.dumps`, 86.2% under the wire ruler) is the
      discriminator AT 0.85 and stays the worked instance, but the demand is "at the bar the gate is
      configured with, a fixture whose verdict differs takes the wire ruler's" — the test selects
      its fixture from the configured bar instead of hard-coding one that only discriminates there.
      One committed fixture discriminates the two rulers at the shipped bar, so the demand is a
      drive, not a restatement of the formula. Scope the byte-equality assertion to dict/list: `r21`
      shows `model_response_str()` and `to_json` diverge on `str` (16 B vs 18 B) and `None` ('' vs
      'null'), which the type admission excludes anyway — unscoped, the demand pins a false universal.

  - id: d25_toon_side_is_measured_in_utf8_bytes
    kind: domain-outcome
    form: test
    binds: ["tool_result.domain.distinguished[cjk]", "interacts(toon_gate->toon_encoder).response"]
    discharged_by: test_a_cjk_payload_is_measured_in_bytes_not_characters
    source: "M2, r24 — a nested CJK payload is 51% of the wire JSON in characters and 102% in bytes"
    note: "fails loudly against a `len(str)` implementation; a pure-ASCII fixture cannot tell the two apart."

  # d26_ninety_percent_alternative IS DEAD. It asserted that `0.90`'s crossing verdict "flipped to
  # true under the wire ruler" — a clause about a constant crossing FROM another constant. With no
