    - id: session_store
      provenance: code
      facets:
        identity:
          key_axes: [run_id, session_id]
          evidence: {nl: "`sessions/` plus `session_store_pointer.json` — the profile declares ELEVEN writers (StoreHandle.new_session/fork/append/write_config/set_truncated_by/set_last_render_len, open_store, write_case_pointer, lead_zero.dispatch_correlation, driver._make_store_render_processor) and ELEVEN readers (hydrate, synthesized_flags, path_row_ids, ends_on_complete_pair, open_store_for_read, resolve_store_path, selection.render/ingest/fold, observe.write_trace, visualize_run)."}
          sharing: serialized-append
      note: >-
