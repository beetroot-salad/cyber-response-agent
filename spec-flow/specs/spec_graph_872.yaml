  forks:
    # ---- the four that came in open -----------------------------------------------------
    - "f1 — the substitute branch's return contract: A bare `toons.dumps(x)` / B `_untrusted.wrap(toon,'untrusted',ctx.deps.salt)` / C `ToolReturn(return_value=<toon>, metadata={'json': <original>})`. All three are byte-exact on the model wire (a `str` bypasses `tool_return_ta` — B7/r21; `metadata` is off the Anthropic and OpenAI wire — H5). A drops d3/d17a/d17b/d18 and leaves O5 to f5-A. B makes d3 live (67 fixed bytes; 8 of 40 committed unowned fixtures clear on encoder bytes and fail on delivered bytes — r20) and is the exact call an uncommitted convention in the sibling checkout exists to discourage (B14: `wrap_fresh`, '#875 F-1'). C is honored at the decided seam (r19) and is the only reading that makes f5-B available, but an outer hook that discards call_tool's return discards the metadata with it (QueryCapture does exactly that for `query` today) and nothing observes that (P6). PROBE R2 HAS RUN AND IS POSITIVE — metadata survives persist -> hydrate -> wire log and is off both provider wires — SO THE CONDITIONAL IS GONE and C is available on its merits. What R2 did not remove is re-grounding fork 3's cost: under C the persisted record is 38% LARGER than not gating at all (3465 B vs 2518) while the only size meter in the tree reports a 59% saving. Recommendation on the table: C with B's frame applied to `return_value`. RESOLVED — §7 r1, READING C WITH B'S FRAME ON `return_value`. Taken as ONE decision with f5=B, P6=B and the persistence cost accepted, which is why the four are not separable in the record either. Accepted with it and recorded as examined noes: the persisted record grows ~38% over not gating (d0b's note, and the design's Scale deep dive), and an outer hook that discards call_tool's return discards the metadata with it — QueryCapture does exactly that for `query` today, so attributability is silently unmet for that tool family (d69). resolved_by: human"
    - "f2 — O6's branch coverage: A the substitute branch only / B every foreign result. A leaves O6 failing its own oracle and lets an attacker choose whether their own output is framed by padding to either side of the bar. B mints d17b, needs a stringify step no sentence supplies (r12), breaks d0 and d9 by construction, and makes d3 live for every foreign result. PHASE C SHARPENED B: a budget refusal (F3) and a raising tool (B5/H14) never cross call_tool at all, so B must be SCOPED EXPLICITLY to values the wrapper returns, and O6's universal stays unmet for refusals, raises, native returns and output-typed tools — written down the way N7 is, or a later reader will think O6 covers them. Recommendation: B, so scoped. RESOLVED — §7 r3, READING B, SCOPED TO THE WRAPPER'S OWN RETURN VALUES. Mints d17b live; mints d61 for the stringify step no design sentence supplied; mints d62 as the recorded non-obligation naming refusals, raises, native returns and output-typed tools as text O6 does not reach. M7's refused-by-guard third branch is IN SCOPE and d9 extends to it. Two demands change with it: d0's `result is original` is VOID and O2's byte-identity is re-read as 'the JSON content is unchanged inside the frame'. resolved_by: human"
    - "f5 — M4's attributability address: A a new run-dir sink / B `ToolReturn.metadata` plus the existing wire log. A has no path template, no writer symbol and no key axis, cannot be declared under specGraph.resources (D3), and its in-tree precedent is best-effort under a bare `except` (F15). B rested on two unprobed facts and BOTH HAVE NOW RUN: R2 holds (metadata survives persist -> hydrate and is in the wire log) and R5 is unrefuted (20 000 draws distinct, 0 cross-agent collisions in 50 000 x 50 000, and a model-issued retry mints a NEW id). B is therefore available, and R5 strengthens the join key for a reason the judge did not have: RequestLogger re-dumps the WHOLE history every round, so `tool_call_id` identifies a CALL and not a RECORD — joining on it alone yields N duplicates, N = rounds-since. It still holds only at the default trim, and re-grounding fork 3 is the cost that now stands against it instead of R2. Recommendation: B with the join key written `(agent_id, seq, tool_call_id)` and the offline lane's separate trace family named in the demand. RESOLVED — §7 r1, READING B. No new sink: the original is recovered from the wire-log record, joined `(agent_id, seq, tool_call_id)`, with the learning lane's separate trace family named in d15b. d15a is DEAD and `toon_sidecar` plus its two edges are removed from the structure (handoff.drops) — reading A was a design project, not a return-shape choice, and the pre-seam leaf had measured its real cost first (the 8 KB capture ceiling on a path component, 11 of 40 fixtures over it with an unparseable head, and a read allowlist keyed on a filename shape). resolved_by: human"
    - "f6 — the bar's evidence base, widened in phase C and RE-CONFIRMED BY EXECUTION IN r3: the corpus contains NO genuinely unowned payload (J2, re-executed as R12 and again as S9 with the real toon_input IMPORTED), so the 1.5pp window that was 15%'s sole remaining justification measures two encodings of one population — 0 of 40 clear in the owned arm, 40 of 40 in the re-zipped one. WHAT THE HUMAN HAS ALREADY DONE TO THIS FORK: the threshold demand is dropped as unevidenced, so d2 and d26 are dead and d58 pins the gate's behaviour either side of a CONFIGURED bar and asserts no constant. That answers the demand half of reading A. WHAT REMAINS OPEN is the prose half and the follow-up: the design's Margin section is withdrawn rather than thinned, and whether the bar is ever re-grounded against a real foreign population is still undecided. A accept the mechanism and correct the prose (0.85 becomes a chosen default with a shape rationale and no demand behind it — largely done). B give the gate a structural or size condition to make N6's sentence true — which excludes exactly the small flat payloads r22 shows substituting losslessly and cheaply, and changes the mechanism to protect a proxy story the mechanism never needed. C re-ground the bar against a real foreign population, which does not exist in this tree (c2/G10). Recommendation: A now, C recorded as follow-up. d11 stays the one hard floor either way. RESOLVED — §7 r10, READING A: accept the mechanism, correct the prose. The margin claim is restated as a SHAPE separation, not a provenance one, and 85 is recorded as a chosen constant with a shape rationale. B WAS EXPLICITLY REJECTED — a structural condition would exclude exactly the small flat payloads r22 shows substituting losslessly. C (re-ground against a real foreign population) is recorded as FOLLOW-UP in `handoff.deferred`. d11 stays the one hard floor. resolved_by: human"

