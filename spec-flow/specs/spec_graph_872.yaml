  # ======================= raised by the r3 correction (55-corrections-r3.md) =====================
  # Twelve probes, EVERY ENCODER CASE IN ITS OWN SUBPROCESS, plus a no-gate control. `toons` takes
  # the interpreter with it on four distinct input classes, so an unisolated probe loses its own
  # result — the re-grounding leaf's first script died mid-run and reported nothing. The driver
  # reads the signal off the exit status, which is what makes a SIGSEGV a data point. Scripts at
  # /root/.claude/jobs/4c832e92/tmp/r3_*.py. TWO OF THE TWELVE ARE REFUTATIONS OF O3 (S6, S10) and
  # they refute the OBLIGATION's oracle, not the human's mechanism.

  - {id: S1, kind: primitive, probe_kind: executed, verdict: holds,
     claim: "`toons.dumps` admits a mapping key iff it is a `str` (subclasses included) that is UTF-8 encodable; every other key faults, and the fault CLASS depends on the encoder path — a panic in mapping position, a plain exception in row position.",
     probe: "r3_child.py/r3_drive.py — 21 key types x 4 structural positions (top-level dict, row inside a list, nested dict value, top-level list of dicts), each case in its own subprocess.",
     observed: "84 cases. Non-str keys (int, float, bool, None, tuple, bytes, frozenset, Enum, complex, Decimal, object, memoryview): pyo3_runtime.PanicException at top/nested, builtins.TypeError at rows/toplist. A lone surrogate in a key: PanicException at top/nested, UnicodeEncodeError at rows/toplist. A `str` SUBCLASS key is accepted everywhere and emits as a plain key. Keys containing `}`, `[N]{...}`, NUL, LF or the empty string all encode successfully (quoted/escaped).",
     note: "GENERALISES R3's five key types to the RULE. The validator's key predicate is `isinstance(k, str) and k.encode('utf-8') succeeds` — NOT `type(k) is str`, which would falsely refuse a str subclass the encoder handles fine. d48 pins both halves and all four positions."}

  - {id: S2, kind: primitive, probe_kind: executed, verdict: holds,
     claim: "`toons.dumps` recurses into `dict` and `list` (subclasses included) and into no other container; a hazard inside any other container is unreachable because the container is emitted as `null` without being entered.",
     probe: "a non-str-key dict and a self-referential dict each placed inside 15 container kinds (direct, list, dict, tuple, abc.Mapping, abc.Sequence, dataclass, namedtuple, object attribute, dict subclass, list subclass, deque, generator, and both subclasses at top level), one subprocess each.",
     observed: "30 cases. Hazard REACHED (panic / TypeError / SIGSEGV) in exactly 7 placements, all of them dict-or-list: direct, in_list, in_dict, in_dictsub, in_listsub, top_dictsub, top_listsub. Hazard NOT reached in all 8 others — tuple, Mapping, Sequence, dataclass, namedtuple, object attr, deque, generator — each emitting `a: null`. Every reached cycle case was KILLED-BY-SIGNAL-11.",
     note: "THE TOTALITY ARGUMENT FOR PRE-VALIDATION, and without it M7 would be a guess about someone else's recursion: a walk over exactly dict|list is a SUPERSET of the encoder's own traversal, so no admitted input can carry a hazard the walk did not see. d50 makes it executable, in both directions."}

  - {id: S3, kind: primitive, probe_kind: executed, verdict: holds,
     claim: "A deep but ACYCLIC payload segfaults `toons.dumps`, so cycle detection alone is not sufficient.",
     probe: "depth ladder 200/1k/5k/10k/20k/40k/80k through toons.dumps and pydantic_core.to_json, subprocess per case, RLIMIT_AS 3 GB so an allocation failure is distinguishable from a stack crash.",
     observed: "dumps: 200 -> 40 807 B, 1 000 -> 1.0 MB, 5 000 -> 25 MB, 10 000 -> 100 MB, then KILLED-BY-SIGNAL-11 at 20 000, 40 000 and 80 000. Nested LISTS crash the same way. to_json succeeds at 200 and raises PydanticSerializationError ('depth exceeded') from 1 000 up — it never crashes.",
     note: "THE THIRD CRASH CLASS, AND NOBODY HAD TRIED IT: the human's instruction names keys and cycles, and this is neither. It is why M7 carries a depth cap (d51) and why the JSON fallback arm remains available for deep payloads — to_json raises cleanly where dumps dies."}

  - {id: S4, kind: primitive, probe_kind: executed, verdict: holds,
     claim: "The depth at which `toons.dumps` segfaults is a function of the thread's stack size, not a constant.",
     probe: "r3_stack.py — the same acyclic payload encoded on the main thread and on threads created with threading.stack_size(512KB / 1MB / 8MB); ulimit -s is 8192.",
     observed: "8 MB (main and explicit): 8 000 and 10 000 survive, 12 000/14 000/16 000/18 000 segfault. 512 KB: 700 survives, 900/1 100/1 400 segfault. 1 MB: 500 survives, 2 000 segfaults. threading.stack_size() reports 0 ('system default') in this runtime.",
     note: "NO MEASURED CONSTANT IS A SAFE CAP, which is why d51 is parameterized and asserts no depth: a demand pinning a specific safe depth would be asserting a property of the machine the suite happens to run on. The cap's VALUE is fork f9 — an operator judgment bounded from both sides by probe (3 needed, 900 fatal) and by nothing else."}

  - {id: S5, kind: primitive, probe_kind: executed, verdict: holds,
     claim: "`toons.loads` can raise a `PanicException` on a view `dumps` itself produced, but never crashes the process; and a caught `PanicException` leaves the encoder fully usable.",
     probe: "r3_misc.py loads_hazard — 14 hazard keys x 3 shapes through dumps then loads; and r3_misc.py panic — a caught panic followed by 200 more, then a benign encode and round trip.",
