  - id: d40_installed_but_uncalled_toolset_changes_nothing
    kind: behavior
    form: test
    binds: ["interacts(run_investigation->toolset_seam)", "interacts(toon_gate->model_view).payload"]
    discharged_by: test_a_foreign_toolset_installed_but_never_called_leaves_the_run_identical
