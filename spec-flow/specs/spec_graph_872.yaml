      # `serial` per build path; note that ONE INVESTIGATION BUILDS A GATHER AGENT PER LEAD, so the
      # gather path is a fan even though each build is serial.

    # --- the capability stack the composition root actually produces --------------------
    - {from: budget_hooks,  to: toon_gate, provenance: code, multiplicity: serial}
      # OUTERMOST. It may answer a call WITHOUT calling the handler (F3) — the anti-vacuity
      # constraint on d9, and the reason f2 reading B cannot reach a refusal.
    - {from: query_capture, to: toon_gate, provenance: code, multiplicity: serial}
      # the innermost wrap hook, still OUTSIDE every WrapperToolset — which is why it discards
