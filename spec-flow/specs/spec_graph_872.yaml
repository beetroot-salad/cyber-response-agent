    positive_control: d23_query_path_is_unchanged_by_the_gate
    source: "N2 + 'The TOON text is derived, never authoritative'"
    note: >-
      Binds every surface the text could reach, per the negative rule: the gather capture, the
      queries table, the run dir at large and the reducer's `read_json_auto` table (a `.toon` file is
      not reducer-readable by any route — N2). Settled #19: the offline readers of a run that
      substituted see only JSON.
      THE TENSION WITH f5 READING A IS GONE: §7 r1 took f5 = B, so no run-dir sink is written and
      this demand stands as its plain universal — no TOON text in ANY run-dir sink, with nothing to
      re-read and no carve-out. The one place TOON text is now legitimately persisted is the wire
      log, which is not a run-dir sink this demand binds and which d15b covers.

