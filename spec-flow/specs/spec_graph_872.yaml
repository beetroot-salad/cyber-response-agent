    - "re-ground fork 2 — A RAW NUL IN MODEL-VISIBLE TEXT. Executed (R10): the payload clears the bar at 0.6125, M3 passes it, and the model reads a bare U+0000 on the substitute arm where the passthrough arm shows the six printable characters \\u0000. #851's refusal does not reach this seam — its three callers all take a model-authored bash command. A substitution therefore changes the model-visible text in a way O2 was written to forbid. A accept and record as a known divergence. B add a NUL predicate to M7's walk, which is nearly free now that the walk exists — but M7 is an AVAILABILITY control and this would be the one security predicate in it, which is worth saying out loud. Recommendation from the probing leaf: B. RESOLVED — §7 r9, READING B: add NUL to the pre-validator's refusal predicate, folded into M7's guard. One clause in a walk that already traverses every mapping key and container, and it restores O2's byte-identity for this class. Mints d64, and makes M7 carry FIVE refusal reasons rather than four — the fifth being the one security-shaped predicate in an availability control, which the design doc now says out loud. resolved_by: human"
