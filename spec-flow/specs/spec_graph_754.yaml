tests: defender/tests   # the suite this graph is the derivation of
schema_version: 1
design: "754"   # defender/docs/session-head-pointer-design.md — amends the store shipped in #705 / #744
base: 1cecad37   # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# The spec is written against the CORRECTED ground, not the design doc's body:
#   15-corrections.md R1-R3 and C1-C3 are BINDING and supersede the doc on conflict
#   (R1 proceed-with-corrections; R2 D4 halved, `selection.fold_boundary` survives;
#   R3 write-time cycle detection is a demand; C1 the open_store raise point;
#   C2 obligation 9 covers user_version 1 by name; C3 gather legs ARE session rows).
#   The four phase-C re-ground frontiers (44-probes-{tx,api,open,cons}.md, 24 executed
#   probes) OVERTURN several dispositions 45-dispositions.md recorded. Where a probe
#   refuted a premise, the artifact carries the PROBED reality and the superseded
#   classification is named in `handoff.refuted`.
#
# Name reconciliation applied here (grounding x demand-extraction x the dispositions'
# address derivations coined ids independently; unified by role+origin, and unified
# with spec_graph_705.yaml's ids because this change AMENDS that artifact):
#   `main_session_selector` (20-demands) -> actor `_main_session_analysis`
#                                     (visualize_run.py:308 — the code's own name)
#   `session.head_message_id` (20-demands) -> boundary `head_message_id`
#                                     (the column's own name; a dotted id carrying a
#                                      facet would make `X.domain` ambiguous to parse)
#   `_session_tip` + `_session_head` -> ONE removal edge (`interacts(ingest->_session_tip)`,
#                                     mode: remove) plus the column read `head_message_id`;
#                                     `_session_head` is the substitute, not a second element
#   `render` (20-demands, the fold) == `selection._fold_impl` == #705's actor `render`
#   `store_reader` is BOTH an actor and a boundary, deliberately, exactly as in #705
#   `fold_boundary` — the repo carries TWO symbols with this name (compaction.py:44, the
#                     loop-number function the driver calls, and selection.py:76, the store
#                     query the #705 suite calls). The graph cannot spell both `fold_boundary`
#                     and the axis registry already owns that string, so the actor is
#                     `selection_fold_boundary`. Recorded in handoff.deviations, not aliased.
#
# Change kinds (rules.md Procedure 1 — assigned FROM THE DESIGN; no implementation exists,
# so no code diff can supply them) are carried in the per-element comments:
# ADD on every `provenance: design` element, REMOVE on the six `mode: remove` edges,
# MODIFY where a code element's semantics change.
#
# The `gate:` block is EMPTY by design — the gate leaf writes it (phase D step 6).
# A reader seeing `evaluated: []` is looking at an artifact whose gate has not run.
#
# Fork legend (all OPEN, all routed to the human at §7; NOT resolved here):
#   FE-1/FE-2  15-corrections.md's two open residuals
#   FK-A..FK-M 45-dispositions.md section B, carried faithfully for a cold relay
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE SIGNAL CONTRACT. Resolve first; every assertion below depends on it.
  # =========================================================================

  - {id: head_move_signal_contract, kind: seam, form: test,
     discharged_by: test_head_move_signal_contract,
     binds: ["append", "head_message_id", "session_head_log", "reason.domain",
             "displaced_tip", "branch_point", "fold_history", "store_reader"]}
     # RESOLVED at §7: FK-A CONFIRMED the provisional reading rather than flipping it — the
     # names and signatures stand (`displaced_tip(store, session_id) -> int | None`,
     # `branch_point(store, session_id) -> int | None`, both `None` for the no-entry AND the
     # no-such-session case), which is why phase C's classification did not have to re-run.
     # Four points settled beyond the names: `displaced_tip` returns the MOST RECENT fold's
     # from_message_id and `fold_history` is added beside it as the ordered full-history
     # accessor; `branch_point` MUST filter `from_message_id IS NULL`; and nothing projects an
     # off-path id to content — `session/agent#seq` translation is the caller's own message-row
     # lookup, declared OUT OF SCOPE rather than left silent. FK-C settled the reason constant
     # as one unconditional membership rule (see `reason.domain` in structure).
     # PR-21 + PR-19 (both refuted/holds in the ledger): displaced_tip and branch_point have
     # NO consumer anywhere — not learning/, not evals/, not the judge page. The seam is
     # real; the motivation the design gives for it is not yet true of any reader.

  # =========================================================================
  # THE PATH READS FROM HEAD  (issue obligations 1, and the NULL-head case)
  # =========================================================================

  - {id: path_follows_head_not_insertion_order, kind: behavior, form: test,
     discharged_by: test_path_follows_head_not_insertion_order,
     binds: ["head_message_id", "interacts(store_reader->message)", "message.identity"]}
     # ISSUE-NAMED OBLIGATION 1. Grounded in B1/B2 (executed): today the path IS insertion
     # order and an off-path higher-id append evicts the tip. F5/B13: the off-path append has
     # a LIVE production shape (a gather leg appended into the main session), not only a
     # synthetic one.

  - {id: path_row_ids_is_empty_when_head_is_null, kind: behavior, form: test,
     discharged_by: test_path_row_ids_is_empty_when_head_is_null,
     binds: ["head_message_id", "head_message_id.domain.distinguished[NULL]",
             "interacts(store_reader->message)"]}
     # consensus: P116. The `ORDER BY id DESC LIMIT 1` fallback is gone, so a session with
     # rows but no head reads as empty rather than silently re-deriving a tip.
     # SCOPE, after §7 (FK-D): this is the READ contract and it is unchanged. The WRITE side of
     # the same state is now different — an append into a session that HOLDS ROWS but whose
     # head is NULL RAISES rather than silently orphaning them (`an_append_into_a_rows_but_null_head_session_raises`).
     # A no-rows, NULL-head session still reads `[]` and still accepts a linear first append.

  - {id: session_head_is_a_column_read_with_no_fork_fallback, kind: behavior, form: test,
     discharged_by: test_session_head_is_a_column_read_with_no_fork_fallback,
     binds: ["head_message_id", "interacts(ingest->message)",
             "interacts(ingest->_session_tip)"]}
     # R5 substitute for the `_session_tip` REMOVE edge: the implicit append parent becomes a
     # column read, and an explicit parent_id still wins over it. C1/B4 (executed): the
     # `fork_at_message_id` fallback is read exactly once per fork session and never again.

  # =========================================================================
  # THE FOLD  (issue obligations 2, 3) — and the promoted contradiction
  # =========================================================================

  - {id: fold_moves_head_to_frontier_and_logs_fold, kind: behavior, form: test,
     discharged_by: test_fold_moves_head_to_frontier_and_logs_fold,
     binds: ["interacts(render->session_head_log)", "head_message_id",
             "reason.domain.distinguished[fold]", "interacts(render->message)"]}
     # ISSUE-NAMED OBLIGATION 2. rejected (into the test): the call site does not decide to
     # log — `_fold_impl` issues no INSERT into session_head_log; the entry appears because
     # `append` applied the RULE to the parent and the reason it was handed.
     # RE-POINTED BY §7 (FK-D). The trigger is no longer "log iff the first inserted row's
     # parent_id is not the session's previous head" — it is "log iff the move is NON-LINEAR
     # **OR** an explicit `reason` was supplied". Under the OLD trigger this demand's "exactly
     # one log row per fold" was FALSE for a one-row path (root == head makes the frontier
     # linear), and the phase-D assembler had to scope it to a multi-row path. It no longer
     # does: `_fold_impl` always passes `reason='fold'`, so the entry is written on every fold
     # including the degenerate one, and `a_degenerate_fold_still_writes_its_log_entry` pins
     # exactly that case as its own demand. The answerers answered against the doc's rule, not
     # this one — phase E must read every log-count assertion against the NEW trigger.

  - {id: displaced_tip_survives_later_appends, kind: behavior, form: test,
     discharged_by: test_displaced_tip_survives_later_appends,
     binds: ["session_head_log.identity", "interacts(store_reader->session_head_log)",
             "head_message_id", "displaced_tip"]}
     # ISSUE-NAMED OBLIGATION 3. consensus: P77 (the log plus the message tree is the
     # reconstruction surface). fork: FK-A gates which fold's tip the helper returns.

  - {id: consecutive_folds_chain_their_log_entries, kind: behavior, form: test,
     discharged_by: test_consecutive_folds_chain_their_log_entries,
     binds: ["interacts(render->session_head_log)", "session_head_log.identity",
             "reason.domain.distinguished[fold]"]}
     # consensus: P100, P77. Entry 1 (orig tip -> frontier1, 'fold'), entry 2 (frontier1 ->
     # frontier2, 'fold'); each states what IT alone displaced. This is what makes "walk
     # parent_id back from the second fold entry's from_message_id" a real reconstruction.

  - {id: fold_reuse_leaves_head_and_the_log_untouched, kind: behavior, form: test,
     discharged_by: test_fold_reuse_leaves_head_and_the_log_untouched,
     binds: ["interacts(render->message)", "head_message_id", "session_head_log.identity",
             "message.identity"]}
     # consensus: P97. Raised from claim c18, not from the doc: `_fold_impl:48-54` returns
     # early before any append, so the whole head/log path is skipped on reuse.
     # RE-READ AGAINST §7's NEW TRIGGER (FK-D): this demand SURVIVES the trigger change, and
     # the reason it survives is worth stating rather than assuming. The new arm fires on "an
     # explicit reason was supplied" — but the reuse branch returns BEFORE `append` is called
     # at all (c18, read), so no reason is ever supplied on that path and the "or" arm cannot
     # fire. The reuse branch is the ONE legitimate no-log fold left after FK-D; the three
     # illegitimate ones (P94, P96, P55) are all closed. 45-dispositions red flag 1 named this
     # demand in FK-D's blast radius; the re-read confirms it, it does not repoint it.

  - {id: the_fold_reuse_lookup_is_scoped_by_session_and_agent, kind: behavior, form: test,
     discharged_by: test_the_fold_reuse_lookup_is_scoped_by_session_and_agent,
     binds: ["message.identity", "interacts(render->message)",
             "interacts(render->session_head_log)"]}
     # consensus: P98 + P106. Two folds at one boundary under DIFFERENT agent_ids miss each
     # other's reuse lookup: two live "boundary N" frontiers inside one session_id, each its
     # own non-linear move with its own log entry, head landing on whichever ran last. A
     # fork's fold at a boundary the parent already minted likewise misses the parent's
     # lookup. Grounded in PR-23 (executed): (session_id, agent_id, synthesized) scopes
     # `_next_seq` cleanly, and a synthesized seq=0 row coexists with an ordinary seq=0 row.
     # 45-dispositions red flag 5 — two live "boundary N" frontiers under different agent_ids
     # inside one session_id — is doc-legal under the untouched reuse key (the clause demand
     # `the_fold_reuse_key_is_unchanged`) and NOBODY HAS DECIDED IT IS WANTED. This demand pins
     # the behaviour; it does not endorse it. (§7-VERIFY D-1: an earlier version of this comment
     # claimed the question "went to §7 with FK-E and came back unchanged". It did not —
     # 70-resolutions.md's FK-E says nothing about the reuse key — and the sentence is struck.
     # The artifact recorded a human acceptance no record supported.) Under §7's new trigger
     # both folds supply `reason='fold'`, so both log — the count is unaffected by FK-D.
     # RE-POINTED at §7-VERIFY by V4: the FORK arm of this demand's test used to assert that a
     # fork's fold mints its own frontier at a boundary the parent already minted (P106's
     # consequence). V4 refuses cross-session frontier parenting, and a fork's `root` is always
     # the lineage root in the PARENT session, so that fold is now REFUSED. P106's premise — the
     # reuse key is scoped by session_id — is unchanged and is what the two-agent arm (P98)
     # observes; its two-frontiers-per-lineage consequence is now unreachable through
     # `_fold_impl`, closed by a guard rather than by a key. `handoff.forks` item (e) closes with
     # it: the shape it left OPEN cannot be reached.

  # =========================================================================
  # FORK  (issue obligations 4a, 4b, 5) — spec-only by construction until #696
  # =========================================================================

  - {id: fork_logs_null_to_branch_point, kind: behavior, form: test,
     discharged_by: test_fork_logs_null_to_branch_point,
     binds: ["interacts(fork_constructor->session_head_log)",
             "interacts(fork_constructor->head_message_id)", "head_message_id",
             "reason.domain.distinguished[fork]"]}
     # ISSUE-NAMED OBLIGATION 4a. The NULL `from_message_id` is the ONLY thing distinguishing
     # a genuine fork entry from an unearned one a bare append(reason='fork') could write
     # (FK-A / P48) — the branch-point reader must filter on it.
     # fork: FK-B (F2) — fork() acquires TWO writes (the session row carrying head, and the
     # log entry) and the doc names no transaction. B10 (executed): fork() runs on an
     # autocommit connection today; its single INSERT is atomic BY ACCIDENT.

  - {id: branch_point_survives_the_parent_folding_past_it, kind: behavior, form: test,
     discharged_by: test_branch_point_survives_the_parent_folding_past_it,
     binds: ["interacts(fork_constructor->session_head_log)", "session_head_log.identity",
             "session.parent_session_id", "branch_point"]}
     # ISSUE-NAMED OBLIGATION 4b (D2). Grounded in B5 (executed): after the parent folds past
     # the branch point, merge-base derivation returns the ROOT while the true branch point is
     # row 2 — a WRONG answer, not a missing one. That is the whole D2 argument, reproduced.

  - {id: two_forks_one_branch_point_two_entries, kind: uniqueness, form: test,
     discharged_by: test_two_forks_one_branch_point_two_entries,
     binds: ["session_head_log.identity", "session.session_id",
             "interacts(fork_constructor->session_head_log)"]}
     # ISSUE-NAMED OBLIGATION 5. consensus: P24 (the end state holds regardless of dispatch
     # timing). PR-18 (executed): there is NO uniqueness constraint over
     # (parent_session_id, fork_at_message_id) — two forks at one point coexist by design,
     # which is why FK-B's recommendation explicitly refuses to add idempotency.

  - {id: fork_accepts_any_at_message_id_and_records_it_unmodified, kind: behavior, form: test,
     discharged_by: test_fork_accepts_any_at_message_id_and_records_it_unmodified,
     binds: ["interacts(fork_constructor->session_head_log)",
             "interacts(fork_constructor->head_message_id)", "message.identity"]}
     # consensus: P59 (an off-path at_message_id), P61 (an ancestor short of head), plus the
     # FK-M settled pair P56 (a row from another session) and P57 (a synthesized frontier
     # row). Nothing restricts at_message_id; the log entry names it unmodified.

  - {id: a_forks_head_is_independent_of_the_parents_later_appends, kind: behavior, form: test,
     discharged_by: test_a_forks_head_is_independent_of_the_parents_later_appends,
     binds: ["interacts(fork_constructor->head_message_id)", "head_message_id",
             "session.session_id"]}
     # consensus: P60 ("the fork's head never moves as a side effect of the parent's later
     # appends" — the "recorded, not derived" section's point), P119, P120. Every UPDATE and
     # every log INSERT targets exactly one session_id; the shared message-id space affects id
     # VALUES, never which session's head column moves.

  - {id: a_forks_first_append_is_linear_and_adds_no_second_entry, kind: behavior, form: test,
     discharged_by: test_a_forks_first_append_is_linear_and_adds_no_second_entry,
     binds: ["interacts(fork_constructor->session_head_log)", "head_message_id",
             "session_head_log.identity"]}
     # RESOLVED at §7 (FK-H): a fresh fork's `hydrate` IS the parent's prefix — that is the
     # point of setting head at fork time — and B11 (executed) is the fact the design never
     # stated. `fork()` now SETS `last_render_len` to the inherited prefix's length, which is
     # what closes PR-24's observed duplication of all N messages;
     # `a_fresh_fork_renders_its_inherited_prefix_exactly_once` is that demand. This demand
     # keeps its own scope: the fork's first append parents onto the head fork() already set,
     # so the rule reads it as LINEAR (no reason supplied — the "or an explicit reason" arm of
     # §7's new trigger does not fire), it requires no reason, adds no second log row, and the
     # session's only entry remains the `fork` one written at fork time.

  # =========================================================================
  # THE NON-LINEARITY RULE  (issue obligations 6, 7) and its four cases
  # =========================================================================

  - {id: a_linear_turn_writes_no_log_entry, kind: negative, form: test,
     discharged_by: test_a_linear_turn_writes_no_log_entry,
     binds: ["interacts(ingest->session_head_log)", "interacts(render->session_head_log)",
             "interacts(fork_constructor->session_head_log)",
             "interacts(gather_dispatch->session_head_log)", "session_head_log"]}
     # ISSUE-NAMED OBLIGATION 6. positive control: fold_moves_head_to_frontier_and_logs_fold.
     # Binds EVERY out-edge that could reach the log — ingest, render/fold, fork, and (per
     # correction C3) the gather-leg writer — so the negative is not silently scoped to the
     # one writer someone thought of. consensus: P63 (a sibling child appended into the parent
     # session after a fork is linear against the parent's OWN head and adds nothing).
     # RE-READ AGAINST §7's NEW TRIGGER (FK-D): this demand survives, but its scope narrows to
     # an ordinary turn that is linear AND supplies NO reason. A linear move that DOES carry a
     # reason is no longer "silently unlogged" — under FK-D it is REFUSED unless it is a
     # fold/fork call, which is a raise, not an absent row. The test must therefore pass
     # `reason=None`; asserting "linear turns never log" over a reason-bearing linear append
     # would pin the pre-§7 rule.

  - {id: first_append_into_a_fresh_session_is_linear, kind: behavior, form: test,
     discharged_by: test_first_append_into_a_fresh_session_is_linear,
     binds: ["interacts(ingest->session_head_log)", "head_message_id",
             "head_message_id.domain.distinguished[NULL]", "session_head_log"]}
     # consensus: P116, P52. Rule case 1: previous head NULL and first row's parent_id NULL is
     # linear — no reason required, no log row, head lands on the new row.
     # RE-READ AGAINST §7's NEW TRIGGER (FK-D): survives unchanged, and it is the POSITIVE
     # CONTROL that keeps `an_append_into_a_rows_but_null_head_session_raises` from over-
     # reaching. FK-D makes a NULL head with ROWS an error; a NULL head with NO rows is the
     # ordinary first turn and must stay legal. The two differ only in whether the session
     # already holds rows, so the pair must be tested together or the raise will be written
     # against the wrong predicate.

  - {id: an_unexplained_non_linear_append_raises_and_writes_nothing, kind: behavior, form: test,
     discharged_by: test_an_unexplained_non_linear_append_raises_and_writes_nothing,
     binds: ["append", "reason.domain", "head_message_id", "session_head_log",
             "interacts(ingest->message)"]}
     # ISSUE-NAMED OBLIGATION 7. The refusal fails closed on all three surfaces — message row
     # absent, head unmoved, log unwritten.
     # RE-READ AGAINST §7's NEW TRIGGER (FK-D): unchanged in substance. A non-linear move with
     # no reason still raises — the new "or an explicit reason was supplied" arm only ADDS
     # logging cases, it removes none, and FK-C's membership check now runs BEFORE the
     # linearity classification, so an out-of-set reason raises here too rather than reaching
     # this branch as an absent one.
     # rejected (into the test), §7 FK-K, ACCEPTED AND DOCUMENTED: a retried identical append
     # genuinely IS non-linear once head has moved, so StoreAppendError is the rule working,
     # not a bug. Two of the three answering copies asked "is there dedup?" (no) and stopped;
     # only the third composed the rule with the head move and saw that an at-least-once retry
     # of an ORDINARY, LINEAR append raises the second time. `ingest` threads each new id as
     # the next parent, so a retried ingest append — the shape a timeout produces — hits this.
     # No dedup key is added: the design deliberately does not have one. The test's docstring
     # carries the note so the error is legible to a caller that meets it.

  - {id: a_multi_message_non_linear_append_writes_exactly_one_log_entry, kind: behavior, form: test,
     discharged_by: test_a_multi_message_non_linear_append_writes_exactly_one_log_entry,
     binds: ["append", "interacts(ingest->session_head_log)", "session_head_log.identity",
             "head_message_id", "session_head_log"]}
     # consensus: P50. The rule inspects only the FIRST row's parent_id, so the whole batch is
     # non-linear and produces exactly ONE entry; head moves to the LAST inserted id and the
     # log's to_message_id matches that new head.
     # RESOLVED at §7 (FK-J), and this demand grows the assertion rather than merely noting the
     # gap: `session_head_log` GAINS `attached_to_message_id` — the first inserted row's own
     # parent_id — so the attachment point is answerable from the log alone. Neither
     # from_message_id (the DISPLACED head) nor to_message_id (the NEW head) is that point, and
     # one of the three answering copies read from_message_id as the attachment point and was
     # wrong against the schema; the column is what makes that misreading unavailable. This is
     # the run's ONE schema change beyond the design as written, taken now because the design's
     # own "no runs exist under the current schema" makes the migration cost zero.

  - {id: an_ingest_that_fails_partway_leaves_head_on_the_last_committed_message,
     kind: behavior, form: test,
     discharged_by: test_an_ingest_that_fails_partway_leaves_head_on_the_last_committed_message,
     binds: ["interacts(ingest->message)", "interacts(ingest->head_message_id)",
             "head_message_id", "session_head_log"]}
     # consensus: P52 + P53. Each per-message append is its own transaction and each is
     # linear; head advances stepwise and durably, once per committed call. When message 3
     # fails, messages 1-2 are already durable, head is parked at message 2, the log is
     # untouched, and the next render sees the conversation through message 2 only.

  - {id: one_round_of_ingest_then_fold_contributes_exactly_one_log_row, kind: behavior, form: test,
     discharged_by: test_one_round_of_ingest_then_fold_contributes_exactly_one_log_row,
     binds: ["interacts(ingest->session_head_log)", "interacts(render->session_head_log)",
             "head_message_id", "session_head_log.identity"]}
     # consensus: P54. Head moves TWICE in one round (to the ingest tail's tip, then to the
     # frontier) and the round contributes exactly ONE log row, from the fold.

  - {id: the_store_writes_the_log_not_its_call_sites, kind: seam, form: test,
     discharged_by: test_the_store_writes_the_log_not_its_call_sites,
     binds: ["interacts(render->session_head_log)", "interacts(ingest->session_head_log)",
             "append", "session_head_log"]}
     # A log row appears from a BARE store.append(..., parent_id=<not head>, reason='fold')
     # with no fold machinery involved — the rule lives inside `append`, so neither
     # `_fold_impl` nor `ingest` needs to know the log exists.

  - {id: append_accepts_reason_as_a_keyword, kind: seam, form: test,
     discharged_by: test_append_accepts_reason_as_a_keyword,
     binds: ["append", "reason.domain"]}
     # Every existing call site keeps working unchanged; `_fold_impl` is the only one that
     # passes it. PR-5 (executed): the `str | None` annotation is UNENFORCED — this codebase
     # carries no pydantic/validate_call/typeguard anywhere in the store, so a non-string
     # reaches the membership check rather than raising at the call boundary. Whether that
     # check is a tuple (semantic raise) or a set (TypeError from `in`) decides the shape.

  # =========================================================================
  # THE CYCLE GUARD  (correction R3, BINDING)
  # =========================================================================

  - {id: append_still_refuses_a_cyclic_parent_chain_at_write_time, kind: behavior, form: test,
     discharged_by: test_append_still_refuses_a_cyclic_parent_chain_at_write_time,
     binds: ["append", "interacts(ingest->_walk_parents)", "_walk_parents",
             "head_message_id", "session_head_log"]}
     # correction R3, BINDING, and the R5 substitute for the `interacts(ingest->_walk_parents)`
     # REMOVE edge. consensus: P25, P27, P35. `_session_tip` calls `_walk_parents` purely for
     # its side effect — the write-time cycle check (F1) — and a column read cannot detect a
     # cycle. Today's probed behaviour (`append` raises CyclicParentChain) is the guarantee
     # that must not regress, and the refusal must roll back the row and the head move with it,
     # exactly as obligation 7's raise does. The ONLY existing cycle test drives `hydrate`, so
     # the loss is invisible to the suite without this demand.
     # RESOLVED at §7 (FK-I): the guard is A BOUNDED WALK FROM THE ROW'S OWN `parent_id`,
     # implicit or explicit, so coverage does not depend on which branch supplied the parent.
     # The rejected alternative — a depth cap on the head walk — covers only the implicit
     # shape, and R3's own stated invariant ("the one walk both the reader and the writer go
     # through, so a corrupted chain cannot stay invisible at write time") is preserved only by
     # the parent-anchored form. P25 and P26 are therefore ONE demand, not two, and the test
     # must drive BOTH an implicit-parent cycle and a caller-supplied explicit-parent_id cycle.

  # =========================================================================
  # THE TRANSACTION  (issue obligation 8) — every failure shape
  # =========================================================================

  - {id: head_and_log_move_in_one_transaction, kind: behavior, form: test,
     discharged_by: test_head_and_log_move_in_one_transaction,
