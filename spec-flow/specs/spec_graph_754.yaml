     # consensus: P118, the seven-point walk, stated in full so phase E does not re-derive it:
     # (1) head NULL, path [], log 0; (2) head=row1, path=[row1], log 0 (linear, rule case 1);
     # (3) head advances linearly, log 0; (4) head=frontier1, log 1 (old tip -> frontier1,
     # 'fold'); (5) head advances off frontier1, log 1; (6) head=frontier2, log 2
     # (head-at-that-point -> frontier2, 'fold'); (7) fork off frontier2 -> head_B=frontier2,
     # path_B = the parent's prefix through frontier2 (F4/B11, NOT []), log_B 1
