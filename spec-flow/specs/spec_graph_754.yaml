  - {id: branch_point_requires_a_fork_reason_not_just_a_null_origin,
     kind: behavior, form: test,
     discharged_by: test_branch_point_requires_a_fork_reason_not_just_a_null_origin,
     binds: ["branch_point", "session_head_log.identity",
             "reason.domain.distinguished[fork]", "reason.domain.distinguished[fold]",
             "interacts(store_reader->session_head_log)"]}
     # §7-VERIFY W1. THE PREMISE, which is the part the first round left unwritten and is why
     # this finding survived a round looking correct: FK-A(c)'s "`branch_point` MUST filter
     # `from_message_id IS NULL`" was sound ONLY BECAUSE a NULL origin was unreachable except
     # through `fork()` — every other head move displaces something, so its origin is the row it
     # displaced. Nothing recorded that dependency, in the demand, in `handoff.forks` or in
     # 70-resolutions.md, so when V1 broke it the filter kept reading as complete.
     # HOW V1 BROKE IT: a linear move may now carry a reason when the caller mints a frontier,
     # and a session whose path is EMPTY has a NULL previous head — so folding it writes an
     # entry with `from_message_id` NULL and `reason` 'fold'. PR-6 (executed) is what makes that
     # shape real rather than hypothetical: `_fold_impl` already reads `root = ids[0] if ids
     # else None` and mints a parentless frontier instead of raising. A reader filtering on
     # origin alone hands that frontier back as the branch point of a session nobody forked —
     # finding 2's failure, reached through the fold door instead of the append door.
     # THE FIX IS AT THE READER, not only at the writer: `from_message_id IS NULL AND reason =
     # 'fork'`. `a_fold_on_an_empty_path_is_refused` closes the store's own API route, but `reason_is_a_python_closed_set_not_a_sql_check`
     # pins that the schema constrains nothing, so a raw connection writes the same row
     # regardless — and this demand's own sibling argument applies verbatim: the reader is the
     # one that survives a writer nobody controls. Rejected: closing the writer door alone.
     # `displaced_tip` on such a session returns NULL and is INDISTINGUISHABLE from "never
     # folded" — stated here because it is the same premise breaking in the same place.

  - {id: a_fold_on_an_empty_path_is_refused, kind: behavior, form: test,
     discharged_by: test_a_fold_on_an_empty_path_is_refused,
     binds: ["interacts(render->message)", "interacts(render->session_head_log)",
             "message.identity", "head_message_id", "session_head_log"]}
     # §7-VERIFY W2, and the coverage V4 dropped when it subsumed FK-H's letter. V4's predicate
     # asks whether the row the frontier would parent onto belongs to ANOTHER session; on an
     # EMPTY path there is no such row, so `root is None` reads either way and the swap left the
     # case unpinned in both directions. FK-H's literal wording ("a session with no append of
     # its own") had covered it by accident. §7-VERIFY pins refusal: a fold that mints a
     # parentless frontier is not a fold, and refusing restores the letter's coverage at no
     # cost. PR-6 (executed) records today's behaviour — a parentless frontier is minted and no
     # IndexError is raised — so this demand is a CORRECTION and its test is red against the
     # base for that reason, not because the fold path is missing.
     # This does NOT close W1 on its own: the raw-connection route to the same NULL-origin row
     # stays open whatever the fold path decides, which is why the reader is respecified too.

  # =========================================================================
  # WAIVERS — minted at §7, examined noes, kept in the artifact
  # =========================================================================

  - id: the_post_durable_commit_sliver_is_out_of_scope
    kind: behavior
    form: waiver
    outcome:
      nl: "A COMMIT that raises after the data has already reached durable storage leaves append's caller believing the call failed while the row, the head move and the log entry may already be visible to the next reader. This spec does not test that sliver and obligation 8's demand keeps its unqualified assertion. It is a pre-existing property of append's own commit/rollback discipline (session_store.py:281-293) that this change neither creates nor worsens: the head UPDATE and the log INSERT ride inside the same transaction as the row insert, so the ambiguity's blast radius is exactly what it is today. A fix means restructuring commit handling for a failure mode nobody has observed."
    binds: ["append", "session_head_log", "head_message_id"]
    cites: [PR-9, B8]
    rejected:
      - nl: "Carving an exception into head_and_log_move_in_one_transaction was rejected: it would weaken the run's central observable ('there is no state in which head moved and its log entry is missing') to buy coverage of a case the change does not introduce. An honest waiver costs less and hides less."

  - id: the_pointer_path_is_not_confined_to_the_run_dir
    kind: parity
    form: waiver
    outcome:
      nl: "The pointer-file lane enforces no containment and this spec does not demand one, so its constraints slot is the EMPTY list rather than the confine its two sibling vias carry. resolve_store_path is a bare Path(json_value) with no prefix check, no realpath comparison, no suffix requirement and no CASE_ID_RE re-validation, and open_store_for_read checks only .is_file(); a pointer naming a real sqlite file wholly outside run_dir opened and served a live query under execution, and a ../.. traversal opened too once CWD made it resolve. Confinement is declined HERE because it would reopen a settled #705 decision inside an unrelated change, and because the write side is genuinely closed: one production write path with a uuid4 case_id, no call site substituting store_factory, and a gated agent whose write allowlist is investigation.md and report.md only. Naming the slot confine would misattribute those external guarantees to reader code that performs no check at all."
    binds: ["session_store.access[pointer-file]", "session_store",
            "interacts(visualize_run->session_store_pointer)"]
    cites: [PR-25]
    rejected:
      - nl: "Two confinement targets were considered and both declined. Confining to the directory currently holding the pointer file breaks the named relocation contract test_store_driver_705.py:191-197 asserts. Confining to the ORIGINAL runs_base tree regardless of where the pointer now sits is conceivable but is not implemented, not tested, and is a #705 access-policy design question rather than a consequence of the head pointer."
      - nl: "Whether any OTHER write path can reach session_store_pointer.json — a learning-loop worker, persist.py, a manual operator edit, a future capability — was explicitly out of PR-25's scope and remains an unrun census. It is named here rather than left as a silent assumption behind the waiver."

  - id: the_caller_cannot_tell_a_reused_frontier_from_a_displaced_boundary
    kind: behavior
    form: waiver
    outcome:
      nl: "A fold whose boundary names a row an earlier fold already displaced is not detected and not reported: the reuse lookup is keyed on the session and never on the path, so nothing checks whether the target is still reachable from head, and the caller cannot tell whether a fold happened at all. This spec does not test it and does not fix it. It is a downstream consequence of the path-blind counting FK16 / #753 owns, which correction R2 leaves explicitly inherited by fold_boundary and unfixed here, and fixing it inside this change would pull path-scoped counting into a scope the design's own scope section excludes."
    binds: ["message.identity", "interacts(render->message)", "_default_boundary"]
    cites: [c18, B3]
    rejected:
      - nl: "Silence was rejected. The judge's own note is that 'the caller cannot tell whether a fold happened' is a WORSE failure than the over-count it stems from, so it is recorded as a known deferred consequence with a doc sentence owed, not carried forward as an unexamined gap."

  # =========================================================================
  # DELIBERATE PROSE DEFERRALS — scope exclusions, recorded not defaulted
  # =========================================================================

  - id: the_fold_reuse_key_is_unchanged
    kind: parity
    form: clause
    outcome:
      nl: "The fold's reuse key remains (session_id, agent_id, synthesized, seq=boundary) — FK10, settled and tested in #705 — because head changes where a path starts, not when a frontier is reused."
    binds: ["message.identity"]
    rejected:
      - nl: "Re-testing the key here was rejected as duplication: #705's test_one_frontier_row_per_fold_boundary already pins it executably. The one part this change genuinely puts at risk — what head and the log do on the reuse branch — is minted as its own form:test demand, fold_reuse_leaves_head_and_the_log_untouched."

  - id: last_render_len_and_pending_stamps_stay_per_session
    kind: parity
    form: clause
    outcome:
      nl: "last_render_len and pending_stamps remain per-session and are not moved onto the head or into the log by this change."
    binds: ["session"]
    rejected:
      - nl: "An executable form was rejected because it would assert the absence of an edit rather than a behaviour. Recorded so the phase-F reconciler can see the exclusion was examined, not forgotten. Consensus P110 binds this clause verbatim from the doc's own Out-of-scope section; PR-24 (executed) shows the exclusion has a real cost — a fresh fork's last_render_len of 0 against an inherited prefix makes ingest duplicate the whole tail — which is FK-H, not this clause."

  - id: gather_boundary_is_not_edited_in_this_change
    kind: parity
    form: clause
    outcome:
      nl: "The gather_boundary view keeps its missing session-scoping predicate (FK16 / #753): this change is what makes the real fix — path scoping via a recursive walk from head — expressible in SQL, but the view's DDL is not edited here."
    binds: ["gather_boundary", "interacts(store_reader->gather_boundary)"]
    rejected:
      - nl: "Testing it was rejected because the only executable form is 'the view text is byte-identical', which pins the wrong thing — it would fail on any innocuous reformatting and pass on a wrong predicate. Flagged for §7: a scope exclusion over a KNOWN-BROKEN element is the shape that gets forgotten. Consensus P107 binds it — the view has no path predicate, so a folded turn's leads still contribute."

structure:

  # The axis registry. Every key_axes / interpolates member below is drawn from it.
  # Unified with spec_graph_705.yaml's registry (case_id, session_id, agent_id, seq,
  # synthesized, run_id, fold_boundary carry over verbatim); `message_id` and `reason` are
  # NEW and are what this change makes interpolable — head and the log both vary on a
  # message id, and the log additionally on the reason.
  axes: [case_id, run_id, session_id, agent_id, seq, synthesized, message_id, reason,
         fold_boundary]

  actors:
    # --- the delta (design provenance == ADD or MODIFY-into-the-delta) ---
    - {id: render,           frame: leg,         provenance: design}   # selection._fold_impl / selection.render — the fold path (MODIFY: passes reason='fold', moves head)
    # --- the grounded neighborhood (provenance: code) ---
    - {id: ingest,           frame: leg,         provenance: code}     # selection.ingest, selection.py:112 (MODIFY: parents on head, not on the derived tip)
    - {id: fork_constructor, frame: leg,         provenance: code}     # StoreHandle.fork, session_store.py:223 (MODIFY: sets head + writes the fork log entry). NO production caller (C6/c15) — spec-only by construction until #696, which is why no drives edge reaches it
    - {id: store_reader,     frame: leg,         provenance: code}     # hydrate / path_row_ids / synthesized_flags (MODIFY: the walk starts from head) — see the boundary of the same name
    - {id: run_investigation, frame: composition, provenance: code}    # driver.py (MODIFY: open_store's version check now fires during setup, outside the StoreError handler) — profile alias run/driver
    - {id: gather_dispatch,  frame: composition, provenance: code}     # driver.py:424-432 _build_gather + tools_gather.py:287 (profile alias tools_gather). C3: mints one `session` row per dispatched leg, so every leg carries a head
    - {id: visualize_run,    frame: leg,         provenance: code}     # scripts/visualize/visualize_run.py — the SECOND PROCESS, the only cross-process reader (C11/F6)
    - {id: _main_session_analysis, frame: leg,   provenance: code}     # visualize_run.py:308-337 (MODIFY: root-of-lineage replaces the rowid heuristic) — the demands' `main_session_selector`
    - {id: write_trace,      frame: leg,         provenance: code}     # observe.py:210-211, hydrate x2 — an in-process store reader the head change moves under
    - {id: selection_fold_boundary, frame: leg,  provenance: code}     # selection.py:76 `fold_boundary` — SURVIVES under R2. Renamed in the graph because compaction.py:44 owns the same symbol name; see the header
    - {id: test_selection_705, frame: leg,       provenance: code}     # tests/test_selection_705.py:684-712 — the live consumer C2 found, discharging spec_graph_705.yaml:424

  boundaries:
    # ---- the shared root ---------------------------------------------------
    - id: session_store
      provenance: code          # MODIFY: the schema version bump, the new table, the moved check
      facets:
        identity:
          key_axes: [case_id]
          evidence: {nl: "one SQLite file per case_id at store_path_for(case_id, runs_base) = runs_base.parent / 'sessions' / f'{case_id}.db' (session_store.py:480-484) — the path template interpolates exactly one axis. Established by `spec-graph trace resource session_store` after declaring the sink in .claude/spec-flow.json, reconciled against grep -rn over defender/ for each symbol (10-brief.md, shared roots). OC-2 (census): case_id is a fresh uuid4().hex minted once per run(), so the production writer never meets a pre-existing file."}
          sharing: unique-key
        access:
          constraints_by_via:
            fs:           {trust: operator, constraints: [confine]}   # driver.py:452 -> open_store, the write-capable handle. PR-13: the ONLY production write path
            api:          {trust: derived,  constraints: [confine]}   # visualize_run.py:317 -> open_store_for_read. OC-1: performs NO version check today, so C1's fail-closed-at-open is writer-only
            pointer-file: {trust: derived,  constraints: []}          # RESOLVED at §7 round 4 from `unknown` to the EMPTY list — an examined no, carried by the waiver demand `the_pointer_path_is_trusted_verbatim_across_a_relocated_run_dir` and probed by PR-25 (executed): `resolve_store_path` is a bare `Path(json_value)` with no prefix check, no realpath comparison, no suffix requirement and no CASE_ID_RE re-validation, and `open_store_for_read` checks only `.is_file()`. A pointer naming a real sqlite file wholly outside run_dir opened and served a live query; a `../..` traversal opened too once CWD made it resolve. `confine` would MISATTRIBUTE an external safety property (uuid4 case_id on the write side, plus the gated agent's `investigation.md`/`report.md` allowlist at driver.py:240) to reader code that performs no check at all. `[]` is the honest value.

            # #705's `bash`, `defender-sql` and `host-walk` cells on this same boundary are
            # UNCHANGED by this change and live in spec_graph_705.yaml; they are deliberately
            # not restated here, because declaring a cell this delta does not touch would mint
            # an obligation no demand in this spec can pay.
    - id: runs_base
      provenance: code
      facets: {}                # the store file's SIBLING, not its parent (#705 R1) — declared so the path template's other half resolves

    # ---- the two tables ----------------------------------------------------
    - id: message
      provenance: code          # MODIFY: which rows are ON THE PATH changes, the table does not
      facets:
        identity:
          key_axes: [session_id, agent_id, synthesized, seq]
          evidence: {nl: "#705's UNIQUE (session_id, agent_id, synthesized, seq), re-verified here by PR-23 (executed): every (session_id, agent_id, synthesized) key counts 0,1,... independently across two sessions and two agent_ids in one file, and a synthesized fold row at seq=0 coexists with the ordinary seq=0 row on the same session/agent. Order is the parent chain, never seq (B1/B2, executed)."}
          derivations:
            - {value: seq, fn_of: fold_boundary, injective: true}   # the synthesized frontier row's seq IS the fold boundary (selection.py:66) — this is what the reuse key keys on
          sharing: unique-key
    - id: session_head_log
      provenance: design        # ADD — the new table
      facets:
        identity:
          key_axes: [session_id, message_id, reason]
          evidence: {nl: "read off the design's own DDL (STRICT: id INTEGER PRIMARY KEY, session_id TEXT NOT NULL REFERENCES session, from_message_id INTEGER REFERENCES message and nullable, to_message_id INTEGER NOT NULL REFERENCES message, reason TEXT NOT NULL) and verified satisfiable verbatim on this connection by B9 (executed), PLUS the one schema change §7 added beyond the design as written: FK-J mints `attached_to_message_id INTEGER REFERENCES message(id)`, the first inserted row's own parent_id, because `from_message_id` is the DISPLACED HEAD and reads misleadingly as the attachment point — one of the three answering copies made exactly that error. This is the READER's key, NOT a schema-enforced one: the design declares NO UNIQUE index on the log at all, and PR-18 (executed) confirms the only unique index on `session` is its primary key — so two identical fold entries are constructible (FK-A / P89) and the rowid is the only true discriminator."}
          derivations:
            - {value: to_message_id,         fn_of: message_id, injective: true}
            - {value: from_message_id,       fn_of: message_id, injective: true}
            - {value: attached_to_message_id, fn_of: message_id, injective: true}   # FK-J, §7 round 3 — ADDED to the design. The window is now: "no runs exist under the current schema" means no migration cost.
          sharing: serialized-append
    - {id: session,                   provenance: code, facets: {}}   # MODIFY: gains head_message_id, loses fork_at_message_id
    - {id: session.session_id,        provenance: code, facets: {}}
    - {id: session.parent_session_id, provenance: code, facets: {}}
    - {id: session.agent_id,          provenance: code, facets: {}}
    - {id: session.fork_at_message_id, provenance: code, facets: {}}  # REMOVE (D3) — C1: no live reader outside _session_tip, which also goes
    - {id: session.truncated_by,      provenance: code, facets: {}}   # MODIFY (§7 FK-G): the handled `truncated_by="store"` exit the setup wrapper now routes a StoreError through
    - {id: session.last_render_len,   provenance: code, facets: {}}   # MODIFY (§7 FK-H): fork() now SETS it to the inherited prefix's length, which is what closes PR-24's duplication
    - {id: gather_boundary,           provenance: code, facets: {}}   # the SQL view, deliberately untouched (FK16 / #753)
    # ---- the elements the §7 resolutions reach OUTSIDE session_store.py -----
    - {id: session_store_pointer,     provenance: code, facets: {}}   # run_dir/session_store_pointer.json — written by write_case_pointer (session_store.py:528), read by resolve_store_path (:534). The cross-process leg PR-25 probed; C11 classified it by hand because no import walk resolves it
    - {id: open_store_for_read,       provenance: code, facets: {}}   # session_store.py:515 (MODIFY, §7 FK-G): gains the same version check open_store gets — OC-1 refuted "it version-checks", and per C11 the reader is the ONLY opener that ever meets a file it did not create
    - {id: main_session_rowid_fallback, provenance: code, facets: {}} # REMOVE (§7 FK-F): visualize_run.py:328's bare `ORDER BY rowid LIMIT 1`, or-chained after the query root-of-lineage replaces. D3 makes it unreachable by construction, and a branch no test can reach is worse than none

    # ---- the third read helper §7 added (FK-A(a)) ---------------------------
    - {id: fold_history, provenance: design, facets: {}}   # ADD — an ORDERED accessor over the session's fold entries. §7 settled the capability, not the spelling: "most recent" alone makes the FIRST fold's tip unreachable through `displaced_tip`, which is exactly the addressability #705 was sold on, and P77's reconstruction use case needs every entry

    # ---- the new column, as its own address --------------------------------
    - id: head_message_id
      provenance: design        # ADD — `session.head_message_id INTEGER REFERENCES message(id)`
      facets:
        domain:
          type: int
          refinement: {nl: "the row id of the session's current head. SQL NULL means the session has no head; a fresh session starts NULL and a forked session is set to the branch point AT FORK TIME. PR-8 (executed) confirms the declared FK is enforced on the UPDATE path as well as on INSERT, and P21 (3/3) records what the FK does NOT do — it never confines the referenced row to the owning session."}
          default: "NULL"       # the DDL default: a fresh `session` row carries no head. Written as the string NULL deliberately, so it cannot be read as a silent missing value.
          distinguished: ["NULL"]
          falsy_valid: false    # 0 is NOT a valid head: SQLite rowids start at 1 and the declared FK demands an existing message row, so the falsy int member is unreachable. The un-set state is SQL NULL, which is the distinguished member above and is emphatically valid — the two must not be conflated by an `if head:` test, which is exactly what the repo's anchored-default convention forbids. No probe attempted an explicitly-supplied id 0; recorded so the reading is checkable rather than assumed.
          documented_alternatives: []

    # ---- valued inputs -----------------------------------------------------
    - id: user_version
      provenance: code          # MODIFY: SCHEMA_VERSION 1 -> 2, and (C1) the check moves into open_store
      facets:
        domain:
          type: int
          refinement: {nl: "PRAGMA user_version. c13: SCHEMA_VERSION is 1 today; this change bumps it to 2 with no migration. B6 (executed): a stale file OPENS CLEANLY and fails only at first read, and open_store does not re-stamp a non-fresh file (the `if fresh:` guard at :510 held with user_version left at 99). #705 settled 0 as the UN-SET sentinel rather than 'version 0'."}
          default: 0            # the un-set sentinel a never-versioned file reads (#705 R17, carried)
          distinguished: [0, 1, 2, 3]
          falsy_valid: false
          documented_alternatives: []
    - id: reason
      provenance: design        # ADD — `append(..., reason: str | None = None)` and the log's reason column
      facets:
        domain:
          type: str
          refinement: {nl: "the head-move reason, validated in Python against a module-level closed set rather than a SQL CHECK, so a third reason (rewind, replay) stays a Python edit. F2/FK-C: the doc names NEITHER the constant NOR its shape; the provisional reading is HEAD_MOVE_REASONS = ('fork','fold') in session_store, mirroring the existing ROLES = ('send','analysis','actor') at session_store.py:31. PR-5 (executed) shows the container choice is load-bearing: `role not in ROLES` against a tuple gives a semantic raise for an unhashable value, while the same check against a frozenset raises TypeError from inside the check."}
          default: "None"       # the kwarg's Python default, written as a string so it is not read as a silent null
          distinguished: [fork, fold, empty-string]
          # `empty-string` was the gate's one R4 hole — DECIDED at §7 round 1 by FK-C's single
          # unconditional rule: membership is validated BEFORE the linearity classification
          # whenever `reason is not None`, exact match, `is not None` as the absent sentinel.
          # So `''`, `'Fork'`, `'rewind'` and `123` all raise StoreAppendError on linear and
          # non-linear moves alike. The member is now BOUND, by
          # `reason_membership_is_validated_before_linearity_classification`; `gate.holes[0]`
          # carries its `resolved_to`.
          falsy_valid: true     # the falsy member `None` IS valid and IS the default: a linear append carries no reason. That is precisely why an `if reason:` check would be wrong (the repo's own "prefer `is not None` over `or`" convention), and precisely why FK-C had to decide '' separately — which it now has, as a raise.
          documented_alternatives: []

    # ---- the reader surface ------------------------------------------------
    - id: store_reader           # same id as the actor, deliberately, exactly as in #705
      provenance: code           # MODIFY: every role's projection now starts from head
      facets:
        access:
          constraints_by_via:
            send:              {trust: derived, constraints: [truncate-at-last-complete-pair]}
            analysis:          {trust: derived, constraints: []}
            actor:             {trust: derived, constraints: [projection]}
            synthesized-flags: {trust: derived, constraints: []}   # C8 (refuted as an assumption): synthesized_flags has NO production consumer at all — only the noqa'd re-export at selection.py:23 — so its _check_schema_version call is reachable in production only through hydrate

    # ---- the two new read helpers (FK-A: names PROVISIONAL) -----------------
    - {id: displaced_tip, provenance: design, facets: {}}   # ADD, provisional id — session_store.displaced_tip(store, session_id) -> int | None
    - {id: branch_point,  provenance: design, facets: {}}   # ADD, provisional id — session_store.branch_point(store, session_id) -> int | None
      # NEITHER carries an in-edge, and that is the finding, not an omission: PR-21 (census,
      # REFUTED) — zero routes from learning/ or evals/ to the store by ANY route (import,
      # path grep, pointer file, subprocess, adapter, CLI) — and PR-19 (census) — the only
      # production read of message/message_payload anywhere is `hydrate`, which is
      # path_row_ids by construction. The design's stated motivation ("addressable off-path
      # for the judge and the learning loop") has NO consumer on either side of this change.

    # ---- the write seam ----------------------------------------------------
    - {id: append, provenance: code, facets: {}}   # MODIFY: gains `reason`, the non-linearity rule, the head UPDATE and the conditional log INSERT, all inside the EXISTING BEGIN IMMEDIATE

    # ---- what the change deletes (R5's removal targets) ---------------------
    - {id: _session_tip,             provenance: code, facets: {}}   # REMOVE from the write path — session_store.py:343, C5: exactly one caller (append's parent fallback)
    - {id: _walk_parents,            provenance: code, facets: {}}   # the WRITE-TIME call is removed (F1); the read-path call inside path_row_ids survives
    - {id: _default_boundary,        provenance: code, facets: {}}   # REMOVE as _fold_impl's placeholder default ONLY (R2); C3: two callers, not one
    - {id: _migrate_session_columns, provenance: code, facets: {}}   # REMOVE (D3) — B7: silently re-shapes a pre-existing file today, with no version check and no error

  interacts:
    # ---- the store file and its two processes ------------------------------
    - {from: run_investigation, to: session_store, mode: invoke, via: fs, provenance: code}
    - {from: visualize_run,     to: session_store, mode: read,   via: pointer-file, provenance: code}
    - {from: store_reader,      to: session_store, mode: read,   via: api, provenance: code}
    - {from: run_investigation, to: runs_base,     mode: read,   via: fs,  provenance: code}
    # ---- the version check, before and after C1 ----------------------------
    - {from: run_investigation, to: user_version, mode: read, via: fs,  provenance: design}   # ADD (C1): the check moves into open_store, which runs during SETUP
    - {from: store_reader,      to: user_version, mode: read, via: api, provenance: code}     # the hydrate-time check that exists today (C4)
    - {from: run_investigation, to: _migrate_session_columns, mode: remove, via: api, provenance: design}   # REMOVE (D3)
    # ---- the session row ---------------------------------------------------
    - {from: run_investigation, to: session, mode: write, via: api, provenance: code, interpolates: [session_id, agent_id]}   # new_session, driver.py:560 (main) and :428 (per leg)
    - {from: gather_dispatch,   to: session, mode: write, via: api, provenance: code, interpolates: [session_id, agent_id]}   # C3: one session row per dispatched leg
    - {from: fork_constructor,  to: session, mode: write, via: api, provenance: design, interpolates: [session_id, message_id]}
    - {from: _main_session_analysis, to: session, mode: read, via: api, provenance: design}   # MODIFY: root-of-lineage replaces `agent_id='main' ORDER BY rowid LIMIT 1`
    - {from: fork_constructor, to: session.fork_at_message_id, mode: remove, via: api, provenance: design}   # REMOVE
    # ---- the head column ---------------------------------------------------
    - {from: ingest,           to: head_message_id, mode: write, via: api, provenance: design, interpolates: [session_id, message_id]}
    - {from: render,           to: head_message_id, mode: write, via: api, provenance: design, interpolates: [session_id, message_id]}
