  #   FE-1 -> FK-E  (reading (a): `_default_boundary` stays private; only `_fold_impl`'s
  #                  `if boundary is None` fallback is deleted; the doc's D4 sentence is what
  #                  gets corrected, not the code)
  #   FE-2 -> FK-E  (fails closed: `boundary` REQUIRED on `_fold_impl`; `selection.fold` keeps
  #                  its `int | None = None` signature and RAISES ValueError on None; the five
  #                  call sites pass an explicit boundary)
  #   FK-A -> round 1: provisional names and signatures CONFIRMED, not flipped — which is why
  #                  demand #0 is no longer provisional and phase C did not have to re-run.
  #                  Four points settled: most-recent `displaced_tip` PLUS a `fold_history`
  #                  ordered accessor; `None` for both no-entry and no-such-session;
  #                  `branch_point` MUST filter `from_message_id IS NULL`; off-path-id-to-
  #                  content projection declared OUT OF SCOPE. New demands 4, 5.
  #   FK-B -> round 1: fork() gets the same BEGIN IMMEDIATE. No idempotency. New demand 1.
  #   FK-C -> round 1: ONE unconditional membership rule, validated before the linearity
  #                  classification and before the empty-batch short-circuit. Closes five of
  #                  seven forks and `gate.holes[0]`. New demands 2, 3.
  #   FK-D -> round 1: THE RULE'S TRIGGER CHANGES — log iff the move is non-linear OR an
  #                  explicit reason was supplied; a reason on a linear non-fold/fork move is
  #                  refused; an append into a rows-but-NULL-head session RAISES. Closes P94,
  #                  P96 and the P55 promotion together. New demands 6, 7. The heaviest
  #                  downstream edit in the run — see handoff.deviations.
  #   FK-E -> round 2: FE-1 (a) + FE-2 fails closed; the over-count stays inherited and
  #                  unfixed (FK16 / #753); P99 becomes a recorded waiver.
  #   FK-F -> round 2: delete the :328 rowid fallback; the root-of-lineage query RAISES on 0 or
  #                  >1 rows rather than LIMIT 1-ing P90's ambiguity away. New demand 12.
  #   FK-G -> round 2: check FIRST (after connect, before any DDL or the WAL pragma), on BOTH
  #                  openers, and WRAP THE SETUP CALL so a StoreError ends the run through the
  #                  handled truncated_by="store" exit. New demands 8, 9, 10.
  #   FK-H -> round 2: the fresh fork's prefix is the intended semantics and is stated in the
  #                  doc; fork() sets `last_render_len` at fork time, closing PR-24's measured
  #                  duplication; `_fold_impl` refuses a fold on a session with no append of
  #                  its own. New demand 11.
  #   FK-I -> round 3: the guard is a BOUNDED WALK FROM THE ROW'S OWN parent_id, implicit or
  #                  explicit. P25 and P26 become one demand, not two.
  #   FK-J -> round 3: `session_head_log` GAINS `attached_to_message_id`. The run's ONE schema
  #                  change beyond the design as written.
  #   FK-K -> round 3: accepted and DOCUMENTED as a `rejected:` note on obligation 7's demand.
  #                  No dedup key.
  #   FK-L -> round 3: WAIVER — the post-durable COMMIT sliver is out of scope and obligation
  #                  8's demand stands unqualified.
  #   FK-M -> round 4: the 20 settled silent branches accepted EN BLOC, each doc-verbatim or
  #                  ledger-backed, standing as classified with their evidence in
  #                  45-dispositions.md §FK-M for a reviewer to overrule at PR time.
  #   PR-25 -> round 4: WAIVER plus a demand pinning the deliberate relocation contract;
  #                  `pointer-file`'s constraints resolve to `[]`, closing the last `unknown`.
  # Waivers minted: 3. Declined obligations: 0. Forks left open: 0.
  forks:
    - "FE-1 (15-corrections.md, OPEN) — how is `_default_boundary` reconciled with `fold_boundary`? R2 keeps `fold_boundary`, but `fold_boundary` (selection.py:76) calls `_default_boundary` UNCONDITIONALLY — it is not a fallback there — so 'delete _default_boundary' and 'keep fold_boundary' cannot both hold literally. Two readings, identical semantics, different diffs: (a) `_default_boundary` stays as a private helper and only `_fold_impl`'s `if boundary is None` fallback is deleted; (b) the COUNT(*) is inlined into `fold_boundary` and `_default_boundary` is deleted by name. The judge recommends (a). Not decided on the spine."
    - "FE-2 (15-corrections.md, OPEN) — what does `selection.fold(boundary=None)` mean once `_fold_impl`'s fallback is gone? `fold`'s `boundary: int | None = None` signature has no defined behaviour and five existing call sites pass no boundary (test_selection_705.py:562, 612, 614, 645, 703). Readings: raise on None (fail closed, matching 'no production path should take the placeholder'); keep the default only for the reuse lookup; or make `boundary` required and update the call sites. The judge recommends required on `_fold_impl` with `fold` raising ValueError on None. Not decided on the spine."
    - "FK-A (F1) — the two log readers are unnamed, untyped, and their edges undefined. Premises P72, P73, P74, P75, P48 (forks) and P76, P79, P81, P89 (silent branches). The doc's ENTIRE specification of the new read surface is one sentence: 'New reader helpers, both one-liners over the log: the displaced tip of a fold, and a session's branch point.' No names, no module, no signature, no return type, no behaviour when the session has no matching entry, and no statement of which fold's tip is returned when a session has folded more than once. Demand #0 asserts against the provisional reading and three demands re-point if it changes. The multi-fold choice is NOT cosmetic: 'most recent' makes the FIRST fold's tip unreachable through the helper, which is precisely the addressability #705 was sold on. P48 is the sharpest observation in the whole set — a bare append(parent_id=<not head>, reason='fork') IS logged as an ordinary non-linear move with from_message_id = the previous head, NOT NULL, so an unearned `fork` row is distinguishable from a genuine one ONLY if the reader is specified to filter on `from_message_id IS NULL`. Judge recommendation (not adopted): take the provisional names; settle (a) displaced_tip returns the MOST RECENT fold's from_message_id with a second ordered accessor for the full history, since P77's learning-loop use case needs every entry; (b) None for both the no-entry and no-such-session cases; (c) the branch-point reader MUST filter on from_message_id IS NULL; (d) state plainly that nothing projects an off-path id to content and that session/agent#seq translation is the caller's own message-row lookup. OPEN."
    - "FK-B (F2) — fork() performs two writes with no transaction named. Premises P10 (fork), P49, P62 (silent branches). Obligation 8 states the one-transaction guarantee for `append` ONLY. Under this design fork() acquires two writes — the session row carrying head_message_id, and the `fork` log entry — and the doc names a transaction for neither. B10 (executed) is the ground: fork() runs on an autocommit connection today and its single INSERT is atomic BY ACCIDENT; one write was accidentally atomic, two are not. A fault between them leaves a session with a head and NO branch-point record — the exact unreachable-lineage-without-a-record state the design's own principle forbids, and the state D2's whole argument says derivation gets wrong. Judge recommendation (not adopted): wrap fork()'s two writes in the same BEGIN IMMEDIATE shape `append` uses and mint a demand; do NOT take idempotency on (P62), because 'two forks from one point' is a shape the design deliberately allows — PR-18 confirms no uniqueness constraint exists — so a uniqueness constraint would break obligation 5. Demands 4a, 4b, 5 and 8 all sit on fork(), which has NO production caller today (C6/c15), so nothing surfaces this until #696. OPEN."
    - "FK-C (F2/F3) — the `reason` domain: the constant, membership, and every off-nominal value. Premises P39, P41, P42, P43, P44, P45, P47, P32 (forks); P46 dropped and cross-referenced here. The doc says `reason` is 'validated in Python against a module-level closed set, not a SQL CHECK' and names {fork, fold}. It names neither the constant nor its shape, and states NO outcome for any value that is not exactly a member. Seven distinct off-nominal values were enumerated and every one is doc-silent: out-of-set on a non-linear move (F3(a), raise vs coerce, named explicitly as unresolved); out-of-set on a LINEAR move; reason='' (copy1 names the trap precisely — the repo's own 'prefer is not None over or' convention is exactly what an `if reason:` check would violate); reason='Fork' (exact-match vs case-normalised membership is never stated); a reason for a multi-message batch (one entry per call is an inference, not a decision); reason='fold' on an arbitrary rewind (indistinguishable in the log from a genuine compaction); messages=[] with a reason (the short-circuit returns before any row exists to classify). P32 adds an out-of-set reason inserted by a raw connection, which the schema permits BY DESIGN with no stated reader behaviour. Judge recommendation (not adopted): settle it as ONE rule — validate membership unconditionally, before the linearity classification, whenever `reason is not None` — which kills five of the seven outright and makes the anchored-default convention load-bearing; leaving P39 (validate before the empty-batch short-circuit) and P47/P32 (do NOT check a reason against the move's shape) as the two genuine decisions. This fork is why `reason.domain.falsy_valid` is `unknown` in the artifact. OPEN."
    - "FK-D (F3(b)) — the rule can leave lineage unreachable with NO log entry. Premises P40, P94 (forks), P85, P96 (silent branches), and P55 PROMOTED OUT OF CONSENSUS. The rule is 'log iff the first inserted row's parent_id is not the session's previous head' — it keys on linearity alone and the `reason` argument does not enter it. THREE reachable situations produce a head move that makes prior turns unreachable while writing nothing: (1) P94, a session whose path is one row is folded, so `_fold_impl`'s root == the current head, the frontier's parent_id IS the previous head, linear, no entry — even though _fold_impl passed reason='fold'; reachable on a fresh session's first turn and on a freshly-forked session; (2) P96, fold(boundary=N) where N already is the current head, same shape; (3) P55, an append into a session that holds rows but whose head is NULL — previous head NULL and implicit parent NULL, rule case 1, linear and unlogged — and every pre-existing row is orphaned with no recorded reason. P55 is the PROMOTION because all three answering copies converged on the mechanism correctly and NONE flagged that it contradicts the doc's own stated principle ('Reachable lineage may be derived. Unreachable lineage must be recorded — and folding is what makes lineage unreachable'). Here an APPEND makes lineage unreachable and records nothing: convergence on a shared blind spot, which is exactly what the consensus examination exists to catch. Already measured downstream: P85 — a consumer walking the log to reconstruct the run's compaction history WILL NOT SEE a fold that landed in the linear case. Impact: the demand `fold_moves_head_to_frontier_and_logs_fold` asserts exactly one log row per fold, and under the rule as written that is FALSE for a one-row path. Judge recommendation (not adopted): change the rule's trigger, not the call sites — log iff the move is non-linear OR an explicit reason was supplied — since the alternative the doc implies (special-case _fold_impl) leaves P55 unfixed, no call site being involved there at all. Whatever is chosen, P55 needs an explicit answer: a NULL-head session with rows is either an error at append or a recorded non-linear move; silent orphaning is the one option the doc's own principle forbids. OPEN."
    - "FK-E (FE-1 / FE-2 / D4) — `_default_boundary`, `fold_boundary`, and `fold(boundary=None)`. Premises P103, P104, P105 (forks), P99 (silent branch), P101 (provisional drop, now probed by PR-16). Phase A refuted D4's census (c10/C2) and the human halved D4 at the early-exit seam (R2); two residuals were explicitly NOT decided and are FE-1 and FE-2 above. P104 is settled and confirmed: the over-count defect is INHERITED by `fold_boundary` under R2 and explicitly not fixed here (path-scoped counting is FK16 / #753), verified by B3 — the path holds 2 rows and _default_boundary returns 4. P99 (silent branch) is the sharper open piece: a boundary naming a row an earlier fold already displaced hits a reuse lookup keyed on the session and never on the path, so nothing checks whether the target is still reachable from head and THE CALLER CANNOT TELL WHETHER A FOLD HAPPENED — a worse failure than the over-count it stems from. The judge recommends recording P99 as a known, deferred consequence of FK16 with a sentence in the doc, not fixing it here. P101 is now answered by PR-16 (executed): compaction.fold_boundary is empirically non-decreasing over both golden fixtures' real growth, but nothing in the algorithm enforces it against an edit_file that rewrites an earlier loop's close markers — AND the function runs only under DEFENDER_COMPACTION, which is off by default with no live site turning it on, so no real run exercises it at all. OPEN on FE-1, FE-2 and P99."
    - "FK-F (F5) — the visualizer's session pick, three halves. Premises P111 (fork), P90, P114 (silent branches). F.1: visualize_run.py:328 carries a bare `ORDER BY rowid LIMIT 1` fallback, or-chained after the query the design replaces, for stores predating session.agent_id; the doc quotes only the first query. With SCHEMA_VERSION 2 and the shim deleted such a store cannot open at all (D3), so the branch is unreachable — UNLESS a store opens fine and simply has no root-of-lineage row, which P90 shows is possible. F.2 (a NEW finding, 45-dispositions red flag 4): a second, independently-created NON-FORKED new_session(agent_id='main') row ALSO satisfies `parent_session_id IS NULL AND agent_id='main'`, breaking root-of-lineage's uniqueness assumption; the design does not name or guard against this case, it only addresses the fork-inherits-agent_id shape, and the demand `the_visualizer_picks_the_root_of_lineage_main_session` presupposes exactly one such row. F.3: whether the render follows the conversation past a branch point into a fork is unstated. The picker runs in the VISUALIZER'S process (C11/F6) and it is the only cross-process reader — a wrong pick renders the wrong transcript silently, no error, just the wrong run. Judge recommendation (not adopted): delete the :328 fallback AND make the root-of-lineage query fail loudly on 0 or >1 rows rather than LIMIT 1-ing the ambiguity away; for F.3 state that the rendered transcript is the selected session's path and does not follow forks, leaving a lineage-aware view to #696. OPEN."
    - "FK-G (F6) — where the version refusal lands, and in which process. Premises P69, P71 (forks), P65, P68, P115 (silent branches). C1 moves _check_schema_version into open_store; in production open_store is reached ONLY via _default_store_factory (driver.py:452), which runs during SETUP, OUTSIDE the run loop's `except (sqlite3.Error, StoreError)` handler (driver.py:520-526) whose whole purpose is to end a run through the handled truncated_by='store' exit (c19/C11). This is the only place in the change where a store-level decision can take a production process down, and the demand deliberately stops at the store boundary, so NOTHING IN THE SPEC WILL CATCH A BAD DRIVER-LEVEL OUTCOME. P71: open_store_for_read is untouched by C1 (OC-1, census), so the READER still fails one call later at hydrate — and the reader is the only opener that ever meets a file it did not create, so the asymmetry is exactly backwards. P68 is now answered by PR-12 (executed): with the connection closed the refused file is byte-identical, but a raise propagating out of open_store without the caller getting a handle to close LEAKS the connection and its -wal/-shm sidecars until process exit. PR-11 (executed) adds the ordering fact the placement decision needs: today the DDL runs and commits BEFORE the fresh-only user_version stamp, which is the last statement open_store issues. P65/P66 are settled by B6 (the check is a general inequality — an unenumerated 99 was refused). P115: _main_session_analysis resolves, opens and hydrates with NO containment from both transcript.html and runtime.html, and nothing states what the render does when the store cannot be read; the judge recommends a recorded waiver there rather than a test. Judge recommendation (not adopted): keep the raise at open_store and WRAP THE SETUP CALL — catch StoreError around _default_store_factory and end the run through the same handled exit — add the check to open_store_for_read too, and move the check to immediately after the connect and before any DDL. OPEN."
    - "FK-H (F4) — the freshly-forked, unappended session. Premises P102, P109 (forks), P108, P81 (silent branches), P95 (provisional drop, now probed by PR-6). B11 (executed): under head, path_row_ids on a forked-but-unappended session changes from [] to the PARENT'S PREFIX, because fork() sets head at fork time. The design does not state this and three consequences follow, none answered. P102: `_fold_impl`'s `root = path_row_ids(...)[0]` now resolves to a row belonging to the PARENT session, so the frontier parents ACROSS the session boundary and the fold's log row — written under the fork's session_id — records a from_message_id that is another session's row; nothing in the schema forbids it structurally (P21 shows head carries no session confinement) and the doc states no intended behaviour. P109 is now ANSWERED by PR-24 (executed) and the answer is a gap, not a hedge: ingest with last_render_len=0 against a head already covering N rows DUPLICATES all N messages as byte-identical rows, and IngestTailUnderflow cannot catch it because its guard is len(live) < last. P95 is now answered by PR-6 (executed): `_fold_impl` already reads `root = ids[0] if ids else None`, so folding a never-appended session mints a synthesized root with parent_id NULL and no IndexError — P95 is the EXISTING guarantee, not a gap. path_row_ids has six references across two files (C7), so B11's change reaches hydrate, synthesized_flags, _fold_impl's root and ingest's parent in a single step. Judge recommendation (not adopted): state in the doc that a fresh fork's hydrate IS the parent's prefix — that is the point of setting head at fork time — and set last_render_len at fork time to the inherited prefix's length, which answers P108 and P109 together; make _fold_impl refuse a fold on a session with no append of its own rather than parenting a frontier across a session boundary. OPEN."
    - "FK-I (R3's cycle guard) — does it cover an explicit `parent_id`? Premise P26 (silent branch). Corrections R3 is binding: append must still refuse a cyclic parent chain 'by whatever means the implementer picks (a bounded walk, a depth cap)'. P26 sharpens it to a cycle reachable ONLY through an explicit caller-supplied parent_id sitting off the session's own head/root path, which neither path_row_ids' walk nor a head-anchored check would trip over incidentally. 'A bounded walk from the new row's parent' covers both shapes; 'a depth cap on the head walk' covers only the implicit one; R3 permits either and the two differ exactly here. Judge recommendation (not adopted): specify the guard as a bounded walk from the row's ACTUAL parent_id, implicit or explicit, since R3's own stated invariant ('the one walk both the reader and the writer go through, so a corrupted chain cannot stay invisible at write time') is only preserved by the parent-anchored form. OPEN."
    - "FK-J — a multi-message non-linear move does not record where it attached. Premise P51 (fork, materially different outcomes across all three copies). For a batch appended onto a parent that is not head, the log records from_message_id = the previous head and to_message_id = the new head (the LAST inserted row, per P50's consensus). NEITHER is the attachment point — the FIRST inserted row's own parent_id. One of the three copies answered 'the attachment point IS from_message_id', which is wrong against the schema, and the way it is wrong is the finding: from_message_id reads naturally as 'where the branch left the old chain' and it is not, so any consumer making that reading gets a plausible, silently incorrect answer. Every fold is single-row, so from -> to fully describes it and `fold_moves_head_to_frontier_and_logs_fold` is unaffected; the gap opens only for multi-message non-linear appends, which the store's API permits and `ingest` does not currently produce. It is a latent trap for #696's consumers. Judge recommendation (not adopted): either add `attached_to_message_id` to session_head_log — cheap, before any data exists, which the design's own 'no runs exist under the current schema' makes the window for — or state explicitly that from_message_id is THE DISPLACED HEAD, never the attachment point. OPEN."
    - "FK-K — an identical `append` retried becomes non-linear. Premise P38 (fork, all three definitive, two of them missing the interaction). After the first call head has advanced to the new row, so the second call's UNCHANGED explicit parent_id no longer equals the new previous head, making an at-least-once retry of an ORDINARY, LINEAR append raise StoreAppendError the second time even though its arguments are identical. `ingest` threads each new id as the next parent, so a retried ingest append — the shape a timeout or an at-least-once dispatch produces — hits this. It is not a bug in the rule; it is a real, unstated consequence with a caller-visible failure, and obligation 7's raise would fire on a call the caller believes is a harmless retry. This is the clearest single instance of the measurement paying for itself: two of three readers answered 'is there dedup?' (no) and stopped, and only the third composed the rule with the head move. Judge recommendation (not adopted): accept the behaviour and DOCUMENT it as a `rejected:` note on obligation 7's demand so the error is legible when a caller meets it; do not add idempotency, which would require a dedup key the design deliberately does not have. OPEN."
    - "FK-L — a COMMIT that raises after the write is already durable. Premise P15 (fork, marked; 3/3 hedge). `append`'s caller sets committed = True only after COMMIT returns without raising; a COMMIT that raises AFTER the data reached durable storage leaves the caller believing the append failed while the row, head move and log entry may already be visible to the next reader. The marker asks whether this is in scope at all or an accepted ambiguity inherited from append's existing commit/rollback discipline (session_store.py:281-293). If it is in scope, obligation 8's 'head unmoved, log unwritten' assertion is false in one rare case and the demand needs a carve-out; if out of scope, the demand is fine as written. Judge recommendation (not adopted): declare it OUT OF SCOPE WITH A RECORDED WAIVER — it is a pre-existing property this change neither creates nor worsens, since the head UPDATE and log INSERT ride inside the same transaction as the row, so the blast radius is unchanged from today. OPEN (a waiver is a human's minted decision at §7, not the assembler's)."
    - "FK-M — recorded silent branches needing no human decision. Sixteen rows in 45-dispositions.md section B's final table, carried here so nothing is demoted invisibly: the human can overrule any of them, but none needs a decision to proceed. P49 (fork's two writes bypass the rule — the WRITE SET is not open; atomicity is FK-B); P70 (can the writer meet a pre-existing store — C11 plus OC-2: no cron, subprocess re-exec or eval harness reaches the store and each run mints a fresh uuid4 case_id, so obligation 9's condition is READER-ONLY in production); P80 (on-path vs folded-away from a coordinate alone — only walking from head determines membership); P56 (fork at a row from another session — B12 establishes the walk crosses sessions); P57 (fork at a synthesized frontier row — fork() treats at_message_id uniformly); P65 and P66 (user_version 3 and a negative version — B6 executed: an unenumerated 99 was refused, so the check is a general inequality); P112 (the readers have no existing caller — now MUCH stronger than 'no caller yet': PR-21 and PR-19 show there is no reader ANYWHERE, on either side of the change); P19 (where the previous-head read happens — must be inside BEGIN IMMEDIATE per F3's no-suspension-point constraint; unprobeable against code that does not exist; the judge recommends pinning it as a demand); P17 and P23 (an external reader never sees a torn state, and a second connection opened mid-write — now ANSWERED by PR-1 executed: the reader neither sees the in-progress state nor blocks, returning the last commit in ~37 microseconds, which refutes the discounted 'the reader blocks' answer directly); P31 (a malformed payload behind a row the log names — reachable only by direct file damage; the judge recommends a waiver); P82 (the judge page after a fold — now answered by PR-19: the head-anchored projection shows on-path turns only and NO artifact anywhere carries an off-path row); P110 (a pending stamp across a fold — the doc's Out-of-scope section verbatim; binds the existing clause demand); P58 (fork from a nonexistent session_id — REFUTED by PR-20, see handoff.refuted); P76/P79/P81/P89 (consequences of FK-A's open reader contract, resolving when FK-A resolves); P96 and P85 (the same defect as P94, resolving with FK-D). RECORDED, NOT RESOLVED."
    - "NEW, opened by the re-ground and not present in 45-dispositions.md — (a) PR-3 (executed): once a phantom or missing id is IN the walked path — whether from a corrupted parent_id chain today or a bogus forced head_message_id in the new shape — `_walk_parents` terminates cleanly and returns the phantom id as the path's OLDEST element rather than raising or dropping it, and `hydrate` then dies on an UNCAUGHT KeyError for both the send and actor roles, not an empty result and not a named StoreError. P29's consensus ('unreachable through the store's own API, this collapses onto P3') is true of the WRITE path only; the READ path has no guard at all. If the design wants hydrate to fail closed with a named StoreError, that needs an explicit check nothing provides today. (b) PR-12 (executed): 'fail closed at open' LEAKS the connection and its -wal/-shm sidecars unless the gate closes the connection before re-raising — a real hazard #754's placement of the check must account for, not a hypothetical. (c) PR-14 (executed) re-classifies premise P6 out of the provisional drops: `executescript` autocommits per statement, so the DDL/stamp window is genuinely crash-reachable and a partially-built, unstamped file can exist on disk — which the newly-relocated open-time check is exactly what meets. Whether that is refused, repaired, or ignored is undecided. (d) PR-2 (executed) re-classifies premise P18: two successive statements on one autocommit reader connection DO see different committed snapshots, and the same holds for the exact two-query shape hydrate's reader uses, so hydrate's read is confirmed torn-able. PR-13's single-writer census is the only thing making it unreachable in production, which is a census result, not a design guarantee. (e) 45-dispositions red flag 5, carried because nobody has decided it: two fold() calls at the same boundary under different agent_ids mint two live 'boundary N' frontiers inside one session_id, each its own non-linear move with its own log entry, head landing on whichever ran last. Doc-legal under the untouched reuse key; the demand `the_fold_reuse_lookup_is_scoped_by_session_and_agent` pins the behaviour, but not that it is WANTED. ALL FIVE SUB-ITEMS ARE NOW CLOSED at §7-VERIFY (71-resolutions-verify.md), and the way this entry escaped is itself the finding: it was minted into `handoff.forks` AFTER 45-dispositions.md closed, so §7's fork arithmetic could not see it and `spec-graph frontiers` structurally cannot — a late fork must be appended to a FRONTIER, not only to the artifact. Dispositions: (a) RESOLVED as the demand `hydrate_fails_closed_on_an_unresolvable_path_element` (V3) — the human took the demand over the examined waiver. (b) already landed inside FK-G and is discharged by `open_store_refuses_before_any_ddl_or_wal_pragma`'s sidecar assertion. (c) DISPOSED as covered, not decided anew: a partially-built file left by a crash in the DDL/stamp window reads `user_version = 0`, which `an_unknown_user_version_is_still_refused_at_the_new_raise_point` refuses by name — the relocated check meets exactly that file and fails closed on it, so 'refused' is the shipped answer and no further decision is owed. (d) DISPOSED to its existing `handoff.drops` entry (P18), which records the reasoning in full: no demand is minted because the only thing making a torn read unreachable in production is PR-13's single-writer census, and a test would have to construct a second writer production cannot produce. (e) CLOSED by V4 — refusing cross-session frontier parenting makes the fork half of the two-frontiers shape unreachable through `_fold_impl`, and the same-session two-agent half stays pinned-not-endorsed by its demand. NOTHING IN THIS ENTRY REMAINS OPEN."
