  # recommendation. These twelve, plus the PR-25 contract demand, are what the
  # resolutions ADD. Nothing below re-opens anything §7 settled.
  # =========================================================================

  # ---- round 1: mechanism (FK-D, FK-C, FK-A, FK-B) ------------------------

  - {id: an_append_into_a_rows_but_null_head_session_raises, kind: behavior, form: test,
     discharged_by: test_an_append_into_a_rows_but_null_head_session_raises,
     binds: ["append", "head_message_id", "head_message_id.domain.distinguished[NULL]",
             "session_head_log", "interacts(ingest->message)"]}
     # §7 FK-D, and the resolution of the P55 PROMOTION. An append into a session that HOLDS
     # ROWS but whose head is NULL previously fell into rule case 1 — previous head NULL and
     # implicit parent NULL, therefore linear and unlogged — and every pre-existing row was
     # silently orphaned with no recorded reason. All three answering copies converged on that
     # mechanism correctly and NONE flagged that it contradicts the doc's own principle
     # ("Reachable lineage may be derived. Unreachable lineage must be recorded"), which is
     # convergence on a shared blind spot and exactly what the consensus examination exists to
     # catch. §7 chose the one option the principle leaves: it RAISES. Silent orphaning was
     # rejected outright; so was weakening the fold demand to "except degenerate cases".
     # Its positive control is `first_append_into_a_fresh_session_is_linear` — a NULL head with
     # NO rows is the ordinary first turn and stays legal. The two differ only in whether the
     # session already holds rows, so the raise must be written against that predicate.

  - {id: a_degenerate_fold_still_writes_its_log_entry, kind: behavior, form: test,
     discharged_by: test_a_degenerate_fold_still_writes_its_log_entry,
     binds: ["interacts(render->session_head_log)", "reason.domain.distinguished[fold]",
             "head_message_id", "interacts(render->message)"]}
     # §7 FK-D, the "or an explicit reason was supplied" arm made observable. P94: a session
     # whose path is ONE ROW is folded, so `_fold_impl`'s `root = path_row_ids(...)[0]` EQUALS
     # the current head and the frontier's parent_id IS the previous head — linear under the
     # old trigger, and therefore unlogged even though `_fold_impl` passed `reason='fold'`.
     # P96 is the same shape by another route: `fold(boundary=N)` where N already is head.
     # Reachable on a fresh session's first turn and on a freshly-forked session. Under the new
     # trigger the supplied reason is itself sufficient to record, so the entry IS written and
     # `fold_moves_head_to_frontier_and_logs_fold`'s "exactly one row per fold" becomes true
     # without exception. §7 rejected the alternative the doc implied — special-casing
     # `_fold_impl` — because it leaves P55 unfixed, no call site being involved there at all.
     # NARROWED at §7-VERIFY (V1): this exemption is now EXPLICIT rather than incidental. A
     # linear move carrying a member reason is accepted only from a frontier-minting caller
     # (`synthesized=True`) and refused from any other, so the degenerate fold logs BECAUSE it
     # is a fold and not because every reason-bearing move is waved through. The test carries
     # that refusal as its second arm, beside the reason-less control.

  - {id: reason_membership_is_validated_before_linearity_classification,
     kind: domain-outcome, form: test,
     discharged_by: test_reason_membership_is_validated_before_linearity_classification,
     binds: ["append", "reason.domain", "reason.domain.distinguished[empty-string]",
             "session_head_log", "head_message_id"]}
     # §7 FK-C, one unconditional rule replacing seven doc-silent cases, and the closure of the
     # gate's single R4 hole (`gate.holes[0]`, whose `resolved_to` names this demand).
     # Membership is validated BEFORE the linearity classification, whenever `reason is not
     # None`, by EXACT MATCH, with `is not None` as the absent sentinel — so `'rewind'`,
     # `'Fork'`, `''` and a non-string `123` all raise StoreAppendError on LINEAR and
     # NON-LINEAR moves alike, and a reason on a move that is linear and not a fold/fork call
     # is refused rather than silently ignored. PR-5 (executed) is why `''` and `123` are the
     # discriminating cases: the `str | None` annotation is unenforced, so a non-string reaches
     # the membership check rather than raising at the call boundary, and `is not None` (not
     # `if reason:`) is what the repo's own anchored-default convention requires.
     # §7 explicitly did NOT check a reason against the move's SHAPE (P47/P32): the store
     # cannot tell a compaction from a rewind, and pretending otherwise invents a semantics the
     # log does not carry.

  - {id: an_empty_batch_with_a_reason_validates_before_the_short_circuit,
     kind: behavior, form: test,
     discharged_by: test_an_empty_batch_with_a_reason_validates_before_the_short_circuit,
     binds: ["append", "reason.domain", "session_head_log", "head_message_id"]}
     # §7 FK-C's second genuine decision (P39). `append(session_id, [], reason=...)` short-
     # circuits and returns `[]` before any row exists to classify, so the linearity rule has
     # nothing to inspect and the old reading left the reason unexamined. §7 validates FIRST:
     # the caller learns immediately that it passed a meaningless or out-of-set argument
     # instead of getting a silent no-op. A valid reason on an empty batch still writes no log
     # row and moves no head — there is no move to record.

  - {id: branch_point_ignores_a_log_row_with_a_non_null_from_message_id,
     kind: behavior, form: test,
     discharged_by: test_branch_point_ignores_a_log_row_with_a_non_null_from_message_id,
     binds: ["branch_point", "session_head_log.identity",
             "reason.domain.distinguished[fork]", "interacts(store_reader->session_head_log)"]}
     # §7 FK-A(c), and the sharpest single observation in the whole measurement (P48): a bare
     # `append(parent_id=<not head>, reason='fork')` in a never-forked session IS logged as an
     # ordinary non-linear move — `reason='fork'`, `from_message_id` = the PREVIOUS HEAD, NOT
     # NULL, unlike a genuine `fork()` entry whose from_message_id the schema always sets to
     # NULL. So an unearned `fork` row is distinguishable from a real branch point, but ONLY if
     # the reader is specified to look. §7 specifies it: `branch_point` MUST filter
     # `from_message_id IS NULL`. Without this demand the helper returns a plausible, wrong
     # branch point for any session someone reached that way.
     # RE-POINTED at §7-VERIFY by V2, which closed the APPEND route at source: `reason='fork'`
     # now has no legitimate caller through `append` at all, so P48's row can only be reached by
     # a raw connection (P32 — the schema permits any reason by design). The fixture is built
     # that way and the reader's filter is still demanded: the two guards are independent, and
     # the reader is the one that survives a writer nobody controls.

  - {id: the_full_fold_history_is_readable_in_order, kind: behavior, form: test,
     discharged_by: test_the_full_fold_history_is_readable_in_order,
     binds: ["fold_history", "displaced_tip", "session_head_log.identity",
             "interacts(store_reader->session_head_log)"]}
     # §7 FK-A(a). `displaced_tip` returns the MOST RECENT fold's from_message_id — and "most
     # recent" ALONE makes the FIRST fold's tip unreachable through the helper, which is
     # precisely the addressability #705 was sold on, and precisely what P77's reconstruction
     # use case needs every entry for. So §7 adds an ordered full-history accessor beside it:
     # over a session with three folds, the history returns all three displaced tips in
     # head-move order and its last element is what `displaced_tip` returns. Both are `None` /
     # empty for the no-entry and the no-such-session cases (FK-A(b)) rather than raising —
     # the callers do not exist yet, and a raise buys nothing.
     # §7 FK-A(d), recorded as an explicit NON-obligation: nothing projects an off-path id to
     # its message CONTENT, and `session/agent#seq` translation is the caller's own message-row
     # lookup. Declared out of scope rather than left silent (P75/P79).

  - {id: fork_writes_head_and_log_in_one_transaction, kind: behavior, form: test,
     discharged_by: test_fork_writes_head_and_log_in_one_transaction,
     binds: ["interacts(fork_constructor->head_message_id)",
             "interacts(fork_constructor->session_head_log)",
             "interacts(fork_constructor->session)", "session_head_log", "head_message_id"]}
     # §7 FK-B. `fork()` acquires TWO writes under this design — the session row carrying
     # head_message_id, and the `fork` log entry — and the doc named a transaction for neither.
     # B10 (executed) is the ground: fork() runs on an autocommit connection today
     # (isolation_level None) and its single INSERT is atomic BY ACCIDENT; one write was
     # accidentally atomic, two are not. A fault between them leaves a session with a head and
     # NO branch-point record — the exact unreachable-lineage-without-a-record state the
     # design's own principle forbids, and the state D2's whole argument says derivation gets
     # wrong. §7 gives fork the same `BEGIN IMMEDIATE … COMMIT` shape `append` uses.
     # NO idempotency (P62): "two forks from one point" is a shape the design deliberately
     # allows — PR-18 (executed) confirms no uniqueness constraint over
     # (parent_session_id, fork_at_message_id) exists — so adding one would break
     # `two_forks_one_branch_point_two_entries`.

  # ---- round 2: blast radius (FK-G, FK-H, FK-F) ---------------------------

  - {id: open_store_refuses_before_any_ddl_or_wal_pragma, kind: behavior, form: test,
     discharged_by: test_open_store_refuses_before_any_ddl_or_wal_pragma,
     binds: ["session_store", "interacts(run_investigation->session_store)",
             "interacts(run_investigation->user_version)",
             "user_version.domain.distinguished[1]"]}
     # §7 FK-G's placement decision, driven entirely by two executed probes rather than taste.
     # PR-11 (SQL-trace confirmed): today all DDL runs and commits BEFORE the fresh-only
     # `PRAGMA user_version` stamp, which is the very LAST statement `open_store` issues — so a
     # check placed after the DDL both meets an unstamped fresh file and has already mutated
     # the file it is about to refuse. PR-12 (executed): a raise propagating out of `open_store`
     # without the caller ever getting a handle to close LEAKS the connection and its
     # -wal/-shm sidecars until process exit. §7 moves the check to IMMEDIATELY AFTER CONNECT
     # and BEFORE any DDL or the WAL pragma: a refusal that reshapes the file it refuses is not
     # "failing closed", and the gate must close the connection before re-raising.

  - {id: open_store_for_read_refuses_a_stale_version_too, kind: parity, form: test,
     discharged_by: test_open_store_for_read_refuses_a_stale_version_too,
     binds: ["open_store_for_read", "interacts(visualize_run->user_version)",
             "interacts(visualize_run->open_store_for_read)",
             "user_version.domain.distinguished[1]", "session_store.access[api]"]}
     # §7 FK-G / P71. OC-1 (census) REFUTED "open_store_for_read version-checks":
     # `_check_schema_version` is wired exclusively to `hydrate` (:619, :636), so under C1 the
     # writer would fail closed at open while the READER still failed one call later. Per C11
     # the reader is THE ONLY OPENER THAT EVER MEETS A FILE IT DID NOT CREATE — the writer
     # always mints its own fresh uuid4 case_id file (OC-2) — so the asymmetry was exactly
     # backwards. kind: parity because the assertion is that the refusal holds on EVERY via
     # reaching the store, which is the thing a writer-only test leaves unpinned.

  - {id: a_store_error_during_setup_ends_the_run_through_the_handled_exit,
     kind: behavior, form: test,
     discharged_by: test_a_store_error_during_setup_ends_the_run_through_the_handled_exit,
     binds: ["session.truncated_by", "interacts(run_investigation->session.truncated_by)",
             "interacts(run_investigation->session_store)",
             "user_version.domain.distinguished[1]"]}
     # §7 FK-G's third half, and the ONE demand in this spec that binds the DRIVER rather than
     # the store. c19/C11: in production `open_store` is reached only via
     # `_default_store_factory` (driver.py:452), which runs during SETUP — OUTSIDE the run
     # loop's `except (sqlite3.Error, StoreError)` handler (driver.py:520-526) whose whole
     # purpose is to end a run through the handled `truncated_by="store"` exit. Moving the
     # version check into `open_store` therefore converted a stale-file condition from a
     # partial trace into an unhandled exception that takes the `run.py` process DOWN. §7 wraps
     # the setup call: the failure shape the doc intends is "the run ends cleanly", not "the
     # process dies", and the handler already exists.
     # The suite must drive this through `run_investigation`'s real entry point (the
     # `store_factory` DI seam #705's R12 minted), not by asserting on the store alone —
     # 70-resolutions.md red flag 2.

  - {id: a_fresh_fork_renders_its_inherited_prefix_exactly_once, kind: behavior, form: test,
     discharged_by: test_a_fresh_fork_renders_its_inherited_prefix_exactly_once,
     binds: ["session.last_render_len",
             "interacts(fork_constructor->session.last_render_len)",
             "interacts(ingest->session.last_render_len)", "interacts(ingest->message)",
             "head_message_id"]}
     # §7 FK-H, and the closure of PR-24's measured duplication. B11 (executed): under head, a
     # forked-but-unappended session's path changes from [] to the PARENT'S PREFIX, because
     # fork() sets head at fork time — §7 states plainly that this IS the intended semantics,
     # since it is the whole point of setting head there. PR-24 (executed) is the cost of
     # leaving `last_render_len` behind: `last = store.last_render_len(session_id) or 0` reads
     # 0/None regardless of how many rows the effective history already covers, so
     # `tail = live[last:]` is the ENTIRE live list and every message is re-appended as a
     # byte-identical duplicate row — three messages became ids [4,5,6] beside [1,2,3], and
     # `IngestTailUnderflow` cannot catch it because its guard is `len(live) < last`, which
     # never fires on a full redundant re-ingest. §7 sets `last_render_len` at fork time to the
     # inherited prefix's length, which answers P108 and P109 together.
     # Drive it through `fork()` plus `selection.ingest`, not through the store alone.

  - {id: the_root_of_lineage_query_raises_on_zero_or_multiple_matches,
     kind: behavior, form: test,
     discharged_by: test_the_root_of_lineage_query_raises_on_zero_or_multiple_matches,
     binds: ["interacts(_main_session_analysis->session)",
             "interacts(_main_session_analysis->main_session_rowid_fallback)",
             "main_session_rowid_fallback", "session.parent_session_id", "session.agent_id"]}
     # §7 FK-F, both halves, and the R5 substitute for the `main_session_rowid_fallback` REMOVE
     # edge. F.1: visualize_run.py:328's bare `ORDER BY rowid LIMIT 1` fallback is DELETED —
     # D3 makes a pre-`session.agent_id` store unopenable by construction, and a branch no test
     # can reach is worse than none. F.2 (P90, a finding the measurement surfaced and the
     # design never names): a second, independently-created NON-FORKED
     # `new_session(agent_id='main')` row ALSO satisfies `parent_session_id IS NULL AND
     # agent_id = 'main'`, so root-of-lineage's uniqueness is not guaranteed and
     # `the_visualizer_picks_the_root_of_lineage_main_session`'s presupposition is breakable.
     # §7 refuses to `LIMIT 1` the ambiguity away: the query RAISES on 0 or >1 rows, making
     # P90 a caught error rather than a silently wrong transcript. That matters because the
     # pick runs in the VISUALIZER'S process (C11/F6) and a wrong pick renders the wrong run
     # with no error at all. Drive it through the visualizer's query, not the store.

  # ---- round 4: the residue probe (PR-25) ---------------------------------

  - {id: the_pointer_path_is_trusted_verbatim_across_a_relocated_run_dir,
     kind: behavior, form: test,
     discharged_by: test_the_pointer_path_is_trusted_verbatim_across_a_relocated_run_dir,
     binds: ["session_store_pointer", "interacts(run_investigation->session_store_pointer)",
             "interacts(visualize_run->session_store_pointer)",
             "session_store.access[pointer-file]"]}
     # §7 round 4. PR-25 asked whether `pointer-file`'s `constraints` slot is `confine`; the
     # answer is no, and the reason is that the LACK of confinement is an existing CONTRACT,
     # not an oversight. `test_store_driver_705.py:191-197` copies a whole run dir elsewhere
     # and asserts `resolve_store_path` on the COPY still returns the ORIGINAL, unchanged,
     # absolute store_path — "the resolver's contract is the pointer file, not a convention" —
     # in service of persist.py's allowlist copy and evals/harness.py's copytree, both of which
     # relocate run dirs that must keep resolving their store. This demand pins that contract
     # so the confinement question cannot be "fixed" into a silent regression later.
     # Its paired waiver (`the_pointer_path_is_not_confined_to_the_run_dir`) records the other
     # half: what the reader does NOT do, and why §7 declined to change it here.

