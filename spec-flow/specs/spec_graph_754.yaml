  - {id: a_reason_on_a_linear_move_is_refused_unless_the_caller_mints_a_frontier,
     kind: behavior, form: test,
     discharged_by: test_a_reason_on_a_linear_move_is_refused_unless_the_caller_mints_a_frontier,
     binds: ["append", "reason.domain", "message.identity", "session_head_log",
             "head_message_id"]}
     # §7-VERIFY V1, resolving reconciler finding 1. FK-D's second clause — "refuse a
     # `reason` on a move that is linear and not a fold/fork call" — had NO IMPLEMENTABLE
     # DISCRIMINATOR: `_fold_impl` reaches `append` as an ordinary
     # `append(..., parent_id=root, reason='fold')` and so does a bare caller, and the clause
     # taken literally refuses the very case FK-D minted `a_degenerate_fold_still_writes_its_
     # log_entry` for. The human DECLINED collapsing the clause into FK-C's membership rule
     # and took the stronger reading: the discriminator is NAMED. `synthesized=True` is that
     # name — the frontier-minting flag `_fold_impl` already passes and no ordinary turn does,
     # already part of `message.identity`'s key, so it costs no new parameter. A LINEAR move
     # carrying a member reason is therefore accepted from a frontier-minting caller and
     # REFUSED from any other, and the degenerate fold is exempted EXPLICITLY by that flag
     # rather than by accident. Non-linear moves are untouched: they REQUIRE a reason from any
     # caller (obligation 7), which is what `the_store_writes_the_log_not_its_call_sites` pins.

  - {id: a_bare_append_cannot_mint_a_fork_entry, kind: behavior, form: test,
     discharged_by: test_a_bare_append_cannot_mint_a_fork_entry,
     binds: ["append", "reason.domain.distinguished[fork]", "branch_point",
             "session_head_log", "head_message_id"]}
     # §7-VERIFY V2, resolving reconciler finding 2 — two round-1 resolutions that were
     # individually pinned and jointly an escape. FK-D's "or an explicit reason" arm composed
     # with FK-A(c) reopens the hole FK-A(c) exists to close: a bare
     # `append(session_id, [m], reason='fork')` into a session that holds NO rows is LINEAR
     # (rule case 1), so obligation 7 does not refuse it, FK-C accepts 'fork' as a member, the
     # reason arm logs it — and its `from_message_id` is the previous head, which is NULL. The
     # entry is then INDISTINGUISHABLE from a genuine fork entry and `branch_point` hands back
     # a plausible, wrong branch point for a session nobody ever forked. §7-VERIFY closes it at
     # source with V1's discriminator: `fork()` writes its entry itself and never goes through
     # `append`, so `reason='fork'` through `append` has no legitimate caller at all and is
     # refused on linear and non-linear moves alike. `first_append_into_a_fresh_session_is_linear`
     # is NOT weakened — the ordinary reason-less first turn stays legal, which is the arm this
     # demand's test drives as its control.
     # CONSEQUENCE for `branch_point_ignores_a_log_row_with_a_non_null_from_message_id`: P48's
     # unearned row is no longer constructible through `append`, so its fixture is built by the
     # RAW connection route P32 names (the schema permits any reason by design — see
     # `reason_is_a_python_closed_set_not_a_sql_check`). The reader's NULL filter is still
     # demanded: the write side refusing and the reader filtering are two independent guards.

  - {id: hydrate_fails_closed_on_an_unresolvable_path_element, kind: behavior, form: test,
     discharged_by: test_hydrate_fails_closed_on_an_unresolvable_path_element,
     binds: ["store_reader", "interacts(store_reader->message)",
             "interacts(store_reader->_walk_parents)", "_walk_parents", "head_message_id"]}
     # §7-VERIFY V3, resolving reconciler finding 3 — a probe this run PAID FOR, answered, and
     # explicitly routed to the human, which then vanished at the D->§7 boundary: PR-3 was
     # minted into `handoff.forks` AFTER 45-dispositions.md closed, so §7's "29 forks in"
     # arithmetic could not see it and `spec-graph frontiers` structurally cannot. PR-3
     # (executed): once a phantom id is in the walked path, `_walk_parents` returns it as the
     # path's OLDEST element rather than raising or dropping it, and `hydrate` then dies on an
     # UNCAUGHT KeyError for both the send and actor roles — not an empty result and not a
     # named StoreError. P29's consensus ("unreachable through the store's own API") is true of
     # the WRITE path only; the read path has no guard at all. This change makes it MORE
     # reachable, not less: the walk's anchor stops being a derived tip and becomes a plain
     # column, and `the_path_walk_crosses_session_boundaries_and_head_is_not_confined`
     # deliberately pins that head may name another session's row with no application guard.
     # §7-VERIFY chose the demand over the waiver: the read path fails closed with a named
     # StoreError.

  - {id: a_fold_refuses_to_parent_a_frontier_outside_the_folding_session,
     kind: behavior, form: test,
     discharged_by: test_a_fold_refuses_to_parent_a_frontier_outside_the_folding_session,
     binds: ["interacts(render->message)", "interacts(render->session_head_log)",
             "message.identity", "session.session_id", "head_message_id"]}
     # §7-VERIFY V4, resolving reconciler finding 5, and it SUBSUMES FK-H's third half rather
     # than restating it. FK-H's words were "`_fold_impl` refuses a fold on a session with no
     # append of its own"; its stated PURPOSE was "rather than parenting a frontier across a
     # session boundary" — and the words do not achieve the purpose. A fork that DOES have an
     # append of its own still has `root = path_row_ids(...)[0]` in the PARENT session (the
     # walk crosses session boundaries by design, B12), so the frontier parents across the
     # boundary anyway and P102 stays live. §7-VERIFY took the purpose over the letter: the
     # fold is refused whenever the row it would parent onto belongs to another session,
     # appendless or not. Scoped to `_fold_impl`: a bare `append` naming a parent in another
     # session stays legal, which is what `the_path_walk_crosses_session_boundaries_and_head_
     # is_not_confined` pins and this demand does not touch.

  - {id: a_fork_entry_records_no_attachment_point, kind: shape, form: test,
     discharged_by: test_a_fork_entry_records_no_attachment_point,
     binds: ["interacts(fork_constructor->session_head_log)", "session_head_log.identity",
             "session_head_log"]}
     # §7-VERIFY D-2 (directed fix, reconciler finding 6a). FK-J defines
     # `attached_to_message_id` as the FIRST INSERTED ROW's own parent_id, and `fork()` inserts
     # no message row at all — so the column has no defined value on a fork entry. NULL is the
     # natural answer and nothing pinned it: every fork assertion in the suite compared tuples
     # that left the column free, so an implementer could write `to_message_id` there and stay
     # green, re-creating exactly the from/attached conflation FK-J minted the column to
     # prevent. One assertion closes it, with the multi-message non-linear append as the
     # control that the column is not simply always NULL.

