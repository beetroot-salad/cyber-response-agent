      name rule. d3_writer_input_refusals keeps the over-long input as a multi-fault case (RunRefused, nothing written), and episode_runs'' half of
      the bound, which is reachable, is pinned by d3_bad_episode_id_refused_first (250 admitted, 251 refused without probing). An examined no: no
