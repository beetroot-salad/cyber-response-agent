          type: str
          refinement: {nl: "T0, aware UTC: the window's closed end, its start left open because the past does not change (C12). F13: the registry refuses a naive or non-UTC value, and that refusal is filed as DEFAULT_FAULT_EXIT=2 inside the sibling, not in its base"}
