# THE LEDGER. Three provenances, ids kept: `C*` inherited from the discuss doc's sweep (31,
# verbatim except where noted), `G*` raised by phase-A grounding (22), `X*` raised by phase-A
# demand extraction (19), `PO-*` the probe obligations phase C minted or carried (29 + PO-J1),
# `Y*` raised here. THREE INHERITED CLAIMS WERE RETYPED OR SPLIT so the instrument matches the
