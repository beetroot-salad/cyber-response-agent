  - {id: d_episode_dir_outside_the_runs_base, minted_from: FORK-13, kind: behavior, form: test, discharged_by: test_947_the_episode_dir_is_outside_the_runs_base, binds: [episode_dir, runs_base, episodes_root]}
  - {id: d_episodes_root_resolves_from_configuration, minted_from: F5-EPISODE-ROOT, kind: domain-outcome, form: test, discharged_by: test_947_the_episodes_root_is_read_from_configuration_not_the_runs_base, binds: ["episodes_root.domain", "episodes_root.domain.distinguished[absent]", "interacts(branch_main->episodes_root)"]}
  - {id: d_episode_placement_never_dirties_a_sibling_stamp, minted_from: F5-EPISODE-ROOT, kind: behavior, form: test, discharged_by: test_947_the_episode_dirs_placement_never_dirties_a_siblings_stamp, binds: [episodes_root, episode_dir, provenance_json]}
  - {id: d_sibling_run_dir_under_the_episode, minted_from: FORK-13, kind: behavior, form: test, discharged_by: test_947_a_sibling_run_dir_lives_under_the_episode_not_the_runs_base, binds: ["run_dir.identity", episode_dir, "drives(branch_main->run_main)"]}
  - {id: d_held_out_never_selects_a_sibling, minted_from: FORK-13, kind: coherence, form: test, discharged_by: test_947_the_held_out_index_never_selects_a_sibling_for_a_fixture_slug, binds: ["interacts(held_out->runs_base)", runs_base]}
  - {id: d_trace_lesson_counts_no_sibling, minted_from: FORK-13, kind: coherence, form: test, discharged_by: test_947_the_lesson_tracer_counts_no_sibling_as_an_in_context_case, binds: ["interacts(trace_lesson->runs_base)", runs_base]}
  - {id: d_invlang_corpus_counts_no_sibling, minted_from: FORK-13, kind: coherence, form: test, discharged_by: test_947_the_invlang_corpus_counts_no_sibling_and_no_archived_world, binds: ["interacts(load_corpus->runs_base)", worlds_dir]}

  # ---- FORK-6 (human) — isolation at the serve point, above per-world staging ------------------------------------
  - {id: d_serve_point_refuses_a_foreign_world_view, minted_from: FORK-6, kind: negative, form: test, discharged_by: test_947_a_call_naming_another_worlds_view_is_refused_at_the_serve_point, binds: ["elastic_cluster.access[esql]", "elastic_cluster.access[api]", "interacts(_drive_investigation->elastic_cluster)"]}
  - {id: d_non_staging_world_covered_by_the_serve_point, minted_from: FORK-6, kind: parity, form: test, discharged_by: test_947_a_world_that_stages_nothing_is_covered_by_the_same_refusal, binds: ["elastic_cluster.access[esql]", "elastic_cluster.access[api]"]}
  - {id: d_serve_point_positive_control, minted_from: FORK-6, kind: behavior, form: test, discharged_by: test_947_a_worlds_own_view_and_an_ordinary_pattern_are_still_served, binds: ["elastic_cluster.access[esql]", "elastic_cluster.access[api]", "interacts(_drive_investigation->elastic_cluster)"]}

  # ---- NEW-DECISION-1 (human, raised at the seam) — fault text carries no staged name -----------------------------
  - {id: d_no_model_visible_fault_names_a_staged_index, minted_from: NEW-DECISION-1, kind: negative, form: test, discharged_by: test_947_no_model_visible_fault_text_names_a_staged_index, binds: ["interacts(_drive_investigation->captured_payload).response", "elastic_cluster.access[api]", "wv_alias.identity"]}
  - {id: d_an_ordinary_refusal_stays_actionable, minted_from: NEW-DECISION-1, kind: behavior, form: test, discharged_by: test_947_an_ordinary_refusal_still_tells_the_model_something_actionable, binds: ["interacts(_drive_investigation->captured_payload).response", "elastic_cluster.access[api]"]}
  # The two demands above are the FILTER's own contract. The two below are the CHANNEL: both are
  # discharged by a run driven end to end through `tests/e2e/_replay_harness.drive`, because a
  # filter that ships and is never called from `query_tool._model_view` or `QueryCapture._record`
  # satisfies every unit test of the filter itself. (§7 round 2, FINDING-3.)
  - {id: d_fault_channel_redaction_is_wired, minted_from: NEW-DECISION-1, kind: negative, form: test, discharged_by: test_947_a_driven_faults_detail_reaches_the_model_with_no_staged_name, binds: ["interacts(_drive_investigation->captured_payload).response", "elastic_cluster.access[api]", "wv_alias.identity"]}
  - {id: d_a_driven_ordinary_fault_stays_actionable, minted_from: NEW-DECISION-1, kind: behavior, form: test, discharged_by: test_947_a_driven_ordinary_fault_still_reaches_the_model_intact, binds: ["interacts(_drive_investigation->captured_payload).response", "elastic_cluster.access[api]"]}   # THE POSITIVE CONTROL for the wired negative above
  - {id: d_queries_table_digest_carries_no_staged_name, minted_from: NEW-DECISION-1, kind: negative, form: test, discharged_by: test_947_the_queries_table_digest_carries_no_staged_name, binds: ["interacts(run_main->run_dir)", "interacts(_drive_investigation->captured_payload).response", "wv_alias.identity"]}
  - {id: d_no_prompt_facing_text_names_the_namespace, minted_from: NEW-DECISION-1, kind: negative, form: test, discharged_by: test_947_the_environment_description_never_mentions_the_world_view_namespace, binds: ["interacts(_drive_investigation->captured_payload).response", "wv_alias.identity"]}

  # ---- F3 (demand-level) — the third live-marked demand, minted with the other two ---------------------------------
  - {id: alias_answers_once_per_index_on_a_collision, minted_from: F3, kind: behavior, form: test, live: true, discharged_by: test_947_an_alias_spanning_a_colliding_document_id_answers_once_per_index, binds: [wv_alias, inject_index, exclude_predicate]}

structure:
  # The registry. `20-demands.md` coined ten; `run_id` (the brief's key for `run_dir`) and
  # `episode_token` (the sweep glob's key) join them here — see NAME RECONCILIATION above.
  axes: [episode_id, episode_token, world_id, world_token, run_id, source_run_id, base_pattern,
         view_stem, correlation_key, system, entity, agent_id]

  actors:
    # --- the two processes and what they drive (provenance: the artifact that defines them) ---
    - {id: branch_main,          frame: composition, provenance: code}   # learning/branch/cli.py::main
    - {id: run_main,             frame: leg,         provenance: code}   # run.py::main (gains --resume/--world)
    - {id: _drive_investigation, frame: leg,         provenance: code}   # run.py::_drive_investigation
    - {id: redirect,             frame: leg,         provenance: code}   # estate/stagers/elastic.py::redirect
    # --- the new legs the design introduces ---
    - {id: questioner,           frame: composition, provenance: design} # learning/branch/questioner/
    - {id: compare,              frame: leg,         provenance: design} # learning/branch/comparator.py::compare
    - {id: stage_world,          frame: leg,         provenance: design} # learning/branch/estate/staging.py
    - {id: teardown,             frame: leg,         provenance: design} # staging.py::teardown
    - {id: sweep,                frame: leg,         provenance: design} # staging.py::sweep
    - {id: review,               frame: composition, provenance: design} # learning/branch/review.py
    - {id: archive,              frame: leg,         provenance: design} # learning/branch/archive.py
    - {id: delta_o,              frame: leg,         provenance: design} # learning/branch/episode.py::delta_o
    - {id: verdicts,             frame: leg,         provenance: design} # learning/branch/episode.py::verdicts
    # --- the grounded neighborhood (10-brief.md): co-writers, sibling surfaces, consumers ---
    - {id: prime_base,           frame: leg,         provenance: code}   # learning/branch/capture.py::prime_base
    - {id: run_investigation,    frame: leg,         provenance: code}   # runtime/driver::run_investigation
    - {id: world_applier,        frame: leg,         provenance: code}   # estate/applier.py (_touches, unnameable, apply)
    - {id: world_registry,       frame: leg,         provenance: code}   # estate/registry.py (validate_world_touches, __init__)
    - {id: elastic_adapter,      frame: leg,         provenance: code}   # scripts/adapters/elastic_adapter.py
    - {id: scrub,                frame: leg,         provenance: code}   # runtime/scrub.py::scrub
    - {id: trace_lesson,         frame: composition, provenance: code}   # learning/ops/trace_lesson.py::in_context_cases
    - {id: held_out,             frame: composition, provenance: code}   # evals/held_out.py::index_runs
    # ADDED AT PHASE E from 48-consumers-probe (executed). `skills/invlang/corpus.py::load_corpus`
    # rglobs every `investigation.md` under the runs base and is invoked HOST-SIDE at every
    # ordinary run's ORIENT through the `defender-invlang` bash shim, so no Python reference walk
    # ties it to the runs base and it was in NO census — not the profile's `runs_base.readers`,
    # not the brief, not any of the five lenses. It is the consumer that systematically biases:
    # executed, one episode moved the printed denominator 2 -> 5 and multiplied every ranked
    # count fourfold. Modelled here so the containment demand has an address to bind.
    - {id: load_corpus,          frame: leg,         provenance: code}   # skills/invlang/corpus.py::load_corpus

  boundaries:
    # ===== the episode's own files ==========================================================
    - id: family_yaml
      provenance: design
      facets:
        payload:
          parts:
            - {role: episode, source: const:LAUNCHER_DERIVED}        # episode_id, source_run_dir/_id, branch_message_id, fences_at, as_of
            - {role: instrument, source: const:OPERATOR_SUPPLIED}    # continuation_prompt — G7 refuted: the design names NO author (FORK-5)
            - {role: authored, source: template:QUESTIONER_OUTPUT, slots: {base_story: captured_payload, discriminator: envelope, worlds: overlay}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the family manifest: the launcher's derived half, the operator's instrument field and the questioner's authored half, one document, validated into `Family` before any other step reads it"
    - id: staged_yaml
      provenance: design
      facets:
        payload:
          parts: [{role: entry, source: template:STAGING_ROW, slots: {world: world_token, name: wv_alias, kind: elastic_cluster, derived_from: base_pattern}}]
          invariants: [all-slots-bound]
          nl: "one append-only row per created name — world, name, alias|index, what it was derived from, when"
        identity:
          sharing: serialized-append   # append-only ACROSS worlds; F9 makes it the sole record of a cluster write
          evidence: {nl: "the design's Staging type is `append-only, written before each create`; F9 establishes the write door bypasses `guard_outbound`, so nothing else records the write"}
    - id: review_yaml
      provenance: design
      facets:
        payload:
          parts:
            - {role: consistency, source: template:REVIEW_CONSISTENCY, slots: {control_mismatch_keys: captured_payload, mismatches: compare}}
            - {role: reachability, source: template:REVIEW_REACHABILITY, slots: {envelope_ran: envelope, injected_retrieved: inject_index, patched_visible: overlay, exclusion_matches: exclude_predicate}}
            - {role: decision, source: const:ACCEPTED_OR_REJECTED}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "per world: the consistency block, the reachability block, the inventions notes and the decision"
    - id: episode_dir
      provenance: code
      facets:
        identity:
          key_axes: [episode_id]
          evidence: {nl: "`{episodes_root}/{episode_id}/` after §7's FORK-13 answer and its round-2 refinement — the episodes root is a CONFIGURED location outside both the runs base and the checkout, never `resolve_runs_base()/'episodes'` as `cli.py:146` composes it today (`{runs_base}/episodes/{episode_id}/`, read off capture.py:130-136, is the PRE-relocation reading and is false of this design); G8 (census, holds): the dir is created as a side effect of `_io.append_jsonl`'s parent mkdir, NOT `guarded_mkdir`, and NOTHING anywhere removes one — whether that create is exclusive or check-then-act is PO-C8, executed and REFUTED (check-then-act; FORK-2 mints the exclusive create)"}
          sharing: unique-key
    # ADDED AT §7 ROUND 2 (F5-EPISODE-ROOT, human). The episodes root is a knob, not a derivation:
    # `resolve_runs_base().parent / "episodes"` is `/workspace/episodes` under the devcontainer's
    # documented `DEFENDER_RUNS_BASE=/workspace/.defender-runs` — inside the checkout — and every
    # re-derivation from the runs base puts `episodes/` back inside the tree `load_corpus` rglobs.
    # There is deliberately NO default: an absent configuration refuses rather than inventing a
    # location, because a silent fallback is exactly the derivation this answer removed.
    - id: episodes_root
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "an absolute directory, read from configuration; refused when it resolves inside the runs base or inside the checkout"}
          default: null
          distinguished: ["absent"]
          falsy_valid: false
          documented_alternatives: []
    - id: worlds_dir
      provenance: design
      facets:
        payload:
          parts:
            - {role: report, source: const:REPORT_MD}
            - {role: document, source: const:INVESTIGATION_MD}
            - {role: tables, source: template:STAGE_TABLES, slots: {queries: run_dir, gather: run_dir}}
            - {role: stamp, source: const:PROVENANCE_JSON}
            - {role: verdict, source: const:SCRUB_VERDICT_JSON}
            - {role: pointer, source: const:RUN_DIR_TEXT_POINTER}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the archived world: report, investigation document, the two tables through the screened copy path, the stamp, the scrub verdict, and a run-dir pointer no reader follows"
        identity: {key_axes: [world_id], evidence: {nl: "`{episodes_root}/<id>/worlds/<X>/` — the design's archived-world row, one directory per world label X, under the CONFIGURED episodes root (F5-EPISODE-ROOT), never under the runs base"}, sharing: unique-key}
    - {id: family_stamp, provenance: design, facets: {payload: {parts: [{role: agreed, source: const:AGREED_PROVENANCE}, {role: override, source: const:ALLOW_DIRTY}], invariants: [roles-disjoint-sources], nl: "`{episodes_root}/<id>/provenance.json` — the agreed family stamp plus whether the dirty override was given"}}}

    # ===== identity and naming ===============================================================
    - {id: episode_token, provenance: design, facets: {}}   # the injective, nameable rendering of episode_id (C11)
    - {id: world_token,   provenance: design, facets: {}}   # f"{episode_token}.{X}" — the one spelling four sites compare on
    - id: wv_alias
      provenance: design
      facets:
        identity:
          key_axes: [world_token, base_pattern]
          evidence: {nl: "`world_view(pattern, token) = f\"wv-{token}-{_view_stem(pattern)}\"`, executed over the 11 shipped base patterns (G12, X2): admitted for its own token, refused for a sibling's, unreached by the base pattern"}
          derivations: [{value: view_stem, fn_of: base_pattern, injective: false}]   # `_view_stem` trims the trailing `*` ONLY — two overlay keys can collapse onto one stem (FORK-3c)
          sharing: unique-key
    - id: inject_index
      provenance: design
      facets:
        identity:
          key_axes: [world_token, base_pattern]
          evidence: {nl: "`wv-{token}-{stem}.inject`, one injection index per (world, declared pattern); G13 (executed, refuted-conditionally): the `.inject` name fails `is_world_view` for a pattern with no trailing `*` — M3's own guard would refuse the index M3 must create (FORK-3a)"}
          derivations: [{value: view_stem, fn_of: base_pattern, injective: false}]
          sharing: unique-key
    - id: container_name
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "`_docker.container_name(run_id) = f\"defender-run-{run_id}\"`; `_reap_stale_before_create` refuses any state outside {exited, dead}, `created` included (F12, C18) — which is why concurrent siblings cannot reap each other"}
          sharing: unique-key
    - id: agent_trace
      provenance: code
      facets:
        identity:
          key_axes: [agent_id]
          evidence: {nl: "the brief's role census: `observe` keys its sequence and id on `agent_id`, never on the role, so the assertion that can actually fail is the exact agent_id list (tests/test_787_review_cost.py:187-209) — three questioner calls and the comparator's call share one role key and must differ here"}
          sharing: unique-key

    # ===== the corpus and its doors ===========================================================
    - id: elastic_cluster
      provenance: code
      facets:
        access:
          constraints_by_via:
            api: {trust: attacker-influenced, constraints: [confine-read-endpoint, confine-index, bounded-end-at-as-of, size-clamp-20]}
            esql: {trust: attacker-influenced, constraints: [serve-point-world-view-refusal]}   # FORK-6 (resolved by the human): a call naming another world's view is REFUSED, and the refusal sits at the serving registry's serve point — above per-world staging, so it covers the control world that stages nothing. `guard_outbound` cannot host it (executed: it reads the index off the URL, and ES|QL carries it in the body); `esql` itself still confines nothing on its FROM clause (PO-C17, executed and refuted), which is why the check is minted above it rather than pointed at.
            staging-door: {trust: operator, constraints: [world-view-namespace-guard, reach-check, executable-clause-denylist, write-ahead-record]}
          nl: "the cluster is reachable over three surfaces: the read-confined adapter door, the ES|QL arm that confines nothing, and the new host-side write door only staging calls"
    - id: base_pattern
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "an Elasticsearch index pattern; ONE boundary for `ELASTIC_EVENTS_INDEX` and `ELASTIC_ALERTS_INDEX` — identical contract, different default — plus the nine narrower `FROM` sources the shipped query corpus names (G11, 11 distinct patterns)"}
          default: "logs-*"
          distinguished: ["no-trailing-wildcard", "*", "duplicate-view-stem", "unset-index"]   # FORK-3: (a) G13's inject-name refusal, (b) X2b's ViewNameError, (c) two keys trimming to one stem; `unset-index` is F5 (§7 round 2, human): a query/alerts call addressing the run's CONFIGURED DEFAULT, which `redirect` refuses today and still refuses
          falsy_valid: false
          documented_alternatives:
            - {value: ".internal.alerts-security.alerts-default-*", crosses_validation: true}
            - {value: "per-call-index-override", crosses_validation: true}
    - {id: envelope, provenance: design, facets: {}}   # the discriminating query the manifest declares
    - id: exclude_predicate
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "model-authored query DSL sent to a real cluster as an alias filter; `null` means injection-only"}
          default: "null"
          distinguished: ["null", "zero-match", "script", "script_score", "runtime_mappings",
                          "match-all", "unparseable", "nested-executable-clause", "count-failed"]
          falsy_valid: true
          documented_alternatives: []
          # match-all → FORK-7(a) (the mirror O3 never states), SPELLED `match_all` and admitted by
          # FORK-16's grammar since §7 round 2 (F6-MATCH-ALL): the human's allow-list had no
          # spelling for a full-match exclusion, so the member FORK-7 requires to be RECORDED had
          # no admissible form and its demand was green in the suite and unreachable in
          # production; unparseable and
          # nested-executable-clause → FORK-16 (the Security section states the universal as a
          # CLASS and M3 states it as a literal three-name census; they are not the same rule).
    - id: overlay
      provenance: design
      facets:
        payload:
          parts:
            - {role: patches, source: template:PATCH_TABLE, slots: {system: system, entity: entity}}
            - {role: elastic, source: template:ELASTIC_OVERLAY, slots: {pattern: base_pattern, inject: inject_index, exclude: exclude_predicate}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "patches keyed system → entity → field for the six state systems, and an elastic half keyed by the base pattern it stages"
        domain:
          type: str
          refinement: {nl: "overlays are data (N5); an empty mapping or empty entry normalises to absent, and `touches` is derived from the keys on every read"}
          default: "{}"
          distinguished: ["empty", "undeclared-pattern", "invented-entity", "unknown-system"]
          falsy_valid: true    # world A IS the empty overlay — the falsy member is a first-class world
          documented_alternatives: [{value: "capture-FROM-source", crosses_validation: true}]

    # ===== the captured past =====================================================================
    - id: captured_payload
      provenance: code
      facets:
        payload:
          parts:
            - {role: system, source: const:PROMPT_SYSTEM}
            - {role: user, source: template:PROMPT_TEMPLATE, slots: {evidence: captured_payload, alert: source_run_dir, frontier: source_run_dir, axis: axis}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "every captured artifact reaching a model prompt — the questioner's three inputs and the comparator's two payloads — wrapped by `_untrusted.wrap_fresh`; X11 (holds): `prime_base` primes the WHOLE capture, not a slice at the branch point"
    - {id: base_ledger,  provenance: code, facets: {}}   # served/base.jsonl (ledger.py::base_file)
    - id: world_ledger
      provenance: code
      facets:
        identity:
          key_axes: [world_token]
          evidence: {nl: "`served/{world token}.jsonl`, one writer per file (`Ledger.for_world`, X8: refuses an id that is not a single filename component and refuses the literal `base`); F14: under D1 the writers become PROCESSES, so the per-file `threading.Lock` protects nothing and one-writer-per-path is the whole invariant"}
          sharing: unique-key
    - id: source_run_dir
      provenance: code
      facets:
        access:
          constraints_by_via:
            launcher-copy: {trust: attacker-influenced, constraints: [lstat-screen-artifact_file]}   # today's ONLY screen (cli.py:238-250) — and D1 deletes the frame it lives in (G6, F6)
            launcher-alert-read: {trust: attacker-influenced, constraints: [lstat-screen-artifact_file]}   # §7 round 2 (FINDING-4): the launcher's OWN host-side read of `alert.json` for the questioner's prompt — a THIRD reader, and the one that inherits the screen the deleted frame carried
            resume-seed: {trust: attacker-influenced, constraints: [lstat-screen-artifact_file]}     # FORK-19 (resolved): `run.py --resume` screens the source alert through the same `_run_paths.artifact_file`; PO-C15 shows `_inherit_evidence` already does, so this is a regression witness
            questioner-frontier-read: {trust: attacker-influenced, constraints: [lstat-screen-artifact_file]}   # FORK-19 (resolved): the questioner screens `investigation.md` through the same call — the genuinely NEW control, since `read_text_soft` follows a link at base
          nl: "the source run dir is a prior box's rw bind, so its contents are model-writable; `materialize_run_dir` copies with a link-following `shutil.copy`"

    # ===== the run dirs and what watches them ======================================================
    - id: run_dir
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "`{base}/{run_id}/` from `run_common.materialize_run_dir`, where `base` is whatever `DEFENDER_RUNS_BASE` the process was handed; M6 fixes `run_id = f\"{episode_id}-{X}\"`, and after §7 FORK-13 a SIBLING's base is `{episode_dir}/runs`, not the operator's runs base. C17's stated reason for putting siblings beside the source — that `open_source_store` requires it — is REFUTED (4a-RF2, executed): `open_source_store` derives its base from the SOURCE run dir (`_spec.py:103,113`) and is only ever called on it, so nothing requires a sibling under the runs base"}
          sharing: unique-key
    - {id: runs_base, provenance: code, facets: {}}   # after §7 FORK-13 its children are ordinary run dirs and their scrub-verdict sidecars ONLY: no `episodes/`, no sibling run dir. The sidecar is distinguished by its suffix (G17)
    - id: session_store
      provenance: code
      facets:
        identity:
          sharing: serialized-append
          evidence: {nl: "the ONE mutable resource D1 newly contends: every sibling forks into the SOURCE run's store, and with D1 those forks are N processes. WAL + `busy_timeout` 30 000 ms + `BEGIN IMMEDIATE` on every append are what make that safe (C28/G16); G16's residual, unprobed: WAL's guarantee is per-filesystem and this is not provable without N real processes"}
    - id: provenance_json
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "`RunProvenance`: commit, THREE-VALUED `dirty`, dirty_paths, unavailable and `scope` — X17/G20: None means git could not be asked, and collapsing it into False is 'the one error a provenance record must not make'"}
          default: "clean"
          # `dirty-none` and `unavailable` are TWO producible shapes, not one: `capture_tree`'s
          # git-status arm returns `commit=<sha>, dirty=None, unavailable="git status: …"` and its
          # git-unreachable arm returns `commit=None, dirty=None, unavailable="<reason>"`. FORK-10's
          # answer refuses on all three arms absent `--allow-dirty` (§7 round 2, F4 settled).
          distinguished: ["dirty-true", "dirty-none", "unavailable", "absent", "unreadable"]
          falsy_valid: false
          documented_alternatives: []
    - id: scrub_verdict
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "`tree_verified` reads ONLY `ran: true` and says so ('NOT a contents-intact claim'); G17 (refuted): the file is a SIDECAR beside the run dir — `verdict_path(tree) = tree.parent / f'{tree.name}.scrub-verdict.json'` — so the archive must reach a runs-base path, not a run-dir one (FORK-15)"}
          default: "ran-true"
          distinguished: ["absent", "not-ran-true"]
          falsy_valid: false
          documented_alternatives: []
    - id: RETURNED_DOC_CAP
      provenance: code
      facets:
        domain:
          type: int
          refinement: {nl: "`_build_search_body` sets `size: min(limit, RETURNED_DOC_CAP)`; the envelope reports `total`/`returned`/`truncated`, none of them id-specific (F8, G18)"}
          default: 20
          distinguished: ["21"]    # FORK-7(e): an injection larger than one page cannot be counted the way O3 says to count it
          falsy_valid: false
          documented_alternatives: []

    # ===== knobs and enums the flow reads ===========================================================
