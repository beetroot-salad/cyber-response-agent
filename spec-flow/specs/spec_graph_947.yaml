# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. An operator names (source run, N); a deny-all QUESTIONER role authors a triplet of
# worlds into `{episodes_root}/<id>/family.yaml`; staging writes a per-world Elasticsearch corpus
# under the `wv-` namespace, write-ahead-recorded in `staged.yaml`; a replay review rejects any
# world that contradicts the capture or whose declared difference is unreachable; each accepted
# world then runs as its own `run.py --resume` PROCESS under `{episode_dir}/runs/` — NOT beside
# the source run, which is the pre-§7 layout FORK-13 replaced, and NOT under the operator's runs
# base at all; the launcher verifies every scrub and stamp, archives each world under
# `worlds/<X>/`, and two derived readers (`delta_o`, `verdicts`) compute from the episode dir
# alone. The episodes root is CONFIGURED, outside both the runs base and the checkout
# (F5-EPISODE-ROOT); every `episodes/<id>/` spelling in this file is shorthand for
# `{episodes_root}/<id>/`, never for a path derived from the runs base. Nine mechanisms M1–M9, eleven
# obligations O1–O11, three human decisions D1 (a sibling is a process), D2 (`World.touches`
# retires; systems are derived from the overlay), D3 (the episode dir is self-contained).
#
# WHAT PHASE D DID, AND WHAT IT DELIBERATELY DID NOT DO.
#
#   NOTE ADDED AT PHASE E-REPAIR: paragraph 1 below is a record of what PHASE D did, not the
#   current state. All 19 forks and all 5 demand-level forks are RESOLVED — see `handoff.forks`,
#   `70-resolutions.md` (round 1) and `71-resolutions-2.md` (round 2), which is the authority on
#   F1/F2/F4/F5, on F5-EPISODE-ROOT (the episodes root is CONFIGURED, outside both the runs base
#   and the checkout, never derived from the runs base) and on F6-MATCH-ALL.
#
#   1. THE 19 FORKS ARE UNRESOLVED AND STAY UNRESOLVED HERE. `45-dispositions.md` collapsed 64
#      fork-listed premises into FORK-1..19; the human seam (§7) runs AFTER the gate. This file
#      represents them the way the dispositions record them — as structure whose cells no demand
#      answers (an `axis` that may or may not admit `""`, an `esql` via whose confinement policy
#      is `unknown`, an `exclude_predicate` member for `match-all`/`unparseable`/nested clauses,
#      a `base_pattern` with no trailing `*`) and as `handoff.forks` entries. NO READING WAS
#      PICKED. An unanswered R4/R3/R0 cell below is a fork made mechanical, not an oversight.
#
#   2. PHASE D MINTED 14 DEMANDS THE DISPOSITIONS ASKED FOR (`d_*` ids below, each tagged with
#      its settled premise S-number). Two are the red-flagged security surfaces nothing
#      downstream would have noticed: the structured-dumper guarantee (S41/PO-C9) and the parity
#      demand that an ORDINARY run still starts once QUESTIONER joins `AGENTS` (S42/PO-C26 —
#      `preflight_role_models` sweeps `AGENTS.values()` at every run start and exits 2 on an
#      unusable thunk). The other twelve carry settled assertions no inherited demand held.
#
#   3. FIVE INHERITED ADDRESSES DID NOT RESOLVE and were repaired (R0 would have called every one
#      of them a dangling address). `<b>.domain.default` is not an address form in schema.md —
#      `allow_dirty.domain.default`, `no_learn.domain.default` and `label_basis.domain.default`
#      became `<b>.domain`; `world_role.domain.falsy_valid` became `world_role.domain`;
#      `overlay.domain.documented_alternatives[...]` became `overlay.domain.alternatives[...]`
#      (the cell regex spells it `alternatives`). Two more were re-sited rather than repaired:
#      `family_yaml.domain.distinguished[as_of]` became `as_of.domain` + a boundary of its own
#      (T0 is a valued input with three distinguished shapes, not a member of the manifest's
#      domain), and `QUESTIONER_DEF.identity` became `agent_trace.identity` — the brief's role
#      census established that the collision that can ACTUALLY happen is on the `agent_id` the
#      trace and wire rows key on, never on the role key (`observe` keys `seq` on `agent_id`).
#
#   4. NAME RECONCILIATION across the three coining passes:
#      * `run_id` and `episode_token` join the axis registry — the brief keys `run_dir` on the
#        first and the sweep glob on the second; `20-demands.md`'s ten axes had neither.
#      * `episode_token`, `world_token` and `base_pattern` are BOTH an axis and a boundary. The
#        boundary is the rendering rule (what `episode_token_injective` binds); the axis is the
#        dimension a sink's key varies on. Same word on purpose: two names would be the
#        join-breaker the registry exists to prevent.
#      * `base_pattern` is ONE boundary for `ELASTIC_EVENTS_INDEX` and `ELASTIC_ALERTS_INDEX`
#        (identical contract, different default) — the brief censuses them as two knobs, the
#        overlay keys on the value space they share.
#      * The profile's resource roots `run_dir`, `runs_base`, `episode_dir`, `session_store`,
#        `ticket_store`, `learning_queue` keep the profile's spelling; `elastic_corpus` is
#        spelled `elastic_cluster` here, as `20-demands.md` coined it, because the boundary this
#        change contends is the cluster's WRITE surface and the profile row is a read-only root.
#
#   5. THE GATE RECORD IS NOT HERE. `gate:` is the gate leaf's (phase D, step 6). This file is
#      the address space it computes over.
#
# SETTLED-PREMISE MAP (the premise→demand edge phase F reconciles; 45 settled, 0 dropped).
#   S1 →d_resume_refuses_an_unknown_world   S2 →d_as_of_naive_or_non_utc_refused
#   S3 →d_manifest_with_zero_worlds_refused S4 →d_patch_system_outside_the_six_refused
#   S5,S8,S9 →patch_unreachable_rejects     S6 →overlay_shape
#   S7 →injection_unreachable_rejects       S10,S18 →teardown_verifies_each_gone
#   S11 →d_staging_record_is_durable_before_the_create
#   S12 →delta_o_return                     S13,S44 →episode_self_contained
#   S14 →write_ahead_record                 S15 →d_sweep_touches_only_its_own_token
#   S16 →d_preflight_runs_at_family_and_in_each_sibling
#   S17 →siblings_run_concurrently (process independence; the launcher's RESPONSE is FORK-1)
#   S19 →episode_token_injective            S20,S25,S35,S37 →d_absent_or_unreadable_stamp_marks_incomplete
#   S21 →per_process_stamp                  S22 →concurrent_fork_into_source_store
#   S23,S45 →unverified_scrub_marks_incomplete
#   S24 →dirty_refused_without_override     S26,S30,S34 →teardown_runs_on_every_exit
#   S27 →control_replayed_first             S28 →undeclared_pattern_passthrough
#   S29 →d_production_read_path_unaffected_while_staged
#   S31 →teardown_failure_recorded          S32 →d_a_failed_exclusion_count_is_not_a_zero_match
#   S33,S36 →d_a_fault_is_never_a_contradiction
#   S38 →comparator_prompt_builder_blind    S39 →d_staged_names_reach_the_transport_as_arguments
#   S40 →comparator_mechanical_first        S41 →d_free_text_stays_an_opaque_scalar
#   S42 →d_an_ordinary_run_still_starts_after_the_role_lands
#   S43 →sibling_enqueues_nothing
# ===========================================================================================

