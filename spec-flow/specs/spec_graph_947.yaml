handoff:
  # ALL 19 FORKS AND ALL 5 DEMAND-LEVEL FORKS ARE RESOLVED. Each entry carries the question, the
  # fork's own recommendation from 45-dispositions.md (relayed), and the reading §7 took — 7 by
  # the human and 12 auto at round 1 (70-resolutions.md), plus 2 human answers and 4 demand-level
  # forks at round 2 (71-resolutions-2.md). The merge-gate human reads THIS list to disagree with
  # the choices, so a decided question reported as open here is a defect in the baton: F4 was
  # decided by the human's FORK-10 answer at round 1 and still read UNRESOLVED until round 2.
  # 14 of the 19 sit on ONE surface — what the launcher does when an episode does not go cleanly —
  # and FORK-1/2/8/9/14 are one missing design section; answering them one at a time will produce
  # five inconsistent rules. FORK-3 and FORK-14 must be answered TOGETHER (per-world refusal vs
  # step 4's all-or-nothing collide head-on).
  forks:
    - "FORK-1 — the `incomplete` family: step 6 creates a third episode outcome and no type holds it (Review.decision is accepted|rejected, Family has no status, the family stamp is written only on agreement), so `incomplete` is carried by the ABSENCE of a file and every question about a partially good family falls through. 7 members, all-hedge but one. Recommendation relayed: (A) model the outcome, make it a fourth teardown trigger, archive each individually clean sibling while withholding only the family stamp. RESOLVED — resolved_by: human: (A), model the outcome. `outcome: accepted|rejected|incomplete` plus reason is a real field; `incomplete` is a fourth teardown trigger; each individually clean sibling archives while only the family stamp and the comparability claim are withheld. Minted 4 demands (`minted_from: FORK-1`)."
    - "FORK-2 — relaunch after a death: `episode_id` is derived, so the same (source, N) resolves to the same episode dir and the same `wv-{episode_token}.*` namespace, and M9's sweep sentence carries two rules that contradict exactly there ('remove my own token' vs 'refuse anything outside staged.yaml'). F16 adds that a mid-prime failure makes that (source, N) permanently unbranchable with no cleanup path anywhere. 6 members. Recommendation relayed: (C) split the rules by scope, plus an exclusive-create that adopts a dir holding no family.yaml. Gated by PO-C8. RESOLVED — resolved_by: auto: (C) split M9's two clauses by scope (sweep inside my own token; refuse only a `wv-` name whose token is not mine), plus an exclusive-create that adopts a dir holding no `family.yaml`. Minted 2 demands (`minted_from: FORK-2`)."
    - "FORK-3 — name algebra: (a) G13, executed — for a base pattern with no trailing `*` the alias name passes `is_world_view` and the `.inject` name FAILS it, so M3's own guard refuses the index M3 must create; (b) X2b, executed — a bare `*` pattern raises ViewNameError and no Elastic world can be staged at all; (c) two overlay keys can trim to one view stem (carried in the slots as `view_stem`, injective: false); plus the twin-gate question (the overlay-key allowlist and `_reach_ok` may not normalise identically). Recommendation relayed: (C) for the config half, (B) for the overlay half, one predicate for the twin gates. Gated by PO-C10. MUST BE ANSWERED WITH FORK-14. RESOLVED — resolved_by: auto: (C) for the config half — every configured corpus pattern must end in `*` and not be a bare `*`, refusing the launcher otherwise; (B) for the overlay half, following FORK-14; validation now calls `_reach_ok` so the twin gates cannot diverge. Minted 4 demands (`minted_from: FORK-3`)."
    - "FORK-4 — questioner-authored identity: whether X is validated for nameability before composition, whether world_ids are checked for case-folded distinctness the way cli.py's parser checks them, whether a source run id that cannot render ever has a remedy, and where `world_id == \"base\"` is refused (X8 puts it inside a sibling, long after staging). Recommendation relayed: (A) one identity gate before anything is staged, plus (ii) a total escape. Gated by PO-C13. RESOLVED — resolved_by: auto: (A) one identity gate before anything is staged (nameable, case-folded distinct, not `base`, roles distinct, composed token round-trips), plus (ii) a total escape so no historical run id is permanently unbranchable. Minted 2 demands (`minted_from: FORK-4`)."
    - "FORK-5 — what `Family` validation actually checks: unknown top-level fields, world cardinality, 'one of them is the base', an empty-string axis on a non-base world, `disposition_declared`'s domain (the report's is gated by DISPOSITION_ENUM and the manifest's is not), a manifest hand-edited after review (O1's own second observed-failing-by, with no instrument), and — G7, refuted — `continuation_prompt`, a required BranchSpec field the design gives NO producer. 9 members. Recommendation relayed: (A) strict loader, (ii) operator-supplied continuation_prompt, plus a manifest digest. Gated by PO-C14; the empty-axis member is carried as `axis.domain.distinguished[\"\"]`. RESOLVED — resolved_by: human (continuation_prompt half) + auto (remainder): the operator authors `continuation_prompt` via the existing `--continuation-prompt` flag; the loader is strict (unknown top-level fields refused, cardinality enforced, empty axis on a non-base world refused, `disposition_declared` gated by the report's enum), plus a manifest digest recorded in the review record and rechecked on resume. Minted 7 demands (`minted_from: FORK-5`)."
    - "FORK-6 — cross-world corpus isolation inside one episode: `esql` confines nothing on its FROM clause and `redirect` passes any undeclared index through, so a sibling naming ANOTHER world's alias literally reads that world's staged corpus — its injection and the effect of its exclusion. The readers materially disagree about whether the design has DECIDED to accept this (copy2's attribution to N11 is wrong on its face: N11 is about an undeclared base pattern). Recommendation relayed: (A) enforce isolation with the predicate that already exists, stated as (C) a named security asset. Carried in the slots as `elastic_cluster.access[esql].constraints: unknown`. Gated by PO-C17. RESOLVED — resolved_by: human: both the invariant and the refusal (option A, stated as C). The model never learns staged indices exist, and a call naming another world's view is refused at the registry's serve point — above per-world staging, so it also covers the control world that stages nothing. Minted 3 demands (`minted_from: FORK-6`)."
    - "FORK-7 — O3/O4 review semantics: (a) the mirror of the zero-match exclusion (a match-all exclusion whose world is only its own injection); (b) whether delta_o subtracts the control's drift keys the way review does; (c) a document timestamped EXACTLY at as_of (C20, unprobed, needs the live playground); (d) an injected _id colliding with a base document (DISCOUNT 1: copy2's ordering answer rests on a mechanism no claim covers — PO-J1 minted); (e) G18/F8 — RETURNED_DOC_CAP = 20, so M4's id-based count cannot see an injection larger than one page, which is a correctness bug in O3 as written. Recommendation relayed: (A) for drift-subtraction and the injection count, (B) for the full-match exclusion; no recommendation on T0 without the probe. Gated by C20, PO-J1, PO-C25. RESOLVED — resolved_by: auto: (A) for drift-subtraction and the injection count (the count moves to the staging door's `_count`); (B) for the full-match exclusion. Minted 3 demands (`minted_from: FORK-7`)."
    - "FORK-8 — step-1 preflight: four preconditions with no stated check, each of which fails AFTER the questioner is paid for or after the cluster is written to — N out of range for the derived fences_at, a missing/screened alert.json, the staging door's own container and credential (M3 names the door host-side and names no source for either), and a cluster the sweep cannot reach. Recommendation relayed: (A) one preflight block, and the write door's environment must be answered regardless — a sweep that cannot reach the cluster must refuse, not skip, or M9's whole crash-recovery story is a no-op. RESOLVED — resolved_by: auto: (A) one preflight block — N in range, alert present and link-screened, cluster reachable, write door's container/credential resolve, sweep completed; a sweep that cannot reach the cluster refuses rather than skips. M3's write-door container/credential source remains a design hole routed to the issue thread. Minted 2 demands (`minted_from: FORK-8`)."
    - "FORK-9 — abort or continue after a partial failure mid-episode: six premises ask the same question at six points (comparator mid-pass, one questioner axis call, staging half-succeeded, a create failing after its name is recorded, a create timing out, an unparseable create response). M9's teardown-on-exception covers cleanup and says nothing about control flow. Recommendation relayed: (A) one rule — any failure in steps 2–4 aborts, tears down and archives the record — with (C) as an option if the human wants review to survive a flaky model (note (C) interacts with F2). Gated by PO-C3. RESOLVED — resolved_by: auto: (A) one rule — any failure in steps 2-4 aborts the episode, teardown fires, the record archives; composes with FORK-1's answer (everything before step 5 aborts cleanly, everything after is the incomplete-family path). Minted 2 demands (`minted_from: FORK-9`)."
    - "FORK-10 — what the family holds constant besides the commit: RunProvenance carries commit, three-valued dirty, scope and unavailable, and NOTHING carries the resolved model, while preflight_role_models resolves per process — three siblings launched into a changed environment can be a comparison across two models with a perfectly agreeing stamp. Plus the git race D1 newly manufactures (DISCOUNT 2: copy2's retry answer rests on a retry no claim establishes). Recommendation relayed: (A) record the resolved model per sibling and require agreement; pin the race by F4's reading. Gated by PO-C20. RESOLVED — resolved_by: human: (A), record the resolved model and require agreement. The family stamp compares the resolved model alongside commit and scope; a cross-model family refuses rather than passing with an agreeing stamp. Minted 2 demands (`minted_from: FORK-10`)."
    - "FORK-11 — the resume invocation's argument surface: whether the positional `alert` becomes optional under --resume, and what happens when a manifest and a mismatched alert path are both supplied. Recommendation relayed: (A) --resume makes `alert` illegal, which is the reading O1 forces and the only version where `manifest_self_sufficient` has a sharp test. Gated by PO-C29. RESOLVED — resolved_by: auto: (A) `--resume` makes the positional alert illegal; supplying both refuses, naming the conflict. Minted 1 demand (`minted_from: FORK-11`)."
    - "FORK-12 — taint propagation across chained model calls: Call 1 reads wrapped-untrusted inputs and its outputs seed Calls 2 and 3; the design states the wrap only on the ORIGINAL inputs. All three readers hedged. Recommendation relayed: (A) taint propagates, re-wrap — the questioner's output is the only authority for what gets written to a real cluster. Gated by PO-C16. RESOLVED — resolved_by: auto: (A) re-wrap — Call 1's output is wrapped untrusted before seeding Calls 2 and 3. Minted 1 demand (`minted_from: FORK-12`)."
    - "FORK-13 — sibling run dirs as seen by the other runs-base readers: three synthetic, deliberately-counterfactual investigations land beside ordinary runs with nothing on disk marking them, and `trace_lesson.in_context_cases` and `held_out.index_runs` walk that base. Recommendation relayed: (C) decide per reader, and if only one is done, exclude siblings from the held-out eval index — a held-out set containing worlds authored to contain a planted answer is no longer held out. Both walkers are in the graph as code actors reading `runs_base`. Gated by PO-C27. RESOLVED — resolved_by: human: move sibling run dirs, and the episode dir with them, out of the runs base. Minted 6 demands (`minted_from: FORK-13`), including a regression witness for each of the three runs-base walkers the re-probe found (one of which, `invlang.corpus.load_corpus`, reaches the base only through the `defender-invlang` shim and is now an actor+edge in the graph)."
