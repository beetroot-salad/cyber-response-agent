  # `redirect` raises `StagingError` today when a `query`/`alerts` call leaves `index` unset and
  # no ctx resolves the configured default (X1, executed). N11 turns UNDECLARED PATTERNS into
  # passthrough and says nothing about this arm; the human kept the refusal, fail-closed, because
  # passthrough would make a whole evidence class silently become unrewritten base reads with
  # nothing reporting it.
  - {id: d_index_less_call_still_refuses, minted_from: F5, kind: domain-outcome, form: test, discharged_by: test_947_an_index_less_call_still_refuses_on_a_staged_world, binds: ["base_pattern.domain.distinguished[unset-index]", redirect, "overlay.domain.distinguished[undeclared-pattern]"]}

  # ---- FORK-18 (auto) — the empty archive ------------------------------------------------------------
  - {id: d_readers_on_an_empty_archive_return_empty, minted_from: FORK-18, kind: behavior, form: test, discharged_by: test_947_readers_over_an_episode_with_no_archived_worlds_return_empty, binds: [delta_o, verdicts, worlds_dir]}

  # ---- FORK-1 (human) — `incomplete` is a modelled outcome --------------------------------------------
  - {id: d_episode_outcome_is_a_recorded_field, minted_from: FORK-1, kind: shape, form: test, discharged_by: test_947_the_episode_outcome_is_a_recorded_field_with_a_reason, binds: ["review_yaml.payload", episode_dir]}
  - {id: d_incomplete_is_a_teardown_trigger, minted_from: FORK-1, kind: behavior, form: test, discharged_by: test_947_an_incomplete_family_is_a_fourth_teardown_trigger, binds: [teardown, branch_main]}
  - {id: d_archive_per_world_comparability_per_family, minted_from: FORK-1, kind: behavior, form: test, discharged_by: test_947_an_incomplete_family_archives_per_world_and_withholds_comparability, binds: [archive, worlds_dir, family_stamp]}
  - {id: d_readers_refuse_an_incomplete_episode, minted_from: FORK-1, kind: behavior, form: test, discharged_by: test_947_the_derived_readers_refuse_to_compare_an_incomplete_episode, binds: [delta_o, verdicts, episode_dir]}

  # ---- FORK-14 (human) — all-or-nothing rejection, recorded as an examined no --------------------------
  - {id: d_any_rejected_world_ends_the_episode, minted_from: FORK-14, kind: behavior, form: test, discharged_by: test_947_a_rejected_world_ends_the_episode_and_the_record_archives, binds: [branch_main, review_yaml, archive]}
  - {id: d_no_sibling_starts_when_any_world_is_rejected, minted_from: FORK-14, kind: negative, form: test, discharged_by: test_947_no_sibling_process_starts_when_any_world_is_rejected, binds: ["drives(branch_main->run_main)"]}

  # ---- FORK-10 (human) — the family holds the resolved model constant too -------------------------------
  - {id: d_family_stamp_carries_the_resolved_model, minted_from: FORK-10, kind: shape, form: test, discharged_by: test_947_the_family_stamp_carries_the_resolved_model_per_sibling, binds: ["family_stamp.payload", provenance_json]}
  - {id: d_cross_model_family_refuses, minted_from: FORK-10, kind: domain-outcome, form: test, discharged_by: test_947_a_cross_model_family_refuses_rather_than_agreeing, binds: [family_stamp, provenance_json, episode_dir]}

  # ---- FORK-2 (auto) — exclusive create, and the adopt half ----------------------------------------------
  - {id: d_episode_create_is_exclusive, minted_from: FORK-2, kind: uniqueness, form: test, discharged_by: test_947_two_launchers_on_one_episode_cannot_both_prime_it, binds: ["episode_dir.identity", base_ledger]}
  - {id: d_relaunch_adopts_a_manifestless_episode_dir, minted_from: FORK-2, kind: behavior, form: test, discharged_by: test_947_a_relaunch_adopts_an_episode_dir_holding_no_manifest, binds: [episode_dir, family_yaml]}

  # ---- FORK-11 (auto) — the resume argument surface --------------------------------------------------------
  - {id: d_resume_makes_the_alert_illegal, minted_from: FORK-11, kind: behavior, form: test, discharged_by: test_947_resume_makes_the_positional_alert_illegal, binds: [run_main, family_yaml]}

  # ---- FORK-15 (auto) — name the verdict's sidecar path ------------------------------------------------------
  - {id: d_archive_reads_the_verdict_sidecar_path, minted_from: FORK-15, kind: seam, form: test, discharged_by: test_947_archive_reads_the_scrub_verdict_at_its_sidecar_path, binds: ["interacts(archive->scrub_verdict)", scrub_verdict]}

  # ---- FORK-13 (human) + F5-EPISODE-ROOT (human, §7 round 2) — containment, where the episodes
