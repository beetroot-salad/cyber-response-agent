  - {id: PO-C15, kind: census, claim: "the symlink screen is invoked on both new source-tree reads (run.py --resume seeding and the questioner's frontier_at read)", probe: "PROBED IN 46-reground.md: resolved reference census over _provenance.read_guarded (pyrefly-refs) plus the read path of frontier_at_branch (_frontier.py:324) and seed_investigation (_seed.py:144)", probe_kind: search, observed: "REFUTED in half, which SPLITS FORK-19's option (A) into one new demand plus one carry-forward. The ALERT half is already enforced by branch._inherit_evidence, so its demand is a regression demand. The frontier_at half is a genuinely new control: frontier_at_branch and seed_investigation both read a model-writable investigation.md through read_text_soft, which FOLLOWS A LINK, at base — the exposure is PRESENT AT BASE and M1 adds a third reader of the same file. read_guarded exists and refuses correctly and has exactly one production caller, so the fix is one call each — which makes FORK-19's option (B) harder to justify than the fork's framing assumed.", verdict: refuted}
  - {id: PO-C16, kind: referential, claim: "the existing multi-call fan-out re-frames a model's intermediate output before it seeds the next call", probe: "PROBED IN 46-reground.md: read _untrusted.py:28's wrap_fresh contract and the oracle fan-out's prompt-assembly path M1's three calls are modelled on", probe_kind: read, observed: "HOLDS, with a distinction FORK-12 should absorb: the precedent DOES re-frame, but on a stage salt whose collision resistance is entropy rather than construction. Three positions are now distinguishable and each is testable without a model — (A1) re-frame with the stage salt as the oracle does, safe only while the framed party cannot see or guess it; (A2) re-frame with wrap_fresh, safe by construction and what the tool-return path already uses; (B) do not re-frame, which the existing fan-out does NOT do and which should not be adopted silently.", verdict: holds}
  - {id: PO-C17, kind: reachability, claim: "every Elastic read path confines an index name in the world-view namespace, so a sibling cannot read another world's staged corpus", probe: "PROBED IN 46-reground.md, executed break-attempt: an esql `FROM wv-<sibling token>-logs-` and a `query index=<same>` through the world registry", probe_kind: executed, observed: "REFUTED on the verb that carries the most traffic. The esql arm reached the transport — passthrough — while `query index=` refused it. Nothing is recorded either, because esql never consults the world at all, so copy2's 'recorded as passthrough' reading is wrong in both halves. By FORK-6's own stated condition this makes option (A) mandatory: a negative (esql naming a wv- name whose token is not this world's is refused BEFORE the transport) plus a positive control (this world's own view is served and a base pattern is unchanged).", verdict: refuted}
  - {id: PO-C18, kind: behavior, claim: "unprobed — whether the episode-dir refusal fires before or after step-1's sweep, and whether any existing path removes an episode dir", probe: "read cli.prepare_episode's ordering against M9's sweep", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C19, kind: primitive, claim: "unprobed — whether the staging record's append reaches durable storage before the create is issued, or only reaches a buffer", probe: "execute the append path and observe the file after a hard kill between append and create. Named in 45-dispositions.md's red flags; d_staging_record_is_durable_before_the_create is the demand", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C20, kind: behavior, claim: "N concurrent capture_tree calls against one checkout yield N equal RunProvenance values, with no retry anywhere in the code", probe: "PROBED IN 46-reground.md, executed: 24 concurrent capture_tree(REPO_ROOT) calls against one checkout, recording every RunProvenance", probe_kind: executed, observed: "HOLDS at this concurrency: no divergence, no `unavailable`, one record, and no retry exists in the code. DISCOUNT 2 stands — copy2's 'git contention retried by each sibling' asserts a retry the code does not have. The premise settles toward an EQUALITY assertion rather than a retry allowance. Residual the suite must not overclaim: one filesystem, one git build; X17's `unavailable` arm stays the honest fail-closed path, and FORK-10's separate question (whether unavailable in one sibling refuses the family) is untouched.", verdict: holds}
  - {id: PO-C21, kind: reachability, claim: "unprobed — whether a run dir can exist without a provenance record after a successful run", probe: "break-attempt over the materialize/stamp ordering", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C22, kind: census, claim: "unprobed — what fixes a sibling's model (the launcher's flag, the process environment, or the role definition) and whether any of it is recorded per run", probe: "census the model-resolution path from --model / $DEFENDER_MODEL to the per-run record. Feeds FORK-10", probe_kind: search, observed: "n/a", verdict: unprobed}
  - {id: PO-C23, kind: behavior, claim: "unprobed — what a fork into the source store does when the write lock is held past the busy timeout, and what the run does with it", probe: "execute N concurrent forks with a held lock", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C24, kind: behavior, claim: "unprobed — which identity the family memo keys on, and whether a staged call's prepared form ever hits a base row primed from an unstaged capture", probe: "execute the serving path over a staged world against a primed base", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C25, kind: behavior, claim: "unprobed — how a search over an alias spanning base + injection answers when the injection's mapping disagrees, or when the alias filter matches the injection", probe: "live playground: compose the M3-shaped alias and run both a _search and an ES|QL FROM through it. GATES FORK-7 — if the filter is attached alias-wide, a world's exclusion silently deletes its own injection and O3 rejects the world for the wrong reason", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C26, kind: behavior, claim: "unprobed — what an investigation's startup does with a registered role whose model or provider is unusable", probe: "execute an ordinary run with QUESTIONER registered and its model thunk broken; preflight_role_models sweeps AGENTS.values() and exits 2. Feeds S42 / d_an_ordinary_run_still_starts_after_the_role_lands", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C27, kind: behavior, claim: "the run-id grammar alone distinguishes a sibling run dir from an ordinary one for both runs-base walkers", probe: "PROBED IN 46-reground.md, executed: trace_lesson.in_context_cases and held_out.index_runs over a runs base holding a family's siblings beside ordinary runs, including a world id chosen to collide with a held-out slug", probe_kind: executed, observed: "REFUTED — the two walkers behave differently and the fork's cheap branch is only half true. in_context_cases ADMITS all three siblings with no filter to reuse. index_runs excludes them, but only incidentally by the run-id grammar, and one world-id choice re-claims a held-out slug and DISPLACES the real run. The discriminating demand: index_runs never selects a sibling for a held-out slug regardless of the world id chosen — the naive fixture passes today by accident.", verdict: refuted}
  - {id: PO-C28, kind: behavior, claim: "unprobed — what the curation marker is keyed on, and what happens to an existing marker for that key", probe: "execute enqueue_curation twice for one case id", probe_kind: executed, observed: "n/a", verdict: unprobed}
  - {id: PO-C29, kind: referential, claim: "the alert path is required by the entrypoint's argument parser and the resume path has no argument surface at all", probe: "PROBED IN 46-reground.md: read run.py:60-75 (parse_args) and the seeding path --resume will use", probe_kind: read, observed: "HOLDS, and confirms C3 at the parser rather than at the argument list. FORK-11's option (A) is a real parser change (a mutually-exclusive group) testable with two assertions that need nothing but parse_args: `--resume <manifest> --world X` with no positional parses, and `--resume` plus a positional alert exits 2 naming the conflict. Option (B)'s 'must match' comparison has no existing site to live in. G4's five threading sites are unaffected.", verdict: holds}
  - {id: PO-J1, kind: behavior, claim: "unprobed — whether a search through an alias spanning a base index and a .inject index that share a document _id returns one hit or two, and in what order", probe: "live playground: build the M3-shaped alias over a base index and an injection index holding a colliding _id, then run both a _search and an ES|QL FROM. MINTED IN 45-dispositions.md; GATES FORK-7 and its DISCOUNT 1 — it decides whether M4's id-based reachability count can be fooled by a collision", probe_kind: executed, observed: "n/a", verdict: unprobed}

