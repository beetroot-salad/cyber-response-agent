  boundaries:
    # --- the handle and the name owners (provenance: design) ------------------------------
    - id: Run
      provenance: design
      note: >-
        the same element as the actor `Run`; this half carries its contract. RESOLVED at §7 —
        demand #0's `provisional` is cleared and three of its four axes flipped the pin, which
        is why `for_tenant` and `record` are here and why the group cells' constraints now
        spell decision 11's uniform rule rather than a per-group guess.
      facets:
        access:
          constraints_by_via:
            for_tenant:
              trust: operator
              constraints: [tenant-addressed, tenant-record-agreement,
                            run-id-delegated-admission, case-stable-run-id]
              # §7 decision 1d + 8: the PRIMARY constructor for application/runtime code. This
              # is where real tenant enforcement lands once #1081/#1082 make it matter; today
              # it resolves the run against that tenant's runs base. Admission delegates to
              # today's validators by reference (demand h10), never a second rule.
              # `tenant-record-agreement` is NEW at §7 decision 22 (2026-09-21): a `tenant_id`
              # argument that disagrees with the record actually stored at the resolved runs
              # base REFUSES, naming both (demand h55). Without it the constructor added to be
              # an enforcement point enforced nothing, and both "trust the argument" and
              # "trust the record" make the mismatch silent.
              # `case-stable-run-id` is NEW at §7 decision 20: `is_case_stable_id` beside
              # `is_valid_run_id`, so `Run-1` can no longer adopt `run-1`'s directory on a
              # case-insensitive filesystem (demand h54).
            at:
              trust: derived
              constraints: [existing-directory-required, no-content-inspection, tooling-scoped]
              # §7 decision 8 CLOSED cluster A: TOTAL over existing directories, never inspects
              # contents (an empty directory is accepted with all identity fields None), and
              # refuses only a path that is not an existing directory (demand h09). Decision 1d
              # scopes it: the eval/fixture/tooling escape hatch, not a second front door (h07).
            under:
              trust: derived
              constraints: [internal-helper, run-id-delegated-admission, case-stable-run-id]
              # §7 decision 1d DEMOTED this from a public constructor to the internal helper
              # `Run.for_tenant` is built on (demand h08). Its admission is the same delegated
              # one (h10), and s01/s02's traversal refusals are asserted at both surfaces.
              # `case-stable-run-id` is NEW at §7 decision 20 and is here as well as on
              # `for_tenant` because R3 is per-cell: admission is one rule at both surfaces
              # (demand h54), not a rule at the public one and an accident at the helper.
            record:
              trust: derived
              constraints: [read-only]
              # §7 decision 1b: NEW cell. D4's twelve descriptive fields moved off `Run` onto
              # the `RunRecord` boundary, reached here (demands h01, d42).
            tables:        {trust: operator, constraints: [read-everywhere, producer-append-only, exclusive-create]}
            facts:         {trust: operator, constraints: [read-everywhere, host-producer-write-once]}
            documents:     {trust: operator, constraints: [read-everywhere, producer-rewrite-in-place, schema-gated]}
