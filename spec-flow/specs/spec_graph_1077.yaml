# ==========================================================================================
# READ THIS FIRST — what this graph is, and what it deliberately does NOT decide
#
# demands   — 159, after the §7 rework of 2026-09-21 and the final rework of decisions 20-23
#             the same day. The 50 demands of `20-demands.md` (ids kept VERBATIM except
#             `only_provenance_differs`, RENAMED to `only_content_files_compare_by_bytes` at
#             decision 21 because the old id stated the superseded contract), then 41 `sNN_*`
#             demands minted one-per-SETTLED-PREMISE from `45-dispositions.md` (39 in its
#             "## Settled" section + F076 and F127, which the orchestrator moved fork→settled
#             after the judge wrote the file), then the 12 `gNN_*` the gate leaf minted, then
#             the 56 `hNN_*` §7 minted — one family per decision in `70-resolutions.md`,
#             including h54 (decision 20), h55 (decision 22) and clause h56 (decision 23).
#             §7 DECISION 21 SUPERSEDED DECISION 14 IN FULL: `d13`, `d14`, `s16` and
#             `h40`-`h44` were REWRITTEN, not patched, and the `O3_EXEMPT` mechanism is gone.
#             Each settled demand is `discharged_by` the premise's OWN test name so phase E's
#             author and phase F's premise-disposition conservation walk join by name.
#             The 89 forks and 40 silent branches are now ALL SETTLED in `45-dispositions.md`
#             (settled 170 / forks 0 / silent_branches 0 / drops 0) and their outcomes are the
#             `hNN_*` demands here; `handoff.forks` carries each decision with `resolved_by`.
#
# DEMAND #0 IS RESOLVED (§7, 2026-09-21) AND THIS GRAPH IS RE-DERIVED AGAINST THE RESOLVED
#             READING. Axis 1a HELD the pin: five group-named sub-collections (`tables`,
#             `facts`, `documents`, `observability`, `session`). Axes 1b, 1c and 1d FLIPPED it:
#             (1b) D4's twelve fields live on a named `RunRecord` value object reached at
#             `run.record`, NOT as properties on `Run`; (1c) every record accessor returns a
#             thin per-kind `RecordHandle` — `.path` for the box mount and O8's model-facing
#             string, plus read/write/append delegating to today's seams — never a bare
#             `pathlib.Path` and never parsed contents; (1d) `Run.for_tenant(tenant_id,
#             run_id)` is the PRIMARY constructor, `Run.at(directory)` is retained but scoped
#             to eval/fixture/tooling callers, and `Run.under(runs_base, run_id)` is demoted to
#             an internal helper. `provisional: true` is cleared, forks D-F1..D-F4 are closed
#             in `handoff.forks`, and the two new boundaries `RunRecord` and `RecordHandle`
#             carry the flip. `RecordHandle` is a COINED id — no design sentence names the
#             wrapper — see `handoff.deviations`.
#
# structure — the demand-implied address space (`provenance: design`) attached to the grounded
#             neighbourhood (`provenance: code`) `10-brief.md` established: the ten shared
#             roots S1-S10, the fourteen consequence-bearing facts F1-F14, the seven de-facto
#             name-owner modules F14 censused, the three UNMOVED readers of the owner's
#             vocabulary that sit outside the gate's sweep (brief red flag R3: `defender/skills`,
#             repo-root `scripts/`, repo-root `experiments/`), and the second lint nobody owns
#             (brief red flag R4 / F8 / dispositions red flag 7).
#
# gate      — ABSENT ON PURPOSE. The gate leaf runs `spec-graph gate --residue`, writes the
#             witnesses and routes, and adds the `gate:` block. A missing block is what that
#             leaf is for; it is not a claim that the rules are clean.
#
# ==========================================================================================
# NAME RECONCILIATION — the three input frontiers coined ids independently; these are the
# joins, keyed by role+origin, not by display name.
#
#   brief S1 "runs base" / demands "runs_base" / profile `resources.runs_base`   -> runs_base
#   brief S2 "run dir"   / demands "run_dir"   / profile `resources.run_dir`     -> run_dir
#   brief S3 "sessions dir" + demands "session_db" (one contract: the db path IS the sessions
#        dir's only leaf, and C15's trust anchor is the dir's)                   -> session_db
#   brief S4 "episode dir" + S6 "archive world dir" (one root, one identity; the world dir is
#        a `label`-keyed leaf under it, not a second root)                       -> episode_dir
#   brief S5 "sibling run dirs"  -> run_dir.domain.distinguished[sibling]  (a receiver KIND of
#        the same boundary, per C5's six-kind census — not a boundary of its own)
#   brief S9 "held-out fixture run dirs" -> run_dir.domain.distinguished[fixture]
#   brief S7 "learning run dir" / `LoopPaths.runs_dir` / profile `resources.learning_run_dir`
#                                                                         -> learning_run_dir
#   brief S8 "tenant record" / demands "tenant_record" / D2's `_tenant.json`
#        -> boundary `tenant_record` (the file) + actor `_tenant` (the new owner module that
#           writes it). The demands' `interacts(_tenant->tenant_record)` needs both.
#   brief S10 "invlang corpus dir"                                     -> invlang_corpus_dir
#   brief F14's seven de-facto owner modules -> actors `challenge_gate`, `observe`, `run_end`,
#        `scrub`, `session_store`, `archive`, `_family` (D1 re-homes their names)
#   demands "owner_constants" = brief C20/G5's module constants and composed-name PARTS
#   demands "permission_files" = `defender/runtime/permission/files.py` (brief C20)
#   demands "box_spec"        = `defender/runtime/box/_spec.py` (brief C3, C4)
#   demands "_spec771.CENSUS" = `defender/tests/e2e/_spec771.py:1103-1105`'s census rows
#        (claim R12). Kept with the dot in the id: it names a member of a test module, and
#        `_FACET` only parses `payload|identity|domain|access`, so it resolves as a bare id.
#
#   AXES. brief "<run_id>" / "run_dir.name" / demands "<run_id>"                 -> run_id
#         brief "<label>" (world label, sibling label)                           -> label
#         brief "<episode>" / "<episode_id>"                                     -> episode_id
#         brief "<prefix>.<stem>.<n>.trace.jsonl" (F1)          -> prefix, stem, check_index
#         brief "<lineage>.db" (C10)                                             -> lineage_id
#         brief "ctx.source_id" (C16's chain)                                    -> source_id
#         dispositions "the world token" -> derivation `world_token` (fn_of label), NOT an axis
#         dispositions "the sibling run id" -> derivation `sibling_run_id` (fn_of label)
#
#   BINDS GROWN (the only edits to `20-demands.md`'s demand entries; each adds an address the
#   demand's OWN seed sentence already names, so check_binds' prose⊄binds scan would flag the
#   omission — none narrows or redirects a demand):
#     #0  run_handle_return_shape          + Run.access[tables|facts|documents|observability|
#                                            session]  (its sentence names all five groups)
#     d7  lint_allow_list_empty            + allow_list.domain.distinguished[0]
#     d8  kinds_tsv_gains_tenant_and_subcollection
#                                          + run_records_kinds_tsv.domain.distinguished[tenant]
#                                          + ...distinguished[circuit_breaker]
#     d31 denies_import_names_from_owner   + owner_constants.domain.distinguished[RAW_MARKER]
#         (D7: inverted — the gate HOLDS neither, rather than holding the owner's own)
#                                          + ...distinguished[TICKET_READS_MARKER]
# ==========================================================================================

demands:

  # ----------------------------------------------------------------------------------------
  # #0 — THE RETURN-VALUE CONTRACT. RESOLVED at §7, 2026-09-21. 20-demands.md "## Demand #0"
  # ----------------------------------------------------------------------------------------
  - id: run_handle_return_shape
    kind: behavior
    form: test
    source: "20-demands.md demand #0 (RESOLVED reading; 70-resolutions.md decision 1a-1d)"
    binds:
      - "Run"
      - "Run.access[at]"
      - "Run.access[under]"
      - "Run.access[for_tenant]"
      - "Run.access[record]"
      - "Run.access[tables]"
      - "Run.access[facts]"
      - "Run.access[documents]"
      - "Run.access[observability]"
      - "Run.access[session]"
      - "RunRecord"
      - "RecordHandle"
      - "interacts(Run->run_dir)"
      - "interacts(Run->RunPaths)"
    discharged_by: test_run_handle_exposes_five_subcollections_a_record_and_wrapper_accessors
    seed_docstring: >-
      A `Run` built by `Run.for_tenant` exposes exactly the five sub-collections `tables`,
      `facts`, `documents`, `observability` and `session`, each carrying one member per kind D5
      places in its group, each member answering a per-kind `RecordHandle` rather than a bare
      `pathlib.Path`, and the twelve D4 fields on a `RunRecord` reached at `run.record`.
    note: >-
      RESOLVED at §7 on all four axes, three of them AGAINST the phase-A pin. 1a (grouped
      addressing) held: the five group cells stay. 1b flipped: D4's twelve fields moved off
      `Run` onto the new `RunRecord` boundary, reached through the new `Run.access[record]`
      cell (demands h01, d42). 1c flipped, and it is the largest blast radius: every record
      accessor now returns the new `RecordHandle` boundary rather than a `pathlib.Path`
      (demands h02-h05; `RunPaths` itself is unchanged and still resolves to `Path`). 1d
      flipped: `Run.access[for_tenant]` is the primary constructor cell, `Run.access[at]` is
      retained and scoped to eval/fixture/tooling, `Run.access[under]` is demoted to an
      internal helper (demands h06-h10). `provisional: true` is CLEARED.

  # ----------------------------------------------------------------------------------------
  # O1 / D6 — THE GATE
  # ----------------------------------------------------------------------------------------
  - id: lint_flags_name_literal
    kind: behavior
    form: test
    source: "20-demands.md d1"
    binds: ["lint_run_records", "owner_constants", "interacts(lint_run_records->owner_constants)"]
    discharged_by: test_gate_flags_a_record_name_literal_outside_the_owners
    seed_docstring: >-
      A record name spelled as a string constant, an f-string piece or a glob argument outside
      the owner modules is reported as a finding.
    note: >-
      FORK D-F5 CLOSED at §7 (decision 6) on reading 1: the part set drops the generic suffixes
      (`.json`, `.db` alone — 1065 non-test literal matches) and keeps only the discriminating
      fragments `.lead.json`, `review_record.`, `.trace.jsonl`, `_trace.jsonl`, `served/`
      (demand h22). The three candidate scopings are no longer documented alternatives on
      `owner_constants`; the two rejected readings live on h22's own `rejected` note in
      `20-demands.md`.
  - id: lint_flags_join_right_operand
    kind: behavior
    form: test
    source: "20-demands.md d2"
    binds: ["lint_run_records.access[negative_check]", "owner_constants"]
    discharged_by: test_gate_flags_a_join_by_right_operand_whatever_the_left_is_called
    seed_docstring: >-
      A `/` whose right operand is a record name is reported whatever the left operand is
      called — `child`, `dst_dir`, `source`, `runs` and `lead_dir` all produce the same finding.
  - id: lint_flags_owner_derived_join
    kind: behavior
    form: test
    source: "20-demands.md d3"
    binds: ["lint_run_records.access[accessor_pass]", "_astlib"]
    discharged_by: test_gate_flags_a_literal_free_join_onto_an_owner_derived_value
    seed_docstring: >-
      A join onto a value the accessor pass traced back to an owner —
      `RunPaths(run_dir).gather_raw / lead_id` — is reported even though it carries no literal.
    note: "claim G2: exactly one site in the sweep scope today (record_query.py:264)."
  - id: lint_unresolvable_accessor_use
    kind: behavior
    form: test
    source: "20-demands.md d4"
    binds: ["lint_run_records.access[accessor_pass]", "_astlib"]
    discharged_by: test_gate_reports_an_untraceable_accessor_read_rather_than_skipping_it
    seed_docstring: >-
      An accessor-named attribute read on a value the pass cannot trace is reported as
      `unresolvable accessor use` rather than skipped.
    note: "claim C2: `_astlib.origin` returns None for exactly this shape today."
  - id: lint_suppression_only_escape
    kind: behavior
    form: test
    source: "20-demands.md d5"
    binds: ["lint_run_records.domain.distinguished[suppression]"]
    discharged_by: test_gate_admits_a_quoted_name_only_under_an_inline_suppression
    seed_docstring: >-
      A record name quoted inside a message string is reported unless the line carries the
      inline `# lint-…: ok — reason` suppression.
  - id: lint_owner_modules_exempt
    kind: negative
    form: test
    source: "20-demands.md d6"
    binds: ["RunPaths", "EpisodePaths", "_tenant", "Run"]
    discharged_by: test_gate_reports_nothing_inside_the_owner_modules
    seed_docstring: "The owner modules and the handle spell every record name they own and produce no finding."
    note: >-
      POSITIVE CONTROL for this negative: `lint_flags_name_literal` (d1) on the same gate under
      the complementary condition. Dispositions red flag 6 (`lint_run_records.py` itself is NOT
      in D6's exempt list, so the gate's own source must import every constant or report itself)
      is MOOT AT TODAY'S LOCATION, per 93-safety-claim-sweep.md finding B: the gate lives at
      repo-root `scripts/lint/`, entirely outside the sweep's root set — `sweep_files` roots at
      `defender/` and walks `runtime`, `learning`, `scripts` (meaning `defender/scripts`),
      `evals`, `hooks` under it (`scripts/lint/lint_run_records.py:56-57,67,194-196`) — so the
      gate cannot report itself whatever it spells. The import-based mechanism becomes
      load-bearing only if the D6 rewrite moves the gate under `defender/scripts/`, which IS
      swept.
  - id: lint_allow_list_empty
    kind: behavior
    form: test
    source: "20-demands.md d7"
    binds: ["allow_list", "allow_list.domain.distinguished[0]", "lint_run_records"]
    discharged_by: test_gate_passes_with_an_empty_allow_list
    seed_docstring: >-
      The gate passes over the whole swept tree — the five `defender/` directories plus its top
      level, per §7 decision 5's carve-out — with an empty allow-list.
    note: >-
      RED UNTIL THE LAST MIGRATION LANDS (20-demands.md red flag 5) — kept `form: test`
      deliberately, because a clause would not discharge O1's gate obligation. It is the one
      demand that cannot be green at any intermediate commit of D7's order, and the only premise
      in cluster O, auto-resolved at §7 (non-material item 2: the suite carries an explicit
      sequencing marker naming D7's step that must land first). §7 decision 5 also narrows what
      "the whole tree" means here: the swept set is `defender/*.py` plus five rglob'd
      directories, and O1's own wording now names the three trees it does not enter (h20), with
      a standing check that the set never shrinks (h21).
  - id: kinds_tsv_gains_tenant_and_subcollection
    kind: shape
    form: test
    source: "20-demands.md d8"
    binds:
      - "run_records_kinds_tsv"
      - "run_records_kinds_tsv.domain.distinguished[tenant]"
      - "run_records_kinds_tsv.domain.distinguished[circuit_breaker]"
      - "tenant_record"
    discharged_by: test_kinds_tsv_carries_the_tenant_row_and_a_subcollection_for_circuit_breaker
    seed_docstring: >-
      `run-records-kinds.tsv` carries a `tenant` row filed under table 2 and a non-empty
      `subcollection` cell for `circuit_breaker`.
  - id: sites_tsv_retires
    kind: survival
    form: test
    source: "20-demands.md d9"
    binds: ["run_records_tsv", "run_records_kinds_tsv"]
    discharged_by: test_the_sites_table_is_gone_and_the_kinds_table_still_renders
    seed_docstring: >-
      `run-records.tsv` and the page's tables 1–4 are gone while `run-records-kinds.tsv` still
      renders.
  - id: no_via_census_column
    kind: negative
    form: test
    source: "20-demands.md d10"
    binds: ["run_records_kinds_tsv.access[via]", "lint_run_records"]
    discharged_by: test_no_reader_writer_census_is_derived_from_accessor_callers
    seed_docstring: >-
      Neither the kinds table nor the rendered page carries a reader/writer census derived from
      accessor callers, and the `via` column is gone.
    note: "POSITIVE CONTROL: `sites_tsv_retires` (d9) pins that the kinds table still renders."

  # ----------------------------------------------------------------------------------------
  # O2 — ONE ACCESSOR PER KIND
  # ----------------------------------------------------------------------------------------
  - id: accessor_per_kind
    kind: coherence
    form: test
    source: "20-demands.md d11"
    binds: ["run_records_kinds_tsv", "RunPaths", "EpisodePaths", "_tenant"]
    discharged_by: test_every_kind_in_the_tsv_has_exactly_one_accessor_that_owns_its_name
    seed_docstring: >-
      Walking `run-records-kinds.tsv` — excluding the appendix-only kinds — finds exactly one
      owner accessor per kind.
    note: >-
      FORK D-F7 CLOSED at §7 as recommended (non-material item 1): the TSV has 43 rows and O2
      enumerates 42; the 43rd is `tool_seam`, already in `lint_run_records.APPENDIX_ONLY_KINDS`,
      owning no name. O2's walk imports that set rather than re-spelling the exclusion, and the
      decision not to test it is recorded as the waiver `h51_tool_seam_owns_no_accessor`. A
      waiver is not executable, so `run_records_kinds_tsv.domain.distinguished[tool_seam]` stays
      routed through `gate.holes` as well. Decision 9 adds the scoping this demand's walk
      needs: exactly one accessor per ROW of the kinds table (demand h31).
  - id: retired_names_keep_accessors
    kind: domain-outcome
    form: test
    source: "20-demands.md d12"
    binds:
      - "RunPaths.domain.distinguished[source_refs]"
      - "RunPaths.domain.distinguished[ticket_read]"
      - "permission_files"
    discharged_by: test_the_two_retired_names_still_resolve_on_the_owner
    seed_docstring: >-
      `source_refs` and `ticket_read(seq)` still resolve on the owner, because the answer-key
      set and the payload-cap shape key on those names.
    note: "claim R9: source_refs.yaml has readers and no writer in the repo."

  # ----------------------------------------------------------------------------------------
  # O3 / N2 — THE TREE OBSERVER: a strict STRUCTURAL check, a narrow CONTENT check
  # (REDESIGNED at §7 decision 21, which SUPERSEDES decision 14 in full — not an amendment)
  # ----------------------------------------------------------------------------------------
  - id: tree_diff_observer
    kind: behavior
    form: test
    source: "20-demands.md d13; REWRITTEN at §7 decision 21 (2026-09-21)"
    binds: ["run_dir", "run_dir.identity", "interacts(Run->run_dir)"]
    discharged_by: test_a_replayed_fixture_run_tree_carries_the_same_set_of_names
    cites: ["RG-10"]
    seed_docstring: >-
      Replaying a fixture run through the handle produces a run directory whose SET OF NAMES is
      the pre-migration one exactly — no entry added, removed, renamed or moved — with no
      exemption and no entry excused.
    note: >-
      THE OBSERVER DOES NOT EXIST YET and must ship green on `main` before step 3
      (20-demands.md red flag 5). §7 DECISION 21 REPLACED DECISION 14'S FOUR RULES: an executed
      probe (two `_replay()` calls against `main`, same run id, diffed) proved "byte-identical,
      two exemptions" false independently of this issue's code — eight files differ for reasons
      that predate the refactor (wall-clock timestamps in `budget.json` and `tool_trace.jsonl`;
      a per-run random security salt inside `review_record.<turn>.json` and the three
      `wire_logs/review_*_trace.jsonl`; random per-run session/case identifiers in
      `session_store_pointer.json` and `tool_trace.jsonl`). THIS demand is the structural half,
      the one that holds and the one that matters: the same name set, strict. Kept from decision
      14: the run directory only (h40, with h41's separate assertion for the records beside it),
      the snapshot taken after the run ends (h42), directories and symlinks by name and link
      target (h43), the baseline on the comparison's own commit (h44). Dropped: bytes for
      regular files in general — that is d14's narrow content check now. THERE IS NO EXEMPTION
      LIST and `_spec1077.snapshot` takes no `exclude` argument, so the widening lever
      `O3_EXEMPT` handed an implementer meeting a red test is gone rather than lengthened.
      `rejected` on this test (20-demands.md): the existing goldens are NOT this observer
      (claim C8).
  - id: only_content_files_compare_by_bytes
    kind: negative
    form: test
    source: "20-demands.md d14; REWRITTEN at §7 decision 21 (2026-09-21)"
    binds: ["run_dir.identity", "RunProvenance", "wire_log.identity"]
    discharged_by: test_bytes_are_compared_for_the_investigation_and_the_report_and_nothing_else
    cites: ["RG-10"]
    seed_docstring: >-
      Byte comparison applies to the investigation write-up and the final report and to no other
      entry in the tree: everything else carries no byte assertion at all.
    note: >-
      REWRITTEN at §7 (decision 21), and RENAMED from `only_provenance_differs`, whose id stated
      the superseded contract. The two documents are the artifacts the model generates from the
      SAME fixed replay input and that a human actually reads. Everything else — budget, tool
      trace, session pointer, the wire logs, the review records and traces — gets NO byte
      assertion: not exempted-with-a-reason, not normalised, simply not compared, because it was
      never stable to begin with. NEGATIVE, and the test drives it as one: rewriting any of the
      measured-unstable files' bytes is NOT a finding, while each document's bytes ARE. This
      SUBSUMES decision 18's amendment — the wire log was never byte-compared here, so its new
      writer id needs no carve-out, and the exemption list it would have joined no longer
      exists. `RunProvenance` stays bound because the stamp is the record N2 excused under the
      old contract and is now simply one more file whose bytes nobody compares.
  - id: stamp_gains_tenant_and_world
    kind: shape
    form: test
    source: "20-demands.md d15"
    binds: ["RunProvenance", "interacts(materialize_run_dir->RunProvenance).payload"]
    discharged_by: test_the_stamp_spells_tenant_id_and_world_id_on_the_wire
