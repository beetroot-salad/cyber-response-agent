  - rule: R3
    element: _io.access[write_atomic]
    resolution: 'RE-RESOLVED at §7 decision 23 (2026-09-21), REVERSING decision 16''s closing paragraph.
      The guarded via''s three constraints — exclusive create, no symlink-following, staged rename — ARE
      required to hold on `write_atomic`, and the cell now carries them instead of `constraints: unknown`.
      What changed is not evidence but provenance: 92-reconciliation.md finding 6 established that the
      brief''s sub-question ("decide whether the guarded lane''s constraints are required on write_atomic
      — recommend: yes") was NEVER PUT TO THE HUMAN, so "out of scope, as today" was the
      resolution-writer''s conservative default recorded as though it were a decision. Decision 23 asks it
      and answers YES. The helper''s own hole is unchanged and is exactly why the answer matters: it takes
      ANY path and is reachable from outside the owner modules, so no name-keyed check can see it (flagged
      fact F13), which makes this the one write path the checker can never catch by construction and the
      explicit requirement the only thing a reviewer has to read. NO EXECUTABLE DEMAND DISCHARGES IT — by
      construction, not by omission: `resolved_to` names `form: clause` demand h56, which `check_gate`
      does not count as an answer (it scans `form: test` only), so this hole stays visibly routed rather
      than silenced by a clause. It holds today by delegation (claim CL-F13).'
    resolved_to: h56_write_atomic_carries_the_guarded_lanes_constraints
    cites:
    - CL-F13
  - rule: R3
    element: permission_files.access[hard-link-alias]
    resolution: 'RESOLVED at §7 (decision 17): O6 is read as a per-NAME obligation. The read gate''s six
      denials stay filename-based, exactly as today — this issue discharges the obligation it inherited as
      stated and grows no content/inode-level checking machinery — so a hard link inside the run dir giving
      `provenance.json`''s bytes a basename the per-NAME deny does not recognise is out of scope BY
      CONSTRUCTION. The cell''s `constraints` are now `[per-name-only]`. **A follow-up GitHub issue is
      filed** for the content-based check: an external artifact, tracked in `handoff.deviations`, NOT in
      `handoff.forks`. This hole therefore carries NO `resolved_to` — minting a demand for the
      content-based check here would contradict the decision — and that absence is the decision, not an
      omission. Cluster N''s two non-hard-link members are non-material item 7, recorded as clause h53.'
