      widened. The written obligation names the three trees the checker does not scan — `defender/skills/`,
      repo-root `scripts/`, repo-root `experiments/` (claims S10/G1/G3, brief red flag R3) — so the claim
      it makes is the one its observer can keep (demand h20), and a standing check keeps the scanned set
      from shrinking further (demand h21). The cell''s `constraints` are now `[scope-limited,
      named-in-the-obligation, monotone]`. The alternative — widening to cover ~40 more sites in
      `experiments/` alone — was rejected as scope this issue''s discussion never took.'
