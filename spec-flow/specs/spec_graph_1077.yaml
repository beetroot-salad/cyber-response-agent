          Resolving symlinks at the episodes-root refusal, or dereferencing on the archive copy,
          was rejected: both change existing behaviour this issue's tree-identity obligation (O3)
          forbids changing — a resolved symlink is a different ENTRY KIND, which O3's structural
          check sees whether or not anyone compares the bytes behind it (decision 21).
    note: >-
      CLAUSE. Both members are pre-existing behaviours D5 wraps unchanged; resolving the symlink
      in either would be a behaviour change O3 forbids. Recorded rather than silently left open.

  # ---- Decision 20 — the bare run id's case fold (phase F cold reconciler finding 1) -------
  - id: h54_bare_run_id_admission_carries_the_case_stability_refusal
    kind: domain-outcome
    form: test
    source: "§7 final resolutions 2026-09-21; 70-resolutions.md decision 20"
    binds:
      - "Run.access[for_tenant]"
      - "Run.access[under]"
      - "run_dir.identity"
    discharged_by: test_two_run_ids_differing_only_by_case_cannot_become_one_run_directory
    seed_docstring: >-
      `Run.for_tenant`/`Run.under` apply `is_case_stable_id` beside `is_valid_run_id`, so a
      case-variant of an existing run id is REFUSED rather than silently resolving onto that
      run's directory.
    cites: ["RC-3"]
    note: >-
      Decision 20, closing 92-reconciliation.md finding 1. Claim RC-3 (verdict holds) censused
      `is_case_stable_id` at exactly two non-test hits, both on the EPISODE id, so no bare
      run-id case rule existed — while F036's settled outcome and h36's seed both asserted one.
      The gap only became dangerous at §7: `run_common.py:62-64` refuses loudly today on
      `run dir already exists`, and decision 3's resumable setup (h12) replaces that accident
      with finishing whatever the first call left undone, plus h13's clearing of all three
      sidecars. Under the shipped spec and without this demand,
      `Run.for_tenant("default", "Run-1")` against a base already holding `run-1` on a
      case-insensitive filesystem adopts that run's tree, re-stamps its provenance and deletes
      its run-end, scrub-verdict and accounting records. SIBLING OF h36, deliberately not
      merged into it: h36 owns the three COMPOSED names (decision 12), h54 owns the bare id,
      and one rule now reaches all four sites by reference. h10 keeps the delegation property
      for both predicates.

  # ---- Decision 22 — `Run.for_tenant`'s tenant-argument mismatch (finding 5) ---------------
  - id: h55_for_tenant_refuses_a_tenant_the_record_disagrees_with
    kind: domain-outcome
    form: test
    source: "§7 final resolutions 2026-09-21; 70-resolutions.md decision 22"
    binds:
      - "Run.access[for_tenant]"
      - "tenant_record.domain.distinguished[non_default_tenant_id]"
      - "interacts(Run->tenant_record)"
    discharged_by: test_for_tenant_refuses_a_tenant_id_the_record_at_the_resolved_base_disagrees_with
    seed_docstring: >-
      `Run.for_tenant(tenant_id, run_id)` refuses when the `tenant_id` argument disagrees with
      the tenant record actually stored at the resolved runs base, and the refusal names both.
    note: >-
      Decision 22, closing 92-reconciliation.md finding 5 — the third of the three questions
      `72-rework-digest.md` red flag 6 named and that never left that file. Decision 1d
      promoted `for_tenant` to the primary application constructor on the rationale that it is
      "where actual tenant enforcement would live once it matters (#1081/#1082)", which left
      exactly this undefined: h06's test plants `tenant_id="acme"` and then calls
      `for_tenant("acme", ...)`, a MATCHING pair, and h39 covers a STAMP disagreeing with the
      record, never a constructor ARGUMENT. Neither "trust the argument" nor "trust the record"
      was chosen, because both make the mismatch silent, which is what promoting the
      constructor was for. THE REFUSAL TYPE IS NOT PINNED HERE, matching the rest of this
      suite (h09, h10, h11, the tenant battery): the test drives the observable — it raises,
      the message names BOTH tenant ids, nothing is stamped and the record is not rewritten —
      and leaves write-code-from-spec to pick the class alongside `_tenant`'s other refusals.
      DISTINGUISHED-MEMBER NOTE: binds `non_default_tenant_id` because that is the member the
      disagreement is observed over; h39 binds it too, at the stamp's altitude rather than the
      constructor's.

  # ---- Decision 23 — `write_atomic`'s guarded-lane requirement (finding 6) -----------------
  - id: h56_write_atomic_carries_the_guarded_lanes_constraints
    kind: coherence
    form: clause
    source: "§7 final resolutions 2026-09-21; 70-resolutions.md decision 23"
    binds:
      - "_io.access[write_atomic]"
      - "_io.access[write_guarded]"
    outcome:
      nl: >-
        The guarded lane's three constraints — exclusive create, no symlink-following, staged
        rename — are REQUIRED on `_io.write_atomic`, not merely true of it today. Decision 16
        left this "out of scope, as today"; §7 decision 23 reverses that, because the brief's
        own recommendation was yes and the sub-question was never actually put to the human.
        `write_atomic` is the one write path the name-keyed checker can never catch by
        construction (flagged fact F13: it takes ANY path and is reachable from outside the
        owner modules), so the explicit requirement is what a human reviewer checks against
        instead of silence. It holds today by delegation — claim CL-F13 read
        `write_atomic(path, text)` as `write_guarded(path, text, mode="replace")` — so the
        cell's `constraints` are pinned to the guarded lane's three rather than left `unknown`,
        and any future implementation that stops delegating breaks a stated requirement rather
        than an unstated habit.
    rejected:
      - nl: >-
          Pinning this with a test was rejected, and it is the reason the demand is a clause:
          the checker structurally cannot see `write_atomic`'s callers (no name-keyed rule
          reaches a helper that takes an arbitrary path), and a test asserting that
          `write_atomic` delegates to `write_guarded` would pin today's IMPLEMENTATION, not the
          requirement — it would pass for any delegating body and fail a compliant
          reimplementation that opened the file itself with the same three flags.
    cites: ["CL-F13"]
    note: >-
      CLAUSE, same shape as `stale_loop_bundle_docstring_corrected` (d46) and h53: a
      requirement with no observable a test can bind. Closes 92-reconciliation.md finding 6,
      which established that this was an UNASKED question, not a declined one — decision 16's
      closing paragraph recorded the resolution-writer's conservative default as though it
      were the human's answer. `20-demands.md` red flag 2 is rewritten to match. The cell's R0
      hole is retired by this decision (the policy is now decided AND pinned); its R3 hole
      stays, re-resolved.

# ==========================================================================================
# STRUCTURE — the demand-implied address space (`provenance: design`) attached to the
# grounded neighbourhood `10-brief.md` established (`provenance: code`).
# ==========================================================================================
structure:

  # The axis registry. Every `key_axes` / `interpolates` member below is one of these (or a
  # declared `derivations` value); a member outside this list is an R0 finding, and two
  # extraction passes coining two names for one axis is the join-breaker it exists to prevent.
  axes:
    - run_id          # a run dir's NAME under the runs base; the three sidecars interpolate it
                      # at the BASE as `<run_id><suffix>` (claim C10, flagged fact F9)
    - runs_base_path  # WHICH runs base — the tenant record's key. A forked sibling's own
                      # DEFENDER_RUNS_BASE is `<episode_dir>/runs` (claims C10/S5), which is
                      # why this is an axis and not a constant (cluster G)
    - episode_id      # `$DEFENDER_EPISODES_BASE/<episode_id>` (claim S4)
    - label           # the world / sibling label: `worlds/<label>/`, `<episode_id>-<label>`
    - world_id        # the world token a run stamps, and `served/<world_id>.jsonl` (claim C17)
    - lead_id         # `gather_raw/<lead_id>/` (claims G2/R4)
    - seq             # the payload's `<seq>.json` under a lead dir (claim R4)
    - role            # a REVIEW_ROLES member: `wire_logs/review_<role>_trace.jsonl` (F10)
    - turn            # the review record's turn number (F10)
    - lineage_id      # `<runs_base>.parent/sessions/<lineage>.db` (claims C10/S3)
    - source_id       # the learning run dir's child: `ctx.runs_dir/ctx.source_id` (claim C16)
    - prefix          # \
    - stem            #  > the forward-check wire trace `<prefix>.<stem>.<n>.trace.jsonl` (F1)
    - check_index     # /
    - record_kind     # one row of `run-records-kinds.tsv` (claims G4/R2)
    - module_path     # a swept source file — the allow-list's key (claims C1/G3)

