  # ---- Decision 3 — setup retry and reuse (cluster L) --------------------------------------
  - id: h12_setup_is_resumable
    kind: behavior
    form: test
    source: "§7 rework 2026-09-21; 70-resolutions.md decision 3"
    binds:
      - "materialize_run_dir"
      - "interacts(materialize_run_dir->run_dir)"
      - "interacts(materialize_run_dir->RunProvenance)"
    discharged_by: test_a_second_materialize_for_one_run_id_finishes_what_the_first_left_undone
    seed_docstring: >-
      A second setup call for one run id finishes whatever the first left undone and re-stamps,
      rather than refusing or duplicating.
    note: >-
      The alternative — refuse on an existing directory — would make every transient failure
      permanently burn a run id, and the handle already tolerates stampless run-dir-shaped
      directories (N8).
      CORRECTED at finalize (PR #1094 review): 'resumable' is a directory holding NOTHING BUT what setup writes (the alert, `gather_raw/`, the stamp — the owner's own names); a directory a run has been in (any other entry, or a run-end sidecar beside it) is REFUSED, which is #771's stale-mount premise stated over contents. The alert is write-once through the handle (`run.facts.alert.write`), so a reused id with a different alert is refused by the lane; the stamp is re-written on a resumed setup (no box has been in the directory); the three sidecars are cleared only when the directory is ABSENT (#1047's case).
  - id: h13_run_id_reuse_clears_all_three_sidecars
    kind: behavior
    form: test
    source: "§7 rework 2026-09-21; 70-resolutions.md decision 3"
    binds:
      - "runs_base.identity"
      - "interacts(run_end->runs_base)"
      - "interacts(scrub->runs_base)"
      - "interacts(budget_enforcer->runs_base)"
    discharged_by: test_reusing_a_run_id_clears_all_three_sidecars_not_only_the_named_one
    seed_docstring: >-
      Reusing a run id clears all three per-run sidecar files beside the runs base, not only the
      run-end one today's code names.
    note: >-
      Leaving two stale sidecars attributes a previous occupant's scrub verdict and accounting
      failures to a new run. Decision 12's case-stability refusal is what keeps two case-variant
      spellings from being two runs sharing one sidecar set.
      CORRECTED at finalize (PR #1094 review): cleared only when the run DIRECTORY is absent — a present directory with a sidecar beside it is a run that ended, and is refused rather than having its records destroyed ahead of a check that then refuses it.
  - id: h14_forking_or_archiving_a_running_run_is_supported
    kind: behavior
    form: test
    source: "§7 rework 2026-09-21; 70-resolutions.md decision 3"
    binds:
