      twelve fields read through today's readers, no new parsing — and is flagged in the PR
      description as a placeholder for #1081/#1082's real job-record type.
      CORRECTED at finalize (PR #1094 review): `tenant_id` is also THE ADDRESS (N4: a `Run` is addressed by `(tenant_id, run_id)`), so a `for_tenant`/`under` handle carries `run.tenant_id` — the tenant it was asked for, as `run_dir` is the directory it was asked for — while `run.record.tenant_id` is what the stamp says; `Run.at` has no address and no attribute. The other eleven fields live on `RunRecord` alone, as before.
