    discharged_by: test_a_fork_or_archive_of_a_still_running_source_is_supported
    seed_docstring: >-
      Declaring a fork from, or archiving a world of, a run that has not yet reached run-end is a
      supported operation, not a refusal.
    note: >-
      Consistent with O5's "readable mid-run": what the archive captures is whatever exists at
      call time.
  - id: h15_crashed_priming_lock_is_indistinguishable
    kind: domain-outcome
    form: clause
    source: "§7 rework 2026-09-21; 70-resolutions.md decision 3"
    binds:
      - "interacts(branch_cli->episode_dir)"
    outcome:
      nl: >-
        A `served/.priming` file left behind by a crashed prior attempt is indistinguishable from
        one held by a live attempt, and the design claims no recovery path: the spec records the
        limitation rather than inventing a lock-liveness mechanism §7 declined to build.
    rejected:
      - nl: >-
          A staleness heuristic (age, pid, hostname) was rejected: it would be new mechanism this
          issue does not own, and a wrong liveness guess deletes a live episode's lock.
    note: >-
      CLAUSE, deliberately. It asserts the ABSENCE of a recovery path, and there is no observable
      to pin without inventing the liveness mechanism §7 declined to build. Claim R10:
      `served/.priming` is never unlinked.

