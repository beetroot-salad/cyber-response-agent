# ==========================================================================================
# CLAIMS — 73. Every claim the three input frontiers raised, ids kept:
#   C1-C20  inherited from the design doc's sweep and re-probed (or explicitly not) by
#           `10-brief.md`; S1-S10 the ten shared roots' censuses; G1-G7 the brief's own new
#           claims; R1-R12 raised at demand extraction (`20-demands.md`); RG-1..RG-4 the four
#           probe obligations `45-dispositions.md` minted and the orchestrator then resolved
#           by direct read before phase D dispatch; RG-5..RG-9 the five the orchestrator
#           resolved AFTER phase F, closing 92-reconciliation.md findings 3 and 4 (cluster M's
#           PO5/PO6/PO7/LC-P4, and the wire log's missing C7-analogue); RG-10 the EXECUTED
#           two-replay probe (author probe P8, O3's never-run feasibility floor) that refuted
#           "byte-identical, two exemptions" and produced §7 decision 21.
#
# TWO NORMALISATIONS were applied, because the input frontiers wrote outside the closed
# vocabularies and `spec-graph claims` reads the closed ones:
#   * VERDICTS. `re-verified-holds` / `holds` -> `holds`. `inherited` (the doc's probe stands,
#     not re-run) -> `holds`, with `probe_kind` set to the DOC's instrument and the fact that
#     it was not re-probed recorded in the note. A claim whose own sentence is FALSE AS STATED
#     — even where the mechanism survives and only a count, an attribution or a member list is
#     wrong — is `refuted`, not "re-verified; extended": C1, C5, C14, C17, R8. That is the
#     protective reading, because phase F's refuted-claims cross-check scans test literals
#     against refuted claims, and a test asserting "71 files" or "four receiver kinds" or "the
#     docstring is stale" must be caught. Each note quotes the frontier's own wording.
#   * INSTRUMENTS. A `census` claim closes only on `search` (the check's own table), so the
#     census claims the brief recorded as `executed` (a `pyrefly-refs` run, a `spec-graph
#     trace`, an AST scan) are recorded as `search`: the instrument CLASS is a search over the
#     tree, whatever binary ran it. Two claims were RETYPED where the frontier's kind did not
#     match its own sentence: R8 and R12 (`behavior` -> `referential`; both predicate over what
#     a source SAYS, and both closed on a read), and S5/G3 (`census` -> `referential`; both are
#     a read of two line ranges, not a completeness sweep).
#   ONE KNOWN MISMATCH IS LEFT STANDING, on purpose: G6 is a `behavior` claim closed on a
#   `read`. It predicts what `stage_trace_path` DOES when called, and a read cannot falsify
#   that. It is left typed honestly so `spec-graph claims` reports it — see `handoff.deferred`.
# ==========================================================================================
