- id: d_elastic_view
  kind: behavior
  form: test
  binds:
  - elastic
  - systems
  - resolve_tenant
  - ElasticSettings
  - elastic.domain.distinguished[None]
  - elastic.domain.distinguished[ConfigFault]
  - ELASTICSEARCH_URL.domain.distinguished[absent]
  - ELASTICSEARCH_URL.domain.distinguished[empty]
  - ELASTIC_SSL_VERIFY.domain.distinguished[absent]
  - ELASTIC_EVENTS_INDEX.domain.distinguished[absent]
  - ELASTIC_EVENTS_INDEX.domain.distinguished[empty]
  discharged_by: test_d_elastic_view
  seed_docstring: 'record.elastic is None when the tenant has no systems/elastic/ folder. It is a ConfigFault when
    that folder''s config.env is missing, or when it lacks any of ELASTIC_EVENTS_INDEX, ELASTIC_ALERTS_INDEX, ELASTICSEARCH_URL,
    ELASTIC_SSL_VERIFY, ELASTIC_ES_CONTAINER, ELASTIC_KIBANA_CONTAINER or ELASTIC_DOCKER_CONTEXT, when any of them
    is present but blank (F3/NF-18: presence and non-blank only; values such as CHANGE-ME are carried), or when
    ELASTIC_TRANSPORT is absent or other than docker-exec (MF-7 a, human). Otherwise it is an ElasticSettings that
    carries those values from the file. resolve_tenant raises in none of these cases. The part is all-or-nothing
    over that key set (MF-7 b, human): a missing Kibana container makes it a ConfigFault even for a tenant that
    uses only Elasticsearch.'
  source: 20-demands.md (phase B), amended at D from §7
  premises:
  - '#64 test_elastic_index_pattern_is_bare_wildcard'
  - '#65 test_partially_completed_template_mixed_real_and_placeholder_values'
  note: Binds grown at D to the Elastic key cells its fault table exercises. MF-7 a's launcher case is s7_mf7a_launcher_refuses_elastic_without_docker_exec.
