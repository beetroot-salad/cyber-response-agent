  - ticket_mapping
  discharged_by: test_d_record_fields_from_resolver
  seed_docstring: resolve_tenant over a tenant folder returns the same RunTenant type, now carrying systems (one entry per
    folder under settings/systems/), elastic and ticket_mapping, all built by resolve_run_tenant. For the committed playground
    tenant every systems entry is a SystemConfig, elastic is an ElasticSettings and ticket_mapping is a CaseMapping.
  source: 20-demands.md (phase B)
