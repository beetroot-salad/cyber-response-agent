# Assembled at phase D (write-tests, the assembler) from .spec-flow/frontiers/:
#   10-brief.md (A-ground), 12-probe-g24.md (A-probe-g24), 20-demands.md (B), 45-dispositions.md (C-judge),
#   47-reground.md (C-reground); gate record by the gate leaf (60-residue.md, D-gate); holes re-grounded in
#   62-holes-reground.md (D-holes); every §7 decision (both passes) in 70-resolutions.md (phase §7).
# Base: dafb2da3a31309b93ee17ac6507e02429515905a (PR #1116's head). Suite dir: defender/tests/tenant_1107_settings.
# Name reconciliation: boundary and actor ids are the extraction's (20-demands ## Address key); grounding's
#   and the dispositions' names were keyed onto them by role+origin. Claim ids keep their origin prefix:
#   C (design, source: discuss), G (grounding), CX (extraction), RG (re-ground), A (assembler), GR (gate), H (holes).
# Demands: 132 = 75 ledger (20-demands) + 8 settled (sNNN) + 31 minted at §7 before D (s7_*) +
#   3 waivers (w_*) + 11 gate-residue demands accepted at the post-gate §7 pass (s60_*) + 4 minted at the
#   post-gate §7 pass (s7pg_*); forms: {'test': 125, 'clause': 4, 'waiver': 3}.
# Claims: 130. Boundaries: 67.
# Split (PR #1156 review, human): the secrets half — *_SECRET_REF references, settings/secrets.env, the
#   record's secrets lookup, the transport's credential lane — moved to #1163 with its 35 demands
#   (15 ledger, 6 settled, 12 s7_*, 2 w_*) and the secrets_env / SECRET_REF / SecretLookup / secrets
#   structure (the counts above are after the split). Claim and handoff prose below still names those
#   demands: it records how this graph was built, and #1163 re-adds them.
schema_version: 2
design: '1107'
base: dafb2da3a31309b93ee17ac6507e02429515905a
tests: defender/tests/tenant_1107_settings
demands:
- id: d0_return_contract
  kind: behavior
  form: test
  binds:
  - resolve_tenant
  - resolve_run_tenant
  - RunTenant
  - systems
  - elastic
  - ticket_mapping
  - VerbContext
  - load_config
  - ticket_write
  - record_case_ticket
  - branch.cli.main
  - lint_tenant_env_reads
  - check_config
  discharged_by: test_d0_return_contract
  seed_docstring: 'RESOLVED at §7 (F0, human, round 1: the provisional reading accepted as written). resolve_tenant and resolve_run_tenant
    return the existing frozen RunTenant, grown by three fields built in resolve_run_tenant (which resolve_tenant delegates
    to): systems, a read-only Mapping from each folder name under settings/systems/ to a SystemConfig or a ConfigFault, where
    a SystemConfig is a read-only Mapping[str, str] of the file''s keys exactly as written; elastic, an ElasticSettings or
    a ConfigFault or None, whose ElasticSettings exposes events_index, alerts_index, url, ssl_verify (the raw string), es_container,
    kibana_container and docker_context; and ticket_mapping, a CaseMapping or a CaseTicketError. (A fourth, the secret lookup,
    moved with credential delivery to #1163.) Neither resolver raises for a system fault: TenantRefused (defender._tenant)
    keeps only its current tenant-acceptance reasons. VerbContext and AgentDeps carry the record in a field named tenant in
    place of settings_dir. An adapter''s load_config keeps its return, a dict of prefix-stripped keys, or raises ConfigFault.
    record_case_ticket and open_case_ticket return None and never raise; ticket_write.json is {key, status, url, ok, reason},
    a failure receipt carrying status ''error'', ok false, url null when there is no usable config, and a non-empty reason,
    a success receipt carrying reason null. The branch launcher refuses with its existing LauncherRefused (a SystemExit).
    lint_tenant_env_reads exposes main(argv) -> int like every other custom lint, 0 when clean and non-zero with path:line
    findings. validate_scaffold.check_config keeps its signature and reports through Report''s FAIL/PASS entries.'
  source: 20-demands.md (phase B), amended at D from §7
  note: 'F0 RESOLVED (human): the provisional reading is final. §7 refinements that read these shapes are their own demands:
    ElasticSettings also requires ELASTIC_TRANSPORT = docker-exec (MF-7 a, folded into d_elastic_view), an unimplemented TRANSPORT
    is a ConfigFault (F4), a missing case-history config writes the error receipt (MF-9), a no-receipt branch clears a stale
    receipt (MF-12).'
