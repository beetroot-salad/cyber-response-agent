- id: s7pg_bare_star_events_index_refused_at_launch
  kind: behavior
  form: test
  binds:
  - ELASTIC_EVENTS_INDEX.domain.distinguished[*]
  - check_configured_patterns
  - drives(preflight_episode->check_configured_patterns)
  - branch.cli.main
  - _episode_tenant
  - episode_dir
  discharged_by: test_s7pg_bare_star_events_index_refused_at_launch
  seed_docstring: 'A tenant whose elastic config.env sets ELASTIC_EVENTS_INDEX to exactly `*` is refused at branch launch by
    check_configured_patterns, with a reason that names the key and says a bare `*` would widen confinement to
    every index the cluster serves, before any episode dir exists. A trailing wildcard such as acme-* is accepted
    as today (a mid-pattern wildcard such as logs-*-prod is already refused at base, and this rule does not change
    that), and the resolver still carries `*` into record.elastic (no resolve-time validation, NF-18): the refusal
    is the launch-time check''s alone, in the same class as its CHANGE-ME refusal (G49/F23).'
  source: '70-resolutions.draft.md post-gate pass (human): residue hole #33 (60-residue.md), reading B — refuse
    exactly a bare `*` at launch with a named reason; other wildcards allowed'
  note: 'Pins ELASTIC_EVENTS_INDEX. PG-1a (human) widened the rule to ELASTIC_ALERTS_INDEX, which
    check_configured_patterns also reads: s7pg_bare_star_alerts_index_refused_at_launch. Amended at E-fix (AF-3b,
    auto): logs-*-prod is refused at base by check_configured_patterns, so the seed''s ''accepted as today'' named
    a trailing wildcard only; assertions unchanged.'
- id: s7pg_page_ticket_line_only_with_update_ticket
  kind: behavior
  form: test
  binds:
  - ticket_write.access[page]
  - visualize_run
  - interacts(visualize_run->ticket_write)
  - run_page
  - drives(run.main->run_common.visualize)
  - drives(run_common.visualize->visualize_run)
  - run.main
  discharged_by: test_s7pg_page_ticket_line_only_with_update_ticket
  seed_docstring: 'The run page shows a ticket line only when the run was started with --update-ticket, and it learns
    that from run.py directly: run.py renders the page after the box is torn down (RG7) and passes its own --update-ticket
    flag to the renderer as an argument. With the flag, a receipt in the run dir renders its key, status and reason;
    without it, any ticket_write.json (one an earlier attempt left, or a symlink) is ignored, the page renders no
    ticket line and none of the file''s bytes, and the rest of the page renders. A render that is not handed the
    flag (the renderer run standalone) shows no ticket line. The renderer reads the flag from no manifest, no provenance
    stamp and no other run-dir file.'
  source: '70-resolutions.md PG-2 (human, post-gate pass), amended by PG-2a (human): the flag comes from run.py
    as a renderer argument, not from the manifest or any run-dir file the box can write'
  note: 'Paired negative: s7pg_box_planted_flag_and_receipt_render_no_ticket_line (a box-planted flag plus receipt
    renders no ticket line). Amended at PG-2a from ''flag recorded in the manifest'', which lived in the box''s
    rw bind.'
- id: s7pg_bare_star_alerts_index_refused_at_launch
  kind: behavior
  form: test
  binds:
  - ELASTIC_EVENTS_INDEX.domain.distinguished[*]
  - check_configured_patterns
  - drives(preflight_episode->check_configured_patterns)
  - branch.cli.main
  - _episode_tenant
  - episode_dir
  discharged_by: test_s7pg_bare_star_alerts_index_refused_at_launch
  seed_docstring: 'A tenant whose elastic config.env sets ELASTIC_ALERTS_INDEX to exactly `*` is refused at branch launch by
    check_configured_patterns under the same rule as ELASTIC_EVENTS_INDEX: a reason that names the key and says a
    bare `*` would widen confinement to every index the cluster serves, before any episode dir exists. A trailing
    wildcard such as acme-alerts-* is accepted as today, and the resolver still carries `*` into record.elastic
    (NF-18).'
  source: '70-resolutions.md PG-1a (human, amending PG-1): a bare `*` ELASTIC_ALERTS_INDEX is refused at launch
    too, by the same rule'
  note: 'The ELASTIC_EVENTS_INDEX boundary row covers ELASTIC_ALERTS_INDEX (its `where`), so this binds the same [*]
    cell as s7pg_bare_star_events_index_refused_at_launch. Amended at E-fix (AF-3b, auto): ''any other wildcard
    shape is accepted'' narrowed to a trailing wildcard (a mid-pattern one is refused at base); assertions
    unchanged.'
- id: s7pg_box_planted_flag_and_receipt_render_no_ticket_line
  kind: negative
  form: test
  binds:
  - ticket_write.access[box]
  - ticket_write.access[page]
  - interacts(box->run_dir)
  - run_dir
  - visualize_run
  - drives(run_common.visualize->visualize_run)
  - drives(run.main->run_common.visualize)
  - run_page
  discharged_by: test_s7pg_box_planted_flag_and_receipt_render_no_ticket_line
  seed_docstring: 'A run started without --update-ticket whose box, while alive, wrote an update_ticket: true flag
    into the provenance stamp and into a manifest-shaped file in the run dir, and planted a forged ticket_write.json
    ({status: commented, ok: true}): the page run.py renders after teardown shows no ticket line and none of the
    receipt''s bytes. Positive control, same planted run dir: rendered with run.py''s flag passed as true, the page
    shows the ticket line, so the absence above is the argument''s doing and not a renderer that never reads receipts.'
  source: '70-resolutions.md PG-2a (human): a box-planted manifest flag plus receipt must not produce a ticket line'
  note: 'Paired positive control: s7pg_page_ticket_line_only_with_update_ticket (the flag passed by run.py renders
    the receipt), plus the in-test control above.'
