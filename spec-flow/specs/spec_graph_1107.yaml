  - TRANSPORT.domain.distinguished[near-miss]
  - TRANSPORT.domain.alternatives[http]
  discharged_by: test_d2_transport_domain
  seed_docstring: 'A system''s <PREFIX>_TRANSPORT decides how the system is reached. With docker-exec it is reached
    through docker exec on its own Docker context. With the key absent, the system''s calls raise ConfigFault naming
    the missing key: the system is down and the run goes on. With the key blank, a near-miss spelling (Docker-Exec,
    docker_exec) or any other value (http, documented as future by N1), the system''s calls raise ConfigFault naming
    the unimplemented method (F4, human; NF-29: an exact match after the one parser''s trimming): the system is
    down and the run goes on.'
  rejected:
  - 'N1: no plain-HTTP transport in this issue'
  source: 20-demands.md (phase B), amended at D from §7
  premises:
  - '#110 test_transport_value_near_miss_spelling'
  note: 'F4 RESOLVED (human, round 4): an unimplemented TRANSPORT is a ConfigFault. Binds grown at D to the members
    the seed now exercises.'
