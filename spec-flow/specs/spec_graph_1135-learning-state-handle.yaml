  # --- W-H: R6; W-I: R7; W-J: R0
  - id: w_r6_entry_name_in_log_lines
    kind: behavior
    form: waiver
    binds: [StateRefused, _run_stage, run_common.enqueue_curation, _grade]
    cites: [S7-WAIVERS, C1, C16, C30, GR1]
    outcome:
      nl: >-
        WAIVED at §7 (owner): the refused entry's name is rendered raw in _run_stage's CRITICAL line and in E1's and
        E3's warning lines. Its chooser is the host actor that planted it; no sandbox or model tool writes the tree
        (C1, C16: the break-attempts on the source, unrefuted). The one reachable attacker-influenced chooser is
        GR1's opt-in unsandboxed fallback, routed to #1186. Not taken: rendering the record with repr in
        StateRefused's message (safe by construction).
  - id: w_r7_harness_lead
    kind: coherence
    form: waiver
    binds: ["interacts(harness_lead->DEFENDER_LEARNING_STATE_DIR)"]
    cites: [S7-WAIVERS, G44]
    outcome:
      nl: >-
