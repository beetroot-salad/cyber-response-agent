            drain-box:         {trust: attacker-influenced, constraints: [never-a-mount-source]}  # C1 (live, unrefuted)
            model-read-tools:  {trust: attacker-influenced, constraints: [read-root-carve-outs]}  # learning_run_dir minus wire_logs/, provenance, denylist (C17)
            model-write-tools: {trust: attacker-influenced, constraints: [lane-write-shapes]}     # C16 (live, unrefuted)
            unsandboxed-bash:  {trust: attacker-influenced, constraints: [operator-opt-in]}       # DEFENDER_ALLOW_UNSANDBOXED=1 lets the bash lane write the tree (GR1)
    - id: DEFENDER_LEARNING_STATE_DIR
      provenance: design   # MODIFIED by R15 / 3.1 C: a spelling that resolves to no folder is now FatalConfigError, not created
      facets:
        domain:
          type: path
          refinement:
            nl: >-
              The state root's spelling, read by config._env_state_dir as Path(raw).resolve() (config.py:192-196);
              unset or the empty string mean None, i.e. the package folder defender/learning/, which exists in
              every checkout. A relative value resolves against the launching directory (JF19: as today). Links at
              and above the root are followed once at resolution (R11). Under R15 the resolved path must be an
              existing folder: missing, a dangling link, or (JF18, open) a non-folder is FatalConfigError naming the
              resolved root and this variable. Tokens: unset, "" (empty), relative, symlinked, missing,
              dangling-link, not-a-folder.
          default: unset
          distinguished: [unset, "", relative, symlinked, missing, dangling-link, not-a-folder]
          falsy_valid: true    # "" is valid and means the default root
          documented_alternatives:
            - {value: non-default-path, crosses_validation: true}   # GR3: _tenant's overlap check refuses 11 of 18 spellings the reader accepts (routed to #1186)
