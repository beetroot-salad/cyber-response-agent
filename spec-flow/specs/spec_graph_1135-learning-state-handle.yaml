        DEFENDER_LEARNING_STATE_DIR, but the script it execs does not exist (G44), so this reader cannot run; N7
        allow-lists the evals.
  - id: w_r0_ra1_nested_lock_open
    kind: behavior
    form: waiver
    binds: [LearningState.lock, lead_author_drain, run_pitfalls]
    cites: [S7-WAIVERS, C7]
    outcome:
      nl: >-
        WAIVED at §7 (owner): RA1 — two handles on one root in one call path (the pitfalls curator runs inside the
        lead drain). A second open of one held lock name is excluded in the same process (C7), so a violation of the
        lock-nesting rule shows as a hang or a spurious TimeoutError in the regression tier that drives the lead
        drain with the pitfalls curator (test_pitfalls_*, test_1134_lead_author_handle) — a CI timeout, not a clean
        failure. The nesting rule has no demand of its own.
  # ======================================================================================
  # (6) the §7 re-opening for phase F's findings (93-resolutions-f.md, the owner's answers to
  #     92-reconciliation's F2 and F6): one waiver, one clause.
  # ======================================================================================
  - id: w_n3_stage_records
    kind: behavior
    form: waiver
    binds: [stage_harness, "interacts(stage_harness->pending_dir)", "interacts(stage_harness->lead_pending_dir)"]
    cites: [S7F-N3, G54, G66, C32]
    outcome:
      nl: >-
        WAIVED at the §7 re-opening for phase F (owner, 92 F2): the agent-stage records the shared stage harness
        writes into the stage folders — the wire_logs/ traces, budget.json and lessons_loaded.jsonl — are N3's
        and stay outside the handle, so a planted entry at one of them is handled as today, not halted. This is
        a fourth exemption from R1's halt and N14, beside E1, E2 and E3. Today's route, as the trail reads it
        (RB1; not executed, because PO19 was not run and the owner ruled it unnecessary): the harness's own
        except arm turns the fault into RunUnprocessable, the curator frame logs it as a crash it continues
        past, and the batch's rows may be bumped and, at the attempts ceiling, retired; the pitfalls lane
        dead-letters. The rows do not simply stay queued. #1142 owns the fix (note posted on #1142, comment
        5987781490): when it gives the stage harness its own handle, these records get the same no-follow
        guarantee and the stage_dir escape goes.
    rejected:
      - {nl: "Extending R1's halt to the stage records in #1135: that converts refusals at the N3 seam, which is #1142's work."}
      - {nl: "Running PO19 before deciding: the owner ruled it unnecessary, because the exemption does not depend on it."}
  - id: rb10_pending_folders_gitignored
    kind: behavior
    form: clause
    binds: [pitfalls_pending_dir, pending_delivery_dir]
    cites: [S7F-1186]
    outcome:
      nl: >-
        #1135's implementation adds two lines to the repository's .gitignore beside the existing
        defender/learning/_pending/ and author-queue/ lines: defender/learning/_pending_pitfalls/ and
        defender/learning/_pending_delivery/. A git clean -fd in the main checkout then no longer deletes the
        pitfalls queue and its lock, or an undelivered batch's delivery record, under the default state root
        (RB10). One line each and no test (the owner, at the §7 re-opening for phase F, 92 F6).
    rejected:
      - {nl: "Leaving the two lines to #1186's root move: the owner put them in #1135's implementation."}
      - {nl: "A test that reads .gitignore (R17: no test for a two-line configuration edit)."}

