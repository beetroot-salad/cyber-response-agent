      - "interacts(render_episode->timing_json)"
      - "interacts(render_episode->judge_yaml)"
    discharged_by: test_1025_the_launcher_renders_the_page_after_the_judge_frame_with_all_six_steps_on_it
    seed_docstring: >-
      After `cli.main` returns 0 on a full fake-seamed episode, `learning.html` sits beside
