    # ---- R2: shared-sink uniqueness, the four page-owned identity facets ----------------
    - {rule: R2, element: 'learning_html.identity', by: [d00_render_episode_returns_page_path, d04_page_write_refuses_planted_alias], cites: [g22, p1]}
