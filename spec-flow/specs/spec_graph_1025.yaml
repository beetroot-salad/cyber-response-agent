      # `drives(visualize_episode_main->render_episode)`); g22/p1 (executed) establish
      # write_guarded(mode='replace')'s serial-replace semantics, which is what makes a second
      # invocation land distinctly rather than collide. ALTITUDE NOTE in gate.evaluated (R2):
      # `drives(run_episode->render_episode)` — the launcher hook, also frame: composition — is
      # not separately named in d00's `binds`; phase E should extend it in the same commit.
    - {rule: R2, element: 'sec_worlds.identity', by: d37_anchor_contract_and_nav_integrity, cites: [g17]}
