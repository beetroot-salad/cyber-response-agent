    cites: [g1, g4]
    outcome:
      nl: >-
        No coherence test is written for the seventeen readers the page's read-only edges sit
        beside: this delta changes no writer of anything under the episode root (g1, the
        executed writer census) and adds only a third read-only consumer of `styles_css` (g4),
        so each unmoved reader observes no drift by construction; a future delta that changes a
        writer or the stylesheet's contract re-fires R7 against that delta.
    rejected:
      - nl: >-
          seventeen tests each asserting that nothing changed — ballast while the census holds.
    note: >-
      92-reconciliation F-4 found this rationale did not cover a READER-contract change (Q5's
      first wording moved `read_samples_record`'s default under `grade_episode` / `judge_render`,
      two readers the census never listed). The second sitting kept the default permissive
      (page-side strictness only), so the rationale holds again as written; the two
      `samples_yaml` reader edges are censused now and their R7 firings are answered by d46, not
      by this waiver.


# ===========================================================================================
# STRUCTURE — the address space. provenance: design = the delta (the page and its surfaces,
# demand-implied); provenance: code = the grounded neighbourhood (10-brief.md "Shared roots",
# "Structure neighborhood", "Sibling surfaces"). Ids are the code's names (schema.md, "Coin
# ids from the code's name"): `run_episode` is `learning/branch/cli.py::_run_episode`,
# `grade_episode` is `learning/judge/__init__.py::grade_episode`, `run_stage` is
# `learning/_pydantic_stage.py::run_stage`, `render_and_mirror` is
# `scripts/visualize/visualize_run.py::render_and_mirror`, `run_investigation` is the sibling
# `run.py --resume` child (profile alias `run` -> `run_investigation`).
#
# Every domain-facet `distinguished` member is a RECORD STATE the page branches on. Members
# tagged `# fork Jn` in the comments carry NO binding demand on purpose: the gate computes an
# R4 obligation per member, and the residue names each one as the hole whose decision lives
# in 45-dispositions.md's fork family Jn (routed to §7 by the orchestrator, not by this graph).
# ===========================================================================================

structure:
  axes: [episode_id, world, draw, index, step, trace_stem, lead_id, world_token]
  # episode_id  — the manifest's `episode_id` (NEVER `episode_dir.name`; correction 4, g8)
  # world       — a world label from the manifest / a `judge.yaml` row / `family`
  # draw        — an int stem under `worlds/<label>/judge/`, or the literal `mechanical`
  # index       — a finding's position inside one draw document
  # step        — a `Step` member (6, each distinguished — every member is a row)
  # trace_stem  — `<agent_id with ':'->'_'>_trace` / `..._framed_trace` (g2)
  # lead_id     — `l-NNN`, the gather-summary stem / referenced lead
  # world_token — `world_token_for(episode_token, label)`, the served-ledger file stem
  #               (declared derivation of `world` on `served_ledger.identity`)

  actors:
    - {id: render_episode,         frame: leg,         provenance: design}   # visualize_episode.py::render_episode
    - {id: visualize_episode_main, frame: leg,         provenance: design}   # visualize_episode.py::main (argv → render_episode)
    - {id: run_episode,            frame: composition, provenance: code}     # branch/cli.py::_run_episode — the six Step frames; the hook attaches here (via cli.main/_launch)
