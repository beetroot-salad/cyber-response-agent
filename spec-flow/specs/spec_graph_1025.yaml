  - id: r_a_finding_id_recorded_in_judge_yaml_names_a_world_draw_index_triple_absent_from_every_draw_document
    kind: domain-outcome
    form: test
    source: "§7 J9b (human); 45-dispositions fork family J9b; 70-resolutions.md"
    binds:
      - "judge_yaml.domain.distinguished[recorded-finding-without-document]"
      - "interacts(render_episode->sec_findings)"
      - "sec_findings.identity"
      - "interacts(render_episode->sec_verdict)"
    discharged_by: test_1025_a_finding_id_recorded_in_judge_yaml_names_a_world_draw_index_triple_absent_from_every_draw_document
    note: >-
      THE GRAIN IS THE DOCUMENT (phase E-rework, 92-reconciliation F-5): a stub is rendered iff
      the draw DOCUMENT the recorded `(world, draw, index)` triple names is absent; a triple
      missing from a PRESENT document (a document rewritten with fewer findings than the record
      names) renders no stub and no row, and tile 3 counts what is on disk. The premise's own
      name asks at triple grain; the suite's rule — which
      `s_identical_findings_under_two_draws`,
      `r_a_draw_document_is_missing_its_findings_key_entirely` and
      `r_the_same_finding_id_string_appears_in_two_different_draw_documents` already depend on —
      is document grain, stated in the test's docstring and pinned by its last arm.
