schema_version: 2
design: "1025"  # gh issue #1025, the episode page `learning.html`. THE AUTHORITATIVE TEXT is
                # `.spec-flow/frontiers/00-design.md`: the 2026-09-10T07:16 intent+design comment,
                # amended by the later comments (2026-09-13 amendment: slot bindings for the top
                # layer), AS CORRECTED BY the orchestrator's tail "Corrections folded in" (c13
                # refuted: three world states; six gaps folded in as corrections 1-6), which is
                # BINDING on every phase. Assembled at phase D from `10-brief.md`, `20-demands.md`,
                # `45-dispositions.md` and `46-reground.md`.
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`). check_binds
                        # scans its docstrings NON-RECURSIVELY over `*.py` in this one directory;
                        # every `discharged_by` below names a test that does not exist yet — the
                        # expected phase-D state. The two shipped prep suites
                        # (`test_1025_episode_reader.py`, `test_1025_stage_timing.py`) already live
                        # here; no pointer below collides with a name in them (checked at assembly).
base: e8d22ac0          # origin/main. write-code-from-spec's gate diffs against it. Preps 1/2/2b
                        # (#1028 timing.json + StageClock, #1029 public single-homed readers,
                        # has_refused stored) are ON this base — the design's "order of work" steps
                        # 1-2 are shipped, step 3 (the page) is this spec.

# ===========================================================================================
# READ THIS FIRST — how this graph is organised
#
# demands  — 41 extracted demands (`d00`..`d40`, 20-demands.md §3, seeds §4) followed by 61
#            settled-premise demands, then (PHASE E) 74 `r_<premise>` demands minted from the §7
#            resolutions, the five §7-minted demands d41–d45, the two waivers w01/w02, and (PHASE
#            E-REWORK, the second §7 sitting) d46 — 184 in all.
#            The paragraph below describes the phase-D state it was written in.
#            demands minted from the 61 SETTLED premise dispositions (`s_<premise>`,
#            45-dispositions.md "Settled dispositions"), each `discharged_by` the premise's own
#            test name so phase E's author and phase F's premise-disposition conservation walk
#            join by name. Where 46-reground.md selected an arm for a conditional settled entry
#            (P-1, P-3, P-5, P-7, P-8) the seed carries THAT arm and names the probe claim.
#            The 76 fork / silent-branch premises (25 families J1-J18) mint NO demand here —
#            they are §7's, routed from 45-dispositions.md by the orchestrator; the record
#            states they concern are modelled as `distinguished` members below so the gate
#            computes an R4 hole per state and the residue names each one.
# structure — the page's address space (provenance: design) attached to the grounded
#            neighbourhood (provenance: code — the writers, sibling readers and lint censuses the
#            brief established). Two identity facets on page surfaces (`sec_findings`,
#            `sec_leads`, `sec_worlds`) exist so R2 asks the anchor-collision question F16
#            flagged; two access facets (`world_archive`, `family_yaml`) exist so R3 asks the
#            parity question P-2 and P-9 answered in the reality lane.
# claims   — the 58 brief claims (28 inherited from discuss-issue, 30 raised at grounding), the
#            24 extraction claims (x01-x24) and the 10 re-ground probes (p1-p10), ids kept.
#            Three inherited instruments were UPGRADED because this run executed the very
#            primitive (g22 <- p1, g23 <- p5/p6, x16 <- p6/p8); the rest carry the instrument
#            the sweep actually used, and 50-graph-digest.md's red flags list the ones
#            `spec-graph claims` will call mis-typed.
# gate     — the gate leaf's (phase D), RE-STAMPED at phase E and again at phase E-rework: every
#            hole below now carries the human's `resolution` (§7, 70-resolutions.md, and the
#            second sitting 71-resolutions-f.md) and its `resolved_to` demand; the waived
#            firings are recorded holes resolved to w01/w02. It was seeded with only the two
#            46-reground red flags (P-4 sanitisation policy; P-2 unscreened leaves) before §7
#            ran; nothing in it is unresolved any more.
# ===========================================================================================

demands:

  # -----------------------------------------------------------------------------------------
  # #0 — the return-value contract (20-demands.md §2; PROVISIONAL, fork fk-1 → §7)
  # -----------------------------------------------------------------------------------------
  - id: d00_render_episode_returns_page_path
    kind: behavior
    form: test
    provisional: false         # fk-1 — RESOLVED at §7 Q1: the return shape and the CLI contract stand as pinned in §2
    source: "demand #0; 20-demands.md §2"
    binds:
      - "interacts(render_episode->learning_html)"
      - "learning_html.identity"
      - "drives(visualize_episode_main->render_episode)"
      - "drives(run_episode->render_episode)"      # both composition frames that can call twice (60-residue red flag 1)
    discharged_by: test_1025_render_episode_writes_learning_html_beside_judge_yaml_and_returns_its_path
    seed_docstring: >-
      Driving `render_episode` on a copy of `fresh-authkeys-20260909-n124` returns
      `<dir>/learning.html`, that file exists beside `judge.yaml`, is the page (carries `<title>`
      with the episode id and `id="sec-verdict"`), and a second call replaces it whole (mtime
      advances, content equal).
    note: >-
      Reading pinned provisionally: `render_episode(episode_dir: Path) -> Path` in
      `defender/scripts/visualize/visualize_episode.py`, reads only under `episode_dir`, writes
      through `defender._io.write_guarded` (replace lane). The second-call clause is the R2
      uniqueness content for the two serial drivers (launcher hook, standalone CLI) into one sink.

