      - "family_yaml.domain.distinguished[absent]"
      - "cli_argv.domain.distinguished[extra-argument]"
    discharged_by: test_1025_visualize_episode_cli_exits_zero_on_an_episode_dir_and_one_with_no_page_otherwise
    seed_docstring: >-
      `main([dir])` returns 0 and prints the page path; `main([])`, `main([a file])` and
