  - id: s_non_ascii_and_control_characters_in_rendered_strings
    kind: behavior
    form: test
    source: "45-dispositions (settled, escalated): non_ascii_and_control_characters_in_rendered_strings; p4 selected NEITHER stated arm — the page must sanitise"
    binds:
      - "interacts(render_episode->learning_html)"
      - "interacts(render_episode->sec_findings)"
      - "interacts(render_episode->sec_verdict)"
    discharged_by: test_1025_non_ascii_and_control_characters_in_rendered_strings
    seed_docstring: >-
      The page declares and writes UTF-8; em dashes, zero-width and bidi characters survive
      as text (only markup characters are escaped). A record string carrying a NUL or a lone
      surrogate (reachable: a YAML `"\uD800"` scalar or a JSON `\ud800` escape hands the page
      one, p4) does not crash the render — the page renders, the rest of the string survives,
      no 0x00 byte lands in `learning.html`, and the NUL is replaced by U+FFFD exactly where it
      stood.
    note: >-
      `write_guarded` neither replaces nor strips (p4): it writes a NUL verbatim and RAISES
      `UnicodeEncodeError` on a lone surrogate. The substitution policy was the seeded R6 hole,
      resolved at §7 Q10 (`errors="replace"`) and, because `errors="replace"` does nothing to a
      NUL (80-author-digest red flag 1, 92-reconciliation F-7), completed by the human at the
      second sitting (71-resolutions-f): NUL → U+FFFD, on the same path as a lone surrogate.
      This demand and d42 pin both halves of the observable.

