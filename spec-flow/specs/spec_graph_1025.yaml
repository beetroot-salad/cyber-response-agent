  - id: d13_disposition_is_the_enqueues_partition
    kind: domain-outcome
    form: test
    source: "O2; amendments 1 and 3; correction 2 (fifth disposition); fk-3"
    binds:
      - "judge_yaml.domain.distinguished[verdict_word=discard]"
      - "judge_yaml.domain.distinguished[withheld-row]"
      - "interacts(render_episode->judge_yaml)"
      - "interacts(render_episode->sec_findings)"
    discharged_by: test_1025_a_findings_disposition_reproduces_the_enqueues_partition_withheld_unqueueable_blocked_by_verdict_or_enqueued
    seed_docstring: >-
      Sample: `no_remote_session`'s 4 defender findings read "withheld —
      reachability_unmeasured", `prior_fake_key_precedent`'s 4 read enqueued (the episode has
      `family_outcome: discard` and `verdict_word: undecidable`, and the rows still read
      enqueued), the 5 world-author rows read enqueued; a synthetic `unqueueable_findings:
      ["<id>: reason"]` entry marks that id unqueueable with the reason; a synthetic
      `verdict_word: discard` marks the MEASURING world's defender findings "never eligible —
      verdict discard", neither enqueued nor withheld, while the withheld world's four stay
      "withheld — reachability_unmeasured" as the record's `withheld_findings` carries them;
      counts equal `enqueued_rows`, `len(withheld_findings)`, `world_enqueued_rows`; on that
      discard episode tile 3's split reads 0 defender / 5 world author / 4 withheld /
      0 unqueueable and gains a fifth part, "4 never eligible" — the measuring world's count
      (95-reconciliation-2 N-4, auto-resolved at the third sitting: non-material, one
      assertion).
    note: >-
      What the page does when the recorded counts and its own walk DISAGREE is fork J9c.
      PRECEDENCE (phase E-rework, 92-reconciliation F-2, decided by amendment 3 and g13's
      executed line order): the enqueue's rule for a defender finding is subject → withheld →
      blocked → enqueued (`enqueue.py:731-748`) — a withheld world's findings are appended to
      `withheld_findings` BEFORE `if defender_blocked: continue` is reached — so on a
      `verdict_word: discard` episode "never eligible — verdict discard" is the MEASURING
      world's disposition only, and the fixture keeps `withheld_findings` populated as the
      enqueue writes it. This seed's original "every defender finding" was the extraction's
      wording, not the enqueue's (`handoff.refuted`).
      THE LEDGER (post-review, #1042 fifth pass): "reproduces the enqueue's partition" is
      discharged by READING it, not re-running it. The enqueue writes its decision per finding
      to `judge.yaml.dispositions` (`{finding_id, lane, reason}`, `enqueue.disposition_entry`)
      and the page renders that ledger; the page's earlier copy of the lane rule, and then
      the borrowed rule fed with inputs rebuilt from the rows, each drifted from the pass on
      an edge (`test_1025_a_record_naming_one_world_twice_renders_exactly_what_the_pass_filed`).
      The fixture's ledger is held to the real pass's output
      (`test_1025_the_fixture_ledger_is_the_passes_own`); the discard arm is the fixture
      re-filing the defender entries as the pass does (`block_defender_lane`). A record with
      no ledger (the two pre-ledger archives) renders one group, "record carries no
      disposition ledger — not enqueued", and decides nothing
      (`test_1025_a_record_with_no_ledger_says_so_instead_of_guessing`).

