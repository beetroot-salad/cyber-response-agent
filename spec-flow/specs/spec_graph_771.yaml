# ============================================================================
# CLAIMS — the ledger. Every load-bearing statement about existing reality,
# probed rather than asserted. Seeded with every claim the three input
# frontiers raised, inherited ids preserved:
#   R1-R7, C1, B1-B11, E1, E2   — 00-design-doc.md's block (21), source: discuss
#   X1-X19                      — 21-demands.md's extraction (19)
#   G1-G15                      — 10-brief.md's grounding (15)
#   G16                         — 46-reground-lead-id.md, the dispatched probe (1)
# where 21-demands restated an inherited claim under a NEW verdict (C1, E2, R2,
# X7's relation to it), the restated verdict is the one recorded here.
#
# INSTRUMENT WARNING, RESOLVED — AND THE RECORD REPAIRED AT PHASE F. Fourteen
# entries once closed on an instrument their kind does not admit; all fourteen
# were RE-PROBED on the right instrument (49-reground-claims) rather than
# relabelled. But only the LABEL travelled into this file on the first pass: nine
# entries carried `probe_kind: executed` above probe text still describing the
# READ the re-probe replaced, so the executed probe could not be replayed from the
# ledger — which is the whole point of a claim, and this ledger is what
# write-code-from-spec cites. The probe and observed text of those nine is now
# copied from the re-ground file. The residue entry that ordered the re-probe said
# in terms: do not edit `probe_kind` to launder the record; the repair is the
# opposite direction — the text now matches the label rather than the label the
# text. THREE VERDICTS CHANGED, and two of them
# are load-bearing: X17 and G3 went HOLDS -> REFUTED (the model write gate denies a
# planted symlink but is BLIND to a planted hard link, executed on both tools and
# both allowed names), and G12 dropped holds -> unrefuted, which is a reachability
# claim's ceiling rather than a reversal. X13 and X14 kept their verdicts and got
# worse: the unsafe budget idiom is executed 759 times per suite run under CI's
# posture, and the accounting kill is two refused writes past an elapsed window,
# not five consecutive. ONE entry remains flagged — X7, the harmless direction (a
# `referential` claim closed on `executed`); downgrading its label would record a
# weaker probe than the one that ran.
# ============================================================================
claims:
  # ---- inherited from the design doc's sweep ----
  - {id: R1, kind: referential, source: discuss, claim: "Neither box argv builder passes --security-opt today; default runtime is runsc with a runc fallback.", probe: "read box.py BoxSpec, _create_argv and the drain argv builder", probe_kind: read, observed: "runtime: str = 'runsc'; RUNTIMES = ('runsc','runc'); no --security-opt in either argv", verdict: holds}
  - {id: R2, kind: census, source: discuss, claim: "Nothing in the tree legitimately needs to create a link inside the box, so a global creation ban costs nothing functionally.", probe: "the design's probe counted TRACKED symlinks in the repo", probe_kind: search, observed: "0 tracked symlinks, as recorded — but the claim is about runtime behaviour INSIDE the box, which a repo-content count cannot observe", verdict: unprobed, note: "Reclassified by 21-demands from holds, not refuted. M2's ordinary-create control covers part of it; nothing yet covers a tool that legitimately links."}
  - {id: R3, kind: referential, source: discuss, claim: "A startup probe that fails box creation on a bad in-box observation already exists and is the precedent M2 follows.", probe: "read box.py's _plant / _probe_sentinel / _plant_sentinel", probe_kind: read, observed: "sentinel mismatch raises BoxFault and the container is rm -f'd", verdict: holds}
  - {id: R4, kind: referential, source: discuss, claim: "The session store is sited outside the run dir, which is why it is not in the census.", probe: "read session_store.store_path_for", probe_kind: read, observed: "runs_base.parent / 'sessions' / f'{case_id}.db'", verdict: holds}
  - {id: R5, kind: referential, source: discuss, claim: "Model-invoked writes are gated by resolve-and-confine; harness writes are gated by nothing.", probe: "read permission/files.py and tools.py's two write tools", probe_kind: read, observed: "decide_write resolves and confines; write_text then re-resolves independently — check-then-write", verdict: holds}
  - {id: C1, kind: census, source: discuss, claim: "Twelve host-side write sites into the shared tree in three idioms, plus two gated model writers.", probe: "grep over write idioms — the design's own probe", probe_kind: search, observed: ">=14 writers in >=5 idioms; a grep over idioms cannot see a wrapper (budget_enforcer's _write_budget_atomic -> write_atomic) or a host-side hook writer (claim_lead -> gather_raw/<lead>.lead.json)", verdict: refuted, note: "Refuted at extraction and folded into v2 as C3-fix. Every census-keyed demand in this graph binds a floor, not a census; the widening is applied to no_write_through_planted_leaf and no_write_through_planted_dir_component."}
  - {id: B1, kind: behavior, source: discuss, claim: "write_text through a planted symlink truncates the outside target and leaves the link in place.", probe: "scratch probe — plant link, write_text, read target", probe_kind: executed, observed: "target = 'X'; entry is still a symlink", verdict: holds}
  - {id: B2, kind: behavior, source: discuss, claim: "Append-mode open follows a planted symlink and appends to the outside target.", probe: "scratch probe — plant link, open('a'), write a JSONL row", probe_kind: executed, observed: "target = 'SECRET\\n{\"row\":1}\\n'", verdict: holds}
  - {id: B3, kind: behavior, source: discuss, claim: "The touch + r+ + truncate locked-JSON idiom follows a planted symlink and rewrites the outside target.", probe: "scratch probe reproducing update_json_locked over a link", probe_kind: executed, observed: "target = '{\\n  \"k\": \"v\"\\n}' — real newlines, unlike the JSONL writers", verdict: holds}
  - {id: B4, kind: behavior, source: discuss, claim: "_io.write_atomic is not symlink-safe — planting the TEMP name lands the payload on the outside target before the rename.", probe: "scratch probe — plant link at path.name + '.tmp', run the helper's two steps", probe_kind: executed, observed: "target = 'PWNED'; the rename then moves the link onto the destination", verdict: holds}
  - {id: B5, kind: behavior, source: discuss, claim: "os.replace ONTO a planted symlink replaces the link itself and does not follow it.", probe: "scratch probe — plant link at dest, replace a real file onto it", probe_kind: executed, observed: "target unchanged ('SECRET\\n'); dest is no longer a symlink", verdict: holds}
  - {id: B6, kind: behavior, source: discuss, claim: "O_CREAT|O_EXCL|O_NOFOLLOW on a planted symlink fails closed with EEXIST.", probe: "scratch probe", probe_kind: executed, observed: "FileExistsError errno 17", verdict: holds}
  - {id: B7, kind: behavior, source: discuss, claim: "O_NOFOLLOW alone on a planted symlink fails with ELOOP.", probe: "scratch probe", probe_kind: executed, observed: "OSError 'Too many levels of symbolic links'", verdict: holds}
  - {id: B8, kind: behavior, source: discuss, claim: "O_NOFOLLOW on the leaf does NOT protect a swapped directory component — the write still lands outside.", probe: "scratch probe — symlink the gather_raw-shaped dir component, mkdir(exist_ok), open leaf with O_NOFOLLOW", probe_kind: executed, observed: "file created inside the outside directory", verdict: holds}
  - {id: B9, kind: behavior, source: discuss, claim: "A hard link defeats O_NOFOLLOW entirely — the open succeeds and truncates the aliased file.", probe: "scratch probe — os.link an outside file into the tree, then O_NOFOLLOW|O_TRUNC", probe_kind: executed, observed: "target truncated to 'X'; nlink 2", verdict: holds}
  - {id: B10, kind: behavior, source: discuss, claim: "mkdir(parents=True, exist_ok=True) over a symlink-to-directory succeeds silently.", probe: "scratch probe", probe_kind: executed, observed: "SUCCEEDED, no error", verdict: holds}
  - {id: B11, kind: behavior, source: discuss, claim: "json.dumps escapes newlines, so the JSON writers give truncation and not line injection; the gather-summary writer does not go through it.", probe: "json.dumps over an embedded newline; read the gather-summary persist and the raw-payload writer", probe_kind: executed, observed: "'{\"a\": \"x\\\\ny\"}' — escaped; the gather-summary persist writes _wrap(output) markdown verbatim", verdict: holds}
  - {id: E1, kind: behavior, source: discuss, claim: "Docker enforces a seccomp errno rule for symlink/symlinkat/link/linkat/mknod/mknodat under runc, and ordinary file and directory creation still work.", probe: "docker run --runtime runc --read-only --network none --security-opt seccomp=<deny profile>, attempting each shape on a mounted volume", probe_kind: executed, observed: "symlink/hardlink/fifo -> PermissionError 'Operation not permitted'; mkdir and plain write SUCCEEDED", verdict: holds}
  - {id: E2, kind: behavior, source: discuss, claim: "gVisor applies the container's OCI seccomp profile when the runtime is registered with --oci-seccomp.", probe: "inherited from design v2 C1-fix — real runsc release-20260727.0, one OCI bundle, two arms differing only in the runtime flag", probe_kind: executed, observed: "--oci-seccomp OFF (shipped default) -> SYMLINK_ALLOWED, Seccomp: 0; --oci-seccomp ON -> SYMLINK_DENIED, Seccomp: 2", verdict: holds, note: "Restated from revision 1's `deferred`. Supersedes 20-demands' refutation, which read #540's C19 — that probe measured only the default arm and was written up as a capability limit. NOT re-runnable in this session or in this environment: no runsc is registered with this machine's daemon."}
  - {id: R6, kind: reachability, source: discuss, claim: "The box cannot hard-link a host file that lives outside the shared tree — link(2) refuses to cross a mount boundary.", probe: "tried to break it — two volumes on one host filesystem plus the container rootfs; os.link across each pair, and within one mount as a positive control", probe_kind: executed, observed: "cross-mount and rootfs->shared both EXDEV 'Invalid cross-device link'; within-mount SUCCEEDED", verdict: unrefuted}
  - {id: R7, kind: reachability, source: discuss, claim: "The curator's tool surface cannot create a symlink, which is why the drain lane's restore is latent rather than live.", probe: "not attempted — M1 applies to the drain box too, so the claim stops being load-bearing", probe_kind: search, observed: null, verdict: unprobed, note: "Deliberately left unprobed: the design closes the lane regardless of how the claim resolves."}

  # ---- raised at extraction (21-demands.md) ----
  - {id: X1, kind: census, claim: "Only two host-side writers mkdir a box-controlled directory component before writing.", probe: "grep -rn '\\.mkdir(' over the runtime, the hooks and the shared IO helper", probe_kind: search, observed: "at least five sites under a box-controlled component, two of them the gated model writers", verdict: refuted}
  - {id: X2, kind: behavior, claim: "Under the alias ban AF_UNIX bind still succeeds, so the ban's set and the reap scan's refusal set genuinely differ.", probe: "docker run --runtime runc --read-only --network none --security-opt seccomp=<six-syscall SCMP_ACT_ERRNO profile>, each shape attempted on the bind-mounted tree, platform default as control", probe_kind: executed, observed: "symlink/hardlink/mkfifo/mknod -> PermissionError; ordinary create, mkdir and AF_UNIX bind SUCCEEDED, leaving a socket the reap scan refuses", verdict: holds, note: "The basis for C5-fix/F3. Second-order: a box with code execution can still park a socket and make the reap scan fail the whole run — an availability gap O2 does not cover (fork R13)."}
  - {id: X3, kind: behavior, claim: "A box-startup fault does not necessarily stop the run — with the unsandboxed opt-out set it degrades to an unboxed host executor.", probe: "RE-PROBED (49-reground-claims), EXECUTED: drove the real box.start_box(run_dir, defender_dir, docker=<failing DockerFn>) through its committed docker= seam, once per value of DEFENDER_ALLOW_UNSANDBOXED across {unset, '1', '0', 'true', 'TRUE', '01', ' 1', '1 ', 'yes', ''}, and inspected the returned executor's sandboxed flag and transport type", probe_kind: executed, observed: "Exactly one value degrades. With '1': a BoxExecutor with sandboxed=False, name='', transport=_HostTransport — the bash lane on the host. Every other value, including unset and every near-miss spelling, re-raises the BoxFault; the opt-out is an exact != '1' test and is already maximally strict", verdict: holds, note: "F4 resolved against this: the ban fault is the one fault the opt-out may not swallow."}
  - {id: X4, kind: behavior, claim: "The reap scan always walks the tree after the box dies.", probe: "RE-PROBED (49-reground-claims), EXECUTED: drove the real box.stop_and_scrub over its four-cell input space via its committed stop_box= / scrub_tree= seams — teardown succeeds/faults x an exception already in flight or not — with a recording scrub_tree", probe_kind: executed, observed: "The scan ran in both clean-teardown cells and in NEITHER teardown-fault cell. With nothing in flight the BoxFault propagates (the caller learns) but the walk still never ran; under an in-flight failure the fault is warned-and-swallowed AND the walk never ran — silent on both counts", verdict: refuted, note: "Bounds the reader-side fallback, and the skipped path is the crash path — the one most likely to hold what the box planted. Fork R12."}
  - {id: X5, kind: behavior, claim: "The design's phrase 'the write failed closed' names one observable outcome.", probe: "RE-PROBED (49-reground-claims), EXECUTED: made the write genuinely fail at each of the four cited sites (a directory squatting the staging name, a plain file squatting a parent component, an absent bind source) and recorded what each caller returned or raised — driver._account_executed_call, query_tool._persist_payload, record_lead.claim_lead, box._plant", probe_kind: executed, observed: "Four distinct observable outcomes, reproduced: the accounting site returns normally and the run continues with only a silent failure counter advancing; the gather raw-payload writer returns None and its row is written without the by-ref pointer; the lead sidecar writer returns 0, indistinguishable from success; the startup sentinel raises BoxFault and aborts box startup", verdict: refuted, note: "F1 resolved by preserving all four rather than unifying them — which is what makes call_site_postures_preserved a demand, X14 a fork, and R8's per-posture authoring a promotion."}
  - {id: X6, kind: referential, claim: "The atomic-write helper has callers beyond the shared tree.", probe: "grep -rn 'write_atomic' --include=*.py, minus its definition", probe_kind: search, observed: "five production call sites; one is INSIDE the shared tree (the budget artifact), one targets run_dir.parent/<run>.accounting_failures.json outside the box's reach", verdict: holds}
  - {id: X7, kind: referential, claim: "The platform default seccomp profile can be vendored and appended to.", probe: "docker info --format '{{.SecurityOptions}}'; ls /etc/docker; find / -name default.json -path '*seccomp*'", probe_kind: executed, observed: "name=seccomp,profile=builtin; no on-disk default profile anywhere — the daemon's default is compiled in", verdict: refuted, note: "Restated from holds. C2-fix withdraws the vendoring decision on exactly this ground; the shipped profile is hand-written and its widening on the runc lane is an accepted cost."}
  - {id: X8, kind: referential, claim: "The startup sentinel is the precedent M2 follows, and M2 costs one docker exec per box.", probe: "read box.py's sentinel plant/probe/check helpers and both start overloads", probe_kind: read, observed: "the investigation lane probes once per box; the request lane runs the mount-sentinel check ONCE PER MOUNT", verdict: holds, note: "Why probe_runs_at_every_box_start is its own demand: the nearest precedent has the wrong cardinality."}
  - {id: X9, kind: referential, claim: "The drain lane's fault-path corpus restore is the same class, latent.", probe: "read learning/author/drain.py around the snapshot restore", probe_kind: read, observed: "mkdir(parents=True, exist_ok=True) plus a truncating write, on a path composed from snapshot keys", verdict: holds}
  - {id: X10, kind: behavior, claim: "The structural premise holds — the trace write lands while the box is alive and the reap scan cannot precede it.", probe: "RE-PROBED (49-reground-claims), EXECUTED: drove the real run._run_investigation_lifecycle with recording start_box/stop_box/scrub seams around a real hermetic FunctionModel investigation, and timestamped the tool_trace.jsonl write with a CPython audit hook rather than trusting the call graph", probe_kind: executed, observed: "Observed order, one run: (1) box alive, (2) tool_trace.jsonl opened mode='w', (3) stop_box, (4) scrub walked the tree. The trace write is inside the lifecycle's try; the reap pair is its finally", verdict: holds}
  - {id: X11, kind: referential, claim: "The box start seam is injectable, so the argv and startup-probe demands are testable without a daemon.", probe: "read start_box's docker: DockerFn parameter and the existing box DooD test module", probe_kind: read, observed: "an injected capturing docker is an established idiom; separate live-daemon lanes exist under tests/e2e/", verdict: holds}
  - {id: X12, kind: behavior, claim: "Which of the two budget writers runs is selected by an off-by-default env flag, so a default run never exercises the unsafe one.", probe: "RE-PROBED (49-reground-claims), EXECUTED: invoked the REAL tool_execute hook body registered by driver._make_hooks, built with the real MAIN_DEF.budget_enforced and enforcement_enabled() expression from the production build site, once per DEFENDER_BUDGET_ENFORCE value in {unset, '1', '0', 'true', '', 'TRUE', ' 1 '}, with a CPython audit hook recording every open/rename touching budget.json", probe_kind: executed, observed: "Flag true: two reads of budget.json, then open(budget.json.tmp, mode='w') and os.rename(budget.json.tmp -> budget.json) — the B4-unsafe staged-temp idiom. Flag false (unset, '0', ''): a single open(budget.json, mode='r+') — the locked read-modify-write, no temp name. Default is false; main and gather resolve identically.", verdict: holds, note: "Confirms C3-fix's mechanism and names the knob. The 'a default run never exercises it' half is where X13 bites."}
  - {id: X13, kind: behavior, claim: "A default run never exercises the write_atomic budget path, so a sweep of a default run never sees it.", probe: "RE-PROBED (49-reground-claims), EXECUTED: ran the whole collected suite the way CI runs it — DEFENDER_BUDGET_ENFORCE=1 .venv/bin/python -m pytest tests/ -q -m 'not live' from defender/ — under a sitecustomize.py audit hook counting every open(*/budget.json.tmp) against every open(*/budget.json, 'r+')", probe_kind: executed, observed: "4382 passed, 4 failed (the four documented root-only accounting tests), 118 skipped in 310s. The audit counted 759 stagings of budget.json.tmp against 927 locked opens: the unsafe idiom is not merely enabled in CI, it is executed 759 times per suite run. Both jobs set the flag at job level; box-dood forwards it into the container with -e", verdict: refuted, note: "The unsafe idiom is the CI-default path, including for every test phase E writes. Any test that asserts the safe idiom must pin the posture explicitly rather than inherit it."}
  - {id: X14, kind: behavior, claim: "Preserving each call site's exception posture keeps a refused write from failing the run.", probe: "RE-PROBED (49-reground-claims), EXECUTED, two arms. (1) End to end: drove the real driver.run_investigation through the committed hermetic replay harness with a persistently unwritable budget.json.tmp, under flag ON and flag OFF, against a writable control. (2) Escalation shape: drove the real account_call with real refused writes interleaved with real successes, over the real limits table with accounting_failure_max_elapsed shortened through the committed limits= seam", probe_kind: executed, observed: "Arm 1, flag ON: the run ended after exactly 5 model turns with truncated_by='budget', exit_reason='BudgetKill' (control: 60 turns); the exception does not escape the process, so 'kills the run' means truncates the investigation and yields no output. Flag OFF: the same unwritable staging name was completely inert, 60 turns. Arm 2 IS THE MAGNITUDE, and it is NOT five consecutive: 4 failures + 1 success + 4 failures did NOT kill (the reset works), but 1 failure + 1 success + 1 failure past the elapsed threshold DID — _reset_accounting_failure clears consecutive_failures and never clears first_failure_at, so TWO refused writes past a 300s window end the run for most of a run's life", verdict: refuted, note: "Fork F5/R2, RESOLVED at §7 D3. Under F1's preserved posture a planted alias on the budget artifact ends the run — the plant-a-link denial-of-service F1's own rationale rejected. Decide against the TWO-failure number, not the five: the demand written here asserts the ELAPSED limb, because a test written against five consecutive refusals passes while the two-failure path stays open. The reachability caveat is what made it a judgment call: with M1 and M2 in force the box cannot plant the link at all, so the lever exists only in the world M3 backstops."}
  - {id: X15, kind: referential, claim: "The runtime registration that carries --oci-seccomp lives outside anything this repo ships (v2's P1).", probe: "read .github/workflows/ci.yml — the two 'Install gVisor (runsc) for the box suite' steps", probe_kind: read, observed: "both the `test` job and the `box-dood` job apt-install runsc, run `sudo runsc install`, restart docker and hard-fail unless the daemon then lists runsc — with no --oci-seccomp anywhere", verdict: refuted, note: "P1 holds for laptops and for production hosts; it is false for CI, which is where the ban's arrival is first observed. Without a matching change here, every box in CI faults at startup the moment the not-opt-out-able fault ships."}
  - {id: X16, kind: behavior, claim: "Every box lane has a writable shared tree for M2's probe to act in.", probe: "RE-PROBED (49-reground-claims), EXECUTED: built the REAL BoxRequests from run_cycle._run_cycle_box_request and drains._drain_box_request (both labels) over real on-disk trees and real LoopPaths, rendered each through the REAL box._render_argv and the investigation lane through the REAL box._create_argv, then parsed the emitted --mount/--tmpfs argv", probe_kind: executed, observed: "Investigation lane: one writable bind (the run dir) plus the /tmp tmpfs. Learning run-cycle lane: ZERO writable binds — all three mounts render with `,readonly`, and its only writable path is the /tmp tmpfs. Drain lane: one writable bind per label beside a read-only worktree root, so its writable set is BATCH-DEPENDENT.", verdict: refuted, note: "Fork F6/R5. The ban is a syscall filter rather than a path policy, so a tmpfs probe would observe it — but that contradicts the design's 'in the shared tree' wording, so it is not extraction's to pick."}
  - {id: X17, kind: behavior, claim: "The model's write gate denies a statically planted link at HEAD; the exposure is a race, not a plant (C4-fix).", probe: "RE-PROBED (49-reground-claims): drove the REAL _tool_write_file and _tool_edit_file with REAL AgentDeps bound from MAIN_DEF against real aliases planted at the two allowlisted names, over every alias shape the boundary admits — absolute symlink, relative symlink, sibling symlink, and HARD LINK — each pointing outside the run dir with schema-valid content", probe_kind: executed, observed: "SYMLINK, absolute and relative: denied, outside file untouched. HARD LINK: ALLOWED — write_file returned success and the outside file's contents were replaced; edit_file likewise, on both allowed names. Path.resolve() does not dereference a hard link, so the resolved path IS <run_dir>/<name>, matches the allowlist, satisfies containment, passes the content schema, and write_text truncates the shared inode.", verdict: refuted, note: "HOLDS -> REFUTED, the load-bearing reversal. The gate denies the SYMLINK plant, not 'a statically planted link'. The stated ground for binding the two gated rows to the retained-property clause instead of the O1 negatives is false on the hard-link axis; phase E authors the plant-shaped negative there (gated_model_writers_refuse_a_planted_hard_link). The reap scan DOES refuse a hard link (nlink>1), so the residual exposure is detection-after-the-fact — and X4 says the scan is skipped on exactly the crash path."}
  - {id: X18, kind: referential, claim: "The doc-correction and CI-registration demands have no testable surface.", probe: "grep for test modules reading .github/workflows/ci.yml; ls scripts/lint/", probe_kind: search, observed: "an existing suite reads the CI workflow as a fixture and asserts on its content; thirteen ratcheted lint modules with baseline JSONs are the established shape a new write-primitive lint would follow", verdict: refuted, note: "Both demands can be form: test on existing idioms — no clause downgrade is warranted."}
  - {id: X19, kind: referential, claim: "The exact registration syntax that puts --oci-seccomp into the daemon's runtimeArgs.", probe: "not run — no runsc binary and no runsc runtime registered with this machine's daemon", probe_kind: read, observed: null, verdict: unprobed, note: "The one load-bearing unknown handed to implementation. It decides the content of BOTH the fault message (ban_fault_message_names_the_configuration) and the CI change (oci_seccomp_registration_ships_with_the_ban); neither demand should be authored around a guessed flag spelling. Recorded in the structure as oci_seccomp_registration.access[host_daemon_config].constraints: unknown."}

  # ---- raised at grounding (10-brief.md) ----
  - {id: G1, kind: census, claim: "C1's twelve host-side write sites are all real and correctly sited at c98bc86c, but the census is incomplete at IDIOM granularity — budget.json is written by two idioms, the second being write_atomic, and which one runs is selected by an off-by-default enforcement flag.", probe: "spec-graph trace resource run_dir (after declaring the sink); pyrefly-refs over write_atomic/append_jsonl/update_json_locked/RequestLogger/denial_logger/write_case_pointer/record_outcome/open_budget/update_budget_locked/account_call; lexical sweep of .write_text(/.write_bytes(/.open(a|w/.touch(/mkdir(parents= over runtime, hooks, _io, run.py, run_common, learning, scripts, evals; each hit sited by hand against the mount set and the box-alive window", probe_kind: search, observed: "12/12 C1 rows verified; the driver's per-tool-call accounting path reaches write_atomic(run_dir/'budget.json') when enforcement is on and the locked idiom when it is off (the default), and C1's row 5 names only the locked one — four idioms, not three", verdict: holds, note: "Recorded in the brief as `verdict: extends-C1`, which is outside the ledger's closed vocabulary; normalized to `holds` here — the claim (that the census is incomplete at idiom granularity) is what holds. Its own blind spot: the brief consumed design revision 1, so its table carries neither of C3-fix's two additions as rows. Both are carried as edges in this graph."}
  - {id: G2, kind: census, claim: "write_atomic has five non-test call sites, of which exactly one lands inside a box-writable tree.", probe: "pyrefly-refs on the helper (resolved 4 files against a 6-file grep floor)", probe_kind: search, observed: "budget.json (in the run dir); the accounting-failure file (a SIBLING of the run dir, outside the bind); two learning markers and one queue rewrite (learning state root, outside every box mount)", verdict: holds}
  - {id: G3, kind: behavior, claim: "The model write gate denies a STATICALLY planted symlink — it resolves the operand and matches the resolved path against the write allowlist — so O1's plant-shaped oracle passes at HEAD for C1 rows 13/14.", probe: "RE-PROBED (49-reground-claims): the same executed alias matrix as X17 — this is the brief-side statement of it", probe_kind: executed, observed: "As X17. True as literally worded for the SYMLINK shape; its CONCLUSION — that O1's plant-shaped oracle passes at HEAD for the two gated rows — is false, because the hard-link shape is admitted and writes through.", verdict: refuted, note: "HOLDS -> REFUTED on the conclusion rather than the premise. Brief and extraction reached the same wrong conclusion from the same correct symlink observation, which is why one executed matrix over the whole shape domain overturns both at once."}
  - {id: G4, kind: behavior, claim: "docker exec inherits the container's creation-time seccomp profile, so M2's probe mechanism is enforced under the same filter as the box.", probe: "detached runc container with the six-syscall deny profile, probe script run via `docker exec -i`", probe_kind: executed, observed: "identical denials to the creation-time run — symlink/symlinkat/link/mkfifo/mknod all EPERM inside exec", verdict: holds}
  - {id: G5, kind: behavior, claim: "Under the exact deny set the design names, AF_UNIX bind SUCCEEDS and leaves a socket entry the reap scan refuses — so M2's shapes cannot be derived literally from the scan's predicate.", probe: "same container; socket.bind on the rw bind, then host-side ls of the entry types", probe_kind: executed, observed: "unix_socket_bind SUCCEEDED; host sees srwxr-xr-x; mkfifo is EPERM (glibc routes it through mknod/mknodat)", verdict: holds}
  - {id: G6, kind: behavior, claim: "Without the profile, every alias and special-file shape succeeds from inside the box on the rw bind — including a character device node.", probe: "same probe script with no --security-opt (platform default)", probe_kind: executed, observed: "symlink, symlinkat, hardlink, mkfifo, mknod(char) all SUCCEEDED; mkdir/write/rename also SUCCEEDED", verdict: holds}
  - {id: G7, kind: referential, claim: "The unsandboxed opt-out converts any box-startup fault, including a failed M2 probe, into a degrade to the host transport with no box at all.", probe: "read the loud-host-lane helper and both start_box overloads' BoxFault handlers", probe_kind: read, observed: "the fault is re-raised only when the env var is unset; otherwise a warning is printed and an unboxed executor is returned", verdict: holds}
  - {id: G8, kind: reachability, claim: "This host and the devcontainer are docker-outside-of-Docker, so the repo's live-box guard skips every live box test — yet a real runc box IS drivable here once the bind source is translated the way the box module already translates it.", probe: "evaluate the guard's own two predicates in-process; then drive a detached runc box with a source translated across the one shared mount", probe_kind: executed, observed: "/.dockerenv present and the daemon root invisible -> guard skips; the translated-source box created, exec'd and probed successfully", verdict: unrefuted, note: "With X15 this is fork R9's contradiction: the demand list says two CI jobs register the runtime, the brief says the guard skips every live box test in CI. Both cannot be operative, and a standing probe obligation must settle it before §7."}
  - {id: G9, kind: census, claim: "The platform default seccomp profile is not obtainable from this daemon or the CLI.", probe: "search /etc/docker and /usr/share for a seccomp profile; docker info", probe_kind: search, observed: "no profile file on disk; docker info reports the seccomp SECURITY OPTION but emits no profile", verdict: holds}
  - {id: G10, kind: census, claim: "The per-mount sentinel plants a host-side write into EVERY BoxRequest mount source, including the drain lane's read-only worktree root, under a fresh uuid-suffixed name; the run-dir tier's name is fixed and is deliberately left behind on a fault.", probe: "read the shared sentinel probe and both of its callers", probe_kind: search, observed: "one plant helper, two callers: a fixed '.box-sentinel' that survives a fault by design, and a '.box-sentinel-<uuid4hex>' cleaned up on both paths", verdict: holds}
  - {id: G11, kind: census, claim: "The drain worktree's host-side writers while its box is alive are the per-mount sentinel, the fault-path corpus restore, the stray discard, and the same two gated model writers.", probe: "grep for write/mkdir/unlink idioms in the curator drain; read the drain box geography builder and the curator tick's except path; site each append_jsonl target against the mount set", probe_kind: search, observed: "restore does mkdir(parents,exist_ok)+write_bytes+unlink into a rw corpus mount from an except around the agent call; the stray discard shells out to git checkout — a subprocess write no static walk censuses; queue/graveyard writes land under the state root, outside every mount", verdict: holds}
  - {id: G12, kind: reachability, claim: "A FINISHED run dir is written again by the judge lane and the post-run consumers with no box alive; a planted link reaches them only past a skipped scrub or an unboxed run.", probe: "RE-PROBED (49-reground-claims), EXECUTED as a BREAK ATTEMPT, eight arms driving the real run._run_investigation_lifecycle with the REAL runtime.scrub.scrub: control; planted absolute symlink; planted hard link; planted FIFO; a symlink three directories deep; a symlinked DIRECTORY (which os.walk(followlinks=False) refuses to descend into, so the link itself is the only chance to catch it); and both skipped-scrub cells. Break condition: the post-run consumers become reachable with the planted alias still in the tree", probe_kind: executed, observed: "No break. Every alias shape raised RunTainted naming the offending entry, including the symlinked directory the walk never descends into. Both skipped-scrub arms also failed to reach the consumers, for a second reason the claim does not state: whichever exception won still propagates out of the lifecycle and run.main catches nothing, so no marker is enqueued and no consumer ever sees that run. The route is TIGHTER than claimed", verdict: holds, note: "Fork R4 resolved by the judge in favour of an UNCONDITIONAL backstop: M3's primitive is not conditioned on box liveness, because this is the only route NO7 assigns it and it is the CI-runnable, discriminating half of the suite."}
  - {id: G13, kind: census, claim: "The box's knob set is the runtime enum, the unsandboxed opt-out, the rootfs image, the tmpfs size and a lifecycle field with no reader; the runtime enum's verified member is the ALTERNATIVE, not the shipped default.", probe: "read the box spec dataclass, its env resolver, and both start overloads' resolution points", probe_kind: search, observed: "default runsc, alternative runc, unknown value raises at resolve; resolution happens at two different points depending on the overload", verdict: holds}
  - {id: G14, kind: census, claim: "Two committed box spec graphs already coin most of this change's actor, boundary and axis ids; a synonym would silently disable the binding check.", probe: "parse both graphs' structure blocks for axes, actor ids and boundary ids", probe_kind: search, observed: "33 actor ids, 39 boundary ids, 7 axes across the two graphs; run_dir, sentinel, scrub, stop_and_scrub, drain_box, runtime_box, box_request, corpus, write_file, gather_raw and the three run-dir JSONL boundaries are all already named", verdict: holds, note: "The re-keys this graph applied on that ground are listed in the header block."}
  - {id: G15, kind: census, claim: "mkdir through a component inside a box-writable tree happens at five sites, not the two the design names.", probe: "grep for mkdir(parents= across the runtime, hooks, the shared IO helper and the curator drain, then site each against the mount set", probe_kind: search, observed: "the model-named gather-raw component, the fixed gather-summaries component, both gated model writers' parent create, and the shared JSONL appender's parent create; plus the drain restore's inside the corpus mount", verdict: holds}

  # ---- raised by the dispatched re-ground probe (46-reground-lead-id.md) ----
  - {id: G16, kind: referential, claim: "The claim-time lead_id check and the gather-seam lead_id check are backed by one shared regex definition, not two independently authored ones.", probe: "grep for `l-[A-Za-z0-9]+` across defender/; read hooks/record_lead.py and scripts/gather_tools/record_query.py plus runtime/tools_gather.py to confirm which pattern object each enforcement call site actually binds to; then a boundary probe (`l-1`, `l-`, `L-1`, `l-abc_def`, `l-abc-def`, leading/trailing space, trailing newline) across both copies", probe_kind: read, observed: "Two separate re.compile(r'^l-[A-Za-z0-9]+$') calls with no cross-import — one bound inside claim_lead (the claim-time check) and one imported into the gather seam and matched BEFORE claim_lead is invoked. A third independent copy lives on the read/join side. The boundary probe shows identical accept/reject behaviour across the two enforcement copies today.", verdict: refuted, note: "Minted as G1 by the re-ground leaf; RE-KEYED to G16 here because G1 is already the brief's census claim and a collision would make every citation ambiguous. The two checks agree only because nobody has edited either — anchoring, character class or a stray re.IGNORECASE could diverge with a one-line single-file edit the other file's suite would not catch. This is what the census's no-traversal argument for the model-named gather_raw component rests on."}

  # ---- raised by the dispatched re-ground probes (47-reground-code-facts,
  # ---- 48-reground-ci); ids continue 46's G16 convention so no citation is ambiguous ----
  - {id: G17, kind: behavior, claim: "A refused write, or a refused read, on circuit_breaker.json escalates toward ending the run the same way a refused budget-file write escalates to BudgetKill.", probe: "read the consumer paths, then drive record_outcome/is_tripped/down_message with the real write path replaced by a DIRECTORY (root ignores chmod, so a directory-for-file swap forces a genuine OSError)", probe_kind: executed, observed: "The two halves diverge and neither degrades the way the budget file does. WRITE: the locked update opens r+ with no OSError handling and record_outcome does not catch either; the call site sits OUTSIDE the query tool's control-flow except, the driver catches only four named types, and nothing above wraps it — the OSError crashes the process uncaught, harder than BudgetKill, with no partial-trace branch firing. READ: wrapped in `except (JSONDecodeError, OSError): return _blank()` — is_tripped() returned False and down_message() returned its normal templated string, so an unreadable state reads as a healthy untripped breaker.", verdict: holds, note: "Fork R24 settled without spending a human question slot. Both halves are demand-bearing (breaker_refused_write_does_not_crash_the_run, breaker_refused_read_is_observable) and both ride along with §7 D3 independent of the exemption."}
  - {id: G18, kind: behavior, claim: "git checkout -- <path> writes THROUGH a symlink at that working-tree path, or replaces it as os.replace does (B5).", probe: "executed: init a real git repo, commit a tracked file, replace it with a symlink to a file OUTSIDE the repo, run the same `git checkout -- <path>` invocation the drain lane's stray discard uses, inspect both the working-tree entry and the external target", probe_kind: executed, observed: "tracked.txt is a regular file again containing the committed blob and is no longer a symlink; the outside file is untouched.", verdict: holds, note: "Fork R19 CLOSED. The stray-discard step is not a route for an agent-planted symlink to redirect a write outside the repo — the same answer B5 gave for os.replace. The writer stays in the second-root demand's binds because it is a subprocess write into a box-writable tree that no static walk censuses."}
  - {id: G19, kind: referential, claim: "A non-string path operand to the model's write tool is reachable through the tool's own type contract.", probe: "read the tool registration, _tool_write_file's signature, and how the driver's tool-calling framework turns that signature into validation before the body runs", probe_kind: read, observed: "the tool declares `path: str`; the framework builds a schema validator from the type hints and validates every call's argument dict BEFORE the function body runs, accepting str, coercing bytes, and rejecting int/float/bool/dict/list/None with a validation error.", verdict: unrefuted, note: "Design-silent hedge #8 settled with no demand: a non-string operand is blocked at the framework boundary, before the resolve-and-confine gate ever sees it. The model gets a validation-error retry, not a live non-string operand."}
  - {id: G20, kind: referential, claim: "The live-box guard skips every live-box test in CI, so registering the runtime there is pointless and the 'every box in CI faults' alarm is wrong.", probe: "read the guard's own predicates and the CI workflow end to end, then evaluate the predicates under a faithful reconstruction of CI's environment", probe_kind: read, observed: "The blanket DooD skip is RETIRED — the live guard skips only on no-daemon, DooD-with-no-shared-mount-anchor, or a missing runtime. The `test` job runs pytest directly on the runner, so the DooD predicate is false outright. The `box-dood` job runs pytest inside a container whose checkout bind mount is exactly what satisfies the anchor, so the guard passes there too. Both jobs hard-fail their gVisor install unless the daemon lists runsc, so the missing-runtime branch is unreachable by construction.", verdict: refuted, note: "Fork R9's contradiction resolved: both source frontiers were factually correct about what they read, and the brief described retired behaviour. Real boxes start in BOTH jobs — so the registration is load-bearing, the CI change is CI-BREAKING (not merge-blocking: `main` carries no branch protection, so the `test` job's red is advisory), and the fault message and workflow change must be written assuming live boxes."}
  - {id: G21, kind: primitive, claim: "No runsc binary is available to determine the exact --oci-seccomp registration syntax against the Docker daemon (X19, the artifact's one formal unknown).", probe: "ran real runsc release-20260727.0 against its own flags/install --help surface, then executed `runsc install --config_file=<scratch>/daemon.json -- --oci-seccomp` against a SCRATCH daemon config (never the machine's real one, daemon never restarted)", probe_kind: executed, observed: "`-oci-seccomp` is a bare boolean flag ('Enables loading OCI seccomp filters inside the sandbox'); `install` takes -runtime (the daemon.json entry name, default runsc) and -config_file (default /etc/docker/daemon.json), and passes everything after a literal `--` through as runtimeArgs verbatim. The scratch config gained runtimes.runsc.runtimeArgs = [\"--oci-seccomp\"] beside the path key install always sets.", verdict: refuted, note: "X19 CLOSED. This is the literal text both the box-start fault message and the CI workflow step must carry, so an operator hitting the fault has the exact fix rather than a prompt to configure the runtime from scratch. The R0 unknown on oci_seccomp_registration.access[host_daemon_config] is resolved."}

  # ---- the stale-container probe (50-probe-stale-container.md), phase E round four ----
  # This is the probe the suite carried as its one STANDING REQUEST through three rounds. It
  # was executed against a real docker daemon on the runc lane, not read off the source.
  - {id: P1, kind: behavior, claim: "Box startup detects a RUNNING container under the name it wants and refuses to start, rather than reaping or attaching to it.", probe: "drove the real start_box against a run id whose container was already `Up` under the composed name, runc runtime, real docker daemon (docker-outside-of-docker, translated bind source)", probe_kind: executed, observed: "raised the box fault naming the LIVE container and stating it refuses rather than reaping because that box belongs to another run still writing its artifacts; the pre-existing container was untouched (still running under its original id) after the call returned", verdict: holds, note: "Confirms by execution the outcome §7 H10.5 pinned provisionally for the same-NAME case. It says nothing about a container running under a DIFFERENT name over the same tree, which is the half live_container_from_an_earlier_run still leaves open."}
  - {id: P2, kind: behavior, claim: "A same-named container that is NOT running is force-removed and replaced with no check that it belonged to the same run.", probe: "stopped (not removed) the container from P1, then called start_box again with the same run id and run dir", probe_kind: executed, observed: "the second start_box call SUCCEEDED — a new container was created under the identical name with a different container id; the reap is an unconditional `docker rm -f` once .State.Status is anything but running", verdict: holds, note: "The undefined-behaviour finding, and the basis for stopped_container_reap_has_no_identity_check. The live-refuse path and the blind-reap path are the SAME code block with opposite outcomes, separated only by .State.Status."}
  - {id: P3, kind: behavior, claim: "A container can survive a killed run or a swallowed teardown fault and remain alive for a later run to encounter.", probe: "started a box through the real start_box and let the launching process exit normally with no stop call — detached, no --rm", probe_kind: executed, observed: "the container remained `Up`, owned independently by the daemon, after the creating process had already exited; nothing ties container lifetime to the process that issued the create", verdict: holds, note: "The precondition BOTH other findings depend on, and the executed confirmation of the C42 premise 30-premises-concurrency.md #10 raised as unestablished. Nothing in box start bounds it; only the teardown's own best-effort path does, and X4 says that path is skipped on exactly the crash lane."}
  - {id: P4, kind: reachability, claim: "A stale container still alive over a deleted run dir can reach a later run's tree created at that same path.", probe: "tried to break it — with the stale container from P1 still alive and originally bind-mounted onto the run dir, deleted that host directory and created a fresh one at the identical path (the only reachable route to this state, since the run-dir mint refuses to write into a directory that still exists), then read, listed and wrote from inside the stale container against its own mounted path", probe_kind: executed, observed: "an exec against the container's own configured workdir failed outright ('current working directory is outside of container mount namespace root -- possible container breakout detected'); from another cwd, listing the mount showed an EMPTY directory, reading the new run's alert returned 'No such file or directory', and a write returned 'Directory nonexistent' — the stale bind mount stayed pinned to the deleted directory and did not follow the recreated one at the same path", verdict: unrefuted, note: "SAFE AS OBSERVED, BUT BY ACCIDENT, and that is the finding. It is reachable only past the run-dir mint's refuse-on-exists check (an application check whose purpose is unrelated) and it fails only because Linux bind mounts pin the object resolved rather than the path string. Neither fact is asserted or tested anywhere in this codebase, and both are load-bearing for the reap scan's own 'no live writer in the tree' justification. The same shape as R6 one hazard over — a reachability claim whose break-attempt failed — and pinned the same way, by live_run_dir_never_reused_and_stale_mount_never_follows."}

# ============================================================================
# GATE — the gate leaf's own block (phase D step 6), computed over
# `spec-graph gate spec_graph_771.yaml --residue` (25 raw firings) plus three
# judgment halves (R0 reconciliation, R5 tightening extension, R6 trust walk)
# and the design-silent hedges/standing probes named above `structure:`.
# Full witness prose and typed routing live in 60-residue.md; this block is
# the mechanical record `spec-graph gate` (bare) checks against the slots.
# `resolution: null` marks a hole still open for §7 (or a dispatched re-ground
# probe first — see 60-residue.md's route column). `spec-graph gate` (bare)
# still reports these as findings by design: every one is a residue entry
# routed on purpose, not a silent gap.
# ============================================================================
gate:
  evaluated:
    - {rule: R0, fired: true}
    - {rule: R1, fired: true}
    - {rule: R2, fired: true}
    - {rule: R3, fired: true}
    - {rule: R4, fired: true}
    - {rule: R5, fired: true}
    - {rule: R6, fired: true}

  obligations:
    - {rule: R2, element: tool_trace_jsonl.identity,
       witness: "write_trace's own write_text (observe.py:319) and driver.py's except-path
         write_text('') (driver.py:660) target the same fixed tool_trace.jsonl name; the
         except only runs when the try's write_trace call itself raised, so the two are
         mutually exclusive by construction, but no demand exercises the fault path or
         asserts the resulting file is present and parseable (even if empty) rather than a
         torn write.",
       discharged_by: tool_trace_write_is_torn_write_safe}
    - {rule: R2, element: drain_worktree.identity,
       witness: "alias_backstop_covers_the_second_shared_root already drives all four
         drain-lane writers into one parity assertion, but its binds cite only the four
         interacts edges, never drain_worktree.identity itself — check_binds sees this
         facet as unaddressed even though the substance is covered.",
       discharged_by: alias_backstop_covers_the_second_shared_root}
    - {rule: R3, element: "run_dir.access[host-write]",
       witness: "The fourteen-writer O1 suite (no_write_through_planted_leaf,
         writer_lands_artifact_unlinked, and siblings) discharges host-write's
         alias-refusing-primitive constraint in substance, but no demand's binds name
         run_dir.access[host-write] itself.",
       discharged_by: no_write_through_planted_leaf}
    - {rule: R3, element: "run_dir.access[box-write]",
       witness: "The alias-profile demand set (profile_denies_exactly_six,
         partial_enforcement_faults_the_box, ban_in_force_for_the_whole_box_life) discharges
         box-write's confine+alias-ban constraints in substance, but none binds
         run_dir.access[box-write].",
       discharged_by: partial_enforcement_faults_the_box}
    - {rule: R3, element: "drain_worktree.access[host-write]",
       witness: "Same gap as run_dir.access[host-write], one shared root over:
         alias_backstop_covers_the_second_shared_root covers the writers by edge, not by
         this access cell.",
       discharged_by: alias_backstop_covers_the_second_shared_root}
    - {rule: R3, element: "drain_worktree.access[box-write]",
       witness: "The alias ban is boundary-agnostic (a syscall filter, not a path policy),
         so the same alias-profile demand set applies here too, but no demand's binds name
         drain_worktree.access[box-write].",
       discharged_by: partial_enforcement_faults_the_box}

  holes:
    - {rule: R2, element: budget_json.identity, cites: [B4, B6],
       resolved_to: staged_name_is_unpredictable, resolution: "§7 D1 — every replacing write
        stages under an unpredictable name, so a leftover cannot collide with a later write
        and an occupied staged name is always hostile. Retires forks R3, R7, R11's collision
        half, the duplicate-seq premise and the model-basename premise together. Discharged by
        staged_name_is_unpredictable + write_atomic_temp_not_followed."}
    - {rule: R2, element: sentinel.identity, cites: [G10],
       resolved_to: sentinel_retry_replaces_the_leftover, resolution: "fork R11's non-collision half, under
        §7 D1: the retry's own plant renames over the fixed leftover, so the operator sees the
        ban fault rather than a collision. Discharged by sentinel_retry_replaces_the_leftover."}
    - {rule: R2, element: circuit_breaker_json.identity, cites: [G17],
       resolved_to: breaker_refused_write_does_not_crash_the_run, resolution: "fork R24 settled by the
        dispatched probe (G17, executed): the write half is an uncaught OSError that crashes
        the run harder than BudgetKill, the read half is swallowed and reports a healthy
        untripped breaker. Both are demands now."}
    - {rule: R3, element: "run_dir.access[host-read]", cites: [X4],
       resolved_to: skipped_scan_leaves_a_did_not_run_marker, resolution: "§7 D2 — a skipped scan writes a did-not-run verdict into the tree, on BOTH
        teardown-fault arms, and a tree carrying no verdict reads as unverified. Discharged by
        skipped_scan_leaves_a_did_not_run_marker + unmarked_tree_is_treated_as_unverified."}
    - {rule: R0, element: "oci_seccomp_registration.access[host_daemon_config]", cites: [G21],
       resolved_to: oci_seccomp_registration_ships_with_the_ban,
       resolution: "CLOSED by an executed probe against real runsc: `runsc install --
        --oci-seccomp` writes runtimeArgs: [\"--oci-seccomp\"]. The artifact's last formal
        unknown."}
    - {rule: R3, element: "oci_seccomp_registration.access[host_daemon_config]", cites: [G21],
       resolved_to: oci_seccomp_registration_ships_with_the_ban,
       resolution: "same close — one open question, two rule tags. The per-cell parity
        assertion follows directly and is carried by
        oci_seccomp_registration_ships_with_the_ban."}
    - {rule: R0, element: "design-silent hedge #1 — probe ordering against pre-first-turn setup writers (sentinel, budget, session pointer)",
       cites: [X5], resolved_to: setup_writer_order_is_not_load_bearing,
       resolution: "§7 H10.1, PINNED PROVISIONALLY: the order is not load-bearing because each
        writer is individually guarded. Discharged by setup_writer_order_is_not_load_bearing."}
    - {rule: R0, element: "design-silent hedge #2 — the tree of a box that never started, consumed downstream",
       cites: [X4], resolved_to: faulted_create_marks_its_tree,
       resolution: "§7 H10.2, PINNED PROVISIONALLY: treated as unscanned, so it falls under
        D2's marker rather than a rule of its own. Discharged by faulted_create_marks_its_tree
        + unmarked_tree_is_treated_as_unverified."}
    - {rule: R0, element: "design-silent hedge #3 — a partial scrub-walk failure",
       cites: [G12], resolved_to: partial_scan_failure_fails_closed,
       resolution: "§7 H10.3, PINNED PROVISIONALLY: fail closed over the whole tree.
        Discharged by partial_scan_failure_fails_closed."}
    - {rule: R0, element: "design-silent hedge #4 — the scrub reclassifying an entry that changes between listing and inspection",
       cites: [G12], resolved_to: entry_shape_change_mid_scan_refused,
       resolution: "§7 H10.4, PINNED PROVISIONALLY: the scan judges what it inspected and
        refuses on any change. Discharged by entry_shape_change_mid_scan_refused."}
    - {rule: R0, element: "design-silent hedge #5 — a container from an earlier run still alive when a later run dir is created",
       cites: [R3, P1, P4], resolved_to: live_container_from_an_earlier_run,
       resolution: "§7 H10.5, PINNED PROVISIONALLY as a REFUSAL — but recorded as a
        `form: clause`, not a test: no ledger claim covers how such a container would be
        discovered, and a guard and its test built from the same wrong prior are green
        together. THE REQUESTED PROBE HAS SINCE EXECUTED (P1-P4): the pinned refusal is
        confirmed as today's behaviour for a same-NAME container, the cross-name discovery
        gap stays open, and the exposure it leaves is bounded by two premises now pinned
        executably by live_run_dir_never_reused_and_stale_mount_never_follows. The blind reap
        of a STOPPED same-name container that the same probe turned up is recorded as its own
        explicit no, stopped_container_reap_has_no_identity_check."}
    - {rule: R0, element: "design-silent hedge #6 — the alias probe re-run after a transient box-start retry",
       cites: [G10], resolved_to: alias_probe_is_rerun_in_full_and_cleans_both_arms,
       resolution: "§7 H10.6, PINNED PROVISIONALLY: re-run in full on every start attempt,
        leavings cleaned on both arms. Discharged by
        alias_probe_is_rerun_in_full_and_cleans_both_arms."}
    - {rule: R0, element: "design-silent hedge #8 — a write_file operand outside the ordinary string domain",
       cites: [G19],
       resolution: "CLOSED by reading the type contract: the framework's schema validator
        rejects a non-string operand before the tool body runs, so the shape is unreachable.
        No demand."}
    - {rule: R0, element: "standing probe — whether any CI job actually starts a live box, or the guard skips them all (fork R9 contradiction against X15/G8)",
       cites: [G20],
       resolution: "CLOSED: the blanket skip is retired posture. Real boxes start in BOTH CI
        jobs, so the registration is load-bearing and the CI change is CI-breaking — advisory rather than merge-blocking, since `main` has no branch protection."}
    - {rule: R0, element: "standing probe — whether `git checkout` writes through a symlink or replaces it (fork R19)",
       cites: [G18],
       resolution: "CLOSED, executed: it REPLACES the link with the committed blob and leaves
        the outside file untouched — the same answer B5 gave for os.replace."}
    - {rule: R5, element: "ban_failure_not_opt_out_able's exception identity (fork R23) and near-miss strictness on unboxed_opt_out's near-miss values (fork R22)",
       cites: [X3, G7], resolved_to: ban_fault_has_its_own_exception_type,
       resolution: "§7 D5 (ORCHESTRATOR'S CALL, FLAGGED FOR OVERRIDE): the ban fault gets its
        own exception type, so the existing catch-BoxFault-and-degrade handler cannot
        re-swallow it. R22 closed as FACT rather than policy — the opt-out is an exact `1`
        match and every near-miss already fails closed; what was missing is a demand pinning
        it. Discharged by ban_fault_has_its_own_exception_type + unboxed_opt_out_exact_match."}
    - {rule: R6, element: "interacts(gather_dispatch->run_dir) content — the gather-summary writer's _wrap(...) markdown, model-chosen free text with real newlines preserved (B11)",
       cites: [B11], resolved_to: gather_summary_render_frame,
       resolution: "§7 D4 — OUT OF SCOPE for #771 and recorded as a waiver, not a silence:
        M1-M4 touch the write path and the hazard is on the render path. Carried as
        `Demand {id: gather_summary_render_frame, form: waiver}`."}

