  # ---- the startup positive control (M2, O2/O3) ----------------------------
  - {id: probe_banned_shapes_fail, kind: behavior, form: test,
     discharged_by: test_startup_probe_refuses_each_banned_shape,
     binds: ["interacts(_probe_alias_ban->run_dir)"]}

  - {id: probe_ordinary_create_succeeds, kind: behavior, form: test,
     discharged_by: test_startup_probe_ordinary_create_succeeds_in_the_same_exec,
     binds: ["interacts(_probe_alias_ban->run_dir)"]}
     # O2's own oracle-can-be-wrong answer: without this control a probe that never ran
     # reads identically to a probe that was refused. Firm consensus #2 applies it to the
     # exec itself — a `docker exec` that never ran produces neither required signal and
     # must read as a startup fault, not a pass. Fork R20: treat an interrupted or
     # truncated shape sequence as failed.

  - {id: probe_set_matches_ban, kind: shape, form: test,
     discharged_by: test_startup_probe_set_is_the_banned_set_not_the_scrub_set,
     binds: ["interacts(_probe_alias_ban->run_dir).payload", "scrub",
             "interacts(scrub->run_dir)"]}
     # C5-fix/F3/X2/G5: the probe set is the BAN's set. A set derived from the reap scan's
     # refusal predicate would demand that AF_UNIX bind fail — and under the exact deny set
     # it SUCCEEDS (executed, twice, independently) — so a literal derivation would fault
     # every box at startup. NO4 stands: the socket shape is covered by the reap scan alone.
     # Fork R13: X2's second-order note (a box with code execution can park a socket and
     # make the reap scan fail the whole run) is an availability gap O2 does not cover; the
     # judge recommends recording it as an explicit non-obligation with its reason.
     # ROUND FOUR, AND THIS WAS THE RUN'S MOST SERIOUS DEFECT. The attempted set was read off
     # the argv by SUBSTRING, and two of the six names contain the other four between them
     # (`symlinkat` ⊃ symlink/linkat/link, `mknodat` ⊃ mknod) — so a probe that attempted TWO
     # shapes read as all six, in the one demand carrying O2's per-member requirement. A
     # partially enforced ban reported success, which undoes the design's central claim that
     # enforcement is OBSERVED rather than configured. The reader now matches whole tokens
     # (`shapes_named_in`), the comparison is an exact set equality, and the test carries a
     # CONTROL that drives the reader over a deliberately narrowed argv and requires it to
     # report the narrowing — without that, the equality is an assertion nobody has shown
     # capable of failing. The probe therefore owes the argv one thing, and it is contract:
     # each attempted shape appears as its own bare token.

  - {id: probe_runs_at_every_box_start, kind: behavior, form: test,
     discharged_by: test_the_alias_probe_runs_once_per_box_start,
     binds: ["interacts(_probe_alias_ban->run_dir)", "start_box",
             "drives(start_box->_probe_alias_ban)"]}
     # C1-fix: M2 never trusts the flag, it observes the ban's effect at EVERY box start.
     # X8: the neighbouring precedent probes once per MOUNT, which is the wrong cardinality
     # here. Firm consensus #6: nothing is cached across boxes, so host registration state
     # changing between probes is re-observed.

  - {id: probe_on_every_box_lane, kind: parity, form: test, provisional: true,
     discharged_by: test_the_alias_probe_runs_on_every_box_lane,
     binds: ["drives(run_lifecycle->start_box)", "drives(run_worktree_batch->start_box)",
             "drives(run_cycle->start_box)", "interacts(_probe_alias_ban->run_dir)",
             "interacts(_probe_alias_ban->box_tmpfs)"]}
     # provisional under fork F6/R5 — X16 refuted "every lane has a writable shared tree":
     # the learning run-cycle box's mounts are ALL writable=False and its only writable
     # path is the box /tmp tmpfs. Pinned provisionally to probing in the tmpfs on any
     # lane without a writable mount (the ban is a syscall filter, not a path policy), and
     # the edge to box_tmpfs is bound so that pin is visible in the structure rather than
     # implicit. This CONTRADICTS the design's literal "in the shared tree" wording, which
     # is why it is the human's to pin and not extraction's.
     # Firm consensus #7: no cross-lane trust — an earlier lane's pass carries no
     # exemption. Its tail (what the process-level aggregate response is when one lane of
     # several faults) is design-silent and routes as a hole, not a fork.

  - {id: probe_failure_faults_box_start, kind: behavior, form: test,
     discharged_by: test_box_start_faults_when_the_ban_is_not_in_force,
     binds: ["start_box", "interacts(start_box->box_argv)"]}

  - {id: ban_failure_not_opt_out_able, kind: behavior, form: test,
     discharged_by: test_ban_not_in_force_is_not_opt_out_able,
     binds: ["unboxed_opt_out", "unboxed_opt_out.domain.distinguished[1]", "start_box",
             "interacts(start_box->unboxed_opt_out)"]}
     # F4 resolved: this fault carves an explicit exception out of the opt-out. Accepted
     # cost — an unconfigured host refuses to run until the configuration lands. G7/X3:
     # today ANY box-startup fault degrades to an unboxed host run when the var is "1".
     # rejected -> degrading to runc (trades isolation strength for one control, silently)
     # and letting the box run while recording enforcement state (a control that reports
     # its own absence into a log nobody reads) were both examined and refused.
     # Fork R23: the judge recommends giving the ban fault its OWN exception type rather
     # than distinguishing it by message or by an attribute on the shared BoxFault, and
     # keeping every other startup fault opt-out-able. Fork R22: no strictness rule exists
     # for near-miss values of this knob, and F4 makes that matter more than it did.

  - {id: ban_fault_message_names_the_configuration, kind: behavior, form: test,
     discharged_by: test_ban_fault_message_names_the_runtime_configuration_to_apply,
     binds: ["start_box", "oci_seccomp_registration", "BoxSpec.domain"]}
