# ============================================================================
# ACTOR WAIVERS — §7 D4's second waiver, in the form its own checker reads.
#
# The execution-context census (`spec-graph actors`) runs at write-code-from-spec
# §3, once real code exists, and it reads THIS list — not the `form: waiver`
# demand that also records the decision. Recorded only as a demand, the human's
# examined no would not have silenced the check it was written for: the same
# question would reach a human again after implementation, stripped of its
# reasoning. Both entries are file stems, the key `check_actors` matches on.
#
# The reason is the one that survives: neither script STARTS A BOX, so neither is
# inside this change's threat model. NOT "the mechanisms do not reach them" — the
# fix is at the primitive, so every caller gets it, including callers outside every
# box (3/3 consensus this run). The rationale cites G2; the three waiver maps cannot
# carry `cites:` without a shape change, so that citation is a hand check.
# ============================================================================
exercise_waivers:
  # ============================================================================
  # EXERCISE WAIVERS — the drain lane's two BOUND-BUT-UNDRIVEN writers, with the
  # reasons somewhere a checker reads.
  #
  # Round two asked for these and no seam routed them, so for two rounds the
  # reasoning existed only in test docstrings — which is the same place D4's
  # actor waiver sat before the map below was added, and it failed for the same
  # reason: the check reads the map, not the prose.
  #
  # The lane's DANGEROUS writer is driven. `alias_backstop_covers_the_second_shared
  # _root` drives the fault-path corpus restore at a planted leaf and at a planted
  # directory component, and it redirects at HEAD. These two are the remainder.
  #
  #  * stray_discard — `git checkout -- <rel>` into the worktree. G18 EXECUTED the
  #    question: it REPLACES a planted symlink with the committed blob and leaves
  #    the outside file untouched, the same answer B5 gave for os.replace. So it is
  #    not a redirect route. It stays BOUND because it is a subprocess write into a
  #    box-writable tree that no static walk censuses — dropping the bind would lose
  #    the only record that this writer exists.
  #  * plant_sentinel — the per-mount sentinel plant into the drain worktree. G10:
  #    ONE shared plant helper with two callers, and the run-dir caller IS driven,
  #    as the `start_box` census row, at the altitude where its failure becomes a
  #    startup fault. Driving the second caller exercises the same helper against a
  #    second path; what is not driven is the drain lane's own call site.
  #
  # cites: G18 (executed) for the first, G10 (census) for the second. The waiver
  # maps cannot carry `cites:` without a shape change, so this is the hand check
  # rules.md leaves to phase F.
  # ============================================================================
  alias_backstop_covers_the_second_shared_root: [stray_discard, plant_sentinel]

actor_waivers:
  - harness_lead        # defender/evals/harness_lead.py — re-execs a subprocess that
                        # relocates the tree anchor onto wherever it runs; no box.
  - generate_case       # defender/evals/oracle_golden/generate_case.py — same shape, and it
                        # re-execs the runtime itself, which is why a static walk sees it as
