# ============================================================================
# NOTE ON STATE: this file is the demands + structure + ledger half, written by
# phase D's assembler (step 5). The `gate:` block is the gate leaf's (step 6);
# `handoff.forks` is §7's. Do not consume as final until `gate.evaluated` is
# populated for R0-R6.
#
# NAME RECONCILIATION (phases/graph-gate.md — "reconcile names before the join").
# Three passes coined ids independently (10-brief.md grounding, 21-demands.md
# extraction, 45-dispositions.md). Where a committed box graph already names the
# same element, THAT id wins — the graph joins to the code by name and a synonym
# silently disables check_binds for the concept. Re-keys applied here:
#   21-demands `DEFENDER_ALLOW_UNSANDBOXED` -> `unboxed_opt_out`   (spec_graph_665)
#   21-demands `DEFENDER_BOX_RUNTIME`       -> `BoxSpec.domain`     (spec_graph_540)
#   21-demands `drain_batch`                -> `run_worktree_batch` (spec_graph_665)
#   21-demands `drives(run_investigation->start_box)`
#                                           -> `drives(run_lifecycle->start_box)`
#                                              (spec_graph_540: run.py's lifecycle
#                                              helper is what drives box start, not
#                                              the driver)
#   21-demands `DEFENDER_BUDGET_ENFORCE.domain.distinguished[1]`
#                                           -> `...distinguished[true]`
#                                              (spec_graph_631 owns this domain's
#                                              member spelling: unset|false|true|
#                                              unrecognized)
#   10-brief `observe_write_trace`          -> `write_trace` (the code symbol, and
#                                              spec_graph_691/705's id)
# ADOPTED VERBATIM from 21-demands (the implementer must use these names):
#   alias_profile, _probe_alias_ban, write_guarded, lint_unguarded_tree_write,
#   oci_seccomp_registration.
# `run_cycle` is kept from 21-demands rather than spec_graph_665's `run_one`:
# `run_cycle` is the module the request builder lives in, and the boundary id
# `run_cycle_box` already keys off it.
# ============================================================================

# ============================================================================
# DEMANDS — the spec proper. A `form: test` demand is a POINTER; its
# observable-outcome sentence is authored into the named test's docstring at
# phase E (check_binds scans that docstring). `clause` carries its own outcome.
#
# 81 demands. 31 carried from 21-demands.md (all of them; none dropped), 9
# minted by phase D's assembler (7 firm-consensus assertions, 1 dispatched
# re-ground probe, 1 seam M3 implies), 1 by the gate leaf, 30 minted at phase E
# (24 form: test, 4 explicit non-obligations, the human's 2 waivers), 1 at the
# phase-E RE-RUN after phase F (census_exhibits_every_measured_posture, the
# anti-collapse control the widened posture demand needs to stay discriminating),
# and 5 at the SECOND re-run after verification round two: three carrying §7 D8
# (verdict_is_sited_outside_the_judged_tree, in_tree_verdict_is_never_authoritative,
# quarantine_carries_the_verdict_out_of_band), one re-anchoring F1 to the ledger's
# own measurements (measured_postures_anchored_to_the_ledger), and one from the
# sweep §7 asked for rather than from a named finding
# (alias_profile_is_outside_every_box_writable_mount — D7 and D8 are two instances
# of "a control whose own dependency sits inside the boundary it polices", and the
# ban's CONFIGURATION is the third place that question had never been asked).
# Two of the human's decisions from the SECOND seam are encoded as amendments
# rather than new demands — §7 D6 rewrites artifact_destruction_is_a_non_obligation's
# clause to state what the condition probe found, and §7 D7 moves the alias-refusal
# record out of the shared tree into the sidecar the demand already bound.
# The last 2 are round four's, both from the one executed probe that closed this
# suite's standing probe request (50-probe-stale-container.md, ledger P1-P4):
# live_run_dir_never_reused_and_stale_mount_never_follows pins the two accidents the
# "no live writer in the tree" justification rests on, and
# stopped_container_reap_has_no_identity_check records the second finding as an
# explicit no rather than inventing the identity mechanism it would need.
# The final 2 are the FOURTH SEAM's two human decisions, and both convert something
# that was carried by prose into something that turns red:
# unmarked_tree_is_never_enqueued_for_learning (§7 D9 — D2's consumer half must be
# ADOPTED, so a real consumer is driven over an unmarked tree and must refuse) and
# destruction_is_not_observed_by_the_verdict (§7 D10 — the audit non-obligation as a
# passing tripwire, so a change that starts observing destruction has to reopen the
# clause deliberately instead of the clause drifting out of review).
#
# ROUND FOUR RAN THE DOCSTRING SWEEP AS A RULE, not as a search for the three
# reported instances — the fourth consecutive round in which the shape recurred
# after being swept is evidence about the method, not about the three tests. Every
# outcome sentence in the suite was extracted and filtered for counted nouns
# ("four", "both", "all", "each", "every", a numeral), then read against its body.
# NINE overclaims: the four the reconciler named, and five more the sweep found.
# Eight closed by widening the body, one by narrowing the prose (the
# interrupted-probe demand, whose missing arm would have needed a fake inventing a
# wire format no claim covers). Three of the nine were not cosmetic — a live-box
# confirmation claimed three operations and drove one, the seam demand claimed
# three distinguishable modes and exercised two, and the probe-refusal demand
# claimed "each banned shape" while its body could not observe which were tried.
#
# Every minted demand carries a `# minted:` note naming its source — `§7 Dn` for
# the human's four decisions and the orchestrator's one, a fork id where the
# judge's recommendation stood, a claim id where a re-ground probe settled it —
# so the cold reconciler can tell the human's decisions from extraction's,
# the assembler's and the author's.
# ============================================================================
demands:

  # ---- the write backstop (M3/M4, O1) --------------------------------------
  - {id: refused_write_outcome, kind: behavior, form: test,
     discharged_by: test_refused_write_raises_oserror_and_leaves_the_outside_target_intact,
     binds: ["interacts(write_guarded->run_dir)", "interacts(write_guarded->run_dir).response"]}
     # F1: the primitive raises OSError (EEXIST from the exclusive-create idiom,
     # ELOOP from O_NOFOLLOW — B6/B7) and writes nothing through the alias.

  - {id: refused_write_leaves_the_planted_entry, kind: behavior, form: test,
     discharged_by: test_a_refused_write_leaves_the_planted_alias_in_place,
     binds: ["interacts(write_guarded->run_dir)", "interacts(scrub->run_dir)"]}
     # rejected -> removing the planted entry (sanitizing) was considered and refused:
     # M10's doctrine is fail loudly, and a deleted entry is one the reap scan can
     # never report. NOTE (fork R12, 45-dispositions): X4 refutes "the scan always
     # runs" — a teardown fault raised while an exception is in flight is swallowed
     # and the walk never happens, which is the crash path. The reporter this demand
     # leans on is not guaranteed; the judge recommends minting a scrub-did-not-run
     # marker demand at §7.

  - {id: call_site_postures_preserved, kind: parity, form: test,
     discharged_by: test_each_writer_keeps_its_exception_posture_when_the_write_is_refused,
     binds: ["interacts(gather_dispatch->run_dir)", "interacts(query_tool->run_dir)",
             "interacts(claim_lead->run_dir)", "interacts(budget_enforcer->run_dir)",
             "interacts(write_trace->run_dir)", "interacts(run_investigation->run_dir)",
             "interacts(observe_logger->run_dir)", "interacts(denial_logger->run_dir)",
             "interacts(write_case_pointer->run_dir)", "interacts(circuit_breaker->run_dir)",
             "interacts(record_lesson_load->run_dir)", "interacts(write_atomic->run_dir)",
             "interacts(start_box->run_dir)",
             "interacts(write_guarded->run_dir)", "interacts(write_guarded->run_dir).response"]}
     # WIDENED TO THE WHOLE CENSUS (phase-F F3). The demand F1 resolves is "every call site
     # keeps the posture it has today", and it was authored with one arm per MEASURED posture
     # label — which certified the four rows someone had thought to label and left the rest
     # exercised by no arm at all, including the writer the demand's own comment named as its
     # exemplar. It is now one arm per census row.
     # HOW IT COVERS ROWS X5 NEVER MEASURED, without inventing their posture: each row is driven
     # TWICE in the test — once against an ordinary write failure (a real directory squatting
     # the artifact name) and once against a planted alias — and the demand is that the two
     # agree. Today's posture is measured on every run rather than recorded in a table that
     # drifts the moment a handler moves.
     # Its anti-collapse control is census_exhibits_every_measured_posture: a per-row
     # self-comparison is satisfied vacuously by an implementation that unified every site, so
     # the control asserts the four distinguishable classes X5 measured still exist.
     # ITS ANCHOR IS measured_postures_anchored_to_the_ledger (phase-F round-two G2). Measuring
     # "today" DURING the run bought coverage by giving up the anchor: both arms drive the same
     # code, so a site whose reaction changes in both lanes agrees with itself and passes. This
     # demand is therefore internal consistency plus a class floor; preservation against HEAD is
     # pinned by the anchor demand, which drives X5's own four sites under X5's own faults.
     # F5/R2 RESOLVED at §7 D3, and the resolution AMENDS this demand: postures are
     # preserved EXCEPT that an alias refusal is exempt from every failure circuit
     # (alias_refusal_exempt_from_every_failure_circuit). The provisional flag is dropped.
     # rejected -> raising the refusal to a run-failure
     # at the audit writers was refused: it hands the box a reliable denial-of-service
     # lever.
     # WIDENED HERE (45-dispositions R8, promoted-on-altitude): X5 found FOUR postures,
     # not one — catch bare Exception and continue (write_trace); catch OSError and
     # return None; catch OSError and return 0; convert OSError into a BoxFault that
     # aborts startup (start_box's sentinel). The binds now name one edge per posture
     # class so a single-posture test cannot pass for all four. X14: the budget site's
     # posture escalates to BudgetKill at five consecutive failures, so one of the four
     # is fatal rather than silent — X14 re-probed EXECUTED and the magnitude is worse
     # (two refused writes past a 300s window, not five consecutive), which is exactly why
     # D3 exempts alias refusals rather than preserving that posture unamended.

  - {id: census_exhibits_every_measured_posture, kind: parity, form: test,
     discharged_by: test_the_census_still_exhibits_all_four_measured_posture_classes,
     binds: ["interacts(write_trace->run_dir)", "interacts(query_tool->run_dir)",
             "interacts(claim_lead->run_dir)", "interacts(start_box->run_dir)",
             "interacts(gather_dispatch->run_dir)"]}
     # minted: phase E (re-run), as the ANTI-COLLAPSE CONTROL for call_site_postures_preserved.
     # That demand now compares each row against its own measurement, which an implementation
     # that made every site behave identically satisfies everywhere. This one drives the whole
     # census under an ordinary write failure and asserts the four distinguishable classes X5
     # measured are all still there — including one that is fatal rather than silent, which is
     # the half a single-posture rewrite erases first. F1 preserved four postures rather than
     # unifying them; without this, nothing fails when that choice is undone.

  - {id: measured_postures_anchored_to_the_ledger, kind: parity, form: test,
     discharged_by: test_the_four_call_site_postures_the_ledger_measured_are_unchanged,
     binds: ["interacts(run_investigation->run_dir)", "interacts(query_tool->gather_raw)",
             "interacts(claim_lead->gather_raw)", "interacts(start_box->sentinel)"]}
     # minted: phase E (round-two re-run), from §7's routed defect on G2. F1's content is
     # "every call site keeps the posture it has TODAY", and after the round-one widening
     # "today" was measured at TEST-RUN TIME — which is vacuous for any site that moves in both
     # lanes, and left the four postures the ledger measured carried in the census as data and
     # asserted by nothing. This demand is the anchor: X5's four sites, X5's four faults, and
     # the four observables X5's `observed:` field records.
     # THE SITES ARE X5'S, NOT THE CENSUS'S, and re-deriving them found a misattribution: X5's
     # swallow-continue site is driver._account_executed_call, one frame ABOVE the trace writer
     # the census had labelled with it (observe.write_trace RAISES at its own altitude). The
     # census row's `posture` is now `unmeasured` and the measurement lives here.
     # THE FAULTS ARE X5'S TOO: under X5's fault (a plain file squatting the parent component)
     # claim_lead returns 0; under the census row's fault (a directory squatting the artifact
     # name) the exclusive create sees EEXIST and the site answers 2 — a write failure reported
     # as a duplicate lead id. Both are today's behaviour and only the first is the measurement.
     # GREEN AT HEAD BY DESIGN: this is a preservation demand over existing behaviour, so it
     # passes now and fails when an implementation changes one of the four.

  - {id: no_write_through_planted_leaf, kind: negative, form: test,
     discharged_by: test_no_writer_follows_a_link_planted_at_its_artifact_name,
     binds: ["interacts(write_trace->run_dir)", "interacts(run_investigation->run_dir)",
             "interacts(observe_logger->run_dir)", "interacts(denial_logger->run_dir)",
             "interacts(write_case_pointer->run_dir)", "interacts(budget_enforcer->run_dir)",
             "interacts(circuit_breaker->run_dir)", "interacts(query_tool->run_dir)",
             "interacts(record_lesson_load->run_dir)", "interacts(gather_dispatch->run_dir)",
             "interacts(claim_lead->run_dir)", "interacts(start_box->run_dir)",
             "interacts(write_atomic->run_dir)", "interacts(write_guarded->run_dir)",
             "run_dir.access[host-write]"]}
     # CENSUS-KEYED, and this is the widening 21-demands.md demanded of phase D: the
     # binds are now one edge per host-side writer of the re-derived table (10-brief
     # "Shared root 1"), 14 writer edges across 5 idioms — truncating write_text,
     # append-mode open, locked touch+r+ +truncate, append_jsonl (mkdir parents +
     # append), and write_atomic's tmp-then-replace.
     # TWO CENSUS ADDITIONS the brief's own table does not carry as rows, both from
     # v2's C3-fix: `write_atomic(run_dir/"budget.json")` (a second idiom on an
     # artifact C1 listed under one, selected by DEFENDER_BUDGET_ENFORCE) and
     # `claim_lead -> gather_raw/<lead_id>.lead.json` (a host-side hook writer). Both
     # are structurally invisible to a grep over write idioms — the instrument that
     # produced C1.
     # TWO MORE RESTORED AT PHASE F (F2), and the first is the sharpest hole this suite had:
     # the DRIVER'S FAULT-EXIT TRACE WRITE — driver.py's write_text("") onto the same fixed
     # tool_trace.jsonl name — is the second of the two sites the ORIGINAL ISSUE reported, and
     # it was bound here as an edge while being absent from the test census, from the lint's
     # hard-gate list and from the writer list this branch adds to the project profile. Three
     # instruments, one hole, each re-derived by hand from something that only sees the
     # happy-path writer. It is driven now, and it redirects at HEAD: an alias at the trace name
     # leaves the outside file truncated to zero bytes.
     # The second is the QUERY TOOL'S QUERIES TABLE — one bound edge covering a writer with two
     # artifacts, of which only the by-ref payload was ever driven. An aliased append lands the
     # row outside the tree verbatim.
     # The lint's hard-gate module set is now DERIVED from the census rather than typed beside
     # it (lint_hard_gates_the_census_rows), which is what stops the next added row from being
     # silently absent from the gate.
     # EXCLUDED ONLY ON THE SYMLINK AXIS: interacts(tool_write_file->run_dir) and its
     # drain-lane twin stay out of THIS demand because the gate does deny a planted
     # SYMLINK. X17/G3 are REFUTED on the hard-link axis (executed): Path.resolve() does
     # not dereference a hard link, so the resolved path is the allowlisted name itself
     # and write_text truncates the shared inode. Those two rows are therefore bound by
     # gated_model_writers_refuse_a_planted_hard_link, NOT by the retained-property
     # clause alone.

  - {id: writer_lands_artifact_unlinked, kind: behavior, form: test,
     discharged_by: test_each_writer_lands_its_artifact_when_nothing_is_planted,
     binds: ["interacts(write_trace->run_dir)", "interacts(run_investigation->run_dir)",
             "interacts(observe_logger->run_dir)", "interacts(denial_logger->run_dir)",
             "interacts(write_case_pointer->run_dir)", "interacts(budget_enforcer->run_dir)",
             "interacts(circuit_breaker->run_dir)", "interacts(query_tool->run_dir)",
             "interacts(record_lesson_load->run_dir)", "interacts(gather_dispatch->run_dir)",
             "interacts(claim_lead->run_dir)", "interacts(start_box->run_dir)",
             "interacts(write_atomic->run_dir)", "interacts(run_investigation->run_dir)"]}
     # the POSITIVE CONTROL for no_write_through_planted_leaf — without it the negative
     # passes vacuously on any writer that simply stopped writing. It binds the fault-exit
     # trace edge too (phase-F F2): the control has to cover every row the negative does, or
     # a writer can be added to the negative and be vacuous there with nothing noticing.
     # ONE ROW IS EXEMPT FROM THE NON-EMPTY CHECK and says so per row rather than by threshold:
     # the fault-exit trace write is literally write_text(""), so an empty artifact IS its
     # contract, and a size threshold would have excused any writer that later stopped writing.

  - {id: no_write_through_planted_dir_component, kind: negative, form: test,
     discharged_by: test_no_writer_mkdirs_through_a_planted_directory_component,
     binds: ["interacts(query_tool->gather_raw)", "interacts(claim_lead->gather_raw)",
             "interacts(gather_dispatch->run_dir)", "interacts(record_lesson_load->run_dir)",
             "interacts(drain_restore->drain_worktree)",
             "run_dir.identity", "gather_raw.identity"]}
     # F8/G15/X1 refuted the design's "two sites": there are at least FIVE mkdir-through-
     # a-box-controlled-component sites — the model-named gather_raw component, the fixed
     # gather_summaries component, both gated model writers, and the shared JSONL
     # appender's parent create — plus the drain lane's restore. The binds name the five
     # this demand covers.
     # rejected -> the two GATED model writers are deliberately NOT bound (C4-fix/X17).
     # B8: O_NOFOLLOW on the leaf does not protect a swapped component; B10: mkdir over
     # a symlink-to-directory succeeds silently. Consensus (45-dispositions, firm #13):
     # the rule is depth-agnostic, so the test plants at variable depth.

  - {id: dir_component_write_lands_when_unplanted, kind: behavior, form: test,
     discharged_by: test_directory_component_writers_land_when_nothing_is_planted,
     binds: ["interacts(query_tool->gather_raw)", "interacts(claim_lead->gather_raw)",
             "interacts(gather_dispatch->run_dir)"]}
     # the POSITIVE CONTROL for no_write_through_planted_dir_component.

  - {id: component_guard_is_anchored_at_the_tree_root, kind: behavior, form: test,
     discharged_by: test_a_symlinked_ancestor_above_the_tree_does_not_refuse,
     binds: ["interacts(query_tool->gather_raw)", "interacts(claim_lead->gather_raw)",
             "interacts(gather_dispatch->run_dir)"]}
     # minted: firm #13 said the component rule is DEPTH-AGNOSTIC, and the first reading of
     # that judged every component down from `/`. Depth-agnostic is right; the ROOT it counts
     # depth from was not. A symlinked ANCESTOR is host configuration the box cannot influence
     # — `/tmp` is a symlink on macOS and that is where the default runs base lives — and
     # refusing on one refuses everything: open_store does not catch it, so no run starts, and
     # the three OSError-swallowing sidecar writers become permanent silent no-ops.
     # The anchor is free ONLY because the box's writable mounts start AT the tree, so the
     # region the walk stops judging is the region the box cannot reach. The third arm holds
     # that premise: a component planted INSIDE the tree is still refused under a symlinked
     # ancestor, so the anchor sits at the box's reach and not above it.

  - {id: write_atomic_temp_not_followed, kind: behavior, form: test,
     discharged_by: test_atomic_write_refuses_a_planted_temp_name,
     binds: ["write_atomic", "interacts(write_atomic->run_dir)",
             "interacts(budget_enforcer->run_dir)", "interacts(write_guarded->run_dir)"]}
     # BOUND AT THE TREE, NOT AT budget_json.identity, deliberately: this demand is about
     # the primitive's behaviour against a planted temp name, and it asserts nothing about
     # whether two writers can collide on that name. Binding the artifact edge would mark
     # budget_json.identity "answered" to the gate and silence R2's collision question,
     # which forks R3+R7 have open.
     # B4/F7: the temp name is a deterministic `<name>.tmp` beside the target — a
     # predictable plant address, and the payload lands on the outside target BEFORE
     # the rename. Forks R3+R7 (45-dispositions) decide together whether the staged
     # name must be unpredictable or whether O_EXCL alone is the requirement; the
     # RESOLVED at §7 D1: every replacing write stages under an UNPREDICTABLE name and
     # renames into place, so a leftover cannot collide with a later write and an attacker
     # cannot pre-plant a name they cannot predict — an occupied staged name is therefore
     # ALWAYS hostile and EEXIST fails closed unambiguously, with no retry. The staged
     # name is pinned through the primitive's `stage_name=` seam (staged_name_is_
     # unpredictable), and D1's accepted cost is its own demand (orphaned_staged_files_
     # are_swept). This retires forks R3, R7, R11's collision half, the duplicate-seq
     # premise and the model-basename-versus-temp-suffix premise together.

  - {id: budget_write_alias_safe_under_the_enforce_flag, kind: domain-outcome, form: test,
     discharged_by: test_budget_write_is_alias_safe_under_both_enforcement_postures,
     binds: ["DEFENDER_BUDGET_ENFORCE.domain.distinguished[true]",
             "DEFENDER_BUDGET_ENFORCE.domain.distinguished[unset]",
             "interacts(budget_enforcer->run_dir)", "interacts(write_atomic->run_dir)",
             "write_atomic"]}
     # tree-level binds for the same reason as write_atomic_temp_not_followed: the two
     # idioms are named by their writer edges without claiming the sink's identity contract.
     # provisional flag dropped: F5/R2 is resolved at §7 D3, and an alias refusal no
     # longer reaches BudgetKill on either arm. X13 refuted "a default run never exercises it": BOTH CI pytest jobs
     # set DEFENDER_BUDGET_ENFORCE: "1" for the whole collected suite, so the B4-unsafe
     # write_atomic path is the CI-DEFAULT path — including for every test phase E
     # writes. Any test asserting the safe idiom must pin the posture explicitly rather
     # than inherit it.

  - {id: write_atomic_callers_survive, kind: survival, form: test,
     discharged_by: test_write_atomic_callers_outside_the_run_dir_still_write,
     binds: ["write_atomic", "learning_queue", "accounting_failures_json",
             "interacts(write_atomic->learning_queue)",
             "interacts(write_atomic->accounting_failures_json)"]}
     # G2/X6: five production call sites, exactly one inside a box-writable tree. The
     # fix is at the primitive, so all five get it (firm consensus #14).
     # ALL FOUR OUTSIDE-TREE CALLERS ARE NOW DRIVEN (phase-F F9). The demand claimed four and
     # its test drove one — the accounting sidecar — while the enqueue marker, the marker
     # rewrite and the pending-queue rewrite were named in prose only. This is the ONLY demand
     # standing between the primitive's rewrite and three callers that have nothing to do with
     # boxes; a primitive hardened for the exposed caller breaks them silently and nothing else
     # looks. Each caller's artifact is now read back and checked, not merely invoked.

  - {id: new_writer_without_primitive_is_a_finding, kind: behavior, form: test,
     discharged_by: test_a_new_shared_tree_writer_is_a_lint_finding,
     binds: ["lint_unguarded_tree_write", "interacts(lint_unguarded_tree_write->defender_code_tree)",
             "run_dir", "write_guarded"]}
     # C3-fix is the discriminating case: the lint must catch a writer that reaches the
     # tree through a HELPER WRAPPER (the _write_budget_atomic -> write_atomic shape),
     # not only a direct idiom — a pattern-matching lint reproduces C1's own blind spot.
     # rejected -> it is not claimed that the lint proves a link cannot arrive in the
     # tree by some other route; a host-side bug or a restored corpus is backstopped,
     # not disproved (NO7).
     # Fork R25 taken as the judge recommended: HARD GATE on the C1 rows, ratchet only
     # for writers discovered later — pinned by lint_hard_gates_the_census_rows. A
     # baseline that accepts unconverted rows makes the next miscount invisible in exactly
     # the way C1's own grep did.

  - {id: write_guarded_is_the_single_write_seam, kind: seam, form: test,
     discharged_by: test_every_shared_tree_writer_routes_through_the_guarded_primitive,
     binds: ["write_guarded", "interacts(write_guarded->run_dir)",
             "interacts(write_guarded->drain_worktree)"]}
     # minted: assembler. M3 gives fourteen writers a new dependency and 21-demands
     # pinned no seam for it — schema.md's "pin the seam as a demand" case. This is what
     # write-code-from-spec's reconciliation reads, and it is what makes
     # new_writer_without_primitive_is_a_finding's lint have something to key on.

  - {id: locked_json_open_refuses_before_the_lock, kind: behavior, form: test,
     discharged_by: test_locked_json_open_fails_before_the_lock_is_acquired,
