# ============================================================================
# COLD-READER RECONCILIATION (phase F's blind reader, closed at the phase-E re-run)
#
# Six of the blind reader's questions had no test bearing on them, and three tests
# answered no question of theirs. Both lists reconcile without a gap and without
# invented scope — recorded here because "no test answers this" reads as a hole
# until someone says why it is not one.
#
# THE SIX UNANSWERED QUESTIONS ARE ALL NON-EXECUTABLE DEMANDS, by design:
#   * attribution after a redirect, and cross-run redirection    -> artifact_stream_stays_attributable (clause)
#   * pure DESTRUCTION rather than redirection                   -> artifact_destruction_is_a_non_obligation (clause, §7 D6)
#   * the write gate's check-then-write window as a DIRECT fix   -> model_write_gate_left_toctou_open (clause)
#   * model-authored free text forging a rendered frame          -> gather_summary_render_frame (waiver, §7 D4)
#   * the two eval-harness drivers                               -> eval_harness_drivers_unmodelled (waiver + actor_waivers)
# A clause or waiver carries its own `outcome`; it is the human's or the design's
# recorded no, and a test asserting it would be pinning a non-obligation. That the
# blind reader could not answer them from the suite is the CORRECT reading.
#
# THE THREE UNMATCHED TESTS EACH TRACE TO A DEMAND, none of them invented scope:
#   * tool_trace_write_is_torn_write_safe        — minted by the GATE LEAF from an R2 hit on
#     tool_trace_jsonl.identity, not from an intent obligation, which is exactly why the
#     obligation list the blind reader was handed does not contain it.
#   * alias_probe_is_rerun_in_full_and_cleans_both_arms — §7 H10.6, one of the six pins the
#     human made provisionally over a design silence; a silence has no obligation to be on
#     the list.
#   * box_writable_mount_set_pins_the_hardlink_premise — the PREMISE under an explicit
#     non-obligation (hardlink_gate_blindness_unreachable), pinned as a test precisely
#     because the non-obligation is only true while the mount topology holds.
#
# ROUND TWO: THE FIVE THE BLIND READER COULD NOT RECOVER, DECIDED ONE BY ONE. §7 asked for
# a per-item call — a real gap to close, or invented scope to drop — and the split is 4/1.
#
#   1. the write tool's check-then-write timing gap — DROP as an executable obligation. It is
#      model_write_gate_left_toctou_open, a recorded deferral, and what closes it IS pinned,
#      one mechanism over: the race's winning move is creating a link, so probe_failure_faults
#      _box_start keeps the ban-absent condition from ever reaching a model turn and
#      ban_in_force_for_the_whole_box_life pins the filter for the container's whole life.
#      A test asserting the race itself would be pinning the non-obligation.
#   2. cross-run artifact provenance / cross-run redirection — DROP. artifact_stream_stays
#      _attributable is the clause, and it is attributability AGAINST REDIRECTION, discharged
#      by the ban and the backstop together rather than by any separate audit mechanism. §7 D8
#      does not close it either, but it removes one way it could have got worse: the scan's
#      verdict is now keyed by the tree's own identity and sited outside it, so a tree's
#      judgement no longer depends on anything the tree itself carries.
#   3. model-authored text forging a rendered frame — DROP. The human's waiver
#      (gather_summary_render_frame, §7 D4): the hazard is on the RENDER path and M1-M4 touch
#      the write path. Filed, not silent.
#   4. the benchmark/eval-harness drivers — DROP. eval_harness_drivers_unmodelled, plus the
#      `actor_waivers` map the execution-context check actually reads. Neither script starts a
#      box, so neither is inside this change's threat model.
#   5. a stale container from an earlier run, still alive when a later run dir is created — A
#      REAL GAP, and it stays open ON PURPOSE. §7 pinned the OUTCOME (refuse) but no ledger
#      claim covers how such a container would be DISCOVERED, and the existing same-name
#      `docker inspect` check cannot see a container under another name holding the same tree.
#      It is live_container_from_an_earlier_run (form: clause) — a guard and its test built
#      from the same wrong prior are green together, which is the one failure mode a spec
#      cannot recover from later.
#
# ROUND FOUR: THE STANDING PROBE REQUEST, EXECUTED (50-probe-stale-container.md, P1-P4). The
# discovery gap above is unchanged and the clause stays a clause. Two things changed around it.
#
#   * The gap's COST is now bounded and pinned. A stale container cannot reach a later run's
#     tree (P4, a failed break-attempt), but only because the run-dir mint refuses to write
#     into a directory that still exists and because a Linux bind mount pins the object it
#     resolved rather than the path string. Neither is asserted anywhere, and the reap scan's
#     own "no live writer in the tree" justification rests on both.
#     live_run_dir_never_reused_and_stale_mount_never_follows pins them, in the same shape and
#     for the same reason as box_writable_mount_set_pins_the_hardlink_premise.
#   * The same probe turned up a SECOND finding, recorded as an explicit no rather than a
#     demand: a STOPPED same-name container is force-removed on a liveness test alone, so one
#     run can destroy another run's stopped container (P2). Every executable form of that
#     would have to invent the identity mechanism, which is the same trap keeping its sibling
#     a clause — stopped_container_reap_has_no_identity_check, with the reasoning stated.
# ============================================================================

# ============================================================================
# HANDOFF — the assembler fills `refuted`, `deferred` and `drops`. `forks` is
# §7's, `nullstub_passes` is phase F's, `deviations` is the orchestrator's.
#
# ALL SIX ARE PRESENT AS OF ROUND FIVE. Three of them were promised by the line
# above and simply absent, which reads to a cold consumer exactly like three
# empty findings rather than three unwritten slots. `forks` summarizes the
# adjudications §7 made — the per-fork reasoning lives at the demand each one
# produced and in the ledger notes, and is not re-copied here; `nullstub_passes`
# is empty for a structural reason stated at the key; `deviations` carries the
# two the author declared, which until now were recorded only inside the demands
# they affect.
# ============================================================================
handoff:
  forks:
    - "R3 + R7 + R11's collision half (+ the duplicate-seq and model-basename-vs-temp-suffix premises) — RESOLVED by §7 D1, and DISSOLVED rather than adjudicated: every replacing write stages under an unpredictable name, so a leftover cannot collide with a later write and an attacker cannot pre-plant a name they cannot predict. An occupied staged name is therefore always hostile and EEXIST fails closed unambiguously. Accepted cost: orphaned staged files need a sweep, itself a write through the same primitive."
    - "R12 (does the reap scan always walk the tree?) — RESOLVED by §7 D2 on X4's executed refutation: the walk runs in NEITHER teardown-fault cell, not just the in-flight one, so the marker demand covers both arms. Forcing the scan was unavailable (it needs a provably dead box, which is what failed), so the gap is converted from silent to explicit."
    - "R24 + F5 (does a refused write escalate toward ending the run?) — RESOLVED by §7 D3, settled without spending a human question slot: G17 executed both halves of the breaker and found they diverge and neither degrades like the budget file. An alias refusal is recorded but exempt from every failure circuit; both breaker halves ride along as demands independent of the exemption."
    - "R22 + R23 (the not-opt-out-able fault) — TAKEN BY THE ORCHESTRATOR, flagged for override. R23: the ban fault gets its own exception type, because sharing the broad BoxFault class leaves a security-critical caller constructible in exactly the state the human's decision exists to close — mechanical, not a policy choice. R22: SETTLED AS FACT, not policy — the unsandboxed opt-out is an exact `== \"1\"` comparison, so every near-miss value already fails closed and no strictness rule needs inventing."
    - "R4 (is the write backstop conditioned on box liveness?) — resolved by the judge in favour of an UNCONDITIONAL backstop: G12 makes this the only route NO7 assigns it, and it is the CI-runnable, discriminating half of the suite."
    - "R9 (the demand list says two CI jobs register the runtime; the brief says the guard skips every live-box test) — CLOSED by G20: both source frontiers read correctly and the brief described RETIRED behaviour. Real boxes start in both jobs."
    - "R19 (does `git checkout` write through a symlink?) — CLOSED by G18, executed: it replaces the link with the committed blob, the same answer B5 gave for os.replace."
    - "R25 (hard-gate the write lint, or ratchet it?) — HARD GATE on the C1 census rows, ratchet only for writers discovered later. Thirteen ratcheted lint modules already exist, so the ratchet is the default nobody chooses, and a baseline accepting unconverted rows makes the next miscount invisible the way C1's grep did."
    - "The remaining forks (R1, R2, R5, R6, R8, R10, R11's non-collision half, R13-R18, R20, R21, R26) were resolved at the demand each produced, and the resolution is stated in that demand's own comment or in the ledger note of the claim that settled it — not re-copied here, because a second copy is a second thing to keep true."
  refuted:
    - "X17 + G3 (the model write gate denies a statically planted link; the exposure is a race, not a plant) — REFUTED on the HARD-LINK axis by an executed alias matrix over both write tools and both allowlisted names. resolve() does not dereference a hard link, so the resolved path is the allowlisted name itself and write_text truncates the shared inode; the outside file was overwritten in all four arms. The symlink half of the exclusion is still sound. Consequence: the two gated model writers are back in the negatives (gated_model_writers_refuse_a_planted_hard_link) and model_write_gate_left_toctou_open's outcome was rewritten to stop asserting the refuted half."
    - "X19 (the exact --oci-seccomp registration syntax is unprobed) — CLOSED by G21, executed against real runsc release-20260727.0 against a scratch daemon config: `runsc install -- --oci-seccomp` writes runtimeArgs: [\"--oci-seccomp\"]. This was the artifact's one formal unknown and it decided the content of both the fault message and the CI change."
    - "The brief's live-box guard inference (G20) — REFUTED: the blanket docker-outside-of-Docker skip is retired posture, and neither CI job hits the guard's skip branch. Real boxes start in both, so the registration is load-bearing and the CI change is CI-breaking rather than defensive. It is not merge-BLOCKING: `main` carries no branch protection and no ruleset, so the `test` job is advisory."
    - "Fork R19's open question (does `git checkout` write through a symlink?) — CLOSED by G18, executed: it REPLACES the link with the committed blob and leaves the outside file untouched, the same answer B5 gave for os.replace."
    - "C1 (the design's own census: twelve writers, three idioms) — corrected to >=14 writers in >=5 idioms; both additions are structurally invisible to the grep that produced it, and this graph carries them as edges."
    - "X1 (two mkdir-through-a-box-controlled-component sites) — corrected to at least five; the dir-component demand now binds all five."
    - "X4 (the reap scan always walks the tree) — corrected: a teardown fault raised while an exception is in flight is swallowed and the scan never runs, which is the crash path. The leave-in-place doctrine leans on a reporter that does not always run."
    - "X5 ('the write failed closed' names one observable outcome) — corrected to four distinct postures across the cited writers, one of which kills the run."
    - "X7 (the platform default profile can be vendored and appended to) — corrected: it is compiled into the daemon and undumpable, which is why C2-fix withdrew the vendoring decision and why the shipped profile is hand-written and wider on the runc lane."
    - "X13 (the unsafe budget idiom is never exercised by default) — corrected: both CI pytest jobs set DEFENDER_BUDGET_ENFORCE=1 for the whole collected suite, so it is the CI-default path."
    - "X14 (preserving each call site's posture keeps a refused write from failing the run) — corrected, and the MAGNITUDE was corrected again by the executed re-probe: not five consecutive failures but TWO refused writes past a 300s elapsed window (a success resets the consecutive counter and never clears the first-failure stamp). The demand written against it asserts the ELAPSED limb for that reason; a test written against 'five consecutive' passes while the two-failure path stays open. The lever is posture-scoped and unreachable with the enforcement flag off — i.e. it exists exactly where X13 says CI lives — and rebuilding it is what F1's own rationale rejected."
    - "X15 (the --oci-seccomp registration lives outside anything this repo ships) — corrected for CI, which is where the ban's arrival is first observed: two CI jobs register runsc themselves, with no --oci-seccomp. Every box in CI faults at startup until they change."
    - "X16 (every box lane has a writable shared tree to probe in) — corrected: the learning run-cycle box's mounts are all read-only."
    - "X18 (the doc-correction and CI-registration demands have no testable surface) — corrected: an existing suite reads ci.yml as a fixture, and thirteen ratcheted lint modules are the established shape for the new lint."
    - "E2 (revision 1: gVisor's treatment of the OCI profile is deferred) — now holds on an executed two-arm probe, which is what puts M1 back on the shipped default runtime and turns M2's failure from a permanent property into a misconfiguration."
  deferred:
    - "PROBE REQUEST (phase E rounds 1-3) — EXECUTED AND CLOSED at round four (50-probe-stale-container.md, ledger P1-P4). It asked how a container from an EARLIER run, still alive when a later run dir is created, would be DISCOVERED. Answer, in three parts. (1) A same-NAME live container is already refused, never reaped — §7's provisional outcome is today's behaviour, confirmed by execution. (2) Discovery of a container under a DIFFERENT name over the same tree is still covered by no claim, so `live_container_from_an_earlier_run` stays a `form: clause`. (3) The cost of never discovering one is bounded: the break-attempt to make a stale container reach a later run's tree FAILED, and the two accidents it failed on are now pinned executably by `live_run_dir_never_reused_and_stale_mount_never_follows`. A second finding from the same probe — the blind force-remove of a STOPPED same-name container — is recorded as `stopped_container_reap_has_no_identity_check`, an explicit non-obligation with its reasoning, because every executable form would have to invent the identity mechanism."
    - "R2 (nothing in the tree legitimately needs to create a link inside the box) — reclassified to unprobed: the design's probe counted tracked symlinks in the repo, which cannot observe runtime behaviour inside the box. M2's ordinary-create control covers part of it."
    - "R7 (the curator's tool surface cannot create a symlink) — deliberately unprobed; M1 closes the lane regardless."
    - "TARGET-REACHABILITY CHECK (`spec-graph calls`), RUN FOR THE FIRST TIME AT ROUND FIVE AND NOT CLEAN — read the number before trusting it. In five prior rounds it exited 2 (\"could not look\"), never 0: a modify-existing spec's target is invisible to its import heuristic, and the phase contract calls a 2 a finding rather than a pass. Named explicitly (--target defender._io defender.runtime.box defender.runtime.scrub defender.run_common) it exits 1 with 34 of this suite's tests reported NO-CALL. Classified by hand, none is the class the check exists to catch (a test asserting AROUND its target): 19 reach the target only through `_spec771.py`, a sibling helper MODULE, and the checker follows same-FILE helpers and same-dir conftest fixtures only — a documented limit of the instrument, not a property of the suite; the remaining 15 drive real production entry points in modules the target list does not name, because the target list is the NEW symbols and those tests drive the writers that will be converted to call them, plus four whose subject is a shipped artifact (ci.yml, the seccomp profile JSON, a doc, the lint script) and which correctly call no library code at all. write-code-from-spec should re-run it once the target modules carry real symbols: after implementation the second group collapses, and any residue is then a real finding."
    - "EXECUTION-CONTEXT CENSUS (phase F, mechanical-gate leaf): `spec-graph actors` did not run over this graph — before implementation there is no production-code diff for it to follow (10-brief.md names this deferral explicitly: 'the new profile artifact and the new startup probe have no existing callers to trace'). The three design-provenance actors this graph already names (write_guarded, _probe_alias_ban, lint_unguarded_tree_write — see structure.actors) are the planned census; write-code-from-spec §3 runs the mechanical actors check once real code exists and reconciles against them."
  drops:
    - "test_locked_json_idiom_flock_contention_or_timeout — converged consensus that the design is silent, and 45-dispositions classifies it orthogonal to the alias ban: no obligation reaches it."
    - "test_write_atomic_rename_crosses_a_filesystem_boundary — same: orthogonal, no obligation reaches it."
    - "test_git_checkout_subprocess_dependency_fails_during_stray_discard — same. (Its sibling question — whether git checkout writes THROUGH a symlink — is NOT dropped: it is fork R19's standing probe obligation.)"
    - "test_box_create_docker_run_timeout_leaves_a_named_container_behind — same: orthogonal, no obligation reaches it."
    - "test_budget_failure_counter_reset_on_intervening_success — same. Note it neighbours fork R2 without being it."
    - "test_budgetkill_retry_inherits_prior_failure_state — same."
    - "test_ci_runtime_registration_output_format_shift — same."
    - "test_box_lifecycle_knob_has_no_reader_yet — same; G13 records the reader-less field."
    - "test_env_var_resolution_gap_between_factory_and_call — same; BoxSpec's refinement records the per-overload resolution point, which is the fact behind it."
  nullstub_passes: []
  # EMPTY FOR A STRUCTURAL REASON, NOT BECAUSE THE CHECK CAME BACK CLEAN — and a cold consumer
  # must not read the two the same way. `spec-graph nullstub` generates a do-nothing stub of
  # the TARGET and re-runs the suite; before implementation the target's new symbols do not
  # exist, so there is nothing to stub and the check never produced a classification in any of
  # five rounds. No test here has been cleared as a legitimate null-stub pass. write-code-from-
  # spec owns running it once real code exists, and the 30 green-at-HEAD cases (the five
  # green-by-construction regression pins, the two already-holding census rows, and the
  # survival demands) are the population it should classify first.
  deviations:
    - "MECHANISM SUBSTITUTION, declared: the boundary sweep's drain-lane arm compares REPO-RELATIVE coordinates, not the absolute paths the demand's prose describes. Rendering the production drain request as instructed produces writable mounts under a temp worktree, so an absolute comparison against a file shipped in this repo can never fail — the same unearned coverage one level down that the repair existed to remove. The property that can fail is: the drain box writes into a checkout and the lane opens a PR from it, so a ban-dependency file under a triggered corpus is one the box can rewrite AND get merged. That is a WIDER hazard than the prose, and it is recorded in the demand itself."
    - "PROSE NARROWED RATHER THAN BODY WIDENED, declared: the interrupted-probe demand claimed both spellings of an incomplete probe and drove one. Driving the other required a fake inventing the probe's stdout format for a partial report, which no ledger claim covers — an author-imagined fault, banned. Scoped to the interrupted exec, with the missing arm's home named at the site. If the coverage is wanted, it is a probe request, not an authoring gap."
