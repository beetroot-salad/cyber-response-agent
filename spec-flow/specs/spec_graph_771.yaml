     # writer is individually guarded. Written as a per-writer property precisely so a wrong
     # pin fails here rather than silently holding through a reordering.

  - {id: alias_probe_is_rerun_in_full_and_cleans_both_arms, kind: behavior, form: test,
     provisional: true,
     discharged_by: test_the_alias_probe_reruns_in_full_and_cleans_its_own_leavings_on_both_arms,
     binds: ["interacts(_probe_alias_ban->run_dir)", "drives(start_box->_probe_alias_ban)"]}
     # minted: §7 H10.6, PINNED PROVISIONALLY. Also the answer to the strong author's finding
     # that a FAILED probe plants the very shape it tested for — a shape that succeeded when it
     # should have been denied is a banned entry the probe itself created, and leaving it hands
     # the reap scan a taint the box did not cause.

  - {id: sentinel_retry_replaces_the_leftover, kind: behavior, form: test,
     discharged_by: test_a_retry_against_a_leftover_sentinel_reports_the_ban_fault,
     binds: ["sentinel.identity", "interacts(start_box->sentinel)"]}
     # minted: fork R11's non-collision half, under §7 D1. The run-dir sentinel's name is fixed
     # and is DELIBERATELY left behind on every fault, so it is the one writer where a
     # legitimate leftover is guaranteed rather than incidental — and under stage-then-rename
     # with an unpredictable staged name the retry renames over it, so the operator sees the
     # ban fault they can act on instead of a collision they cannot. Closes sentinel.identity.

  - {id: interrupted_probe_sequence_reads_as_failed, kind: behavior, form: test,
     discharged_by: test_an_interrupted_or_truncated_probe_sequence_reads_as_a_startup_fault,
     binds: ["interacts(_probe_alias_ban->run_dir)", "start_box"]}
     # minted: fork R20 — incomplete is FAILED, never a pass, and the teardown inherits R3's
     # sentinel-mismatch precedent. O2's own oracle-can-be-wrong answer applied literally.
     # SCOPED AT ROUND FOUR to the arm it drives: the INTERRUPTED exec, which E2 supports. The
     # other spelling of incomplete — an exec that returns with a required signal missing — is
     # probe_ordinary_create_succeeds's second arm. The outcome sentence used to claim both and
     # drive one, and closing that by driving a partially-reported sequence would have needed a
     # fake inventing the probe's stdout format for a partial report, which no claim covers.

  - {id: ban_fault_has_its_own_exception_type, kind: behavior, form: test,
     discharged_by: test_the_ban_fault_is_its_own_exception_type,
     binds: ["start_box", "unboxed_opt_out", "interacts(start_box->unboxed_opt_out)"]}
     # minted: §7 D5 — TAKEN BY THE ORCHESTRATOR AND FLAGGED FOR OVERRIDE. Mechanical rather
     # than a policy choice: F4's decision is only enforceable if the fault cannot be caught by
     # the broad handler every other startup fault degrades through. If the human disagrees,
     # this demand changes shape. rejected -> distinguishing the fault by message or by an
     # attribute on the shared class: message-matching is the failure mode fork R23's own note
     # describes, and a distinct type is the only identity a maintainer cannot silently erase.

  - {id: unboxed_opt_out_exact_match, kind: domain-outcome, form: test,
     discharged_by: test_the_unsandboxed_opt_out_matches_exactly_one_value,
     binds: ["unboxed_opt_out.domain", "unboxed_opt_out.domain.distinguished[1]",
             "interacts(start_box->unboxed_opt_out)"]}
     # minted: fork R22, CLOSED AS FACT rather than as a policy call. The opt-out is an exact
     # `!= "1"` test, so every near-miss spelling already fails closed — executed across
     # {unset, "1", "0", "true", "TRUE", "01", " 1", "1 ", "yes", ""}. What was missing is a
     # demand pinning it against future softening, and F4 makes that matter more than it did.

  - {id: box_writable_mount_set_pins_the_hardlink_premise, kind: behavior, form: test,
     discharged_by: test_the_box_writable_mount_set_pins_the_hard_link_non_obligation,
     binds: ["run_dir.identity", "box_argv.access[_create_argv]",
             "box_argv.access[_render_argv]", "box_tmpfs"]}
     # minted: §7's reconciliation of two probed claims in contradiction. The gate's hard-link
     # blindness is REAL (X17/G3 refuted) and the box cannot reach it (R6: link(2) refuses
     # across a mount boundary, EXDEV both directions, within-mount succeeded) — so the
     # non-obligation below stands, but its premise is the MOUNT SET, not permissions, and the
     # premise is pinned HERE. Widening a bind, or mounting a parent read-write, converts this
     # from unreachable to live without touching any code #771 changes, and the gate would
     # still be blind. This test is what fails loudly when the mount topology drifts.

  - {id: live_run_dir_never_reused_and_stale_mount_never_follows, kind: behavior, form: test,
     discharged_by: test_a_live_run_dir_is_never_reused_and_a_stale_mount_never_follows_it,
     binds: ["run_dir.identity", "box_argv.access[_create_argv]"],
     cites: [P4]}
     # minted at phase E round four, on the EXECUTED probe (50-probe-stale-container.md) that
     # closed this suite's last standing probe request. Same treatment, same reason, as
     # box_writable_mount_set_pins_the_hardlink_premise one demand up: the PREMISE under a
     # non-obligation, pinned as a test precisely because the non-obligation is only true
     # while the premise holds. Here the premise has TWO legs and neither was designed for
     # this job — the run-dir mint's refuse-on-exists check (an application check with an
     # unrelated purpose) and Linux bind mounts pinning the object they resolved rather than
     # the path string. The scan's own justification for when it may walk a tree is "no live
     # writer in it"; that justification currently rests on those two accidents, and nothing
     # in this codebase asserts, tests, or names either. The probe's own recommendation was to
     # record them as a comment rather than a demand, on the ground that pinning kernel VFS
     # behaviour is a poor fit for this suite's shape. That recommendation is NOT taken, and
     # the deviation is deliberate: the third arm pins what this codebase actually owns (the
     # mount is a bind, sourced at the run dir itself and not at an ancestor whose dentry the
     # deletion never removes), which is where the real drift would come from, and the kernel
     # leg is re-probed on every run rather than asserted from a one-time observation.
     # GREEN BY CONSTRUCTION AT HEAD, like the hardlink premise pin — it preserves, it does
     # not demand.

  - {id: box_start_fault_reaps_its_container, kind: behavior, form: test,
     discharged_by: test_the_box_start_fault_removes_the_container_it_created,
     binds: ["start_box", "interacts(start_box->box_argv)"]}
     # a leaked container is the one way a startup fault can still leave a live writer on the
     # tree the verdict marker has just recorded as unscanned. R3's precedent, inherited.

  - {id: teardown_fault_reports_both_causes, kind: behavior, form: test,
     discharged_by: test_a_teardown_fault_under_an_in_flight_failure_still_reports_both,
     binds: ["drives(stop_and_scrub->stop_box)", "run_dir.access[host-read]",
             "interacts(scrub->scrub_verdict)"]}
     # X4 found this cell silent on BOTH counts — the fault is warned-and-swallowed AND the
     # walk never runs. §7 D2's marker fixes the second half; this pins the first, because a
     # swallowed teardown fault is how a leaked box becomes invisible.
     # THE IN-FLIGHT FAILURE IS NOW REAL (phase-F round two). `in_flight=True` was passed as a
     # bare flag with nothing propagating, so the demand's first clause — the run's own failure
     # still reaches the caller — had no failure to be true of and was observed by no assertion.
     # The reap pair is driven from a `finally` under a real exception, as production drives it,
     # and the caller's exception identity is asserted: a BoxFault raised on top would replace
     # the reason the run was already dying.

  - {id: faulted_create_marks_its_tree, kind: behavior, form: test,
     discharged_by: test_a_faulted_box_create_leaves_a_verdict_on_the_tree_it_touched,
     binds: ["start_box", "run_dir.access[host-read]", "interacts(scrub->run_dir)",
             "interacts(scrub->scrub_verdict)"]}
     # §7 H10.2 under D2's marker rather than a rule of its own. It matters because the host
     # has ALREADY written into that tree before the box exists — the sentinel plant is
     # host-side and lands before the create is confirmed.
     # THE MARKER'S PRESENCE IS THE ASSERTION (phase-F F7). As authored the test asserted only
     # that the tree does not read as verified — which is satisfied by no verdict existing at
     # all, i.e. by unmarked_tree_is_treated_as_unverified's rule, which was already true. A
     # provisional pin that discharges to a rule that already held reads as CONFIRMED without
     # having been tested, and this is one of the six pins carried to the implementer as
     # unsettled. It now asserts the verdict artifact exists, records ran: false, and names a
     # reason — the same shape the skip-marker sibling asserts.

  - {id: lint_hard_gates_the_census_rows, kind: behavior, form: test,
     discharged_by: test_the_write_lint_hard_gates_the_census_rows_and_ratchets_only_new_ones,
     binds: ["lint_unguarded_tree_write", "interacts(lint_unguarded_tree_write->defender_code_tree)"]}
     # minted: fork R25 — hard gate on the C1 rows, ratchet only for writers discovered later.
     # Thirteen ratcheted lint modules already exist, so the ratchet is the default nobody
     # chooses, and a baseline that accepts unconverted rows makes the next miscount invisible
     # in exactly the way C1's own grep did.
     # THE GATE LIST IS DERIVED FROM THE CENSUS (phase-F F2). It was a hand-typed set of ten
     # module paths, and the driver's fault-exit trace write was not among it — so the very
     # mechanism the design names as covering the oracle's blind spot was blind to the same
     # writer the oracle was. Derivation is the repair: a census row added later cannot be
     # silently absent here, which is the only failure mode this demand exists for. The drain
     # lane's own module rides along, because F6's parity is asserted at the tool and the lint
     # is what backstops that lane's writers.

  # ---- explicit NON-OBLIGATIONS: examined nos, recorded so they cannot re-enter
  # ---- later as unstated assumptions -----------------------------------------
  - {id: hardlink_gate_blindness_unreachable, kind: behavior, form: clause,
     outcome: {nl: "The model write gate's blindness to a hard link is real and is NOT closed
       by this change; it is unreachable for the threat actor in the threat model because the
       box's only writable mount is the shared tree and link(2) refuses to cross a mount
       boundary, so a hard link the box creates can only alias entries already inside that
       tree. The premise is the mount set, not permissions, and it is pinned by
       box_writable_mount_set_pins_the_hardlink_premise."},
     binds: ["interacts(tool_write_file->run_dir)", "run_dir.identity"],
     rejected: [{nl: "Closing the gate itself with an fd-based rewrite was considered and
       deferred to the ban; treating the blindness as a live hole was rejected because the
       route to it does not exist for a box confined to one writable mount."}]}

  - {id: stopped_container_reap_has_no_identity_check, kind: behavior, form: clause,
     outcome: {nl: "A same-named container that is NOT running is force-removed at box start on
       a liveness test alone, with nothing establishing that it belonged to this run — so one
       run can destroy another run's stopped container, and 'stale' collapses into 'reapable'
       the instant a container exits, whatever the reason it exited. This change does NOT
       require an identity check there, and the reason is recorded rather than assumed:
       nothing is written on a container today that such a check could read, so specifying the
       check would mean specifying its mechanism, which no probe covers; and the object
       destroyed is by construction a container whose process is already gone, so the loss is
       forensic rather than a live-writer hazard. The live half of the same code block is the
       opposite outcome on the same predicate — a running container is refused, never reaped —
       and only .State.Status separates them."},
     binds: ["start_box", "run_dir.identity"],
     cites: [P2, P3],
     rejected: [{nl: "Authoring it as an executable demand was rejected: every executable form
       has to pick the identity mechanism — a run token stamped on the container, a refusal, a
       loud warning — and no ledger claim covers any of them. That is the same wrong-prior trap
       that keeps its sibling live_container_from_an_earlier_run a clause, and the two are one
       hazard seen from two sides: whether a container belonging to another run is DISCOVERED,
       and whether one that is discovered is DESTROYED. Splitting them into a clause and a test
       would assert that the destruction half is settled while the discovery half is not, which
       is false."},
       {nl: "Pinning loudness alone — the reap must be announced even if provenance cannot be
       checked — was rejected as scope this suite does not own. It restates a position already
       recorded against the same code block by the box-lifecycle suite, and #771's own design
       reaches box startup only for the alias profile and the startup probe."}]}

  - {id: socket_availability_gap_is_a_non_obligation, kind: behavior, form: clause,
     outcome: {nl: "A box with code execution can park an AF_UNIX socket in the tree and make
       the reap scan fail the whole run; that availability gap is deliberately NOT covered by
       the startup probe, because the probe's set is the ban's set and denying bind(2) would
       fault every box at startup."},
     binds: ["interacts(scrub->run_dir)", "alias_profile.domain"],
     rejected: [{nl: "Adding bind(2) to the deny set was rejected: it was executed twice and
       succeeds under the shipped profile, so denying it would fault every box; NO4's boundary
       is deliberate and is now load-bearing."}]}

  - {id: artifact_destruction_is_a_non_obligation, kind: behavior, form: clause,
     outcome: {nl: "The audit obligation is DISCHARGED AGAINST REDIRECTION ONLY. Emptying,
       replacing or removing an artifact with operations that alias nothing is out of scope: a
       box with code execution can always destroy what it can write, and the obligation this
       design carries is attributability against redirection, not durability. An artifact the
       box empties, rewrites or removes is detected by NO mechanism in this change — the reap
       scan permits any regular file, so a truncated or rewritten artifact is indistinguishable
       from an intact one. The scan's verdict marker therefore asserts that THE WALK COMPLETED,
       and never that contents are intact; a downstream consumer may not read it as the latter.
       That misreading is what would make this change worse than HEAD on this axis: before the
       marker existed the loss was silent, and a marker read as a contents-intact claim turns a
       destroyed tree into a certified one. The narrowing is now EXECUTABLE and not only stated:
       destruction_is_not_observed_by_the_verdict empties an artifact and asserts the tree still
       reads verified, so a change that starts observing destruction turns that test red and has
       to reopen this clause deliberately."},
     binds: ["run_dir", "interacts(tool_write_file->run_dir)", "interacts(scrub->run_dir)",
             "run_dir.access[host-read]"],
     rejected: [{nl: "Giving the obligation a real mechanism — comparing each artifact against a
       size or digest recorded outside the tree — would deliver what the obligation claims, but
       it needs durable state outside the shared tree, which reopens NO3's refusal to re-site
       artifacts, and that refusal is what keeps this change narrow. Recorded as the cost of
       this narrowing, not as an oversight. Re-siting the artifacts themselves was refused by
       NO3 on its own ground: the boxed agent's tools legitimately author into that tree.
       Leaving the narrowing as an unreviewed recommendation was also refused — this clause's
       scope was set at §7 D6 by the human, after the condition probe the judge attached to it
       was finally run."}]}
     # minted: §7 D6. The narrowing is DELIBERATE and is recorded with what the probe found,
     # not with what the judge recommended. The probe the judge made a condition and nobody ran
     # until phase F: nothing observes destruction. Combined with D2's verdict marker the
     # consequence inverts, which is why the wording above is load-bearing rather than
     # explanatory — the marker approved at the first seam certifies a destroyed tree unless
     # the clause says, in terms, what the marker does not assert.
     # Its premise is pinned executably by unmarked_tree_is_treated_as_unverified and
     # faulted_create_marks_its_tree, whose docstrings carry the same three sentences.
     # AND, AT §7 D10, BY ITS OWN TRIPWIRE — destruction_is_not_observed_by_the_verdict. Three
     # rounds observed that this clause was carried entirely by prose and none of them decided
     # it; the fourth seam did. The clause stays (it is the recorded no, with its rejected
     # alternative), and the test is what makes trimming it visible.

  - {id: live_container_from_an_earlier_run, kind: behavior, form: clause, provisional: true,
     outcome: {nl: "A container from an earlier run still alive when a later run dir is created
       is REFUSED, matching the existing refusal to reap a live container belonging to another
       run."},
     binds: ["start_box", "run_dir.identity"],
     cites: [P1, P4],
     rejected: [{nl: "Authored as a clause and not as a test deliberately: no ledger claim
       covers how such a container would be discovered, so a guard and its test built from the
       same wrong prior would be green together. THE PROBE THIS ONCE REQUESTED HAS NOW RUN
       (P1-P4, executed against a real daemon) and it narrows the clause without closing it.
       The pinned outcome is confirmed as already-the-behaviour for a container under the SAME
       name — it is refused, never reaped. What no claim covers is still a container running
       under some OTHER name over the same tree, which the name-keyed inspect cannot see. What
       changed is the cost of never seeing one: P4 tried to make a stale container reach a
       later run's tree and could not, so the exposure is bounded by two facts that are now
       pinned executably by live_run_dir_never_reused_and_stale_mount_never_follows rather
       than left as the accidents they were."}]}

  # ---- WAIVERS: the human's examined nos on scope (§7 D4) ---------------------
  - {id: gather_summary_render_frame, kind: negative, form: waiver,
     outcome: {nl: "Gather-summary content is model-chosen free text written verbatim with real
       newlines and no escaping; spliced into a rendered frame it could forge sibling
       structure. Not carried by #771 — M1-M4 touch the write path and the hazard is on the
       render path — and filed as a follow-up rather than left silent."},
     binds: ["interacts(gather_dispatch->run_dir)"],
     cites: [B11],
     rejected: [{nl: "Sanitizing at the writer was rejected as the wrong seam: the frame that
       would need escaping is the renderer's, and this writer is the one revision 1 already
       identified as the only one capable of line injection."}]}

  - {id: eval_harness_drivers_unmodelled, kind: survival, form: waiver,
     outcome: {nl: "Two eval-harness scripts each re-exec a subprocess that relocates the tree
       anchor onto wherever it runs. Neither STARTS A BOX, so neither is inside the threat model
       this change addresses, and both are recorded as an examined no rather than an unmodelled
       gap. The reason on record is deliberately NOT 'the mechanisms do not reach them': the fix
       is at the primitive, so every caller of the primitive gets it, including callers outside
       every box — a 3/3 consensus this run measured. They are out of scope because they run no
       box, not because the change does not reach them."},
     binds: ["defender_code_tree"],
     cites: [G2],
     rejected: [{nl: "Modelling them here was rejected as scope creep; leaving them unmodelled
       and unrecorded was rejected because an unmodelled driver is invisible to every rule."}]}
     # PHASE-F F5, TWICE OVER. The human's D4 said in their own words that these are recorded
     # as `actor_waivers` — the same word the residue entry used when it asked — and the
     # artifact carried only this waiver-form demand, which the execution-context check cannot
     # read. That check runs at write-code-from-spec §3, against the top-level `actor_waivers`
     # map, so the waiver would not have silenced the question it was written to silence and a
     # human would have been asked it again without the reasoning. The map is now present
     # below; this demand stays as the prose record of the decision.
     # And the reason itself was one this run had already measured false — corrected above.

# ============================================================================
# DESIGN-SILENT CONVERGED HEDGES — for the gate leaf to route (R0 holes, or
# `route: re-ground` where the question is fact-shaped). 45-dispositions.md
# names these nine as "bears on an obligation — for D to mint against": all
# three answerers converged that the DESIGN DOES NOT SAY, so there is no
# reading to encode and no fork to put to the human until it is decided.
# They are listed here, in the artifact, because the gate leaf reads this file
# and nothing else.
#
#  1. probe ordering against the pre-first-turn setup writers (the sentinel,
#     the budget setup, the session pointer) — M2's order among them is unstated.
#  2. the tree of a box that never started, consumed downstream.
#  3. a partial scrub-walk failure.
#  4. the scrub reclassifying an entry that changes between listing and inspection.
#  5. a container from an earlier run still alive when a later run dir is created.
#  6. the alias probe re-run after a transient box-start retry.
#  7. a repeated `seq` for one lead (folded into fork R3's collision class).
#  8. a write_file operand outside the ordinary string domain.
#  9. lead_id dual validation divergence — SETTLED, and no longer on this list: the
#     `route: re-ground` probe was dispatched and ran (claim G16). Two independently
#     authored checks, not one definition; minted as
#     lead_id_gates_agree_at_both_check_sites. Left in place so the count reconciles.
#
# Two further standing probe obligations from 45-dispositions must be dispatched
# BEFORE §7, not at phase E:
#  - whether any job in this project's automated environment actually starts a live
#    box, or the guard skips them all there (the demand list says two CI jobs register
#    the runtime; the brief says the guard skips every live box test in CI — both
#    cannot be operative). Fork R9 cannot reach the human until this is settled.
#  - whether circuit_breaker.json's consumer path escalates a write or read failure
#    toward a run-ending state, mirroring account_call's budget escalation (fork R24).
#  - whether `git checkout` writes THROUGH a symlink or replaces it, the question
#    already settled for os.replace by B5 (fork R19).
# ============================================================================

# ============================================================================
# STRUCTURE — the address space. `provenance: code` is the grounded
# neighborhood (census-backed; see the claims ledger); `design` is
# demand-implied and is what the delta scoping reads.
# ============================================================================
structure:

  # THE AXIS REGISTRY. Every key_axes / interpolates member below is one of these,
  # or a `derivations` value derived from one. Membership is R0-checked. Carried
  # from spec_graph_540 (run_id, lead_id, seq, alert_stem) and spec_graph_665
  # (batch_id, triggered_corpus) so the two committed box graphs and this one join.
  # `via` (540) is not used here; no boundary in this delta keys on it.
  axes: [run_id, lead_id, seq, alert_stem, batch_id, triggered_corpus]

  actors:
    # --- the lanes (compositions) ---
    - {id: run_lifecycle,      frame: composition, provenance: code}   # run.py _run_investigation_lifecycle — drives box start/stop around the investigation
    - {id: run_investigation,  frame: composition, provenance: code}   # driver.py — also the FAULT-path trace writer
    - {id: run_worktree_batch, frame: composition, provenance: code}   # the curator drain lane (spec_graph_665's id; 21-demands called it drain_batch)
    - {id: run_cycle,          frame: composition, provenance: code}   # learning/core/run_cycle.py — mounts all read-only (X16)
    - {id: ci_workflow,        frame: composition, provenance: design} # .github/workflows/ci.yml — an EXTERNAL DRIVER (schema.md's actor form), and it CHANGES here (X15). spec_graph_631 types it the same way.

    # --- the box lifecycle ---
    - {id: start_box,      frame: leg, provenance: code}   # spec_graph_540 minted it as `design`; it is code at c98bc86c. MODIFIED here: gains the profile and the probe.
    - {id: stop_box,       frame: leg, provenance: code}
    - {id: stop_and_scrub, frame: leg, provenance: code}
    - {id: scrub,          frame: leg, provenance: code}
    - {id: plant_sentinel, frame: leg, provenance: code}   # the shared per-mount sentinel plant — into EVERY mount source, uuid-suffixed, cleaned up (G10)

    # --- host-side writers into the shared tree while a box is alive (C1, re-derived) ---
    - {id: write_trace,        frame: leg, provenance: code}   # observe.write_trace — normal-exit tool_trace.jsonl
    - {id: observe_logger,     frame: leg, provenance: code}   # llm_requests.jsonl, per model request
    - {id: denial_logger,      frame: leg, provenance: code}   # policy_denials.jsonl, lazy open + append
    - {id: write_case_pointer, frame: leg, provenance: code}   # the session pointer, truncating write_text
    - {id: budget_enforcer,    frame: leg, provenance: code}   # locked touch+r+ +truncate; ALSO the _write_budget_atomic wrapper
    - {id: circuit_breaker,    frame: leg, provenance: code}   # same locked idiom, per infra-failure query
    - {id: query_tool,         frame: leg, provenance: code}   # executed_queries.jsonl + gather_raw/<lead>/<seq>.json
    - {id: gather_dispatch,    frame: leg, provenance: code}   # gather_summaries/<lead>.md — free text, newlines preserved (B11)
    - {id: claim_lead,         frame: leg, provenance: code}   # hooks/record_lead.claim_lead — C3-fix's second census addition
    - {id: record_lesson_load, frame: leg, provenance: code}   # lessons_loaded.jsonl via append_jsonl, on a READ path
    - {id: tool_write_file,    frame: leg, provenance: code}   # the model's gated write_file/edit_file — resolve-and-confine (X17)
    - {id: write_atomic,       frame: leg, provenance: code}   # _io.write_atomic — B4-unsafe, MODIFIED by M4/M3
    - {id: drain_restore,      frame: leg, provenance: code}   # the drain fault-path corpus restore (X9) — mkdir(parents) + write_bytes from an except around the agent call
    - {id: stray_discard,      frame: leg, provenance: code}   # `git checkout -- <rel>` subprocess into the worktree — a FLOOR LINE no static walk censuses

    # --- new, demand-implied ---
    - {id: enqueue_for_learning,      frame: leg, provenance: code}    # learning/core/markers.py, reached through run_common.enqueue_learning — the run's post-step that puts a finished tree into the learning loop. MODIFIED here (§7 D9): it gains the verdict read that makes D2's consumer half adopted rather than merely available.

    - {id: write_guarded,             frame: leg, provenance: design}  # M3's backstop primitive
    - {id: _probe_alias_ban,          frame: leg, provenance: design}  # M2's startup positive control
    - {id: lint_unguarded_tree_write, frame: leg, provenance: design}  # M3's C1-keyed lint

  boundaries:

    # ================= the two shared roots =================
    - id: run_dir
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "run_dir is $DEFENDER_RUNS_BASE/{run_id}/ minted by
            materialize_run_dir; run_id = f'{UTC ts}-{alert.stem}' or --run-id. Read off the
            mint site (spec_graph_540's reading, re-verified at c98bc86c by the resource
            trace declared under specGraph.resources.run_dir). Bind-mounted rw at the SAME
            absolute path inside the box, image root, no userns, rootfs --read-only,
            --network none, /tmp a 64m rw,noexec,nosuid tmpfs."}
          derivations:
            - {value: alert_stem, fn_of: run_id, injective: false}
          sharing: unique-key
        access:
          constraints_by_via:
            host-write: {trust: operator, constraints: [alias-refusing-primitive]}
                        # M3. The delta: today this cell enforces NOTHING — twelve+ writers
                        # in five idioms, none symlink-safe (B1/B2/B3/B4/B10).
            box-write:  {trust: attacker-influenced, constraints: [confine, alias-ban]}
                        # M1. The box owns the tree from inside as uid 0 (F9); the ban is
                        # what makes the alias unconstructible rather than merely gated.
            host-read:  {trust: operator, constraints: [scrub-gated]}
                        # #723's closed territory (NO2). X4 REFUTES the completeness of this
                        # gate: a teardown fault raised while an exception is in flight is
                        # swallowed and the scan never runs — the crash path, and the one
                        # most likely to hold what the box planted (fork R12).

    - id: drain_worktree
      provenance: code
      facets:
        identity:
          key_axes: [batch_id, triggered_corpus]
          evidence: {nl: "One Mount(source=wt, target=wt, writable=False) over the whole
            worktree leaf repo_root/.worktrees/{slug}-{batch_id}, plus rw mounts nested
            inside it — for the lesson-authoring role only the corpora whose own thresholds
            fired this tick, for the lead-authoring role the skills dir. Read off the drain
            box's geography builder (G11). The scrub walks the WHOLE worktree, so the scanned
            set strictly contains the writable set (F13, no-consequence — conservative
            direction)."}
          sharing: unique-key
        access:
          constraints_by_via:
            host-write: {trust: operator, constraints: [alias-refusing-primitive]}
            box-write:  {trust: attacker-influenced, constraints: [confine, alias-ban]}

    # ================= artifacts inside the roots that carry their own contract =====
    - id: budget_json
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "run_dir / 'budget.json', one file per run dir, incremented by MAIN
            and every GATHER subagent (spec_graph_631's reading). TWO IDIOMS write it and
            which one runs is selected by DEFENDER_BUDGET_ENFORCE: flag ON -> account_call ->
            write_atomic (tmp-then-replace, B4-unsafe, deterministic <name>.tmp); flag OFF ->
            update_budget_locked (touch + r+ + truncate under flock). G1/X12 — and X13 makes
            the flag-ON arm the CI-default path."}
          sharing: serialized-append
    - id: circuit_breaker_json
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "run_dir / 'circuit_breaker.json' under the SAME locked
            read-modify-write idiom as budget.json, written per infra-failure query and read
            back to decide whether the run treats infrastructure as failing. Neither design
            doc nor the demand list ever names its own escalation posture on a refused write
            (fork R24) — a standing probe obligation."}
          sharing: serialized-append
    - id: tool_trace_jsonl
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "run_dir / 'tool_trace.jsonl', written ONCE at exit by
            observe.write_trace and once more, as write_text(''), by the driver's
            trace-build fault path — two writers, one fixed name, both truncating. Read off
            the two call sites in C1's rows 1 and 2."}
          sharing: unique-key
    - id: gather_raw
      provenance: code
      facets:
        identity:
          key_axes: [lead_id, seq]
          evidence: {nl: "{run_dir}/gather_raw/{lead_id}.lead.json via claim_lead
            (O_CREAT|O_EXCL|O_WRONLY — a duplicate claim raises) and
            {run_dir}/gather_raw/{lead_id}/{seq}.json via the query tool, whose FIRST
            component is MODEL-NAMED. lead_id is alphabet-gated ^l-[A-Za-z0-9]+$ at claim
            and again at the gather seam, so it carries no traversal; seq is f'{int}'.
            Neither closes the plant: the box owns the tree from inside regardless of what
            the host interpolates. Read off both writer templates (spec_graph_540)."}
          sharing: unique-key
    - id: sentinel
      provenance: code
      facets:
        identity:
          key_axes: []
          evidence: {nl: "TWO plants, one helper (G10). The run-dir tier writes a FIXED
            '.box-sentinel' once after container create and before any model turn, and
            deliberately LEAVES IT BEHIND on a fault; the per-mount tier writes
            '.box-sentinel-<uuid4hex>' into every BoxRequest mount source — including the
            drain lane's read-only worktree root — and unlinks it on both the success and
            fault paths. key_axes is EMPTY and that is the finding, not an omission: nothing
            distinguishes two plants at the run-dir name, which is why a retry against a
            run_dir a prior failed start populated has no defined behaviour (fork R11). M2
            is charged with mirroring the sentinel and inherits whichever of these it copies
            (F11)."}
          sharing: unique-key

    # ================= the alias ban's own surfaces (new) =================
    - id: alias_profile
      provenance: design
      facets:
        payload:
          parts:
            - {role: default_action, source: "const:SCMP_ACT_ALLOW"}
            - {role: deny_rules,     source: "const:ALIAS_DENY_SYSCALLS"}
          invariants: [roles-disjoint-sources]
          nl: "The hand-written seccomp JSON shipped with the repo and passed as
            --security-opt seccomp=<file>. The CLI reads it CLIENT-SIDE and ships the JSON,
            so the path lives in the caller's namespace, not the daemon's, and it REPLACES
            the container's profile — there is no merge (probed external-tool semantics).
            A default-allow body with six SCMP_ACT_ERRNO rules; vendoring the platform
            default and appending was withdrawn because that default is not obtainable
            (X7 refuted, G9)."
        domain:
          type: enum
          refinement: {nl: "The syscall deny set. Each member must be individually
            demonstrated denied — five denied and one admitted is exactly the partial
            enforcement O2 refuses to grade. Deliberately NOT in the set: bind(2) on
            AF_UNIX, which succeeds under this exact deny set (X2/G5, executed twice) and
            leaves a socket the reap scan refuses — NO4's boundary, now load-bearing."}
          default: "SCMP_ACT_ALLOW"
          distinguished: [symlink, symlinkat, link, linkat, mknod, mknodat]
          falsy_valid: false
          documented_alternatives: []

    - id: oci_seccomp_registration
      provenance: design
      facets:
        access:
          constraints_by_via:
            ci_workflow:        {trust: operator, constraints: [oci-seccomp-flag]}
                                # X15: both CI jobs run `sudo runsc install` themselves and
                                # hard-fail unless the daemon then lists runsc — with no
                                # --oci-seccomp. This cell is the in-repo half and it MUST
                                # change in this PR or every box in CI faults on arrival.
            host_daemon_config: {trust: operator, constraints: [oci-seccomp-flag]}
                                # X19 CLOSED by G21 (executed against real runsc
                                # release-20260727.0): `runsc install -- --oci-seccomp`
                                # passes everything after `--` through as runtimeArgs, so
                                # the daemon entry gains runtimeArgs: ["--oci-seccomp"]
                                # beside the path key install always sets. This was the
                                # artifact's one formal `unknown`; it decided the content of
                                # BOTH the fault message and the CI change, and both now
                                # carry the literal rather than a guessed spelling.

    - id: box_argv
      provenance: code
      facets:
        access:
          constraints_by_via:
            _create_argv: {trust: operator, constraints: [alias-profile-attached]}
                          # the investigation lane's builder
            _render_argv: {trust: operator, constraints: [alias-profile-attached]}
                          # the GENERIC BoxRequest builder — drain AND learning run-cycle
                          # (C8-new/F12). A profile-path drift between the two ships one
                          # lane without the ban (fork R16).

    # ================= the knobs =================
    - id: BoxSpec
      provenance: code
      facets:
        domain:
          type: enum
          refinement: {nl: "The box runtime, dataclass-anchored, with one env var as its
            single lever; an unknown value raises at resolve. The runtime resolution point
            is PER-OVERLOAD — the run-dir overload resolves at the call, the request
            overload resolves inside the request's own factory, and an explicit spec beside
            a request is a TypeError. Any new profile knob must be threaded through BOTH or
            one lane silently ships without the ban."}
          default: runsc
          distinguished: [runsc, runc]
          falsy_valid: false
          documented_alternatives:
            - {value: runc, crosses_validation: true}
              # INVERTED against the usual reading, and worth stating: the ALTERNATIVE is
              # the verified lane (seccomp enforcement executed under runc twice — E1, X2),
              # while the SHIPPED DEFAULT is the one carrying E2, which holds on an executed
              # two-arm probe but is not re-runnable in this environment (no runsc registered
              # with this daemon). On runc the hand-written profile REPLACES a platform
              # default and is more permissive than it — an accepted cost (fork R6).

    - id: unboxed_opt_out
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "DEFENDER_ALLOW_UNSANDBOXED — unset means a box is REQUIRED; the
            loud opt-out value '1' returns an unboxed executor running the bash lane on the
            host (spec_graph_665's reading). MODIFIED here, which is why this boundary is
            provenance: design: F4 carves the ban-not-in-force fault out of the opt-out, so
            for the first time one startup fault is NOT survivable. No strictness rule exists
            for near-miss values — different case, whitespace, a trailing newline, '01' —
            and leniency on a security opt-out is the wrong direction (fork R22)."}
          default: ""
          distinguished: ["1"]
          falsy_valid: false
          documented_alternatives: []

    - id: DEFENDER_BUDGET_ENFORCE
      provenance: code
      facets:
        domain:
          type: bool
          refinement: {nl: "Read through env_bool, default False. Governs POSTURE, not
            tuning — and here it SELECTS WHICH OF TWO IDIOMS writes budget.json (X12).
            spec_graph_631 owns this domain and types it provenance: design because it was
            that change's delta; here it is grounded neighborhood, unchanged by this design,
            so it is code. Member spelling is 631's."}
          default: false
          distinguished: [unset, "false", "true", unrecognized]
          falsy_valid: true
          documented_alternatives: []
          # X13 REFUTED "a default run never exercises the unsafe idiom": both CI pytest
          # jobs set this to "1" for the whole collected suite, deliberately (#631 D11).

    # ================= the scan's verdict, sited by §7 D8 =================
    - id: scrub_verdict
      provenance: design
      facets:
        identity:
          key_axes: [run_id, batch_id]
          evidence: {nl: "ONE marker per scanned tree, named from that tree's own directory
            name and written BESIDE it — `<tree>.scrub-verdict.json`, the siting §7 D7 gave
            the alias-refusal record. The run-dir lane therefore keys on run_id and the drain
            lane on batch_id, because the tree's own identity is what the name interpolates;
            both axes are in the registry and neither is a second key for one tree. Read off
            D8's decision text, and pinned executably by
            verdict_is_sited_outside_the_judged_tree rather than read back from the
            implementation — a helper that asked the code where it put the marker would agree
            with the in-tree siting D8 rejected."}
          sharing: unique-key
        access:
          constraints_by_via:
            host-write: {trust: operator, constraints: [outside-the-judged-tree]}
                        # the scan is the only writer, and it writes outside what it walks
            host-read:  {trust: operator, constraints: [fail-closed-on-absence]}
                        # absence reads as unverified; PRESENCE is not fail-closed, which is
                        # what in_tree_verdict_is_never_authoritative exists to keep true

    # ================= facetless boundaries (no contract of their own here) =====
    - {id: quarantine_dir,          provenance: code, facets: {}}   # #747's preserve destination — the archive plus the manifest beside it, the one path whose job is handing a tainted tree to a human, and therefore where D8's accepted cost lands
    - {id: box_tmpfs,               provenance: code, facets: {}}   # the 64m rw,noexec,nosuid /tmp every argv builder adds — the only writable path on the read-only run-cycle lane (X16), and F6's provisional probe target
    - {id: learning_queue,          provenance: code, facets: {}}   # the learning state root — write_atomic callers OUTSIDE every box mount (G2)
    - {id: accounting_failures_json, provenance: code, facets: {}}  # run_dir.parent/<run>.accounting_failures.json — a write_atomic target SIBLING to the run dir, outside the bind (X6); the file the BudgetKill circuit records into (X14)
    - {id: defender_code_tree,      provenance: code, facets: {}}   # what the new lint reads
    - {id: intent_540,              provenance: code, facets: {}}   # defender/tests/intent_540.md — NO8 and C19's note (C7-new)
    - {id: runtime_sandbox_design,  provenance: code, facets: {}}   # runtime-sandbox-design.md §Filesystem isolation / §Network isolation (C7-new)

  interacts:
    # --- host-side writers into run_dir while the box is alive (the re-derived census) ---
    - {from: write_trace,        to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: run_investigation,  to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}   # the FAULT-exit trace write
    - {from: observe_logger,     to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: denial_logger,      to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: write_case_pointer, to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: budget_enforcer,    to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: circuit_breaker,    to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: query_tool,         to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: record_lesson_load, to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: gather_dispatch,    to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: claim_lead,         to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}
    - {from: start_box,          to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}   # the fixed .box-sentinel
    - {from: write_atomic,       to: run_dir, mode: write, via: fs,  provenance: code, interpolates: [run_id]}   # C3-fix's first census addition
    - {from: tool_write_file,    to: run_dir, mode: write, via: api, provenance: code, interpolates: [run_id]}   # gated: resolve-and-confine (X17)
    - {from: write_guarded,      to: run_dir, mode: write, via: fs,  provenance: design, interpolates: [run_id]}
    - {from: _probe_alias_ban,   to: run_dir, mode: write, via: subprocess, provenance: design, sends: payload, transport: subprocess, interpolates: [run_id]}
    - {from: scrub,              to: run_dir, mode: read,  via: fs,  provenance: code}

    # --- the scan's verdict, OUTSIDE both trees (§7 D8) ---
    # The scan stays a pure READER of the two shared roots; the only write it makes lands
    # beside them. That is what keeps it out of every run-dir writer census and out of the
    # lint's gate list without a hole — the D2-as-authored version was a run-dir write edge
    # that no census row, no gate entry and no profile line carried.
    - {from: scrub,              to: scrub_verdict, mode: write, via: fs, provenance: design, interpolates: [run_id, batch_id]}
    - {from: run_lifecycle,      to: scrub_verdict, mode: read,  via: fs, provenance: design}
    # §7 D9: the consumer that must actually CONSULT the marker. A verdict predicate nothing is
    # required to call discharges D2's clause on paper and leaves the run enqueued anyway.
    - {from: enqueue_for_learning, to: scrub_verdict,  mode: read,  via: fs, provenance: design}
    - {from: enqueue_for_learning, to: learning_queue, mode: write, via: fs, provenance: code, interpolates: [run_id]}
    - {from: run_worktree_batch, to: scrub_verdict, mode: read,  via: fs, provenance: design}
    - {from: run_worktree_batch, to: quarantine_dir, mode: write, via: fs, provenance: code, interpolates: [batch_id]}

    # --- the per-artifact contracts ---
    # These nine edges carry `provenance: design` and the tree-level edges above do not.
    # The split is schema.md's: the tree-level edges are the GROUNDED CENSUS (what exists),
    # while these are DEMAND-IMPLIED — M3 states one rule per idiom, and each of these is an
    # edge whose idiom the design replaces (rules.md's `modify` cell: "invariant field change
    # -> re-fire the facet's rule"). Delta membership is computed from `provenance: design`
    # alone, so a modify recorded as `code` is invisible to every rule — which is exactly
    # how the add-only reading goes blind on a property flip with no topology change.
    - {from: budget_enforcer, to: budget_json,          mode: write, via: fs, provenance: design, interpolates: [run_id]}   # locked read-modify-write, flag OFF -> gains O_NOFOLLOW
    - {from: write_atomic,    to: budget_json,          mode: write, via: fs, provenance: design, interpolates: [run_id]}   # tmp-then-replace, flag ON (the CI default) -> M4's rewrite
    - {from: circuit_breaker, to: circuit_breaker_json, mode: write, via: fs, provenance: design, interpolates: [run_id]}   # the same locked idiom, second artifact
    - {from: write_trace,       to: tool_trace_jsonl,   mode: write, via: fs, provenance: design, interpolates: [run_id]}   # replacing write -> create-exclusive-then-rename
    - {from: run_investigation, to: tool_trace_jsonl,   mode: write, via: fs, provenance: design, interpolates: [run_id]}   # the fault-exit write_text("") onto the same fixed name
    - {from: query_tool, to: gather_raw, mode: write, via: fs, provenance: design, interpolates: [lead_id, seq]}
    - {from: claim_lead, to: gather_raw, mode: write, via: fs, provenance: design, interpolates: [lead_id]}
    - {from: start_box,      to: sentinel, mode: write, via: fs, provenance: design}   # is .box-sentinel IN or OUT of M3's conversion? Undecided — fork R11.
    - {from: plant_sentinel, to: sentinel, mode: write, via: fs, provenance: design}

    # --- the second shared root, box alive (G11) ---
    - {from: plant_sentinel, to: drain_worktree, mode: write, via: fs,         provenance: code,  interpolates: [batch_id]}
    - {from: drain_restore,  to: drain_worktree, mode: write, via: fs,         provenance: code,  interpolates: [triggered_corpus]}
    - {from: stray_discard,  to: drain_worktree, mode: write, via: subprocess, provenance: code,  interpolates: [batch_id]}
    - {from: tool_write_file, to: drain_worktree, mode: write, via: api,       provenance: code,  interpolates: [batch_id]}
    - {from: write_guarded,  to: drain_worktree, mode: write, via: fs,         provenance: design, interpolates: [batch_id, triggered_corpus]}
    - {from: scrub,          to: drain_worktree, mode: read,  via: fs,         provenance: code}

    # --- the ban's own edges ---
    - {from: start_box, to: alias_profile, mode: invoke, via: subprocess, provenance: design, sends: payload, transport: subprocess}
    - {from: start_box, to: box_argv,      mode: write,  via: api,        provenance: design}
    - {from: start_box, to: BoxSpec,       mode: read,   via: env,        provenance: code}
    - {from: start_box, to: unboxed_opt_out, mode: read, via: env,        provenance: design}
    - {from: start_box, to: oci_seccomp_registration, mode: read, via: subprocess, provenance: design}
    - {from: ci_workflow, to: oci_seccomp_registration, mode: write, via: subprocess, provenance: design}
    - {from: _probe_alias_ban, to: box_tmpfs, mode: write, via: subprocess, provenance: design}
    - {from: run_investigation, to: DEFENDER_BUDGET_ENFORCE, mode: read, via: env, provenance: code}

    # --- write_atomic's callers outside every box mount (G2/X6) ---
    - {from: write_atomic, to: learning_queue,          mode: write, via: fs, provenance: code}
    - {from: write_atomic, to: accounting_failures_json, mode: write, via: fs, provenance: code}

    # --- the lint ---
    - {from: lint_unguarded_tree_write, to: defender_code_tree, mode: read, via: fs, provenance: design}

  drives:
    - {from: run_lifecycle,      to: start_box,         provenance: code,   multiplicity: serial}
    - {from: run_lifecycle,      to: run_investigation, provenance: code,   multiplicity: serial}
    - {from: run_lifecycle,      to: stop_and_scrub,    provenance: code,   multiplicity: serial}
    - {from: run_lifecycle,      to: enqueue_for_learning, provenance: code, multiplicity: serial}
    - {from: stop_and_scrub,     to: stop_box,          provenance: code,   multiplicity: serial}
    - {from: stop_and_scrub,     to: scrub,             provenance: code,   multiplicity: serial}
    - {from: run_worktree_batch, to: start_box,         provenance: code,   multiplicity: serial}
    - {from: run_cycle,          to: start_box,         provenance: code,   multiplicity: serial}
    - {from: start_box,          to: plant_sentinel,    provenance: code,   multiplicity: serial}
    - {from: start_box,          to: _probe_alias_ban,  provenance: design, multiplicity: serial}
    # writers driven over MANY invocations — R2's invocation clause, not its writer-count one
    - {from: run_investigation,  to: budget_enforcer,   provenance: code,   multiplicity: serial}
