             "drives(run_lifecycle->start_box)", "drives(run_worktree_batch->start_box)",
             "drives(run_cycle->start_box)"]}
     # C8-new: the second builder is the GENERIC request builder — drain AND learning
     # run-cycle. A demand written as "the drain box carries the profile" under-specifies
     # the surface (F12). Fork R16: resolve the profile path ONCE and assert both builders
     # carry the identical value — a drift there ships one lane without the ban.

  - {id: profile_denies_exactly_six, kind: shape, form: test,
     discharged_by: test_alias_profile_denies_the_six_syscalls_and_allows_everything_else,
     binds: ["interacts(start_box->alias_profile).payload", "alias_profile"]}
     # REOPENED AND REVERSED. C2-fix withdrew "vendor the platform default and subtract the
     # denials" on two grounds. The first stands and is the argument FOR deriving:
     # --security-opt seccomp=<file> REPLACES with no merge. The second — G9, "the daemon's
     # default is compiled in and undumpable" — is FALSE. The default profile is a JSON
     # document versioned as its own Go module (github.com/moby/profiles/seccomp) and vendored
     # verbatim into moby; it is pinnable by tag + digest and never needs dumping from a
     # running daemon. G9 confused "not dumpable from the daemon" with "not obtainable".
     # WHAT THE WITHDRAWAL COST, MEASURED: under the hand-written allow-all profile against a
     # real daemon (Docker 29.6.1, runc lane), unshare(CLONE_NEWUSER) SUCCEEDS and keyctl
     # returns ENOKEY — the errno of a syscall that reached the kernel. Both are EPERM under
     # the platform default. Fork R6's "accepted cost" was a container-escape surface, on the
     # lane where no sandbox absorbs it.
     # The shipped profile is now the platform default MINUS the six. NO5 is satisfied rather
     # than overturned: restoring the platform's own denials is the posture every box already
     # ran under before M1, not new general hardening.

  - {id: profile_does_not_widen_the_platform_syscall_surface, kind: shape, form: test,
     discharged_by: test_the_alias_profile_does_not_widen_the_platform_syscall_surface,
     binds: ["alias_profile"]}
     # minted: the demand fork R6 could not state. With no obtainable baseline it chose "assert
     # the six denials, do NOT assert that nothing else changed"; with the default vendored and
     # pinned, "nothing else changed" is a set equation over two files. Also carries the
     # derivation's drift gate — the shipped profile must be byte-exactly what the generator
     # produces, so a hand-edit cannot reintroduce an underived profile silently.
     # residual: a vendored allowlist denies every syscall NEWER than the pinned copy (the
     # clone3/faccessat2 breakage class). That is pin staleness, not widening, and it is why
     # the generator records the upstream tag, module version and digest rather than only bytes.
     # The two demands below close that residual against the LIVE daemon; this one closes the
     # widening question against the vendored document.

  - {id: profile_matches_the_live_daemon_default_but_for_the_ban, kind: behavior, form: test,
     discharged_by: test_the_profile_differs_from_the_live_daemon_default_by_exactly_the_ban,
     binds: ["alias_profile", "interacts(start_box->alias_profile).payload"]}
     # minted: every other guard on the derivation compares two documents WE control, so all of
     # them stay green when the daemon moves and the vendored copy stops describing it. No API
     # dumps a daemon's default profile, so this asks what the daemon DOES: the same witness set
     # attempted once with no --security-opt and once under the shipped profile, differing on
     # exactly the six. Same doctrine as M2's startup probe — enforcement OBSERVED, not trusted.
     # Witness members are unprivileged-reachable so a denial is attributable to seccomp and not
     # to a missing capability; `mount` is the instructive non-member (EPERM from the absent
     # CAP_SYS_ADMIN under every profile, so mute). MEASURED: the hand-written allow-all profile
     # differs from the daemon default on TEN members here (unshare succeeds; keyctl/add_key/
     # pivot_root return ENOKEY/EFAULT — errnos only a syscall that reached the kernel produces),
     # the derived profile on exactly six. Guarded on a reachable daemon only, NOT on
     # requires_real_box: it starts no box, so the levered runtime need not be registered.
     # residual: a sample, not a proof — no test can attempt every syscall.

  - {id: vendored_default_pin_tracks_the_daemon, kind: shape, form: test,
     discharged_by: test_the_vendored_default_pin_is_not_older_than_the_daemon,
     binds: ["alias_profile"]}
     # minted: the maintenance signal for the staleness residual, which is otherwise silent at
     # the point it matters and surfaces as an unexplained EPERM inside a box. DIRECTIONAL: an
     # older daemon is fine (dockerd ignores allowlist names its libseccomp does not know), a
     # newer one is the staleness case and the fix is a re-pin, not a code change.
     # Expected to go red when the runner's Docker is upgraded. That is the check working; the
     # job is advisory, so it reports rather than blocks.

  - {id: alias_profile_is_outside_every_box_writable_mount, kind: behavior, form: test,
     discharged_by: test_the_shipped_profile_sits_outside_every_box_writable_mount,
     binds: ["alias_profile", "box_argv.access[_create_argv]",
             "box_argv.access[_render_argv]", "run_dir.identity", "drain_worktree.identity"]}
     # minted: phase E (round-two re-run), from §7's instruction to treat D7/D8 as a RULE and
     # sweep. D7 moved the refusal record and D8 the verdict, both because a control's evidence
     # sat inside the boundary it polices. The same question asked of the ban's CONFIGURATION:
     # the profile is read client-side, so a box that could rewrite it would not weaken its own
     # container — it would leave the NEXT one unbanned, and the startup probe would report a
     # misconfiguration no operator introduced. Unreachable today only by where the file was
     # put, and the file's path is design-provenance and unfixed, so this is a spec obligation
     # rather than an observation.
     # Asserted against each lane's RENDERED mounts, not against a path convention: the drain
     # lane's writable set is batch-dependent (X16), so "is the profile inside one" is not a
     # static property either. Carries its own anti-vacuity check — a lane that rendered no
     # mounts at all would satisfy the containment test by having nothing to look at.
     # ROUND FOUR: THE REAL DRAIN LANE IS NOW RENDERED. The third lane was a synthetic request
     # built in the test over a temp directory, so the sweep certified its property on every
     # lane EXCEPT the one its own reasoning cites — a sweep skipping the case it was created
     # for, which is how this shape returned twice already. The production drain-box builder is
     # driven for one batch shape, and the check is made in the coordinates that can FAIL: the
     # lane's writable mounts sit inside a per-batch WORKTREE CHECKOUT of this repo at a temp
     # path, so an absolute-path comparison there can never fire whatever the profile's
     # location. Repo-relative it can: the drain box writes into a checkout and the lane's job
     # is opening a PR from it, so a profile under a triggered corpus is one the box can
     # rewrite AND get merged — the "leave the NEXT container unbanned" escape, laundered
     # through review.
     # ROUND FIVE: THE RULE IS SWEPT OVER ALL THREE OF ITS INSTANCES. The containment argument
     # is general — a file the drain box can rewrite is one the lane's PR can get merged, so any
     # file the ban's correctness rests on has to sit outside those mounts — while the demand
     # named exactly one. Two more qualify on identical reasoning and neither was pinned: the
     # WRITE LINT'S RATCHET BASELINE (ratchet a census row into it and the backstop stops gating
     # that writer, with no test turning red) and the CI WORKFLOW (it carries --oci-seccomp,
     # without which the shipped default runtime enforces nothing — C1-fix, executed). Neither
     # lands under a triggered corpus in any batch shape constructible today, which is the same
     # accident of placement that protected the profile. Applying a swept rule only to the case
     # that raised it is the fourth instance of that shape in this run; the arm now iterates the
     # dependency set, so a fourth member added later inherits the check.

  - {id: partial_enforcement_faults_the_box, kind: domain-outcome, form: test,
