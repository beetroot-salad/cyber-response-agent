    discharged_by: test_an_exempt_pair_is_recorded_as_a_first_class_pair_verdict_773
    seed_docstring: >-
      EXEMPT is a first-class PairVerdict value recorded wherever GOOD and BAD are — an exempt pair
      on a file whose sibling pair went terminal appears in that finding's ledger record with
      verdict EXEMPT.
    note: >-
      FK-13 (auto-resolved): O8 makes EXEMPT a way of SATISFYING O1, and a satisfied obligation that
      leaves no evidence cannot be audited. Also lets an operator tell 'refused' from 'out of
      scope', which are two different recoveries.

  - id: m3_check_index_fresh_on_retry
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
