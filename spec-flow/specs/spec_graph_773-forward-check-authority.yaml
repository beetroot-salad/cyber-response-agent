    seed_docstring: >-
      A rotation that expires against a busy appender leaves the queue exactly as it was — no row
      half-rotated, no counter half-bumped — and surfaces as a stuck tick, keeping the batch's
      attempt budget.
    note: >-
      FK-19, the promoted third premise. TimeoutError is deliberately outside RETIRE_SET (GL2): a
      busy lock is not the batch's fault.

