    - id: verify_batch_workers
      provenance: design
      facets:
        domain:
          type: int
          refinement: {nl: "LEARNING_VERIFY_BATCH_WORKERS — the fan-out width; `< 1` is refused"}
          default: 8
          distinguished: ["1"]
          # the serial boundary member. `0` is NOT falsy-valid: config.verify_batch_workers
          # (config.py:329-333) refuses anything below 1.
          falsy_valid: false
