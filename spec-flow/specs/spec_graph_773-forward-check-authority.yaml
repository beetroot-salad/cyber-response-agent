      A pair's retry mints a FRESH check_index, so the first attempt's verifier trace is not
      overwritten by the attempt that replaced it.
    note: >-
      FK-8 (auto-resolved to one drain-owned counter per tick, incremented on EVERY call). C1: the
      index is the trace's filename component.

  - id: m3_check_index_distinct_across_passes
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "check_index"
      - "verifier_trace"
    discharged_by: test_check_index_reused_across_both_verdict_passes_773
    seed_docstring: >-
      The same pair checked in pass 1 and again in pass 2 gets two DIFFERENT indices, so both traces
      survive and each of the gap record's two verdicts[] entries has an artifact behind it.
    note: >-
      FK-8. M4's whole value is pass 1's reasoning; a pair-scoped index would overwrite it.

  - id: m3_check_index_minting_is_atomic
    kind: negative
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "check_index"
      - "verify_batch_workers"
      - "verifier_trace"
    discharged_by: test_two_checks_in_the_same_tick_are_minted_the_same_check_index_773
    seed_docstring: >-
      No two checks fanned out in one tick share an index: minting is atomic, not merely sequential,
      so two concurrent workers cannot collide and lose one trace with no error.
    note: >-
      FK-8's sharpening — m3_check_index_is_drain_owned_and_unique asserted distinctness without
      saying under concurrency. POSITIVE CONTROL: m3_fanout_under_verify_batch_workers, same
      address, where the indices ARE observed and every pair gets its verdict.

  - id: m4_pass_two_rechecks_only_repair_touched_files
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "_changed_corpus_records"
      - "_snapshot_corpus"
      - "forward_check"
      - "PairVerdict"
    discharged_by: test_pass_two_re_checks_only_the_files_the_repair_spawn_changed_773
    seed_docstring: >-
      Pass 2 re-verdicts only files whose bytes changed between the tick-start snapshot and the
      point pass 2 runs — the files the repair spawn actually wrote. A pass-1 verdict on a file the
      repair spawn never touched carries forward unchanged.
    note: >-
      SUPERSEDES m4_pass_two_rechecks_every_changed_file per 70-resolutions.md FK-7 (DISSOLVED
      fork), which records that demand as one plausible-but-wrong reading rather than merely a wider
      one. It is not a tiebreak policy: an unedited file's pass-1 verdict is never re-evaluated, so
      there is nothing to overturn. It still catches S6's actual concern, the repair-spawn drive-by
      edit (s15).

  - id: m4_untouched_bad_pair_keeps_its_pass_one_verdict
    kind: behavior
    form: test
