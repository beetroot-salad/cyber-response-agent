    seed_docstring: >-
      A BAD pair the repair spawn left byte-for-byte untouched keeps its pass-1 BAD and is terminal:
      it is not re-submitted, so no second verdict exists to overturn it.
    note: >-
      FK-7, correcting RF-6's false mechanism claim — the file IS in the changed set, because the
      FIRST spawn dirtied it, so what stops a non-deterministic re-clear is the bytes-changed test,
      not changed-set membership.

  - id: m4_byte_identical_rewrite_is_not_a_change
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
