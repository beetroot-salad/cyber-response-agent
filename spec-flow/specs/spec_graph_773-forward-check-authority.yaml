# ==========================================================================================
# CLAIMS — every load-bearing statement about existing reality this spec rests on.
#
# 52: C1-C19 inherited from discuss-issue's sweep (verdicts as `10-brief.md` RE-PROBED them at
# base 3b4f5797), G1-G13 raised by the grounding leaf, KB1-KB7 (the seven config-knob rows the
# brief folded into its declared 39 = 19 + 13 + 7 — minted here so the fold reconciles),
# CE1-CE8 minted at extraction, P1-P3 the re-ground probe obligations phase C minted, and
# A1-A2 raised at assembly. Inherited ids are kept.
#
# TRANSCRIPTION DECISION (flagged in `50-graph-digest.md`, red flag 2): the instrument each
# claim ACTUALLY used is recorded as-is, and each claim is typed by WHAT ITS SENTENCE PREDICTS
# (rules.md: "if the sentence predicts behavior over an input, it is a behavior/primitive/
# reachability claim however it was filed"). Seven claims therefore record an instrument their
# kind does not admit — a behavior or reachability prediction closed on a read. They are NOT
# retyped to silence `spec-graph claims`; each is a probe obligation for the gate leaf's
# residue, and each says so in its own `note`.
# ==========================================================================================
claims:

  # --- inherited from the design doc's sweep (C1-C19), re-probed by 10-brief.md at 3b4f5797
  - id: C1
    kind: referential
    claim: "CheckContext (verify_forward/checks.py:17-30) is a frozen dataclass of eleven
      plain-value fields, and `check_index` is minted by the module-global `tool._CHECK_SEQ`
      (tool.py:23), spent at tool.py:120 and used at checks.py:59 as the verifier trace's
      filename component."
    probe: "read checks.py:17-30,59,71-87 and tool.py:23,120,123-137 at 3b4f5797"
    probe_kind: read
    observed: "as stated, including the check_index -> trace_name path at checks.py:59; the
      counter is a module global whose value becomes a filename, so two checks that share a
      value share a trace file"
    verdict: holds

  - id: C2
    kind: behavior
    claim: "`parse_verdict` (verify_forward/shared.py:7-17) returns 'GOOD' or 'BAD' and raises
      SystemExit on exactly two shapes — an unrecognised verdict token (:14) and a reply with no
      VERDICT line (:15) — while the surrounding reasoning text is read and discarded."
    probe: "read verify_forward/shared.py:1-18 (the full file) at 3b4f5797"
    probe_kind: read
    observed: "as stated, verbatim; two SystemExit raises, reasoning bound and dropped"
    verdict: holds
    note: >-
      INSTRUMENT FINDING, recorded not hidden: this sentence predicts what the code does over an
