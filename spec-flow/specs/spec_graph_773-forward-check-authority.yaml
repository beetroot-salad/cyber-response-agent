    # FK-2 -> o4_split_citation_finding_defers). The schema requires each entry name how it
    # was resolved and `resolved_by: human | auto` (rules.md; the artifact template). What
    # follows transcribes 70-resolutions.md verbatim by section — no new judgment made here.
    - "FK-1 (absorbs F1, F5) — RESOLVED, resolved_by: auto (dissolved, §7-B). commit_fn and git_commit are BYTE-FOR-BYTE UNCHANGED; a new, separate function (shared.commit_corpus_paths(message, cfg, approved_paths, deletion_paths)) carries M5's explicit-list commit, called directly by the drain, never through cfg.commit_fn. n4_sibling_lanes_unaffected is now safe-by-construction. Demand: d0_explicit_commit_is_a_new_function (supersedes the provisional d0_commit_fn_takes_path_list, which no longer exists in this graph). Closes the R1 commit_fn hole and the R7 questioner_curator->commit_corpus hole."
