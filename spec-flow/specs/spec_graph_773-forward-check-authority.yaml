    - id: RETIRE_SET
      provenance: code
      facets:
        domain:
          type: "tuple[type[Exception], ...]"
          refinement:
            nl: >-
              drain.py:73 — the fault classes that retire-and-requeue a batch. Everything outside
              it propagates through _undo_agent_edits into _tick's stuck-record guard.
          default: "AuthorError+GitError+ModelRetry"
          distinguished: ["AuthorError", "GitError", "ModelRetry"]
          falsy_valid: false
          documented_alternatives:
            - value: "StageAbort"
              crosses_validation: false
              # brief R3/F8: `StageAbort(Exception)` (config.py:383) is NOT a member — it
              # propagates. The shipped retire-and-requeue behaviour does NOT hold under it, and
              # that is the design's intent (O10).
            - value: "FatalConfigError"
