schema_version: 2
design: "773"   # gh issue #773 — "forward-check authority moves from the curator's tool to a
                # drain-owned gate". THE AUTHORITATIVE TEXT is `.spec-flow/00-intent-design.md`
                # (intent + design, settled 2026-09-13, supersedes the earlier fork list).
                # Assembled at phase D from `.spec-flow/frontiers/10-brief.md` (grounding),
                # `20-demands.md` (extraction) and `45-dispositions.md` (phase-C dispositions).
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`).
                        # check_binds scans docstrings NON-RECURSIVELY over `*.py` in this ONE
                        # directory, so every `discharged_by` below must land there, never under
                        # `tests/e2e/`. Planned phase-E modules, following the corpus's per-issue
                        # convention (`test_992_close_contract.py`, `test_947_triplet_archive.py`,
                        # `test_1047_grading_lane.py`):
                        #   defender/tests/_spec773.py                    (builders + fakes:
                        #       a fake ForwardCheck, a fake curator spawn, a queue/corpus fixture)
                        #   defender/tests/test_773_verdict_pass.py       (M3.3/M3.4, O1, O6)
                        #   defender/tests/test_773_commit_list.py        (M5, O2, O4, O5)
                        #   defender/tests/test_773_gap_ledger.py         (M6, O3, the report)
                        #   defender/tests/test_773_repair_pass.py        (M4/D1, S4, S6)
                        #   defender/tests/test_773_deferral.py           (M7, O9)
                        #   defender/tests/test_773_tool_removal.py       (M1, M2, O7, O10)
                        # NONE OF THESE EXIST YET — phase E writes them. Every `discharged_by`
                        # below is therefore a dangling pointer today, which is `spec-graph binds`'
                        # expected reading of a phase-D artifact, not a finding to fix here.
base: 3b4f5797  # `git log -1 --format=%H` == `git merge-base HEAD origin/main` ==
                # 3b4f57976ccc916670e4e890083c2ae958d7e3d9 (claim A1). Every file:line anchor
                # carried out of `10-brief.md` was probed against this tree; the design doc's own
                # base was `a77335d5` and the brief re-verified all 19 inherited claims against
                # 3b4f5797 with none refuted.

# ==========================================================================================
# READ THIS FIRST — how this graph is organised, and what it deliberately does NOT decide
#
# demands   — 153. The 65 resolved demands of `20-demands.md` (ids kept VERBATIM; 21 `binds`
#             addresses re-pointed by the name reconciliation below), then 88 `sNN_*` demands
#             minted one-per-SETTLED-ASSERTION from `45-dispositions.md` (91 settled, minus 3
#             whose own disposition says no demand is owed — each named in `handoff.drops`).
#             Each settled demand is `discharged_by` the premise's OWN test name, so phase E's
#             author and phase F's premise-disposition conservation join by name.
#             The 48 forks and 11 silent branches mint NO demand here. They are §7's. Where a
#             fork's outcome would determine an invariant field, that field is written
#             `unknown` with the fork id beside it; where it would decide whether a value is
#             exercised, the value is modelled as a `distinguished` member or a
#             `documented_alternatives` entry, so the gate computes a hole per open arm and the
#             residue names the fork rather than the author silently picking a side.
#             64 of the 65 extracted demands are `form: test`; `lock_order_unchanged` is the one
#             deliberate `form: clause` (20-demands.md records the downgrade: a test asserting
#             the LOCK_ORDER tuple pins a constant against itself). A clause does NOT
#             pre-discharge an obligation — if the gate obligates `LOCK_ORDER`, that is a real
#             open obligation, by design.
# structure — the demand-implied address space (`provenance: design`) attached to the grounded
#             neighbourhood (`provenance: code`) `10-brief.md` established: SR1's seven corpus
#             writers and its membership readers, SR2's queue writers and the wake gate, SR3's
#             host-side pending dir (UNDECLARED in the project profile before this run — see
#             claim A2 and the profile commit), SR4's runs dir — which this graph records as a
#             WRITE root, not the read-only one the design's own asset list calls it (FK-31),
#             because `checks.py:59` names a verifier trace under it — and the three sibling
#             commit lanes (questioner, pitfalls, lead-author) that N4 declares untouched while
#             M5 changes the primitive all four of them read.
#             Change kinds are assigned FROM THE DESIGN, not from a diff (rules.md, Procedure):
#             `provenance: design` marks the delta, `mode: remove` marks the two subtractions
#             (the curator's tool edge, the preflight's old home).
# claims    — 52. The doc's inherited C1-C19 (verdicts as `10-brief.md` re-probed them at this
#             base), the brief's own G1-G13, the seven knob rows the brief folded into its count
#             (minted here as KB1-KB7 so 19+13+7 = the brief's declared 39 reconciles), the
#             extraction's CE1-CE8, the three re-ground probe obligations `45-dispositions.md`
#             minted (P1-P3, `verdict: unprobed`), and two raised at assembly (A1, A2).
#             Inherited ids are kept. TRANSCRIPTION DECISION, flagged in `50-graph-digest.md`:
#             the instrument each claim ACTUALLY used is recorded as-is, so the claims typed
#             `behavior` that closed on `probe_kind: read` (CE3, CE4-adjacent, C15's re-execution
#             excepted) stay visible as the findings `spec-graph claims` will call them. They are
#             not retyped to silence the check.
# gate      — DELIBERATELY ABSENT. The assembler does not write `gate:`; the gate leaf
#             (phases/graph-gate.md, "Charge — the gate leaf") runs `spec-graph gate --residue`
#             over this file and writes `gate.evaluated`, `obligations`, `holes` and
#             `pre_discharged` into it. A `gate:` block written here would be an answer invented
#             before the question was computed.
# handoff   — seeded by this pass with the drops (32 premise drops + 3 settled drops), the fork
#             inventory, the deferred claims and the deviations this run knows about. §7 and the
#             gate leaf extend it.
#
# NAME RECONCILIATION — three coining passes (grounding, extraction, dispositions), unified
# here by role+origin. Left column: the spelling an input frontier used. Right: this graph's id.
#   `forward_check.run`                          -> `forward_check`
#         `run` is a field of the ForwardCheck dataclass, not an address the gate grammar can
#         resolve; the boundary IS the configured check seam and its `.response` carries the
#         return-type widening.
#   `CorpusAuthorConfig.forward_check|exempt|repair_prompt|repo_lock_wait_seconds`
#         -> `forward_check` / `exempt` / `repair_prompt` / `repo_lock_wait_seconds`
#         The module-qualified spelling parses to root `CorpusAuthorConfig` in the address
#         grammar, which would let a demand on ONE config field answer a trigger on another.
#         The code threads each as `cfg.<field>`; the field name is the id.
#   `CorpusAuthorConfig.exempt.domain.distinguished[family]`
#         -> `direction.domain.distinguished[family]`
#         The exempt predicate is `skips_forward_check`, whose whole body is
#         `row.get("direction") == "family"` (checks.py:94-106). The DOMAIN being exercised is
#         the queue row's `direction`, not the predicate; modelling it on the predicate hid the
#         missing-field and out-of-vocabulary members (dispositions 61 and 63).
#   `CheckContext.lesson_text` / `.check_index` / `.source_id`
#         -> `lesson_text` / `check_index` / `source_id`
#         The three CheckContext fields that are load-bearing on their own (the checked bytes,
#         the trace-filename axis, the runs-dir path component) become boundaries; `CheckContext`
#         stays as the frozen-dataclass seam and names them as its payload's slots.
#   `AgentDeps.tool_config`                      -> `tool_config`
#   `LoopPaths.pending_dir`                      -> `pending_dir`
#   `retire.deferrals` / `retire.attempts`
#         -> `retire.domain.distinguished[deferrals]` / `[attempts]`
#         `counter_key` is a real domain with two members (`"attempts"` default,
#         `"offers_declined"` the one non-default site today, `"deferrals"` the one M7 adds);
#         modelling the counters as bare boundaries lost the per-member exercise R4 computes.
#   `interacts(author_and_rotate->repair_curator).payload`
#         -> `interacts(author_and_rotate->repair_user_turn).payload`
#         `repair_curator` is an ACTOR; `interacts` lands on a boundary. The repair spawn's user
#         turn is the payload-bearing boundary (S4's `wrap()` envelopes are its parts), and the
#         spawn itself is `drives(author_and_rotate->repair_curator)`.
#   `persist._rotate_queue` (the design doc's spelling, brief R2) -> `rotate_queue_locked`
#         `_rotate_queue` names nothing in the tree; the rewriter is `persist._rewrite_queue`
#         and the drain only ever reaches it through `persist.rotate_queue_locked`.
#   `source_id` (CheckContext) == `row.run_id` (the queue) == `run_dir.name` — ONE AXIS,
#         declared once as `run_id`. The boundary `source_id` is the CheckContext field whose
#         PROVENANCE the design changes (model-emitted -> queue-sourced, S3); the axis is the
#         value both spellings carry.
#   Axis names: `finding_id`, `lesson_stem` (brief: "lesson stem (model-chosen)"; demands:
#         "rel_path"), `run_id`, `check_index`, `batch_id`, `channel`, `pass_no` — every one
#         declared once in `structure.axes`, which is the registry R0 checks `key_axes` and
#         `interpolates` membership against.
# ==========================================================================================

demands:

  # ========================================================================================
  # DEMAND #0 — the return-value / output-shape contract (20-demands.md, "Demand #0")
  # Every scenario below asserts against these shapes. `provisional: true` marks a shape the
  # design does not pin; each names its fork.
  # ========================================================================================

  - id: d0_check_returns_verdict_and_reasoning
    kind: behavior
    form: test
    source: "20-demands.md demand #0"
    binds:
      - "forward_check"
      - "interacts(author_and_rotate->forward_check).response"
    discharged_by: test_forward_check_run_returns_verdict_and_reasoning_773
    seed_docstring: >-
      ForwardCheck.run(ctx) returns a (verdict, reasoning) pair whose verdict is GOOD or BAD and
      whose reasoning is the verifier's own text; EXEMPT is never returned by the check — the
      drain mints it from cfg.exempt(row).
    note: >-
      CE4 probed the widening's real blast radius: `raw` is bound and discarded inside `_verify`,
      so the tuple reaches `_run_findings` only if BOTH functions change, not just the type alias.

  - id: d0_pair_verdict_shape
    kind: shape
    form: test
    source: "20-demands.md demand #0 (verdict domain was fork F2 / FK-13, RESOLVED)"
    binds:
      - "PairVerdict"
      - "PairVerdict.identity"
    discharged_by: test_pair_verdict_carries_path_finding_source_verdict_reasoning_and_pass_773
    seed_docstring: >-
      Each (file, finding) pair checked in a pass yields one PairVerdict carrying rel_path,
      finding_id, source_id, verdict, reasoning and pass_no; verdict is one of GOOD, BAD, EXEMPT,
      and a pair whose check errored twice is BAD with reasoning prefixed 'forward_check_error: '.
    note: >-
      PHASE F CORRECTION: this note was stale, still framing F2/FK-13 as open after §7 resolved
      it. F2/FK-13 RESOLVED (resolved_by: auto, 70-resolutions.md §7-D): EXEMPT is a first-class
      PairVerdict value, recorded wherever GOOD/BAD are — already reflected in this demand's own
      seed_docstring above. The R0-flagged fourth 'error-degraded pair' member was dropped by
      FK-9's dissolution (a call that never completes never reaches PairVerdict construction at
      all); PairVerdict's domain stays GOOD/BAD/EXEMPT, no `crosses_validation: unknown`
      alternative remains open. FK-14's `rel_path` per verdicts[] entry is a separate address
      (the gap-LEDGER record's verdicts[] list, not this in-memory shape, which already carries
      `rel_path` per Data model) — see d0_gap_record_shape's note.

  - id: d0_approved_terminal_deferred_shape
    kind: shape
    form: test
    source: "20-demands.md demand #0"
    binds:
      - "PairVerdict"
      - "interacts(author_and_rotate->commit_fn).payload"
      - "interacts(author_and_rotate->forward_bad_ledger).payload"
    discharged_by: test_a_tick_derives_approved_terminal_and_deferred_from_pair_verdicts_773
    seed_docstring: >-
      One tick derives, in memory, approved as a set of repo-relative paths, terminal as a mapping
      from finding_id to that finding's PairVerdicts, and deferred as a list of finding_ids — and
      the commit, the ledger and the rotation each read exactly one of them.

  - id: d0_explicit_commit_is_a_new_function
    kind: seam
    form: test
    source: "20-demands.md demand #0, as CORRECTED by 70-resolutions.md section G / FK-1"
    binds:
      - "commit_fn"
      - "git_commit"
      - "commit_corpus"
      - "interacts(author_and_rotate->commit_fn).payload"
    discharged_by: test_the_drains_explicit_list_commit_is_a_new_function_beside_an_unchanged_commit_fn_773
    seed_docstring: >-
      M5's explicit-list commit is a NEW, SEPARATE function —
      shared.commit_corpus_paths(message, cfg, approved_paths, deletion_paths) — called directly
      by _author_and_rotate's M5 step and never through cfg.commit_fn; commit_fn's seam
      ((message, cfg) -> str | None) and git_commit's single-pathspec signature are byte-for-byte
      unchanged.
    note: >-
      SUPERSEDES the provisional `d0_commit_fn_takes_path_list`, which read demand #0 as widening
      `commit_fn`/`git_commit` to take a path list. §7 (70-resolutions.md, FK-1 and section G)
      REJECTED that reading: widening the shared seam leaves all four lanes carrying a signature
      that COULD take a path list though three never pass one — a latent coupling — while a
      separate function makes "untouched" a build-time fact. `n4_sibling_lanes_unaffected` is
      safe-by-construction under this reading, not merely observed. The function's NAME is pinned
      by phase E (80-author-digest.md records the choice and its §7 warrant: the resolution's own
      first example spelling, in the module that already owns `commit_corpus`).

  - id: d0_empty_list_returns_none_without_git
    kind: behavior
    form: test
    source: "20-demands.md demand #0"
    binds:
      - "git_commit"
      - "git_commit.domain.distinguished[empty-list]"
      - "interacts(author_and_rotate->commit_fn).payload"
    discharged_by: test_an_empty_approved_list_commits_nothing_and_invokes_no_git_773
    seed_docstring: >-
      With an empty path list the commit step returns None and runs no git command at all — an
      empty pathspec would otherwise commit the whole index (C15, re-executed in the brief's F1).

  - id: d0_gap_record_shape
    kind: shape
    form: test
    source: "20-demands.md demand #0 (verdicts[] membership was fork F3 / FK-14, RESOLVED)"
    binds:
      - "interacts(author_and_rotate->forward_bad_ledger).payload"
      - "forward_bad_ledger"
    discharged_by: test_a_gap_record_carries_finding_run_direction_batch_path_text_verdicts_and_time_773
    seed_docstring: >-
      One JSONL record per terminal finding carries finding_id, run_id, direction, batch_id,
      lesson_path, lesson_text, recorded_at, and a verdicts list whose entries each carry pass,
      source_id, verdict and reasoning.
    note: >-
      PHASE F CORRECTION: this note was stale, still framing F3/FK-14 as unresolved after §7
      decided it. F3/FK-14 RESOLVED (resolved_by: auto, 70-resolutions.md §7-D): add `rel_path`
      to each verdicts[] entry, top-level `lesson_path` stays the terminal (pass-2) location,
      ledger written once after both passes settle, in pass order. This demand's own
      seed_docstring above was not widened to add `rel_path` — that half of FK-14 is discharged
      by the sibling settled-assertion test
      `test_a_ledger_record_for_a_finding_refused_in_both_passes_on_two_different_files_773`,
      which asserts `rel_path` per `verdicts[]` entry directly and cites FK-14 by name.

  - id: d0_verdict_error_class
    kind: seam
    form: test
    source: "20-demands.md demand #0"
    binds:
      - "VerdictError"
      - "parse_verdict"
    discharged_by: test_parse_verdict_raises_verdict_error_not_system_exit_773
    seed_docstring: >-
      An unparseable or unrecognised verifier reply raises VerdictError, a RuntimeError subclass
      an except-Exception handler can catch, where today it raised SystemExit.
    note: >-
      C2 re-verified the two SystemExit raises at shared.py:14-15. FK-11 would add a third
      unparseable shape (two conflicting VERDICT lines); recorded as a fork, not minted here.

  - id: d0_config_fields
    kind: seam
    form: test
    provisional: false
    source: "20-demands.md demand #0 (base-vs-subclass placement was fork F6 — SETTLED, §7-I)"
    binds:
      - "forward_check"
      - "exempt"
      - "repair_prompt"
    discharged_by: test_corpus_author_config_carries_forward_check_exempt_and_repair_prompt_773
    seed_docstring: >-
      CorpusAuthorConfig carries forward_check (a ForwardCheck or None), exempt (a predicate over
      a queue row) and repair_prompt (a Path or None), and the drain reads the check only from
      the config.
    note: >-
      PROVISIONAL FLAG CLEARED at §7-I (phase-F repair, mechanical finding #2). The flag marked
      fork F6 — base CorpusAuthorConfig vs. a lessons-only subclass — as an open placement
      question, and the settling citation is THE DESIGN'S OWN M2 TEXT, which states the placement
      outright rather than leaving it to be read off: "M2. Per-channel check on the config.
      `CorpusAuthorConfig` gains `forward_check: ForwardCheck | None` and `exempt: Callable[[dict],
      bool]` (lessons: `FINDINGS_CHECK`, `skips_forward_check`; questioner: `None`,
      `lambda r: True`)" (.spec-flow/00-intent-design.md:43). The parenthetical is the load-bearing
      half: it gives BOTH channels' values for the same two fields, which only a field on the class
      both channels build from can carry — and the grounding brief confirms CorpusAuthorConfig is
      that base config class, not a lessons-only subclass. So this was never a genuine fork with
      two live readings; it was a defensive flag on an already-answered question, and phase E's
      suite was already written to the answer. repair_prompt joins them on the base, defaulting to
      None, which is what the questioner scene's `repair_prompt=None` wiring exercises.

  # ========================================================================================
  # OBLIGATIONS O1-O10 (20-demands.md, "Demands — obligations O1-O10")
  # ========================================================================================

  # --- O1: no lesson committed without a passing verdict on the exact bytes, for every cited
  #         finding of this batch, whatever bucket the curator reported it under
  - id: o1_bad_pair_blocks_its_file
    kind: behavior
    form: test
    source: "20-demands.md O1"
    binds:
      - "interacts(author_and_rotate->forward_check).response"
      - "interacts(author_and_rotate->corpus_dir)"
      - "interacts(author_and_rotate->commit_fn).payload"
      - "PairVerdict.domain.distinguished[BAD]"
    discharged_by: test_a_bad_pair_keeps_its_file_out_of_the_commit_and_the_tree_773
    seed_docstring: >-
      With a fake verifier answering BAD for one (file, finding) pair, that file is absent from
      the commit and absent from the working tree at the end of the tick.
    rejected:
      - nl: >-
          Committing the file with a quarantine marker (N2) — retrieval ignores `status:` (C10),
          so a marker would not stop the lesson loading.

  - id: o1_checked_bytes_are_the_committed_bytes
    kind: behavior
    form: test
    source: "20-demands.md O1"
    binds:
      - "interacts(author_and_rotate->corpus_dir)"
      - "lesson_text"
    discharged_by: test_a_file_edited_after_its_check_does_not_commit_on_the_pre_edit_verdict_773
    seed_docstring: >-
      The verdict is computed on the bytes on disk at check time, and a file whose bytes changed
      after its passing verdict does not reach the commit on that verdict.

  - id: o1_pairs_span_every_bucket
    kind: behavior
    form: test
    source: "20-demands.md O1"
    binds:
      - "interacts(author_and_rotate->forward_check).payload"
      - "AUTHOR_RESULT"
      - "FINDINGS_BUCKETS.domain.distinguished[consumed_skip]"
    discharged_by: test_a_file_citing_a_consumed_skip_finding_is_checked_against_that_finding_773
    seed_docstring: >-
      A committed file that cites a finding the curator reported under consumed_skip is still
      checked against that finding's case before it can be approved.

  - id: o1_approved_iff_all_pairs_good_or_exempt
    kind: behavior
    form: test
    source: "20-demands.md O1"
    binds:
      - "PairVerdict"
      - "PairVerdict.domain.distinguished[GOOD]"
      - "PairVerdict.domain.distinguished[EXEMPT]"
      - "interacts(author_and_rotate->commit_fn).payload"
    discharged_by: test_a_file_is_approved_only_when_every_one_of_its_pairs_is_good_or_exempt_773
    seed_docstring: >-
      A file with two pairs is approved when both are GOOD, when one is GOOD and one EXEMPT, and
      is not approved when either is BAD.
    note: >-
      This is the demand that inverts `prompt.md:177` ("keep the GOOD edit" on a mixed file,
      brief R4/F13). The inversion is pinned, never assumed.

  # --- O2: the commit names exactly the approved files plus curator deletions, by path list
  - id: o2_commit_list_is_approved_plus_deletions
    kind: behavior
    form: test
    source: "20-demands.md O2"
    binds:
      - "interacts(author_and_rotate->commit_fn).payload"
      - "git_commit"
    discharged_by: test_the_commit_names_the_approved_files_and_the_curator_deletions_and_nothing_else_773
    seed_docstring: >-
      git show --name-only HEAD after the tick lists exactly the approved corpus files plus the
      corpus files the curator deleted — no more and no fewer.
    note: >-
      The paired POSITIVE CONTROL for `o2_nothing_outside_the_corpus` and
      `o5_no_model_string_reaches_a_path` (rules.md: a negative without a positive control on the
      same address passes vacuously).

  - id: o2_nothing_outside_the_corpus
    kind: negative
    form: test
    source: "20-demands.md O2"
    binds:
      - "interacts(author_and_rotate->commit_fn).payload"
      - "interacts(author_and_rotate->repo_root)"
    discharged_by: test_a_dirty_file_outside_the_corpus_never_enters_the_commit_773
    seed_docstring: >-
      With an unrelated file dirty outside defender/lessons/, the commit contains no path outside
      the corpus directory.
    note: "positive control: o2_commit_list_is_approved_plus_deletions"

  - id: m5_curator_deletions_ride_the_list
    kind: behavior
    form: test
    source: "20-demands.md O2 / M5"
    binds:
      - "interacts(author_and_rotate->commit_fn).payload"
      - "_changed_corpus_records"
    discharged_by: test_a_curator_deletion_under_the_corpus_is_named_in_the_commit_list_773
    seed_docstring: >-
      A lesson the curator rm'd under the corpus is named in the commit's path list and is gone
      from HEAD, even though _changed_corpus_records excludes deletions (C17).
    note: >-
      RF-2 (dispositions) and RF4 (extraction), unmoved by phase C: the deletion list has NO
      stated source. This demand pins the outcome with no mechanism under it — the collector is
      a design hole for §7, recorded as such rather than invented here.

  # --- O3: a terminal BAD is consumed here with its gap record, written before rotation
  - id: o3_terminal_finding_consumed_forward_bad
    kind: behavior
    form: test
    source: "20-demands.md O3"
    binds:
      - "pending_queue"
      - "consumed_jsonl"
      - "consumed_jsonl.domain.distinguished[consumed_forward_bad]"
    discharged_by: test_a_terminal_bad_finding_leaves_the_pending_file_as_consumed_forward_bad_773
    seed_docstring: >-
      After a tick whose only verdict was BAD through both passes, the finding is gone from the
      pending file and present in consumed.jsonl with consumed_category == 'consumed_forward_bad'.
    rejected:
      - nl: >-
          Guaranteeing the finding never returns (N7) — the appender's idempotency reads only the
          pending file (judge/enqueue.py:211-216), so a producer re-minting the same finding_id
          re-enters it, as for every consumed category today.
    note: >-
      G3/G4: `consumed_forward_bad` exists nowhere in defender/ today, and `_project` writes
      `rec["consumed_category"] = bucket.name` verbatim (drain.py:525) — so the bucket's NAME is
      its category string; the two cannot be spelled apart (F19).

  - id: o3_ledger_written_before_rotation
    kind: behavior
    form: test
    source: "20-demands.md O3"
    binds:
      - "interacts(author_and_rotate->forward_bad_ledger)"
      - "pending_queue"
    discharged_by: test_the_gap_record_is_written_before_the_queue_rotates_773
    seed_docstring: >-
      A crash injected between the ledger append and the rotation leaves the gap record on disk
      with the row still pending — never a consumed row with no record.

  - id: o3_record_carries_reasoning
    kind: behavior
    form: test
    source: "20-demands.md O3"
