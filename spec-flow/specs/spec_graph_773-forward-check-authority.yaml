    seed_docstring: >-
      A commit that already landed is never undone by a later rotation failure: the tick fails
      loudly, the tree is correct, and the queue is stale until a retry.
    note: >-
      70-resolutions.md FK-19(1) (auto-resolved). M5's commit precedes the closing rotation, so the
      window is real; this is the only outcome that does not require a new rollback mechanism, and
      undoing the commit would delete lessons already in history.

  - id: m7_deferral_bump_is_atomic_with_its_lock
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "retire"
      - "retire.domain.distinguished[deferrals]"
