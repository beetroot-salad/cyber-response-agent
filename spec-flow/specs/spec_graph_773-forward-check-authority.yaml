    # 70-resolutions.md resolved all 34 (plus F6, F8) and phase E's suite correctly
    # implements every resolution (verified against the actual demands/tests: FK-1 ->
    # d0_explicit_commit_is_a_new_function, FK-27 -> the questioner negative control,
    # FK-7 -> m4_pass_two_rechecks_only_repair_touched_files, FK-6 ->
