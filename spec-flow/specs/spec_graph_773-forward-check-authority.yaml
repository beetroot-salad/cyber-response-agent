      - "pending_queue"
    discharged_by: test_repo_lock_wait_exceeded_specifically_on_the_deferral_bump_773
    seed_docstring: >-
      The deferral bump is atomic with its lock acquisition: a timeout leaves the counter exactly
      where it was, and the retry that follows cannot double-bump it.
    note: >-
      70-resolutions.md FK-19(2) (auto-resolved). This is the property O9's ceiling depends on — a
      double bump graveyards a finding early, which O9 calls a violation in the other direction.

  - id: m7_expired_rotation_leaves_the_queue_unchanged
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "rotate_queue_locked"
      - "pending_queue"
      - "stuck_report"
      - "RETIRE_SET"
