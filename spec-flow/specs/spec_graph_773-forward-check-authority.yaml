  - id: o3_failing_ledger_append_leaves_no_consumed_row
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "forward_bad_ledger"
      - "consumed_jsonl"
      - "pending_queue"
      - "rotate_queue_locked"
    discharged_by: test_gap_ledger_append_raises_an_io_error_773
    seed_docstring: >-
      A failing ledger append PROPAGATES: it aborts the tick before the rotation, the corpus is
      restored, the row stays pending, and the batch is re-authored next tick — a finding is never
      consumed with no gap record.
    note: >-
      70-resolutions.md FK-20 (auto-resolved). O3's ordering exists precisely so that no consumption
      outruns its record, and a retry loop inside the repo lock is the wrong place to be patient.

  - id: o4_split_citation_finding_defers
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "pending_queue"
      - "consumed_jsonl"
      - "retire.domain.distinguished[deferrals]"
      - "held_report"
    discharged_by: test_a_finding_cited_by_one_approved_file_and_one_refused_file_773
    seed_docstring: >-
      A finding cited by two or more files that disagree about approval this tick is added to the
      DEFERRED set (M7) — never to the committed set and never to the forward_bad set — and reports
      the same way any other O9 deferral does. The approved file itself still commits.
    note: >-
      MATERIAL FORK, HUMAN DECISION (70-resolutions.md section A, FK-2): the human took neither
      offered priority. The drain never has to guess between two legitimate-but-incomplete pictures,
      and never produces the 'committed in git, refused in the ledger' state the safer option
      accepted as a cost. Downstream: o4_committed_recomputed_from_tree's 'consumed_committed iff an
      approved file cites it' gains the companion clause 'and no OTHER
      approved-or-refused-in-this-batch file citing the same finding disagrees'.

  - id: o4_agreeing_citations_consume_the_finding_once
    kind: behavior
    form: test
    source: "70-resolutions.md §7-I — phase-F repair mint (91-blind.md, untested symmetric case)"
    binds:
      - "consumed_jsonl"
      - "consumed_jsonl.domain.distinguished[consumed_committed]"
      - "pending_queue"
      - "forward_bad_ledger"
    discharged_by: test_a_finding_cited_by_two_approved_files_is_consumed_committed_exactly_once_773
    seed_docstring: >-
      A finding cited by two files that AGREE — every pair GOOD or EXEMPT, both files approved and
      committed — is consumed_committed exactly ONCE: one row in consumed.jsonl, not two, absent
      from the pending queue and absent from the gap ledger.
    note: >-
      THE POSITIVE CONTROL for o4_split_citation_finding_defers, and the agreement arm of the
      companion clause FK-2 added to o4_committed_recomputed_from_tree. The blind conservation
      reader found the suite pinned the DISAGREEMENT case
      (test_a_finding_cited_by_one_approved_file_and_one_refused_file_773) and nothing pinned the
      agreement case, so it could not distinguish "the drain defers on disagreement" from "the
      drain defers whenever a finding is multiply cited" — the conflated reading passes every
      assertion in the disagreement test. ONCE is the load-bearing word: M5 recomputes committed by
      walking the approved files and asking which batch ids each cites, so a finding cited by N
      approved files is reached N times, and whether that yields one consumption or N depends on
      the recompute collecting into a set. Asserted as a COUNT over the raw consumed rows, because
      the suite's consumed_by_id() accessor is keyed by finding id and would silently collapse a
      duplicate — the exact failure the test exists to catch.

  - id: o9_conservation_four_endings
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "pending_queue"
      - "consumed_jsonl"
      - "rotate_queue_locked"
      - "retire.domain.distinguished[deferrals]"
    discharged_by: test_every_batch_row_reaches_exactly_one_disposition_773
    seed_docstring: >-
      Every batch row ends in exactly one of consumed_committed, consumed_forward_bad,
      consumed_skip, or deferred-and-re-queued — never two, never none.
    note: >-
      20-demands.md's conservation invariant, with the FOURTH ending FK-2 added
      (deferred-on-split-citation). This is the property phase F's conservation reconciliation is
      written against.

  - id: m7_deferred_ceiling_reason
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "retire"
      - "retire.domain.distinguished[deferrals]"
      - "max_attempts"
      - "graveyard"
    discharged_by: test_a_deferral_that_reaches_the_ceiling_773
    seed_docstring: >-
      The bump that REACHES the ceiling graveyards on that same call (retire's boundary is >=, with
      no grace tick), and the graveyard record carries its own deferred_ceiling reason, distinct
      from a fault's.
    note: >-
      70-resolutions.md FK-17, settled by re-ground probe on retire() (drain.py:159-231): the
      boundary is pinned as the EXISTING primitive behaves, so this lane cannot silently diverge
      from the pitfalls lane using the same primitive. The distinct reason closes the observability
      gap the probe surfaced — nothing currently distinguishes a deferred-ceiling exit from a
      faulted one but the caller-supplied string.

  - id: m7_consecutive_deferrals_reach_the_graveyard
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "pending_queue"
      - "wake_gate"
      - "max_attempts"
      - "retire.domain.distinguished[deferrals]"
    discharged_by: test_a_deferred_row_as_the_wake_gate_sees_it_773
    seed_docstring: >-
      The wake gate is UNCHANGED — a deferred row is ordinary pending work, not a held one — and the
      spin that buys is bounded: a row deferred on consecutive ticks reaches the graveyard within
      max_attempts ticks.
    note: >-
      70-resolutions.md FK-18 (auto-resolved). Changing the wake gate widens this change into #881's
      territory; the ceiling bounds the waste at three spawns, but the bound must be TESTED or
      'never forever' is only a sentence.

  - id: m7_one_queue_write_per_tick
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "rotate_queue_locked"
      - "pending_queue"
      - "retire.domain.distinguished[deferrals]"
    discharged_by: test_a_tick_that_both_defers_a_row_and_closes_its_rotation_773
    seed_docstring: >-
      A tick that defers a row and then closes its rotation writes the queue ONCE: the deferred row
      is re-queued carrying its incremented counter in the same rewrite, so a closing rotation
      holding pre-bump copies cannot silently reset the count.
    note: >-
      70-resolutions.md FK-23 (auto-resolved): folding the bump into the closing rotation removes
      the race by construction rather than by discipline. This is the QUIETEST way the change can
      break — the count never reaches the ceiling and O9's 'never forever' fails with no observable
      symptom — so the assertion is over two consecutive deferring ticks.

  - id: m7_fault_bumps_attempts_only
    kind: negative
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "RETIRE_SET"
      - "retire.domain.distinguished[attempts]"
      - "retire.domain.distinguished[deferrals]"
    discharged_by: test_a_finding_faulted_and_deferred_in_the_same_tick_773
    seed_docstring: >-
      A RETIRE_SET fault unwinds BEFORE M5-M7 run at all, so no finding is ever charged both
      counters in one tick: a faulting tick bumps attempts only and leaves every deferrals counter
      exactly where it was.
    note: >-
      70-resolutions.md FK-24 (auto-resolved): all three readers reached this from N8's ordering;
      what was missing was a sentence. POSITIVE CONTROL: o9_deferral_bumps_named_counter, same
      address under the complementary condition, where the deferrals counter DOES move.

  - id: m7_landed_commit_survives_a_rotation_failure
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
