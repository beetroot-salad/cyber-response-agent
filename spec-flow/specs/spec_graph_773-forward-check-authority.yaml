      is correct discharges nothing here; every one of these bugs is on the read side).'

  # ==========================================================================================
  # §7 MINTS — the demands 70-resolutions.md created, sharpened or superseded, written here by
  # phase E. Three material forks the human decided (FK-2, F8, FK-29), five DISSOLVED forks
  # where a design correction removed the decision (FK-1, FK-6, FK-7, FK-9, FK-27), four
  # settled by re-ground probe (FK-3, FK-17, FK-26, FK-29's fact half) and the auto-resolved
  # remainder. Each carries the resolution it applies in its `note:`, because a resolution
  # applied loosely is a fork re-opened silently.
  # F8 needed no new demand: it CONFIRMS m4_repair_spawn_is_write_only's module-level-fixed
  # reading, which g4/g5 already sharpen per cell. FK-3 and FK-25 likewise mint nothing —
  # FK-3 confirms the existing bidirectional gate unchanged, FK-25 files its dedup as a
  # follow-up, consistent with N3.
  # ==========================================================================================

  - id: m3_call_failure_is_not_a_verdict
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "forward_check"
      - "VerdictError"
      - "PairVerdict"
      - "forward_bad_ledger"
    discharged_by: test_a_call_that_never_completes_is_not_a_verdict_773
    seed_docstring: >-
      A call that never COMPLETES (a transport error, a timeout, an unreachable dependency) is a
      different exception class from an unreadable reply: it propagates as an ordinary tick fault,
      mints no PairVerdict, writes no gap record, and can never become a permanent
      consumed_forward_bad.
    note: >-
      Minted by 70-resolutions.md FK-9 (DISSOLVED fork): the verifier call site distinguishes at the
      source, so the two failure kinds are structurally incapable of being confused. Narrows
      d0_verdict_error_class to content-shaped failures only, and makes the PairVerdict 'fourth
      member for an error-degraded pair' (R0 residue) unnecessary. Positive control lives in the
      same test: a readable BAD on the same pair DOES become terminal.

  - id: m3_out_of_process_dependency_failure_is_not_a_verdict
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "forward_check"
      - "PairVerdict"
      - "forward_bad_ledger"
    discharged_by: test_a_pair_whose_out_of_process_dependency_is_unreachable_773
    seed_docstring: >-
      A benign-direction pair whose out-of-process ticket-adapter call times out propagates as a
      tick fault rather than being recorded as a permanent BAD.
    note: >-
      FK-9, on the edge claim P3 named and §7 probe-confirmed at verify_forward/forward.py:75-94
      (_POLICY_FETCH_TIMEOUT = 15): load_cited_policy shells out per benign pair inside the doubled
      repo-lock hold.

  - id: m3_provider_outage_consumes_nothing
    kind: negative
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "forward_bad_ledger"
      - "consumed_jsonl"
      - "pending_queue"
      - "corpus_dir"
    discharged_by: test_provider_outage_fails_every_pair_in_the_fan_out_773
    seed_docstring: >-
      A provider outage — every pair's call failing to complete — ends the tick as a fault and
      consumes nothing: no gap record, no commit, every row still pending AND every row's attempts
      counter unmoved.
    note: >-
      FK-9's loudest failure mode. POSITIVE CONTROL: m3_verdict_error_retried_once_then_bad, on the
      same forward_check address under the complementary condition (a readable reply), where the
      tick DOES consume and DOES record.
      FK-9'S WORDING, CORRECTED (§7-I, phase-F repair per 92-reconciliation.md F-5): section B read
      "propagates as an ordinary tick fault (the same disposition as any other RETIRE_SET-shaped
      failure: undo, don't bump attempts...)", which is self-contradictory — RETIRE_SET membership
      is precisely what bumps the counter. An infra-failure-class exception (ConnectionError,
      TimeoutExpired, a missing run dir) is explicitly NOT a RETIRE_SET member; it gets its own
      carve-out disposition — undo the agent edits, do NOT bump attempts, retry the batch next
      tick — which is DISTINCT FROM a genuine RETIRE_SET fault, not an instance of one. The
      attempts half is what the added assertion on this demand's test pins: before the repair the
      test asserted only gap_records() == [], head_files() == [] and "rows still pending", and a
      row whose attempts was bumped is ALSO still pending, so the assertion did not discriminate.
      Why it is load-bearing: FK-9 was dissolved to stop a provider outage permanently consuming a
      batch — if attempts is charged per outage tick, max_attempts outage ticks graveyard the
      batch and the dissolve's stated outcome is not bought.

  - id: m3_call_time_credential_rejection_propagates
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "forward_check"
      - "verifier_key_preflight"
      - "forward_bad_ledger"
    discharged_by: test_verifier_key_valid_at_preflight_but_rejected_at_call_time_773
    seed_docstring: >-
      A credential rejected at call time propagates and mints no PairVerdict, so O10's intent — a
      configuration fault is never converted into per-finding BAD verdicts — survives the key going
      bad mid-tick.
    note: >-
      FK-9, the dep-8 premise.

  - id: d0_conflicting_verdict_lines_raise
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "parse_verdict"
      - "VerdictError"
      - "forward_check"
    discharged_by: test_a_reply_carrying_two_conflicting_verdict_lines_raises_773
    seed_docstring: >-
      A reply carrying more than one distinct VERDICT line is one from which no single verdict can
      be read: it raises VerdictError and takes the re-run-once-then-BAD path, never committing on
      whichever line a permissive parser happened to pick.
    note: >-
      70-resolutions.md FK-11 (auto-resolved): 'pick one' is the only reading under which a lesson
      commits on a verdict the verifier contradicted. Sharpens d0_verdict_error_class's vocabulary
      to three shapes.

  - id: m3_double_failure_reasoning_carries_both_attempts
    kind: shape
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "PairVerdict"
      - "forward_bad_ledger"
      - "interacts(author_and_rotate->forward_bad_ledger).payload"
    discharged_by: test_a_doubly_failed_pairs_reasoning_concatenates_both_attempts_773
    seed_docstring: >-
      A pair that fails twice in two different ways records BOTH attempts' failure text in its one
      reasoning string, behind the forward_check_error: prefix.
    note: >-
      FK-10 (auto-resolved to the converged core plus the concatenation): O3 obliges 'every verdict
      with its reasoning', and the data model holds one PairVerdict per pair per pass, so the first
      attempt's shape has nowhere else to live.

  - id: d0_exempt_is_a_first_class_pair_verdict
    kind: shape
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
