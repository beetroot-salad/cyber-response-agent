    kind: behavior
    form: test
    source: "45-dispositions.md settled 74"
    binds: ["_vouched_for", "_assert_corpus_attributable", "AUTHOR_RESULT"]
    discharged_by: test_curator_reports_no_commits_but_leaves_dirty_corpus_edits_773
    seed_docstring: >-
      A curator that reports nothing committed and leaves a well-cited edit never reaches M3:
      verify_agent_state raises AuthorError first, so no pair is ever checked and no file is
      committed. The gate's own message is the discriminator — a vouching failure would name an
      unvouched file instead.
    note: >-
      "Whether verify_agent_state refuses first is FK-3" — ANSWERED, and the answer is yes.
      [m3_empty_pairs_is_unvouched_author_error]. CORRECTED AT §7-I (phase-F repair,
      92-reconciliation.md F-1). The original seed read "vouching runs over every changed corpus
      file on every channel regardless of what the committed bucket claims", and the realized test
      asserted the tick PROCEEDED to commit — but that names the LATER of two gates. This one is
      verify_agent_state (shared.py:256-283, called at drain.py:427): pre-existing, bidirectional,
      running before _project. M3.2's vouching — the `if committed:`-gated
      _assert_corpus_attributable call at drain.py:436-437 (G13) that this delta makes
      unconditional — is a separate, later mechanism. §7's FK-3 resolution keeps verify_agent_state
      firing first, unchanged, and proposes no relaxation of it, so the delta's real behaviour
      change is that VOUCHING stops being conditional on the bucket, not that a lying self-report
      becomes survivable. Claim P1 (executed) is the fact. The reverse mismatch direction is
      s74b_curator_reports_committed_but_corpus_clean.

  - id: s74b_curator_reports_committed_but_corpus_clean
    kind: behavior
    form: test
    source: "70-resolutions.md §7-I — phase-F repair mint (92-reconciliation.md F-1)"
    binds: ["AUTHOR_RESULT", "corpus_dir", "pending_queue"]
    discharged_by: test_curator_reports_committed_but_leaves_the_corpus_clean_773
    seed_docstring: >-
      The same gate, the opposite mismatch: a curator that reports committed ids and leaves the
      corpus untouched raises AuthorError at verify_agent_state before M3 runs — no pair checked,
      no commit, the finding unconsumed and its row still pending.
    note: >-
      THE UNTESTED HALF OF A FACT §7 ALREADY ESTABLISHED. Phase C minted probe P1 precisely to
      settle whether the aggregate check fires on this direction; §7 section C ran it and recorded
      that it does (shared.py:274-278), and the phase-F repair re-executed it — yet no test in the
      suite or the graph ever pinned it, and the premise name phase C carried
      (test_a_curator_that_reports_committed_and_leaves_the_corpus_untouched_773) appeared nowhere
      but P1's own note. PRE-EXISTING MACHINERY, SO WHY A DEMAND AND NOT A WAIVER: this delta's own
      O5 story — the drain stops believing the curator's buckets and starts reading the tree —
      rests on the drain refusing a tick whose self-report and tree disagree in EITHER direction
      before it begins trusting the tree at all. A silent relaxation here would let a curator that
      committed nothing rotate its queue, and the tests that would notice all sit downstream of
      this gate. It earns regression protection rather than a waiver. "Clean" is
      untracked-files-included: corpus_dir_clean (shared.py:152-153) runs git status with
      --untracked-files=all (_git.py:70), so a curator that writes nothing produces a genuinely
      empty census through the real primitive. NOT A DUPLICATE of
      test_git_status_reports_no_changed_corpus_files_773, which drives the same inputs for a
      different demand (the empty-census reading) and asserts only outcomes a fault also satisfies
      — it does not discriminate which gate fired; this one asserts the gate's own message.

