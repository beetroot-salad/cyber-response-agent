# ==========================================================================================
# STRUCTURE — the address space every `binds:` above resolves into.
#
# `provenance: design` IS the delta (rules.md, Procedure 1): change kinds are assigned from the
# design, not from a diff, because no implementation exists yet. `mode: remove` marks the two
# subtractions the design makes. `provenance: code` is the grounded neighbourhood `10-brief.md`
# established — the co-writers, sibling constraints and consumers reality imposes and no demand
# asked for.
# ==========================================================================================
structure:

  # The axis registry. Every `key_axes` / `interpolates` member below is one of these (R0
  # checks the membership), and the three coining passes' spellings are unified here:
  #   run_id       <- `source_id` (CheckContext), `row.run_id` (the queue), `run_dir.name`
  #   lesson_stem  <- "lesson stem (model-chosen)" (brief SR1), `rel_path` (demands' PairVerdict)
  #   check_index  <- `_CHECK_SEQ`'s successor, drain-owned (M3; scope is F4/FK-8)
  axes: [finding_id, lesson_stem, run_id, check_index, batch_id, channel, pass_no]

  actors:
    - {id: author_and_rotate, frame: composition, provenance: design}
      # learning/author/drain.py::_author_and_rotate (drain.py:396-487). THE CHANGE'S CENTRE:
      # it gains the verdict fan-out, the repair spawn, the explicit commit list, the gap
      # ledger and the deferral bump. `composition` because it FANS the verifier calls and
      # drives both curator spawns — R2 places its uniqueness demands here, never on a leg.
    - {id: drain_tick, frame: composition, provenance: code}
      # drain.py::_tick (drain.py:289). Owns the stuck-record guard (drain.py:376-393) the
      # propagate path lands in, and is the drives-edge parent that makes every sink
      # author_and_rotate writes a multi-invocation sink (R2's invocation clause).
    - {id: curator, frame: leg, provenance: code}
      # the first corpus-author spawn, bound from CORPUS_AUTHOR_DEF (curator_engine.py:240-266).
    - {id: repair_curator, frame: leg, provenance: design}
      # M4/D1's second spawn. Its seam is fork F8 (CE7: no per-spawn ToolSet override exists).
    - {id: questioner_curator, frame: leg, provenance: code}
      # learning/author/questioner/run.py — the sibling channel O7 obliges to keep today's
      # behaviour. Wires curator_engine.no_forward_check(...) at :174 today (C9).
    - {id: run_curator_stage, frame: leg, provenance: code}
      # curator_engine.py:301-363 — TODAY'S HOME of the verifier-key preflight (:337-342),
      # which M3.3 moves to the drain. The `mode: remove` edge below is that move.
    - {id: pitfalls_curator, frame: leg, provenance: code}
      # leads/pitfalls_curator.py:874 — one of commit_corpus's four production callers (CE1),
      # a lane N4 declares untouched. R7's unmoved reader.
    - {id: lead_author, frame: leg, provenance: code}
      # leads/lead_author/__init__.py:334 — the second lane N4 declares untouched.
    - {id: judge_enqueue, frame: leg, provenance: code}
      # judge/enqueue.py::append_rows — the queue's producer, and the owner of the idempotency
      # read N7 rests on (enqueue.py:211-216).
    - {id: evals_harness, frame: composition, provenance: code}
      # evals/harness.py::materialize — the OUT-OF-LOOP consumer of the queue row's shape that
      # no import-following census sees (the project profile's own note on `learning_queue`).
      # It is why a row-shape change (`consumed_forward_bad`, `deferrals`) has a second
      # consumer; modelled as a READER of the shape, not a writer of this sink, because what
      # it writes is a fixture copy in a temp tree.
    - {id: wake_gate, frame: leg, provenance: code}
      # core/drains.py::_pending_queue_counts (drains.py:153) — reads the pending file to decide
      # whether to wake the lane. FK-18: a deferred row is still physically pending work to it.
    - {id: run_investigation, frame: composition, provenance: code}
      # the defender's own entry point (profile `contextAliases: run -> run_investigation`).
      # Reads the lesson corpus at PLAN; settled 89's reader, and the one R7 reader of the
      # corpus that is not in the learning loop at all.

  boundaries:

    # ---------------------------------------------------------------------------------------
    # The check seam and its data model (design)
    # ---------------------------------------------------------------------------------------
    - id: forward_check
      provenance: design
      facets:
        domain:
          type: "ForwardCheck | None"
          refinement:
            nl: >-
              The per-channel check on CorpusAuthorConfig. The lessons channel carries
              FINDINGS_CHECK; the questioner channel carries None, which skips the verdict step
              and nothing else.
          default: unknown          # FORK F6: base CorpusAuthorConfig or the lessons subclass,
                                    # and therefore whether there is a default at all. The
                                    # design says "CorpusAuthorConfig gains" and gives no value.
          distinguished: ["None", "FINDINGS_CHECK"]
          falsy_valid: true         # None is the questioner's VALID configured value, not an
                                    # unset knob — the `x or DEFAULT` swallow shape exactly.
          documented_alternatives: []
        payload:
          parts:
            - {role: lesson_text,  source: lesson_text}
            - {role: source_id,    source: source_id}
            - {role: check_index,  source: check_index}
            - {role: direction,    source: direction}
            - {role: corpus_dir,   source: corpus_dir}
            - {role: runs_dir,     source: runs_dir}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            The CheckContext the drain mints per (file, finding) pair: the bytes on disk at check
            time, the queue row's run_id, a drain-owned index, and the roots the verifier lane
            reads. Under M1 every one of these was the curator's to choose; under M3 none is.
    - id: CheckContext
      provenance: code
      facets: {}
      # checks.py:17-30, a frozen dataclass with eleven plain-value fields. C1 re-verified it
      # verbatim, including the `check_index` -> trace_name path at checks.py:59. The seam
      # survives the change; what changes is WHO fills it.
    - id: lesson_text
      provenance: code
      facets: {}
      # the bytes the verdict is computed on. O1's whole guarantee is that these are the bytes
      # that land in HEAD.
    - id: source_id
      provenance: design
      facets: {}
      # THE PROVENANCE FLIP (S3): today `Pair.source_id`, a model-emitted string gated only by
      # deps.queued_ids / exempt_ids membership (tool._prepare:104-111, G8); under M3.3 it is
      # `row.run_id`, read off the queue. FK-30: nothing validates its SHAPE either way.
    - id: check_index
      provenance: design
      facets: {}
      # the drain-owned counter that replaces tool._CHECK_SEQ (F9). Its value becomes the
      # verifier trace filename (checks.py:59) — which is why it is a key axis of
      # `verifier_trace` below and why FK-8's scope question is a collision question.
    - id: _CHECK_SEQ
      provenance: code
      facets: {}
      # tool.py:23, a module-global itertools.count() spent at tool.py:120. Deleted with the
      # tool; recorded so the substitution is visible rather than implied.
    - id: PairVerdict
      provenance: design
      facets:
        identity:
          key_axes: [lesson_stem, finding_id, pass_no]
          evidence:
            nl: >-
              Read off the design's own data model: "one PairVerdict per (file, finding) pair per
              pass", carrying rel_path, finding_id, source_id, verdict, reasoning and pass_no.
              `pass_no` is a key axis because M4 runs the same pair twice and FK-7 turns on
              whether the second verdict may overwrite the first.
          derivations: []
          sharing: unique-key
        domain:
          type: enum
          refinement:
            nl: >-
              The verdict a pair carries. GOOD and BAD come from the verifier; EXEMPT is minted
              by the drain from cfg.exempt(row) and never returned by the check.
          default: unknown          # no default exists: every pair's verdict is computed. Recorded
                                    # `unknown` rather than left silently null (schema.md).
          distinguished: ["GOOD", "BAD", "EXEMPT"]
          falsy_valid: false
          documented_alternatives:
            - value: "a fourth member for an error-degraded pair"
              crosses_validation: unknown
              # FORK F2 / FK-13 / FK-9. The provisional reading folds a doubly-failed pair into
              # BAD with reasoning prefixed `forward_check_error: `; FK-9 would make an
              # error-degraded BAD non-terminal, which needs it to be distinguishable. Left
              # `unknown` on purpose — this is a hole for §7, not a value to invent here.
    - id: VerdictError
      provenance: design
      facets: {}
      # the RuntimeError subclass replacing parse_verdict's two SystemExit raises (C2).
    - id: parse_verdict
      provenance: design
      facets: {}
      # verify_forward/shared.py:7-17. FK-11 would add a third unparseable shape (two conflicting
      # VERDICT lines), which today's parser neither raises on nor is asked about.
    - id: exempt
      provenance: design
      facets: {}
      # cfg.exempt, a (dict) -> bool over a queue row. `skips_forward_check` on lessons,
      # `lambda r: True` on the questioner (M2).
    - id: skips_forward_check
      provenance: code
      facets: {}
      # checks.py:94-106. Already a (dict) -> bool; two non-test readers today
      # (lessons/run.py:171,188 and :377).
    - id: FINDINGS_CHECK
      provenance: code
      facets: {}
      # checks.py:109-113 — the ForwardCheck the lessons channel wires.
    - id: repair_prompt
      provenance: design
      facets:
        domain:
          type: "Path | None"
          refinement: {nl: "the repair spawn's prompt resource; None on a channel with no repair pass"}
          default: "None"
          distinguished: ["None"]
          falsy_valid: true
          documented_alternatives:
            - value: "a path that is set but missing or unreadable at spawn time"
              crosses_validation: unknown
              # FORK FK-28: O10 names "a check with no prompt" as a fatal config fault and says
              # nothing about a repair prompt that is set and unreadable. The quiet reading (skip
              # the repair, mark every BAD pair terminal) silently deletes D1 on a deployment
              # mistake no report names.

    # ---------------------------------------------------------------------------------------
    # The commit seam (design/code — the F1/FK-1 fork's whole neighbourhood)
    # ---------------------------------------------------------------------------------------
    - id: commit_fn
      provenance: design
      facets:
        payload:
          parts:
            - {role: message, source: commit_message}
            - {role: paths,   source: _changed_corpus_records}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            What the drain hands the commit: the rendered message, and the explicit list of
            repo-relative paths (approved files plus curator deletions under the corpus). The
            path part's source is git status's output and nothing else — that is O5/S2.
      # CE2: today `cfg.commit_fn(message, cfg)`, declared `(message, cfg) -> str | None`
      # (_config.py:71-73), with NO slot for a path list. F1/FK-1 is the arity fork.
    - id: commit_corpus
      provenance: code
      facets: {}
      # author/shared.py:236-253, the single production caller of _git.git_commit, itself called
      # by four lanes (CE1). The R7 shared source of this change: the drain's lane moves, three
      # do not.
    - id: git_commit
      provenance: design
      facets:
        domain:
          type: "Path | str | list[str]"
          refinement:
            nl: >-
              The pathspec the commit stages, diffs and commits. C7: today one
              `pathspec: Path | str`, stringified at three sites with no empty guard.
            # ^ semantic; the formal members below are what the rules read.
          default: "corpus-dir-pathspec"
          distinguished: ["empty-list"]
          # "empty-list" is the `[]` case, spelled as a label because a literal `[]` inside an
          # address's brackets is not addressable. C15, RE-EXECUTED in the brief's F1: `git add
          # --` with nothing returns rc=0, `diff --cached` rc=1, `commit -F -` rc=0 — and HEAD
          # carries an unrelated stray. An unguarded empty list commits the whole index.
          falsy_valid: false
          documented_alternatives:
            - value: "Path | str | list[str] union, so the two untouched lanes keep their call sites"
              crosses_validation: unknown
              # FORK F5 / FK-1 / RF1: M5 pins `list[str]`, N4 declares two of the four lanes
              # untouched, and the design chooses neither. `unknown` is the honest value: whether
              # the shipped default (a directory pathspec) stays valid is exactly what the fork
              # decides.
    - id: commit_message
      provenance: design
      facets:
        payload:
          parts:
            - {role: curator_prose,  source: AUTHOR_RESULT}
            - {role: terminal_block, source: forward_bad_ledger}
          invariants: [roles-disjoint-sources]
          nl: >-
            A RENDERED SINK with two authors: the curator's own commit_message prose, and the
            drain's appended 'Forward-check terminal:' block naming this tick's terminal
            findings. FK-15: nothing reserves a channel the model cannot write into, so the
            curator can emit the drain's own header — `roles-disjoint-sources` is declared here
            precisely so R6's chooser/sanitizer walk has to answer for the frame, not only the
            values.

    # ---------------------------------------------------------------------------------------
    # SR1 — the corpus tree (`drain_worktree`, DECLARED in the project profile)
    # ---------------------------------------------------------------------------------------
    - id: corpus_dir
      provenance: code
      facets:
        identity:
          key_axes: [lesson_stem]
          evidence:
            nl: >-
              Read off the resource, not the implementation: every corpus writer lands at
              `<corpus_dir>/<stem>.md` (brief SR1's writer table, probed with
              `spec-graph trace resource drain_worktree`), and the drain's own census is
              `git status --porcelain --untracked-files=all -z -- <corpus_dir>` (_git.py:70-92),
              which names one path per changed file.
          derivations:
            - {value: repo_rel_path,   fn_of: lesson_stem, injective: true}
            - {value: corpus_rel_path, fn_of: lesson_stem, injective: true}
            # BOTH DECLARED ON PURPOSE (brief F5, dispositions RF-3 — UNOWNED BY ALL 182
            # ANSWERS): `_changed_corpus_records` yields REPO-relative paths (git status runs
            # with cwd=repo_root); `_snapshot_corpus` keys CORPUS-relative
            # (`str(p.relative_to(corpus_dir))`, drain.py:796). M4's per-file terminal restore
            # and M5's commit list both cross the two. Each derivation is injective, so R2's
            # coverage predicate is satisfied and says nothing — this is an R8-shaped defect (a
            # reader keying a join on a re-derived field), which is why the two spellings are
            # written out rather than collapsed into one.
          sharing: unique-key
    - id: _changed_corpus_records
      provenance: code
      facets: {}
      # drain.py:574-590. C17 re-verified: the filter is `"D" not in xy`, testing BOTH status
      # columns, so a deleted file is invisible to it (F6) — and M5 nonetheless owes the commit
      # list those deletions (RF-2/RF4, still with no stated source). FK-32 adds renames and
      # mode-only changes, which the two-letter model does not describe.
    - id: _snapshot_corpus
      provenance: code
      facets: {}
      # drain.py:792-799. C6: `dict[str, bytes] | None`, None when the corpus dir is absent.
    - id: _undo_agent_edits
      provenance: code
      facets: {}
      # drain.py:445. The tick-wide unwind every fault path ends in. FK-21: the undo itself is
      # written as a fact, not as a step that can fail; FK-34: it is reached only for
      # RETIRE_SET-shaped faults, so an unwrapped transport timeout skips it entirely.
    - id: _vouched_for
      provenance: design
      facets: {}
      # drain.py:593-613. M3.2 changes it twice: it now runs on EVERY channel over every changed
      # file (G13 — today the call is gated `if committed:`), and the HEAD-provenance exemption
      # is removed. C13 re-verified the current predicate; the one symbol census in the brief
      # with a fully-resolved probe.
    - id: _assert_corpus_attributable
      provenance: design
      facets: {}
      # drain.py:437, the #852 vouching gate, reached today ONLY when `committed` is non-empty
      # (drain.py:436, G13). M3.2's "all channels" is a real behavior delta, not a restatement.
    - id: _cited_ids
      provenance: code
      facets: {}
      # drain.py:624-635. A malformed file cites nothing (returns set()), i.e. is unvouched;
      # the return is a SET, so a repeated citation collapses (settled 41).
    - id: verify_agent_state
      provenance: design
      facets: {}
      # author/shared.py:272-283. M4 re-runs it after the repair spawn. Its aggregate bit
      # ("reported no commits but left edits … refusing to rotate") is FK-3's whole question:
      # whether it fires BEFORE the new tree-derived path, and whether it fires on the reverse
      # mismatch at all (probe P1).
    - id: _corpus_author_write_shapes
      provenance: code
      facets: {}
      # curator_engine.py — the write confinement both spawns share.
    - id: repo_root
      provenance: code
      facets: {}
      # the worktree root: the universe O2's negative ("nothing outside the corpus") is scoped
      # against.

    # ---------------------------------------------------------------------------------------
    # SR2 — the findings queue (`learning_queue`, DECLARED) and SR3 — the pending dir sidecars
    # ---------------------------------------------------------------------------------------
    - id: pending_queue
      provenance: code
      facets:
        identity:
          key_axes: [finding_id, channel]
          evidence:
            nl: >-
              Read off the resource: `LoopPaths.findings` is a QueueChannel with
              `id_key="finding_id"` and a per-channel file (`findings.jsonl` vs
              `questioner_findings.jsonl`, config.py:120-161), and every rotation goes through
              `persist.rotate_queue_locked` -> `_rewrite_queue` (G2, three call sites:
              drain.py:233, :461, :672).
          derivations: []
          sharing: serialized-append
      # The row's own counter keys (`attempts`, `deferrals`) are modelled on `retire`, which is
      # what bumps them — not here, where they would be a second domain over the same values.
    - id: consumed_jsonl
      provenance: design
      facets:
        identity:
          key_axes: [finding_id, channel]
          evidence:
            nl: >-
              `_pending/consumed.jsonl` per channel (config.py:139), one row per consumed
              finding, written only by `persist._rewrite_queue:86`.
          derivations: []
          sharing: serialized-append
        domain:
          type: str
          refinement:
            nl: >-
              `consumed_category`, the ending a consumed row records. `_project` writes
              `rec["consumed_category"] = bucket.name` VERBATIM (drain.py:525, G4/F19), so a
              bucket's name IS its category string and the two cannot be spelled apart.
          default: "consumed_committed"
          distinguished: ["consumed_committed", "consumed_skip", "consumed_forward_bad"]
          falsy_valid: false
          documented_alternatives: []
      # G3: `consumed_forward_bad` appears NOWHERE in defender/ today — it is new vocabulary.
      # F18: `_rewrite_queue:83-84` stamps `consumed_commit` only for `consumed_committed` AND a
      # truthy sha, so a forward_bad row must carry no such key at all.
    - id: rotate_queue_locked
      provenance: code
      facets: {}
      # persist.py:89-102, wrapping `_rewrite_queue` (persist.py:62-86) — the queue's ONE
      # rewriter. Brief R2: the design doc's `_rotate_queue` names nothing in the tree.
      # FK-23: M7's deferral bump makes this the SECOND queue write of a tick.
    - id: graveyard
      provenance: code
      facets:
        identity:
          key_axes: [finding_id, channel]
          evidence:
            nl: "`findings.deadletter.jsonl` under the pending dir, appended by drain.retire:215."
          derivations: []
          sharing: serialized-append
    - id: stuck_report
      provenance: code
      facets: {}
      # `findings.stuck.jsonl`, drain._record_stuck:781 via stuck_report_file — where _tick's
      # guard lands a propagated fault (F8).
    - id: retire
      provenance: design
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              `retire(counter_key=…)` — which named counter on the row this retirement bumps, and
              which ceiling it is measured against. C18 re-verified the signature
              (`counter_key: str = "attempts"`, `timeout_seconds: int | None = None`,
              drain.py:165-166) and the docstring's requirement that any caller holding the repo
              lock pass `timeout_seconds` (drain.py:190-197).
          default: "attempts"
          distinguished: ["attempts", "deferrals"]
          falsy_valid: false
          documented_alternatives:
            - value: "offers_declined"
              crosses_validation: true
              # leads/pitfalls_curator.py:705 — the ONE non-default counter_key today, and the
              # exact idiom M7 copies (it passes timeout_seconds= at :706). C14 holds with a
              # line drift (702 -> 705). The shipped default stays valid under it: the two
              # counters are independent fields on the row.
    - id: max_attempts
      provenance: code
      facets:
        domain:
          type: int
          refinement: {nl: "LEARNING_AUTHOR_MAX_ATTEMPTS — the ceiling retire() graveyards at"}
          default: 3
          distinguished: ["1"]
          # the smallest ceiling: one bump graveyards. FK-17's edge question (does the bump that
          # REACHES the ceiling graveyard on this tick or the next?) is only observable here.
          falsy_valid: false
          documented_alternatives: []
    - id: repo_lock_wait_seconds
      provenance: code
      facets:
        domain:
          type: int
          refinement: {nl: "LEARNING_REPO_LOCK_WAIT_SECONDS — what M7 must pass as timeout_seconds"}
          default: 1800
          distinguished: []
          falsy_valid: false
          documented_alternatives: []
    - id: pending_dir
      provenance: code
      facets: {}
      # SR3, UNDECLARED in `specGraph.resources` before this run (claim A2 — declared in the
      # same commit as this graph). `LoopPaths.pending_dir = state_root/"_pending"`
      # (config.py:71), and `with_repo_root` preserves `state_root` (config.py:63-64), so the
      # dir stays HOST-SIDE across the worktree swap — S5's whole premise (G6/F20).
      # Facetless on purpose: the containment property is a demand's to assert, and giving it an
      # identity facet would duplicate `pending_queue`'s R2 question on the same rows.
    - id: forward_bad_ledger
      provenance: design
      facets:
        identity:
          key_axes: [finding_id]
          evidence:
            nl: >-
              M6: `pending_dir/findings.forward_bad.jsonl`, one JSONL record per TERMINAL
              finding, appended under the host-side state root. The file does not exist today
              (G3's sibling: the brief's SR3 table lists it as "(M6, does not exist)").
          derivations: []
          sharing: serialized-append
        payload:
          parts:
            - {role: finding_id,  source: pending_queue}
            - {role: run_id,      source: source_id}
            - {role: direction,   source: direction}
            - {role: batch_id,    source: pending_queue}
            - {role: lesson_path, source: corpus_dir}
            - {role: lesson_text, source: lesson_text}
            - {role: verdicts,    source: PairVerdict}
          invariants: [all-slots-bound]
          nl: >-
            The durable account of a refusal — the ONLY one, since M4 restores the file away.
            `verdicts` carries every PairVerdict for that finding across both passes, each with
            the verifier's own reasoning; FK-14 recommends a `rel_path` per entry with the
            top-level `lesson_path` holding the terminal (pass-2) location, and that half is
            unresolved. F11/G7: the append needs the graveyard's own
            `# lint-unguarded-tree-write: ok — learning_queue sidecar, host-side, outside every
            box mount` suppression or CI blocks.
    - id: held_report
      provenance: design
      facets:
        payload:
          parts:
            - {role: forward_bad_terminal, source: forward_bad_ledger}
            - {role: deferred,             source: retire}
            - {role: skipped,              source: AUTHOR_RESULT}
            - {role: gate_held,            source: pending_queue}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            `findings.held_report.log`, written by lessons/run.write_held_report through
            cfg.post_rotate (CE5). M6 replaces the `forward_bad` group with
            `forward_bad_terminal` and adds `deferred`; FK-16 leaves the deferred line's shape
            (id alone, id+count, or id+count+reason) undecided, recommending id+count.
    - id: direction
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The queue row's `direction`, and the only field the exempt predicate reads. A
              family row's run_id is an episode id under the EPISODES root, not a run id under
              the runs dir — which is why it is exempt at all (skips_forward_check's docstring).
          default: unknown          # rows are minted with a direction; the READER supplies none,
                                    # it uses `.get` (so a missing field is falsy, settled 63).
          distinguished: ["family", "adversarial", "benign", ""]
          falsy_valid: true         # `row.get("direction")` on a row with no such field is None —
                                    # falsy, not exempt, and no raise.
          documented_alternatives:
            - value: "out-of-vocabulary"
              crosses_validation: true
              # settled 61: an unrecognised direction is simply not exempt and takes the ordinary
              # verdict path — the shipped default behaviour stays valid under it.

    # ---------------------------------------------------------------------------------------
    # SR4 — the runs dir. THE DESIGN'S ASSET LIST CALLS THIS READ-ONLY; IT IS NOT (FK-31).
    # ---------------------------------------------------------------------------------------
    - id: runs_dir
      provenance: design
      facets:
        access:
          constraints_by_via:
            api:
              trust: attacker-influenced
              constraints: [queued-ids-membership]
              # TODAY'S LANE, removed by M1: `Pair.source_id` is a MODEL-EMITTED string
              # (tool.py:37, a pydantic_dataclass), gated only by `deps.queued_ids` /
              # `deps.exempt_ids` membership (tool._prepare:104-111). G8.
            queue:
              trust: derived
              constraints: unknown
              # THE NEW LANE (M3.3): `source_id` is `row.run_id`, read off the queue. FK-30: S3's
              # security argument is entirely about PROVENANCE — nothing validates the value's
              # SHAPE before it is joined into a filesystem path, and the queue is written by the
              # judge lane, not by a human. `unknown` is the confession, and the hole it owes is
              # "does the path the check opens resolve inside runs_dir?".
    - id: verifier_trace
      provenance: design
      facets:
        identity:
          key_axes: [run_id, lesson_stem, check_index]
          evidence:
            nl: >-
              Read off the write itself: `checks.py:59` composes
              `trace_name=f"{prefix}.{stem}.{ctx.check_index}.trace.jsonl"` and the stage writes
              it at `observe.stage_trace_path(ctx.learning_run_dir, wiring.trace_name)`
              (_pydantic_stage.py:117) with `learning_run_dir = runs_dir/<source_id>`
              (checks.py:87, engine.py:66) — so the full key is (run_id, lesson_stem,
              check_index) and nothing else.
          derivations: []
          sharing: unique-key
      # FK-31: the design's asset list calls the runs dir "read by the check" and SR4 records it
      # read-only. IT IS A WRITE ROOT. Nothing in the tick's undo region restores or removes a
      # trace, so an unwound tick leaves verifier traces describing lessons that never existed;
      # and two passes (F9/FK-8), a per-pair retry, and `verify_batch_workers()` concurrency all
      # share this namespace with no stated discipline.

    # ---------------------------------------------------------------------------------------
    # The curator's own surfaces (the M1 deletion neighbourhood)
    # ---------------------------------------------------------------------------------------
    - id: AUTHOR_RESULT
      provenance: design
      facets:
        access:
          constraints_by_via:
            api:
              trust: attacker-influenced
              constraints: [partition-validation]
              # `validate_agent_result_partition` is the only thing standing between the model's
              # self-report and the drain. FK-29: whether it is a CLOSED schema or an allow-list
              # over known keys is unread, and `m1_curator_partitions_into_two_buckets` passes
              # for the wrong reason under the second reading. O5's whole point is that after
              # this change the report selects nothing — it is read only for consumed_skip
              # reasons and the commit message.
    - id: FINDINGS_BUCKETS
      provenance: design
      facets:
        domain:
          type: enum
          refinement:
            nl: >-
              The buckets a curator may partition its batch into. G5: exactly three members
              today with ONE non-test consumer (lessons/run.py:82); M1 drops `held_forward_bad`,
              leaving two.
          default: unknown          # a vocabulary has no default member — recorded rather than
                                    # left null. NOT a design hole; see the digest's split of
                                    # design-open vs structurally-absent unknowns.
          distinguished: ["committed", "consumed_skip", "held_forward_bad"]
          falsy_valid: false
          documented_alternatives: []
    - id: CORPUS_AUTHOR_DEF.tools
      provenance: design
      facets:
        domain:
          type: ToolSet
          refinement:
            nl: >-
              CE7: `ToolSet(bash=True, write=True, forward_check=True, lesson_read=True)`, a
              MODULE CONSTANT (curator_engine.py:98-130) with no per-spawn override on the bind
              path — `tool_config` is the only per-spawn knob.
          default: "bash+write+forward_check+lesson_read"
          distinguished: ["forward_check", "bash"]
          # `forward_check`: M1 removes it, and R5/F15 says ToolSet's field and the
          # `_register_deferred_tools` branch go with it or the dead-code gate fires.
          # `bash`: the flag M4's repair spawn must NOT have (S6).
          falsy_valid: false
          documented_alternatives: []
    - id: CORPUS_REPAIR_DEF.tools
      provenance: design
      facets:
        domain:
          type: ToolSet
          refinement:
            nl: >-
              M4's repair spawn grant: "same corpus confine and box, write tool only (no bash)".
              The demand that binds this observes the EFFECT (no rm, no grep, no bash of any
              shape reaches its box) so it survives either resolution of the seam fork.
          default: unknown          # FORK F8: a second module-level AgentDefinition, or a
                                    # ToolSet override threaded through bind()? The design names
                                    # neither and CE7 shows neither exists.
          distinguished: ["write", "lesson_read"]
          falsy_valid: false
          documented_alternatives:
            - value: "a per-spawn ToolSet override threaded through bind()"
              crosses_validation: unknown
              # If the override lands, it is also a new way for ANY curator to gain tools —
              # which is why F8 is a security fork, not a plumbing one.
    - id: tool_config
      provenance: code
      facets: {}
      # AgentDeps.tool_config, runtime/tools/_deps.py:130 (`Any = field(kw_only=True,
      # default=None)`). The FIELD stays; M1 leaves it unpopulated for this role.
    - id: lessons_prompt
      provenance: design
      facets: {}
      # learning/author/lessons/prompt.md. R4/CE8: M1's stated ranges (150-177, 199-200) MISS
      # `prompt.md:5` (a live reference that would dangle) and `prompt.md:177` documents the
      # OPPOSITE of M3.4 ("keep the GOOD edit" on a mixed file). `questioner/run.py:12-13`'s
      # module docstring names the deleted classes too.
    - id: _CORPUS_AUTHOR_DENY_REASON
      provenance: design
      facets: {}
      # the deny reason the curator is shown; M1 must stop telling it to forward-check.
    - id: observability_gaps
      provenance: code
      facets: {}
      # G12 re-verified C5: two hits, both `lessons/prompt.md` (:184, :213), ZERO Python readers.
      # N3 keeps it; the gap ledger this change adds is the forward check's own.
    - id: repair_user_turn
      provenance: design
      facets:
        payload:
          parts:
            - {role: finding_row,       source: pending_queue}
            - {role: current_file_text, source: lesson_text}
            - {role: verifier_reasoning, source: PairVerdict}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            S4: the repair spawn's user turn carries, per BAD pair, the finding row, the file's
            current text and the verifier's reasoning, EACH inside a `wrap()` envelope like every
            other untrusted stage input. The reasoning is model-authored text going into a
            model's prompt — the one place this change hands a model another model's words.

    # ---------------------------------------------------------------------------------------
    # The verifier lane's knobs (brief, "Config knobs") and the lock story
