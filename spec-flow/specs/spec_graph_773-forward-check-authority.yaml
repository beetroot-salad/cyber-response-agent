      - "corpus_dir"
    discharged_by: test_pair_verdict_flips_between_passes_on_an_untouched_file_773
    seed_docstring: >-
      A pass-2 verdict never reaches an untouched file at all, in either direction: a pass-1 GOOD on
      a file nobody edited cannot be overturned by verifier noise, and a pass-1 BAD on one cannot be
      laundered into a commit.
    note: >-
      FK-7. POSITIVE CONTROL: m4_pass_two_rechecks_only_repair_touched_files, same address — a file
      the repair spawn DID write is re-verdicted, so the observation channel can see the difference.

  - id: m4_repair_unvouch_is_terminal_not_tickwide
    kind: behavior
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
      - "_vouched_for"
      - "_assert_corpus_attributable"
      - "RETIRE_SET"
      - "forward_bad_ledger"
    discharged_by: test_a_repair_caused_unvouch_is_terminal_for_its_own_finding_only_773
    seed_docstring: >-
      A file the REPAIR spawn leaves unvouched routes through the same terminal-file path as a
      repair-spawn BAD verdict — terminal for its own finding(s), restored per file — and never
      through AuthorError; its cleared batch-mates still commit.
    note: >-
      70-resolutions.md FK-6 (DISSOLVED fork): the repair spawn's output validation is its own
      failure type. The vouch-error-unwinds-everything rule stays exactly as-is for the FIRST spawn,
      where an unvouched file means an agent wrote something nobody asked for; after the repair
      spawn the drain already knows which findings the file owns. Without this, D1's 'price of one
      spawn' becomes the price of the whole batch, against O6.

  - id: m4_repair_unparseable_rewrite_is_terminal_per_file
