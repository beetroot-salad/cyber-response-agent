  - id: s53_committed_bucket_is_empty
    kind: behavior
    form: test
    source: "45-dispositions.md settled 53"
    binds:
      - "AUTHOR_RESULT"
      - "FINDINGS_BUCKETS.domain.distinguished[committed]"
      - "consumed_jsonl"
    discharged_by: test_author_result_committed_bucket_is_empty_773
    seed_docstring: >-
      An empty committed bucket over a dirty corpus never reaches M5: the tick ends at
      verify_agent_state, before _project, before the recompute and before any commit — nothing
      is consumed and the row stays pending.
    note: >-
      [o5_author_result_read_only_for_skips_and_message]. CORRECTED AT §7-I (phase-F repair,
      92-reconciliation.md F-1). The original seed read "`committed` is recomputed from the tree
      after the commit, so an empty self-report neither prevents a changed file from being
      vouched, checked and committed, nor stops a finding being consumed" — which conflated two
      gates. O5's "the tree is the truth, the report is a hint" governs what the drain SELECTS
      once a tick is running; it is not a licence for the report to CONTRADICT the tree, and the
      pre-existing bidirectional honesty gate (verify_agent_state, shared.py:279-283, called at
      drain.py:427) refuses that tick before _project runs. §7's FK-3 resolution keeps that gate
      firing first and UNCHANGED, and claim P1 (executed) confirms both mismatch directions raise.
      The bucket being ignorable and the bucket being allowed to lie are different claims, and only
      the first is this delta's. What the empty bucket genuinely no longer does is gate M3.2's
      vouching — the `if committed:` conditional at drain.py:436-437 (G13) — which is a LATER gate,
      carried by s74.

