              # corpus half-repaired. The recommendation separates undo (always) from
              # attempts-bump (RETIRE_SET only).
    - id: LOCK_ORDER
      provenance: code
      facets: {}
      # ('drain_lock', 'repo_lock', 'append_lock'), unchanged. F16: the verifier fan-out runs
