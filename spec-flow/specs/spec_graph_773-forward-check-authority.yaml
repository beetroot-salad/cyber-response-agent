    seed_docstring: >-
      A repair rewrite that produces identical bytes is the no-op it is: the file is not
      re-verdicted and the pass-1 BAD stands.
    note: >-
      FK-7 reached through the other door — otherwise verifier noise gets a free second roll for
      nothing.

  - id: m4_no_pass_two_verdict_on_an_untouched_file
    kind: negative
    form: test
    source: "70-resolutions.md (§7) — phase E mint"
    binds:
