    discharged_by: test_git_status_reports_a_rename_pair_or_a_mode_or_name_only_change_773
    seed_docstring: >-
      A rename decomposes into new-path-changed plus old-path-deleted before anything downstream
      sees it: the new path is vouched, checked and committed, the old path rides the deletion list,
