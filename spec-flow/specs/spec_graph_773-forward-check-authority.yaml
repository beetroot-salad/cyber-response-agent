      rotation, lands a stuck record, and never proceeds. Terminal files are restored BEFORE the
      approved list is computed, so a restore failure can never coexist with a commit.
    note: >-
      70-resolutions.md FK-21 (auto-resolved). A partially-restored corpus is the one state that can
      put a refused lesson into HEAD on the NEXT tick, because that tick's git status reads it as
      ordinary dirt with valid citations — O1's failure mode arriving one tick late.

  - id: m4_any_exception_runs_the_undo
