     discharged_by: test_a_world_row_reusing_a_consumed_defender_finding_id_still_reaches_its_own_curator,
     binds: ["questioner_findings_channel.identity", "findings_channel.identity",
             "interacts(author_drain->questioner_findings_channel)",
             "interacts(author_drain->findings_channel)"]}

  # ---- F-R5: the episode's ONE namespace ----------------------------------------------------
  # THREE demands minted at PHASE F on the human's decision to CLOSE F-R5 in this change rather
  # than defer it. This is the SECOND time this round the change grows into pre-existing
  # behaviour (H1's applied counter was the first), and it is an examined decision, not drift:
  # the flag's stated purpose has no reachable input (f5-override-has-no-reachable-purpose), so
  # removing it removes a door with nothing behind it, while leaving it leaves reachable — with
  # one flag and no code change — exactly the leak on whose executed evidence H3 refused the
  # human's own per-attempt-unique-id proposal. THE TWO DECISIONS ARE NOT IN TENSION: H3 refused
  # INTRODUCING per-attempt tokens; this removes an EXISTING way to reach the same failure. Both
  # protect one invariant — an episode's namespace is derived from its episode id and nothing
  # else. REMOVE rather than SCREEN, because `cli._episode_token`'s own docstring says the
  # override "has to reach `episode_token_for` or the refusal below names a remedy that does
  # nothing"; a screen would make that refusal name a do-nothing remedy for every reachable
  # input, which is the failure the incumbent code says it exists to prevent.
  - {id: d_the_launcher_answers_to_no_operator_named_episode_token, kind: negative, form: test,
     minted_from: "F-R5 (human, PHASE F): the `--episode-token` override is REMOVED so an episode's token is always the derived one. The negative binds both surfaces an operator's string could land on — a staged name on the write door and a byte under the episodes root — and its positive control is the same argv without the flag, which launches and stages under `wv-{episode_token_for(episode_id)}.` on the same door in the same episode",
     discharged_by: test_the_launcher_answers_to_no_operator_named_episode_token,
     binds: ["episode_token.domain.alternatives[--episode-token]",
             "interacts(launcher->episode_token)", "episode_dir", world_view]}
  - {id: d_an_episode_stages_and_is_read_under_one_namespace, kind: coherence, form: test,
     minted_from: "F-R5 (human, PHASE F), the correctness half: an episode must not stage under one namespace and be read back under another. Today the token is threaded to staging and to nothing else — review.py:298, _family.py:702 and _family.py:859 all re-derive from the episode id and the manifest records no token (f5-override-is-not-threaded-to-any-reader) — so the flag makes staging and every reader disagree. Bound at each unmoved reader's OWN edge, never at the boundary, and asserted by construction as well: the derivation takes the episode id and nothing else, so no caller can hand staging a namespace a reader will not re-derive",
     discharged_by: test_an_episode_stages_and_is_read_under_one_namespace,
     binds: ["interacts(review->episode_token)", "interacts(grade_episode->episode_token)",
             "interacts(resume_world_from->episode_token)"]}
  - {id: d_an_unrenderable_source_run_id_is_refused_by_the_gate_that_runs_first, kind: survival, form: test,
     minted_from: "R5's own obligation on the removal: the ONE live dependent of the removed escape is the committed test `test_947_a_source_run_id_that_cannot_render_is_given_an_escape`, and the workflow it pins — a source run whose id cannot render is not permanently unbranchable — survives through its substitute, the earlier refusal. Every id `episode_token_for` cannot render is already refused by `refuse_bad_episode_id`, which `episode_dir_for` calls first, so the operator meets one legible refusal before anything is spent. The test is EDITED in place rather than deleted, and re-probes the two real predicates on every run",
     discharged_by: test_947_a_source_run_id_that_cannot_render_is_refused_by_the_gate_that_runs_first,
     binds: ["interacts(test_947_triplet_manifest->episode_token)", "episode_token.domain"]}
  - {id: d_removing_the_episode_token_flag_leaves_no_orphan_in_the_committed_spec_corpus, kind: survival, form: test,
     minted_from: "R5's second live dependent, and the one the phase-F census MISSED: `spec_graph_947.yaml` minted `d_unrenderable_source_id_has_an_escape` under its own FORK-4 and points it at the test this change renames. The sweep that went looking for the flag grepped `episode_token=` and saw neither `_family.episode_token_for`'s `override=` keyword nor the graph pointer; `lint_spec_graph` — the CI ratchet that binds after authoring — reported the dangling `discharged_by` as an orphan on a graph whose ceiling is 0. Same shape as C-B/X17's committed-corpus consumer for the `agreed-without-evidence` flag, and pinned the same way",
     discharged_by: test_removing_the_episode_token_flag_leaves_no_orphan_in_the_committed_spec_corpus,
     binds: ["interacts(spec_corpus->episode_token)", "episode_token"]}

# ===========================================================================================
structure:
  # THE AXIS REGISTRY. Every `key_axes` / `interpolates` member below is one of these, or a
  # `derivations` value derived from one. Coined once here because three passes coined names
  # independently: grounding said `pattern`, the ledger said `source_pattern`, the dispositions
  # said `key`.
  axes: [episode_id, world_label, pattern, holding_system, finding_id, draw, agent_id,
         correlation_key, capture_key, lesson_name]

  actors:
    # --- the judge pass (design: every one of these changes shape) -------------------------
    - {id: grade_episode,        frame: composition, provenance: design}  # learning/judge/__init__.py:431
    - {id: _write_judge_yaml,    frame: leg,         provenance: design}  # judge/__init__.py:700 (C32 site 1)
    - {id: _grade_from_document, frame: leg,         provenance: design}  # judge/__init__.py:662 (C32 site 2)
    - {id: _grade_world,         frame: leg,         provenance: design}  # judge/family.py::_grade_world — the mechanical pass
    - {id: _run_world_draws,     frame: composition, provenance: design}  # judge/__init__.py:254
    - {id: _run_family_draw,     frame: composition, provenance: design}  # NEW (M5): one call per draw, agent id judge:family:<n>
    - {id: render,               frame: leg,         provenance: design}  # judge/render.py:523
    - {id: validate_reply,       frame: leg,         provenance: design}  # judge/run.py:198
    - {id: append_rows,          frame: leg,         provenance: design}  # judge/enqueue.py::append_rows
    # --- the review and the serve path ------------------------------------------------------
    - {id: review,               frame: composition, provenance: design}  # branch/review.py::review
    - {id: _reachability,        frame: leg,         provenance: design}  # review.py:545 (M1 lands here or above it — fork F3)
    - {id: _rejection,           frame: leg,         provenance: design}  # review.py:852
    - {id: _served,              frame: leg,         provenance: design}  # estate/registry.py:407 WorldRegistry._served
    # H1's second and third consumers: each is a SEPARATE reader of the applied counter's meaning,
    # outside #1007's stated scope, and each owes its own demand (67-probe: 316 tests, 0 flips).
    - {id: _patched_visible,     frame: leg,         provenance: design}  # review.py:731 — calls apply_patches at :743
    - {id: _doctored_answer_served, frame: leg,      provenance: design}  # judge/family.py:663-667 — doctored = APPLIER_DECISIONS - {PASSTHROUGH}
    - {id: delta_o,              frame: leg,         provenance: design}  # branch/episode.py::delta_o
    # --- the launcher and the questioner ----------------------------------------------------
    - {id: launcher,             frame: composition, provenance: design}  # branch/cli.py::main, step 2 (M4's samples write)
    - {id: questioner,           frame: composition, provenance: design}  # branch/questioner/__init__.py, call 1
    # --- the drain, its two curators, and the corpus ----------------------------------------
    - {id: author_drain,         frame: composition, provenance: design}  # core/drains.py::author_drain
    - {id: questioner_curator,   frame: composition, provenance: design}  # NEW (M7): the second CorpusAuthorConfig
    - {id: _drain_box_request,   frame: leg,         provenance: design}  # drains.py:329 — the `label` branch R1 attaches to
    - {id: _gate_findings,       frame: leg,         provenance: design}  # author/lessons/run.py::_gate_findings
    # --- the grounded neighborhood (10-brief.md + P-A/P-B/P-C): co-writers, siblings, readers
    - {id: findings_curator,     frame: composition, provenance: code}    # author/lessons/run.py::run_batch — the ONE surviving curator (G2)
    - {id: lead_author_drain,    frame: composition, provenance: code}    # drains.py::lead_author_drain — the other `label`
    - {id: prime_base,           frame: leg,         provenance: code}    # branch/capture.py::prime_base — writes served/base.jsonl
    - {id: Ledger_record,        frame: leg,         provenance: code}    # branch/ledger.py::Ledger.record
    - {id: _answers,             frame: leg,         provenance: code}    # branch/episode.py::_answers — FIRST-ROW-WINS (X5)
    - {id: prepare_episode,      frame: leg,         provenance: code}    # branch/cli.py::prepare_episode — the adopt path (P-C.4)
    - {id: observe_RequestLogger, frame: leg,        provenance: code}    # runtime/observe.py::RequestLogger via _pydantic_stage (brief F4)
    - {id: elastic_adapter_search, frame: leg,       provenance: code}    # scripts/adapters/elastic_adapter.py::_search + search_envelope — H4 names its normalization load-bearing
    - {id: spec_corpus,          frame: composition, provenance: code}    # the COMMITTED spec corpus: spec_graph_921-family-judge.yaml (C-B, X17) and,
                                                                          # added at PHASE F, spec_graph_947.yaml, whose FORK-4 demand points at the
                                                                          # test F-R5 renames — found by the `lint_spec_graph` ratchet, not by the census
    - {id: test_921_family_buckets, frame: leg,      provenance: code}    # tests/e2e/test_921_family_buckets.py:136,156
    - {id: test_922_spine,       frame: leg,         provenance: code}    # tests/e2e/test_922_spine.py — the three exact-set tripwires
    - {id: test_947_triplet_manifest, frame: leg,    provenance: code}    # tests/test_947_triplet_manifest.py — the removed escape's ONE live dependent (F-R5)
    - {id: resume_world_from,    frame: leg,         provenance: code}    # runtime/branch/_family.py:859 — the frame a sibling process becomes a world through
    - {id: main_agent,           frame: composition, provenance: code}    # runtime/driver — the defender's own agent (write tool + read confine)
    - {id: orient_lessons,       frame: leg,         provenance: code}    # runtime/orient.py::_build_lessons_section -> defender-lessons shim
    - {id: document_frontier,    frame: leg,         provenance: code}    # runtime/tools/_document.py:344 (deps.defender_dir/"lessons")
    - {id: serialize_groups,     frame: leg,         provenance: code}    # learning/frontend/serialize.py::GROUPS (3 literal groups)
    - {id: driver_corpus_dirs,   frame: leg,         provenance: code}    # runtime/driver/_build.py:173 _CORPUS_DIRS
    - {id: policy_corpus_subdirs, frame: leg,        provenance: code}    # runtime/permission/policies/_common.py:17 _CORPUS_SUBDIRS
    - {id: lint_shippable_surface, frame: leg,       provenance: code}    # scripts/lint/lint_shippable_surface.py:66 EXCLUDED_PREFIXES
    - {id: lint_ci_hygiene,      frame: leg,         provenance: code}    # scripts/lint/lint_ci_hygiene.py:64
    - {id: lint_stale_refs,      frame: leg,         provenance: code}    # scripts/lint/lint_stale_refs.py:161 EXCLUDED_GREP_DIRS

  boundaries:
    # ===== the episode's own artifacts ======================================================
    - id: judge_record
      provenance: design   # judge.yaml — five new family-level fields, nine new per-world row fields, `flag` gone
      facets:
        payload:
          parts:
            - {role: family, source: const:FAMILY_LEVEL_FIELDS}
            - {role: worlds, source: template:WORLD_ROW, slots: {reachable_by_capture: reachable_by_capture,
                capture_addressed: capture_addressed, withheld_reason: withheld_reason,
                difference_shown: differs_from_base, world_findings: world_finding_bucket}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "the family record: the episode-level fields `_write_judge_yaml` enumerates by hand and the per-world rows the mechanical pass derives — the two hardcoded sites C32 names, which is why a field added to one and not the other is lost on the re-read path"
        identity:
          key_axes: [episode_id, world_label]
          evidence: {nl: "one judge.yaml per episode dir (`_judge_yaml_path`, judge/__init__.py:108) whose `worlds` mapping is keyed by the world's manifest label — read off the writer at judge/__init__.py:700 and the reader at :662"}
          sharing: unique-key
    - id: review_record
      provenance: design   # review.yaml — gains the per-world `reachability` block
      facets:
        payload:
          parts:
            - {role: decision, source: const:REVIEW_DECISION}
            - {role: worlds, source: template:PER_WORLD, slots: {reachability: reachability}}
          invariants: [all-slots-bound]
          nl: "the review record: one whole-record guarded write per episode pass (P-C.3, executed), carrying every world's consistency, envelope and — new — reachability results"
        identity:
          key_axes: [episode_id]
          evidence: {nl: "one review.yaml per episode dir; P-C.3 spied `write_guarded` across a three-world family and observed exactly one call"}
          sharing: unique-key
    - id: reachability
      provenance: design   # the per-world block. RE-SITED from the ledger's `review_record.reachability`
      facets:
        payload:
          parts:
            - {role: replays, source: template:CAPTURE_REPLAYS, slots: {key: capture_key}}
            - {role: verdicts, source: const:REACHABILITY_VERDICTS}
            - {role: counts, source: const:INJECTION_COUNTS}
          invariants: [all-slots-bound]
          nl: "per non-control world: `capture_replays: [{key, differs, faulted}]`, `capture_addressed`, `capture_reasks_faulted`, `reachable_by_capture` and the split `injected_retrieved`/`injected_present`"
    - id: reachable_by_capture
      provenance: design
      facets:
        domain:
          type: "bool|null"
          refinement: {nl: "true when at least one completed re-ask answers differently from the base beyond formatting; false when at least one completed and none differ; null ONLY when none completed"}
          default: "null"
          distinguished: ["true", "false", "null"]
          falsy_valid: true
          documented_alternatives: []
    - id: capture_addressed
      provenance: design
      facets:
        domain:
          type: bool
          refinement: {nl: "does any captured query name a staged pattern OR the patched system. Ledger fork F4 is resolved at §7 (resolved_by: auto, taken as recommended): the patched-system arm COUNTS, as O2's own parenthesis says — it decides which worlds can be withheld"}
          default: false
          # `true` IS DISTINGUISHED, added at phase F. F4's whole materiality is the second arm,
          # and with `false` alone R4 fired on the negative only: the resolution reached this
          # refinement's prose and no checker ever asked for the arm, so a pattern-only
          # implementation greened the suite and withheld every patch-only world. A member is
          # what makes a rule ASK; a refinement sentence is not.
          distinguished: ["false", "true"]
          falsy_valid: true
          documented_alternatives: []
    - id: differs_from_base
      provenance: design   # RE-SITED from the ledger's `served_ledger.payload.domain.distinguished[null]`
      facets:
        domain:
          type: "bool|null"
          refinement: {nl: "on a `source: staged` row only: did the served payload differ beyond formatting from the base pattern's live answer to the same call; `null` means the extra read faulted"}
          default: "null"
          distinguished: ["null"]
          falsy_valid: true
          documented_alternatives: []
    - id: withheld_reason
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "why a world's defender findings were recorded rather than enqueued — one reason per O4 cell"}
          default: "null"
          distinguished: [measured_nothing, capture_unaddressed, reachability_unmeasured]
          falsy_valid: false
          documented_alternatives:
            # A3 cell (h) (§7, resolved_by: auto): TAKEN. Ladder row 1 requires at least one SERVED
            # row somewhere in the episode before any defender finding is authored; otherwise the
            # world is WITHHELD rather than blamed. crosses_validation: true — the shipped
            # withholding path stays valid with a fourth reason on it.
            - {value: episode_incomplete, crosses_validation: true}
    - id: verdict_word
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "the episode's word, computed over MEASURING worlds only — a withheld or measured-nothing world is excluded exactly as an ungradable one is"}
          default: "null"
          distinguished: [undecidable]
          falsy_valid: false
          documented_alternatives: []
    - id: samples_yaml
      provenance: design
      facets:
        payload:
          parts:
            - {role: samples, source: template:QUESTIONER_SAMPLES, slots: {pattern: pattern}}
          invariants: [all-slots-bound]
          nl: "`{pattern: document}` exactly as handed to the questioner at step 2 — the reference O5's shape-invention claim is made against, moved into the episode archive so it survives a vanished source run"
        identity:
          key_axes: [episode_id, pattern]
          evidence: {nl: "one samples.yaml per episode dir, keyed by staged pattern (M4, key flow step 1); the pattern is `stagers/elastic.py::source_pattern`'s return, which P-C.2 shows is the captured row's `index` VERBATIM"}
          sharing: unique-key
        domain:
          type: mapping
          refinement: {nl: "written at step 2; a re-entered step 2 OVERWRITES it with the new draw's samples (H3), so THE SECOND ATTEMPT'S SAMPLES WIN and O5's byte-identity obligation holds within ONE ATTEMPT only (RS-1)"}
          default: "{}"
          distinguished: []
          documented_alternatives:
            # H3 (§7, human): OVERWRITE. crosses_validation: false because the shipped assumption
            # this alternative crosses — O5's `written once` byte-identity — does NOT stay valid
            # under it: on a re-entered episode the judge may be shown attempt N's samples for a
            # world authored in attempt N-1 (RS-1, accepted gap G-2).
            - {value: re-entered-step-2, crosses_validation: false}
    - id: served_ledger
      provenance: design   # served/<world>.jsonl — the staged row gains two fields
      facets:
        payload:
          parts:
            - {role: call, source: const:SERVED_CALL}
            - {role: witness, source: template:BASE_WITNESS, slots: {differs_from_base: differs_from_base}}
          invariants: [all-slots-bound]
          nl: "one row per served call; `source: staged` rows and only those carry `differs_from_base` and `base_pattern_digest`. Ledger fork F5 is resolved at §7 (resolved_by: auto, non-material, taken as recommended): the digest is sha256 of `comparator.canonical(base_text)`, so the digest and the `differs` verdict rest on one canonicalisation"
        identity:
          key_axes: [world_label, correlation_key]
