    - "F8 (ledger) — the drain box's rw set is a static union under one label. X16: `_drain_box_request` takes (wt, batch_id, label, paths) and never learns which queue crossed threshold, and both curators run inside one `author_drain` batch and one box. So 'two rw mounts' means the questioner corpus is bound rw in a findings-only batch that authors no questioner lesson, and the third exact-set site (`test_922_spine.py:397`, a declared must-stay-green guard) must be edited to say so. Recommendation: take the static union, edit all three sites, and read C-A's S5 at the LABEL grain. The alternative threads the fired triggers into `_drain_box_request`, keeping S5 at its stated strength and `:397` green, at the cost of a signature change to the function #922 made literal on purpose. MATERIAL — it is a security property. RESOLVED AT §7 inside A2, `resolved_by: auto`: take the static union, edit all three exact-set sites, and read C-A's S5 at the LABEL grain — which is why the label-grain weakness stays a named `handoff.deviations` entry rather than disappearing into the resolution."
    - "F9 (ledger) — `shape-invention` is a code literal under an open vocabulary. Superseded in recommendation by F-B(b): bind the refusal to the evidence rather than to the bucket string. MATERIAL — it decides whether O5's falsifier is evadable by renaming. RESOLVED AT §7 as A1(b), `resolved_by: auto`: the refusal binds to the EVIDENCE. `missing_sample_refuses_shape_invention` is kept and re-anchored, and `d_a_sample_unavailable_world_refuses_any_finding_citing_that_sample` carries the bucket-independent half."
    - "F-R2b (PHASE F — RESOLVED BY THE HUMAN IN THIS SAME ROUND) — WHO OWNS A QUESTIONER LESSON'S BYTES? R6's
       trust walk finding (c) recommended `a safe dump rather than interpolation` for the lesson
