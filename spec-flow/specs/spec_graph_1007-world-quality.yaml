    # --- ADDED AT §7: what the four seam probes refuted -------------------------------------
    - "C4's third clause, and with it O3's BY-CONSTRUCTION EXEMPTION: `PATCHED only when a patch applied` is FALSE. Executed (c4-noop-patch-reports-patched): an entity present in the payload with an empty-dict overlay reports PATCHED with the served content byte-identical to unpatched, because `apply_patches` counts an entity-NAME hit rather than a content diff. The other two named scenarios (absent target, empty patch table) DID report PASSTHROUGH. CORRECTION: RS-2 strikes the exemption and `patched_row_shown_by_construction` now rests on H1's corrected counter — a patched row counts as shown BECAUSE the merged content differs, the same standard a staged row's witness meets."
    - "That the applied-counter fix is CONTAINED to the staging path: REFUTED by 67-probe (pac-1..pac-5, executed). `apply_patches` has TWO callers, and the counter's value reaches a WORLD-REJECTION gate (`_patched_visible` -> `_rejection`, which ends the episode before siblings run) and the GRADING BUCKET TABLE (`doctored_answer_served`). CORRECTION: H1 puts all three consumers in scope with a test each, and this graph records the scope growth as an examined decision — #1007 never claimed those two areas. Worlds that complete today will be rejected under the new semantics; that belongs in the PR description, not only here."
    - "That the existing suite would catch a change of the counter's meaning: REFUTED by execution. The scratch change was applied and the 13 files referencing apply_patches / _patched_visible / doctored_answer_served / PATCHED were run before and after — 316 passed, 316 passed, 0 flipped (pac-4). No existing test exercises an empty or content-identical patch, so all three H1 demands are genuinely new coverage rather than restatements."
    - "The design's path for the redaction filter: it is `learning/branch/redaction.py::redact_model_visible`, not `runtime/redaction.py` (prd-4). CORRECTION: the filter is real, total, idempotent and already model-facing at five sites — which is what made H2's `no` an examined decision rather than an assumption, and G-1 an accepted gap rather than an oversight."
    - "That `review.yaml` is harmless because nothing renders it to a model: REFUTED as of this change. `review.py:569-582` stores `envelope_failed = str(fault)`, which is `AdapterFault.detail` verbatim for the base class and every subtype (prd-6, executed), and M4 renders that block into the per-world judge's prompt. CORRECTION: this change CONNECTS an already-shipped leak; the wrapper stops the model treating the text as instructions and does NOT strip the `wv-<world>-<stem>` names (G-1)."
    - "`sweep_glob`'s stated disjointness ('no other episode's names can appear under it'): REFUTED under the proposed per-attempt-unique ids (e68-8, executed). Because a nonce would be a SUFFIX, the plain episode token is a strict PREFIX of the nonce token, so `sweep_glob(plain)` matches a LIVE nonce attempt's aliases. Today the property holds only because the '-'->'.' fold puts a separator between ids. CORRECTION: the proposal is refused (H3); the invariant is untouched because the id is."
