       and `d_removing_the_episode_token_flag_leaves_no_orphan_in_the_committed_spec_corpus` (the
       SECOND live dependent, `spec_graph_947.yaml`'s own FORK-4 demand, which this run's census
       missed and the `lint_spec_graph` ratchet caught — it is re-pointed in this same change).
       THIS CLOSES, IN THIS CHANGE, THE SAME LEAK WHOSE EXECUTED EVIDENCE MADE H3 REFUSE THE
       HUMAN'S OWN PER-ATTEMPT-UNIQUE-ID PROPOSAL, and the two decisions are not in tension — a
       cold reader must not read them as contradictory, because they are not. H3 refused
       INTRODUCING per-attempt tokens (they would orphan a killed attempt's live cluster aliases,
