    - "F0 (ledger) — demand #0 is PROVISIONAL. Are the five new family-level fields `EpisodeGrade` dataclass fields round-tripped through BOTH `_write_judge_yaml` and `_grade_from_document` (C32), or YAML-only keys the dataclass never carries? Recommendation: dataclass fields on both sites. Addendum from the dispositions: the torn-file case is NOT the null-key case, and a parse failure must not read as 'every new field defaulted'. pc-5 confirms there is no THIRD reader to extend. MATERIAL — it decides d0/d0b's bound addresses. RESOLVED AT §7 inside A3's identity clauses, `resolved_by: auto`: dataclass fields on both sites, and `provisional: true` is dropped from demand #0."
    - "F3 (ledger) — where M1 lives. X12 refutes the doc: `_reachability` receives no captured rows and its `replay` closure binds `world=resumed` unconditionally. Recommendation: hoist the captured-row selection and the base arm to `review`/`_review_world` scope with the memo on `_Deps`, passing the completed re-asks down so the record stays one block. MATERIAL. CARRIED OPEN — THE ONE FORK §7 DID NOT ANSWER, and it is named rather than quietly absorbed: `70-resolutions.md`'s own conservation line accounts for F0, F4-F9 and does not name F3. Nothing in this graph depends on the siting — every M1 obligation binds `_reachability`'s edges, which exist wherever the code lands — so write-code-from-spec inherits it with X12's refutation attached: `_reachability` as it stands receives no captured rows and its `replay` closure binds `world=resumed` unconditionally, so the doc's stated site cannot host the capture re-ask unchanged. (The same conservation line names an `F19`, an id no frontier in this run coins; read as a slip for F-F's mount half, which A2's corpus scoping covers.)"
