       (`curator_engine._corpus_author_write_shapes`), and production never touches its bytes. So
       the recommendation as written would move ownership of a corpus document from the model to
       production — a design decision, not an authoring one. THE OPTIONS, so the human can pick:
       (a) leave it — the read-side demand is the whole answer, and a model that owns the document
