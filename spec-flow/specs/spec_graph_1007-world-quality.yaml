  - {id: d_an_unrecognized_drain_label_never_mounts_the_defender_corpus, kind: negative, form: test,
     minted_from: "F-F half 2, minted at §7 out of what was a `handoff.drops` entry: `_drain_box_request` is a two-way if/else, so a naive THIRD drain label falls into the `else` and mounts the DEFENDER corpus rw — a silent misroute of the same failure class as a silent widen (P-B's red flag)",
     discharged_by: test_an_unrecognized_drain_label_mounts_no_lesson_corpus_writable,
     binds: [_drain_box_request, drain_box_rw_set, "lessons_questioner_dir.access[drain-box]",
             "interacts(_drain_box_request->drain_box_rw_set)"]}

  # ---- A3 = F-E (auto, recorded for override): the pass owns identity, the model owns content --
  - {id: d_the_pass_stamps_world_and_a_model_supplied_world_is_ignored, kind: shape, form: test,
     minted_from: "A3(a): `world` is stamped from the draw's own world directory and a model-supplied `world` is IGNORED on a per-world finding",
     discharged_by: test_a_model_supplied_world_is_ignored_and_the_draws_own_directory_wins,
     binds: ["interacts(validate_reply->judge_reply).payload",
             "interacts(append_rows->questioner_findings_channel)",
