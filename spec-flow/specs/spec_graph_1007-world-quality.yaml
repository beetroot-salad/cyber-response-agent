    references that property, `SHIPPED_LESSON_CORPORA`, or the questioner corpus — it
    reverts a DEFENDER lesson file by path, unrelated to #1007's second channel/corpus.
    An import-graph edge with no behavioural reach. Out of scope for #1007 (implemented
    during write-code-from-spec continuation, post-write-tests).
  policy_cli: >-
    defender/scripts/policy_cli.py reaches curator_engine.SHIPPED_LESSON_CORPORA (widened
