    - id: mechanical
      provenance: code   # branch/comparator.py::mechanical — the whole witness for O2 and O3 (N7)
      facets:
        domain:
          type: enum
          refinement: {nl: "SAME | FORMATTING | None. P-D executed: a GENUINE content difference also returns None, identically to an incidental one — `mechanical` alone cannot tell 'content changed' from 'arithmetic could not decide'. The incidental-field protection (took/_shards/_id) lives in `elastic_adapter._search`'s normalization, NOT here."}
          default: "None"
