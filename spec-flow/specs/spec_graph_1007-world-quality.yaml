# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. The judge learns to grade the WORLD beside the defender. Review re-asks the
# capture's own queries live against each world's staged view and records three executed facts
# (M1); the serve path takes one extra base-pattern read per staged call so "the sibling was
# shown the difference" stops being inferred (M2); the mechanical pass gains a ladder row that
# WITHHOLDS a defender finding from a world that measured nothing (M3); the per-world judge is
# shown the questioner's own sample and the world's reachability block (M4); a second,
# family-level call judges what one world cannot (M5); findings partition by `subject` into a
# second queue channel (M6) feeding a second authored corpus, `defender/lessons-questioner/`,
# with its own curator (M7), which the questioner reads back at call 1 (M8).
#
# THREE THINGS A COLD READER MUST NOT RE-DERIVE FROM THE DOC:
#
#   1. THE WORLD FINDING VOCABULARY IS OPEN THIS ROUND, BY HUMAN DECISION (15-resolutions R2).
#      There is NO `WORLD_FINDING_TYPES` enum. `validate_reply` does not refuse an unknown world
#      bucket; the design's four names are PROMPT EXAMPLES, not a contract. `world_finding_bucket`
#      below models that openness (`documented_alternatives` including `any-unlisted-string`), and
#      NO DEMAND IN THIS FILE ASSERTS A CLOSED WORLD SET. The defender side stays PINNED (O8, R2).
#      KNOWN CONSEQUENCE, ACCEPTED, NOT REPAIRED: the openness disarms TWO stated falsifiers —
#      O5's `shape-invention` refusal is evadable by renaming (ledger F9), and O6's "its reply
#      carries a per-world bucket" CANNOT FIRE AT ALL, because the family reply is itself
#      `subject: world` and takes the freeform arm (45-dispositions F-B, previously unsurfaced).
#      Both are relayed at §7; neither is silently fixed here.
#
#   2. THIS CHANGE EDITS THREE EXACT-SET ASSERTIONS #922 WROTE RED-FIRST AS TRIPWIRES:
#      `defender/tests/e2e/test_922_spine.py:327` (`trigger.modules == ["author"]`), `:361`
#      (`writable_sources(request) == {paths.lessons_dir}`) and `:397` (the same exact set inside
#      `test_922_a_full_findings_queue_alone_wakes_the_drain`, whose docstring reads
#      "GUARD (green now, must stay green)"). The human decided this deliberately (R1): a second
#      channel arriving WITH its test edit honours #922's stated property ("a second channel
#      returning is an edit here, in a diff") rather than exempting itself from it. It is modelled
#      as a REMOVED/CHANGED shared-sink property — two `mode: remove` edges from actor
#      `test_922_spine` — so R5 fires on it and the gate sees it. It is NOT incidental test churn.
#
#   3. THIS CHANGE ALSO REMOVES `--episode-token`, A FLAG #1007's DESIGN NEVER MENTIONS. The
#      human decided it in this round (F-R5) rather than deferring it, on this run's own executed
#      evidence: the override replaces the derived token outright, is threaded to staging and to
#      nothing else, defeats `staging.sweep`'s disjointness by hand in both directions, and has no
#      reachable input at all. It is the SECOND scope growth into pre-existing behaviour this round
#      (H1's applied counter is the first). IT IS NOT A REVERSAL OF H3, and a cold reader must not
#      read it as one: H3 refused INTRODUCING per-attempt episode ids; this removes an existing way
#      to reach the same leak. Both protect one invariant — an episode's namespace is derived from
#      its episode id and from nothing else. It reaches TWO committed artifacts outside this
#      suite's own files, both live dependents of the removed escape: the test
#      `test_947_triplet_manifest.py` (edited in place onto the substitute) and
#      `spec-flow/specs/spec_graph_947.yaml` (its FORK-4 demand re-pointed at that renamed test).
#      The second was found by the `lint_spec_graph` CI ratchet, not by this run's census.
#
#   4. FIVE NAMES THE DESIGN DOC USES RESOLVE TO NOTHING AT HEAD AND ARE BOUND BY NO DEMAND:
#      `_CORPUS_ATTR_FOR_TRIGGER_MODULE`, `_drain_triggered_corpora`, `author/benign_actor/`,
#      `ALL_FINDING_TYPES`, `BENIGN_ALL_FINDING_TYPES` (claims G1, G2, X1, X2, X4, PB1).
#      M6/M7 attach instead to #922's four surviving literals: `_CURATOR_MODULES`,
#      `_curator_queue_checks`, `_drain_curators`, and `_drain_box_request`'s `label` branch.
#
# NAME RECONCILIATION (phase D's own job — the three coining passes met here).
#   * `review_record.reachability` (ledger) is NOT an address form: `reachability` is not one of
#     schema.md's four facets. RE-SITED to a boundary `reachability` (the per-world block), with
#     its two decided fields lifted to their own domain-bearing boundaries `reachable_by_capture`
#     and `capture_addressed` so R4 exercises each member per cell.
#   * `served_ledger.payload.domain.distinguished[null]` RE-SITED to
#     `differs_from_base.domain.distinguished[null]` — the null is a member of the new field's
#     domain, not of the row payload's.
#   * `drives(_grade_world->findings_channel)` is MALFORMED — `drives` is Actor->Actor and
#     `findings_channel` is a boundary. RE-SITED to `drives(_grade_world->append_rows)` plus
#     `interacts(append_rows->findings_channel)`, which is what the ladder actually does.
#   * `launcher` keeps the ledger's id (code symbol `learning/branch/cli.py::main`, step 2);
#     `_served` is `estate/registry.py::WorldRegistry._served` (:407), verbatim.
#   * Every axis a `key_axes`/`interpolates` member names is declared once in `structure.axes`.
#
# THE HUMAN SEAM HAS NOW RUN (`.spec-flow/frontiers/70-resolutions.md`), AND THIS FILE CARRIES ITS
# ANSWERS. Seven resolutions: four human-decided (H1 the applied-counter's meaning, H2 the
# judge-prompt framing, H3 re-entry policy, H4 the confirming re-read) and three auto-resolved to
# the judge's recommendation and recorded for override (A1 = F-B, A2 = F-C, A3 = F-E). Every
# `unknown` this phase left as a fork-made-mechanical is now decided: the four `crosses_validation`
# crossings, both `constraints: unknown` prompt cells, and the non-injective memo derivation.
# Six things a cold reader must NOT re-derive from the pre-seam text:
#   * RS-2: O3's BY-CONSTRUCTION exemption for `patched` rows is STRUCK. C4 is refuted by
#     execution — an entity present with an empty-dict overlay reports `PATCHED` with byte-identical
#     served content — so `patched_row_shown_by_construction` now rests on H1's corrected counter.
#   * H1 GROWS THE BLAST RADIUS into two areas #1007 never claimed. `apply_patches` counting content
#     rather than an entity-name hit reaches (i) the serve path's ledger `source`, (ii)
#     `_patched_visible` -> `_rejection`'s WORLD-REJECTION gate (worlds that complete today will be
#     rejected), and (iii) `judge/family.py`'s `doctored_answer_served` -> bucket-table selection.
#     316 tests passed both before and after the executed change with 0 flips, so all three demands
#     are genuinely new coverage, not restatements of anything the suite already holds.
#   * RS-1: O5 holds WITHIN ONE ATTEMPT only. A re-entered step 2 overwrites `samples.yaml` (H3), so
#     the graph carries BOTH the restated obligation and a demand pinning the accepted re-entry
#     behaviour — an uncovered re-entry that merely passes is the failure mode.
#   * G-1: the untrusted wrapper is added to the `sample` and `review` sections; the redaction
#     filter is NOT. `review.py:569-582`'s already-shipped `envelope_failed = str(fault)` carries
#     `AdapterFault.detail` verbatim into `review.yaml`, which M4 renders into a model prompt. NO
#     DEMAND HERE MAY IMPLY THE `wv-<world>-<stem>` NAMING SCHEME IS PROTECTED ON THIS PATH; the
#     knowingly-accepted gap is the `form: waiver` demand `g1_fault_detail_reaches_the_judge_prompt_unredacted`.
#   * PER-ATTEMPT-UNIQUE EPISODE IDS WERE PROPOSED AND REFUSED ON EXECUTED EVIDENCE (e68-1..9). Do
#     not re-propose them: they orphan a killed attempt's cluster aliases (`staging.sweep` is the
#     only crash recovery and is keyed on `episode_token_for(episode_id)`), and because the nonce is
#     a SUFFIX an old attempt's sweep glob matches a LIVE attempt's names.
#   * A1 STRIKES O6's BUCKET FALSIFIER. That is the SECOND falsifier the open world vocabulary
#     disarmed (O8's was the first, corrected at the early-exit seam). Recorded as a consequence of
#     the human's own R2, never repaired.

