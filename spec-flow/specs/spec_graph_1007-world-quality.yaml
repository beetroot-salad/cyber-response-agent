       prints again`. Option (b) would make that refusal name a do-nothing remedy for EVERY
       reachable input, because no id that `refuse_bad_episode_id` admits is untokenable — i.e. it
       manufactures precisely the failure the incumbent module says it exists to prevent. Removal
       leaves the module self-consistent, and the surviving refusal stops naming a flag and takes
       the shape of the launcher's sibling refusals (`name a fresh source run or branch point`).
