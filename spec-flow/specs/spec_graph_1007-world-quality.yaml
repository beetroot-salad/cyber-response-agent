  - {id: d_a_family_finding_is_keyed_by_the_pass_on_episode_family_draw_index, kind: uniqueness, form: test,
     minted_from: "A3(d): a family finding is keyed on (episode, 'family', draw, index) with `source_run_dir` the episode dir",
     discharged_by: test_a_family_findings_identity_is_minted_by_the_pass_not_by_the_model,
     binds: ["questioner_findings_channel.identity", "interacts(append_rows->questioner_findings_channel)",
             "judge_record.identity"]}
  - {id: d_direction_is_derived_from_subject_at_the_builder, kind: coherence, form: test,
     minted_from: "A3(c): `direction` is DERIVED from `subject` at the builder, so a row whose direction and subject disagree is unrepresentable rather than merely refused",
     discharged_by: test_direction_is_derived_from_subject_so_disagreement_is_unrepresentable,
     binds: ["interacts(append_rows->questioner_findings_channel)",
             "interacts(append_rows->findings_channel)", subject,
             "interacts(_gate_findings->findings_channel)"]}
  - {id: d_the_appender_is_the_last_screen_for_the_required_world_fields, kind: shape, form: test,
     minted_from: "A3(b): `pattern`, `holding_system` and `subject` are REQUIRED at the appender — the questioner channel's own gate is idempotency-only (M7), so the appender is the last screen",
     discharged_by: test_a_world_row_missing_pattern_holding_system_or_subject_is_refused_at_the_appender,
     binds: ["interacts(append_rows->questioner_findings_channel)", "questioner_findings_channel.payload",
             "interacts(questioner_curator->questioner_findings_channel)"]}
  - {id: d_a_re_grade_is_absorbed_by_the_mechanical_findings_fixed_draw_and_index, kind: uniqueness, form: test,
     minted_from: "A3(e): the mechanical finding takes a fixed synthetic `draw`/`index`, so a re-grade of the same episode is absorbed by idempotency rather than appending a second row",
     discharged_by: test_a_re_grade_appends_no_second_mechanical_world_finding,
     binds: ["questioner_findings_channel.identity", "drives(_grade_world->append_rows)"]}
  - {id: d_the_world_lane_does_not_share_the_defender_lanes_unqueueable_early_return, kind: parity, form: test,
     minted_from: "A3(g): the world lane does NOT share the defender lane's unqueueable early return — a defender finding that cannot be queued must not silently take the world findings with it",
     discharged_by: test_an_unqueueable_defender_finding_does_not_suppress_the_world_findings,
     binds: ["drives(_grade_world->append_rows)", "interacts(append_rows->findings_channel)",
             "interacts(append_rows->questioner_findings_channel)"]}
  - {id: d_an_ungradable_world_enqueues_no_findings_of_either_subject, kind: negative, form: test,
     minted_from: "A3(g): an ungradable world enqueues no findings of EITHER subject (the positive control is a gradable world on the same drive, which enqueues both)",
     discharged_by: test_an_ungradable_world_enqueues_nothing_on_either_channel,
     binds: ["interacts(append_rows->findings_channel)",
             "interacts(append_rows->questioner_findings_channel)", "judge_record.identity"]}
  - {id: d_a_world_row_carries_no_defender_verdict_word, kind: negative, form: test,
     minted_from: "A3(g): a world row carries no defender verdict word — the world's row is about the world, and a defender verdict on it is the category error O1 exists to prevent",
     discharged_by: test_a_questioner_queue_row_carries_no_defender_verdict_word,
     binds: ["questioner_findings_channel.payload", verdict_word,
             "interacts(append_rows->questioner_findings_channel)"]}
  - {id: d_an_episode_that_died_before_the_defender_ran_is_withheld_as_episode_incomplete, kind: domain-outcome, form: test,
     minted_from: "A3, cell (h): ladder row 1 requires at least one SERVED row somewhere in the episode before any defender finding is authored; otherwise the world is withheld with reason `episode_incomplete`. Without it an episode killed before step 5 is indistinguishable from a defender that queried nothing, and the defender is falsely accused at O4's own falsifier",
     discharged_by: test_an_episode_killed_before_the_sibling_ran_withholds_with_episode_incomplete,
