       (f5-override-has-no-reachable-purpose). THE OPTIONS OFFERED WERE: (a) out of scope for #1007;
       (b) screen it — refuse the override when the derived token is nameable; (c) thread it —
       record the token in `family.yaml` and have every reader take it from there; (d) delete the
       flag. RESOLVED: OPTION (d), THE FLAG IS REMOVED, `resolved_by: human`, and it is CLOSED IN
       THIS CHANGE rather than deferred. The probe is what makes that safe: the escape has no
       reachable input, so removing it removes a door with nothing behind it.
       REMOVE RATHER THAN SCREEN, and the spelling is chosen to be honest about the incumbent code
       rather than to minimise the diff. `cli._episode_token`'s own docstring says the override
       `has to reach episode_token_for or the refusal below names a remedy that does nothing: the
