handoff:
  # FOURTEEN FORKS REACHED §7 AND THIRTEEN CAME BACK ANSWERED. Six from `45-dispositions.md`'s
  # human seam (F-A..F-F) and eight carried in the demand ledger (F0, F3-F9). Each entry keeps
  # the question as it was asked and ends with `RESOLVED AT §7` plus `resolved_by: human | auto`
  # and the reading taken — `auto` means §7 judged the fork non-material and took the judge's
  # recommendation, and THE ENTRY IS WHAT LETS THE MERGE-GATE HUMAN SEE THE CHOICE AND DISAGREE
  # WITH IT. TWO MORE WERE RAISED AT PHASE F AND BOTH CAME BACK ANSWERED BY THE HUMAN IN THE SAME
  # ROUND — F-R2b (who owns a questioner lesson's bytes) and F-R5 (what `--episode-token` is for) —
  # so sixteen forks in all, fifteen answered. EXACTLY ONE is carried OPEN on purpose and says so:
  # F3, where M1 lives. An open question reported as decided here — or a taken recommendation
  # reported as a human's own decision — is a defect in the baton, so the three spellings
  # (`resolved_by: human`, `resolved_by: auto`, `CARRIED OPEN`) are never used interchangeably.
  forks:
    - "F-A — `differs` is a comparison of two live reads and the spec treats it as a fact. N7 says both arms are read in the same pass; M1 memoises the base arm at episode scope and the doc's own Review calls the hoist 'scale, not correctness'. Both cannot be true, and everything O2, O3 and O4 assert rests on this one boolean. Cells: (a) time skew between a memoised base arm and a later world arm; (b) `mechanical -> None`; (c) read-to-read instability; (d) memo key granularity; (e) both arms empty for an `exclude` world; (f) one arm faults. Recommendation relayed: (b) None is UNDECIDED, not `differs` — it records faulted-equivalent and withholds; (d) the memo key is the full (source_pattern, params) tuple; (e) both-empty is SAME; (f) either arm failing records `faulted: true` once. (a)/(c): P-D has now landed and COLLAPSES (c) — `elastic_adapter._search` strips took/_shards/_id before the ledger sees the payload, so the noise cells cannot arise for this adapter — leaving skew alone, whose cheap fix is one back-to-back re-read confirming a `differs: true` before it is recorded. (b) is SHARPER than the dispositions knew: pd-5 shows a genuine difference returns None too. Impact: every unrecommended arm converts an instrument fault into an accusation against the defender. RESOLVED AT §7 as H4, `resolved_by: human`: A DIFFERENCE IS CONFIRMED BY ONE BACK-TO-BACK RE-READ BEFORE IT IS RECORDED, and the extra read happens only on the differing path (cells a and c). The guard clauses are taken as recommended: (b) `None` is UNDECIDED, never `differs`, and because `mechanical(None, <text>)` raises an uncaught TypeError both M1 arms AND M2's witness must guard a `None` side rather than call through it; (d) the memo key is the full (source_pattern, params) tuple, so the graph's non-injective derivation is struck; (e) both arms empty is SAME; (f) either arm failing records `faulted: true` once. H4 also names something no obligation had: `elastic_adapter._search()`'s normalization strips took/_shards/_id BEFORE the ledger sees the payload, so the ladder's safety lives one layer away from the code that depends on it — `d_the_adapter_normalization_the_ladder_rests_on_is_load_bearing` pins it."
    - "F-B — which stated refusals survive R2's open world vocabulary. (a) O6's falsifier 'its reply carries a per-world bucket' CANNOT FIRE: the family reply is itself `subject: world` and takes the freeform arm, and a per-subject `_BUCKET_ENUM` cannot express a per-call-site rule. (b) O5's `shape-invention` refusal is keyed on that exact string, so `shape-fabrication` evades it (ledger F9). (c) the mechanical pass and a model draw can both mint `unreachable-difference` on one world with nothing distinguishing them. Recommendation relayed: (a) STRIKE the bucket clause from O6's falsifier and keep the half that fires ('its input withholds any world') plus the two structural pins (every family finding carries `world: null` and never `subject: defender`) — pinning the family arm re-closes what the human opened; (b) bind the refusal to the EVIDENCE, not the bucket string — when a world's row carries `sample_unavailable`, any `subject: world` finding for that world citing `samples.yaml#<pattern>` is refused whatever its bucket; (c) mechanical findings carry a provenance field and readers key on provenance, never on bucket uniqueness. RESOLVED AT §7 as A1, `resolved_by: auto` — the judge's recommendation taken verbatim on all three cells and recorded here for override. (a) O6's bucket clause is STRUCK and the half that still fires is kept, plus the two structural pins (`world: null`, never `subject: defender`); (b) O5's sample-dependent refusal binds to the EVIDENCE — a `subject: world` finding for a world whose row carries `sample_unavailable`, citing `samples.yaml#<pattern>`, is refused WHATEVER its bucket, which is not evadable by renaming; (c) mechanical findings carry a provenance field and readers key on provenance, never on bucket uniqueness. STILL NOT REPAIRED, and this is the point: A1 strikes a falsifier rather than restoring one, which makes it THE SECOND FALSIFIER THE OPEN WORLD VOCABULARY DISARMED (O8's was the first, corrected at the early-exit seam). It is a known consequence of the human's own R2, recorded, never silently fixed."
    - "F-C — the two-curator batch: one unit or two. R1 lands M6/M7 on #922's four literals and says nothing about the UNIT once two curators share one `author_drain` tick, one worktree, one box and one branch. Cells: (a) the commit/push/PR-lease unit; (b) fault isolation between the two curators; (c) whether a raise outside `_run_curator_module`'s catch aborts the tick; (d) the second `drain_lock`; (e) stray-revert and cleanliness scoping across two corpora in one tree; (f) the rw mount set (ledger F8); (g) the wake gate's two-channel read. Recommendation relayed: ONE unit — one drain lock (the new channel declares its own append lock and consumed file but SHARES the drain lock), one batch, one branch, one PR lease; per-curator consumption and per-curator corpus scoping; a curator's fault leaves the other's landed commit and consumed markers intact. P-A HAS NOW ANSWERED (c), (e) and half of (a) as facts rather than choices: the catch is (SubprocessError, OSError) only, a GitError aborts the tick and an uncaught ModelRetry escapes even `cli._run_stage`; cleanliness IS pathspec-scoped but the stray scan and `head_before` are repo-wide; and the lease/commit already runs once per TICK, so 'one PR per corpus' is a signature change, not a setting. RESOLVED AT §7 as A2, `resolved_by: auto` — recommendation taken and recorded for override: THE TWO-CURATOR TICK IS ONE UNIT. One shared drain lock (the questioner channel declares its own `append_lock` and `consumed` file but SHARES the drain lock, so two curators never hold the worktree at once), one batch, one branch, one PR lease covering both corpora; per-curator consumption and per-curator corpus scoping for cleanliness and stray-revert; a curator's fault leaves the other's landed commit and consumed markers intact and is RECORDED, never rolled back. Ledger fork F8 folds in here, and cell (d) restates `world_channel_has_its_own_locks` rather than dropping it."
    - "F-D — the write discipline and re-entry policy of the three new episode artifacts, in a directory nothing ever removes. Cells: (a) review.yaml's reachability block, whole-record or per world; (b) samples.yaml on a re-entered step 2; (c) M2's witness, one row write or a follow-up mutation; (d) a re-entered review, re-derive or trust; (e) the base-arm memo across two review invocations. Recommendation relayed: write-once-per-pass, whole-record, re-derive on re-entry; samples.yaml exclusive-create and a re-entered step 2 that finds one REFUSES the adopt; the witness rides the same append that writes the staged row so a witness-less staged row is unreachable by construction. P-C.3 HAS NOW SETTLED (a) as the incumbent cadence — executed, one `write_guarded` call per episode pass — and that half is bound here (`d_the_reachability_block_rides_the_one_whole_record_review_write`). P-C.4 SHARPENS (b): the adopt path admits a directory carrying all three new artifacts without inspecting any of them, so O5's byte-identity obligation is not satisfiable on an adopted episode without a decision. RESOLVED AT §7 as H3, `resolved_by: human` — OVERWRITE AND RE-DERIVE, against the recommendation. A re-entered step 2 overwrites `samples.yaml` with the new draw's samples and the SECOND ATTEMPT'S SAMPLES WIN; a re-entered review re-derives the reachability block; the adopt path keeps its current admission predicate and keeps resuming killed episodes, because resumability exists so a launcher killed mid-prime does not make that source and branch point permanently unbranchable. Refusing the adopt and refuse-plus-cleanup were both rejected, with reasons. PER-ATTEMPT-UNIQUE EPISODE IDS WERE PROPOSED BY THE HUMAN AND REFUSED ON EXECUTED EVIDENCE (e68-6..e68-9), not on preference — they orphan a killed attempt's cluster aliases, a suffix nonce makes an old attempt's sweep glob match a LIVE attempt's, and they would not solve the stated problem because the cluster corpus is reused across attempts whatever the directory is called. O5 is RESTATED (RS-1) rather than repaired, and the cross-attempt case is accepted gap G-2, pinned by a demand so the gap is covered rather than merely uncovered."
    - "F-E — the world/family finding's contract: shape, identity, evidence scope and enqueue eligibility. Absorbs ledger forks F10-F13 and F15 into one decision. Cells: (a) `world` per subject; (b) required fields on a questioner queue row and WHERE the refusal lives; (c) `direction` derived from `subject` or independently settable; (d) the family row's `finding_id` and `source_run_dir`; (e) the mechanical finding's `draw`/`index`, hence re-grade idempotency; (f) `finding_id` across two channels; (g) eligibility — the unqueueable-verdict early return, an ungradable world's findings, and what verdict word a world row carries; (h) PROMOTED: ladder row 1 fires `lead-set` against the defender for a world whose sibling NEVER RAN AT ALL, which is a false accusation at O4's own falsifier. Recommendation relayed: the pass owns identity and the model owns content — `world` stamped from the draw's own directory, a family finding keyed on (episode, 'family', draw, index), `direction` derived at the builder, `pattern`/`holding_system`/`subject` required AT THE APPENDER (the questioner channel's own gate is idempotency-only by M7, so the appender is the last screen), a fixed synthetic draw/index so a re-grade is absorbed by idempotency, the world lane does NOT share the defender lane's unqueueable early return, an ungradable world enqueues nothing, a world row carries no defender verdict word, and (h) ladder row 1 requires at least one SERVED row somewhere in the episode before any defender finding is authored, else a fourth withholding reason `episode_incomplete`. RESOLVED AT §7 as A3, `resolved_by: auto` — the whole recommendation taken and recorded for override: THE PASS OWNS IDENTITY AND THE MODEL OWNS CONTENT. Cell (h) included, so a world whose episode died before the defender ran is WITHHELD with reason `episode_incomplete` rather than blamed at O4's own falsifier. Ledger fork F0 folds in here (the five family-level fields are dataclass fields round-tripped through both C32 sites), and so does F-E(f), whose read-side demand R8 asked for."
    - "F-F — the surfaces this change opens that the security dive never enumerated. HALF 1 (two new model-facing content channels): M4 renders `sample` (a real captured, attacker-influenced document) and `review` (carrying M1's faulted re-ask entries) into the per-world judge's prompt with no stated framing, while S3 sets the untrusted-frame precedent for the questioner's capture sections and `redaction.py` exists because an AdapterFault.detail can carry the view-naming scheme verbatim. Also here: the open bucket string written into lesson frontmatter and read back into the questioner's prompt, `capture_replays[].key`'s composition from a captured row's own field values, and M2's `fn(ctx, **moved)` splat of an attacker-shaped params dict. Recommendation relayed: MINT them — the same run-salted untrusted frame on both new sections, a redacted fault CLASS never raw detail, frontmatter values through a safe dump, and the witness read mapping params explicitly rather than splatting. The human decides whether they are in scope this round; the alternative disposition is 'accepted gap, recorded in handoff.deviations'. HALF 2 (the corpus root as a new surface): P-B HAS LANDED and this half is now answerable — no production enumerator widens silently, so three demands are minted here (`d_the_new_corpus_root_widens_no_read_or_write_scope`, `d_every_enumerator_that_must_see_the_new_corpus_is_edited_here`, `d_a_questioner_lesson_never_reaches_the_defender_agents_prompt`) and what REMAINS for the human is the curator's own filename containment, the lesson identity across ticks, and F16 (no retirement mechanism, recorded as a known limit). RESOLVED AT §7 IN TWO HALVES. Half 1 -> H2, `resolved_by: human`: WRAPPER YES, FILTER NO. The `sample` and `review` sections carry the same run-salted untrusted frame the existing capture sections carry; `redact_model_visible` is NOT applied. It was probed and offered first (prd-1..prd-5: total, idempotent, strips exactly the `wv-<world>-<stem