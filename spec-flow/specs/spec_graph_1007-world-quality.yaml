          evidence: {nl: "M1 states the memo is keyed 'per key'; the capture key that identifies one live read is the (source_pattern, params) pair, since two captured rows can share a source_pattern and differ in params — read off `stagers/elastic.py::source_pattern`, which P-C.2 shows returns the params' `index` verbatim and None when there is none. H4's guard clause for F-A(d) (§7) TAKES THE FULL TUPLE: the graph's `source_pattern_key` derivation, declared `injective: false` to make the gap mechanical, is STRUCK, and the writer now interpolates the whole `capture_key` axis"}
