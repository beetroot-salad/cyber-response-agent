    # ===== H1: the applied counter and its two non-staging consumers =========================
    - id: applied_counter
      provenance: design   # lookups.py:82-108 `apply_patches` -> `applied`; its MEANING changes (H1)
      facets:
        domain:
          type: int
          refinement: {nl: "how many patches this call applied. TODAY it counts an entity-NAME hit (`_hits`), so `out.update({})` on a present-but-empty patch still increments it and the applier reports PATCHED with byte-identical served content (c4-noop-patch-reports-patched, executed). UNDER H1 it counts only when the merged content DIFFERS from the input. The value is read by three independent consumers, none of which is a staging count."}
          default: 0
          distinguished: [0]
          falsy_valid: true
          documented_alternatives:
            - {value: name-match-with-identical-content, crosses_validation: true}   # H1: the cell that flips
