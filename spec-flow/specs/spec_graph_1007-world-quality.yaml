    - "F-R5 (PHASE F — RESOLVED BY THE HUMAN IN THIS SAME ROUND) — WHAT IS `--episode-token` FOR? 68-probe's red
       flag 2 said the override `would need its own answer` and the chain closed without one: the
       flag appeared once in the whole frontier trail and nowhere in this graph. Probed at phase F
       rather than dismissed, because H3 REFUSED the human's own per-attempt-unique-episode-id
       proposal on the executed ground that `staging.sweep` is the only crash recovery for live
       cluster aliases and is keyed on `episode_token_for(episode_id)` — and this door defeats
       exactly that key by hand (f5-override-breaks-sweep-disjointness-by-hand: neither direction's
       glob matches the other attempt's live names, with the same-token control True). Three more
       executed facts: the override replaces the derived token entirely, so two DIFFERENT episode
       ids can share one token (f5-override-replaces-the-derived-token); it is threaded to staging
       and to NOTHING ELSE — review.py:298, _family.py:702 and _family.py:859 all re-derive from the
       episode id and the manifest records no token — so an episode launched with the flag stages
       under one namespace and is read under another (f5-override-is-not-threaded-to-any-reader);
       and its stated purpose has no reachable input, because 0 of 16104 exhaustively-swept ids plus
