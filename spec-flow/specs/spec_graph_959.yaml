schema_version: 2
design: "959"   # gh issue #959, title "bash parse: four places decide where a word ends, and one of
                # them is a second parser". THE AUTHORITATIVE TEXT IS THE COMMENT ("Discussion —
                # grounded against 6a2ea874"), not the body: the body is partly stale and three of
                # its sentences are struck below. Read with `gh issue view 959 --json title,body,comments`
                # (plain `--comments` returns empty in this environment — that is a failed read, not
                # an empty thread).
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`). check_binds
                        # scans its docstrings; every `discharged_by` below is a test that does not
                        # exist yet, which is the expected phase-D state.
base: 6a2ea874          # main, #958 merged. write-code-from-spec's gate diffs against it.

# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. Four places in the request path independently decide where a bash word ends:
# `bash_exec._scan` (the scanner), `bash_exec._word_value` (a `shlex.split` per word),
# `hooks/_cmd_segments.unwrap` (a second parser that flattens the command with `shlex.split`
# before deciding what the `bash -c` argument was), and `permission/bash.decide_bash`'s
# `command.strip()`. After this change exactly one place does. Six mechanisms:
#
#   M1  `_scan` yields one frozen record per token: value, start, end, kind.        (D3)
#   M2  `_word_value` becomes an unquoter over a span — no blank set, no splitter.  (O2)
#   M3  the wrapper folds into `parse`: prefix matched by TOKEN INDEX, the `-c`
#       argument taken as its own token's RESOLVED VALUE and re-scanned (the token's
#       SPAN says where it ends, which is what makes an outer operator visible — the
#       comment's own "line[start:end] of the -c argument" is false for this arm and
#       is corrected under RC7), the `timeout` prefix's remainder taken as the RAW
#       SLICE from the next token's start, nothing returned when an outer operator
#       means the wrapper is not the whole command.                                 (O1,O2,O4)
#   M4  the gate's `command.strip()` is deleted.                                    (O1)
#   M5  the verdict-change set is written down before implementation.               (O3)
#   M6  `\r` leaves `_BLANKS` (a), and the #955 oracle reads the recorded
#       argv file in BINARY (b).  NEW at §7 (F6) — not in the issue body.           (O1)
#
# M6 IS NECESSARY BUT NOT SUFFICIENT ON ITS OWN, AND THAT DEPENDENCY IS PART OF THE SPEC.
# `_word_value` is `shlex.split(span, comments=False, posix=True)`, whose own hardcoded
# whitespace contains `\r` whatever `_BLANKS` says. With M6(a) alone: a mid-word `\r`
# still splits the resolved value (`'A\rB'` -> `['A','B']`), an edge `\r` is silently dropped
# (`'P\r'` -> `['P']`), and a lone `\r` resolves to zero parts, fails the `len(parts) == 1`
# guard and makes the whole line untokenizable. M6 closes O1 only if M2 lands as
# `d_the_unquoter_has_no_notion_of_whitespace` requires. (45-dispositions RF-J4; three readers
# found this independently; d_the_two_layers_agree_about_the_removed_separator pins it.)
#
# WHY THIS SPEC IS SHAPED THE WAY IT IS — three things carried forward:
#
#   1. THE ENUMERATED VERDICT-CHANGE SET IS A STATED DELIVERABLE (D2/M5/O3) AND IT WAS WRONG.
#      It was closed at four members; it has six (the sixth contingent on FK1). What was
#      missing, and what is corrected, is written out in full under
#      `d_the_enumerated_set_is_written_before_implementation` — including M3's OWN HEADLINE
#      CASE, which was absent while member 1 named M4's fix by name.
#
#   2. THE SPEC'S OWN RECORD LOST THE CHARACTERS FOUR PREMISES ARE ABOUT. `40-premise-file.py`
#      and every answer file contain ZERO literal U+00A0, `\v`, `\f`, `\r` or U+2028 (claim a3,
#      computed over the files' own bytes). Four worked examples were written with a literal
#      U+00A0 that is now an ordinary space, and one docstring visibly self-corrects mid-sentence
#      as its author watched the character vanish. The four are RESTATED IN ESCAPED FORM below
#      (see "THE FOUR RESTATED WORKED EXAMPLES"), and the instruction is carried forward:
#
#        *** EVERY DIVERGENT-BLANK CASE IN THE SUITE IS BUILT FROM AN ESCAPE — "\u00a0",     ***
#        *** "\v", "\f", "\r", "\u2028" — NEVER FROM A LITERAL CHARACTER TYPED INTO A         ***
#        *** DOCSTRING OR A FIXTURE. A test written from a literal that has been normalised   ***
#        *** away passes while exercising an ordinary space. This is the issue's own defect   ***
#        *** class occurring inside the paperwork about it.                                   ***
#
#   3. THE ESCALATION TIER'S INDEPENDENCE WAS COMPROMISED (45-dispositions RF-J1): both
#      escalation readers were handed the first reader's own `# HEDGE:` labels on 41 of 43
#      premises, so a CONVERGED HEDGE IS WEAK EVIDENCE in this run. The judge re-weighted and
#      its dispositions are taken as given here; nothing in this file treats converged hedging
#      as signal, and no disposition is re-derived.
#
# ADDRESS SPELLING CONVENTION. A `domain.distinguished[...]` member is written as its PYTHON
# REPR — `""`, `"   "`, `"\t"`, `"\r"`, `"\u00a0"` — quotes and backslashes included, never as
# the character itself. That is deliberate: it is the same instruction as (2) above applied to
# this file, it keeps the whole artifact ASCII, and it is what `20-demands.md` already coined,
# so the inherited addresses resolve unchanged.
#
# NAME RECONCILIATION (three passes coined ids independently; this is the unification):
#   * `bash` is THE via for the bash lane's access cells. `spec_graph_575-grant-gate.yaml` spells
#     it `bash` on `read_surface`; `spec_graph_691.yaml:746` spells the decide_bash cat-scope cell
#     `bash-cat` on a DIFFERENT boundary (`corpus_dir`); `20-demands.md` coined `bash-tool`.
#     One spelling, `bash`, is used here and `bash-tool` is retired. (claims g11, a5.)
#   * `decide_bash`, `tool_bash`, `compile_policy`, `decide_read`, `defender_policy_cli`,
#     `read_surface`, `bash_exec`, `BashDecision` keep the ids `spec_graph_575-grant-gate.yaml`
#     coined, keyed by role+origin, so the two graphs join.
#   * THE FOLDED WRAPPER STEP WAS `_wrapper_span`, AND IS RETIRED (#971). It named the step that
#     recognised `bash -c '<payload>'` and handed the payload on to be parsed in place of the
#     command the model wrote. Both wrapper arms are gone now — the `timeout` prefix (member 9)
#     and this one (member 10) — for one reason: a fold DELETES TEXT AHEAD OF THE DECISION, so
#     mis-reading the shape widens what the gate allows, while a pass-through can only refuse.
#     `unwrap` remains here as the element M3 removed (R5's subject, and what the migration
#     demands bind); `_wrapper_span` remains as the element that replaced it and then went the
#     same way. No function of either name exists in the code.
#
# THE FOUR RESTATED WORKED EXAMPLES (45-dispositions RF-J2 / note 5). Escaped, and each names
# the demand that carries it:
#
#   1. `timeout\u00a05 cat x`  — a divergent blank GLUED to the wrapper word. The first token is
#      `timeout\u00a05`, which is not `timeout`, so the wrapper is not recognised and the glued
#      token denies as an ordinary ungranted program — matching bash, which would look for a
#      program of that name. (was written as `timeout 5 cat x`, 40-premise-file.py:147)
#      -> d_a_unicode_blank_belongs_to_the_word_it_touches
#   2. `bash\u00a0-c 'ls'`     — the same shape at the `bash`/`sh` arm. `bash\u00a0-c` is one
#      word and is not `bash`; nothing special-cases a leading `bash` substring, so it denies.
#      (was written as `bash -c 'ls'`, 40-premise-file.py:163 — the docstring that self-corrects
#      mid-sentence, "— wait, U+00A0 does not separate `bash` from `-c` here …")
#      -> d_a_unicode_blank_belongs_to_the_word_it_touches
#   3. `bash -c '\u00a0cat x'` — a divergent blank INSIDE the wrapper-extracted inner command.
#      The extracted text is re-scanned by the same scanner, so the blank belongs to `cat` there
#      exactly as it would in a bare command. (was written as `bash -c ' cat x'`,
#      40-premise-file.py:172) -> d_the_divergent_blank_rule_reaches_wrapper_extracted_text
#   4. `\u00a0timeout '5' cat x` / `timeout '5' cat x\u00a0` — F4's accepted widening and M4's
#      accepted narrowing composed in one command. The composite is the union of the two: the
#      leading blank corrupts the first token so the wrapper is not recognised and the command
#      is refused regardless of the quoted-`timeout` acceptance. (was written with ordinary
#      spaces, 40-premise-file.py:242) -> d_a_quoted_wrapper_word_is_the_program_bash_would_run
#
# WHAT IS STRUCK FROM THE DESIGN, AND WHY (each carried in `handoff.refuted`):
#   * the body's "the refactor can only narrow what is accepted" — FALSE: M3's token-index prefix
#     match WIDENS the `timeout` arm (x6, F4).
#   * the body's "`test_955` derives its blank alphabet from `str.isspace() | shlex.whitespace`"
#     — there is no blank alphabet in that file at all (x12).
#   * the body's / c3's "`_word_value` (`shlex.shlex`)" and "the current code pins
#     `lex.whitespace`" — it is `shlex.split` and there is no such pin (x1).
#   * C2's second horn ("the folded parse returns zero pipelines rather than raising") — an
#     executed probe refuted it: zero pipelines DENY (g6). Only a blank test AHEAD of the parse
#     preserves today's verdict. F1 was probe-settled, not human-settled.
#   * C3's fourth `parse(unwrap(x))` site — `e2e/test_540_box_boundary.py:362` is an in-box
#     IMPORT probe, not a call site; and `test_bash_exec.py:28` carries a fifth trim (x8).
#   * C4's "correct `intent_540.md:556`" — the stale mount constraint is at THREE lines,
#     134, 466 and 556 (a2, correcting x9's "twice").
# ===========================================================================================

demands:

  # =========================================================================================
  # #0 — THE RETURN-VALUE CONTRACT. Three sentences bear on it; all three now settle.
  # =========================================================================================

  - id: d0_scan_returns_one_frozen_record_per_token
    kind: seam
    form: test
    binds: ['_scan', 'interacts(parse->_scan).response']
    discharged_by: test_scan_returns_one_frozen_record_per_token_with_value_span_and_kind
    source: "comment D3 / M1"
    seed_docstring: >-
      `_scan` returns one frozen record per token carrying the resolved value, the start and end
      offsets of that token in the raw line, and its kind — word, operator, or fd-prefixed
      operator — and `line[start:end]` of every record is that token's raw spelling, quoting and
      glue intact. Offsets are code-point offsets, so a multibyte character earlier on the line
      leaves every later slice exact.
    rejected:
      - {nl: "positional tuples — named access is lost and nothing separates the two offsets"}
      - {nl: "keep-parallel-collections-plus-spans — four index-aligned collections instead of three, and alignment between token stream and raw text is exactly what #955 was about"}

  - id: d0_scan_still_refuses_an_unclosed_quote
    kind: behavior
    form: test
    binds: ['interacts(parse->_scan).response']
    discharged_by: test_a_quote_that_never_closes_still_ends_the_scan_with_no_tokens
    seed_docstring: >-
      A line whose quote never closes yields no token record stream, and `parse` turns that into
      `UntokenizableCommand` exactly as it does today — including when the unclosed quote lives
      entirely inside a `-c` argument, where the reason class is the one it is refused for today
      and not a free implementation choice.

  - id: d0_parse_takes_the_raw_command
    kind: seam
    form: test
    binds: ['parse', 'interacts(parse->command_text)']
    discharged_by: test_parse_takes_the_raw_command_and_no_caller_unwraps_first
    source: "comment D1 / M3"
    seed_docstring: >-
      `parse` is handed the model's command text exactly as written — wrapper and all — and
      returns the pipelines that text names; there is no second function a caller must remember
      to apply first.

  - id: d0_a_blank_command_is_answered_before_the_parse
    kind: behavior
    form: test
    binds: ['interacts(decide_bash->command_text)', 'command_text.domain.distinguished[""]']
    discharged_by: test_a_blank_command_is_answered_ahead_of_the_parse_not_by_its_result
    source: "C2 first horn — F1, PROBE-SETTLED (g6), replacing 20-demands' provisional reading"
    seed_docstring: >-
      The blank command is answered before the parse runs and not from the parse's result: a
      command with no tokens still allows with no pipelines. The other horn is refuted, not
      forked — an empty pipeline list reaches `_decide_readers`, which returns `None`, so
      `has_adapter([])` is false and `decide_bash`'s tail is `BashDecision(False, deny_reason)`.
      A folded parse that "returns zero pipelines rather than raising" therefore DENIES a blank
      command, where today it allows.
    note: >-
      This demand REPLACES `d0_a_command_with_no_tokens_parses_to_zero_pipelines`, whose
      provisional reading the executed probe refuted (claim g6). The dead demand is recorded in
      `handoff.drops` naming this address, per the accounting rule that a death names its
      re-bind. WHICH ALPHABET the blank test uses is fork FK4 — see
      `d_the_blank_test_reads_the_scanners_own_separator_constant`.

  - id: d0_a_verdict_is_the_whole_decision
    kind: negative
    form: clause
    binds: ['BashDecision', 'interacts(decide_bash->BashDecision)']
    source: "F2, auto-resolved at §7 (non-material)"
    outcome:
      nl: >-
        A verdict is the whole `BashDecision` — whether it allows, which reason it names, and the
        pipelines it hands the box — so an input whose authorised argv or reason class moves has
        had its verdict changed even when `allow` did not move.
    rejected:
      - {nl: "verdict = the `allow` boolean alone, which would let the argv crossing into the box change silently under a green O3"}
    note: >-
      The paired positive control for this negative is
      `d_no_verdict_moves_outside_the_enumerated_set`, which drives the whole decision object.
      FK8 asked whether the neutrality obligation reaches PAST the decision object to the four
      consumers that re-walk the operand set afterwards; the judge's recommendation, taken here,
      is that it does not — O3 stops at `BashDecision`, and those four are bound under O1
      instead, at `_opened_operands` (d_the_operand_set_the_gate_derives_is_the_one_its_consumers_read).

  # =========================================================================================
  # O1 / P1 — THE GATE'S TRIM (M4). The live divergence the issue body called a settled no-op.
  # =========================================================================================

  - id: d_gate_hands_the_parser_the_text_unchanged
    kind: negative
    form: test
    binds: ['interacts(decide_bash->command_text)', 'interacts(parse->command_text)']
    discharged_by: test_the_gate_hands_the_parser_the_command_text_unchanged
    seed_docstring: >-
      `decide_bash` passes the model's command text to the parser byte for byte: no character is
      removed from either end on the way in, so the argv the gate authorises is the argv the text
      names and not the argv a Unicode-blank predicate left behind.

  - id: d_bash_blank_only_command_is_still_the_allowed_no_op
    kind: domain-outcome
    form: test
    binds:
      - 'command_text.domain.distinguished[""]'
      - 'command_text.domain.distinguished["   "]'
      - 'command_text.domain.distinguished["\t"]'
      - 'command_text.domain.distinguished["\n"]'
    discharged_by: test_a_command_of_only_bash_blanks_is_still_the_allowed_no_op
    seed_docstring: >-
      A command that is empty, or only spaces, tabs or newlines, still allows with no pipelines —
      deleting the trim does not turn the blank command into a refusal. The falsy member is the
      one that matters most: `if not cmd` is the swallow shape, and the empty command is a
      legitimate allowed no-op today.

  - id: d_unicode_blank_only_command_is_a_command
    kind: domain-outcome
    form: test
    binds:
      - 'command_text.domain.distinguished["\u00a0"]'
      - 'command_text.domain.distinguished["\v"]'
      - 'command_text.domain.distinguished["\f"]'
      - 'command_text.domain.distinguished["\u2028"]'
    discharged_by: test_a_command_of_only_unicode_blanks_is_a_word_bash_would_try_to_run
    seed_docstring: >-
      A command that is nothing but U+00A0, a vertical tab, a form feed or U+2028 is a command
      bash would look up as a program name, so it is refused rather than answered as the blank
      no-op `str.strip()` used to make it. Build each case from the ESCAPE, never from a literal
      character in this docstring.
    rejected:
      - {nl: "answering it as blank, which is what today's Unicode-predicate trim does"}

  - id: d_a_unicode_blank_belongs_to_the_word_it_touches
    kind: domain-outcome
    form: test
    binds: ['command_text.access[bash]', '_scan']
    discharged_by: test_a_no_break_space_at_either_end_is_part_of_the_word_it_touches
    seed_docstring: >-
      An allowed pipeline prefixed or suffixed with U+00A0, a vertical tab or a form feed no
      longer authorises the trimmed command: the blank belongs to the word it touches, exactly as
      bash reads it, so the gate refuses rather than approving an argv the text does not name.
      The same rule glued to a wrapper word makes the wrapper unrecognisable —
      `timeout\u00a05 cat x` denies as an ordinary ungranted program, and `bash\u00a0-c 'ls'`
      denies because `bash\u00a0-c` is not `bash` (restated worked examples 1 and 2; both were
      written with a literal U+00A0 that the record then normalised away).

  - id: d_an_interior_divergent_blank_is_verdict_neutral
    kind: domain-outcome
    form: test
    binds: ['_scan', 'command_text.domain']
    discharged_by: test_a_divergent_blank_between_two_words_changes_no_verdict
    source: "45-dispositions note 3 — a settled premise no demand reached"
    seed_docstring: >-
      A divergent blank sitting BETWEEN two words, with no real blank between it and either, is
      the positive control for the whole class: it merges into the word(s) it touches, matching
      bash, and it is verdict-neutral — neither the deleted trim, nor the scanner, nor the
      unquoter ever split on it there, so nothing about this command's decision moves.

  - id: d_no_word_is_parsed_as_a_wrapper
    kind: domain-outcome
    form: test
    binds: ['_scan', 'command_text']
    discharged_by: test_no_word_is_parsed_as_a_wrapper
    source: "#971, human-resolved -- verdict-change set member 10; SUPERSEDES eight of this spec's own demands"
    seed_docstring: >-
      Neither `bash` nor `sh` is recognised, so no text is extracted from a command before the
      gate decides about it. They are ungranted programs, and the lane's capability reason --
      which names the programs the lane does have -- answers every shape they appear in.
    supersedes:
      - d_the_c_argument_is_the_token_the_span_bounds
      - d_an_outer_operator_means_the_wrapper_is_not_the_whole_command
      - d_a_bash_c_wrapper_that_is_not_the_whole_command_is_refused
      - d_the_wrapper_shapes_the_reason_still_names_stay_refused
      - d_wrapper_recognition_applies_once_at_the_top_level
      - d_a_bare_wrapper_word_keeps_its_reason_class
      - d_the_divergent_blank_rule_reaches_wrapper_extracted_text
      - d_an_independently_unbalanced_quote_keeps_the_generic_lexing_cause
    rejected:
      - {nl: "keep the `-c` fold because it is FAITHFUL -- bash really does run the payload, so unlike the `timeout` prefix nothing here was demonstrably wrong; rejected because faithful-today is a property of four conditions that keep having to be repaired, not of the design"}
      - {nl: "narrow the arm again, as every prior verify loop did -- each narrowing closes the spelling that was demonstrated and leaves the DIRECTION of failure intact"}
    note: >-
      WHAT THE ARM COST THIS SPEC, before it was worth anything. It bought two of the seven
      enumerated verdict-change members (3, an outer operator after the `-c` argument; 5, a
      newline inside it), the RF-E8 decision about which shapes keep the lexing reason when an
      invisible character lands on a later token, cause (5) of the model-facing refusal message,
      and a repair at nearly every verify loop. What it bought IN RETURN was that a model could
      write `bash -c '<cmd>'` instead of `<cmd>`.
      THE ARGUMENT IS THE SAME ONE MEMBER 9 MADE, and it does not turn on which words are
      folded. A fold DELETES TEXT AHEAD OF THE DECISION, so the command the gate judges can
      differ from the command the model wrote -- and every finding on this surface has been an
      instance of that. The `-c` extraction held that gap closed with four conditions (whole
      command, exactly one argument, never re-folded, nothing at all after the closing quote),
      three of which had already needed a fix. Deleting the arm deletes the conditions with it:
      a pass-through has nothing to get wrong.
      WHAT SURVIVES IS THE GENERAL RULE THE ARM WAS A SPECIAL CASE OF. A quoted argument is one
      token and its contents are its own, so a newline inside one is an unclosed quote --
      cause (1), which was always the true answer and is now also the only one
      (`d_a_newline_inside_the_c_argument_is_an_unclosed_quote`, repointed).

  - id: d_every_member_of_the_divergent_blank_alphabet_is_swept
    kind: domain-outcome
    form: test
    binds: ['command_text.domain', '_BLANKS.domain']
    discharged_by: test_every_member_of_the_divergent_blank_alphabet_behaves_the_same_way
    source: "SB6 — the judge's recommendation, one table-driven test over the closed set"
    seed_docstring: >-
      One table-driven sweep over the whole closed alphabet, not three hand-authored members: the
      26 characters `str.strip()` removes that neither the scanner nor the line split treats as a
      blank are each exercised at both ends of an allowed pipeline, and each behaves the way the
      three named members do. The set is derived in the test from `str.strip()` and the scanner's
      own separator constant — never transcribed — so the 26th member (`\r`, which joins the
      alphabet the moment M6 removes it from `_BLANKS`) cannot be left out by hand.

  # =========================================================================================
  # O1 / M6 — THE `\r` FIX. New at §7 (F6): the issue's census marks `_scan` "keep — this is
  # the one", and that verdict is INCOMPLETE. Both halves are required; neither ships alone.
  # =========================================================================================

  - id: d_the_scanner_ends_a_word_where_bash_ends_one
    kind: negative
    form: test
    binds: ['_scan', '_BLANKS.domain.distinguished["\r"]', 'bash_oracle']
    discharged_by: test_the_scanner_ends_a_word_exactly_where_bash_ends_one
    source: "F6(a), human-resolved — M6"
    seed_docstring: >-
      No character ends a word here that does not end one in bash: a carriage return inside an
      operand is part of that operand, so `cat /run/report.md\rx` names one file and is not
      authorised as a two-operand command that opens a different one. The same holds at a word
      edge (`cat P\r`), across an operator run (`cat P\r| wc -c`), and for a line that is one
      `\r` and nothing else, which is a one-character word and not zero tokens.
    rejected:
      - {nl: "the current `_BLANKS`, which contains `\\r` because the shlex lexer it replaced did — bash's own blank set is space and tab only"}

  - id: d_the_two_layers_agree_about_the_removed_separator
    kind: behavior
    form: test
    binds: ['_scan', '_word_value', 'interacts(parse->_word_value).response']
    discharged_by: test_the_boundary_decision_and_the_value_resolution_agree_about_the_removed_separator
    source: "45-dispositions RF-J4 / note 4 — M6's dependency on M2, as a demand"
    seed_docstring: >-
      The boundary decision and the value resolution agree about the removed separator in all
      three shapes, which is only true once the unquoter has no blank set of its own: a mid-word
      `\r` leaves one token whose RESOLVED value still carries the `\r`; an edge `\r` is not
      silently dropped from the resolved value; and a word that is nothing but `\r` resolves to
      that one-character word rather than to zero parts that make the line untokenizable. A
      quoted `\r` is the control — unchanged in both directions, because quoting suppresses
      separator recognition unconditionally.

  - id: d_the_oracle_reads_bash_in_binary
    kind: negative
    form: test
    binds: ['bash_oracle.access[subprocess]', 'interacts(bash_fd_prefix_955->bash_oracle)']
    discharged_by: test_the_oracle_never_normalises_its_own_subject
    source: "F6(b), human-resolved — M6(b); the issue's blind spot (2), still open at 6a2ea874"
    seed_docstring: >-
      The oracle recovers bash's recorded argv as bytes: nothing between bash and the assertion
      rewrites a byte, so a carriage return in an argument arrives as a carriage return and
      cannot be laundered into the delimiter the recovery then splits on. Today's
      `Path.read_text(encoding="utf-8")` does worse than erase the character — universal-newline
      translation treats a bare `\r` as its own line ending, so it phantom-splits entries and
      shifts the `ARGV_END` alignment for everything after them (four expected entries recovered
      as five).

  - id: d_the_oracle_normalises_no_evidence_channel
    kind: negative
    form: test
    binds: ['bash_oracle', 'interacts(bash_fd_prefix_955->bash_oracle).response']
    discharged_by: test_no_channel_the_oracle_reads_evidence_through_rewrites_a_byte
    source: "45-dispositions, settled: the binary-read demand is about the CLASS, not one call"
    seed_docstring: >-
      The binary read is a property of the oracle, not of one line: the stdout and stderr capture
      beside the argv file is held to the same rule, because `subprocess.run(..., text=True)`
      normalises exactly as `read_text` does. No channel between bash and the assertion —
      delimiter, end marker, encoding, capture — may rewrite a byte.

  # =========================================================================================
  # O1 / P2 + C1 — THE WRAPPER FOLDS IN (M3).
  # =========================================================================================

  - id: d_a_timeout_prefix_is_not_a_wrapper
    kind: domain-outcome
    form: test
    binds: ['_scan', 'command_text']
    discharged_by: test_a_timeout_prefix_is_not_a_wrapper_and_is_never_folded_away
    source: "#971, human-resolved — verdict-change set member 9; SUPERSEDES three of this spec's own demands"
    seed_docstring: >-
      A `timeout` prefix is not a wrapper. It stays in the argv, no grant matches it, and the
      lane's capability reason — which names the programs the lane does have — answers on the
      same turn. No text is deleted before the decision is made.
    supersedes:
      - d_a_timeout_prefix_leaves_every_later_line_in_the_parse
      - d_the_timeout_prefix_is_skipped_by_token_index
      - d_a_quoted_wrapper_word_is_the_program_bash_would_run
      - d_a_timeout_prefix_with_no_duration_is_not_a_wrapper
    rejected:
      - {nl: "repair the prefix arm a third time — each repair closes the spelling that was demonstrated and leaves the DIRECTION of failure intact: a fold deletes text ahead of the decision, so every mis-read is a widening"}
      - {nl: "grant `timeout` and put the binary in the box, so the bound is honoured — it makes the gate grant a word that turns the rest of the argv into a NEW PROGRAM, which forces the scope check to recurse through it; the one shape a per-stage grant ladder must never be loose about"}
    note: >-
      WHAT THE FOLD COST, MEASURED RATHER THAN ARGUED. Two live deny->allow holes were found by
      review in the arm this spec had already narrowed once at FK1: `timeout\n5 cat P`, where the
      prefix STRADDLES a line boundary and folding deleted physical line 1; and
      `timeout --foreground cat P`, where the duration guard FK1 added is satisfied by any
      flag-shaped word, so a prefix carrying no duration at all was recognised. Both authorised a
      command the real `timeout` never runs (it exits 125 without running anything). Neither was
      visible to the frozen corpus, which carried only `timeout 5\ncat P` — the newline on the
      OTHER side of the prefix — so the instrument built to certify this change neutral certified
      both clean.
      AND THE FOLD HONOURED NOTHING. The stripped prefix was DISCARDED, not executed: there is no
      `timeout` binary in the box, and every command already runs under the runtime's own 120s
      deadline. So a model that asked for a five-second bound got no bound, silently, and the
      three demands above spent a corpus, a test file and two enumerated members on the
      appearance of a feature.
      THE ASYMMETRY IS THE ARGUMENT. A fold can widen what is allowed; a pass-through cannot —
      the worst a mis-read can do there is refuse. That is why this is a deletion and not a third
      narrowing.

  - id: d_a_blank_glued_to_an_ungranted_word_is_not_blamed
    kind: domain-outcome
    form: test
    binds: ['_scan']
    discharged_by: test_a_blank_glued_to_an_ungranted_word_is_not_blamed_for_the_refusal
    source: "#971 — the composition RC2 required, inverted by member 9"
    seed_docstring: >-
      `\u00a0timeout '5' cat P` was refused BECAUSE of the blank, while the same text without it
      was allowed — so RC2 obliged the refusal to name the codepoint. It is not refused for the
      blank any more: `timeout` is ungranted with it and without it. The invisible-character
      machinery must stay quiet about this command rather than blame a character that changes
      nothing, and must still name a blank that IS decisive.
    note: >-
      The `!untokenizable` slot in the corpus cannot say this — it demands only that the reason
      moved OFF the lexing message, and the generic capability deny satisfies that while naming
      nothing. The obligation runs the other way now, so it needs its own test.

  - id: d_a_newline_inside_the_c_argument_is_an_unclosed_quote
    kind: domain-outcome
    form: test
    binds: ['_scan', 'UNTOKENIZABLE_REASON.domain.distinguished[cause1]']
    discharged_by: test_a_newline_inside_a_quoted_argument_is_the_unclosed_quote_it_looks_like
    source: "F5, human-resolved (ACCEPTED) — verdict-change set member 5"
    seed_docstring: >-
      A `bash -c` argument carrying a newline is refused for the reason every other cross-line
      quote is refused — a quoted string cannot span lines — instead of being flattened into one
      token and re-split into a pipeline per line. The refusal must reach the model as a reason
      that EXPLAINS THE NEWLINE, not as a generic parse failure: a model that sends a multi-line
      `-c` payload today gets an allow, and after this change it needs to know what to fix.
    rejected:
      - {nl: "today's answer: allowed, `bash -c 'cat /run/report.md\\nwc -l'` parsing to two pipelines"}

  - id: d_nothing_outside_the_scanner_splits_bash_text
    kind: negative
    form: test
    binds: ['_scan', '_cmd_segments', 'unwrap']
    discharged_by: test_nothing_outside_bash_exec_decides_where_a_bash_word_ends
    seed_docstring: >-
      One module decides where a bash word ends: no other module in the tree splits command text
      — no `shlex.split`, no `shlex.shlex`, no blank-set `strip` on a command — and the only
      `shlex` left elsewhere is `shlex.join`, which formats an argv and never parses one.

  - id: d_the_scanner_is_the_positive_control_for_that_negative
    kind: behavior
    form: test
    binds: ['_scan']
    discharged_by: test_the_one_module_that_splits_bash_text_still_splits_it
    seed_docstring: >-
      The paired control: the one module that does split still splits — `a | b && c` is three
      stages across two connectors, an operator-looking character produced by a quoting idiom was
      never an operator token, and an escaped operator character is an ordinary word everywhere —
      so the negative above cannot pass by everything having stopped working.
    note: >-
      RENAMED from `20-demands.md`'s `test_an_unquoted_operator_is_still_an_operator`, which is an
      EXISTING test at `test_955_bash_fd_prefix.py:148`. A `discharged_by` that resolves to a test
      predating the spec reads as discharged by work this change did not do, and `check_binds`
