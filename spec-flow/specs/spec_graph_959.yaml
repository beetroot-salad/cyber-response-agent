  - id: d_the_frozen_baseline_replay_certifies_neutrality
    kind: behavior
    form: test
    fork: FK7
    resolved: "frozen-baseline — taken by the human at §7; BUILT, at this base commit, before anything else in the suite"
    binds: ['BashDecision', 'command_text.domain']
    discharged_by: test_a_frozen_baseline_replay_certifies_every_unenumerated_shape
    seed_docstring: >-
      A corpus of command texts is run through the gate AT THE BASE COMMIT and its whole decision
      recorded — allow, reason identity, and the pipelines — then replayed after the change: every
      shape outside the enumerated set reaches an identical decision, and every shape inside it
      reaches the enumerated one. The corpus carries the three classes the existing corpora do not:
      wrapper words, `\r`, and the divergent blanks.
    readings:
      frozen-baseline: "record the current gate's whole decision over a purpose-built corpus BEFORE implementation and replay it after — the only instrument that can actually discharge O3's neutrality obligation, and buildable only now"
      suite-afterwards: "'no existing test changed its mind' — costs nothing and certifies almost nothing, because neither differential corpus contains a wrapper word, a carriage return, or any blank but a space"
    note: >-
      RESOLVED AT §7 (FK7, human): the replay is BUILT, now. The neutrality obligation therefore
      stays a UNIVERSAL and is not downgraded. The recording lives at
      `defender/tests/_baseline_959_frozen.json`, taken at `6a2ea874` by
      `defender/tests/_baseline_959.py`, and it is committed with the spec — it may never be
      regenerated, because a baseline re-recorded after the implementation certifies nothing
      (`test_the_recorded_baseline_predates_the_change_it_certifies` is the guard). The corpus
