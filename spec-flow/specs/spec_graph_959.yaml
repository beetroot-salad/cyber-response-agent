  - id: d_the_unquoter_has_no_notion_of_whitespace
    kind: seam
    form: test
    binds: ['_word_value']
    discharged_by: test_the_unquoter_has_no_notion_of_whitespace
    seed_docstring: >-
      `_word_value` resolves the quoting of one span and nothing else: it holds no blank set, it
      is not built on a splitter, and there is no pin stopping it from re-splitting because it has
      no such capability to pin.
    rejected:
      - {nl: "the body's claim that the current code pins `lex.whitespace` to stop it — there is no such pin in the module (x1)"}
      - {nl: "any performance claim for the hand-rolled unquoter — the doc defers benchmarks rather than asserting them"}

  - id: d_the_unquoter_resolves_every_form_the_lexer_resolved
    kind: behavior
    form: test
    binds: ['interacts(parse->_word_value).response']
    discharged_by: test_the_unquoter_resolves_every_quoting_form_the_lexer_resolved
    seed_docstring: >-
      The hand-rolled unquoter returns exactly what the POSIX lexer returned for every form the
      grammar admits: `"a\nb"` keeps its backslash, `"a\"b"` gives `a"b`, `"a\\b"` gives `a\b`,
      `a\ b` gives one word with a space, `'a'"b"c` glues to `abc`, `'a\nb'` is literal, `"$x"` is
      not expanded, `\;` is the semicolon `find -exec` needs, and a quote-concatenated spelling of
      a wrapper word (`'ba''sh'`) resolves to `bash` and is recognised like any other.

  - id: d_a_trailing_backslash_still_continues_nothing
    kind: domain-outcome
    form: test
    binds: ['UNTOKENIZABLE_REASON.domain.distinguished[cause2]', '_word_value']
    discharged_by: test_a_trailing_backslash_still_continues_nothing
    seed_docstring: >-
      A command ending in a dangling backslash is still refused as untokenizable — the escape the
      lexer raised on must still be a refusal once the unquoter is hand-rolled, or cause (2) of
