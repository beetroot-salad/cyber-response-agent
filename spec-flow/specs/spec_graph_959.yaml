        is three.

  # =========================================================================================
  # NON-OBLIGATIONS KEPT VISIBLE, AND THE POST-DECISION CONSUMERS (FK8).
  # =========================================================================================

  - id: d_the_paren_fall_through_still_fails_closed_a_layer_up
    kind: survival
    form: test
    binds: ['_scan', '_stage_unsafe']
    discharged_by: test_the_paren_fall_through_still_fails_closed_a_layer_up
    seed_docstring: >-
      `(` and `)` still break a word without being operators the grammar accepts, so `cat <(id)`
      still reaches argv as ordinary words and is still refused by the guard that reads argv —
      whether the stage came from a bare command or from a wrapper's extracted text. The
      deliberate fall-through `test_540_exec_seam.py` pins is not what this change touches, and a
      token-record refactor must not quietly change the token stream that pin asserts on.

  - id: d_the_operand_set_the_gate_derives_is_the_one_its_consumers_read
    kind: coherence
    form: test
    binds: ['interacts(tool_bash->_opened_operands)', '_opened_operands']
    discharged_by: test_the_operand_set_the_four_post_decision_consumers_read_is_the_one_the_gate_authorised
    source: "FK8 — the judge's phase-D action: make sure at least one demand binds the derivation itself"
    seed_docstring: >-
      The operand set is walked once from the authorised decision and threaded, and every consumer
      downstream of the decision sees THAT set: whether an authored read is refused
      (`_deny_authored_bash_read`), whether the returned bytes are framed as untrusted
      (`_opens_untrusted_read` -> `is_untrusted_read`), which output ceiling applies, and how the
      overflow hint is worded (`_bash_overflow_hint`). A word-boundary change can move all four
      while allow, reason and pipelines are literally unchanged, which is why O3's neutrality
      stopping at the decision object is only safe if this derivation is bound under O1.

  - id: d_the_audit_rows_attribution_derives_from_the_same_operand_set
    kind: coherence
    form: test
    binds: ['interacts(record_shim_failure->_opened_operands)']
    discharged_by: test_the_audit_rows_system_attribution_derives_from_the_authorised_operand_set
    seed_docstring: >-
      The queries-table row the shim-failure path writes derives its `system=` attribution from the
      same authorised operand set, re-derived from the same decision with no cache, so the row and
      the execution cannot disagree about which files the command opened.

  - id: d_the_audit_row_and_the_authorised_argv_name_the_same_command
    kind: coherence
    form: test
    binds: ['interacts(record_shim_failure->command_text)']
    discharged_by: test_the_audit_rows_raw_command_is_unmoved_for_every_shape_outside_the_enumerated_set
    seed_docstring: >-
      The audit row records the RAW command text while its gating and attribution come from the
      PARSE — a documented, accepted divergence this change does not close. What this change must
      not do is widen it: for every shape outside the enumerated set the recorded row is unmoved,
      and for the `\r` class the two agree more closely after the change than before, because the
      argv stops naming a command the text does not.
    note: >-
      BOUNDED, NOT CLOSED, AND THE BOUND IS EVIDENTIARY (45-dispositions RF-J1, probe PO-J1,
      claim pj1). `recorded_command = command[:SHIM_COMMAND_MAX_CHARS]` with the constant at 2000:
      a realistic command is never truncated and a trailing divergent character survives intact
      (the boundary is exact — index 1999 survives, index 2000 drops). But the constant's own
      docstring names this field as the one field of a shim row an attacker-influenced turn
      chooses freely, so a command padded past 2000 characters can push the divergent character
      out of the recorded evidence and leave the audit row showing a plausible, non-divergent
      command while a different one ran. §7 should weigh that as a real if narrow gap in the audit
      trail's evidentiary value, not dismiss it because realistic commands are short.

  - id: d_the_bash_lane_enforces_every_constraint_the_read_lane_does
    kind: parity
    form: test
    binds: ['read_surface.access[bash]', 'read_surface.access[read-tool]']
    discharged_by: test_every_constraint_the_read_tool_lane_enforces_the_bash_lane_enforces_too
    source: "10-brief, 'Sibling surfaces' — the parity partner a widening the differential misses would need"
    seed_docstring: >-
      Every constraint the read-tool lane enforces on a resolved operand path — confine (the
      grant's scope fullmatch), denylist, and resolve — the bash lane enforces too, over the
      operand set THE PARSE PRODUCED. The two vias reach the same resource and only one of them
      derives its operand set by splitting text, so a divergence introduced on the bash side has
      no mirror on the read-tool side to contradict it.

  - id: d_the_read_tool_lane_is_unmoved_by_the_parse_change
    kind: coherence
    form: test
    binds: ['interacts(decide_read->read_surface)']
    discharged_by: test_the_read_tool_lane_reaches_the_same_decisions_it_reached_before
    seed_docstring: >-
      The read-tool lane is unmoved: it never parses command text, so every path it admits and
      refuses before the change it admits and refuses after — driven and observed at that reader,
      not asserted at the boundary.

  - id: d_every_assertion_site_of_the_lexing_reason_moves_with_it
    kind: coherence
    form: test
    binds: ['interacts(bash_lane_test_helpers->UNTOKENIZABLE_REASON)']
    discharged_by: test_every_assertion_site_of_the_lexing_reason_agrees_with_the_reason_after_the_change
    source: "F4's second half — 'strike the clause TOGETHER WITH the test pinning it'; claim g10"
    seed_docstring: >-
      Every reader of the refusal message moves with it. The drift guard that pins the cause list
      is updated in the same change — F4 strikes the "quoted `timeout` prefix" clause from cause
      (5) — and the six other assertion sites across `test_permission.py` and
      `test_read_confine.py` still agree with what the parser actually refuses. This is the only
      place the model is ever told why a wrapper was refused; a reason that has drifted from the
      parser is a sentence about nothing.

  - id: d_the_object_the_gate_authorised_is_the_object_the_box_runs
    kind: shape
    form: test
    binds: ['interacts(box_executor->bash_exec).payload']
    discharged_by: test_the_object_the_gate_authorised_is_the_object_the_box_runs
    seed_docstring: >-
      The pipelines the gate authorised are the pipelines the box runs: they cross the process
      boundary unmediated, with no re-derivation from text anywhere on the path, and every argv
      entry that crosses is the resolved value the parse produced — a CR-bearing operand included,
      unmodified and unre-encoded. That is what makes every argv-divergence demand here an
      EXECUTION-change demand and not merely an authorisation one.

  - id: d_nothing_mutates_the_authorised_pipelines_between_authorisation_and_execution
    kind: negative
    form: test
    binds: ['interacts(box_executor->bash_exec).payload', 'BashDecision']
    discharged_by: test_nothing_mutates_the_authorised_pipelines_between_authorisation_and_execution
    source: "45-dispositions, settled — 'phase D should mint a demand'; today's safety is incidental"
    seed_docstring: >-
      Nothing mutates the authorised pipeline objects between the authorisation and the execution:
      the operand walk, the audit path and the executor all read the same object graph and none of
      them writes to it. Only the token record is frozen by this change; the object graph above it
      has no declared immutability on either side, so the property that makes the check meaningful
      is asserted rather than assumed.

  - id: d_a_command_refused_only_for_an_invisible_character_says_so
    kind: domain-outcome
    form: test
    fork: FK6
    resolved: "name-the-line-ending — auto-resolved at §7 (non-material): the human already set this obligation at F5 for the newline, and this applies the same rule to the same class of surprise"
    recommended_reading: "attach an obligation mirroring F5's — the refusal must name the line ending"
    binds: ['UNTOKENIZABLE_REASON', 'command_text.domain', 'command_text.domain.distinguished["\r"]']
    discharged_by: test_a_command_refused_only_for_an_invisible_character_is_told_so
    seed_docstring: >-
      A command refused only because a character the model cannot see is now part of a word is
      told WHICH character: the reason names it BY CODEPOINT — the only way a reason can name a
      character that renders as nothing — rather than a generic capability deny for a command
      that renders on screen identically to one that works. The whole invisible class, swept
      from the frozen alphabet, not the line ending alone: member 1 is the largest member of the
      enumerated set's centre of gravity (107 member-1 cases and 209 member-8 cases, 316 of the
      362 enumerated corpus rows), and of the 118 cases that delegate
      their reason to this demand, 103 carry no carriage return at all — counted over the
      recorded corpus, which is also what caught the earlier "91" (RC8). A model that pastes a path
      with a no-break space in it has no other way to discover the character.
    readings:
      name-the-line-ending: "mint the cause, mirroring the obligation F5 already carries for the newline — one sentence in `UNTOKENIZABLE_REASON` plus its existing drift guard, and the model can repair its own command"
      generic-capability-deny: "leave it on the ordinary grant/capability path, which is where a CR-bearing operand fails today — costs nothing to build and leaves a model that cannot see what is wrong"
    note: >-
      RESOLVED AT §7 (FK6, auto — non-material): a command refused only for a character the model
      cannot see must be told WHICH character and WHERE, not handed a generic parse failure. Its
      BOUNDARY is the neutrality line and the suite pins it: a command already refused for the
      same operand BEFORE this change (a quoted `\r`, say) keeps the reason it has today, since
      moving that one would be a verdict change outside the enumerated set.
      WIDENED TWICE. (RC9, human, third loop) IT NOW CARRIES TWO PREDICATES: a command refused
      ONLY for a character the model cannot see, AND a command that was already refused whose
      REASON CLASS moved because of one — every lexing arm whose decision turns on the last
      token loses its specific message when a blank is appended there, and the model is worse off
      than in the first case, because it had a message naming the problem and now has one that
      names nothing. The test sweeps the second predicate from the corpus's own derived arm
      table, so it follows the code rather than a list of shapes.
      (RC2, human, second loop) FK6 was resolved for "a character the model cannot
      see" and this demand was bound for the line ending alone — the class was resolved and one
      member of it was pinned. It now binds the whole frozen divergent-blank alphabet, swept the
      way `d_every_member_of_the_divergent_blank_alphabet_is_swept` sweeps it, and requires the
      codepoint to be named. It also carries member 8's message question (RC1): a `\r` after a
      connector loses the lexing reason that used to tell the model what to do, and this is what
      replaces it. Rejected: narrowing FK6's recorded resolution to line endings — honest and
      free, but the largest group of newly-refused commands would then be refused with a message
      that explains nothing. Blast radius: after this change every CRLF-pasted command carrying a path
      operand under a `cat`-shaped grant is refused (verdict-change member 2's allow->deny half),
      and a CRLF paste is by far the likeliest `\r` a model sends. One escalation answer on this
      premise was DISCOUNTED by the judge — it rested on the mechanism inverted ("the word splits"
      after M6, when M6 is precisely what stops it splitting) and claim g1 refutes it directly.

  - id: d_the_operator_cli_reports_the_whole_verdict
    kind: coherence
    form: test
    fork: FK7
    resolved: "in scope — taken by the human at §7 with the replay: the one tool that prints a decision for a human currently omits the argv, i.e. exactly the half F2 resolved a verdict to include"
    recommended_reading: "give `policy_cli explain --json` the missing `pipelines` field"
    binds: ['interacts(defender_policy_cli->command_text)', 'command_text.access[argv]']
    discharged_by: test_the_serialised_verdict_an_operator_reads_carries_the_argv_half
    seed_docstring: >-
      The one tool that prints a decision for a human reports the WHOLE verdict: the operator path
      reaches the same gate over the same command text, and what it serialises carries the
      pipelines as well as allow, grant and reason — otherwise the surface a human audits is blind
      to exactly the half F2 resolved a verdict to include.
    note: >-
      RESOLVED AT §7 (FK7, second premise, human): IN SCOPE. `policy_cli explain --json` emits
      allow/grant/reason and never the pipelines today; it is a small, self-contained scope
      addition, and it is what keeps the neutrality claim auditable by a human after the fact —
      the frozen replay certifies it mechanically, this makes it readable.

  - id: d_a_timeout_prefix_with_no_duration_is_not_a_wrapper
    kind: behavior
    form: test
    fork: FK1
    resolved: "minimal — ACCEPTED by the human at §7, minimal arm only; it joins the enumerated set as its seventh numbered member"
    recommended_reading: "accept, as D2's sixth member, in the MINIMAL form only"
    binds: ['_scan']
    discharged_by: test_a_timeout_prefix_is_not_a_wrapper_and_is_never_folded_away
    superseded_by: d_a_timeout_prefix_is_not_a_wrapper
    seed_docstring: >-
      The wrapper step advances past `timeout` only when at least one duration- or flag-shaped
      token is actually consumed, so `timeout cat report.md` is not a recognised wrapper and is
      refused — where today it is allowed and executes `cat report.md`, while the real `timeout`
      would read `cat` as its duration, refuse, and run nothing. `timeout --` and a bare `timeout`
      reach the same disposition through the same arm.
    readings:
      minimal: "require the loop to consume at least one duration/flag-shaped token — a narrowing, one condition and one test, same cost and same defect class as the `\\r` fix the human already accepted at F6"
      full-grammar: "model coreutils' real grammar too (the `s`/`m`/`h`/`d` suffix, and `-k`/`-s` each taking a value) — flips `timeout 5s cat x` and `timeout -s KILL 5 cat x` deny->allow, a widening on a security gate, each member enumerated by hand, and scope beyond M1-M6"
      decline: "the new token-index matcher must reproduce today's approximation character-for-character and the live bug ships, certified clean by a differential whose corpus contains no `timeout` at all"
    note: >-
      RESOLVED AT §7 (FK1, human): ACCEPTED, MINIMAL ARM ONLY — the loop must consume at least one
      duration- or flag-shaped token; a bare `timeout` and `timeout --` reach the same refusal.
      `full-grammar` and `decline` were both rejected by name. The gate advances past the literal
      word `timeout` unconditionally, BEFORE it looks for a duration at all
      (`_cmd_segments.py:17-21`). The judge recommends the minimal arm only and explicitly not the
      full grammar. One sub-question is already settled and is not the human's: the duration token
      is matched on its RESOLVED value, because F4 requires `timeout '5' cat x` to be accepted and
      `'5'`'s raw span fails a digit test while its resolved value passes.

# ===========================================================================================
# STRUCTURE
# ===========================================================================================

structure:
  axes:
    - operand_path   # the only axis this change's neighbourhood keys on: `read_surface`'s
                     # identity, inherited verbatim from spec_graph_575-grant-gate.yaml. NOTHING
                     # here interpolates a path — no writer is added to any shared root — so the
                     # registry gains no member and R2 has nothing to fire on. The one shared
                     # artefact is the Pipeline list, which crosses decide_bash -> tools.py ->
                     # box.run_parsed -> bash_exec.run_parsed unmediated (claim x14): an edge
                     # payload, not a resource with an identity facet.

  actors:
    - {id: tool_bash,             frame: composition, provenance: code}    # runtime/tools.py::_tool_bash — the model-facing lane (575's id)
    - {id: decide_bash,           frame: leg,         provenance: design}  # runtime/permission/bash.py — M4 deletes its trim, F1 relocates the blank test
    - {id: parse,                 frame: leg,         provenance: design}  # runtime/bash_exec.py::parse — the ONE entry point (D1/M3)
    - {id: box_executor,          frame: leg,         provenance: code}    # runtime/box.py::BoxExecutor.run_parsed -> the in-box re-exec
    - {id: record_shim_failure,   frame: leg,         provenance: code}    # runtime/tools.py::_record_shim_failure — the audit row (brief f2)
    - {id: defender_policy_cli,   frame: leg,         provenance: code}    # scripts/policy_cli.py — the operator's view (575's id)
    - {id: decide_read,           frame: leg,         provenance: code}    # the read-tool lane — read_surface's other reader (575's id)
    - {id: compile_policy,        frame: leg,         provenance: code}    # reads _cmd_segments' surviving constants (575's id)
    - {id: bash_fd_prefix_955,    frame: composition, provenance: design}  # tests/test_955_bash_fd_prefix.py — the accept-direction oracle; M6(b) changes it
    - {id: bash_differential_897, frame: composition, provenance: code}    # tests/test_bash_differential_897.py — the reject-direction differential
    - {id: bash_lane_test_helpers, frame: composition, provenance: code}   # the three parse(unwrap(x)) sites + the seven UNTOKENIZABLE_REASON assertion sites

  boundaries:

    - id: command_text
      provenance: design
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The model's bash command text, verbatim. Members are written as their PYTHON REPR
              (`""`, `"\t"`, `"\u00a0"`), never as the character itself — this file holds no
              literal divergent blank, deliberately. The three bash blanks (`""`, `"   "`,
              `"\t"`, `"\n"`) are today's allowed no-op and stay so; the divergent members are
              words bash would try to run. The full divergent alphabet is 26 characters —
              `str.strip()`'s 29 minus space, tab and newline — and the members named here are
              the representatives; the whole set is swept by one table-driven demand.
          default: '""'
          distinguished: ['""', '"   "', '"\t"', '"\n"', '"\r"', '"\u00a0"', '"\v"', '"\f"', '"\u2028"']
          falsy_valid: true
          documented_alternatives: []
        access:
          constraints_by_via:
            bash:
              trust: attacker-influenced
              constraints: [nul-refusal, grant-fullmatch, scope-shape]
            argv:
              trust: operator
              constraints: [nul-refusal, grant-fullmatch, scope-shape]

    - id: _scan
      provenance: design
      facets: {}     # the word-boundary decision itself; its knob is `_BLANKS` below.
                     # M1 changes its RETURN SHAPE (one frozen record per token); the seam demand
                     # binds the boundary and the record stream binds the edge's `.response`.

    - id: _BLANKS
      provenance: design
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The characters that END a word — today shlex's own whitespace set, spelled in the
              source as the escape sequence for space, tab, carriage return and newline. bash's
              lexer blanks are space and tab only. The module's own docstring argues the set ONE
              WAY ONLY ("the two differ on U+00A0, `\v`, `\f`, U+2028 … and bash splits on none
              of them") and never asks the converse — whether shlex splits on something bash does
              not. It does: `\r`. M6 removes it. `\n` never reaches this set as a word character
              because `parse` splits physical lines on it first.
          default: '" \t\r\n"'
          distinguished: ['"\r"']
          falsy_valid: false
          documented_alternatives: []

    - id: _word_value
      provenance: design
      facets: {}     # M2: an unquoter over a span. Today `shlex.split(span, comments=False,
                     # posix=True)` guarded by `len(parts) == 1` — a splitter, with its own
                     # hardcoded whitespace, which is why M6 needs M2 (RF-J4).

    - id: _wrapper_span
      provenance: design
      retired_by: "#971"
      facets: {}     # THE FOLDED WRAPPER STEP (M3), RETIRED. It survives as an element because
                     # this graph's history binds to it; no function of this name exists in the
                     # code any longer. `d_no_word_is_parsed_as_a_wrapper` is what replaced it,
                     # and it binds `_scan` — there is no step between the raw text and the scan.

    - id: unwrap
      provenance: code
      facets: {}     # hooks/_cmd_segments.unwrap — the standalone step M3 REMOVES. Its live
                     # dependents are the gate and the test helpers; R5's subject.

    - id: _cmd_segments
      provenance: code
      facets: {}     # the module: the wrapper code moves out, the three shim-name constants and
                     # their four production consumers stay (C4).

    - id: bash_exec
      provenance: design
      facets:
        payload:
          parts:
            - {role: argv, source: const:decision.pipelines}
          invariants: [all-slots-bound]
          nl: >-
            `run_parsed` receives exactly the pipelines the gate already parsed — the
            single-parse decision that collapses the validator/executor differential
            (spec_graph_575's facet, unchanged). This is also the module whose MODULE-SCOPE
            imports execute inside the box, which is what C4 is about: the boxed transport is
            `docker exec … python3 -m defender.runtime.bash_exec`, so `parse`/`_scan`/the
            wrapper step never run in the box but the import block does.

    - id: BashDecision
      provenance: code
      facets: {}     # allow + reason + pipelines. F2: the verdict is the whole object. Its SHAPE
                     # is unchanged by this work, which is why it is `code`; what moves is which
                     # decision a given text gets.

    - id: UNTOKENIZABLE_REASON
      provenance: design
      facets:
        domain:
          type: enum
          refinement:
            nl: >-
              The agent-facing refusal message, whose five documented causes are pinned by
              `test_the_lexing_reason_names_every_way_a_command_can_fail_to_parse` — the guard
              against the list drifting from what the parser actually refuses. It is the only
              place the model is ever told why a wrapper was refused. F4 strikes a clause from
              cause (5); F5 gives cause (1) a new shape; FK6 asks whether the line ending earns
              a cause of its own.
          default: cause5
          distinguished: [cause1, cause2, cause3, cause4, cause5]
          falsy_valid: false
          documented_alternatives: []

    - id: EMBEDDED_NUL_REASON
      provenance: code
      facets: {}     # the arm that must keep its position relative to the relocated blank test.

    - id: _opened_operands
      provenance: design
      facets: {}     # runtime/tools.py:414 — the operand-set derivation walked once from the
                     # authorised decision. Its INPUT moves with this change, which is why it is
                     # in the delta; its four post-decision consumers are FK8's subject.

    - id: read_surface
      provenance: code
      facets:
        access:
          constraints_by_via:
            bash:
              trust: attacker-influenced
              constraints: [confine, denylist, resolve]
            read-tool:
              trust: attacker-influenced
              constraints: [confine, denylist, resolve]
        identity:
          key_axes: [operand_path]
          evidence:
            nl: >-
              The resolved operand path is the full key, read off `files.read_allowed_path` and
              the cat grant's scope, which the design makes the same shape objects
              (spec_graph_575-grant-gate.yaml, inherited verbatim).
          sharing: unique-key

    - id: bash_oracle
      provenance: design
      facets:
        access:
          constraints_by_via:
            subprocess:
              trust: derived
              constraints: [binary-argv-read, outer-syntax-precheck]
      # The recording shim under real bash. `binary-argv-read` is M6(b) — today's
      # `Path.read_text(encoding="utf-8")` universal-newline-translates `\r` into the very
      # delimiter the next line splits on, which is how the oracle certifies the `\r` divergence
      # clean. `outer-syntax-precheck` is the EXISTING `bash -n -c "<outer>"`, which probe PO-J3
      # showed reports nothing about a nested `-c '<inner>'` payload — the inner precheck is
      # FK9's second recommendation and is not yet a constraint of this cell.

    - id: _stage_unsafe
      provenance: code
      facets: {}     # the argv-reading guard one layer up that catches `(`/`)` (brief f6).

    - id: SHIM_COMMAND_MAX_CHARS
      provenance: code
      facets: {}     # scripts/gather_tools/record_query.py:416 — 2000. Bounds how much of the
                     # audit row's evidentiary value survives an attacker-padded command (pj1).

    - id: intent_540_md
      provenance: code
      facets: {}     # A PROSE consumer with no runtime contract and no edge: three lines of
                     # `defender/tests/intent_540.md` assert a mount constraint #958 retired.
                     # Bound by a coherence clause; it fires no rule, and that is correct.

  interacts:
    # --- the command text and who reads it ------------------------------------------------
    - {from: decide_bash,          to: command_text,  mode: read, via: bash, provenance: design}
    - {from: parse,                to: command_text,  mode: read, via: api,  provenance: design}
    - {from: bash_fd_prefix_955,   to: command_text,  mode: read, via: api,  provenance: design}   # the corpus IS command text
    - {from: record_shim_failure,  to: command_text,  mode: read, via: api,  provenance: code}     # raw_command, truncated (pj1)
    - {from: defender_policy_cli,  to: command_text,  mode: read, via: argv, provenance: code}     # the operator's explain path

    # --- inside the parser ------------------------------------------------------------------
    - {from: parse,        to: _scan,             mode: invoke, via: api, provenance: design}
    - {from: parse,        to: _word_value,       mode: invoke, via: api, provenance: design}
    - {from: parse,        to: _wrapper_span,     mode: invoke, via: api, provenance: design}
    - {from: parse,        to: _BLANKS,  mode: read,   via: api, provenance: design}
    - {from: decide_bash,  to: _BLANKS,  mode: read,   via: api, provenance: design}      # FK4's recommended blank test

    # --- what M3 removes, and who depended on it -------------------------------------------
    - {from: parse,                 to: unwrap, mode: remove, via: api, provenance: design}
    - {from: decide_bash,           to: unwrap, mode: invoke, via: api, provenance: code}
    - {from: bash_lane_test_helpers, to: unwrap, mode: invoke, via: api, provenance: code}
    - {from: parse,          to: _cmd_segments, mode: remove, via: api, provenance: design}
    - {from: decide_bash,    to: _cmd_segments, mode: read,   via: api, provenance: code}
    - {from: compile_policy, to: _cmd_segments, mode: read,   via: api, provenance: code}

    # --- the decision, and the refusal message ---------------------------------------------
    - {from: decide_bash,           to: BashDecision,          mode: write, via: api, provenance: design}
    - {from: tool_bash,             to: BashDecision,          mode: read,  via: api, provenance: code}
    - {from: decide_bash,           to: UNTOKENIZABLE_REASON,  mode: read,  via: api, provenance: design}
    - {from: bash_lane_test_helpers, to: UNTOKENIZABLE_REASON, mode: read,  via: api, provenance: code}
    - {from: decide_bash,           to: EMBEDDED_NUL_REASON,   mode: read,  via: api, provenance: code}
    - {from: decide_bash,           to: _stage_unsafe,         mode: invoke, via: api, provenance: code}

    # --- the operand set the decision implies ----------------------------------------------
    - {from: tool_bash,            to: _opened_operands, mode: read, via: api, provenance: code}
    - {from: record_shim_failure,  to: _opened_operands, mode: read, via: api, provenance: code}
    - {from: record_shim_failure,  to: SHIM_COMMAND_MAX_CHARS, mode: read, via: api, provenance: code}
    - {from: decide_bash,          to: read_surface, mode: read, via: bash,      provenance: design}
    - {from: decide_read,          to: read_surface, mode: read, via: read-tool, provenance: code}

    # --- execution, and the oracle ----------------------------------------------------------
    - {from: box_executor,       to: bash_exec,   mode: invoke, via: subprocess, provenance: code, sends: payload, transport: subprocess}
    - {from: bash_fd_prefix_955, to: bash_oracle, mode: invoke, via: subprocess, provenance: design}

  drives:
    - {from: tool_bash,             to: decide_bash,  provenance: code,   multiplicity: serial}
    - {from: tool_bash,             to: box_executor, provenance: code,   multiplicity: serial}
    - {from: decide_bash,           to: parse,        provenance: design, multiplicity: serial}
    - {from: bash_fd_prefix_955,    to: parse,        provenance: design, multiplicity: serial}
    - {from: bash_differential_897, to: parse,        provenance: code,   multiplicity: serial}

# ===========================================================================================
# CLAIMS — the ledger. Every claim the three input frontiers raised, inherited ids kept.
# Six kinds; four claims are RETYPED here because the instrument table would have let them
# through on the wrong instrument (each says so in its note) and one, x9, is REFUTED by a
# census run at assembly. Verdict strings are the closed vocabulary; the elaboration that used
# to ride on them ("holds — re-verified, EXTENDED by g5") lives in `note`.
# ===========================================================================================

claims:

  # --- inherited from the authoritative comment (discuss-issue's sweep) --------------------
  - id: c1
    source: discuss
    kind: behavior
    claim: "the gate's `strip` is a LIVE divergence, not a settled no-op"
    probe: "decide_bash under a real MAIN policy with the divergent characters at each end of an allowed pipeline; grep -rn for _BLANKS and for does_not_rewrite over defender/"
    probe_kind: executed
    observed: "all variants allow=True with argv identical to the unprefixed command; `_BLANKS` returns ZERO hits tree-wide and `does_not_rewrite` returns ZERO hits, so neither the constant nor the pin the issue body describes exists. permission/bash.py:206 is plain `command.strip()`"
    verdict: holds
    note: "re-executed at 6a2ea874 by both phase-A leaves; EXTENDED by g5 (`\\f` and U+2028 join the table). CORRECTS the issue body, which spelled it `command.strip(BLANKS)` and said a test pinned it."

  - id: c2
    source: discuss
    kind: behavior
    claim: "`unwrap` mis-identifies the `-c` argument because it cannot see outer operators"
    probe: "decide_bash(\"bash -c 'echo a '2>/dev/null\", policy=MAIN) beside real bash running the same text"
    probe_kind: executed
    observed: "gate allow=True, authorised stage argv=['echo','a'] with stderr='devnull'. Real bash: the -c argument is `echo a 2`, the outer redirect takes stdout, stderr reports `cat: 2: No such file or directory` for the cat spelling. Operand dropped AND both streams re-routed"
    verdict: holds
    note: "ESCALATED by x2/g3: this is an ALLOW that EXECUTES, not merely a parse disagreement. It is verdict-change set member 3 — the member the closed four-member set was missing."

  - id: c3
    source: discuss
    kind: census
    claim: "exactly four sites split bash text; nothing else does"
    probe: "grep -rn shlex over all of defender/, split into production and tests"
    probe_kind: search
    observed: "splitters: _cmd_segments.py:45 (shlex.split), bash_exec.py:83 (_word_value, shlex.split), bash_exec.py:89 (_scan, hand-rolled), permission/bash.py:206 (command.strip). Every other production hit is shlex.join — query_tool.py:139, lead_zero.py:326, _stub_transport.py:417. permission/files.py:26 is a comment; test_bash_exec.py:175,185 use shlex.quote, which formats and never parses"
    verdict: holds
    note: "line-for-line at 6a2ea874. One member is described wrongly by the doc — see x1."

  - id: c4
    source: discuss
    kind: referential
    claim: "`_cmd_segments` has no hook consumers; its only callers are the gate and its neighbours"
    probe: "grep -rn _cmd_segments over defender/, plus a resolved reference lookup on `unwrap`"
    probe_kind: search
    observed: "ZERO importers under defender/hooks/. Production importers: runtime/permission/bash.py:8, runtime/permission/command_shape.py:4, runtime/permission/grant.py:10, runtime/permission/policies/_common.py:7. scripts/policy_cli.py:16 is a docstring mention, not an import"
    verdict: holds
    note: "extended by x10 with the test-side importers."

  - id: c5
    source: discuss
    kind: behavior
    claim: "a per-line wrapper scan loses lines a flattening scan refuses"
    probe: "unwrap(\"bash -c 'ls'\\ncat /etc/hosts\") and unwrap('timeout 5 cat x\\nls')"
    probe_kind: executed
    observed: "None and 'cat x\\nls'. `parse` splits on \\n at bash_exec.py:278 and `_scan` is per line, so a first-line-only fold reads `bash -c 'ls'` as a complete wrapper and drops line 2"
    verdict: holds
    note: "C1's widening risk. It is why the wrapper decision must sit OUTSIDE the per-line loop while every check inside it stays inside — and it is the pair of shapes FK5 split into two demands."

  - id: c6
    source: discuss
    kind: behavior
    claim: "deleting the trim refuses blank commands unless the empty path is handled"
    probe: "unwrap(''), unwrap('   '), unwrap('\\t'), unwrap('\\n'); then a no-strip re-implementation of decide_bash over the same inputs"
    probe_kind: executed
    observed: "all four unwrap to None. Under a no-strip decide_bash: '' stays allow=True (the `if not cmd` arm still fires) but '   ', '\\t' and '\\n' become DENY/UNTOKENIZABLE"
    verdict: holds
    note: "INCOMPLETE as stated — x5 shows the Unicode blanks flip the OTHER way (they are words, not blanks), and g6 refutes the doc's second remedy."

  - id: c7
    source: discuss
    kind: behavior
    claim: "`unwrap` is not idempotent"
    probe: "unwrap('timeout 5 timeout 3 cat x') then unwrap of the result; a resolved reference census on `unwrap`"
    probe_kind: executed
    observed: "'timeout 3 cat x' then 'cat x' — one prefix per application. Resolved call sites: 9 references in 5 files (grep floor 89) — the definition, permission/bash.py:8,98, and the test sites"
    verdict: holds
    note: "the doc's call-site list is corrected by x8: THREE parse(unwrap(x)) pairings, not four."

  - id: c8
    source: discuss
    kind: referential
    claim: "`bash_exec` imports only stdlib, and the box-mount constraint recorded for it is stale"
    probe: "read bash_exec.py:1-12; grep -rn _cmd_segments over *.md"
    probe_kind: read
    observed: "bash_exec imports contextlib, os, shlex, subprocess, sys, time, dataclasses, pathlib — stdlib only; `defender.runtime.box` is imported lazily INSIDE _run_box_entrypoint (bash_exec.py:447) and tempfile lazily inside _run_one_pipeline"
    verdict: holds
    note: "the stale record is at THREE lines of intent_540.md, not the one the doc names — see a2."

  - id: c9
    source: discuss
    kind: census
    claim: "neither differential's corpus contains the wrapper words"
    probe: "read _WORD/_ALPHABET/_SEEDED_FAMILIES in test_bash_differential_897.py and _SHIM/_CANDIDATES in test_955_bash_fd_prefix.py, then grep both files for bash/sh/timeout as a CANDIDATE program"
    probe_kind: search
    observed: "_WORD='echo'; _ALPHABET=('echo','|',';','&&','||','\\n','2>/dev/null','2>&1'); _SHIM='w' and every _CANDIDATES entry is a `w …` shape. The only `bash` in either file is the harness's own oracle invocation and the only `timeout` is a subprocess kwarg — no wrapper word appears as a candidate program in either corpus"
    verdict: holds
    note: "RETYPED from `reachability`/`read` to `census`/`search`: it is a completeness claim about two corpora, and reachability's instrument table demands an executed break-attempt it never had. Folding therefore perturbs no existing case — and buys coverage only if wrapper shapes enter the corpus (C5)."

  - id: c10
    source: discuss
    kind: reachability
    claim: "the refactor changes no verdict outside D2's enumerated set"
    probe: "deferred to implementation — both differentials plus the full suite, read against the six-member set this artifact now carries"
    probe_kind: read
    observed: "not yet attempted"
    verdict: deferred
    note: "TRANSFERS TO write-code-from-spec. FK7 is the fork about what instrument could actually settle it: over today's corpora it would close on 'no existing test changed its mind' across a corpus with zero coverage of the wrapper, `\\r` and blank classes."

  # --- raised by the grounding leaf (10-brief.md) ------------------------------------------
  - id: g1
    kind: behavior
    claim: "`_scan` splits words on `\\r`, which bash treats as an ordinary character — a live, authorised argv divergence inside the one site the design keeps unchanged"
    probe: "a recording shim under real bash for `w a\\rb`, `w\\rx`, `w a\\rb | cat`, argv file read as BYTES; then bash_exec.parse on the same texts; then decide_bash under a real MAIN policy over ten `\\r` spellings of an allowed pipeline"
    probe_kind: executed
    observed: "bash records argv b'a\\rb\\n' — ONE word — and answers `w\\rx` with `$'w\\rx': command not found` (rc=127). parse gives ['w','a','b'] and ['w','x']. Through the real gate all of these are allow=True with the split argv: `cat P\\r` -> ['cat',P]; `cat\\rP` -> ['cat',P]; `cat P\\r| wc -c` -> two stages; `cat A\\rB` -> ['cat',A,B], i.e. ONE bash word becomes TWO authorised operands and two files are read. `wc -c\\rP` and `grep -n x\\rP` deny on grant patterns, so the family is narrower than the whole surface but is not empty"
    verdict: holds
    note: "THE RUN'S MOST IMPORTANT FINDING. It contradicts the issue's census verdict for `_scan` ('keep — this is the one') — incomplete, not wrong — and it is what became M6 at §7 (F6)."

  - id: g2
    kind: behavior
    claim: "the #955 differential cannot observe g1: it normalises its own subject"
    probe: "read test_955_bash_fd_prefix.py:199-201; write b'a\\rb\\nARGV_END\\n' through the same read path"
    probe_kind: executed
    observed: "line 199 is `argv_file.read_text(encoding=\"utf-8\")` — newline=None, so universal newlines rewrite \\r to \\n — and line 200 splits on '\\n'. The recorded bytes come back as 'a\\nb\\n' and become the words ['a','b'], exactly the wrong parse. `scripts/lint/lint_unpinned_text_io.py` cannot catch it: the encoding IS pinned and it is the newline argument that is missing"
    verdict: holds
    note: "the issue's blind spot (2) is OPEN at 6a2ea874, in the very file the issue credits with closing it. M6(b) is this fix; pj2 measured what it buys."

  - id: g3
    kind: behavior
    claim: "the wrapper path is a live ALLOW path, not only a deny path"
    probe: "decide_bash under MAIN over bash -c / sh -c / timeout spellings of an allowed cat"
    probe_kind: executed
    observed: "`bash -c 'cat P'` ALLOW argv [['cat',P]]; `sh -c 'cat P'` ALLOW; `timeout 5 cat P` ALLOW; `timeout 5 timeout 3 cat P` DENY (c7's non-idempotence, refusing rather than mis-parsing); `bash -c 'cat P 'x` ALLOW argv [['cat',P,'x']] and bash agrees. test_permission.py:271's note that 'every bash -c test is a deny case' is about that FILE's corpus, not about the surface"
    verdict: holds
    note: "this is what makes c2 a security finding rather than a parse curiosity."

  - id: g4
    kind: primitive
    claim: "the divergence alphabet between `str.strip()` and `_BLANKS` is closed and computable, and every member of it flips the same way"
    probe: "enumerate every codepoint in range(0x110000) whose str.strip() is empty, subtract frozenset(' \\t\\r\\n'); then drive both today's decide_bash and a no-strip re-implementation over each at both ends of an allowed pipeline"
    probe_kind: executed
    observed: "str.strip() removes 29 characters; 25 are outside today's `_BLANKS`. Every one of the 12 sampled flips allow(today) -> deny(no-strip) at BOTH ends. Direction is uniformly NARROWING. `shlex.shlex('').whitespace` is ' \\t\\r\\n' — `_BLANKS` is that set exactly, which is how `\\r` got in (g1)"
    verdict: holds
    note: "RETYPED from `census` to `primitive`: it is a claim about `str.strip()`'s contract that closed on an executed probe, and the census instrument table would have demanded a search. THE COUNT IS SUPERSEDED BY a1: 25 is measured against the CURRENT separator set, and M6 edits that very constant, so the set the spec must carry is 26."

  - id: g5
    kind: behavior
    claim: "with the trim deleted, `\\f` and U+2028 join the P1 table the comment recorded for U+00A0 and `\\v`"
    probe: "the same MAIN-policy table extended with \\f and U+2028"
    probe_kind: executed
    observed: "both allow=True today with argv identical to the clean command; both parse to a corrupted first/last word without the strip (U+2028+'cat' as argv[0], 'wc -c'+\\f as the last operand)"
    verdict: holds

  - id: g6
    kind: behavior
    claim: "C2's alternative remedy — 'the folded parse returns zero pipelines rather than raising' — does not restore the blank verdict"
    probe: "command_shape.flat_stages([]), permission.bash._decide_readers([], MAIN, run_dir=…), command_shape.has_adapter([])"
    probe_kind: executed
    observed: "[] , None , False. `decide_bash`'s tail after a None reader and a False has_adapter is `BashDecision(False, policy.deny_reason)`. Zero pipelines therefore DENY a blank command, where today it allows"
    verdict: holds
    note: "REFUTES one half of the doc's C2 disjunction and settles F1 by probe rather than by the human. Only a blank test AHEAD of the parse preserves today's verdict; `d0_a_blank_command_is_answered_before_the_parse` is what replaced the provisional demand written the other way."

  - id: g7
