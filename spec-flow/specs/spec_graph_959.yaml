    probe_kind: executed
    observed: "SHIM_COMMAND_MAX_CHARS = 2000. Case A (50 chars, trailing CR): recorded == command, the CR survives. Case B (2005 chars, CR at index 2000): the CR is absent from the recorded row. Case C (index 1999): survives. Case D (index 2000): dropped. Plain Python slice semantics, no surprises"
    verdict: holds
    note: "SETTLES the truncation premise AND bounds the audit row's evidentiary value. The constant's own docstring names the command field as the one field of a shim row an attacker-influenced turn chooses freely, so an attacker padding past 2000 characters can push the divergent character out of the evidence while a plausible non-divergent command is what the audit shows. Narrow (>2000 chars) but real — §7 should weigh it, not dismiss it because realistic commands are short."

  - id: pj2
    kind: primitive
    claim: "under a byte-level read and a split on b'\\n', a `\\r` adjacent to the recording shim's own delimiter is not misattributed to the wrong argv entry"
    probe: "build the real shim, run it under real bash with `\\r` trailing an entry, leading an entry, standalone, and beside an empty entry; verify the bytes with od -c; recover the same file both ways"
    probe_kind: executed
