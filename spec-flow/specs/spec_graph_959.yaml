  - id: d_the_lexing_causes_this_change_does_not_touch_still_name_what_they_name
    kind: survival
    form: test
    binds:
      - 'UNTOKENIZABLE_REASON.domain.distinguished[cause3]'
      - 'UNTOKENIZABLE_REASON.domain.distinguished[cause4]'
    discharged_by: test_the_line_boundary_and_incomplete_connector_causes_still_name_what_they_name
    seed_docstring: >-
      Causes (3) and (4) — a `|`/`&&`/`||` at a line boundary, and a connector without a complete
      command on both sides within one line — still name exactly what the parser refuses FOR EVERY
      SPELLING THAT STILL REACHES THEM. The per-line dangling-connector and pending-connector
      checks stay inside the per-line loop while the wrapper decision sits outside it; the two
      constraints pull in opposite directions and both must hold. A `\r` glued to the word BEFORE
      a connector leaves the connector as the line's last token and cause (3) still answers; a
      `\r` AFTER the connector does not — it is a word of its own, the connector is no longer
      last, the check is structurally out of reach, and the command is refused down the other
      path. That is enumerated member 8, not a repair to make here: bash genuinely ends the
      pipeline at the connector, so teaching this check to look past a trailing `\r` would put a
      second private opinion about `\r` back into the change whose thesis is that there should be
      exactly one (RC1, human-resolved at the verify loop).

  # =========================================================================================
  # O3 — THE ENUMERATED VERDICT-CHANGE SET (M5, D2). A STATED DELIVERABLE OF THIS SPEC.
  # =========================================================================================

  - id: d_the_enumerated_set_is_written_before_implementation
    kind: coherence
    form: clause
    binds: ['decide_bash']
    source: "D2 / M5, CORRECTED per 45-dispositions RF-J3 (note 1)"
    outcome:
      nl: >-
        The spec artifact carries the enumerated verdict-change set in full before any
        implementation exists, and every instrument that certifies the refactor is read against
        that one written set rather than against whatever the suite complained about afterwards.
        THE SET, CORRECTED AND EXTENDED — EIGHT NUMBERED MEMBERS HOLDING SEVEN DISTINCT SHAPES
        (slot (6) is the placeholder FK1 filled as (7), counted twice).
        THIS NUMBERING GOVERNS (RC10): the frontier records `70-resolutions.md` and
        `71-verify-resolutions.md` number members 3, 4 and 5 in the other order — quoted
        `timeout` / newline-in-`-c` / outer-operator, where this artifact and the corpus have
        outer-operator / quoted `timeout` / newline-in-`-c`. The two lists hold the same shapes,
        so every count reconciles and no check can see the difference, but a composed corpus tag
        like `1+4` decodes to a different case depending on which document is being read. The
        artifact and the corpus agree with each other, which is the pair the implementation
        joins on, so they govern and the frontier files carry a line saying so.
        (1) LEADING OR TRAILING DIVERGENT BLANKS (M4, the deleted trim). 26 characters at each of
        two ends, plus the three whole-command blank spellings. Previously allowed with a
        rewritten argv, the character silently removed; now the blank belongs to the word it
        touches, so an otherwise-allowed pipeline is refused and a command that is nothing but one
        of them is a one-word command bash would try to run. The 26 are `str.strip()`'s 29 blanks
        minus space, tab and newline — newline excluded because `parse` splits physical lines on
        it before `_scan` ever runs — and the 26th is `\r`, which joins the alphabet the moment M6
        removes it from `_BLANKS`. The previously closed set said 25, a count taken from
        the very constant this change edits (claim a1, computed; correcting claim g4).
        (2) `\r` INSIDE OR AT THE EDGE OF A WORD (M6, and M2 with it). Includes the shape
        immediately before an fd marker, `cat P\r2>/dev/null`, ALLOWED today as `['cat', P]`
        with stderr on /dev/null while real bash runs `cat P\r2` with STDOUT redirected — an
        operand changed AND both streams re-routed; the corpus carried its mirror and not this
        direction until the verify loop (RC1). Previously `_scan` split
        the word there and the gate authorised two operands where bash passes one — `cat A\rB`
        authorised `['cat', A, B]` and opened two files. Now one operand, as bash reads it. THE
        VERDICT MOVES IN BOTH DIRECTIONS AND THE PREVIOUS WORDING STATED ONLY THE PARSE CHANGE:
        for a `cat`-shaped grant the CR-bearing operand fails `grant.SEG` and the command flips
        ALLOW->DENY, so a model pasting a CRLF command starts being refused; for an
        `OPENS_NOTHING` program whose grant shape ends in a single `VALUE` it stays ALLOWED WITH A
        DIFFERENT ARGV, which is the half a check that reads only allow/deny cannot see.
        (3) AN OUTER OPERATOR AFTER A `bash -c` ARGUMENT (M3) — the fix's own headline case, and
        it was missing from the closed set although member 1 named M4's fix by name.
        `bash -c 'echo a '2>/dev/null` is ALLOWED today with `[['echo','a']]` and stderr on
        /dev/null, while real bash's `-c` argument is `echo a 2` and the redirect belongs to the
        outer shell. ALLOW->DENY.
        (4) A QUOTED `timeout` WRAPPER WORD (M3 + F4). Previously refused as untokenizable because
        the prefix was matched against the raw text; now recognised by resolved value.
        DENY->ALLOW — the only widening, and the clause naming it leaves cause (5) together with
        the test that pins it.
        (5) A NEWLINE INSIDE A `bash -c` ARGUMENT (M3 + F5). Previously allowed and flattened into
        two pipelines; now refused as the unclosed quote it is. ALLOW->DENY, and the refusal must
        name the newline.
        (6) is the slot reserved for FK1 while it was pending at the human seam; FK1 was ACCEPTED
        and landed as member (7), so the set numbers to SEVEN and holds SIX DISTINCT SHAPES.
        (7) ACCEPTED AT §7 (FK1, minimal arm only) — A `timeout` PREFIX WITH NO DURATION-SHAPED TOKEN.
        `timeout cat report.md` is allowed today and executes `cat report.md`, while real
        `timeout` reads `cat` as its duration and runs nothing. The minimal fix advances past
        `timeout` only when at least one duration- or flag-shaped token is actually consumed:
        ALLOW->DENY, a narrowing, one condition and one test. The rejected arms are named in
        `d_a_timeout_prefix_with_no_duration_is_not_a_wrapper`.
        (8) ADDED AT THE FIRST VERIFY LOOP (RC1) AND WIDENED AT THE SECOND, THIRD, FOURTH AND
        FIFTH (RC6, RC9, RC11, RC12) — A DIVERGENT BLANK AT EITHER END MOVES WHICH MESSAGE A
        COMMAND THAT WAS ALREADY REFUSED IS REFUSED WITH. STATED AS A RULE OVER SETS DERIVED FROM
        THE CODE, NOT AS A LIST OF SHAPES, AND ITS FOUR AXES ARE NOW CLOSED RATHER THAN WIDENED:
        the CHARACTER axis is the computed 26-member alphabet checked against the frozen tuple;
        the REASON-CLASS axis is the four messages the gate can answer with, enumerated in one
        place (`_baseline_959.reason_classes`) that the recorder and the suite's control both
        read; the ARM axis is the places that decide which of those messages a refusal carries,
        derived per class — for `UNTOKENIZABLE_REASON` that is every `raise UntokenizableCommand`
        in `bash_exec.py` and `permission/bash.py` (six sites at this base commit, AST-derived by
        the suite so a new arm fails a test), and for the three classes that are RETURNED rather
        than raised it is their own tabled arms; and the POSITION axis is TWO, because
        `str.strip()` reaches two ends and nothing else (the interior belongs to member 2, where
        only the carriage return moves).
        THE STATEMENT FORM WAS THE TRAP AND IT IS WORTH THE SENTENCE: deriving the arms from
        `raise` statements missed `ADAPTER_RETIRED_REASON` BY CONSTRUCTION, because it is a
        `return`. 78 shapes moved off the message that tells the model to reach the system through
        the `query` tool — a REDIRECTION, not a diagnosis — while the derivation reported itself
        complete. The axis was never "places that raise"; it is "places that decide which message
        a refusal carries".
        THE RULE: the blank glues to the token it TOUCHES, and the refusal moves off its arm IFF
        that token is the one the arm's decision turns on — the LAST token for a trailing blank,
        the FIRST for a leading one. The glued token stops matching what the arm recognises and
        the command falls through to the capability path: still refused, correctly and more
        faithfully to bash, but the message that told the model what to fix is replaced by one
        that does not. Reason identity is part of a verdict (F2), so these are verdict changes.
        THE ADAPTER CLASS, AT THE LEADING END ONLY (RC12): `<blank>defender-elastic query foo`
        and its two siblings move 26/26 from the adapter message to the generic policy one, by the
        wrapper arm's exact mechanism — `is_adapter_stage` reads `argv[0]`, and a leading blank
        makes it a word that neither `startswith("defender-")` nor `ADAPTER_RE` matches. A
        trailing blank lands on the last operand, leaves `argv[0]` intact, and moves nothing:
        0/26. Determined rather than chosen, so it is recorded as an observation.
        THE TWO ENDS DO NOT ANSWER ALIKE, WHICH IS WHY NEITHER STANDS FOR THE OTHER. At the
        leading end the wrapper arm and the connector-opens-a-line arm move (10 base shapes ×
        26 = 260 shapes, executed): `<blank>bash`, `<blank>sh`, the seven wrapper shapes whose
        trailing end RF-E8 decided the other way, and `<blank>| wc -l`, where the blank supplies
        the very left-hand command whose absence was the refusal. At the trailing end those seven
        wrapper shapes KEEP their reason and the connector-opens-a-line arm does not move, while
        the trailing-backslash, bare-redirect and pending-connector arms do.
        THE MOVERS, each swept over all 26 characters and each executed 26/26 under the M4+M6+M2
        simulation: a trailing backslash (`cat P \`), a `|` whose right side is a bare redirect
        (`cat P | 2> /dev/null`), a connector closing its line (`cat P |`, `&&`, `||` — the
        separator spelling, 78 shapes), an `&&` whose right side never arrived (`cat P && ;`),
        and a bare wrapper word (`bash`, `sh`). THE NON-MOVERS, swept identically and recorded
        NEUTRAL because a sweep run only over the moving part of a set cannot say the rest does
        not move: an unclosed quote, a newline inside a quoted argument, a `|` whose right side
        fails three tokens back (`cat P | ; wc -l`), a connector opening a line (`| wc -l`), a
        connector crossing a line boundary, and an unclosed quote inside a `-c` argument.
        ONE GROUP IS DELIBERATELY OUT OF THIS MEMBER AT ONE END ONLY (RF-E8, human-resolved): a
        wrapper shape whose LAST token is not the wrapper word — `bash -c '<cmd>' extra{blank}`
        and six siblings — KEEPS the specific lexing reason, because the matcher recognises the
        wrapper by its FIRST token. 182 shapes, verdict-NEUTRAL BY DECISION rather than by
        observation, and the obligation is carried by
        `d_the_wrapper_shapes_the_reason_still_names_stay_refused`. THE SAME SEVEN SHAPES ARE
        MEMBER 8 AT THE LEADING END (RC11, and by OBSERVATION rather than decision): there the
        blank lands ON the wrapper word, `<blank>bash` is a first token no matcher recognises on
        any implementation this spec permits, and RF-E8's unanswerable-by-probe status does not
        reach it — the uncertainty it named was about a matcher that still sees `bash` first.
        ONE DIRECTION IS MEMBER 1'S, NOT THIS ONE: `cat P ;{blank}` was ALLOWED before (a `;` is
        not a dangling connector, so no arm looked at it) and is refused after — allow->deny at
        member 8's position, carried by the composed tag `1+8`.
        In every direction the message half folds into
        `d_a_command_refused_only_for_an_invisible_character_says_so`, which now carries both
        predicates: a command refused ONLY for an invisible character, and one whose REASON CLASS
        moved because of one.
        REJECTED: special-casing an arm to look past a trailing blank, which would reintroduce a
        second private opinion about what a blank is inside the change whose thesis is that there
        should be exactly one; and accepting the message change unenumerated, which leaves O3
        knowingly false on shapes a model plausibly sends.
        WHY IT TOOK THREE PASSES, RECORDED BECAUSE THE SHAPE REPEATED EACH TIME: member 1 was
        written as 25 characters, measured against the very constant this change edits, and
        recounted to 26. Member 8 was then written from three worked examples that all carried a
        carriage return, because that is what the finding that produced it was about (RC1); RC6
        widened it across the character axis and left the ARM axis unexamined; RC9 derived the
        arm axis from the code. Each pass closed what had been demonstrated. What is written here
        is a rule over a set the next reader can recompute from the source, which is the only
        form of this member that a fourth pass cannot widen by finding one more shape.
        THE SET NUMBERS EIGHT AND HOLDS SEVEN DISTINCT SHAPES: slot (6) is the placeholder FK1
        filled as (7), counted twice.
        Everything outside these members is verdict-neutral, AND THE INSTRUMENT THAT SAYS SO IS
        THE FROZEN-BASELINE REPLAY (FK7, accepted): the gate's whole decision over a purpose-built
        corpus, recorded at `6a2ea874` before any implementation existed and replayed afterwards.
        The two existing differentials could not have said it — their corpora contain no wrapper
        word, no `\r`, and no blank other than an ordinary space, so "verdict-neutral" over them
        means "no test that already existed changed its mind" across a corpus with zero coverage
        of the three classes this change touches.

  - id: d_no_verdict_moves_outside_the_enumerated_set
    kind: negative
    form: test
