      divergent blanks. FK7's second premise carried too — see
      `d_the_operator_cli_reports_the_whole_verdict`.

  - id: d_the_blank_test_reads_the_scanners_own_separator_constant
    kind: behavior
    form: test
    fork: FK4
    resolved: "read-the-scanners-constant — taken by the human at §7, as recommended"
    recommended_reading: "test blankness with the scanner's own separator constant — `not command.strip(_BLANKS)`"
    binds: ['interacts(decide_bash->_BLANKS)', 'command_text.domain.distinguished["   "]']
    discharged_by: test_the_blank_test_holds_no_opinion_of_its_own_about_what_a_blank_is
    seed_docstring: >-
      The blank test ahead of the parse holds no opinion of its own about what a blank is: it
      READS the scanner's separator constant rather than owning a second one, so exactly one place
      in the tree still decides. Checked against every member it touches — `""`, `"   "`, `"\t"`,
      `"\n"` stay the allowed no-op; `"\u00a0"`, `"\v"`, `"\f"` alone are words bash would try to
      run as program names and are refused; a lone `"\r"` is likewise a word, which is exactly
      what M6 says bash reads it as.
    readings:
      read-the-scanners-constant: "`not command.strip(_BLANKS)` — one decider survives, and the blank test reads the opinion rather than holding it; costs nothing and needs no new constant"
      delegate-to-the-scan: "ask `_scan` — F1's probe-refuted horn: the parse cannot answer it (zero pipelines DENY), so this needs a NEW special case rather than a pure delegation"
      a-second-constant: "an explicitly-named blank-check constant — reintroduces a second opinion about whitespace in the very change whose thesis is that there should be one"
    note: >-
      RESOLVED AT §7 (FK4, human): `not command.strip(_BLANKS)`. The blank test holds no
      opinion of its own, so exactly one place in the tree still decides — the change's whole
      thesis. `delegate-to-the-scan` was probe-refuted at F1 and `a-second-constant` rejected as
      a second opinion about whitespace inside the change that exists to remove second opinions.
      Adds NO member to the enumerated set. F1 settled WHERE the blank test sits (ahead of the parse); this is WITH
      WHAT ALPHABET, which no doc sentence picks. The recommended reading is a third one neither
      escalation reader offered.

  - id: d_the_blank_test_and_the_nul_check_keep_their_order
    kind: behavior
    form: test
    binds: ['EMBEDDED_NUL_REASON', 'interacts(decide_bash->command_text)']
    discharged_by: test_the_relocated_blank_check_and_the_embedded_nul_check_keep_the_same_relative_order
    source: "brief f5 — the arm ordering the trim's deletion moves"
    seed_docstring: >-
      The order is firm and pinned: the blank test, then the embedded-NUL check, then the parse.
      The NUL arm may not move above or below the relocated blank test, it still runs once over
      the whole raw command before any parsing including wrapper detection — so it fires
      identically at every wrapper depth — and a command carrying both a NUL and a divergent blank
      is answered by the NUL arm.

  # =========================================================================================
  # O4 + C5 — THE ORACLE. The wrapper seam covered by an executable oracle against real bash.
  # =========================================================================================

  - id: d_wrapper_shapes_enter_the_differential_corpus
    kind: behavior
    form: test
    binds: ['bash_oracle', 'interacts(bash_fd_prefix_955->bash_oracle)', '_scan']
    discharged_by: test_what_we_accept_means_what_bash_means
    seed_docstring: >-
      For every shape the parse accepts, real bash is asked what it actually ran and where its
      stderr went, and the two must agree. This is the direction that can see a shape both sides
      accept and MEAN differently, which an accept/reject oracle is structurally blind to.
    note: >-
      #971 EMPTIED THE WRAPPER HALF OF THIS CORPUS, and the demand survives as the differential
      it always was. The parse accepts no wrapper now — `bash -c '<payload>'` is three ordinary
      words whose first is an ungranted program — so there is no folded command left for bash to
      be answerable about, and asking anyway would compare the wrong things: the oracle measures
      which argv reached the shim, and a wrapper passed through reaches it one exec level below
      what the parse models. That those shapes DENY is
      `d_no_word_is_parsed_as_a_wrapper`'s, over a wider list than this corpus ever carried.
      The NOTE is left in place carrying that reasoning, because "why is there no wrapper
      coverage in the wrapper differential" is the question a later reader asks. The test is
      not: a `@parametrize` over an empty list reports SKIPPED while its body and its "the
      corpus carries wrapper shapes" docstring survive intact, so it read as coverage and
      asserted nothing. This demand now points at the accept-direction differential itself --
      the same oracle, over the shapes that remain -- rather than at a case that cannot run.
      ORIGINALLY: >-
      RENAMED for the same reason as the O2 control above: `20-demands.md` pointed this demand at
      `test_what_we_accept_means_what_bash_means`, the EXISTING parametrized case at
      `test_955_bash_fd_prefix.py:212`, whose corpus is single-stage `w …` shapes and contains no
      wrapper word at all (c9). The wrapper cases join THAT file — D1's decisive argument is that
      folding puts the wrapper under the existing differential — as their own case, so the new
      coverage cannot read as already present.

  - id: d_the_two_layer_stderr_detection_is_deliberate
    kind: behavior
    form: test
    binds: ['bash_oracle', 'interacts(bash_fd_prefix_955->bash_oracle).response']
    discharged_by: test_the_oracle_tells_the_inner_shells_stderr_from_the_outer_shells
    seed_docstring: >-
      When the corpus runs bash inside bash, the oracle still tells where the stderr marker landed
      for the command under test rather than for the shell wrapping it.

  - id: d_blank_alphabet_enters_the_differential
    kind: behavior
    form: test
    binds: ['bash_oracle', 'command_text.domain']
    discharged_by: test_our_blank_set_is_the_blank_set_bash_splits_on
    seed_docstring: >-
      The differential's alphabet carries blanks derived from both sides of the comparison —
      `str.isspace()` together with the scanner's own set — so every character one side calls a
      word separator is put to real bash, and a character bash does not split on does not end a
      word here either. The blank must be rendered GLUED to an adjacent token with no separator:
      a space-separated blank cannot exercise the property, and if the corpus renderer cannot do
      that today it gains the machinery.

  - id: d_the_oracle_syntax_checks_the_inner_text_too
    kind: behavior
    form: test
    fork: FK9
    resolved: "multi-stage-with-inner-precheck — auto-resolved at §7 (non-material); its load-bearing half is probe-settled, not chosen"
    recommended_reading: "take the multi-stage path AND precheck the inner text as well as the outer"
    binds: ['bash_oracle.access[subprocess]']
    discharged_by: test_a_candidate_whose_inner_c_payload_is_broken_is_reported_not_silently_accepted
    seed_docstring: >-
      The oracle prechecks the text it is about to trust: a second, independent `bash -n -c` over
      the EXTRACTED INNER text, because the existing outer `bash -n -c "<outer>"` reports nothing
      at all about a nested `-c '<inner>'` payload's syntax. A candidate whose inner payload is
      broken is skipped and reported, never silently accepted into the corpus. The helper must
      also accept a multi-stage candidate rather than raising: `bash -c 'cat x | wc -l'` is the
      shape a model most plausibly writes and is exactly where an argv divergence would hide.
    readings:
      multi-stage-with-inner-precheck: "a second helper path plus a second precheck — costs a helper, and is the only way the multi-pipeline `-c` payload gets an oracle at all"
      single-stage-discipline: "only ever add single-stage candidates and keep the one outer precheck — free, and leaves the multi-pipeline `-c` payload with no oracle while a malformed inner payload turns a candidate into a test of nothing"
    note: >-
      RESOLVED AT §7 (FK9, auto — non-material): the multi-stage path AND the inner precheck. The
      load-bearing half is probe-settled rather than chosen: probe PO-J3 executed it (claim pj3).
      Four broken-inner shapes nested inside a well-quoted outer all returned rc=0 with empty
      stderr, while the same text handed directly to `bash -n -c` was reliably flagged (rc=2).
      The inner precheck is required, not optional. Note also that the existing helper asserts
      `len(stages) == 1` inside `_parsed`, so a multi-stage candidate RAISES rather than
      asserting — a green-looking failure to add coverage.

  - id: d_the_oracle_bounds_its_own_subprocesses
    kind: behavior
    form: test
    fork: FK10
    resolved: "both — auto-resolved at §7 (non-material)"
    recommended_reading: "both — an explicit timeout on the harness's own subprocess calls AND disciplined corpus construction"
    binds: ['bash_oracle.access[subprocess]']
    discharged_by: test_the_oracle_harness_bounds_its_own_subprocess_calls
    seed_docstring: >-
      The oracle harness bounds its own subprocess calls explicitly, so a candidate that does not
      terminate — or a composed candidate whose child outlives the parent the harness waits on —
      turns a hung suite into a failed test rather than polluting the next candidate's evidence
      file.
    note: >-
      RESOLVED AT §7 (FK10, auto — non-material): both, an explicit timeout on the harness's own
      subprocess calls AND disciplined corpus construction. It decides nothing about what the
      gate accepts.

  # =========================================================================================
  # C3 / C4 — MIGRATION AND THE MODULE. R5's dependents, one demand per dependent.
  # =========================================================================================

  - id: d_every_caller_stops_unwrapping_by_hand
    kind: survival
    form: test
    binds: ['unwrap', 'parse']
    discharged_by: test_the_gate_hands_the_raw_command_straight_to_the_parse
