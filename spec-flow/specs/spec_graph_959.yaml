handoff:
  forks:
    - "F6 — is O1's universal in scope? IN SCOPE, both halves required. resolved_by: human. `\\r` leaves `_BLANKS` (a) AND the #955 oracle reads the recorded argv in binary (b): (b) without (a) is a red test, (a) without (b) is a green suite over an unasserted property. Became mechanism M6, which is not in the issue body."
    - "F4 — does the enumerated set admit the widening M3 itself produces? ACCEPTED. resolved_by: human. `timeout '5' cat x` / `\"timeout\" 5 cat x` flip deny->allow; the 'quoted `timeout` prefix' clause leaves UNTOKENIZABLE_REASON cause (5) together with the test pinning it. The body's 'can only narrow what is accepted' sentence is STRUCK as false."
    - "F5 — is the multi-line `-c` narrowing wanted? ACCEPTED. resolved_by: human. Obligation attached: the refusal must reach the model as a reason that explains the newline. SB4 bounds it — where an independently unbalanced quote fails first, the generic cause is correct."
    - "F2 — what is a verdict? THE WHOLE `BashDecision` (allow + reason identity + pipelines). resolved_by: auto (non-material)."
    - "F3 — does `unwrap` survive as a name? RENAMED. resolved_by: auto (non-material). The folded step works in SPANS of the original text — the `timeout` arm parses the raw slice from the next token's start offset, and the `bash -c` arm uses its token's span to know where the argument ends (which is how an outer operator becomes visible) while handing on that token's RESOLVED value as the inner command. It is `_wrapper_span` here and `unwrap` remains as the removed element. The rationale originally recorded here — \"it returns a span, not an unwrapped string\" — was true of one arm and false of the other; corrected at the second verify loop (RC7)."
    - "F1 — where is the blank command answered? PROBE-SETTLED, not a fork: the two phase-A leaves disagreed and the executed probe won (g6). A folded parse returning zero pipelines DENIES; only a blank test AHEAD of the parse preserves today's verdict. Recorded because a later reader will find the refuted recommendation still sitting in 20-demands.md."
    - "RESOLVED AT §7 — FK1 ACCEPTED, MINIMAL ARM ONLY (human): the wrapper step advances past `timeout` only when at least one duration- or flag-shaped token is consumed; `timeout cat report.md` flips allow->deny and joins the enumerated set as member 7. `full-grammar` and `decline` rejected by name. FK3 ONCE, at the top level, never over the slice it extracts (human) — adds NO member. FK4 the blank test READS `_BLANKS` (human) — adds NO member. FK7 the frozen-baseline replay is BUILT NOW (human), so the neutrality obligation stays a universal, and its second premise carries: `policy_cli explain --json` gains the missing `pipelines` field. FK6 (auto, non-material) the invisible-character refusal names the character. FK9 (auto) multi-stage path AND inner precheck — its load-bearing half is probe-settled (pj3), not chosen. FK10 (auto) the oracle bounds its own subprocesses. Each demand above carries `resolved:` and the readings it rejected."
    - "FK2 — how far does O1's universal reach into the wrapper's own semantics? RESOLVED AT §7 (human, routed late on the author leaf's red flag): O1 BINDS THE ARGV AUTHORISED FOR THE INNER COMMAND. The wrapper's own discarded semantics — the kill timer `timeout 5 cat x` never starts, the shell `bash -c 'echo $HOME'` never gets to expand `$HOME` in — ARE A NAMED NON-OBLIGATION OF THIS SURFACE, stated here explicitly rather than left implicit, because O1 read literally was already false for every wrapper shape the design KEEPS. Rejected: extending O1 to the wrapper's semantics (enforcing the timer, or refusing the wrapper outright — far beyond consolidating where a word ends), and leaving it unstated. No demand is minted either way and nothing in the suite turns on it; every O1 assertion in the suite is already scoped to the inner command's argv, and the differential compares the argv the parse authorised against the argv bash actually passed, which structurally cannot fail on an effect the parser never modelled. THE ROUTING FAILURE IS ITSELF RECORDED: this family fell out between the judge's ten and the seven that reached §7, and was recovered only because the author leaf noticed it had no resolution."
    - "FK5 and FK8 were RESOLVED IN STRUCTURE rather than put to the human: FK5 by splitting one sentence into two demands (`bash -c` refuses, a `timeout` prefix accepts), FK8 by stopping O3 at the decision object and binding the four post-decision consumers under O1 at `_opened_operands`. Both are recorded here so the merge-gate human can disagree."
    - "SB2, SB3, SB5, SB6 take the judge's recommendations and are bound above (reason identity for the leftover `timeout 3 cat x`; the two-way malformed/refused distinction; the argv the wire will not carry recorded as out of O1's scope; one table-driven sweep over the closed alphabet). SB1 routes into FK3, which the human resolved as `once`."
    - "RC1/RC6/RC9/RC11/RC12 — a divergent blank moves WHICH MESSAGE an already-refused command is refused with. RESOLVED ACROSS FIVE VERIFY LOOPS. The final form is a rule over four axes that are CLOSED rather than widened: CHARACTER (the computed 26-member alphabet checked against the frozen tuple), REASON CLASS (the four messages the gate can answer with, enumerated once in `_baseline_959.reason_classes` and read by both the recorder and the control), ARM (derived per class — AST-walked `raise` sites for the lexing class, tabled arms for the three classes that RETURN their message), and POSITION (two, because `str.strip()` reaches two ends and nothing else). The rule: the blank glues to the token it touches, and the refusal moves off its arm iff that token is the one the arm's decision turns on — the last token for a trailing blank, the first for a leading one. WHY FIVE PASSES, recorded because the shape repeated every time: RC1 found it as one character at one arm; RC6 found the character axis unwidened; RC9 found the arm axis unwidened; RC11 found the position axis unwidened; RC12 found the arm DERIVATION keyed on the statement form — `ADAPTER_RETIRED_REASON` is a `return`, so a walk over `raise` sites could not reach it however carefully written, and 78 shapes moved off the message that redirects the model to the `query` tool while the derivation reported itself complete. Each pass closed exactly what had been demonstrated; what stops a sixth is not a wider sweep but `test_every_recorded_transition_belongs_to_an_enumerated_class`, which states the recorded reason-transition space as a closed set of twelve families and fails on a thirteenth."
    - "RC2 — the invisible-character reason obligation. RESOLVED AT THE VERIFY LOOP (human): FK6 was resolved for a CLASS and bound for one member of it, so the demand is WIDENED (not doubled) to every member of the frozen divergent-blank alphabet and the refusal must name the character BY CODEPOINT. Of the corpus cases delegating their reason to that demand, the overwhelming majority carry no carriage return at all (103 of 118 over the corpus as it now stands; 78 of 91 when the finding was written). Rejected: narrowing FK6's recorded resolution to line endings."
    - "RC4 — the audit row's 2000-character truncation bound. ACCEPTED at the verify loop (human) and recorded as an acceptance in `handoff.deviations`, after being routed to the human seam twice and answered neither time. RC3 and RC5 were folded as records without asking: three out-of-scope premises are now `handoff.drops` entries, and the frontiers checker's second finding is a consequence of a file written after the mechanical leaf ran."
    - "RF-E8 — a wrapper shape whose LATER token carries an invisible character. RESOLVED AT §7 (human, third verify loop): it KEEPS the specific lexing reason. A faithful folded matcher recognises the wrapper by its FIRST token, so the shape is still recognisably a wrapper and cause (5) still names it. Rejected: falling back to the capability deny (182 more shapes into member 8, and the model loses the message naming what is actually wrong), and leaving it unrecorded (whichever way the implementer happened to build it would silently become the answer). The corpus records all seven shapes × 26 characters as NEUTRAL BY DECISION — the simulation that settled every other arm reports these MOVING, but it parses without the fold, so it cannot settle them; `d_the_wrapper_shapes_the_reason_still_names_stay_refused` states the first-token rule as an obligation on the implementation rather than leaving it to be inferred from a corpus row. THIS IS THE ONE ANSWER IN THE SUITE THAT IS CHOSEN RATHER THAN MEASURED, and it is marked as such in the artifact, the corpus and the test."
  refuted:
