       nothing. Recorded in this spec as the `gather_session_terminator_unchanged` clause.
       (2) THE HARDCODED `@timestamp` DESCENDING SORT. Defect: every `verb=query` result is the
       20 most RECENT matching documents with no way to ask for any other slice and no signal
       to the lead that it got a slice at all — so a lead asking what happened FIRST in a window
