tests: defender/tests/e2e   # the suite this graph is the derivation of (the guard is only
                            # reachable through a driven gather run, so every test is e2e —
                            # `suite_files` globs one level, and #771's graph names the same dir)
schema_version: 1
design: "807"   # gh#807, comment by beetroot-salad — "Discussion outcome — scope, corrected
                # premises, and the design for the breaker"; scope is ask (1) ONLY (O1-O4, M1-M4).
base: c0c3e68c  # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# The change: a REPEAT CIRCUIT BREAKER inside the gather subagent's query tool. A lead that
# issues the same request (lead_id, system, verb, canonical(params)) for the third time is
# refused before the backend call, the refusal is recorded as an ordinary queries-table row,
# and a `GatherDeadEnd` terminates the LEAD (not the run) with a structural message to main.
#
# The human seam (§7) HAS NOW RUN — `70-resolutions.md` is the record: 24 forks in, 8 answered
# by the human, 6 auto-resolved on the spine, 6 collapsed by probe before the seam, 4 carried
# auto from the judge. Demand #0 did NOT flip (F-C confirmed the pin), so phase C's
# classification did not re-run. Everything phase D wrote as OPEN below is annotated with its
# §7 answer in place, the demands §7 minted are in their own section, and
# `handoff.resolved_at_seam` carries the whole decision list for the implementer.
# The judge routed 23 forks — 13 material, 10 not — and this graph adds one the judge's set did
# not carry (F3, the predicate's name and site). Four re-ground probe leaves ran AFTER the judge
# and collapsed SIX forks to their recommendation (F-L, F-M, F-Q, F-R, F-S, F-T), two of them
# previously material; those verdicts are folded in below and their probes are claims P-a…P-i.
#
# The `gate:` block is NOT written here. Phase D's gate leaf writes it; phase E annotates each
# hole with the fork answer that closed it and never with a new decision of its own.
#
# NAMES THIS SPEC MINTS ON THE PRODUCTION SIDE (phase E, from the §7 answers — the implementer
# must build them under exactly these names or `check_binds` skips the concept silently):
#   record_query.repeat_trip / RepeatTrip(first_seq, occurrence) / REPEAT_THRESHOLD = 3
#   record_query.lead_rows(run_dir, lead)   — the guard's own fail-open read (F-Q/P-d)
#   record_query.REPEAT_ESCAPE              — the one fixed system-agnostic sentence (F-G)
#   record_query.GatherDeadEnd(reason, escape)
#   a SENTINEL IDENTITY the guard skips on EVERY row written ABOVE M2 — `wrap_tool_validate`'s
#     rejection row AND both of `_grant_check`'s row-writing branches (F-A option 1, NARROWED
#     at the §7 seam's round 2; the round-1 wording "rows written from inside
#     `wrap_tool_execute`" admitted the `_grant_check` pair by its letter). P-a proved no
#     discriminator exists among the frozen twelve keys, so this is real production work the
#     spec pins only by its observable — and it must live INSIDE the twelve keys, which the
#     tests now assert directly (`set(row) == ROW_KEYS` on every above-M2 row they drive).
#
# ---------------------------------------------------------------------------
# NAME RECONCILIATION — grounding (10-brief), demand extraction (20-demands) and the
# dispositions' address derivations (45-dispositions) coined ids independently. Unified here
# by ROLE+ORIGIN, against the code:
#
#   `gather_dispatch`  = runtime/tools_gather.py::_run_gather. The brief calls it `_run_gather`,
#       20-demands `gather_dispatch`; the profile's contextAliases already maps the file stem
#       `tools_gather` -> `gather_dispatch`, so the graph keeps `gather_dispatch`.
#   `query_tool`       = runtime/query_tool.py::QueryCapture.wrap_tool_execute — the EXECUTE
#       path only. The same class's VALIDATE path is a SEPARATE actor, `wrap_tool_validate`
#       (query_tool.py:193, its own `_record` call at :201): one origin, two roles, and the
#       split is load-bearing — F-A is entirely about which of the two wrote a counted row.
#   `request_key`      = scripts/gather_tools/record_query.py::_request_key (:184). Private
#       symbol; the graph drops the leading underscore for the id, as the corpus does
#       throughout. Same for `gather_raw` (= query_tool::_persist_payload's tree),
#       `denial_log` (= observe.py::denial_logger's stream) and `declared_params`
#       (= runtime/verbs.py::declared_params).
#   `repeat_trip`      = the predicate that DOES NOT EXIST YET. 20-demands' fork F3 pinned the
#       name provisionally (beside `_request_key`/`repeat_note` in record_query.py). Per
#       schema.md's join rule an implementation that names it otherwise makes `check_binds`
#       SKIP the concept silently, so this is a naming decision with a mechanical cost — it is
#       carried into handoff.forks, NOT aliased.
#   BRIEF FLAGS are spelled `brief F<n>` everywhere in this file, as the graph already spells
#       `RF`-prefixed items. The collision this fixes: `F3` denoted TWO things — the phase-A
#       naming fork (the predicate's name and definition site, in the header, in
#       `gather_dead_end_type`'s note and in `handoff.forks`) and 10-brief's flagged fact F3 at
#       the M4 write edge. A reader resolving the M4 note followed it to the naming fork and
#       lost the grounding fact behind the note. Bare `F<n>` now always means the fork.
#
#   `collect_general_failures` is BOTH a boundary (the N5 clause's bind target — the curator's
#       input, deliberately unwidened) and a function inside the `lead_extraction` actor (a
#       reader of the queries table). Two roles, kept distinct on purpose.
#   `executed_queries` is the GATHER run's table. The judge's identically-named file
#       (learning/pipeline/judge/closed_ticket_tool.py::_capture_and_view, a 7-key row with no
#       `lead_id`) is a DIFFERENT boundary, `judge_queries_table` — modelled so that "same file
#       name" can never read as one sink (claim G17).
#
#   AXES: `params` was missing from 20-demands' `axes:` list while `repeat_trip.identity`
#       keyed on it — the join-breaker the registry exists to prevent. Registered below.
#
#   CORRECTED SLOT: 20-demands declared `drives(gather_dispatch->query_tool)` as
#       `multiplicity: serial`. It is CONCURRENT — two query calls in one gather turn are a
#       pinned existing scenario (G13) and pydantic-ai drives them with
#       `asyncio.create_task` + `asyncio.wait` (P-c, executed). R2's form selection and the
#       whole of fork F-F (is N a cap or a floor?) read this slot.
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE RETURN CONTRACT. Gates every message assertion downstream.
  # RATIFIED at §7: fork F-C answered option 1 — the pin below stands verbatim and demand #0
  # did not flip, so phase E wrote every message assertion against it and re-decided nothing.
  # =========================================================================

  - {id: dead_end_return_contract, kind: behavior, form: test,
     discharged_by: test_dead_end_return_contract,
     binds: ["gather_dispatch", "GatherDeadEnd",
             "interacts(gather_dispatch->model_context)",
             "interacts(gather_dispatch->gather_summaries)"]}
     # PIN (F-C option 1, recommended, unratified): `_run_gather` catches `GatherDeadEnd` in the
     # same except chain as `UsageLimitExceeded` (tools_gather.py:301) and returns ONE string
     # that (a) opens with the existing terminal idiom — "gather for {lead_id} … Treat this lead
     # as incomplete and reason from what was captured" — so main's established handling still
     # fires (C5), (b) names the repeated request, the structural cause and the escape, and
     # (c) is `_wrap(…, "untrusted", deps.salt)`-wrapped and written to
     # `gather_summaries/{lead_id}.md`, exactly like the three branches beside it.
     # TEXTUAL ANCHOR the judge added: O2's own sentence is "hands back a reason main can act
     # on, NOT JUST 'incomplete'" — "not just" presupposes the idiom is retained and added to.
     # premises carried: test_stopped_lead_after_mains_context_is_folded,
     #   test_message_uses_vocabulary_no_prompt_in_the_corpus_teaches (both settled UNDER this
     #   pin; both re-open if §7 resolves F-C against it).
     # rejected (recorded on the test):
     #   - the structural reason alone, dropping the idiom — C5 is evidence about main's
     #     response to the INCOMPLETE framing, and no prompt in the corpus teaches dead-end or
     #     refusal vocabulary (G19).
     #   - letting `GatherDeadEnd` escape `_run_gather` the way `RunAborted` does — refuted by
     #     P1/P-c: uncaught at that placement it kills the whole run.

  # =========================================================================
  # O1 / O3 — the predicate and its placement (M1, M2)
  # =========================================================================

  - {id: gather_dead_end_type, kind: seam, form: test,
     discharged_by: test_gather_dead_end_type,
     binds: ["GatherDeadEnd", "query_tool", "gather_dispatch",
             "interacts(query_tool->GatherDeadEnd)"]}
     # `GatherDeadEnd(reason, escape)` exists, is raised out of `QueryCapture.wrap_tool_execute`
     # at M2's placement, and is catchable at `_run_gather`. M2's placement is OUTSIDE the try
     # around `handler(args)`, so membership in `CONTROL_FLOW_EXCEPTIONS` is not required.
     # Definition site is fork F3 (open): P8 shows `tools_gather` and `record_query` are both
     # cycle-free.

  - {id: repeat_trip_predicate_seam, kind: seam, form: test,
     discharged_by: test_repeat_trip_predicate_seam,
     binds: ["repeat_trip", "executed_queries.identity", "request_key",
             "interacts(query_tool->repeat_trip)"]}
     # An IMPORTABLE predicate over queries-table ROWS, keyed (lead_id, system, verb,
     # canonical(params)) with threshold N — so O1/O3's replay oracle can drive the production
     # predicate over a recorded run without a live agent. Reuses `record_query._request_key`
     # (P7/G8), never a second canonicalizer (a second one is also a `lint_duplicate_helpers`
     # hit — G20).
     # RESOLVED (F-B, §7 auto, option 1): the guard normalises the LIVE call to its stored form
     # (`_json_safe_params`, then `_request_key`) BEFORE keying, so the guard and the replay
     # oracle are literally one function over one input shape and RF-B4 closes for every
     # replay-based demand at once. The signature phase E pins:
     #   repeat_trip(rows, lead, *, system, verb, params, threshold=REPEAT_THRESHOLD)
     #       -> RepeatTrip(first_seq, occurrence) | None
     # `first_seq` is the EARLIEST matching row's seq read off the SEQ, not off file order —
     # the count is order-independent, so the seq it names is too (F-H(b)).
     # The counted domain excludes every row written ABOVE M2 (F-A, narrowed at §7 round 2) —
     # see `counted_domain_excludes_validate_path_rows`.
     # `REPEAT_THRESHOLD = 3` is pinned here as the module constant AND as ONE N for every
     # system: the test drives a second (system, verb) pair at the predicate and it trips at
     # the same occurrence, which is F-P's "no per-system override" half made observable
     # (§7 round 2 — before it, the claim lived only in the suite's module docstring).
     # F-P's OTHER half, "no env var", is deliberately asserted NOWHERE: an implementation
     # reading `env_int(…, 3)` at import time defaults to 3 and passes every in-process check,
     # so a test at that address would certify nothing. It stays a decision the implementer
     # meets in `repeat_threshold`'s refinement and in `handoff.forks`, and the suite's module
     # docstring now says so instead of claiming the coverage.
     # rejected (recorded on the test):
     #   - N2 — it is not a progress oracle: it answers only "have I sent this exact request
     #     before".
     #   - keying on `payload_digest` instead of request identity — C10: pr815's l-015 seq
     #     8/16/17 returned the same 745-byte empty payload for three genuinely different
     #     questions, so a digest key refuses correct work.
     #   - persisting the count in `circuit_breaker.json` — the count is DERIVED per call from
     #     rows already on disk; the existing breaker persists because it is run-scoped and
     #     cross-lead, this predicate is lead-scoped.

  - {id: repeat_trips_on_third_identical_request, kind: domain-outcome, form: test,
     discharged_by: test_repeat_trips_on_third_identical_request,
     binds: ["repeat_trip", "repeat_threshold.domain.distinguished[3]",
             "interacts(query_tool->executed_queries)"]}
     # The positive control every negative in this spec pairs with: calls 1 and 2 EXECUTE,
     # call 3 is refused. N = 3 is C11's floor — at N = 2 the guard refuses a lead that went on
     # to succeed (G4 corrects the doc's arithmetic: N=2 trips two pr815 LEADS, not four rows).

  - {id: repeat_replay_trips_the_two_recorded_leads, kind: domain-outcome, form: test,
     discharged_by: test_repeat_replay_trips_the_two_recorded_leads,
     binds: ["repeat_trip", "executed_queries"]}
     # O1's stated oracle, seq numbers verified independently (C2/P4): reviewer-measure-0807-b
     # trips once at l-001 seq 4 (not 36); reviewer-measure-0807 trips once at l-001 seq 9.
     # premises carried: test_incremental_live_check_and_batch_retrospective_replay_agree_on_the
     #   _trip_point (a conforming replay STOPS accumulating for a lead at its first trip —
     #   O1's own oracle says "must stop at seq 4 rather than 36"); test_predicate_agrees_when
     #   _run_against_the_staged_copy (the replay drives recorded tables, which are copies; the
     #   predicate is a pure function of row content — no path, inode or mtime enters it).

  - {id: repeat_replay_never_trips_the_drift_run, kind: negative, form: test,
     discharged_by: test_repeat_replay_never_trips_the_drift_run,
     binds: ["repeat_trip", "executed_queries"]}
     # O3, over pr815-rerun-0808 (131 rows, 15 leads, including 36- and 34-call leads): zero
     # trips. Positive control: `repeat_trips_on_third_identical_request` and the row above.
     # premises carried: test_lead_whose_changed_requests_return_the_same_result (C10's shape,
     #   pr815 l-015 seq 8/16/17 — three different questions, one 745-byte payload, lead
     #   finished; a digest-keyed predicate fails here).
     # rejected (recorded on the test):
     #   - N1 — the guard deliberately does not detect semantic drift: pr815's l-012 (36
     #     distinct calls) and l-015 (eight coined db-1-sshd-* ids for one question) walk past
     #     it, and `request_limit` stays the boundary for drift.
     #   - N=2 — C11/G4/P4: it refuses l-008 seq 1 and l-015 seq 9, and both leads returned
     #     real summaries.

  - {id: repeat_key_is_lead_scoped, kind: behavior, form: test,
     discharged_by: test_repeat_key_is_lead_scoped,
     binds: ["repeat_trip.identity", "executed_queries.identity"]}
     # `executed_queries.jsonl` is ONE table for every lead in the run; an identical request
     # issued by a DIFFERENT lead_id must not count toward this lead's trip.
     # premises carried: test_rows_from_a_different_lead_interleaved (the count filters by
     #   lead_id equality, independent of physical write order); test_two_sibling_leads_each
     #   _pay_their_own_repeat_budget; test_repeat_count_resets_on_redispatch_to_a_new_lead_id
     #   (l-003 starts at zero and gets its own full N — see RF-J1 and the
     #   `run_level_repetition_is_out_of_scope` clause).

  - {id: repeat_key_ignores_query_id, kind: behavior, form: test,
     discharged_by: test_repeat_key_ignores_query_id,
     binds: ["repeat_trip.identity", "request_key.identity"]}
     # DESIGN-DERIVED, NOT CENSUS-OBSERVED, and that is the point (RF3/P9): every repeated call
     # in both repeat leads carried a CONSTANT query_id (30x elastic.sshd-auth-history, 35x
     # elastic.sshd-raw-events-window), so a predicate that wrongly includes `query_id` in the
     # key replays identically to the correct one. G5 supplies the shape the replay cannot
     # reach: pr815 l-015's seq 7/9, seq 1/28 and seq 26/33 are byte-identical requests under
     # DIFFERENT coined ids, 27 calls apart.

  - {id: repeat_trip_never_reaches_the_backend, kind: behavior, form: test,
     discharged_by: test_repeat_trip_never_reaches_the_backend,
     binds: ["repeat_trip", "interacts(query_tool->verbs_registry)"]}
     # M2: refused WITHOUT executing — the verb/adapter is never invoked for the refused call.

  - {id: repeat_trip_sits_after_grant_and_infra_breaker, kind: seam, form: test,
     discharged_by: test_repeat_trip_sits_after_grant_and_infra_breaker,
     binds: ["query_tool", "repeat_trip", "circuit_breaker",
             "interacts(query_tool->executed_queries)",
             "interacts(query_tool->denial_log)"]}
     # M2's placement, stated as its two observable consequences: a DENIED repeat still produces
     # its denial record and never an evidence row, and a repeat on an already-tripped system
     # still answers the infra breaker's down-message.
     # premises carried: test_repeat_trip_check_races_the_infra_breaker_tripping_on_the_same_two
     #   _calls (the key-flow ordering `_grant_check -> _tripped_message -> repeat check` is
     #   checked on every call regardless of what the repeat count would also conclude).

  # =========================================================================
  # O4 — the trip is recorded (M4)
  # =========================================================================

  - {id: repeat_trip_row_is_agent_fixable, kind: behavior, form: test,
     discharged_by: test_repeat_trip_row_is_agent_fixable,
     binds: ["interacts(query_tool->executed_queries)", "executed_queries.payload",
             "circuit_breaker.domain.distinguished[64]"]}
     # O4: the refused call appends a row with a non-zero exit and `error_class ==
     # "agent-fixable"` — not absent, not null. P5: today 37/37 (0807-b) and 36/37 (0807) rows
     # carry `error_class: null`, so to every existing guard all 37 repeats are successful
     # queries. Exit code = `USAGE_EXIT_CODE` (64) per fork F-O (non-material, auto): it is the
     # code the tool already uses for a call that never executed, it yields "agent-fixable" for
     # free, and it leaves `record_outcome` a no-op (G12, executed).
     # rejected (recorded on the test):
     #   - N5 — whether the offline pitfalls curator consumes the row is out of scope (#823);
     #     O4 stops at "the trip is recorded".

  - {id: repeat_trip_leaves_the_infra_breaker_untouched, kind: negative, form: test,
     discharged_by: test_repeat_trip_leaves_the_infra_breaker_untouched,
     binds: ["interacts(query_tool->circuit_breaker)", "circuit_breaker",
             "circuit_breaker.domain.distinguished[2]"]}
     # RF3/RF4/G12: a repeat is an AGENT dead end, not an unreachable system. The trip must not
     # increment `circuit_breaker.json` and must not mark the system DOWN for the rest of the
     # run. Positive control (same test or its sibling): an exit-2 adapter fault DOES write
     # breaker state — executed: exit 2 -> {"systems": {"elastic": {"failures": 1}}}, twice ->
     # `is_tripped` True; exit 64 twice -> no state file at all.
     # premise NOW DRIVEN HERE (its disposition is F-O, auto — counted there, not here):
     #   test_prior_unrelated_infra_trip_state_is_untouched_by_a_later_repeat_trip. It was prose
     #   only until §7 round 2 — both scenarios started from a FRESH `circuit_breaker.json`, so
     #   the docstring's "an earlier, unrelated infra trip's state is untouched too" claimed
     #   more than the assertions checked. The test now drives a THIRD scenario from a run whose
     #   breaker document two real exit-2 outcomes on `cmdb` already wrote through the
     #   production `record_outcome` (PER_SYSTEM_FAIL_LIMIT = 2, so cmdb is DOWN before the
     #   lead's first call), and asserts that trip survives the repeat trip: `is_tripped(cmdb)`
     #   still True, failures still 2, the `tripped_at` stamp still there, `total_failures`
     #   still 2, and no `elastic` entry created.

  - {id: trip_row_conforms_to_the_frozen_row_contract, kind: shape, form: test,
     discharged_by: test_trip_row_conforms_to_the_frozen_row_contract,
     binds: ["interacts(query_tool->executed_queries).payload", "executed_queries.payload"]}
     # brief F6/G10: `e2e/test_query_tool_611.py::test_row_contract_frozen` asserts `set(row) ==
     # ROW_KEYS`. The trip row carries the same twelve keys — no thirteenth key, no amendment.
     # premises carried: test_frozen_row_shape_readers_see_the_trip_row.
     # RESOLVED (F-I, §7 human, option 2): the row DOES say a trip was a repeat, in the
     # existing `payload_digest` detail (P-b2: a real field with 160 characters of room), so
     # there is still no thirteenth key. This demand keeps pinning the KEY SET only; the detail
     # text is `trip_row_detail_names_the_repetition`'s.

  - {id: trip_row_is_distinguishable_from_a_finished_leads_rows, kind: behavior, form: test,
     discharged_by: test_trip_row_is_distinguishable_from_a_finished_leads_rows,
     binds: ["executed_queries.payload", "circuit_breaker.domain.distinguished[0]",
             "interacts(query_tool->executed_queries)"]}
     # O4's contrast, and what P5 shows is absent today: the stopped lead's record carries a
     # non-zero exit and a non-null `error_class`; a finished lead's rows are all exit 0 with
     # `error_class` null and no breaker state (C1/G12, executed).
     # premises carried: test_stopped_lead_beside_a_lead_that_finished.

  # =========================================================================
  # O2 — the escape hatch main can act on (M3)
  # =========================================================================

  - {id: dead_end_message_names_repeat_and_structural_cause, kind: behavior, form: test,
     discharged_by: test_dead_end_message_names_repeat_and_structural_cause,
     binds: ["interacts(gather_dispatch->model_context).payload", "GatherDeadEnd",
             "model_context.payload"]}
     # The string main receives names the repeated request (system/verb and the earlier seq it
     # repeats) and states the cause is STRUCTURAL, not a transient to retry through.
     # ORACLE LIMIT carried from the doc, verbatim in intent: a test can assert the message's
     # content and that `_run_gather` returns it — NOT that main does something better with it.
     # Do not write a test that pretends to observe main's improved re-dispatch.
     # RESOLVED (F-H, §7 human, 1a + 1b + 1c). Each sub-decision is its own demand so the two
     # deliberate WIDENINGS stay visible as such rather than hiding inside this one:
     #   (a) name system/verb and the earlier seq; do NOT echo the model-authored `params`
     #       -> `dead_end_message_does_not_echo_model_authored_params` (negative);
     #   (b) name the EARLIEST matching row's seq
     #       -> `dead_end_message_names_the_earliest_matching_seq`;
     #   (c) state how many queries the lead executed before the stop — BEYOND O2's literal
     #       oracle, taken deliberately -> `dead_end_message_states_the_leads_executed_query_count`.
     # `params` is not echoed, so R6's params-echo finding (residue #12) closes by omission and
     # no hostile-value demand at this render site is required.

  - {id: dead_end_is_contained_to_the_lead, kind: behavior, form: test,
     discharged_by: test_dead_end_is_contained_to_the_lead,
     binds: ["gather_dispatch", "run_investigation", "GatherDeadEnd",
             "drives(run_investigation->gather_dispatch)",
             "drives(budget_enforcer->query_tool)"]}
     # RF2/P1/P2/P-c: `GatherDeadEnd` must NOT unwind the run the way `RunAborted` does. Main
     # receives the string as the gather tool's result and keeps going; sibling leads are
     # unaffected. P-c settles the load-bearing mechanism: the exception arrives at
     # `_run_gather` AS ITSELF, never wrapped in an `ExceptionGroup` (pydantic-ai's
     # `_call_tools` uses create_task + asyncio.wait, not a TaskGroup), so `except
     # GatherDeadEnd` hits — and the paired control shows the alternative costs the whole run.
     # premises carried: test_dead_end_survives_the_budget_enforcement_capability (settled 2/2
     #   after the judge discounted a hedge P1 had already refuted: the exception crosses the
     #   budget capability's `tool_execute` wrapper unaltered and the wrapper's post-await
     #   accounting does not run for the refused call).
     # SCOPE (F-M option 1, collapsed by P-c): assert LEAD-LEVEL containment only. The
     # in-flight sibling's fate stays unpinned — see handoff.deviations for what that costs.

  # =========================================================================
  # THE PREDICATE'S OWN CONTRACT — minted here from phase C's settled dispositions
  # (every one of these carries premises that reached consensus and would otherwise be lost
  # between an answered premise and a demand — rules.md, "Premise-disposition conservation").
  # =========================================================================

  - {id: repeat_key_normalizes_param_key_order, kind: behavior, form: test,
     discharged_by: test_repeat_key_normalizes_param_key_order,
     binds: ["repeat_trip.identity", "request_key.identity"]}
     # `json.dumps(sort_keys=True)` normalises key order away at EVERY nesting level, so two
     # calls whose params differ only in key order are ONE request and the second is an
     # occurrence of the first (G8/P7).
     # premises carried: test_key_order_variation_in_params,
     #   test_nested_structure_key_order_variation, test_two_calls_the_lead_varied_and_the_key
     #   _did_not (the non-lossy half; its two LOSSY collapses are F-A's coerced identity and
     #   F-B's live-vs-stored form, both open).

  - {id: repeat_key_separates_requests_that_differ_by_a_byte, kind: behavior, form: test,
     discharged_by: test_repeat_key_separates_requests_that_differ_by_a_byte,
     binds: ["repeat_trip.identity", "request_key.identity"]}
     # The canonicalizer is STRUCTURAL and carries no per-verb, locale or numeric knowledge:
     # no case folding, no Unicode normalization, no int/float folding, no per-verb defaults.
