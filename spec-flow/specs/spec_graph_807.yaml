gate:
  # Written by phase D's GATE LEAF (not the assembler). `spec-graph gate --residue` computed 14
  # mechanical firings (R1 x4, R2 x1, R3 x2, R4 x2, R7 x5) plus R0's mechanical half (dangling
  # binds, unregistered axes, undefined edge endpoints) formally clean. R0's bidirectional prose
  # walk, R5's tightening extension, and R6's chooser/sanitizer walk are judgment, not
  # tool-derived, and are recorded here. Every rule has an entry below — a rule with no entry
  # reads as skipped, not clean.

  evaluated:
    - {rule: R0, fired: true}
      # Mechanical half: clean (the tool's own report). Judgment half — bidirectional walk
      # against gh#807, beetroot-salad's "Discussion outcome" comment (scope: ask (1) only; N1-N5
