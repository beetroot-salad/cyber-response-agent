     # `repeat_guard_never_fires_above_its_own_placement`.
     # NOT DISCHARGED BY REPLAY: the fitted corpus contains zero failing-repeat groups.
     # premises carried: test_lead_that_repeats_a_request_that_kept_failing.

  # =========================================================================
  # NON-OBLIGATIONS AND RECORDED DOWNGRADES — kept visible as demands.
  # `form: clause` is a DELIBERATE deferral to prose and `form: waiver` is a HUMAN'S EXAMINED
  # NO minted at §7: neither pre-discharges any rule.
  # =========================================================================

  - id: schema_rejected_repeat_loops_are_not_this_guards_business
    kind: negative
    form: clause
    binds: ["wrap_tool_validate", "interacts(wrap_tool_validate->executed_queries)"]
    outcome: {nl: "A repeat loop the tool's ARGUMENT SCHEMA turns back never reaches this
      guard's placement and is deliberately not its business: it is already bounded by
      DEFAULT_TOOL_RETRIES = 10 (driver.py:74), whose exhaustion raises UnexpectedModelBehavior,
      is caught at tools_gather.py:307, and returns the same 'Treat this lead as incomplete'
      idiom demand #0 pins — but with none of O2's repeat naming and no O4 trip row. That
      second terminator is named here rather than left to be discovered."}
    rejected:
      - {nl: "a companion guard at wrap_tool_validate covering both classes — it needs a second
          placement and a second identity extraction over raw arguments (F-A's problem,
          deliberately), and it is scope beyond ask (1). FILED, not left to 'if wanted': it is
          item (4) of the single follow-up issue collected in handoff.deferred (§7 round 2's
          answer to F7), stated there with its defect, its location and its evidence."}
    cites: [P-a]
    # F-E, §7 human, option 1's second half. A clause, not a test: the executable form would
    # assert the absence of a mechanism, and the observable half of F-E's answer is
    # `screen_refused_repeats_count_toward_the_trip`.

  - id: repeat_threshold_is_a_floor_not_an_exact_cap
    kind: negative
    form: clause
    binds: ["repeat_threshold.domain", "drives(gather_dispatch->query_tool)"]
    outcome: {nl: "N is a FLOOR, not an exact per-lead cap: the guard's read sits before
      handler(args) and outside _seq_lock, so two identical siblings in one gather turn can
      both read the same prior count and both proceed. The overshoot is bounded by the number
      of same-key siblings in one turn (zero in the fitted corpus). This spec therefore asserts
      an exact trip seq ONLY on replay; a live concurrent test may assert that the lead is
      stopped and never 'exactly three rows'. It is a named extension of the doc's own 'Where
      the oracle can be wrong': a live run's trip point can legitimately differ from its own
      table's serial replay."}
    rejected:
      - {nl: "making N exact — it requires RESERVING the occurrence at read time, either by
          writing the row before the handler (two rows per counted call) or by holding
          in-process state, which contradicts the design's one deliberate choice, 'the count is
          derived, not accumulated'. Holding _seq_lock across the read does not achieve it."}
    cites: [G13, P-c]
    # F-F, §7 auto, option 1. A clause because the executable half is
    # `concurrent_identical_siblings_still_stop_the_lead`; what is recorded here is the
    # CONSTRAINT ON ASSERTIONS, which no test can carry.

  - id: repeats_that_leave_no_row_are_out_of_scope
    kind: negative
    form: waiver
    binds: ["interacts(query_tool->denial_log)", "interacts(query_tool->circuit_breaker)"]
    outcome: {nl: "Two paths answer a call ABOVE the guard's placement and write no row at all
      — _grant_check's DENIED branch (which logs to the denial stream) and _tripped_message
      (the infra breaker's down-message) — so a lead can re-issue one request for its whole
      remaining budget and a table-derived count never sees a single occurrence. O1's words
      cover that SPEND; M1's mechanism cannot reach it. Recorded as an examined non-obligation
      rather than closed: both paths already answer the model with a specific 'no' before the
      backend call, so the expensive part of the pathology — the backend call, the payload
      write, the ~31k-token context replay per turn — is already absent. The residue is real: a
      lead can still burn its full turn budget on a denied or down-system repeat."}
    rejected:
      - {nl: "counting refusals that leave no row — it needs a second counting surface (the
          denial log, or in-process state), which contradicts 'the count is derived … no new
          persisted state', makes the replay oracle need a second table, and changes the data
          model."}
    cites: [P-f]
    # F-J(i), §7 human, option 1. `form: waiver` and not `clause` on the human's own
    # instruction: this is an examined NO, not a deferral to prose.
    # The OBSERVABLE half of the same placement — a denied repeat still produces its denial
    # record and never an evidence row — is asserted by
    # `repeat_trip_sits_after_grant_and_infra_breaker`, so the waiver waives the COUNTING, not
    # the placement.
    # SCOPE: this waiver reaches only paths that write NO ROW AT ALL. The above-M2 paths that
    # DO write one are the sibling waiver below.

  - id: unresolvable_verb_repeat_loops_are_out_of_scope
    kind: negative
    form: waiver
    binds: ["repeat_trip", "interacts(query_tool->executed_queries)"]
    outcome: {nl: "A lead that re-issues one UNRESOLVABLE call — an undeclared verb, a
      near-miss verb name, or a system whose adapter cannot be imported — is not stopped by
      this guard, however many times it repeats. Both shapes are answered by _grant_check
      ABOVE M2 (query_tool.py:219-226 and :238-244), so the call never reaches the guard, and
      round 2 of the seam puts the rows they DO write outside the counted domain, so a replay
      cannot report the trip either. This is the third refusal class beside F-E's two: the
      screen-refusal class the guard owns, the argument-schema class DEFAULT_TOOL_RETRIES = 10
      already bounds, and this one, which is bounded by nothing narrower than
      GATHER_REQUEST_LIMIT = 40. The residue is real and is the most common exit-64 shape in
      the fitted corpus: a lead can spend its whole remaining request budget coining verb names
      that do not resolve, and O1's words cover that spend while M1's mechanism cannot reach
      it. Recorded as an examined non-obligation rather than closed, because closing it means
      counting rows the guard cannot refuse — which breaks live/replay agreement in exactly the
      direction trip_row_is_itself_an_occurrence_on_replay forbids."}
    rejected:
      - {nl: "counting _grant_check's rows anyway (the round-1 wording's literal reading) — the
          guard can refuse none of them, so a replay of a recorded table would report trips no
          live run could produce, and O1/O3's only oracle would overstate what it proves."}
      - {nl: "a second guard placement above _grant_check covering the unresolvable class — a
          second identity extraction over raw arguments (F-A's problem, deliberately) at a
          third placement, and scope beyond ask (1). It is the same shape as F-E's rejected
          companion guard at wrap_tool_validate and goes to the same follow-up issue."}
    cites: [P-a, P-b2]
    # F-A round 2, §7 human, option 1 — the human's instruction was that this residue "must
    # appear in the spec as a `form: waiver` demand, not as silence", the same instruction F-J
    # was answered under, so it is minted here beside F-J's two rather than left in prose.
    # Its own premise, `test_lead_that_spends_its_turns_on_calls_the_tool_never_accepts` (F-E),
    # was carried in no demand before this one; it lands here.
    # EVIDENCE: P-a shows the twelve keys cannot tell an above-M2 row from a counted one, so
    # the exclusion needs the same sentinel and the residue cannot be closed by inspection;
    # P-b2 read all six real exit-64 rows in pr815-rerun-0808 and four of them are exactly this
    # `unresolvable:` shape — including seq 20, which brief F10 cited as a `_screen` witness
    # for F-E's class and which in fact belongs to this one.

  - id: cap_and_sort_unchanged
    kind: negative
    form: clause
    binds: ["elastic_query_cap", "elastic_sort_order"]
    outcome: {nl: "This change does not lift the 20-doc cap on verb=query, adds no from/offset
      or pagination parameter, and does not touch the hardcoded @timestamp-descending sort in
      elastic_adapter.py — pagination would turn 142 docs into 8 sanctioned calls and a
      10,000-doc match into 500, which is the download-and-reduce loop gather exists to avoid."}
    rejected:
      - {nl: "N3's own caveat: the real defect on that axis is the hardcoded desc sort, which is
          a separate change and stays out of this spec. It is item (2) of the single follow-up
          issue collected in handoff.deferred (§7 round 2's answer to F7) — no longer a
          'separate change' with no address."}
    # Downgrade recorded: the executable form would be an absence-of-parameter assertion over
    # the elastic adapter's signature — a lint-shaped test with no bearing on the guard.

  - id: gather_reasoning_effort_untouched
    kind: negative
    form: clause
    binds: ["gather_effort"]
    outcome: {nl: "DEFENDER_GATHER_REASONING_EFFORT is not changed by this issue: gather_effort
      stays \"none\", and raising it remains an experiment (ask 4) rather than a change."}
    # Downgrade recorded: pinning a constant's value as a test is a change-detector, not a
    # contract.

  - id: pitfalls_curator_untouched
    kind: negative
    form: clause
    binds: ["collect_general_failures"]
    outcome: {nl: "The pitfalls curator's input is not widened here: learning/leads/
      lead_extraction.py and its established-template partition are unchanged, and the offline
      consumption of the trip row belongs to #823."}
    rejected:
      - {nl: "the issue's claim that lead_extraction.py:102 is a hole — refuted by C8: it is the
          partition boundary between three disjoint paths, pinned by two existing tests;
          removing it would double-route, not unblind."}

  - id: gather_session_terminator_unchanged
    kind: negative
    form: clause
    binds: ["session_store"]
    outcome: {nl: "A lead stopped by the guard leaves the gather session store exactly as its
      three sibling terminal branches do: no set_truncated_by stamp, so the gather session ends
      on an unanswered tool call with truncated_by unset — identical to UsageLimitExceeded
      today. Closing that gap for all four terminators is a real improvement and a separate
      issue; it would bind the session store under an issue scoped to ask (1). That issue is
      item (1) of the single follow-up collected in handoff.deferred (§7 round 2's answer to
      F7)."}
    cites: [G15]
    # F-N (non-material, auto). Recorded as a clause rather than a test on purpose: asserting
    # the absence of a stamp nobody writes is a change-detector, and the gap is pre-existing
    # and identical for all three shipped exits.

  - id: run_level_repetition_is_out_of_scope
    kind: negative
    form: waiver
    binds: ["repeat_trip.identity", "executed_queries.identity"]
    outcome: {nl: "The guard is lead-scoped by O1's own words, so run-level repetition survives
      it untouched: after l-001 is stopped, main re-dispatches the same question as l-003 and
      then l-004, each starting at zero occurrences and paying its own full N. The cost
      signature the issue was filed on — one question across three leads, 55% of the run's 2.28M
      cache-read tokens — is therefore NOT addressed by this change, and the only lever aimed at
      it is O2, which the doc itself concedes no test can observe."}
    cites: [C5]
    # RF-J1, written down and RATIFIED at §7 as an examined non-obligation — form upgraded from
    # `clause` to `waiver` on the human's own instruction ("it must appear in the spec as a
    # `form: waiver` demand, not as silence"). The judge's finding was that this is a legitimate
    # scope decision nobody had stated: unlike N1-N5 it appears nowhere in the doc, and every
    # reader treated it as settled rather than as a stated non-obligation. It is the issue's
    # HEADLINE COST, and it ships uncovered on purpose.

  - id: in_flight_sibling_evidence_loss_is_out_of_scope
    kind: negative
    form: waiver
    binds: ["GatherDeadEnd", "interacts(query_tool->executed_queries)",
            "interacts(query_tool->gather_raw)"]
    outcome: {nl: "When a dead end unwinds the lead, a SIBLING query already in flight in the
      same gather turn loses its evidence: its verb body runs to completion in its
      asyncio.to_thread worker — a real request against a real system of record — while the
      awaiting coroutine is cancelled, so _record never runs and the call leaves NO row in
      executed_queries and NO sidecar under gather_raw. Its payload never reaches the model
      either, so nothing is orphaned; what is lost is the record that the request happened at
      all. This spec does not close it. Closing it means either completing the sibling's write
      after cancellation (a shutdown path this change does not own) or serialising the turn's
      calls (contradicting the corrected concurrent multiplicity and G13's pinned scenario).
      Stated cost: O4's own premise — the run record shows what the lead did — acquires a hole
      on exactly the path this change makes routine, and a reader of the queries table cannot
      distinguish 'the sibling never ran' from 'the sibling ran and its record was lost'."}
    rejected:
      - {nl: "widening dead_end_is_contained_to_the_lead to pin the in-flight sibling's fate —
          F-M was collapsed to option 1 by P-c on the wrapping question and its scope was set
          to LEAD-LEVEL containment only; re-opening it here would decide by drift what the
          seam decided by answer."}
    cites: [P-c2]
    # F3 of phase F's reconciliation, §7 round 2, option 1 — the THIRD non-obligation, minted
    # on the same instruction F-J's two carry ("it must appear in the spec as a `form: waiver`
    # demand, not as silence"). MOVED OUT OF `handoff.deviations`: P-c2 landed after F-M had
    # already collapsed, so the loss was recorded as a deviation and never put in front of the
    # human — while structurally it is F-J(i)'s own shape, a path on which this change makes a
    # lead's evidence vanish. Pre-existing for any raiser at that layer (BudgetKill,
    # RunAborted); GatherDeadEnd makes it COMMON rather than exceptional, which is what makes
    # it worth stating. The deviations entry stays as the observation record and now points
    # here for the decision.

  - id: queries_table_is_not_model_writable_via_fs
    kind: parity
    form: waiver
    binds: ["executed_queries.access[fs]"]
    outcome: {nl: "The guard derives its state from a file inside the box's read-write run-dir
      bind, but the gather role cannot write it through the write-file tool surface: the role's
      write_allow is the empty tuple (GATHER_DEF.tools.write is False), so decide_write denies
      with 'writes are limited to this agent's declared paths'. The guard therefore adds a new
      consequence to an existing trust boundary, not a new trust boundary — the same file
      _next_seq and repeat_note already derive from. No executable parity test is written here:
      driving the permission compiler is spec_graph_632's subject, and a test at this address
      would exercise that spec's contract rather than this guard's."}
    cites: [P-f, G16]
    # F-L (collapsed to non-material by P-f, option 1) + gate residue #6, WAIVED at §7 citing
    # P-f's executed break-attempt. R3 discharges PER CELL, so the bash cell below is its own
    # entry rather than being covered by a blanket facet-wide waiver.

  - id: queries_table_is_not_model_writable_via_bash
    kind: parity
    form: waiver
    binds: ["executed_queries.access[bash]"]
    outcome: {nl: "Gather's bash surface cannot write the queries table either, and denies twice
      over: none of the ten granted programs is a writer, and independently
      bash_exec._PipelineBuilder.feed_token raises BashExecError('unexpected operator token in
      validated command: >>') on any > or >> before grant matching is even reached. `cat` on
      the same path is allowed, for contrast — the surface is a reader. Stated residual cost:
      the guard fails OPEN on an unreadable table, so tampering that did get through would be
      silent."}
    cites: [P-f, G16]
    # F-L + gate residue #7, WAIVED at §7 on the same rationale as the `fs` cell, recorded
    # separately because R3 is bound at <boundary>.access[<via>] and discharge is per-cell.

structure:

  # `query_id` is registered although no key_axes member uses it — it is the axis the guard's
  # key deliberately EXCLUDES (G5/RF3), and naming it is how that exclusion stays visible.
  axes: [lead_id, seq, system, verb, params, query_id]

  actors:
    - {id: query_tool,        frame: leg,         provenance: code}   # QueryCapture.wrap_tool_execute (query_tool.py:268)
    - {id: wrap_tool_validate, frame: leg,        provenance: code}   # query_tool.py:193 — the FIFTH _record site (:201), raw pre-validation identity (F-A)
    - {id: gather_dispatch,   frame: leg,         provenance: code}   # tools_gather.py::_run_gather (:256-328)
    - {id: run_investigation, frame: composition, provenance: code}   # driver.py::run_investigation — fans leads
    - {id: budget_enforcer,   frame: leg,         provenance: code}   # hooks/budget_enforcer.py — the capability that wraps every tool call
    - {id: record_query,      frame: leg,         provenance: code}   # scripts/gather_tools/record_query.py — _next_seq, repeat_note, _request_key
    - {id: lead_repository,   frame: leg,         provenance: code}   # learning/lead_repository.py — load_queries/joined/stage_tables
    - {id: lead_extraction,   frame: leg,         provenance: code}   # learning/leads/lead_extraction.py — extract_from_joined/collect_general_failures
    - {id: visualize_run,     frame: leg,         provenance: code}   # scripts/visualize/visualize_run.py:435 — the render lane
    - {id: judge_compare,     frame: leg,         provenance: code}   # learning/pipeline/judge/compare.py::_payload_paths
    - {id: closed_ticket_tool, frame: leg,        provenance: code}   # learning/pipeline/judge/closed_ticket_tool.py::_capture_and_view

  boundaries:

    # ---- SR1: the queries table, the guard's only data source and its new sink ----
    - id: executed_queries
      provenance: code
      facets:
        identity:
          key_axes: [lead_id, seq]
          evidence: {nl: "Row key read off the resource, not the implementation: every row
            carries `lead_id` and `seq`; `_next_seq` (record_query.py:242) counts this lead's
            rows to allocate the next seq, and `lead_repository.load_queries` joins on
            (lead_id, seq). Path template `{run_dir}/executed_queries.jsonl`, one file per run,
            no interpolated axes — `RunPaths.executed_queries` (_run_paths.py:40-41) is the sole
            path constructor."}
          sharing: serialized-append
        payload:
          # The twelve frozen keys (G10), in the order `_record` builds them (query_tool.py:
          # 331-347). `test_row_contract_frozen` asserts `set(row) == ROW_KEYS`.
          parts:
            - {role: lead_id,        source: deps.lead_id}
            - {role: seq,            source: record_query._next_seq}
            - {role: system,         source: args.system}
            - {role: verb,           source: args.verb}
            - {role: query_id,       source: query_tool.resolve_query_id}
            - {role: params,         source: query_tool._json_safe_params}
            - {role: raw_command,    source: query_tool._raw_command}
            - {role: payload_path,   source: query_tool._persist_payload}
            - {role: exit_code,      source: const:USAGE_EXIT_CODE}
            - {role: error_class,    source: circuit_breaker.error_class_for_exit}
            - {role: payload_status, source: query_tool._payload_status}
            - {role: payload_digest, source: template:EXIT_DETAIL}
          invariants: [all-slots-bound]
          nl: "One JSON row per query call — the run's evidence table and the learning loop's
            input. For the trip row every slot is filled by the existing `_record` path: exit 64
            (F-O), `error_class` 'agent-fixable', `payload_status` 'error' (a valid enum member,
            so lead_extraction cannot raise LeadAuthorError), `payload_digest`
            f\"exit=64; {detail[:160]}\" (P-b2). Whether the detail must NAME the repetition is
            fork F-I."
        access:
          constraints_by_via:
            fs:
              trust: operator
              constraints: [guarded-write, append-only, lint-gated]
            bash:
              trust: attacker-influenced
              constraints: [deny-write, read-only-viewers]
      # NOTE for the gate leaf: R2 fires here (two writers — `query_tool` and
      # `wrap_tool_validate` — over an identity-facet sink, one of them driven concurrently).
      # UNIQUENESS itself is safe by construction: BOTH writers reach the table through
      # `_record`, whose `_seq_lock` spans `_next_seq -> _persist_payload -> append` with no
      # await between them (P-c). The question R2's shape is really asking here is F-A's, and
      # it is NOT a uniqueness question: the two writers' rows are distinct at (lead_id, seq)
      # and COLLAPSE at (system, verb, canonical(params)) — see the derivations on
      # `repeat_trip.identity`.

    # ---- SR2: the payload sidecars ----
    - id: gather_raw
      provenance: code
      facets:
        identity:
          key_axes: [lead_id, seq]
          evidence: {nl: "Path template `gather_raw/{lead_id}/{seq}.json`, pinned by
            `_run_paths._PAYLOAD_SHAPES` (:65) as `gather_raw/l-[A-Za-z0-9]+/[0-9]+\\.json`;
            `contained_payload` returns None for anything else. Written by
            `query_tool._persist_payload` (:415-426) under the same `_seq_lock` as the row."}
          sharing: unique-key
      # For a non-zero exit `_record` sets text = "" and the sidecar is an EMPTY FILE, STILL
      # CREATED (P10, executed; six real exit-64 rows in pr815 all point at extant 0-byte
      # files). That is what keeps the row visible to `extract_from_joined`, which drops any row
      # whose payload file is missing BEFORE it reaches the error_class filter (RF4/G11).
      # OPEN (F-D, material): whether the trip routes through `_record` at all.

    # ---- SR3: the infra breaker ----
    - id: circuit_breaker
      provenance: code
      facets:
        domain:
          type: int
          refinement: {nl: "The exit code a queries-table row carries, as circuit_breaker
            partitions it: INFRA_EXIT_CODES = {2, 124} are counted toward PER_SYSTEM_FAIL_LIMIT
            = 2 (system DOWN) and RUN_FAIL_KILL_LIMIT = 5 (RunAborted); every other code makes
            record_outcome return {} and write nothing. 124 is 2's co-member and is not
            separately distinguished here — this change can reach 2 (the module's own
            DEFAULT_FAULT_EXIT, and RF3's danger) but never a timeout."}
          default: 2
          distinguished: [0, 2, 64]
          falsy_valid: true
          documented_alternatives: []
      # falsy_valid: exit 0 is falsy AND valid (a successful query, error_class null) — the
      # `exit_code or DEFAULT` swallow shape lives here.

    # ---- SR4: the gather session store ----
    - {id: session_store, provenance: code, facets: {}}
      # Facetless on purpose: this change writes no contract onto it. `set_truncated_by` has one
      # production call site, `driver._flush_run_end:620`, on the MAIN session (G15); no
      # gather-side terminator stamp exists for any of the three shipped exits, and
      # `gather_session_terminator_unchanged` records that the fourth inherits the same.

    # ---- the delta proper ----
    - id: GatherDeadEnd
      provenance: design
      facets:
        payload:
          parts:
            - {role: reason, source: template:REPEAT_REASON,
               slots: {repeated_request: repeat_trip.identity,
                       earlier_occurrence: executed_queries.identity}}
            - {role: escape, source: const:REPEAT_ESCAPE}
          invariants: [all-slots-bound]
          nl: "Why the lead stopped (which earlier request this one repeats, and that the result
            is structural rather than transient) and what to do instead. Transient, never
            persisted as an object — its rendering is what `_run_gather` returns and writes to
            gather_summaries."
      # WAS the artifact's only `unknown` and its own finding (RF-J3): `escape` was a BOUND SLOT
      # WITH NO CONTENT anywhere in the design, and the issue's one concrete escape — "name
      # verb=esql as the listing path" — is refuted by the doc's own corrected premises (C9:
      # reviewer-measure-0807's l-001 ran 37 esql calls, 30 sharing one digest), one of the two
      # recorded repeat leads being ON the escape path. CLOSED at §7 by F-G option 1: a single
      # fixed, system-agnostic sentence, identical on every trip, minted as the constant
      # `record_query.REPEAT_ESCAPE` so "identical on every trip" is a checkable contract rather
      # than a hope. `gather_dead_end_payload_binds_reason_and_escape` drives it.

    - id: repeat_trip
      provenance: design
      facets:
        identity:
          key_axes: [lead_id, system, verb, params]
          evidence: {nl: "M1 states the key verbatim; `record_query._request_key` (:184) already
            canonicalizes (system, verb, params) for the shipped repeat_note, and `lead_id` is
            the row filter both `_next_seq` and `repeat_note` already apply. Read off the
            resource: the four fields are four of the row's own twelve keys."}
          derivations:
            - {value: canonical_params, fn_of: params, injective: false}
            - {value: stored_params,    fn_of: params, injective: false}
          sharing: unique-key
        domain:
          type: dict
          refinement: {nl: "The parameter set a request carries. Two of the guard's open
            questions live in this domain: for 8 of GATHER_DEF's 28 granted (system, verb) pairs
            the declared parameter set is EMPTY (all 7 health-checks plus identity.list-roles,
            P-e), so `{}` is the only call and N=3 is a permanent two-call-per-lead cap for
            them (F-K); and `params` is a required schema field, so an OMITTED params is a
            validate-path rejection rather than an empty-params call (F-A)."}
          default: "{}"
          distinguished: ["{}"]
          falsy_valid: true
          documented_alternatives: []
      # THE TWO DERIVATIONS ARE THE FORK, in formal slots: `canonical_params` is
      # `_request_key`'s json.dumps(sort_keys=True, default=str) over the LIVE incoming value;
      # `stored_params` is `_json_safe_params(dict(params))` after a JSON round trip — the form
      # the table holds. Both are non-injective (different params, one key), and G7 probed them
      # DISAGREEING: live '["elastic","query",{"q": NaN, "w": 1}]' vs stored
      # '["elastic","query",{"q": "nan", "w": 1}]'. F-B decides which one the guard keys, and
      # every replay-based demand inherits the answer.

    - id: repeat_threshold
      provenance: design
      facets:
        domain:
          type: int
          refinement: {nl: "Occurrences of one request within one lead before the Nth is
            refused. A module constant fixed at 3, no env var and no per-system override (F-P):
            C11's sweep over 2..5 fixes the value with evidence, N=2 is PROVEN to refuse correct
            work, and `_env.env_int` raises FatalConfigError on a non-integer with no clamp for
            zero or negative — so a knob's main effect would be to let someone re-introduce a
            known defect."}
          default: 3
          distinguished: [3]
          falsy_valid: false
          documented_alternatives: []

    # ---- the neighborhood the change attaches to (grounded, no demand asked for most of it) ----
    - id: request_key
      provenance: code
      facets:
        identity:
          key_axes: [system, verb, params]
          evidence: {nl: "`_request_key(system, verb, params) = json.dumps([system, verb, params
            or {}], sort_keys=True, default=str)` at record_query.py:184-188, consumed by the
            shipped `repeat_note` (:191) for its same-request branch (G8/P7). The key names
            three fields and NOT query_id — which is why two calls with different coined ids are
            one request (G5)."}
          derivations:
            - {value: canonical_params, fn_of: params, injective: false}
          sharing: unique-key

    - id: gather_summaries
      provenance: code
      facets:
        identity:
          key_axes: [lead_id]
          evidence: {nl: "`{run_dir}/gather_summaries/{lead_id}.md`, one file per dispatched
            lead — written by `_run_gather`'s tail and by each of its three terminal except
            arms, which is the path demand #0's pin reuses."}
          sharing: unique-key

    - id: model_context
      provenance: code
      facets:
        payload:
          parts:
            - {role: terminal_idiom,  source: const:INCOMPLETE_LEAD_IDIOM}
            - {role: dead_end_detail, source: GatherDeadEnd.payload}
          invariants: [all-slots-bound]
          nl: "The single string `_run_gather` returns to main as the gather tool's result. Under
            F-C's pin it opens with the terminal idiom the three sibling branches already use —
            the only vocabulary any prompt in the corpus teaches main (SKILL.md:394, G19) — and
            then carries the dead end's reason and escape."
        access:
          constraints_by_via:
            api:
              trust: attacker-influenced
              constraints: [salt-wrap]
      # One via, so R3 stays quiet — the cell is here to LABEL the trust: everything gather
      # returns to main is `_wrap(…, "untrusted", deps.salt)`-wrapped, and F-H(a) is exactly the
      # question of whether a model-authored `params` fragment should ride that channel on a
      # refusal path.

    - id: gather_model_context
      provenance: code
      facets:
        payload:
          parts:
            - {role: truncated_view, source: query_tool.build_truncated_view}
            - {role: repeat_note,    source: record_query.repeat_note}
            - {role: returned_span,  source: record_query.returned_span}
          invariants: []
          nl: "What `_model_view` hands back to the GATHER model for a query call: the truncated
            payload view, plus ask (2)'s shipped repeat notice and span footer. `all-slots-bound`
            deliberately does NOT apply — `repeat_note` is conditional by design (it fires only
            on a second occurrence), and `_model_view` returns early for a non-zero exit ABOVE
            the repeat_note call."

    - {id: verbs_registry,  provenance: code, facets: {}}   # runtime/verbs.py::ModuleVerbRegistry — the backend the refused call must never reach
    - {id: declared_params, provenance: code, facets: {}}   # runtime/verbs.py::declared_params — what `_screen` validates against, and what P-e censused
    - {id: denial_log,      provenance: code, facets: {}}   # observe.py::denial_logger — where a DENIED call is recorded, with no evidence row
    - {id: judge_queries_table, provenance: code, facets: {}} # closed_ticket_tool.py::_QUERIES_TABLE — same file NAME, 7-key row, no lead_id (G17)
    - {id: learning_staging,    provenance: code, facets: {}} # lead_repository.stage_tables' destination — copies every row unfiltered
    - {id: elastic_query_cap,   provenance: code, facets: {}} # skills/elastic/execution.md:20 — N3's bind target
    - {id: elastic_sort_order,  provenance: code, facets: {}} # elastic_adapter.py:155 — N3's bind target
    - {id: gather_effort,       provenance: code, facets: {}} # runtime/providers — N4's bind target
    - {id: collect_general_failures, provenance: code, facets: {}} # lead_extraction.py:89 — N5's bind target

  interacts:

    # --- the delta: what the guard adds to an existing call path ---
    - {from: query_tool, to: executed_queries, mode: read, via: fs, provenance: design}
      # M1's count. RF2/P3 correct the doc: this is a THIRD read of the file per query call
      # (`_next_seq` reads it inside `_record`, AFTER the handler and under `_seq_lock`;
      # `repeat_note` reads it again in `_model_view`), and it is NOT under the lock — which is
      # what makes N a floor rather than a cap under concurrency (F-F).
    - {from: query_tool, to: executed_queries, mode: write, via: fs, provenance: design,
       sends: payload, interpolates: [lead_id, seq], transport: fs}
      # M4. The edge exists in code; the DESIGN modifies its semantics — a refusal path becomes
      # a writer, at a seam whose sibling `_tripped_message` deliberately writes nothing
      # (brief F3 — the brief's flagged fact, NOT the phase-A naming fork of the same id).
    - {from: query_tool, to: repeat_trip,      mode: invoke, via: api, provenance: design}
    - {from: query_tool, to: repeat_threshold, mode: read,   via: api, provenance: design}
    - {from: query_tool, to: request_key,      mode: read,   via: api, provenance: design}
      # The guard's key computation — the NEW reader of a source `repeat_note` already reads.
    - {from: query_tool, to: GatherDeadEnd,    mode: write,  via: api, provenance: design,
       sends: payload}
      # `raise GatherDeadEnd(reason, escape)` — constructing the payload IS the write.
    - {from: gather_dispatch, to: GatherDeadEnd, mode: read, via: api, provenance: design}
      # The except arm beside tools_gather.py:301.
    - {from: query_tool, to: gather_model_context, mode: write, via: api, provenance: design,
       sends: payload, transport: llm}
      # Modified by the delta: for a tripping call NOTHING is assembled here (P-c: the gather
      # FunctionModel served exactly one request in every raising shape).
    - {from: gather_dispatch, to: model_context, mode: write, via: api, provenance: design,
       sends: payload, transport: llm}

    # --- the co-writer the census found (F-A) ---
    - {from: wrap_tool_validate, to: executed_queries, mode: write, via: fs, provenance: code,
       sends: payload, interpolates: [lead_id, seq]}
      # The fifth `_record` site. It fires PRECISELY WHEN one of the identity fields is
      # unreadable, and builds the row's identity from the RAW pre-validation arguments: a bad
      # `query_id` records ["elastic","query",{"a":1}] — byte-identical to the corrected
      # retry's key; a non-dict `params` records ["elastic","query",{}]; an unparseable blob
      # records ["","",{}], a shared bucket every parse failure in the lead falls into. P-a
      # settles that NO structured discriminator exists among the twelve keys.

    # --- unmoved readers of the same source (R7's other side) ---
    - {from: record_query,    to: executed_queries, mode: read, via: fs,  provenance: code}
      # `_next_seq` (:242) and `repeat_note` (:191).
    - {from: record_query,    to: request_key,      mode: read, via: api, provenance: code}
      # `repeat_note`'s same-request branch — the SHIPPED reader of the key the guard is about
      # to become the second reader of (brief F12). R7's differential fires here on purpose.
    - {from: lead_repository, to: executed_queries, mode: read, via: fs,  provenance: code}
      # `load_queries` (:86-127) — THE read/join surface; feeds joined/actor_view/
      # first_rendered_payload, and `stage_tables` copies the whole file into the learning
      # staging dir.
    - {from: lead_extraction, to: executed_queries, mode: read, via: api, provenance: code}
      # via `joined()`: `extract_from_joined` (:52-84) skips any row with no on-disk payload and
      # raises LeadAuthorError on an unrecognised payload_status; `collect_general_failures`
      # (:87-124) takes the error_class == "agent-fixable" residue — the trip row's audience.
    - {from: visualize_run,   to: executed_queries, mode: read, via: api, provenance: code}
      # visualize_run.py:435 — the render lane.
    - {from: lead_repository, to: learning_staging, mode: write, via: fs, provenance: code}
    - {from: closed_ticket_tool, to: judge_queries_table, mode: write, via: fs, provenance: code}

    # --- the sidecars and the rest of the existing path ---
    - {from: query_tool,      to: gather_raw, mode: write, via: fs, provenance: code,
       interpolates: [lead_id, seq]}
    - {from: lead_extraction, to: gather_raw, mode: read,  via: fs, provenance: code}
    - {from: judge_compare,   to: gather_raw, mode: read,  via: fs, provenance: code}
    - {from: query_tool,      to: circuit_breaker, mode: write, via: fs, provenance: code}
      # `record_outcome` at `_record`'s tail (:350), called unconditionally — and a no-op for
      # every exit outside {2, 124} (C1/G12, executed).
    - {from: query_tool,      to: circuit_breaker, mode: read, via: fs, provenance: code}
      # `_tripped_message` (:286) — the check the guard sits directly beneath.
    - {from: gather_dispatch, to: circuit_breaker, mode: read, via: fs, provenance: code}
      # tools_gather.py:272 — the pre-dispatch check that returns a down_message with no subagent.
    - {from: query_tool,      to: verbs_registry,  mode: invoke, via: api, provenance: code}
    - {from: query_tool,      to: declared_params, mode: read,   via: api, provenance: code}
    - {from: query_tool,      to: denial_log,      mode: write,  via: fs,  provenance: code}
    - {from: gather_dispatch, to: gather_summaries, mode: write, via: fs, provenance: code,
       interpolates: [lead_id]}
    - {from: gather_dispatch, to: session_store,    mode: write, via: api, provenance: code}
      # `driver._make_gather_recorder` -> `selection.ingest`, the ProcessHistory hook.

  drives:
    - {from: run_investigation, to: gather_dispatch,    provenance: code, multiplicity: concurrent}
    - {from: gather_dispatch,   to: query_tool,         provenance: code, multiplicity: concurrent}
      # CORRECTED from 20-demands' `serial`. Two query calls in one gather turn are a pinned
      # existing scenario (G13) and pydantic-ai's `_agent_graph._call_tools` drives them with
      # `asyncio.create_task` + `asyncio.wait` (P-c, executed). F-F reads this slot.
    - {from: gather_dispatch,   to: wrap_tool_validate, provenance: code, multiplicity: concurrent}
    - {from: budget_enforcer,   to: query_tool,         provenance: code, multiplicity: serial}
      # The capability chain: driver._budget -> combined.wrapped -> abstract.wrap_tool_execute ->
      # combined.wrapped -> query_tool.wrap_tool_execute (P-c's 137-frame walk).

claims:

  # ============================ inherited from the design doc ============================
  # Ids kept. C6, C7 and C14-shaped sentences were RETYPED where the sentence predicts runtime
  # behavior over an input: rules.md's instrument table trusts a kind the author declares, so a
  # behavior claim filed as `referential` closes on a read that cannot falsify it. Each retype
  # names the executed observation it now closes on.

  - id: C1
    source: discuss
    kind: behavior
    claim: circuit_breaker only counts infra exits, so a successful query is invisible to it
    probe: "record_outcome(tmp, 'elastic', code) on a fresh run dir for code in {0,1,2,64,124};
      error_class_for_exit on each"
    probe_kind: executed
    observed: "re-executed on this base — exit 0 -> {} and no state file, error_class None;
      exit 1 -> {} , 'agent-fixable'; exit 2 -> {'systems': {'elastic': {'failures': 1}}},
      state file written, 'infra'; exit 64 -> {}, 'agent-fixable'; exit 124 -> state written,
      'infra'. INFRA_EXIT_CODES = frozenset({2, 124})."
    verdict: holds

  - id: C2
    source: discuss
    kind: behavior
    claim: request-identity at N=3 trips on the two repeat leads and on nothing in the drift run
    probe: "independent replay of all three executed_queries.jsonl through the code's own
      record_query._request_key, counting per (lead_id, key), first trip terminates the lead"
    probe_kind: executed
    observed: "0807-b: 70 rows, 9 leads -> 1 trip (l-001 seq 4); 0807: 65 rows, 7 leads -> 1 trip
      (l-001 seq 9); pr815: 131 rows, 15 leads -> 0 trips. Row counts and trip seqs match the
      doc exactly."
    verdict: holds

  - id: C3
    source: discuss
    kind: behavior
