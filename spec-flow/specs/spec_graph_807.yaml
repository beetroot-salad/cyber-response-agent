       ORCHESTRATOR'S, not this phase's, and none of the four is an obligation of this spec.
       (1) NO GATHER-SIDE SESSION TERMINATOR STAMP. Defect: a gather session terminated
       mid-tool-call ends on an unanswered tool call with `truncated_by` unset, so no reader of
       the session store can tell a lead that was cut off from one that finished — and
       `GatherDeadEnd` makes a fourth terminator with the same gap. Where: the terminal except
       arms of `runtime/tools_gather.py::_run_gather` (:301 UsageLimitExceeded, :307
       UnexpectedModelBehavior, :313 session_store.StoreError) against
       `runtime/session_store.py::StoreHandle.set_truncated_by`. Evidence: claim G15 (search,
