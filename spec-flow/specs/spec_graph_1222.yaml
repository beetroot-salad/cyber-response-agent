handoff:
  principles:
  - 'docs/principles.md (profile conventions.principles) — 1: the box and everything it can write is attacker-influenced;
    2: fail closed, refuse before anything is created, no silent degraded mode; 3: no per-case tolerance, no compatibility
    shims, no guard no obligation calls for.'
  - 'Design decisions D1-D6 (user, 2026-10-07). D6: tests guard behaviour, never absence — no demand asserts that
    removed code, symbols, fields or files are gone (m1_item1_deleted carries the rejected reading).'
  - '#1085: lessons are strictly per tenant. Sequencing (C24, human): #1222''s implementation lands after #1108
    P4 (lessons under the tenant); #1222 adds no lessons-scoping code; p081 guards the result.'
  - 'N13: runs (and episodes) recorded before the change need not load anywhere; recognising old shapes, even to
    refuse them, is compatibility work (X03, X04). A8''s ''a folder without a record is not a run'' is a rule about
    a missing record, not about old runs.'
  - 'Principles override, recorded (RF-J1): D2 lifts principle 2 for exactly the correlation lead''s own endings
    as A2 lists them (withheld; dispatch raised, a provider refusal included; claim collided or failed to write,
    its declaration included; a store fault that keeps the lead from starting — writing its claim or declaration,
    or opening its session; no usable summary — request limit, tripped breaker, empty output, every call failed,
    timed out). Everything else — the run''s own input, its settings, its stores, any other kill — stays fail-closed.'
  - Amendments A1-A8 (.spec-flow/design-amendments.md) win over design.md wherever they differ; the smaller rulings
    there (C01 default fake, C09 anchor, C20 model-only channel, C28 unsigned lessons, C16 path walk, C43 character
    set, C27 key form, C42 unquoted lessons, C48 unsandboxed runs, C45 top-level source only, C46 three more entry
    points, C38 no-call summary, C55 run-relative pointer) are applied as worded.
  - '§7 rulings: T1-T8 adopted; X01-X25 and Y01-Y19 dropped as `rejected:` non-obligations, each attached to the
    demand(s) whose reading it rejects.'
  tensions:
  - 'T1 (adopted -> A1): the alert is settled once at run start — admitted only as a UTF-8 JSON object, facts derived
    once and recorded with the byte digest, alert and record mounted read-only as a directory; every later reader
    reads the record; launch copies both into the episode. Dissolved C08, C22, C29, C31, C32. Demands: facts_recorded_beside_the_alert,
    a1_input_dir_read_only_in_the_box, a1_launch_copies_alert_and_record, the o8_*/o11_* rewords.'
  - 'T2 (adopted -> A2): D2 covers exactly the lead''s own endings; each reaches MAIN as one fixed sentence outside
    the lead''s frame; the lead''s failures never count toward the run-level kill; other kills and store faults
    after output stop the run. Dissolved C02, C10, C11, C12. Demands: the o5_* set, o6, n12_other_kills_end_the_run.'
  - 'T3 (adopted, pointer variant -> A3): the stored goal holds the contract and a pointer; the lead reads the alert
    itself; no sanitiser. Dissolved C05, C06, C07. Demands: l00c_goal_is_contract_and_pointer, a3_lead_reads_the_alert_itself,
    o12_* (narrowed).'
  - 'T4 (adopted with a bound -> A4): correlation ends before MAIN''s opening message is built; its section carries
    the summary or the one named reason; the injected late entry, its header, the end-of-run reap and N5 are retired.
    Its per-request timeout mechanism is replaced by T7. Dissolved C03, C04, C13, C15.'
  - 'T5 (adopted -> A5): the alert mapping is a required tenant file; one tenant check at every entry point refuses
    with a fixed reason naming the file. Dissolved C19 and most of C20. Demands: bad_alert_mapping_refused_by_tenant_check,
    case_mapping_top_level_source_refused, a5_one_tenant_check_at_every_entry_point.'
  - 'T6 (adopted -> A6): the signature is a key-shaped token, every lookup exact; O8''s remapped fixture uses a
    token-safe field (alert_id), not rule.name. Dissolved C23 and most of C16. Demands: alert_facts_value_domain,
    a6_exact_lookup_at_every_sink.'
  - 'T7 (adopted round 2 -> A7): one harness deadline around the whole correlation lead, retries included; one classifier
    names every ending before output (''timed out'' included), lets run-level kills through and keeps its own call
    tally. Accepted limits RF-S1 (a bash call overruns by up to 120 s) and RF-S2 (a cut backend call runs on up
    to 40 s and leaves no executed row). Dissolved C39 and C40''s open premise. Demands: a7_one_deadline_bounds_the_correlation_phase,
    a7_timed_out_is_a_session_ending, o5_timed_out_named.'
  - 'T8 (adopted round 2 -> A8): run start checks the raw bytes before any run folder exists; the recorded digest
    is the alert''s only identity; a folder with no record is not a run. Dissolved C41, C44, C47. Demands: a8_admission_refuses_before_any_folder,
    a8_recorded_digest_is_the_one_identity, a8_folder_without_record_is_not_a_run.'
  - 'R3-B1 (adopted, §7 round 3, 2026-10-12): a store refusing the case ticket (any label) is recorded in the ticket receipt
    and on the run page, quoting the store''s reason; the investigation still ends normally. Overturns p082''s "fails
    the ticket leg loudly" answer (P-p082). X23 and p082 reworded. Demand: b1_refused_case_ticket_named_in_receipt_and_page.
    event_time stays carried as-is (C16).'
  - 'R3-B2 (adopted, §7 round 3): new finding rows carry the recorded signature in a dedicated field old rows lack (coined
    `recorded_signature`); the curator takes a lesson''s source_signature only from it, so a row queued before the change
    reads as unsigned by construction (no old-shape recognition, N13). X03 and p073 reworded. Demand: b2_queue_row_carries_the_signature_in_its_own_field;
    p072, p073 and p116 also read the field as handed.'
  - 'R3-B3 (adopted, §7 round 3): the correlation deadline''s ceiling is fixed against the default 1200 s clock, checked
    once; an operator-shortened clock yields a budget stop where enforcement is on (n12, p002, p010, p166, p171, r7[budget]
    rely on it). The shipped default is pinned positive and at or under 1080 s. MAIN''s minimum time stays prose. Demand:
    b3_shipped_correlation_deadline_under_the_fixed_ceiling; r5 reworded.'
  - 'R3-B4 (adopted, §7 round 3): the "no unfilled {...} token" rule covers the correlation lead''s Dispatch block only;
    the shared gather instructions are untouched. r1_correlation_prompt_roles_disjoint_and_bound reworded.'
  - 'R3-B5 (adopted, §7 round 3): word-level pins on model-facing text stay, with the standing instruction that an implementer
    whose correct wording trips one loosens the word list to their own words and never removes the check (recorded in
    _spec1222.py''s module docstring, WORD-LEVEL PINS).'
  - 'R3-A5 (adopted, §7 round 3): a lessons or vocabulary lookup that exits with an error after printing partial output
    is a failed lookup, named in its section (X13 applied to PR-05). Demand: x13_lookup_exiting_nonzero_is_a_failed_lookup
    (a clause; write-code-from-spec carries it).'
