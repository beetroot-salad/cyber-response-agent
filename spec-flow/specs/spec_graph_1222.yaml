# ==========================================================================================
# spec_graph_1222.yaml — issue #1222 "the alert's front door": correlation without the ancestor
# fetch (item 1 deleted), one alert mapping per tenant, the alert settled once at run start.
# write-tests, phase D (assembler leaf), base 301f196c. GOVERNING DESIGN: .spec-flow/design.md as
# amended by .spec-flow/design-amendments.md — A1-A8 and the smaller rulings WIN wherever they differ.
# Assembled from .spec-flow/frontiers/ 10-brief.md, 20-demands.md, 45-dispositions.md (re-judged),
# 47-dissolve.md (re-dissolved; round 1 recovered, see handoff.deviations), 70-resolutions.md (both
# §7 rounds), and the probe records 44-probes.md, 46-reground.md, 44-probes-amend.md, 46-reground-2.md.
#
# READ THIS FIRST
#   The run's alert is admitted once (A8: strict UTF-8, no BOM, one JSON object, no unpaired
#   surrogate — before any run folder exists), its facts derived once through the tenant's required
#   alert mapping (A5, A6) and recorded with its byte digest beside it in a read-only input directory
#   (A1). Every later reader reads the record. The correlation lead l-00c runs to its end inside one
#   deadline before MAIN's opening message is built (A4, A7); its stored goal is a contract and a
#   run-relative pointer (A3); its every ending reaches MAIN as one fixed sentence (A2).
#   Tests guard behaviour, never absence (D6). Runs recorded before the change need not load (N13).
#   Implementation is sequenced after #1108 P4 (C24).
#
# demands — three blocks (counts are in 75-graph-digest.md, computed from this file):
#   (D) 20-demands.md's ledger, REWORKED per 45-dispositions' "For phase D" list, A1-A8 and the
#       round-2 rulings, plus the amendment's new demands (`ledger: amendment`). Four retired
#       (handoff.drops); renamed ones carry `renamed_from`, replacements carry `replaces`; every
#       provisional flag is lifted (each fork resolved at §7). Clauses stay clauses (m1, m2, n9, m4,
#       n8, m5_*). Each test demand carries its docstring seed (`seed_docstring`).
#   (S) the SETTLED premises of 45-dispositions.md, one pointer each, `discharged_by` = the premise's
#       own test name in 40-premise-file.py (phase F's premise walk joins by name), `settled_premise`,
#       the settled sentence as `seed_docstring`, its closer as `closer`. p131 (scale) and p185
#       (replay bookkeeping) are clauses.
#   (F) the FORK premises, decided at §7: one pointer each at the premise's test name, `fork_premise`,
#       `cluster`, `resolved_by`, the ruled reading as it lands on the premise as `seed_docstring`.
#   Every X01-X25 / Y01-Y19 drop is a `rejected:` entry on the demand(s) whose reading it rejects.
#
# name reconciliation (three coining passes -> one vocabulary; the code's name wins where one exists)
#   brief/20-demands `alert_facts` stays (provisional: no code yet). 20's `signal_index`/`rule_id`
#   boundaries are not modelled (item-1 inputs only). 20's axis `signature` is a boundary here (the
#   derived fact); the axes are run_id, lead_id, seq, session_id, episode_id, lesson_name,
#   alert_digest. Premise-file addresses were translated: interacts(_inject_correlation->session_store)
#   -> interacts(render_orient_section->orient_block) / orient_block.payload (A4);
#   interacts(dispatch_correlation|run_investigation->executed_queries) ->
#   interacts(gather_dispatch->executed_queries) (the lead's rows are written by the gather runner);
#   interacts(derive_alert_rule_key->signature) -> interacts(_enqueue_report->episode_dir) (the key
#   is the episode record's signature, M6/A1); interacts(orientation->lessons_dir) ->
#   interacts(cmd_grep->lessons_dir) + drives(orientation->cmd_grep); drives(orientation->load_corpus)
#   -> drives(orientation->invlang_cli); interacts(episode_alert->runs_base) ->
#   interacts(episode_alert->episode_dir); demand ids used as binds -> the addresses they bind.
#   The profile resource `defender_lessons` is the boundary `lessons_dir`. start_box is
#   runtime/box/_lifecycle.py's, never learning/branch/estate/oracle's.
#
# structure — demand-implied structure (`provenance: design`: new, or modified by A1-A8) attached to
#   the brief's grounded neighbourhood (`provenance: code`): co-writers of every shared sink (session
#   store, leads, queries, learning queue, lessons, runs base, episode dir), the sibling constraints
#   (the seven tenant-check entry points; the six access vias of the input directory), and the
#   consumers (every stored-goal reader, every alert.json host reader PA-06 found, the truncated_by
#   reader). The design's removals are `mode: remove` edges (item 1's reads and writes, the late
#   injection, every re-read of the box-writable alert, the world pick, the timestamp gate, the
#   post-box alert rewrite), with their remaining dependents left LIVE so R5 asks each.
#
# unknown — two, both findings: alert_input_dir.access[runsc-box].constraints (runsc never ran,
#   PA-08) and correlation_deadline.domain.default (T7 leaves the value to choose).
#
# claims — the brief's ledger (ids kept), 20-demands' RC1-RC27, every probe record (PR-*, RJ-*, RD-*,
#   PA-*) and the assembler's AD-1..AD-3; translations recorded per claim and in handoff.deviations.
#
# gate — written by the gate leaf (76-residue.md): gate.evaluated for R0-R8, the obligations it minted (demands with
#   `ledger: gate`, appended at the end of the demands list), two holes, three re-ground holes, the pre-discharge credits.
# ==========================================================================================
# repair (phase F, 94-repair.md, 2026-10-12): the §7 round-3 rulings (70-resolutions.md: B1-B5, the A5 yes) and the
#   reconciler's repair list A1-A8 (92-reconciliation.md) applied — four demands added (b1_, b2_, b3_, x13_), claims
#   P-p082 and R92-01 added, RC21 closed on R92-01; see handoff.tensions R3-* and the REPAIR / FOLLOW-UP deviations.
schema_version: 2
design: '#1222 — .spec-flow/design.md as amended by .spec-flow/design-amendments.md (A1-A8 and the smaller rulings
  win)'
base: 301f196c
tests: defender/tests/alert_front_door_1222
demands:
- id: alert_facts_contract
  kind: behavior
  form: test
  discharged_by: test_alert_facts_resolve_each_mapped_path_or_absent
  binds:
  - alert_facts
  - interacts(alert_facts->alert_json)
  - interacts(alert_facts->alert_mapping)
  - interacts(alert_facts->signature)
  - signature.domain.distinguished[unmapped]
  - signature.domain.distinguished[path_absent]
  - drives(materialize_run->alert_facts)
  seed_docstring: Given the admitted alert and the tenant's alert mapping, the one derivation, run once at run start,
    yields exactly three facts — signature, event_time, summary — each the value at its mapped dotted path (a walk
    over JSON objects only), or absent when the key is unmapped or the path is absent from the alert; it never substitutes
    another field.
  ledger: 20-demands
  reworded_by:
  - A1
  - C16
  resolves_fork: F0-FACTS
  rejected:
  - nl: 'N6: no vendor-shape conversion — the mapping reads whatever alert.json holds.'
  - id: X02
    nl: there is no defence against an operator mapping the signature to a field an attacker can fill.
    reading: give lessons provenance to defend against an alert field the operator chose as the signature.
    outside: principle 1 (the host and the operator's own settings are not treated as hostile).
- id: alert_facts_value_domain
  kind: domain-outcome
  form: test
  discharged_by: test_alert_facts_value_domain
  binds:
  - signature.domain.distinguished[int]
  - signature.domain.distinguished[zero]
  - signature.domain.distinguished[negative_int]
  - signature.domain.distinguished[float]
  - signature.domain.distinguished[false]
  - signature.domain.distinguished[empty]
  - signature.domain.distinguished[list]
  - signature.domain.distinguished[object]
  - signature.domain.distinguished[leading_dash]
  - signature.domain.distinguished[whitespace]
  - signature.domain.distinguished[quote]
  - signature.domain.distinguished[control]
  - signature.domain.distinguished[shell_meta]
  - signature.domain.distinguished[non_ascii]
  - signature.domain.distinguished[at_bound]
  - signature.domain.distinguished[over_bound]
  - signature.domain.alternatives[rule.name]
  seed_docstring: A mapped value is a signature only when it is a JSON string, or an integer as its decimal text
    (5710 → '5710', 0 → '0', -0 → '0'), matching [A-Za-z0-9][A-Za-z0-9._:/@+=-]{0,127} — ASCII only, no leading
    dash, at most 128 characters. Anything else — a negative integer, a float, a boolean, an empty string, a list,
    an object, a value with a leading dash, whitespace, a quote, a control or shell character, a non-ASCII character,
    or a value of 129 characters — is no signature, recorded and named exactly like an unmapped one. Mapping the
    signature to rule.name over the committed fixture alerts gives no signature (every committed rule.name holds
    a space, RD-05).
  ledger: 20-demands
  reworded_by:
  - A6
  - C43 (human)
  resolves_fork: F0-FACTS
  cites:
  - RD-05
  - RC16
  - PR-34
- id: correlation_outcome_reaches_main
  kind: behavior
  form: test
  discharged_by: test_opening_message_holds_one_correlation_section
  binds:
  - orient_block.payload
  - interacts(render_orient_section->orient_block)
  - interacts(render_orient_section->correlation_ending)
  - drives(run_investigation->dispatch_correlation)
  - interacts(run_investigation->message_history)
  seed_docstring: 'MAIN''s opening message holds exactly one correlation section: the lead''s framed summary when
    the lead produced a usable one, otherwise one fixed sentence naming its ending, outside the lead''s frame —
    never both, never neither — and nothing about correlation arrives later in MAIN''s session.'
  ledger: 20-demands
  reworded_by:
  - A4
  renamed_test_from: test_main_second_request_holds_one_correlation_outcome
  note: '#0b. N5 (a run ending before MAIN''s second request is told nothing) is retired by A4, so its `rejected:`
    goes.'
- id: o1_non_elastic_tenant_dispatches_correlation
  kind: behavior
  form: test
  discharged_by: test_o1_non_elastic_tenant_gets_correlation_without_kibana_fields
  binds:
  - interacts(prepare_correlation_lead->lead_sidecar)
  - interacts(gather_dispatch->executed_queries)
  - interacts(render_orient_section->orient_block)
  - lead_zero_yaml
  - verb_grants_yaml
  seed_docstring: 'A tenant whose lead-zero.yaml and grants name a non-Elastic system, over an alert carrying none
    of alert_id / signal_index / ancestor_events / alert_timestamp: l-00c''s leads row exists, its queries ran on
    that system, and MAIN''s opening message carries the lead''s summary.'
  ledger: 20-demands
  reworded_by:
  - A4
  authoring_note: 'LZ08, executed by R92-01 (92-reconciliation): the shipped, established cmdb.list-all-hosts passes
    `_agreement` under a cmdb correlation grant on a cmdb-only tenant, so o1 uses it and needs no planted catalog
    (RC21''s "plant a catalog" is overturned). Coupling: if cmdb.list-all-hosts is ever demoted or renamed, o1 fails
    for a reason unrelated to #1222.'
  cites:
  - LZ08
  - R92-01
  rejected:
  - nl: 'N2: correlation is harness-dispatched, not model-optional.'
  - id: X25
    nl: this design does not escape entity values.
    reading: promise host-side escaping of alert entity values into a non-Elastic query.
    outside: principle 3. No owner exists (PR-22), and this design adds no query path.
- id: correlation_not_gated_on_timestamp
  kind: domain-outcome
  form: test
  discharged_by: test_correlation_dispatches_with_no_or_unparseable_timestamp
  binds:
  - alert_timestamp.domain.distinguished[absent]
  - alert_timestamp.domain.distinguished[unparseable]
  - interacts(prepare_correlation_lead->lead_sidecar)
  - interacts(prepare_correlation_lead->alert_timestamp)
  seed_docstring: An alert with no alert_timestamp, and one whose alert_timestamp does not parse, both get l-00c
    dispatched; neither the lead's dispatch nor its contract depends on a timestamp field.
  ledger: 20-demands
  rejected:
  - id: X22
    nl: the harness puts no gate on the alert's time.
    reading: the harness withholds correlation for an alert with no time field.
    outside: D3 (correlation no longer depends on a timestamp field; M2 removes the harness's parse).
