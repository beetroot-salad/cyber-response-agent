    minimum time, taken as zero because it has no number. The ceiling is fixed against the default clock, checked once;
    it is not recomputed from a run''s own clock settings.'
  ledger: amendment
  source: §7 round 3 (human, 2026-10-12), B3 — fixed ceiling, pin the shipped default
  grounds:
