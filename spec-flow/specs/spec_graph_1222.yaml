  - interacts(lesson_author->lesson_author_prompt)
  seed_docstring: 'A finding row the judge enqueues for a run with a recorded signature carries that signature, verbatim,
    in its own field (coined `recorded_signature`) -- a field rows queued before the change lack; the rows reach the
    curator with that field as written, and the curator''s instructions take a lesson''s source_signature from that
    field alone, never from the row''s rule key, which rows queued before the change also carry. An unsigned run''s
    rows carry none there (p073).'
  ledger: amendment
  source: §7 round 3 (human, 2026-10-12), B2 — a new field on the queue row
  grounds:
  - B2 (human, §7 round 3)
  - C27
  - C28
  - X03
  - N13
  cites:
  - PR-10
  - PR-30
  note: 'Why a field and not the key: the old key `rule-5710` is itself a valid C43 signature, so the rule key cannot
    tell an old row from a signed one without old-shape recognition, which N13 forbids (92-reconciliation B2). The field''s
    name is coined in S.COINED (`queue.signature`). The instruction checks are word-level pins (B5).'
