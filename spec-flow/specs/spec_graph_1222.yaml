  - drives(orientation->invlang_cli)
  - orient_block.payload
  outcome:
    nl: Orientation treats a lessons or vocabulary lookup that exits with an error as a failed lookup even when it printed
      partial output, and names it in the section it would have filled, as X13 names any lookup that could not run; the
      partial output is never shown as the lookup's result.
  ledger: amendment
  source: §7 round 3 (human, 2026-10-12), 92-reconciliation A5 — yes
  grounds:
  - X13
  - A5 of 92-reconciliation (human, §7 round 3)
  cites:
  - PR-05
  note: 'A clause, not a test: orientation''s only seam is its ShimRunner, which sits above the return code (RecordingShim(fail=)
    injects None there), and the subprocess runner itself is the private orient._shim; a fake executable would need
    the run''s PATH, which run_common.run_env builds from the code tree. write-code-from-spec carries it: orient._shim
    (or its replacement) must treat a non-zero exit as a failed lookup even with partial stdout (PR-05: today it ignores
    the return code).'
