  - id: image_name_carries_the_recipe_version
    kind: behavior
    form: test
    discharged_by: test_the_image_name_carries_the_running_packages_recipe_version_and_never_the_mounted_trees_recipe
    binds:
      - image_tag
      - "image_tag.domain.distinguished[recipe-drift]"
      - "interacts(_create_argv->image_tag)"
      - "interacts(_render_argv->image_tag)"
    assembly_note: >-
      MINTED BY PHASE E from §7's MF3 (human, reading B+C): the running package's `_image.py`
      is authoritative — both builders resolve through the plain import and never load the
      MOUNTED tree's `_image.py` by path (a planted tree carrying a `v99` recipe still yields
      the running package's name) — and the name carries `RECIPE_VERSION`, so a recipe drift
      is legible in the fault text vs the build's output.
    forks: "MF3 (#71, #72 — material, human: B+C; option A — load the mounted tree's `_image.py` by path in the builders — rejected: the first host-side execution of fetched code on the drain lane, O7's asset)"
  - id: fake_tree_sites_pin_an_explicit_rootfs
    kind: coherence
    form: clause
    outcome: {nl: "The eleven existing fake-docker test sites that read a rendered create argv over a tree lacking the three inputs pass BoxSpec(rootfs=\"python:3.11-slim\") explicitly — test_box_dood_c46.py's five direct builder calls (the source-translation, no-mount-table, request-mounts, discovered-table run-dir and discovered-table request sites), test_1047_archive_record.py's writable-bind site, test_771_alias_ban.py's _request helper and test_665_box_geography.py's uncovered-workdir site — while the two env-lever helpers in test_box_dood_c46.py that cannot pass a spec and the typoed-lever request site use the real tree, and test_665_box_live.py's two temp-workdir requests pin rootfs=image_tag(DEFENDER); the six C46-refusal sites and the from_env site are untouched. Applied by phase E in this diff."}
    binds:
      - "interacts(fake_tree_test_sites->BoxSpec)"
      - "interacts(test_665_box_live->BoxSpec)"
      - "BoxSpec.domain.distinguished[rootfs_set]"
    assembly_note: >-
      MINTED BY PHASE E from §7's MF1 part 4 (human): the migration the resolver's contract
      imposes on existing tests, recorded as a clause because the diff itself realizes it
      (the sites are edited here) and the live suite's row is exercised by `live_duckdb_probe_
      turns_green`; the C46 sites are covered by `c46_refusal_precedes_the_resolver`.
    forks: "MF1 part 4 (#82 — material, human: 11 + 2 sites pin a rootfs; a pinned rootfs reads no file, so a fake tree never resolves against a real one — environment-independent)"

