  - id: box_image_build_tags_the_derived_name
    kind: behavior
    form: test
    discharged_by: test_box_image_build_runs_docker_build_on_the_trees_dockerfile_tagged_with_the_derived_name
    binds: ["box_image.access[build]", "interacts(box_image->docker_build)", image_tag, "interacts(box_image->box_image_on_daemon)"]
    assembly_note: "+`interacts(box_image->box_image_on_daemon)` — the `-t <tag>` the seed asserts is the write into the daemon's image store."
    premises: [5, 6, 9, 11, 14, 15, 16]
