  holes:
    - rule: R4
      element: "image_tag.domain.distinguished[unreadable-input]"
      witness: >-
        No domain member or demand covers an unreadable (not merely missing) input file — MF1
        part 2 (45-dispositions #19/#40): does the resolver's BoxFault wrap generalize to every
        OSError subtype (PermissionError, IsADirectoryError) or only FileNotFoundError as
        probed?
      resolution: "§7 MF1, human, reading A: any OSError on the three inputs → BoxFault naming the folder and the first unreadable file, raised in the argv builder before docker; d10 widened from 'missing' to 'cannot be read' (the script side prints the same sentence and exits 1)."
      resolved_to: missing_inputs_fault_before_docker
    - rule: R4
      element: "image_tag.domain.distinguished[lacking-inputs-and-uncovered]"
      witness: >-
        No demand states which of two true refusals fires first over a folder lacking both the
        docker-visible mount and the three hash-input files: the pre-existing C46
        uncovered-mount refusal, or the resolver's own missing-input fault — MF1 parts 1/4
        (45-dispositions #81/#82). The order decides whether 6 of the 18 fake-tree sites keep
        their current assertion (resolver-first) or 11+2 need an explicit rootfs pin
        (C46-first, the recommended reading).
      resolution: "§7 MF1, human, reading A: the C46 uncovered-mount refusal keeps running FIRST on both lanes; the six C46 sites are untouched and 11 + 2 sites pin an explicit rootfs (fake_tree_sites_pin_an_explicit_rootfs)."
      resolved_to: c46_refusal_precedes_the_resolver
    - rule: R4
      element: "did_not_run_marker.domain.distinguished[resolver-refusal]"
      witness: >-
        No demand states whether a resolver-raised refusal leaves a run-folder "this run did
        not happen" marker the way other create faults do, or stays silent like the
        pre-existing C46 refusal — MF1 part 3 (45-dispositions #80).
      resolution: "§7 MF1, human, reading A: no marker — the same silence as the C46 refusal, both raised while the argv is assembled; the exception is the carrier."
      resolved_to: resolver_refusal_leaves_no_marker
    - rule: R4
      element: "create_fault_remedy.domain.distinguished[missing_image_on_drain_lane]"
      witness: >-
        The drain lane's own worktree is deleted (drains.py:776-780, F22/S14) before the
        missing-image BoxFault's remedy text — naming that same worktree — is ever read by an
        operator, and the run's own "did not happen" marker is deleted with it — MF2
        (45-dispositions #75/#54). Does the remedy instead name a durable pointer (the
        `origin/main` commit the worktree was cut from, plus checkout+build instructions), and
        is the lost marker an accepted cost of the pre-existing cleanup-on-any-exception
        discipline?
      resolution: "§7 MF2, human, reading A: the shared fault text stays as amended; drains.py's BoxFault arm re-raises with the cut commit (`origin/main @ <sha>`) and 'check out that commit and run the build from it' appended before cleanup's result is reported; marker loss accepted; tick repetition / branch accumulation recorded, not mechanised. Phase F (F1, human): the pointer rides EVERY drain-lane start BoxFault; the build command still rides the missing-image shape only (O4)."
      resolved_to: drain_lane_fault_names_the_cut_commit
    - rule: R5
      element: drain_worktree
      witness: >-
        `learning_drain` removes the worktree that `_render_argv`/`image_tag` still depend on
        (the same drive edge that feeds `create_fault_remedy`'s drain-lane cell above) — same
        root as MF2: the survival demand for this dependent is the identical durable-pointer
        decision, not a second question.
      resolution: "§7 MF2, human: the same decision — the durable pointer IS the substitute the removed tree's dependents (the remedy, the resolver's read) complete through."
      resolved_to: drain_lane_fault_names_the_cut_commit
    - rule: R4
      element: "image_tag.domain.distinguished[recipe-drift]"
      witness: >-
        No demand pins which copy of the fingerprinting code (`_image.py`) is authoritative
        when the operator's host checkout and the mounted tree disagree on the recipe (a
        fourth hashed file, a different hash length, a separator change) — MF3
        (45-dispositions #71/#72). The amendment's "no host/mounted distinction, the two-tree
        case cannot arise" sentence is about the three hashed INPUT files, not the code doing
        the hashing; one of three readers (copy1) read it as already deciding this, the other
        two did not, which is why the root goes to the human rather than settling on copy1.
      resolution: "§7 MF3, human, reading B+C: the running package's recipe is authoritative (plain import of `_image.py`, no by-path load in the builders) and the tag gains a recipe-version prefix `defender-box:<RECIPE_VERSION>-<12 hex>`, `RECIPE_VERSION` a constant in `_image.py`; drift legible in the fault vs the build output. #0's seed and N2's observed shape move accordingly."
      resolved_to: image_name_carries_the_recipe_version
