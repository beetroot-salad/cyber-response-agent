# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE. The sandbox stops being the unmodified `python:3.11-slim` pulled by the daemon
# and becomes an image THIS TREE BUILDS: M1 `defender/box.Dockerfile` (digest-pinned base, a
# version-pinned uv binary copied in and removed after, ONLY pyproject+uv.lock copied, `uv sync
# --locked --no-dev --inexact --extra box` into /usr/local with bytecode compiled, then pip/
# setuptools/wheel uninstalled — F1); M2 a `box` extra (= duckdb); M3-REVISED a content-
# addressed name DERIVED AT BOX START — `runtime/box/_image.py::image_tag(tree)` hashes the
# bytes of `box.Dockerfile`+`uv.lock`+`pyproject.toml` in the defender dir the box MOUNTS, and
# `BoxSpec.rootfs` defaults to None so each `docker run` builder resolves it on the host when
# the argv is built (no checked-in constant, no file read at import); M4-AMENDED each of the
# three box-starting CI jobs builds the image in a 4-minute step immediately after checkout and
# syncs `--locked`; M5-AMENDED a missing image faults naming `python3 <tree>/defender/scripts/
# box_image.py build` with the mounted tree's path; M6 `DEFENDER_BOX=1` is
# lane-derived on every box lane (spread AFTER the caller's keys) and STRIPPED by both host
# lanes (JF3), the three granted shims and `reexec_into_venv` take the image's python when it
# is set; JF5 `--pull=never` on every `docker run` of a box; M7 the stdlib-only rule's text and
# its pin test go, `BoxSpec` becomes a `@model` dataclass. O7 is NARROWED to "no uv, no
# pip-installable path" (F1).
#
# JF5 AMENDED AT FINALIZE (#1095, review finding 1 — premise #34 REFUTED): "a missing image is
# the create's one-line `No such image: <name>` stderr" held only for CLI >= 28 — docker-cli
# 27.5.1 (Ubuntu 24.04 `docker.io`, Debian bookworm) appends a period, so the exact-name match
# silently dropped O4's remedy on every distro CLI. The mechanism is replaced, not patched:
# every `docker run` site ASKS the daemon first (`require_image`: `docker image inspect
# --format {{.Id}} <name>`, a yes/no by exit code) and a `no` raises the remedy BEFORE any
# create; no create stderr is classified by anyone. `resolve_rootfs` returns the name AND
# the remedy it earns (`Rootfs(image, remedy)` — an explicit rootfs earns none), the builders
# hand both back BY NAME (`Create(argv, rootfs)`), never read off an argv position. Silent #35
# (a `No such image:` line about some other image) is impossible by construction and its row
# was deleted. Ledger rows R1/R2 below; demands d42/d43/d44/d46 re-pinned.
#
# WHAT A COLD READER MUST NOT RE-DERIVE FROM THE DOC:
#   1. RUN 1 OF THIS FLOW HALTED DESIGN-REFUTED at §7: four material forks shared one root —
#      the checked-in `IMAGE_TAG` constant — and the human REVISED M3 by amendment instead of
#      patching the sites. This graph is RUN 2, against the amended text. Run 1's chain is
#      archived at `.spec-flow/frontiers-run1/`, its draft graph at `.spec-flow/
#      run1-spec_graph_1092.yaml`, never committed; its probes are cited here only through the
#      run-2 brief's inherited rows (S1–S10, G1–G16, rg1–rg6, C1–C19).
#   2. `image_tag(<tree>)` TAKES THE DEFENDER DIR (where the three files live): `defender_dir`
#      on the run-dir lane, `Path(request.workdir) / "defender"` on the request lane — the
#      derivation `_derived_infra_env`/`_host_fallback_env` already use. `BoxRequest` has NO
#      `defender_dir` field (N5, refuted). The remedy string is identical either way.
#   3. THE RESOLVER'S CONTRACT ON A TREE THAT CANNOT NAME AN IMAGE WAS §7'S (MF1, reading A,
#      human): any OSError on the three inputs → `BoxFault` naming the folder and the first
#      file, raised in the argv builder before docker (`missing_inputs_fault_before_docker`,
#      widened from "missing" to "cannot be read"); the C46 refusal keeps running FIRST on
#      both lanes (`c46_refusal_precedes_the_resolver`); no run-dir marker
#      (`resolver_refusal_leaves_no_marker`); 11 fake-tree argv-reading sites + 2 live-suite
#      temp-dir requests pin an explicit `rootfs` (`fake_tree_sites_pin_an_explicit_rootfs`,
#      the migration phase E applied). The six C46 sites and the `from_env` site are untouched.
#   4. THE DRAIN LANE DELETES THE TREE THE REMEDY NAMES (F22/S14, MF2, human): drains.py:776-780
#      runs `branch.cleanup(wt)` on every start_box exception. The drain's own fault arm now
#      re-raises the missing-image BoxFault with `origin/main @ <sha>` (the worktree's HEAD,
#      read before cleanup) and a check-out-and-build instruction appended
#      (`drain_lane_fault_names_the_cut_commit`); marker loss is an accepted cost.
#   5. ENSUREPIP'S BUNDLED WHEELS SURVIVE F1'S REMOVAL (G17/F23, MF4, human): the Dockerfile
#      also removes `ensurepip/_bundled` (`dockerfile_removes_ensurepip_bundled_wheels`) and
#      d22's in-box observer runs `python3 -m ensurepip --root /tmp/x` expecting failure.
#   5b. WHICH RECIPE NAMES THE IMAGE (MF3, human): the running package's `_image.py` is
#      authoritative — a plain import, never a by-path load of the mounted tree's copy — and
#      the name carries a recipe version: `defender-box:<RECIPE_VERSION>-<12 hex>`
#      (`image_name_carries_the_recipe_version`; #0's seed and N2's observed shape moved).
#   6. "TESTS THAT NEED A STOCK IMAGE PIN ONE" HOLDS FOR FAKE-DOCKER TESTS ONLY (45-dispositions
#      R2, #94): with the pre-pulls dropped and `--pull=never` on every create, a REAL-daemon
#      test pinning `python:3.11-slim` faults on a cold runner. Real-daemon tests pin
#      `image_tag(DEFENDER)`.
#   7. box-dood's runner side NEVER syncs — its one `uv sync` is line 414 of the heredoc
#      `.dood-inner.sh` (N6, refuted): "before the runner's sync" there means immediately after
#      checkout, before the DooD step; `--locked` lands on the inner line.
#
# NAME RECONCILIATION (three coining passes → one namespace). Actors and boundaries are named
# what the code names them: `image_tag`, `box_image` (defender/scripts/box_image.py),
# `_create_argv`, `_render_argv`, `_render_env`, `_host_fallback_env`, `run_env`, `_start_boxed`,
# `_start_boxed_request`, `start_box`, `run_probe_under_profile` (_spec771), `BoxSpec`,
# `DEFAULT_SPEC`, `BOX_ENV_ALLOWLIST`, `_BOX_MARK_ENV`, `_LOCALE_ENV`, `_opt_out_or_raise`,
# `reexec_into_venv`; the three shims by their bin/ names; `bash_exec_entrypoint` is
# `bash_exec._run_box_entrypoint` (the profile's box_env reader); `run_investigation` is run.py
# (profile contextAliases); `learning_drain` is drains._run_worktree_batch. The brief's five
# shared roots map to boundaries `box_env` (S1, the profile's `resources.box_env`),
# `box_image_on_daemon` (S2), `uv_lock`+`pyproject`+`box_dockerfile` (S3), `ci_yml` (S4),
# `host_venv` (S5). FOUR IDS APPEAR IN BOTH LISTS — `image_tag`, `box_image`, `box_dockerfile`,
# `BoxSpec` — because the same code object is a surface others reach (a boundary carrying
# cells: `box_image.access[tag]`, `image_tag.domain…`) AND a reader/writer in its own right
# (`interacts(image_tag->box_dockerfile)`, `interacts(BoxSpec->_model)`); the address forms
# force both roles and the corpus already does this (584, 585, 632, 647, 672, 705, 754). Axes
# are declared ONCE: `env_key`, `hash_inputs`, `tag`. Claim ids: C1–C19 (design doc), S1–S18 /
# G1–G27 / rg1–rg6 (10-brief, run-1 rows inherited under their ids), N1–N12 (20-demands),
# PJ-r2-1..4 (45-dispositions).
#
# THE GATE BLOCK was written by phase D's gate leaf from `spec-graph gate --residue` and
# 60-residue.md; §7 (70-resolutions.md) closed its 15 holes and phase E applied them here:
# the six material cells + `drain_worktree` are bound by the demands point 3–5b name (each
# hole carries `resolution` + `resolved_to`), the eight R7 unmoved readers are `Demand
# {form: waiver}` ×8 at the end of `demands:`, and `handoff.forks` records all 60 fork
# resolutions (4 human, 56 auto). `spec-graph actors --base b016749c` names two re-exec
# drivers of run.py (`cli`, `generate_case`); both are modelled as composition actors driving
# `run_investigation`. THE SUITE: `defender/tests/test_1092_*.py` + `tests/_spec1092.py`
# (phase E, 80-author-digest.md); the two demands that pointed at tests under `tests/e2e/`
# (d35, d49) now point at scanned siblings in `test_1092_box_image_live.py`.
# ===========================================================================================

