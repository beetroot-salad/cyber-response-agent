      # with `rootfs=None` it reads no file (d5). Consumers unchanged (unboxed_executor's default).
      facets: {}
    - id: _model
      provenance: code
      # defender/_model.py::model — the pydantic dataclass decorator BoxSpec adopts (O2).
      facets: {}

    # ===== the image, on the daemon and inside ===================================================
    - id: box_image_on_daemon
      provenance: design
      # The daemon's image store entry `defender-box:<tag>` (S2). NO in-tree writer exists at
      # base; after the change the writer is `box_image build` driven by three cold CI runners
      # and the operator's hand (D2: "only on the daemon that built it"). Readers: every
      # `docker run --pull=never` of a box. `resources.box_image` is declared in the commit
      # that creates the writer (brief floor).
      facets:
        identity:
          key_axes: [hash_inputs]
          evidence: {nl: "A daemon's image store is keyed by repository:tag (`-t <tag>` at `docker build`, the last argv token at `docker run`); the tag is `image_tag()`'s projection of the three files' bytes, so two trees with identical bytes name ONE entry (d4, #45/#46) and one differing byte names another (d3). Read off box_image's `-t` and the builders' `spec.rootfs if … else image_tag(...)`."}
          derivations:
            - {value: tag, fn_of: hash_inputs, injective: true}   # sha256[:12] — F5's cardinality argument (collision-irrelevant here), not a proof; handoff.deviations
          sharing: unique-key
    - id: box_image_contents
      provenance: design
      # The image's filesystem: /usr/local site-packages with the locked core + duckdb (N3/G18:
      # annotated_types, packaging 26.2 kept, pydantic 2.13.4, pydantic_core, pyyaml,
      # typing_extensions, typing_inspection; 151/151 .pyc), no uv, no pip/setuptools/wheel,
      # a dangling /usr/local/bin/pip symlink (F24), NO tree, no .env/.ssh (dockerignore);
      # today `ensurepip/_bundled/` still present (MF4).
      facets: {}

    # ===== the daemon's two surfaces =============================================================
    - id: docker_run
      provenance: design
      # The create call: `docker run --detach --name … --runtime … --network none --read-only
      # --security-opt seccomp=… --mount … --tmpfs … --workdir … --env K=V… <image> sleep
      # infinity` (_lifecycle.py:50-64, :179-203) and _spec771's `docker run --rm -i
      # [--security-opt] <image> python3 -`. The delta adds exactly `--env DEFENDER_BOX=1`,
      # `--pull=never` and the derived image token (JF5/O7). The response is the daemon's
      # stderr, kept verbatim and CLASSIFIED BY NOBODY (#1095): a missing image never reaches
      # the create — `require_image` asks the daemon first (`docker image inspect`, R1).
      # R6 walk (for the gate leaf): image token — chooser: the three files' bytes via sha256
      # hex (sanitized by construction) or the explicit `rootfs` (chooser: the test/operator);
      # env VALUES — chooser: the caller's request env, value-blind (pre-existing, PJ-r2-2:
      # NUL refused by subprocess, newline passes); mount sources — chooser: the lane's
      # geography (operator/drain), rendered raw into `type=bind,source=…` (pre-existing).
      facets:
        domain:
          type: str
          refinement: {nl: "The boundary-bearing flags O7 pins byte-for-byte: `--network none`, `--read-only`, and JF5's `--pull=never`."}
          default: "--network none --read-only"
          distinguished: [network_none, read_only, pull_never]
          falsy_valid: false
          documented_alternatives: []
        payload:
          parts:
            - {role: run-dir-lane-argv, source: "template:_create_argv", slots: {image: image_tag, env: box_env, spec: BoxSpec}}
            - {role: request-lane-argv, source: "template:_render_argv", slots: {image: image_tag, env: box_env, spec: BoxSpec, tree: drain_worktree}}
            - {role: rootfs-runner-argv, source: "template:run_probe_under_profile", slots: {image: image_tag, spec: BoxSpec}}
          invariants: [all-slots-bound]
          nl: "The three `docker run` argv shapes that name the box image; each is recorded whole by the fake daemon (RecordingDocker) and read by flag-pair accessors (F28)."
    - id: docker_build
      provenance: design
      # `docker build -f <tree>/defender/box.Dockerfile -t <image_tag(<tree>/defender)> <tree>`
      # (M3-revised script; context = repo root so the root .dockerignore applies, F17).
      # R6 walk: dockerfile path and context — chooser: the script's own `__file__`; tag —
      # sha256 hex.
      facets:
        payload:
          parts:
            - {role: build-argv, source: "template:box_image", slots: {dockerfile: box_dockerfile, tag: image_tag, context: dockerignore}}
          invariants: [all-slots-bound]
          nl: "The one build invocation; an argv list, never a shell string (M5-TEXT #42)."

    # ===== the fault surfaces ====================================================================
    - id: create_fault_remedy
      provenance: design
      # M5's one helper — `require_image(docker, Rootfs)` since #1095 — behind both start
      # sites (before their create) and the _spec771 runner: the daemon is asked for the name
      # this start resolved (`docker image inspect --format {{.Id}} <name>`); a non-zero answer
      # raises a BoxFault carrying the daemon's words and, for a DERIVED name, ending with
      # `python3 <tree>/defender/scripts/box_image.py build`, `<tree>` = the mounted tree's
      # absolute path (`defender_dir.parent` / `Path(request.workdir).resolve()`, #83). The
      # remedy is decided by the resolver (`Rootfs.remedy`: an explicit rootfs earns none —
      # no script of ours builds it). A create that fails AFTER the daemon said yes keeps its
      # own text and no remedy (d43). `missing_image_on_drain_lane`: MF2.
      # R6 walk: `<tree>` — chooser: the operator's checkout / the drain's worktree base
      # (`<worktree_base>/<slug>-<batch_id>`); sanitizer: shlex.quote (#42, auto); the
      # daemon's answer — chooser: the daemon, by EXIT CODE; no text of its is read to decide.
      facets:
        domain:
          type: str
          refinement: {nl: "The daemon's answer to the preflight, by exit code: no image for the name this start resolved; the same on the drain lane where the tree is transient; anything else (a create that failed after a yes, kept verbatim)."}
          default: other
          distinguished: [missing_image, other, missing_image_on_drain_lane]
          falsy_valid: false
          documented_alternatives: []
        payload:
          parts:
            - {role: remedy, source: "template:create_fault_remedy", slots: {tree: drain_worktree, name: image_tag}}
          invariants: [all-slots-bound]
          nl: "The BoxFault sentence an operator copies: the daemon's own words on the preflight, then the build command with the mounted tree's path."
    - id: did_not_run_marker
      provenance: design
      # `write_did_not_run` — the §7 D2 "nobody judged this run" marker: run-dir lane writes
      # it into run_dir on both fault arms (:136, :152, :168); request lane into every WRITABLE
