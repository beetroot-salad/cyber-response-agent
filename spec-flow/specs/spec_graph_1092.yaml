    # ===== the spec ==============================================================================
    - id: BoxSpec
      provenance: design
      # runtime/box/_spec.py:39-60 — M7 ports it to `@model(frozen=True)`; M3-revised widens
      # `rootfs: str | None = None`. `from_env` still moves only `runtime`. Readers of `.rootfs`
      # at base (S11): _create_argv :64, _render_argv :203, _spec771 :347, test_540 :880
      # (`levered.rootfs == default.rootfs`, True for None == None). Dual-listed: as an actor it
      # is `_spec.py`'s import of `defender._model`.
      facets:
        domain:
          type: object
          refinement: {nl: "A frozen dataclass whose `rootfs` is either unset (None — resolve at start) or an explicit image token appended verbatim."}
          default: "rootfs=None"
          distinguished: [rootfs_unset, rootfs_set]
          falsy_valid: false
          documented_alternatives: []
    - id: DEFAULT_SPEC
      provenance: design
