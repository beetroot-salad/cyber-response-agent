  # ---- #0: the owned image name, derived at start -----------------------------------------
  - id: box_rootfs_resolves_to_the_mounted_trees_image
    kind: behavior
    form: test
    discharged_by: test_an_unset_rootfs_resolves_to_the_image_named_by_the_mounted_trees_three_inputs_on_every_docker_run_site
    binds:
      - BoxSpec
      - "BoxSpec.domain.distinguished[rootfs_unset]"
      - image_tag
      - "image_tag.domain.distinguished[complete-tree]"
      - "interacts(_create_argv->docker_run)"
      - "interacts(_render_argv->docker_run)"
      - "interacts(run_probe_under_profile->docker_run)"
      - "interacts(_create_argv->image_tag)"
      - "interacts(_render_argv->image_tag)"
      - "interacts(run_probe_under_profile->image_tag)"
    assembly_note: >-
      +`image_tag.domain.distinguished[complete-tree]` — the seed resolves over a tree holding
      all three inputs; +the three resolver-call edges the seed names ("resolved on the host
      when the argv is built"). MF3 taken at §7 (reading B+C, human): the seed's shape is
      `defender-box:<RECIPE_VERSION>-` + 12 hex, `RECIPE_VERSION` a constant in `_image.py`
      read by the test (never hardcoded); N2's observed tag carries the note. The sibling
      demand `image_name_carries_the_recipe_version` binds the `recipe-drift` cell.
    premises: [50]
    rows: >-
      #50 — the drain loop across a mid-loop rebuild: each tick builds a fresh request and the
      resolver runs inside the builder, so the next start names the tree's CURRENT bytes
      (`_drain_box_request` per tick, drains.py:776).
    forks: "MF3 (#71, #72 — material, cell `image_tag.domain.distinguished[recipe-drift]`); F-D (auto: the defender dir); DAEMON #61 (torn read across the three files — accept, no lock)"
  - id: explicit_rootfs_is_honoured
    kind: domain-outcome
    form: test
    discharged_by: test_an_explicit_rootfs_is_appended_verbatim_and_reads_no_file
    binds:
      - "BoxSpec.domain.distinguished[rootfs_set]"
      - "interacts(_create_argv->docker_run)"
      - "interacts(_render_argv->docker_run)"
    forks: "silent #94 (auto, carried as 45-dispositions R2: a REAL-daemon test pins image_tag(DEFENDER), never the stock name)"
  - id: no_stock_image_fallback
    kind: negative      # positive control: box_rootfs_resolves_to_the_mounted_trees_image
