    assembly_note: "+`docker_run.domain.distinguished[pull_never]` — the seed's `no pull` half is JF5's flag (a create never reaches the network). RE-PINNED (#1095): a missing image is the preflight's `no` and no create runs at all; the `--pull=never` half is pinned on the held-image control in the same test."
    premises: [37, 57]
    rows: "#37 — the opt-out set to a value other than \"1\" is not an opt-out (C8): the loud fault and the remedy fire; #57 — a host daemon reset: the missing-image fault with the remedy; `--pull=never` closes the old silent re-pull of the public tag."
    forks: "ENV #78 (phase F F2, human: minted as `opt_out_warning_carries_the_swallowed_fault`); silent #77 (auto: the investigation driver meets a missing image through the BoxFault text and the run-dir marker — run.py has no handler (P45), so it surfaces as a traceback with a non-zero exit; no wrapper, no run-record field)"
  - id: opt_out_warning_carries_the_swallowed_fault
    kind: domain-outcome
    form: test
    discharged_by: test_the_unsandboxed_opt_out_warning_carries_the_swallowed_missing_image_fault_and_the_build_command
    binds:
      - _opt_out_or_raise
      - "create_fault_remedy.domain.distinguished[missing_image]"
      - start_box
    assembly_note: >-
      MINTED AT PHASE F (F2, human — 92-reconciliation): under `DEFENDER_ALLOW_UNSANDBOXED=1`
      the create fault is swallowed and `start_box` degrades to the host executor, so the one
      surface O4's remedy can still reach is the `[box] WARNING` line on stderr — it carries the
      swallowed fault's message, daemon line and build command included. Not a waiver.
    forks: "ENV #78 (phase F, human)"
  - id: readme_and_fault_name_the_same_command
    kind: coherence
    form: test
    discharged_by: test_the_runtime_readme_documents_the_build_command_the_fault_names_relative_to_the_tree
    binds: [readme_runtime, create_fault_remedy, "interacts(operator->readme_runtime)"]
    assembly_note: "+`interacts(operator->readme_runtime)` — the documented command is the operator's by-hand build (D2, 'When, devcontainer')."
    premises: [56]
    rows: "#56 — the devcontainer rebuilt with the host daemon untouched: the image persists on the host daemon, no rebuild needed (D2); prose, no assertion beyond the README's sentence."
    forks: "DAEMON #62 (auto: image accumulation is developer housekeeping; the README may mention `docker image rm defender-box:<tag>`)"
  - id: spec771_runner_resolves_and_never_pulls
    kind: behavior
    form: test
    discharged_by: test_the_rootfs_runner_names_the_derived_image_with_pull_never_and_its_failure_carries_the_remedy
    binds:
      - "interacts(run_probe_under_profile->docker_run)"
      - image_tag
      - create_fault_remedy
      - "interacts(run_probe_under_profile->BoxSpec)"
      - "interacts(run_probe_under_profile->box_image_on_daemon)"
    assembly_note: "+the runner's read of `BoxSpec.from_env(os.environ).rootfs` (C18/N7: the one test-side `.rootfs` reader) and its `--pull=never` read of the image store. RE-PINNED (#1095): the runner takes the same preflight (`require_image` through its `run=` seam) — a missing image is the preflight's `no`, with no `docker run` attempted."
    premises: [22]
    rows: "#22 — `_spec771`'s runner meets a missing image: its own assertion message carries the remedy (the fourth `docker run` site, INSIDE M5's helper since #1095 — the F8 exception is gone)."
    forks: "O7-SHAPE #69 (auto: no --read-only added to the runner — it mounts nothing)"
  - id: spec771_runner_takes_an_injectable_run
    kind: seam
    form: test
    discharged_by: test_the_rootfs_runner_spawns_docker_through_an_injectable_run_seam_defaulting_to_subprocess_run
    binds: [run_probe_under_profile, "interacts(run_probe_under_profile->docker_run)"]
    assembly_note: >-
      MINTED BY PHASE E (author.md: a dependency the design gives no seam — the runner calls
      `subprocess.run` directly, C18 — has its seam pinned as a demand): `run_probe_under_
      profile(script, profile, *, run=subprocess.run)`. d46 and #0's third site drive the
      runner through it; every real-daemon caller keeps the default.
  - id: drain_lane_fault_names_the_cut_commit
    kind: survival
    form: test
    discharged_by: test_the_drain_lanes_missing_image_fault_names_the_cut_commit_and_a_checkout_instruction_after_cleanup
    binds:
      - drain_worktree
      - "create_fault_remedy.domain.distinguished[missing_image_on_drain_lane]"
      - "interacts(learning_drain->create_fault_remedy)"
      - "interacts(learning_drain->drain_worktree)"
      - "interacts(_render_argv->drain_worktree)"
    assembly_note: >-
      MINTED BY PHASE E from §7's MF2 (human, reading A) — also the R5 survival demand for
      `drain_worktree`'s removed dependents: the workflow that ran through the deleted tree
      (the remedy's `<wt>`) completes via its substitute, a durable pointer appended by the
      drain's own fault arm — `origin/main @ <sha>` (the worktree's HEAD, read before
      `branch.cleanup(wt)`) and the instruction to check out that commit and run the build
      from it — with the shared fault text unchanged and cleanup still run. Driven through
      the REAL `start_box` over the drain's own request with `NoSuchImageDocker`, so the fault
      the drain handles is production's. SCOPE settled at phase F (F1, human): the pointer
      (commit + checkout instruction) rides EVERY drain-lane start BoxFault — a create fault of
      any other shape is unwound and re-raised with the pointer but WITHOUT the build command
      (O4: the command rides the missing-image shape only). Covers #73's pre-Dockerfile main.
    forks: "MF2 (#75, #54 — material, human: reading A; #76, #23 follow); option B (keep the deleted path) and C (do not delete on this fault) rejected; phase F F1 (human): the pointer rides every drain-lane BoxFault, the build command the missing-image shape only"
  - id: dockerfile_header_records_bound_and_cve_ownership
    kind: coherence
    form: clause
    outcome: {nl: "The Dockerfile header states that the CI build step's timeout-minutes is the bound that names a stall in this step, and that base-image CVE updates are this repository's to make because the base is digest-pinned."}
    binds: [box_dockerfile]

  # ---- O7: the boundary does not widen ---------------------------------------------------------
  - id: docker_run_argv_gains_exactly_the_mark_and_pull_never
    kind: negative      # positive control: box_mark_env_on_run_dir_lane / box_mark_env_on_request_lane / start_box_never_builds (the three additions are present)
    form: test
    discharged_by: test_both_docker_run_argv_builders_differ_from_today_only_by_the_marker_env_pull_never_and_the_image_token
    binds:
      - "interacts(_create_argv->docker_run)"
      - "interacts(_render_argv->docker_run)"
      - "docker_run.domain.distinguished[network_none]"
      - "docker_run.domain.distinguished[read_only]"
      - "docker_run.domain.distinguished[pull_never]"
      - "box_env.identity"
    assembly_note: >-
      +`box_env.identity` — the seed's "exactly one `--env DEFENDER_BOX=1` pair" on both
      builders is the S1 root's key-uniqueness assertion for the new key: three writers
      (`infra_env`, `_create_argv`, `_render_env`) land keys into one `--env` set and each key
      must land once (R2 on the shared sink). F28/S16: `--pull=never` is one token, `--runtime X`
      and `--workdir X` stay adjacent.

  # ---- D1's live pin (pre-existing live test, turns green) --------------------------------------
  - id: live_duckdb_probe_turns_green
    kind: behavior
    form: test
    discharged_by: test_the_live_suites_duckdb_startup_probe_exits_zero_in_a_box_from_the_owned_image   # phase E: the live suite's own row (tests/e2e/test_665_box_live.py:192, untouched) RE-SITED as a live-marked sibling in the scanned tests/test_1092_box_image_live.py
    binds: [box_image_contents, "pyproject.domain.distinguished[box]", "interacts(test_665_box_live->BoxSpec)"]
    assembly_note: "+`interacts(test_665_box_live->BoxSpec)` — the live suite's two tmp-workdir requests (:128, :278) pin `rootfs=image_tag(DEFENDER)` (N4/N7, MF1 part 4, applied by phase E): the amendment's 'the live suite calls the same resolver' sentence. RE-SITED: check_binds cannot see tests/e2e/, so the row is repeated as a scanned live-marked test (handoff.deviations)."
    premises: [79]
    rows: "#79 — the live suite before the first build: every row FAULTS (BoxFault with the remedy), none skips — `_real_box_skip_reason` never inspects the image (P43); live-marked, not a CI assertion."
    forks: "SETTLED-BY-DOC #84 (auto: a real-box test on a daemon without the image faults, never skips)"

  - id: real_box_guard_never_inspects_the_image
    kind: behavior
    form: test
    discharged_by: test_the_real_box_guard_skips_on_daemon_topology_and_runtime_only_and_never_on_the_image
    binds: [box_image_on_daemon, "interacts(_start_boxed->box_image_on_daemon)", start_box]
    assembly_note: >-
      MINTED AT PHASE F (91-blind finding 9): the live lane's "a missing image faults, never
      skips" was docstring prose only. Settled premise #84: `_spec771._real_box_skip_reason`
      decides on daemon reachability, DooD coverage and the registered runtime — never the
      image — so a daemon holding no image for this tree reaches `start_box` and FAULTS (d44).
      Green at base by construction (the guard already never inspects the image); it pins the
      guard against growing an image predicate.
    premises: [84]
    rows: "#84 — a real-box test on a daemon without the image FAULTS, never skips (O3 'loudly'; `_real_box_skip_reason` never inspects the image, P43)."

  # ---- §7 waivers: the eight R7 unmoved readers (60-residue.md's waiver-candidates) -------------
  # Each is a human's examined no (70-resolutions.md: "take all 8 in one pass"), minted by
  # phase E as `Demand {form: waiver}` per edge — never a blanket boundary waiver — each citing
  # the claim its "unaffected" reading rests on; `gate.holes` points at these via `resolved_to`.
  - id: waive_test_540_reads_rootfs_as_self_equality
    kind: coherence
    form: waiver
    outcome: {nl: "test_540_box_boundary.py:880 reads BoxSpec.rootfs only for `levered.rootfs == default.rootfs`, both None under this delta — a self-equality that cannot disagree with the new shape, so no coherence test is minted for this reader."}
    binds: ["interacts(test_540_box_boundary->BoxSpec)"]
    cites: [S11]
  - id: waive_test_540_asserts_the_allowlist_itself
    kind: coherence
    form: waiver
    outcome: {nl: "test_540_box_boundary.py:110,790 asserts exact-set equality against the BOX_ENV_ALLOWLIST constant itself, so it moves with the constant automatically and is never left on an old copy; the existing test IS the coherence check."}
    binds: ["interacts(test_540_box_boundary->BOX_ENV_ALLOWLIST)"]
    cites: [S15]
  - id: waive_run_investigation_host_venv_reexec
    kind: coherence
    form: waiver
    outcome: {nl: "run.py's hand-rolled venv re-exec is host-side only and upstream of the shims: it never reads the DEFENDER_BOX mark this delta introduces, so the changed value cannot reach it and no coherence test is minted for this reader."}
    binds: ["interacts(run_investigation->host_venv)"]
    cites: [C5, S1]
  - id: waive_learning_loop_host_venv_reexec
    kind: coherence
    form: waiver
    outcome: {nl: "loop.py's hand-rolled venv re-exec is host-side only, host_venv's other non-shim reader in S1's census, and not on the changed marker's read path; no coherence test is minted for this reader."}
    binds: ["interacts(learning_loop->host_venv)"]
    cites: [C5, S1]
  - id: waive_test_631_selects_pytest_steps_only
    kind: coherence
    form: waiver
    outcome: {nl: "test_budget_seams_631.py:527 selects ci.yml steps by matching `pytest tests/` in the run text; the build step has no such text and is structurally invisible to that selector, so no coherence test is minted for this reader."}
    binds: ["interacts(test_budget_seams_631->ci_yml)"]
    cites: [S6, C11]
  - id: waive_test_771_counts_runsc_install_steps_only
    kind: coherence
    form: waiver
    outcome: {nl: "test_771_alias_ban.py:757 censuses ci.yml steps whose run text contains `runsc install` (count == 3); the build step adds no such line, so this reader's count is unaffected by construction and no coherence test is minted for it."}
    binds: ["interacts(test_771_alias_ban->ci_yml)"]
    cites: [S6, C11]
  - id: waive_dockerfile_runtime_syncs_the_devcontainer_lock
    kind: coherence
    form: waiver
    outcome: {nl: "Dockerfile.runtime is the devcontainer image, not the box image: it syncs the plain project from the same lock into /workspace/defender/.venv, and this delta changes only the BOX's sync flags, so its read of uv.lock needs no coherence test."}
    binds: ["interacts(dockerfile_runtime->uv_lock)"]
    cites: [S5, C9]
  - id: waive_dockerfile_runtime_syncs_the_devcontainer_pyproject
    kind: coherence
    form: waiver
    outcome: {nl: "Dockerfile.runtime's read of pyproject.toml is the same devcontainer-only sync path as its read of uv.lock — a different artifact from the box image, confirmed by census — so no coherence test is minted for it."}
    binds: ["interacts(dockerfile_runtime->pyproject)"]
    cites: [S5, C9]

structure:
  # THE AXIS REGISTRY — every `key_axes` / `interpolates` / `fn_of` below is one of these.
  #   env_key     — the key of one `--env K=V` pair (S1: the allowlist is the key set)
  #   hash_inputs — the byte content of the three files in the mounted defender dir (S2/S3)
  #   tag         — the `defender-box:<12 hex>` token, a projection of hash_inputs
  axes: [env_key, hash_inputs, tag]

  actors:
    # --- the change's own actors (provenance: design) -----------------------------------------
    - {id: image_tag,               frame: leg,         provenance: design}   # runtime/box/_image.py::image_tag(tree) — reads the three files' bytes; stdlib-only, no sibling import (G22)
    - {id: box_image,               frame: leg,         provenance: design}   # defender/scripts/box_image.py — `tag` | `build`; loads _image.py BY FILE PATH; a subprocess of GitHub's runner / the operator's shell (cross-process edge, brief floor)
    - {id: _create_argv,            frame: leg,         provenance: design}   # _lifecycle.py:35-65 — run-dir lane argv; C46 loop :46-47 BEFORE the image token :64; env_pairs indexed per allowlist key :62-63
    - {id: _render_argv,            frame: leg,         provenance: design}   # _lifecycle.py:175-204 — request lane argv; C46 per mount :188-191 BEFORE the image token :203
    - {id: _render_env,             frame: leg,         provenance: design}   # _docker.py:75-84 — locale ← caller's allowlisted keys (value-blind) ← derived infra keys; M6 spreads the mark AFTER the caller's keys (JF3)
    - {id: _host_fallback_env,      frame: leg,         provenance: design}   # _lifecycle.py:301-320 — the unsandboxed request lane's env; JF3: STRIPS DEFENDER_BOX from what it copies
    - {id: run_env,                 frame: leg,         provenance: design}   # run_common.py:132-146 — the unsandboxed run-dir lane's env from os.environ; JF3: strips the key
    - {id: _start_boxed,            frame: leg,         provenance: design}   # _lifecycle.py:120-172 — the run-dir lane's create-fault site :152-159 (marker, reap, BoxFault) → M5's helper
    - {id: _start_boxed_request,    frame: leg,         provenance: design}   # _lifecycle.py:218-276 — the request lane's create-fault site :248-255
    - {id: start_box,               frame: composition, provenance: design}   # _lifecycle.py:323-368 — dispatches the two lanes; the opt-out arm; never builds (D2 C)
    - {id: run_probe_under_profile, frame: leg,         provenance: design}   # tests/e2e/_spec771.py:331-355 — the fourth `docker run <rootfs>` site: no mount, no env, script on stdin (C18)
    - {id: bash_exec_entrypoint,    frame: leg,         provenance: design}   # bash_exec._run_box_entrypoint :628-664 — the box's process; re-filters os.environ by the allowlist :645; M7 drops its docstring paragraph
    - {id: defender_sql_shim,       frame: leg,         provenance: design}   # bin/defender-sql:9-11 — [-x venv python] else python3; M6: bare python3 when marked; sql.py:171-180's remedy follows the lane
    - {id: defender_invlang_shim,   frame: leg,         provenance: design}   # bin/defender-invlang:6-9
    - {id: defender_lessons_shim,   frame: leg,         provenance: design}   # bin/defender-lessons:7-10 — its scripts also self-re-exec through reexec_into_venv (C16)
    - {id: reexec_into_venv,        frame: leg,         provenance: design}   # scripts/_venv.py:12-21 — os.execv into defender/.venv/bin/python3 when is_file(); M6: returns early when marked
    - {id: box_dockerfile,          frame: leg,         provenance: design}   # defender/box.Dockerfile AS THE BUILD-TIME READER: COPY defender/pyproject.toml + defender/uv.lock, sync into /usr/local (dual-listed — see boundaries)
    - {id: BoxSpec,                 frame: leg,         provenance: design}   # runtime/box/_spec.py:39-60 AS THE IMPORTER of defender._model (M7 port) (dual-listed — see boundaries)
    # --- the grounded neighbourhood (provenance: code) — what reality imposes -----------------
    - {id: run_investigation,       frame: composition, provenance: code}     # run.py:348 `start_box(run_dir, defender_dir)` — production starter #1; hand-rolled venv re-exec :28-31
    - {id: learning_drain,          frame: composition, provenance: code}     # learning/core/drains.py:776 `start_box(_drain_box_request(wt, …))` inside try/except BaseException: branch.cleanup(wt); raise (F22/S14)
    - {id: learning_loop,           frame: composition, provenance: code}     # learning/loop.py:10-12 — the loop's hand-rolled venv re-exec; drives the drain
    - {id: cli,                     frame: composition, provenance: code}     # learning/branch/cli.py — the episode launcher: re-executes run.py as a SUBPROCESS (spec-graph actors); the child run.py derives DEFENDER_DIR from its own __file__, so it hashes and mounts the tree it sits in (the one rule holds per process)
    - {id: generate_case,           frame: composition, provenance: code}     # evals/oracle_golden/generate_case.py — re-executes run.py (+ controls, story_from_run, ticket_adapter) to mint a golden case; same per-process anchoring; a launcher on tree A driving tree B's run.py needs B's image on the daemon, and the remedy names B
    - {id: github_runner,           frame: composition, provenance: code}     # ubuntu-24.04: Python 3.12.3, Docker 28.0.4, no uv (G5/F14); runs ci.yml's steps at the checkout root (F26); three box jobs on three cold runners
    - {id: operator,                frame: composition, provenance: code}     # the devcontainer operator: `python3 defender/scripts/box_image.py build` by hand over the socket (D2/M5)
    - {id: infra_env,               frame: leg,         provenance: code}     # _docker.py:52-61 — DEFENDER_DIR/RUN_DIR/RUNS_BASE/PATH/PYTHONPATH for the run-dir lane (profile box_env writer; unchanged)
    - {id: test_540_box_boundary,   frame: composition, provenance: code}     # tests/e2e/test_540_box_boundary.py — reads BoxSpec fields/:880 rootfs equality (S11), asserts box env == allowlist :790 (S15), executes the repertoire :1019 (d35 extends it)
    - {id: test_665_box_live,       frame: composition, provenance: code}     # tests/e2e/test_665_box_live.py — live-marked; 13 two-arg starts + 3 requests, two over tmp workdirs (:128, :278) (G26/N4)
    - {id: fake_tree_test_sites,    frame: composition, provenance: code}     # the 18 fake-docker sites of S12/F21: test_box_dood_c46.py ×15, test_1047_archive_record.py:308, test_771_alias_ban.py:143, test_665_box_geography.py:122 — MF1 part 4 migrates 11 of them
    - {id: test_1067_model_port,    frame: composition, provenance: code}     # tests/test_1067_model_port.py:443-461 — the closure pin test's home; M7 removes the test
    - {id: lint_stale_refs,         frame: leg,         provenance: code}     # scripts/lint/lint_stale_refs.py — greps the working tree for a removed `def` name (F27/S17)
    - {id: test_ci_gvisor_bounds_937, frame: leg,       provenance: code}     # tests/test_ci_gvisor_bounds_937.py:170-189 — strict per-job step-sum; runsc census == 3 (G20)
    - {id: test_budget_seams_631,   frame: leg,         provenance: code}     # tests/test_budget_seams_631.py:527 — selects steps by `pytest tests/` in run-text; a build step is invisible to it (C11/S6)
    - {id: test_771_alias_ban,      frame: leg,         provenance: code}     # tests/e2e/test_771_alias_ban.py:757 — the `runsc install` step census over ci.yml (S6)
    - {id: dockerfile_runtime,      frame: leg,         provenance: code}     # .devcontainer/Dockerfile.runtime:43-49 — syncs the same lock pair into /workspace/defender/.venv; "not the box image" (C9)

  boundaries:

    # ===== the resolver and its inputs ==========================================================
    - id: image_tag
      provenance: design
      # runtime/box/_image.py::image_tag(tree: Path) -> "defender-box:<sha256[:12] over the
      # BYTES of tree/box.Dockerfile + tree/uv.lock + tree/pyproject.toml, fixed order,
      # separated>" — `tree` is the DEFENDER dir (F-D, N5). Called by both argv builders and the
      # _spec771 runner when `rootfs is None`; loaded by file path by the build script. The
      # domain is THE SHAPE OF THE TREE THE RESOLVER MEETS. Three members are UNBOUND on
      # purpose (MF1 ×2, MF3) — the gate names them; §7 decides the root.
      facets:
        domain:
          type: path
          refinement: {nl: "The defender dir the box is about to mount, as the resolver finds it: complete, missing a file, holding an unreadable entry in a file's place, lacking the files AND invisible to the daemon (DooD), or carrying a `_image.py` whose recipe differs from the running package's."}
          default: complete-tree
          distinguished: [complete-tree, missing-input, unreadable-input, lacking-inputs-and-uncovered, recipe-drift]
          falsy_valid: false
          documented_alternatives: []
    - id: box_dockerfile
      provenance: design
      # defender/box.Dockerfile (M1, F1) — a hash INPUT (so an edit renames the image) and the
      # instruction set the shape demands pin. `ensurepip_removal` is UNBOUND (MF4): G17/F23
      # executed after F1 show the base's `ensurepip/_bundled/*.whl` survive the pip/setuptools/
      # wheel uninstall. Dual-listed: as an actor it is the build-time COPY reader.
      facets:
        domain:
          type: str
          refinement: {nl: "The instructions O8/O7 key on: the FROM digest pin, the uv binary COPY pin, the sync line's flags (+UV_COMPILE_BYTECODE=1), the post-sync installer removal, and the ensurepip wheel removal MF4 asks for."}
          default: "FROM python:3.11-slim@sha256:<64 hex>"
          distinguished: [base_digest, uv_pin, sync_flags, installer_removal, ensurepip_removal]
          falsy_valid: false
          documented_alternatives: []
    - id: uv_lock
      provenance: design
      # defender/uv.lock — hash input #2 (S3); gains the `box` extra's resolution (F11: three
      # hunks, no version moves; G23: `provides-extras` lacks `box` at base). Readers: the
      # resolver, the Dockerfile's COPY, five CI syncs (three go `--locked`), Dockerfile.runtime.
      facets: {}
    - id: pyproject
      provenance: design
      # defender/pyproject.toml — hash input #3; M2 adds `[project.optional-dependencies] box =
      # ["duckdb"]`. `runtime` is the documented alternative D1 REJECTS for the box (ships
      # anthropic/openai/mcp); it stays valid for the host venv, so it crosses nothing.
      facets:
        domain:
          type: str
          refinement: {nl: "The optional-dependency extras a sync may select: `box` is the one the Dockerfile syncs; `runtime` is the host venv's and never enters the image (d19)."}
          default: box
          distinguished: [box]
          falsy_valid: false
          documented_alternatives:
            - {value: runtime, crosses_validation: false}   # `uv sync --extra runtime` is the host venv's own line (ci.yml:56,213,414); D1 rejects it for the image, it does not fail there
    - id: dockerignore
      provenance: code
      # the repo-root `.dockerignore` (G11/F17): excludes .git, **/.venv, .env, .ssh, runs, … —
      # applies only because the build CONTEXT is the repo root (`<defender_dir>.parent`).
      facets: {}

    # ===== the script's surface ==================================================================
    - id: box_image
      provenance: design
      # defender/scripts/box_image.py's two verbs, reached from the CI runner's bare python3
      # 3.12 and the operator's shell. Both derive the tree from `__file__` (F-B/F26); both are
      # stdlib-only (N10: no __init__.py under defender/scripts). Dual-listed: as an actor it
      # reads the Dockerfile, loads `_image.py` by path and invokes `docker build`.
      facets:
        access:
          constraints_by_via:
