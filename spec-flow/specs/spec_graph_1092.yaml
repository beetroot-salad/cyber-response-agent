      # sit under `<wt>/defender/{lessons,lessons_questioner,skills}` and are deleted with the
      # worktree (F22). The existing C46 refusal (raised inside the argv builder) writes NONE.
      # `resolver-refusal` — whether a resolver refusal writes one — is UNBOUND (MF1 #80).
      facets:
        domain:
          type: str
          refinement: {nl: "The startup fault arms that leave (or do not leave) the marker; only the arm the delta adds is a member here."}
