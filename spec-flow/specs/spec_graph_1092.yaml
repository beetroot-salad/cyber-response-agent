gate:
  # `spec-graph gate --residue` computed 53 firings (R1 4, R2 2, R3 4, R4 30, R5 2, R7 11).
  # Bare `spec-graph gate` (no --residue, before this block existed) read 24 findings: 9
  # missing `evaluated` entries + 15 UNANSWERED (6 R4 cells, R5 `drain_worktree`, 8 R7 unmoved
  # readers). The other 38 firings were ALREADY mechanically answered: `check_gate.py`'s
  # `Graph.answered` matches a `form: test` demand's bind against a firing's root+facet, and a
  # bind with NO facet suffix (a bare edge, e.g. `interacts(_create_argv->docker_run)`) matches
  # ANY facet on that same root — so an existing `kind: behavior`/`negative`/`domain-outcome`
  # demand already answers an R1 `.payload` or R3/R2 facet firing on the same edge. rules.md's
  # prose names `kind: shape`/`uniqueness`/`parity` as each rule's OBLIGATION CONTENT, not a
  # field the mechanical predicate itself gates on — confirmed empirically (bare `gate` run
  # below, before this block existed) rather than re-derived from the prose alone. All 53 are
  # recorded below for the ledger; only the 15 the tool leaves open get a NEW routing decision
  # (holes / waiver-candidates) — none of the 15 is a fresh test-writable obligation: each is
  # gated on a §7 decision the demand cannot be minted ahead of, or is a reader the evidence
  # already says is unaffected, pending the human's sign-off. Full typed list, plain-words
  # witnesses and trade-offs: 60-residue.md.
