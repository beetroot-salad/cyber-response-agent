    - "J1 [material; = phase-A F5] — IS `H` VALIDATED, AND WHAT IS THE GRADE WHEN IT IS NOT? `H` is `discriminator['holding_system']`: unvalidated model text, two occurrences in the whole tree, zero production readers, and nothing holding it to `envelope.system` or to the seven-name served roster (A7/G13/C4). Every per-world fact is keyed on `system == H`, so a bogus or absent H sends EVERY non-control world to lead-set, which makes every verdict-mismatch a `survived` family — the word that AUTHORS a lesson. The judge's recommendation: validate at manifest load (present, non-empty, a member of STAGERS | PATCHABLE_SYSTEMS after strip+casefold) and refuse otherwise, because not validating fails silently and authoring-actively while validating fails loudly at a step a human already reviews; and spell 'H names a system this world never touches' as its own row (`not _touches -> PASSTHROUGH`, G7), distinct from 'never queried'. Carried as `family_manifest.access[questioner_authored].constraints: unknown`. resolved_by: HUMAN at §7 (`70-resolutions.md`) — VALIDATE AT LOAD, REFUSE: present, non-empty, a member of the seven served-system names after strip+casefold. Minted as `holding_system_is_validated_at_manifest_load`; the `not _touches -> PASSTHROUGH` row is spelled in `bucket_lead_quality`"
    - "J2 [material; = phase-A F7] — WHICH ROW POPULATION IS 'rows in X's ledger with system == H'? The file interleaves X's own decision rows (world_id == X) and family-tier `base` rows (world_id: null) written into X's own file for keys the capture never held; one live call to H writes BOTH (G3/A2). Existence predicates survive either reading; counts and the `source in {staged, patched}` test do not, and on a doctored run the base rows are numerous. The judge's recommendation: filter on the world's composed token first (G5), then read `source`, and classify a `base`-sourced H row as evidence of a family-tier read, contributing to neither `holding_queried` nor 'a doctored answer was served'. Carried as the two `ledger_source.domain.alternatives` and as `ledger_source.domain.distinguished[base]`. resolved_by: AUTO at §7 to the judge's recommendation, recorded so a merge-gate reader can overturn it — filter on the world's composed token first, then read `source`; a `base`-sourced H row is a family-tier read contributing to neither `holding_queried` nor 'a doctored answer served'. Carried by `holding_queried_from_x_own_ledger`"
