schema_version: 2
design: "921"   # gh issue #921. THE AUTHORITATIVE TEXT IS THREE COMMENTS READ IN ORDER: the
                # 09-03 09:31 intent+design doc, the 09-03 16:18 PROBED ENTRY-POINT SUPPLEMENT,
                # and the 09-03 18:45 AMENDMENT settled with the human, which SUPERSEDES the
                # bucket table and mechanism N8 and leaves the rest of the design standing.
                # Assembled from `.spec-flow/frontiers/00-design-doc.md`, which carries all three.
tests: defender/tests   # the suite this graph derives (project profile, `tests.dir`).
                        # check_binds scans its docstrings; every `discharged_by` below names a
                        # test that does not exist yet — the expected phase-D state.
base: d1b8b06a          # main. write-code-from-spec's gate diffs against it. MOVED at the
                        # human seam (J16): 9f4e8247 -> d1b8b06a, one commit that adds ONLY
                        # `experiments/judge-context-921/` and moves no census. The port
                        # source M1 cites and the fixture seed M9 cites are therefore
                        # COMMITTED addresses now, not untracked working-tree state — G10's
                        # finding was true at the old base and is resolved at this one, so a
                        # demand MAY bind an address inside that tree.

# ===========================================================================================
# READ THIS FIRST
#
# THE CHANGE, as the amendment leaves it. A family judge: one model call per archived world
# per draw over the joined views, plus an OFFLINE mechanical pass that grades each world from
# its OWN archived record, plus an appender into the existing findings queue.
#
#   M1  learning/judge/render.py — the four joined views (per-lead chain, coverage with window
#       and scope key, sibling trials by alert_id, lessons loaded, trial spread), every
#       model-authored body framed untrusted, every sibling world marked counterfactual and
#       its overlay withheld.                                              (O4, O5, O8, O9, N10)
#   M2  learning/judge/run.py — one `run_stage` call per (world, draw) under the QUESTIONER
#       key with `agent_id="judge:<X>:<n>"`; lenient parse, then strict validation into
#       `JudgeReply`; `write_guarded` into `worlds/<X>/judge/<n>.yaml`.     (O1, O4, O8, O9, D2, D4)
#   M3  learning/judge/family.py — the mechanical half and `episodes/<id>/judge.yaml`. (O3, O7)
#   M4  defender/_vocab.py::JUDGE_OUTCOME_ENUM + its normalizer.                    (O2, D1)
#   M5  learning/judge/enqueue.py — twelve-key rows appended under `queue_lock`; refuses
#       `discard` / `corpus-contradiction`; `decision-discipline` joins
#       QUEUEABLE_FINDING_TYPES.                                                (O6, O7, N6)
#   M6  learning/author/lessons/run.py::_gate_family — a PARTITION inside the channel's one
#       gate, not a second gate.                                                (O2, D6)
#   M7  learning/branch/archive.py — three more per-world inputs (`gather_summaries/`,
#       `lessons_loaded.jsonl`, `alert.json`).                                  (O8, D7)
#   M8  the 08-16 fixture, AMENDED: it must now carry a world with a `staged`-served row on H
#       and a wrong verdict, or it cannot tell a correct implementation from a degenerate one.
#   M9  the judge's own fixture references (D5).
#
# *** THE AMENDMENT'S MECHANICAL HALF — the part that replaced the refuted bucket table. ***
# Five per-world facts, ALL read off X's own archived record plus the manifest, NO comparison
# with any other world and NO comparator call:
#     holding_queried            rows in X's ledger on the family's holding system H
#     scope_discriminated        those rows' params (index, window, scope key)
#     a doctored answer served   those rows' `source` in {staged, patched} vs
#                                {passthrough, refused, fault}
#     resolution_moved           a `:T resolutions` row past `fences_at` with before != after
#     verdict vs declared        X's archived report against `disposition_declared`
#
# WHAT IS STRUCK AND MUST NOT REACH A TEST DOCSTRING OR A RATIONALE:
#   * THE ORIGINAL BUCKET TABLE and N8 — deleted by the amendment. `delta_o`, the
#     mutation/undeclared membership test, the offline comparator lane and every "post-branch
#     key" predicate leave this issue's path entirely. `delta_o` survives in the tree as a
#     manipulation check on the EPISODE; #921 does not consume it (demand
#     `family_pass_makes_no_comparison` pins that as a negative).
#   * run-1's G20 — "a world's ledger file is written by `_base_payload`'s MISS arm alone".
#     REFUTED (G2/A1): `served`'s tail `ledger.record(...)` fires on every successful serve,
#     memo hit and live call alike, and the failure handlers record their own rows. Anything
#     inheriting run-1's sentence builds the wrong reader.
#   * N9's second half — "its ΔO is reported as the [noise] floor" — reads off a mechanism the
#     amendment deleted. RESOLVED as fork F3 at §7: the floor goes with the mechanism — it is
#     re-expressed in ledger terms or dropped, and may not cite a mechanism this design no
#     longer consumes. Carried as a clause; no demand asserts the deleted reading.
#
# WHERE THIS RUN STANDS. The human seam has RUN. All 15 decisions are resolved in
# `70-resolutions.md` — 8 by the human, 7 auto-resolved to the judge's recommendation and
# recorded so a merge-gate reader can overturn them — plus J7 (closed by executed probe before
# the seam), the two unpremised phase-A forks F3/F4, and the NEW fork A5's refutation raised
# (closed by J5's tier rule). `handoff.forks` carries each reading taken beside the question it
# answers. Every reading landed either in a demand above or in a `handoff.forks` line, and the
# `unknown` invariant slots the assembly left are now FILLED from those readings (phase F,
# finding 8) rather than left disagreeing with `70-resolutions.md`. Phase E minted 13 demands
# for the readings no existing demand carried; phase F minted 2 more (F-3's colliding label,
# F-11's torn tail) and 1 clause (F-6). A SECOND SEAM HAS ALSO RUN: `70-resolutions.md`'s
# "Round 2" resolves the ten findings the cold reconciler returned. `gate:` is the gate leaf's.
#
# THE ONE THING A READER SHOULD DISTRUST MOST. The amendment's central mechanism — that the
# ledger's `source` column is a per-call host-attested fact about what the defender saw — is
# READ-ESTABLISHED AND HAS NEVER BEEN EXECUTED. A1, A2 and G2 are `behavior` claims closed on
# a code read, and they are carried here as `unprobed` for exactly that reason. Nine of the
# ten `46-reground.md` probes are quoted source, not execution, however the frontier's digest
# reads ("all 10 probes executed"): only P1 ran anything. Every such claim is typed by what it
# predicts and carries the instrument actually used, so the gate leaf can route the probe
# obligations rather than inherit a plausible sentence. THIS IS THE LEDGER'S WHOLE POINT.
#
# NAME RECONCILIATION (grounding, demand extraction and the dispositions' address derivations
# coined ids independently; this is the unification, keyed by role+origin):
#   * CLAIM IDS DO NOT COLLIDE THIS RUN, and that is deliberate: `10-brief.md` numbers its own
#     claims G1-G18, `20-demands.md` numbers A1-A10, `46-reground.md` P1-P10, and the design
#     doc's inherited ledger is C1-C19 (C2 split into C2a/C2b). The REFUTED RUN's claims are
#     carried under their ORIGINAL numbers with a `run1/` prefix (`run1/G16`, `run1/E7`) —
#     the brief's own convention, and the two G-sets are unrelated and must never be merged.
#     `run1/E*` are the 11 entry-point probe claims the design's supplement rests on.
#   * `H` is `family.yaml`'s `discriminator["holding_system"]`. It is spelled `H` in the
#     amendment, `holding_system` in the prompt that asks for it, and NOWHERE ELSE in the tree
#     (A7/G13). The graph keys it on the manifest boundary, never on a private synonym.
#   * THE WORLD IS NAMED TWICE AND THE TWO NAMES ARE DIFFERENT KEYS (G5, material). The
#     ARCHIVE is keyed on the SHORT manifest label (`worlds/<X>/`); the LEDGER on the composed
#     token `world_token_for(episode_token_for(id), label)`. The axis registry declares
#     `world_label` and carries `world_token` as an INJECTIVE derivation of it, so a reader
#     that opens `served/<label>.jsonl` is a coverage finding rather than a silent miss.
#   * The mechanism the brief calls "the new ledger reader" is coined against `ledger.py`'s own
#     names (`ServedCall`, `source`, `world_id`) — G15's instruction, and the reason
#     `ledger_source` is a boundary of its own rather than a field of `served_ledger`.
#   * `learning/judge/` COLLIDES BY NAME with the existing `learning/pipeline/judge/` until
#     #922 deletes the latter (fork F8, open). Actor ids here are the mechanism names
#     (`judge_render`, `judge_run`, `judge_family`, `judge_enqueue`), which survive a rename.
# ===========================================================================================

demands:

  # =========================================================================================
  # #0 — THE RETURN-VALUE CONTRACT. The chain has no single return value; its observable
  # contract is WRITTEN ARTIFACTS. Still PROVISIONAL on fork F1 (= J10): the supplement
  # settles the SHAPE (one flat command, `cli.py::main` -> `_launch` -> `_run_episode`, zero
  # subparsers, the judge a call after `verify_family` at :1204 — run1/E1, run1/E3, run1/E7)
  # and leaves the FRAME open (`_run_episode`'s tail at :1206 vs `_launch`'s post-teardown
  # path). A9 removes the amendment's stated reason for preferring the latter: every sibling
  # is waited for before the archive step, so no container is live either side of the slot.
  # =========================================================================================

  - id: D0_return_contract
    kind: behavior
    form: test
    provisional: true          # F1/J10 — the frame, not the shape
    source: "demand #0; 20-demands.md"
    binds:
      - 'interacts(judge_family->episode_judge_yaml)'
      - 'interacts(judge_run->world_judge_dir)'
      - 'interacts(judge_enqueue->findings_jsonl)'
      - 'interacts(judge_render->episode_dir)'
      - 'drives(judge_episode->judge_family)'
    discharged_by: test_921_episode_grade_is_the_artifacts_the_launcher_leaves
    seed_docstring: >-
      Driving the launcher over an accepted episode leaves exactly three artifact sets and
      returns nothing that carries the grade: `worlds/<X>/judge/<n>.yaml` one per world per
      draw, `episodes/<id>/judge.yaml` once, and one appended row per finding in
      `findings.jsonl`. `render` is the one pure function whose RETURN is the contract (a
      `JudgeInput`); the family pass returns the `FamilyGrade` it writes and the enqueue
      returns the appended-row count, the shape `_io.append_jsonl(path, rows) -> int` already
      has. Drive `cli.main([...])` through its injected seams, never by monkeypatch
      (run1/E9, run1/E10).
    note: >-
      F1/J10 SETTLED at §7 (human): the TAIL of the step runner, after the archive step and
      before the return. Which frame calls the judge decides what the suite drives and what the
      judge can still see, so the choice is stated here rather than smuggled in through a
      fixture: every drive point in the suite follows from this one.

  # =========================================================================================
  # O1 — every finding names a hand-off and points at bytes in the archive it was graded from.
  # J13(a) SETTLED at §7 sits under all four: O1 states its FAILING MODE episode-scoped
  # ("pointers resolve inside episodes/<id>/") while its RULE says "the archive it was graded
  # from", and the human took the RULE — pointers are scoped to the GRADED WORLD's own subtree,
  # which is what O5 exists for.
  # =========================================================================================

  - id: finding_pointers_resolve_in_episode
    kind: behavior
    form: test
    source: "O1"
    binds: ['interacts(judge_run->world_judge_dir).payload', 'finding_evidence.domain.distinguished[resolving]']
    discharged_by: test_921_finding_whose_pointers_all_miss_the_episode_is_dropped_and_counted
    seed_docstring: >-
      A finding none of whose evidence pointers resolves inside the archive is DROPPED, and
      the drop is COUNTED on the reply record — a silent drop is indistinguishable from a
      finding the model never emitted. Paired with the positive control that a finding with
      one resolving pointer survives.
    note: >-
      J13(a) SETTLED at §7 (human): GRADED-WORLD-SCOPED. Evidence pointers are scoped to the
      graded world's own subtree, not to `episodes/<id>/` — a pointer landing in a sibling
      world's archived bytes is a finding about the wrong world, and O5's whole purpose is
      behind the narrower reading.

  - id: finding_unresolved_pointer_recorded
    kind: behavior
    form: test
    source: "O1; flow 1"
    binds: ['finding_evidence.domain.distinguished[not-pointer-shaped]']
    discharged_by: test_921_pointer_resolving_nowhere_is_recorded_on_the_finding
    seed_docstring: >-
      A single pointer that resolves nowhere — prose, a URL, a lesson name, a sibling trial id
      — is RECORDED on the finding rather than dropping it, and the finding stands as long as
      one other pointer resolves. Prose and a URL are the two shapes to exercise: neither is
      pointer-shaped at all (dispositions §1).

  - id: an_escaping_evidence_pointer_does_not_resolve
    kind: negative
    form: test
    source: "45-dispositions §1 (consensus): finding_evidence_pointer_escapes_the_episode"
    binds: ['finding_evidence.domain.distinguished[escaping]', 'finding_evidence.access[pointer_resolution]']
    discharged_by: test_921_a_pointer_climbing_out_of_the_episode_does_not_count_as_resolving
    seed_docstring: >-
      A pointer that climbs out of `episodes/<id>/` — `../`, an absolute path, a symlink whose
      target is outside — does NOT count as resolving, whatever bytes exist at the target.
      Positive control: the same finding with an in-tree pointer is kept.

  - id: finding_carries_bucket
    kind: behavior
    form: test
    source: "O1"
    binds: ['finding_bucket.domain.distinguished[absent]', 'finding_bucket.domain']
    discharged_by: test_921_finding_with_no_bucket_is_refused
    seed_docstring: >-
      A finding carrying no bucket fails `JudgeReply` validation before anything reads it; the
      refusal names the field.

  - id: a_lookalike_bucket_is_rejected_never_normalized
    kind: domain-outcome
    form: test
    source: "45-dispositions §1 (consensus): finding_bucket_is_a_lookalike_of_a_vocabulary_member"
    binds: ['finding_bucket.domain.distinguished[lookalike]']
    discharged_by: test_921_a_lookalike_bucket_is_rejected_not_coerced_to_the_nearest_member
    seed_docstring: >-
      A bucket that is a lookalike of a vocabulary member (`lead_set`, `Lead-Set`,
      `analyze discipline`) is outside the closed vocabulary and the finding is REJECTED,
      never coerced to the nearest member. The asymmetry is deliberate and it is what the
      design states: D1 ships a normalizer for `JUDGE_OUTCOME_ENUM` only, and the bucket
      vocabulary has none.

  - id: finding_not_a_restated_close
    kind: coherence
    form: clause
    source: "O1"
    outcome:
      nl: >-
        A finding that restates the graded world's own `:T conclude` row is not a finding the
        judge emits; the instrument that says so is the model grader with mechanical checks as
        context (D5), measured at 2.0-2.8 false findings per reply on the arm without the
        joined views (C9).
    binds: ['judge_prompt.payload', 'fixture_corpus']
    rejected:
      - nl: >-
          Detecting the restatement mechanically — a string compare against the world's own
          conclude row. The experiment's instrument is a graded reference, not a matcher, and
          a mechanical version would pin a weaker property than the one measured.

  # =========================================================================================
  # O2 / D6 — the findings channel's family gate. The channel has ONE gate over the whole
  # batch (run1/G5), so `_gate_family` is a PARTITION inside `_gate_findings`, not a second
  # gate. J12 SETTLED at §7 sits downstream of every row this mints: family rows are EXEMPT
  # from the forward check, and the writer refuses a family row lacking `run_id`/`direction`.
  # =========================================================================================

  - id: family_row_passes_its_own_gate
    kind: behavior
    form: test
    source: "O2, D6"
    binds: ['interacts(_gate_family->findings_jsonl)', 'findings_jsonl.identity']
    discharged_by: test_921_family_row_is_not_held_as_no_ground_truth
    seed_docstring: >-
      A `direction: family` row with no `source_refs.yaml` behind it is ADMITTED by
      `_gate_family` on the ground truth the family record carries (`disposition_declared`),
      where `_gate_findings` would hold it `no_ground_truth` forever (run1/G6). The held-forever
      state is the observable to drive against, not a mocked gate.

  - id: family_gate_is_a_partition_inside_the_channel_gate
    kind: parity
    form: test
    source: "O2, D6; run-1's F2, settled by the amendment"
    binds: ['interacts(_gate_family->findings_jsonl)', 'findings_jsonl.access[lessons_batch]']
    discharged_by: test_921_mixed_batch_routes_family_rows_and_leaves_the_rest_to_gate_findings
    seed_docstring: >-
      One tick's batch carrying family rows AND adversarial/benign rows routes each population
      by its own rule and neither disturbs the other: the family rows take the family partition,
      the rest take `_gate_findings` unchanged. A mixed batch is the designed shape, not an
      edge case — the channel gate is called once per tick over every keyed row of the file.

  - id: gate_family_survived_authors
    kind: domain-outcome
    form: test
    source: "D6"
    binds: ['JUDGE_OUTCOME_ENUM.domain.distinguished[survived]']
    discharged_by: test_921_gate_family_authors_a_survived_row
    seed_docstring: "A family row whose `judge_outcome` is `survived` is admitted for authoring."

  - id: gate_family_caught_and_undecidable_skip
    kind: domain-outcome
    form: test
    source: "D6"
    binds:
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[caught]'
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[undecidable]'
    discharged_by: test_921_gate_family_skips_caught_and_undecidable
    seed_docstring: >-
      `caught` and `undecidable` rows are SKIPPED, not held: a skip is terminal and a hold is
      forever, and the two are different rows in the drain's own report.

  - id: gate_family_idempotent
    kind: uniqueness
    form: test
    source: "D6; P5"
    binds: ['findings_jsonl.identity']
    discharged_by: test_921_gate_family_is_idempotent_over_a_replayed_batch
    seed_docstring: >-
      A row whose `finding_id` already appears in an authored lesson's provenance is consumed
      idempotently and authors no second lesson. The guard keys on `finding_id` EXACTLY — not
      `run_id`, not row content (P5).

  - id: finding_id_is_deterministic_across_retries_and_unique_per_draw
    kind: uniqueness
    form: test
    source: "45-dispositions J7 (closed by re-grounding — the property is forced, not chosen)"
    binds: ['findings_jsonl.identity', 'interacts(judge_enqueue->findings_jsonl)']
    discharged_by: test_921_finding_id_is_stable_across_a_retry_and_distinct_across_world_draw_and_index
    seed_docstring: >-
      Because the idempotency guard keys on `finding_id` alone (P5), the id must be BOTH
      deterministic across a retried enqueue of the same finding AND distinct across every
      (world, draw, finding index). A fresh id per retry floods the corpus; a reused id across
      distinct findings suppresses real ones. Drive both halves: re-enqueue the same reply and
      observe one row's worth of authoring; enqueue two different findings and observe two.

  - id: discard_and_contradiction_never_become_rows
    kind: negative
    form: test
    source: "O2, D6, M5"
    binds:
      - 'interacts(judge_enqueue->findings_jsonl)'
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[discard]'
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[corpus-contradiction]'
    discharged_by: test_921_enqueue_refuses_discard_and_corpus_contradiction
    seed_docstring: >-
      An episode whose `episode_outcome` is `discard` or `corpus-contradiction` appends NOTHING
      to `findings.jsonl` — the refusal is M5's, at the appender, not the gate's. The family
      record is the whole artifact.

  - id: gradable_episode_does_enqueue
    kind: behavior
    form: test
    source: "flow 3; positive control for the negative above"
    binds: ['interacts(judge_enqueue->findings_jsonl)']
    discharged_by: test_921_gradable_episode_appends_one_row_per_finding
    seed_docstring: >-
      The paired positive control: a `gradable` episode appends exactly one row per finding per
      world per draw, so the negative above cannot pass vacuously on a broken appender.

  - id: a_family_row_missing_run_id_or_direction_never_reaches_the_shared_gate
    kind: negative
    form: test
    source: "45-dispositions J12 part 4 (P6)"
    binds: ['interacts(judge_enqueue->findings_jsonl).payload', 'findings_jsonl.payload']
    discharged_by: test_921_enqueue_refuses_a_row_that_would_key_error_the_shared_gate
    seed_docstring: >-
      A row missing `run_id` or `direction` raises a bare `KeyError` inside `_gate_findings`;
      `_tick` stuck-records THE ENTIRE KEYED BATCH — every well-formed adversarial and benign
      row in that tick — and then RE-RAISES (P6). So M5 refuses such a row at the appender and
      the blast radius is one refusal, not one tick of the corpus drain.
    note: >-
      J12 part 4 SETTLED at §7 (human): M5 owns the refusal. The WRITER refuses a family row
      lacking `run_id`/`direction`, so a malformed one never reaches the shared gate whose
      handler stuck-records the whole batch. The blast radius was observed (P6); the contract
      change is now decided.

  - id: the_new_append_site_does_not_trip_the_write_lint
    kind: seam
    form: test
    source: "45-dispositions J7 ('carried to the demand list, not a fork'); run1/G16"
    binds: ['interacts(judge_enqueue->findings_jsonl)']
    discharged_by: test_921_the_judge_appender_writes_through_the_guarded_path
    seed_docstring: >-
      `lint_unguarded_tree_write` resolves `append_jsonl` BY CALLEE and `learning/branch/**`
      carries no baseline entry, so M5's stated mechanism is a NEW blocking finding unless it
      goes through `write_guarded(..., mode="append")` or carries the inline suppression. The
      demand is the guarded path, and the lint run is its witness.

  # =========================================================================================
  # O3 + THE AMENDED MECHANICAL HALF — five facts, no comparison. Every demand in this block
  # sits on top of TWO unresolved decisions: J1 (is `H` validated, and what is the grade when
  # it is not) and J2 (which row population "rows in X's ledger with system == H" names).
  # Both move the bucket. Write the assertions against whichever reading §7 settles; do not
  # smuggle a choice in through the fixture.
  # =========================================================================================

  - id: every_graded_world_has_a_bucket_row
    kind: behavior
    form: test
    source: "O3"
    binds: ['interacts(judge_family->episode_judge_yaml).payload', 'episode_judge_yaml.payload']
    discharged_by: test_921_family_record_carries_a_row_per_graded_world
    seed_docstring: >-
      `episodes/<id>/judge.yaml` carries one row per graded non-control world, each with all
      five facts and its bucket. A graded world with no row is O3's stated failing mode; so is
      a bucket that prose assigned where the ledger could.

  - id: holding_queried_from_x_own_ledger
    kind: behavior
    form: test
    source: "amended table row 1"
    binds: ['interacts(judge_family->served_ledger)', 'served_ledger.identity']
    discharged_by: test_921_holding_queried_reads_x_own_rows_on_H
    seed_docstring: >-
      `holding_queried` is computed from rows in X's OWN ledger file — `episodes/<id>/served/
      <world_token>.jsonl`, joined to `worlds/<label>/` through
      `world_token_for(episode_token_for(episode_id), label)` (G5). A reader that opens
      `served/<label>.jsonl` finds nothing and reads it as a world that served nothing.
    note: >-
      J2 SETTLED at §7 (auto-resolved to the judge's recommendation, `70-resolutions.md`):
      filter on the world's COMPOSED TOKEN first, then read `source`; a `base`-sourced H row
      (`world_id: null`, written into X's own file for keys the capture never held) is a
      FAMILY-TIER read and contributes to neither `holding_queried` nor "a doctored answer
      served". F-1 SETTLED the source-class half the same seam left open: a `refused` or
      `fault`ed H row is a call the defender MADE and the estate did not answer, so
      `holding_queried` is TRUE on it and the world is excluded from the failure buckets
      rather than defaulted into `lead-set`. The grade exists to produce learnings for the
      defender runtime, and a refusal is evidence the defender asked correctly.

  - id: empty_ledger_file_is_the_same_observable_as_never_queried
    kind: domain-outcome
    form: test
    source: "45-dispositions §1 (consensus): served_ledger_file_is_empty_for_a_graded_world"
    binds: ['served_ledger.domain.distinguished[empty]', 'family_bucket.domain.distinguished[lead-set]']
    discharged_by: test_921_an_empty_ledger_file_is_lead_set_like_a_world_that_never_queried_H
    seed_docstring: >-
      An EMPTY ledger file has zero rows on H, so `holding_queried` is false and the bucket is
      `lead-set` — the same observable as "never queried H". The empty case is DECIDED; the
      ABSENT case is not (J5), and the two must not be collapsed in the fixture.

  - id: a_row_with_no_system_matches_no_h
    kind: behavior
    form: test
