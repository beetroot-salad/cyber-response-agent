    - "J4 [material] — PREDICATE PRECISION: WHICH BYTES EACH FACT READS. `scope_discriminated` reads 'the form that ran', but `params` means three different things across source classes and on a `staged` row its index is the world's retargeted view name (G6) — read naively, EVERY staged row scores as a scope failure, which is the one row the amended M8 fixture exists to carry. `resolution_moved` reads 'a `:T resolutions` row past fences_at', where a lead may oscillate — P7 shows `iter_resolutions` yields every one in document order with no fence-awareness, so the case is structurally reachable and 'any row vs the last row' is live. The judge's recommendation: read `asked_params` when present and `params` otherwise, name the three key fields, treat a params mapping missing one as NOT DISCRIMINATING rather than as a refusal; and read any qualifying row past fences_at (the intent is 'was the hand-off revisited'). Carried as the two `world_investigation.domain.alternatives`. resolved_by: AUTO at §7 to the judge's recommendation — read `asked_params` on staged rows and `params` otherwise, name the three keys read, treat a mapping missing one as NOT DISCRIMINATING rather than a refusal; `resolution_moved` reads any qualifying row past `fences_at`. Carried by `scope_discriminated_from_row_params` and `resolution_moved_past_fences_at`"
    - "J5 [material; absorbs phase-A F6] — THE MISSING-OR-UNREADABLE-INPUT POSTURE. Nine inputs can be absent or malformed and the design decides none of them; base's nearest analogue is itself SPLIT (`verdicts` skips an absent report and refuses an unreadable or out-of-vocabulary one, A8) and the design cites it without adopting either half, while flow 1 decides a third posture again (record, drop, count). Silent exclusion is authoring-active in BOTH directions: dropping the world that disagrees flips survived -> caught and suppresses a lesson; dropping the one that agrees flips caught -> survived and authors one. The judge's recommendation: one rule, three tiers — ABSENT -> the world is `ungradable`, named with its missing input and excluded from `verdict_word` (and if none remains gradable the family is `undecidable`); MALFORMED -> refuse the judge pass loudly; DUPLICATE/AMBIGUOUS -> refuse at manifest load. P10 adds a tenth state the rule must cover: a PARTIALLY ARCHIVED world, which the archive's own prose does not prevent. Carried as `family_bucket.domain.alternatives[ungradable]` and the world_report / served_ledger / world_investigation members. resolved_by: HUMAN at §7 — THREE TIERS, EXCLUDED LOUDLY: absent -> `ungradable`, named with its missing input and excluded from `verdict_word` (family `undecidable` if none remains gradable); malformed -> refuse the pass loudly; duplicate/ambiguous label -> refuse at manifest load; a FAULTED call is ungradable, not a defender failure. Minted as three demands and absorbed into `refused_and_fault_are_not_defender_failures`"
    - "J6 [material] — DRAW FAILURES AND THE MAJORITY'S DENOMINATOR. Flow 1 begins at 'each reply parsed leniently' and assumes reply text exists. P9 settles HOW a failure surfaces (one exception class, never a sentinel, never a hang) and kills the assumption that a handler could branch on type. What is left is design-side: WHAT is written for a failed draw, and whether the majority is over CONFIGURED or COMPLETED draws — the two disagree on a 1-agree/1-disagree/2-missing split, on a word (`discard`) that suppresses an entire episode's findings. The judge's recommendation: write a draw record carrying its failure reason (a silent absence is indistinguishable from a draw never requested), count the majority over completed draws with both counts on `FamilyGrade`, say explicitly that a world with zero completed draws still gets its mechanical bucket, and record the review pointer beside the `discard` key test. Carried as the two `judge_reply.domain.alternatives`. resolved_by: HUMAN at §7 — majority over COMPLETED draws; a failed draw writes a record carrying its reason; completed and configured counts both on the family record; a world with zero completed draws still gets its mechanical bucket. Minted as `the_majority_denominator_is_completed_draws`"
    - "J7 — THE ENQUEUE STEP. CLOSED BY RE-GROUNDING, not by a human: atomicity (P3, one append under one lock hold), lock semantics (P2, appenders contend only with appenders), idempotency (P5, keyed on finding_id alone), which draws (the doc decides it — every draw's findings become rows), and identity (FORCED by P5: the id must be deterministic across retries and unique across (world, draw, finding index)). Minted as `finding_id_is_deterministic_across_retries_and_unique_per_draw` and `the_new_append_site_does_not_trip_the_write_lint`. The human is asked only to OBJECT if the derivation is wrong. resolved_by: re-grounding (P2/P3/P5) — the premise carrying a phase-B `# fork:` marker stays on the fork list because the ratchet is not this leaf's to release"
    - "J8 [hygiene] — READING LESSON BODIES AT A RECORDED COMMIT. P1 inverts the question every reader asked: `git_show_file` RAISES NOTHING, so an absent commit, an absent path and an empty body are one observable, and an unavailable lesson is SILENT unless the render marks it. What is left for the human: is the recorded commit validated at all, is the ref pinned once per invocation (O8 says grading is reproducible 'at the sibling's recorded commit', which a moving ref makes false with nothing saying so), and does an `allow_dirty` family — a word that appears nowhere in the design — say so in the judge's input. Carried as the two `lessons_checkout.domain.alternatives`. resolved_by: AUTO at §7 to the judge's recommendation — resolve the ref to a SHA once per pass and thread it; render an absent commit or path as an explicit `unavailable: <reason>` line rather than failing the world; surface an `allow_dirty` family as a caveat. Minted as `the_lesson_commit_is_pinned_once_per_pass_and_allow_dirty_is_a_caveat`"
    - "J9 [hygiene by shape, but see the impact] — THE SIBLING UNION: WHICH ROOT, WHICH MEMBERS, WHAT READ TOLERANCE. Two roots exist (the operator's runs base; `{episode_dir}/runs/`, deliberately outside it), no filter on trial state, no tolerance rule for an in-flight or older run dir, and no check behind `alert_id`, which is model-writable by construction. IMPACT: if the union is the runs base AND includes the source run, the judge is shown the run's own close as a 'sibling trial' — precisely the `current` arm's measured failure (C9, 2.0-2.8 false findings per reply), so the DEFAULT ANSWER PARTLY UNDOES THE EXPERIMENT THIS DESIGN RESTS ON. The judge's recommendation: scan the operator's runs base, EXCLUDE the source run and say so in the coverage view, include only runs that reached a close, skip an unreadable sibling with a counted note, compute the union once per invocation and thread it. Carried as `runs_base.access[sibling_union_scan].constraints: unknown` and `runs_base.domain.distinguished[source-run-in-the-union]`. resolved_by: HUMAN at §7 — operator runs base, SOURCE RUN EXCLUDED and said to be, closed runs only, unreadable siblings skipped with a counted note, union computed once per pass. Minted as `the_sibling_union_excludes_the_source_run_and_unclosed_siblings`"
    - "J10 [hygiene by shape, BLOCKING by dependency; = phase-A F1] — THE JUDGE'S FRAME AND TRIGGER. P8 CLOSED the trigger sub-question (one `episode.outcome` key, always holding step 6's word by the time the judge runs), and it is minted as a demand. What remains: the FRAME — `_run_episode`'s tail (:1206-:1218) versus `_launch`'s post-teardown path — and the OUTCOME GATING (an `incomplete` episode can still hold cleanly archived worlds). Demand #0 is provisional on the frame and every test's drive point hangs off it. The judge's recommendation: the tail of `_run_episode`, since A9 shows no container is live either side of the slot and the launcher tail is the only frame that exists at base; grade `accepted` only, recording `incomplete`/`rejected` as 'not graded, reason'; make a judge failure non-fatal to the episode but distinguishable in the return value, because the archive is the product and an episode cannot be re-run. resolved_by: HUMAN at §7 — TAIL OF THE STEP RUNNER (`cli._run_episode`, after the archive step and before the return), never `_launch`'s post-teardown cleanup path, whose frame a probe found production-dead on this route. Demand #0 is no longer provisional and every test's drive point follows from it"
    - "J11 [hygiene] — COMPLETION MARKERS AND RE-ENTRY. P4 removed two hazards that were never real (a partial `judge.yaml` cannot exist; a retry clobbers stale draw files rather than erroring). What survives is the part no write primitive can supply: `judge.yaml`'s PRESENCE SAYS NOTHING ABOUT WHETHER THE ENQUEUE RAN, there is no in-progress marker, and re-running the pair is refused outright — so a crash between the family write and the enqueue orphans that episode's findings FOREVER, and two concurrent launches both pass the absence check and silently clobber each other's draws. The judge's recommendation: write `judge.yaml` LAST, after the enqueue, carrying the enqueued row count and the per-world completed-draw counts, and validate readability rather than presence. Carried as `episode_judge_yaml.domain.alternatives[written-last-…]` and `.distinguished[unreadable]`. resolved_by: AUTO at §7 to the judge's recommendation — write `judge.yaml` LAST, after the enqueue, carrying the enqueued row count and per-world completed-draw counts; validate readability, not just presence. Minted as `judge_yaml_is_written_last_carrying_the_enqueued_and_completed_counts`"
    - "J12 [material] — WHAT A `family` ROW MEETS DOWNSTREAM OF THE GATE. D6 stops at admission. Past it sit consumers the design never names, and THREE BREAK ON A FAMILY ROW AS SPECIFIED: `verify_forward._run_findings` resolves the row's source through runs_dir/<source_id> and raises SystemExit; `forward.expected_disposition` reads the source_refs.yaml D6 says a family row does not have; `verify_forward/tool.py` types the direction as Literal['adversarial','benign']. Beside them: `source_run_dir` is specified as the archived world dir while `resolve_run_bundle` honours only the LAST path segment (so a world label colliding with a real run id resolves to WRONG BUT REAL content), and the QUEUEABLE_FINDING_TYPES widening reaches the old judge's own validator that N6 calls untouched. FOUR of these premises were never escalated — the first reader answered them confidently AS BREAKS, and without this examination they would have entered the suite as assertions that the break is intended. P6 adds a fourth part: must M5 refuse a row lacking run_id/direction, given that the blast radius is the whole tick plus a propagating exception? The judge's recommendation: skip the forward check for direction=='family', carry `source_run_dir` as a value the existing resolver can honour (or exempt it and fix the consumer in the same commit), and keep `decision-discipline` out of the shared constant if N6 is to mean what it says. Carried as six unanswered R7 firings on `findings_jsonl`, one on QUEUEABLE_FINDING_TYPES, and `QUEUEABLE_FINDING_TYPES.domain.alternatives[keep-decision-discipline-out-…]`. resolved_by: HUMAN at §7 — EXEMPT family rows from the forward check (ground truth is `disposition_declared` on the family record) and make the WRITER refuse a family row lacking `run_id`/`direction`. Minted as `a_family_row_is_exempt_from_the_forward_check`, beside the existing `a_family_row_missing_run_id_or_direction_never_reaches_the_shared_gate`"
    - "J13 [material] — EVIDENCE GROUNDING AND THE MECHANICAL HALF'S TRUST BOUNDARY. (a) O1 requires pointers into 'the archive it was graded from' but states its failing mode as 'inside episodes/<id>/' — a pointer landing in a SIBLING world's archived bytes resolves under the literal text and is a finding about the wrong world. (b) The mechanical half reads `investigation.md` and `report.md` — MODEL-AUTHORED BYTES (G12) — as ground truth with no model in the loop, while O9 frames that same class of text as untrusted for the prompt; the amendment's case for the ledger is that it is host-attested, and that property does not transfer. A forged `:T resolutions` row makes `resolution_moved` read true and the doc names no defence. The judge's recommendation: scope pointer resolution to the graded world's own subtree, and STATE the trust boundary — the ledger is host-attested, the two documents are self-reported, and a predicate reading a self-reported document is evidence the judge EXPLAINS, not ground truth it is graded against. Carried as `finding_evidence.access[pointer_resolution].constraints: unknown` and `.distinguished[inside-another-worlds-archive]`. resolved_by: HUMAN at §7 — NAME THE BOUNDARY: the ledger is host-attested, `investigation.md`/`report.md` are self-reported; a predicate reading a self-reported document is evidence the judge EXPLAINS, not ground truth; evidence pointers scoped to the graded world's own subtree. Carried by `finding_pointers_resolve_in_episode` and `bucket_assigned_by_archive_not_by_the_model`"
    - "J14 [hygiene] — THE EDGES OF THE UNTRUSTED FRAMING. O5's counterfactual withholding is textually scoped to the OVERLAY, while coverage rows, lessons and the trial spread also carry sibling-derived content; untrusted bodies can contain the reply format's own fence/colon syntax; and every judge call re-persists the whole framed prompt and reply verbatim into `<episode_dir>/wire_logs/` — a THIRD sink the design's security census does not name, holding the largest artifact in the tree. C11 measured what leakage does (5/5 replies citing sibling facts as facts about world A). The judge's recommendation: state the withholding's scope across all four views; declare wire_logs/ as the third sink and note in the same sentence that it is already denied to the model, so the fix is a census correction rather than a mechanism; keep the colon/fence collision as a positive control on the wrap. Carried as three `judge_prompt.access[...].constraints: unknown` cells; the census correction is already minted as two demands. resolved_by: AUTO at §7 to the judge's recommendation — state the withholding's scope across ALL FOUR views, not the overlay alone; declare `wire_logs/` as the third write sink in the security census, noting it is already denied to the model; keep the fence/colon collision as a positive control. Carried by `siblings_marked_counterfactual_overlay_withheld`, `episode_write_path_census` and `the_wire_log_sink_is_declared_and_denied_to_the_model`"
    - "J15 [hygiene] — THE THREE OPERATOR KNOBS WITH NO HOME. Draws-per-world, the judge's own model/effort, and the render's payload cap have no definition site at base and no stated default, and the doc never says when each is read or what the render does with a lead whose join exceeds the cap. P4 gives this a concrete consequence: because a retry clobbers draw files in place, a draws knob that SHRINKS between two attempts is the only way stale draw files survive, and no cleanup step exists. The judge's recommendation: resolve all three once at the top of the pass, record the resolved values on `FamilyGrade` beside `draws`, and truncate an oversized lead with an explicit marker rather than dropping it silently. Carried as `judge_stage_wiring.domain.default: unknown` and two unbound members. resolved_by: AUTO at §7 to the judge's recommendation — resolve all three knobs once at the top of the pass and record the resolved values beside the draw count; truncate an oversized lead with an explicit marker rather than dropping it silently. Minted as `the_knobs_are_resolved_once_and_an_oversized_lead_is_truncated_with_a_marker`"
    - "J16 [hygiene, but it GATES PHASE E] — THE PORT SOURCE AND THE FIXTURE SEED. `experiments/judge-context-921/` is untracked working-tree state in the main checkout and does not exist in this worktree at base (G10), so NO DEMAND MAY BIND AN ADDRESS INSIDE IT and phase E cannot write the port's tests until it is committed or the fixtures are authored fresh. The judge's recommendation: commit it (at least `variants/contexts.py` and `fixtures/`) in the same commit as the spec — it is the evidence behind C9-C12 as well as the port source, and a design whose central claim rests on an untracked directory is one re-clone away from unfalsifiable. Carried as the facetless `fixture_corpus` boundary. resolved_by: HUMAN at §7, ON A CORRECTED PREMISE — the seam relayed G10's 'untracked working-tree state', which was true at `9f4e8247` and FALSE against remote main one commit later. Neither offered option was taken: the base fast-forwarded to `d1b8b06a`, which adds only `experiments/judge-context-921/` and moves no census, so addresses inside the port source are now bindable. A census claim true of the base and false of the remote is a shape no probe in this run was pointed at"

    # --- surfaced on the phase-D runtime-probe/gate reconciliation leaf (47-runtime-probes.md,
    # A5's refutation), not one of the 15 and not folded into any of them here — the reconciler
    # is explicitly barred from picking a reading for it.
    - "NEW [material; not one of the 15, surfaced by A5's refutation] — DOES `fault` PARTITION THE WAY `refused_and_fault_are_not_defender_failures` ASSUMES? The demand treats `refused` and `fault` as one class ('never given the chance to fail', not a defender failure). A5, EXECUTED (`47-probe-a5.py`), refutes the sentence that motivated folding them together: a missing `config.env` or a missing required key at prepare time is filed `fault` (`ConfigFault.exit_code` = 2), never `refused` (`refused` fires only on `exit_code == USAGE_EXIT_CODE`, 64) — so `refused` and `fault` are a CLEAN partition at the write seam, not a blurred one, and A5's own claim sentence is false. What that leaves open: `fault` now demonstrably covers two different kinds of event — an ENVIRONMENT condition at prepare time (missing config/key) and an IN-FLIGHT ADAPTER CRASH after prepare (A1's qualification, executed: a raising adapter call also writes one `fault` row, with no `base` row beside it, because `_base_payload` raises before recording) — and the demand grades both the same way the design graded `refused`. Whether 'never given the chance to fail' is still the right reading for an adapter that crashed mid-call, as opposed to a world whose environment was never configured, is NOT decided here. Carried against `ledger_source.domain.distinguished[refused]` and `[fault]`, on the demand `refused_and_fault_are_not_defender_failures` — both `pre_discharged` entries stay uncited by A5 pending this fork (the citation was dropped, not fabricated; see `60-residue.md`). resolved_by: CLOSED at §7 by J5's tier rule — a FAULTED call makes the world `ungradable`, named with the faulted call and excluded from `verdict_word`, while `refused` stays the capability class and is not a defender failure. `refused_and_fault_are_not_defender_failures`'s docstring is REWRITTEN to that mechanism rather than re-cited; the two `pre_discharged` entries are now cited by A5's refutation plus this resolution"

    # --- carried from phase A, unpremised: these mint no premise and appear in no disposition,
    # so they would vanish between the demand list and the suite if they were not relayed here.
    - "F3 [phase-A, unpremised] — N9 SURVIVES THE AMENDMENT TEXTUALLY AND READS OFF A MECHANISM THE AMENDMENT DELETED. 'A `role: null` replicate's ΔO is reported as the noise floor' — ΔO is gone from this issue's path. Either the floor is re-expressed in ledger terms (the null replicate's own `source` distribution on H) or N9's second half goes with N8 and the trial spread is the only noise signal. As written the two sentences contradict, and no demand asserts either. resolved_by: AUTO at §7 — the floor goes with the mechanism the amendment deleted; re-expressed in ledger terms or dropped, and it may not cite ΔO. Recorded as the clause `the_noise_floor_may_not_read_off_the_deleted_comparison`"
    - "F4 [phase-A, unpremised] — D5 SHIPS MODEL-GRADED TESTS AND CI WOULD RUN THEM. No `llm` marker is registered, there is no `--strict-markers` and no addopts, and CI selects `-m 'not live and not gate'` (A10), so a model-graded judge test RUNS IN CI unless it is marked `live`. Deciding it also fixes the project profile's stale `-m 'not llm and not live'`. resolved_by: AUTO at §7 — register the `llm` marker and exclude it from CI's default selection IN THE SAME COMMIT that adds the first such test. This suite adds none, so it is recorded as the clause `a_model_graded_test_registers_its_marker_and_leaves_ci_default_selection`"

    # --- ROUND 2: the ten findings phase F's cold reconciler returned, resolved at a SECOND
    # human seam (`70-resolutions.md`, everything after the `# Round 2` heading). Six went to
    # the human, one was re-opened and re-run to closure, four were auto-resolved, and the
    # re-run produced one further material decision (F-11). Recorded here for the same reason
    # the seven round-1 auto-resolutions are: a merge-gate reader can overturn any of them.
    - "F-1 [material] — DOES A REFUSED H CALL COUNT AS HAVING QUERIED? A predicate over the applier decisions alone reads a refused world as never having asked, which is `lead-set` — the bucket that authors a lesson. `47-runtime-probes.md` red flags 2 said so in its own words and the sentence reached no premise, decision or demand; it survived only inside claim A1's `observed:` field. resolved_by: HUMAN at the phase-F seam — REFUSED COUNTS AS QUERIED. The rationale settles the follow-on the option left open: the grade exists to produce learnings for the DEFENDER runtime, so a refused call is evidence the defender asked correctly and the estate did not answer. `holding_queried` is true on a `refused` or `fault`ed H row, and both worlds are EXCLUDED FROM THE FAILURE BUCKETS rather than defaulted into the never-asked one. Pinned by `refused_and_fault_are_not_defender_failures` and `scope_discriminated_from_row_params` (whose third `params` form is now driven)"
    - "F-2 [material; the orchestrator triaged it wrong] — THE PROMPT'S HEADING INTERPOLATION OF MODEL-WRITABLE IDENTIFIERS. J14 was auto-resolved on the judge's original census-correction recommendation, but the gate had since folded a MECHANISM question into the same decision: `judge_prompt.payload` interpolates `world_label` (questioner-authored, attacker-influenced) and `alert_id` (model-writable by construction, run1/G9) as SECTION HEADINGS across five slots, while `model_text_framed_untrusted` wraps body text only. By the §7 materiality test that auto-resolution was material, and the human never saw the half that made it so. resolved_by: HUMAN at the phase-F seam — ACCEPT AND RECORD. **ACCEPTED WITH KNOWN RISK for this issue**: the heading exposure is a known, accepted risk; the bodies — the large attacker-controlled surface — stay wrapped. NO DEMAND AND NO TEST WERE WRITTEN FOR IT, deliberately. What remains untested and is said out loud here: a hostile `world_label` spelling the frame's own delimiter, against the very frame `test_921_no_model_authored_text_reaches_the_prompt_unframed` pins (every fixture world in `_judge_921.py` is labelled `b` or `c`). Carried in the formal slots as `judge_prompt.access[coverage_rows|lessons|trial_spread].constraints` member `heading-interpolation-of-model-writable-identifiers-accepted-unsanitized`. OVERTURNABLE AT THE MERGE GATE: the reading is an accept, not a finding that the exposure is absent"
    - "F-3 [material] — THE `source_run_dir` COLLISION, J12's third promoted break. J12's reading closed two of the three; a world label colliding with a real run id, resolving to WRONG BUT REAL content, was untouched, and its resolver has a second caller outside the exemption (`author/curator.py:184`). resolved_by: HUMAN at the phase-F seam — REFUSE COLLIDING LABELS AT MANIFEST LOAD, alongside the duplicate-label refusal J5 already chose. Consistent with the refuse-at-load tier; the accepted cost is that it needs the runs base available at manifest load, which couples two things currently independent. Minted as `a_world_label_colliding_with_a_real_run_id_is_refused_at_manifest_load`"
    - "F-4 [material] — J7 CAME OFF THE HUMAN'S LIST ON TWO PROBES THAT WERE NEVER RUN. The probe leaf's digest claimed all ten executed; only P1 ran a command, and J7 rested on P3 and P5, which were source excerpts. resolved_by: HUMAN — RE-RUN BOTH LEGS. CLOSED: `48-p3-p5-executed.md` executed both against the real writer and the real gate and BOTH CONFIRM the reads (one lock hold and one open per 25-row batch; two concurrent appenders as two contiguous blocks; a fault at row 15/25 leaving rows 0-14 and releasing the lock; the idempotency key is `finding_id` alone, content never inspected). J7's closure STANDS, and `test_921_rows_are_appended_under_the_queue_lock_one_row_per_finding` pins a confirmed fact rather than a falsehood. The execution also OBSERVED what the read could only caveat — a torn trailing row under SIGKILL — which produced F-11"
    - "F-5 [the largest unreviewed commitment in the run] — THE COINED JUDGE API. The design named NO seam for the judge's model call, so phase E coined the whole surface and pinned it across the suite, AFTER the §7 seam had closed. It was recorded only as a phase-E red flag, and a red flag in `80-author-digest.md` ROUTES NOWHERE. resolved_by: AUTO at the phase-F seam — RECORDED AS DECIDED AND OVERTURNABLE AT THE MERGE GATE, the same treatment the seven round-1 auto-resolutions got. THE SURFACE, WRITTEN OUT SO THE MERGE-GATE READER SEES IT WITHOUT READING THE SUITE: `cli.main(..., judge=<invoke-shaped callable>)`; `learning/judge/__init__.py::grade_episode(episode_dir, *, judge, runs_base, draws=, git_show=, queue_dir=)`; `render.render(episode_dir, world_label, runs_base, *, git_show=)` returning a `JudgeInput` with `.leads/.coverage/.siblings/.lessons/.spread/.union_notes` and `.as_prompt_sections()`; `run.validate_reply(text) -> JudgeReply`; `family.grade_family(episode_dir) -> FamilyGrade` (`.worlds`, `.verdict_word`, `.graded_worlds`, `.enqueued_rows`); `enqueue.append_rows(episode_dir, rows) -> int` and `enqueue.enqueue(episode_dir, grade) -> int`; `checks.skips_forward_check(row) -> bool`; `_vocab.JUDGE_OUTCOME_ENUM` + `normalized_judge_outcome`; knobs `JUDGE_DRAWS`/`JUDGE_MODEL`/`JUDGE_EFFORT`/`JUDGE_PAYLOAD_CAP`, spelled with NO `DEFENDER_` prefix per run1/G23's executed convention. WHAT IS LEGITIMATE: a test cannot drive an unnamed seam, the knob spellings are grounded in an executed claim, and the injection shape follows `cli.main`'s five existing seams and the profile's no-`monkeypatch.setattr` idiom (G16). WHAT IS UNREVIEWED: adding a `judge=` parameter to the single production command is a design decision larger than several of the fifteen that WERE relayed (J8, J11, J15 are smaller). Overturning it at the merge gate means changing the suite, and that is the intended cost of saying so here rather than nowhere"
    - "F-6 [hygiene] — THE INHERITED `no-consequence` DISMISSAL OF THE TWO SAME-NAMED LOCK SYMBOLS. Zero facts were dismissed `no-consequence` in this run; run1/G30's two `queue_lock` symbols are inherited, and the dismissal's stated purpose (stopping a 'same pattern elsewhere' sweep from merging them) ALREADY FAILED ONCE — this run's own probe table named the wrong module for that exact symbol. resolved_by: AUTO at the phase-F seam — it becomes a DEMAND rather than a note. Minted as the clause `the_two_same_named_queue_lock_symbols_are_not_merged_by_a_census`"
    - "F-7 [hygiene, real gap] — THE TENTH STATE THE THREE TIERS DO NOT NAME. The archiver's per-file copy has no rollback, so a disk fault leaves a world with all five required inputs present but a supporting directory SHORT: it grades normally and silently on a thinner view than it appears to have. Two tests named it in their docstrings and drove something else. resolved_by: HUMAN at the phase-F seam — A PARTIAL ARCHIVE IS `malformed`: refuse the pass, WITH A DESCRIPTIVE ERROR NAMING WHICH INPUT WAS SHORT. It extends the malformed tier rather than minting a fourth, and the MESSAGE IS PART OF THE DEMAND, not decoration, because the failure is otherwise indistinguishable from a genuine malformation. Both cited tests now drive it: `a_malformed_input_refuses_the_judge_pass_loudly` and `the_new_directory_input_is_per_entry_screened`"
    - "F-8 [hygiene] — THE FORMAL SLOTS DISAGREED WITH `70-resolutions.md`. resolved_by: AUTO at the phase-F seam — the slots are FILLED from the resolutions: all 68 `gate.holes` witnesses now carry the decision's settled reading instead of `[routes to: OPEN at §7]`; `family_manifest.access[questioner_authored]`, `served_ledger.access[family_pass_reader]`, `runs_base.access[sibling_union_scan]`, `finding_evidence.access[pointer_resolution]` and the three `judge_prompt.access` vias carry real constraint lists; every `crosses_validation: unknown` is resolved with the arm that was taken named beside it; `judge_stage_wiring.domain.default` names the settled READ TIMING and still declines to invent a number the seam did not set. `handoff.deviations` recorded the disagreement deliberately, so this is the discharge of that record, not a contradiction of it"
