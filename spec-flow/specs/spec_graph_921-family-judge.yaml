# ===========================================================================================
# CLAIMS — every load-bearing statement about existing reality, probed not asserted.
#
# FOUR NUMBERINGS, DELIBERATELY DISJOINT: `C*` inherited from the discuss doc's ledger (20,
# `source: discuss`), `G*` raised by `10-brief.md` (18), `A*` raised by `20-demands.md` (10),
# `P*` executed or read by `46-reground.md` (10), and `run1/*` carried from the REFUTED run's
# frontiers under their ORIGINAL numbers (19 grounding + 11 entry-point). The two G-sets are
# unrelated and must never be merged.
#
# INSTRUMENTS ARE TYPED BY WHAT THE SENTENCE PREDICTS, NOT BY WHAT ITS AUTHOR CALLED IT. The
# input frontiers used a `consequence` kind that is not in the schema's vocabulary, filed
# several `census` claims that closed on a read, and recorded `refutes` where the vocabulary
# says `refuted`; every such entry is retyped here and the retyping is listed in
# `50-graph-digest.md`. Where a claim PREDICTS RUNTIME BEHAVIOUR OVER AN INPUT and its
