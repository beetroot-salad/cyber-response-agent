    discharged_by: test_921_two_world_entries_under_one_label_are_refused_at_manifest_load
    seed_docstring: >-
      Two world entries under one label are refused at manifest load, with J1's validation. A
      duplicate label makes "X's own archived record" ambiguous at the one join every per-world
      fact goes through — `worlds/<label>/` on one side, `served/<world_token>.jsonl` on the
      other — and silently picking either entry is a grade computed from a world nobody named.
      Positive control: the same manifest with distinct labels loads and grades.

  - id: a_world_label_colliding_with_a_real_run_id_is_refused_at_manifest_load
    kind: uniqueness
    form: test
    source: "phase-F finding 3 (J12's third promoted break), HUMAN-RESOLVED at the phase-F seam (`70-resolutions.md`, Round 2)"
    binds:
      - 'family_manifest.payload'
      - 'family_manifest.access[questioner_authored]'
      - 'findings_jsonl.payload'
    discharged_by: test_921_a_world_label_colliding_with_a_real_run_id_is_refused_at_manifest_load
    seed_docstring: >-
      A world label that COLLIDES WITH A REAL RUN ID under the runs base is refused at manifest
      load, alongside J5 tier 3's duplicate-label refusal. A family row carries `source_run_dir:
      episodes/<id>/worlds/<label>`, and its one existing consumer —
      `verify_forward/env.py::case_entities_arg -> _run_paths.resolve_run_bundle` — honours ONLY
      THE LAST PATH SEGMENT under the runs dir, so a label spelled like a real run id resolves
      to WRONG BUT REAL content instead of failing loudly. The judge's own promotion called that
      "strictly worse than the missing-bundle case". J12's forward-check exemption does NOT
      reach it: the resolver has a second caller outside the exemption
      (`author/curator.py:184`). Positive control on the same manifest: with no such run on disk
      the episode loads and grades, so the refusal is on the COLLISION rather than on how the
      label is spelled.
    note: >-
      The accepted cost, stated rather than hidden: refusing at load needs the runs base
      AVAILABLE at manifest load, which couples two things that are independent today. The seam
      took that cost deliberately, because the refuse-at-load tier is where the other two
      ambiguity refusals already live.

  - id: the_family_pass_reader_is_first_row_wins_and_counts_a_torn_line
    kind: behavior
    form: test
    source: "45-dispositions J3, AUTO-RESOLVED at §7 to the judge's recommendation"
    binds:
      - 'served_ledger.access[family_pass_reader]'
      - 'served_ledger.domain.distinguished[duplicate-key]'
      - 'served_ledger.domain.distinguished[malformed-line]'
      - 'ledger_source.domain.distinguished[outside-vocabulary]'
    discharged_by: test_921_the_family_pass_reader_takes_the_first_row_and_counts_a_torn_line
    seed_docstring: >-
      The new ledger reader is coined against `ledger.py`'s own names (`ServedCall`, `source`,
      `world_id`), inherits `_absorb`'s FIRST-ROW-WINS on a duplicate pair-key and its
      `artifact_file`-before-open, RE-VALIDATES `source` against `SOURCES` on read, and SKIPS a
      malformed line WHILE RECORDING THE COUNT on the family record. G15's own words are the
      reason: "two readers resolving a duplicate key in opposite directions is how one file
      gets read as two different recordings", and this reader and `_absorb` read the same bytes.
      Losing a row is less bad than losing a grade here because the count itself is evidence. A
      `staged` row on a patch-only system is REPORTED as a data-integrity note, never silently
      reclassified: G7 makes it a shape the live estate cannot produce, and rewriting it quietly
      would hide a hand-edited or corrupted recording.

  - id: the_sibling_union_excludes_the_source_run_and_unclosed_siblings
    kind: behavior
    form: test
    source: "45-dispositions J9, HUMAN-RESOLVED at §7"
    binds:
      - 'runs_base.access[sibling_union_scan]'
      - 'runs_base.domain.distinguished[source-run-in-the-union]'
      - 'interacts(judge_render->runs_base)'
    discharged_by: test_921_the_sibling_union_excludes_the_source_run_and_unclosed_siblings
    seed_docstring: >-
      The union is the OPERATOR's runs base; the SOURCE RUN the episode branched from is
      EXCLUDED and the coverage view says so; only runs that reached a close are included; an
      unreadable sibling is skipped with a COUNTED note; and the union is computed ONCE per pass
      and threaded to every world's render. This is why J9 is not hygiene: if the union were the
      runs base AND included the source run, the judge would be shown the run's own close as a
      "sibling trial" — precisely the `current` arm's measured failure (C9, 2.0-2.8 false
      findings per reply restating the run's own close) — so the default answer would partly
      undo the experiment this design rests on. The episode's own `{episode_dir}/runs/` are the
      graded trajectories themselves, not independent trials, and are not the root scanned.

  - id: judge_yaml_is_written_last_carrying_the_enqueued_and_completed_counts
    kind: behavior
    form: test
    source: "45-dispositions J11, AUTO-RESOLVED at §7 to the judge's recommendation"
    binds:
      - 'episode_judge_yaml.domain.alternatives[written-last-after-the-enqueue-carrying-the-row-count]'
      - 'episode_judge_yaml.domain.distinguished[unreadable]'
      - 'interacts(judge_family->episode_judge_yaml)'
      - 'interacts(judge_enqueue->findings_jsonl)'
    discharged_by: test_921_judge_yaml_is_written_last_and_carries_the_enqueued_and_completed_counts
    seed_docstring: >-
      `judge.yaml` is written LAST, after the enqueue, and carries the enqueued row count and
      the per-world completed-draw counts; readability, not mere presence, is what the re-entry
      gate validates. That ordering is what makes the presence gate mean something: `judge.yaml`
      otherwise says nothing about whether the enqueue ran, and a crash between the family write
      and the enqueue orphans that episode's findings forever on an episode that cannot be
      re-run. With the counts on the record, "graded with nothing to report" is distinguishable
      from "never graded" and a resumed invocation's decision is derivable. Driven by failing
      the enqueue through the real primitive — the queue's pending directory made unwritable —
      and asserting no `judge.yaml` is left behind.

  - id: the_knobs_are_resolved_once_and_an_oversized_lead_is_truncated_with_a_marker
    kind: behavior
    form: test
    source: "45-dispositions J15, AUTO-RESOLVED at §7 to the judge's recommendation"
    binds:
      - 'judge_stage_wiring.domain'
      - 'judge_stage_wiring.domain.distinguished[render-payload-cap]'
      - 'interacts(judge_family->episode_judge_yaml).payload'
    discharged_by: test_921_the_three_knobs_are_resolved_once_and_an_oversized_lead_is_truncated_with_a_marker
    seed_docstring: >-
      The three operator knobs — draws-per-world, the judge's model/effort, and the render's
      payload cap — are resolved ONCE at the top of the episode-grading pass, their resolved
      values are recorded on the family record beside the draw count, and a lead whose join
      exceeds the cap is TRUNCATED with an explicit marker rather than dropped silently. Reading
      once is not tidiness: because a retry clobbers each existing draw file in place and no
      cleanup step exists (P4), a draws knob that SHRINKS between two attempts is the only way
      stale draw files survive, so re-reading per world is what makes the retry story
      non-deterministic. A dropped lead is invisible to the judge AND to the reader of its
      reply, and Scale records 10-32K input tokens per call, so a cap that fires is an event
      worth seeing. The knob names carry no `DEFENDER_` prefix, matching `QUESTIONER_EFFORT`
      (run1/G23, executed) — one spelled with the prefix would be unsettable.

  - id: the_lesson_commit_is_pinned_once_per_pass_and_allow_dirty_is_a_caveat
    kind: behavior
    form: test
    source: "45-dispositions J8, AUTO-RESOLVED at §7 to the judge's recommendation"
    binds:
      - 'lessons_checkout.domain'
      - 'interacts(judge_render->lessons_checkout)'
      - 'interacts(judge_family->episode_judge_yaml).payload'
    discharged_by: test_921_the_lesson_commit_is_pinned_once_per_pass_and_allow_dirty_is_a_caveat
    seed_docstring: >-
      The sibling's recorded ref is resolved to a SHA once per episode-grading pass and threaded
      to every world's render, the pinned ref is recorded on the family record, and an
      `allow_dirty` family — one whose siblings did not demonstrably run against the recorded
      tree — is surfaced in the lessons view as a CAVEAT. O8 says grading is reproducible from
      "the episode dir plus the runs base plus the checkout at the sibling's recorded commit": a
      ref that moves mid-invocation makes that sentence false with nothing saying so, and
      `allow_dirty` appears nowhere in the design at all.

  - id: the_majority_denominator_is_completed_draws
    kind: domain-outcome
    form: test
    source: "45-dispositions J6, HUMAN-RESOLVED at §7"
    binds:
      - 'judge_reply.domain'
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[discard]'
      - 'interacts(judge_family->episode_judge_yaml).payload'
    discharged_by: test_921_the_majority_denominator_is_completed_draws
    seed_docstring: >-
      The majority is over COMPLETED draws; both the completed and the configured counts are
      recorded on the family record; a draw that fails at any stage writes a DRAW RECORD
      carrying its failure reason; and a world with zero completed draws still gets its
      mechanical bucket. The denominator is not a detail — with `draws=4`, two failures and two
      completed draws that both answer `discard`, the completed denominator suppresses the whole
      episode's findings and the configured one does not, on the word that decides whether an
      episode's findings exist at all. A silent absence is indistinguishable from a draw never
      requested, and P9 is why the record cannot branch on exception type: a wall-clock timeout
      and a raw transport failure arrive as the same `RunUnprocessable`.

  - id: a_family_row_is_exempt_from_the_forward_check
    kind: coherence
    form: test
    source: "45-dispositions J12, HUMAN-RESOLVED at §7"
    binds:
      - 'interacts(forward_findings->findings_jsonl)'
      - 'interacts(forward_expected->findings_jsonl)'
      - 'interacts(forward_tool->findings_jsonl)'
      - 'findings_jsonl.payload'
    discharged_by: test_921_a_family_row_is_exempt_from_the_forward_check
    seed_docstring: >-
      A `direction: family` row is EXEMPT from the lessons forward check — its ground truth is
      `disposition_declared` on the family record, not a `source_refs.yaml` it does not have —
      and the model-facing direction literal is NOT widened, because the check is not kept for
      this direction. Three consumers break on a family row as originally specified, all
      downstream of the gate the design stops at: `verify_forward._run_findings` resolves the
      row's source through `runs_dir/<source_id>` and raises `SystemExit`;
      `forward.expected_disposition` reads the `source_refs.yaml` D6 says a family row does not
      have; `verify_forward/tool.py` types the direction as `Literal["adversarial", "benign"]`.
      A `survived` family row is AUTHORED into a lesson — that is D6's whole point — and the
      authoring path is the one that breaks. Positive control: an adversarial row in the same
      corpus still runs the forward check, so the exemption is a route rather than the check's
      removal. Bound PER READER EDGE rather than at the boundary: a demand at the sink's own
      altitude is green when two of the three consumers moved, which is the bug.

  # --- the two phase-A forks that mint no premise. Both resolved at §7; each lands as a
  #     CLAUSE because no test holds its prose: F3's operative half is already pinned by
  #     `family_pass_makes_no_comparison`, and F4's obligation fires on a test this suite
  #     deliberately does not add.

  - id: the_noise_floor_may_not_read_off_the_deleted_comparison
    kind: coherence
    form: clause
    source: "phase-A fork F3, AUTO-RESOLVED at §7"
    outcome:
      nl: >-
        N9's second half — "a `role: null` replicate's ΔO is reported as the noise floor" — goes
        with the mechanism the amendment deleted: the floor is either re-expressed in ledger
        terms (the null replicate's own `source` distribution on H) or dropped, and it may not
        cite a mechanism this design no longer consumes. No demand asserts the ΔO reading, and
        the executable half of the prohibition is already carried by
        `family_pass_makes_no_comparison`.
    binds: ['delta_o', 'interacts(judge_family->served_ledger)']
    rejected:
      - nl: >-
          Keeping N9's sentence as written and computing a ΔO-based floor for the null
          replicate. The amendment removed `delta_o` from this issue's path entirely; a floor
          computed from it would be the one place the deleted comparator lane came back.

  - id: a_model_graded_test_registers_its_marker_and_leaves_ci_default_selection
    kind: coherence
    form: clause
    source: "phase-A fork F4, AUTO-RESOLVED at §7 ('recorded as a demand, not a fork')"
    outcome:
      nl: >-
        The first model-graded judge test registers an `llm` marker and excludes it from CI's
        default selection IN THE SAME COMMIT that adds it. No `llm` marker is registered today,
        there is no `--strict-markers` and no addopts, and CI selects `-m "not live and not
        gate"` (A10), so a model-graded test would RUN IN CI unless marked. This suite adds no
        such test — D5's model-graded instrument is deferred by
        `fixture_references_written_before_any_judge_output` and by
        `finding_not_a_restated_close`, both clauses — so the obligation is recorded here
        against the commit that first needs it. Whoever discharges it should also fix the
        project profile's stale `gate.test` string in the same commit (`-m "not llm and not
        live"` against `.github/workflows/ci.yml`'s real `-m "not live and not gate"`).
    binds: ['fixture_corpus']
    rejected:
      - nl: >-
          Registering the marker now, against no test. A marker with no member is a gate that
          certifies nothing, and the CI selection change would be unreviewable on its own.

  - id: the_two_same_named_queue_lock_symbols_are_not_merged_by_a_census
    kind: coherence
    form: clause
    source: "phase-F finding 6, AUTO-RESOLVED at the phase-F seam (`70-resolutions.md`, Round 2)"
    outcome:
      nl: >-
        `queue_lock` names TWO different locks on two different queues, and no census, sweep or
        refactor over this delta may merge them. `learning/core/persist.py::queue_lock` (aliased
        `_flock` inside its own module) is the findings/pitfalls flock helper M5 appends under;
        `learning/leads/lead_author/_handoff.py::acquire_queue_lock` / `release_queue_lock` are
        a DIFFERENT lock on a different queue, threaded as injection seams on the lead author's
        deps. This is carried as a demand rather than as run1/G30's `no-consequence` note
        because THE NOTE'S STATED PURPOSE ALREADY FAILED ONCE: it was recorded so "the
        enumerators' 'same pattern elsewhere' sweep does not merge the two", and the very next
        run inheriting it named the wrong module for exactly that symbol — this run's own
        P2 row said `learning/core/config.py`, and `46-reground.md` red flag 1 had to retarget
        it at `learning/core/persist.py`. A dismissal whose hazard has occurred is not a
        dismissal. Zero facts were dismissed `no-consequence` in this run; these two are
        inherited, and this clause is where the inheritance stops being a note.
    binds: ['findings_jsonl.access[judge_enqueue]']
    rejected:
      - nl: >-
          Leaving it as a `no-consequence` note. The note is what failed: it is prose in a
          refuted run's brief, and nothing downstream reads it at the moment a sweep would
          merge the two names.
      - nl: >-
          Minting a lint rule now. A rule would have to distinguish two legitimately same-named
          symbols by module, which is `scripts/lint/lint_duplicate_helpers.py`'s territory and
          not this delta's to widen; the demand is the cheaper form and it names both sites.

# ===========================================================================================
# STRUCTURE — the address space. `provenance: design` is the delta (what this change adds or
# alters); `provenance: code` is the grounded neighbourhood reality imposes and no demand asked
# for. The `code` half is where R7 does its work: the delta moves one reader of a shared source
# and leaves five behind, and every one of them looks correct read alone.
# ===========================================================================================

structure:

  # --- the axis registry. Every `key_axes` / `interpolates` member is declared here or is a
  # `derivations` value derived from one. Two extraction passes coining different names for one
  # axis is the join-breaker this list exists to prevent — and on this change the two names for
  # a world (G5) are exactly that hazard, so `world_label` is the axis and `world_token` is its
  # declared injective derivation.
  axes: [episode_id, world_label, draw_index, agent_id, finding_id, run_id, alert_id, lead_id]

  actors:

    # --- the change's own actors (provenance: design) -------------------------------------
    - {id: judge_episode,    frame: composition, provenance: design}  # THE COMPOSITION FRAME: the episode-grading pass the launcher calls after `verify_family`. Every uniqueness demand binds HERE, never at a leg — a single-world test cannot see a cross-world collision
    - {id: judge_render,     frame: leg,         provenance: design}  # learning/judge/render.py::render(episode_dir, X, runs_base) -> JudgeInput (M1)
    - {id: judge_run,        frame: leg,         provenance: design}  # learning/judge/run.py (M2) — one run_stage call per (world, draw) under the questioner key
    - {id: judge_family,     frame: leg,         provenance: design}  # learning/judge/family.py (M3) — the mechanical half, offline
    - {id: judge_enqueue,    frame: leg,         provenance: design}  # learning/judge/enqueue.py (M5) — the twelve-key rows
    - {id: _gate_family,     frame: leg,         provenance: design}  # learning/author/lessons/run.py::_gate_family (M6) — a PARTITION inside `_gate_findings`, not a second gate
    - {id: archive_episode,  frame: leg,         provenance: design}  # learning/branch/archive.py::archive_episode (M7) — gains three per-world inputs
    - {id: episode_launcher, frame: composition, provenance: design}  # learning/branch/cli.py — `_run_episode` (tail, after :1206) OR `_launch`'s post-teardown path. WHICH ONE IS FORK F1/J10, and it is the only reason D0 is provisional

    # --- the grounded neighbourhood the change attaches to (provenance: code) --------------
    - {id: registry_served,  frame: leg,         provenance: code}    # learning/branch/estate/registry.py::served — the ONLY writer of a world's ledger rows; its tail `ledger.record(...)` fires on every successful serve (G2/A1)
    - {id: world_applier,    frame: leg,         provenance: code}    # estate/applier.py::WorldApplier.apply — decides the `source` word; :236-237 names #921 as the column's reader
    - {id: ledger_absorb,    frame: leg,         provenance: code}    # learning/branch/ledger.py::Ledger._absorb — the OTHER reader of the same file; first-row-wins, family-tier only (G15)
    - {id: delta_o,          frame: leg,         provenance: code}    # learning/branch/episode.py::delta_o — the comparator lane the amendment removes from this issue's path. Modelled so the negative demand has something to bind
    - {id: verdicts,         frame: leg,         provenance: code}    # episode.py::verdicts — SKIPS a world with no report, REFUSES an unreadable or out-of-vocabulary one (A8). The family pass would be its first production caller (G14)
    - {id: questioner,       frame: leg,         provenance: code}    # learning/branch/questioner::author_family — writes family.yaml (step 2) and shares the wire-log sink
    - {id: review_record,    frame: leg,         provenance: code}    # learning/branch/review.py::review — step 4; writes `episode.outcome` as a human sentence, and reads the discriminator's `envelope` (the ONLY production read of the discriminator anywhere, G13)
    - {id: record_outcome,   frame: leg,         provenance: code}    # cli.py::_record_episode_outcome -> staging.merge_review — step 6; OVERWRITES step 4's outcome with an enum (P8)
    - {id: recorded_outcome, frame: leg,         provenance: code}    # episode.py::_recorded_outcome — base's ONE production reader of the field, gating on `incomplete` alone (run1/E11)
    - {id: append_findings,  frame: leg,         provenance: code}    # learning/core/persist.py::append_findings — the existing appender, untouched by N6
    - {id: eval_harness,     frame: leg,         provenance: code}    # evals/harness.py::materialize — the out-of-tree writer of the same sink shape, reached only from the evals harness (run1/G4; project profile)
    - {id: gate_findings,    frame: leg,         provenance: code}    # learning/author/lessons/run.py::_gate_findings — the channel's ONE gate, called once per tick over the whole file
    - {id: drain_tick,       frame: leg,         provenance: code}    # learning/author/drain.py::_tick — stuck-records the WHOLE keyed batch on a bare KeyError and re-raises (P6)
    - {id: forward_findings, frame: leg,         provenance: code}    # verify_forward/checks.py::_run_findings — resolves a row's source through runs_dir/<source_id> and raises SystemExit
    - {id: forward_expected, frame: leg,         provenance: code}    # verify_forward/forward.py::expected_disposition — reads the source_refs.yaml a family row has no entry in
    - {id: forward_tool,     frame: leg,         provenance: code}    # verify_forward/tool.py:40 — types the model-facing direction as Literal["adversarial", "benign"]
    - {id: case_entities,    frame: leg,         provenance: code}    # verify_forward/env.py::case_entities_arg -> _run_paths.resolve_run_bundle — honours only the LAST path segment of source_run_dir (also reached from author/curator.py:184)
    - {id: validate_finding, frame: leg,         provenance: code}    # learning/core/validate.py::_validate_finding — the OLD judge's document validator, the only membership test on a finding `type` at base (run1/G7)
    - {id: held_out,         frame: leg,         provenance: code}    # evals/held_out.py::index_runs — a runs-base walker keyed on run-id slug, not alert_id
    - {id: trace_lesson,     frame: leg,         provenance: code}    # learning/ops/trace_lesson.py::in_context_cases — the other runs-base walker, keyed on lessons_loaded.jsonl

  boundaries:

    # =======================================================================================
    # THE LEDGER — the amendment's mechanism. Two boundaries deliberately: the FILE (its
    # identity, its row shape, its two reader postures) and the `source` COLUMN (a closed
    # vocabulary with its own contract). Coined against ledger.py's own names, per G15.
    # =======================================================================================
    - id: served_ledger
      provenance: code
      # `episodes/<id>/served/<world_token>.jsonl` — OUTSIDE `worlds/`, untouched by the
      # archive, and readable offline after teardown with no archive change (A6). #921 is the
      # first consumer of it as EVIDENCE: the only production read of the column today is
      # `_absorb`'s family-tier membership test, and `APPLIER_DECISIONS` has no production
      # reader at all (G4).
      facets:
        identity:
          key_axes: [world_label]
          evidence:
            nl: >-
              Read off the resource: `Ledger.for_world` names `base.parent / f'{world_id}.jsonl'`
              under the episode's `served/`, and the world_id it takes is the COMPOSED token
              `world_token_for(episode_token_for(episode_id), label)`, not the label the archive
              is keyed on (G5, A6). `episode_token_for`'s docstring pins its own injectivity
              (`_` -> `__`, `.` -> `_p`, then `-` -> `.`), and the casefold is the identity for
              every id `refuse_bad_episode_id` admits.
          derivations:
            - {value: world_token, fn_of: world_label, injective: true}
            - {value: episode_token, fn_of: episode_id, injective: true}
          sharing: serialized-append
        payload:
          parts:
            - {role: system, source: const:SERVED_CALL_COLUMNS}   # system, verb, params, payload_text, source, world_id (+ asked_params when staging moved the call)
            - {role: user,   source: template:SERVED_ROW, slots: {system: world_label, params: lead_id}}
          invariants: [all-slots-bound]
          nl: >-
            One row per served call. `row()` writes NO correlation_key column — it is a property,
            re-derived on read by `correlation_key_of` — and `params` carries a DIFFERENT FORM
            per source class (G6): the PREPARED form on a success row (its index rewritten to the
            world's staged view name), the form ASKED on a pre-prepare refused/fault row, the form
            RUN with `asked_params` alongside on a post-prepare fault row.
        domain:
          type: jsonl-file
          refinement:
            nl: >-
              The file's own states, as input classes a fixture supplies. `empty` is DECIDED
              (dispositions §1); `absent` is J5's and is deliberately NOT collapsed into it;
              `duplicate-key` and `malformed-line` are J3's, and neither has a posture yet.
          default: empty
          distinguished: ['empty', 'absent', 'duplicate-key', 'malformed-line']
          falsy_valid: true
          documented_alternatives: []
        access:
          constraints_by_via:
            ledger_absorb:
              # ledger.py:383-421 — reads BOTH files, keeps only family-tier rows, first-row-wins
              # on a duplicate key, `artifact_file` before opening.
              trust: derived
              constraints: [artifact-file-before-open, first-row-wins, family-tier-filter]
            family_pass_reader:
              # THE READER THAT DOES NOT EXIST. G15: "two readers resolving a duplicate key in
              # opposite directions is how one file gets read as two different recordings" — and
              # the new reader and `_absorb` read the same bytes.
              trust: derived
              # J3 SETTLED at §7 (auto-resolved to the judge's recommendation): all four
              # postures, coined against `ledger.py`'s own names.
              constraints: [first-row-wins-on-a-duplicate-pair-key, artifact-file-before-open, revalidate-source-against-SOURCES-on-read, skip-a-malformed-line-and-count-it-on-the-family-record, report-a-staged-row-on-a-patch-only-system-never-reclassify-it]

    - id: ledger_source
      provenance: code
      # `ledger.py:33-76` — SOURCES = {base, staged, patched, passthrough, refused, fault,
      # captured}; FAMILY_SOURCES = {base, captured}; APPLIER_DECISIONS = {staged, patched,
      # passthrough}. `record` refuses a source outside SOURCES, refuses a family-tier source
      # paired with a non-null world_id (and the converse), and refuses `captured` through the
      # serving path outright (A3) — which is why `captured` is not listed below: a world file
      # cannot legally carry one, and a hand-edited fixture that does is `outside-vocabulary`'s
      # question, not its own.
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The applier's per-call decision, written by `registry.served`'s three arms.
              `staged` is reachable ONLY for `elastic`, the sole stager, so on the six state
              systems "a doctored answer was served on H" is `patched` alone, and `patched`
              needs the world's overlay to carry an entity patch that actually matched this
              payload (G7). `base` is the family tier's own word and appears in a world's file
              with `world_id: null` (G3) — which is J2.
          default: passthrough
          distinguished: ['staged', 'patched', 'passthrough', 'refused', 'fault', 'base', 'outside-vocabulary']
          falsy_valid: false
          documented_alternatives:
            # J2, verbatim as the two readings the run contains and reconciles nowhere.
            # J2 SETTLED at §7 to the SECOND arm. `crosses_validation: false` on both: the
            # shipped default (`passthrough`) is a valid `source` under either reading — the two
            # differ on which ROWS are counted, not on which values validate.
            - {value: existence-over-any-row-with-system-H, crosses_validation: false}          # NOT taken
            - {value: filter-on-the-worlds-token-then-read-source, crosses_validation: false}   # TAKEN

    - id: base_ledger
      provenance: code
      facets: {}                 # `episodes/<id>/served/base.jsonl` — the shared capture. Bound only by the negative demand that the family pass never reads it

    # =======================================================================================
    # THE ARCHIVE — what the family pass and the render read.
    # =======================================================================================
    - id: episode_dir
      provenance: code
      facets: {}                 # the container. Deliberately facetless: its contract lives on the named sinks below, and a facetless boundary generates no obligations
    - id: world_dir
      provenance: design
      # `episodes/<id>/worlds/<label>/` — keyed on the SHORT manifest label by deliberate
      # decision (archive.py:56-58). M7 adds three inputs to it.
      facets:
        identity:
          key_axes: [world_label]
          evidence:
            nl: >-
              Read off `archive.py:56-58`: "One level, keyed by the SHORT label X — the
              manifest's world_id, not the composed world token". `gather_summaries/` is a
              directory of `{lead_id}.md` files, which is why the writer interpolates `lead_id`
              too.
          sharing: unique-key
        access:
          constraints_by_via:
            archive_copy:
              # archive.py — `_screened_sources` screens EVERY source before the first copy so a
              # world archives all six roles or none; `stage_tables` is the per-entry-screened
              # walk for directory inputs (run1/G28, P10).
              trust: derived
              constraints: [screen-then-copy, per-entry-screen-on-directories, destination-leaf-screened]
    - id: world_report
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The archived `report.md`'s disposition, normalized through
              `_vocab.normalized_disposition`. The three members are the states `verdicts`
              treats differently and the design adopts neither half of (A8): an ABSENT report
              is a state an accepted episode deliberately produces.
          default: benign
          distinguished: ['absent', 'unreadable', 'outside-vocabulary']
          falsy_valid: false
          documented_alternatives: []
    - id: world_investigation
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The archived `investigation.md`, read for `:T resolutions` rows past `fences_at`.
              `read_frontier` takes the PREFIX and this pass wants the COMPLEMENT, which no
              symbol spells today (G8); `iter_resolutions` carries no fence ordinal, so the
              slice happens before it.
          default: no-row-past-fences
          distinguished: ['no-row-past-fences', 'oscillating-rows', 'truncated-inside-a-fence']
          falsy_valid: true
          documented_alternatives:
            # J4's second half: P7 shows the oscillation case is structurally reachable, and the
            # choice between the two readings is still the human's.
            # J4 SETTLED at §7 to the FIRST arm. `false` on both: `no-row-past-fences` stays a
            # valid value under either reading; they disagree on which row is read, not on what
            # validates.
            - {value: any-qualifying-row-past-fences_at, crosses_validation: false}   # TAKEN
            - {value: the-last-row-past-fences_at, crosses_validation: false}         # NOT taken
    - id: family_manifest
      provenance: code
      # `family.yaml`. `_WORLD_FIELDS` is closed and `parse_world` refuses unknown fields, so
      # O5's `counterfactual: true` can only ever be a render-layer annotation (run1/G17).
      facets:
        payload:
          parts:
            - {role: system, source: const:FAMILY_FIELDS}          # episode_id, fences_at, discriminator, worlds[]
            - {role: user,   source: template:WORLD_ENTRY, slots: {world_id: world_label, disposition_declared: world_label, role: world_label}}
          invariants: [all-slots-bound]
          nl: >-
            The manifest the questioner authors and the launcher validates. `fences_at` is a
            required int; `disposition_declared` is the ground truth known by construction and
            is checked against the shipped disposition vocabulary; `role` is `str | None`, so
            N9's `role: null` replicate is admitted.
        access:
          constraints_by_via:
            questioner_authored:
              # THE HIGHEST-CONSEQUENCE UNMADE DECISION IN THE SET (J1). `H` =
              # discriminator["holding_system"] appears in exactly two places in the tree — the
              # prompt that asks for it and one test fixture — has no production reader, and
              # nothing checks it against `envelope.system`, against the seven-name served
              # roster, or that it is present at all (A7/G13/C4). A bogus H reads mechanically
              # as "never queried H" -> lead-set -> survived -> a lesson is authored. An
              # unvalidated string authored by a model would decide whether the corpus learns.
              trust: attacker-influenced
              # J1 SETTLED at §7 (human) — VALIDATE AT LOAD, REFUSE. Plus J5 tier 3 and its
              # F-3 extension: the label side of the same load is refused there too.
              constraints: [h-present, h-non-empty, h-member-of-STAGERS-union-PATCHABLE_SYSTEMS-after-strip-and-casefold, refuse-the-manifest-otherwise, refuse-a-duplicate-or-ambiguous-world-label, refuse-a-world-label-colliding-with-a-real-run-id]

    # =======================================================================================
    # THE JUDGE'S OWN SINKS. THREE, not two: the design's security census names the first two.
    # =======================================================================================
    - id: world_judge_dir
      provenance: design
      facets:
        identity:
          key_axes: [world_label, draw_index]
          evidence:
            nl: >-
              Read off the design's own data model: `worlds/<X>/judge/<n>.yaml`, one per draw,
              written through `write_guarded` after teardown. `write_guarded(mode="replace")`
              clobbers an ordinary existing target rather than erroring (P4), so a retry
              overwrites in place and stale files survive only where the retry's N is smaller
              than the aborted attempt's.
          sharing: unique-key
    - id: episode_judge_yaml
      provenance: design
      facets:
        identity:
          key_axes: [episode_id]
          evidence: {nl: "`episodes/<id>/judge.yaml`, written once per episode (the design's data model; the layout precedent is `review.yaml`, spelled in three modules — run1/G29)."}
          sharing: unique-key
        payload:
          parts:
            - {role: system, source: const:FAMILY_GRADE_FIELDS}    # per world: holding_queried, scope_discriminated, doctored_answer_served, resolution_moved, verdict, declared, bucket
            - {role: user,   source: template:FAMILY_GRADE, slots: {worlds: world_label, draws: draw_index}}
          invariants: [all-slots-bound]
          nl: >-
            The family record: one row per graded world with its five facts and its bucket, plus
            the family's `verdict_word`, `episode_outcome`, `draws` and the reported spread.
        domain:
          type: str
          refinement: {nl: "The gate flow 1 checks: `judge.yaml` absent means grade, present means skip. `unreadable` has no posture (J11), and P4 shows a partial write cannot produce it — a corrupt one would have to come from elsewhere."}
          default: absent
          distinguished: ['absent', 'present', 'unreadable']
          falsy_valid: true
          documented_alternatives:
            # J11 SETTLED at §7 — TAKEN. `false`: `absent` stays a valid value under it; the
            # alternative changes WHEN the file is written, not what a written one may hold.
            - {value: written-last-after-the-enqueue-carrying-the-row-count, crosses_validation: false}
    - id: wire_log_dir
      provenance: code
      # THE THIRD SINK (G11). `seams.model_seam` builds StageContext(learning_run_dir=episode_dir)
      # and `_pydantic_stage.run_stage` writes every call's FULL wire stream to
      # `<episode_dir>/wire_logs/<agent_id>_trace.jsonl` through `observe.stage_trace_path`
      # (guarded_mkdir) + `open_guarded`. The seam's own docstring says "THE TRACE LANDS IN THE
      # EPISODE". #921 multiplies that stream by worlds x draws, each carrying the whole
      # 10-32K-token framed prompt verbatim.
      facets:
        identity:
          key_axes: [agent_id]
          evidence:
            nl: >-
              Read off `seams.model_seam`: `trace_name=f"{agent_id.replace(':','_')}_trace.jsonl"`,
              and run_stage's own note that three calls sharing one id would overwrite each
              other's record. D2's `agent_id="judge:<X>:<n>"` is what keeps worlds x draws
              distinct; the questioner's calls share the directory but not the id.
          sharing: unique-key
        access:
          constraints_by_via:
            model_tools:
              # runtime/permission/files.py:272-295 — `wire_logs/` is denied to the model outright.
              trust: attacker-influenced
              constraints: [denied-to-the-model]

    # =======================================================================================
    # THE PROMPT AND THE REPLY.
    # =======================================================================================
    - id: judge_prompt
      provenance: design
      facets:
        payload:
          parts:
            - {role: system, source: const:JUDGE_ROLE_PROMPT}
            - {role: user,   source: template:CORRELATING_PROMPT, slots: {manifest: world_label, alert: alert_id, document: world_label, report: world_label, queries: lead_id, per_lead_chain: lead_id, coverage: lead_id, siblings: alert_id, lessons: run_id, spread: alert_id}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            The four joined views plus the correlating prompt: per lead goal -> params ->
            payload -> summary -> document rows -> resolutions; coverage with window and scope
            key against the discriminator; the sibling trials of the same alert; the lessons
            loaded; the trial spread. The prompt demands the correlation, scope and derivation
            passes BEFORE findings, keeps the 20-row cap and the quote-any-colon rule, and names
            the graded world. Every model-authored body inside it is `_untrusted.wrap`ped under
            a salt no body contains.
        access:
          # O5's counterfactual withholding is textually scoped to the OVERLAY (J14). The other
          # three views carry sibling-derived content too, which is why each has a cell of its
          # own — the rule's cheapest form, one cell per view — and J14's settled reading states
          # the withholding's scope across all four rather than the overlay alone.
          constraints_by_via:
            overlay:
              trust: attacker-influenced
              constraints: [counterfactual-marking, overlay-withheld, untrusted-frame]
            coverage_rows:
              trust: attacker-influenced
              # J14 SETTLED at §7: the withholding's scope is stated across ALL FOUR views, not
              # the overlay alone. F-2 SETTLED at the phase-F seam: the heading interpolation of
              # `world_label`/`alert_id` is an ACCEPTED, RECORDED exposure for this issue — the
              # bodies stay wrapped, the frame tokens do not, and no sanitizer is minted.
              constraints: [model-text-framed-untrusted, withholding-scope-stated-across-all-four-views, heading-interpolation-of-model-writable-identifiers-accepted-unsanitized]
            lessons:
              trust: attacker-influenced
              constraints: [model-text-framed-untrusted, withholding-scope-stated-across-all-four-views, heading-interpolation-of-model-writable-identifiers-accepted-unsanitized]
            trial_spread:
              trust: attacker-influenced
              constraints: [model-text-framed-untrusted, withholding-scope-stated-across-all-four-views, heading-interpolation-of-model-writable-identifiers-accepted-unsanitized]
    - id: judge_reply
      provenance: design
      facets:
        payload:
          parts:
            - {role: system, source: const:JUDGE_REPLY_FIELDS}     # episode_outcome, noise_floor_note, correlations[], scope_checks[], derivations[], findings[]
            - {role: user,   source: template:JUDGE_REPLY, slots: {findings: world_label, episode_outcome: draw_index}}
          invariants: [all-slots-bound]
          nl: >-
            Parsed leniently, then validated strictly into `JudgeReply` before anything reads it.
            Each finding carries bucket, claim, root_cause, anchor, topic, evidence[] and
            `discriminator_related`.
        domain:
          type: str
          refinement: {nl: "Reply shapes a draw can produce. `unparseable-past-the-lenient-fallback` and the missing-pass-table case are J6's; the other three are decided (dispositions §1)."}
          default: non-mapping
          distinguished: ['non-mapping', 'fenced-with-prose', 'no-findings', 'missing-pass-table', 'unparseable-past-the-lenient-fallback']
          falsy_valid: false
          documented_alternatives:
            # J6: the majority denominator, as the two readings that disagree on a
            # 1-agree/1-disagree/2-missing split.
            # J6 SETTLED at §7 to the SECOND arm. `false` on both: the denominator changes the
            # verdict a split produces, not which reply shapes validate.
            - {value: majority-over-the-configured-draw-count, crosses_validation: false}   # NOT taken
            - {value: majority-over-completed-draws, crosses_validation: false}             # TAKEN
    - id: finding_evidence
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "What an evidence pointer can be. `resolving` is the positive control; the other three are the failing modes O1 and flow 1 name."}
          default: resolving
          distinguished: ['resolving', 'escaping', 'not-pointer-shaped', 'inside-another-worlds-archive']
          falsy_valid: false
          documented_alternatives: []
        access:
          constraints_by_via:
            pointer_resolution:
              # J13(a): O1's RULE says "the archive it was graded from" (world-scoped, with O5's
              # whole purpose behind it) while its FAILING MODE says "inside episodes/<id>/"
              # (episode-scoped). A pointer landing in a sibling world's archived bytes resolves
              # under the literal text and is a finding about the wrong world.
              trust: attacker-influenced
              # J13(a) SETTLED at §7 (human): the RULE, not the failing mode's wording —
              # pointers are scoped to the GRADED WORLD's own subtree.
              constraints: [pointer-scoped-to-the-graded-worlds-own-subtree, ledger-host-attested, investigation-and-report-self-reported, a-self-reported-document-yields-evidence-the-judge-explains-not-ground-truth]
    - id: finding_bucket
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "The finding's own bucket, which becomes the queue row's `type`. The vocabulary is {lead-set, lead-quality, analyze-discipline, decision-discipline, observability}; the two members below are the INPUT CLASSES a test supplies, not vocabulary members. There is no normalizer here, deliberately (D1 ships one for JUDGE_OUTCOME_ENUM only), so validation rejects rather than coerces."}
          default: observability
          distinguished: ['absent', 'lookalike']
          falsy_valid: false
          documented_alternatives: []
    - id: family_bucket
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "The mechanical bucket per non-control world, as the amendment's fact table leaves it. `none` and `agreed-without-evidence` are outcomes, not defects."}
          default: none
          distinguished: ['lead-set', 'lead-quality', 'analyze-discipline', 'decision-discipline', 'none', 'agreed-without-evidence']
          falsy_valid: false
          documented_alternatives:
            # J5's recommendation, unresolved: a world whose input is ABSENT is `ungradable`,
            # carried with the named missing input and excluded from `verdict_word`. Silent
            # exclusion is authoring-active in both directions — dropping the world that
            # disagrees flips survived -> caught and SUPPRESSES a lesson; dropping the one that
            # agrees flips caught -> survived and AUTHORS one.
            # J5 SETTLED at §7 — TAKEN, and `ungradable` joins this domain rather than
            # replacing a member. `false`: the shipped default `none` stays valid beside it.
            - {value: ungradable, crosses_validation: false}

    # =======================================================================================
    # THE VOCABULARIES.
    # =======================================================================================
    - id: JUDGE_OUTCOME_ENUM
      provenance: design
      # M4/D1 — `defender/_vocab.py`, WITH a normalizer. `_vocab.py` holds exactly one
      # vocabulary today, and adding a second with a normalizer self-arms
      # `lint_borrowed_vocabulary` against every other module's `x in JUDGE_OUTCOME_ENUM`
      # (run1/G15). `episode_outcome` is not a second vocabulary: `discard` and
      # `corpus-contradiction` are members here and are the family's `verdict_word` when they
      # apply.
      facets:
        domain:
          type: str
          refinement: {nl: "{caught, survived, undecidable, discard, corpus-contradiction}. `Survived` is the case variant the normalizer must fold at every surface; `not-an-outcome` stands for any value outside the vocabulary."}
          default: undecidable
          distinguished: ['caught', 'survived', 'undecidable', 'discard', 'corpus-contradiction', 'Survived', 'not-an-outcome']
          falsy_valid: false
          documented_alternatives: []
        access:
          constraints_by_via:
            vocab_module:
              trust: derived
              constraints: [closed-membership, normalizer-shipped-beside-it]
            gate_family:
              trust: derived
              constraints: [membership-through-the-normalizer, routing-by-member]
            judge_enqueue:
              trust: derived
              constraints: [membership-through-the-normalizer, refuse-discard-and-corpus-contradiction]
            judge_reply_validation:
              trust: attacker-influenced
              constraints: [membership-through-the-normalizer, reject-not-coerce]
    - id: QUEUEABLE_FINDING_TYPES
      provenance: design
      # `learning/core/config.py:247`, widened by M5. run1/G7: it has NO production consumer —
      # its only readers derive ALL_FINDING_TYPES / BENIGN_ALL_FINDING_TYPES, read only inside
      # the OLD judge's `validate_judge_doc`, which never sees a queue row. So the widening
      # changes no production behaviour and O6's stated failure mode is the new appender's own
      # to make.
      facets:
        domain:
          type: str
          refinement: {nl: "{lead-set, lead-quality, analyze-discipline, observability} at base; M5 adds `decision-discipline`."}
          default: observability
          distinguished: ['decision-discipline']
          falsy_valid: false
          documented_alternatives:
            # J12: widening the SHARED constant reaches the old judge's document validator,
            # which N6 calls untouched. A self-contradiction cannot be an assertion.
            # J12 SETTLED at §7: the widening SHIPS (the constant has no production consumer,
            # run1/G7, so the tension is a doc self-contradiction, not a break). `false`:
            # `observability` stays a valid member under either answer.
            - {value: keep-decision-discipline-out-of-the-shared-constant, crosses_validation: false}   # NOT taken
    - id: OUTCOME_ENUM
      provenance: code
      facets: {}                 # `learning/core/config.py:238` — the OLD pipeline judge's vocabulary, deleted by #922. Bound only by the negative demand that it gains no member

    # =======================================================================================
    # THE QUEUE.
    # =======================================================================================
    - id: findings_jsonl
      provenance: design
      facets:
        identity:
          key_axes: [finding_id]
          evidence:
            nl: >-
              Read off the resource's own consumers: both idempotency guards key on
              `finding_id` alone — the corpus-side check reads the provenance field derived
              from `cfg.channel.id_key` out of each authored lesson's frontmatter, and the
              pending-queue gate compares `entry["finding_id"]` against that set (P5). Not
              `run_id`, not row content.
          sharing: serialized-append
        payload:
          parts:
            - {role: system, source: const:TWELVE_KEYS}
            - {role: user,   source: template:FINDING_ROW, slots: {finding_id: finding_id, run_id: run_id, alert_rule_key: alert_id, source_run_dir: world_label, subject_anchor: lead_id}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: >-
            The twelve keys `persist.py:315-330` writes. THREE OF THEM ARE KEYS SOMEONE ELSE
            JOINS ON, which is what makes this an R8 question and not only an R7 one:
            `direction="family"` (indexed bare by `_gate_findings` and typed as
            Literal["adversarial","benign"] by the forward-check tool), `run_id` (indexed bare
            by the same gate), and `source_run_dir` (resolved by `resolve_run_bundle`, which
            honours only the LAST path segment under the runs dir — so an archived world dir
            whose label collides with a real run id resolves to wrong-but-real content instead
            of failing loudly).
        access:
          constraints_by_via:
            judge_enqueue:
              trust: derived
              constraints: [twelve-key-shape, queueable-type, refuse-discard-and-corpus-contradiction, queue-lock, guarded-append]
            append_findings:
              # The existing appender: one list, one `append_jsonl`, one `queue_lock` hold (P3);
              # gates the outcome keyword on OUTCOME_ENUM.
              trust: derived
              constraints: [twelve-key-shape, outcome-keyword-membership, queue-lock]
            eval_harness:
              # `shutil.copy` of a scenario's own findings.jsonl into a tmp tree — a writer of
              # the same sink shape with NO validation of any kind, invisible to an
              # import-following census (run1/G4, project profile).
              trust: derived
              constraints: []
            lessons_batch:
              # The read lane: ONE gate per channel, called once per tick over every keyed row
              # of the whole file, INSIDE drain's stuck-recording guard (run1/G5).
              trust: derived
              constraints: [one-gate-per-channel, whole-file-batch, keyed-on-finding_id-run_id-direction]

    # =======================================================================================
    # THE TRIGGER, THE ROOTS AND THE SEAMS.
    # =======================================================================================
    - id: review_yaml
      provenance: code
      facets:
        payload:
          parts:
            - {role: system, source: const:REVIEW_BLOCK}           # decision (step 4), episode: {outcome, reason} (steps 4 AND 6)
            - {role: user,   source: template:EPISODE_BLOCK, slots: {outcome: episode_id}}
          invariants: [all-slots-bound]
          nl: >-
            ONE `episode.outcome` key with TWO provenances and nothing marking which step wrote
            it: step 4 writes a human sentence, step 6's `merge_review` does `held.update(block)`
            with an enum value and overwrites it on every episode that reaches step 6 (P8).
            `decision` beside it is step 4's and survives.
        domain:
          type: str
          refinement: {nl: "`accepted | rejected | incomplete` (C18). Base's one production reader gates on `incomplete` alone and therefore ADMITS `rejected` (G14, run1/E11); the enqueue-only-on-accepted rule is #921's."}
          default: incomplete
          distinguished: ['accepted', 'rejected', 'incomplete']
          falsy_valid: false
          documented_alternatives: []
    - id: runs_base
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "The sibling-trial union by `alert_id`. `empty-union` is N10's first-run alert, which the coverage view must state explicitly; `source-run-in-the-union` is J9's, and it is the one that would partly undo the experiment."}
          default: empty-union
          distinguished: ['empty-union', 'source-run-in-the-union']
          falsy_valid: true
          documented_alternatives: []
        access:
          constraints_by_via:
            sibling_union_scan:
              # J9. Two roots exist — the operator's runs base and `{episode_dir}/runs/`, where
              # this episode's own siblings live outside the runs base — and no reader at base
              # indexes either by alert_id (run1/G8). `alert.json` is model-writable by
              # construction (run1/G9). If the union is the runs base AND includes the source
              # run, the judge is shown the run's own close as a "sibling trial", which is
              # precisely the `current` arm's measured failure (C9).
              trust: attacker-influenced
              # J9 SETTLED at §7 (human).
              constraints: [operator-runs-base-as-the-root, source-run-excluded-and-said-to-be, closed-runs-only, unreadable-sibling-skipped-with-a-counted-note, union-computed-once-per-pass]
    - id: run_dir
      provenance: code
      facets: {}                 # `{episode_dir}/runs/<sibling>/` — read by the archive at step 6 and by NOTHING in the judge's path (that is what D7 buys). #947's D3 says it may be gone
    - id: lessons_checkout
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "Lesson bodies read at the sibling's recorded commit through `_git.git_show_file`. Both failure classes return a plain `None` — no exception at either (P1) — and `None` is also what a legitimately empty body returns."}
          default: absent-path
          distinguished: ['absent-commit', 'absent-path']
          falsy_valid: true
          documented_alternatives:
            # J8: O8 says grading is reproducible from "the checkout at the sibling's recorded
            # commit". A moving ref or an `allow_dirty` family makes that sentence false with
            # nothing saying so, and `allow_dirty` appears nowhere in the design.
            # J8 SETTLED at §7 — BOTH taken. `false` on each: `absent-path` stays a valid value
            # under them; they add a rendering duty, not a new validation of the value.
            - {value: ref-pinned-once-per-episode-grading-invocation, crosses_validation: false}
            - {value: allow_dirty-surfaced-as-a-caveat-in-the-lessons-view, crosses_validation: false}
    - id: agent_registry
      provenance: code
      facets:
        access:
          constraints_by_via:
            questioner:
              # QUESTIONER_DEF is zero-grant and `bind` refuses it BY NAME; the registry admits
              # ONE definition per role key, so a second definition under AgentRole.JUDGE cannot
              # register while JUDGE_DEF is registered (C16, run1/G13). StageWiring — not the
              # definition — carries per-call model, effort and agent id.
              trust: derived
              constraints: [zero-grant, deny-all, one-definition-per-role, wiring-carries-model-effort-agent-id]
    - id: judge_stage_wiring
      provenance: design
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The judge's own knobs. All three have NO HOME AT BASE (run1/G24) and no stated
              default, which is why `default` names the settled READ TIMING rather than a number
              this assembly invented. Every new knob inherits `_env`'s semantics: an unset name takes the
              default, `env_int` raises `FatalConfigError` on a non-integer AND on the empty
              string while admitting 0 and negatives unclamped, `env_str` returns `''` as `''`
              unless `choices` is passed, and a knob read at import FREEZES at that import
              (run1/G23).
          # J15 SETTLED at §7: WHEN each knob is read is decided — once, at the top of the
          # pass, with the resolved values recorded beside the draw count. The three NUMERIC
          # defaults were deliberately NOT set at the seam and are not invented here: run1/G24
          # confirms no definition site exists at base, and the resolved value is written onto
          # the family record precisely so an operator reads it back instead of guessing.
          default: resolved-once-at-the-top-of-the-pass
          distinguished: ['draws-per-world', 'judge-model', 'judge-effort', 'render-payload-cap']
          falsy_valid: false
          documented_alternatives: []
    - id: judge_stage_seam
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              How a draw fails. A wall-clock timeout (`LEARNING_SUBAGENT_TIMEOUT_SECONDS`,
              default 450, through `asyncio.wait_for`) and a raw transport failure both surface
              as `RunUnprocessable` — never a sentinel and never a hang — separable only by
              message text and `__cause__` (P9); the empty-output case takes the same class
              again. A handler that branches on exception TYPE cannot tell them apart.
              `run_stage` drives through `asyncio.run`, so N concurrent draws are processes or
              threads, never one loop (run1/G12).
          default: timeout
          distinguished: ['timeout', 'transport-failure']
          falsy_valid: false
          documented_alternatives: []
    - id: fixture_corpus
      provenance: design
      facets: {}
      # `experiments/judge-context-921/` — M1's port source and M9's fixture seed. IT IS
      # UNTRACKED WORKING-TREE STATE IN THE MAIN CHECKOUT AND DOES NOT EXIST IN THIS WORKTREE AT
      # BASE (G10). NO DEMAND MAY BIND AN ADDRESS INSIDE IT until it is committed with the spec
      # or the fixtures are authored fresh — which is J16, and it gates phase E, not phase D.
      # The boundary is modelled facetless so the three fixture demands have a real address to
      # bind while asserting nothing about a tree that is not there.

