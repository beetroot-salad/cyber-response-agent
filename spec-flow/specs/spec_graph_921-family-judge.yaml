  - id: refused_and_fault_are_not_defender_failures
    kind: domain-outcome
    form: test
    source: "amendment ('refused and fault were invisible to the old table and are real outcomes'), CORRECTED by A5's refutation and settled by the human's J5 tier rule"
    binds:
      - 'ledger_source.domain.distinguished[refused]'
      - 'ledger_source.domain.distinguished[fault]'
    discharged_by: test_921_world_whose_H_call_was_refused_is_not_graded_a_defender_failure
    seed_docstring: >-
      REWRITTEN TO THE CORRECTED MECHANISM. The sentence this demand was seeded on — that
      `refused` and `fault` blur into one another, so both mean "never given the chance to
      fail" — is REFUTED (A5, EXECUTED, `47-probe-a5.py`). They partition CLEANLY at the write
      seam and the two halves are graded differently. `refused` is the CAPABILITY class, full
      stop: the pre-`prepared` handler files it iff `failure.exit_code == USAGE_EXIT_CODE`
      (64), so a world whose discriminating call was refused was never given the chance to fail
      on it and is NOT graded a defender failure — the row is not "a doctored answer served",
      and it does not by itself put the world in `analyze-discipline` or `decision-discipline`.
      (One qualified survivor, also executed: a deployment's own default index naming two
      corpora raises `StagingError(64)` and files `refused`, so a `refused` row can be the
      DEPLOYMENT's fault rather than the world's — still a capability answer.) `fault` is a
      different event: a missing `config.env` or a blank required key at prepare time raises
      `ConfigFault(exit_code=2)` and is filed `fault`, NEVER `refused`, and `fault` also covers
      an in-flight adapter crash after prepare (one `fault` row, with no `base` row beside it,
      because `_base_payload` raises before recording). J5's tier rule, settled with the human,
      is what grades it: a FAULTED call makes the world `ungradable` — named with the faulted
      call and excluded from `verdict_word` — rather than being folded in beside `refused`. The
      test must pin THAT, and must never assert a `refused` row for a missing config: that is
      the refuted behaviour, and pinning it would harden a wrong prior into the contract.
      F-1, SETTLED AT THE PHASE-F SEAM AND PINNED HERE: A REFUSED CALL COUNTS AS HAVING QUERIED.
      `47-runtime-probes.md` red flags 2 (executed) observed that a `refused` or `fault`ed call
      writes exactly one world-owned row whose `source` sits OUTSIDE `APPLIER_DECISIONS`, so a
      predicate over the applier decisions alone reads "world X never asked H" for a world that
      asked H and was refused — `lead-set`, the bucket that authors a lesson. The human's
      rationale settles it: the grade exists to produce learnings for the DEFENDER runtime, so a
      refusal is evidence the defender asked correctly and the estate did not answer.
      `holding_queried` is TRUE on both rows, and both worlds are EXCLUDED FROM THE FAILURE
      BUCKETS rather than defaulted into the never-asked one.
    note: >-
      CLOSED. The NEW fork this refutation raised on the phase-D reconciliation leaf ("does
      `fault` partition the way this demand assumes?") is settled by J5's answer at the §7
      seam: a faulted call is ungradable, not a defender failure. `handoff.forks` records it as
      resolved rather than open.

