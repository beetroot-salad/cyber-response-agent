  # --- 46-reground.md's ten probes -------------------------------------------------------
  # NINE OF THE TEN ARE QUOTED SOURCE, NOT EXECUTION, however the frontier's digest reads
  # ("All 10 probes executed"). Only P1 ran anything. Each is typed by what its sentence
  # predicts and carries the instrument actually used; the six that predict runtime over an
  # input and closed on a read are `unprobed` and are probe obligations.
  - {id: P1, kind: behavior, claim: "git_show_file returns a plain None for a fabricated rev AND for a real-rev/absent-path, raising nothing at either — the two cases are indistinguishable at this layer and from a legitimately empty body", probe: "PYTHONPATH=<worktree> python3 -c 'from defender._git import git_show_file; print(git_show_file(Path(\".\"), \"a\"*40, \"defender/_git.py\")); print(git_show_file(Path(\".\"), HEAD, \"defender/this_path_does_not_exist_xyz.py\"))'", probe_kind: executed, observed: "verbatim output `None` and `None`. Source: `_run([...], check=False)`; a non-zero `git show` becomes None", verdict: holds}
  - {id: P2, kind: behavior, claim: "an appender's queue_lock acquisition is a blocking flock with no deadline, but it contends only with other APPENDERS: the drain passes a deadline and raises TimeoutError, deliberately outside its retire set", probe: "EXECUTED — `47-probe-p2-p4.py`: a real second PROCESS holds the lock for 3s; the parent then asks for it twice, once with a deadline and once without", probe_kind: executed, observed: "EXECUTED. `DRAIN` with `timeout_seconds=1` raised `TimeoutError` after 1.00s, confirmed NOT in `RETIRE_SET = [AuthorError, GitError, ModelRetry]`. An `APPENDER` with no deadline BLOCKED and acquired the lock only after 2.00s (the holder's 3s sleep), never raising. Also corrects the row's stated symbol: `queue_lock` lives in `learning/core/persist.py`, not `learning/core/config.py`.", verdict: holds}
  - {id: P3, kind: referential, claim: "append_findings builds one list and makes ONE append_jsonl call — one open, one loop, one queue_lock hold for the whole batch — not one lock/append cycle per row", probe: "read defender/_io.py::append_jsonl and learning/core/persist.py::append_findings", probe_kind: read, observed: "one `with queue_lock(...)` around one `append_jsonl(path, rows)`; append_jsonl opens once and loops the writes. Reinstates discount D4 at the call-shape level. Caveat, not a refutation: the individual fh.write() calls are not fsync'd, so this is a call-shape guarantee and not an OS-level crash guarantee", verdict: holds}
  - {id: P4, kind: primitive, claim: "write_guarded(mode='replace') stages to an unpredictable name and os.replace's, so the target holds the old bytes or the complete new bytes and never a partial write; it refuses only an ALIASED existing target and silently clobbers an ordinary one", probe: "EXECUTED — `47-probe-p2-p4.py`", probe_kind: executed, observed: "EXECUTED. An ordinary target's inode changed (4595166 -> 4595167) confirming replace-not-truncate, never a partial write; staged names are unpredictable (`artifact.json.staged-057dab0ff1f789cc`) and removed afterwards. A genuine mid-write `UnicodeEncodeError` (a lone surrogate 100000 bytes in) left the target holding its COMPLETE OLD bytes, staged file cleaned up. A symlinked and a hard-linked target both raised `OSError` (\"refusing to write through a non-plain or aliased entry\"); an ordinary OCCUPIED target was clobbered silently — confirms refuse-only-aliased / clobber-ordinary exactly as claimed. Reinstates discounts D5 and D6.", verdict: holds}
  - {id: P5, kind: referential, claim: "both findings idempotency guards key on `finding_id`: the corpus-side check reads the provenance field derived from cfg.channel.id_key out of each authored lesson's frontmatter, and the pending-queue gate compares entry['finding_id'] against that set", probe: "read learning/author/lessons/run.py (the gate) and the corpus-side existing_finding_ids", probe_kind: read, observed: "as stated — neither run_id alone nor full row content is the key. This is what forces finding_id to be deterministic across retries and unique across (world, draw, finding index)", verdict: holds}
  - {id: P6, kind: behavior, claim: "a row missing run_id or direction raises a bare KeyError inside _gate_findings; _tick stuck-records THE ENTIRE KEYED BATCH and then re-raises, so one malformed family row takes every well-formed adversarial and benign row of that tick with it and the tick fails", probe: "EXECUTED — `47-probe-p6.py`: a real `AuthorConfig` from `build_author_config(LoopPaths(...))`, three real rows appended to a real `findings.jsonl`, `drain._tick` driven directly", probe_kind: executed, observed: "EXECUTED. One family-tier row with no `run_id` raised a bare `KeyError('run_id')` out of `_gate_findings`; `_tick` recorded the WHOLE keyed batch to `findings.stuck.jsonl` — all three row ids, including one well-formed adversarial and one well-formed benign row riding beside it — and re-raised; nothing was consumed (`consumed file exists: False`). Confirms Red flags 3: M5 must refuse an ungradable family row BEFORE it is appended, not after `_gate_findings` has already indexed it.", verdict: holds}
  - {id: P7, kind: referential, claim: "iter_resolutions yields every dict in a lead's `resolutions` list in document order, with no dedup, no ordinal cutoff and no fence-awareness anywhere in the walker or the schema", probe: "read defender/skills/invlang/_walkers.py::iter_resolutions and schema.py; grep -n fence over both (no hits)", probe_kind: read, observed: "as stated. The oscillation case J4 asks about is structurally reachable, not hypothetical — but 'any qualifying row vs the last row' remains a design choice the probe cannot settle. INFORMS ONLY", verdict: holds}
  - {id: P8, kind: behavior, claim: "step 4 and step 6 write the SAME `episode.outcome` key, and step 6's merge_review (`held.update(block)`) overwrites step 4's descriptive sentence with its enum value on every episode that reaches step 6 — so step 4's sentence is never durably visible in the archived review.yaml", probe: "EXECUTED — `47-probe-p8.py`: the real `review.review(...)` writes `review.yaml` (step 4), then the real `cli._record_episode_outcome(...)` merges over it (step 6)", probe_kind: executed, observed: "EXECUTED. Step 4's `episode.outcome` sentence (\"1 worlds reviewed, none rejected\") is ABSENT from the file entirely after step 6 merges `outcome: accepted` over it (`step 4's sentence still anywhere in the file: False`). `episode.decision` and the `worlds` block both survive step 6 unchanged. A live data-loss finding, wider than #921.", verdict: holds}
  - {id: P9, kind: behavior, claim: "a wall-clock timeout and a raw transport failure both surface as RunUnprocessable — never a sentinel, never a hang — separable only by message text and __cause__, so a draw handler cannot branch on exception type", probe: "EXECUTED — `47-probe-p9.py`: the real `run_stage` under `override_allow_model_requests(False)`, model supplied through `make_model=` (a `FunctionModel`): one arm awaits 30s, one blocks the event loop 30s, one raises `TransportFault`", probe_kind: executed, observed: "EXECUTED. A model that awaits is cut at 1.02s against a 1.0s deadline; a model that BLOCKS the event loop ran 30.04s against the same deadline before raising; a transport failure raised in 0.01s. All three surfaced as `RunUnprocessable`, separable only by the `did not complete:` / `failed:` message prefix and `__cause__` — no sentinel, no hang, and a draw handler cannot branch on exception type. Cooperative-deadline caveat named, not resolved (Red flags 6).", verdict: holds}
  - {id: P10a, kind: referential, claim: "the archive's directory input is per-entry screened: stage_tables walks with symlinks=True and an ignore hook that refuses and reports a non-artifact entry at any depth, rather than aborting the world", probe: "read learning/lead_repository.py::stage_tables and learning/branch/archive.py", probe_kind: read, observed: "as stated. The screen-then-copy discipline is all-or-nothing per world for the SINGLE files; the directory walk is per entry", verdict: holds}
  - {id: P10b, kind: referential, claim: "the per-file shutil.copy2 loop and the write_guarded pointer write carry no cleanup handler, so archive.py's docstring guarantee ('archives NOTHING rather than a half-world') covers only the screen-detected refusal path", probe: "read learning/branch/archive.py:137-190 (the copy loop and the pointer write) against its own module docstring", probe_kind: read, observed: "no try/except removes partially-copied files; a genuine mid-copy I/O fault leaves a half-populated worlds/<label>/, recorded as outcome=INCOMPLETE and re-raised. J5's rule must cover that state; M7 does not prevent it", verdict: holds}
  - {id: P10c, kind: behavior, claim: "verify_family cannot race a still-writing sibling: start_family blocks on every sibling's subprocess.run().returncode before returning, so by archive time each sibling process has exited", probe: "EXECUTED — `47-probe-a9-g23.py` (the same run as A9)", probe_kind: executed, observed: "EXECUTED. `start_family` returned at 1.40s, exactly when the last child exited, with zero live markers on disk at return — every sibling process had exited before the call returned, so `verify_family` (the very next statement) cannot race a still-writing sibling's process. A crashed sibling's own partial output is unaffected either way. Same residual read as A9 (Red flags 6): the caller's statement order was not driven.", verdict: holds}

