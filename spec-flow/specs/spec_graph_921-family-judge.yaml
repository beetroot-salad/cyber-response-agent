  - {id: A4, kind: behavior, claim: "the `source` column decides exactly as the amendment states, and its docstring names #921 as the reader", probe: "EXECUTED — `47-probe-ledger.py` (ARM 3, 3b, 4, 4b, 5b) plus `47-probe-vocab.py` for the closedness of the vocabulary at the write seam", probe_kind: executed, observed: "EXECUTED. The four arms observed verbatim, one line each: not touched -> `passthrough`; touched + patch hit -> `patched` (payload rewritten, owner estate -> world-b); touched + patch miss -> `passthrough`; staged system, overlay DECLARES the corpus -> `staged` with `asked_params`; overlay does NOT declare it -> `passthrough`, no `asked_params`. Vocabulary closed at the write seam: `SOURCES = [base, captured, fault, passthrough, patched, refused, staged]`; an invented decision word (`mutated`) is REFUSED; `captured` through the serving path is REFUSED; a world-owned `base` row is REFUSED; a `passthrough` row with no owner is REFUSED; a legitimate `patched` row is WRITTEN. `applier.py:236-237`'s '#921 is the reader' sentence is a read; the behaviour is executed.", verdict: holds}
  - {id: A5, kind: behavior, claim: "a `refused` row is the capability answer and can be an environment fault at prepare time, so it does not always mean 'this world could not be pointed at the corpus'", probe: "EXECUTED — `47-probe-a5.py`, four arms: no `config.env` at all; a present config with a blank required key; a well-formed config whose configured default index names two corpora; a well-formed control", probe_kind: executed, observed: "REFUTED. A5-1 (no config file) and A5-2 (blank `ELASTIC_EVENTS_INDEX`) both RAISE `ConfigFault(exit_code=2)` and are filed `source: fault`, never `refused` — the claim's own cited mechanism is false. The pre-`prepared` handler files `refused` **iff** `exit_code == USAGE_EXIT_CODE` (64); `ConfigFault.exit_code` is 2, so a missing config or missing key can never reach that arm. `refused` is the capability class, full stop, for this mechanism — the refutation NARROWS the ledger's meaning in the judge's favour, it does not widen it as the claim sentence concluded. Takes NO part of the amendment with it: `refused` appears in no row of the bucket table, no predicate of the family pass, no `FamilyGrade` field, and A1/A2/A4/G2 (the amendment's own mechanism) are EXECUTED and hold. One qualified survivor (A5-3): a deployment's own default index naming two corpora raises `StagingError(exit_code=64)` and IS filed `refused` — so a `refused` row can still be the DEPLOYMENT's fault rather than the world's, just never a missing-config/missing-key fault. This refutation raises a new open finding against `refused_and_fault_are_not_defender_failures` — see `handoff.forks` (NEW, not resolved here).", verdict: refuted}
