    source: "phase-F finding 4's re-run outcome (P3 executed, `48-p3-p5-executed.md`), HUMAN-RESOLVED at the phase-F seam as F-11"
    binds:
      - 'findings_jsonl.access[judge_enqueue]'
      - 'interacts(judge_enqueue->findings_jsonl)'
      - 'episode_judge_yaml.payload'
    discharged_by: test_921_a_torn_trailing_row_in_the_findings_queue_is_skipped_and_counted
    seed_docstring: >-
      The findings-queue reader TOLERATES A TORN TAIL: an unparseable final line is SKIPPED AND
      COUNTED on the family record, never raised on. P3's re-execution SIGKILLed a real child
      process mid-batch-write against the real `append_findings` and observed a genuinely torn
      trailing row — 182532 bytes of a partially-written row on disk, no closing newline,
      nothing else corrupted — so the "individual `fh.write()` calls are not `fsync`'d" caveat
      is an OBSERVED, non-deterministic outcome of an ordinary hard kill rather than a
      theoretical gap. It matters because P6 (executed) established that a bad row in this queue
      takes the WHOLE keyed batch to `stuck.jsonl` and re-raises out of `_tick`, and #921 adds a
      SECOND writer to that same sink: one torn row must not stall the corpus drain for the two
      directions that already work. The loss is bounded to the torn line — every row the pass
      says it enqueued is readable afterwards, and so is the row that was already queued.
    note: >-
      Recorded as CONSISTENT WITH J3 rather than as a new posture: skip-and-count with the count
      on the family record is exactly what J3 chose for the ledger reader. The accepted cost is
      stated: a torn line becomes survivable rather than loud, so a writer bug producing one is
      QUIETER than today — which is what the count buys back, since a silent skip and a counted
      skip are the same drain and different evidence.

