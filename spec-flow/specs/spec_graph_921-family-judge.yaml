      an unavailable lesson is SILENT unless the render marks it.

  # =========================================================================================
  # Key flows — trigger, second-grade refusal, write discipline.
  # =========================================================================================

  - id: judge_runs_on_an_accepted_episode_only
    kind: domain-outcome
    form: test
    source: "flow 1"
    binds:
      - 'review_yaml.domain.distinguished[accepted]'
      - 'review_yaml.domain.distinguished[rejected]'
      - 'review_yaml.domain.distinguished[incomplete]'
      - 'drives(judge_episode->judge_family)'
    discharged_by: test_921_rejected_and_incomplete_episodes_are_not_graded
    seed_docstring: >-
      Only an `accepted` episode is graded; `rejected` and `incomplete` are recorded as "not
      graded, reason" rather than passing silently. Base's own reader gates on `incomplete`
      ALONE and admits `rejected` (G14), so the enqueue-only-on-accepted rule is #921's, not
      the base's.
    note: >-
      J10 SETTLED at §7 (human): the judge runs at the TAIL OF THE STEP RUNNER, after the
      archive step and before the return — never in `_launch`'s post-teardown cleanup path,
      whose frame a probe found production-dead on this route. The outcome gating rides with
      it: an incomplete episode can still hold cleanly archived worlds.

  - id: the_trigger_reads_the_one_merged_outcome_key
    kind: behavior
    form: test
    source: "45-dispositions §1 (consensus, P8)"
    binds: ['interacts(judge_episode->review_yaml)', 'review_yaml.payload']
    discharged_by: test_921_the_trigger_reads_the_single_episode_outcome_key_step_six_wrote
    seed_docstring: >-
      `review.yaml` carries ONE `episode.outcome` key, not two. Step 4 writes a human sentence
      into it and step 6's `merge_review` OVERWRITES that with its enum value on every episode
      that reaches step 6 (P8), so by the time the judge runs the key always holds step 6's
      word; `decision` beside it is step 4's and is not the trigger. Drive a full episode and
      read the key back off disk.
    note: >-
      P8 also exposes a branch-lifecycle DATA-LOSS finding wider than #921 — step 4's sentence
      is never durably visible in the archived `review.yaml`, and nothing marks which step wrote
      which half. It leaves with the questioner/archive owner (handoff.deviations), not here.

