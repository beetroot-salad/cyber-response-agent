  - id: holding_system_is_validated_at_manifest_load
    kind: behavior
    form: test
    source: "45-dispositions J1, HUMAN-RESOLVED at §7 (validate at load, refuse)"
    binds:
      - 'family_manifest.access[questioner_authored]'
      - 'interacts(judge_family->family_manifest)'
    discharged_by: test_921_the_holding_system_is_validated_against_the_served_roster_at_manifest_load
    seed_docstring: >-
      `H` — `discriminator["holding_system"]` — is validated at manifest load: present,
      non-empty, and a member of the seven served-system names (`STAGERS | PATCHABLE_SYSTEMS`)
      after `strip()` and casefold; the manifest is REFUSED otherwise. `H` is unvalidated model
      text with zero production readers at base and all five per-world facts key on it, so a
      bogus or absent `H` sends every non-control world to `lead-set`, makes every
      verdict-mismatch a `survived` family, and `survived` is the word that AUTHORS a lesson.
      Not validating fails silently and authoring-actively; validating fails loudly at a step a
      human already reviews. Positive control in the same arm: a near-miss differing only by
      case and surrounding whitespace is ACCEPTED, so the check is roster membership rather
      than a string equality that refuses everything unusual.

  - id: an_absent_input_makes_the_world_ungradable_and_excluded
    kind: behavior
    form: test
    source: "45-dispositions J5 tier 1, HUMAN-RESOLVED at §7"
    binds:
      - 'family_bucket.domain.alternatives[ungradable]'
      - 'served_ledger.domain.distinguished[absent]'
      - 'world_report.domain'
      - 'JUDGE_OUTCOME_ENUM.domain.distinguished[undecidable]'
    discharged_by: test_921_a_world_missing_an_input_is_ungradable_named_and_excluded_from_the_verdict_word
    seed_docstring: >-
      A world whose input is ABSENT is `ungradable`, carried on the family record WITH THE NAME
      of the missing input, EXCLUDED from `verdict_word`; and if no non-control world remains
      gradable the family is `undecidable`. Silent exclusion is authoring-active in BOTH
      directions — dropping the world that disagrees flips `survived` to `caught` and suppresses
      a lesson, dropping the one that agrees flips `caught` to `survived` and authors one — so
      the exclusion must be on the record rather than in the reader's head. Four absences are
      driven by deleting the real artifact: the archived report (a state `verify_family`
      deliberately produces, which `verdicts` SKIPS, A8 executed), the world's ledger file,
      `disposition_declared` on the manifest entry, and `alert.json`.

  - id: a_malformed_input_refuses_the_judge_pass_loudly
    kind: behavior
    form: test
    source: "45-dispositions J5 tier 2, HUMAN-RESOLVED at §7"
    binds:
      - 'world_report.domain.distinguished[outside-vocabulary]'
      - 'world_investigation.domain'
      - 'interacts(judge_family->world_report)'
    discharged_by: test_921_a_malformed_input_refuses_the_judge_pass_loudly
    seed_docstring: >-
      A MALFORMED input refuses the episode's judge pass loudly: a malformed artifact is a bug
      in the writer, not a fact about the defender. This preserves base's own split rather than
      contradicting it — `verdicts` SKIPS a world archived without a report and REFUSES one
      whose report exists and cannot be read or declares a disposition outside the vocabulary
      (A8, executed) — with tier 1 taking the absent and tier 2 the malformed. FOUR
      malformations are written as real bytes: a disposition outside the vocabulary, a report
      that cannot be read at all, a document truncated inside an open invlang fence, and — F-7,
      settled at the phase-F seam — A PARTIALLY ARCHIVED WORLD. P10 named the state the archive
      does not prevent and the three tiers did not: the single-file `copy2` loop has no
      rollback, so a genuine mid-copy I/O fault leaves a world with all five required inputs
      present and a supporting directory SHORT, which otherwise grades normally and silently on
      a thinner view than it appears to have. It joins the MALFORMED tier rather than minting a
      fourth, AND THE ERROR MESSAGE IS PART OF THE DEMAND: the refusal must name the input that
      was short, because a partial archive is otherwise indistinguishable from a genuine
      malformation and the operator would go hunting a writer bug in the world's own artifacts.
      The state is written to disk directly rather than reached by an invented I/O fault: P10's
      executed half establishes it is reachable, and inducing a disk fault no probe observed
      would be an author-imagined fault.

  - id: a_duplicate_world_label_is_refused_at_manifest_load
    kind: uniqueness
    form: test
    source: "45-dispositions J5 tier 3, HUMAN-RESOLVED at §7"
