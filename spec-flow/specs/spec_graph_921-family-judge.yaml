      other is an artifact that is checked and not copied (run1/G28).

  - id: the_new_directory_input_is_per_entry_screened
    kind: behavior
    form: test
    source: "45-dispositions §1 (consensus, P10)"
    binds: ['interacts(archive_episode->world_dir)', 'world_dir.access[archive_copy]']
    discharged_by: test_921_the_archived_directory_input_refuses_a_non_artifact_entry_and_keeps_the_rest
    seed_docstring: >-
      `gather_summaries/` is a directory of model-written `{lead_id}.md` files and takes the
      per-entry-screened `stage_tables` walk, not a blind `copytree` and not `_screen` +
      `copy2`: a non-artifact entry at any depth is REFUSED AND REPORTED, and the rest of the
      world still archives. BOTH HALVES ARE DRIVEN, and the second is F-7's: the path the screen
      does NOT cover leaves a world SHORT, and that state is refused by the judge pass with the
      short input named, rather than graded on a thinner view. Citing the half-populated world
      and driving only the screen — the one path P10 says IS all-or-nothing — left the citation
      discharging nothing.
    note: >-
      J5 EXTENDED BY F-7, settled at the phase-F seam. The archive's docstring guarantee
      ("archives NOTHING rather than a half-world") covers only screen-detected refusals; the
      single-file `copy2` loop has no rollback, so a genuine mid-copy I/O fault leaves a
      half-populated `worlds/<label>/` (P10, red flag 4). That state is now MALFORMED — tier 2,
      refuse the pass, with a descriptive error NAMING THE INPUT THAT WAS SHORT — rather than a
      fourth tier. The message is part of the demand, not decoration: a partial archive is
      otherwise indistinguishable from a genuine malformation. Both halves are driven here — the
      screen path keeps the world whole, and the path the screen does not cover is refused.

