  # A1, A2, A4, A5, A8 and A9 were filed `behavior` and closed on a code READ. They are the
  # amendment's own mechanism, and a read cannot falsify a prediction over an input — so they
  # carry their reading in `observed` and `verdict: unprobed`. Executing them is cheap
