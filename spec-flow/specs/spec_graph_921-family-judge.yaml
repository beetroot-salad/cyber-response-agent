  - id: the_render_cannot_tell_an_absent_commit_from_an_absent_path
    kind: domain-outcome
    form: test
    source: "45-dispositions §1 (consensus, P1)"
    binds:
      - 'lessons_checkout.domain.distinguished[absent-commit]'
      - 'lessons_checkout.domain.distinguished[absent-path]'
    discharged_by: test_921_an_unavailable_lesson_body_is_marked_rather_than_rendered_as_nothing
    seed_docstring: >-
      `git_show_file` RAISES NOTHING: a fabricated rev and a real-rev/absent-path both return a
      plain `None`, indistinguishable from each other and from a legitimately empty lesson body
      (P1). So the render cannot be written to catch anything here, and an unavailable lesson is
      silent unless the render marks it — a silently absent body changes what the judge
      concludes, which is D7's own stated hazard arriving with no signal anywhere.
    note: >-
      J8 SETTLED at §7 (auto-resolved): the ref is resolved to a SHA once per pass and
      threaded; an absent commit or path renders as an explicit `unavailable: <reason>` line
