    kind: negative
    form: test
    source: "flow 1"
    binds:
      - 'episode_judge_yaml.identity'
      - 'episode_judge_yaml.domain.distinguished[present]'
      - 'episode_judge_yaml.domain.distinguished[absent]'
    discharged_by: test_921_existing_judge_yaml_stops_a_second_grade
    seed_docstring: >-
      A present `judge.yaml` stops a second grade. Note what that gate does NOT say: nothing
      records whether the ENQUEUE ran, so a crash between the family write and the enqueue
      orphans that episode's findings forever, with `judge.yaml` present and the episode
      unrerunnable (re-running the same source-run + branch-point pair is refused, run1/E5).
    note: "J11 SETTLED at §7 (auto-resolved): write `judge.yaml` LAST (after the enqueue) carrying the enqueued row count and the per-world completed-draw counts, validate readability rather than presence, and decide what an in-flight second launch does."

  - id: writes_go_through_write_guarded
    kind: seam
    form: test
    source: "flow 1; the design's Security paragraph"
    binds: ['interacts(judge_run->world_judge_dir)', 'interacts(judge_family->episode_judge_yaml)']
    discharged_by: test_921_both_episode_write_sinks_go_through_write_guarded
    seed_docstring: >-
      Both episode sinks are written through `write_guarded` into a tree #947 screens as
      box-reachable. `mode="replace"` stages to an unpredictable name and `os.replace`s, so the
      target holds the old bytes or the complete new bytes and never a partial write; it refuses
