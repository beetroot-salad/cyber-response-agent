  - id: g1
    kind: behavior
    claim: >-
      read_plain raises FileNotFoundError only when nothing is at the name (or nothing at a parent, or a dangling-link parent); every other shape raises a non-FileNotFoundError member of TEXT_READ_ERRORS, and entry_present answers True for all of those
    probe: >-
      /tmp probe script at 085b76e0 over absent, symlink, dangling link, HARD LINK, directory, fifo, parent-is-file, undecodable, empty, symlinked-parent, dangling-parent, absent-parent, looped-parent, empty-name (uid 0)
    probe_kind: executed
    observed: >-
      absent/absent-parent/dangling-parent → FileNotFoundError (entry_present False); symlink/dangling/dir/fifo → OSError(ELOOP, ALIAS_READ_REFUSAL); HARD LINK → OSError(EMLINK, ALIAS_READ_REFUSAL) and the ORIGINAL name is refused too (nlink 2); parent-is-file → NotADirectoryError('Not a directory'); undecodable → UnicodeDecodeError (str carries no path); empty file → '' (a read, not absent); SYMLINKED PARENT → followed, read succeeds; looped parent → OSError(ELOOP, 'Too many levels of symbolic links') (not relabelled, per read_plain's comment); empty name → root itself, ELOOP refusal
    verdict: holds
    note: extends r1 — the doc's observed list omits the hard-link errno and the parent-component shapes (F1, F2)
  - id: g2
    kind: behavior
    claim: >-
      a mode-000 file, or a name under a mode-000 parent (present OR absent leaf), makes read_plain raise PermissionError, never FileNotFoundError; Path.exists() raises PermissionError for the parent case
    probe: >-
