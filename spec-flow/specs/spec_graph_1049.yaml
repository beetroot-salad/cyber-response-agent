schema_version: 2
design: "1049"   # gh issue #1049 (+ #1044 closed as one piece): an episode-tree reader never holds an
                 # absolute path it could format. THE AUTHORITATIVE TEXT is the intent+design doc at
                 # `.spec-flow/inputs/design-doc.md` (typed O1–O4, the reader table, the claims block
                 # r1–r11) with its re-grounding comment (085b76e0), AS CORRECTED by the phase-A brief's
                 # six red flags (RF1–RF6), the extractor's four detail corrections (c-12..c-15), the
                 # judge's red flags (RF-J1..RF-J5) and the re-ground's (RF-RG1..RF-RG3) — every one
                 # listed under `handoff.refuted` below. Assembled at phase D from `10-brief.md`,
                 # `20-demands.md`, `45-dispositions.md` and `46-reground.md`; RE-ASSEMBLED (v2) after
                 # §7 flipped demand #0 — `70-resolutions.md` (the human's decision, "Resolved shape of
                 # demand #0") and `47-dispositions-v2.md` (phase C re-run) govern this shape.
                 # v3 (phase F, `92-reconciliation.md` F-1/F-3(ii)/F-4/F-5 + `70-resolutions.md`
                 # Addendum + `81-author-v2.md` + `91-blind.md`): PROSE AND `handoff:` ONLY — seeds
                 # and premise notes corrected to what the suite pins, the deviations refreshed
                 # against the author's record; no demand, bind, claim or gate entry changed.
tests: defender/tests   # the suite this graph derives (project profile `tests.dir`). check_binds scans
                        # its docstrings NON-RECURSIVELY over `*.py` in this one directory. Every
                        # `test_1049_*` pointer below names a test that does not exist yet — the expected
                        # phase-D state; the two `test_1025_*` pointers (d-23, d-30) name tests that DO exist
                        # here (verified by `grep -n "def <name>"` at assembly) and are bound unchanged.
base: 085b76e0dfdf2907b4fb6712ed0348c4522b16d1   # origin/main at write-tests' fork. write-code-from-spec's
                        # gate diffs against it. Every line anchor in this file was re-pinned by the
                        # brief at this SHA; resolve by SYMBOL, never by line (the doc's own rule).

# ===========================================================================================
# READ THIS FIRST — how this graph is organised (v2: after §7 flipped demand #0)
#
# demands  — 58 = the 38 extracted (`d-00`..`d-37`, 20-demands.md; binds RECONCILED to the
#            structure below: readers are actors, the records they open are boundaries) as they
#            stand after 70-resolutions.md + 47-dispositions-v2.md — 26 unchanged, 18 amended in
#            place, d-00 re-minted as the BIND contract (`provisional: false`), d-36 re-minted as
#            `d-36-page-flags-derive-from-state`; the judge's 7 `D-J1`..`D-J7` (D-J1..D-J4 RESOLVED
#            by the human — re-minted / finalized — D-J5..D-J7 auto); 5 NEW `D-V1`..`D-V5` (the
#            grammar, the bind, the per-component walk, names_one_file as the grammar, the page's
#            listing-only census); 3 `form: waiver` demands W1–W3 (the human's examined no on the
#            R7 firings; W4 is `actor_waivers.generate_case`); and 5 `s-<premise>` demands. Every
#            settled premise is FOLDED into a demand's `premises:` list (82: 79 in demands, 3 in
#            `handoff.drops` — #16, #59, #60) so phase F's walk joins by number. `premises:`,
#            `status:`, `family:` and `provisional:` are annotation keys the linter ignores;
#            `binds`, `kind`, `form`, `discharged_by`/`outcome`, `cites` are the formal slots.
# structure — the delta is `provenance: design`: the primitive as the human shaped it (`bind`, the
#            bound `read` / `read_jsonl`), the fourteen rewritten readers, the eight coalesce sites,
#            the page's record fillers, the `reader` seam (now `(bound, name)`) and the `name` /
#            `errors` / `entry_shape` / `_Record` domains. Ids the three coining passes disagreed on
#            are unified here: `read_record`→`read`, `read_jsonl_record`→`read_jsonl` (the resolved
#            shape's own spelling; `read_record` survives, if at all, as sugar), the twin's per-line
#            policy is `_jsonl_rows_of` (the code's name), `load_episode` / `_entries_of` /
#            `_build_roster` / `_check_gather_summaries` / `_archive_notes` are the kept stat sites
#            named by symbol. The grounded neighbourhood is `provenance: code`. Every lstat the
#            design deletes is a `mode: remove` edge (17: 13 `entry_present` — :1001's
#            `investigation_present` merged into `_load_world_archive`'s edge — 1 `artifact_file`,
#            3 `artifact_dir`) so R5 computes a per-reader survival question; the kept stat sites are
#            `invoke` edges so the census is a closed list (D-V5, RF-R10).
# claims   — 67: the brief's 28 (g1–g28, g15 split, g15b now EXECUTED and unrefuted — 61-reground-
#            g15b.md), the extraction's 22 (r1–r11 inherited, c-12..c-21 raised; c-19/c-20/c-21 are
#            facts about read_plain / Path.__truediv__, which the primitive no longer calls — notes
#            say so), the re-ground's 13 (rg1–rg13), g18x, and the re-classification's 2 (v2-1
#            executed, v2-2 read — the errno and portability corrections to the resolved shape's
#            mechanism). Verdicts are the closed vocabulary; every parenthetical rides in `note:`.
#            65 holds, 2 unrefuted (r10, g15b), 0 unprobed — recomputed at v2 assembly, not copied.
# gate     — CLEAN SLATE for the gate leaf's v2 run: the v1 record (53 triggers, 34 pre-discharged
#            entries, 16 holes) was computed against D-J1..D-J4 `pending-§7` and the old edge set,
#            and a stale recorded entry would silence a new firing (`answered()` reads `gate:`), so
#            it is cleared rather than marked; 60-residue.md keeps v1's witnesses. The comment in
#            the `gate:` block says which v1 rows carry over unchanged and which firings are new.
# ===========================================================================================

demands:

  # -----------------------------------------------------------------------------------------
  # #0 — the return-value contract, RESOLVED (70-resolutions.md "Resolved shape of demand #0";
  # 47-dispositions-v2.md re-mint). The human took the dissolving shape: `bind(root)` is the only
  # operation that takes a path; a name is a sequence of plain components by construction; every
  # component is opened no-follow from the previous handle; the answer is one of three typed
  # states. `provisional` is false: f-0 answered, demand #0 flipped and phase C re-ran (v2).
  # -----------------------------------------------------------------------------------------
  - id: d-00-record-read-contract
    kind: behavior
    form: test
    provisional: false
    discharged_by: test_1049_a_bound_reader_answers_exactly_one_of_present_absent_or_refused
    binds: ["bind", "RecordRead", "read", "read_jsonl", "interacts(read->RecordRead).response", "episode_dir",
            "name.domain.distinguished[relative]", "name.domain.distinguished[purepath]",
            "entry_shape.domain.distinguished[empty_file]"]
    premises: ["#10", "#11", "#40", "#20"]
    # docstring seed: "bind(root) is the only operation that takes a path; bound.read(name, errors='strict')
    # answers a frozen RecordRead in exactly one state — present (text is a str, possibly empty: an empty
    # file is text '', a read, not absent), absent (absent=True: ENOENT at any component), refused
    # (refusal=f'{name}: {reason}', the whole relative name as given, once, no component attribution) —
    # and bound.read_jsonl(name) answers (rows, malformed, RecordRead) with the same RecordRead it would
    # answer for the text. A name is a str in POSIX spelling (or a PurePath rendered as_posix) split on
    # '/' into plain components and echoed exactly as given (#10, #11 — RF-V5: './family.yaml' and
    # 'worlds//w/report.md' are no longer expressible, so the surviving half of #11 is 'a constructible
    # name is echoed exactly as given'); two calls are two walks — nothing is remembered between them
    # (#40)." The three name/entry_shape cells kept from v1 are the R4 members this seed still exercises.
  - id: d-01-absent-is-enoent
    kind: behavior
    form: test
    discharged_by: test_1049_nothing_at_the_name_is_absent_and_nothing_else_is
    binds: ["read", "entry_shape.domain.distinguished[absent]", "entry_shape.domain.distinguished[absent_parent]"]
    premises: ["#12 (absent root → every name absent — at the bind, F-C)"]
    # docstring seed: "bound.read over a name with nothing at it answers absent=True with no refusal; the
    # decision is ENOENT out of the walk's OWN open, at whichever step — nothing at the leaf, or a missing
    # parent component (absent_parent) — and an absent ROOT makes every name absent (#12, F-C). A
    # dangling parent is NOT absent (RF-R3: it left this demand for d-02)."
  - id: d-02-shape-table-refused
    kind: domain-outcome
    form: test
    discharged_by: test_1049_every_present_but_not_the_record_shape_is_refused_with_the_relative_name
    binds: ["read", "entry_shape.domain.distinguished[symlink]", "entry_shape.domain.distinguished[hard_link]",
            "entry_shape.domain.distinguished[directory]", "entry_shape.domain.distinguished[fifo]",
            "entry_shape.domain.distinguished[dangling_link]", "entry_shape.domain.distinguished[undecodable]",
            "entry_shape.domain.distinguished[parent_is_file]", "entry_shape.domain.distinguished[name_too_long]",
            "entry_shape.domain.distinguished[symlinked_parent]", "entry_shape.domain.distinguished[dangling_parent]"]
    premises: ["#6", "#12 (root a file → '<name>: Not a directory')", "#24", "#14 (F-D: the reason is never 'None' — D-J6 folded)",
               "#25 (F-F / RF-R3: a dangling parent is refused, re-binned from d-01)", "#26 (F-F: a symlinked intermediate is refused at that component)"]
    # docstring seed: "a symlink, hard link, directory, fifo, dangling link, undecodable bytes, a file OR a
    # fifo squatting a parent component, an over-long name, a SYMLINKED parent and a DANGLING parent each
    # answer absent=False with refusal '<name>: <reason>' — the alias shapes with ALIAS_READ_REFUSAL
    # (ELOOP; EMLINK for the hard link, c-15; the two parent aliases from the intermediate open's own
    # ELOOP, v2-1), the parent-is-file with 'Not a directory', the over-long name with 'File name too
    # long' (#6, rg1), the undecodable with the codec's own message — the WHOLE relative name said once
    # (RF-R6), and the reason is never 'None' (D-J6). A symlink whose target is itself unreadable is
    # exactly one ELOOP refusal (#24)."
  - id: d-03-permission-refused
    kind: domain-outcome
    form: test
    discharged_by: test_1049_a_mode_000_file_or_parent_is_refused_never_absent
    binds: ["read", "entry_shape.domain.distinguished[mode_000_file]", "entry_shape.domain.distinguished[mode_000_parent]",
            "entry_shape.domain.distinguished[search_only_parent]"]
    premises: ["#13 (mode-000 root: independent '<name>: Permission denied' per name, no aggregate — F-C, at the bind)"]
    # @NOT_ROOT (skips on this box — uid 0 — and runs in CI, g19). docstring seed: "a mode-000 file, a
    # readable file AND an absent name under a mode-000 parent (never absent — v2-1: EACCES for both as uid
    # 65534), and a name under a search-only (0o111) parent answer refusal '<name>: Permission denied'
    # with absent=False — search_only_parent is the deliberate contract row of the portable flag set
    # (RF-V1: O_RDONLY, not O_PATH; read_plain traverses it today); a mode-000 ROOT answers the same per
    # name (#13, F-C)."
  - id: d-04-open-decides-no-stat
    kind: negative
    form: test
    discharged_by: test_1049_the_primitive_asks_nothing_of_the_name_ahead_of_the_open
    binds: ["bind", "read", "read_jsonl", "interacts(read->episode_dir)"]
    # RESTORED to its original wording (F-A dissolved): the primitive asks nothing of the name ahead of
    # the open — the grammar was asked at construction, not of the filesystem; fstat on a HELD handle is
    # not ahead of an open. positive control: d-01 / d-02 / D-V3. docstring seed: "the bind, read and
    # read_jsonl make no lstat, stat(, exists, is_symlink, entry_present, artifact_*, resolve or realpath
    # call anywhere (an AST census over the three bodies names none of those); a recording os seam sees
    # exactly one open per component and one fstat per opened handle — absent-vs-refused is the open's
    # own answer."
  - id: d-05-refusal-root-free
    kind: negative
    form: test
    discharged_by: test_1049_no_refusal_the_primitive_formats_contains_the_root
    binds: ["read", "read_jsonl", "RecordRead", "episode_dir", "world_dir"]
    # positive control: d-02 / d-03 (every shape refused, each said — the parent rows included).
    # docstring seed: "over every shape in d-02 and d-03, neither str(root) nor os.path.realpath(root) is
    # a substring of the refusal; only the name as given is."
  - id: d-06-errors-policy
    kind: domain-outcome
    form: test
    discharged_by: test_1049_strict_is_the_default_and_replace_is_the_only_admitted_alternative
    binds: ["errors.domain.distinguished[strict]", "errors.domain.alternatives[replace]",
            "errors.domain.distinguished[unknown_handler]", "read", "interacts(read->errors)"]
    premises: ["#8 (F-A: errors= outside {strict, replace} → ValueError naming no path, before any open)"]
    # docstring seed: "with the default errors='strict' an undecodable byte is a refusal; with
    # errors='replace' the same bytes read as text with U+FFFD — the gather-summary read's policy; any
    # other value raises ValueError naming no path at the read call, before any open (a recording os seam
    # sees none) — rg2's LookupError-at-the-first-bad-byte is unreachable."
  - id: d-07-jsonl-twin
    kind: behavior
    form: test
    discharged_by: test_1049_read_jsonl_answers_rows_malformed_and_the_same_record_read
    binds: ["read_jsonl", "RecordRead", "_jsonl_rows_of", "interacts(read_jsonl->_jsonl_rows_of)"]
    premises: ["#17", "#18", "#19", "#20", "#21", "#44 (F-J: a torn last line is one malformed row, no retry)"]
    # docstring seed: "bound.read_jsonl over an absent name answers ([], 0, absent); over a refused shape —
    # a refused PARENT included — ([], 0, refused naming the relative name); over a readable file the
    # rows, the count of non-blank lines that were not rows, and a RecordRead carrying the text. The
    # tolerant policy is _jsonl_rows_of's, the per-line rule read_jsonl_rows_guarded shares (rg3): a line
    # that parses but is not an object is one malformed row (#17); a repeated key keeps its last value
    # (#18); a final row without a newline counts and trailing blank lines are neither rows nor malformed
    # (#19); rows and the RecordRead come off ONE walk, so rows non-empty with a refusal is impossible
    # (#20); a ledger whose every line is undecodable reads as replaced text with N malformed rows and no
    # refusal — errors='replace' is fixed on the twin (#21); a torn last line is one malformed row, never
    # a refusal (#44)."
  - id: d-08-screened-yaml-mapping
    kind: behavior
    form: test
    discharged_by: test_1049_screened_yaml_mapping_says_the_name_on_all_three_arms_and_none_on_absence
    binds: ["screened_yaml_mapping", "interacts(screened_yaml_mapping->episode_dir)", "read", "JudgeRefused"]
    # docstring seed: "screened_yaml_mapping(bound, name, what=…) raises JudgeRefused whose text names
    # `name` and not the root on the read, parse and shape arms, and answers None when nothing is at
    # name — None being the typed absent answer of a value-returning parsing reader, decided by branching
    # on RecordRead.absent, never on a sentence (RF-R1 / RF-V4)."
  - id: d-09-review-reader
    kind: behavior
    form: test
    discharged_by: test_1049_the_review_reader_says_review_yaml_and_answers_none_when_absent
    binds: ["_default_review_reader", "read_review_record", "interacts(_default_review_reader->review_yaml)"]
    # docstring seed: "read_review_record's default reader, called (bound, name), refuses the read and
    # parse arms with a sentence naming review.yaml and no root, answers None (not {}) when review.yaml is
    # absent — branched off the primitive's absent state (RF-R1) — and D-J7's shape arms otherwise."
  - id: d-10-samples-reader-unchanged
    kind: survival
    form: test
    discharged_by: test_1049_the_permissive_samples_reader_still_answers_empty_for_absent_unreadable_and_unparseable
    binds: ["_default_samples_reader", "read_samples_record", "read", "interacts(_default_samples_reader->samples_yaml)"]
    # docstring seed: "read_samples_record's default reader answers {} for an absent, an aliased, an
    # undecodable and an unparseable samples.yaml — #1007 M4 unchanged — through the bound primitive."
  - id: d-11-archived-report
    kind: behavior
    form: test
    discharged_by: test_1049_read_archived_report_says_report_md_on_the_read_and_absent_arms
    binds: ["read_archived_report", "interacts(read_archived_report->world_report)", "ReportRead"]
    premises: ["#67 (F-I as a type: the absent arm is the STATE; the 'report.md not found' sentence dies)"]
    # docstring seed: "read_archived_report(bound, 'worlds/<w>/report.md') answers the absent STATE when
    # nothing is at the name (no 'report.md not found' sentence, no None); a refused shape answers a
    # headline-less ReportRead whose reason names worlds/<w>/report.md exactly once, in the form
    # 'worlds/<w>/report.md could not be read: <reason>' — the moved pin test_1025_a_short_relative_
    # episode_dir_name_scrubs_only_itself asserts 'report.md could not be read' in the page, so the
    # 'refusal verbatim' alternative v2 offered is CLOSED (RF-A1, F-4g) — and no root; a readable report
    # still goes through parse_report_text (d-35). The entry_present at family.py:1136 is gone."
  - id: d-12-world-ledger
    kind: behavior
    form: test
    discharged_by: test_1049_the_world_ledger_refusal_names_served_token_label_jsonl
    binds: ["_read_world_ledger", "read_world_ledger", "read_jsonl", "interacts(_read_world_ledger->served_ledger)", "JudgeRefused"]
    premises: ["#39 (F-H + F-I: a ledger present at the gate and gone at the open is the absent refusal read_world_facts raises, never the gate's 'present')",
               "#44", "#28 (F-F: a symlinked served/ is refused at that component — the row names served/<token>.<label>.jsonl)",
               "#38 (F-H: the open decides, always — stated as a clause here and in d-13/s-42)"]
    # docstring seed: "read_world_ledger reads through bound.read_jsonl('served/<token>.<label>.jsonl'): an
    # absent ledger is the absent state (D-J2); an alias, a directory, a mode-000 file, or a SYMLINKED
    # served/ makes it raise JudgeRefused naming served/<token>.<label>.jsonl (composed
    # f'{token}.{label}.jsonl', RF-V3) and not the root; a torn line is still one counted malformed row,
    # never a refusal. Clause (F-H): a ledger present at _missing_required_input's gate and gone at the
    # open is the OPEN's answer — the absent refusal read_world_facts raises (#39)."
  - id: d-13-missing-input-ledger-name
    kind: behavior
    form: test
    discharged_by: test_1049_a_missing_served_ledger_is_recorded_as_served_token_jsonl
    binds: ["_missing_required_input", "_grade_world", "interacts(_grade_world->judge_yaml)", "interacts(_missing_required_input->served_ledger)"]
    premises: ["#39", "#41 (F-H: a vanished worlds/<w> is a 'missing its …' row on the pass — rg7)"]
    # docstring seed: "_missing_required_input answers 'served ledger (served/<token>.<label>.jsonl)' for an
    # absent ledger, so the judge.yaml row _grade_world writes reads 'world <w> is missing its served
    # ledger (served/<token>.<label>.jsonl)' with no root — the ordinary ungradable path. The grading
