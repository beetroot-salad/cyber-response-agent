# ===========================================================================================
structure:
  # The axis registry. `world_label` keys judge.yaml's rows (R2); `episode` is the page's and the
  # review record's path axis; `lead_id` names the gather summary; `draw` the per-draw trace.
  axes: [episode, world_label, lead_id, draw]

  actors:
    # ---- the delta (provenance: design) ----
    # the primitive as the human shaped it (defender/_io.py): a bind and a bound reader's two reads
    - {id: bind,                   frame: leg, provenance: design}   # bind(root, *, os_=os) — the ONLY holder of the root; opens it once (follows the operator's spelling, RF-R8).
                                                                       # The suite's required surface (RF-A9/RF-A11, F-4f): `os_` is an object with open/fstat/close/fdopen — the recorder's
                                                                       # seam, never monkeypatch, inherited by the derived sub-bind; bound.read(name, *, errors='strict') -> RecordRead;
                                                                       # bound.read_jsonl(name) -> (rows, malformed, RecordRead); bound.under(name) -> bound (the derived sub-bind, no-follow
                                                                       # components from the episode handle). No public or private attribute may carry the root's spelling (D-V2, F-3).
    - {id: read,                   frame: leg, provenance: design}   # <bound>.read(name, *, errors) — the per-component no-follow walk (D-V3)
    - {id: read_jsonl,             frame: leg, provenance: design}   # <bound>.read_jsonl(name) — the JSONL twin, errors='replace' fixed
    # the rewritten readers (the doc's table, plus the two RF2 rows)
    - {id: screened_yaml_mapping,  frame: leg, provenance: design}   # family.py:125
    - {id: _default_review_reader, frame: leg, provenance: design}   # family.py:162
    - {id: read_review_record,     frame: leg, provenance: design}   # family.py:182 — the seam holder
    - {id: _default_samples_reader, frame: leg, provenance: design}  # family.py:191
    - {id: read_samples_record,    frame: leg, provenance: design}   # family.py:214 — the seam holder
    - {id: read_archived_report,   frame: leg, provenance: design}   # family.py:1121
    - {id: _read_world_ledger,     frame: leg, provenance: design}   # family.py:884 (the JSONL-twin site)
    - {id: read_world_ledger,      frame: leg, provenance: design}   # family.py:1177 (public wrapper)
    - {id: read_world_facts,       frame: composition, provenance: design}   # family.py:1187 — composes ledger/report/investigation; refuses the ABSENT STATE with the relative name (D-J2)
    - {id: _missing_required_input, frame: leg, provenance: design}  # family.py:1232 — the grading lane's pre-filter, KEPT (RF-R10); ledger arm's spelling changes
    - {id: _check_gather_summaries, frame: leg, provenance: code}    # family.py:1058 — the grading lane's other pre-filter, KEPT (RF-R10); names_one_file now bars NUL there (D-V4)
    - {id: _archive_notes,         frame: leg, provenance: code}     # family.py:1205 — `artifact_dir(summaries)` at :1224 writes a NOTE, a presence question, not a read gate (RF-R10)
    - {id: lead_chain,             frame: leg, provenance: design}   # family.py:571 — `_without_path` (:630), the `artifact_dir(summaries_dir)` screen and the leaf `artifact_file` (:609) ALL deleted (F-G, D-J3); reads through a sub-bind DERIVED from the episode handle (D-V2)
    - {id: _read_archived_text,    frame: leg, provenance: design}   # family.py:1020
    - {id: read_investigation_facts, frame: leg, provenance: design} # family.py:1166
    - {id: _grade_from_document,   frame: leg, provenance: design}   # judge/__init__.py:828
    - {id: read_grade,             frame: leg, provenance: design}   # judge/__init__.py (public)
    - {id: _existing_grade,        frame: leg, provenance: design}   # judge/__init__.py:203 → screened_yaml_mapping
    - {id: read_family_stamp,      frame: leg, provenance: design}   # archive.py:104
    - {id: read_staged,            frame: leg, provenance: design}   # staging.py:360
    - {id: read_stage_timings,     frame: leg, provenance: design}   # timing.py:138
    - {id: verdicts,               frame: leg, provenance: design}   # branch/episode.py:183 (O3 only; eval lane)
