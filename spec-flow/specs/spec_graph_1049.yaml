claims:
  # ---- inherited from the design doc via 20-demands.md (12: r1, r1b, r2–r11), ids kept ----
  - id: r1
    kind: behavior
    source: discuss
    claim: >-
      read_plain raises FileNotFoundError only when nothing is at the name; dangling link, directory, fifo, symlink, hard link, parent-is-file and undecodable bytes raise other TEXT_READ_ERRORS members
    probe: >-
      throwaway script over the seven shapes as root; the EACCES arm is NOT executed here (root ignores mode bits)
    probe_kind: executed
    observed: >-
      absent → FileNotFoundError; four alias shapes → OSError(ELOOP); parent-is-file → NotADirectoryError; undecodable → UnicodeDecodeError
    verdict: holds
    note: >-
      extended by g1 (the hard link is EMLINK not ELOOP — c-15; parent-component shapes added) and by g2 (the EACCES arm, executed as uid 65534)
  - id: r1b
    kind: behavior
    source: discuss
    claim: >-
      a mode-000 file or parent makes read_plain raise PermissionError (refused), never FileNotFoundError
    probe: >-
      the doc deferred this to write-tests ("run under NOT_ROOT"); executed at grounding as uid 65534 via setpriv — g2's command
    probe_kind: executed
    observed: >-
      secret.txt (0o000) → PermissionError errno 13; closed/y.txt and closed/nothing.txt (parent 0o000) → PermissionError; never FileNotFoundError (g2)
    verdict: holds
    note: >-
      was `deferred` in the doc; discharged by g2 at 085b76e0. The suite's arm is @NOT_ROOT (skips on this box, uid 0; runs in CI — g19)
