    # ---- the primitive's own address space (design) ----
    - id: RecordRead
      provenance: design
      facets: {}
      # the frozen three-state value (present | absent | refused), exactly one; absent is a bool, never
      # derived from `text is None`; refusal = f"{name}: {reason}" — the whole relative name once (d-00, RF-R6)
    - id: ReportRead
      provenance: design
      facets: {}
      # read_archived_report's value; its absent arm is the primitive's absent STATE (F-I as a type, D-J2) —
      # the 'report.md not found' sentence is gone and None is not the answer
    - id: name
      provenance: design
      facets:
        domain:
          type: "str | PurePath"
          refinement: {nl: "a non-empty sequence of plain components — a plain component is a non-empty str that is not '.' or '..' and carries no '/' and no NUL (D-V1); a str is split on '/', a PurePath rendered as_posix first; absolute, dotdot, empty, dot and nul are INEXPRESSIBLE and raise ValueError naming no path at construction (F-A dissolved); a constructible name is echoed exactly as given"}
          default: none
          distinguished: [relative, purepath, absolute, dotdot, empty, dot, nul]
          falsy_valid: false
          documented_alternatives: []
        access:
          constraints_by_via:
            grading: {trust: attacker-influenced, constraints: [is_valid_run_id, world_label_names_directory, _non_control_worlds, names_one_file]}
            page:    {trust: attacker-influenced, constraints: [is_valid_run_id, names_one_file]}
            direct:  {trust: derived, constraints: [component-grammar]}
          # `grading` = the pass composes labels through _check_world_labels (grammar, and
          # _non_control_worlds' case-fold dedupe — rg11) and lead ids through names_one_file; `page`
          # = the page gates labels at :821/:904 with the same grammar (NO case-fold dedupe, RF-RG3)
          # and lead ids through the same names_one_file; `direct` = a caller that skips both (the
          # fifth-caller hazard #1044 named) — its constraint is the COMPONENT GRAMMAR itself
          # ("components only", D-V1 / H1): a caller that skips both gates cannot spell an escaping
          # name. The v1 `unknown` is resolved. names_one_file now bars a NUL byte on both gated lanes
          # (D-V4, RF-R7); `unnormalised` left the domain — under the grammar there is nothing to
          # normalise (RF-V5).
    - id: errors
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the codec error handler the bound read hands the decode: strict refuses an undecodable byte, replace substitutes U+FFFD (the gather-summary read's policy; fixed on the JSONL twin)"}
          default: strict
          distinguished: [strict, unknown_handler]
          falsy_valid: false
          documented_alternatives:
            - {value: replace, crosses_validation: false}
          # `unknown_handler` (e.g. "bogus") is not a member the design admits; it is listed so R4
          # asks what the primitive does with it — RESOLVED (F-A): ValueError naming no path at the
          # read call, before any open (d-06, D-J1); rg2's LookupError-at-the-first-bad-byte is
          # unreachable.
    - id: entry_shape
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "what is at the name when the walk runs — the O3 table, extended by g1/c-15/rg1 to the parent-component shapes and the over-long name, and by RF-V1 to the search-only parent the portable flag set refuses"}
          default: plain
          distinguished: [absent, empty_file, symlink, hard_link, directory, fifo, dangling_link, undecodable,
                          parent_is_file, mode_000_file, mode_000_parent, search_only_parent, name_too_long,
                          symlinked_parent, dangling_parent, absent_parent]
          falsy_valid: false
          documented_alternatives: []
          # symlinked_parent / dangling_parent: REFUSED by the per-component O_NOFOLLOW open's own
          # ELOOP on every lane (F-F dissolved; v2-1) — no parent screen anywhere in the package;
          # dangling_parent moved from d-01 (absent, c-15's read_plain fact) to d-02 (RF-R3).
          # search_only_parent (0o111): refused 'Permission denied' — the one delta from O_PATH
          # (rejected, v2-2: Linux-only); no launcher-built tree carries the mode (d-03, NOT_ROOT).
    - id: reader
