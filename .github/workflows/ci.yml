          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' \
            | tr ' ' '\n' | grep -qx runsc

      - name: Pre-pull the box rootfs
        run: docker pull python:3.11-slim

      # Quoted: an unquoted YAML scalar treats " #" as a comment, which silently truncated
      # this name to "Run the" — and the #631 workflow gate reports steps BY name.
      - name: "Run the #540 boundary suite under DooD"
        # Same enforcing posture as the `test` job (#631 D11 — every CI pytest over tests/
        # runs with the budget flag on). The block below is what test_budget_seams_631's
        # workflow gate reads; the `-e` on the docker run is what makes it TRUE, since the
        # pytest process lives in the container, not on the runner.
        env:
          DEFENDER_BUDGET_ENFORCE: "1"
        run: |
          set -eux
          # Written into the CHECKOUT, not /tmp: the checkout is the tree we already know is
          # bind-mounted into the container, so this needs no second assumption about which
          # host paths the daemon can resolve — the very thing this job exists to test.
          cat > .dood-inner.sh <<'INNER'
          set -eux
          export DEBIAN_FRONTEND=noninteractive UV_PROJECT_ENVIRONMENT=/venv
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          # The docker CLI only — the daemon is the runner's, reached over the bind-mounted
          # socket. That IS the docker-outside-of-Docker topology.
          # Bounded for the same reason as the gvisor key fetch (#937) — a third external
          # host on this job's critical path. No `pipefail` here: `tar` takes one member out
          # of the stream, so a reader that stopped early would fail the pipeline on SIGPIPE.
          curl -fsSL --max-time 60 --retry 3 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused \
            https://download.docker.com/linux/static/stable/x86_64/docker-28.0.1.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
          pip install --quiet uv
          cd /repo/defender
          uv sync --extra dev --extra runtime
          uv run pytest tests/e2e/test_540_box_boundary.py -v -rs
          INNER
          # -v "$PWD:/repo": the mount destination MUST differ from the source, or the bind is
          # a pass-through, the translation is the identity again, and this job would assert
          # exactly as little as the native one.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" -w /repo \
            -e DEFENDER_BUDGET_ENFORCE \
            python:3.11-slim bash /repo/.dood-inner.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync defender venv
        working-directory: defender
        # --extra runtime: mypy (below) type-checks the whole `defender` tree,
        # including runtime/, against the REAL pydantic-ai types. Without it,
        # ignore_missing_imports collapses every pydantic_ai type to `Any`, so the
        # runtime layer's annotations (ModelFactory, Model, Agent[…]) are
        # unchecked — defeating the #403 mypy gate there. The Anthropic+MCP stack
        # is the cost; the `code-smells` job stays dev-only (its AST gates don't
        # import the tree).
        run: uv sync --extra dev --extra runtime

      # Hard gate — blocks CI. Keeps the baseline (pyflakes + pycodestyle E)
      # clean repo-wide; extra rule sets are reported in the code-smells job.
      # `--select` on the CLI overrides per-file config, so the gate is uniform.
      - name: Ruff (hard gate — E + F)
        run: defender/.venv/bin/ruff check . --select E,F --ignore E402,E501

      # Defender-scoped extended-rule gate (issue #400, drain complete). The full
      # extended family set (bugbear/simplify/complexity/too-many-*/pyupgrade/
      # pytest-style) is now clean in defender/ and blocking. Config-driven (the
      # `select` in defender/pyproject.toml), so the local `ruff check defender`
      # matches CI exactly. Scoped to defender/ (not repo-wide like the E,F gate
      # above) because the extended config only governs the defender/ tree;
      # experiments/ + root scripts/ stay E,F-only by design.
      - name: Ruff (defender extended — full gate)
        run: defender/.venv/bin/ruff check defender

      # Type-check hard gate (issue #403). mypy over the shippable defender/
      # modules (tests + .venv excluded), config in defender/pyproject.toml.
      # Promoted from a non-blocking code-smells signal to this blocking gate once
      # the tree reached zero errors — the ramp's "promote when clean" step (see
      # docs/decisions/defender-mypy-ramp.md), the same graduation the extended
      # ruff families went through (#400). Config pointed explicitly; there's no
      # root pyproject for mypy to discover. The lint venv is --extra dev (no
      # pydantic_ai), so mypy treats it as Any — runtime-only driver.py generic-
      # variance errors are invisible here by design (they're checked locally with
      # the runtime extra synced; the dict-blob typing debt is tracked in #409).
      - name: Mypy (type-check — hard gate)
        run: defender/.venv/bin/mypy --config-file defender/pyproject.toml

      # The golden case tree, not code — `validate_cases.py` checks the ARTIFACTS the
      # oracle-calibration tooling produces and consumes: every case's structure and
      # calibration metadata, the append-only held-out ledger, the story/replay
      # hidden-visible boundary, and (since #882) that every stored control measures the
      # window its record declares and keys to the observed payload it baselines.
      #
      # `docs/oracle-calibration.md` claimed "CI runs it" for a long time while nothing
      # did. It could not: the command exited 1 on every run over the committed tree,
      # because two control records carry a measurement that is invalid and repairable
      # only by a capture session against the live stack. Those are now tracked in
      # `evals/oracle_golden/known_defects.yaml` — printed on every run, and themselves
      # checked, so a waiver cannot outlive the defect it waives — which is what lets
      # this be a gate rather than a permanent red.
      #
      # It lives in `lint` rather than `code-smells` for a dependency reason: it imports
      # `controls` -> `elastic_adapter` -> `defender.runtime.verbs`, and only this job
      # syncs `--extra runtime`. Run WITHOUT `--quiet` on purpose — the coverage report
      # it prints (dead control windows, zero-byte payloads, cases excluded as defective)
      # is the instrument's own limits, and a log that hides them invites a reader to
      # assume they are zero.
      - name: Golden case tree (hard gate — artifacts, not code)
        run: defender/.venv/bin/python defender/evals/oracle_golden/validate_cases.py

  code-smells:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — the stale-ref gate diffs `origin/main...HEAD`, and the three-dot
      # form needs a MERGE-BASE. The default depth-1 checkout grafts HEAD
      # (refs/pull/N/merge), and a `--depth=N` fetch of the base ref creates the ref but
      # NOT a common ancestor: the diff exits 128 and the gate reported clean on every PR
      # for its whole life (#618). Only full history removes the graft. The repo is ~44MB,
      # so this is free. The `lint` and `test` jobs run nothing diff-relative and stay
      # shallow.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync defender venv
        working-directory: defender
        run: uv sync --extra dev

      - name: Set up Node (for jscpd)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install jscpd
        run: npm install -g jscpd

      # ---- Soft signals: metrics, reported but never block. ----
      # Trend indicators with no clean pass/fail, so they stay `|| true`. (The
      # extended ruff families AND mypy are now hard-gated in the lint job —
      # #400 / #403; the old soft `ruff --statistics` sweep is retired; radon/
      # jscpd cover what's left.)
      - name: Radon — cyclomatic complexity (B and worse)
        run: defender/.venv/bin/radon cc defender -a -nb || true

      - name: Radon — maintainability index (B and worse)
        run: defender/.venv/bin/radon mi defender -nb || true

      - name: Radon — raw size metrics
        run: defender/.venv/bin/radon raw defender -s || true

      # The data-source adapters under scripts/adapters/ used to be excluded via
      # `**/*_cli.py`, on the rationale that they shared argparse scaffolding. That
      # stopped being true in #611 (no adapter but `ticket` has argparse), and the
      # exclusion was retired with the `_cli` name in #619. Measured with the
      # adapters back in scope: 0.90% duplicated tokens against the 3% threshold.
      - name: jscpd (copy-paste detection — all formats, soft report)
        run: jscpd defender --min-tokens 60 --reporters consoleFull --ignore "**/.venv/**,**/runs/**,**/run-visualizations/**" || true

      # ---- Hard gates: each BLOCKS CI on a NEW smell only. ----
      # The custom lints below are ratcheted against a checked-in, reviewable
      # baseline (scripts/lint/<lint>_baseline.json via scripts/lint/_baseline.py):
      # today's findings are recorded, so a gate fails only on a fingerprint not
      # in its baseline. Exclusions are explicit config, not `|| true`. Run after
      # the soft reports so those always emit first. Invoked with the synced
      # defender venv interpreter so a runner without `python` on PATH can't make
      # a gate silently pass. Regenerate a baseline with the lint's
      # --update-baseline and annotate the new entries in the PR.

      # Python logic duplication. Scoped to --format python so the JSON/markdown
      # fixtures (legitimately ~40% similar) can't pollute the signal. Threshold
      # is a ratchet above today's ~1.4% baseline — it
      # blocks a PR that meaningfully grows copy-pasted Python (the #330 class).
      - name: jscpd Python-duplication gate (hard — blocks CI)
        run: jscpd defender --format python --min-tokens 60 --threshold 3 --reporters consoleFull --ignore "**/.venv/**,**/runs/**,**/run-visualizations/**"

      # Dead code. Wraps vulture (same invocation as the prior soft step) behind
      # the baseline ratchet so only NEW dead code blocks.
      - name: Vulture dead-code gate (baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_vulture.py

      # monkeypatch.setattr in tests — the dependency-injection-avoidance smell;
      # new tests should inject a config/deps seam instead. Pre-existing sites
      # are baselined and paid down over time.
      - name: Monkeypatch-setattr gate (baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_monkeypatch.py

      # Small-helper complement to the jscpd gate: jscpd catches large copy-paste
      # blocks (>=60 tokens) but is blind to 1-5 line helpers copied across
      # modules and to divergent same-named copies (#357/#358/#359/#360).
      - name: Duplicate-helper gate (cross-module dup names — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_duplicate_helpers.py

      # Hand-rolled per-line json.loads readers + json.dumps+newline appends under
      # defender/ that bypass defender._io.read_jsonl_rows / append_jsonl — both a
      # dedup smell and the #446 torn-line read crash (a JSONDecodeError escapes
      # every drain guard and crashes the worker every tick). New sites must route
      # through the shared _io helpers; the canonical reader/appender are
      # suppressed inline.
      - name: Unsafe JSONL-io gate (tolerant-reader/appender dedup + #446 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unsafe_jsonl_io.py

      # A shared-tree write (a run dir, the drain worktree's corpus) that bypasses #771 M3's
      # alias-refusing primitives (write_guarded/guarded_mkdir/open_guarded). Modules named in
      # the writer census are HARD-gated (never ratcheted, fails on any finding there); every
      # other site is baseline-ratcheted like the gates above.
      - name: Unguarded shared-tree-write gate (#771 M3 — hard-gated census modules + baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unguarded_tree_write.py

      # Text reads/writes under defender/ that decode or encode under the AMBIENT
      # LOCALE instead of pinning encoding="utf-8" (#588/#589). The corpora are UTF-8
      # and the CLIs print them, so an unpinned read raises where the locale is ascii
      # and an unpinned write silently emits latin-1 bytes the next walk warn-skips as
      # "malformed". Also flags a subprocess text=True pipe with no encoding=. The
      # baseline ships EMPTY: every defender/ site was pinned when the gate landed.
      # Since #602 all three AST gates resolve a callee to its ORIGIN MODULE via
      # scripts/lint/_astlib.py rather than matching how it was spelled, so an alias
      # or a from-import cannot walk past them — and the opener's mode slot/default
      # come from that resolved callee instead of being guessed from the call shape.
      - name: Unpinned text-io gate (utf-8 pin on every text read/write — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unpinned_text_io.py

      # Hand-rolled git subprocess calls under defender/ that bypass the
      # defender._git facade (git / git_status / git_commit / git_worktree_* /
      # GitError) — a ~8× dedup smell plus the spaced-path porcelain bug the
      # shared -z reader fixes (#460). New sites must route through defender._git;
      # the facade itself is excluded and test fixtures are exempt.
      - name: Raw git-subprocess gate (defender._git facade dedup, #460 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_raw_git_subprocess.py

      # A test computing its EXPECTED value with the same git QUERY the code under
      # test runs. Such an oracle cannot disagree with the implementation — both read
      # the tree the same wrong way and the suite stays green, which is how #869's
      # ls-tree C-quoting, `.split()`-on-spaced-paths and cwd-relative output shipped
      # past 57 tests (#908). Read subcommands only: a fixture's init/add/commit builds
      # the state the test planted and cannot rig its own answer. `require_reasons` is
      # on — the benign shared reads (a facade contract test, an identity read of a
      # sha) each cost one sentence, and a NEW shared query costs a fix.
      - name: Shared-oracle gate (a test may not re-run the code's own git query, #869 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_shared_oracle.py

      # A parameter re-defaulted in-body via `x = x if x is not None else DEFAULT`
      # to a named/called fallback: an Optional immediately made non-None, with the
      # default knowledge duplicated across call sites (and prone to drift). Anchor
      # the default in ONE place — a signature default (`x: T = DEFAULT`) or a single
      # boundary resolution. Literal fallbacks (`else []`) and new-name DI seams are
      # not flagged; suppress a deliberate site with `# lint-default: ok — <reason>`.
      - name: Unanchored-default gate (single-source param defaults — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unanchored_default.py

      # Learning-stage prompt sections must be rendered through the shared salted
      # frame primitive. The check is construction-based rather than a vocabulary
      # of known tags/headings, so a newly invented raw delimiter still fails.
      - name: Stage-prompt-frame gate (wrap-only boundaries — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_stage_prompt_frames.py

      # Hand-rolled frontmatter fence arithmetic under defender/ that bypasses the
      # canonical grammar in defender/_frontmatter.py (#591): find/split/startswith/
      # regex fence-parse call sites. Five readers each re-derived the fence offsets
      # with a subtly different grammar — a parser differential injected into exactly
      # the primary-vs-frozen-actor divergence signal the evals existed to measure. The
      # baseline ships EMPTY: the five sites were folded when the gate landed.
      - name: Hand-rolled-frontmatter gate (one fence grammar, #591 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_hand_rolled_frontmatter.py

      # A module importing another module's closed vocabulary and re-deriving the membership
      # test itself instead of calling the normalizer that ships beside it (#785). The six
      # interpreters of report.md's disposition each looked fine alone; they disagreed only
      # BETWEEN themselves, and five had silently dropped the #722 zero-width strip on a field
      # attacker-influenced by construction. A vocabulary is watched only once its owner
      # defines an answer for it, so the gate arms itself as later folds land. No disposition
      # site is baselined — the one deliberate exemption (the write gate, exact where readers
      # normalize) states its reason inline; the two baselined entries are older debt in other
      # vocabularies, each annotated with what has to be folded before it can go.
      - name: Borrowed-vocabulary gate (one owner per vocabulary, #785 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_borrowed_vocabulary.py

      # A data-source verb dispatch `registry.verbs(system)[verb]` resolved OUTSIDE its fault
      # `try` (#672/#678). The dispatch lazily imports the adapter and can raise, so out of the
      # seam a broken adapter unwinds the stage with no queries-table row and no breaker outcome
      # — the invariant the tool documents, silently unmet, and invisible to a suite whose fakes
      # all resolve cleanly. Modules with a pydantic-ai capability catch-all (query_tool) are
      # exempt. The baseline ships EMPTY: both live dispatch sites are guarded.
      - name: Unguarded-verb-dispatch gate (fault seam encloses the dispatch — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unguarded_verb_dispatch.py

      # The spec_graph checkers (lint/gate/binds/claims) ran only INSIDE write-tests, so a
      # graph merged with its findings intact — the mechanical no evaporated exactly when it
      # became durable. #774 shipped 24 claim-instrument findings, one of them the claim
      # whose unexecuted probe produced #788: the checker fires on that graph today, and
      # nothing was running it. This gate runs them over the committed corpus. Ratcheted per
      # graph rather than hard-gated: the checkers postdate most of the corpus, so the
      # pre-#674 graphs are baselined with their counts as ceilings, while any NEW graph must
      # be clean. Paying findings down is never a failure; a graph that gains one is.
      - name: spec_graph gate (checkers over the committed corpus — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_spec_graph.py

      # Defender hygiene + discipline gates. Each script is independently
      # inspectable under scripts/lint/lint_*.py; source PRs that prompted each
      # check are cited in the module docstrings.
      - name: Hygiene gate (paths, interpreter, hook matchers — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_ci_hygiene.py

      - name: Shippable-surface gate (env-agnostic discipline — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_shippable_surface.py

      # A function that DECLARES a shape but lets raw deserializer output reach its `return`
      # un-narrowed (#878). `json.loads` is typed `Any`, and `Any` satisfies every annotation,
      # so `def read_json_locked(path) -> dict: return json.loads(raw)` type-checks CLEAN —
      # the tree sits at zero mypy errors with that lie in it. This gate is not duplicating
      # mypy; it closes the one hole mypy has agreed to stop asking about. It fires at the
      # SEAM and deliberately NOT at the readers of a laundered value: narrowing _run_dir
      # fixes circuit_breaker and budget_enforcer and every future reader, where chasing
      # readers institutionalizes the per-reader hardening that caused the defect. The second
      # check is the same rule for time: a bare `datetime.fromisoformat` outside the module
      # owning `defender._clock.parse_iso_utc`, whose docstring names the naive-vs-aware
      # TypeError it produces. 21 entries baselined with `require_reasons=True` — 4 are #878's
      # own, 9 are oracle_golden readers weak because their input is the checked-in golden
      # corpus, 8 are older first-party debt; each says what has to fold before it can go. A
      # clean run means no new SEAM — NOT that no deref is unguarded (see the module docstring).
      - name: Un-narrowed-parse gate (the parse and the shape check are one construction, #878 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unnarrowed_parse.py

      # A boundary that branches on ONE key of another module's keyed gate table, spelled as a
      # string literal, so that table's other keys have no reader there. #879: close_tool
      # charges the `false-positive` entry price by literal, while `benign` — the other key of
      # `skills.invlang.validate._DISPOSITION_GATES` — passes that same write boundary ungated.
      # A table is watched only once something in the corpus reads it generically (`T.get(x)` /
      # `T[expr]` / `x in T` / iteration, including through a resolved import), so the gate arms
      # itself as keyed tables land, with no edit to the lint. Green here is NARROW on purpose:
      # the detector fires on the GAP, so a consumer that enumerates EVERY key by literal is
      # invisible to it, and cross-module key identity is value-based, so short generic keys
      # collide — the two baselined entries say which is which (#879, and the learning-lane
      # `direction == "benign"` collision in persist.py). Suppress a deliberate site with
      # `# lint-half-table: ok — <reason>`.
      - name: Half-read-table gate (one reader per key, #879 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_half_read_table.py

      # A row leaving a loop in the invlang row-carrying surface by continue/break/bare
      # return with neither a ParseWarning nor a landing unconditionally on that path
      # (#876). The two roles are derived STRUCTURALLY, never from a name list: a PROJECTOR
      # is a class that both holds `list[ParseWarning]` state AND raises one — so
      # `corpus.Companion`, which merely carries warnings somebody else raised, owns no drop
      # channel and is exempt — and a TOKENIZER is a function whose return annotation
      # mentions `Block`, resolved by origin so an aliased import is the same case (#602).
      # The warn-emitter set is a fixpoint, so the next `_warn_*` helper clears its call
      # sites with no edit to the gate. Only the EXPLICIT escape is mechanized: the implicit
      # drop — a dispatch arm returning "handled" without projecting, an if/elif chain with
      # no else, a suppressed conversion — is not detectable here, and a green run is NOT
      # proof the parser drops nothing. Eight sites are baselined, four of them the live
      # #876 drops and four annotated false positives; `require_reasons` refuses "".
      - name: Silent invlang row drop gate (warn or land before you drop, #876 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_silent_row_drop.py

      # A reader that splits an investigation on its ```invlang fences must go through
      # `parser.scan_fences`, which hands back what the fences ORPHAN alongside what they
      # hold. Three readers had derived the split independently and all three dropped the
      # complement in silence — content outside a fence never reaches the tokenizer, so it
      # cannot even raise a ParseWarning, and a run's whole PLAN section parsed to an empty
      # companion that every hypothesis-side rule then passed vacuously (#932). Two arms:
      # binding INVLANG_FENCE_RE (import or attribute, any `as` name) and re-deriving the
      # ```invlang pattern in an `re` call. Baseline ships EMPTY — all five sites were
      # folded when the gate landed. NOT mechanized: computed access, a `str.split` fence
      # walk, and whether a scan_fences caller reads `orphaned_headers` at all.
      - name: Unaccounted invlang fence scan gate (route through scan_fences, #932 — baseline-ratcheted)
        run: defender/.venv/bin/python scripts/lint/lint_unaccounted_fence_scan.py

      # For symbols this PR removed, the post-PR tree must hold no surviving reference.
      # Needs the merge-base with origin/main — hence `fetch-depth: 0` on the checkout
      # above. Fails CLOSED: exit 2 if the base ref or the merge-base is unavailable, so
      # an unusable diff base can never again read as a clean bill of health (#618).
      - name: Stale-reference gate (vs origin/main — baseline-ratcheted)
        env:
          STALE_REF_BASE: origin/main
        run: defender/.venv/bin/python scripts/lint/lint_stale_refs.py
