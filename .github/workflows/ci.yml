          # install keeps the full source list (it resolves against the image's lists) and a
          # roomier bound: the runsc deb is 168 MB, ~20s on a healthy runner.
          sudo timeout 120 apt-get "${APT_BOUNDED[@]}" install -y runsc
          sudo runsc install -- --oci-seccomp
          sudo timeout 30 systemctl restart docker
          docker info --format '{{.Runtimes}}'
          # Hard-fail rather than print — same reason as the `test` job: the suite self-skips
          # a runtime the daemon does not register, so a degraded install would leave this
          # job green having started no gVisor box at all.
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' \
            | tr ' ' '\n' | grep -qx runsc

      - name: Pre-pull the box rootfs
        run: docker pull python:3.11-slim

      - name: "Run the #540 boundary suite natively"
        working-directory: defender
        # Same enforcing posture as every other pytest step over tests/ (#631 D11) — and
        # test_budget_seams_631's workflow gate reads this block to prove it.
        env:
          DEFENDER_BUDGET_ENFORCE: "1"
        # No -n: 27 container starts contend on one docker daemon, and xdist would buy
        # nothing but flakier teardown.
        run: uv run pytest tests/e2e/test_540_box_boundary.py -v -rs

  # The #540 boundary suite under docker-outside-of-Docker — the topology C46 exists for, and
  # the one the `test` job structurally cannot reach. There the driver and the daemon share a
  # path namespace, so box.py's bind-source translation is the IDENTITY and every assertion
  # about it is vacuous. This job splits the namespaces for real: the suite runs INSIDE a
  # container that holds the host's docker socket, mounted at a path (`/repo`) that differs
  # from where the daemon sees the checkout ($PWD) — so `source=` must be translated or no box
  # starts at all. Pre-fix, docker refuses the create outright ("bind source path does not
  # exist"); on older daemons it silently binds an EMPTY dir and F8's sentinel fails closed.
  box-dood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Same install as the `test` job: the boxes are created by the HOST daemon, so the
      # runtime has to be registered out here, not in the container running pytest.
      - name: Install gVisor (runsc) for the box suite
        # BOUNDED, every command (#937). This step talks to two hosts the runner does not
        # control, and `set -e` fails fast on an ERROR but not on a STALL — so an
        # unresponsive gvisor apt repo hung box-dood for 15 minutes on run 32278695386 and
        # would have run to the 6-hour job default. It normally finishes in 12-31s.
        #
        # The per-command bounds NEST inside this one: 60 + 60 + 120 + 30 = 270s against a
        # 300s step. The curl term is 60 and not 20, because --retry-max-time is the last
        # instant a new attempt may START and that attempt still gets a full --max-time. That ordering is the whole point of having both — whichever command
