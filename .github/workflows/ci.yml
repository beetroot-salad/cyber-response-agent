name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref. Pushing again to a PR branch used to leave the previous run's
# four jobs running to completion against a commit nobody would merge; with ~4 pushes per
# branch that is most of this repo's runner capacity spent on superseded commits. The
# symptom was queueing, not slowness: run 31624714749's `box-dood` job waited 4544s (75
# minutes) for a free runner and turned an 8-minute run into a 78-minute one.
#
# cancel-in-progress ONLY for pull_request. A push to `main` is a distinct commit whose
# result is a fact about that commit — cancelling it because a later merge landed would
# leave the earlier one permanently untested, and `main` has no branch protection to catch
# it later. Those queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries `timeout-minutes` (#937). The gVisor install is bounded command by
# command below, but that is one step: `docker pull`, `uv sync`, `npm install -g jscpd` and
# the DooD container's own apt/pip/curl all reach hosts this runner does not control, and a
# stall in any of them still runs to GitHub's 6-hour job default.
#
# 10 minutes, and the bound NESTS over the step bound the same way the step bound nests over
# its commands. `test` is the binding job: 250s at its slowest over the last 12 runs on main,
# of which 222s is outside the gVisor step (199s of unit tests + ~23s of setup). A stall that
# burns the step's full 5-minute bound lands at 222 + 300 = 522s, inside 600s — so the step's
# own timeout fires first and names the command, and this bound stays what it is for: the
# backstop under the steps that carry no bound of their own. Raising the step bound without
# raising this one inverts that and hands every stall to GitHub's generic job cancel.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # defender/pyproject.toml is package = false — `uv sync` installs the
      # dependencies into defender/.venv without trying to build defender itself
      # as an installable package. The runtime extra (pydantic-ai) is synced so
      # the runtime/ package import-checks during collection and the hermetic
      # e2e replay suite can run.
      - name: Sync defender venv
        working-directory: defender
        run: uv sync --extra dev --extra runtime

      # The #540 boundary suite drives a REAL container: the mounts and --network=none are the
      # boundary, so a fake cannot pin them. gVisor is the default runtime behind the knob, and
      # it installs on stock ubuntu-latest (systrap needs no KVM) — verified precedents:
      # microsoft/typescript-benchmarking and geomys/sandboxed-step. Without this step those
      # tests self-skip on a runner with no runsc, and the boundary would be pinned by nothing.
      - name: Install gVisor (runsc) for the box suite
        # BOUNDED, every command (#937). This step talks to two hosts the runner does not
        # control, and `set -e` fails fast on an ERROR but not on a STALL — so an
        # unresponsive gvisor apt repo hung box-dood for 15 minutes on run 32278695386 and
        # would have run to the 6-hour job default. It normally finishes in 12-31s.
        #
        # The per-command bounds NEST inside this one: 60 + 60 + 120 + 30 = 270s against a
        # 300s step. The curl term is 60 and not 20, because --retry-max-time is the last
        # instant a new attempt may START and that attempt still gets a full --max-time. That ordering is the whole point of having both — whichever command
        # stalls, its own `timeout` exits 124 and names itself in the log, and the step bound
        # stays a backstop for a stall no per-command bound covers. Bounds that summed ABOVE
        # 300s would hand every multi-stall run back to GitHub's generic step cancel, which
        # says only that the step was too slow. The step normally finishes in 12-31s, so even
        # the tightest bound here is an order of magnitude off the normal path.
        timeout-minutes: 5
        run: |
          # `pipefail` on top of `set -eux`: curl feeds a pipe, so without it the pipeline
          # reports gpg's status and a curl that hit its own bound reads as "no valid
          # OpenPGP data found" — the bounded command's failure hidden behind its reader's.
          set -euxo pipefail
          # --retry-max-time bounds the retry SERIES; --max-time bounds one attempt, and
          # curl resets it per retry, so without the series bound this line alone could
          # spend 4 * 60s + delays and blow past the step bound.
          curl -fsSL --max-time 20 --retry 3 --retry-delay 2 --retry-max-time 40 \
            --retry-connrefused https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          # Split rather than `&&`-chained: under `set -e` the chain adds nothing, and one
          # `timeout` per command is what tells an update stall from an install stall.
          # Acquire::Retries because the gvisor apt host is the one that was observed
          # stalling and the stall cleared on a re-run inside 20s: a bound with no retry
          # converts that transient into a red build across three jobs, where curl — a
          # different host, and not the one that failed — already retries.
          #
          # http::Timeout is what makes that retry SAFE to have. Retries apply to every
          # source, not just gvisor's, and the runner's azure.archive.ubuntu.com mirror goes
          # unreachable often: on run 32294123321 the default 30s connect timeout x 4
          # attempts put a 120s floor under `update` and blew a 60s kill, with the gvisor
          # host itself answering in under a second. Capping the per-connection wait at 10s
          # makes the worst case 10 + 2*10 = 30s of dead-mirror stall.
          APT_BOUNDED=(-o Acquire::Retries=2 -o Acquire::http::Timeout=10
                       -o Acquire::https::Timeout=10)
          # ...and `update` is SCOPED to the one source this step added, which is what makes
          # the bound honest rather than a guess that keeps losing. The default `update`
          # refreshes every mirror on the runner to install a package that needs none of
          # them: `runsc` resolves to "1 newly installed, 0 to remove". On run 32294715524
          # the capped timeout worked — azure Ign'd at 10s intervals instead of 30 — and the
          # step still died at 124, because apt then failed over to archive.ubuntu.com and
          # spent 76s pulling indices for repositories nothing here installs from. Raising
          # the number again would just move the next stall; not fetching what we do not use
          # removes it. sourceparts=/dev/null suppresses the OTHER .list.d entries, and
          # List-Cleanup=0 keeps the image's existing lists on disk for anything downstream.
          GVISOR_ONLY=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/gvisor.list
                       -o Dir::Etc::sourceparts=/dev/null -o APT::Get::List-Cleanup=0)
          sudo timeout 60 apt-get "${APT_BOUNDED[@]}" "${GVISOR_ONLY[@]}" update
          # install keeps the full source list (it resolves against the image's lists) and a
          # roomier bound: the runsc deb is 168 MB, ~20s on a healthy runner.
          sudo timeout 120 apt-get "${APT_BOUNDED[@]}" install -y runsc
          sudo runsc install -- --oci-seccomp
          sudo timeout 30 systemctl restart docker
          docker info --format '{{.Runtimes}}'
          # Hard-fail rather than print. Every box in the #540 suite starts at the runtime
          # BoxSpec anchors (runsc), and the parity test self-skips a runtime the daemon does
          # not register — so a silently-degraded install here would leave the boundary
          # "pinned" by a green run that started no gVisor box at all.
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' \
            | tr ' ' '\n' | grep -qx runsc

      - name: Pre-pull the box rootfs
        run: docker pull python:3.11-slim

      - name: Run unit tests
        working-directory: defender
        # ONE collection root. This used to read `tests/ learning/`, because test
        # modules sat in the source tree beside what they cover and each root had
        # to be named here — a list that was only ever extended after a suite was
        # FOUND dark (learning/test_loop.py was, once). #720 moved all four under
        # tests/, which retires the list and the failure mode with it: the three
        # evals/test_*.py modules had never been collected by any CI run, because
        # nobody noticed evals/ was missing from this line. Anything under tests/
        # is collected; nothing else is a test.
        #
        # DEFENDER_BUDGET_ENFORCE=1 runs the whole collected suite under the BLOCKING
        # budget posture (#631, M9/D11): flipping the flag in CI is what exercises the
        # deny branch on real runs (C6 refuted — real runs land at 191/200), so the
        # enforcement path is executed routinely rather than merely enabled.
        #
        # `-n auto --dist loadfile`: this step WAS the entire wall clock of CI — 452s of a
        # 508s job, with every other job finishing inside 102s — and it ran on one core of
        # a four-core runner. `loadfile` keeps each file's tests on one worker, so
        # module-scoped fixtures and the per-file tmp git repos behave as they did serially.
        #
        # Two deselections, neither of which drops a check from CI:
        #   -m "not gate"  — five tests that re-run a repo-wide lint gate over the real tree
        #                    via the same `main([])` entry point the code-smells job already
        #                    runs as a BLOCKING step. See the `gate` marker in
        #                    defender/pyproject.toml; each marked test names its step.
        #   --ignore …540… — the boundary suite drives real containers (61s, the largest
        #                    file here). It now runs in `box-native` below, natively, and in
        #                    `box-dood` under the split-namespace topology — twice, as
        #                    before, just not on this job's critical path. gVisor is still
        #                    installed above because OTHER suites in this job start real
        #                    boxes: test_store_boundary_705.py's `box`-marked tests and
        #                    test_771_alias_ban.py's mechanism confirmations, which
        #                    _spec771.py deliberately routes through THIS job.
        env:
          DEFENDER_BUDGET_ENFORCE: "1"
        run: >-
          uv run pytest tests/ -v -m "not live and not gate"
          -n auto --dist loadfile
          --ignore tests/e2e/test_540_box_boundary.py

      # The spec_graph gate checks (check_actors / check_binds) ship with the
      # spec-flow plugin and were dark to CI — only defender/ was collected, so a
      # regression in the tooling that gates every write-tests spec could land
      # green (#643). This suite drives the REAL check_actors CLI against
      # throwaway git-repo fixtures; it lives outside defender/ but reuses the
      # defender venv's pytest + pyyaml, so it runs from the repo root against
      # defender/.venv (the same idiom as the code-smells lint gates below).
      - name: Run spec-flow tool tests
        run: defender/.venv/bin/python -m pytest spec-flow/scripts -q

  # The #540 boundary suite on a NATIVE daemon — the same collection the `test` job used to
  # carry inline. It moved out here for wall clock alone: 27 tests that each start a real
  # gVisor box cost 61s, the largest single file in the suite, and pytest-xdist cannot shrink
  # them (the cost is container startup, not CPU). Split out, they run alongside `test`
  # instead of inside it.
  #
  # NOT a duplicate of `box-dood`. That job exists for the split-path-namespace topology
  # (C46) where bind-source translation is observable; this one is the native case where the
  # driver and the daemon share a path namespace. Both were already running this file before
  # this split — `test` natively and `box-dood` under DooD — so the pairing is unchanged.
  box-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync defender venv
        working-directory: defender
        run: uv sync --extra dev --extra runtime

      # Byte-identical to the `test` job's install, and deliberately so: the boxes here are
      # the same boxes, and #771's alias ban faults every box on arrival unless the daemon
      # records `--oci-seccomp` as a runtimeArg. test_771_alias_ban.py asserts that over
      # EVERY `runsc install` step in this file, so this copy is covered by that census
      # rather than trusted.
      - name: Install gVisor (runsc) for the box suite
        # BOUNDED, every command (#937). This step talks to two hosts the runner does not
        # control, and `set -e` fails fast on an ERROR but not on a STALL — so an
        # unresponsive gvisor apt repo hung box-dood for 15 minutes on run 32278695386 and
        # would have run to the 6-hour job default. It normally finishes in 12-31s.
        #
        # The per-command bounds NEST inside this one: 60 + 60 + 120 + 30 = 270s against a
        # 300s step. The curl term is 60 and not 20, because --retry-max-time is the last
