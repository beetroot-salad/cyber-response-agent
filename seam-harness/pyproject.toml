[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-harness"
version = "0.4.0"
description = "A recursive, evidence-preserving context compiler for decomposed agent work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
  "pydantic-ai>=2.19,<3",
]

[project.scripts]
seam-harness = "seam_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

