# The template tenant's verb-disposition table (#1106 D1): it grants NOTHING.
#
# Creating a tenant means copying `knowledge/tenant-template/`. Every (system, verb) the shared
# adapters declare has a row here, so the copy is total over the census (CI checks the template
# like every committed tenant), and every row withholds the verb from every holder. A tenant
# copied from here is refused at run start until an operator grants gather at least one verb:
# an empty gather grant is a run that could query nothing.
#
# Read defender/runtime/verb_dispositions.py and the playground tenant's table before granting.

dispositions:

  change-mgmt:
    active-changes: {roles: [], reason: "template default: no operator has granted this verb yet"}
    get-change: {roles: [], reason: "template default: no operator has granted this verb yet"}
    health-check: {roles: [], reason: "template default: no operator has granted this verb yet"}
    list-changes: {roles: [], reason: "template default: no operator has granted this verb yet"}

