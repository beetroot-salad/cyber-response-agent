# How the credential proxy reaches Elasticsearch for this tenant — replace every CHANGE-ME.
# `base` is the cluster's URL (a path is allowed); `ca` is optional: PEM certificates, inline, that
# are the only trust for this system when its certificate comes from a private CA.
# Credentials are stored with the proxy: a read-only user with `read` on the events and alerts
# indexes plus the cluster `monitor` privilege (without it health-check answers 403).
access: http-proxy
base: https://CHANGE-ME
auth:
  scheme: basic
reads:
  - {method: POST, path: "/*/_search"}
  - {method: POST, path: "/_query"}
