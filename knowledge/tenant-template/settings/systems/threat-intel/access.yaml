# How the credential proxy reaches threat-intel for this tenant — replace every CHANGE-ME.
# `base` is the system's API URL (a path is allowed). The proxy adds the stored bearer key.
access: http-proxy
base: https://CHANGE-ME
auth:
  scheme: bearer
  field: api_key
# An indicator may hold a `/` (a URL, a CIDR range), so a lookup sends it in the body (#1391).
reads:
  - {method: POST, path: "/lookup"}
