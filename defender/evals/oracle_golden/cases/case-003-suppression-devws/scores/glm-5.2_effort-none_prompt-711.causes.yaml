# Cause codes for `scores/glm-5.2_effort-none_prompt-711.json` (#711 M5).
#
# This tag re-records every projection against the prompt.md change that added
# the missing baseline-existence condition to the suppression rule (#711 H3).
# **It changed nothing.** Every lead in every case projected identically to
# `glm-5.2_effort-none` -- including case-003 `l-001`, the false suppression the change was
# written for. The errors below are therefore the same errors, unmoved.
#
# That is the finding, not a disappointment: the case-003 error is NOT explained
# by the prompt's silence on baseline existence, so C-SUPPRESS-UNBASELINED needs a
# different remedy and now needs ordinary evidence (>=5 instances across >=3
# units) like any other cause, rather than the specification-defect exemption it
# was carrying.
projection: glm-5.2_effort-none
causes:
  l-001:
    error: class                 # expected 0, projected -noise — a FALSE SUPPRESSION
    cause: C-SUPPRESS-UNBASELINED
    note: >
      The story performs an explicit blinding action on dev-ws-1, and the
      projection emitted `<suppressed: ...>` for this lead. But the lead filters
      `event.outcome IS NOT NULL`, and under its own predicate the control windows
      are empty — there was no baseline for the suppression to remove, so the
      envelope truth is `0` and the marker is a false suppression: the error class
      that turns ordinary silence into a detection.

      Independently re-derived on 2026-07-26 by the mechanical labeler, which also
      declines `-noise` here for the stronger reason that dev-ws-1's baseline under
      this predicate is INTERMITTENT (present in one of three live control
      windows). Suppression earned from the story is not suppression visible in the
      envelope, and only the second is ground truth.

# Exempt from the >=5-instances-across->=3-units bar (#711 M6), and recorded as
# such: this is a SPECIFICATION DEFECT readable in the prompt at n=0, not a
# hypothesis needing evidence. `defender/learning/pipeline/oracle/prompt.md` earns
# the suppression marker from "a concrete action that disables/removes/blinds the
# specific stream these queries read" and never requires the stream to plausibly
# have been reporting in the first place. This case confirms the defect; it is not
# the reason to believe it.
