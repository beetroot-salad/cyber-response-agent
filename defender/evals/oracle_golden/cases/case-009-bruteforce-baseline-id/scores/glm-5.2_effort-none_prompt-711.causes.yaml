# Cause codes for `scores/glm-5.2_effort-none_prompt-711.json` (#711 M5).
#
# The suite's FIRST held-out result. 3/6 class agreement and `+event` recall 0.25,
# against 0.92 overall and 0.71 recall on the dev pool the prompt was iterated
# against. One case is not a measurement — the reporter says `insufficient` at one
# unit and it is right to — but the direction is the reason a held-out set exists.
#
# All three errors are UNDER-projection: the oracle emitted a weaker class than
# the envelope carries. None is a fabrication and none is a false suppression.
projection: glm-5.2_effort-none_prompt-711
causes:
  l-003:
    error: class                 # expected +event, projected +noise
    cause: C-UNDER-PROJECT
    note: >
      The activity is 96 failed password attempts against `root@db-1`, and the
      lead's own control windows carry none of them — the row is distinguishable.
      The projection called it baseline-shaped anyway. A plausible reading is that
      the story's identity (`sre.alice`, a real SRE account) dominated the call
      over the route, which `office-ws-1`'s empty `trust_edges_out` makes
      off-baseline. Stated as a reading, not a mechanism: n=1.
  l-004:
    error: class                 # expected +event, projected 0
    cause: C-UNDER-PROJECT
    note: >
      A mixed lead — three cmdb lookups plus one elastic `ip-to-host-search`. The
      elastic sub-query surfaces db-1's in-window auth events, so the envelope is
      `+event`; the projection emitted nothing at all. Worth noting that the
      LABELER had the same blind spot until #711 fixed it: it applied one system
      to every query in a lead, so a state lookup could decide a lead whose
      telemetry sub-query carried the delta.
  l-006:
    error: class                 # expected +event, projected 0
    cause: C-HETERO-UNDER
    note: >
      Ten sub-queries whose observed classes differ (derived `heterogeneous:
      true`). Several cover the attack window and carry the failure burst; the
      projection emitted nothing. This is the same shape as case-001's `l-002` and
      `l-006`, and it is the FIRST instance of it outside case-001's unit — which
      matters, because the evidence bar counts units, not leads.

# Bar status after this case (see report.py): C-HETERO-UNDER now stands at 3
# instances across 2 units, still short of >=5 across >=3. C-UNDER-PROJECT is new
# at 2 instances in 1 unit. Neither may motivate a prompt change yet, and that
# restraint is the point of the bar.
