# Case-history field mapping (issue #317, gated for approval by #767).
#
# How the defender's INTERNAL case model (alert.json + report.md) maps onto the
# EXTERNAL ticket schema — the "de-facto schema". The frozen v1 ticket has no
# disposition or signature field, so they ride existing fields by convention.
# Edit THIS FILE to change the convention; no code change required.
#
# Templates use {placeholders}: case_id, signature, summary, disposition, cause,
# narrative, event_time. `source.*` are dotted paths into alert.json.

# Where to read facts from the internal model (alert.json).
source:
  signature: rule.id
  summary: rule.description
  # The SIEM event time — when the activity happened, NOT when we investigated it.
  # Stamped onto the open ticket (the `evt:` label) so a later run can window
  # candidates by alert time; the server-set `created` is materialize time and
  # drifts from this under replay/backtest.
  event_time: timestamp

# POST /tickets — the bridge create: an OPEN ticket, when the alert is raised.
# Keys are external ticket fields (TicketCreate); values are rendered templates.
# This whole section ships to the wire UNFILTERED (`alert_to_open_payload`) — the
# loader refuses any label template here that could render the approved tag
# below, so an attacker-influenced field can never approve its own case.
open:
  key: "{case_id}"
  summary: "{summary}"
  description: "Auto-created from alert {case_id} (rule {signature})."
  status: open
  reporter: defender
  # `sig:` is the signature filter key; `evt:` carries the alert event time.
  # Each label's literal prefix (text before its {placeholder}) is what makes it
  # impossible for the placeholder's value to collide with the approved tag —
  # keep it pure-literal so the loader's refusal has something to check.
  labels:
    - "sig:{signature}"
    - "evt:{event_time}"

# POST /tickets/{key}/comments — the host RECORDS its investigation into the
# case as its own comment (#767 D2/D3); it never transitions or closes the
# ticket, and it never sets a disposition or the approved tag itself — both are
# a person's (O1). `body` is rendered from a `CaseRecord`'s `disposition`
# (proposed, never committed by this write), `cause` (the host's own sentence)
# and `narrative` (the report's body, fence-stripped and bounded on the wire).
comment:
  author: defender
  body: "{disposition} — {cause}\n\n{narrative}"
  # Superseded spellings of `author` above, kept so a later rename does not
  # un-hide an unapproved case's history (§7 R4): `is_agent_comment` matches
  # the CURRENT author plus every alias here.
  author_aliases: []

# The label a person adds to a case to release its agent-authored comments to
# a later run's gather (O2/O5). Not `open.labels` — that is the bridge's own
# unfiltered set, and O1 requires the two to never collide (the loader refuses
# a mapping where they could).
approved:
  label: approved
