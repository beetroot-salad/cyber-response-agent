# The tacit-knowledge registry — the estate's authored record of sanctioned patterns.
#
# HUMAN-EDITED ONLY. Nothing an agent run can reach writes this file: the gather verb over it
# is read-only, and `permission.decide_write` refuses the path for every role a run holds. That
# is the whole of the safety argument — the commit/PR that adds an entry IS the sign-off, and
# `git log` on this file is the audit trail. A registry populated from the agent's own closes
# would be the system vouching for itself.
#
# One entry per sanctioned pattern. Eight fields, all required:
#
#   id             the stable name a `:R authz` row cites as its `anchor_id`. Never re-use one
#                  for a different sanction; an edit to `pattern` under a kept `id` is a silent
#                  re-identification. Enforced: a second entry claiming an `id` an earlier one
#                  already claims is DROPPED, since a citation could not say which it means.
#   pattern        the action being sanctioned, matched EXACTLY (no wildcards — a glob here
#                  would let one entry sanction everything).
#   actor_scope    the identity or identity glob this covers.
#   host_scope     the host or host-group glob this covers.
#                  Both scopes are refused at load if they are blank, `*`, `all`/`any`, or
#                  fewer than four literal (non-wildcard) characters.
#   added_by       who authored it. A person or a team address, not a service.
#   added_at       ISO date, the day it was committed. An entry does not answer BEFORE this
#                  date either — post-dating both dates together would otherwise buy unlimited
#                  validity from today inside a legal 180-day span.
#   review_by      ISO date, at most 180 days past `added_at` (the loader enforces the bound).
#                  Past that date the entry stops answering — it is a MISS, not a refusal, and
#                  the contract falls through to `indeterminate` like any other registry miss.
#   justification  why this is sanctioned, in a sentence a reviewer can act on.
#
# An entry that breaks any of those rules is DROPPED with a warning on stderr; the rest of the
# file still loads.
#
# Refresh an entry by editing its `added_at`/`review_by` in a fresh commit — that re-attests
# it, which is the step a file cannot perform for itself.
#
# CHECK YOUR EDIT BEFORE YOU COMMIT IT:
#
#   defender/.venv/bin/python -m defender.scripts.tacit_cli check
#
# It prints every entry the runtime will DROP and why, and it is the same walk a live lookup
# reads — so a clean run means the runtime reads what you wrote. Without it a mistake here is
# invisible: a dropped entry is not refused, it simply stops answering, which looks exactly
# like a sanction nobody ever wrote. CI runs the same command and fails the PR.
# `... tacit_cli show` prints what is in force today.
#
# Or ask the connect skill to write the entry for you — `skills/connect/tacit.md` interviews
# you for the eight fields, writes them here, runs the check and leaves a branch to review. It
# is a transcription step, not an approval one: the commit is still the sign-off, and
# `added_by` still names the human who is sanctioning the pattern.
#
# A WORKED EXAMPLE, commented out — copy it and replace every field. It is the container-root
# case the system exists for: no identity system holds a record for UID 0, so an `iam-policy`
# contract about it dead-ends no matter how the activity looks.
#
# entries:
#   - id: tk-ca-bundle-build-runner
#     pattern: rewrite /etc/ssl/certs/ca-bundle.crt   # matched EXACTLY — no wildcards
#     actor_scope: uid-0                              # glob; this one names a single actor
#     host_scope: build-runner-*.prod                 # glob; covers the build fleet
#     added_by: sre-platform@example.invalid          # a person or team address, never a service
#     added_at: 2026-03-01
#     review_by: 2026-08-01                           # <= 180 days after added_at
#     justification: the image build's own ca-trust step; no identity system holds UID 0

entries: []
