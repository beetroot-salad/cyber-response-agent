schema_version: 1
design: "#774 — the input set at .spec-flow/input/: 01-final-design.md is the design doc,
  02-cold-review.md AMENDS it and wins on conflict, 03-experiment-findings.md (merged as
  PR #780) fixes the challenger's output contract, and README-scope.md retargets the run."
base: a83c3347

# ===========================================================================
# SCOPE: PR 2 ONLY — THE LIVE WRITE-TIME GATE.
#
# This artifact REPLACES a same-named one assembled under the previous scope. That
# earlier graph declared this run's whole subject matter (the write interception, the
# per-run counters, the forced-turn cap, R1's write-allow narrowing, R3's ceiling) as
# carried by NO demand. It was overwritten, not amended.
#
# In scope: `write_file("report.md")` intercepted before the write commits; the per-run
# turn/grace counters on the frozen deps object; the forced-`inconclusive` cap; R1 —
# report.md leaves the model's own write allow so the close path is the only writer;
# R3 — the request limit, not budget enforcement, is the ceiling that terminates a run;
# O7/C12 — attacker-influenced payload text reaching the live session through the
# review's return.
#
# OUT of scope, and carried by no demand here: the offline sweep over completed run
# dirs, its corpus/denominator question, the "curators unwired, time-boxed" interim
# guarantee, and the offline measurement entirely. The consequence is accepted and
# recorded: the gate's survival rate is observed in production rather than measured
# beforehand.
#
# NINE HUMAN RESOLUTIONS ARE FOLDED IN AND ARE NOT RE-OPENED (.spec-flow/frontiers/
# 70-resolutions.md). Four of them had no demand binding them when the demand set was
# extracted; they are minted here — `retry_exhaustion_does_not_escape_the_driver`,
# `ceiling_is_bound_to_the_turn_cap`, `fail_closed_covers_every_review_stage`, and
# `report_629_contracts_retired_deliberately`.
#
# THE EXECUTED PROBES OUTRANK THE DESIGN PROSE. Where a probe overturned a design
# sentence the artifact carries the probed reality and `handoff.refuted` names the
# superseded reading:
#   * "reject the write and force another turn" HAS NO MECHANISM. A tool refusal is a
#     raw retry, the budget is 10, and the 11th raises an error the driver does not
#     catch. Corrected per RS6: the gate's own cap sits below the retry budget and a
#     driver handler catches exhaustion.
#   * The blinding decision cannot be delivered by narrowing inputs — at write time the
#     challenger's run dir IS the investigation's dir and both grant surfaces admit it
#     unconditionally. Enforcement is NO file-read grant at all.
#   * A refused write returns to the model RAW AND UNWRAPPED. The only precedent for a
#     refusal carrying payload-sourced text inside containment lives on a different tool
#     family, so the gate's return is a new channel shape.
#
# NAME RECONCILIATION (grounding, demand extraction and the dispositions' address
# derivations coined ids independently; unified here by role+origin). Every entry is a
# RENAME OF THE GRAPH, never an alias — an alias disables check_binds for the concept it
# papers over:
#   `agent_deps.review_state` (21-demands) -> boundary `review_state`. The old spelling
#       is not a facet address and resolved to nothing; the counters are their own seam,
#       which is exactly what the frozen-deps precedent forces (one mutable container).
#   `interacts(challenge_gate->challenger)` / `(challenger->challenge_gate).response`
#       -> ONE invoke edge with a response limb, `interacts(challenge_gate->challenger)`
#       and `.response`. The demand set addressed the stage call as two opposing edges;
#       the schema's own idiom is one edge, two limbs.
#   `interacts(oracle->challenge_gate).response` -> `interacts(challenge_gate->oracle).response`.
#   `interacts(challenge_gate->main_session).payload` — DROPPED as a dangling address.
#       The gate does not return to the session; the tool does. The reach surfaces the
#       negative had to grow are named on `counter_story_absent_from_session` instead.
#   The three review stages are BOTH actors (they run, they write traces, they are
#       driven) and boundaries (their tool grant is an access facet — 70-resolutions'
#       carried-open item 6 says that missing element is where two rounds of unowned
#       faults traced to). Same for the close tool: an actor that writes report.md, and
#       a boundary whose access facet is who may call it.
#
# THE RE-GROUNDING PROBE LANDED AND ALL FOUR SLOTS ARE SETTLED. Two of its results are
# refutations that change what gets built:
#   * Salt inheritance is NOT a general property of subagent binds. The live main-to-gather
#     pair is the ONLY shared-salt case; every learning stage mints its own, and two stage
#     entrypoints cannot even accept a threaded one. This NARROWS the delimiter-escape
#     exposure — a role built on the learning-stage precedent never sees the main session's
#     delimiter — and makes the precedent choice itself load-bearing, which is why
#     `review_roles_mint_their_own_salt` now exists.
#   * The fail-fast model preflight is unreachable from any live entrypoint; the live
#     preflight is hardcoded to the two existing roles and cannot enumerate the roles a run
#     will invoke. A new role's bad config surfaces only at first use, and whether it raises
#     at all is provider-dependent. Combined with the fail-closed resolution, a misconfigured
#     gate silently downgrades live investigations to unresolved one at a time instead of
#     failing at startup — hence
#     `misconfigured_review_role_fails_before_the_investigation_pays`.
# The other two hold: every non-main role builds fresh per call (so an unregistered role's
# loud failure lands at first gate fire, deep into a paid-for investigation), and a faulted
# stage always closes its trace logger — but writes no incompleteness marker, so a truncated
# trace and a complete one are indistinguishable by any recorded flag.
#
# SEVEN FURTHER HUMAN RESOLUTIONS LANDED AT THE PHASE-D SEAM (.spec-flow/frontiers/
# 71-resolutions-gate.md, RS10–RS16) AND CLOSE ALL TWELVE `gate.holes`. They arrived after
# assembly, so — exactly as the dispositions frontier's red flag said of the first nine — four
# of the twelve holes had no demand binding them. Nine demands are minted here for them, and
# `bounds_reject_zero` moves from `clause` to `test` because the only reason it was prose (both
# bounds' shipped values undecided) is gone:
#   RS10 role input contracts   -> `coherence_checker_input_is_the_counter_story_only`,
#                                  `projection_input_is_live_shaped`. CONSEQUENCE STATED, NOT
#                                  ASSUMED: the projection stage is no longer "reused
#                                  unchanged"; the design's claim that it is free is withdrawn.
#   RS11 the record's sink      -> `review_record_lives_beside_the_run`; `review_record.identity`
#                                  finally has evidence to point at.
#   RS12 host-rendered close    -> `close_tool_host_renders_from_typed_arguments`,
#                                  `close_write_reenters_artifact_validation`. The report's
#                                  `reason` becomes a TYPED value, which is what closes R6's
#                                  rendered-sink finding — the raw-render exposure never opens.
#   RS13 the ninth arm          -> `degenerate_evidence_is_its_own_arm`; the arm moves out of
#                                  `documented_alternatives` into `distinguished`.
#   RS14 the two bounds         -> extra_turn_bound default 2, grace_bound default 1, reset per
#                                  gate attempt (`grace_budget_resets_per_gate_attempt`).
#   RS15 close is terminal      -> already carried by `close_is_terminal_for_the_disposition`;
#                                  the three answerers' converged "the working document's grant
#                                  is untouched" is OVERRULED, and the two access cells now say
#                                  so instead of reading `unknown`.
#   RS16 the budget exemption   -> `close_tool_budget_exemption_is_explicit`.
# A STAGE-HANG PROBE WAS COMMISSIONED MID-AUTHORING and landed; its five claims are PS1-PS5.
# It closed the one assertion in the suite resting on an unclaimed fault class, and minted two
# demands: `review_stages_are_wall_clock_bounded` (the adjacent live precedent bounds itself
# with a request-COUNT cap that cannot fire on a pending call, so a hang there hangs forever)
# and `timeout_and_failure_are_distinguishable` (where a bound does exist, its expiry and a
# crash raise the same type and no caller in the tree tells them apart). The second is PS4's
# refutation turned into a demand rather than a note.
#
# One further demand is minted by the SUITE rather than by a resolution:
# `review_stages_enter_through_an_injection_seam`. The design gives the three stage calls no
# seam, and the author charge is explicit that a dependency with no seam makes the seam part of
# the contract — without it not one arm of this gate is drivable by any hermetic test.

demands:

  # ---- the return-value contract, and the close tool's own surface -------------------

  - id: close_result_contract
    kind: behavior
    form: test
    provisional: true
    binds: ["interacts(main_agent->tool_close_investigation).response",
            "close_outcome.domain.distinguished[closed-unchallenged]",
            "close_outcome.domain.distinguished[closed-refuted]",
            "close_outcome.domain.distinguished[closed-incoherent]",
            "close_outcome.domain.distinguished[closed-declined]",
            "close_outcome.domain.distinguished[forced-inconclusive-review-failed]",
            "close_outcome.domain.distinguished[closed-malformed]",
            "close_outcome.domain.distinguished[challenged]",
            "close_outcome.domain.distinguished[forced-inconclusive-nondiscriminating]",
            "close_outcome.domain.distinguished[forced-inconclusive-cap]"]
    discharged_by: test_close_result_contract_is_one_typed_arm_per_outcome

  - id: tool_close_investigation_seam
    kind: seam
    form: test
    binds: ["tool_close_investigation",
            "tool_close_investigation.access[main]",
            "interacts(main_agent->tool_close_investigation).payload"]
    discharged_by: test_close_tool_is_registered_to_main_with_a_typed_disposition
    # POSITIVE CONTROL for `close_tool_is_main_only` on the complementary cell: `access[main]`
    # must actually admit a call that commits, or the main-only negative passes on a tool no
    # role can reach.

  - id: disposition_outside_vocabulary_rejected
    kind: domain-outcome
    form: test
    binds: ["interacts(main_agent->tool_close_investigation).payload", "disposition.domain"]
    discharged_by: test_a_disposition_outside_the_enum_or_a_case_variant_is_rejected_before_any_gate_work

  - id: close_tool_is_main_only
    kind: negative
    form: test
    binds: ["tool_close_investigation.access[gather]",
            "tool_close_investigation.access[main]"]
    discharged_by: test_close_tool_is_unreachable_from_every_role_but_main
    rejected: [{nl: "Per-role verb authorization was considered and refuted as the mechanism — a verb is a data-source operation and a non-empty grant on the investigator role fails at policy compile, so main-only reachability is expressed by registering only at main's composition root."}]

  - id: close_tool_survives_budget_pressure
    kind: behavior
    form: test
    binds: ["tool_close_investigation.access[budget_tier]", "budget.domain.distinguished[on]"]
    discharged_by: test_a_budget_pressed_run_can_still_close
    rejected: [{nl: "Demoting the write tool out of the budget tail tier to make room for the close tool is the wrong repair — two existing test modules carry explicit comments recording that."}]

  - id: close_tool_budget_exemption_is_explicit
    kind: seam
    form: test
    binds: ["tool_close_investigation.access[budget_tier]"]
    discharged_by: test_the_close_tools_budget_exemption_is_registered_and_named
    rejected: [{nl: "Leaving the exemption implicit in whichever tier the tool happens to land in was rejected (RS16): a newly registered tool falls to the refusable core tier by default, so the exemption is a registration that can be silently removed rather than a property anything fails without. The close is the one call that must always be available — refusing it strands an investigation with findings it cannot record, and the gate's own forced turns are what push the run into that pressure."}]

  - id: close_tool_host_renders_from_typed_arguments
    kind: shape
    form: test
    binds: ["interacts(main_agent->tool_close_investigation).payload",
            "report_md.access[close_investigation]"]
    discharged_by: test_the_close_tool_composes_the_report_from_typed_arguments_and_accepts_no_body
    rejected: [{nl: "Accepting a model-supplied report body as a close argument was rejected (RS12): that argument is a new, unvalidated write surface, which is precisely the bypass removing report.md from the model's write allow exists to close."}]

  - id: close_write_reenters_artifact_validation
    kind: behavior
    form: test
    binds: ["report_md.access[close_investigation]", "report_md.payload"]
    discharged_by: test_the_close_write_reenters_the_validation_the_retired_path_enforced
    rejected: [{nl: "Letting the host write bypass the artifact schema was rejected: the report gained its schema, duplicate-key and legacy-delimiter breakout checks BECAUSE the model's write reached it through the write tool's validation path, and a host write triggered by a typed argument does not pass that gate by construction."}]

  # ---- R1: report.md leaves the model's write allow ----------------------------------

  - id: report_md_single_writer
    kind: behavior
    form: test
    binds: ["report_md.access[write_file]", "report_md.access[close_investigation]",
            "budget.domain.distinguished[off]"]
    discharged_by: test_report_md_leaves_the_model_write_allow_and_the_close_tool_writes_it
    rejected: [{nl: "Leaving the model's write open and instructing it not to use the path was rejected: the gate's structural argument is that exactly one writer exists, and an open bypass makes the boundary instructed rather than structural."}]

  - id: report_md_write_parity
    kind: parity
    form: test
    binds: ["report_md.access[write_file]", "report_md.access[edit_file]"]
    discharged_by: test_both_write_and_edit_are_refused_on_report_md

  - id: close_path_survives_the_write_allow_change
    kind: survival
    form: test
    binds: ["report_md", "tool_close_investigation", "skill_md"]
    discharged_by: test_a_run_still_reaches_a_recorded_disposition_without_write_access_to_report_md

  - id: close_instruction_surfaces_agree
    kind: behavior
    form: test
    binds: ["skill_md", "budget_refusal_message", "write_file_docstring"]
    discharged_by: test_no_model_facing_surface_still_says_report_md_is_writable

  - id: replay_trace_rerecorded_not_allow_weakened
    kind: survival
    form: test
    binds: ["replay_trace", "report_md.access[write_file]"]
    discharged_by: test_the_recorded_replay_whose_write_the_narrowed_allow_refuses_is_re_recorded

  - id: report_629_contracts_retired_deliberately
    kind: survival
    form: clause
    outcome: {nl: "The two contracts committed under the earlier report-output work — that a valid report is reachable with zero working-document content on disk, and that no ordering requirement exists between the two write gates — are retired deliberately as part of removing report.md from the model's write allow, and the retirement is recorded with its reason rather than discovered as a broken test."}
    binds: ["report_md.access[write_file]", "investigation_md"]
    rejected: [{nl: "Weakening the narrowed allow-list so the two committed contracts keep passing was rejected — that is the bypass this change exists to close. Letting them break silently as collateral damage was also rejected."}]

  - id: report_ordering_independence_retired
    kind: survival
    form: test
    binds: ["report_md", "investigation_md"]
    discharged_by: test_the_629_ordering_independence_contract_is_re_expressed_on_the_close_tool

  # ---- when the gate fires, and what it does -----------------------------------------

  - id: gate_skips_inconclusive
    kind: domain-outcome
    form: test
    binds: ["disposition.domain.distinguished[inconclusive]",
            "close_outcome.domain.distinguished[closed-unchallenged]"]
    discharged_by: test_a_draft_inconclusive_close_commits_without_invoking_the_gate

  - id: unresolved_runs_are_reviewed_by_nothing
    kind: domain-outcome
    form: waiver
    outcome: {nl: "Unresolved investigations are reviewed by nothing, and that is accepted at this scope rather than overlooked. The gate skips the unresolved disposition deliberately, and the offline pipeline that used to service exactly those cases left the plan when the measurement PR was skipped — so the ground the original non-obligation was granted on is gone. This change also ENLARGES the unreviewed population: the gate manufactures an unresolved outcome on three of its own arms — the forced-turn cap, any review that cannot complete under the fail-closed policy, and the arm where the evidence cannot speak to the story. A challenger's deliberate DECLINE is not among them: it leaves the confident close standing, and counting it here (as this waiver did before the arm split) overstated the waived population by an arm. The recorded disposition is what every downstream consumer routes on, and the five production sites that read it disagree about how to handle it, so the cost of this waiver is paid by real consumers and grows with how often the gate fires. A human examined this at the authoring seam and accepted it for this scope."}
    binds: ["disposition.domain.distinguished[inconclusive]",
            "close_outcome.domain.distinguished[forced-inconclusive-cap]",
            "close_outcome.domain.distinguished[forced-inconclusive-review-failed]",
            "close_outcome.domain.distinguished[closed-evidence-cannot-speak]",
            "directions_for"]
    cites: [C19, K12, K15, K21, K22, PS4]
    rejected:
      - {nl: "Firing the gate on unresolved dispositions was considered and declined: the existing disposition-to-direction map returns BOTH directions for the unresolved value, and nothing states how two counter-stories are argued, compared, or combined into one verdict. That is new design, not a decision this spec can take — and it would double the review cost on exactly the population the gate is least confident about."}
      - {nl: "Reviewing only the unresolved runs the gate itself manufactured was considered and declined: it needs re-entry semantics nothing specifies — whether a forced-inconclusive close can be re-opened, what the turn and grace counters mean on a second pass, and whether the record of the first review is an input to the second. Cheaper-looking than the general case, and no better specified."}
      - {nl: "Leaving this as an open fork for the next phase was declined. It is the one item on this run's list that no further reading could settle, and carrying it forward would have read as an oversight in the finished spec rather than as a cost someone accepted."}

  - id: counter_direction_from_directions_for
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->directions_for)",
            "disposition.domain.distinguished[malicious]",
            "disposition.domain.distinguished[benign]"]
    discharged_by: test_counter_direction_comes_from_the_existing_map_against_the_live_disposition

  - id: gate_absent_on_truncated_run
    kind: negative
    form: test
    binds: ["interacts(main_agent->tool_close_investigation)",
            "request_limit.domain.distinguished[60]"]
    discharged_by: test_a_request_limited_run_never_reaches_the_gate

  - id: challenged_arm_forces_a_turn
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[challenged]", "review_state",
            "interacts(main_agent->tool_close_investigation)"]
    discharged_by: test_a_surviving_story_with_silent_rows_refuses_the_close_and_counts_a_turn
    # POSITIVE CONTROL for `gate_absent_on_truncated_run` on the same edge: a run that DOES
    # reach the close fires the gate and spends a turn, so the truncated-run negative is not
    # green because the review is unreachable in every case.
    rejected: [{nl: "The design's mechanism — refuse the write so the framework hands the model another turn — is refuted and is not what this demand pins. A refusal is a raw retry against a shared budget of 10 whose overflow escapes every driver handler, and nothing in the tree structurally compels a further turn. What forces the turn is that the disposition is simply not committed until the gate is satisfied or the cap fires."}]

  - id: challenger_decline_leaves_the_close_standing
    kind: domain-outcome
    form: test
    binds: ["close_outcome.domain.distinguished[closed-declined]",
            "close_outcome.domain.distinguished[forced-inconclusive-review-failed]"]
    discharged_by: test_a_challenger_that_declines_to_argue_leaves_the_confident_close_standing
    rejected: [{nl: "Letting the challenger's decline share the fail-closed outcome's arm was rejected (RS17). The two mean opposite things — a decline is the challenger having nothing to say about a case it understood, a review failure is the machinery breaking — so one value gave them one downstream handling, and the design's own decline output lost its address: no arm, no demand, no test, and the suite's nearest neighbour scored a non-verdict reply as infrastructure noise. This is the same collapse the malformed arm exists to prevent in the mirror direction."}]

  - id: nondiscriminating_forces_inconclusive
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[forced-inconclusive-nondiscriminating]"]
    discharged_by: test_a_surviving_story_with_no_silent_rows_forces_inconclusive_immediately

  - id: turn_cap_forces_inconclusive
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[forced-inconclusive-cap]",
            "extra_turn_bound.domain"]
    discharged_by: test_the_attempt_past_the_bound_forces_inconclusive_instead_of_gating

  - id: degenerate_evidence_is_its_own_arm
    kind: domain-outcome
    form: test
    binds: ["close_outcome.domain.distinguished[closed-evidence-cannot-speak]",
            "close_outcome.domain.distinguished[challenged]",
            "close_outcome.domain.distinguished[forced-inconclusive-nondiscriminating]"]
    discharged_by: test_a_story_no_executed_lead_can_touch_takes_its_own_arm
    rejected: [{nl: "Reading every-lead-silent and no-lead-executed as opposite evidence — the two-branch split's behaviour — was rejected (RS13). Both mean the evidence cannot speak to the story; one says the investigation was under-determined, the other that the story was untestable. Under the split the gate spends a forced turn exactly where another turn cannot help, and burns the raised ceiling doing it. Promoted from a silent convergence three independent readers made without noticing they had decided anything."}]

  - id: forced_turn_raises_a_new_gap
    kind: negative
    form: test
    provisional: true
    binds: ["interacts(tool_close_investigation->main_session).payload", "review_state"]
    discharged_by: test_a_second_forced_turn_does_not_re_raise_a_gap_already_raised

  # ---- the corrected forced-turn mechanism (RS6) and the raised ceiling (RS7) ---------

  - id: forced_turn_cap_below_retry_budget
    kind: behavior
    form: test
    binds: ["retry_budget.domain.distinguished[10]", "extra_turn_bound.domain"]
    discharged_by: test_the_forced_turn_cap_is_rejected_when_it_reaches_the_shared_retry_budget

  - id: retry_exhaustion_does_not_escape_the_driver
    kind: behavior
    form: test
    binds: ["retry_budget.domain", "run_investigation",
            "close_outcome.domain.distinguished[forced-inconclusive-cap]"]
    discharged_by: test_a_stubborn_model_exhausting_the_retry_budget_closes_unresolved_instead_of_crashing

  - id: ceiling_is_bound_to_the_turn_cap
    kind: behavior
    form: test
    binds: ["request_limit.domain.alternatives[60 + extra_turn_bound]", "extra_turn_bound.domain"]
    discharged_by: test_the_raised_request_ceiling_is_read_from_the_forced_turn_cap_not_a_literal
    rejected: [{nl: "Separating the review's request allowance from the investigation's was recommended and not taken; one budget is kept and the ceiling raised, so the interaction returns the moment the cap changes and the two must be unable to move independently."}]

  - id: every_run_pays_the_raised_ceiling
    kind: domain-outcome
    form: test
    binds: ["request_limit.domain.alternatives[60 + extra_turn_bound]", "run_investigation"]
    discharged_by: test_a_run_the_gate_never_fires_on_still_gets_the_raised_ceiling

  - id: review_does_not_starve_the_run
    kind: behavior
    form: test
    binds: ["request_limit.domain", "drives(challenge_gate->challenger)"]
    discharged_by: test_the_reviews_own_calls_cannot_push_the_investigation_into_the_request_limit
    rejected: [{nl: "The pre-existing gap where the run's cost sum omits every gather subagent call is not fixed here; that failure clause is already true today, independent of this change."}]

  # ---- the two bounds, and the per-run counters ---------------------------------------

  - id: extra_turn_bound_is_a_knob
    kind: seam
    form: test
    binds: ["extra_turn_bound.domain"]
    discharged_by: test_the_extra_turn_bound_is_injected_not_literal

  - id: grace_bound_is_a_knob
    kind: seam
    form: test
    binds: ["grace_bound.domain"]
    discharged_by: test_the_grace_bound_is_injected_not_literal

  - id: bounds_reject_zero
    kind: domain-outcome
    form: test
    binds: ["extra_turn_bound.domain.distinguished[0]", "grace_bound.domain.distinguished[0]"]
    discharged_by: test_zero_is_refused_for_either_bound
    rejected: [{nl: "Accepting zero and treating the resulting indistinguishability as a cost was one of the two readings the answering copies split on, and it is not taken. This demand was prose SOLELY because both bounds' shipped values were an open human decision; RS14 set them (two forced turns, one refinement round), so it is executable and the two R4 zero-cell obligations it left open are closed."}]

  - id: grace_budget_resets_per_gate_attempt
    kind: behavior
    form: test
    binds: ["grace_bound.domain", "review_state"]
    discharged_by: test_a_second_gate_attempt_starts_with_a_full_grace_budget
    rejected: [{nl: "Resetting grace per RUN was rejected (RS14): a second challenge would inherit an exhausted budget and could never refine at all, which silently turns every later attempt into a cold pass while the rounds-consumed signal still reports zero."}]

  - id: review_state_on_frozen_deps
    kind: seam
    form: test
    binds: ["review_state", "agent_deps"]
    discharged_by: test_review_counters_live_in_a_mutable_container_and_are_per_run

  # ---- what the investigator gets back ------------------------------------------------

  - id: counter_story_absent_from_session
    kind: negative
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload",
            "report_md.payload", "review_record", "review_trace"]
    discharged_by: test_no_counter_story_prose_reaches_the_main_session
    rejected: [{nl: "Binding this negative to the tool return alone was rejected: payload-derived text also reaches the report's frontmatter reason on the forced-unresolved arms, the review record, and the review stages' own execution traces — and the last two sit inside grants the investigator already holds, so a negative naming one address passes vacuously on the other three."}]

  - id: discriminating_material_reaches_session
    kind: behavior
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_the_challenged_arm_does_hand_back_the_discriminating_material

  - id: review_return_is_contained
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_payload_derived_text_returns_only_inside_the_run_salted_untrusted_frame

  - id: review_return_is_typed_not_prose
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_the_recommended_lead_structure_admits_no_free_text_limb

  - id: recommended_lead_provenance
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_a_reviewer_originated_lead_carries_its_provenance_stamp

  # ---- the challenger's input, grant and output ----------------------------------------

  - id: challenger_input_is_observation_layer
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload"]
    discharged_by: test_the_challengers_input_carries_observations_and_no_inference_layer
    rejected: [{nl: "Dropping only the concluding block was rejected: in three of three real completed working documents the resolution and authorization rows already name the settled interpretation in plain English, so the cut has to be at the observation/inference boundary, not the inference/conclusion one."}]

  - id: challenger_sees_lead_identity_not_belief_structure
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload"]
    discharged_by: test_the_challenger_sees_lead_identity_but_not_the_hypotheses_each_lead_tests
    rejected:
      - {nl: "Admitting the lead block whole was rejected (RS18). A lead row carries the ids of the hypotheses the lead was run to test, which is belief structure and sits on the inference side of the line the human drew — the same line the ledger claim states in the document's own vocabulary. Withholding the block entirely was rejected too: the challenger's output contract requires a lead id per settled assertion, so identity must arrive or that contract is unsatisfiable."}
      - {nl: "Expressing this by asserting a block tag's presence was rejected, and is how the whole block came to be admitted in the first place. The resolution constrains which COLUMNS of a row arrive; a tag assertion cannot see a column, so the demand is written at row-content altitude instead."}

  - id: challenger_holds_no_run_dir_read
    kind: negative
    form: test
    binds: ["challenger.access[read_file]", "challenger.access[bash]",
            "coherence_checker.access[read_file]", "coherence_checker.access[bash]"]
    discharged_by: test_the_new_roles_cannot_reach_the_live_working_document
    rejected: [{nl: "Narrowing the roles' extra read roots was rejected as the enforcement mechanism — the working document is reachable through the run directory itself, which both grant surfaces admit first and unconditionally, ahead of any read-roots widening."}]

  - id: challenger_reads_its_inlined_input
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->challenger).payload",
            "challenger.access[read_file]"]
    discharged_by: test_the_challenger_still_receives_its_observation_layer_input
    # POSITIVE CONTROL for `challenger_holds_no_run_dir_read`, on the same cell under the
    # complementary condition: with NO read grant the same observation-layer bytes still reach
    # the role through the sanctioned inlined path. A bare no-grant negative is also green
    # against a role that receives nothing at all.

  - id: coherence_checker_input_is_the_counter_story_only
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->coherence_checker).payload"]
    discharged_by: test_the_coherence_checker_receives_the_counter_story_and_nothing_else
    rejected: [{nl: "Giving the coherence checker payload access was rejected (RS10). Internal consistency is the only job it can do without payload access, and that constraint is what keeps it honest — a critic that can see the evidence stops checking coherence and starts re-litigating the case."}]

  - id: projection_input_is_live_shaped
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->oracle).payload"]
    discharged_by: test_the_projection_stage_input_is_built_from_the_live_run_not_a_learning_run_dir
    rejected: [{nl: "Reusing the projection stage unchanged was rejected (RS10), and the design's claim that this reuse is free is WITHDRAWN. Its existing invocation threads a learning run directory and a story-derived trace prefix; a live investigation supplies neither, and it is the stage two of the verdict vocabulary's arms are defined over."}]

  - id: review_stages_enter_through_an_injection_seam
    kind: seam
    form: test
    binds: ["drives(challenge_gate->challenger)",
            "drives(challenge_gate->coherence_checker)",
            "drives(challenge_gate->oracle)",
            "run_investigation"]
    discharged_by: test_the_review_stages_are_driven_through_an_injection_seam_on_the_entry_point
    rejected: [{nl: "Leaving the three stage calls seamless was rejected: the design names no injection point for them, and without a value the run is handed they are live provider calls that no hermetic scenario can drive — so not one arm of this gate would be testable. The seam sits on the entry point beside the five that already exist there, following the same value-not-monkeypatch discipline."}]

  - id: challenger_output_contract
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).response"]
    discharged_by: test_the_challenger_tail_declares_unsettled_requirements_with_settled_by_and_if_false

  - id: discriminator_rule
    kind: behavior
    form: test
    provisional: true
    binds: ["interacts(challenge_gate->oracle).response",
            "interacts(challenge_gate->challenger).response"]
    discharged_by: test_the_discriminating_set_is_silence_measured_against_declared_unsettled_requirements

  - id: direction_conditional_affordances
    kind: domain-outcome
    form: test
    binds: ["mitre_menu", "past_tickets",
            "direction.domain.distinguished[malicious]",
            "direction.domain.distinguished[benign]"]
    discharged_by: test_the_challengers_exploration_menu_follows_the_direction_it_argues

  - id: cold_start_affordance_omitted_not_empty
    kind: domain-outcome
    form: test
    binds: ["past_tickets.domain.distinguished[cold-start-no-eligible-tickets]",
            "direction.domain.distinguished[benign]"]
    discharged_by: test_an_empty_affordance_sample_omits_the_section_rather_than_sending_it_empty

  - id: menu_compliance_stays_unvalidated
    kind: behavior
    form: clause
    outcome: {nl: "The challenger's citations against its exploration menu are not validated, matching the actor precedent this role inherits: no check anywhere reads a cited technique table back against the menu the role was given, and neither judge direction receives a menu at all."}
    binds: ["mitre_menu"]
    rejected: [{nl: "Adding output-side menu-compliance validation was considered and not taken — the human's settled decision fixed the affordances, not their enforcement."}]

  # ---- the verdict arms and the record -------------------------------------------------

  - id: malformed_output_is_its_own_arm
    kind: domain-outcome
    form: test
    binds: ["close_outcome.domain.distinguished[closed-malformed]",
            "close_outcome.domain.distinguished[closed-incoherent]"]
    discharged_by: test_unparseable_output_never_scores_as_challenger_incoherence

  - id: refuted_and_incoherent_stay_distinct
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "close_outcome.domain.distinguished[closed-refuted]"]
    discharged_by: test_a_refuted_story_and_an_incoherent_one_are_distinguishable_on_disk

  - id: review_record_on_every_arm
    kind: behavior
    form: test
    binds: ["review_record", "close_outcome.domain"]
    discharged_by: test_every_gate_arm_including_the_surviving_story_leaves_a_typed_record

  - id: review_record_is_not_half_written
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "review_trace.access[logger_construct]"]
    discharged_by: test_a_fault_mid_review_leaves_nothing_readable_as_a_completed_review
    rejected:
      - {nl: "Inheriting the nearest existing precedent for this class of write was rejected: it opens and writes in place, uses no atomic rename, and no exception path anywhere removes what a fault leaves behind, while an atomic-write primitive sits in the same module used by a sibling function."}
      - {nl: "Scoping this to the record alone was rejected. A faulted stage always closes its trace logger but writes no incompleteness marker, so a truncated trace and a complete one differ only by having fewer lines — the same mistakable-for-finished shape, on the sibling surface."}

  - id: review_record_lives_beside_the_run
    kind: uniqueness
    form: test
    binds: ["review_record.identity"]
    discharged_by: test_the_review_record_lives_beside_the_run_and_is_written_temp_plus_rename
    rejected: [{nl: "Leaving the sink unnamed was the state this run inherited — the offline sink left with the offline PR, and until one existed the obligation quantifying over the review's outputs had no address at all. RS11 names it: a per-run file alongside the investigation's own artifacts, keyed by run and turn, written temp-plus-rename."}]

  - id: close_write_ordering_holds_the_fault
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "report_md.identity", "review_state"]
    discharged_by: test_the_close_writes_the_record_before_the_report_and_holds_the_fault
    rejected:
      - {nl: "Leaving the close's two writes and its counter mutation unordered was rejected (RS19). Report-first means a crash between them leaves a committed disposition nobody reviewed and no record saying so — on disk, indistinguishable from a close the gate passed. Record-first leaves a record with no report: visibly incomplete, and recoverable."}
      - {nl: "Letting the first fault abort the second write was rejected: the fault is HELD until both writes have been attempted, following the discipline this codebase already applies where a side effect must not be silently dropped by an earlier failure."}
      - {nl: "Treating this as covered by the record's own atomicity demand was rejected — that demand pins that a single write is all-or-nothing, and its test injects the fault before any write happens, so it says nothing about what survives a fault BETWEEN the two."}

  - id: every_review_stage_leaves_a_trace
    kind: behavior
    form: test
    binds: ["review_trace", "review_trace.identity"]
    discharged_by: test_every_review_stage_leaves_a_trace
    rejected: [{nl: "Leaving trace existence unasserted was the state phase F found, and it hollowed out three demands at once. The containment negative, the round-attributability demand and the truncated-trace marker demand all iterate the traces on disk, so an implementation writing none satisfies all three by iterating an empty list — and the trace is one of the four surfaces that negative binds precisely because it sits inside a grant the investigator already holds."}]

  - id: grace_rounds_are_attributable
    kind: behavior
    form: test
    binds: ["review_record.identity", "review_trace.identity", "grace_bound.domain"]
    discharged_by: test_rounds_consumed_per_pass_is_recorded_and_each_rounds_trace_is_attributable

  - id: all_settled_reads_differently_from_nondiscriminating
    kind: uniqueness
    form: test
    binds: ["review_record.identity"]
    discharged_by: test_an_all_settled_requirement_list_is_readable_as_distinct_from_a_genuinely_nondiscriminating_case

  - id: attacked_disposition_preserved
    kind: behavior
    form: test
    binds: ["review_record.payload", "report_md.payload"]
    discharged_by: test_the_disposition_the_challenger_attacked_survives_beside_the_one_recorded

  - id: report_reason_key
    kind: shape
    form: test
    binds: ["report_md.payload"]
    discharged_by: test_report_frontmatter_carries_the_close_reason_within_the_byte_cap

  - id: three_close_shapes_distinguishable
    kind: domain-outcome
    form: test
    binds: ["report_md.payload", "close_outcome.domain"]
    discharged_by: test_first_time_close_after_n_challenges_and_forced_inconclusive_are_distinguishable

  - id: close_is_terminal_for_the_disposition
    kind: behavior
    form: test
    binds: ["investigation_md.access[write_file]", "investigation_md.access[edit_file]",
            "report_md.identity"]
    discharged_by: test_no_post_close_write_can_silently_move_the_recorded_disposition

  # ---- failing closed (RS9), extended past the challenger call ------------------------

  - id: gate_failure_policy
    kind: behavior
    form: test
    provisional: true
    binds: ["interacts(challenge_gate->challenger).response",
            "close_outcome.domain.distinguished[forced-inconclusive-review-failed]"]
    discharged_by: test_a_review_that_cannot_complete_does_not_silently_commit_the_close

  - id: fail_closed_covers_every_review_stage
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->coherence_checker).response",
            "interacts(challenge_gate->oracle).response",
            "close_outcome.domain"]
    discharged_by: test_any_review_stage_that_cannot_complete_closes_the_case_unresolved_with_its_reason
    rejected: [{nl: "Writing the policy over the challenger call alone was rejected — three calls run per attempt, two of them concurrently, and a critic-only or oracle-only fault in the same window would be uncovered."}]

  - id: review_roles_mint_their_own_salt
    kind: seam
    form: test
    binds: ["run_salt.access[stage_bind]", "run_salt.access[main_gather_bind]"]
    discharged_by: test_a_review_roles_bind_mints_a_fresh_salt_and_never_receives_the_sessions
    rejected: [{nl: "Precedenting the review roles on the gather bind, which explicitly threads the investigation's own salt, was rejected. Salt inheritance is not a general property: the gather bind is the sole shared-salt case in the tree and every learning stage mints its own. Inheriting the session salt would hand a role that reads attacker-influenced payloads the delimiter of the frame its own output returns inside."}]

  - id: misconfigured_review_role_fails_before_the_investigation_pays
    kind: behavior
    form: test
    binds: ["role_registry.domain.distinguished[built-fresh-per-stage-invocation]",
            "model_preflight.domain.distinguished[hardcoded-to-main-and-gather]",
            "model_preflight.domain.alternatives[raises at agent build]",
            "close_outcome.domain"]
    discharged_by: test_a_review_role_with_no_usable_model_config_fails_at_startup_not_once_per_investigation
    rejected:
      - {nl: "Relying on the agent build to raise was rejected as provider-dependent: one provider family raises immediately on a missing key, another performs no key check at all and defers to the first live API call. A demand written against `fails at build` would be silently true for one provider and silently false for the other."}
      - {nl: "Leaving the failure to first use was rejected because of what it composes with: the agent is built fresh on every stage call and the gate fails closed, so a misconfigured role does not stop the fleet — it downgrades confident investigations to unresolved one at a time, after each has already paid its full budget."}

  - id: review_stage_timeout_is_explicit
    kind: seam
    form: test
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->oracle).response"]
    discharged_by: test_each_review_stage_call_carries_an_explicit_timeout_a_test_can_drive
    rejected: [{nl: "Assuming a timeout already wraps a stage call was rejected, and the stage-hang probe settled it in both directions: the live tool-body-awaits-a-subagent path carries no wall-clock bound at all (PS1), while the offline stage runner wraps every call in a per-role env-backed one (PS2). No seam wires either to the review stages, so which one they take is a design choice rather than an inheritance — which is why the deadline is threaded as a value a scenario can set."}]

  - id: review_stages_are_wall_clock_bounded
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->oracle).response",
            "interacts(challenge_gate->coherence_checker).response"]
    discharged_by: test_a_stage_that_never_returns_is_bounded_by_wall_clock_not_a_request_count_cap
    rejected:
      - {nl: "Inheriting the precedent nearest to the review stages was rejected. The live path that already awaits a subagent from a tool body — structurally the same shape the close tool's review runs in — bounds itself with a request-COUNT cap and two structured-failure catches, none of which can fire while a single call is simply still pending (PS1). A hang there hangs forever."}
      - {nl: "Pinning `a limit exists` rather than `a wall clock ends a pending call` was rejected for the same reason: the count cap satisfies the weaker sentence and still hangs. The bound to copy is the offline stage runner's per-call wall clock (PS2), which is real and working but sits on a structurally distant call path, so citing it as `a deadline already exists` would overstate the case."}
      - {nl: "Relying on a client- or SDK-level timeout was rejected: this tree configures none on either provider path (PS5), so whatever bound would eventually apply is an unexamined library default rather than a property this codebase guarantees."}

  - id: stage_deadline_default_is_exercised
    kind: domain-outcome
    form: test
    binds: ["stage_timeout.domain.distinguished[450]"]
    discharged_by: test_the_review_stage_deadline_defaults_to_450_seconds_and_is_env_overridable
    rejected:
      - {nl: "Minting a fifth per-role number was rejected: 450 already exists as this tree's generic subagent default, and the merged pilot measured a gate firing at roughly three to five minutes on an eleven-lead case — so 450 is about 1.5x the observed worst case. Ordinary slowness will not trip it, which is what keeps the timeout-versus-failure distinction a signal rather than noise; the tree's 1800-second authoring values would sit outside an analyst's tolerance for a blocked live investigation."}
      - {nl: "Recording the number in prose was rejected. This run has already established that a prose bound does not discharge the obligation to exercise a real value — that is exactly why bounds_reject_zero could not stay a clause — so the default is driven, not stated."}
      - {nl: "A literal at the call site was rejected in favour of an env-backed accessor with the value as its default, matching how every sibling per-role deadline in this tree is expressed, so the number stays operator-changeable without a code change."}

  - id: stage_deadline_is_not_the_subagent_knob
    kind: negative
    form: test
    binds: ["stage_timeout.domain", "subagent_timeout.domain"]
    discharged_by: test_moving_the_generic_subagent_deadline_does_not_move_the_reviews
    rejected: [{nl: "Reading the review deadline off the existing generic subagent knob was rejected. The reuse is a coincidence of VALUE, not a shared setting: the two hold the same number today, so a later change to the offline knob would move the live gate's deadline invisibly — the agreement is precisely what would hide the coupling until it mattered. Same number today, independent controls."}]
    # Its positive control is `stage_deadline_default_is_exercised`, on the same root under the
    # complementary condition: the review's OWN knob does move the review's deadline. Without
    # that pairing this negative is also green against an accessor that ignores its environment.

  - id: timeout_and_failure_are_distinguishable
    kind: uniqueness
    form: test
    binds: ["review_record.identity",
            "close_outcome.domain.distinguished[forced-inconclusive-review-failed]"]
    discharged_by: test_a_timed_out_review_is_observably_distinct_from_one_that_failed
    rejected:
      - {nl: "Inheriting the existing bound's observability was rejected: where a deadline does fire, its branch and the generic-exception branch raise the identical exception type, separated only by a message substring and a `__cause__` no caller reads, and every catch site in the tree treats it as one blanket type (PS4). The gate would be unable to tell a slow model from a broken one — a capacity problem from a defect."}
      - {nl: "A tenth arm for the timeout case was rejected. RS9 is settled: any review that cannot complete fails closed on the declined arm with its reason, and minting a new arm here would re-open a human decision to solve an observability problem. The distinction is carried as a typed field on the recorded reason and on the review record — which is what RS5 pins the record for — rather than as a new outcome."}
      - {nl: "Folding this into `review_stages_are_wall_clock_bounded` was rejected, and the two are deliberately separate demands: a bound can exist and still be indistinguishable from a crash, which is exactly the state the probe found on the one path that has a bound. One demand asserts the bound fires; the other asserts the fleet can read which of the two things happened. Satisfying the first tells you nothing about the second."}

structure:

  axes: [run_id, direction, lead_id, turn, round, stage]

  actors:
    - {id: run_investigation, frame: leg, provenance: code}
    - {id: main_agent, frame: leg, provenance: code}
    - {id: tool_write_file, frame: leg, provenance: code}
    - {id: tool_edit_file, frame: leg, provenance: code}
    - {id: tool_close_investigation, frame: leg, provenance: design}
    - {id: challenge_gate, frame: composition, provenance: design}
    - {id: challenger, frame: leg, provenance: design}
    - {id: coherence_checker, frame: leg, provenance: design}
    - {id: oracle, frame: leg, provenance: code}

  boundaries:

    - id: report_md
      provenance: code
      note: "The run's durable disposition. Exactly one production writer today (the
             model's write and edit tools); seven production consumers hard-fail on its
             absence. R1 replaces the writer, which is why the access facet is keyed by
             all three vias that can reach it."
      facets:
        payload:
          parts:
            - {role: system, source: const:REPORT_FRONTMATTER_SCHEMA}
            - {role: user, source: template:REPORT_BODY,
               slots: {disposition: disposition.domain, reason: close_outcome.domain}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The report is a host-validated frontmatter block over a body. The `role`
               column is the chooser: `system` is host-composed and `user` is
               model-supplied, which is the distinction the rendered-sink walk needs —
               the reason value on the forced-unresolved arms is composed from
               challenger- or oracle-derived text."
        identity:
          key_axes: [run_id]
          evidence: {nl: "Read off the run-paths accessor: the report is `<run_dir>/report.md`,
                     one per investigation, and the repo-wide sweep for the artifact name
                     found no second writer."}
          sharing: unique-key
        access:
          constraints_by_via:
            write_file:
              trust: attacker-influenced
              constraints: [allow-list-denial, artifact-schema, duplicate-key-detection,
                            legacy-delimiter-ban]
            edit_file:
              trust: attacker-influenced
              constraints: [allow-list-denial, artifact-schema, duplicate-key-detection,
                            legacy-delimiter-ban]
            close_investigation:
              trust: derived
              constraints: [host-rendered-from-typed-arguments, artifact-schema,
                            duplicate-key-detection, legacy-delimiter-ban]
              # RS12 closes what was this artifact's R0/R3/R6 hole in one move: the body is
              # composed host-side from typed arguments and routed through exactly the
              # validation the retired model-write path enforced, and the `reason` slot becomes
              # a typed value rather than free text derived from the review's output — so the
              # rendered-sink exposure the trust walk found never opens.

    - id: investigation_md
      provenance: code
      note: "The working document. Stays model-writable through the investigation; append-only
             is enforced by fence count alone and a scalar concluding block has no row-identity
             check, so a second contradicting conclusion would otherwise be accepted silently.
             RS15 constrains the grant AFTER the close: three answering copies converged on
             'untouched by this change' and were overruled, because that agreement was an
             assumption inherited from the design's silence rather than a reading of it."
      facets:
        access:
          constraints_by_via:
            write_file: {trust: attacker-influenced, constraints: [review-state-aware-after-close]}
            edit_file: {trust: attacker-influenced, constraints: [review-state-aware-after-close]}

    - id: main_session
      provenance: code
      note: "The investigator's message history — the reach surface every negative demand
             is written against."
      facets:
        payload:
          parts:
            - {role: system, source: const:UNTRUSTED_FRAME}
            - {role: user, source: template:CLOSE_RETURN,
               slots: {outcome: close_outcome.domain,
                       discriminating_material: review_record.payload}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "What the close tool hands back. On every arm but the challenged one this
               carries no challenger-derived text at all; on the challenged arm it carries
               a typed list of the discriminating material inside the run-salted untrusted
               frame, never challenger prose."

    - id: disposition
      provenance: code
      facets:
        domain:
          type: enum
          refinement: {nl: "the existing three-member investigation disposition"}
          default: inconclusive
          distinguished: ["inconclusive", "malicious", "benign"]
          falsy_valid: false
          documented_alternatives: []

    - id: direction
      provenance: code
      facets:
        domain:
          type: enum
          refinement: {nl: "the counter-story direction the challenger argues; the existing
                       disposition-to-direction map selects it"}
          default: malicious
          distinguished: ["malicious", "benign"]
          falsy_valid: false
          documented_alternatives: []

    - id: close_outcome
      provenance: design
      note: "The close tool's typed result. TEN arms: RS13 promoted the degenerate discriminator
             case out of `documented_alternatives` (every executed lead silent and no lead
             executed at all are one outcome, not two readings of opposite evidence), and RS17
             split a value that was carrying two meanings. `closed-declined` is the CHALLENGER's
             own decline — it read the case and had no counter-story, the decline is recorded and
             judged, and the investigator's confident close STANDS. The fail-closed outcome for a
             review that could not complete is `forced-inconclusive-review-failed`, which
             overrides the disposition. Sharing one value shared the downstream handling too."
      facets:
        domain:
          type: enum
          refinement: {nl: "one closed-vocabulary outcome per gate condition; only the
                       challenged arm's return carries discriminating material"}
          default: closed-unchallenged
          distinguished: ["closed-unchallenged", "closed-refuted", "closed-incoherent",
                          "closed-declined", "forced-inconclusive-review-failed",
                          "closed-malformed", "challenged",
                          "forced-inconclusive-nondiscriminating", "forced-inconclusive-cap",
                          "closed-evidence-cannot-speak"]
          falsy_valid: false
          documented_alternatives: []

    - id: review_record
      provenance: design
      note: "RS11 names the sink: a per-run file beside the investigation's own artifacts,
             written temp-plus-rename. Before that this facet claimed a key with no evidence —
             the schema's `unknown` — because the offline sink left with the offline PR and the
             obligation quantifying over the review's outputs had nowhere to point."
      facets:
        payload:
          parts:
            - {role: system, source: const:REVIEW_RECORD_SCHEMA}
            - {role: user, source: template:REVIEW_RECORD,
               slots: {verdict: close_outcome.domain,
                       direction: direction.domain,
                       attacked_disposition: disposition.domain,
                       requirement_list: "interacts(challenge_gate->challenger).response",
                       projection_response: "interacts(challenge_gate->oracle).response"}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "Pinned for observability, not for the discriminator rule: enough to
               reconstruct why a verdict came out as it did, without pinning which of those
               the gate keys on. One distinction is required — an all-settled requirement
               list must read as different from a genuinely non-discriminating case."
        identity:
          key_axes: [run_id, turn]
          evidence: {nl: "Read off RS11's named sink: one record per gate attempt inside the
                     closing run's own directory, keyed by the run and the turn so a second
                     forced turn cannot land on the first's path — and written temp-plus-rename
                     because the nearest existing precedent for this class of write opens in
                     place, has no exception path that removes a partial file, and leaves a
                     crashed write indistinguishable from a review that never ran."}
          sharing: unique-key

    - id: review_trace
      provenance: code
      note: "Each review stage writes its own trace under the run's trace sink. Within one
             process a reused trace name appends rather than truncating — the design's
             stated overwrite hazard is refuted — but the per-agent sequence counter resets
             on every construction, so a second round's record ids collide with the first's
             and no field in the schema marks the round boundary."
      facets:
        identity:
          key_axes: [run_id, stage, round]
          evidence: {nl: "Read off the stage harness, which joins the run directory with the
                     wiring's trace name unchanged; the only stage that varies its name
                     within a run keys on story stem and lead id, and the one stage that
                     threads a per-invocation index proves the harness supports a round axis
                     when a wiring passes one."}
          derivations:
            - {value: trace_name, fn_of: stage, injective: true}
          sharing: serialized-append
        access:
          constraints_by_via:
            logger_construct:
              trust: operator
              constraints: [always-closed-on-fault, no-incompleteness-marker]

    - id: review_state
      provenance: design
      note: "The per-run turn and grace counters. The deps object is frozen and carries
             exactly one mutable container, with no integer counter anywhere on it, so a
             per-run counter needs a container or a small holder object — an int field
             cannot follow that precedent."
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "Read off the deps definition and a census of every mutation site:
                     one mutable set, added to at two write sites and read at one, with no
                     in-place field assignment anywhere in the runtime."}
          sharing: unique-key

    - id: agent_deps
      provenance: code
      facets: {}

    - id: request_limit
      provenance: code
      note: "What actually terminates a run. Exceeding it is caught and the run ends cleanly
             as truncated; the design's own non-obligation says a truncated run never reaches
             a close, which is why the gate raising it matters."
      facets:
        domain:
          type: int
          refinement: {nl: "requests per agent run; 60 for the main agent, 40 for gather"}
          default: 60
          distinguished: [60]
          falsy_valid: false
          documented_alternatives:
            - value: "60 + extra_turn_bound"
              crosses_validation: unknown

    - id: retry_budget
      provenance: code
      note: "The framework's shared tool-retry budget. The eleventh retry raises an error
             none of the driver's four handlers catches, so a stubborn model turns a
             refusal-based gate into an uncaught crash."
      facets:
        domain:
          type: int
          refinement: {nl: "tool retries before the overflow exception"}
          default: 10
          distinguished: [10]
          falsy_valid: false
          documented_alternatives: []

    - id: budget
      provenance: code
      note: "Enforcement is opt-in and off by default; accounting always runs but its
             warnings reach stderr only, never model context. Three enforced limbs, no cost
             limb anywhere."
      facets:
        domain:
          type: enum
          refinement: {nl: "the budget enforcement flag"}
          default: "off"
          distinguished: ["off", "on"]
          falsy_valid: false
          documented_alternatives: []

    - id: extra_turn_bound
      provenance: design
      note: "SET TO 2 BY RS14 — it matches the issue's stated intent and leaves headroom under
             the framework's shared retry budget of 10. Load-bearing three times over: it caps
             the forced turns, it sets every run's raised request ceiling, and it must sit below
             that retry budget."
      facets:
        domain:
          type: int
          refinement: {nl: "how many extra turns the gate may force before it records
                       inconclusive instead"}
          default: 2
          distinguished: [0]
          falsy_valid: false
          documented_alternatives: []

    - id: grace_bound
      provenance: design
      note: "SET TO 1 BY RS14, reset PER GATE ATTEMPT rather than per run — per-run means a
             second challenge inherits an exhausted budget and can never refine at all, which
             turns every later attempt into a cold pass while the rounds-consumed signal still
             reads zero."
      facets:
        domain:
          type: int
          refinement: {nl: "how many refinement rounds a story gets, per gate attempt, before it
                       scores as incoherent"}
          default: 1
          distinguished: [0]
          falsy_valid: false
          documented_alternatives: []

    - id: stage_timeout
      provenance: design
      note: "The wall clock a single review-stage call runs under. SET TO 450 SECONDS BY THE
             HUMAN — the tree's existing generic-subagent default rather than a fifth number,
             at roughly 1.5x the worst case the merged pilot measured, so ordinary slowness
             does not trip it and a stage that exceeds it is stuck rather than slow. Expressed
             as an env-backed accessor with that default, the way every sibling per-role
             deadline here is expressed."
      facets:
        domain:
          type: int
          refinement: {nl: "seconds one review-stage call may run before the gate abandons it"}
          default: 450
          distinguished: [450]
          falsy_valid: false
          documented_alternatives: []

    - id: subagent_timeout
      provenance: code
      note: "The tree's existing generic per-role subagent deadline, modelled ONLY so the
             review's deadline has an address to be independent of. Same number today; a
             separate control. It is not a documented alternative for stage_timeout — treating
             it as one is the coupling the negative demand exists to forbid."
      facets:
        domain:
          type: int
          refinement: {nl: "seconds an offline stage call may run; env-backed, 450 today"}
          default: 450
          distinguished: []
          falsy_valid: false
          documented_alternatives: []

    - id: past_tickets
      provenance: code
      note: "The benign direction's exploration affordance: prior closed cases on the same
             alert signature, sampled from a filtered window."
      facets:
        domain:
          type: enum
          refinement: {nl: "the sampled prior-close menu, or the cold-start case where the
                       sampler returns nothing eligible"}
          default: sampled
          distinguished: ["cold-start-no-eligible-tickets"]
          falsy_valid: false
          documented_alternatives: []

    - id: mitre_menu
      provenance: code
      note: "The malicious direction's exploration affordance. Enforcement is by input
             construction only — the menu is pre-selected host-side — and nothing anywhere
             reads a cited technique table back against the menu the role was given."
      facets: {}

    - id: directions_for
      provenance: code
      note: "The existing disposition-to-direction map. Unmodified by this change; it
             returns both directions for the unresolved disposition and exactly one for
             each confident one."
      facets: {}

    - id: run_salt
      provenance: code
      note: "The wrap performs no content inspection and no escaping, so a reader that has
             seen a salt can close that frame. The two bind precedents DISAGREE about
             freshness and the disagreement is the whole point: the live main-to-gather
             bind explicitly threads the session's own salt, while every learning stage
             mints its own and two stage entrypoints have no salt parameter at all. A
             review role precedented on the stage pattern never sees the main session's
             delimiter; one precedented on the gather pattern does."
      facets:
        access:
          constraints_by_via:
            main_gather_bind:
              trust: attacker-influenced
              constraints: [shared-run-salt, fixed-before-any-payload-byte]
            stage_bind:
              trust: operator
              constraints: [fresh-salt-per-stage, no-caller-threaded-value]

    - id: role_registry
      provenance: code
      note: "Adding a role is a five-part registration and every part is mechanically
             enforced; an unregistered role is a loud failure at agent build, not a silent
             no-grant. But the registry is static data and the agent is built FRESH ON
             EVERY STAGE CALL — the one live non-main role via a closure fired only when its
             tool runs. So the loud failure lands at first gate fire, deep into an
             investigation whose budget is already spent, never at driver construction."
      facets:
        domain:
          type: enum
          refinement: {nl: "when a stage's agent build resolves its role"}
          default: "built-fresh-per-stage-invocation"
          distinguished: ["built-fresh-per-stage-invocation"]
          falsy_valid: false
          documented_alternatives: []

    - id: model_preflight
      provenance: code
      note: "The offline cycle's fail-fast preflight is unreachable from either live
             entrypoint. Live has its own, narrower one: hardcoded to exactly the two
             existing roles' resolved models, with no mechanism to enumerate the roles a run
             will invoke, and no all-roles scan exists anywhere. So a new role's bad model
             config surfaces only at first use — and even that is provider-dependent."
      facets:
        domain:
          type: enum
          refinement: {nl: "what checks a role's model credentials before an investigation
                       pays for a review it cannot complete"}
          default: "hardcoded-to-main-and-gather"
          distinguished: ["hardcoded-to-main-and-gather"]
          falsy_valid: false
          documented_alternatives:
            - value: "raises at agent build"
              crosses_validation: false

    - id: skill_md
      provenance: code
      facets: {}

    - id: budget_refusal_message
      provenance: code
      note: "Tells the model its report write is still available — goes stale under R1."
      facets: {}

    - id: write_file_docstring
      provenance: code
      note: "Lists report.md as a valid target — goes stale under R1."
      facets: {}

    - id: replay_trace
      provenance: code
      note: "A golden replay recording carrying a write of report.md that a narrowed
             allow-list refuses. Re-recorded rather than weakening the allow."
      facets: {}

    - id: tool_close_investigation
      provenance: design
      note: "The tool surface, as distinct from the actor that writes through it. A newly
             registered tool lands in the refusable core tier by default, which was in tension
             with the demand that a budget-pressed run can still close; RS16 resolves it with an
             explicit, recorded exemption rather than a tier the tool happens to fall into."
      facets:
        payload:
          parts:
            - {role: user, source: template:CLOSE_ARGS,
               slots: {disposition: disposition.domain}}
          invariants: [all-slots-bound]
          nl: "The close call's argument set: a draft disposition typed from the single
               existing enum, rejected before any gate work runs if it falls outside it."
        access:
          constraints_by_via:
            main: {trust: attacker-influenced, constraints: [typed-disposition-validation]}
            gather: {trust: attacker-influenced, constraints: [not-registered-on-this-role]}
            budget_tier: {trust: operator, constraints: [explicit-budget-exemption]}

    - id: challenger
      provenance: design
      note: "The role's tool grant, as distinct from the actor that runs. Enforcement of the
             observation-layer cut is a GRANT decision: no file-read grant at all, following
             the inlined-input pattern both existing pipeline stages already use."
      facets:
        payload:
          parts:
            - {role: system, source: const:CHALLENGER_PROMPT}
            - {role: user, source: template:CHALLENGER_INVOCATION,
               slots: {observations: investigation_md,
                       alert: report_md,
                       affordance: mitre_menu,
                       direction: direction.domain}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The graph facts and what was learned about them, plus the real payloads —
               and no hypothesis weight, resolution, authorization verdict or conclusion.
               The residual is accepted: filtering is by block type, so a kept block's prose
               can still imply the reached disposition; what is withheld is the reached
               disposition, not the direction of reasoning."
        access:
          constraints_by_via:
            read_file: {trust: attacker-influenced, constraints: [no-grant]}
            bash: {trust: attacker-influenced, constraints: [no-grant]}

    - id: coherence_checker
      provenance: design
      note: "NAME RESOLVED BY THE HUMAN AT AUTHORING TIME — `coherence_checker`, not a default.
             It has to make the role's limit legible: RS10 gives it the counter-story and
             nothing else, so with no payload access it can establish that a story contradicts
             itself but never that it is false. `incoherent` and `false` are verdicts this
             design deliberately separates, and the placeholder invited conflating them."
      facets:
        payload:
          parts:
            - {role: system, source: const:COHERENCE_CHECKER_PROMPT}
            - {role: user, source: template:COHERENCE_CHECKER_INVOCATION,
               slots: {counter_story: "interacts(challenge_gate->challenger).response"}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The counter-story and nothing else. Internal consistency is the only job this
               role can do without payload access, and that constraint is what keeps it honest:
               a critic that can see the evidence stops checking coherence and starts
               re-litigating the case."
        access:
          constraints_by_via:
            read_file: {trust: attacker-influenced, constraints: [no-grant]}
            bash: {trust: attacker-influenced, constraints: [no-grant]}

    - id: oracle
      provenance: code
      note: "NO LONGER `reused unchanged` — RS10 withdraws that claim, which the design counted
             as free. Its blindness is enforced mechanically by a redacting exemplar, not by
             prompt discipline, and its grant is already an empty tool set, so no access facet
             is modelled. Its EXISTING invocation threads a learning run directory and a
             story-derived trace prefix that a live investigation supplies neither of; the
             payload facet below is the live-shaped replacement."
      facets:
        payload:
          parts:
            - {role: system, source: const:PROJECTION_PROMPT}
            - {role: user, source: template:PROJECTION_INVOCATION,
               slots: {counter_story: "interacts(challenge_gate->challenger).response",
                       leads: "interacts(challenge_gate->challenger).payload"}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "A live-shaped input contract built from the run's OWN directory and its executed
               leads — not the learning-run geography the stage needs today. Its per-lead fanout
               still has no stated failure policy of its own; the fail-closed demand covers it
               at the stage level."

  interacts:

    # the close tool's own surface
    - {from: main_agent, to: tool_close_investigation, mode: invoke, via: api,
       provenance: design, sends: payload}

    # R1 — report.md leaves the model's write allow; the close path becomes the writer
    - {from: tool_write_file, to: report_md, mode: remove, via: write_file, provenance: design}
    - {from: tool_edit_file, to: report_md, mode: remove, via: edit_file, provenance: design}
    - {from: tool_close_investigation, to: report_md, mode: write, via: close_investigation,
       provenance: design, sends: payload, interpolates: [run_id]}
    - {from: run_investigation, to: report_md, mode: read, via: fs, provenance: code}

    # the working document stays model-writable
    - {from: tool_write_file, to: investigation_md, mode: write, via: write_file, provenance: code}
    - {from: tool_edit_file, to: investigation_md, mode: write, via: edit_file, provenance: code}

    # what comes back into the live session, and the two surfaces that bypass it
    - {from: tool_close_investigation, to: main_session, mode: write, via: api,
       provenance: design, sends: payload}
    - {from: main_agent, to: review_record, mode: read, via: read_file, provenance: code}
    - {from: main_agent, to: review_trace, mode: read, via: read_file, provenance: code}

    # the per-run counters
    - {from: tool_close_investigation, to: review_state, mode: write, via: api,
       provenance: design, interpolates: [run_id]}
    - {from: challenge_gate, to: review_state, mode: write, via: api,
       provenance: design, interpolates: [run_id]}

    # the three review stage calls
    - {from: challenge_gate, to: challenger, mode: invoke, via: api, provenance: design,
       sends: payload, transport: llm}
    - {from: challenge_gate, to: coherence_checker, mode: invoke, via: api, provenance: design,
       sends: payload, transport: llm}
    - {from: challenge_gate, to: oracle, mode: invoke, via: api, provenance: design,
       sends: payload, transport: llm}

    # the review's own sinks
    - {from: challenge_gate, to: review_record, mode: write, via: fs, provenance: design,
       sends: payload, interpolates: [run_id]}
    - {from: challenger, to: review_trace, mode: write, via: fs, provenance: design,
       interpolates: [run_id, trace_name]}
    - {from: coherence_checker, to: review_trace, mode: write, via: fs, provenance: design,
       interpolates: [run_id, trace_name]}
    - {from: oracle, to: review_trace, mode: write, via: fs, provenance: design,
       interpolates: [run_id, trace_name, lead_id]}

    # what the gate reads
    - {from: challenge_gate, to: directions_for, mode: read, via: api, provenance: design}
    - {from: challenge_gate, to: disposition, mode: read, via: api, provenance: design}
    - {from: challenge_gate, to: direction, mode: read, via: api, provenance: design}
    - {from: challenge_gate, to: mitre_menu, mode: read, via: fs, provenance: design}
    - {from: challenge_gate, to: past_tickets, mode: read, via: fs, provenance: design}
    - {from: challenge_gate, to: extra_turn_bound, mode: read, via: env, provenance: design}
    - {from: challenge_gate, to: grace_bound, mode: read, via: env, provenance: design}
    - {from: challenge_gate, to: stage_timeout, mode: read, via: env, provenance: design}
    - {from: challenge_gate, to: budget, mode: read, via: env, provenance: design}
    - {from: challenge_gate, to: run_salt, mode: read, via: api, provenance: design}

    # the ceilings the driver owns
    - {from: run_investigation, to: request_limit, mode: read, via: api, provenance: design}
    - {from: run_investigation, to: retry_budget, mode: read, via: api, provenance: design}
    - {from: run_investigation, to: run_salt, mode: read, via: api, provenance: code}
    - {from: run_investigation, to: role_registry, mode: read, via: api, provenance: design}
    - {from: run_investigation, to: model_preflight, mode: read, via: api, provenance: design}
    - {from: run_investigation, to: replay_trace, mode: read, via: fs, provenance: code}

    # the model-facing surfaces that go stale under R1
    - {from: main_agent, to: skill_md, mode: read, via: api, provenance: code}
    - {from: main_agent, to: budget_refusal_message, mode: read, via: api, provenance: code}
    - {from: main_agent, to: write_file_docstring, mode: read, via: api, provenance: code}

  drives:
    - {from: run_investigation, to: main_agent, provenance: code, multiplicity: serial}
    - {from: main_agent, to: tool_close_investigation, provenance: design, multiplicity: serial}
    - {from: tool_close_investigation, to: challenge_gate, provenance: design, multiplicity: serial}
    - {from: challenge_gate, to: challenger, provenance: design, multiplicity: serial}
    - {from: challenge_gate, to: coherence_checker, provenance: design, multiplicity: concurrent}
    - {from: challenge_gate, to: oracle, provenance: design, multiplicity: concurrent}

