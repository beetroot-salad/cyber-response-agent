     claim: "A real grammar-driven parser for the working document exists and returns a typed,
             semantically projected nested structure — not raw strings and not a
             block-by-block tree.",
     probe: "read the parser in full, plus its schema and block types.",
     observed: "The projector re-groups rows by meaning regardless of where in the file they
                appeared."}
  - {id: PX3, kind: referential, probe_kind: read, verdict: holds,
     claim: "The observation layer is the observed-graph rows plus the learned-fact updates;
             every other recognized block type carries a hypothesis weight, a resolved verdict
             or the final conclusion.",
     probe: "enumerated every branch of the projector against the schema types; read the
             language skill's own vocabulary section.",
     observed: "The design's own text draws the same line, and ties the authorization verdicts
                directly to disposition gating."}

  # ---- the re-grounding probe (51-probe-reground.md), settling RG-1 to RG-4

  - {id: PR1, kind: referential, probe_kind: read, verdict: holds,
     claim: "The role registry is static definition data built once at import; the real
             per-role agent construction is a separate function the registry build never
             calls.",
     probe: "read the registry module in full and the agent-core builder.",
     observed: "The registry builder only checks for duplicate roles and returns the dict."}
  - {id: PR2, kind: referential, probe_kind: read, verdict: holds,
     claim: "Every non-main role's agent is built fresh inside the stage runner, once per
             stage invocation — nothing caches or reuses a built agent across calls, and the
             registry lookup happens fresh each time too.",
     probe: "read the stage-agent builder and the stage runner.",
     observed: "The build call sits inside the function invoked once per stage call.",
     note: "Settles RG-1: lazy, at first and every use, never eager at driver construction."}
  - {id: PR3, kind: referential, probe_kind: read, verdict: holds,
     claim: "The one live-runtime role beyond the main agent is also built lazily — through a
             closure defined at driver-build time but invoked only when its tool executes.",
     probe: "read the driver's gather-build closure and its registration.",
     observed: "The registration hands the callable itself, not its result.",
     note: "Settles RG-1 for the live path: an unregistered or unconfigured review role's
            loud failure lands at first gate fire, not at driver construction."}
  - {id: PR4, kind: referential, probe_kind: read, verdict: holds,
     claim: "A fault during either agent construction or the drive call still closes the
             stage's trace logger — the path leaves the open-set and the handle closes — and
             no incompleteness marker is written into the file's content.",
     probe: "read the stage runner's try/finally shape and the logger's close method.",
     observed: "The logger opens before the try, the finally always closes it, and close
                swallows any close-time error. The only readable signal of an incomplete run
                is that the file has fewer lines than a completed stage would.",
     note: "Settles RG-2: closed, not left open — but a truncated trace and a complete one
            are indistinguishable by any recorded flag."}
  - {id: PR5, kind: census, probe_kind: search, verdict: holds,
     claim: "Every bind call site across the tree threads a salt argument; the bind body
             never mints one itself.",
     probe: "grep every non-test bind call site, then read each one's arguments.",
     observed: "Eight call sites, every one passing a salt in.",
     note: "General as far as it goes — it does NOT establish whether the threaded value is
            shared or fresh, which is what PR7 and PR8 settle."}
  - {id: PR7, kind: behavior, probe_kind: read, verdict: refuted,
     claim: "Salt inheritance is a general property of every subagent bind path.",
     probe: "read the real offline orchestration path and the concrete stage calls, then
             cross-check each callee's salt fallback.",
     observed: "The orchestrator never passes a salt, so every stage defaults to None and
                mints its own — three independent salts inside one case's run cycle.",
     note: "REFUTES RG-3's general framing. The live main-to-gather pair is the sole
            confirmed shared-salt case. This NARROWS the delimiter-escape exposure and makes
            the precedent choice load-bearing, which `review_roles_mint_their_own_salt`
            pins."}
  - {id: PR8, kind: referential, probe_kind: read, verdict: holds,
     claim: "Two stage entrypoints have no salt parameter in their signature at all and mint
             unconditionally on every call, structurally unable to inherit any value.",
     probe: "grep both modules for the salt symbol; read each function's signature.",
     observed: "Neither carries the optional-salt fallback idiom the other six stages use.",
     note: "A stronger form of not-general: some bind sites cannot inherit even in
            principle."}
  - {id: PR9, kind: census, probe_kind: search, verdict: holds,
     claim: "The fail-fast key-sourcing preflight is called only from the offline learning
             cycle and from eval/ops tooling — never from either live investigation
             entrypoint.",
     probe: "grep every non-test call site of the preflight symbol.",
     observed: "Three call sites, none in the live entrypoint or the driver.",
     note: "Settles RG-4's first half."}
  - {id: PR10, kind: referential, probe_kind: read, verdict: holds,
     claim: "The live entrypoint's own preflight is a narrower mechanism: hardcoded to
             exactly the main and gather models, with no way to enumerate the roles a run
             will invoke, and it never raises the fatal config error.",
     probe: "read the live key-sourcing functions and their call site.",
     observed: "It runs before any model is built, but its parameter list is fixed to two
                models; a missing key is a printed error and an exit code."}
  - {id: PR11, kind: census, probe_kind: search, verdict: holds,
     claim: "Nothing anywhere iterates the full role registry to preflight every registered
             role's model config.",
     probe: "grep the non-test tree for every registry iteration form.",
     observed: "No output from any of them — no generic all-roles preflight exists, live or
                offline."}
  - {id: PR12, kind: behavior, probe_kind: read, verdict: refuted,
     claim: "A newly-registered live role's missing model config fails loudly at agent build.",
     probe: "read both providers' model builders.",
     observed: "The OpenAI-compatible provider raises immediately on a missing key
                environment variable; the Anthropic provider performs no key check at all and
                constructs the model object unconditionally, deferring failure to the first
                live API request.",
     note: "REFUTES RG-4's remaining half AND the plausible repair. `First use` is not one
            fixed failure point across providers, so a demand asserting a build-time raise
            would be silently false for one of them — which is why the minted demand asserts
            a startup failure instead."}

  # ---- the stage-hang probe (53-probe-stage-hang.md), commissioned by the author leaf to
  # close the one assertion in the suite that rested on an unclaimed fault class

  - {id: PS1, kind: referential, probe_kind: read, verdict: holds,
     claim: "The live path's own precedent for awaiting a subagent from a tool body carries no
             wall-clock bound: no wait_for, no timeout argument, and its three catches are a
             request-count cap and two structured-failure classes.",
     probe: "read the gather tool's full try/except around the awaited subagent run.",
     observed: "A count cap fires only once N requests have been attempted and counted, so it
                cannot fire while one call is still pending; the other two catches are abnormal
                model behaviour and a store write failure, not stall detection.",
     note: "This is what grounds the suite's `hangs` fault-spec: the fault this tree really
            produces is a coroutine that never completes, not an exception."}
  - {id: PS2, kind: census, probe_kind: search, verdict: holds,
     claim: "A different stage-call path in the same tree wraps every call in a real per-role,
             env-backed wall-clock deadline.",
     probe: "searched every non-test call site of the offline stage runner; read its drive
             helper in full.",
     observed: "Six non-test call sites, each supplying a per-role timeout from an env-backed
                function; the bound is task-level cancellation, not an HTTP-client deadline.",
     note: "The SAFE precedent, and it is not the review stages' by inheritance — it sits on a
            batch-driven per-case path structurally distant from a tool body at gate time."}
  - {id: PS3, kind: behavior, probe_kind: executed, verdict: holds,
     claim: "The expiry exception the wall-clock bound raises is the same class its handler
             catches, on this repo's own interpreter.",
     probe: "ran the identity check against the repo's Python.",
     observed: "True on 3.11 — the asyncio alias and the builtin are one class.",
     note: "Rules out a coincidental type match; the existing mechanism is coherent."}
  - {id: PS4, kind: census, probe_kind: search, verdict: refuted,
     claim: "A timed-out stage call is observably distinct from one that raised.",
     probe: "read both except branches of the stage runner; searched every non-test catch site
             of the exception they share.",
     observed: "Both branches raise the identical type, differing only in a message substring
                and a chained cause; nine catch sites, none inspecting the cause or parsing the
                message to branch on timeout-versus-raised.",
     note: "REFUTES an observable type-level distinction. A design that needs the two cases to
            read differently gets no help from the existing mechanism and must build it —
            which is what `timeout_and_failure_are_distinguishable` demands."}
  - {id: PS5, kind: referential, probe_kind: read, verdict: holds,
     claim: "No client- or SDK-level timeout is configured on either provider path.",
     probe: "read both providers' model builders in full.",
     observed: "Both construct the model object with defaults only — no client, no timeout, no
                custom transport.",
     note: "So the only bound this tree controls is the driver-level one. Whatever eventually
            interrupts a genuinely stuck request is an unexamined library default."}

  - {id: PL1, kind: referential, probe_kind: read, verdict: holds,
     claim: "The gather subagent's return is the model's output string handed untouched to one
             untrusted-wrap call — no schema, no truncation, no bounding step anywhere on the
             path.",
     probe: "read the gather tool body and the wrap primitive in full.",
     observed: "Unlike the read tool, which bounds before wrapping, the gather summary has no
                size cap at this step."}

gate:
  evaluated:
    - {rule: R0, fired: true, note: "First pass: 2 formal findings from `spec-graph gate` (review_record.identity's missing evidence; the ninth-arm's unrecorded crosses_validation) plus 4 unknown-via-constraints cells the mechanical check read as answered because a form:test demand's binds happened to name the cell. AUTHOR PASS: all six are closed by RS10-RS16 and moved into pre_discharged — the record's sink now has evidence to point at (RS11), the ninth arm is a distinguished member rather than a documented alternative (RS13), the report's close via and the tool's budget tier both carry real constraint vocabularies (RS12/RS16), and the working document's two write cells state the review-state condition instead of `unknown` (RS15). Bidirectional prose reconciliation re-ran by hand over the seven new resolutions: each binds at least one element, and no element added this pass traces to no resolution sentence."}
    - {rule: R1, fired: true, note: "7 firings. Both former holes are closed: RS10 states the coherence checker's input contract (the counter-story and nothing else) and the projection stage's live-shaped one, and each now carries a payload facet and a kind:shape demand. The projection's closure costs the design a claim — `reused unchanged` is withdrawn."}
    - {rule: R2, fired: true, note: "4 firings, all pre-discharged. review_record.identity's key is no longer provisional: RS11 supplies the evidence the schema demanded, and review_record_lives_beside_the_run drives the (run_id, turn) key rather than asserting its shape."}
    - {rule: R3, fired: true, note: "12 firings, all pre-discharged outright. The two cells that carried an R0 hole on unknown constraints now name them: the close via re-enters the retired path's validation over a host-rendered body (RS12), and the budget tier carries an explicit recorded exemption rather than whichever tier a new tool falls into (RS16)."}
    - {rule: R4, fired: true, note: "28 firings (the ninth arm joined `distinguished`, the review deadline's shipped value is a distinguished member because the human set it, and RS17 split a tenth arm out of a value that was carrying two meanings), all pre-discharged. The three former holes close together: RS13 gives the degenerate case its own arm and its own driving test, and RS14 sets both bounds — which is what lets bounds_reject_zero become form:test and actually exercise the two zero cells instead of recording prose about them."}
    - {rule: R5, fired: true, note: "2 mechanical firings (report_md's write_file/edit_file edge removal), both pre-discharged by survival demands. Judgment extension considered: yes — the tightening is the write-allow narrowing itself; the security-critical caller left constructible in a newly-unsafe state is a review role with no usable model config, and misconfigured_review_role_fails_before_the_investigation_pays is the safe-by-construction demand minted for it.", cites: [PR9, PR10, PR11, PR12]}
    - {rule: R6, fired: true, note: "Rendered-sink walk over every payload/reason/frame slot. The one gap the first pass found — report_md's `reason` slot composed from challenger- or projection-derived text with an undetermined sanitizer — is CLOSED BY CONSTRUCTION rather than by a sanitizer: RS12 makes `reason` a typed value drawn from the close outcome vocabulary, so no attacker-influenced chooser reaches that slot at all. report_reason_key drives a poisoned counter-story and observes the frontmatter, so the closure is exercised, not asserted."}

