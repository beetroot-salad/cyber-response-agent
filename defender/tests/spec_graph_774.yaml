    # [REPAIR-CORRECTION — the vocabulary collapse] This boundary carried TEN members, and the
    # census that prompted the collapse found no shipped consumer reading any of them: eight
    # production modules read report.md and all eight route on `disposition` alone. Grouped by
    # what actually happened to the disposition, the ten were three things wearing ten names,
    # and the extra seven names were held up entirely by this suite's own assertions.
    #
    # The ten were also spanning TWO SINKS with one vocabulary, which is the structural half of
    # the mistake and is now modelled as two boundaries: this one is what a close ATTEMPT did
    # (the tool return and the review record's verdict), `committed_outcome` is what a COMMIT
    # recorded (report.md). `challenged` belongs to the first and cannot appear in the second.
    - id: close_outcome
      provenance: design
      note: "What a close ATTEMPT did — the tool's return value and the review record's
             verdict. Three members, because three things can happen to the disposition the
             investigator drafted: the investigation continues, the drafted value stands, or a
             confident value is overridden to inconclusive. WHY it came out that way is the
             `close_cause` free text, not a member here — the distinctions the retired members
             carried that a machine still needs are carried by fields that already exist and are
             already typed: the disposition itself, the review's `failure_kind`, the turn count,
             the rounds consumed, and the numbered record series."
      facets:
        domain:
          type: enum
          refinement: {nl: "one closed-vocabulary outcome per close attempt; only the
                       challenged value's return carries discriminating material, and only it
                       commits nothing"}
          default: stands
          distinguished: ["challenged", "stands", "forced-inconclusive"]
          falsy_valid: false
          documented_alternatives: []

    # [REPAIR-ADDITION] The second of the two vocabularies the ten-member enum conflated.
    - id: committed_outcome
      provenance: design
      note: "What a COMMIT recorded — the typed field report.md carries, and a STRICT SUBSET of
             the return vocabulary. The challenged path returns before the write, so its value
             is structurally incapable of appearing here; one enum spanning both sinks meant
             every reader of either had to know which members its own sink could not hold, and
             that is the conflation the ten spellings grew out of."
      facets:
        domain:
          type: enum
          refinement: {nl: "the close-outcome vocabulary minus the one value that commits
                       nothing"}
          default: stands
          distinguished: ["stands", "forced-inconclusive"]
          falsy_valid: false
          documented_alternatives: []

    # [REPAIR-ADDITION] Facetless on purpose, for the same reason `validator` is: the contract
    # is not a vocabulary — it is that this field is HOST-AUTHORED and coarser than the arms it
    # replaced, and both of those properties belong to `report_md.payload` and to the close's
    # own return.
    # [REPAIR-CORRECTION — human decision 1] The members ARE a closed set now, and the boundary
    # still carries no `domain`. That is a deliberate reading of the slot discipline, not an
    # oversight: a `domain` here would put seven SENTENCES into a formal slot and hand R4 an
    # obligation to exercise each one individually — one test per sentence, which is the
    # ten-member vocabulary rebuilt out of the gate's own rules. The members are semantic; the
    # formal properties (host-authorship, coarseness, and which pairs must still differ) are
    # carried by demands, and the demands are what a rule reads.
    - id: close_cause
      provenance: design
      note: "Why the close came out the way it did, in a sentence, for a human reading the case
             by hand. It is what the seven retired vocabulary members were really carrying.
             It is one of the CLOSE'S OWN published sentences and never text a review stage
             returned: the close's detailed reason is payload-derived on three conditions (the
             challenger's own decline prose, a projection naming identifiers the run never
             executed, an unreadable projection row quoted back), and report.md rides verbatim
             into the judge's prompt and out through the ticket bridge's HTTP egress. Nothing
             branches on this value and no test asserts its wording. What IS pinned: every cause
             a close writes is a member of the published set, the set is strictly coarser than
             the conditions that reach it, the specific pairs a reader must tell apart write
             different members (a review that broke against evidence that could not
             discriminate, a run stopped by the turn bound against one that had nothing left to
             ask, a decline against a failure), and — the rule that actually bounds the size —
             ONE DISTINCTION, ONE FIELD: where the typed failure kind already separates two
             conditions the sentence must not separate them again, or the report carries the
             same split twice and the prose becomes an unversioned second copy of a key.
             Those constraints resolve to SEVEN members, and the grouping is recorded here so
             the implementer inherits the decision rather than re-deriving it: the gate was not
             run; it ran and the evidence settled the alternative account; it ran and no
             alternative account was offered; it did not complete (four conditions — an
             unparseable challenger reply, a stage fault or timeout, an unreadable or
             out-of-list projection, and a story that never became coherent — separated from
             each other by the failure kind, not here); the evidence cannot discriminate (two
             conditions); the forced-turn budget was spent; nothing was left to ask. Only the
             constraints are enforced; an implementer who can justify a different grouping
             inside them is not refused by any test."
      facets: {}

    # [REPAIR-ADDITION — human decision 2] The countable half of "why", split out of the cause
    # because a sentence is not a key. Modelled with a domain where `close_cause` is not,
    # exactly because these members ARE values something groups by: they are slugs, they are
    # few, and each owes the individual exercise R4 demands of a distinguished member.
    - id: failure_kind
      provenance: design
      note: "HOW the review failed to deliver, when it did — on the close's return, on the
             numbered review record, and in report.md's frontmatter, which is the file every
             shipped consumer already opens and therefore the only one a fleet count can be
             written against. Absent whenever the review did not fail: an override the EVIDENCE
             produced is a finding about the case, and folding it in here would make the field
             set on every close and the count meaningless. The four members are separated by
             the response each calls for, not by the condition each came from — which is why an
             unreadable reply and a hallucinated lead identifier are one member and not two."
      facets:
        domain:
          type: enum
          refinement: {nl: "absent when the review completed; otherwise exactly one member,
                       naming what kind of failure it was rather than which stage it happened
                       in — the stage is named in the record's own detail"}
          default: null
          distinguished: ["timeout", "error", "unreadable", "incoherent"]
          falsy_valid: true
          documented_alternatives: []

    - id: review_record
      provenance: design
      note: "RS11 names the sink: a per-run file beside the investigation's own artifacts,
             written temp-plus-rename. Before that this facet claimed a key with no evidence —
             the schema's `unknown` — because the offline sink left with the offline PR and the
             obligation quantifying over the review's outputs had nowhere to point."
      facets:
        payload:
          parts:
            - {role: system, source: const:REVIEW_RECORD_SCHEMA}
            - {role: user, source: template:REVIEW_RECORD,
               slots: {verdict: close_outcome.domain,
                       direction: direction.domain,
                       attacked_disposition: disposition.domain,
                       failure_kind: failure_kind.domain,
                       detail: "interacts(challenge_gate->challenger).response",
                       requirement_list: "interacts(challenge_gate->challenger).response",
                       projection_response: "interacts(challenge_gate->projection).response"}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "Pinned for observability, not for the discriminator rule: enough to
               reconstruct why a verdict came out as it did, without pinning which of those
               the gate keys on. One distinction is required — an all-settled requirement
               list must read as different from a genuinely non-discriminating case.
               [REPAIR-CORRECTION — human decision 1] `detail` is the slot the report refuses.
               The close's diagnostic is payload-derived on three conditions and report.md
               rides into two egresses, so it is kept HERE, framed like the record's other
               stage-derived fields, on the one artifact no prompt reads verbatim. Dropping it
               to make the report safe was the alternative, and it would have left which stage
               failed and what it said nowhere on disk at all."
        identity:
          key_axes: [run_id, turn]
          evidence: {nl: "Read off RS11's named sink: one record per gate attempt inside the
                     closing run's own directory, keyed by the run and the turn so a second
                     forced turn cannot land on the first's path — and written temp-plus-rename
                     because the nearest existing precedent for this class of write opens in
                     place, has no exception path that removes a partial file, and leaves a
                     crashed write indistinguishable from a review that never ran.
                     [REPAIR-CORRECTION] The turn axis only separates records ACROSS FORCED
                     TURNS, which is the case RS11 was written for and the only case any
                     committed test drives. It does not separate records across COMMITS:
                     every committing arm computes its path from the turn counter, and only
                     the non-committing arm advances that counter, so two commits on one run
                     always land on the identical path and the atomic rename replaces rather
                     than refuses. Driven four ways; exactly one record survived every one of
                     them, holding only the last verdict. So the key is under-covering on an
                     axis the graph does not name — `commit` — and a reader of the records
                     alone cannot tell a double close happened at all. Fork-B decides whether
                     the fix is refusing the second commit or giving it its own path; the
                     second changes this key."}
          sharing: unique-key

    - id: review_trace
      provenance: code
      note: "Each review stage writes its own trace under the run's trace sink. Within one
             process a reused trace name appends rather than truncating — the design's
             stated overwrite hazard is refuted — but the per-agent sequence counter resets
             on every construction, so a second round's record ids collide with the first's
             and no field in the schema marks the round boundary.
             [REPAIR-CORRECTION] THIS SURFACE IS FRAMED ON ONE CELL OF THREE (PV2, driven).
             The challenger's own reply is recorded inside the untrusted frame; the coherence
             checker's and the projection's are recorded as ordinary fields, on the design
             comment's stated premise that neither is payload-derived PROSE. Forced to carry
             prose, both land byte-for-byte raw on disk. The negative that binds this surface
             passes VACUOUSLY on those two files, because its scenario only ever poisons the
             third. The exposure is to whoever READS the traces later — all three roles hold
             zero read and zero bash grant against the compiled policy, so nothing escalates.
             Fork-J decides between narrowing the demand and writing the two missing cells."
      facets:
        identity:
          key_axes: [run_id, stage, round]
          evidence: {nl: "Read off the stage harness, which joins the run directory with the
                     wiring's trace name unchanged; the only stage that varies its name
                     within a run keys on story stem and lead id, and the one stage that
                     threads a per-invocation index proves the harness supports a round axis
                     when a wiring passes one."}
          derivations:
            - {value: trace_name, fn_of: stage, injective: true}
          sharing: serialized-append
        access:
          constraints_by_via:
            logger_construct:
              trust: operator
              constraints: [always-closed-on-fault, no-incompleteness-marker]

    - id: review_state
      provenance: design
      note: "The per-run turn and grace counters. The deps object is frozen and carries
