        access:
          constraints_by_via:
            write_file:
              trust: attacker-influenced
              constraints: [allow-list-denial, artifact-schema, duplicate-key-detection,
                            legacy-delimiter-ban]
            edit_file:
              trust: attacker-influenced
              constraints: [allow-list-denial, artifact-schema, duplicate-key-detection,
                            legacy-delimiter-ban]
            close_investigation:
              trust: derived
              # [REPAIR-ADDITION] `injected-validator-seam` is the cell's newest constraint and
              # the only one that is about OBSERVABILITY rather than about content: the other
              # three are properties of the validation, this one is what lets a test see the
              # validation happen on a close that supplies no offending content of its own.
              constraints: [host-rendered-from-typed-arguments, artifact-schema,
                            duplicate-key-detection, legacy-delimiter-ban,
                            injected-validator-seam, host-authored-cause]
              # RS12 closes what was this artifact's R0/R3/R6 hole in one move: the body is
              # composed host-side from typed arguments and routed through exactly the
              # validation the retired model-write path enforced.
              # [REPAIR-CORRECTION] RS12's OWN sentence — "the reason slot becomes a typed
              # value rather than free text" — is what the vocabulary collapse takes back, and
              # `host-authored-cause` is the constraint that pays for it. Typedness was doing
              # two jobs: naming the condition, and keeping review-stage prose out of a file
              # that leaves the system. The collapse gives up the first (nothing read it) and
              # must keep the second by construction instead, because the close's detailed
              # reason IS payload-derived on three conditions.

    # [REPAIR-ADDITION] The one structure element this delta adds, and it is added because a
    # demand could not otherwise be discharged rather than because anything was discovered.
    # The validation itself is not new — it is the same check the retired model-write path
    # enforced. What is new is that the close RECEIVES it, so the call is observable on the
    # ordinary evidence-free close instead of only inferable from a refusal.
    - id: validator
      provenance: design
      note: "The artifact validator the close routes its rendered body through, as a value the
             close is HANDED rather than a module-level call it makes. Facetless on purpose:
