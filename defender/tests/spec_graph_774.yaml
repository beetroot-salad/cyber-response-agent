    # ======================= THE REPAIR DELTA'S SEVENTEEN FORKS =======================
    # [REPAIR-CLOSEOUT] ALL SEVENTEEN ARE DECIDED. This preamble said "nothing below is
    # decided in this file", counted eighteen provisional demands and five expected-red ones,
    # and told the reader to settle fork-A first. Every clause of that is now false: the human
    # seam ran after the assembly, its twelve resolutions closed all seventeen, no demand is
    # provisional, no demand is expected-red, and the implementation landed. THE ENTRIES
    # THEMSELVES ARE KEPT VERBATIM AND UNDECIDED-SOUNDING ON PURPOSE — each is the case as it
    # stood when the human read it, and the decision it drew is recorded beside the demand it
    # gates (`[REPAIR-RESOLVED fork-X]`) and in full in
    # .spec-flow/frontiers-repair/70-resolutions-repair.md. Read them as the record of what
    # was asked, never as a live queue. Ordered by implementation impact, highest first. The
    # ten entries after this block are the FIRST pass's forks, unchanged; where the repair
    # delta restates one, the letter says so.
    #
    # ONE LIMB SURVIVED ITS FORK AND WAS ANSWERED BY THE IMPLEMENTATION INSTEAD, AND IS NOW
    # RATIFIED. See fork-C: R2 decided that the operator's model override must reach the review
    # stages, and said nothing about the preflight's SUBJECT. The repair moved that too — the
    # startup check now validates the model the run will actually use rather than the
    # configured default — which was a behaviour change no resolution asked for. The human has
    # since read it and let it stand, so the limb is closed by decision and the behaviour is
    # unchanged. Nothing in this block is owed.

    - "fork-A (was FORK-0) — MAY A REPAIR CHANGE WHAT A TEST LOOKS AT? Several committed
       tests assert things about an artifact that the artifact does not carry: each was
       written from its demand's own words and the words name something with no address in
       the shipped code. (A) scenario and strength only, never re-choose the observable —
       the demand list stays what was agreed, and three demands become implementation
       requests for report fields and configuration knobs nobody asked for at design time.
       (B) substitution allowed — the delta ships green, and a suite permitted to re-choose
       its own observables can explain away any failure, which is the defect the adversarial
       pass just caught, one level up. (C) substitution with a paired expected-red — the
       ledger loses nothing and the delta ships red anyway. PHASE A PINNED (C) PROVISIONALLY,
       and `repair_contract` is that pin. Three places it bites: the three close shapes whose
       turn count report.md has no field for; the misconfigured review role, whose subject has
       no address distinct from the main investigator; and the cold-start affordance
       (fork-G). Whatever wins, every bound address must be genuinely exercised by the
       repaired test or the substitution is unsound — that is this fork's own enforcement
       clause and should be settled with it."

    - "fork-B — THE CLOSE IS NOT TERMINAL (promoted from a 3/3 consensus, because closing it
       is runtime work). A second close — the model's through the real tool loop, or the
       host's own retry-exhaustion handler — re-runs the whole gate and rewrites report.md.
       Driven: a committed `malicious` came back `benign`; the host's handler replaced a
       committed `malicious` with `inconclusive`; and in every case the first close's review
       record was destroyed, because every committing arm computes its path from a counter
       only the non-committing arm advances. The model is told its first close succeeded, then
       allowed to succeed again with the opposite disposition. This is the design's own
       failure clause in a sharper form. (a) refuse the second close — terminality becomes
       structural and the report's single-writer identity becomes true, but the host's
       last-resort handler needs a defined behaviour, and today it is the only thing between a
       stuck model and no disposition at all. (b) silent no-op — idempotent, and the
       diagnostic is lost. (c) allow it with a per-commit record path — a full audit trail,
       and `report_md.identity` stops being keyed on the run alone. (d) accept it. SEPARATE
       THE RETRY LIMB: a close whose report write was REJECTED never committed, so a second
       attempt is legitimate — but it clobbers the first attempt's record by the same path
       arithmetic. And the lock limb: the already-closed flag has exactly one reader, guarding
       the working document's two model-facing write tools; whether host-side write paths must
       consult it too rests on a single un-hedged answer."

    - "fork-C — THE REVIEW STAGES RESOLVE A MODEL THE OPERATOR NEVER CHOSE. The per-run model
       override reaches the investigator and nothing else: all three review stages resolve
       through a zero-parameter function, structurally incapable of receiving it, which
       re-implements the default with its own hardcoded name rather than reading the tree's,
       citing an import cycle. Driven both ways — an override naming a model no provider
       serves passed the startup preflight clean while the investigator was about to run on
       it, and changing the override never moved any review stage. (a) thread the override
       through, at the cost of the import cycle. (b) declare the split deliberate and pin it —
       a stable review baseline while models are swapped underneath is arguably what you want
       from a reviewer, but it mints a demand, documents an operator surprise, and leaves the
       second home for the default to drift. (c) leave it unspecified — the drift is already
       here and the preflight gives false assurance on every run. THE LIMB: is the preflight's
       subject the CONFIGURED model or the model this run will use? Reading (a) makes it moot."

    - "fork-D (was FORK-1) — THE DISCRIMINATOR JOIN HAS NO KEY TO JOIN ON. The gate hands the
       investigator leads paired with the requirement each would settle, and no field says
       which goes with which: an unsettled requirement is by definition one no lead settled,
       so the natural key is absent by construction. The shipped code sorts the leads and
       takes them in order; the committed test passes only because it matches that arbitrary
       order. (a) extend the challenger's output so each unsettled requirement names a
       CANDIDATE lead — a real key, at the cost of the output contract, the prompt, and every
       stage that parses it. (b) move the join to the projection side — the same key from the
       side that looked at the evidence, at the cost of a wider contract in the stage under
       the tightest deadline. (c) hand back identifiers only — honest today, and the
       investigator permanently loses the REASON each lead matters. (d) the cross-product —
       correct, and noisy as the product of two lists. THE RE-LITIGATION LIMB: the gate
       refuses to spend a turn on a gap already raised, keyed on that same missing field, so
       the same gap named differently on a second pass is not recognised and the turn is
       spent. (a) and (b) fix it for free; (c) and (d) do not."

    - "fork-E (was FORK-2) — ONE OFF-TOPIC LEAD SILENCES THE WHOLE REVIEW. Each executed lead
       comes back confirming, silent, or not projecting. A silent lead is a discriminator;
       looking harder at it could settle the question. The committed test requires one
       off-topic lead plus one silent lead to take the degenerate arm; the shipped code
       softened the veto to fire only when nothing anywhere confirms the story, which still
       discards three real discriminators when a fourth lead is irrelevant. (a) keep the
       shipped rule and write it into the design. (b) off-topic leads are simply not
       discriminators. (c) proportional veto, at the cost of a threshold nobody has grounds to
       pick. (d) split the arm, at the cost of a tenth outcome every downstream consumer must
       learn. THE SINGLE-ROW LIMB, which none of the four covers: a reply that tags ONE lead
       both confirming and silent. Settling this fork will not settle that; it is probably a
       malformed-row question and belongs with fork-O, but nothing states it. SURVIVES EVERY
