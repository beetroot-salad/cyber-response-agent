    rejected: [{nl: "Letting the host write bypass the artifact schema was rejected: the report gained its schema, duplicate-key and legacy-delimiter breakout checks BECAUSE the model's write reached it through the write tool's validation path, and a host write triggered by a typed argument does not pass that gate by construction."},
               {nl: "Asserting an exact validation count per commit was rejected: nothing decides whether one commit validates a body once or validates a draft and then a final, so the assertion is containment — the committed bytes are among the bytes the validator was handed — and a later draft-then-final implementation is not pre-refused by this test."}]
    repair:
      type: strengthened
      observable: {nl: "The artifact validator is observed being INVOKED, with report.md's
        rendered body, on a close that passes NO evidence argument — the ordinary path — and
        the argument it was handed is compared against the body actually committed to disk,
        never merely counted. The committed test infers validation from a refusal on the
        hostile-content leg, which an evidence-gated validator satisfies while leaving every
        real close unvalidated."}
      scenario: {nl: "Three legs, each refusing a different implementation. The evidence leg
        drives the DEFAULT validator and requires the refusal to carry that validator's own
        reason, so the seam cannot become the only validated path. The evidence-free leg
        hands the close a recording validator and requires the committed bytes to be among
        the bytes it saw. The third refuses from inside the seam on that same evidence-free
        path and requires the close not to commit — a validation whose verdict is computed
        and then discarded re-enters no gate at all."}

