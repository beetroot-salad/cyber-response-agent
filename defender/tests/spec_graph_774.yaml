    #     new key and the output contract does not widen.
    binds: ["interacts(tool_close_investigation->main_session).payload", "review_state"]
    discharged_by: test_a_second_forced_turn_does_not_re_raise_a_gap_already_raised
    # [REPAIR-CORRECTION] Now waits on fork-D, which it did not before. The no-re-raise
    # property is keyed on the identifier a review stage supplies, and fork-D is precisely
