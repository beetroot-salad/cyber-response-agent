gate:
  evaluated:
    - {rule: R0, fired: true, note: "First pass: 2 formal findings from `spec-graph gate` (review_record.identity's missing evidence; the ninth-arm's unrecorded crosses_validation) plus 4 unknown-via-constraints cells the mechanical check read as answered because a form:test demand's binds happened to name the cell. AUTHOR PASS: all six are closed by RS10-RS16 and moved into pre_discharged — the record's sink now has evidence to point at (RS11), the ninth arm is a distinguished member rather than a documented alternative (RS13), the report's close via and the tool's budget tier both carry real constraint vocabularies (RS12/RS16), and the working document's two write cells state the review-state condition instead of `unknown` (RS15). Bidirectional prose reconciliation re-ran by hand over the seven new resolutions: each binds at least one element, and no element added this pass traces to no resolution sentence."}
    - {rule: R1, fired: true, note: "7 firings. Both former holes are closed: RS10 states the coherence checker's input contract (the counter-story and nothing else) and the projection stage's live-shaped one, and each now carries a payload facet and a kind:shape demand. The projection's closure costs the design a claim — `reused unchanged` is withdrawn."}
    - {rule: R2, fired: true, note: "4 firings, all pre-discharged. review_record.identity's key is no longer provisional: RS11 supplies the evidence the schema demanded, and review_record_lives_beside_the_run drives the (run_id, turn) key rather than asserting its shape."}
    - {rule: R3, fired: true, note: "12 firings, all pre-discharged outright. The two cells that carried an R0 hole on unknown constraints now name them: the close via re-enters the retired path's validation over a host-rendered body (RS12), and the budget tier carries an explicit recorded exemption rather than whichever tier a new tool falls into (RS16)."}
    - {rule: R4, fired: true, note: "26 firings, all pre-discharged or bound by an executable demand. It was 28 at the author pass (the ninth arm joined `distinguished`, the review deadline's shipped value is a distinguished member because the human set it, and RS17 split a tenth arm out of a value carrying two meanings); the vocabulary collapse took seven off the close outcome and the human's second decision put four back on the new failure-kind domain, each answered by `failure_kind_is_typed_and_countable`'s own binds rather than by a credit. The three former holes close together: RS13 gives the degenerate case its own arm and its own driving test, and RS14 sets both bounds — which is what lets bounds_reject_zero become form:test and actually exercise the two zero cells instead of recording prose about them. The one domain deliberately NOT modelled is `close_cause`: its members are sentences, and a `domain` there would hand this rule an obligation to exercise each one individually — one test per sentence, which is the collapsed vocabulary rebuilt out of the gate's own rules."}
    - {rule: R5, fired: true, note: "2 mechanical firings (report_md's write_file/edit_file edge removal), both pre-discharged by survival demands. Judgment extension considered: yes — the tightening is the write-allow narrowing itself; the security-critical caller left constructible in a newly-unsafe state is a review role with no usable model config, and misconfigured_review_role_fails_before_the_investigation_pays is the safe-by-construction demand minted for it.", cites: [PR9, PR10, PR11, PR12]}
    - {rule: R6, fired: true, note: "Rendered-sink walk over every payload/reason/frame slot. The one gap the first pass found — report_md's `reason` slot composed from challenger- or projection-derived text with an undetermined sanitizer — is CLOSED BY CONSTRUCTION rather than by a sanitizer: RS12 makes `reason` a typed value drawn from the close outcome vocabulary, so no attacker-influenced chooser reaches that slot at all. The demand drives a poisoned counter-story and observes the frontmatter, so the closure is exercised, not asserted. REPAIR PASS: the closure was confirmed against the SHIPPED renderer (PV2) — the verdict's reason is never fed to it on any call path. VOCABULARY COLLAPSE: that construction argument is spent. The slot is now a typed outcome PLUS a cause, so the rule's answer changes from 'no chooser reaches the slot' to 'the host authors what reaches it', and `report_outcome_and_cause` drives three conditions poisoned in the exact limb whose detail is payload-derived rather than the one counter-story it used to drive. This is the one cell where collapsing the vocabulary made a rule's obligation harder rather than smaller. HUMAN DECISION 1 gives it back most of what it lost: the cause is chosen from the close's own published sentences rather than being free text, so the chooser is host-side again — but the closure stays DRIVEN rather than structural, because a published sentence with a stage's words concatenated after it still satisfies every structural reading, and because the renderer's evidence limb is a second free-text route into the same file. The demand's marker legs cover both, and its positive control moved to the review record: the marker must be READABLE there, framed, or absence from the report proves only that nothing ever flowed. But the walk missed a sink: the two review traces the gate writes itself. Forced to carry prose, the coherence checker's and the projection's replies land raw, and the negative binding that surface passes vacuously on both. Recorded as an R6 hole on `review_trace`, routed to fork-J — not re-closed here."}

  obligations: []  # zero test obligations remain unminted this pass — every mechanically-fillable gap was
                   # already absorbed by the assembler's 13 minted demands; what's left below is design
                   # decisions for §7, not test content an agent could write today.

  pre_discharged:
    - {rule: R1, element: "interacts(main_agent->tool_close_investigation).payload", by: tool_close_investigation_seam, cites: [K14], witness: "main_agent's close call sends a typed disposition into the new tool; tool_close_investigation_seam pins the registration and disposition_outside_vocabulary_rejected pins the all-slots-bound rejection of an out-of-vocabulary value."}
    - {rule: R1, element: "interacts(tool_close_investigation->report_md).payload", by: report_outcome_and_cause, cites: [K11], witness: "The close tool's write to report.md is report_md's payload facet; report_outcome_and_cause pins all three slots the single overloaded reason key split into — a typed outcome from the committed vocabulary, a cause drawn from the close's own published sentences, and a typed failure kind — inside the byte cap, and three_close_shapes_distinguishable pins its three shapes on the numbered record series. The same demand pins the committed bytes as EQUAL to the host's rendering of those values, which is what closes the renderer's evidence limb as a second route into the file."}
    - {rule: R1, element: "interacts(tool_close_investigation->main_session).payload", by: review_return_is_contained, cites: [K25, K26], witness: "What the close tool hands back to the investigator is pinned as a typed, salted-frame structure by three shape demands, not a prose channel."}
    - {rule: R1, element: "interacts(challenge_gate->challenger).payload", by: challenger_input_is_observation_layer, cites: [K29, PX3], witness: "The challenger's assembled input is pinned to the observation layer only — no hypothesis, resolution, authorization verdict, or conclusion text."}
    - {rule: R1, element: "interacts(challenge_gate->review_record).payload", by: attacked_disposition_preserved, cites: [C26], witness: "The review record's payload — verdict, direction, attacked disposition, the typed failure kind, the framed stage-derived detail, the challenger's requirement list, the oracle's projection — is pinned by three demands; the sink itself is RS11's, so the first pass's trailing clause about no sink being named is struck. `detail` is the newest slot and the one human decision 1 puts here rather than on the report."}
    # [REPAIR-CORRECTION] THE WITNESS BELOW WAS FALSE WHEN IT WAS WRITTEN, and it is the
    # artifact's own overclaim rather than a probe changing under it. It read: "report_md's
    # key is run_id alone because close_investigation is its sole, single-invocation writer
    # per run; close_is_terminal_for_the_disposition pins that no write after commit can move
    # it." Two things were wrong. The cited demand's test calls the close exactly once and
    # asserts only that post-close writes to the WORKING DOCUMENT are refused — it never
    # exercises invocation count, so it could not have pinned that sentence. And the sentence
    # itself is refuted by execution (PD1-PD6): a second close re-runs the gate and rewrites
    # the report. The witness is restated below as the requirement it always was.
    - {rule: R2, element: "report_md.identity", by: close_commits_at_most_once, cites: [K17, PD1, PD6], witness: "report_md's key is run_id alone, which requires that one run produce one commit — a REQUIREMENT the shipped code violates, not a fact read off it. close_commits_at_most_once is the demand that pins it and it is expected-red; close_is_terminal_for_the_disposition covers the adjacent and genuinely-held half, that no post-close document write moves an already-recorded disposition."}
    - {rule: R2, element: "review_record.identity", by: refuted_and_incoherent_stay_distinct, cites: [PB1, PB4, PD4], witness: "Four uniqueness/behavior demands pin distinctness and atomicity properties on the review record. [REPAIR-CORRECTION] The trailing clause of this witness — that the key is claimed with no evidence because no sink exists yet — was superseded by RS11 at the author pass and is struck. What replaces it is a real gap: the (run_id, turn) key separates records across forced TURNS but not across COMMITS, because only the non-committing arm advances the turn, so a re-close lands on and clobbers an earlier record (PD4). close_commits_at_most_once binds that; fork-B decides whether the fix is refusal or a per-commit path."}
    - {rule: R2, element: "review_trace.identity", by: grace_rounds_are_attributable, cites: [PC7, PC9], witness: "Trace identity (run_id, stage, round) is pinned by the one demand asserting each round's trace is attributable and recorded, on top of the probed append-not-overwrite and id-collision facts."}
    - {rule: R2, element: "review_state.identity", by: review_state_on_frozen_deps, cites: [K9], witness: "The per-run turn/grace counters share one key (run_id) inside the frozen deps object's single mutable container; review_state_on_frozen_deps pins that shape."}
    - {rule: R3, element: "report_md.access[write_file]", by: report_md_single_writer, cites: [K1, K17], witness: "write_file's denial on report.md is pinned directly, matched against edit_file by report_md_write_parity, and the two retired contracts it breaks are retired on the record."}
    - {rule: R3, element: "report_md.access[edit_file]", by: report_md_write_parity, cites: [K2], witness: "edit_file must refuse report.md the same way write_file does; report_md_write_parity is the cross-via parity demand."}
    - {rule: R3, element: "report_md.access[close_investigation]", by: report_md_single_writer, cites: [K17, K19], witness: "report_md_single_writer names close_investigation as the sole writer of this cell. [REPAIR-CORRECTION] This witness's second half was written at the first pass and is STALE — it said the via's constraints were unknown and undecided. RS12 answered it during the author pass and the entry recording that answer is the `close_write_reenters_artifact_validation` credit further down; the same is true of the R6 half, which RS12 closed by construction. Neither is an open hole and neither has been since."}
    - {rule: R3, element: "run_salt.access[main_gather_bind]", by: review_roles_mint_their_own_salt, cites: [K25, PR7], witness: "The live main-to-gather bind's shared-salt precedent is exactly what the new roles must NOT follow; review_roles_mint_their_own_salt pins the rejection."}
    - {rule: R3, element: "run_salt.access[stage_bind]", by: review_roles_mint_their_own_salt, cites: [PR7, PR8], witness: "The offline stage-bind's fresh-salt-per-stage precedent is what the new review roles DO follow; the same demand pins both cells in parity."}
    - {rule: R3, element: "tool_close_investigation.access[main]", by: close_tool_is_main_only, cites: [K14], witness: "Main's typed-disposition access is pinned reachable; close_tool_is_main_only pins this cell alongside gather's non-reachability."}
    - {rule: R3, element: "tool_close_investigation.access[gather]", by: close_tool_is_main_only, cites: [K14], witness: "Gather must not reach the close tool at all; close_tool_is_main_only is the negative pinning this cell."}
    - {rule: R3, element: "tool_close_investigation.access[budget_tier]", by: close_tool_survives_budget_pressure, cites: [K4, K5, PT4, PT6], witness: "close_tool_survives_budget_pressure pins the OUTCOME — a budget-pressed run can still close. [REPAIR-CORRECTION] This witness's `mechanism undecided, constraints unknown` half is stale: RS16 decided it and the `close_tool_budget_exemption_is_explicit` credit below records that. What is NEW and narrows the cell: the exemption governs only the SOFT per-call cap (PT6 — the hard tail-exhaustion kill takes no tool name and fires first), and any strengthening of this demand must use a CORE-tier control, because phrasing it against the write tools asserts a refusal two pre-existing modules pin as impossible (PT4). Both are recorded on the cell's constraints and in handoff.forks as a strong-author follow-up; neither is a phase-E assertion."}
    - {rule: R3, element: "challenger.access[read_file]", by: challenger_holds_no_run_dir_read, cites: [K28, PA5], witness: "All four of the new roles' read/bash cells carry the same no-grant answer; challenger_holds_no_run_dir_read pins them together, per parity."}
    - {rule: R3, element: "challenger.access[bash]", by: challenger_holds_no_run_dir_read, cites: [K28, PA5], witness: "Same negative as the read_file cell, covering the confined-bash route."}
    - {rule: R3, element: "coherence_checker.access[read_file]", by: challenger_holds_no_run_dir_read, cites: [K28], witness: "The same no-grant negative is written to cover both new roles, not just the challenger, so the coherence checker inherits the parity too."}
    - {rule: R3, element: "coherence_checker.access[bash]", by: challenger_holds_no_run_dir_read, cites: [K28], witness: "Same negative, confined-bash route, second new role."}
    - {rule: R4, element: "disposition.domain.distinguished[inconclusive]", by: gate_skips_inconclusive, cites: [K7], witness: "A draft-inconclusive close is the one disposition value that must NOT invoke the gate; gate_skips_inconclusive pins that."}
    - {rule: R4, element: "disposition.domain.distinguished[malicious]", by: counter_direction_from_directions_for, cites: [C3], witness: "The malicious disposition selects the benign counter-direction via the existing map; counter_direction_from_directions_for exercises this value."}
    - {rule: R4, element: "disposition.domain.distinguished[benign]", by: counter_direction_from_directions_for, cites: [C3], witness: "The benign disposition selects the malicious counter-direction via the existing map; same demand, other value."}
    - {rule: R4, element: "direction.domain.distinguished[malicious]", by: direction_conditional_affordances, cites: [PI2], witness: "The malicious direction gets the MITRE menu, not the ticket menu; direction_conditional_affordances pins the split."}
    - {rule: R4, element: "direction.domain.distinguished[benign]", by: direction_conditional_affordances, cites: [PI3], witness: "The benign direction gets the prior-ticket menu (or omits it on cold start); both demands exercise this value."}
    # [REPAIR-CORRECTION — the vocabulary collapse] TEN R4 credits stood here, one per retired
    # spelling, and every one of their witnesses read "one typed arm of the N-arm result". Five
    # replace them: three members of the return vocabulary and two of the committed one. The
    # `documented_alternatives` credit for the ninth arm goes with them — the alternative it
    # recorded as promoted no longer names anything.
    - {rule: R4, element: "close_outcome.domain.distinguished[challenged]", by: close_result_contract, cites: [C26], witness: "The one outcome that commits nothing. close_result_contract drives it and reads the ABSENCE of report.md; challenged_arm_forces_a_turn exercises the turn it costs; challenged_is_not_a_committed_outcome pins that it can never reach the committed vocabulary."}
    - {rule: R4, element: "close_outcome.domain.distinguished[stands]", by: close_result_contract, cites: [K7, C26], witness: "The drafted disposition survives. Three conditions reach it and each is separately exercised: gate_skips_inconclusive (the gate never ran), refuted_and_incoherent_stay_distinct (the counter-story did not survive), challenger_decline_leaves_the_close_standing (the challenger declined to argue one)."}
    - {rule: R4, element: "close_outcome.domain.distinguished[forced-inconclusive]", by: close_result_contract, cites: [C19, C26, K12, K15], witness: "A confident finding is overridden. Six conditions reach it and each has its own driving demand: nondiscriminating_forces_inconclusive, degenerate_evidence_spends_no_turn, turn_cap_forces_inconclusive, malformed_output_is_not_scored_as_incoherence, gate_failure_policy, a_fully_overlapping_attempt_spends_no_turn. What separates them for a machine is the typed failure kind, the turn count and the rounds consumed; what separates them for a person is the cause, pinned by close_result_contract as a member of the close's own published set and as COARSER than the conditions — the pairs a reader must still tell apart are named individually by the demands that care about each pair, and what the report deliberately stops separating is recorded in per_condition_granularity_is_not_on_the_report."}
    - {rule: R4, element: "committed_outcome.domain.distinguished[stands]", by: challenged_is_not_a_committed_outcome, cites: [K11], witness: "report_outcome_and_cause reads this value off the committed frontmatter under three poisoned conditions; challenged_is_not_a_committed_outcome drives every committing condition and requires the set reaching disk to be exactly the two-member vocabulary, which is the positive control its negative half needs."}
    - {rule: R4, element: "committed_outcome.domain.distinguished[forced-inconclusive]", by: challenged_is_not_a_committed_outcome, cites: [K11], witness: "Same demand, other member — and the one the waiver on unreviewed unresolved runs now counts its population over, since the three separately-spelled manufactured-unresolved arms it used to enumerate are this single value."}
    - {rule: R4, element: "request_limit.domain.distinguished[60]", by: gate_absent_on_truncated_run, cites: [K7], witness: "60 is what actually terminates an un-reviewed run; gate_absent_on_truncated_run pins that a truncated run never reaches the gate."}
    - {rule: R4, element: "request_limit.domain.alternatives[60 + extra_turn_bound]", by: ceiling_is_bound_to_the_turn_cap, cites: [K7], witness: "The raised ceiling is read from the forced-turn cap, not restated as a literal, and every run pays it whether or not the gate fires; two demands pin both halves of RS7. [REPAIR-CORRECTION] Both are non-discriminating as committed — the shipped base and the cheat's literal are the same number, so the assertion compares a constant to itself — and no setattr-free mechanism exists to move the base. Fork-H."}
    # [REPAIR-ADDITION] The same alternative now carries R4's CROSSING obligation, which the
    # first pass could not answer. `crosses_validation` moved from `unknown` to `false`.
    - {rule: R4, element: "request_limit.domain.alternatives[60 + extra_turn_bound]", by: store_render_withhold_reads_the_raised_ceiling, cites: [CR1, PM1, PM2], witness: "The shipped default does NOT stay valid under the raised alternative: a third reader of the ceiling — the message store's render/withhold check — is pinned to the unraised base, so the two rounds the raise exists to buy are dropped from the store and skip compaction. The reader census is complete at three (PM1), so this demand closes the crossing rather than sampling it, and it is expected-red."}
    - {rule: R4, element: "retry_budget.domain.distinguished[10]", by: forced_turn_cap_below_retry_budget, cites: [K12], witness: "The forced-turn cap must sit below the shared retry budget of 10 or a stubborn model crashes the driver; this demand pins the ceiling."}
    - {rule: R4, element: "budget.domain.distinguished[off]", by: report_md_single_writer, cites: [K5], witness: "The single-writer demand runs under the default (enforcement off) budget state."}
    - {rule: R4, element: "budget.domain.distinguished[on]", by: close_tool_survives_budget_pressure, cites: [K3, K4], witness: "close_tool_survives_budget_pressure specifically exercises the enforcement-on state."}
    - {rule: R4, element: "past_tickets.domain.distinguished[cold-start-no-eligible-tickets]", by: cold_start_affordance_omitted_not_empty, cites: [PI3], witness: "The sampler-returns-nothing case is pinned to omit the section rather than send it empty. [REPAIR-CORRECTION] This is the only REACHABLE member of the domain: the lister is a literal empty lambda at its production call site, so the omit half is the only half a test can drive and the demand's positive control has no address. `closed_ticket_sampler_is_an_injected_seam` is minted to give it one; both are expected-red and both wait on fork-G. [REPAIR-CLOSEOUT] Fork-G is decided (R7: add the injection point, do not waive the positive control) and both demands are green. THE DOMAIN'S OTHER MEMBER IS STILL UNREACHABLE IN PRODUCTION, by that same choice: the seam exists so a test can hand in a sample, and the production call site still hands in a lister that fetches nothing, because fetching means a subprocess inside a latency-bounded review. So the positive control drives an INJECTED sample and on every real benign-direction run the ticket-history section is absent. Examined, not missed — the residue laid out all three options and the human took the middle one — but a reviewer reading this demand green must not conclude the affordance fires."}
    - {rule: R4, element: "past_tickets", by: closed_ticket_sampler_is_an_injected_seam, cites: [PI3], witness: "A dependency with no seam makes the seam part of the contract — the same move `review_stages_enter_through_an_injection_seam` made for the three stage calls in the first pass. Without an injected lister the non-empty branch is unreachable and nothing establishes the history section can exist at all, so the demand above is a property with one testable half."}
    - {rule: R4, element: "role_registry.domain.distinguished[built-fresh-per-stage-invocation]", by: misconfigured_review_role_fails_before_the_investigation_pays, cites: [PR1, PR2, PR3], witness: "RG-1 settled that every non-main role (and the new review roles) builds fresh per call; the minted demand turns that into a startup-failure requirement rather than a first-use one."}
    - {rule: R4, element: "model_preflight.domain.distinguished[hardcoded-to-main-and-gather]", by: misconfigured_review_role_fails_before_the_investigation_pays, cites: [PR9, PR10, PR11], witness: "RG-4 settled that no preflight reaches the new roles today; the same minted demand is the fix."}
    - {rule: R4, element: "model_preflight.domain.alternatives[raises at agent build]", by: misconfigured_review_role_fails_before_the_investigation_pays, cites: [PR12], witness: "'Raises at build' is refuted as a general property (one provider never checks the key); the minted demand asserts a startup check instead, deliberately not build-time."}
    - {rule: R5, element: "report_md", by: close_path_survives_the_write_allow_change, cites: [K17, K18, K19], witness: "run_investigation still reads report_md and tool_close_investigation still writes it after write_file's edge is removed; close_path_survives_the_write_allow_change is the survival demand and the two retired committed contracts are recorded, not silently broken."}
    - {rule: R5, element: "report_md", by: close_path_survives_the_write_allow_change, cites: [K17, K19], witness: "Same dependents survive edit_file's removal; report_ordering_independence_retired re-expresses the retired ordering-independence contract on the close tool."}

    # --- the twelve entries RS10-RS16 closed; each was a hole at assembly, none is one now.
    - {rule: R1, element: "interacts(challenge_gate->coherence_checker).payload", by: coherence_checker_input_is_the_counter_story_only, cites: [C26], witness: "RS10 states the contract the design never did: the counter-story and nothing else. The demand drives a close and asserts on the prompt the stage fake RECORDED — the counter-story present, the observation layer and the lead ids absent."}
    - {rule: R1, element: "interacts(challenge_gate->projection).payload", by: projection_input_is_live_shaped, cites: [C19, C22], witness: "RS10 gives the projection stage a live-shaped input built from the run's own directory, and withdraws the design's `reused unchanged` claim. The demand drives a live run and asserts the recorded prompt names the live run dir and its executed leads, and names no learning run dir and no story-derived trace prefix."}
    - {rule: R4, element: "extra_turn_bound.domain.distinguished[0]", by: bounds_reject_zero, cites: [K12], witness: "RS14 set the bound to 2, which is the only reason bounds_reject_zero could stop being prose. The demand now drives a zero configuration and requires it refused — at zero the cap collapses the first challenged arm into the cap arm, leaving no room for the turn the gate exists to force."}
    - {rule: R4, element: "grace_bound.domain.distinguished[0]", by: bounds_reject_zero, cites: [PC9], witness: "Same closure, plus RS14's reset scope: at zero the grace bound disables the only stated evidence-strength signal, since rounds-consumed is the sole place a cold pass reads differently from a refined one. grace_budget_resets_per_gate_attempt pins the scope the value alone would leave undecided."}
    - {rule: R0, element: "review_record.identity", by: review_record_lives_beside_the_run, cites: [PB1, PB4, PB5], witness: "RS11 names the sink, so the identity facet finally has evidence to cite. The demand drives two turns of one run and observes two distinct records, plus the absence of any surviving temporary file — the atomic write is exercised, not asserted."}
    - {rule: R0, element: "report_md.access[close_investigation]", by: close_write_reenters_artifact_validation, cites: [K11, K19], witness: "RS12 answers WHAT validates, which report_md_single_writer never did (it answers WHO writes). The demand drives content the retired path would have refused through the close and requires the same refusal, with nothing left on disk. [REPAIR-CORRECTION] A refusal is where this credit STOPPED, and stopping there under-answers the cell: an implementation that validates only when the caller supplies the offending content satisfies every refusal the demand could observe and leaves every ordinary close unvalidated. The demand now also requires the validator to be seen INVOKED on an evidence-free close, through the defaulted seam the human sanctioned, and is expected-red until that parameter exists."}
    - {rule: R6, element: "report_md.access[close_investigation]", by: report_outcome_and_cause, cites: [K11], witness: "The rendered-sink gap closed by construction while the reason slot was a typed arm — no attacker-influenced chooser could reach it. [REPAIR-CORRECTION] THE VOCABULARY COLLAPSE REOPENS THIS CELL AS A REAL OBLIGATION rather than a structural one, and human decision 1 keeps it open: the cause is chosen by the host from a published set of sentences, but a published sentence with a stage's words appended satisfies every structural reading, and the renderer's evidence limb is a second free-text route into the same file. The closure is host-AUTHORSHIP and it is DRIVEN — three conditions, each carrying a marker in the exact limb whose detail is payload-derived (the challenger's decline prose, a projection naming identifiers the run never executed, an unreadable projection row quoted back), with the whole file read afterwards for the marker, the committed bytes compared against the host's own rendering of the typed values, the byte cap checked, and the marker required to be READABLE off that run's review record — because absence from a file nothing ever reached is not containment."}
    - {rule: R0, element: "tool_close_investigation.access[budget_tier]", by: close_tool_budget_exemption_is_explicit, cites: [K3, K4], witness: "RS16 replaces `whatever tier a new tool lands in` with a registered, named exemption. The demand drives the real refusal predicate against an exhausted budget state, and pins that the write tools are NOT on the roster — demoting them was the repair two existing modules already record as wrong."}
    - {rule: R0, element: "investigation_md.access[write_file]", by: close_is_terminal_for_the_disposition, cites: [K20, C1], witness: "RS15 overrules the three answering copies that converged on `untouched by this change`: their agreement was an assumption inherited from the design's silence. The demand drives a post-close write and an edit that would restate a different conclusion, and requires both refused with the recorded disposition unmoved."}
