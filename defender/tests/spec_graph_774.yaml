schema_version: 1
design: "#774 — the input set at .spec-flow/input/: 01-final-design.md is the design doc,
  02-cold-review.md AMENDS it and wins on conflict, 03-experiment-findings.md (merged as
  PR #780) fixes the challenger's output contract, and README-scope.md retargets the run."
base: a83c3347

# ===========================================================================
# SCOPE: PR 2 ONLY — THE LIVE WRITE-TIME GATE.
#
# This artifact REPLACES a same-named one assembled under the previous scope. That
# earlier graph declared this run's whole subject matter (the write interception, the
# per-run counters, the forced-turn cap, R1's write-allow narrowing, R3's ceiling) as
# carried by NO demand. It was overwritten, not amended.
#
# In scope: `write_file("report.md")` intercepted before the write commits; the per-run
# turn/grace counters on the frozen deps object; the forced-`inconclusive` cap; R1 —
# report.md leaves the model's own write allow so the close path is the only writer;
# R3 — the request limit, not budget enforcement, is the ceiling that terminates a run;
# O7/C12 — attacker-influenced payload text reaching the live session through the
# review's return.
#
# OUT of scope, and carried by no demand here: the offline sweep over completed run
# dirs, its corpus/denominator question, the "curators unwired, time-boxed" interim
# guarantee, and the offline measurement entirely. The consequence is accepted and
# recorded: the gate's survival rate is observed in production rather than measured
# beforehand.
#
# NINE HUMAN RESOLUTIONS ARE FOLDED IN AND ARE NOT RE-OPENED (.spec-flow/frontiers/
# 70-resolutions.md). Four of them had no demand binding them when the demand set was
# extracted; they are minted here — `retry_exhaustion_does_not_escape_the_driver`,
# `ceiling_is_bound_to_the_turn_cap`, `fail_closed_covers_every_review_stage`, and
# `report_629_contracts_retired_deliberately`.
#
# THE EXECUTED PROBES OUTRANK THE DESIGN PROSE. Where a probe overturned a design
# sentence the artifact carries the probed reality and `handoff.refuted` names the
# superseded reading:
#   * "reject the write and force another turn" HAS NO MECHANISM. A tool refusal is a
#     raw retry, the budget is 10, and the 11th raises an error the driver does not
#     catch. Corrected per RS6: the gate's own cap sits below the retry budget and a
#     driver handler catches exhaustion.
#   * The blinding decision cannot be delivered by narrowing inputs — at write time the
#     challenger's run dir IS the investigation's dir and both grant surfaces admit it
#     unconditionally. Enforcement is NO file-read grant at all.
#   * A refused write returns to the model RAW AND UNWRAPPED. The only precedent for a
#     refusal carrying payload-sourced text inside containment lives on a different tool
#     family, so the gate's return is a new channel shape.
#
# NAME RECONCILIATION (grounding, demand extraction and the dispositions' address
# derivations coined ids independently; unified here by role+origin). Every entry is a
# RENAME OF THE GRAPH, never an alias — an alias disables check_binds for the concept it
# papers over:
#   `agent_deps.review_state` (21-demands) -> boundary `review_state`. The old spelling
#       is not a facet address and resolved to nothing; the counters are their own seam,
#       which is exactly what the frozen-deps precedent forces (one mutable container).
#   `interacts(challenge_gate->challenger)` / `(challenger->challenge_gate).response`
#       -> ONE invoke edge with a response limb, `interacts(challenge_gate->challenger)`
#       and `.response`. The demand set addressed the stage call as two opposing edges;
#       the schema's own idiom is one edge, two limbs.
#   `interacts(oracle->challenge_gate).response` -> `interacts(challenge_gate->oracle).response`.
#   `interacts(challenge_gate->main_session).payload` — DROPPED as a dangling address.
#       The gate does not return to the session; the tool does. The reach surfaces the
#       negative had to grow are named on `counter_story_absent_from_session` instead.
#   The three review stages are BOTH actors (they run, they write traces, they are
#       driven) and boundaries (their tool grant is an access facet — 70-resolutions'
#       carried-open item 6 says that missing element is where two rounds of unowned
#       faults traced to). Same for the close tool: an actor that writes report.md, and
#       a boundary whose access facet is who may call it.
#
# THE RE-GROUNDING PROBE LANDED AND ALL FOUR SLOTS ARE SETTLED. Two of its results are
# refutations that change what gets built:
#   * Salt inheritance is NOT a general property of subagent binds. The live main-to-gather
#     pair is the ONLY shared-salt case; every learning stage mints its own, and two stage
#     entrypoints cannot even accept a threaded one. This NARROWS the delimiter-escape
#     exposure — a role built on the learning-stage precedent never sees the main session's
#     delimiter — and makes the precedent choice itself load-bearing, which is why
#     `review_roles_mint_their_own_salt` now exists.
#   * The fail-fast model preflight is unreachable from any live entrypoint; the live
#     preflight is hardcoded to the two existing roles and cannot enumerate the roles a run
#     will invoke. A new role's bad config surfaces only at first use, and whether it raises
#     at all is provider-dependent. Combined with the fail-closed resolution, a misconfigured
#     gate silently downgrades live investigations to unresolved one at a time instead of
#     failing at startup — hence
#     `misconfigured_review_role_fails_before_the_investigation_pays`.
# The other two hold: every non-main role builds fresh per call (so an unregistered role's
# loud failure lands at first gate fire, deep into a paid-for investigation), and a faulted
# stage always closes its trace logger — but writes no incompleteness marker, so a truncated
# trace and a complete one are indistinguishable by any recorded flag.
#
# SEVEN FURTHER HUMAN RESOLUTIONS LANDED AT THE PHASE-D SEAM (.spec-flow/frontiers/
# 71-resolutions-gate.md, RS10–RS16) AND CLOSE ALL TWELVE `gate.holes`. They arrived after
# assembly, so — exactly as the dispositions frontier's red flag said of the first nine — four
# of the twelve holes had no demand binding them. Nine demands are minted here for them, and
# `bounds_reject_zero` moves from `clause` to `test` because the only reason it was prose (both
# bounds' shipped values undecided) is gone:
#   RS10 role input contracts   -> `coherence_checker_input_is_the_counter_story_only`,
#                                  `projection_input_is_live_shaped`. CONSEQUENCE STATED, NOT
#                                  ASSUMED: the projection stage is no longer "reused
#                                  unchanged"; the design's claim that it is free is withdrawn.
#   RS11 the record's sink      -> `review_record_lives_beside_the_run`; `review_record.identity`
#                                  finally has evidence to point at.
#   RS12 host-rendered close    -> `close_tool_host_renders_from_typed_arguments`,
#                                  `close_write_reenters_artifact_validation`. The report's
#                                  `reason` becomes a TYPED value, which is what closed R6's
#                                  rendered-sink finding — the raw-render exposure never opens.
#                                  [SUPERSEDED by the vocabulary collapse, below: the slot is
#                                  split into a typed outcome and a free-text cause, and R6's
#                                  closure becomes host-AUTHORSHIP, driven rather than
#                                  structural.]
#   RS13 the ninth arm          -> `degenerate_evidence_spends_no_turn` (renamed by the
#                                  vocabulary collapse); the arm moves out of
#                                  `documented_alternatives` into `distinguished`.
#   RS14 the two bounds         -> extra_turn_bound default 2, grace_bound default 1, reset per
#                                  gate attempt (`grace_budget_resets_per_gate_attempt`).
#   RS15 close is terminal      -> already carried by `close_is_terminal_for_the_disposition`;
#                                  the three answerers' converged "the working document's grant
#                                  is untouched" is OVERRULED, and the two access cells now say
#                                  so instead of reading `unknown`.
#   RS16 the budget exemption   -> `close_tool_budget_exemption_is_explicit`.
# A STAGE-HANG PROBE WAS COMMISSIONED MID-AUTHORING and landed; its five claims are PS1-PS5.
# It closed the one assertion in the suite resting on an unclaimed fault class, and minted two
# demands: `review_stages_are_wall_clock_bounded` (the adjacent live precedent bounds itself
# with a request-COUNT cap that cannot fire on a pending call, so a hang there hangs forever)
# and `timeout_and_failure_are_distinguishable` (where a bound does exist, its expiry and a
# crash raise the same type and no caller in the tree tells them apart). The second is PS4's
# refutation turned into a demand rather than a note.
#
# One further demand is minted by the SUITE rather than by a resolution:
# `review_stages_enter_through_an_injection_seam`. The design gives the three stage calls no
# seam, and the author charge is explicit that a dependency with no seam makes the seam part of
# the contract — without it not one arm of this gate is drivable by any hermetic test.
#
# ===========================================================================
# VOCABULARY COLLAPSE — the close's typed result goes from TEN members to THREE.
#
# A census run after the repair delta established three facts and the human decided on them:
# ten `reason` spellings existed; grouped by what happens to the DISPOSITION they were two
# committed outcomes plus one that never commits; and no shipped consumer read the value at
# all — eight production modules read report.md and all eight route on `disposition`. The
# seven extra names were held up entirely by this suite's own assertions.
#
# The decision: keep the outcomes that genuinely differ, and carry the CAUSE beside them as
# free text for a human reading the case by hand.
#
# TWO VOCABULARIES, NOT ONE. The ten were also spanning two sinks, which is the structural
# half of the mistake: `close_outcome` (challenged | stands | forced-inconclusive) is what a
# close ATTEMPT did and reaches the tool return and the review record; `committed_outcome`
# (stands | forced-inconclusive) is what a COMMIT recorded and reaches report.md. The
# challenged path returns before the write, so its value is structurally incapable of
# appearing on disk — and one enum over both sinks made every reader of either carry that
# knowledge in its head. `challenged_is_not_a_committed_outcome` pins the strict-subset
# relation, with the positive control that both committed values do reach the file.
#
# WHAT THE RETIRED SPELLINGS CARRIED, AND WHERE IT WENT. Every demand naming one was
# re-examined against its INTENT, not its assertion. The machine-checkable half of each
# already had a home in this artifact: whether the disposition survived, the typed failure
# kind (a broken review vs a finding about the evidence), the turn count, the rounds the
# grace budget bought, the requirement list on the record, the numbered record series. The
# human half is the cause.
#
# THE NO-TURN CLOSE NEEDS NO ELEVENTH MEMBER, and that question is what forced this decision.
# It used to need one because every committed value made a CLAIM about why, and the no-turn
# close had no true one to make — so it shipped reporting the bound as exhausted on runs that
# stopped early. With no spelling saying why, no spelling can lie; the claim moves to the
# cause and is checked as a distinction from the genuinely-capped run's.
#
# ===========================================================================
# TWO HUMAN DECISIONS ON THE COLLAPSE'S OWN SHAPE (this pass). The collapse's first author
# left the cause as free text carrying the close's detailed reason, and left the metric half
# of one demand with no typed successor. Both were raised at the seam and both were decided.
#
# DECISION 1 — REPORT.MD IS ENTIRELY HOST-AUTHORED, AND THE CAUSE IS NOT AN EXCEPTION. That
# file rides VERBATIM into the judge LLM's prompt and its body rides out through the ticket
# bridge's HTTP egress; every review stage composes its reply after reading attacker-influenced
# alert data. A cause taken from the close's detailed reason therefore steers both sinks at
# once. So the cause is one of the CLOSE'S OWN published sentences (`REPORT_CAUSES`), and the
# stage-derived diagnostic stays on the numbered review record, which no prompt reads verbatim
# — kept, not dropped, which is what makes the record's own `detail` slot part of the contract.
#
# The demand cannot be an assertion about the field's SHAPE. Membership in a published set is
# satisfiable by an implementation that picks a sentence and concatenates a stage's words after
# it — into the cause, or into the body through the renderer's other free-text limb. So it is
# DRIVEN: a marker planted in each limb whose detail is genuinely payload-derived, absent from
# the whole file, present inside the frame on that run's record, and the committed bytes equal
# to the host's own rendering of the typed values and nothing more.
#
# The cause's other property is COARSENESS, and it is the anti-relapse clause: one sentence per
# condition is the ten-member vocabulary re-minted in longer words one file away from where it
# was removed. So the causes the committing conditions write must be strictly fewer than the
# conditions. Still nothing asserts a cause's WORDING — the suite reads production's own set and
# never spells a member.
#
# DECISION 2 — THE FAILURE KIND BECOMES A TYPED FIELD OF ITS OWN, and it is the one vocabulary
# this pass ADDS. The cause cannot carry the countable half: a sentence whose wording the spec
# deliberately leaves free is not a key a fleet query can group by, so after the collapse
# "how often does the review break, and how" had no answer on disk. Four members, and the bar
# each cleared is a different owner and a different fix — `timeout` (capacity, and the one whose
# right response may be to do nothing), `error` (a defect with a traceback), `unreadable` (a
# stage answered OUTSIDE its output contract; nothing is down, the prompt is), `incoherent` (a
# stage answered INSIDE its contract and the content still could not be used — the
# challenger-quality signal). Absent entirely when the review did not fail, which is what keeps
# an override the evidence produced from counting as a broken review.
#
# It lands on report.md as well as the record. The record is read by no shipped code, so a
# value only there is a value only this suite can see; report.md is what every downstream
# reader already opens.
#
# ===========================================================================
# REPAIR DELTA — a SECOND write-tests pass over SHIPPED code (PR #783, HEAD 66cb1b6d).
#
# Everything above was written before any implementation existed. This block and everything
# marked `repair:`, `was_red_because:` or `[REPAIR-CORRECTION]` below was added after the code
# shipped and an adversarial pass found 12 defects in the SUITE, not in the graph. `base:` is
# unchanged — a83c3347 is still the SHA the spec branch forked from, and write-code-from-spec's
# gate still diffs against it. The repair delta's own reference point is 66cb1b6d, which is
# code, not a spec base.
#
# THE ARTIFACT WAS EXTENDED IN PLACE, NEVER REPLACED. Every demand id, claim id, boundary id
# and axis name that existed before this pass still exists and still means the same thing.
# Where an entry turned out to be WRONG it carries a `[REPAIR-CORRECTION]` marker and says
# what it used to claim; nothing was silently overwritten.
#
# WHAT A READER NEEDS TO SORT RED TESTS BY — AND THERE ARE NONE LEFT TO SORT.
#   `expected_red: true`  — RETIRED, AND THE RETIREMENT IS THE POINT. The slot meant "the test
#                           is correct and the SHIPPED CODE FAILS IT". Eighteen demands carried
#                           it, written when the delta was tests-against-unfixed-code; the
#                           human's R2 then moved the fixes into this PR and the implementation
#                           leaves landed every one of them. The flag stayed set anyway, on a
#                           suite that is 85/85 — and it is a MACHINE-READABLE slot, so a future
#                           regression on any of those eighteen would have read as sanctioned
#                           rather than as a break, and a human at the merge gate would have
#                           been told the branch ships red when it ships green. Cleared on all
#                           eighteen at close-out, each one checked by name against the
#                           collected suite and by running it. Nothing in the toolchain caught
#                           this: no check reconciles a demand's declared colour against the
#                           suite's actual one. If a demand is ever genuinely red again, set the
#                           flag again — do not soften the test.
#   `was_red_because:`    — the historical record the cleared flag leaves behind: what was
#                           wrong with the CODE when the demand was authored. Eighteen entries,
#                           renamed from `red_because` so no reader takes a past defect for a
#                           present one. Keep them: they are why several of these tests are
#                           shaped the way they are.
#   `[REPAIR-RESOLVED …]`  — the fork this demand's shape waited on is DECIDED. The marker
#                           names the fork and the resolution; the decisions themselves live
#                           in .spec-flow/frontiers-repair/70-resolutions-repair.md. No
#                           demand is `provisional` any more: seventeen forks in, seventeen
#                           resolved, none carried open.
#   `repair:`             — this demand's committed test was found non-discriminating or
#                           broken. `repair.observable` / `repair.scenario` is what the
#                           repaired test keys on. Twenty-two demands.
#
# FORK NAME RECONCILIATION. The demand ledger coined FORK-0..FORK-4; the dispositions
# frontier coined letters A..Q over a superset. The LETTERS are canonical here, because the
# human seam reads that frontier. The five inherited forks map:
#   FORK-0 (may a repair change what a test LOOKS AT?)      -> fork-A
#   FORK-1 (the discriminator join has no key)              -> fork-D
#   FORK-2 (one off-topic lead silences the review)         -> fork-E
#   FORK-3 (is the ticket-history affordance wired at all?) -> fork-G
#   FORK-4 (the raised ceiling's base cannot be moved)      -> fork-H
# Twelve more (fork-B, C, F, I, J, K, L, M, N, O, P, Q) are NEW in this delta. All seventeen
# are in `handoff.forks`, and ALL SEVENTEEN ARE NOW DECIDED — the human seam ran after the
# assembly and its seven resolutions close them. Each demand whose shape waited on one
# carries a `[REPAIR-RESOLVED <fork>]` marker naming the decision it took.
#
# WHAT THE RESOLUTIONS CHANGED, in one line each:
#   R1/fork-A  a repair may re-key a test onto a different EXISTING observable, intent
#              unchanged. The three-close-shapes test moves off report.md — byte-identical
#              for two of its three shapes — onto the numbered review-record series.
#   R2/fork-C  four shipped bugs are FIXED in this PR, so the delta is no longer tests-only:
#              close terminality, the fail-closed parse gap, the stale ceiling mirror, and
#              the model-override split.
#   R3/fork-H  the request ceiling's base becomes injectable through the bounds object the
#              gate already reads — the injection point, not a lint suppression.
#   R4/fork-B  a committed close is terminal, and the host's last-resort close skips a run
#              that already closed. fork-L resolves with it.
#   R5/fork-O  any projection output the classifier cannot read is a review failure —
#              unparseable text and well-formed JSON with wrong-shaped rows alike — while a
#              legitimately empty projection keeps its own arm.
#   R6/fork-F  the projection stage gets a role of its own, so the `oracle` address resolves.
#   R7         the remaining ten stand on their recorded readings; fork-I, fork-G, fork-J and
#              fork-Q each mint a demand, fork-N retires a vestigial address, fork-D, fork-E,
#              fork-K, fork-M and fork-P change nothing in the code.
#
# THE ADDRESS THAT NAMES NOTHING IN CODE, RESOLVED HONESTLY RATHER THAN PAPERED OVER.
# The live projection stage has NO ROLE OF ITS OWN (PM6, driven). It is the challenger's role
# definition re-bound at one call site: the role enum, the registry, the policy-compile
# surface and the startup preflight each count exactly TWO review roles, never three. The
# graph's `oracle` id therefore joins to the OFFLINE learning oracle, which is a different
# thing — the worst possible join, because it looks resolved. The id is KEPT (six demands and
# four pre_discharged entries address it, and the STAGE is real even where the ROLE is not),
# its `provenance` is corrected from `code` to `design`, its note says what it actually is,
# and the gap is recorded as an open R0 hole waiting on fork-F. Renaming it would have been a
# fork decision taken by an assembler.
#
# WHAT THE PROBES OVERTURNED THIS PASS (each correction is marked at its site, and named in
# `handoff.refuted`):
#   * THE CLOSE IS NOT TERMINAL. A second close — the model's, through the real tool loop, or
#     the host's own retry-exhaustion handler — re-runs the whole gate and OVERWRITES
#     report.md. Driven, it flipped a committed `malicious` to `inconclusive` and destroyed
#     the first close's review record, because every committing arm computes its record path
#     from a counter only the NON-committing arm advances. The graph's own R2 witness said
#     `close_investigation` is report_md's "sole, single-invocation writer per run". That
#     sentence was false when it was written and is corrected here.
#   * THE RAISED CEILING HAS A THIRD READER AND IT IS STALE. `crosses_validation` on the
#     raised-ceiling alternative was `unknown`; it is now `false`, because one reader is
#     pinned to the unraised base. The two rounds the raised ceiling exists to buy are
#     dropped from the run's message store and skip compaction entirely.
#   * THE REVIEW TRACE IS FRAMED ON ONE CELL OF THREE. Forced to carry prose, two of the
#     three stages' replies land byte-for-byte raw on disk, and the negative that binds the
#     trace surface passes VACUOUSLY on both — its scenario only ever poisons the third.
#   * THE OPERATOR'S MODEL OVERRIDE REACHES THE INVESTIGATOR AND NOTHING ELSE, and the
#     startup preflight validates a model the run will not use. Driven: a broken override
#     passed the real preflight clean.
#   * K31 IS NO LONGER UNPROBED. The gate's return path now exists, so the break-attempt
#     deferred to write-code-from-spec was executed. It survives: `unrefuted`.
#
# TWO DEMANDS THIS REPAIR MINTS HAD NO GRAPH ENTRY AT ALL and are minted here —
# `closed_ticket_sampler_is_an_injected_seam` (without a seam the cold-start affordance's
# positive control cannot be written, so the demand it serves is half-testable by
# construction) and `store_render_withhold_reads_the_raised_ceiling` (the stale mirror above,
# named by no reported defect and covered by no test). Two more are minted by the
# dispositions rather than by the demand ledger: `close_commits_at_most_once` (fork-B's
# promoted 3/3 consensus) and `returned_lead_identifier_stays_inside_the_frame` (the one
# consensus the ledger left binding nothing). Four new demands, four tests phase E owes.

demands:

  # ---- demand #0 of the REPAIR delta: what a repair is allowed to do ------------------
  # Not a demand on the code. A demand on the SUITE, which is why it is a clause: no test
  # holds it, and every other repaired demand's shape depends on which reading wins.

  - id: repair_contract
    kind: behavior
    form: clause
    # [REPAIR-RESOLVED fork-A] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-A: R1 — a repair may key a test on a different EXISTING observable when the stated
    #     one does not exist, intent unchanged.
    binds: ["run_investigation"]
    outcome: {nl: "A repair to a committed test may change the scenario it drives and may
      tighten the observable it keys on, and it may additionally substitute a different,
      existing observable for one the demand's prose names but the shipped artifact does not
      carry — provided the substitution is recorded as a deviation AND the demand for the
      stated observable is minted alongside it as expected-red-until-implementation, so the
      ledger loses nothing."}
    repair:
      type: minted
      observable: {nl: "Three repairs in this delta turn on it: the three-close-shapes
        observable that report.md does not carry, the misconfigured-review-role subject that
        has no address distinct from the main investigator, and the cold-start affordance
        whose positive half is unreachable in production."}
    rejected:
      - {nl: "Scenario-and-strength only, with no substitution permitted, was not pinned:
          it would leave three demands red for want of an observable rather than for want of
          correct code, and turn a tests-only repair into an implementation change."}
      - {nl: "Free substitution, with no paired red, was not pinned: a suite allowed to
          re-choose the observable a demand names can rationalize any failure away, which is
          the same defect the adversarial pass just caught, one level up."}

  # ---- the return-value contract, and the close tool's own surface -------------------

  - id: close_result_contract
    kind: behavior
    form: test
    # [REPAIR-RESOLVED] Carried `provisional` with no fork named — flagged, never routed. The
    # human seam settled every fork that could have moved this demand's shape.
    # [REPAIR-CORRECTION — the vocabulary collapse] The demand NARROWS. It used to require one
    # value per gate condition and, with it, that no two conditions share a value; that half is
    # gone, because it was the ten-way injectivity the collapse exists to remove and no
    # consumer ever read it. The ten conditions are still all driven and each must reach the
    # outcome the table names.
    # [REPAIR-CORRECTION — human decision 1] The replacement for the retired injectivity was
    # NINE DISTINCT CAUSES, and that is overruled. Nine distinct sentences is the ten-member
    # vocabulary re-minted one file away from where it was removed, and it also forces the
    # cause to be composed per condition — which is how a stage's own words get in. What the
    # demand pins instead is a three-sided property: every cause is a member of the close's own
    # published set (so it is host-authored); the causes the committing conditions write are
    # strictly FEWER than the conditions and more than one; and — the clause that actually
    # bounds the size, since "fewer" alone admits eight sentences for nine conditions — ONE
    # DISTINCTION, ONE FIELD: the conditions the typed failure kind already separates share a
    # single sentence between them, with their kinds required to differ so the shared sentence
    # is not agreement that nothing distinguishes them. The granularity that is genuinely
    # machine-needed moved to `failure_kind`; the pairs a human must still tell apart are
    # asserted by the demands that care about each pair. Nothing asserts a cause's wording.
    binds: ["interacts(main_agent->tool_close_investigation).response",
            "close_outcome.domain.distinguished[challenged]",
            "close_outcome.domain.distinguished[stands]",
            "close_outcome.domain.distinguished[forced-inconclusive]",
            "close_cause"]
    discharged_by: test_the_close_returns_one_typed_outcome_and_carries_the_cause_beside_it

  # [REPAIR-ADDITION] Minted by the vocabulary collapse, and it is the demand that answers
  # whether the non-committing value belongs in the same enum as the two committed ones. It
  # does not: the two vocabularies are different sets, and pinning the relation is what stops a
  # later reader re-merging them.
  - id: challenged_is_not_a_committed_outcome
    kind: negative
    form: test
    binds: ["close_outcome.domain.distinguished[challenged]",
            "committed_outcome.domain.distinguished[stands]",
            "committed_outcome.domain.distinguished[forced-inconclusive]",
            "report_md.payload"]
    discharged_by: test_the_committed_vocabulary_is_the_return_vocabulary_without_the_challenged_value
    # Its positive control is inside the same test, on the same address under the complementary
    # condition: every committing condition is driven and the set of outcomes reaching disk must
    # be exactly the committed vocabulary — without it the negative is green on a file nothing
    # ever writes.
    rejected: [{nl: "Modelling the two as one vocabulary was rejected: a member that one of the two sinks is structurally incapable of holding forces every reader of either sink to carry that knowledge in its head, and it is where the ten spellings came from — a value doing three jobs at once (did this commit, did the disposition survive, and why) can only be split by adding names."},
               {nl: "Dropping the non-committing value from the vocabulary entirely — modelling it as the ABSENCE of an outcome — was rejected: it is written to disk, on the numbered review record, so it is a real recorded value and not a null."}]

