    #     gate already reads.
    binds: ["request_limit.domain.alternatives[60 + extra_turn_bound]", "extra_turn_bound.domain"]
    discharged_by: test_the_raised_request_ceiling_is_read_from_the_forced_turn_cap_not_a_literal
    repair:
      type: strengthened
      observable: {nl: "The ceiling tracks a MOVED BASE, not only a moved cap. The shipped
        base and the cheating implementation's literal are both 60, so the committed base
        assertion is vacuous — it compares a constant to itself."}
      blocked_on: {nl: "No mechanism for moving the base exists under the suite's own
        no-monkeypatch discipline: the base is a plain module constant with no environment
        backing and no path through the entry point's signature. Fork-H is the choice of
        mechanism, and it must move BOTH ceiling demands together or they will disagree about
        what `the base` is."}
    rejected: [{nl: "Separating the review's request allowance from the investigation's was recommended and not taken; one budget is kept and the ceiling raised, so the interaction returns the moment the cap changes and the two must be unable to move independently."}]

  - id: every_run_pays_the_raised_ceiling
    kind: domain-outcome
    form: test
    was_red_because: {nl: "Same missing seam as its sibling: the entry point takes no bounds, so a run cannot be driven at a ceiling it was handed and counting base-plus-two discriminates nothing while the shipped cap is two."}
    # [REPAIR-RESOLVED fork-H] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-H: R3 — the request ceiling's base becomes injectable through the bounds object the
    #     gate already reads.
    binds: ["request_limit.domain.alternatives[60 + extra_turn_bound]", "run_investigation"]
    discharged_by: test_a_run_the_gate_never_fires_on_still_gets_the_raised_ceiling
    repair:
      type: strengthened
      observable: {nl: "The observed call ceiling follows a cap moved AWAY from its default.
        The shipped cap is 2 and the cheating implementation's literal was 2, so counting
        base-plus-two discriminates nothing. Same missing mechanism as the sibling above."}
      blocked_on: {nl: "Fork-H. Across every cap value the committed test drives, the base
        term never leaves its default."}

  - id: store_render_withhold_reads_the_raised_ceiling
    kind: behavior
    form: test
    binds: ["request_limit.domain.alternatives[60 + extra_turn_bound]", "main_session",
            "run_investigation"]
    discharged_by: test_the_message_stores_request_limit_mirror_moves_with_the_raised_ceiling
    # MINTED IN THE REPAIR DELTA — this had no graph entry at all, and no reported defect
    # named it. It is the THIRD reader of the ceiling, and it is the drift the two demands
    # above exist to prevent, already shipped, in the place nobody was looking.
    repair:
      type: expected-red
      observable: {nl: "On a run driven to the ceiling, the message store confirms every
        round that actually happened and withholds only the one that does not — the store's
        own round count reaches one below the raised ceiling, and the render path runs on
        every confirmed round. Today the store stops confirming two rounds early."}
      was_red_because: {nl: "The store-render processor mirrors the framework's request-limit
        check against the UNRAISED base while the run is given the raised ceiling. Driven at
        counts 58 through 62: at 60 and 61 — the two rounds the raised ceiling exists to buy,
        which genuinely execute — the round's continuation is dropped from the store and the
        model is handed raw, uncompacted history."}
    rejected: [{nl: "Treating this as covered by the two ceiling demands above was rejected: they bind the arithmetic of the ceiling's COMPUTATION, and this is a third site that CONSUMES it without reading it. The census that established there is no fourth reader is complete (PM1), so this demand closes the reader set rather than sampling it."}]

  - id: review_does_not_starve_the_run
    kind: behavior
    form: test
    binds: ["request_limit.domain", "drives(challenge_gate->challenger)"]
    discharged_by: test_the_reviews_own_calls_cannot_push_the_investigation_into_the_request_limit
    # [REPAIR-CORRECTION] The scenario counted three attempts' stage calls while scripting one
    # repeating lead. Under `a_fully_overlapping_attempt_spends_no_turn` the second attempt
    # commits, the third is refused by the terminality rule, and the count is taken over two
    # attempts against a bound written for three. One fresh lead per attempt restores it.
    rejected: [{nl: "The pre-existing gap where the run's cost sum omits every gather subagent call is not fixed here; that failure clause is already true today, independent of this change."}]

  # ---- the two bounds, and the per-run counters ---------------------------------------

  - id: extra_turn_bound_is_a_knob
    kind: seam
    form: test
    binds: ["extra_turn_bound.domain"]
    discharged_by: test_the_extra_turn_bound_is_injected_not_literal
    # [REPAIR-CORRECTION] Latent rather than broken: with one lead repeated, the second attempt
    # at a cap of one had TWO independent reasons not to gate — the injected cap and the
    # fully-overlapping-attempt rule — so the arm stopped telling them apart and which check an
    # implementation ran first decided the result. The second attempt now carries its own fresh
    # lead, leaving the cap as the only thing that can stop it.

  - id: grace_bound_is_a_knob
    kind: seam
    form: test
    binds: ["grace_bound.domain"]
    discharged_by: test_the_grace_bound_is_injected_not_literal

  - id: bounds_reject_zero
    kind: domain-outcome
    form: test
    binds: ["extra_turn_bound.domain.distinguished[0]", "grace_bound.domain.distinguished[0]"]
    discharged_by: test_zero_is_refused_for_either_bound
    rejected: [{nl: "Accepting zero and treating the resulting indistinguishability as a cost was one of the two readings the answering copies split on, and it is not taken. This demand was prose SOLELY because both bounds' shipped values were an open human decision; RS14 set them (two forced turns, one refinement round), so it is executable and the two R4 zero-cell obligations it left open are closed."}]

  - id: grace_budget_resets_per_gate_attempt
    kind: behavior
    form: test
    binds: ["grace_bound.domain", "review_state"]
    discharged_by: test_a_second_gate_attempt_starts_with_a_full_grace_budget
    # [REPAIR-CORRECTION] Latent, same shape as `extra_turn_bound_is_a_knob`: a repeated lead
    # makes the second gate attempt fully overlapping, and this demand would then be reading
    # whatever rounds count a refused turn happens to report rather than a second attempt's own
    # grace budget. The script is per ROUND (the projection runs once per round, not once per
    # attempt), and the coherent round of each attempt carries the fresh lead.
    rejected: [{nl: "Resetting grace per RUN was rejected (RS14): a second challenge would inherit an exhausted budget and could never refine at all, which silently turns every later attempt into a cold pass while the rounds-consumed signal still reports zero."}]

  - id: review_state_on_frozen_deps
    kind: seam
    form: test
    # [REPAIR-RESOLVED fork-N] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-N: R7 — the seam demand's state-location requirement is retired as vestigial; the
    #     per-run behavioural binding is kept.
    binds: ["review_state"]
    discharged_by: test_review_counters_live_in_a_mutable_container_and_are_per_run
    # [REPAIR-RESOLVED fork-N] `agent_deps` is retired from the binds as vestigial: the test
    # observes the per-run BEHAVIOUR (two independent bindings over one run directory hold
    # independent counters) and never reads where the state is stored, so carrying the
    # address here would have claimed coverage nothing checks — the shape demand #0 forbids.
    # [REPAIR-CORRECTION] The counter only advances on a turn the gate actually SPENDS, so with
    # one repeating lead the first binding's second attempt is fully overlapping — refused its
    # turn — and this demand would read a counter that correctly stood still as one that failed
    # to advance. All three attempts now carry their own fresh discriminating lead.
    repair:
      type: strengthened
      observable: {nl: "Two independent binds over the SAME run directory hold independent
        counters. The committed scenario uses two DIFFERENT run directories, which a
        process-global keyed on the run directory passes identically — which is exactly what
        the cheating implementation was."}
      scenario: {nl: "The repair is additive: the frozen-assignment check the committed test
        already makes and the new same-run-directory independence case both appear in the
        final body."}
      blocked_on: {nl: "Fork-N. Each bind returns its own object, so a store held entirely
        OUTSIDE the dependencies object and keyed on the binding's identity passes the
        behavioural test too — without the state ever living where this demand's second bound
        address says. Requiring the attribute makes `agent_deps` mean something and reads an
        implementation detail; requiring only the behaviour leaves `agent_deps` vestigial in
        the binds, which is the shape demand #0 exists to forbid. The three answering copies
        split three ways."}

  # ---- what the investigator gets back ------------------------------------------------

  - id: counter_story_absent_from_session
    kind: negative
    form: test
    # [REPAIR-RESOLVED fork-J] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-J: R7 — the trace-framing demand's binds narrow to the cell it tests, and the two
    #     missing cells get their own demand.
    binds: ["interacts(tool_close_investigation->main_session).payload",
            "report_md.payload", "review_record",
            "interacts(challenge_gate->challenger).response"]
    discharged_by: test_no_counter_story_prose_reaches_the_main_session
    # [REPAIR-RESOLVED fork-J] The `review_trace` binding is NARROWED to the one cell this
    # test genuinely exercises — the challenger's own reply, whose trace row is framed. The
    # other two cells now have their own demand (`every_stage_trace_reply_is_framed`), which
    # is red, rather than being carried here as coverage this test never provided.
    # [REPAIR-CORRECTION] THE BINDS OVERSTATE THE TEST, MEASURED (PV2). The negative holds
    # non-vacuously on three of its four surfaces — the tool return, the report's frontmatter
    # reason, and the review record. On the fourth, `review_trace`, it holds for the
    # challenger's own row and passes VACUOUSLY on the other two: the scenario only ever puts
    # prose into the challenger's reply, so the coherence checker's and the projection's rows
    # never contain the string it looks for. Forced to carry prose, both land byte-for-byte
    # raw on disk. The binds are NOT narrowed here — narrowing is fork-J reading (a), a
    # decision, and the alternative reading writes the two missing cells instead. Nothing
    # escalates: all three roles hold zero read and zero bash grant against the compiled
    # policy, so the bound is a corrupted verdict, never a file or a session.
    rejected: [{nl: "Binding this negative to the tool return alone was rejected: payload-derived text also reaches the report's frontmatter reason on the forced-unresolved arms, the review record, and the review stages' own execution traces — and the last two sit inside grants the investigator already holds, so a negative naming one address passes vacuously on the other three."}]

  - id: discriminating_material_reaches_session
    kind: behavior
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_the_challenged_arm_does_hand_back_the_discriminating_material

  - id: review_return_is_contained
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_payload_derived_text_returns_only_inside_the_run_salted_untrusted_frame

  - id: review_return_is_typed_not_prose
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_the_recommended_lead_structure_admits_no_free_text_limb

  - id: recommended_lead_provenance
    kind: shape
    form: test
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_a_reviewer_originated_lead_carries_its_provenance_stamp

  - id: returned_lead_identifier_stays_inside_the_frame
    kind: shape
    form: test
    # [REPAIR-RESOLVED fork-D] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-D: R7 — the join reading recorded in the residue stands: the pairing is not given a
    #     new key and the output contract does not widen.
    binds: ["interacts(tool_close_investigation->main_session).payload"]
    discharged_by: test_a_payload_sized_lead_identifier_returns_inside_the_untrusted_frame
    # MINTED IN THE REPAIR DELTA. This was the one 3/3 consensus in the dispositions that
    # bound NO demand — the dispositions frontier flagged it and required phase D to mint it
    # or record an explicit drop, because landing the test alone is invented scope that
    # conservation flags later at higher cost.
    repair:
      type: minted
      observable: {nl: "The returned material pairs a requirement with a lead identifier.
        The suite drives the requirement's source with hostile content; the IDENTIFIER's
        source is never driven the same way, and it is the half of the pair carrying no size
        bound of any kind. With the identifier source returning payload-sized prose, the
        returned block stays inside the run-salted untrusted frame and the pairing is not
        corrupted."}
      # The framing half is settled by PV1 — the whole returned block is wrapped, both halves
      # inside it. The BOUND half is not: no size cap exists on the identifier at any step,
      # and the nearest precedent on the live path (PL1) has none either.
    rejected: [{nl: "Folding this into `review_return_is_contained` was rejected: that demand's test drives payload text through the REQUIREMENT limb, which is the limb the design intends to carry free text. The identifier limb is intended to carry an id, so nothing about it being wrapped follows from the requirement limb being wrapped — and an id-shaped field carrying prose is exactly the case a wrap-by-limb implementation would miss."}]
    # Waits on fork-D: reading (c) hands back lead identifiers ONLY and drops the requirement
    # text, which changes what the pair is and therefore what this demand asserts about it.

  # ---- the challenger's input, grant and output ----------------------------------------

  - id: challenger_input_is_observation_layer
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload"]
    discharged_by: test_the_challengers_input_carries_observations_and_no_inference_layer
    rejected: [{nl: "Dropping only the concluding block was rejected: in three of three real completed working documents the resolution and authorization rows already name the settled interpretation in plain English, so the cut has to be at the observation/inference boundary, not the inference/conclusion one."}]

  - id: challenger_sees_lead_identity_not_belief_structure
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload"]
    discharged_by: test_the_challenger_sees_lead_identity_but_not_the_hypotheses_each_lead_tests
    rejected:
      - {nl: "Admitting the lead block whole was rejected (RS18). A lead row carries the ids of the hypotheses the lead was run to test, which is belief structure and sits on the inference side of the line the human drew — the same line the ledger claim states in the document's own vocabulary. Withholding the block entirely was rejected too: the challenger's output contract requires a lead id per settled assertion, so identity must arrive or that contract is unsatisfiable."}
      - {nl: "Expressing this by asserting a block tag's presence was rejected, and is how the whole block came to be admitted in the first place. The resolution constrains which COLUMNS of a row arrive; a tag assertion cannot see a column, so the demand is written at row-content altitude instead."}

  - id: challenger_holds_no_run_dir_read
    kind: negative
    form: test
    binds: ["challenger.access[read_file]", "challenger.access[bash]",
            "coherence_checker.access[read_file]", "coherence_checker.access[bash]"]
    discharged_by: test_the_new_roles_cannot_reach_the_live_working_document
    rejected: [{nl: "Narrowing the roles' extra read roots was rejected as the enforcement mechanism — the working document is reachable through the run directory itself, which both grant surfaces admit first and unconditionally, ahead of any read-roots widening."}]

  - id: challenger_reads_its_inlined_input
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->challenger).payload",
            "challenger.access[read_file]"]
    discharged_by: test_the_challenger_still_receives_its_observation_layer_input
    # POSITIVE CONTROL for `challenger_holds_no_run_dir_read`, on the same cell under the
    # complementary condition: with NO read grant the same observation-layer bytes still reach
    # the role through the sanctioned inlined path. A bare no-grant negative is also green
    # against a role that receives nothing at all.

  - id: coherence_checker_input_is_the_counter_story_only
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->coherence_checker).payload"]
    discharged_by: test_the_coherence_checker_receives_the_counter_story_and_nothing_else
    rejected: [{nl: "Giving the coherence checker payload access was rejected (RS10). Internal consistency is the only job it can do without payload access, and that constraint is what keeps it honest — a critic that can see the evidence stops checking coherence and starts re-litigating the case."}]

  - id: projection_input_is_live_shaped
    kind: shape
    form: test
    # [REPAIR-RESOLVED fork-F] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-F: R6 — the projection stage gets a role of its own; the two demands binding
    #     `oracle` resolve to it.
    binds: ["interacts(challenge_gate->projection).payload"]
    discharged_by: test_the_projection_stage_input_is_built_from_the_live_run_not_a_learning_run_dir
    # [REPAIR-CORRECTION] THIS IS ONE OF THE TWO DEMANDS WHOSE `oracle` ADDRESS NAMES NOTHING
    # IN CODE (PM6, driven). The live projection STAGE exists; the live projection ROLE does
    # not. The stage is built by re-binding the challenger's own role definition at one call
    # site, and the role enum, the registry, the policy-compile surface and the startup
    # preflight each count exactly two review roles. So the graph's `oracle` joins to the
    # OFFLINE learning oracle — a different thing, and the worst kind of wrong join, because
    # it resolves. The consequence for THIS demand is sharp: the blindness the design rests
    # on (single-story, never told which side is challenged, "because a comparative judgment
    # by an agent that knows which side is being challenged can be led") lives in prompt text
    # rather than in structure, so adding the direction-conditional exploration affordance to
    # the challenger's role — which the human already settled, and which by construction
    # names the side being argued — would silently leak the direction into the stage built to
    # be blind. Fork-F decides whether a distinct role is minted; the id is kept either way,
    # and the open R0 hole on `oracle` records the gap.
    rejected: [{nl: "Reusing the projection stage unchanged was rejected (RS10), and the design's claim that this reuse is free is WITHDRAWN. Its existing invocation threads a learning run directory and a story-derived trace prefix; a live investigation supplies neither, and it is the stage two of the verdict vocabulary's arms are defined over."}]

  - id: review_stages_enter_through_an_injection_seam
    kind: seam
    form: test
    binds: ["drives(challenge_gate->challenger)",
            "drives(challenge_gate->coherence_checker)",
            "drives(challenge_gate->projection)",
            "run_investigation"]
    discharged_by: test_the_review_stages_are_driven_through_an_injection_seam_on_the_entry_point
    rejected: [{nl: "Leaving the three stage calls seamless was rejected: the design names no injection point for them, and without a value the run is handed they are live provider calls that no hermetic scenario can drive — so not one arm of this gate would be testable. The seam sits on the entry point beside the five that already exist there, following the same value-not-monkeypatch discipline."}]

  - id: challenger_output_contract
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).response"]
    discharged_by: test_the_challenger_tail_declares_unsettled_requirements_with_settled_by_and_if_false
    repair:
      type: repaired
      scenario: {nl: "The per-case temporary directory must be named by an explicit
        enumeration index, never derived from the case's own JSON — collision-proof by
        construction rather than merely less likely. Deriving it from a prefix of the case
        content collides two cases onto one directory, the second never runs, and the
        contract is asserted only against the case that happened to be first. Both cases
        reach the malformed arm when actually driven."}
      # An index-based name is also immune to whatever fork-D does to the tail's shape; if
      # fork-D widens the schema, the malformed-limb cases need re-verifying under it.

  - id: discriminator_rule
    kind: behavior
    form: test
    # [REPAIR-RESOLVED fork-D, fork-F] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-D: R7 — the join reading recorded in the residue stands: the pairing is not given a
    #     new key and the output contract does not widen.
    #   fork-F: R6 — the projection stage gets a role of its own; the two demands binding
    #     `oracle` resolve to it.
    binds: ["interacts(challenge_gate->projection).response",
            "interacts(challenge_gate->challenger).response"]
    discharged_by: test_the_discriminating_set_is_silence_measured_against_declared_unsettled_requirements
    # [REPAIR-CORRECTION] The SECOND demand binding an `oracle` address that names no role in
    # code — see `projection_input_is_live_shaped` for what that costs.
    repair:
      type: fork
      observable: {nl: "The committed test drives ONE unsettled requirement against TWO
        silent projection rows and asserts which lead was picked. An unsettled requirement is
        by definition one no lead settled, so no field in the driving fixture names one row
        rather than the other: the only way to satisfy the assertion is to pick by position
        or by sort order, and the shipped code sorts. The test passes because it happens to
        match an arbitrary order, which is not a contract."}
      blocked_on: {nl: "Fork-D is where the join gets a key, or is admitted not to have one.
        Its readings (a) and (b) add a real key and re-open the review roles' output
        contracts; (c) drops the requirement text and degrades this demand permanently to
        `these leads are worth revisiting`; (d) returns the cross-product. Whichever wins,
        the graph entry moves with the test in the same change — address resolution does not
        compare a test's assertions to its demand's binds, so no mechanical check would
        notice if it did not."}

  - id: direction_conditional_affordances
    kind: domain-outcome
    form: test
    binds: ["mitre_menu", "past_tickets",
            "direction.domain.distinguished[malicious]",
            "direction.domain.distinguished[benign]"]
    discharged_by: test_the_challengers_exploration_menu_follows_the_direction_it_argues

  - id: cold_start_affordance_omitted_not_empty
    kind: domain-outcome
    form: test
    # [REPAIR-RESOLVED fork-G] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-G: R7 — the ticket-history injection point is added rather than the positive
    #     control waived.
    binds: ["past_tickets.domain.distinguished[cold-start-no-eligible-tickets]",
            "direction.domain.distinguished[benign]"]
    discharged_by: test_an_empty_affordance_sample_omits_the_section_rather_than_sending_it_empty
    repair:
      type: expected-red
      observable: {nl: "The PAIR, in one test: with no eligible tickets the prompt carries no
        history section at all, and with a NON-EMPTY sample supplied through the same path it
        carries one containing that sample's own content. Three string-absence checks are
        satisfied by a fixed sentence that is present and empty-in-substance — the exact thing
        this demand forbids — and with no positive control nothing establishes that the
        section can exist at all. The empty case must additionally be driven as a sampler
        INVOKED AND FINDING NOTHING, distinct from never-called and from None-returning."}
      was_red_because: {nl: "The closed-ticket lister is a literal empty lambda at its call site,
        so the non-empty branch is unreachable in production and the positive control cannot
        be written against the shipped code at all. This is not a weak assertion — it is a
        property with only one reachable half."}
      blocked_on: {nl: "Fork-G decides whether the affordance is wired for real, stubbed
        behind an injection point, or waived. Only the middle reading makes this test
        writable without a subprocess inside the review's deadline budget."}

  - id: closed_ticket_sampler_is_an_injected_seam
    kind: seam
    form: test
    # [REPAIR-RESOLVED fork-G] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-G: R7 — the ticket-history injection point is added rather than the positive
    #     control waived.
    binds: ["past_tickets", "interacts(challenge_gate->challenger).payload"]
    discharged_by: test_the_closed_ticket_lister_is_a_value_the_challengers_input_builder_is_handed
    # MINTED IN THE REPAIR DELTA — this had no graph entry at all. Without it the demand
    # above has no writable positive control, so a dependency with no seam makes the seam
    # part of the contract, exactly as `review_stages_enter_through_an_injection_seam` did
    # for the three stage calls in the first pass.
    repair:
      type: expected-red
      observable: {nl: "The challenger's input builder takes the closed-ticket lister as an
        injected VALUE, so a scenario can hand it a non-empty result with no subprocess, and
        the built prompt is then inspected for that sample's own content — a parameter whose
        presence is asserted but whose effect on the prompt is never read discharges nothing."}
      was_red_because: {nl: "No such parameter exists; the lister is hardcoded at the call site."}
      blocked_on: {nl: "Fork-G. If the seam lands it must be DEFAULTED — a mandatory
        parameter silently forces every existing test that reaches the challenger indirectly
        to be touched — and the production call site must be shown never to supply it."}

  - id: menu_compliance_stays_unvalidated
    kind: behavior
    form: clause
    outcome: {nl: "The challenger's citations against its exploration menu are not validated, matching the actor precedent this role inherits: no check anywhere reads a cited technique table back against the menu the role was given, and neither judge direction receives a menu at all."}
    binds: ["mitre_menu"]
    rejected: [{nl: "Adding output-side menu-compliance validation was considered and not taken — the human's settled decision fixed the affordances, not their enforcement."}]

  # ---- the verdict arms and the record -------------------------------------------------

  # [REPAIR-CORRECTION] RENAMED from `malformed_output_is_its_own_arm`. The id named the
  # mechanism (a value of its own) rather than the property (infrastructure noise must not be
  # scored as challenger incoherence), and the mechanism is gone while the property is not.
  - id: malformed_output_is_not_scored_as_incoherence
    kind: domain-outcome
    form: test
    binds: ["close_outcome.domain.distinguished[forced-inconclusive]",
            "grace_bound.domain",
            "failure_kind.domain.distinguished[unreadable]",
            "failure_kind.domain.distinguished[incoherent]"]
    discharged_by: test_unparseable_output_never_scores_as_challenger_incoherence
    # The two conditions now share an outcome, so the demand is keyed on what they COST: an
    # incoherent story is re-asked and spends the grace budget, a reply the gate cannot read is
    # terminal on the spot and records an empty requirement list. An implementation that scores
    # unparseable output as incoherence spends a refinement round on a stage that already
    # failed.
    # [REPAIR-CORRECTION — human decision 2] The METRIC half is re-keyed, not retired. The first
    # collapse pass left it on the cause, pinned as "the two write different sentences", and
    # that cannot carry it: "inflating the incoherence rate" is arithmetic over many runs, and
    # prose whose wording this suite deliberately never fixes is not a key a count can group by.
    # It binds the two typed failure kinds instead — the stronger form, and the reason the
    # human granted the vocabulary a member back.

  # [REPAIR-ADDITION — human decision 2] The one vocabulary this collapse ADDS BACK, and the
  # demand that has to justify every member of it. It exists because the collapse took the
  # countable half of "why the finding did not stand" with it: the outcome no longer says, and
  # the cause is a sentence whose wording the spec deliberately leaves free. Four members, each
  # earned by a different response — capacity, a defect, an output contract, and the
  # challenger's own reasoning — and absent entirely when the review did not fail, which is the
  # control that stops the field being set on every close.
  - id: failure_kind_is_typed_and_countable
    kind: domain-outcome
    form: test
    was_red_because: {nl: "The shipped field exists but covers only the two stage-call faults and the unreadable projection, it never reaches report.md at all, and the two conditions the human named — a projection the gate cannot read and a counter-story that never became coherent — both report nothing: the challenger's unparseable reply and the incoherent story each leave it unset, so a count over finished runs cannot separate them. GREEN WHEN: `close_tool` publishes `FAILURE_KINDS`; a challenger reply that will not parse reports `unreadable` and a story that spends its grace budget without becoming coherent reports `incoherent`; and the value lands on the return, the numbered record and report.md's frontmatter alike, absent on every close where the review completed."}
    binds: ["failure_kind.domain.distinguished[timeout]",
            "failure_kind.domain.distinguished[error]",
            "failure_kind.domain.distinguished[unreadable]",
            "failure_kind.domain.distinguished[incoherent]",
            "report_md.payload", "review_record.payload"]
    discharged_by: test_a_failed_review_names_a_typed_failure_kind_the_fleet_can_be_counted_by
    rejected: [{nl: "Leaving the distinction on the cause was rejected at the human seam: the cause is prose for one human reading one case, its wording is deliberately unpinned, and a fleet query cannot group by a string nobody promised to keep stable."},
               {nl: "A member per condition was rejected — it is the ten-value vocabulary arriving through a different door. Each member had to name a different response: an unreadable reply and a hallucinated lead identifier are one member, because in both cases nothing is down and the fix is the prompt or the output contract."},
               {nl: "Recording the value only on the numbered review record was rejected. No shipped code reads that file, so the value would be countable only by this suite; report.md is the artifact the run index and every downstream reader already open, and the two must agree or the answer depends on which file was asked."},
               {nl: "Modelling the no-failure state as a member was rejected: it is the ABSENCE of a kind, and making it a value would let an implementation set the field on every close and still pass a membership check."}]

  # [REPAIR-ADDITION — retirement record for what human decision 1 takes off the report] The
  # demand that used to hold this was `close_result_contract`'s nine-distinct-causes clause, and
  # it is deliberately not executable any more. Recorded rather than dropped, so a later reader
  # finds the cost stated instead of inferring it from a missing assertion.
  - id: per_condition_granularity_is_not_on_the_report
    kind: behavior
    form: clause
    binds: ["report_md.payload", "close_cause", "review_record.payload"]
    outcome: {nl: "report.md is not required to separate every gate condition: the two
      overrides the evidence produces share one cause and name no failure kind, and the three
      shapes of unreadable projection share one cause and one failure kind. A reader who needs
      to know WHICH must open that turn's numbered review record, where the rows and the
      framed diagnostic do separate them, and no shipped consumer reads that file today."}
    rejected: [{nl: "Keeping a cause per condition to preserve the separation was rejected: it re-mints the ten-member vocabulary as ten sentences, and it forces the cause to be composed per condition — which is the composition step a stage's own words get in through."},
               {nl: "Growing the failure-kind vocabulary until it separated them was rejected for the same reason: the two evidence-produced overrides are not failures at all, so no member of that field can honestly hold them."}]

  - id: refuted_and_incoherent_stay_distinct
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "close_outcome.domain.distinguished[stands]"]
    discharged_by: test_a_refuted_story_and_an_incoherent_one_are_distinguishable_on_disk
    # [REPAIR-CORRECTION] Survives the collapse untouched: the two fall on opposite sides of
    # the one split that remains (the disposition stands vs is overridden), and the rounds the
    # incoherent story spent on refinement is the second, independent observable.

  - id: review_record_on_every_arm
    kind: behavior
    form: test
    binds: ["review_record", "close_outcome.domain"]
    discharged_by: test_every_gate_arm_including_the_surviving_story_leaves_a_typed_record
    # [REPAIR-CORRECTION] The cap arm is the one arm this census cannot drive directly, and it
    # was reached by closing three times against a repeating lead. Under
    # `a_fully_overlapping_attempt_spends_no_turn` the second of those closes commits, the cap
    # arm is never taken, and the whole-vocabulary assertion is the only thing that would have
    # noticed. Each of the three attempts now carries its own fresh discriminating lead.
    repair:
      type: strengthened
      observable: {nl: "The record's two substantive fields carry CONTENT that round-trips
        back to what the driven stages actually returned — the challenger's requirement items
        and the projection's rows, inside the untrusted frame — not merely keys that exist.
        Key presence is satisfied by a dataclass field nothing ever assigns, which is what
        the cheating implementation shipped. The two stages' fake replies must be mutually
        distinguishable and each field asserted against its OWN stage's reply, so a swap
        between the two fields fails."}
      scenario: {nl: "The driven input is VARIED and the recorded value must move with it.
        Asserting against a shared fixture literal is green against an implementation that
        writes a constant which happens to equal the fixture — the reading fork-P recommends,
        and the only one of the three that survives an honest-but-wrong implementation."}

  - id: review_record_is_not_half_written
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "review_trace.access[logger_construct]"]
    discharged_by: test_a_fault_mid_review_leaves_nothing_readable_as_a_completed_review
    repair:
      type: strengthened
      observable: {nl: "The DISTINCTION, driven on both arms in one test: a clean close's
        traces carry no incompleteness marker and a faulted close's do. The property is that
        a truncated trace and a finished one DIFFER; an existence check under fault alone is
        satisfied by a marker written unconditionally on every stage call, which is what the
        cheating implementation shipped."}
      scenario: {nl: "The distinction is checked on all three role traces, not only the
        trace belonging to the role the fixture broke — the shipped marker is round-wide, so
        inspecting only the faulting role cannot tell whole-file marking from per-row
        marking. The faulted scenario spans a clean round followed by a faulted one, which is
        what makes retroactive whole-file marking visibly different from per-row marking.
        Any change to the shared trace/record helpers is additive with a default matching
        today's behaviour, so the three sibling tests that read them pass unmodified."}
    rejected:
      - {nl: "Inheriting the nearest existing precedent for this class of write was rejected: it opens and writes in place, uses no atomic rename, and no exception path anywhere removes what a fault leaves behind, while an atomic-write primitive sits in the same module used by a sibling function."}
      - {nl: "Scoping this to the record alone was rejected. A faulted stage always closes its trace logger but writes no incompleteness marker, so a truncated trace and a complete one differ only by having fewer lines — the same mistakable-for-finished shape, on the sibling surface."}

  - id: review_record_lives_beside_the_run
    kind: uniqueness
    form: test
    binds: ["review_record.identity"]
    discharged_by: test_the_review_record_lives_beside_the_run_and_is_written_temp_plus_rename
    # [REPAIR-CORRECTION] Latent: the record path is keyed on the TURN, and with one repeating
    # lead the scenario's "second turn" is a fully-overlapping attempt that spends no turn and
    # commits instead. Its assertions happen to survive that (the committing arm lands on the
    # next number anyway), but the demand would then be evidenced by a run that spent one turn.
    # Two fresh leads make the two turns real.
    rejected: [{nl: "Leaving the sink unnamed was the state this run inherited — the offline sink left with the offline PR, and until one existed the obligation quantifying over the review's outputs had no address at all. RS11 names it: a per-run file alongside the investigation's own artifacts, keyed by run and turn, written temp-plus-rename."}]

  - id: close_write_ordering_holds_the_fault
    kind: uniqueness
    form: test
    binds: ["review_record.identity", "report_md.identity", "review_state"]
    discharged_by: test_the_close_writes_the_record_before_the_report_and_holds_the_fault
    rejected:
      - {nl: "Leaving the close's two writes and its counter mutation unordered was rejected (RS19). Report-first means a crash between them leaves a committed disposition nobody reviewed and no record saying so — on disk, indistinguishable from a close the gate passed. Record-first leaves a record with no report: visibly incomplete, and recoverable."}
      - {nl: "Letting the first fault abort the second write was rejected: the fault is HELD until both writes have been attempted, following the discipline this codebase already applies where a side effect must not be silently dropped by an earlier failure."}
      - {nl: "Treating this as covered by the record's own atomicity demand was rejected — that demand pins that a single write is all-or-nothing, and its test injects the fault before any write happens, so it says nothing about what survives a fault BETWEEN the two."}

  - id: every_review_stage_leaves_a_trace
    kind: behavior
    form: test
    binds: ["review_trace", "review_trace.identity"]
    discharged_by: test_every_review_stage_leaves_a_trace
    rejected: [{nl: "Leaving trace existence unasserted was the state phase F found, and it hollowed out three demands at once. The containment negative, the round-attributability demand and the truncated-trace marker demand all iterate the traces on disk, so an implementation writing none satisfies all three by iterating an empty list — and the trace is one of the four surfaces that negative binds precisely because it sits inside a grant the investigator already holds."}]

  - id: grace_rounds_are_attributable
    kind: behavior
    form: test
    binds: ["review_record.identity", "review_trace.identity", "grace_bound.domain"]
    discharged_by: test_rounds_consumed_per_pass_is_recorded_and_each_rounds_trace_is_attributable
    # [REPAIR-CLOSEOUT] SCOPE, now that the sibling demand below exists: this one observes the
    # counter only where the review COMPLETED. That is not a gap it should have caught — its
    # scenario refines and then succeeds — but it is why a green suite said nothing about the
    # faulting arms, and the boundary is worth naming at the demand rather than inferring it
    # from the scenario.

  # [REPAIR-CLOSEOUT] MINTED AT CLOSE-OUT, on the human's instruction to fix the defect here
  # rather than in the follow-up issue it had been filed as (#788). It is the only demand in
  # this artifact that was written against a defect this run PROVED by execution rather than
  # against a design, and it was written and RUN RED before the three-line fix — the record of
  # that is `red_before_fix_confirmed` in .spec-flow/frontiers-repair/94-final.md.
  #
  # WHY THE FIELD'S OWN DEMAND COULD NOT HAVE CAUGHT IT. The counter is right at its
  # initialization, right at its single increment, and right at both readers — a read
  # instrument checked all four and CR5 passed. The value is WRONG at a construction site none
  # of those four is, and that site is reachable only after a refinement has already happened.
  # The suite's fault-spec could not express "succeed, then fault", so no scenario had ever
  # been past the first round of a failing review, and on the first round zero is the right
  # answer anyway. A blind spot in the DRIVER, not a missing assertion in a test.
  - id: grace_rounds_recorded_are_grace_rounds_consumed
    kind: behavior
    form: test
    binds: ["review_record.payload", "grace_bound.domain", "failure_kind.domain"]
    discharged_by: test_the_recorded_grace_round_count_is_the_number_the_run_actually_consumed
    was_red_because: {nl: "The shared constructor every stage-fault arm returns through wrote a
      hardcoded zero instead of the round it was standing on, so a run that refined once and
      then hit a stage fault, or came back with a projection it could not read, persisted a
      record claiming it had refined none. The third sibling arm — a challenger reply that
      would not parse — did not go through that constructor and recorded the truth, which is
      what made the other two a defect rather than a convention."}
    rejected:
      - {nl: "Widening the sibling demand's scenario instead of minting this was rejected: that demand is about ATTRIBUTABILITY — the record carries a count and each round's trace rows can be told apart — and the arithmetic being right on the arms where the review broke is a different property with a different failure mode. Folding them would have left one test's name promising two things and its scenario driving one."}
      - {nl: "Asserting a literal count per arm was rejected. The expected value is derived from what the challenger fake was actually asked, so the test cannot agree with an implementation that writes back the same literal — and it cannot go stale the way the condition census's hand-maintained count did."}
      - {nl: "Driving the two arms the probe refuted and stopping there was rejected: the same constructor serves a third terminal site (the challenger's own call faulting mid-loop) that the probe never drove, and a repair reaching two of the three would have gone green."}

  - id: all_settled_reads_differently_from_nondiscriminating
    kind: uniqueness
    form: test
    binds: ["review_record.identity"]
    discharged_by: test_an_all_settled_requirement_list_is_readable_as_distinct_from_a_genuinely_nondiscriminating_case

  - id: attacked_disposition_preserved
    kind: behavior
    form: test
    binds: ["review_record.payload", "report_md.payload"]
    discharged_by: test_the_disposition_the_challenger_attacked_survives_beside_the_one_recorded

  # [REPAIR-CORRECTION] RENAMED from `report_reason_key`, and this is the demand the collapse
  # changes most. The frontmatter carried ONE overloaded value and now carries two fields, and
  # the typed-ness that used to keep review-stage prose out of the file by construction is
  # gone with it — so host-authorship is now a property something has to DRIVE. Three
  # conditions are poisoned in exactly the limb whose detail is payload-derived.
  # [REPAIR-CORRECTION — human decision 1] The first collapse pass made this demand's cause a
  # FREE-TEXT field and pinned only that the poisons stayed out. Overruled: the field is now
  # one of the close's own published sentences, and the demand is driven rather than shaped —
  # membership alone is satisfiable by an implementation that picks a sentence and concatenates
  # a stage's words after it. It also gains the record: the diagnostic the report refuses is
  # KEPT there, framed, which is both the human's instruction and the only way the report-side
  # negative has a positive control that the marker ever entered the system.
  - id: report_outcome_and_cause
    kind: shape
    form: test
    binds: ["report_md.payload", "committed_outcome.domain", "close_cause",
            "review_record.payload"]
    discharged_by: test_report_frontmatter_carries_a_typed_outcome_and_a_host_authored_cause
    rejected: [{nl: "Routing the close's own detailed reason into the frontmatter was rejected: it is the challenger's own prose on the decline condition, names model-supplied identifiers on the out-of-list condition, and quotes an unreadable projection row back on a third — and report.md rides verbatim into the judge's prompt and out through the ticket bridge's HTTP egress. It would also put arbitrary bytes into a YAML block whose parse failure fails the whole commit."},
               {nl: "Leaving the cause as free text the host happens to compose was rejected at the human seam. Free text is a shape nothing can check: the same field admits a host sentence and a host sentence with a stage's reply appended, and only the first is host-authored. The cause is drawn from a published set, and the demand drives a marker through each payload-derived limb rather than asserting the field's shape."},
               {nl: "Asserting the cause's WORDING was rejected: a spec that pins the sentence has rebuilt the closed vocabulary under a longer name, which is the thing the collapse removes. The suite reads production's own published set and never spells a member of it."},
               {nl: "Dropping the stage-derived diagnostic entirely — the simplest way to make the report safe — was rejected: which stage failed and what it said would then exist nowhere on disk. It moves to the numbered record, which no prompt reads verbatim, inside the same untrusted frame the record's other stage-derived fields already carry."}]

  - id: three_close_shapes_distinguishable
    kind: domain-outcome
    form: test
    # [REPAIR-RESOLVED fork-A] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-A: R1 — a repair may key a test on a different EXISTING observable when the stated
    #     one does not exist, intent unchanged.
    binds: ["report_md.payload", "close_outcome.domain"]
    discharged_by: test_first_time_close_after_n_challenges_and_forced_inconclusive_are_distinguishable
    repair:
      type: fork
      observable: {nl: "The demand's stated observable has three clauses — the recorded
        disposition, the reason arm, and the COUNT OF TURNS the gate consumed. The first two
        discharge. The third has no address in report.md at all: a first-time close and a
        close committed after two forced turns produce a byte-identical report, same
        disposition, same reason, same body, and the renderer takes no turn count as an
        argument. This is fork-A's sharpest instance — weaken to an observable that exists,
        or accept new implementation scope inside the frontmatter's 512-byte cap."}
      scenario: {nl: "Whatever the observable becomes, the middle shape must be TWO FORCED
        TURNS FOLLOWED BY A SETTLED TAIL, never the bare challenged arm. The committed test
        drives the challenged arm and reads its report — which by design commits nothing, so
        the sibling demand `challenged_arm_forces_a_turn` asserts that very file's absence.
        Two demands cannot both hold; the scenario is the one at fault."}
      # IF THE RECORD-COUNT SUBSTITUTION IS TAKEN, two things must travel with it. The extra
      # record must be OPENED AND READ for that turn's own material, not counted — and PD4/PD5
      # show the numbering is not a property of the run's history at all: every committing
      # arm computes its path from a counter only the non-committing arm advances, so a
      # re-close silently lands on and clobbers an earlier record. Cardinality is a
      # side-effect of numbering that fork-B may change.
      # A NEW REPORT FIELD, if that reading is taken instead, must be driven where the forced
      # -turn count and the grace-round count DIVERGE — CR5 establishes they are different
      # axes, and every persisted record legitimately reads zero rounds-consumed while the
      # tool return reports one forced turn.

  - id: close_is_terminal_for_the_disposition
    kind: behavior
    form: test
    binds: ["investigation_md.access[write_file]", "investigation_md.access[edit_file]",
            "report_md.identity"]
    discharged_by: test_no_post_close_write_can_silently_move_the_recorded_disposition
    # [REPAIR-CORRECTION] THE DEMAND IS HONEST; ITS GATE WITNESS WAS NOT. Its binds never
    # named a second close invocation, and its test calls the close exactly once and then
    # asserts post-close writes to the working document are refused — which is what RS15
    # asked for and what it does. What was false is the R2 pre_discharge witness recorded
    # against `report_md.identity`, which justified keying on the run id alone by calling
    # `close_investigation` its "sole, single-invocation writer per run". No test in the
    # repository was ever written to check that sentence. The uncovered half is now its own
    # demand — `close_commits_at_most_once` — rather than an overclaim on this one.

  - id: close_commits_at_most_once
    kind: uniqueness
    form: test
    # [REPAIR-RESOLVED fork-B] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-B: R4 — a committed close is terminal: the second close is refused and the host's
    #     last-resort close skips an already-closed run.
    binds: ["interacts(main_agent->tool_close_investigation)", "report_md.identity",
            "review_record.identity"]
    discharged_by: test_a_second_close_after_a_committed_one_does_not_re_commit
    # MINTED IN THE REPAIR DELTA, from a 3/3 consensus the dispositions PROMOTED to a fork
    # because closing it is runtime work a human must authorise. The consensus itself is not
    # in doubt: all three copies converged independently that a second close on a run that
    # already committed must not commit again.
    repair:
      type: expected-red
      observable: {nl: "After one close has committed, a second close — the model's, arriving
        through the real tool-calling loop, or the host's own retry-exhaustion handler — does
        not silently replace the recorded disposition, and does not overwrite the first
        close's review record."}
      was_red_because: {nl: "Driven on both arms. A second model close re-runs the whole gate and
        rewrites report.md: a committed `malicious` came back as `benign`, and the model was
        told both closes succeeded with no refusal at any point. The host's last-resort close
        fires after a committed close and replaced `malicious` with `inconclusive`. In every
        case exactly one review record survives, because every committing arm computes its
        path from a counter only the non-committing arm advances — so the first close's
        record is destroyed and a reader cannot tell a double close happened at all, only
        what the last one decided. The already-closed flag exists and is set; it is read in
        exactly one place in the whole runtime, and that place guards the working document's
        write tools, never the close path."}
      blocked_on: {nl: "Fork-B chooses between refusing the second close, making it a silent
        no-op, and allowing it with a per-commit record path — and the third changes
        `report_md.identity`'s key, which every consumer expecting one report per run would
        have to learn. Refusing also needs a defined behaviour for the host's last-resort
        handler, which today is the only thing standing between a stuck model and no
        disposition at all."}
    rejected:
      - {nl: "Treating this as covered by `close_is_terminal_for_the_disposition` was rejected: that demand's binds name the working document's two write cells and the report's identity, its test drives exactly one close, and terminality-of-the-DISPOSITION against a later document write is a different property from terminality of the CLOSE against a later close."}
      - {nl: "Folding the retry limb into this demand was rejected: a close whose report write was REJECTED never committed, so a second attempt is legitimate — but it lands on and clobbers the first attempt's record by the same path arithmetic. `Retry after a failed commit` and `re-close after a successful commit` are different events that today land on the same path, and fork-B must separate them before this demand can say which one it forbids."}

  # ---- failing closed (RS9), extended past the challenger call ------------------------

  - id: gate_failure_policy
    kind: behavior
    form: test
    # [REPAIR-RESOLVED fork-O] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-O: R5 — any projection output the classifier cannot read is a review failure,
    #     unparseable text and wrong-shaped JSON rows alike; a legitimately empty projection
    #     keeps its own arm.
    binds: ["interacts(challenge_gate->challenger).response",
            "close_outcome.domain.distinguished[forced-inconclusive]", "close_cause"]
    discharged_by: test_a_review_that_cannot_complete_does_not_silently_commit_the_close
    # [REPAIR-CORRECTION] "The review failed" is carried by the typed `failure_kind` now, which
    # is a better home than a spelling was — it is already its own closed vocabulary
    # (timeout / error / unreadable) and it sits on both the return and the record. The half
    # the old arm carried that a machine cannot recover — that a broken review must not READ
    # like a finding about the evidence — is pinned as a distinction between the two causes.
    repair:
      type: expected-red
      observable: {nl: "Under the same unparseable-return fault its sibling drives, the close
        does not COMMIT — no report is written. This is a second, distinct symptom of the
        same bug: the evidence-cannot-speak arm commits a report, so a fix that only
        re-labels the outcome greens the sibling and leaves this one red. Both are needed."}
      was_red_because: {nl: "Same cause as the sibling. Kept a separate demand because the two
        failures are independently repairable and independently wrong."}

  - id: fail_closed_covers_every_review_stage
    kind: behavior
    form: test
    # [REPAIR-RESOLVED fork-O] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-O: R5 — any projection output the classifier cannot read is a review failure,
    #     unparseable text and wrong-shaped JSON rows alike; a legitimately empty projection
    #     keeps its own arm.
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->coherence_checker).response",
            "interacts(challenge_gate->projection).response",
            "close_outcome.domain"]
    discharged_by: test_any_review_stage_that_cannot_complete_closes_the_case_unresolved_with_its_reason
    repair:
      type: expected-red
      observable: {nl: "A projection stage that RETURNS content the gate cannot parse yields
        the review-failed outcome with a named failure kind — not a finding about the
        evidence. Two fault shapes are driven in the same change: unparseable text, and valid
        JSON whose rows lack the fields the classifier reads. Every fault the committed test
        injects today is the stage CALL failing; no scenario in it drives a stage that
        returns something the gate then cannot read."}
      was_red_because: {nl: "The fail-closed guard covers the stage call; the parse step after it
        has its own swallowing handler that degrades a garbage reply to zero rows, which
        classifies as evidence-cannot-speak with no failure kind. An unreadable review is
        recorded as a conclusion about the investigation. Fixing this is runtime work."}
      blocked_on: {nl: "Fork-O is where the policy STOPS, and the three readings accept
        different implementations: a legitimately empty projection keeping its current
        classification (the case fork-E also turns on, and the point both paths share), versus
        a fault in the CLASSIFICATION step after the parse being deliberately outside the
        handler. A repair written against one does not satisfy the other."}
      # Unrun: whether any of the 71 collected tests already drives a parseable-but-rowless
      # projection (PO33).
    rejected: [{nl: "Writing the policy over the challenger call alone was rejected — three calls run per attempt, two of them concurrently, and a critic-only or oracle-only fault in the same window would be uncovered."}]

  - id: review_roles_mint_their_own_salt
    kind: seam
    form: test
    binds: ["run_salt.access[stage_bind]", "run_salt.access[main_gather_bind]"]
    discharged_by: test_a_review_roles_bind_mints_a_fresh_salt_and_never_receives_the_sessions
    rejected: [{nl: "Precedenting the review roles on the gather bind, which explicitly threads the investigation's own salt, was rejected. Salt inheritance is not a general property: the gather bind is the sole shared-salt case in the tree and every learning stage mints its own. Inheriting the session salt would hand a role that reads attacker-influenced payloads the delimiter of the frame its own output returns inside."}]

  - id: misconfigured_review_role_fails_before_the_investigation_pays
    kind: behavior
    form: test
    # [REPAIR-RESOLVED fork-A, fork-C] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-A: R1 — a repair may key a test on a different EXISTING observable when the stated
    #     one does not exist, intent unchanged.
    #   fork-C: R2 — the model-override split is one of the four shipped bugs fixed in this PR;
    #     the override reaches the review stages.
    binds: ["role_registry.domain.distinguished[built-fresh-per-stage-invocation]",
            "model_preflight.domain.distinguished[hardcoded-to-main-and-gather]",
            "model_preflight.domain.alternatives[raises at agent build]",
            "close_outcome.domain"]
    discharged_by: test_a_review_role_with_no_usable_model_config_fails_at_startup_not_once_per_investigation
    repair:
      type: strengthened
      observable: {nl: "Startup preflight FAILS NAMING THE ROLE when a role outside the
        pre-change main-and-gather pair has an unusable model config — driven through that
        role's own model environment knob set to a name no provider claims. A two-role
        preflight returns success on that input, so a bare non-zero return discriminates
        nothing: an unrelated startup fault produces the identical exit code. This leg needs
        no key isolation, because the provider lookup fails before any key is read."}
      scenario: {nl: "If the key-absence leg is kept it must clear the ambient provider
        variable AND both `.env` fallbacks — the repo root's and the main checkout's, reached
        through git's common directory — not merely point the explicit-file variable at an
        absent path. As committed the leg does not isolate and passes only where no `.env`
        exists. Before any `every role` claim, the test must also confirm the imported
        registry resolves to the WORKTREE's copy: the main checkout holds its own copy of the
        package and a run whose working directory is the main checkout silently loads it.
        Prefer the module-path form of that guard over the role-count form — two open forks
        can move the count."}
      # [REPAIR-CORRECTION] THE DEFECT LEDGER'S MECHANISM SENTENCE IS WRONG IN A WAY THAT
      # MOVES THE OBSERVABLE. The shipped preflight does iterate every registered role, but
      # it DE-DUPES the key check by provider identity and all ten roles resolve to one
      # provider — so exactly one key check runs, whatever the role count. "A review role's
      # key is checked" is not an observable that exists. What runs per role is the
      # model-accessor and provider-resolution step, which is why the observable above is a
      # model NAME no provider claims rather than an absent key.
      # AND THE DEMAND'S OWN SUBJECT HAS NO ADDRESS. The two review roles have no model knob
      # of their own — they read the investigator's — so misconfiguring a review role
      # necessarily misconfigures the investigator, and the preflight blames the investigator.
      # The property is real and testable for OTHER roles and untestable for the subject this
      # demand names; substituting an offline role is exactly what fork-A governs.
      # [REPAIR-CLOSEOUT] THE LAST CLAUSE OF THIS PARAGRAPH IS SPENT. It used to warn that
      # fork-C left the preflight validating a model the run would not use, so a substituted
      # test would green on a check blind in a way nobody had written down. The preflight's
      # subject moved to the model the run actually uses, and that move is now ratified — so
      # the check is no longer blind and the warning describes a state that does not ship.
    rejected:
      - {nl: "Relying on the agent build to raise was rejected as provider-dependent: one provider family raises immediately on a missing key, another performs no key check at all and defers to the first live API call. A demand written against `fails at build` would be silently true for one provider and silently false for the other."}
      - {nl: "Leaving the failure to first use was rejected because of what it composes with: the agent is built fresh on every stage call and the gate fails closed, so a misconfigured role does not stop the fleet — it downgrades confident investigations to unresolved one at a time, after each has already paid its full budget."}

  - id: review_stage_timeout_is_explicit
    kind: seam
    form: test
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->projection).response"]
    discharged_by: test_each_review_stage_call_carries_an_explicit_timeout_a_test_can_drive
    rejected: [{nl: "Assuming a timeout already wraps a stage call was rejected, and the stage-hang probe settled it in both directions: the live tool-body-awaits-a-subagent path carries no wall-clock bound at all (PS1), while the offline stage runner wraps every call in a per-role env-backed one (PS2). No seam wires either to the review stages, so which one they take is a design choice rather than an inheritance — which is why the deadline is threaded as a value a scenario can set."}]

  - id: review_stages_are_wall_clock_bounded
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->challenger).response",
            "interacts(challenge_gate->projection).response",
            "interacts(challenge_gate->coherence_checker).response"]
    discharged_by: test_a_stage_that_never_returns_is_bounded_by_wall_clock_not_a_request_count_cap
    rejected:
      - {nl: "Inheriting the precedent nearest to the review stages was rejected. The live path that already awaits a subagent from a tool body — structurally the same shape the close tool's review runs in — bounds itself with a request-COUNT cap and two structured-failure catches, none of which can fire while a single call is simply still pending (PS1). A hang there hangs forever."}
      - {nl: "Pinning `a limit exists` rather than `a wall clock ends a pending call` was rejected for the same reason: the count cap satisfies the weaker sentence and still hangs. The bound to copy is the offline stage runner's per-call wall clock (PS2), which is real and working but sits on a structurally distant call path, so citing it as `a deadline already exists` would overstate the case."}
      - {nl: "Relying on a client- or SDK-level timeout was rejected: this tree configures none on either provider path (PS5), so whatever bound would eventually apply is an unexamined library default rather than a property this codebase guarantees."}

  - id: stage_deadline_default_is_exercised
    kind: domain-outcome
    form: test
    binds: ["stage_timeout.domain.distinguished[450]"]
    discharged_by: test_the_review_stage_deadline_defaults_to_450_seconds_and_is_env_overridable
    rejected:
      - {nl: "Minting a fifth per-role number was rejected: 450 already exists as this tree's generic subagent default, and the merged pilot measured a gate firing at roughly three to five minutes on an eleven-lead case — so 450 is about 1.5x the observed worst case. Ordinary slowness will not trip it, which is what keeps the timeout-versus-failure distinction a signal rather than noise; the tree's 1800-second authoring values would sit outside an analyst's tolerance for a blocked live investigation."}
      - {nl: "Recording the number in prose was rejected. This run has already established that a prose bound does not discharge the obligation to exercise a real value — that is exactly why bounds_reject_zero could not stay a clause — so the default is driven, not stated."}
      - {nl: "A literal at the call site was rejected in favour of an env-backed accessor with the value as its default, matching how every sibling per-role deadline in this tree is expressed, so the number stays operator-changeable without a code change."}

  - id: stage_deadline_is_not_the_subagent_knob
    kind: negative
    form: test
    binds: ["stage_timeout.domain", "subagent_timeout.domain"]
    discharged_by: test_moving_the_generic_subagent_deadline_does_not_move_the_reviews
    rejected: [{nl: "Reading the review deadline off the existing generic subagent knob was rejected. The reuse is a coincidence of VALUE, not a shared setting: the two hold the same number today, so a later change to the offline knob would move the live gate's deadline invisibly — the agreement is precisely what would hide the coupling until it mattered. Same number today, independent controls."}]
    # Its positive control is `stage_deadline_default_is_exercised`, on the same root under the
    # complementary condition: the review's OWN knob does move the review's deadline. Without
    # that pairing this negative is also green against an accessor that ignores its environment.

  - id: timeout_and_failure_are_distinguishable
    kind: uniqueness
    form: test
    binds: ["review_record.identity",
            "close_outcome.domain.distinguished[forced-inconclusive]"]
    discharged_by: test_a_timed_out_review_is_observably_distinct_from_one_that_failed
    # [REPAIR-CORRECTION] Untouched by the collapse, because it never rested on the arm: its
    # own rejected branch refused "a tenth arm for the timeout case" and put the distinction on
    # a typed field. That field is now what carries the failure/finding split as well.
    rejected:
      - {nl: "Inheriting the existing bound's observability was rejected: where a deadline does fire, its branch and the generic-exception branch raise the identical exception type, separated only by a message substring and a `__cause__` no caller reads, and every catch site in the tree treats it as one blanket type (PS4). The gate would be unable to tell a slow model from a broken one — a capacity problem from a defect."}
      - {nl: "A tenth arm for the timeout case was rejected. RS9 is settled: any review that cannot complete fails closed on the declined arm with its reason, and minting a new arm here would re-open a human decision to solve an observability problem. The distinction is carried as a typed field on the recorded reason and on the review record — which is what RS5 pins the record for — rather than as a new outcome."}
      - {nl: "Folding this into `review_stages_are_wall_clock_bounded` was rejected, and the two are deliberately separate demands: a bound can exist and still be indistinguishable from a crash, which is exactly the state the probe found on the one path that has a bound. One demand asserts the bound fires; the other asserts the fleet can read which of the two things happened. Satisfying the first tells you nothing about the second."}

  # ---- minted by the REPAIR's human seam (70-resolutions-repair.md) -------------------
  # Eight demands the resolutions create. Each names the resolution that authorised it and
  # each is EXPECTED RED: the tests exist and the shipped code does not satisfy them.

  - id: host_forced_close_respects_a_committed_close
    kind: negative
    form: test
    binds: ["report_md.identity", "review_record.identity", "close_outcome.domain"]
    discharged_by: test_the_hosts_last_resort_close_skips_a_run_that_already_closed
    was_red_because: {nl: "The driver's retry-exhaustion handler forces an unresolved close
      through the same commit path, with no read of the already-closed flag. Driven, it
      replaced a committed `malicious` with `inconclusive` and destroyed the first close's
      review record."}
    # [REPAIR-RESOLVED fork-B, fork-L] R4. The handler is not withdrawn — it is the only thing
    # between a stuck model and no disposition at all — it is made aware of the close it would
    # overwrite. Accepted cost, recorded: a run that errors AFTER closing keeps its
    # disposition and the error survives only in logs, not in the case record.
    rejected: [{nl: "Withdrawing the host-forced close was rejected: a stubborn model would then leave no disposition at all, which is the case that handler was added for. Letting it overwrite was rejected because a committed disposition that a later close silently rewrites is O1's failure clause in its sharpest form."}]
    # Its positive control is `stubborn_model_closes_unresolved`, on the same address under the
    # complementary condition: on a run that never closed, the identical retry exhaustion DOES
    # produce the forced unresolved close.

  - id: a_fully_overlapping_attempt_spends_no_turn
    kind: negative
    form: test
    binds: ["review_state", "close_outcome.domain.distinguished[challenged]",
            "close_outcome.domain.distinguished[forced-inconclusive]",
            "close_cause", "report_md"]
    discharged_by: test_a_second_attempt_whose_discriminators_were_all_already_raised_spends_no_turn
    was_red_because: {nl: "With every discriminating lead already raised the gate still takes the
      challenged arm, still advances the turn counter, and hands back a message saying there
      is nothing new to investigate — the forced turn's tax without its probe."}
    # The partial-overlap case is covered by `forced_turn_raises_a_new_gap`; this is the FULL
    # overlap case, which is the one that costs the investigation a turn for nothing.
    #
    # [REPAIR-RESOLVED — the human chose this reading over the shipped one] Four committed
    # green tests drove a fully-overlapping second attempt and required the opposite (the turn
    # IS spent), because each scripted ONE discriminating lead and let the projection fake
    # repeat it. NONE was retired: every one of them pins something this reading does not
    # contradict — the forced-turn bound, the per-run counters, the review's cost against the
    # request ceiling, and that every arm leaves a typed record. What the reading kills is
    # their SCENARIO, so each now scripts one genuinely new lead per attempt
    # (`one_fresh_lead_per_turn`). Three more scenarios were latent rather than broken and are
    # repaired the same way: the injected-cap knob, the per-attempt grace reset and the
    # numbered record series each had TWO reasons an attempt could decline to gate, and which
    # one an implementation checked first decided whether they passed.
    #
    # The forced-turn count is now VARIABLE — a run can terminate before the bound, as soon as
    # an attempt has nothing new to ask — so no scenario may assume a fixed number of turns.
    #
    # This demand is now the sole holder, so its test refuses the three near-misses itself: a
    # skip keyed on the reply repeating rather than on the leads having been raised; a skip on
    # any overlap rather than on full overlap; and a skip that routes into an arm recording
    # that the evidence did not discriminate, which is false on this run. WHICH arm the
    # no-turn attempt takes is deliberately left open — no resolution asked for a new one.
    rejected: [{nl: "Treating full overlap as a special case of partial overlap was rejected: the existing demand's assertion is that the second turn's leads are DISJOINT from the first's, which is satisfied while the gate spends a turn on an empty set."},
               {nl: "Retiring the four conflicting tests was rejected on inspection. Their intents — the bound, the per-run counters, the review's cost, the all-arms record census — are orthogonal to this reading and survive it intact; only their single-repeating-lead scenario is contradicted, and a scenario is repairable where an intent is not."}]

  - id: refinement_round_carries_its_own_context
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload", "grace_bound.domain"]
    discharged_by: test_a_refinement_round_carries_the_prior_story_and_the_gap_the_check_named
    was_red_because: {nl: "The challenger's prompt is built once before the loop and re-sent
      verbatim on the refinement round, so the round is a contextless retry of the identical
      question and the rounds-consumed signal measures nothing."}
    rejected: [{nl: "Leaving the round as a plain retry was rejected: rounds-consumed is the design's only stated evidence-strength signal, and a re-ask that carries neither the story that failed nor the inconsistency that was named makes a refined pass indistinguishable from a lucky one."}]

  - id: lead_projection_keys_on_the_declared_header
    kind: shape
    form: test
    binds: ["interacts(challenge_gate->challenger).payload", "investigation_md"]
    discharged_by: test_the_lead_table_is_read_by_its_declared_header_not_by_column_position
    was_red_because: {nl: "The projected lead block reads fixed column POSITIONS and discards the
      header's own column-name declaration. Driven: swapping two columns in both the header
      and the rows silently relabels a lead's target as its name, with no exception and no
      mismatch signal."}
    # [REPAIR-RESOLVED fork-I] R7. The observation-layer cut is the one input-selection
    # decision already settled, and it is computed over a document the investigator itself
    # authors — so keying it on positions makes the guarantee depend on a convention the
    # document's own author controls.
    rejected: [{nl: "Validating the declared column order and failing loudly on a mismatch was rejected in favour of keying on the header: a new failure arm buys nothing a name lookup does not, and it makes any future format change a runtime error rather than a no-op."}]

  - id: projection_leads_are_a_subset_of_the_executed_list
    kind: negative
    form: test
    binds: ["interacts(challenge_gate->projection).response",
            "close_outcome.domain.distinguished[forced-inconclusive]"]
    discharged_by: test_a_projection_naming_a_lead_the_investigation_never_executed_fails_the_review
    was_red_because: {nl: "Nothing checks the identifiers coming back against the executed-lead
      list the host itself put in the prompt. An invented identifier flows into the
      discriminating set and is handed to the investigator as a lead to go investigate."}
    # [REPAIR-RESOLVED fork-Q] R7. The bound the outbound list already implies, made real.
    rejected: [{nl: "Recording this as out of scope was rejected: a hallucinated lead is indistinguishable from a real one at exactly the seam where the gate spends the investigator's turn, which is O2's failure clause reached from a direction no demand covered."}]
    # Its positive control is the in-list arm of the same test: a projection naming only
    # executed leads reaches the challenged arm and does hand its material back.

  - id: projection_stage_has_its_own_role
    kind: seam
    form: test
    binds: ["projection", "drives(challenge_gate->projection)"]
    discharged_by: test_the_projection_stage_runs_under_a_role_of_its_own
    was_red_because: {nl: "The live projection stage is the challenger's own role definition
      re-bound at one call site. The role enum, the registry, the policy-compile surface and
      the startup preflight each count two review roles, so the `oracle` address joins by name
      to the OFFLINE learning oracle — a different thing, and the worst kind of wrong join,
      because it resolves."}
    # [REPAIR-RESOLVED fork-F] R6. This is what makes the two demands binding an `oracle`
    # address resolve to something real. The consequence is not bookkeeping: the
    # direction-conditional exploration affordance already settled for the challenger names,
    # by construction, the side being argued — so the next edit to the challenger's role leaks
    # the direction into the stage the design built to be blind.
    rejected: [{nl: "Pinning blindness by test and keeping the reuse was rejected: the guarantee would live in prompt text, reachable by an edit to a different role that nobody would think to review against this."}]

  - id: model_override_reaches_the_review_stages
    kind: behavior
    form: test
    binds: ["model_preflight.domain", "run_investigation"]
    discharged_by: test_the_operators_model_override_reaches_the_review_stages
    was_red_because: {nl: "The review stages resolve their model through a zero-parameter function
      — structurally incapable of receiving the operator's per-run override — which also keeps
      a second hardcoded home for the shipped default, citing an import cycle. Driven both
      ways: a broken override passed the real startup preflight clean while the investigator
      was about to run on it, and changing the override never moved any review stage's model."}
    # [REPAIR-RESOLVED fork-C] R2 names the model-override split as one of the four shipped
    # bugs this PR fixes.
    rejected: [{nl: "Declaring the split deliberate and pinning it was rejected: it leaves the startup preflight validating a model the run will not use, and it does not close the second home for the default, which drifts the first time that default moves."}]

  - id: every_stage_trace_reply_is_framed
    kind: negative
    form: test
    binds: ["review_trace", "interacts(challenge_gate->coherence_checker).response",
            "interacts(challenge_gate->projection).response"]
    discharged_by: test_every_review_stages_own_trace_reply_is_framed_not_only_the_challengers
    was_red_because: {nl: "The coherence checker's and the projection's replies are logged as
      ordinary JSON fields on the stated premise that neither is payload-derived prose. That
      premise was falsified by execution: forced to carry prose, both land byte-for-byte raw
      on disk."}
    # [REPAIR-RESOLVED fork-J] R7. `counter_story_absent_from_session` narrows to the cell it
    # actually tested; these are the two cells it was passing vacuously on. Nothing escalates
    # — all three roles hold zero read and zero bash grant against the compiled policy — so
    # the exposure is to whoever READS the traces later, not to the file system.
    rejected: [{nl: "Accepting this as a filed out-of-scope gap was rejected: the same bytes coming back wrapped on one route and bare on another is precisely the shape a uniform-framing claim is supposed to exclude, and the demand that claimed to cover the surface was green while two thirds of it was unchecked."}]
    # Its positive control is the challenger's own trace cell in the same test: that reply
    # does carry its prose, framed.

structure:

  axes: [run_id, direction, lead_id, turn, round, stage]

  actors:
    - {id: run_investigation, frame: leg, provenance: code}
    - {id: main_agent, frame: leg, provenance: code}
    - {id: tool_write_file, frame: leg, provenance: code}
    - {id: tool_edit_file, frame: leg, provenance: code}
    - {id: tool_close_investigation, frame: leg, provenance: design}
    - {id: challenge_gate, frame: composition, provenance: design}
    - {id: challenger, frame: leg, provenance: design}
    - {id: coherence_checker, frame: leg, provenance: design}
    # [REPAIR-CORRECTION] provenance was `code`, on the reading that the live projection
    # stage reuses the existing offline oracle. PM6 refutes it: there is no live projection
    # role anywhere — the stage is the CHALLENGER's role definition re-bound at one call
    # site, and the role enum, registry, policy-compile surface and startup preflight each
    # count two review roles. `code` routed the fix to an existing module that has nothing to
    # do with it; `design` routes it where fork-F will decide it.
    - {id: projection, frame: leg, provenance: design}

    # ================= THE FOUR EXECUTION CONTEXTS THE CENSUS FOUND =================
    # [REPAIR-CLOSEOUT] `spec-graph actors` fired for the first time in this delta, because
    # this is the first pass with real production code to check a driver census against. Four
    # entrypoints reach the changed subsystem with no actor naming them. The human's decision
    # was to MODEL all four rather than waive any, and the two subprocess ones were probed
    # rather than guessed — the census reports a stem, not a route, and the route is the
    # whole difference between "imports a dataclass" and "runs the gate for real".
    #
    # None of the four is a design consumer. They are execution frames, which is exactly the
    # class the design-grounded actor list structurally cannot produce: the census derives
    # them from the repository.
    #
    # PROBED, per driver (shortest import path resolved over the project graph; the
    # subprocess arm read at its argv construction site):
    #
    #   lead_author   — in-process, three hops, and the LAST hop is the only changed module
    #                   it reaches: the agent-definition seam. What changed there is one
    #                   defaulted boolean on the tool-set record. Default false, so nothing
    #                   this driver builds acquires the close tool and no behaviour of its
    #                   own moves. It is modelled because the reach is real, not because the
    #                   exposure is.
    #   run_judge_ab  — in-process, same terminus by a different chain (through the judge's
    #                   engine), same one-field exposure. Neither driver imports the agent
    #                   REGISTRY, so the three new review roles are not in either's frame.
    #   harness_lead  — no in-process reach at all. It COPIES THE TREE INTO A TEMP DIRECTORY
    #                   and re-executes the copy's own lead-author entrypoint there. This is
    #                   the relocated-anchor hazard the check exists for, in its literal
    #                   form: any module-level path this delta anchors at the checkout is
    #                   anchored at the copy inside this frame, and the delta added such an
    #                   anchor (the key resolver's main-checkout fallback, CR2/PO23 — which
    #                   resolves through git's common directory and therefore does NOT follow
    #                   the copy). Recorded as the standing hazard it is; nothing in this
    #                   delta is known to break there, and nothing has driven it either.
    #   generate_case — no in-process reach, and the sharpest of the four: it re-executes
    #                   `defender/run.py` — the whole live investigation entrypoint — as a
    #                   subprocess against the REAL checkout. That is the one frame in the
    #                   census that drives this delta end to end for real: the close tool,
    #                   the gate, all three review stages, live providers, no fakes. Every
    #                   demand in this graph is exercised there and none is observed there.
    #
    # WHY NONE OF THE FOUR MINTS A DEMAND. The two in-process reaches terminate at a
    # default-false field; the two re-exec frames are hazards this graph does not cover and
    # cannot cover from a hermetic suite — a test that drives them either copies a tree or
    # bills a provider. Modelled so the census stops reporting them as blind, and so the
    # `generate_case` frame is on the record as the place a regression in this delta shows up
    # first and is observed last.
    - {id: lead_author, frame: leg, provenance: code}
    - {id: run_judge_ab, frame: leg, provenance: code}
    - {id: harness_lead, frame: composition, provenance: code}
    - {id: generate_case, frame: composition, provenance: code}

  boundaries:

    - id: report_md
      provenance: code
      note: "The run's durable disposition. Exactly one production writer today (the
             model's write and edit tools); seven production consumers hard-fail on its
             absence. R1 replaces the writer, which is why the access facet is keyed by
             all three vias that can reach it."
      facets:
        payload:
          parts:
            - {role: system, source: const:REPORT_FRONTMATTER_SCHEMA}
            - {role: user, source: template:REPORT_BODY,
               slots: {disposition: disposition.domain,
                       outcome: committed_outcome.domain,
                       cause: close_cause,
                       failure_kind: failure_kind.domain}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "The report is a host-validated frontmatter block over a body. The `role`
               column is the chooser: `system` is host-composed and `user` is
               model-supplied, which is the distinction the rendered-sink walk needs.
               [REPAIR-CORRECTION] The single overloaded `reason` slot became three: a typed
               `outcome` from the committed vocabulary, a `cause` sentence for a human, and a
               typed `failure_kind` for a count. Every one of the three is chosen by the host
               from a closed set — the `user` role on this part is now a misnomer the walk
               should read as `host`, because after R1 the model has no route to this file at
               all. The split is where the rendered-sink risk lives: a cause taken from the
               close's own detailed reason would carry challenger- or projection-derived text
               into a file that leaves the system, so a demand drives a marker through each
               payload-derived limb and reads the whole file back for it.
               [REPAIR-CLOSEOUT] WHICH HALF OF THE FILE EACH SLOT LANDS IN, since the ticket
               bridge transmits the body alone and the judge's prompt takes both: `cause` is a
               FRONTMATTER key and nothing else. It was briefly written into the body too — the
               delta's one unrequested deviation — and the human directed that removed, so the
               body carries the disposition and the typed outcome. Nothing about the
               rendered-sink obligation moves: every limb of both halves is host-chosen, and
               the marker negative reads the WHOLE file, not the frontmatter."
        identity:
          key_axes: [run_id]
          evidence: {nl: "Read off the run-paths accessor: the report is `<run_dir>/report.md`,
                     one per investigation, and the repo-wide sweep for the artifact name
                     found no second WRITER. [REPAIR-CORRECTION] One writer is not one WRITE:
                     driven, a second close call — the model's through the real tool loop, or
                     the host's own retry-exhaustion handler — re-runs the gate and rewrites
                     this path, replacing a committed disposition with a different one and
                     returning an ordinary success message. The key is still `run_id`; what
                     was wrong is the sentence that made `unique-key` sound like a fact. It is
                     a REQUIREMENT now, carried by `close_commits_at_most_once`, and it is
                     expected-red until fork-B is settled and the code changes."}
