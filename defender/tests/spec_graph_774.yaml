  - id: ceiling_is_bound_to_the_turn_cap
    kind: behavior
    form: test
    was_red_because: {nl: "The base is a module constant with no path through the entry point, so the ceiling's two terms cannot be moved independently and a live read is indistinguishable from a restated literal. R3 makes the base a value the bounds object carries; until it is, the repaired test cannot even construct its input."}
    # [REPAIR-RESOLVED fork-H] settled at the human seam; see
