handoff:

  forks:
    - "The gate's return CHANNEL and its framing. A refused write returns raw and unwrapped
       today; the only precedent for a refusal carrying payload-sourced text inside
       containment lives on a different tool family. Recommended: frame the return with a
       FRESH per-invocation salt, which costs nothing new — the bind path already falls back
       to a fresh value and three offline stages already mint their own."
    - "The delimiter escape, now NARROWED. The wrap still does no content inspection, so a
       reader that has seen a salt can close that frame — but salt inheritance turned out not
       to be general: only the live gather bind shares the session's salt, and every learning
       stage mints its own. The remaining decision is which precedent the review roles are
       built on, and `review_roles_mint_their_own_salt` makes the wrong answer fail a demand
       rather than stay a fork. Do not dispatch a probe leaf for what is left; it is a
       construction choice."
    - "The discriminator rule. The design says the oracle's silent rows and explicitly NOT a
       generated artifact; the merged pilot's load-bearing result is a generated
       unsettled-requirement list. Provisionally pinned as the JOIN — silence measured against
       declared-unsettled requirements — which is a decision, not a reading. All three
       answering copies converged on one side of it without noticing. NARROWED, not closed, by
       RS13: the degenerate arm is settled, but which half of the join the gate KEYS on is still
       a design call the spec pins provisionally."
    - "A model told why its close was refused can downgrade its own finding to unresolved and
       skip the gate entirely. The coverage question this sits inside is now WAIVED, examined
       and accepted (`unresolved_runs_are_reviewed_by_nothing`); the downgrade path is the half
       of it that is a behaviour rather than a coverage policy, and it stays here."
    - "Stage tool grants are still not modelled as a boundary with an access facet. With no way
       to express a stage's grant as a boundary, no rule can ask whether framing is applied
       uniformly across a stage's read routes — which is how the same bytes come back wrapped on
       one route and bare on another. Out of scope for this issue; the fix belongs in the
       coverage graph's own vocabulary, and it should land before a fourth `faults no lens
       owned` pass is commissioned against this pipeline."
    - "The 'pass' convention is pinned challenger-side throughout; one obligation's sentence
       uses it investigation-side and reads inverted under this pin."
    - "The old offline legs' retirement was scheduled for this PR because the offline PR
       replaced them in the drain. That PR is gone; retiring them now leaves nothing doing
       offline learning."
    - "No A/B or kill switch at runtime. That non-obligation was accepted on the ground that
       the offline PR recovered attribution; the gate now goes live on every confident close,
       unmeasured, with no runtime off-ramp."
    - "The secondary-evaluation harness's fate, due by this PR."
    - "Whether the absence of the offline leg changes the unresolved-coverage question the cold
       review raised."

  refuted:
    - "The design's central mechanism. `Reject the write, force another turn` has no framework
       support: a tool refusal is a raw retry, the budget is 10, and the eleventh raises an
       error no driver handler catches. Correction folded in: the gate's own cap sits below
       the retry budget and a driver handler catches exhaustion, forcing the unresolved close
       rather than killing the run."
    - "The blinding decision as an INPUT decision. At write time the challenger's run dir is
       the investigation's dir and both grant surfaces admit it unconditionally, so narrowing
       read roots discharges nothing. Correction: no file-read grant at all."
    - "Dropping only the concluding block as the observation-layer cut. Three of three real
       completed documents restate the reached verdict in kept blocks."
    - "The grace-round trace hazard as stated. Rounds APPEND rather than overwrite in-process;
       the real hazard is colliding record ids across rounds with no field marking the
       boundary."
    - "The cold review's REASON for retracting `shared and untouched` — the conclusion reaches
       the judge through the per-role invocation builder, not the shared per-lead assembly.
       Its fix still stands."
    - "The containment argument that made payload-derived counter-story prose acceptable
       — `nothing consumes the record` — does not survive going live."
    - "The inherited test census count: 72 files and 14 coverage graphs, not 71 and 13."
    - "Salt inheritance as a general property of subagent binds. The live gather bind is the
       sole shared-salt case; every learning stage mints its own and two stage entrypoints
       cannot accept a threaded one. A design assuming the stages already share one salt
       within a case cycle is assuming something that is not true today."
    - "The fail-fast model preflight as a live safeguard. It is unreachable from either live
       entrypoint, the live preflight is hardcoded to two roles, and no all-roles scan exists
       anywhere. A new role's bad config surfaces at first use — and even `first use` is not
       one failure point: one provider raises at agent build, another performs no key check
       at all and defers to the first API request."

  deferred:
    - "The path census over the gate's own return (K31) — it cannot run until the return path
       exists; write-code-from-spec probes it."
    - "Whether a grace-round loop stays inside one process (PC8) — no implementation exists to
       read."
    - "Whether a payload can steer the challenger into suppressing a genuine challenge — needs
       an adversarial eval against a built challenger, not a code read."
    - "Whether a split delimiter can form at a seam between two assembled sections — cannot be
       read against a render step that does not exist; it is a specification obligation on
       that step."

  drops:
    - "The grounding brief's per-direction filename collision hazard — at write time exactly
       one counter-direction is selected, so the concurrent-leg collision is absent."
    - "The grounding brief's declared-manifest fail-open finding — the transcript manifest is
       not the live gate's observable."
    - "21 forks from the offline pass — the corpus, the sweep mechanism, re-invocation over a
       finished run dir, the curators-unwired interim guarantee and its time-box, per-direction
       record collision, and the offline leg's fault isolation. Superseded by the scope change,
       not answered; the offline dispositions frontier holds them intact if it is ever revived."

  deviations:
    - "The re-grounding probe landed after the first assembly pass and was folded in as a
       second pass: four `unknown` slots became settled values, two of its results were
       refutations, and each refutation minted a demand."
    - "Claim verdicts were normalized to the artifact's closed vocabulary; the nuance the input
       frontiers carried in non-vocabulary verdicts (`holds-as-corrected`,
