       same variable in the fake's reply and in the assertion, versus constructing them
       independently, versus driving a SECOND case with different content and showing the
       recorded value moves. Only the third catches an implementation that writes a constant
       which happens to equal the fixture. RECOMMENDED ON INTENT, NOT ON SPREAD: independent
       expectation, committed-body containment, vary-the-input — each is the reading that
       survives an honest-but-wrong implementation, and each is written into the corresponding
