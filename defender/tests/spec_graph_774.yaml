  # ---- when the gate fires, and what it does -----------------------------------------

  - id: gate_skips_inconclusive
    kind: domain-outcome
    form: test
    binds: ["disposition.domain.distinguished[inconclusive]",
            "close_outcome.domain.distinguished[stands]"]
    discharged_by: test_a_draft_inconclusive_close_commits_without_invoking_the_gate
    # [REPAIR-CORRECTION] The retired `closed-unchallenged` value is not what made this
    # condition legible — the test's own assertion that NO review stage was driven is, and it
    # always was. The value is now shared with every other condition that leaves the drafted
    # disposition alone, and nothing is lost, because no consumer distinguished them.

  - id: unresolved_runs_are_reviewed_by_nothing
    kind: domain-outcome
    form: waiver
    outcome: {nl: "Unresolved investigations are reviewed by nothing, and that is accepted at this scope rather than overlooked. The gate skips the unresolved disposition deliberately, and the offline pipeline that used to service exactly those cases left the plan when the measurement PR was skipped — so the ground the original non-obligation was granted on is gone. This change also ENLARGES the unreviewed population: the gate manufactures an unresolved outcome whenever it refuses to let a confident finding stand — the forced-turn bound, any review that cannot complete under the fail-closed policy, a story every executed lead speaks to, one no executed lead can touch, a challenger reply that would not parse, and a story that never held together. A challenger's deliberate DECLINE is not among them: it leaves the confident close standing. [REPAIR-CORRECTION] The waived population used to be enumerated as three separately-spelled arms out of ten; the vocabulary collapse makes it exactly the single value `forced-inconclusive`, so the waiver now binds one member instead of three and the decline is excluded structurally — it lands on the other member — rather than by remembering to leave it off a list. The recorded disposition is what every downstream consumer routes on, and the five production sites that read it disagree about how to handle it, so the cost of this waiver is paid by real consumers and grows with how often the gate fires. A human examined this at the authoring seam and accepted it for this scope."}
    binds: ["disposition.domain.distinguished[inconclusive]",
            "close_outcome.domain.distinguished[forced-inconclusive]",
            "committed_outcome.domain.distinguished[forced-inconclusive]",
            "directions_for"]
    cites: [C19, K12, K15, K21, K22, PS4]
    rejected:
      - {nl: "Firing the gate on unresolved dispositions was considered and declined: the existing disposition-to-direction map returns BOTH directions for the unresolved value, and nothing states how two counter-stories are argued, compared, or combined into one verdict. That is new design, not a decision this spec can take — and it would double the review cost on exactly the population the gate is least confident about."}
      - {nl: "Reviewing only the unresolved runs the gate itself manufactured was considered and declined: it needs re-entry semantics nothing specifies — whether a forced-inconclusive close can be re-opened, what the turn and grace counters mean on a second pass, and whether the record of the first review is an input to the second. Cheaper-looking than the general case, and no better specified."}
      - {nl: "Leaving this as an open fork for the next phase was declined. It is the one item on this run's list that no further reading could settle, and carrying it forward would have read as an oversight in the finished spec rather than as a cost someone accepted."}

  # [REPAIR-CLOSEOUT] THE SECOND WAIVER, AND IT IS A DECISION THAT WAS TAKEN AND NEVER
  # RECORDED. R7 dispositioned fork-M as "file as an observability gap; does not block this
  # PR". That is a DECLINE of an operator obligation for this scope, which the schema spells
  # `form: waiver` — and it was neither filed nor waived, so the run's conservation line read
  # "0 waivers: no obligation was declined" while one had been. Filed as #787 as the
  # resolution's own words asked, and recorded here so the artifact carries the decline the
  # conservation count has to see.
  - id: review_cost_is_unaccounted
    kind: domain-outcome
    form: waiver
    outcome: {nl: "The review's own model calls reach no operator-facing cost figure, and that is accepted at this scope rather than overlooked. THE OBLIGATION IS THAT A RUN'S ACCOUNTED COST DOES NOT EXCLUDE CALLS THE RUN MADE, and the gate adds three model calls per attempt from inside the run — up to three attempts under the forced-turn bound, so up to nine calls a run genuinely paid for. Probed rather than assumed (PO6): nine cost readers exist in the tree and NOT ONE of them includes the review. All nine resolve to the main agent's own request logger and session store; each review stage builds its own logger and its own transient usage object, which structurally cannot increment those counters. The stages' usage IS written to disk, in per-stage trace files, and nothing reads it back — so the data exists and the aggregation does not. This is NOT the same thing as the review's calls being excluded from the request CEILING, which is deliberate and is pinned by its own green demand: the ceiling is about what terminates a run, this is about what a human is told a run cost. It is also not the pre-existing gather-subagent exclusion wearing a new hat — that one is a second, older class of the same failure, and the gate adds a third. Cost of the waiver: the most visible operator-facing number on every run understates what the run billed, by more the harder the gate worked, and there is no in-repo figure that does not."}
    binds: ["budget.domain",
            "interacts(challenge_gate->challenger)",
            "interacts(challenge_gate->coherence_checker)",
            "interacts(challenge_gate->projection)"]
    cites: [PO6, K3, K4]
    rejected:
      - {nl: "Summing the three review loggers into the run's figure inside this PR was declined by R7 as out of scope. It is not hard — the per-stage traces already hold the numbers — but the aggregation crosses the observability layer this delta does not otherwise touch, and doing it here would put a fifth production behaviour change into a scope the human bounded at four."}
      - {nl: "Folding this into the existing gather-subagent exclusion and minting nothing was considered and declined. It is the reading R7 explicitly did not take: PO6 establishes the review as a NEW class of excluded call, and merging the two would leave the obligation failing for two reasons with the gate charged for neither."}
      - {nl: "Recording it only as prose in the resolutions frontier was what actually happened, and it is what this entry corrects. A decline that lives in a frontier and not in the artifact is invisible to the conservation count and to finalize, which reads the artifact cold."}

  - id: counter_direction_from_directions_for
    kind: behavior
    form: test
    binds: ["interacts(challenge_gate->directions_for)",
            "disposition.domain.distinguished[malicious]",
            "disposition.domain.distinguished[benign]"]
    discharged_by: test_counter_direction_comes_from_the_existing_map_against_the_live_disposition

  - id: gate_absent_on_truncated_run
    kind: negative
    form: test
    binds: ["interacts(main_agent->tool_close_investigation)",
            "request_limit.domain.distinguished[60]"]
    discharged_by: test_a_request_limited_run_never_reaches_the_gate

  - id: challenged_arm_forces_a_turn
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[challenged]", "review_state",
            "interacts(main_agent->tool_close_investigation)"]
    discharged_by: test_a_surviving_story_with_silent_rows_refuses_the_close_and_counts_a_turn
    # POSITIVE CONTROL for `gate_absent_on_truncated_run` on the same edge: a run that DOES
    # reach the close fires the gate and spends a turn, so the truncated-run negative is not
    # green because the review is unreachable in every case.
    rejected: [{nl: "The design's mechanism — refuse the write so the framework hands the model another turn — is refuted and is not what this demand pins. A refusal is a raw retry against a shared budget of 10 whose overflow escapes every driver handler, and nothing in the tree structurally compels a further turn. What forces the turn is that the disposition is simply not committed until the gate is satisfied or the cap fires."}]

  - id: challenger_decline_leaves_the_close_standing
    kind: domain-outcome
    form: test
    binds: ["close_outcome.domain.distinguished[stands]",
            "close_outcome.domain.distinguished[forced-inconclusive]"]
    discharged_by: test_a_challenger_that_declines_to_argue_leaves_the_confident_close_standing
    # [REPAIR-CORRECTION] RS17 split one value into two so a decline and a review failure
    # would stop sharing a downstream handling. The vocabulary collapse takes the two values
    # back and the SPLIT SURVIVES ANYWAY, on two independent typed observables instead of one
    # label: a decline leaves the disposition standing where a failure overrides it, putting
    # them on opposite sides of the committed vocabulary, and a failure carries a typed
    # `failure_kind` where a decline carries none. This demand is stronger after the collapse
    # than before it.
    rejected: [{nl: "Letting the challenger's decline share the fail-closed outcome's arm was rejected (RS17). The two mean opposite things — a decline is the challenger having nothing to say about a case it understood, a review failure is the machinery breaking — so one value gave them one downstream handling, and the design's own decline output lost its address: no arm, no demand, no test, and the suite's nearest neighbour scored a non-verdict reply as infrastructure noise. This is the same collapse the malformed arm exists to prevent in the mirror direction."}]

  - id: nondiscriminating_forces_inconclusive
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[forced-inconclusive]"]
    discharged_by: test_a_surviving_story_with_no_silent_rows_forces_inconclusive_immediately

  - id: turn_cap_forces_inconclusive
    kind: behavior
    form: test
    binds: ["close_outcome.domain.distinguished[forced-inconclusive]",
            "extra_turn_bound.domain"]
    discharged_by: test_the_attempt_past_the_bound_forces_inconclusive_instead_of_gating
    # [REPAIR-CORRECTION] The bound has no value of its own now, so it is observed on the TURN
    # COUNT the committing attempt reports rather than on a spelling — which is the stronger
    # reading anyway: an implementation that commits at the right moment for the wrong reason
    # reports a count that does not equal the bound, and the old assertion could not see that.
    # [REPAIR-CORRECTION] The scenario repeated ONE discriminating lead across all three
    # attempts, which `a_fully_overlapping_attempt_spends_no_turn` turns into a run that
    # terminates at attempt two and never reaches the bound at all. Each attempt now carries a
    # lead the earlier ones did not raise, including the capped one — so the bound has to bite
    # on a run that could still have been asked something, which is what makes this the cap
    # rather than the overlap rule wearing the cap's name.

  # [REPAIR-CORRECTION] RENAMED from `degenerate_evidence_is_its_own_arm`. RS13 never bought a
  # spelling; it bought that neither degenerate shape GATES, which is what the two-branch split
  # got wrong. The spelling went with the rest of the vocabulary and the property is unchanged.
  - id: degenerate_evidence_spends_no_turn
    kind: domain-outcome
    form: test
    # [REPAIR-RESOLVED fork-E] settled at the human seam; see
    # .spec-flow/frontiers-repair/70-resolutions-repair.md.
    #   fork-E: R7 — the veto reading recorded in the residue stands: the shipped degenerate-arm
    #     rule is kept.
    binds: ["close_outcome.domain.distinguished[forced-inconclusive]",
            "close_outcome.domain.distinguished[challenged]",
            "committed_outcome.domain.distinguished[forced-inconclusive]"]
    discharged_by: test_a_story_no_executed_lead_can_touch_spends_no_turn
    repair:
      type: fork
      observable: {nl: "The committed test drives a MIXED set — one off-topic row and one
        genuinely silent row — and requires the degenerate arm, so one off-topic lead vetoes a
        real discriminator. The shipped rule softened the veto to fire only when nothing
        anywhere confirms the story, which still discards three real discriminators when a
        fourth lead is irrelevant. Which rule is correct is fork-E; the test's scenario moves
        with it. Only one ratio of off-topic to silent leads is ever driven today, whichever
        reading wins."}
      # SURVIVES EVERY READING (3/3, from the fail-closed side): the malformed-projection fix
      # must route on PARSE SUCCESS, not on row count, so an honest zero-rows projection keeps
      # whatever classification fork-E settles on. And no reading of fork-E covers a reply
      # that tags ONE lead both confirming and silent — that limb is unowned by any of the
      # four, and is carried in `handoff.forks` with the fork rather than assumed away.
    rejected: [{nl: "Reading every-lead-silent and no-lead-executed as opposite evidence — the two-branch split's behaviour — was rejected (RS13). Both mean the evidence cannot speak to the story; one says the investigation was under-determined, the other that the story was untestable. Under the split the gate spends a forced turn exactly where another turn cannot help, and burns the raised ceiling doing it. Promoted from a silent convergence three independent readers made without noticing they had decided anything."}]

  - id: forced_turn_raises_a_new_gap
