       count, so an honest zero-rows projection keeps whatever classification wins."

    - "fork-F — THE PROJECTION STAGE HAS NO ROLE OF ITS OWN, and this fork has NOBODY'S ANSWER
       behind it: all three copies asserted a role identity the code does not have and were
       discounted. The design gives the projection a contract deliberately different from the
       challenger's — single-story, blind, never told which side is being challenged, because
       a comparative judgment by an agent that knows which side is challenged can be led. The
       shipped stage is the challenger's own role definition re-bound at one call site; no
       projection role exists in the enum, the registry, the policy-compile surface or the
