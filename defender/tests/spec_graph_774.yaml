            "budget.domain.distinguished[off]"]
    discharged_by: test_report_md_leaves_the_model_write_allow_and_the_close_tool_writes_it
    rejected: [{nl: "Leaving the model's write open and instructing it not to use the path was rejected: the gate's structural argument is that exactly one writer exists, and an open bypass makes the boundary instructed rather than structural."}]
    repair:
      type: strengthened+repaired
      # ONE TEST, TWO DEFECTS. It was found both non-discriminating (any refusal from any
      # layer satisfied it, so a path check inside the tool body greened it) and broken in CI
      # (it asserts an ambient precondition CI contradicts). Doing either edit alone leaves
      # the other defect live and green.
      observable: {nl: "The refusal is read off the run's COMPILED write decision — report.md
        absent from, and investigation.md present in, the named write allow the run builds —
        not off the fact that some exception was raised. A path check inside the tool body
        produces the exception and cannot produce the compiled decision. The expected
        allow-list is an independently authored literal, not derived from the source the
        implementation reads, or the check confirms itself."}
      scenario: {nl: "The budget-enforcement-off state is ESTABLISHED for this test through
        the environment rather than asserted about the ambient state. The demand deliberately
        binds the enforcement-off cell and is that cell's only discharger, so deleting the
        precondition would leave the cell discharged by whichever state CI happens to set.
        In the same run where report.md's write is refused, investigation.md's write is
        driven to a landed file with real content on disk — the positive control is a file,
        not a decision value. Admitting the report back into the compiled allow makes the
        write succeed, which is what shows the write path CONSULTS the decision rather than
        agreeing with it by coincidence; that mutation is on the allow-list axis, not the
        budget-tier axis, so it does not collide with the two pre-existing budget modules."}

