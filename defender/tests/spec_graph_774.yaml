       test on the same basis. Everything minted is traced to its RS number in the header."
    - "One of the nine is minted by the SUITE, not by a resolution:
       `review_stages_enter_through_an_injection_seam`. The design gives the three review-stage
       calls no injection point, and the author charge makes a seamless dependency's seam part
