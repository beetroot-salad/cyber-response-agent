       body, so they moved with the renderer and still say the same real thing. The cost is
       named rather than absorbed: a closed ticket's comment now carries the disposition and
       the outcome without the sentence that explains them, and a reader who wants the cause
       has to open the report."
    - "NO NEW BOUNDARY, ACTOR, EDGE OR AXIS WAS ADDED. Every address the four new demands bind
       already existed, which is why the computed gate is unchanged and the delta is visible
       as demands and corrections rather than as structure. One axis is deliberately NOT
       registered: `commit`, which the review record's key under-covers — registering it would
       pre-decide fork-B reading (c).
       [SUPERSEDED, by exactly one element.] The follow-up pass that took the human's sanction
       on the validator seam added the `validator` boundary and the one invoke edge reaching
       it. Nothing was discovered to force it: the element exists because the demand it
       discharges is otherwise undischargeable, and the graph joins to code by name, so a
       seam the spec demands and the graph does not model is a seam no check can see. It is
       facetless, so the computed gate is still unchanged. No axis was added."

