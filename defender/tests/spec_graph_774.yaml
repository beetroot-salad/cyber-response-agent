    was_red_because: {nl: "The close's validation is a module-level call with no injection point, so a test can see that a refusal happened but never that the validator RAN on the ordinary evidence-free close — and that is the whole difference between a validator guarding every commit and one gated on the evidence argument. GREEN WHEN: `close_investigation` takes `validator=validate_artifact` — a keyword parameter defaulted to the real function, not to `None` — and threads it to the single call that validates the rendered body."}
    # [REPAIR-RESOLVED — the author pass's one probe request, sanctioned at the human seam]
    # The first author pass stopped one step short here (RF-E1 in
    # .spec-flow/frontiers-repair/80-author-digest-repair.md) and asked for a ruling rather
    # than inventing a seam. The human sanctioned the defaulted validator seam on R3's
    # precedent, so this demand now binds `validator` and this artifact carries a boundary
    # for it. The default is the FUNCTION, never `None`: a `None` default re-admits the same
    # cheat in its other spelling — validate only when an optional argument was supplied —
