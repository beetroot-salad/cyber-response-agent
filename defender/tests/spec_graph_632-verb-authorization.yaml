    - "THE BATON — read this entry first; it is written for someone with no access to the session that produced this spec. WHAT THIS IS: 80 demands (68 executable, 9 clauses the spec deliberately mints nothing for, 3 waivers), red at import against base d01001e6 by construction. That count was recomputed from the demand list in the correction round rather than incremented: it had read 77/65 since before the repair pass's two mints, so the baton and the demand block's own header disagreed by two, which is one instance of the self-accounting break the third reconciliation flagged across the chain. The suite names surfaces that do not exist; `defender/tests/_verb_authorization_632.py`'s docstring is the inventory of what must be built. WHO DECIDED WHAT: every R-numbered decision in .spec-flow/frontiers/70-resolutions.md is the HUMAN's — 23 resolutions, 3 waivers, 13 residuals, closing all 20 forks; R7 and R8 carry closing-pass amendments the human also made. Everything else — which observable a demand pins, how a test drives it — is the run's, and where the run chose rather than the human, the demand says so. WHAT WAS REVERSED MID-RUN: the refusal ordering, twice decided. R3 and R23 first put the malformed check and the traversal screen AHEAD of the grant check; both were reversed on composition, because three separately-reachable refusal paths in front of authorization let a caller choose to be refused without being recorded — one unrecognised parameter suppressed every denial record for the life of a run. The grant check now runs FIRST. Its costs are named in R3/R23 and RS6, not absorbed. WHAT RAN DEGRADED: see the four entries below — a weak third answering copy, a design doc never revised, a null-stub gate that could not mechanize, and a conservation check that has NOT RUN against this suite. WHAT SHIPS UNREPAIRED: the four accepted residuals entry below. THE SINGLE NEXT ACTION: hand to write-code-from-spec, and implement d73 FIRST — the judge's grant must be scoped off beside its capability bit before anything else, because R7's first direction applied to today's configuration stops the adversarial judge stage building, and every other demand can be satisfied while that failure sits in the run."
