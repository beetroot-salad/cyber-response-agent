# ===========================================================================
# HANDOFF — seeded by the assembler so nothing the earlier phases learned can
# vanish before phase F extends it. `forks:` records that the 20 forks EXIST and
# are the human's, not how they were resolved (none is).
# ===========================================================================
handoff:
  # Phase E rewrote `forks:` from "these EXIST and are the human's" to how each was RESOLVED.
  # 20 forks in, 20 answers out, plus R21/R22 from the residue and R23 — FORK 3's third
  # contest, returned to the human as an open observable rather than inferred, and answered
  # on a second pass. Every answer lands in a demand above or in an explicit residual below.
  forks:
    - "FORK 1 -> R1: reading (c). ONE fixed policy-denial stream per site — same writer class, same filename, each under its own run dir. Rejected: discharging the judge's half with the judge's own page (the shape that gets an assertion written which proves nothing at the second site), and a second writer on llm_requests.jsonl (partly unbuildable — the writer refuses a second open of one path). The `not best-effort` guarantee is a property of the RECORD and reaches both sites however the destination lands. Demands d6/d7/d8; boundary policy_denial_stream."
    - "FORK 2 -> R2: refusal quiet, audit loud. The denial is a plain legible refusal returned as the tool's ORDINARY result — nothing raised, no row, no seq, no breaker. The audit write is NOT wrapped in a suppressor; a failure propagates as an infra fault AFTER the refusal has taken effect. Swallowing the write error is explicitly foreclosed. Wiring consequence pinned by d2/d37: a denied verb and a nonexistent verb must not share a path."
    - "FORK 3 -> R3, REVERSED AT PHASE F: the grant check runs FIRST — ahead of the malformed check as well as ahead of the availability short-circuit. R3's original split (malformed before grant) was defensible read alone and indefensible in composition: with R23's traversal screen and R11's unresolvable silence beside it, a model that appended one unrecognised parameter to every call it expected to be refused produced zero policy-denial records for the life of a run, and nothing in the record noticed. Consequences propagated through d3/d4/d53/d55: a denied call ALWAYS produces its denial record; a malformed-and-denied call takes the DENIAL path and leaves NO evidence row; every 'WELL-FORMED denied calls only' narrowing is withdrawn. R3's second half survives unchanged (d56) and was always the point — it closes the hole where an attacker who first exhausts a system silences the audit trail for it."
    - "FORK 3's third contest -> R23, REVERSED with R3: authorization now runs ahead of the caller-supplied id's traversal screen, because the screen was the third of three cheap ways to be refused without being recorded. R23's stated benefit — a hostile model-authored id kept out of the durable denial record — is preserved by a DIFFERENT mechanism rather than dropped: d66's bounded, normalized projection, which d53's test asserts on the denial path so the reversal cannot silently re-open the hazard R23 named. The reversal's own cost is that the screen loses the path it was exercised on: behind the grant check no denied call reaches it, so d53 also pins it on the GRANTED path, where it is the first refusal that can fire. Without that half an implementation satisfies every denial obligation here by deleting the screen."
    - "§7's own file now RECORDS the reversal. Both entries were amended rather than left standing: R3 and R23 state that they reverse a first decision, why (composition — three separately-reachable refusal paths in front of authorization, any of which a caller could choose to be refused without being recorded), and what it costs (the learning loop's evidence row on doubly-faulted calls; a denial stream that is model-triggerable and unbounded in count, RS6 widened to say so; the traversal screen's lost exercised path). The first decision's rejected-reading sentence — that denying first would write an unscreened model-authored id into the durable record — is quoted in R23 and answered rather than deleted, because the spec ships that reading now."
    - "FORK 4 -> R4: check the PAIR — program against a per-system allowlist AND container target against the declared inventory. Both halves, never either alone. The agent's own container and another granted system's store are ORDINARY refusals with no special-casing. Demand d57; closes the docker-exec access cell and the `defender` domain cell."
    - "FORK 5 -> R5: evaluate REACH, not the literal, and refuse the WHOLE call. Never silently narrow to the in-bounds members — that satisfies the letter of the obligation while hiding an attempted cross-tenant read. Demand d58, binding all three elastic_index cells."
    - "FORK 6 -> R6: the check binds on the RESOLVED request target, on a normalized path, with the query string excluded. Demand d59."
    - "FORK 7 -> R7, AMENDED IN THE CLOSING PASS with a fourth part: an empty deny-all default, the grant stays on the role definition, BOTH disagreement directions fail at build — and, new, a stage that switches its verb capability OFF is handed an empty grant, scoped by the same runtime replace() that sets the bit. The amendment exists because the rule as written stopped a shipped stage building: there is one judge definition carrying one grant that names ticket verbs, and the adversarial judge builds from it with the capability off, so 'a grant naming verbs for a switched-off tool' is not a hypothetical the rule forbids but what production ships. The human chose to FIX THE CONFIGURATION rather than soften the rule — the alternative on the table was an exception to direction 1 at this site, which would have left the one place the rule matters most as the one place it does not apply. Consequence for the spec: direction 1 is pinned at the policy build and is not stage-drivable, because after the correction no stage can construct that state. Demands d60/d61/d73."
    - "FORK 8 -> R8, AMENDED IN THE CLOSING PASS to decide WHAT FORM the audit must read, which the original answer left open and which turned out to decide whether the demand catches anything at all: scope the correspondence demand to an ENUMERATED set of build-time artifacts, with RS1 (the loop-written lesson corpus) and RS2 (the read-scope reachability of the defining artifacts) recorded OUT LOUD rather than inherited silently. The amendment: the audit reads the qualified call form AND the bare verb name, because two of the four committed counter-examples — including the file instructing the model to call a withheld verb — are bare names, and a qualified-only scan reports zero over a tree that still carries the instruction. A bare name in the owning system's own file attributes to that system; a bare name anywhere else attributes to nothing and is judged against every system declaring it. The accepted cost, chosen over 'that site is out of reach': false positives on the second rule, corrected by qualifying the name. Demand d45; the enumeration itself is d70, written as a live census so RS3 closes by re-probing rather than by a recalled list."
    - "FORK 9 -> R9, five parts: generate from the grant as data with no adapter code executed; overwrite the generated section in place and FAIL THE BUILD if surrounding prose still names a withheld verb; no roster on generation failure, never a fall back to the authored text; commit the artifact with a regenerate-and-compare check so drift is a load failure; omit a system with no granted verbs entirely. Demands d18/d45/d62/d63/d64."
    - "FORK 10 -> R10: declared per-system verb names, readable without executing adapter code. Makes the load check TOTAL and roster generation a data transform, and leaves the fault-containment property untouched. Demands d15/d16."
    - "FORK 11 -> R11, applied LITERALLY at phase F: the refusal lists only the role's granted subset, and a system the grant reaches NOWHERE is UNRESOLVABLE — not denied. Five tests had asserted this and three its opposite under one predicate, so the suite could not go green; d47, d60, d52 and d38 were re-authored onto the literal reading. Cumulative probing accepted as RS4; RS14 records the second-order cost the literal reading carries (deny-by-default no longer reaches a whole new SYSTEM as a denial, and an unresolvable call writes no denial record). This also fixes the LABEL for the two near-miss consensus assertions, which differ in written state. Demands d65/d48."
    - "FORK 12 -> R12: a bounded projection — role, system, verb, call id, truncated or hashed params digest — NORMALIZED before writing, never the raw blob. Demand d66."
    - "FORK 13 -> R13, accepted as recommended: reject at load a class token outside the two-value vocabulary and a duplicate pair with conflicting classes; the vocabulary stays closed at two. RS5 recorded. Demand d67."
    - "FORK 14 -> R14, accepted: bind the consensus assertion (d42) and record the exit-less denial loop as RS6 rather than building a counter — neither obvious home is legal."
    - "FORK 15 -> R15: type the seam, and assert the rejection at a site the build path actually reaches, since g17 refuted the existing guard's reachability. Demand d68."
    - "FORK 16 -> R16, accepted as non-obligations, with one binding constraint carried into the suite: the two-roles tests use two DISTINCT REAL role ids and key on the role id, never on grant-object identity. Demands d19/d43."
    - "FORK 17 -> R17, accepted: keep the self-case guard, retire nothing. Demand d23."
    - "FORK 18 -> R18, accepted: decided by the design's own open question, not by implication here. RS7."
    - "FORK 19 -> R19, accepted: pin the negative. Demand d69; RS8 recorded."
