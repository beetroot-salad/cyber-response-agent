    - "SCOPE: 3 fork resolutions applied (F1/F2/F3), 2 demands minted (d74/d75), 9 non-discriminating tests tightened (H1-H6, H8, H11, H12 from issue 632 comment 5118917483) plus the #700-shaped deck replay. Conservation: 12 adversary findings = 3 resolved as forks (H7/H9 the two blockers, H10 the design gap) + 9 tightened; 4 grounding red flags = 2 folded into resolutions (RF2 into F1, RF4 into F3) + 2 minted (RF1 -> d74, RF3 -> d75). No drops, no waivers."
