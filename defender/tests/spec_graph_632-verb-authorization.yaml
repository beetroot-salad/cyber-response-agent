# Spec-coverage graph — #632: per-role authorization for the verb surface.
# Assembled (phase D, assembler leaf) from 10-brief.md + 20-demands.md + 45-dispositions.md,
# with 05-early-resolutions.md (BINDING human decisions) and 47-reground.md (g21-g24) folded in.
# The `gate:` block is the PHASE-D GATE LEAF's to write — it is deliberately absent here, so a
# bare `spec-graph gate` reports 7 missing `evaluated` entries until that leaf runs.
#
# AUTHORITY ORDER, because the design doc was never revised:
#   1. 05-early-resolutions.md  — R-A1 (run continues, D4/D5/D7 stay open forks; no leaf may
#      settle one silently) and R-A2 (the model-facing verb roster becomes grant-derived, and
#      the correspondence is a DEMAND the spec pins, not an assumption it leans on).
#   2. 47-reground.md / 10-brief.md — the executed and searched claims that refuted the doc.
#   3. .spec-flow/632-design.md — everything the first two do not overturn.
# The doc still reads D6 as written. D6 is REFUTED (g10), not narrowed: `descriptor_catalog`
# emits one line per SYSTEM and no verbs at all; the roster the gather model works from is
# hand-written `skills/<system>/SKILL.md` + `execution.md` prose it Reads. D2's "the accepted
# cost is bounded because the model is never invited" therefore had no mechanism behind it.
#
# NAME RECONCILIATION (the graph joins to code BY NAME — schema.md, "Coin ids"). Four ids were
# coined differently by the three passes; unified here by role+origin, NOT by display name:
#   20-demands `audit_stream`      -> judge_audit_stream   (learning_run_dir/<batch>.<pid>.trace.jsonl,
#                                     _pydantic_stage.py:91 + StageWiring.trace_name; g20)
#   20-demands `executed_queries`  -> judge_queries_table   ON THE JUDGE EDGES ONLY. d4's original
#                                     binds named gather's boundary; n7/g7 established these are
#                                     two sinks with two roots, two key sets and two payload trees.
#                                     Left unreconciled, d4's O6 assertion passes VACUOUSLY at the
#                                     judge site — dispositions Red flag 3, closed here.
#   20-demands `descriptor_catalog` (as D6's roster) -> verb_roster + system_skill_prose. g10
#                                     refuted the identification; d18 is re-bound onto the surface
#                                     the model actually reads, and descriptor_catalog stays in the
#                                     graph as the per-SYSTEM catalog it really is.
#   design `three registry mint sites` -> FOUR production sites (n2/g2): the missed one is
#                                     driver.py:563's ternary, which is what run.py:144 uses.
#                                     d1 binds all four plus the dev-tooling fifth, per-cell.
#
# WHAT THE ASSEMBLER MINTED, and why (12 test demands + 2 clauses, d38-d51). 45-dispositions
# bound 26 consensus assertions "for the suite"; 8 of them land on demands the 20-demands leaf
# already wrote, and 18 landed nowhere. One (`test_the_operator_asks_what_this_role_may_do`) the
# dispositions leaf explicitly routed to phase D — "mint one or record a drop". The rest are the
# fault-containment, ordering, near-miss and roster-reach assertions the demand list never
# reached. No fork was resolved to mint any of them: every minted demand carries a consensus
# outcome all three answering copies agreed on.
#
# WHAT THE ASSEMBLER DID **NOT** DO: pick a branch on any of the 20 forks. Where a fork decides
# an observable, the structure carries the question as an `unknown` invariant or an unbound
# distinguished/access cell so the gate leaf computes it and §7 answers it. Four `unknown`s are
# recorded, each named at its slot.
schema_version: 1
design: "#632 — .spec-flow/632-design.md: authorization for the verb surface (+ 05-early-resolutions.md, authoritative on D6)"
base: d01001e642780f4fe2c7c9868a578e013a45e40f

# ===========================================================================
# DEMANDS — the spec proper. 80 = 68 test + 9 clause + 3 waiver.
#   d0-d37   the 20-demands leaf's 38 (31 test + 7 clause), binds RESOLVED and, where a
#            census corrected them, RE-BOUND (d1, d4, d7, d18 — see the header).
#   d38-d49  minted here from 45-dispositions' consensus (12 test).
#   d50-d51  minted here from FORK 20's "record, do not decide" residuals (2 clause).
#   d52-d70  phase-E mints, one per §7 resolution deciding an observable nothing bound.
#   d71-d72  phase-F mints (findings 6 and 8): the transport capture seam, and the judge
#            site's own refusal ordering.
#   d73      the closing pass's one mint (third reconciliation, finding 2): the shipped-
#            configuration correction §7 R7's first direction forces at the judge.
#   d74-d75  the REPAIR PASS's two mints (170-resolutions M1/M2), both of the same class as
#            the two blockers — an obligation a CORRECT implementation could not satisfy, and
#            an obligation nothing in the suite required at all: the elastic read allowlist's
#            fourth endpoint (on the Kibana host, reached by a granted verb), and the judge's
#            own generated roster.
#   d76      the CORRECTION ROUND's one mint (195-resolutions G1): the read-endpoint
#            allowlist's AUTHORING integrity. F1 made the HTTP method the axis that separates
#            the ticket read from the ticket write, and nothing in production refused an entry
#            authored without one.
#   w1-w3    §7's three recorded waivers.
#
# PHASE-F RE-RUN — the two decisions that moved, and which demands they moved:
#   * §7 R11 is applied LITERALLY. A system a role's grant reaches NOWHERE is UNRESOLVABLE,
#     never denied; DENIED is the label only for a verb withheld on a system the grant does
#     reach. Five tests asserted this under one predicate and three asserted its opposite —
#     the suite was unsatisfiable. Re-authored: d47, d60, d52, d38. Consequence recorded as
#     RS14 rather than absorbed: deny-by-default no longer reaches a newly scaffolded
#     SYSTEM as a denial (d47 keeps its non-vacuous instance by driving a new verb on a
#     system the role already holds), and a wholly ungranted system produces no
#     policy-denial record.
#   * THE REFUSAL ORDERING IS REVERSED: the grant check runs FIRST — ahead of the malformed
#     check (overturning R3's first half) and ahead of the traversal screen (overturning
#     R23), as well as ahead of the availability short-circuit (R3's second half, kept).
#     The reason is composition, not taste: malformed-first ∩ traversal-first ∩ R11's
#     unresolvable silence let a model suppress EVERY policy-denial record for a whole run
#     by malforming any call it expected to be refused. Consequences propagated: a denied
#     call ALWAYS produces its denial record; a malformed-and-denied call takes the DENIAL
#     path and leaves NO evidence row; every "well-formed denied calls only" narrowing is
#     WITHDRAWN (d3, d4, d55, d53). What R23's ordering used to buy — a hostile
#     model-authored id kept out of the record — is now bought by d66's normalization, and
#     d53 asserts it there.
# THE REPAIR PASS — three human fork resolutions on findings that came back from
# write-code-from-spec (which REFUSED to implement, on two unsatisfiable demands) and from an
# adversarial implementer (which greened the suite with deliberately dishonest code):
#   * F1 — the read-endpoint allowlist keys on (URL pattern, HTTP METHOD) PAIRS, and the
#     capture seam records the method. The endpoint-only key was unsatisfiable, not weak: the
#     ticket read and the ticket write are one resolved path. Measured: over the 27 real
#     (system, path, method) triples, path alone collides exactly once and path+method never.
#     c17 is not overturned — it killed a GLOBAL "an r verb may not POST", never a per-entry
#     method. Reshapes d17/d36/d59/d71. Dropping /tickets from the write set was REJECTED: it
#     greens the test and unbacks its own stated purpose.
#   * F2 — a denial CONSERVES pre-call run state (snapshot, byte-identical) as well as leaving
#     the three scoped absences. Absence alone is satisfiable by destroying evidence, which is
#     what the adversary did against this exact test. Reshapes d3.
#   * F3 — the audit gains a FOURTH attribution rule: each generated roster is scored against
#     its OWN role's grant, every other surface against gather's, and the audit's interface
#     becomes a mapping of which grant governs which file. Reshapes d45/d70. Excluding rosters
#     from the audited surface was REJECTED — it breaks no assertion, which is exactly why the
#     suite could not distinguish it from the dishonest edit.
# Nine further demands were TIGHTENED rather than reshaped, each until the exploit the
# adversary greened with goes red; the tightening is recorded on the demand it belongs to.
#
# A form:test demand is a POINTER: its observable-outcome prose is the seed sentence in
# 20-demands.md / 45-dispositions.md, authored into the named test's docstring at phase E.
# ===========================================================================
demands:

  # --- #0 THE RETURN CONTRACT — still PROVISIONAL (20-demands fork 1 / dispositions FORK 2).
  # The design says a denied verb "raises a distinct policy error" (D1) and forbids ModelRetry
  # (D7), and never says what crosses the tool boundary. Pinned provisionally to the only
  # zero-state refusal in the codebase — the breaker's early return: a plain legible string as
  # the tool's ordinary result, nothing raised, no row, no seq, no breaker contribution (n6).
  # EVERY denial test's assertion shape rides on this. §7 owns it.
  - id: d0_denial_result_shape
    kind: behavior
    form: test
    binds: ["interacts(query_tool->verb_registry).response", "interacts(closed_ticket_tool->verb_registry).response"]
    discharged_by: test_a_denied_verb_returns_a_legible_refusal_and_the_run_continues

  # --- O1 / D1 — the scoped registry -------------------------------------------------------
  - id: d1_registry_requires_grant
    kind: seam
    form: test
    # FIVE construction cells, bound per-cell so each site discharges on its own. c15 found two,
    # n2/g2 found four production sites: the missed one (driver-ternary) is what production runs,
    # and it carries a lint-suppression comment asserting it is an approved DI default. The sixth
    # cell — `duck-typed` — is deliberately NOT bound: FORK 15 asks whether the seam rejects a
    # registry-shaped object that never went through the constructor, and its constraints are
    # `unknown`. AUTHOR WARNING (g17): do NOT pin this against register_tools' existing
    # "a query tool with no registry has no allowlist" ValueError — build_agent_core fills the
    # None before calling it, so that guard is unreachable from the build path and a test pinned
    # to it pins dead code green.
    binds: ["verb_registry",
            "verb_registry.access[driver-ternary]",
            "verb_registry.access[driver-fallback]",
            "verb_registry.access[judge-engine]",
            "verb_registry.access[catalog-builder]",
            "verb_registry.access[dev-scaffold]",
            "interacts(run_investigation->verb_registry)",
            "interacts(build_agent_core->verb_registry)",
            "interacts(judge_stage->verb_registry)",
            "interacts(descriptor_catalog->verb_registry)"]
    discharged_by: test_a_verb_registry_cannot_be_constructed_without_a_grant

  - id: d2_denial_distinct_from_unknown_verb
    kind: behavior
    form: test
    binds: ["interacts(query_tool->verb_registry).response", "interacts(query_tool->executed_queries)"]
    discharged_by: test_a_denied_verb_is_not_the_unknown_verb_path

  - id: d24_denial_message_names_the_verb
    kind: behavior
    form: test
    # N4 — surface hiding is not an objective. But FORK 11 notes N4's REASONING died with D6:
    # the catalog is no longer handed over in full, so the reject path's "Declared verbs: [...]"
    # listing (n1/g1, query_tool.py:165) becomes the wider channel. Whether that listing shows
    # the granted subset or the full adapter set is FORK 11's, not this demand's.
    binds: ["interacts(query_tool->verb_registry).response"]
    discharged_by: test_a_denial_names_the_system_and_verb_it_refused

  - id: d25_grant_bounded_invocation
    kind: behavior
    form: clause
    binds: ["verb_grant", "interacts(query_tool->verb_registry)", "interacts(closed_ticket_tool->verb_registry)"]
    outcome: {nl: "A role can invoke only the systems and verbs its grant names, through every model-facing tool that reaches the registry. RECORDED DOWNGRADE, not a default: the design's own vacuity finding — gather holds the only (system, verb)-shaped tool and the judge's two tools hardcode theirs, so this universal can only be exercised against fixtures the spec invents for itself and would pass a broken implementation just as happily."}
    rejected: [{nl: "a test on invented fixtures banked as acceptance"}]

  - id: d26_deny_by_default_for_new_verbs
    kind: behavior
    form: clause
    # The vacuity downgrade stands for the general universal — but 45-dispositions' consensus
    # found ONE reachable instance of it: the authoring path (a new system shipped through the
    # scaffold end to end). That case is now the executable demand d47, so this clause covers
    # only what d47 cannot reach.
    binds: ["verb_grant"]
    outcome: {nl: "A verb absent from a role's grant does not execute for that role, including a verb added after the grant was written. This is the obligation that must hold when a write verb lands; against today's code it is vacuous for the same reason d25 is, except along the authoring path, which d47 pins executably."}

  # --- O2 / D3 — target fidelity ------------------------------------------------------------
  - id: d11_host_state_refuses_unknown_target
    kind: behavior
    form: test
    # c13/g13 stand refuted at HEAD: _check_host prints "warning: host X is not in the known
    # inventory ... attempting anyway" and proceeds, so `host` becomes the docker exec target and
    # a role granted only host-state reads files inside the elasticsearch, kibana and ticket-store
    # containers. This demand is the refutation's correction.
    binds: ["host_state_target", "host_state_target.domain.distinguished[elasticsearch]",
            "interacts(host_state_adapter->docker_exec)"]
    discharged_by: test_host_state_refuses_a_host_outside_its_inventory

  - id: d12_elastic_index_confined
    kind: behavior
    form: test
    # c14/g13: `resolved = index or config[index_key]`, quoted with safe='-*,.', as the elastic
    # superuser (c7). FORK 5 owns the MATCHING SEMANTICS — the three distinguished members on
    # elastic_index.domain (comma list, wildcard, leading exclusion) are deliberately left unbound
    # so the gate computes them as open obligations. This demand pins only the plain case.
    binds: ["elastic_index", "interacts(elastic_adapter->estate)"]
    discharged_by: test_an_elastic_read_refuses_an_index_outside_the_configured_patterns

  - id: d35_target_positive_control
    kind: behavior
    form: test
    binds: ["host_state_target", "elastic_index"]
    # TIGHTENED IN THE REPAIR PASS — H6. The positive control re-fed a CONFIGURED
    # PATTERN back to the checker, which bare string equality satisfies — and bare equality
    # computes no reach relation at all, so it also rejects every concrete daily index the
    # system really reads while passing every negative above. The control is now parametrized
    # over indices whose reach is contained but whose text is not in the configured set.
    discharged_by: test_an_inventory_host_and_a_configured_index_still_run

  - id: d13_esql_target_unconfined
    kind: behavior
    form: clause
    binds: ["elastic_esql"]
    outcome: {nl: "elastic.esql selects its target inside the ES|QL FROM clause rather than through a param, so the verb-level target check does not reach it and O2 is undischarged for the capability carrying 610 of ~1000 recorded calls. The spec asserts O2 only over the verbs D3 reaches and must not read as though O2 holds surface-general; the only mechanism that closes it is a credential scoped to the telemetry indices, which N2 settles out because the environment has no authz model to scope against."}
    rejected: [{nl: "parsing model-authored query text to confine esql — the in-process matcher N1 rules out"}]

  # --- O3 / D2 / D4 — declaration, agreement, effect ----------------------------------------
  - id: d14_class_agreement_fails_closed
    kind: behavior
    form: test
    binds: ["verb_grant", "verb_class.domain.distinguished[rw]", "interacts(query_tool->verb_registry)"]
    discharged_by: test_a_verb_whose_declared_class_contradicts_its_grant_cannot_be_invoked

  - id: d15_agreement_defers_to_first_resolution
    kind: behavior
    form: test
    # The #672 fault-containment regression guard, and what makes O3's stated timing observable
    # rather than a comment. FORK 10 asks how the load-time resolve check (d16) coexists with it;
    # the recommendation there — make verb NAMES readable without executing adapter modules — is a
    # mechanism decision left to §7.
    binds: ["compile_policy", "verb_grant", "interacts(query_tool->verb_registry)"]
    discharged_by: test_compiling_a_policy_imports_no_adapter_and_a_broken_one_costs_only_its_own_system

  - id: d16_grant_entries_resolve_at_load
    kind: behavior
    form: test
    # Load-bearing, not ceremony: c19 found five historical (system, verb) pairs that name
    # TEMPLATE IDS rather than verbs, so a grant generated from run history names five verbs that
    # do not exist. g4 makes the check TOTAL — the grant partitions the 25 non-health-check verbs
    # exactly, with no residue, and every name resolves in the live registry.
    binds: ["verb_grant"]
    # TIGHTENED IN THE REPAIR PASS — H12. Nothing cross-checked the cold verb-name
    # reader against reality, so a syntactic scan of the `VERBS = {...}` literal agreed with
    # itself: an adapter whose table is assembled any other way declares NOTHING to the check
    # while declaring everything to the runtime, and a grant naming a phantom verb on that
    # system then passes at load. The reader is now compared against the IMPORTED names on every
    # shipped adapter (importing is legal in the test precisely because production must not),
    # and an adapter with a programmatically built table must not make the check go quiet.
    discharged_by: test_a_grant_naming_a_verb_the_registry_lacks_fails_at_load

  - id: d17_read_class_endpoint_allowlist
    kind: shape
    form: test
    # Two of the three access cells only. g11 REFUTED the third: host-state's six verbs reach the
    # estate as a literal argv list through docker_exec_raw, with no URL anywhere, so the ~17-
    # pattern set cannot type-check the one system whose target-confinement gap c13 refuted. That
    # cell's constraints are `unknown` and FORK 4 owns it.
    # PHASE-F REPAIR: the "every declared read endpoint passes" half was TAUTOLOGICAL — the
    # test iterated READ_ENDPOINT_ALLOWLIST and fed each of its own entries back to the
    # checker, so it held for whatever set shipped and an allowlist that quietly lost a
    # system's real endpoints still passed. Both halves now come from outside the allowlist:
    # elastic's four through the transport capture seam d71 mints (a real drive, real resolved
    # URLs), and the stub systems' as literals read off the adapters' own call sites. The
    # write-endpoint half already bit and is unchanged.
    # REPAIR PASS (F1) — THE ALLOWLIST KEYS ON (PATTERN, METHOD) PAIRS. As written this demand
    # was UNSATISFIABLE: the ticket store's list-tickets read and the writer's create-a-ticket
    # mutation resolve to the same path under configs pointing at the same host, so one rule
    # over (system, path) had to admit and refuse one identical call. write-code-from-spec
    # refused to implement on exactly this, and the adversary rediscovered it independently.
    # The axis is measured, not guessed: 27 real (system, path, method) triples, path-only
    # overlap {"/tickets"}, path+method overlap {}. The write-endpoint fixture also stops
    # passing the literal "ticket" for the three ticket-store mutations — they are reached
    # under the system identity `case-history`, whose configured host is the SAME one, so the
    # system label never separated them and the literal misdescribed the surface.
    binds: ["read_endpoint_allowlist",
            "read_endpoint_allowlist.access[http-elastic]",
            "read_endpoint_allowlist.access[http-stub]",
            "verb_class.domain.distinguished[r]",
            "interacts(elastic_adapter->estate).payload"]
    cites: [g26]   # the 27-triple measurement that established the pair separates read from write
    discharged_by: test_an_r_classed_verb_may_only_reach_a_declared_read_endpoint

  - id: d36_post_with_body_reads_still_pass
    kind: behavior
    form: test
    # REPAIR PASS (F1): the standing guard now states what c17 actually refuted. The two
    # POST-with-body reads pass as LISTED PAIRS, so what the rule rejects is an unlisted
    # (path, method) and never "POST" as such — and the same listed path under a mutating
    # method is refused, which is the discrimination a method-blind allowlist cannot express.
    binds: ["read_endpoint_allowlist", "read_endpoint_allowlist.access[http-elastic]",
            "verb_class.domain.distinguished[r]"]
    cites: [g26]   # elastic's two POST reads and the all-POST writer set are that probe's own count
    discharged_by: test_the_two_post_with_body_reads_still_pass_the_endpoint_check

  - id: d74_elastic_read_allowlist_carries_the_kibana_endpoint
    kind: domain-outcome
    form: test
    # REPAIR-PASS MINT (170-resolutions M1, from the grounding leaf's red flag 1). The elastic
    # `health-check` verb — granted to gather on every system its grant reaches — issues TWO
    # requests, not one: the cluster-health GET against ELASTICSEARCH_URL and a status GET
    # against KIBANA_URL, a different host and the only elastic read that leaves the
    # Elasticsearch box. d17 confines EVERY captured request, so an allowlist enumerating three
    # elastic endpoints refuses a CORRECT implementation the moment the first request succeeds
    # and the second is issued. That makes this the same class as the two blockers — a demand
    # unsatisfiable by correct code — and it was in neither the implementer's nor the
    # adversary's findings. No fixture in the committed suite named the endpoint and the
    # standing guard enumerated three.
    # Recorded, not papered over: this endpoint is NOT reachable through the capture seam on a
    # hermetic drive, because the first request fails on the unreachable transport and the verb
    # never issues the second. The test therefore recovers the target from the ADAPTER's own
    # source rather than restating it, so the obligation stays attached to the call site that
    # creates it and a retarget moves both together.
    binds: ["read_endpoint_allowlist", "read_endpoint_allowlist.access[http-elastic]",
            "interacts(elastic_adapter->estate)"]
    cites: [g26]   # the Kibana-host GET is one of that probe's four elastic reads
    discharged_by: test_the_elastic_read_allowlist_carries_the_kibana_host_endpoint

  - id: d76_read_endpoint_allowlist_authoring_integrity
    kind: behavior
    # CORRECTION-ROUND MINT (195-resolutions G1, from the third reconciliation's finding 1).
    # THE ALLOWLIST STOPS BEING A BARE MODULE CONSTANT and gains a validating constructor: a
    # `(URL pattern, method)` entry naming no method cannot be BUILT. That is a production
    # surface addition, which is why this is a demand rather than a test-local shape check.
    # Symmetric with d67, the grant's authoring integrity, and minted for the same reason:
    # three hand-authored tables now carry the model's permissions, two of them fail loudly on
    # a bad author (d67's class-token/duplicate refusal, and the roster's regenerate-to-the-
    # committed-bytes check), and the allowlist — the newest, added by F1 — failed on nothing.
    # Under F1 a method-less entry silently reopens the ticket read/write collision the fork
    # was resolved to close, because the method is the only axis that separates them.
    # WHY THE DISCHARGE IS A DRIVEN CONSTRUCTION AND NOT A SHAPE ASSERTION over the committed
    # literal: the shape check certifies the set that ships today and says nothing about an
    # allowlist assembled or extended by another route — the shape a future adapter
    # registering its own read endpoints would take. The test also requires the SHIPPED table
    # to be an instance of the constructed type, or a validating constructor nothing calls
    # satisfies every raise.
    # `kind: behavior`, NOT domain-outcome as d67 is: d67 binds two distinguished members of
    # the verb_class domain, and the missing-method case has no domain member to bind —
    # `http_method` is an axis in the registry, not a valued input with a domain facet. What
    # is pinned is a raise on a driven construction, which is behavior's own definition.
    # POSITIVE CONTROL, in the same test (d67's shape): the same entry WITH its method
    # constructs, keeps the pair it was authored with, and the shipped table still admits a
    # real read — so a constructor that refuses everything fails rather than passing four
    # refusals for free.
    # JOINT CONSTRAINT WITH d17, asserted so it cannot be discovered at implementation: the
    # validating type must still be a Mapping of system -> entries, because d17's test takes
    # the table's key set, iterates it by system and subscripts it. A validating type that is
    # not a Mapping makes d17 and d76 unsatisfiable together.
    form: test
    binds: ["read_endpoint_allowlist",
            "read_endpoint_allowlist.access[http-elastic]",
            "read_endpoint_allowlist.access[http-stub]"]
    cites: [g26]   # the 27-triple measurement is what makes the method load-bearing rather than decorative
    discharged_by: test_the_read_endpoint_allowlist_cannot_be_built_with_a_methodless_entry

  - id: d37_undeclared_verb_keeps_todays_treatment
    kind: behavior
    form: test
    # The complementary positive control for d2's negative: absence shapes the CATALOG, a
    # distinguishable error shapes the CALL.
    binds: ["interacts(query_tool->verb_registry).response", "interacts(query_tool->executed_queries)"]
    discharged_by: test_an_undeclared_verb_keeps_todays_unknown_verb_treatment

  # --- O5 — audited, and not evidence -------------------------------------------------------
  - id: d6_denial_audited_to_the_durable_stream
    kind: behavior
    form: test
    # RE-BOUND at phase E by §7 R1 (reading (c)): ONE fixed policy-denial stream per site, same
    # writer class and same filename, each under its own run dir. The denial therefore no longer
    # lands in `llm_requests.jsonl` — reading (b), a second writer on the design's existing
    # filename, was rejected as partly unbuildable (the writer refuses a second open of one path).
    # Still carries the consensus that the denial takes its place in that stream's OWN ORDERING
    # as its own event type — hence the identity bind (serialized-append).
    binds: ["interacts(query_tool->policy_denial_stream)", "policy_denial_stream.identity"]
    discharged_by: test_a_denial_appends_a_policy_event_to_the_durable_request_stream

  - id: d7_denial_audited_at_the_judge_site
    kind: behavior
    form: test
    # No longer provisional — §7 R1 settled FORK 1, the highest-impact open decision in the run.
    # RE-BOUND onto the same boundary as d6: the second site's sink is the SAME filename under
    # the JUDGE's own run dir, not the per-batch, per-pid stage trace (n4/g20) and not the
    # judge's own page. `judge_audit_stream` stays in the graph as the pre-existing stage trace
    # it really is, with no denial edge onto it.
    # The "not best-effort" guarantee is severed from the location question: all three answering
    # copies read it as a property of the RECORD, and R1's rider confirms it reaches both sites.
    binds: ["interacts(closed_ticket_tool->policy_denial_stream)", "policy_denial_stream.identity"]
    discharged_by: test_a_judge_side_denial_is_audited_where_an_analyst_looks

  - id: d8_denial_record_is_not_best_effort
    kind: behavior
    form: test
    # Explicitly does NOT inherit the precedent: log_budget_refusal wraps its write in
    # contextlib.suppress(Exception) and emits neither timestamp nor seq (c12/g8), so its record
    # can vanish while the refusal still takes effect. g24 sharpens this — the audit writer
    # normalizes NOTHING. §7 R2 forecloses swallowing the write error outright: a failed write
    # propagates as an infra failure, AFTER the refusal has taken effect. Bound at BOTH sites,
    # per R1's rider that the guarantee is a property of the record rather than of the file.
    # ALTITUDE, RECORDED RATHER THAN LEFT SILENT (phase F): this demand binds a judge-site
    # payload address but its test drives the shared writer class directly, never through the
    # judge tool. That is legal precisely under R1's rider — the guarantee is a property of the
    # record, and g8 established both sites construct the same writer — but it is the one place
    # in this suite where a per-site drive was not required, and the sibling demands at this
    # boundary (d7, d4, d32) each drive the judge leg for the opposite reason. Written down so
    # the exception reads as a decision rather than an oversight.
    binds: ["interacts(query_tool->policy_denial_stream).payload",
            "interacts(closed_ticket_tool->policy_denial_stream).payload"]
    discharged_by: test_the_denial_record_carries_a_timestamp_and_a_seq_and_does_not_swallow_a_failed_write

  - id: d9_denial_renders_in_the_run_html
    kind: behavior
    form: test
    # RED FLAG, from g23: "renders in the run HTML" CANNOT be discharged by "no exception". The
    # probe drove the real renderer with an unrecognized record kind and with a lone
    # budget_refusal stream — both rendered fine (53569 / 46481 chars) and the record appeared
    # NOWHERE, because every consumer filters `kind in {request, response}` (g9). A denial can be
    # durably on disk and absent from the analyst's page with every test green. The test asserts
    # the DENIAL'S OWN CONTENT in the rendered output; the new consumer that stops filtering it
    # is the actual work. Its complementary control is d54.
    binds: ["interacts(visualize_runtime->policy_denial_stream)"]
    # TIGHTENED IN THE REPAIR PASS — H5. A substring assertion over the rendered file is
    # satisfied by a denial emitted as an HTML COMMENT, or appended outside the document
    # element: every string present, the page blank of the thing this demand exists to put on
    # it — which is indistinguishable, from the analyst's side, from the silent drop g23 found.
    # The assertion is now on the visible document, with comments and script bodies stripped,
    # and the filter itself carries a control proving it is not inert.
    discharged_by: test_a_denial_is_visible_in_the_rendered_run_html

  - id: d54_old_stream_still_renders
    kind: survival
    form: test
    # The consensus row `test_the_run_html_reader_meets_a_stream_written_before_it_existed`
    # (2/3 + g23's holding half). d9's complementary control: without it the visibility
    # assertion is satisfiable by a renderer that crashes on every run with no denial in it.
    binds: ["interacts(visualize_runtime->policy_denial_stream)"]
    discharged_by: test_a_stream_written_before_the_denial_record_existed_still_renders

  - id: d5_malformed_call_still_lands_in_queries
    kind: domain-outcome
    form: test
    binds: ["interacts(query_tool->executed_queries)"]
    discharged_by: test_a_malformed_call_keeps_todays_queries_row

  # --- O6 / D7 — a denial moves no state ----------------------------------------------------
  - id: d3_no_state_at_the_query_tool
    kind: negative      # positive control: d31
    form: test
    # Currently violated (c4/g5): the reject branch calls _record before raising, so the row
    # (exit_code=64, error_class='agent-fixable'), the seq and gather_raw/L1/0.json all exist
    # before the refusal. The O6-safe slot is between the breaker's zero-record early return and
    # _reject's call into _record. Both tables derive seq by COUNTING their own rows (f4/g7), so
    # not writing a row IS not allocating a seq. Also carries the whole-lead consensus: a lead
    # every query of which was denied leaves zero rows on the evidence surface.
    # PHASE-F: the "WELL-FORMED denied calls only" narrowing R3/R23 forced onto this demand is
    # WITHDRAWN. With authorization running first there is no path on which a denied call
    # writes a row, so the obligation is surface-general again over denied calls.
    # REPAIR PASS (F2) — THE DEMAND BECOMES CONSERVATION PLUS SCOPED ABSENCE. As written it
    # asserted an EMPTY payload tree, which no correct implementation can produce: dispatch
    # writes one flat sidecar at the root of that tree before any query runs, and the assertion
    # globbed the whole tree recursively. The two kinds of state are disjoint by path —
    # dispatch allocates the sidecar and no sequence and not the lead-scoped subdirectory; a
    # query call writes only inside that subdirectory — so the absence half is now scoped to
    # it, which is the predicate the test already carried one line below the broken one.
    # Absence alone is NOT the repair. The adversary greened this exact assertion by DELETING
    # the dispatch sidecar and the lead's queries row after a denial — destroying real evidence
    # to satisfy "leaves nothing behind", which is strictly worse than the state it hid. So the
    # demand now snapshots the evidence surface before the denied call and requires it
    # BYTE-IDENTICAL afterwards, observed from inside one real run (the replay model snapshots
    # at each request, straddling the call). The unadvanced sequence counter is observed where
    # it is observable at all: the first GRANTED call after two denials still takes seq 0.
    binds: ["interacts(query_tool->executed_queries)", "interacts(query_tool->gather_raw)",
            "gather_raw.identity"]
    cites: [g27]   # dispatch-state vs query-state disjointness by path is what makes both halves assertable at once
    discharged_by: test_a_denied_gather_verb_leaves_no_queries_row_and_no_payload_file

  - id: d31_granted_gather_call_positive_control
    kind: behavior
    form: test
    binds: ["interacts(query_tool->executed_queries)", "interacts(query_tool->gather_raw)"]
    discharged_by: test_a_granted_gather_verb_still_writes_its_row_and_its_payload

  - id: d4_no_state_at_the_judge_tool
    kind: negative      # positive control: d32
    form: test
    # RE-BOUND by the assembler (see the header): the judge's capture sink is `judge_queries_table`
    # — its own run dir, keyed by seq alone, payloads at ticket_reads/{seq}.json. One assertion
    # written against gather's names passes VACUOUSLY here (n7/g7, dispositions Red flag 3).
    # AUTHOR WARNING (n5): the second site is NOT a blank slate. Its key-grammar and self-key
    # refusals already raise with no seq and no payload, while the missing-grammar path
    # deliberately DOES write a row so the audit trail evidences zero store attempts. Do not
    # flatten that reasoned split into "denials write nothing here". d72 pins where the grant
    # check sits AMONG those screens; this demand still pins only the grant denial's own
    # zero-state, and the "WELL-FORMED" narrowing it used to carry is withdrawn with R3's.
    binds: ["interacts(closed_ticket_tool->judge_queries_table)",
            "interacts(closed_ticket_tool->ticket_reads)",
            "ticket_store.access[closed-ticket-tool]"]
    discharged_by: test_a_denied_closed_ticket_verb_leaves_no_row_and_no_ticket_reads_file

  - id: d32_granted_judge_call_positive_control
    kind: behavior
    form: test
    binds: ["interacts(closed_ticket_tool->judge_queries_table)", "interacts(closed_ticket_tool->ticket_reads)"]
    discharged_by: test_a_granted_closed_ticket_verb_still_writes_its_row_and_its_payload

  - id: d10_denial_moves_no_breaker
    kind: negative      # positive control: d33
    form: test
    # n10: partly free by construction — record_outcome no-ops unless is_infra_failure(exit_code).
    # The demand guards the EXIT-CODE CHOICE, which is why it binds the new `policy-denial` class
    # rather than the mechanism. Ordering is load-bearing (f-note on n10): record_outcome raises
    # RunAborted at the run-wide kill limit and is called AFTER the row is appended — a denial
    # short-circuit inserted upstream must not invert that.
    binds: ["interacts(query_tool->circuit_breaker)", "interacts(closed_ticket_tool->circuit_breaker)",
            "circuit_breaker.domain.distinguished[policy-denial]"]
    discharged_by: test_a_denial_does_not_move_the_circuit_breaker

  - id: d33_infra_fault_moves_the_breaker
    kind: behavior
    form: test
    # Binds the audit stream too: the consensus assertion is that a granted call's outage stays an
    # infra fault, distinguishable from a policy denial in BOTH the audit trail and the breaker.
    binds: ["interacts(query_tool->circuit_breaker)", "interacts(closed_ticket_tool->circuit_breaker)",
            "circuit_breaker.domain.distinguished[infra]",
            "interacts(query_tool->policy_denial_stream)"]
    discharged_by: test_an_infra_fault_still_moves_the_circuit_breaker

  # --- D5 / D6 — one gate, one roster -------------------------------------------------------
  - id: d20_grant_lives_on_agent_definition
    kind: seam
    form: test
    # n11/g16: the shape differs and the blast radius is eight. AgentPolicy carries no verb field;
    # compile_policy builds bash_allow by CALLING each bash_shape with ResolvedRoots, while a verb
    # grant is static data needing no roots — so "the same shape" is a SEAM claim, not a signature
    # claim. And g16 refuted the reach: GATHER_DEF declares query=True statically, but JUDGE_DEF's
    # closed_tickets bit is set by a runtime `replace()` at stage build, so D5's one gate reaches
    # gather cleanly and the judge not at all. FORK 7 owns both halves (the default and the
    # dynamic bit).
    # PHASE-F ADDITION — the seam g16 forces and the design names no mechanism for: the policy
    # build must accept the EFFECTIVE ToolSet a stage builds with, not only the one its
    # definition declares, or the judge's runtime-set capability is structurally invisible to
    # the agreement check d61 demands. Pinned here because "the seam is part of the contract"
    # rather than left to whoever implements d61.
    binds: ["verb_grant", "compile_policy", "agent_policy"]
    discharged_by: test_the_verb_grant_compiles_into_the_agent_policy

  - id: d18_catalog_derives_from_the_grant
    kind: behavior
    form: test
    # RE-BOUND. R-A2 made the model-facing verb roster grant-derived and made the correspondence a
    # demand; g10 established the roster is hand-written skill prose, not descriptor_catalog. So
    # this demand binds the GENERATED roster, the prose it replaces, and the per-system catalog
    # that must narrow alongside it. Its counter-examples exist TODAY and must fail before the
    # change lands: skills/ticket/SKILL.md:25,26,101,102; skills/cmdb/execution.md:16;
    # skills/identity/execution.md:18,20 — and skills/cmdb/SKILL.md:52 instructs the model to use
    # identity's list-authorized-hosts. FORK 9 owns the generator's own contract (fail-open vs
    # fail-closed at generation failure, committed artifact vs per-run assembly).
    # ALTITUDE WARNING (dispositions): a phrasing calling the roster's narrowing "cosmetic" against
    # the registry's scoping was true of the design as WRITTEN and is false after R-A2. Roster
    # content is load-bearing.
    # PHASE-F REPAIR: this demand is credited at the gate as the SURVIVAL demand for the live
    # dependent of R-A2's `mode: remove` edge — the gather leg reading the withdrawn prose —
    # and its test inspected the generated roster STRING. Nothing put the roster in front of
    # the consumer, so the demand claimed a wiring and the test checked a shape:
    # interacts(gather_dispatch->verb_roster) was bound by nothing and carried no waiver. The
    # test now drives that leg — a real run in which the gather agent reads its own role's
    # committed roster through the real read tool, asserted on the delta that read added so
    # the ambient prompt cannot satisfy it.
    # SECOND-PASS REPAIR (reconciliation finding 1, BLOCKING): that repair's withheld-verb
    # screen compared bare VERB NAMES against the delivered text, and the withheld set shares
    # a name with the granted set — `identity.list-roles` is granted to gather, `cmdb`'s is
    # granted to nobody. The screen forbade a string the same grant requires, so no correct
    # roster could satisfy the test. Authorization is a property of the (system, verb) PAIR
    # and this suite asserts exactly that at the decision point; the roster has to be
    # addressable the same way. DECIDED HERE, because it fixes what the roster renders: each
    # granted verb appears as its qualified `{system}.{verb}` call id — the id form
    # executed_queries already keys on — under its own system's section. The suite reads them
    # back through one parser, used for the positive half as well, so a roster rendering
    # nothing parseable fails loudly instead of passing its negatives vacuously. The same
    # bare-name assumption was swept for elsewhere and found in one more place: the read-surface
    # audit (d45), whose local tree now grants a verb on one system and withholds the same name
    # on its sibling, so a name-keyed audit reports its own committed prose as an offender.
    binds: ["verb_roster", "system_skill_prose", "verb_grant", "descriptor_catalog",
            "interacts(roster_generator->verb_roster)",
            "interacts(gather_dispatch->verb_roster)"]
    discharged_by: test_the_advertised_catalog_names_only_granted_verbs

  - id: d19_catalog_memo_keys_on_role
    kind: uniqueness
    form: test
    # n3's correction: functools.cache keys on ALL arguments, so a role passed as a PARAMETER
    # enters the key automatically; the trap is a role read from deps inside the body, or
    # defaulted. And today there is exactly one caller, so the cross-role collision is a hazard
    # the change CREATES, not one it inherits. FORK 16's binding constraint carried into phase E:
    # the two-roles test must use two DISTINCT REAL role ids, never placeholders, or it passes
    # under exactly the falsy-collapse it exists to exclude.
    binds: ["descriptor_catalog.identity", "verb_roster.identity"]
    # TIGHTENED IN THE REPAIR PASS — H11. Adding the grant as a third argument is
    # exactly the edit that drops the catalog's existing resolve check — narrowing by grant
    # reads like the whole filter, and nothing downstream notices a system named to the model
    # that cannot be reached. Conservation, not new scope: a granted system whose adapter will
    # not import must still be absent from the catalog.
    discharged_by: test_two_roles_in_one_process_each_get_their_own_catalog

  # --- the grant's contents -----------------------------------------------------------------
  - id: d21_shipped_grant_contents
    kind: domain-outcome
    form: test
    binds: ["verb_grant.domain.distinguished[gather]", "verb_grant.domain.distinguished[benign_judge]"]
    discharged_by: test_the_shipped_grants_name_exactly_the_censused_verbs
    rejected: [{nl: "deriving the grant from the registry, which would grant everything and reproduce the status quo with ceremony"},
               {nl: "deriving it mechanically from run history, which names five verbs that do not exist (c19)"}]

  - id: d22_gather_cannot_get_a_ticket
    kind: negative      # positive control: d34
    form: test
    binds: ["verb_grant", "interacts(query_tool->ticket_store)", "ticket_store.access[query-tool]"]
    discharged_by: test_gather_is_denied_ticket_get_ticket

  - id: d34_gather_list_tickets_positive_control
    kind: behavior
    form: test
    binds: ["interacts(query_tool->ticket_store)", "ticket_store.access[query-tool]"]
    # TIGHTENED IN THE REPAIR PASS — H8, and a fixture that made two demands
    # contradict. The fake answered with a bare array while this test required exit_code == 0,
    # and the store's real list endpoint answers an object envelope which gather's screen
    # enforces as a contract — so the only implementation satisfying both was one whose screen
    # skips non-object payloads, which is exactly the bypass that dodges the self-case
    # exclusion. The fake now answers in the store's real shape.
    discharged_by: test_gather_list_tickets_still_reaches_the_store

  - id: d23_self_case_list_filter_survives
    kind: survival
    form: test
    # FORK 17 recommends keeping the guard rather than retiring it with its tests: the grant makes
    # its GET branch unreachable, but it is the only thing standing if the grant is ever widened.
    binds: ["interacts(query_tool->ticket_store)"]
    # TIGHTENED IN THE REPAIR PASS — H8. The fixture returned two tickets NEITHER of
    # which was the current case, so the screen ran, removed nothing, and every assertion about
    # call counts and exit codes passed over a guard never asked to guard. The self key is the
    # run's own id; the store now returns it beside a foreign key, the exclusion is asserted on
    # the model-visible delta and on the captured payload, and a second drive pins that a bare
    # array is filed as malformed rather than forwarded unscreened.
    discharged_by: test_the_self_case_list_filter_still_excludes_the_current_ticket

  - id: d27_health_check_granted_uniformly
    kind: domain-outcome
    form: clause
    binds: ["verb_grant.domain.alternatives[health-check]"]
    outcome: {nl: "health-check is granted uniformly to gather rather than per system, a deliberate uniformity exception — gather does call it and the split carries no security content."}

  - id: d28_no_per_param_policy
    kind: negative      # positive control: d21 (the grant enumerates (system, verb) and nothing else)
    form: clause
    # FORK 19 rides here: a call's query_id can impersonate a committed template id belonging to
    # another system or verb. The grant decision is a function of (role, system, verb) and of
    # nothing else; whether a DOWNSTREAM consumer attributes the call to that template is a
    # residual against FORK 18's unused-grant flag, not a policy input.
    binds: ["verb_grant"]
    outcome: {nl: "The role grant expresses no per-params, per-template or per-query_id constraint; selecting scope within a target is not authorized here. Params that select the TARGET SYSTEM are not scope and are handled inside the verb by D3, which is what keeps them out of role policy. An impersonated query_id must not change what the grant enforces."}
    rejected: [{nl: "filtering the ES|QL string for badness — the in-process matcher the issue's own first non-goal rules out"}]

  # --- non-obligations kept visible ---------------------------------------------------------
  # THE FOUR CLAUSES BELOW AND AT d50/d51 HAVE NO TEST, BY CONSTRUCTION, and phase F's blind
  # reader could not tell that from their names. `form: clause` means the spec deliberately
  # keeps the sentence and mints no obligation — never that a test is missing. Each is also an
  # explicit entry in handoff.drops so a downstream reader meets the reason, not the silence.
  # d29's id was RENAMED here: "class_3" read as a third verb-class TIER (the vocabulary R13
  # closed at two), which is not what it is about — it is the threat model's own class 3.
  - id: d29_threat_model_estate_write_class_stays_open
    kind: behavior
    form: clause
    binds: ["threat_model_doc", "ticket_store.access[http-write]"]
    outcome: {nl: "threat-model.md's class 3 — the estate-write class, not a verb-class tier — is not flipped to closed by this work: four estate-write endpoints remain unchanged at HEAD (g14), two of them ungated, and the loop-driven pair — ticket comments and resolution transitions carrying the adversarial judge's free-text resolution_method, which later runs read back — is a stored-injection cycle through the estate with no human PR gate. None is a tool call, so none is in scope; all four sit on the resource the granted ticket read verbs read back. Filed as issue #767, which W2's waiver now cites."}

  - id: d30_credentials_not_rescoped
    kind: behavior
    form: clause
    binds: ["elastic_credential"]
    outcome: {nl: "Credentials are not rescoped: six of the seven systems are auth-less stubs and Elastic is the only adapter that authenticates, as the built-in superuser. The recorded reason is that the environment has no authz model to scope against — not that the credential is fine. Read-only stays a property of the verb bodies. O2-for-esql (d13) and this are the same gap from two ends."}

  # ===========================================================================
  # ASSEMBLER-MINTED (d38-d51) — 45-dispositions' consensus assertions that no
  # 20-demands entry bound. Each carries a 3/3 outcome; none resolves a fork.
  # ===========================================================================

  - id: d38_denial_decided_without_importing_the_adapter
    kind: behavior
    form: test
    # Consensus, two premises: a denial races a broken adapter import, and a denial on a system
    # that cannot be loaded at all. Both converge on one property — the denial is decided from the
    # GRANT ALONE, so a broken import neither produces nor masks it, and the verdict is observable
    # without the adapter ever being imported. This is also what FORK 10's recommendation turns on.
    # RE-AUTHORED at phase F: the unloadable system in this test is one the grant reaches
    # nowhere, so under R11 read literally its verdict is UNRESOLVABLE, not DENIED. Both
    # verdicts are asserted, because what the demand is about is that NEITHER needs the import.
    binds: ["verb_grant", "interacts(query_tool->verb_registry)", "interacts(query_tool->verb_registry).response"]
    # TIGHTENED IN THE REPAIR PASS — H1. The discharging test put only the UNRESOLVABLE
    # verdict on the unloadable adapter, so the DENIAL leg was decided against a module that
    # imports cleanly and the property "no import is needed to deny" was never observed. An
    # implementation wrapping the decision in a broad `except` and falling back to UNRESOLVABLE
    # greened it, silently downgrading a denial into an outcome that is neither refused as
    # policy nor audited. The denial leg now runs on the unimportable system — grant reaches it,
    # withholds the verb — and the run is driven end to end, because "downgraded" and "denied"
    # differ in what lands on disk: a queries row and no denial record.
    discharged_by: test_a_denial_is_decided_from_the_grant_without_importing_the_adapter

  - id: d39_adapter_failure_is_not_remembered
    kind: behavior
    form: test
    # Consensus, two premises: a transient import glitch must not stick as a permanent denial, and
    # each call to a broken system pays the cost fresh. One property: no remembered failure state
    # changes what a later call experiences. Guards the fault-containment posture d15 pins from
    # being re-introduced as a cache.
    binds: ["verb_registry", "interacts(query_tool->verb_registry).response"]
    discharged_by: test_a_transient_adapter_import_failure_does_not_stick_across_a_run

  - id: d40_confinement_refuses_before_transport
    kind: behavior
    form: test
    # Consensus. Ordering, not outcome: target confinement refuses BEFORE any transport is
    # attempted, so a live backend outage cannot arrive first and obscure the refusal. Distinct
    # from d11/d12, which pin the refusal itself against a healthy backend.
    binds: ["interacts(host_state_adapter->docker_exec)", "interacts(elastic_adapter->estate)"]
    discharged_by: test_target_confinement_refuses_before_any_transport_is_attempted

  - id: d41_in_bounds_outage_unchanged
    kind: survival
    form: test
    # Consensus. The conservation half of D3: an in-bounds call's backend outage is recorded
    # exactly as today — confinement changes nothing after the gate. Without it the suite tests
    # only the new restriction and silently regresses what the old surface quietly served.
    binds: ["interacts(elastic_adapter->estate)", "interacts(host_state_adapter->docker_exec)",
            "interacts(query_tool->executed_queries)"]
    discharged_by: test_an_in_bounds_calls_backend_outage_is_recorded_exactly_as_today

  - id: d42_repeated_denials_audit_each_and_move_nothing
    kind: behavior
    form: test
    # Consensus, plus FORK 14's promoted assertion — which the dispositions leaf judged safe to
    # bind as written. Two halves: every denied call appends its OWN audit record (no dedup key,
    # no per-run cache), and the hundredth identical denial has still moved no state.
    # RESIDUAL recorded, not built: the design refuses to coach a retry and nothing else ends a
    # denial loop, so a model re-issuing a denied call spins until an unrelated budget stops the
    # run. A counter cannot live in the queries table (the surface a denial must stay out of) or
    # in the circuit breaker (infra faults only) — which is why FORK 14 recommends recording it.
    binds: ["interacts(query_tool->policy_denial_stream)", "interacts(query_tool->executed_queries)",
            "interacts(query_tool->circuit_breaker)"]
    discharged_by: test_repeated_identical_denials_each_audit_and_never_move_run_state

  - id: d43_registry_memo_keys_on_role
    kind: uniqueness
    form: test
    # Consensus. d19's sibling one layer in: role enters any memo key gating REGISTRY reuse, so
    # one role's grant never serves another's call. Distinct boundary from the catalog's memo —
    # n2's consequence is that scoping the registry TYPE forces a grant into the catalog's key by
    # construction, so these two demands meet in the implementation but not in the address space.
    binds: ["verb_registry.identity"]
    discharged_by: test_two_roles_in_one_process_never_share_a_scoped_registry

  - id: d44_denial_needs_no_lead_context
    kind: negative      # positive control: d31
    form: test
    # Consensus. The allocation machinery a denial must not touch is LEAD-SCOPED; a denial
    # arriving outside a dispatched lead must still be decided and audited without it. Pins that
    # the early return is genuinely early rather than merely conditional.
    binds: ["interacts(query_tool->executed_queries)", "interacts(query_tool->gather_raw)"]
    discharged_by: test_a_denial_outside_a_dispatched_lead_runs_no_lead_scoped_allocation

  - id: d45_no_model_read_surface_names_a_withheld_verb
    kind: negative      # positive control: d18 (the roster DOES name every granted verb)
    form: test
    # Consensus across FOUR premises, all 3/3: prose surrounding the generated roster, a committed
    # query template, a template the index hides but search reaches, and a post-generation re-edit
    # that writes a withheld verb back in — each is the same violation, with no carve-out. The
    # phase-E test is parametrized over those four surfaces.
    # SCOPE BOUND (FORK 8, undecided): read literally, "nowhere the model reads" is unsatisfiable —
    # the adapter sources name their own verbs. FORK 8's recommendation is to scope this to an
    # ENUMERATED set of build-time artifacts and record two residuals: the loop-written lesson
    # corpus (a stored channel that erodes the "never invited" bound AFTER ship, in files this
    # change's diff never touches) and the read-scope reachability of the defining artifacts.
    # The enumeration this demand rests on is an outstanding probe obligation, NOT an established
    # list — dispositions Red flag 4.
    # THIRD-PASS REPAIR (reconciliation finding 1, BLOCKING) — WHAT THE AUDIT SCANS FOR IS NOW
    # PART OF THE DEMAND, decided by the human as an amendment to §7 R8. The pair-keying repair
    # was right about the DECISION and wrong about the SCAN: it pinned the audit against one
    # prose form, `query(system=…, verb=…)`, and two of the four counter-examples this demand
    # was minted to correct are bare names — the ticket store's own query table (bare
    # subcommands in the owning system's file) and, the site this run has cited five times,
    # cmdb's prose telling the model to use "the identity stub's `list-authorized-hosts`". A
    # qualified-only audit reports zero over a tree that still carries the instruction, which
    # is precisely the escape. Decision: the audit reads three forms — qualified (attributes to
    # the pair); bare in the owning system's own file for a verb that system declares
    # (attributes to that system, which is what keeps the collision's granted half clean); bare
    # anywhere else (attributes to nothing, judged against every system declaring the name, an
    # offender if any of those pairs is withheld). The accepted cost is FALSE POSITIVES on the
    # third rule, and the correction for one is to qualify the name — recorded here rather than
    # as a numbered residual because it is the price of the decision, not a gap beside it.
    # Authorization itself is untouched: the grant still decides on the pair.
    # The test now asserts the real tree in BOTH directions. Zero offenders under the shipped
    # grant (red today, and the only thing that makes "the change is not done until such
    # artifacts are corrected" bite), AND — computed off the tree, never recalled — every
    # committed file that names a declared verb only in bare form is reachable by the audit
    # under a grant that names nothing. Without the second half the zero is a claim about the
    # instrument rather than about the tree.
    # REPAIR PASS (F3) — A FOURTH ATTRIBUTION RULE, AND A KEYED INTERFACE. The three rules
    # above attribute a NAME to a (system, verb) pair and say nothing about which ROLE's
    # permissions a file is judged against, so the moment a second role ships a generated
    # roster the audit reports it as an offence: the judge's grant names two ticket verbs
    # gather's withholds, and those two ARE two of the four counter-examples this demand's zero
    # is built on. Rule 4: a generated roster is scored against its OWN role's grant, read off
    # the role-keyed path it is committed under; every other audited surface against gather's,
    # which is well defined because those surfaces have exactly one production consumer. The
    # audit's interface therefore changes from an unkeyed tuple of grants to a MAPPING of which
    # grant governs which file.
    # Excluding rosters from the audited surface was REJECTED and the rejection is ASSERTED,
    # not just recorded: it breaks no other assertion, which is precisely what makes it
    # indistinguishable from the dishonest edit, so the test now requires that scoring the
    # judge's roster against gather's grant FLAGS it. A roster quietly dropped from the audited
    # set fails there rather than passing everything.
    binds: ["system_skill_prose", "query_templates", "verb_roster", "verb_grant"]
    cites: [g28]   # the exact collision (two withheld pairs ARE two counter-examples) is that probe's finding
    discharged_by: test_no_model_read_surface_names_a_verb_the_grant_withholds

  - id: d46_compiled_policy_answers_role_capability
    kind: behavior
    form: test
    # Consensus 3/3, and the one premise the dispositions leaf routed to phase D by name:
    # "no demand binds this yet; phase D must mint one or record a drop". Minted. The operator
    # question "what may this role do" is answered by the compiled policy with granted verbs
    # ALONGSIDE bash shapes — one answer, one place. d20 pins that the grant compiles in; this
    # pins that the compiled object answers.
    binds: ["agent_policy", "compile_policy", "verb_grant"]
    discharged_by: test_the_compiled_policy_answers_what_this_role_may_do_with_verbs_beside_bash_shapes

  - id: d47_new_verb_denied_and_unadvertised_until_granted
    kind: behavior
    form: test
    # Consensus. The one instance of O4 that is NOT vacuous against today's code: a newly authored
    # verb shipped through the scaffold does not execute for any role until a grant names it, and
    # is never advertised before then — the scaffold gets no weaker gate. This is what makes d26's
    # clause more than prose.
    # RE-AUTHORED at phase F under R11 read literally, which splits the obligation in two. A new
    # verb on a system the role ALREADY holds is DENIED — asserted first, because it is the whole
    # of what keeps deny-by-default non-vacuous. A whole new SYSTEM is UNRESOLVABLE: nothing
    # executes, but no policy refusal is what happened and no denial record is written. RS14
    # carries that out loud rather than letting this demand read as covering ground the label
    # change took away from it.
    binds: ["verb_grant", "verb_roster", "interacts(validate_scaffold->verb_registry)"]
    discharged_by: test_a_newly_authored_verb_is_denied_and_unadvertised_until_a_grant_names_it

  - id: d48_near_miss_names_never_execute
    kind: negative      # positive control: d34 / d31
    form: test
    # Consensus on the OUTCOME (3/3, both the system-name and verb-name premises): a case or
    # whitespace variant of a granted name is never treated as granted and never executes. All
    # three copies leave the LABEL open — denied (no queries row) or unresolvable (row written,
    # retry coached) — and those two differ in written state. FORK 11 decides the label; this
    # demand pins only that nothing executes.
    binds: ["verb_grant", "interacts(query_tool->verb_registry).response"]
    discharged_by: test_a_case_or_whitespace_variant_of_a_granted_name_never_executes

  - id: d49_host_target_case_variant_refused
    kind: negative      # positive control: d35
    form: test
    # Consensus 3/3 on the outcome: a case, whitespace, substring or prefix variant of a declared
    # inventory host is refused, not warned-and-proceeded, and no normalization equates it to the
    # real host. Whether a near-miss earns its own message is open and cosmetic.
    binds: ["host_state_target.domain.distinguished[ELASTICSEARCH]", "interacts(host_state_adapter->docker_exec)"]
    discharged_by: test_a_case_variant_of_an_inventory_host_is_refused_not_normalized

  - id: d50_judge_site_has_no_roster_to_bound_the_denial_cost
    kind: behavior
    form: clause
    # FORK 20, recorded not decided. Minted as a clause so it cannot vanish: the bound D2's
    # accepted cost rests on ("the model is never invited to call it") has no carrier at the
    # second model-facing site. RENAMED at phase F — "never invited bound absent" is what the
    # blind reader could not parse, and its unparseability was the finding.
    binds: ["verb_roster", "interacts(closed_ticket_tool->verb_registry)"]
    outcome: {nl: "The design bounds the accepted cost of denying a legitimate verb by promising the model is never invited to call one — a promise the grant-derived roster carries at the runtime. At the judge's closed-ticket tool there is no roster and nothing advertises verbs to the model at all, so that bound is ABSENT there rather than satisfied: a judge-side denial is a refusal the model had no way to anticipate. All three answering copies declined to call this vacuous or inapplicable. Recorded as a sentence in the spec, not banked as coverage, and deliberately carrying no test."}

  - id: d51_denial_stream_read_scope_is_unconstrained
    kind: behavior
    form: clause
    # FORK 20, recorded not decided (§7 R20 accepted it as a recorded non-obligation, RS11).
    # Re-bound with d6/d7: the stream in question is the policy-denial stream R1 chose.
    # RENAMED at phase F for the same reason as d50 — the old id read as an assertion that the
    # stream IS in scope, which is the opposite of what the clause says.
    binds: ["policy_denial_stream"]
    outcome: {nl: "This spec does NOT constrain whether the durable policy-denial stream sits inside the read scope of the very role whose calls it records — a denied agent may be able to read its own denial records, and nothing here forbids or requires it. The reason it is a non-obligation rather than a hole: what that agent would find there is the same information its refusal message already hands it, under the design's explicit no-surface-hiding stance (N4). It becomes an obligation only if the operator wants the audit stream out of every model role's read scope on principle, which is a decision this issue does not make. Deliberately carries no test."}

  # ===========================================================================
  # PHASE-E MINTS (d52-d70) — one per §7 resolution that decides an OBSERVABLE and
  # that no d0-d51 demand already binds. Every one names the resolution it applies;
  # none picks a branch of its own. A resolution applied loosely is a fork re-opened
  # silently, so each lands in a test here or is red-flagged in 80-author-digest.md.
  # ===========================================================================

  - id: d52_health_check_uniform_grant_is_exercised
    kind: domain-outcome
    form: test
    # §7 R21 — the human minted this by name. d27 (clause) records the uniformity; what was
    # missing was an executable demand exercising it: the investigator can call it, a
    # non-gather role cannot.
    # RE-AUTHORED at phase F under R11 read literally: a role whose grant names nothing reaches
    # elastic nowhere, so ITS health-check is unresolvable rather than denied. The demand needs
    # non-GRANTED, not the DENIED label — and a third role that holds the system but not the
    # verb is added so the denial half of the uniformity claim is still exercised somewhere.
    binds: ["verb_grant.domain.alternatives[health-check]", "interacts(query_tool->verb_registry)"]
    discharged_by: test_health_check_is_granted_uniformly_to_gather

  - id: d53_grant_check_precedes_the_traversal_screen
    kind: behavior
    form: test
    # §7 R23, REVERSED at phase F together with R3. The screen was the third of three cheap
    # ways to be refused without being recorded; authorization now runs ahead of it, so a
    # traversal-shaped id no longer buys a silent refusal. R23's own stated benefit — keeping
    # a hostile model-authored id out of the durable record — is preserved by a different
    # mechanism: d66's bounded, NORMALIZED projection, which this demand's test asserts on the
    # denial path so the reversal does not silently re-open the hazard R23 named.
    # SECOND-PASS REPAIR (reconciliation finding 2): the reversal left the screen behind the
    # grant check, where NO test reached it — the one test naming it drives a denied call,
    # which by construction stops earlier. An implementation could satisfy this entire suite by
    # DELETING the screen, and a granted call's model-authored id would then reach catalog-path
    # construction unscreened: exactly the hazard R23 was chosen to close, re-entering as a
    # conservation failure rather than an ordering one. The screen is now pinned where it is
    # still reachable — the same hostile id on a GRANTED verb, the complementary condition,
    # where the screen is the first refusal that can fire. It keeps today's malformed treatment
    # and the model-authored id never becomes the row's catalog id.
    binds: ["interacts(query_tool->verb_registry).response",
            "interacts(query_tool->executed_queries)", "interacts(query_tool->policy_denial_stream)"]
    discharged_by: test_a_denied_call_is_refused_before_its_query_id_meets_the_traversal_screen

  - id: d55_denial_beats_malformed
    kind: behavior
    form: test
    # §7 R3's first half, REVERSED at phase F. The malformed-first split was defensible alone
    # and indefensible in composition: with the traversal screen (R23) and R11's unresolvable
    # silence beside it, a model that appended one unrecognised parameter to every call it
    # expected to be refused produced zero denial records for the life of a run, and nothing
    # in the record noticed. A refusal whose flavour the caller chooses is not an
    # authorization decision. Consequence: the malformed-and-denied call takes the DENIAL
    # path, leaves NO evidence row, and IS audited — and the narrowing this demand used to
    # impose on every no-evidence-row obligation is withdrawn.
    binds: ["interacts(query_tool->executed_queries)", "interacts(query_tool->policy_denial_stream)",
            "interacts(query_tool->verb_registry).response"]
    discharged_by: test_a_malformed_and_denied_call_takes_the_denial_path

  - id: d56_denial_beats_the_availability_short_circuit
    kind: behavior
    form: test
    # §7 R3, second half — unambiguous, and it closes the hole where an attacker who first
    # exhausts a system silences the audit trail for it (the short-circuit refuses with no
    # record at all).
    binds: ["interacts(query_tool->policy_denial_stream)", "interacts(query_tool->circuit_breaker)",
            "circuit_breaker.domain.distinguished[policy-denial]"]
    discharged_by: test_a_denial_is_decided_before_the_availability_short_circuit

  - id: d57_host_state_confines_the_pair
    kind: parity
    form: test
    # §7 R4 — resolves `read_endpoint_allowlist.access[docker-exec]`'s `unknown` (UNKNOWN #4)
    # and `host_state_target.domain.distinguished[defender]`. A SECOND RULE FORM: g11 refuted
    # that the row-shaped endpoint rule can express the effecting universal for host-state's
    # six verbs, which reach the estate as literal argv with no URL anywhere. Both halves —
    # program against a per-system allowlist AND target against the declared inventory.
    binds: ["read_endpoint_allowlist.access[docker-exec]",
            "host_state_target.domain.distinguished[defender]",
            "interacts(host_state_adapter->docker_exec)"]
    discharged_by: test_a_host_state_verb_confines_the_program_and_the_container_target_together

  - id: d58_index_reach_refuses_the_whole_call
    kind: domain-outcome
    form: test
    # §7 R5 — binds all three of elastic_index's distinguished cells with one decision:
    # evaluate REACH, not the literal, and refuse the WHOLE call. Never silently narrow to the
    # in-bounds members, which satisfies the letter of the obligation while hiding an attempted
    # cross-tenant read from the audit trail that exists to record it.
    binds: ["elastic_index.domain.distinguished[logs-*,security-audit-*]",
            "elastic_index.domain.distinguished[*]",
            "elastic_index.domain.distinguished[-logs-*]",
            "interacts(elastic_adapter->estate)"]
    discharged_by: test_an_index_expression_whose_reach_widens_refuses_the_whole_call

  - id: d59_endpoint_binds_on_the_resolved_path
    kind: parity
    form: test
    # §7 R6 — post-interpolation is the only side where a path-altering parameter meets the
    # check at all; dropping the query string keeps incidental adapter formatting out of the
    # security boundary without weakening the path constraint the rule rests on.
    binds: ["read_endpoint_allowlist.access[http-elastic]",
            "read_endpoint_allowlist.access[http-stub]",
            "interacts(elastic_adapter->estate).payload"]
    cites: [g26]   # the resolved path AND the method literal are what that probe captured at the call site
    discharged_by: test_the_endpoint_check_binds_on_the_resolved_normalized_path_without_the_query_string

  - id: d60_grant_default_is_an_empty_deny_all
    kind: domain-outcome
    form: test
    # §7 R7, parts 1 and 2 — resolves `verb_grant.domain.default` (UNKNOWN #2) and
    # `distinguished[empty]`. Inertness is rejected explicitly: a None/absent grant is the
    # state in which re-enabling a capability bit later silently grants everything a stale
    # grant still names.
    # `verb_grant.domain.default` is not an addressable slot in the schema's address forms,
    # so the resolved default is bound through its distinguished member instead.
    # RE-AUTHORED at phase F under R11 read literally: an empty grant reaches no system, so
    # every call it meets is UNRESOLVABLE rather than denied. The discriminating observable
    # is `allows() is False` and a non-GRANTED outcome — the failure this demand excludes is
    # an empty grant reading as "no filter", and that failure surfaces as GRANTED whichever
    # refusal label the other branch carries.
    binds: ["verb_grant", "verb_grant.domain.distinguished[empty]",
            "compile_policy", "agent_policy"]
    discharged_by: test_a_role_definition_without_a_grant_gets_an_empty_deny_all

  - id: d61_grant_and_tool_bit_disagreement_fails_at_build
    kind: behavior
    form: test
    # §7 R7, part 3 — BOTH disagreement directions fail at build, AGAINST THE BIT THE STAGE
    # ACTUALLY BUILDS WITH. g16 is why this demand exists and it is the judge that carries it:
    # the judge's `closed_tickets` bit is not on its definition, it is set by a runtime
    # replace() from the stage's own scope object AFTER bind has already compiled the policy.
    # RE-AUTHORED at phase F: the earlier test constructed both directions out of two
    # STATICALLY DECLARED definitions and never built the judge stage, so the refuted case
    # shipped unpinned and an implementation reading only what the definition declares passed.
    # Both directions are now driven off the effective ToolSet, with the agreeing pair as the
    # positive control that the new seam is not simply refusing everything. That seam —
    # compile_policy_for's effective-ToolSet parameter — is pinned by d20; the design names no
    # mechanism for it, so it is part of the contract rather than an implementation choice.
    # SECOND-PASS REPAIR (reconciliation finding 3): that re-author still ASSEMBLED the
    # effective ToolSet in the test body and handed it in, which pins the seam and not the
    # wiring — an implementation that accepts the parameter, satisfies both directions and
    # still compiles from JUDGE_DEF.tools passes with the refuted condition intact in
    # production. The disagreement is now also constructed through the judge's OWN STAGE BUILD,
    # via the seam the stage already has: it takes its verb registry as an argument, and a
    # registry carries the grant it was scoped by. A registry scoped to reach no ticket verb,
    # driven against the benign wiring whose scope switches the bit ON, raises only if the
    # runtime-set bit reached the policy build — JUDGE_DEF.tools declares that bit OFF, and an
    # off bit beside a grant naming nothing is no disagreement at all. The agreeing pair at the
    # same site is its control.
    # THIRD-PASS DECISION (reconciliation finding 2, BLOCKING). The previous pass noticed that
    # direction 1, applied where the repair now puts it, stops a SHIPPED stage building — one
    # judge definition, one grant naming ticket verbs, and the adversarial stage builds from it
    # with the capability off — and left it as a red flag in a file no implementer reads. The
    # human decided it: THE RULE STANDS IN BOTH DIRECTIONS AND THE CONFIGURATION IS CORRECTED.
    # §7 R7 gains a fourth part; the correction is minted as d73, whose test drives the
    # adversarial stage and requires it to build. Direction 1 is therefore pinned at
    # compile_policy_for and is NOT stage-drivable — not because driving it was avoided, but
    # because after the correction no stage can construct that state: a build with the tool off
    # is handed the empty deny-all. An implementer who satisfies this demand alone and skips
    # d73 finds the malicious judge stops building, which is exactly the failure this pass
    # exists to prevent.
    binds: ["verb_grant", "agent_policy", "compile_policy"]
    # TIGHTENED IN THE REPAIR PASS — H3. Every direction was driven through the
    # operator-facing policy wrapper, which `bind` does not call — so a check installed only
    # there runs on NO real build, and a check carrying a literal JUDGE carve-out satisfies
    # every judge-shaped case in the test. Both directions are now driven through `bind`, on a
    # NON-judge role, with the shipped agreeing configuration as the control.
    discharged_by: test_a_grant_and_a_switched_off_tool_disagree_in_either_direction_at_build

  - id: d73_capability_off_stage_builds_with_a_scoped_off_grant
    kind: behavior
    form: test
    # §7 R7 part 4 — the configuration correction R7's first direction forces, minted as a
    # DEMAND because it is work the implementer must do and a runtime failure is what they meet
    # otherwise. The same runtime replace() that sets a stage's capability bit scopes the grant
    # beside it, so the effective grant a build compiles matches the capability that build
    # actually has. The grant still lives on the role definition (R7 part 2 stands) — that is
    # where the capability-ON build reads it from.
    # It is also the drive finding 3 called unwritable: the two halves differ ONLY in the
    # stage's capability bit, with the SAME grant handed in, so what varies is the bit rather
    # than the injected grant — the wiring claim g16 refutes is observed from both sides at the
    # stage for the first time. This is the only demand in the graph binding a `drives()`
    # address, which is also why `binds`' unexercised-seam rule had nothing to ask about this
    # wiring on any previous run.
    binds: ["verb_grant", "agent_policy", "drives(judge_stage->closed_ticket_tool)",
            "interacts(closed_ticket_tool->verb_registry)"]
    discharged_by: test_the_adversarial_judge_stage_builds_with_its_grant_scoped_off_beside_the_bit

  - id: d62_generation_failure_leaves_no_roster
    kind: negative      # positive control: d18 (a successful generation DOES write a roster)
    form: test
    # §7 R9 — fail closed, no roster, never a fall back to the authored text. A security
    # decision, not an operational one: fail-open re-exposes exactly the four withheld verbs
    # today's hand-written prose advertises.
    binds: ["verb_roster", "interacts(roster_generator->verb_roster)"]
    discharged_by: test_roster_generation_failure_leaves_no_roster_rather_than_the_authored_text

  - id: d63_roster_is_committed_and_drift_fails_the_load
    kind: uniqueness
    form: test
    # §7 R9 — a committed artifact with a regenerate-and-compare check, so a grant change
    # produces a reviewable diff and drift is a LOAD FAILURE rather than a silent divergence.
    # The design's own argument for an enumerated grant, applied one level out.
    binds: ["verb_roster.identity", "interacts(roster_generator->verb_roster)"]
    discharged_by: test_the_committed_roster_regenerates_identically_and_drift_fails_the_load

  - id: d64_zero_granted_system_is_omitted
    kind: domain-outcome
    form: test
    # §7 R9 — omitted entirely, not present-but-empty and not a generation failure. A
    # present-but-empty section still tells the model the system exists and invites the call
    # the grant will refuse.
    binds: ["verb_roster", "verb_grant", "interacts(roster_generator->verb_roster)"]
    discharged_by: test_a_system_with_no_granted_verbs_for_a_role_is_omitted_from_the_roster

  - id: d65_refusal_lists_only_the_granted_subset
    kind: negative      # positive control: d24 (the refusal DOES name the granted verbs)
    form: test
    # §7 R11, applied LITERALLY at phase F — the reject path's declared-verbs listing
    # enumerates the role's granted subset, and a system the grant reaches NOWHERE reads as
    # UNRESOLVABLE (it lists nothing). N4's reasoning died with D6: the catalog is no longer
    # handed over in full, so this listing would otherwise be the wider channel. This is the
    # demand that fixes the label every other refusal test reads from — d47, d60, d52 and d38
    # were re-authored onto it, and RS14 records what the literal reading costs.
    binds: ["interacts(query_tool->verb_registry).response", "verb_grant"]
    discharged_by: test_a_refusal_lists_only_the_roles_granted_subset

  - id: d66_denial_record_is_a_bounded_projection
    kind: shape
    form: test
    # §7 R12 — a bounded projection (role, system, verb, call id, truncated/hashed params
    # digest) NORMALIZED before writing, never the raw blob. g24 (executed, refuted) settled
    # the sub-question: there is no shared serialization safety net. Combined with R2's loud
    # failed write, a caller who can make the record unserializable is a caller who can turn
    # every denial into an infrastructure fault.
    # PHASE-F REPAIR: the shape assertion was `set(record) == set(observe.DENIAL_RECORD_KEYS)`
    # — the TARGET defining its own expected side, so it held for whatever key set shipped.
    # `role` and the call id were asserted nowhere in the suite at all, and "which role was
    # refused" is the policy fact this record exists for. The required members are now written
    # as literals here and asserted by value.
    # PHASE-F LOAD: with the grant check moved ahead of the traversal screen, this
    # normalization is also the only thing standing between a hostile model-authored call id
    # and the durable record — the job R23's ordering used to do. d53 asserts that half on the
    # denial path it now travels.
    binds: ["interacts(query_tool->policy_denial_stream).payload", "model_params"]
    # TIGHTENED IN THE REPAIR PASS — H4. `params_digest` as the sorted parameter NAMES
    # satisfied every assertion here: two denials differing only in what was asked for are then
    # byte-identical in the audit stream, and the non-finite guard is dead code because no value
    # is ever serialized. The digest is now pinned as a function of the VALUES — same keys and
    # different values must differ, the same call twice must agree.
    discharged_by: test_the_denial_record_is_a_bounded_normalized_projection_of_the_call

  - id: d67_grant_authoring_integrity_fails_at_load
    kind: domain-outcome
    form: test
    # §7 R13 — resolves `verb_class.domain.default` (UNKNOWN #3). The vocabulary stays CLOSED
    # AT TWO for now; a third tier arrives with the deferred write-verb work and brings its own
    # policy question. RS5 recorded, not built: a copy-pasted wrong system prefix resolves
    # cleanly (two systems both define `list-roles`) and only leaks on a future edit.
    # Same address note as d60: the vocabulary is bound through its two members.
    binds: ["verb_class", "verb_class.domain.distinguished[r]",
            "verb_class.domain.distinguished[rw]", "verb_grant"]
    discharged_by: test_grant_authoring_integrity_rejects_a_bad_class_token_and_a_conflicting_duplicate

  - id: d68_seam_rejects_a_duck_typed_registry
    kind: negative      # positive control: d1 (a properly constructed registry IS accepted)
    form: test
    # §7 R15 — resolves `verb_registry.access[duck-typed]` (UNKNOWN #1). Type the seam and
    # assert the rejection at a site the BUILD PATH ACTUALLY REACHES: g17 refuted the existing
    # fail-loud guard, which build_agent_core routes around, so a test pinned there would pin
    # dead code green.
    binds: ["verb_registry.access[duck-typed]", "interacts(run_investigation->verb_registry)"]
    # TIGHTENED IN THE REPAIR PASS — H2. The type guard was pinned at ONE entry point.
    # The judge's leg takes its own registry through its own seam and never passes through the
    # runtime's, so a duck-typed table handed to the closed-ticket tool ran unauthorized with
    # every assertion green. Both model-facing entry points are now driven, each with its own
    # positive control.
    discharged_by: test_a_registry_shaped_object_is_rejected_at_the_seam_the_build_path_reaches

  - id: d69_impersonated_query_id_changes_nothing
    kind: negative      # positive control: d31 (the granted call still runs and records its id)
    form: test
    # §7 R19 — pin the negative. The grant decision is a function of role, system and verb, and
    # of nothing else. RS8 recorded: whether a downstream consumer attributes a call to a
    # template by that forgeable id is contingent on FORK 18's unused-grant flag shipping.
    binds: ["verb_grant", "interacts(query_tool->executed_queries)",
            "interacts(query_tool->verb_registry).response"]
    discharged_by: test_an_impersonated_query_id_does_not_change_the_grant_decision

  - id: d70_model_read_surfaces_are_a_live_census
    kind: behavior
    form: test
    # RS3 discharged rather than deferred: R8's enumeration was an outstanding PROBE obligation,
    # not an established list. Written as a live census read off the tree on every run, the
    # enumeration re-probes reality instead of being pinned once from a hand-recalled list —
    # which is what a stale enumeration would silently become the first surface someone adds.
    # REPAIR PASS — two additions. (F3) BOTH ROSTERS ARE IN THE CENSUS, asserted here as well
    # as at the audit, because dropping them from the surface set is the free exit from the
    # correspondence demand and it breaks nothing else. (#700-SHAPED DECK REPLAY) the census
    # now also checks that the prose's REFERENTS survived: correcting an artifact that
    # advertises a withheld verb has a cheaper neighbour — rename or delete it and the audit
    # goes quiet while everything pointing at it keeps pointing. The golden replay corpus names
    # committed template ids from a directory this change never touches (21 of its 243
    # query_ids resolve to a template today, written here as literals so the two sides stay
    # independent), each template's declared id must match its own path, and the gather skill's
    # prose must still name paths that exist.
    binds: ["system_skill_prose", "query_templates", "verb_roster"]
    cites: [g28]   # "no committed assertion requires a roster inside the audited set" is that probe's observation
    discharged_by: test_the_committed_model_read_surfaces_are_the_enumerated_set

  - id: d75_the_judge_has_its_own_generated_roster
    kind: uniqueness
    form: test
    # REPAIR-PASS MINT (170-resolutions M2, from the grounding leaf's red flag 3). Every roster
    # assertion in the committed suite named gather, and NOTHING required a judge roster to
    # exist. Under F3 that silence would let the judge's model-facing verb prose stay
    # hand-authored — the hole the earlier human decision closed — while the audit reported
    # green, so the change could ship half-implemented with no test objecting. The demand: the
    # judge's roster exists, is generated from the JUDGE's grant, regenerates to the committed
    # bytes, and is audited against that grant rather than gather's.
    # It is `kind: uniqueness` because what it pins is one roster PER ROLE on a role-keyed
    # path — the same key verb_roster.identity already declares, which nothing until now
    # exercised for a second role.
    binds: ["verb_roster", "verb_roster.identity", "verb_grant",
            "interacts(roster_generator->verb_roster)"]
    cites: [g28]   # "nothing in the suite requires a judge roster to exist" is that probe's observation
    discharged_by: test_the_judge_has_its_own_generated_roster_scored_against_its_own_grant

  # ===========================================================================
  # PHASE-F MINTS (d71-d72) — the two decisions the reconciler's findings 6 and 8
  # forced, each a demand the earlier passes routed to a deviation or left to the
  # implementer. Neither resolves a fork; both make an existing demand bite.
  # ===========================================================================

  - id: d71_transport_capture_seam
    kind: seam
    form: test
    # Phase F, finding 6. Phase E discharged d17 over the RULE plus a census of the allowlist's
    # own entries and routed the altitude question forward as a deviation — "mint the capture
    # seam as a demand, or record a waiver; leaving it in handoff.deviations means no downstream
    # check ever asks again." Minted. The adapters expose a capture sink carried on the
    # VerbContext every verb already receives, recording each RESOLVED outbound request BEFORE
    # the send. Two things turn on it: d17's read-endpoint half stops being an assertion the
    # allowlist wins by definition, and the payload obligation on this edge gains its only
    # observation channel that is not a monkeypatched transport symbol — which this project's
    # lint ratchets against, so "no seam" meant "unobservable", not "observed differently".
    binds: ["transport_capture", "interacts(elastic_adapter->transport_capture)",
            "interacts(elastic_adapter->estate).payload"]
    # REPAIR PASS (F1): the seam records the HTTP METHOD beside the resolved target. Without
    # it the allowlist's key has no second half to bind on. The axis costs one field: every
    # outbound request in the tree funnels through one transport function that already takes
    # the method as a required keyword, and that function is the one this seam wraps.
    cites: [g26]   # "one transport function, method already a required keyword" is that probe's observation
    discharged_by: test_the_transport_capture_seam_records_every_resolved_request

  - id: d72_judge_site_grant_check_precedes_its_own_screens
    kind: behavior
    form: test
    # Phase F, finding 8. §7 R3/R23 decided which refusal wins FOR ONE CALL — the runtime's.
    # The judge's tool carries its own malformedness screens (key grammar, the self-case key)
    # and no demand fixed where the grant check sits among them, so the second model-facing
    # site's ordering was whatever the implementer chose — the exact shape that leaves one site
    # carrying the audit hole the other one closed. Decided the same way as the runtime: the
    # grant check runs FIRST. The reasoned split n5 warns against flattening is preserved as
    # the demand's positive control: for calls the grant ADMITS, the key-grammar and
    # self-case-key refusals still raise with no row, and the missing-grammar path still writes
    # its row under the verb that ran and failed.
    binds: ["interacts(closed_ticket_tool->verb_registry).response",
            "interacts(closed_ticket_tool->judge_queries_table)",
            "interacts(closed_ticket_tool->policy_denial_stream)"]
    discharged_by: test_the_judge_sites_grant_check_precedes_its_own_key_screens

  # ===========================================================================
  # WAIVERS (§7) — an examined no, on record, each citing the claim it rests on.
  # ===========================================================================

  - id: w1_ticket_store_subprocess_cli
    kind: behavior
    form: waiver
    binds: ["ticket_store.access[subprocess-cli]"]
    cites: [g15]
    outcome: {nl: "The ticket store's command-line access path is deliberately left unbound: it is one fixed-argument seeding edge driven by the learning loop, never model-facing, so no demand binds this cell and none should."}

  - id: w2_ticket_store_http_write
    kind: behavior
    form: waiver
    binds: ["ticket_store.access[http-write]"]
    cites: [g14]
    outcome: {nl: "The estate-write endpoints are out of this issue's scope and are waived here rather than left silent: four exist at HEAD, two of them ungated, and none is reachable as a tool call — so #632's grant, roster and denial record structurally cannot touch them, and the authorization layer can work perfectly while every one of those writes still happens. COMPLETE: §7 attached an action to this waiver — file the separate issue, THEN waive — and issue #767 now carries it, naming the two ungated writers, the stored-injection cycle they open through the granted ticket read verbs, and the deferred third effect-class tier the fix would bring with it."}

  - id: w3_gather_capture_identity_under_concurrency
    kind: uniqueness
    form: waiver
    binds: ["executed_queries.identity", "gather_raw.identity"]
    cites: [g25]
    outcome: {nl: "The runtime capture sink's key coverage under concurrent leads is waived as a pre-existing mechanism this issue does not touch: the lead-claim guard was probed under a thread pair and under separate processes against a forced-collision id and always produced exactly one winner and one loser, because it is a single atomic syscall the OS serializes. A waiver against an untouched mechanism, not a design hole."}

# ===========================================================================
# STRUCTURE — provenance: code = the grounded neighborhood (10-brief.md);
#             design = demand-implied delta (add, or modify where the design
#             alters an existing element's semantics).
# ===========================================================================
structure:
  # AXIS REGISTRY. Every key_axes / interpolates member below is one of these — two passes
  # coining different names for one axis is the join-breaker this list exists to prevent.
  axes: [lead_id, seq, role, system, verb, batch_id, pid, site, http_method]
  # `site` added at phase E: §7 R1's policy-denial stream is one fixed FILENAME whose only
  # varying axis is which model-facing site's run dir it lands under.
  # `http_method` added in the REPAIR PASS (F1): the read-endpoint rule's key is the PAIR
  # (URL pattern, method), so the method is a first-class axis of the allowlist and of what the
  # transport capture seam records. It is registered rather than left implicit because two
  # artifacts now name it — the allowlist's entries and the capture seam's records — and two
  # passes coining different names for one axis is the join-breaker the registry exists to
  # prevent.

  actors:
    # --- execution contexts. g15 bounds them to three, all reaching run_investigation, so
    # run.py is the SINGLE place a grant must be supplied for all of them.
    - {id: run_investigation, frame: composition, provenance: code}   # driver.py:563 — the ternary mint; run.py:144 passes no verbs=, so this is the production path (g2)
    - {id: evals_pipeline,    frame: composition, provenance: code}   # evals/_pipeline.py:69 re-execs run.py
    - {id: generate_case,     frame: composition, provenance: code}   # evals/oracle_golden/generate_case.py:68 re-execs run.py
    - {id: build_agent_core,  frame: composition, provenance: code}   # driver.py:210 — the `if verbs is None` fallback feeding QueryCapture
    - {id: learning_loop,     frame: composition, provenance: code}   # learning/loop.py — drives the judge stage
    - {id: judge_stage,       frame: composition, provenance: code}   # engine_pydantic.py:117 — the judge engine's own global mint (c15)
    # --- the two model-facing legs, and the surfaces around them
    - {id: gather_dispatch,   frame: leg, provenance: code}           # the per-lead subagent; reads the verb surface as prose
    - {id: query_tool,        frame: leg, provenance: code}           # runtime/query_tool.py QueryCapture — model-facing site 1
    - {id: closed_ticket_tool, frame: leg, provenance: code}          # learning/pipeline/judge/closed_ticket_tool.py — model-facing site 2
    - {id: descriptor_catalog, frame: leg, provenance: code}          # hooks/inject_system_skill_description.py — mints its OWN registry (n2) and is @cache'd with no role in the key (g18)
    - {id: roster_generator,  frame: leg, provenance: design}         # R-A2's new generator: the model-facing verb roster, derived from the grant
    - {id: compile_policy,    frame: leg, provenance: design}         # runtime/permission/policy.py — gains the verb grant beside bash_shapes
    - {id: host_state_adapter, frame: leg, provenance: code}
    - {id: elastic_adapter,   frame: leg, provenance: code}
    - {id: validate_scaffold, frame: leg, provenance: code}           # the authoring path a new system ships through
    # --- consumers reality imposes, that no demand asked for
    - {id: visualize_runtime, frame: leg, provenance: code}           # scripts/visualize — the run HTML; today drops every non-message kind (g9)
    - {id: visualize_judge,   frame: leg, provenance: code}           # renders the judge raw bundle from the judge queries table
    - {id: lead_repository,   frame: leg, provenance: code}           # the learning loop's evidence input — the reason O5 keeps denials out of the queries table
    - {id: ticket_seeds,      frame: leg, provenance: code}           # learning/tickets/ticket_seeds.py:14 — the ONE registry-bypassing subprocess CLI edge (g15 bounds c2's caveat)

  boundaries:

    # --- the delta's own elements -----------------------------------------------------------
    - id: verb_registry
      provenance: design
      facets:
        identity:
          key_axes: [role]
          evidence: {nl: "the registry becomes a per-role VIEW of the global one (D1), so the resource's full key is the role. Read off the design's requirement, not off today's code — today the object is roleless, which is exactly the gap."}
          sharing: unique-key
        access:
          # Six construction routes. The five named ones are what n2/g2's census found (four
          # production, one dev tooling); `require-grant` is D1's constraint, which must hold on
          # every cell or "unconstructable, not un-passed" is decorative.
          constraints_by_via:
            driver-ternary:     {trust: operator, constraints: [require-grant]}   # driver.py:563, THE production path, invisible to c15's `verbs is None` grep, carrying a lint-default suppression comment
            driver-fallback:    {trust: operator, constraints: [require-grant]}   # driver.py:210
            judge-engine:       {trust: operator, constraints: [require-grant]}   # engine_pydantic.py:117
            catalog-builder:    {trust: operator, constraints: [require-grant]}   # inject_system_skill_description.py:42 — n2's consequence: D1's edit and D6's edit are the SAME edit
            dev-scaffold:       {trust: operator, constraints: [require-grant]}   # validate_scaffold.py:58 — non-execution, but the authoring path d47 drives
            duck-typed:         {trust: derived,  constraints: [require-grant, nominal-type]}
            # UNKNOWN #1 RESOLVED — §7 R15: type the seam, and assert the rejection at a site the
            # build path actually reaches. An object that merely ANSWERS the registry's questions,
            # handed straight to an entry point, never goes through the constructor at all, so
            # `unconstructable` is one duck-typed helper away from decorative without a nominal
            # type. NOT pinned at the existing guard: g17 refuted its reachability from the build
            # path, so a test there would pin dead code green. Bound by d68.

    - id: verb_grant
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "a per-role enumeration of (system, verb) pairs, each stating the effect class it expects. Derived from the 14 committed query templates plus every executed_queries.jsonl across 20 past runs (c18) — not from the registry, which would have granted everything. g4: the three lists partition the 25 non-health-check verbs EXACTLY, with no residue, and every name resolves in the live registry, which makes the load-time resolve check total rather than a spot check."}
          default: "empty-deny-all"
          # UNKNOWN #2 RESOLVED — §7 R7: an explicit EMPTY DENY-ALL grant, never absent and never
          # None, and it stays on the role definition beside the bash grant. Six of the eight
          # AgentDefinition instances get no grant, so an absent default would either break their
          # construction or reopen the None fallback D1 exists to close (n11). Inertness rejected
          # explicitly: it is the state in which re-enabling a capability bit later silently
          # grants everything a stale grant still names. g16's second half — the judge's bit is
          # set by a runtime replace() at stage build, so a static grant and a dynamic bit can
          # disagree in BOTH directions — is closed by failing the build either way. Bound by
          # d60 (the default) and d61 (the two disagreement directions).
          distinguished: ["gather", "benign_judge", "empty"]
          falsy_valid: true
          documented_alternatives:
            - {value: "health-check", crosses_validation: false}
            # granted uniformly to gather rather than per system — a deliberate uniformity
            # exception; the shipped default stays valid under it (d27).

    - id: verb_class
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "the effect class a verb declares and a grant independently expects; disagreement fails closed at first resolution. All 25 non-health-check verbs are `r` today (c3/g3) — there is no `rw` verb yet, which is why d14 must construct the disagreement rather than find one."}
          default: "undeclared"
          # UNKNOWN #3 RESOLVED — §7 R13: the vocabulary is CLOSED AT TWO, and `undeclared` is not
          # a member: a class token outside {r, rw}, and a grant declaring one pair twice with
          # conflicting classes, are both rejected at load. A third tier arrives with the deferred
          # write-verb work and brings its own policy question. RS5 recorded rather than built: a
          # copy-pasted wrong system prefix resolves cleanly (two systems both define
          # `list-roles`), so d21 catches it in today's grant and nothing catches a future edit.
          # Bound by d67.
          distinguished: ["r", "rw"]
          falsy_valid: false
          documented_alternatives: []

    - id: agent_policy
      provenance: design
      facets: {}
      # AgentPolicy carries no verb field today; compile_policy builds bash_allow by CALLING each
      # bash_shape with ResolvedRoots, while a verb grant is static data needing no roots (n11).

    - id: verb_roster
      provenance: design
      facets:
        identity:
          key_axes: [role, system]
          evidence: {nl: "R-A2 makes the roster grant-derived, and the grant is per (role, system, verb) — so one rendered roster exists per role, sectioned per system. §7 R9(d) settled the zero-granted case: the system is omitted entirely. The repair pass made the per-ROLE half of this key load-bearing rather than theoretical — until then only gather had a roster, so nothing exercised a second one, and the audit that scores rosters had no way to say which role's grant governs which file (d75, and F3's fourth attribution rule)."}
          sharing: unique-key
        payload:
          # R6 territory, and the reason the roster is modelled as a rendered sink rather than a
          # data structure: the FRAME (system headings, the call examples' shape) is as much a
          # chooser question as the entries. Today's counter-examples are copy-paste `query(...)`
          # lines inside author-written prose.
          parts:
            - {role: frame, source: const:ROSTER_TEMPLATE}
            - {role: entries, source: template:GRANT_ENTRIES, slots: {system: verb_grant, verb: verb_grant}}
          invariants: [all-slots-bound]
          nl: "the model-facing systems-and-verbs roster, rendered from the role's grant. Every entry is author- or grant-chosen; no model- or attacker-influenced value reaches it, which is what distinguishes it from the denial record's params slot."

    - id: read_endpoint_allowlist
      provenance: design
      facets:
        access:
          # REPAIR PASS (F1): D4 keys on the (ENDPOINT, METHOD) PAIR. c17 refuted a GLOBAL
          # "an r verb may not POST or send a body" — elastic's _search and _query are both
          # POST-with-body READS, and a blanket ban rejects two working verbs — and that is all
          # it refuted. A per-entry method keeps both as listed pairs and is the only axis that
          # separates the ticket read from the ticket write, which resolve to the same path on
          # the same host: over the 27 real (system, path, method) triples, path-only overlap
          # between reads and writes is {"/tickets"} and path+method overlap is empty. The
          # endpoint-only key was therefore not weak but UNSATISFIABLE, and write-code-from-spec
          # refused to implement on it. g12 re-confirmed the HTTP set at HEAD: 4 elastic/kibana
          # patterns, 14 (system, path) stub pairs over 13 distinct patterns — and one of those
          # four elastic patterns, the Kibana-host status path, was missing from every fixture
          # in the suite (d74).
          # CORRECTION ROUND (G1): this table is a CONSTRUCTED VALUE, not a module literal —
          # a method-less entry cannot be built, on either HTTP cell. Bound by d76, which is
          # what makes F1's "the method is load-bearing" rest on production behaviour instead
          # of on one assertion over the one constant that ships today.
          constraints_by_via:
            http-elastic: {trust: attacker-influenced, constraints: [read-endpoint-method-allowlist, index-confinement]}
            http-stub:    {trust: attacker-influenced, constraints: [read-endpoint-method-allowlist]}
            docker-exec:  {trust: attacker-influenced, constraints: [argv-head-allowlist, container-inventory]}
            # UNKNOWN #4 RESOLVED — §7 R4: CHECK THE PAIR, the program against a per-system
            # allowlist AND the container target against the declared inventory. Both halves, not
            # either alone: the program alone does not bound reach (`cat` inside the ticket store
            # is the disclosure); the target alone does not bound effect. The two sharp cases —
            # the agent's own execution container and the container holding another granted
            # system's data store — are ORDINARY REFUSALS with no special-casing. Bound by d57.
            # The refutation this answers: g11 REFUTED that the
            # allowlist can express the effecting universal for six of 25 verbs: host-state's
            # proc-tree, passwd, authorized-keys, fim-checksum, package-list and container-inspect
            # reach the estate as a literal argv list through docker_exec_raw — ps, cat, getent,
            # sha256sum, dpkg-query — with NO URL anywhere. The analogous unit is the argv head
            # plus the container target: a second rule form, not a row in the same table. Unstated,
            # host-state is the one system where the effecting universal has no enforcement at
            # all, and it is the system c13 refuted.

    # --- the grounded neighborhood (10-brief.md) ---------------------------------------------
    - id: executed_queries
      provenance: code
      facets:
        identity:
          key_axes: [lead_id, seq]
          evidence: {nl: "<run_dir>/executed_queries.jsonl, written by QueryCapture._record (query_tool.py:302). seq is derived by COUNTING existing rows with the same lead_id, under an asyncio.Lock held across the seq->persist->append window — so not writing a row is exactly not allocating a seq (f4/g7). Read off the writer plus `spec-graph trace resource queries_table`."}
          sharing: unique-key
      # g21 (executed, refuted): there is no reservation step at all. A crash before the append
      # makes the next call derive the SAME number and silently overwrite the orphaned payload; a
      # crash mid-append leaves an unparseable partial line that read_jsonl_rows skips FOREVER,
      # invisible to every consumer. Pre-existing, on a GRANTED call's write path, touched by no
      # obligation in #632 — dropped as a premise, carried as a red flag, deserves its own issue.

    - id: gather_raw
      provenance: code
      facets:
        identity:
          key_axes: [lead_id, seq]
          evidence: {nl: "<run_dir>/gather_raw/<lead_id>/<seq>.json, written by _persist_payload inside the same lock window as the row and before it — so O6's 'no payload file' and O5's 'no queries row' are ONE code decision at this site."}
          sharing: unique-key

    - id: judge_queries_table
      provenance: code
      facets:
        identity:
          key_axes: [seq]
          evidence: {nl: "<learning_run_dir>/executed_queries.jsonl, written by _capture_and_view in closed_ticket_tool.py. seq derived by counting ALL rows in the table (not per-lead), under its own lock, one per built agent. SAME FILENAME as the runtime table, DIFFERENT ROOT and different key — n7/g7."}
          sharing: unique-key

    - id: ticket_reads
      provenance: code
      facets:
        identity:
          key_axes: [seq]
          evidence: {nl: "<learning_run_dir>/ticket_reads/<seq>.json — the judge's by-ref payload tree, written inside the same lock window as its row. NOT gather_raw/<lead_id>/<seq>.json; an O6 assertion written once against gather's names passes vacuously here."}
          sharing: unique-key

    - id: llm_requests
      provenance: code
      facets:
        identity:
          sharing: serialized-append
          evidence: {nl: "<run_dir>/llm_requests.jsonl, one RequestLogger opened at driver.py:567, with an explicit flush() after every record — so it survives an abort, unlike tool_trace.jsonl, which is rebuilt from the message store in one write_text at end of run. No key: records are ordered, not addressed."}
      # The denial payload facet MOVED to policy_denial_stream at phase E (§7 R1). This
      # boundary keeps only the conversation records it already carried; the writer class it
      # shares with the new stream is what made R1's "no new writer" economy hold.

    - id: judge_audit_stream
      provenance: code
      facets:
        identity:
          key_axes: [batch_id, pid]
          evidence: {nl: "<learning_run_dir>/<batch_id>.<pid>.trace.jsonl — StageWiring.trace_name's default (learning/core/config.py:299), which the judge takes; the malicious-actor, benign-actor and oracle stages override it with fixed names. g8/g20. §7 R1 RESOLVED FORK 1 AGAINST THIS FILE: the judge's denial lands in policy_denial_stream instead, so this boundary keeps only the stage trace it already was, and the pid-interpolating filename stops being an audit destination anyone has to reason about."}
          sharing: serialized-append

    - id: policy_denial_stream
      provenance: design
      # §7 R1's answer to FORK 1, materialized at phase E. ONE fixed policy-denial filename,
      # written by the SAME writer class at both model-facing sites, each under its own run
      # directory: <run_dir>/policy_denials.jsonl at the runtime, <learning_run_dir>/… at the
      # judge. Reading (a) — discharging the judge's half with the judge's own page — was
      # rejected as the shape that gets an assertion written which proves nothing at the second
      # site; reading (b) — a second writer on llm_requests.jsonl — as partly unbuildable, the
      # writer refusing a second open of one path. `llm_requests` and `judge_audit_stream`
      # therefore keep only their pre-existing, non-denial edges.
      facets:
        identity:
          key_axes: [site]
          evidence: {nl: "one stream per model-facing site, named identically at both and rooted at that site's own run directory — read off R1's decision, which fixes the filename and varies only the root. Records are ordered and sequenced, not addressed."}
          sharing: serialized-append
        payload:
          parts:
            - {role: event, source: const:POLICY_DENIAL_EVENT_TYPE}
            - {role: subject, source: template:DENIAL_RECORD, slots: {role: verb_grant, system: verb_registry, verb: verb_registry, params_digest: model_params}}
          invariants: [all-slots-bound]
          nl: "the denial event: a BOUNDED, NORMALIZED projection — role, system, verb, call id and a truncated or hashed parameter digest, plus a timestamp and a sequence — appended at the decision point and not wrapped in a suppressor (§7 R2, R12). The `params_digest` slot is where R6's chooser question lands: the raw blob behind it is model-controlled, unbounded, deeply nestable and never validated, because parameter validation never runs for a denied verb, and g24 found the writer normalizes nothing today. The projection IS the sanitizer that column was missing."

    - id: circuit_breaker
      provenance: code
      facets:
        domain:
          type: enum
          refinement: {nl: "record_outcome no-ops unless is_infra_failure(exit_code), and error_class_for_exit returns only infra or agent-fixable — so a denial exit code outside INFRA_EXIT_CODES contributes nothing BY CONSTRUCTION (n10). The demand is still worth pinning because it guards the exit-code choice, but the mechanism is a constant, not a branch. Ordering is load-bearing: record_outcome raises RunAborted at the run-wide kill limit and is called AFTER the row is appended, deliberately."}
          default: "agent-fixable"
          distinguished: ["infra", "policy-denial"]
          falsy_valid: false
          documented_alternatives: []

    - id: elastic_index
      provenance: design            # the param exists in code; D3 changes its contract
      facets:
        domain:
          type: str
          refinement: {nl: "a model-supplied index that OVERRIDES the configured one — `resolved = index or config[index_key]`, quoted with safe='-*,.', so dotted system indices survive. Combined with the elastic superuser credential (c7) this reaches the cluster's security indices. D3 confines it to the system's configured patterns; FORK 5 owns what 'confined' means against Elasticsearch's own index grammar."}
          default: "<the system's configured index pattern>"
          distinguished: ["logs-*,security-audit-*", "*", "-logs-*"]
          # The three documented ES syntaxes that widen reach past the configured pattern: a comma
          # is a multi-index LIST, `*` is a wildcard, a leading `-` is an exclusion — and the URL
          # quoting in place today leaves all three characters unescaped, against a superuser
          # credential. §7 R5 BINDS ALL THREE WITH ONE DECISION (d58): evaluate REACH, not the
          # literal, and refuse the WHOLE call. The rejected half matters as much as the chosen
          # one — a SILENT NARROWING to the in-bounds members satisfies the letter of the
          # obligation while hiding an attempted cross-tenant read from the audit trail that
          # exists to record it.
          falsy_valid: false
          documented_alternatives: []

    - id: host_state_target
      provenance: design            # the `host` param exists; D3 turns the warning into a refusal
      facets:
        domain:
          type: str
          refinement: {nl: "the docker exec target. _check_host prints 'warning: host X is not in the known inventory ... attempting anyway' to stderr and RETURNS; `host` is then the docker exec target. The known-host tuple is 8 names; the estate's other containers are reachable. No default — the param is required."}
          distinguished: ["elasticsearch", "ELASTICSEARCH", "defender"]
          # elasticsearch  — another granted system's store, c13's live refutation (d11)
          # ELASTICSEARCH  — the case/whitespace/substring/prefix near-miss consensus (d49)
          # defender       — the agent's OWN execution container. BOUND at phase E by d57: §7 R4
          #                  settled the confinement unit as the (program, container) PAIR, and
          #                  made this and the sibling-store case ordinary refusals with no
          #                  special-casing.
          falsy_valid: false
          documented_alternatives: []

    - id: elastic_esql
      provenance: code
      facets: {}
      # Facetless on purpose: esql's ONLY param is `query`, so its target lives in the ES|QL FROM
      # clause and there is no contract slot for D3 to constrain. Modelling a facet here would
      # imply an enforcement point that does not exist. d13 binds it as the recorded residual.

    - id: estate
      provenance: code
      facets:
        payload:
          parts:
            - {role: endpoint, source: const:ADAPTER_URL_LITERAL}
            - {role: target, source: template:INDEX_PARAM, slots: {index: elastic_index}}
          invariants: [all-slots-bound]
          nl: "the outbound HTTP request an r-classed verb sends. FORK 6 decides where the allowlist binds — against the verb's declared, UNINTERPOLATED pattern, or against the fully resolved URL the transport actually sends. A target-selecting param that changes the effective path escapes the first entirely; and if the match is literal, every adapter's URL-building f-string becomes part of the security boundary by accident."

    - id: docker_exec
      provenance: code
      facets:
        payload:
          parts:
            - {role: target, source: template:HOST_PARAM, slots: {host: host_state_target}}
            - {role: argv, source: const:ARGV_HEAD}
          invariants: [all-slots-bound]
          nl: "host-state's transport: a literal argv list (ps, cat, getent, sha256sum, dpkg-query) handed to docker exec against a model-supplied container. The in-container `sh -c` string is static — flags plus the literal auth token — and everything dynamic is forwarded as argv after `--`, so no model value reaches the shell (c10, unrefuted; WEAKEST INSTRUMENT in the ledger, a read standing in for a reachability probe)."

    - id: ticket_store
      provenance: code
      facets:
        access:
          constraints_by_via:
            query-tool:         {trust: attacker-influenced, constraints: [verb-grant]}
            closed-ticket-tool: {trust: attacker-influenced, constraints: [verb-grant]}
            subprocess-cli:     {trust: operator, constraints: [fixed-argv]}
            http-write:         {trust: derived, constraints: []}
          # The parity question this design exists to answer sits on the first two cells: both
          # model-facing tools drive the SAME ticket verb bodies through the same registry lookup
          # (c2), which is why the check binds at verb resolution and not at the tool.
          # subprocess-cli is g15's bounded bypass: exactly one adapter carries a __main__ and
          # exactly one non-test caller drives it, with a fixed `list-tickets --status closed
          # --label <label>` argv from the learning loop — not model-facing.
          # http-write carries N3's four estate-write endpoints (g14, unchanged at HEAD), two of
          # them ungated. Constrained by nothing here, on purpose; d29 records why.

    - id: descriptor_catalog
      provenance: code
      facets:
        identity:
          key_axes: [role]
          evidence: {nl: "@cache'd on (skills_dir, adapters_dir) with NO role in the key (g18, confirmed at HEAD) — so the resource's full key is role, and today's memo key under-covers it. n3's correction: functools.cache keys on ALL arguments, so a role passed as a parameter enters the key automatically; the trap is a role read from deps inside the body, or defaulted. And today exactly ONE caller exists (gather's prompt), so the cross-role collision is a hazard the change creates, not one it inherits."}
          sharing: unique-key

    - id: system_skill_prose
      provenance: code
      facets: {}
      # defender/skills/<system>/SKILL.md + execution.md — the verb roster the gather model
      # actually works from, reached through the read tool. Every verb the grant withholds is
      # advertised here TODAY with copy-paste query(...) lines, and one file instructs the model
      # to use an ungranted verb. R-A2 withdraws this as the model's verb source; the remove edge
      # below is that withdrawal, and its dependent's survival is FORK 9's subject.

    - id: query_templates
      provenance: code
      facets: {}
      # the 14 committed templates under skills/gather/queries. Consensus: a committed template
      # naming a withheld verb is the same violation as prose naming it, and the demand covers the
      # SEARCH surface, not only the generated index.

    - id: model_params
      provenance: code
      facets: {}
      # the model-authored params blob. Named as a boundary so R6's walk has an address for the
      # one attacker-influenced chooser that reaches the denial record: alert data is
      # attacker-influenced by definition, and a denied call's params are never validated.

    - id: transport_capture
      provenance: design
      facets: {}
      # Phase F, finding 6. The observation seam the adapters expose for their own outbound
      # requests: a sink on the VerbContext each verb already receives, written with the
      # RESOLVED request target — and, since the repair pass, the HTTP METHOD — before the
      # transport runs. Facetless — it carries no contract
      # of its own; it exists so the endpoint rule and the payload obligation on
      # interacts(elastic_adapter->estate) have something to bind against that is not the
      # allowlist's own declared entries. d71 pins it.

    - id: threat_model_doc
      provenance: code
      facets: {}

    - id: elastic_credential
      provenance: code
      facets: {}
      # `elastic:${ELASTIC_PASSWORD}`, expanded inside the target container's shell — the ONLY
      # adapter that authenticates at all, as the built-in superuser. The credential never enters
      # the driver process (worth keeping); the role it authenticates as is unrestricted.

  interacts:
    # --- registry construction (the five mint sites; D1 makes the grant a constructor requirement)
    - {from: run_investigation, to: verb_registry, mode: invoke, via: driver-ternary,  provenance: design}
    - {from: build_agent_core,  to: verb_registry, mode: invoke, via: driver-fallback, provenance: design}
    - {from: judge_stage,       to: verb_registry, mode: invoke, via: judge-engine,    provenance: design}
    - {from: descriptor_catalog, to: verb_registry, mode: invoke, via: catalog-builder, provenance: design}
    - {from: validate_scaffold, to: verb_registry, mode: invoke, via: dev-scaffold,    provenance: design}
    # --- verb resolution: the two model-facing sites, plus the pre-execution reject path that
    # c2 missed and n1/g1 found (query_tool.py:165 — it resolves the verb map BEFORE execution to
    # build the refusal, and returns the sorted verb list to the model).
    - {from: query_tool,         to: verb_registry, mode: read, via: api, provenance: design}
    - {from: closed_ticket_tool, to: verb_registry, mode: read, via: api, provenance: design}
    # --- the grant and the policy
    - {from: compile_policy,     to: verb_grant,  mode: read,  via: api, provenance: design}
    - {from: compile_policy,     to: agent_policy, mode: write, via: api, provenance: design}
    - {from: query_tool,         to: verb_grant,  mode: read,  via: api, provenance: design}
    - {from: closed_ticket_tool, to: verb_grant,  mode: read,  via: api, provenance: design}
    - {from: query_tool,         to: verb_class,  mode: read,  via: api, provenance: design}
    - {from: roster_generator,   to: verb_grant,  mode: read,  via: fs,  provenance: design}
    # --- the roster, and the prose it withdraws
    - {from: roster_generator, to: verb_roster,       mode: write,  via: fs,        provenance: design, sends: payload, interpolates: [role, system]}
    - {from: gather_dispatch,  to: verb_roster,       mode: read,   via: read-tool, provenance: design}
    - {from: gather_dispatch,  to: system_skill_prose, mode: read,  via: read-tool, provenance: code}
    - {from: gather_dispatch,  to: system_skill_prose, mode: remove, via: read-tool, provenance: design}
    # ^ R-A2's withdrawal: the hand-authored verb roster inside the skill prose stops being the
    #   model's verb source. The read edge above is the live dependent whose workflow — the model
    #   learning which verbs exist — must complete via the generated substitute.
    - {from: gather_dispatch, to: query_templates,    mode: read, via: read-tool, provenance: code}
    - {from: gather_dispatch, to: descriptor_catalog, mode: read, via: api,       provenance: design}
    # --- the evidence surface and its payload trees
    - {from: query_tool,         to: executed_queries,   mode: write, via: fs, provenance: design, interpolates: [lead_id, seq]}
    - {from: query_tool,         to: gather_raw,         mode: write, via: fs, provenance: design, interpolates: [lead_id, seq]}
    - {from: closed_ticket_tool, to: judge_queries_table, mode: write, via: fs, provenance: design, interpolates: [seq]}
    - {from: closed_ticket_tool, to: ticket_reads,       mode: write, via: fs, provenance: design, interpolates: [seq]}
    - {from: lead_repository,    to: executed_queries,   mode: read,  via: fs, provenance: code}
    - {from: visualize_judge,    to: judge_queries_table, mode: read, via: fs, provenance: code}
    # --- the audit streams. The two denial edges were re-pointed at phase E by §7 R1: the
    #     denial lands in the fixed policy-denial stream at each site, not in llm_requests.jsonl
    #     (which the judge's path cannot write) and not in the per-pid stage trace.
    - {from: run_investigation,  to: llm_requests,         mode: write, via: fs, provenance: code}
    - {from: visualize_runtime,  to: llm_requests,         mode: read,  via: fs, provenance: code}
    - {from: judge_stage,        to: judge_audit_stream,   mode: write, via: fs, provenance: code, interpolates: [batch_id, pid]}
    - {from: query_tool,         to: policy_denial_stream, mode: write, via: fs, provenance: design, sends: payload, interpolates: [site]}
    - {from: closed_ticket_tool, to: policy_denial_stream, mode: write, via: fs, provenance: design, sends: payload, interpolates: [site]}
    - {from: visualize_runtime,  to: policy_denial_stream, mode: read,  via: fs, provenance: design}
    # --- the breaker
    - {from: query_tool,         to: circuit_breaker, mode: write, via: api, provenance: design}
    - {from: closed_ticket_tool, to: circuit_breaker, mode: write, via: api, provenance: design}
    # --- target confinement, and the estate
    - {from: query_tool,         to: elastic_index,     mode: read,   via: api, provenance: design}
    - {from: query_tool,         to: host_state_target, mode: read,   via: api, provenance: design}
    - {from: query_tool,         to: model_params,      mode: read,   via: api, provenance: code}
    - {from: elastic_adapter,    to: estate,            mode: invoke, via: http,        provenance: design, sends: payload}
    - {from: elastic_adapter,    to: transport_capture, mode: write,  via: api,         provenance: design}
    - {from: host_state_adapter, to: docker_exec,       mode: invoke, via: docker-exec, provenance: design, sends: payload}
    - {from: query_tool,         to: elastic_esql,      mode: read,   via: api, provenance: code}
    - {from: elastic_adapter,    to: elastic_credential, mode: read,  via: env, provenance: code}
    # --- the ticket store's four routes
    - {from: query_tool,         to: ticket_store, mode: invoke, via: query-tool,         provenance: design}
    - {from: closed_ticket_tool, to: ticket_store, mode: invoke, via: closed-ticket-tool, provenance: design}
    - {from: ticket_seeds,       to: ticket_store, mode: invoke, via: subprocess-cli,     provenance: code}
    - {from: learning_loop,      to: ticket_store, mode: write,  via: http-write,         provenance: code}
    # --- the doc surface d29 keeps visible
    - {from: learning_loop, to: threat_model_doc, mode: read, via: fs, provenance: code}

  drives:
    - {from: evals_pipeline,    to: run_investigation,  provenance: code, multiplicity: serial}      # re-exec of run.py
    - {from: generate_case,     to: run_investigation,  provenance: code, multiplicity: serial}      # re-exec of run.py
    - {from: run_investigation, to: build_agent_core,   provenance: code, multiplicity: serial}
    - {from: run_investigation, to: gather_dispatch,    provenance: code, multiplicity: concurrent}
    - {from: gather_dispatch,   to: query_tool,         provenance: code, multiplicity: concurrent}
    # ^ one writer driven over MANY invocations: the queries table's key coverage is over writer
    #   invocations, not writer edges, and its seq is derived by counting rows under a lock.
    - {from: learning_loop,     to: judge_stage,        provenance: code, multiplicity: serial}
    - {from: judge_stage,       to: closed_ticket_tool, provenance: code, multiplicity: concurrent}
    # ^ both legs of one inconclusive case run in one process — FORK 1's contention case.
    - {from: gather_dispatch,   to: roster_generator,   provenance: design, multiplicity: serial}

# ===========================================================================
# CLAIMS — 57. Every claim the input frontiers raised, inherited ids kept:
#   c1-c20  the design doc's ledger (source: discuss), carried unchanged
#   n1-n12  raised by the demand-extraction leaf
#   g1-g20  raised by the grounding leaf at the worktree base
#   g21-g25 raised by the re-ground leaf (47-reground.md, plus g25 on the concurrency waiver)
# NON-STANDARD VERDICTS NORMALIZED to the closed vocabulary, semantics preserved in `observed`:
#   extends-c2 / extends-c11 / extends-c15 / extends-c4 / bounds-c2 / refutes-c15 /
#   holds-with-correction  ->  holds (the claim AS STATED holds; what it extends or corrects is
#   named in `observed`). The claim it corrects keeps its own verdict.
# INSTRUMENT DEFICIT — CLOSED. It was the run's headline ledger weakness (24 of 57 claims on an
# instrument weaker than their kind admits) and it is now zero: every behavior, reachability and
# primitive claim closes on `executed`, every census on `search`, every referential on a read or
# a defs lookup. `spec-graph claims` reports no instrument finding. The last one standing was
# g22 — a reachability claim that had DROPPED a whole premise family on a search — re-probed as
# a break attempt with a positive control; it closes executed, refuted, and the drop it justifies
# is confirmed sound rather than assumed. handoff.deferred is recomputed against this state and
# no longer hands the next stage a backlog of re-probes that have already been run.
# ===========================================================================
claims:
  # ---- inherited from the design doc's sweep (c1-c20) ----
  - {id: c1, source: discuss, kind: referential, probe_kind: read, verdict: holds,
     claim: "The only authorization over the query tool today is the boolean ToolSet.query; GATHER is its sole holder.",
     probe: "read runtime/agent_definition.py:33, runtime/driver.py:260, runtime/tools.py:377",
     observed: "ToolSet declares `query: bool = False`; GATHER_DEF sets query=True; MAIN_DEF does not. register_tools branches on the bit alone — no per-verb or per-system filter exists."}
  - {id: c2, source: discuss, kind: census, probe_kind: search, verdict: holds,
     claim: "Every path that resolves a verb body goes through registry.verbs(system)[verb]; exactly two of them are model-facing execution paths.",
     probe: "grep -rn '\\.verbs(' --include=*.py defender/ (excluding tests and .venv)",
     observed: "6 hits, 4 non-test. Model-facing execution: query_tool.py:335, closed_ticket_tool.py:184. UNDER-DETERMINED by this probe (its own caveat): ticket_seeds drives ticket_adapter as a SUBPROCESS CLI, outside the registry entirely. n1/g1 later found a FIFTH site (the pre-execution reject path) and g15 bounded the subprocess caveat to one edge."}
  - {id: c3, source: discuss, kind: census, probe_kind: search, verdict: holds,
     claim: "The surface is 32 verbs across 7 systems, all read-shaped.",
     probe: "imported ModuleVerbRegistry over scripts/adapters and enumerated systems() x verbs() with inspect.signature",
     observed: "change-mgmt(4), cmdb(4), elastic(4), host-state(7), identity(6), threat-intel(3), ticket(4) = 32, of which 7 are health-check. No verb body performs a write. CROSS-CHECKED (search): an AST walk of each adapter's VERBS dict literal gives the same per-system counts independent of the executed enumeration (4+4+4+7+6+3+4=32) — the census closes on search, the executed count corroborates it."}
  - {id: c4, source: discuss, kind: behavior, probe_kind: executed, verdict: holds,
     claim: "A rejected call moves run state and is recorded indistinguishably from any other agent-fixable error, before the refusal is raised.",
     probe: "executed QueryCapture.wrap_tool_execute with system=elastic verb=no-such-verb over a tmp run_dir and a handler that raises if reached",
     observed: "handler never reached; ModelRetry raised; BUT executed_queries.jsonl written with exit_code=64, error_class='agent-fixable', and gather_raw/L1/0.json created. Independently reproduced twice."}
  - {id: c5, source: discuss, kind: reachability, probe_kind: executed, verdict: unrefuted,
     claim: "No verb param selects the operation; params select scope within a fixed operation.",
     probe: "executed signature sweep over all 32 verbs against a denylist of operation-selecting names",
     observed: "No hit on any operation-selecting NAME. CAVEAT: blind to where the operation actually lives — the method is a literal at the _http_json call site, so a write verb with two scope-shaped params passes it clean (D4's construction). Evidence about NAMES only; c13/c14 show 'scope' was the wrong frame for target-selecting params."}
  - {id: c6, source: discuss, kind: reachability, probe_kind: executed, verdict: refuted,
     claim: "The issue's non-goal 'nothing that makes the tool surface accept a path/program/command' is accurate as written.",
     probe: "same sweep as c5",
     observed: "host-state.fim-checksum(host, path) accepts a path param today. What actually holds is operation-fixity."}
  - {id: c7, source: discuss, kind: referential, probe_kind: search, verdict: holds,
     claim: "Elastic verbs authenticate as the built-in `elastic` superuser, and it is the ONLY adapter that authenticates at all.",
     probe: "grep -rn 'auth=' scripts/adapters/*.py plus read of elastic_adapter.py:103 and _stub_transport.py:194-215",
     observed: "One hit: auth='elastic:${ELASTIC_PASSWORD}', expanded inside the target container's shell. The other six systems pass no auth."}
  - {id: c8, source: discuss, kind: referential, probe_kind: read, verdict: holds,
     claim: "A model-content-driven write to the ticket system already ships, off the tool surface.",
     probe: "read run.py:61,209,236 and scripts/case_history/ticket_writer.py:114-132",
     observed: "--update-ticket (opt-in) POSTs /tickets/{key}/transitions carrying the model's disposition, reason and confidence. PARTIAL — c16 shows this is one of four write endpoints, and not the ungated one."}
  - {id: c9, source: discuss, kind: referential, probe_kind: read, verdict: holds,
     claim: "The bash grant table refuses to compile a grant whose program has not declared its effect — the fail-closed precedent D2 builds on.",
     probe: "read runtime/permission/policy.py:27-34",
     observed: "AgentPolicy.__post_init__ raises on a grant naming a program absent from PROGRAMS: 'an untabled program is an ungated one.' The precedent justifies the PRINCIPLE, not the compile-time timing — O3 must defer the agreement check to first resolution."}
  - {id: c10, source: discuss, kind: reachability, probe_kind: executed, verdict: unrefuted,
     claim: "Model-supplied params cannot inject shell into the docker-exec transport that carries the credential.",
     probe: "read _stub_transport.py:199-217 — tried to find a param path into the shell string",
     observed: "The in-container `sh -c` string is static; everything dynamic is forwarded as argv after `--`. WEAKEST INSTRUMENT in this ledger — a read standing in for a reachability probe. Worth re-probing as executed if anything reshapes the transport. RE-PROBED (executed): called docker_exec_curl with subprocess.run mocked and a malicious url/body containing shell metacharacters (backticks, $(), ;). The malicious content landed as discrete argv elements after `--`; the static `sh -c` string carrying the credential never varied. CONFIRMED, not just unrefuted-by-reading."}
  - {id: c11, source: discuss, kind: referential, probe_kind: read, verdict: holds,
     claim: "A durable, append-at-decision-point audit stream already exists and already carries a non-message policy event, so the denial record needs no new stream.",
     probe: "read runtime/observe.py:76-146, driver.py:97, driver.py:582",
     observed: "RequestLogger writes llm_requests.jsonl with an explicit flush() after every record, and log_budget_refusal emits a standalone event_type outside every evidence table. write_trace instead rebuilds tool_trace.jsonl at end of run, so THAT one is erased by an abort."}
  - {id: c12, source: discuss, kind: census, probe_kind: search, verdict: holds,
     claim: "The existing policy-event precedent is write-only — nothing renders it.",
     probe: "grep -rn 'budget_refusal|event_type' scripts/visualize/*.py",
     observed: "Zero hits. One writer, no reader. The analyst-facing half of O5 is new work, not inherited. The writer also suppresses all exceptions and records no timestamp or seq."}
  - {id: c13, source: discuss, kind: reachability, probe_kind: executed, verdict: refuted,
     claim: "A role granted only `host-state` cannot produce an effect against another system.",
     probe: "read scripts/adapters/host_state_adapter.py:31-43 and the _exec -> docker_exec_raw path; traced the `host` param from the model-facing signature to the docker target",
     observed: "REFUTED. _check_host warns to stderr and returns; `host` is then the docker exec target. proc-tree / passwd / fim-checksum / package-list run inside the elasticsearch, kibana and ticket-store containers. RE-PROBED (executed): called host_state_adapter._exec with subprocess.run mocked for host='elasticsearch' (outside KNOWN_HOSTS) — the docker exec cmd built was ['docker','--context','soc-playground','exec','elasticsearch',...]: the attacker-controlled host lands verbatim as the container target. CONFIRMED."}
  - {id: c14, source: discuss, kind: reachability, probe_kind: executed, verdict: refuted,
     claim: "A role granted only `elastic` reads is confined to the configured event/alert indices.",
     probe: "read scripts/adapters/elastic_adapter.py:159-190 (index resolution + URL build)",
     observed: "REFUTED. `resolved = index or config[index_key]` — a model-supplied index overrides the configured one and is quoted with safe='-*,.', so dotted system indices pass through. Combined with c7 this reaches the cluster's security indices. RE-PROBED (executed): called elastic_adapter._search_verb with _http_json mocked and index='.security-7,.kibana*' — resolved index and the built URL both carried the attacker-supplied value verbatim, bypassing ELASTIC_EVENTS_INDEX/ELASTIC_ALERTS_INDEX. CONFIRMED."}
  - {id: c15, source: discuss, kind: census, probe_kind: search, verdict: refuted,
     claim: "Scoping the registry at the composition root covers every construction site.",
     probe: "grep -rn 'verbs is None' --include=*.py defender/ (excluding tests and .venv)",
     observed: "REFUTED. Four sites; three mint or demand a registry as a fallback, one of those INSIDE the judge engine. n2/g2 later showed this census itself undercounted — the grep idiom cannot see driver.py:563's ternary, which is the production path."}
  - {id: c16, source: discuss, kind: census, probe_kind: search, verdict: refuted,
     claim: "The only estate-write path is the opt-in --update-ticket post-step.",
     probe: "grep of POST endpoints in scripts/case_history/ticket_writer.py plus read of learning/tickets/ticket_enrichment.py:58-71",
     observed: "REFUTED. Four endpoints. enrich_case_ticket runs from the LEARNING LOOP with no --update-ticket gate, carrying the adversarial judge's free-text resolution_method into the store, whence later runs read it back."}
  - {id: c17, source: discuss, kind: referential, probe_kind: read, verdict: refuted,
     claim: "A method-based transport rule — an `r`-classed verb must not use a non-GET method or a body — is implementable without breaking existing read verbs.",
     probe: "read the three _http_json call sites in scripts/adapters/elastic_adapter.py",
     observed: "REFUTED. Elastic's _search and esql are both POST-with-body READS — that is Elasticsearch's protocol, not a smell. What this kills is a GLOBAL, method-ONLY rule ('an r-classed verb may not POST'); it says nothing about an allowlist ENTRY that names a method beside its path. REWORDED AT THE REPAIR PASS: the old sentence here read 'D4 therefore keys on the ENDPOINT allowlist', which no longer describes what shipped. Fork F1 keys D4's allowlist on (URL PATTERN, HTTP METHOD) PAIRS, and the two POST reads pass as listed pairs — see g26, whose measurement is what established that the pair separates read from write. The verdict is unchanged; only the consequence sentence was stale."}
  - {id: c18, source: discuss, kind: census, probe_kind: search, verdict: holds,
     claim: "Gather's real capability need is 21 of the 32 registered verbs; two are used by nothing, and two more are used only by the judge.",
     probe: "parsed verb:/id: frontmatter from the 14 committed query templates, joined against every executed_queries.jsonl across 20 past runs, cross-checked against the live registry",
     observed: "20 distinct registered (system,verb) pairs executed; 610 of ~1000 calls are elastic.esql. Never used: cmdb.list-roles, identity.list-authorized-hosts. Judge-only: ticket.get-ticket, ticket.key-pattern. CAVEAT: 'never used in 20 runs' is usage evidence, not proof of sufficiency. NOT re-probed at the worktree base — the run history under /tmp/defender-runs is not present here; g4 independently confirms the grant is consistent with the live registry."}
  - {id: c19, source: discuss, kind: census, probe_kind: search, verdict: refuted,
     claim: "The `verb` column in the historical queries tables means what it means today, so run history can be used directly to derive a grant.",
     probe: "same join as c18 — set-difference of executed pairs against the live registry",
     observed: "REFUTED. Five executed pairs name TEMPLATE IDS rather than verbs. The column's meaning drifted — which is why d16's load-time resolve check on grant entries is load-bearing, not ceremony."}
  - {id: c20, source: discuss, kind: census, probe_kind: search, verdict: holds,
