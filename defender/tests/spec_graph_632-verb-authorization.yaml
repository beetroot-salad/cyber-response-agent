       resolved_to: d52_health_check_uniform_grant_is_exercised}
    - {rule: R4, element: "elastic_index.domain.distinguished[logs-*,security-audit-*]", cites: [c14, g13],
       resolution: "RESOLVED — §7 R5: confinement evaluates REACH rather than comparing strings, and refuses the whole call; one decision covers all three of this facet's cells. Silent narrowing to the in-bounds members was rejected by name — it satisfies the letter of the obligation while hiding an attempted cross-tenant read from the audit trail that exists to record it. R6's chooser walk lands here too, and the same answer sanitizes it: a model-chosen, attacker-influenced slot that today reaches a rendered request with only URL-quoting between it and a superuser transport now meets a reach evaluation first.",
       resolved_to: d58_index_reach_refuses_the_whole_call}
    - {rule: R4, element: "elastic_index.domain.distinguished[*]", cites: [c14, g13],
       resolution: "RESOLVED — §7 R5, the same decision as the sibling cell; not a separate question.",
       resolved_to: d58_index_reach_refuses_the_whole_call}
    - {rule: R4, element: "elastic_index.domain.distinguished[-logs-*]", cites: [c14, g13],
       resolution: "RESOLVED — §7 R5, the same decision as the sibling cells; not a separate question.",
       resolved_to: d58_index_reach_refuses_the_whole_call}
    - {rule: R4, element: "host_state_target.domain.distinguished[defender]", cites: [c13, g13],
       resolution: "RESOLVED — §7 R4: the agent's own execution container is an ordinary refusal with no special-casing, under the same (program, container) pair rule as the sibling-store case.",
       resolved_to: d57_host_state_confines_the_pair}

  pre_discharged:
