  # ---- promoted by the repair pass's re-ground leaf (g26-g28) ----
  # These three ARE the probes the human's three repair-pass fork resolutions rest on. They
  # were executed and recorded in .spec-flow/frontiers/100-reground.md as rg1/rg2/rg3 and
  # lived only in the frontier chain until now; the ledger ships in the artifact (rules.md),
  # so a citation pointing at a side file the diff does not carry is indistinguishable from
  # an uncited rationale downstream. Renumbered onto this ledger's own sequence; text carried
  # across verbatim, not re-probed and not re-worded stronger than what was measured. One
  # correction of record: 100-reground.md typed rg3 `kind: seam`, which is a DEMAND kind and
  # not one of the six claim kinds — the instrument it actually used (executing the suite's
  # own attribution rules over a rendered judge roster) makes it a `behavior` claim, and it
  # is filed as one here.
  - id: g26
    kind: behavior
    probe_kind: executed
    verdict: holds
    claim: >-
      D4 is repairable — a per-system allowlist keyed on the (endpoint, HTTP method) PAIR
      discriminates the real reachable surface, admitting every read an adapter actually
      performs (including elastic's two POST-with-body reads) while rejecting every
      estate-write endpoint, INCLUDING the `/tickets` collision that makes the endpoint-only
      rule unsatisfiable.
    probe: >-
      executed — replaced the single HTTP chokepoint (`docker_exec_curl`) with a recorder and
      drove every verb in every shipped adapter's VERBS table plus all four ticket-writer
      entry points against a synthetic config tree, capturing (system, resolved path, method
      literal) at the call site; then computed the path-only and (path, method) overlaps
      between the adapter-read set and the writer set. Two write call sites that the drive
      did not reach (they need a report artifact) were read off source instead; both are
      literal POST.
    observed: >-
      27 distinct (system, path, method) triples. Every stub adapter read is GET; elastic
      reads are two POST (search, ES|QL) and two GET (cluster health, Kibana status); every
      writer mutation is POST. Path-only overlap between reads and writes = {"/tickets"};
      (path, method) overlap = {} (empty). The method literal is a required keyword argument
      at all three HTTP chokepoints, and all three funnel through one transport function —
      the same function the spec's capture seam wraps — so the axis costs one extra recorded
      field. c17's refutation is narrower than the design read it as: it kills "an r-classed
      verb may not POST", not "the allowlist may mention a method". Separately observed: the
      writer's system identity is `case-history`, whose configured base URL is the SAME host
      as `ticket`'s, so neither the system label nor the host separates read from write.

  - id: g27
    kind: behavior
    probe_kind: executed
    verdict: holds
    claim: >-
      O6 ("a denial moves no state") is pinnable — the state a QUERY CALL allocates is
      disjoint, by path, from the state the RUN allocates at dispatch, so a predicate exists
      that a denial satisfies and that dispatch cannot falsify. Re-verifies c4 at the current
      base rather than inheriting it.
    probe: >-
      executed — built a bare run directory; snapshotted the payload tree, the queries-row
      count and the derived sequence number; ran the real dispatch hook; re-snapshotted; then
      drove the production query capability's execute path twice through today's two reject
      branches (unknown verb on a known system, unknown system) with real run dependencies,
      re-snapshotting after each.
    observed: >-
      Dispatch allocates exactly one artifact — a flat per-lead sidecar file directly at the
      root of the payload tree — and allocates NO sequence number, NO queries row, and NOT
      the lead-scoped subdirectory. A query call allocates only inside the lead-scoped
      subdirectory (one file per sequence number), advances the sequence number, and appends
      one queries row. The two never share a directory level. c4 HOLDS at the current base:
      both of today's reject branches wrote a payload file AND a queries row before raising
      their retry, and the sequence advanced each time. The failing assertion globs the whole
      payload tree recursively, which catches the dispatch sidecar; the sibling assertion two
      lines below it — that the lead-scoped subdirectory does not exist — is already the
      correct predicate and is falsified by nothing dispatch does.

  - id: g28
    kind: behavior          # 100-reground.md wrote `seam`, which is a demand kind, not a claim kind
    probe_kind: executed
    verdict: holds
    claim: >-
      H10 holds — committing a grant-derived roster for more than one role makes the
      real-tree audit red under the committed attribution rules, because those rules
      attribute a name to a (system, verb) pair and never to a ROLE, while the real-tree
      assertion scores every model-read surface against ONE role's grant.
    probe: >-
      executed — read the committed pair sets out of the spec helper and computed the
      set differences directly; rendered a judge roster in the roster's own committed
      rendering contract (qualified `system.verb` ids) and ran the suite's own roster-parsing
      function plus the qualified-attribution rule over it, scoring against gather's pair set.
      Separately traced the consumers of the per-system prose injector and enumerated every
      roster-path call site in the suite.
    observed: >-
      The judge's grant names three pairs; gather's grant withholds two of them, and those
      two ARE two of the four pairs the suite's "committed prose still advertises a withheld
      verb" counter-example set is built from. So a committed judge roster is red under
      gather's grant by the qualified rule, with no ambiguity and no dependence on the
      bare-name rules. Per-role attribution is EXPRESSIBLE but not expressed: the grant object
      carries its own role, and the roster path function is role-keyed, so each roster file is
      attributable to a role by construction — but the audit takes an unkeyed tuple of grants,
      and none of its three attribution rules mentions a role. The non-roster surfaces are
      cleanly gather's: the per-system prose injector has exactly ONE consumer in production,
      the gather dispatch path. Nothing in the suite requires a judge roster to exist; every
      roster assertion names gather. And no committed assertion requires a roster file to be
      inside the audited surface set.

# ===========================================================================
# GATE — phase D's gate leaf. `spec-graph gate --residue` computes 40 R1-R5
# firings mechanically; this block is the leaf's judgment on top of that:
# witnesses, routes, and the three judgment halves (R0 reconciliation, R5
# tightening extension, R6 chooser/sanitizer walk) the tool cannot derive.
#
# TOOL GAP FOUND: the mechanical checker matches a firing to a demand by EDGE-
# OR-BOUNDARY-PREFIX only — it does not check the bound demand's `kind` (R1
# wants `kind: shape`, R2(b) wants a demand at the *composition frame*) nor
# whether the binding actually reaches the specific sub-slot (`.payload` vs
# the bare edge). Every R1/R2/R5 firing below reads "answered" to a bare
# `spec-graph gate` for this reason; four of the seven R2 firings are NOT
# actually discharged once judged on content (see holes, below). The R0 check
# also only surfaced 2 of the artifact's 4 recorded `unknown` invariants — it
# checks `constraints: unknown` under access facets but not `default: unknown`
# under domain facets. Both gaps are noted here rather than silently trusted.
# ===========================================================================
gate:
  evaluated:
    - {rule: R0, fired: true}   # 4 unknowns considered (2 mechanically caught, 2 added by hand — see holes); bidirectional scan found no orphan design sentence and no invented-scope delta element
    - {rule: R1, fired: true}   # 5 firings; all bind an edge, none binds a `kind: shape` demand literally — judged on content below
    - {rule: R2, fired: true}   # 7 firings; 3 genuinely discharged, 4 only edge-matched — see holes
    - {rule: R3, fired: true}   # 13 firings; 9 per-cell pre-discharged, 4 open (2 forks, 2 waiver candidates)
    - {rule: R4, fired: true}   # 14 firings; 10 per-entry pre-discharged, 4 open (3 forks, 1 obligation)
    - {rule: R5, fired: true, cites: [g10]}   # survival demand exists (d18); judgment extension (safe-by-construction) considered and left open — FORK 9 is exactly this question (fail-open vs fail-closed at generation failure)
    - {rule: R6, fired: true, cites: [g24, c10]}   # walked every value reaching llm_requests/judge_audit_stream/estate/docker_exec/verb_roster; every attacker-influenced slot with no sanitizer already routes to an existing fork (5, 4, 2, 12) or an existing probed claim (g24, c10) — verb_roster's slots are grant/author-chosen only, so the walk closes clean there

  # No entry here spawns a demand — this run credits, holes, and routes; it does not mint.
  # verb_grant.domain.alternatives[health-check] (R4) is filed under holes too, tagged
  # obligation-not-decision, because the mechanical check only accepts an answer recorded in
  # this graph — its real route (60-residue.md) is a Test obligation, not a §7 decision.
  obligations: []

  holes:
