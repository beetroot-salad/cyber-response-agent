    - "A THIRD UNSATISFIABLE PAIR WAS FOUND AND REPAIRED WITHOUT WEAKENING EITHER DEMAND, and it is the near-miss worth reading. d34's fake answered `list-tickets` with a bare array while asserting exit_code == 0; the store's real list endpoint answers an object envelope and gather's ticket screen files a bare array as MALFORMED. The only implementation satisfying both d34 and the screen is one that skips non-object payloads — which is exactly H8's bypass of the self-case exclusion, so the contradicting fixture was the thing MAKING the exploit necessary. Repaired in the fixture (the fake now answers the store's real shape), not in either demand. Adjacent to it: d23's fixture returned two tickets neither of which was the current case, so the exclusion it exists to pin was never exercised at all — the self key is the run's own id, and nothing in the fixture was it."
