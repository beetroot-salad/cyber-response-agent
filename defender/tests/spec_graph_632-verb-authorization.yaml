    - {rule: R4, element: "verb_grant.domain.distinguished[gather/benign_judge]", by: d21_shipped_grant_contents, edge: "verb_grant", cites: [g4]}
    - {rule: R4, element: "verb_class.domain.distinguished[r]", by: d17_read_class_endpoint_allowlist, edge: "interacts(query_tool->verb_registry)", cites: [g3]}
    - {rule: R4, element: "verb_class.domain.distinguished[rw]", by: d14_class_agreement_fails_closed, edge: "interacts(query_tool->verb_registry)", cites: [g3]}
    - {rule: R4, element: "circuit_breaker.domain.distinguished[infra]", by: d33_infra_fault_moves_the_breaker, edge: "interacts(query_tool->circuit_breaker)", cites: [n10]}
    - {rule: R4, element: "circuit_breaker.domain.distinguished[policy-denial]", by: d10_denial_moves_no_breaker, edge: "interacts(query_tool->circuit_breaker)", cites: [n10]}
    - {rule: R4, element: "host_state_target.domain.distinguished[elasticsearch]", by: d11_host_state_refuses_unknown_target, edge: "interacts(host_state_adapter->docker_exec)", cites: [c13]}
    - {rule: R4, element: "host_state_target.domain.distinguished[ELASTICSEARCH]", by: d49_host_target_case_variant_refused, edge: "interacts(host_state_adapter->docker_exec)", cites: [c13]}
    - {rule: R1, element: "interacts(elastic_adapter->estate).payload", by: d17_read_class_endpoint_allowlist, edge: "interacts(elastic_adapter->estate)", cites: [g12]}
