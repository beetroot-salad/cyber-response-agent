  deviations:
    - "THE REPAIR PASS — read this beside THE BATON, which predates it. This suite was kicked back from write-code-from-spec, which REFUSED to implement on two demands no correct code could satisfy, and from an adversarial implementer that greened the whole suite with deliberately dishonest code. A human resolved three design forks (F1/F2/F3 in .spec-flow/frontiers/170-resolutions.md); this pass applied them, minted the two demands those resolutions carried, and tightened nine tests until the exploit each admitted goes red. It re-derived no intent and touched no test that was already discriminating."
