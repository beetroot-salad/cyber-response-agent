  - id: PJ2a
    kind: behavior
    claim: >-
      persist._flock's fcntl.flock(fd, LOCK_EX) excludes two OS threads of the SAME process
      from each other, even though each thread's _flock call opens a distinct fd (distinct open
      file description) via lock_path.open('a+').
    probe: >-
