  deviations:
    - "IMPLEMENTATION CONSTRAINT, FIRST-CLASS: D7's `post_rotate` hook MUST live on the SHARED CorpusAuthorConfig, not on the lessons config. D7 describes it as lessons-local decoration; the resolved spec makes it load-bearing. It is the only seam that runs after BOTH the corpus commit and the queue rotation, which makes it the only place the retirement guard's CLOSING edge is observable. An implementer who narrows it back to lessons removes that seam, the closing-edge probe becomes unwritable, and decision 9's subsumption of decision 7 loses its oracle — post-commit no-bump would then rest on nothing at all. This is a load the hook was never designed to carry, and it is recorded here because nothing about D7's own text would tell an implementer that narrowing it breaks a different decision two rounds away."
    - "A RED TEST IS NOT EVIDENCE THE ASSERTION RAN — caution for finalize and for anyone reading a red suite. Phase F found that `GitError(\"member\")` died in the test's own setup (the real signature is `(args, returncode, stderr)`), so decision 8's `and from nothing else` half NEVER EXECUTED while the test sat red like every other test in a spec written before its target exists. This generalises and is the reason it survived every prior check: a test that dies in SETUP is exactly the same colour as one that dies at its MISSING TARGET, so the red count cannot distinguish them, and null-stub cannot either — both are pass/fail on a suite whose expected state is failure. Only EXECUTING the assertion distinguishes them. Repaired; recorded because the next spec-phase suite has the same blind spot by construction."
    - "SINGLE POINT OF FAILURE IN THE SUITE'S OWN STRUCTURE - read this before loosening any assertion. `test_the_retire_set_names_author_error_git_error_and_model_retry_and_nothing_else` is now the SOLE assertion holding up three separate demands: post-commit no-bump (post_commit_tick_reconciles_without_re_authoring, decision 9), the non-retiring exemption (unnamed_fault_classes_do_not_retire, decision 8) and the systemic exemption (systemic_faults_exempt_on_author_channels). All three are carried by NON-MEMBERSHIP after decisions 8 and 9, so relaxing that one test silently removes the oracle for all three at once - and each would still read as covered from the demand list. This is not a defect to fix: it is the genuine consequence of resolving three questions by membership in one set rather than by three mechanisms. It is recorded here, where a cold reader meets it, precisely because the fork record is not where anyone tempted to loosen an over-strict-looking assertion would look."
    - "STILL ASSERTED BY CLASS, NOT PER PATH (carried forward, deliberately not half-addressed). `AuthorError`'s four arrivals - the agent call, the mid-batch timeout via the RunUnprocessable chain, the post-agent steps, and the pitfalls converted fault - are covered by assertions on the CLASS. Decision 10's test drives a NON-member and so offered no cheap way to narrow this; the author left it as a recorded limit rather than half-addressing it, which is the right call - a partial per-path assertion would have read as coverage while leaving the same hole. A change that stopped any one path arriving as AuthorError leaves every membership test green while that path silently stops retiring. The timeout chain remains the weakest, covered only by a level-2 fake."
    - "PHASE-E REPORT, 11 OF 12 BODIES CHANGED - NOT 12. `retire_write_failure_is_systemic` was on §7 round 2's rewrite list and its body was correctly LEFT STANDING. A11 is carried by non-membership under decision 8, and the existing test already induces a real OSError on the retire write and asserts propagation with a byte-identical queue - which is exactly the resolved contract. The rewrite list over-reached by one; the author was right not to follow it. Counting it as rewritten would misreport what changed to anyone diffing the suite."
    - "THE `faults.LockAcquisitionError` REQUIREMENT IS DROPPED, not silently omitted. §7 round 1 derived from D5/P13's word 'explicitly' that the lock layer should name its own fault type; §7 round 2 red flag 7 recorded that decision 8 demotes this to a readability preference, because an OSError is simply not a member of the retire set. Phase E dropped it accordingly. The contract is now: a plain OSError from a lock acquisition escapes uncaught. No new exception class is required by this change, and an implementer who adds one is not violating anything - they are also not discharging anything."
    - "KNOWN LIMIT OF THE SUITE'S DISCRIMINATION: the retire set's `AuthorError` member carries FOUR distinct paths - the agent call, the mid-batch wall-clock timeout (via the RunUnprocessable chain, PJ1b), the post-agent steps (verify_agent_state / validate_agent_result_partition), and the pitfalls converted fault. The membership assertions check the CLASS, not that each of the four paths still raises it. A change that stopped one path from arriving as AuthorError - say the timeout chain no longer wrapping - would leave every membership test green while that path silently stopped retiring. The timeout chain in particular is covered only by a level-2 fake, not by a real deadline. This is the sharpest remaining hole in a suite that is otherwise discriminating, and it is a coverage limit rather than a design gap."
    - "BEHAVIOUR-CHANGE INVENTORY (92-reconciliation.md F5) — READ THIS BEFORE THE ISSUE TEXT. The design's comment 3 says the pitfalls ceiling is 'the one place where the fold alters what the loop does'. That sentence predates §7 and is now wrong; it still propagates through 45-dispositions.md (A15's impact line) and a test module docstring. The resolved design changes behaviour in FOUR places: (1) the pitfalls ceiling itself — a repeatedly failing pitfalls batch now retires, where its rc=2 previously never reached the retire callback at all; (2) a post-agent failure with a succeeding agent now bumps and retires, where it previously returned without touching the queue; (3) a commit-time GitError now retires and leaves the corpus dir usable, where it previously escaped and wedged the channel on the next cleanliness check; (4) an externally killed boxed command now retires, where it was absorbed into ModelRetry and the batch reported success. Decision 8 deliberately does NOT add a fifth: an unnamed fault class keeps today's escape-and-stay-queued behaviour. finalize and the adversarial implementer both read this entry first."
    - "DECISION 8 REVERSED A JUDGE RECOMMENDATION THAT HAD ALREADY SHIPPED INTO THE SUITE. A12/P76 ('the ceiling is total') was applied resolved_by: judge-recommendation and never human-reviewed until the cold reconciler showed what it composed with fork 7 and decision 3: any unnamed fault class would bump every row in the batch and permanently delete a batch of real work every three ticks, into a graveyard with no production reader. The general cost statement already existed in the run but stayed local to one git-specific waiver. The composition, not either half, was the finding."
    - "§7 chose the NON-RECOMMENDED option on O8 scope. The recommendation was to cover the first two unbounded-retry paths and file the rest; the human chose all four (pitfalls rc=2, the post-agent failure, GitError from commit_corpus, the externally killed box command), each with its own demand and a discriminating oracle. Path 2's oracle must fault the POST-agent step — O8's existing oracle faults the agent and passes over that hole."
    - "PHASE ORDER DEVIATION: phase E must NOT be dispatched until phase C's classification re-runs against the resolved shape. Demand #0's reading flipped and the author channels' classify layer widened, and 22 of the 50 routed premises sat on D9's retire seam with 7 more on the ceiling's domain — all classified against a drain that returned rc=2 from the pitfalls leg and retired out of a narrow `except AuthorError`."
