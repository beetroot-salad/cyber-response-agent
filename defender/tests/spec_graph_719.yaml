    - "Decision 7's safety argument is CONDITIONAL, and the condition is not itself pinned. Suppressing the post-commit bump is safe because the next tick's _partition_pre_author marks the already-authored row consumed_idempotent via existing_finding_ids / existing_observation_ids and never re-invokes the agent — verified in-tree against test_survival_idempotent_redrain and test_hold_committed_keeps_findings_queued_until_corpus_covers_them, which both drive a second tick with a must-not-author agent. The bound holds only if the failing post-commit path leaves the corpus dir clean enough for the next tick to REACH that partition: assert_clean_corpus_dir runs first, and a stray file aborts the tick before any gate call (F5/P03). Not assumed — recorded as the precondition the corpus-cleanup half of decision 1 path 3 must also satisfy here."
