    - "Scope ambiguity carried at §7 and CLOSED by decision 5: the retirement classifier is the same on all four channels — the three observation channels (curator.py:317) AND findings (lessons/run.py:346). Under decision 8 what they share is the enumerated retire set, not a widened guard."
    - "DECISION 5 HAS NO LEGACY ORACLE. Every existing findings-channel drain test faults with an explicit AuthorError (test_agent_exception_leaves_queue_intact, test_dlq_quarantines_poison_findings_batch, test_survival_partial_write_rollback), so all three still pass under a NARROW guard and under a WIDE one — none of them can tell the two apart. What moves is their intent, not their assertions: each becomes a non-discriminating positive. test_curator_glm_engine.py::test_systemic_faults_propagate_uncaught and that module's `Fault split` docstring clause state the AuthorError-vs-systemic split as a whole-system property; after decisions 5+6 they are true only of the ENGINE layer, not of the drain, so their scope narrows even though the assertions survive. Phase E must not read their green as evidence the guard widened, and `finalize` must not meet this cold."
