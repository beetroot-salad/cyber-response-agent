  # ---- Waivers — minted at §7 only. Each is an EXAMINED NO kept in the artifact, never a
  # silence in handoff.drops, and each cites the probed claim its rationale rests on.
  - id: permanently_held_row_out_of_scope                                          # A13/P42
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["queue_row", "gate", "retire"]
    cites: [G17]
    outcome:
      nl: >-
        A row whose gate condition never arrives is held on every tick and therefore never
        bumped and never retired; O8 bounds FAILURE, and a permanently-held row is a gating
        question. Not tested here and not widened into O8 — filed as a separate follow-up.
  - id: no_reconciliation_for_a_committed_corpus                                   # A14/P46
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["corpus_clean_gate", "rotate_queue_locked", "consumed_ledger"]
    cites: [G15, G23]
    outcome:
      nl: >-
        When the corpus commit lands but the queue is never rotated, re-authoring the same
        rows on a later tick is the accepted recovery path; no reconciliation mechanism
        between an already-committed corpus and a queue that does not know it is in scope.
        R3 CLOSED by decision 7 - a guard that caught everything would otherwise have let such a row
        accumulate attempts and retire work already in the corpus. The bump is suppressed once
        the commit has landed, and the loop is bounded by the existing pre-author idempotency
        gate: the next tick's _partition_pre_author finds the id via existing_finding_ids /
        existing_observation_ids and marks the row consumed_idempotent without re-invoking the
        agent. That bound holds only while the corpus dir is left clean enough for the next
        tick to reach the partition at all - see red flag 8.
  - id: rollover_window_not_constructible_at_spec_time                             # C10/P63
    kind: survival
    form: waiver
    resolved_by: judge-recommendation
    binds: ["drain_lock", "append_lock"]
    cites: [G22]
    outcome:
      nl: >-
        The mixed-version overlap (a drain on old code beside one on new code) carries no
        suite expected value: the argument depends on the new drain lock's identity, which
        does not exist until the implementation does. Carried as an obligation to verify at
        implementation time (write-code-from-spec's actors run), not as a test here.
  - id: forward_check_spurious_not_found_accepted                                  # C13/P49
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["load_observation", "interacts(load_observation->actor_observations)",
            "interacts(load_observation->findings)"]
    cites: [G20, G24]
    outcome:
      nl: >-
        The unlocked forward-check read inside the authoring call may see a spurious
        not-found during the window the append/drain split opens; the consequence is an ERROR
        verdict the curator model acts on, not a torn read and not data loss. Accepted as a
        consequence of the split; the unlocked reader is filed separately.
  - id: git_transient_and_permanent_not_distinguished                              # D2/P02
    kind: domain-outcome
    form: waiver
    resolved_by: judge-recommendation
    binds: ["fault_map.domain.distinguished[GitError]", "author_error_guard"]
    cites: [C32]
    outcome:
      nl: >-
        A transient git failure and a permanent misconfiguration arrive as the same
        exception, and the fold adds no distinction between them. Recorded as intended so the
        absence is a decision rather than an oversight. Re-grounded after decision 1 path 3:
        the copies justified this on 'a GitError always kills the drain', which is false at the
        commit site now. The waiver's CONTENT is stronger, not weaker - a git failure inside
        the guard retires after N attempts whether it was transient or permanent, so a
        permanent misconfiguration burns the ceiling and retires real work. Recorded against
        the retire path, not against a drain-death path that no longer exists there.
  - id: box_fault_kills_sibling_corpus_authors_out_of_scope                        # D3/P09
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["author_error_guard.domain.distinguished[BoxFault]", "author_drain"]
    cites: [G22]
    outcome:
      nl: >-
        The four corpus authors run serially in one process against one box, so the first
        one's box fault ends the rest of the tick. Out of scope — this change touches queue
        locks, not box lifetime — and filed, because it is the same "one channel's trouble
        costs an unrelated channel its tick" shape as the stuck-appender case.
  - id: transient_verifier_failure_out_of_scope                                    # D6/P06
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["load_observation", "gate"]
    cites: [G20]
    outcome:
      nl: >-
        A transient verifier-model failure during the forward check reaches the curator model
        as an ERROR line. The forward check is an explicit non-obligation of this change;
        confirmed out of scope and recorded so the ERROR-line contract is a choice.
  - id: pitfalls_no_system_silent_consume_filed_separately                         # E2/P34, Fork 6
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["pitfalls", "run_pitfalls", "rotate_queue_locked"]
    cites: [G7]
    outcome:
      nl: >-
        A pitfalls batch in which no queued row carries the field the batch is keyed on is
        marked wholly consumed with no author run. A gating bug, not a retirement bug, and
        the pitfalls ceiling is already this change's one deliberate behavior change — filed
        as a separate follow-up. Citation note - the direct claim (C31) is `unprobed`, so the
        rationale rests on G7's reading of rotate_pitfalls instead.
  - id: all_unparseable_pending_file_reads_as_empty                                # E3/P21
    kind: behavior
    form: waiver
    resolved_by: judge-recommendation
    binds: ["queue_row", "interacts(drain->queue_row)"]
    cites: [G24]
    outcome:
      nl: >-
        A pending file whose every line fails to parse is observably identical to a genuinely
        empty queue, and this change adds no distinguishing signal. Accepted as an exclusion
        beside the findings id-collision exclusion the design already records.
    rejected:
      - nl: >-
          count the discarded lines and surface the count — the judge's own better
          alternative, not taken here because it adds a signal the design never asked for
  # ---- F6 and F8: implicit decisions made explicit at §7 round 2. Both were coherent and
  # traceable but had no sentence; a decision nobody wrote down is indistinguishable from an
  # oversight to the next reader, which is the whole reason a declined obligation is a waiver.
  - id: stuck_row_record_has_no_operator_surface                    # decision 11 cost 1, decision 12
    kind: survival
    form: waiver
    resolved_by: human-decision-12
    binds: ["stuck_row_record", "interacts(drain->stuck_row_record)"]
    cites: [G16]
    outcome:
      nl: >-
        DECISION 12 - "WRITTEN DOWN" IS THE ACCEPTED END STATE. The durable per-channel record is
        the deliverable; NO OPERATOR-FACING SURFACE EXISTS and none is built here. No alert, no
        dashboard, no CLI, no report reads it. Building one is an explicit NON-OBLIGATION of this
        change, not a forgotten step.
        THE DESIGN'S OWN LANGUAGE IS CORRECTED RATHER THAN DEFENDED. The argument that justified
        reversing A12 was "stuck but recoverable AND LOUD". Loud was delivered as WRITTEN-DOWN.
        Anything in this artifact still claiming the failure mode is loud should be read against
        this sentence: the suite proves the record is written, and proves nothing surfaces it.
        A round-5 correction is folded in here too, because the cost was first recorded wrongly:
        this was minted as "a fifth WRITE-ONLY sink with no reader", carrying C20/G16's "nothing
        reads it, so a duplicate costs nothing" - D9's argument for collapsing two graveyards and
        decision 3's for making the graveyard advisory. That premise is FALSE of what was built.
        Decision 10's oracle asserts a count rising across ticks, decision 8 forbids storing it on
        the row, and each tick is a separate process, so the drain necessarily reads its own last
        record back. The borrowed argument is withdrawn, not restated.
  - id: stuck_count_has_no_lifetime_equivalent                                     # decision 11
    kind: uniqueness
    form: waiver
    resolved_by: human-decision-11
    binds: ["stuck_row_record.identity", "queue_row.identity", "author_max_attempts"]
    cites: [G17]
    outcome:
      nl: >-
        The stuck count is PER TICK, not per row, and this asymmetry appears nowhere in the
        design - it is written down here because it would otherwise be discovered. Decision 8
        requires a non-retiring row to stay byte-identical, so the counter cannot live on the
        row the way `attempts` does; it lives on the stuck-row record instead. Consequence a
        reader would otherwise assume away: a row that sticks, succeeds in a later batch, then
        sticks again has NO lifetime stuck count, whereas decision 2 made `attempts` explicitly
        lifetime with no reset on an intervening success. The two counters on the same row
        therefore have opposite reset semantics by construction. Declining to give the stuck
        count lifetime semantics is the accepted cost of keeping the row byte-identical.

  - id: out_of_tree_fixture_invalidation_is_not_covered                             # F6 / F11
    kind: shape
    form: waiver
    resolved_by: phase-f-fix-shape
    binds: ["eval_harness", "interacts(eval_harness->findings)",
            "interacts(eval_harness->actor_observations)", "queue_row"]
    cites: [G20]
    outcome:
      nl: >-
        F11 named two consequences of the two out-of-tree fixture writers; only the race half
        reached a premise (P59, dropped 3/3 doc-silent). The other half - that a changed
        queue-row shape invalidates their copied fixtures - is declined here rather than left
        silent. Neither harness is named in the project profile's writer list, so a future
        call-graph census still misses them; the profile's grep list does carry the two queue
        filenames, which is the recovery path this waiver rests on. Recorded, not fixed.
  - id: retirement_classification_differs_across_the_pitfalls_boundary              # F8
    kind: parity
    form: waiver
    resolved_by: phase-f-fix-shape
    binds: ["run_or_dead_letter", "fault_map.domain.distinguished[GitError]",
            "author_error_guard.domain.distinguished[GitError]", "graveyard"]
    cites: [C32]
    outcome:
      nl: >-
        O6/O8 say dead-lettering is identical for every drain and lands in one graveyard. After
        decision 1 path 3 and decision 8 that is true of the MECHANISM and the STORE but false
        of the CLASSIFICATION that reaches them - a commit-time GitError retires on the four
        author channels and kills the drain on pitfalls, because run_or_dead_letter's re-raise
        set still contains GitError and this change does not touch it. Both halves are
        deliberately pinned by tests; what was missing was the sentence saying the asymmetry is
        intended. Declining to unify the two classifiers is in scope for a follow-up, not here.
        SETTLED AT §7 ROUND 6 - PHASE E CONFIRMS THE ASYMMETRY IS DELIBERATE, and this waiver was
        right as minted. Why the blind reader found it anyway, which is the part worth keeping:
        it was stated ONLY inside the pitfalls test, so a reader arriving at the enumeration
        would reasonably conclude the retire set is global. It is now also in the module
        docstring and beside the set itself. A fact stated in exactly one test is a fact the
        next reader infers the negation of.
        The pending note below is retained as history: the blind reader reached the same
        asymmetry independently from the tests alone (B89: one fault class, two classifications
        by channel), and the coordinator has asked phase E whether its suite asserts this
        DELIBERATELY or merely PERMITS it. That answer has not landed. This waiver was minted at
        round 2 on a phase-F fix shape and already asserts deliberateness, which is exactly the
        resolution-by-assertion the round-5 instruction forbids. If phase E answers 'deliberate'
        the waiver stands as written; if it answers 'merely permitted', this is not a waiver at
        all but an OPEN GAP in decision 8's enumeration - GitError would be a member on four
        channels and a non-member on the fifth with nothing stating why - and it must be
        re-routed to the human rather than closed here. -- That branch did not occur; phase E
        answered 'deliberate'.

  - id: findings_channel_has_no_resurrection_guard                                 # decision 3
    kind: uniqueness
    form: waiver
    resolved_by: human-decision-3
    binds: ["interacts(run_direction->findings)", "findings.identity"]
    cites: [G15]
    outcome:
      nl: >-
        Decision 3 makes retirement terminal by writing retired rows to the consumed ledger,
        which the append path reads to dedup on three of five channels. append_findings does
        no such read, so the findings channel gains no resurrection protection from it. The
        asymmetry is recorded as an examined no rather than closed with a new guard D9 does
        not provide.

structure:
  # `attempt` and `direction` are carried from demand extraction's registry: they name row
  # state and the run_cycle fan, not path interpolation, and are registered so no later pass
  # re-coins them. `state_root` is the brief's second path axis (every queue, lock and
  # graveyard relocates under it; two processes with different values share no lock, P68).
  axes: [channel, queue_row_id, attempt, direction, state_root]

  actors:
    - {id: drain,              frame: leg,         provenance: design}  # the folded body, author/drain.py
    - {id: retire,             frame: leg,         provenance: design}  # D9's retire seam
    - {id: curator,            frame: leg,         provenance: code}    # observations config builder + gate
    - {id: lessons_run,        frame: leg,         provenance: code}    # findings config builder + gate
    - {id: run_pitfalls,       frame: leg,         provenance: code}    # leads/pitfalls_curator.py:110
    - {id: author_drain,       frame: composition, provenance: code}    # id reused from spec_graph_curator-glm-port
    - {id: lead_author_drain,  frame: composition, provenance: code}    # markers + pitfalls in one tick
    - {id: learn_drain,        frame: composition, provenance: code}    # run_cycle.run_one, the live run
    - {id: run_direction,      frame: leg,         provenance: code}    # run_cycle.py:129, one per direction
    - {id: load_observation,   frame: leg,         provenance: code}    # verify_forward/shared.py:22-29 (F2)
    - {id: eval_harness,       frame: leg,         provenance: code}    # out-of-tree fixture copiers (F11)

  boundaries:
    # --- the five pending queues -------------------------------------------------------
    - id: findings
      provenance: code
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence:
            nl: >-
              finding_id = <run_id>/<namespace><n>, built at persist.py:248 and read by the
              merge filter at persist.py:66-68; deterministic, and append_findings does no
              dedup of its own (G15/C18). Path <state_root>/_pending/findings.jsonl.
          sharing: serialized-append
    - id: actor_observations
      provenance: code
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence:
            nl: >-
              observation_id = <run_id>/<prefix><i>, read off _append_observations
              (persist.py:303-323), which loads pending-union-consumed ids to skip
              duplicates. Path <state_root>/_pending/actor_observations.jsonl.
          sharing: serialized-append
    - id: environment_observations
      provenance: code
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence: {nl: "same builder, environment channel; _pending/environment_observations.jsonl"}
          sharing: serialized-append
    - id: actor_environment_observations
      provenance: code
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence:
            nl: "same builder, actor-environment channel; _pending/actor_environment_observations.jsonl"
          sharing: serialized-append
    - id: pitfalls
      provenance: code
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence:
            nl: >-
              pitfall_id, read off rotate_pitfalls' id_key (persist.py:293). Path
              <state_root>/_pending_pitfalls/pitfalls.jsonl. One lock (.pitfalls.lock) serves
              both the append and the rotate role — not a split (C24).
          sharing: serialized-append

    # --- the row and the field D3 promotes to config -----------------------------------
    - id: queue_row
      provenance: code
      # RE-KEYED at phase D. spec_graph_curator-glm-port.yaml keys this on [batch_id];
      # batch_id is not a field on a queue row (G26).
      facets:
        identity:
          key_axes: [queue_row_id]
          evidence:
            nl: >-
              The row's key is the value under the channel's id_key field — exactly what the
              merge filter reads (persist.py:66-68) and what _append_observations' dedup reads
              (persist.py:314-316). `attempts` also lives on the row and carries across
              separate process invocations (P38, G17).
          sharing: serialized-append
    - id: id_key
      provenance: design
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              The row field a channel keys on. D3 promotes it from a hard-coded literal at each
              read site to a QueueChannel config field; the design names no default for the new
              field, and three of five channels use observation_id.
          default: unknown
          distinguished: [observation_id, finding_id, pitfall_id]
          falsy_valid: false
          documented_alternatives: []

    # --- the sinks the drain and the retire seam write ---------------------------------
    - id: consumed_ledger
      provenance: code
      facets:
        identity:
          key_axes: [channel, queue_row_id]
          evidence:
            nl: >-
              <channel>.consumed.jsonl, one per channel, appended by _rewrite_queue
              (persist.py:81). NOT write-only: on the three observation channels
              _append_observations reads it via _load_jsonl_ids(consumed_file,
              'observation_id') at persist.py:314-316 to dedup (G23/F4), so it is a genuine
              read/write shared path.
          sharing: serialized-append
    - id: graveyard
      provenance: design
      facets:
        identity:
          key_axes: [channel]
          evidence:
            nl: >-
              One <queue>.deadletter.jsonl per channel — _deadletter_file at curator.py:179-180,
              written at :203. The prior graph's `dlq`. Rows are appended, not keyed within the
              file; no production reader exists (G16/C20). The file path varies on channel only.
          sharing: serialized-append

    - id: stuck_row_record
      provenance: design
      facets:
        identity:
          key_axes: [channel]
          evidence:
            nl: >-
              DECISION 11. One per-channel stuck-row record beside the graveyard, under the same
              ignored prefix (P03/F5 — a path outside it aborts every later batch). The surface
              decision 10's operator signal takes: the author chose a written record over a log
              line because a log line is not assertable without log-capture plumbing, and the
              human ratified the shape. Rows are appended, not keyed within the file; the path
              varies on channel only — the same shape as `graveyard`, deliberately.
          sharing: serialized-append

    # --- locks -------------------------------------------------------------------------
    - id: append_lock
      provenance: design
      facets:
        access:
          constraints_by_via:
            flock-blocking:
              trust: operator
              constraints: [mutual-exclusion, unbounded-wait]
              # persist._flock (:32-43): fcntl.flock(fd, LOCK_EX), blocking, no timeout, no
              # LOCK_NB (G11/C13). Excludes two OS threads of one process too (PJ2a).
            flock-nonblocking:
              trust: operator
              constraints: [mutual-exclusion, bounded-wait]
              # DECIDED at §7 (design hole 1). Was `unknown`: shared.acquire_flock (:64-75)
              # is LOCK_EX|LOCK_NB and returns None -> the envelope skips the tick
              # (:289-292), and nothing bounded D1's NEW drain-side wait on the APPEND lock
              # (F13, P54/C5, P53/C6). Resolved by applying P54's own recommendation — the
              # drain's wait inherits the repo lock's existing LEARNING_REPO_LOCK_WAIT_SECONDS
              # deadline, so the wait is bounded and C6's sibling-starvation window closes.
              # THIS IS THE WEAKEST-SUPPORTED RESOLUTION IN THE SET (70-resolutions.md red
              # flag 4): one premise-level recommendation resting on an analogy, not on a
              # probe, a claim or a design sentence. Flagged for override.
    - id: drain_lock
      provenance: design
      facets:
        domain:
          type: "Path | None"
          refinement:
            nl: >-
              Optional — a channel no drain holds exclusively (pitfalls) carries None. The
              design states no default for the new field, and whether the drain body branches
              on None or aliases append_lock in its place is fork C2/P64.
          default: unknown
          distinguished: ["None"]
          falsy_valid: true
          documented_alternatives: []
        access:
          constraints_by_via:
            flock-nonblocking:
              trust: operator
              constraints: [skip-on-contention]
              # run_batch_envelope:289-292 turns acquire_flock's None into "skipping this tick"
              # rather than a wait — the property that makes the shared <pending>.tmp name safe
              # against a second bare module invocation (P51/C8).
    - id: repo_lock_file
      provenance: code
      facets: {}
      # _author.lock (config.py:75), acquire_repo_lock with a LEARNING_REPO_LOCK_WAIT_SECONDS
      # (1800s) bounded spin, held across every corpus batch (run_batch_envelope:294) — all
      # four corpus drains are already globally serialized (F14).
    - id: author_drain_lock
      provenance: code
      facets: {}
      # .author-drain.lock (config.py:87), taken with flock_or_skip at drains.py:397 — one
      # drainer per role, and the gate the fold must not change (P61).

    # --- knobs -------------------------------------------------------------------------
    - id: author_max_attempts
      provenance: code
      facets:
        domain:
          type: int
          refinement:
            nl: >-
              Attempts before an item retires. env_int applies NO floor and
              author_max_attempts() adds none (unlike verify_batch_workers, which raises for
              < 1), so 0 and negative values are reachable operator inputs; only a
              non-integer is rejected, as FatalConfigError — which is a SYSTEMIC_FAULT, so a
              malformed ceiling kills the drain rather than retiring the item (G25/C33).
          default: 3
          distinguished: [-1, 0, 1, 3]
          falsy_valid: true
          documented_alternatives:
            - value: 1
              crosses_validation: false
              # D9 advertises ceiling=1 as the fail-fast expression of the same mechanism.
              # C33 executed it: 1, 0 and -1 all retire on the first failure, identically, and
              # nothing validates the value — there is no validation layer for it to cross.
    - id: author_timeout_seconds
      provenance: code
      facets:
        domain:
          type: int
          refinement:
            nl: >-
              LEARNING_AUTHOR_TIMEOUT_SECONDS (config.py:362-363), the bound on the O2 stall.
              Enforced SOLELY by asyncio.wait_for around the whole agent.run() in
              _pydantic_stage._drive; it cannot preempt a currently-executing boxed bash call,
              so the deadline is soft and is noticed only once the box call returns (PJ1a).
              env_int applies no floor, so 0 is an accepted operator input (G25).
          default: 1800
          distinguished: [0]
          falsy_valid: true
          documented_alternatives: []
    - id: state_root_env
      provenance: code
      facets:
        domain:
          type: str
          refinement:
            nl: >-
              DEFENDER_LEARNING_STATE_DIR (config.py:138-146). Relocates every queue, lock and
              graveyard; two processes with different values share no lock and coordinate not
              at all (P68). DEFAULT_PATHS is frozen at import (F7), so setting it in-process
              does not reach code that already imported the defaults.
          default: "defender/learning/"
          distinguished: ["<unset>"]
          falsy_valid: true
          documented_alternatives: []

    # --- the drain's own seams ----------------------------------------------------------
    - id: bucket_spec
      provenance: design
      facets:
        domain:
          type: enum
          refinement: {nl: "(name, held|consumed, reason_field, formatter) per bucket"}
          default: committed
          distinguished: [committed, consumed_skip, held_forward_bad]
          falsy_valid: false
          documented_alternatives: []
    - {id: gate,                           provenance: design, facets: {}}
    - {id: rotate_queue_locked,            provenance: code,   facets: {}}
    - {id: validate_agent_result_partition, provenance: code,  facets: {}}
    - {id: run_or_dead_letter,             provenance: code,   facets: {}}
      # On the pitfalls + lead-author marker paths ONLY — 2 production call sites,
      # drains.py:167 and :211 (C32). The observation and findings channels never reach it.
    - id: fault_map
      provenance: code
      facets:
        domain:
          type: enum
          refinement:
            nl: >-
              faults.SYSTEMIC_FAULTS — re-raised rather than dead-lettered — for the two paths
              that reach run_or_dead_letter. Anything else is treated as a per-item failure and
              routed to the on_dead_letter callback (faults.py:15-29).
          default: per-item
          distinguished: [StageAbort, FatalConfigError, GitError, BoxFault]
          falsy_valid: false
          documented_alternatives: []
    - id: author_error_guard
      provenance: code
      # The retirement trigger on the observation + findings channels: the narrow
      # `except AuthorError` around cfg.invoke_agent (curator.py:317, lessons/run.py:346) that
      # calls the retire helper. It exempts systemic faults by NOT CATCHING them, where
      # run_or_dead_letter exempts by RE-RAISING. Two mechanisms, one property (C32).
      facets:
        domain:
          type: enum
          refinement:
            nl: >-
              Which failure shapes reach the retire helper on the author channels, and as what.
              AuthorError is caught and retires; StageAbort / FatalConfigError / GitError /
              BoxFault fall through an except clause that never names them; a whole-batch
              wall-clock TimeoutError arrives here AS an AuthorError via the
              RunUnprocessable chain (PJ1b); and a boxed bash command killed from OUTSIDE the
              process is absorbed by runtime/tools.py::_tool_bash into pydantic_ai ModelRetry
              and reaches NEITHER path — the batch completes with no error and no attempts
              bump (PJ1c). The AuthorError-vs-SYSTEMIC_FAULT dichotomy is incomplete.
          default: AuthorError
          distinguished: [AuthorError, TimeoutError, StageAbort, FatalConfigError, GitError,
                          BoxFault, ModelRetry]
          falsy_valid: false
          documented_alternatives: []

    # --- grounded neighborhood the change attaches to ------------------------------------
    - {id: held_report,                    provenance: code, facets: {}}
      # _pending/held_report.log, written lessons/run.py:207-221. A third write-only graveyard
      # with no production reader (G16 extension, F15). D7 keeps it lessons-local.
    - {id: quarantine_dir,                 provenance: code, facets: {}}
      # <queue_dir>/failed/, written markers.py:38 (quarantine_marker). No reader at all (C20).
      # A5's explicit non-obligation; recorded because D9's seam must stay additive over it.
    - {id: lint_duplicate_helpers_baseline, provenance: code, facets: {}}
      # 18 findings, 18 baselined, 0 new at 1cecad37; name-based (G1/G2/G14/C30).
    - {id: corpus_clean_gate,              provenance: code, facets: {}}
      # assert_clean_corpus_dir (:146-154) + verify_agent_state (:246-273) over
      # shared.changes_outside(repo_root, corpus_dir_rel) (:134-139): any untracked path that
      # is not <corpus>/*.md aborts the batch. A new lock or graveyard file outside an ignored
      # prefix aborts EVERY batch (F5, P03).
    - {id: curator_modules,                provenance: code, facets: {}}
      # _CURATOR_MODULES (drains.py:68-75) -> importlib.import_module -> mod.run_batch. String-
      # keyed dynamic dispatch; no static walk resolves it (G22b). Prior graph's id.
    - {id: envelope,                       provenance: code, facets: {}}
      # shared.run_batch_envelope:275-305 — the non-blocking drain-lock acquisition, the repo
      # lock hold across the whole batch, and today's 0/2 rc alphabet. Prior graph's id.

  interacts:
    # --- the folded drain writes the four drained channels ------------------------------
    - {from: drain, to: findings,                       mode: write, via: fs, provenance: design, interpolates: [queue_row_id]}
    - {from: drain, to: actor_observations,             mode: write, via: fs, provenance: design, interpolates: [queue_row_id]}
    - {from: drain, to: environment_observations,       mode: write, via: fs, provenance: design, interpolates: [queue_row_id]}
    - {from: drain, to: actor_environment_observations, mode: write, via: fs, provenance: design, interpolates: [queue_row_id]}
    # --- the retire seam removes from all five and appends the one graveyard -------------
    - {from: retire, to: findings,                       mode: remove, via: fs, provenance: design}
    - {from: retire, to: actor_observations,             mode: remove, via: fs, provenance: design}
    - {from: retire, to: environment_observations,       mode: remove, via: fs, provenance: design}
    - {from: retire, to: actor_environment_observations, mode: remove, via: fs, provenance: design}
    - {from: retire, to: pitfalls,                       mode: remove, via: fs, provenance: design}
    - {from: retire, to: graveyard,                      mode: write,  via: fs, provenance: design, interpolates: [channel]}
    # --- the live run appends, per direction, concurrently -------------------------------
    - {from: run_direction, to: findings,                       mode: write, via: fs, provenance: code, interpolates: [queue_row_id]}
    - {from: run_direction, to: actor_observations,             mode: write, via: fs, provenance: code, interpolates: [queue_row_id]}
    - {from: run_direction, to: environment_observations,       mode: write, via: fs, provenance: code, interpolates: [queue_row_id]}
    - {from: run_direction, to: actor_environment_observations, mode: write, via: fs, provenance: code, interpolates: [queue_row_id]}
    - {from: run_direction, to: consumed_ledger,                mode: read,  via: fs, provenance: code}
    - {from: run_direction, to: append_lock,                    mode: invoke, via: fs, provenance: code}
    - {from: run_direction, to: state_root_env,                 mode: read,  via: env, provenance: code}
    # --- the pitfalls channel: one appender, one rotator, same tick, same process (F12) ---
    - {from: lead_author_drain, to: pitfalls,          mode: write,  via: fs,  provenance: code, interpolates: [queue_row_id]}
    - {from: lead_author_drain, to: append_lock,       mode: invoke, via: fs,  provenance: code}
    - {from: lead_author_drain, to: run_or_dead_letter, mode: invoke, via: api, provenance: code}
    - {from: lead_author_drain, to: fault_map,         mode: read,   via: api, provenance: code}
    - {from: lead_author_drain, to: quarantine_dir,    mode: write,  via: fs,  provenance: code}
    - {from: lead_author_drain, to: repo_lock_file,    mode: invoke, via: fs,  provenance: code}
    - {from: run_pitfalls, to: pitfalls,               mode: write,  via: fs,  provenance: code, interpolates: [queue_row_id]}
    - {from: run_pitfalls, to: append_lock,            mode: invoke, via: fs,  provenance: code}
    - {from: run_pitfalls, to: run_or_dead_letter,     mode: invoke, via: api, provenance: code}
    # --- the out-of-tree fixture writers no call graph sees (F11/G22d) --------------------
    - {from: eval_harness, to: findings,           mode: write, via: fs, provenance: code}
    - {from: eval_harness, to: actor_observations, mode: write, via: fs, provenance: code}
    # --- the unlocked reader inside the authoring call (F2) ------------------------------
    - {from: load_observation, to: actor_observations, mode: read, via: fs, provenance: code}
    - {from: load_observation, to: findings,           mode: read, via: fs, provenance: code}
    # --- the drain's own seams -----------------------------------------------------------
    - {from: drain, to: consumed_ledger,      mode: write,  via: fs,  provenance: design, interpolates: [channel, queue_row_id]}
    - {from: drain, to: queue_row,            mode: read,   via: fs,  provenance: design}
    - {from: drain, to: id_key,               mode: read,   via: api, provenance: design}
    - {from: drain, to: append_lock,          mode: invoke, via: fs,  provenance: design}
    - {from: drain, to: drain_lock,           mode: invoke, via: fs,  provenance: design}
    - {from: drain, to: gate,                 mode: invoke, via: api, provenance: design}
    - {from: drain, to: bucket_spec,          mode: read,   via: api, provenance: design}
    - {from: drain, to: rotate_queue_locked,  mode: invoke, via: api, provenance: design}
    - {from: drain, to: validate_agent_result_partition, mode: invoke, via: api, provenance: design}
    - {from: drain, to: author_error_guard,   mode: invoke, via: api, provenance: design}
    - {from: drain, to: author_timeout_seconds, mode: read, via: env, provenance: design}
    - {from: drain, to: state_root_env,       mode: read,   via: env, provenance: design}
