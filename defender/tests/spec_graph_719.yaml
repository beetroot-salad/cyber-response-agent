schema_version: 1
design: >-
  issue 719 — one shared drain body, the append/drain lock split, and one retire seam
  (body + comments A1-A5 + D9); extracted in .spec-flow/frontiers/20-demands.md
base: 1cecad37

# ---------------------------------------------------------------------------------------
# Name reconciliation (phase D, before the join). Three passes coined ids independently:
# the grounding brief (code), demand extraction (design), and the dispositions' address
# derivations. Unified here by role+origin:
#   appender            -> SPLIT into `run_direction` (run_cycle.py:129, the concurrent
#                          findings/observation appender) and `lead_author_drain`
#                          (lead_author.py:404, the pitfalls channel's ONLY appender, F12).
#                          One id hid two actors with opposite concurrency stories.
#   author_drain -> run_or_dead_letter  ->  lead_author_drain -> run_or_dead_letter.
#                          C32: the two production call sites are drains.py:167 and :211,
#                          both inside the lead-author tick, not the corpus author drain.
#   graveyard           == the prior graph's `dlq` == the code's `<queue>.deadletter.jsonl`.
#                          D9 creates the unified sink, so the design's name wins; the file
#                          spelling is carried in the identity evidence.
#   queue_row           == prior graph's `queue_row`, RE-KEYED. The prior pass keyed it on
#                          [batch_id]; batch_id is not a field on a queue row. Rows key on
#                          the channel's id_key (persist.py:66-68 merge filter, :314-316
#                          dedup) — the axis is `queue_row_id` (G26).
#   channel             == the prior graph's 4-member `curator` axis, widened to 5 members.
#   state_root_env, envelope, curator_modules, forward_check -> the last is the ACTOR
#                          `load_observation` (verify_forward/shared.py::load_observation),
#                          named for the code symbol rather than reused as a boundary id.
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# THE SUITE (phase E). Every `discharged_by` below resolves to one of five modules beside
# this file, plus one uncollected helper:
#   defender/tests/_drain719.py             the substrate: repo/paths/config builders, the
#                                           declarative fault fakes, the lock/thread helpers,
#                                           and the seam contract this spec pins, written out
#                                           in its module docstring for the implementer.
#   defender/tests/test_drain719_retire.py  D9's retire seam + decisions 2 and 3 (20 tests)
#   defender/tests/test_drain719_guard.py   decision 8's ENUMERATED retire set: membership,
#                                           parity, extent, decision 1's four paths, decision
#                                           9's reconciling tick and decision 10's signal (14)
#   defender/tests/test_drain719_locks.py   D1/D2 and O1/O2/O7 (18)
#   defender/tests/test_drain719_fold.py    O3/O4/O5, D4/D6/D7, F1/F2 (15)
#   defender/tests/test_drain719_config.py  new-path placement, the ceiling's binding time,
#                                           and the pitfalls channel (9)
# 76 tests, 76 `form: test` demands, no test without a demand and no demand without a test.
# REWRITTEN AT §7 ROUND 2 — 16 of them. Decision 8 reversed A12, so the twelve tests named in
# 70-resolutions.md red flag 10 were re-authored against an enumerated retire set rather than
# edited (two are outright reversals: a green run on their previous bodies would be evidence
# AGAINST the resolved design). Four more were re-authored for fix shapes F1, F2, F3 and F7.
# `retire_write_failure_is_systemic` was on that list and was deliberately NOT rewritten — A11
# is carried by non-membership and its body already induces the real OSError; §7 round 3
# ratified the divergence, so 11 of 12 bodies changed, not 12.
# ADDED AT §7 ROUND 3 — decision 10's test, the only demand whose pointer did not resolve.
# Decision 9 re-minted the previously-undemanded post-commit test for the reconciling-tick
# coverage it actually provides, closing B77.
# REPAIRED AT PHASE F ROUND 2 — two defects, both in the decision-8 module.
#   F1: `test_only_a_named_fault_class_reaches_the_retire_seam` built its fault instances
#   lazily as `cls(message)`. GitError's constructor is (args, returncode, stderr), so it
#   raised TypeError in the test's own setup and the "and from NOTHING ELSE" half — the single
#   assertion decision 8 exists to enforce — never executed against any implementation. Both
#   lists are now built up front through a factory that constructs each class the way
#   production raises it, and the fix was verified BY EXECUTION, not by reading: a null-stub
#   pass cannot see this, because the test still collects and still fails like every other red.
#   F3: `retirement_guard_extent_is_pinned`'s four probes were two members and two OSErrors,
#   and the OSError outcomes follow from non-membership alone — so an implementation with the
#   clauses at any other extent passed. All four probes now raise MEMBERS at the four edges
#   (gate / agent / commit / post-rotate), holding membership constant so placement is the only
#   variable. The post-rotate edge is the one decision 9 leans on and is observable only
#   through D7's `post_rotate` hook, which is why that seam is load-bearing for this demand.
# State: 74 red / 2 green over 76. The two green are labelled PARITY-WITH-TODAY in their own
# docstrings and are meant to pass at this base —
# test_two_concurrent_directions_both_land_every_finding (PJ2b, a conservation guard) and
# test_second_author_drain_invocation_returns_without_blocking (P61, an unchanged outer gate).
# `_drain719.py` guards the `from defender.learning.author import drain` import with a shim
# that raises on every attribute access: NOT a skip and NOT a soften — each test still fails
# on its own — but a missing target then does not abort pytest's whole collection and take
# the rest of the tree's suite down with it.
# ---------------------------------------------------------------------------------------

demands:
  # ---- Demand #0: the return-value contract — RESOLVED AT §7, AND THE READING FLIPPED ----
  # 70-resolutions.md, red flag 1. The provisional reading pinned "today's int rc alphabet,
  # unchanged". Decision 1 converts the pitfalls leg's rc=2 into a retire-triggering,
  # NON-systemic fault, so the `2` branch of that alphabet is REJECTED: run_pitfalls signals
  # an authoring failure by raising, not by returning 2, and _drain_pitfalls observes a fault
  # where it observed a return value. The `0` branch (queue-empty / drain-lock held by another
  # process / repo-lock unavailable) is unchanged on every leg. Phase C's classification must
  # re-run against this shape before phase E is dispatched.
  - id: return_contract_run_batch_rc
    kind: behavior
    form: test
    binds: ["drain", "interacts(drain->findings)", "interacts(drain->actor_observations)",
            "run_pitfalls"]
    discharged_by: test_folded_drain_rc_alphabet_after_the_pitfalls_fault_conversion

  # ---- O1: no row with an unprocessed id is lost ----
  - {id: no_unprocessed_row_lost_rotate, kind: behavior, form: test,
     binds: ["interacts(drain->findings)", "interacts(drain->actor_observations)", "append_lock"],
     discharged_by: test_rotation_retains_row_appended_mid_batch}
  - {id: no_unprocessed_row_lost_retire, kind: behavior, form: test,
     binds: ["retire", "interacts(retire->actor_observations)", "interacts(retire->findings)",
             "append_lock"],
     discharged_by: test_retirement_retains_row_appended_mid_window}
  - {id: finding_id_collision_dropped, kind: domain-outcome, form: test,
     binds: ["findings.identity", "interacts(run_direction->findings)"],
     discharged_by: test_relearn_colliding_finding_id_is_dropped_by_merge_filter}

  # ---- O2: appending does not block on an author batch ----
  # §7 / C7 (P60), re-scoped: O2 is "an append never waits on the AGENT CALL". The oracle is
  # pinned to the LLM phase specifically; the rotate/retire window is an explicit exception
  # (O7 holds append_lock there). Copy 3's "small bound in all three phases" reading is
  # rejected — as written the demand could be failed by a correct implementation.
  - {id: append_does_not_block_on_batch, kind: behavior, form: test,
     binds: ["append_lock", "drain_lock", "interacts(run_direction->actor_observations)",
             "interacts(run_direction->environment_observations)",
             "interacts(run_direction->actor_environment_observations)"],
     discharged_by: test_append_completes_while_drain_batch_in_flight}

  # ---- O7: rotation and retirement are mutually exclusive with appends ----
  - {id: rotate_excluded_by_append_lock, kind: behavior, form: test,
     binds: ["append_lock.access[flock-blocking]", "interacts(drain->actor_observations)"],
     discharged_by: test_rotate_blocks_while_append_lock_held}
  - {id: retire_excluded_by_append_lock, kind: behavior, form: test,
     binds: ["append_lock.access[flock-blocking]", "interacts(retire->actor_observations)"],
     discharged_by: test_retire_blocks_while_append_lock_held}

  # ---- D1: QueueChannel carries its own lock topology ----
  - {id: queue_channel_lock_topology, kind: seam, form: test,
     binds: ["actor_observations", "environment_observations", "actor_environment_observations",
             "findings", "pitfalls", "append_lock", "drain_lock",
             "drain_lock.domain.distinguished[None]"],
     discharged_by: test_every_channel_declares_its_lock_topology}
  - {id: append_lock_identity_unchanged, kind: uniqueness, form: test,
     binds: ["append_lock", "actor_observations.identity"],
     discharged_by: test_append_lock_paths_are_byte_identical_to_today}

  # ---- D2: merge_concurrent deleted, rotation always merges ----
  - {id: rotate_always_merges, kind: behavior, form: test,
     binds: ["rotate_queue_locked", "interacts(drain->actor_observations)"],
     discharged_by: test_rotation_has_no_merge_knob_and_always_merges}

  # ---- D3: the channel's id_key becomes a config field (minted at phase D — see gate note) ----
  - {id: id_key_is_a_channel_config_field, kind: seam, form: test,
     binds: ["id_key", "id_key.domain.distinguished[observation_id]",
             "id_key.domain.distinguished[finding_id]", "id_key.domain.distinguished[pitfall_id]",
             "queue_row.identity"],
     discharged_by: test_every_channel_declares_its_id_key}

  # ---- O3: one drain body (strengthened oracle: lint is necessary, not sufficient) ----
  - {id: baseline_shrinks_to_13, kind: shape, form: test,
     binds: ["lint_duplicate_helpers_baseline"],
     discharged_by: test_duplicate_helper_baseline_drops_the_five_pair_exclusive_names}
  - {id: no_batch_driver_body_in_direction_modules, kind: shape, form: test,
     binds: ["drain", "curator", "lessons_run", "drives(curator->drain)",
             "drives(lessons_run->drain)"],
     discharged_by: test_direction_modules_carry_no_batch_driver_body}
  - {id: gates_renamed_per_direction, kind: shape, form: test,
     binds: ["gate", "curator", "lessons_run"],
     discharged_by: test_gates_carry_direction_specific_names}

  # ---- O4: no private cross-module reach ----
  # §7 / Fork 4 (C26), re-scoped: the oracle is restricted to `<mod>._name` ATTRIBUTE access.
  # The nine `from defender._io / defender._yaml / … import` lines are a repo-wide convention,
  # not the defect; an unscoped oracle fails on convention instead of on the reach.
  - {id: no_private_cross_module_reference, kind: shape, form: test,
     binds: ["curator", "lessons_run", "retire"],
     discharged_by: test_no_underscore_attribute_reference_across_drain_modules}

  # ---- O5: per-direction gating semantics unchanged ----
  - {id: gating_semantics_preserved, kind: parity, form: test,
     binds: ["gate", "interacts(drain->actor_observations)", "interacts(drain->findings)"],
     discharged_by: test_each_direction_gate_keeps_its_policy_through_the_shared_drain}
  - {id: held_forward_bad_bucket_and_report, kind: domain-outcome, form: test,
     binds: ["bucket_spec.domain.distinguished[held_forward_bad]", "held_report"],
     discharged_by: test_forward_bad_bucket_and_held_report_stay_lessons_only}
  - {id: gate_returns_three_tuple, kind: seam, form: test,
     binds: ["gate"],
     discharged_by: test_gate_seam_returns_held_consumed_pre_to_author}
  - {id: bucket_spec_carries_formatter, kind: shape, form: test,
     binds: ["bucket_spec", "validate_agent_result_partition"],
     discharged_by: test_one_bucket_list_drives_validation_and_projection}

  # ---- O6 + O8: uniform, bounded retirement into one graveyard ----
  - {id: retire_uniform_across_drains, kind: parity, form: test,
     binds: ["retire", "graveyard", "author_max_attempts"],
     discharged_by: test_retirement_is_identical_for_observations_and_findings}
  - {id: pitfalls_retires_at_ceiling, kind: behavior, form: test,
     binds: ["retire", "pitfalls", "graveyard", "author_max_attempts.domain.distinguished[3]"],
     discharged_by: test_pitfalls_batch_retires_at_the_ceiling}
  # §7 / decision 2, re-scoped: "batch-granular" now describes THE BUMP, which is uniform —
  # every row in a faulted batch bumps by one, and only rows now at or over the ceiling
  # retire. The uniform-entry case (all rows entering together, retiring together) is what
  # keeps test_dlq_quarantine_is_batch_granular's meaning intact.
  - {id: retire_is_batch_granular, kind: behavior, form: test,
     binds: ["retire", "graveyard"],
     discharged_by: test_retirement_is_batch_granular}
  # NO SINGLE SYMBOL governs the systemic-fault exemption across the five channels (C32),
  # so it is two demands, each bound to the guard that actually sits on its path.
  #
  # RE-DERIVED AT §7 ROUND 2 FROM THE RESOLVED SHAPE — not patched onto the previous version.
  # This demand has now been written three times under opposite pressures, so its content is
  # stated from scratch: on the author channels, StageAbort / FatalConfigError / BoxFault are
  # exempt from retirement because they are NOT MEMBERS OF THE RETIRE SET. That observable
  # coincides with the pre-fold "the except clause never named them", but the reason is now
  # stated rather than accidental, and it survives a refactor that moves a line.
  # ONE MEMBER DID NOT COME BACK: GitError is permanently OUT of the exempt set (decision 1
  # path 3). The original demand asserted all four were exempt; decision 1 refuted that;
  # decision 6 held it up by placement; decision 8 holds it up by non-membership for three of
  # the four and leaves GitError retiring. Placement is no longer what carries this.
  - {id: systemic_faults_exempt_on_author_channels, kind: domain-outcome, form: test,
     binds: ["author_error_guard.domain.distinguished[AuthorError]",
             "author_error_guard.domain.distinguished[StageAbort]",
             "author_error_guard.domain.distinguished[FatalConfigError]",
             "author_error_guard.domain.distinguished[GitError]",
             "author_error_guard.domain.distinguished[BoxFault]",
             "interacts(drain->author_error_guard)", "retire"],
     discharged_by: test_non_member_systemic_faults_skip_retirement_and_git_error_does_not}
  # §7 note: decision 1 path 1 converts run_pitfalls' rc=2 into a raised fault. That fault
  # must be NON-systemic (it retires), so it must not be enrolled in fault_map's four — this
  # demand's positive control is that the four named types still propagate without a bump.
  - {id: systemic_faults_exempt_on_marker_channels, kind: domain-outcome, form: test,
     binds: ["run_or_dead_letter", "fault_map.domain.distinguished[StageAbort]",
             "fault_map.domain.distinguished[FatalConfigError]",
             "fault_map.domain.distinguished[GitError]",
             "fault_map.domain.distinguished[BoxFault]",
             "interacts(run_pitfalls->run_or_dead_letter)"],
     discharged_by: test_systemic_faults_propagate_without_bumping_attempts}
  # §7 / decision 4: the `rejected:` note that argued against testing ceiling=1 is STRUCK —
  # the human rejected its reasoning (C33 drove ceiling=1 through the real retirement code
  # with no caller at all), and the test is written as
  # `fail_fast_ceiling_of_one_retires_on_first_failure` below. No waiver is recorded.
  - id: retire_ceiling_is_a_parameter
    kind: domain-outcome
    form: clause
    binds: ["author_max_attempts.domain.distinguished[1]"]
    outcome:
      nl: >-
        The retire seam takes the attempt ceiling as a parameter rather than baking one in,
        so fail-fast is expressible as that ceiling at 1 and the marker-queue absorption
        stays additive.
  - {id: one_queue_rewrite_function, kind: uniqueness, form: test,
     binds: ["rotate_queue_locked", "retire", "append_lock"],
     discharged_by: test_exactly_one_function_rewrites_a_pending_file}

  # ---- D6 + A4: the cleanups the fold makes normative ----
  - {id: curator_delegators_deleted, kind: shape, form: test,
     binds: ["curator"],
     discharged_by: test_curator_no_longer_re_exports_the_shared_git_helpers}
  # F7: the config.py:102 site carries BOTH halves of the overturned sentence and only the
  # tail was banned, so deleting the tail and leaving "Two locks, two jobs" standing passed.
  # One extra banned substring per site, not a redesign.
  - {id: overturned_comments_rewritten, kind: shape, form: test,
     binds: ["append_lock", "drain_lock"],
     discharged_by: test_the_three_do_not_fold_comments_record_their_reversal}
  - {id: baseline_rationales_rewritten, kind: shape, form: test,
     binds: ["lint_duplicate_helpers_baseline"],
     discharged_by: test_surviving_baseline_reasons_no_longer_cite_the_curator_lessons_split}

  # ---- non-obligation minted as its own demand (independently observable) ----
  - {id: repo_lock_still_serializes, kind: behavior, form: test,
     binds: ["repo_lock_file"],
     discharged_by: test_author_lock_still_serializes_committers_across_drains}

  # ---------------------------------------------------------------------------------------
  # Minted at phase D from the settled dispositions (45-dispositions.md, "Consensus entries
  # that bind an expected value") and from the two re-ground probes. These are the only
  # consensus rows the judge cleared to carry into the suite as a stated outcome.
  # ---------------------------------------------------------------------------------------
  - {id: new_state_paths_inside_the_ignored_prefix, kind: behavior, form: test,   # P03 (3/3)
     binds: ["drain_lock", "graveyard", "stuck_row_record", "corpus_clean_gate",
             "state_root_env.domain.distinguished[<unset>]"],
     discharged_by: test_new_lock_and_graveyard_paths_do_not_abort_the_next_batch}
  - {id: new_paths_root_at_state_root, kind: behavior, form: test,                # P16 (3/3)
     binds: ["append_lock", "drain_lock", "graveyard", "state_root_env"],
     discharged_by: test_new_queue_paths_resolve_under_state_root_not_the_worktree}
  - {id: attempts_persist_on_the_row, kind: behavior, form: test,                 # P38 (3/3)
     binds: ["queue_row", "queue_row.identity", "author_max_attempts"],
     discharged_by: test_attempt_count_survives_a_fresh_process}
  - {id: retire_takes_append_lock_on_pitfalls, kind: parity, form: test,          # P56 (3/3)
     binds: ["interacts(retire->pitfalls)", "append_lock.access[flock-blocking]", "pitfalls"],
     discharged_by: test_pitfalls_retire_goes_through_the_locked_rotation}
  - {id: outer_author_drain_gate_still_skips, kind: behavior, form: test,         # P61 (3/3)
     binds: ["author_drain_lock", "drives(author_drain->drain)"],
     discharged_by: test_second_author_drain_invocation_returns_without_blocking}
  - {id: mid_batch_timeout_is_per_item, kind: domain-outcome, form: test,         # P43 / PJ1b
     binds: ["author_error_guard.domain.distinguished[TimeoutError]", "author_timeout_seconds",
             "retire"],
     discharged_by: test_mid_batch_author_timeout_bumps_the_row_and_is_ceiling_eligible}
  - {id: concurrent_directions_lose_no_finding, kind: behavior, form: test,       # P47 / PJ2b
     binds: ["interacts(run_direction->findings)", "append_lock",
             "drives(learn_drain->run_direction)"],
     discharged_by: test_two_concurrent_directions_both_land_every_finding}

  # ---------------------------------------------------------------------------------------
  # Minted at the gate (phase D residue, gate.obligations) — R2/R4 fired with no discharging
  # demand. §7 / decision 4 ACCEPTED all four option groups, so all six lose `provisional`.
  # ---------------------------------------------------------------------------------------
  - {id: consumed_ledger_append_is_atomic, kind: uniqueness, form: test,
     binds: ["consumed_ledger.identity", "interacts(drain->consumed_ledger)"],
     discharged_by: test_consumed_ledger_append_survives_a_concurrent_interleaving}
  - {id: author_max_attempts_negative_retires_like_zero, kind: domain-outcome, form: test,
     binds: ["author_max_attempts.domain.distinguished[-1]"],
     discharged_by: test_negative_ceiling_retires_like_zero}
  - {id: author_max_attempts_zero_retires_on_arrival, kind: domain-outcome, form: test,
     binds: ["author_max_attempts.domain.distinguished[0]"],
     discharged_by: test_zero_ceiling_retires_on_first_failure}
  - {id: author_timeout_seconds_zero_is_pinned, kind: domain-outcome, form: test,
     binds: ["author_timeout_seconds.domain.distinguished[0]"],
     discharged_by: test_author_timeout_seconds_zero_behavior_is_pinned}
  - {id: committed_bucket_is_exercised, kind: domain-outcome, form: test,
     binds: ["bucket_spec.domain.distinguished[committed]"],
     discharged_by: test_committed_bucket_routes_to_author_and_projects}
  - {id: consumed_skip_bucket_is_exercised, kind: domain-outcome, form: test,
     binds: ["bucket_spec.domain.distinguished[consumed_skip]"],
     discharged_by: test_consumed_skip_bucket_is_idempotent_and_projects}

  # =======================================================================================
  # Minted at §7 (.spec-flow/frontiers/70-resolutions.md). Every entry names the routed item
  # it resolves and whether the human decided it (decision 1-4) or the judge's own recorded
  # recommendation was applied (`resolved_by: judge-recommendation`).
  # =======================================================================================

  # ---- Decision 1: O8 scope — all four unbounded-retry paths, each with a DISCRIMINATING
  # oracle. NOT the recommended option (the recommendation was to cover the first two and
  # file the rest). Path 2's oracle must fault the POST-agent step: O8's existing oracle
  # faults the agent and therefore passes over that hole.
  - {id: pitfalls_rc_fault_reaches_the_retire_seam, kind: behavior, form: test,   # C9/P58, Fork 2
     resolved_by: human-decision-1,
     binds: ["run_pitfalls", "pitfalls", "retire", "drives(run_pitfalls->retire)",
             "author_max_attempts", "interacts(retire->pitfalls)"],
     discharged_by: test_pitfalls_agent_failure_bumps_attempts_and_retires_at_the_ceiling}
  # Decision 7 narrows the boundary: this covers post-agent faults BEFORE the commit lands
  # (verify_agent_state, validate_agent_result_partition). A fault after a SUCCESSFUL commit is
  # `post_commit_failure_does_not_bump`, not this. The discrimination note still governs — an
  # oracle that faults the AGENT passes vacuously and does not discharge this demand.
  - {id: post_agent_failure_bumps_and_retires, kind: behavior, form: test,        # A16/P62
     resolved_by: human-decision-1,
     binds: ["retire", "validate_agent_result_partition", "corpus_clean_gate",
             "interacts(drain->validate_agent_result_partition)", "author_max_attempts"],
     discharged_by: test_post_agent_failure_with_a_succeeding_agent_bumps_and_retires}
  - {id: corpus_commit_git_error_retires_and_unwedges_the_corpus, kind: behavior, form: test,
     resolved_by: human-decision-1,                                               # D1/P01
     binds: ["author_error_guard.domain.distinguished[GitError]", "retire",
             "corpus_clean_gate", "graveyard"],
     discharged_by: test_corpus_commit_git_error_bumps_the_row_and_leaves_the_corpus_dir_usable}
  - {id: externally_killed_box_command_bumps_and_retires, kind: behavior, form: test,
     resolved_by: human-decision-1,                                               # PJ1c, hole 3
     binds: ["author_error_guard.domain.distinguished[ModelRetry]", "retire",
             "author_max_attempts", "interacts(drain->author_error_guard)"],
     discharged_by: test_externally_killed_box_command_is_not_reported_as_a_successful_batch}
  # ===== DECISION 8 (§7 round 2, from 92-reconciliation.md F4) — THE CEILING IS NARROWED TO
  # AN ENUMERATED FAULT SET. This REVERSES judge recommendation A12/P76 ("the ceiling is
  # total: anything not explicitly systemic retires"), which was applied `resolved_by:
  # judge-recommendation` and never human-reviewed until F4 surfaced what it composed into.
  #
  # THE MECHANISM CHANGED, NOT ONLY THE SCOPE. There is no bare `except Exception` with a
  # re-raise carve-out any more. Retirement is reachable only from an explicitly enumerated
  # RETIRE SET; a fault class outside it is not caught, escapes, and leaves the row queued —
  # stuck but recoverable and loud, which is today's behaviour. The four paths decisions 1
  # and 5 cover are preserved ONLY because each is named in that set:
  #   AuthorError  — the agent call; the mid-batch wall-clock timeout (arrives AS AuthorError
  #                  via the RunUnprocessable chain, PJ1b); the post-agent steps, since
  #                  verify_agent_state and validate_agent_result_partition both raise
  #                  AuthorError (shared.py:246-270, :195-238); and the pitfalls converted
  #                  fault, which decision 1 path 1 raises as a non-systemic AuthorError.
  #   GitError     — decision 1 path 3, the commit-time failure.
  #   ModelRetry   — decision 1 path 4, the externally killed boxed command (PJ1c).
  # StageAbort, FatalConfigError, BoxFault, OSError and every novel class are ABSENT and
  # therefore exempt by non-membership.
  #
  # ACCEPTED TRADE, recorded as the reasoning: a novel exception class goes back to unbounded
  # retry rather than to silent permanent loss. O8's own sentence narrows with it — "every
  # QueueChannel drain retires a persistently failing item" becomes "...whose failure is in
  # the retire set". Nothing decision 1 named is re-opened; what is re-opened is O8's general
  # claim, and it is now readable off one tuple instead of by exception archaeology.
  - {id: retirement_trigger_is_an_enumerated_fault_set, kind: domain-outcome, form: test,
     resolved_by: human-decision-8,                   # supersedes retirement_trigger_widens_to_bare_exception
     binds: ["author_error_guard", "interacts(drain->author_error_guard)", "retire"],
     discharged_by: test_only_a_named_fault_class_reaches_the_retire_seam}
  # A12/P76 REVERSED. The judge's recommendation was that an unclassified failure retires;
  # decision 8 says it does not. The demand is renamed rather than inverted in place, because
  # a demand id whose content is the opposite of what it says is a trap for a later reader.
  - {id: unnamed_fault_classes_do_not_retire, kind: domain-outcome, form: test,
     resolved_by: human-decision-8,                   # supersedes unclassified_failures_count_against_the_ceiling
     binds: ["author_error_guard", "retire", "author_max_attempts", "queue_row"],
     discharged_by: test_a_failure_in_no_named_class_leaves_the_row_queued_with_its_count_untouched}
  # Decision 5 SURVIVES as stated — the scope is all four channels — but it is now a property
  # of the retire SET, not of a widened guard. Restated, not patched.
  - {id: retire_set_is_identical_on_all_four_channels, kind: parity, form: test,
     resolved_by: human-decision-5,                   # supersedes widened_guard_covers_all_four_channels
     binds: ["author_error_guard", "interacts(drain->author_error_guard)", "findings",
             "actor_observations", "environment_observations",
             "actor_environment_observations"],
     discharged_by: test_the_retire_set_is_the_same_on_findings_as_on_the_observation_channels}
  # Decision 6's EXTENT half survives and is restated: which calls sit inside the try whose
  # except clauses name the retire set. Its RE-RAISE half is gone — an allow-list has no
  # re-raise. Consequence recorded rather than buried: the extent demand was load-bearing for
  # R2's three dependents (A11, B5, D4) under decision 6 and is now only CONFIRMATORY, because
  # those three are carried by non-membership instead (a lock OSError, a retire-write OSError
  # and a config-build FatalConfigError are none of them in the set). Kept anyway: a call that
  # raises AuthorError moved inside the try would still retire, so the extent is still a real
  # property, just no longer the only thing holding those three up.
  # ROUND 6: the four extent probes now raise RETIRE-SET MEMBERS at all four edges. Two of them
  # previously raised OSError, whose outcome non-membership already explains — so extent was
  # never actually observed and this demand was passing for the wrong reason. The CLOSING edge
  # is observable only through D7's `post_rotate` hook on the SHARED config; see the deviations
  # block, which records that as a constraint on the implementer.
  - {id: retirement_guard_extent_is_pinned, kind: seam, form: test,
     resolved_by: human-decision-6,
     binds: ["author_error_guard", "interacts(drain->author_error_guard)",
             "validate_agent_result_partition", "corpus_clean_gate", "retire"],
     discharged_by: test_the_retire_set_clauses_span_the_agent_call_through_the_corpus_commit_and_no_further}
  # THE CARVE-OUT INVERTS. Under decision 6 the hazard was re-raising GitError (spelling the
  # set `faults.SYSTEMIC_FAULTS` would have reverted decision 1 path 3). Under an allow-list
  # the hazard is the mirror image: an implementer who writes the obvious `except AuthorError`
  # silently drops GitError and ModelRetry and reverts decision 1 paths 3 AND 4. The oracle
  # must therefore fault commit_corpus with a GitError and kill a box command from outside,
  # and assert BOTH retire — membership is not observable from the AuthorError case alone.
  - {id: retire_set_membership_is_explicit, kind: domain-outcome, form: test,
     resolved_by: human-decision-8,                   # supersedes retirement_guard_re_raises_the_named_systemic_set
     binds: ["author_error_guard.domain.distinguished[AuthorError]",
             "author_error_guard.domain.distinguished[GitError]",
             "author_error_guard.domain.distinguished[ModelRetry]",
             "author_error_guard.domain.distinguished[StageAbort]",
             "author_error_guard.domain.distinguished[FatalConfigError]",
             "author_error_guard.domain.distinguished[BoxFault]",
             "interacts(drain->author_error_guard)", "retire"],
     discharged_by: test_the_retire_set_names_author_error_git_error_and_model_retry_and_nothing_else}

  # ===== DECISION 9 (§7 round 3) — DECISION 7 IS SUBSUMED, AND THE DROP IS RATIFIED. =====
  # Decision 8 already delivers the post-commit no-bump behaviour: the queue rewrite that fails
  # after a landed commit raises OSError, which is not a member of the retire set, so it escapes
  # with no bump. There is no separate suppression step to pin, and the claim that there was one
  # is dropped.
  # HONEST PROVENANCE: `post_commit_failure_does_not_bump` did not survive §7 round 2 by
  # judgement — my decision-8 edit replaced a contiguous block and removed it as a side effect,
  # which phase E then caught as a collected test carrying no demand. Decision 9 ratifies the
  # removal on its merits; it was not a deliberate subsumption at the time. Recorded because a
  # cold reader would otherwise read a clean design decision where there was an accident that
  # happened to be right.
  # WHAT THE TEST STILL EARNS: it drives the tick AFTER a landed commit whose rotation never
  # followed, and shows the idempotency gate reconciles the split state without re-authoring.
  # That is the half B77 (91-blind.md) recorded as uncovered, so the demand is re-minted around
  # the coverage that is real rather than around the claim that is now redundant.
  # RESIDUAL RISK, ACCEPTED NOT OVERLOOKED: nothing now pins the post-commit path free of
  # retire-set members. If a future change raises AuthorError, GitError or ModelRetry from a
  # post-commit step, the bump returns and no test in this suite fails. That is the price of
  # subsumption — a property carried by non-membership is only as stable as the set.
  - {id: post_commit_tick_reconciles_without_re_authoring, kind: behavior, form: test,
     resolved_by: human-decision-9,                    # supersedes post_commit_failure_does_not_bump
     binds: ["retire", "corpus_clean_gate", "consumed_ledger", "queue_row",
             "interacts(drain->consumed_ledger)"],
     discharged_by: test_a_fault_after_a_successful_corpus_commit_leaves_the_attempt_count_alone}

  # ===== DECISION 10 (§7 round 3) — PIN THE "LOUD" HALF. =====
  # The argument that justified reversing A12 was "stuck but recoverable AND LOUD". The suite
  # pins recoverable; loud has been an assumption living in the rationale. Without this, the
  # failure mode deliberately chosen over permanent loss is one nobody notices — which is the
  # worse of the two, not the better, if it is silent.
  # ORACLE CONSTRAINT, LOAD-BEARING: the assertion must FAIL when the signal is absent. An
  # assertion satisfiable by the drain's existing generic logging does not discriminate and does
  # not discharge this demand — it is exactly the shape that passes while proving nothing. The
  # signal must name the fault class, or count the stuck rows, or surface a stuck-row marker;
  # a bare "batch failed" line is not it.
  # SURFACE RATIFIED BY DECISION 11: a per-channel stuck-row record beside the graveyard, under
  # the same ignored prefix. A log line was rejected as the surface because it is not assertable
  # without log-capture plumbing — so this is a written artifact a test can read.
  # DELIBERATE CONSTRAINT ON THE IMPLEMENTER, not an accident of how the test was written: an
  # implementer who prefers structured logging must CHANGE THIS TEST rather than satisfy it.
  # That is the accepted price of an assertable signal; it is stated so nobody reads the test
  # as over-specified and quietly loosens it.
  - {id: non_retiring_failure_is_observable, kind: behavior, form: test,
     resolved_by: human-decision-10,
     binds: ["stuck_row_record", "stuck_row_record.identity",
             "interacts(drain->stuck_row_record)", "author_error_guard", "queue_row",
             "interacts(drain->author_error_guard)"],
     discharged_by: test_a_repeatedly_failing_row_that_never_retires_surfaces_a_named_operator_signal}

