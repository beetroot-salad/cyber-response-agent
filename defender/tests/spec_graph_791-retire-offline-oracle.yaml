    - {from: transcript_view, to: projected_telemetry, mode: read, via: fs,
       provenance: code}
    - {from: transcript_view, to: leg_status, mode: read, via: fs, provenance: design}

    # ---- bullet 4: three columns to two ----------------------------------------------
    - {from: run_direction, to: judge, mode: invoke, via: api, provenance: design,
       sends: payload, transport: llm}
    - {from: build_comparison, to: comparison_dir, mode: write, via: fs,
       provenance: design, sends: payload, interpolates: [run_id, direction, lead_id]}
    - {from: build_comparison, to: projected_telemetry, mode: remove, via: fs,
       provenance: design}
    - {from: build_comparison, to: real_sample_text, mode: invoke, via: api,
       provenance: design}
      # MODIFY: the call stays, its import moves out of the retired package (R1).
    - {from: render_manifest, to: judge_manifest, mode: write, via: api,
       provenance: design}
      # `via: api`, not `fs`, and no `interpolates`: the manifest is a returned string handed
