schema_version: 1
design: "791"   # retire the offline oracle from the learning cycle — #774's second half
base: 86e148e8  # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# READ THIS FIRST — the spec is written against the RESOLVED design, not the issue.
#
# The human seam (§7) ran EARLY, before this phase: a probe (P5) refuted a scope bullet
# in production and the skill halts on that before the next dispatch. So
# `70-resolutions.md` R1-R13 is BINDING here and supersedes the issue, `00-intent.md`,
# `20-demands.md` and `45-dispositions.md` wherever they conflict. Two of those thirteen
# widen the issue's "wiring change, not a deletion" framing, deliberately:
#
#   R1  the evidence column that survives the three-to-two cut is PRODUCED inside the
#       retired package and called on every direction leg, so "the modules stay uncalled"
#       is false in production. Resolution: MOVE the producer out. That is a code move
#       inside a wiring change, and the eval callers' imports move with it.
#   R10 the learn queue never reclaims a marker orphaned in `inflight/` by a crashed
#       drain. Acceptable while the queue was fed only by an offline path; #791 is what
#       makes the queue production-facing, so the reclaim hole is FIXED IN SCOPE.
#
# That second seam has since RUN. `71-resolutions.md` R14-R17 and its three corrections
# C1-C3 are BINDING here as well, and are folded in below:
#
#   R14 `--no-learn` governs CURATION as well as learning. The fail-closed pin below is
#       now the settled reading, not a placeholder — and because the flag governs
#       something its name does not say, its help text owes an obligation of its own.
#   R15 a never-selected leg records a per-leg STATUS FIELD, not a presence marker; the
#       viewer needs a stated default for run dirs written before the field existed.
#   R16 all five gate-minted demands are ACCEPTED and stay.
#   R17 the ticket-close step JOINS the tree-consumer security property's membership.
#
# C1/C2 correct a FALSE EDGE this graph carried. There is no hand-enqueue onto the learn
# queue and there never was (executed probe — H1 refuted, H1b/H1c below). The learning
# CLI's bare run-dir positional drives the RUN CYCLE directly and never touches the queue,
# so post-change the learn queue has NO FEED AT ALL, hand or automatic. The surviving hand
# path is `drives(loop_cli->run_one)`, which this graph already carried with code
# provenance; `interacts(loop_cli->enqueue_learning)` was never real and is gone.
# C3: R10's and R11's RATIONALE referenced that non-existent hand feed. Neither demand
# changes — R10's reclaim fix targets the CURATION queue's production-facing trigger, and
# R11 is strengthened: the drain must tell absent from empty precisely because the learn
# queue is now permanently empty BY DESIGN.
#
# The `gate:` block below is WRITTEN (phase D step 6), and re-run against this fold.
# ---------------------------------------------------------------------------
#
# NAME RECONCILIATION (grounding, demand extraction and the dispositions' address
# derivations coined ids independently; unified here by role+origin, against the code):
#
#   `oracle` is AMBIGUOUS across the two graphs that model this neighbourhood and is
#       disambiguated before any demand binds it: here `oracle` is the OFFLINE stage
#       #791 retires; the LIVE stage is `projection`, matching the `AgentRole.PROJECTION`
#       that shipped. `spec_graph_774.yaml` still keys the live stage `oracle`, which now
#       joins by name to the thing this change retires — the worst kind of wrong join,
#       because it resolves. D36 is the re-key; NOT aliased (an alias would disable the
#       very check that catches the under-binding).
#   `enqueue_for_learning` (20-demands, 10-brief) -> TWO code symbols, split here:
#       boundary `enqueue_learning` (run_common.py:161 — the guarded tail helper that
#       holds the three refusals and is what bullet 1 unhooks) and boundary `learn_queue`
#       (the marker the loop-side writer lands). Binding one id to both hid the fact that
#       the refusals and the queue write are separated by the extraction R3 demands.
#   `direction_artifact_names` (20-demands) -> `artifact_names` (Direction.artifact_names,
#       directions.py:88) plus `telemetry_name` (directions.py:68) as its own boundary —
#       the field that leaves is not the tuple that shrinks, and D1/D2 need both.
#   `interacts(judge->comparison_dir).payload` (20-demands D6) -> the payload facet lives
#       on the WRITE edge, `interacts(build_comparison->comparison_dir).payload`. The
#       judge reads that directory; it does not compose it.
#   `judge_prompt_malicious` / `judge_prompt_benign` -> `JUDGE_PROMPT` /
#       `JUDGE_BENIGN_PROMPT` (config.py:196-197 — what the code threads).
#   `first_party_key` (20-demands D15) -> the key-sourcing read is of `ORACLE_MODEL`;
#       there is no per-model key. Keys are sourced PER PROVIDER (E4), which is the whole
#       reason the originally-worded demand was vacuous.
#   `learning_refusal_gate` and `enqueue_curation` are COINED — neither symbol exists yet
#       (R3 makes the extraction a prerequisite). If the implementation names them
#       otherwise, the graph follows the code. Recorded in handoff.deviations.
#   The two marker roots keep the profile's ids, `learn_queue` / `author_queue`. NOT
#       `curator_queue` — that spelling re-inscribes the refuted S4 reading into the graph.
#
# A THIRD SEAM HAS RUN (§7 round 4, `72-resolutions.md`). R18-R22 and the three applications
# A1-A3 are BINDING here and folded in below. Three of them widen the change again:
#
#   R18 the curation queue's claim-and-serve must be atomic — R4's case-keying composes with
#       the queue defect P2 already proved into a re-ask DESTROYED mid-drain, silently.
#   R19 the LIVE projection stage stops being spelled with the retired stage's name, in the
#       product: the dispatch key, the fault tuple, the trace-row label and the trace filename
#       written into every run dir — not only this graph's id. A sixth widening.
#   R22 the investigation entrypoint's tail gets an INJECTION SEAM, so the five demands about
#       what the tail does are executed rather than read off `main`'s source, and R4's
#       exit-status isolation becomes observable at all. A seventh widening.
#
# R20 promotes three imperatives that had been recorded as untested clauses; R21 ratifies the
# curation trigger's placement above the render step (the fork closes below). A1 re-pins the
# shared-refusal demand structurally; A2 drops `judge_manifest`'s identity facet, which
# modelled a file that is not written; A3 defers the per-test discrimination instrument.
#
# THE SUITE (phase E, repaired at §7 round 4). All 47 `form: test` demands are discharged by a
# test of that exact name; the two remaining `form: clause` demands deliberately have none.
# The tests live in four modules beside this file, plus one uncollected harness:
#
#   test_791_run_cycle.py            the result shape, bullets 1-3, the key-sourcing pair
#   test_791_judge_two_columns.py    bullet 4, the judge payload, the hostile-frame walk
#   test_791_curation_boundary.py    bullet 6a, the shared refusal predicate, the scrub property
#   test_791_queues_evals_artifacts.py  the queues, bullet 5's evals, the dead-code baseline
#   _spec791.py                      the injected subagents, the run-dir builders, the
#                                    composition instruments
#
# THREE SEAMS ARE PINNED rather than described, because the design gives the dependency none
# and a demand with no executable witness discharges nothing: the golden replay's stage
# function (`oracle_fn=`), the fixtures directory both enqueues judge a held-out copy against,
# and — as of R22 — the investigation entrypoint's own tail. The third is a DEMAND
# (`investigation_tail_has_an_injection_seam`), not suite scaffolding: without it, five
# demands about what the tail does can only be read off `main`'s statement sequence, which no
# behaviour change can falsify. One source-shaped claim keeps the composition instrument
# spec_graph_540.yaml sanctions — the membership of the ordering property, an inline tuple
# inside another test — because it IS a claim about that file's source.
#
# CHANGE KINDS (rules.md Procedure 1 — assigned FROM THE DESIGN; no implementation exists,
# so no code diff can supply them): ADD on every `provenance: design` element; REMOVE on
# each of the eleven `mode: remove` edges; MODIFY where a code element's semantics change,
# called out in that element's comment (`author_queue.identity`'s key, the judge prompts,
# `artifact_names`' membership, `real_sample_text`'s home, and — since R19 — the NAME the
# live projection stage is dispatched, faulted and traced under).
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE RESULT SHAPE. FK1 is settled by R2: the name LEAVES the declared list,
  # and the viewer gets a positive signal instead of a file-presence inference.
  # =========================================================================

  - {id: run_cycle_result_shape, kind: behavior, form: test,
     discharged_by: test_791_learning_run_leaves_no_projection_artifact,
     binds: ["run_one", "interacts(run_direction->learning_run_dir)",
             "learning_run_dir.identity", "artifact_names", "telemetry_name"]}
     # FK1 RESOLVED (R2): drop the name. The rejected branch — leave it declared with
     # nothing writing it — fails open PERMANENTLY: the tuple's only test asserts a
     # superset (E8), so a declared-but-unwritten name renders as an empty section
     # forever, and run dirs already on disk make it wrong retroactively.

  - {id: leg_ran_signal_is_positive, kind: behavior, form: test,
     discharged_by: test_791_a_leg_that_died_is_not_reported_as_a_leg_that_ran,
     binds: ["leg_status", "leg_status.domain.distinguished[never-selected]",
             "leg_status.domain.distinguished[started-and-died]",
             "leg_status.domain.distinguished[unrecorded]",
             "interacts(transcript_view->leg_status)"]}
     # R2's SECOND half, and the promoted fail-open nobody chose: all three answerers
     # agreed a leg that writes its story and then dies still reports as having run,
     # because the leg-ran check only asks whether ANY declared file exists. Shrinking
     # the list sharpens that, so the drop and the positive signal are one decision.
     # CONCRETIZED by R15 (71-resolutions), which closes the vocabulary this demand was
     # confessed `unknown` on: the signal is a PER-LEG STATUS FIELD the leg writes into the
     # run's record, not a presence marker. The rejected branch — a marker file — leaves a
     # leg that died mid-write indistinguishable from one never selected, which is the exact
     # gap R2 exists to close. R15's accepted cost is the third member: every reader must
     # tolerate the new field and pre-change run dirs carry none, so the viewer needs a
     # STATED DEFAULT and this demand must exercise it — a run dir written before the field
     # existed must not be reported as a leg that ran, and must not be reported as one that
     # was never selected either.

  # =========================================================================
  # BULLET 1 — unhook the investigation's learn enqueue at the call site
  # =========================================================================

  - {id: investigation_writes_no_learn_marker, kind: behavior, form: test,
     discharged_by: test_791_finished_investigation_leaves_the_learn_queue_empty,
     binds: ["interacts(run_investigation->learn_queue)",
             "interacts(run_investigation->enqueue_learning)", "enqueue_learning"]}
     # EXECUTED as of R22: the entrypoint is driven over a run nothing refuses and the learn
     # queue is observed empty afterwards, with the curation marker as the paired positive.
     # It used to assert that `main`'s source no longer names the learning enqueue — true of
     # a tail that never runs, and unfalsifiable by any behaviour change.

  - {id: hand_invoked_learning_still_runs, kind: survival, form: test,
     discharged_by: test_791_operator_can_still_learn_a_run_by_hand,
     binds: ["run_one", "loop_cli", "drives(loop_cli->run_one)"]}
     # 01-resolutions' correction to the brief's second red flag lives here: bullet 1
     # removes the AUTOMATIC path, not every path — the CLI still takes a bare run dir and
     # runs the LEARN stage. Without this demand phase E writes bullets 3 and 4 off as
     # edits to unreachable code.
     # REWRITTEN by C2 (71-resolutions), intent unchanged, MECHANISM corrected. The demand
     # used to name the queue, the drain and an `interacts(loop_cli->enqueue_learning)` edge
     # that does not exist: H1 is refuted, H1b holds — the CLI's positional calls the run
     # cycle DIRECTLY, and the queue directory is never even created. So the surviving path
     # is the DIRECT DRIVE, and the test must assert that a bare run-dir positional produces
     # the run's own LEARN artifacts — never that a marker lands on any queue.

  # =========================================================================
  # BULLET 2 — unhook the run cycle's author enqueue at the call site
  # =========================================================================

  - {id: run_cycle_writes_no_author_marker, kind: behavior, form: test,
     discharged_by: test_791_run_cycle_leaves_the_author_queue_untouched,
     binds: ["interacts(run_one->author_queue)",
             "interacts(run_one->enqueue_for_authoring)"]}
     # E1 constrains the scenario: the third shape the issue names — "no direction
     # selected" — is UNREACHABLE (the normalizer raises outside the three-member enum and
     # both directions' sets cover all three). The two reachable shapes of "produced
     # nothing worth curating" are an actor SKIP and a leg that raised.

  # =========================================================================
  # BULLET 3 — drop the oracle step and its artifact. R1 splits this in two, because
  # at MODULE granularity the retired package stays live production code.
  # =========================================================================

  - {id: no_oracle_stage_call_in_a_direction_leg, kind: behavior, form: test,
     discharged_by: test_791_direction_leg_completes_with_two_subagent_calls,
     binds: ["interacts(run_direction->oracle)", "oracle", "run_direction"]}
     # R12: assert the leg's own COMPLETION alongside the zero call count. Without it a
     # scenario that dies early is indistinguishable from one that correctly declined to
     # call the retired stage — the only way this change's headline demand passes
     # vacuously. Scoped to the STAGE INVOCATION, never "the package is unexercised":
     # P5 refuted that reading and a test seeded from the issue's own wording goes red
     # against correct code.

  - {id: learning_run_never_imports_the_retired_package, kind: behavior, form: test,
     discharged_by: test_791_a_learning_run_imports_nothing_from_the_retired_package,
     binds: ["real_sample_text", "interacts(build_comparison->real_sample_text)",
             "oracle"]}
     # R1, and the widening the handoff must state plainly. Today the judge's surviving
     # two-column comparison imports and calls `real_sample_text` — which lives in the
     # retired stage's own module beside the oracle's prompt builder, reply parser and
     # projection assembler — once per executed lead on every direction leg. Moving the
     # producer out is what makes "uncalled" mean what it says AND lets the dead-code gate
     # (D35) express itself honestly: a file that is PARTLY live is the one shape a
     # file-level accept cannot describe.

  - {id: projected_telemetry_consumers_survive, kind: survival, form: test,
     discharged_by: test_791_transcript_renders_a_leg_with_no_projection_section,
     binds: ["projected_telemetry", "interacts(transcript_view->projected_telemetry)",
             "interacts(secondary_eval->projected_telemetry)"]}
     # C15 cheapens this: the persist step already tolerates a null projection and the
     # SKIP branch drives that shape today. What it does NOT cheapen is the transcript's
     # oracle section and the secondary eval's own staging write, which are the two live
     # dependents of the artifact being removed.

  # =========================================================================
  # BULLET 4 — three columns to two. F3's accepted loss, and R5's three failure shapes.
  # =========================================================================

  - {id: judge_call_carries_no_projection, kind: seam, form: test,
     discharged_by: test_791_run_cycle_judge_call_carries_no_projection,
     binds: ["interacts(run_direction->judge)", "interacts(run_direction->judge).payload",
             "judge"]}
     # FK2 settled (02-resolutions): the parameter LEAVES, the prompts are rewritten to
     # define every verdict against real data only, and the three prompt-sharing eval
     # callers are explicitly skipped with a stated reason. E7's protocol half is why this
     # could not be an implementation detail — `projected_telemetry_path` sits on the
     # subagents PROTOCOL every hermetic fake implements.

  - {id: comparison_file_has_two_columns, kind: shape, form: test,
     discharged_by: test_791_comparison_file_carries_evidence_and_reasoning_only,
     binds: ["interacts(build_comparison->comparison_dir).payload"]}

  - {id: no_projection_only_lead_rows, kind: behavior, form: test,
     discharged_by: test_791_comparison_set_is_exactly_the_executed_leads,
     binds: ["build_comparison", "interacts(build_comparison->comparison_dir)",
             "comparison_dir.identity"]}
     # F3/C11: removing the column removes a whole ROW CLASS, not a section of each file —
     # today a lead the oracle projected but the defender never executed still gets a
     # comparison file. The judge's INPUT SET changes. Rejected branch, recorded on the
     # test: keeping a synthetic row for a story-named lead.

  - {id: manifest_carries_no_projection_tag, kind: behavior, form: test,
     discharged_by: test_791_manifest_flags_anomalies_without_a_projection_tag,
     binds: ["render_manifest", "judge_manifest"]}
     # The identity address left this list with the facet (§7 round 4, finding 8): the manifest
     # is a STRING the renderer returns and the invocation builder splices into the judge's
     # turn. No file is written anywhere, so a facet describing where copies of it land was
     # modelling a sink that does not exist.

  - {id: no_verdict_is_defined_by_a_projection, kind: negative, form: test,
     discharged_by: test_791_no_verdict_definition_rests_on_a_projection,
     binds: ["JUDGE_PROMPT", "JUDGE_BENIGN_PROMPT",
             "interacts(run_direction->JUDGE_PROMPT)",
             "interacts(run_direction->JUDGE_BENIGN_PROMPT)"]}
     # F6/C12: both prompts define EVERY verdict value in terms of the projection and key
     # `undecidable` on an EMPTY projection — under two columns that definition can never
     # be satisfied. A negative binds every surface the content could reach, so both
     # prompts and both read edges are here, not just the malicious one.

  - {id: every_verdict_stays_defined, kind: parity, form: test,
     discharged_by: test_791_each_outcome_value_has_a_definition_in_each_prompt,
     binds: ["JUDGE_PROMPT", "JUDGE_BENIGN_PROMPT"]}
     # The PAIRED POSITIVE CONTROL for the negative above (schema.md, kind: negative).
     # Without it the negative passes on a prompt with no verdicts at all — and shrinking
     # the vocabulary is the cheapest path to green.

  - {id: unreadable_lead_surfaces_its_own_emptiness, kind: behavior, form: test,
     discharged_by: test_791_a_lead_whose_payload_cannot_be_read_says_so,
     binds: ["comparison_dir", "interacts(build_comparison->comparison_dir).payload"]}
     # R5 (a). The removed column was SLACK, not only evidence: left alone this renders as
     # "a comparison that looks thin", indistinguishable from a real lead with little
     # evidence — a quiet wrong verdict rather than an error.

  - {id: empty_comparison_set_is_recorded, kind: behavior, form: test,
     discharged_by: test_791_a_leg_that_executed_nothing_records_an_empty_comparison_set,
     binds: ["comparison_dir.identity", "interacts(run_direction->judge)"]}
     # R5 (b). NOTE the residual, carried to §7's second seam: R5 settles that the empty
     # case is RECORDED as an observable state; it does not settle whether the judge is
     # driven over it. See handoff.forks.

  - {id: unparseable_judge_response_fails_loudly, kind: behavior, form: test,
     discharged_by: test_791_an_unparseable_judge_response_fails_loudly,
     binds: ["interacts(run_direction->judge).response", "judge"]}
     # R5 (c), the promoted premise. Under three columns a response that half-parsed had a
     # recoverable shape; under two it does not, and that loss is a direct consequence of
     # the column removal rather than pre-existing behaviour anyone can defer.

  # =========================================================================
  # BULLET 5 — the modules stay in the tree. R7 re-cuts the seeded demand: three of the
  # four evals GO DARK. The seeded form asserted a falsehood and must not be carried.
  # =========================================================================

  - {id: golden_replay_still_judges, kind: survival, form: test,
     discharged_by: test_791_the_golden_replay_still_drives_the_oracle_end_to_end,
     binds: ["oracle_golden_replay", "oracle",
             "interacts(oracle_golden_replay->oracle)"]}
     # R7: the ONLY entry point left with a positive, asserting witness — it binds the
     # per-lead oracle seam directly and never touches the judge prompts.

  - {id: three_evals_skip_loudly, kind: survival, form: test,
     discharged_by: test_791_the_three_prompt_sharing_evals_skip_with_a_stated_reason,
     binds: ["secondary_eval", "judge_equivalence", "run_judge_ab",
             "interacts(secondary_eval->JUDGE_PROMPT)",
             "interacts(judge_equivalence->JUDGE_PROMPT)"]}
     # R7: they STOP JUDGING BUT KEEP RUNNING — their machinery stays exercised so bit-rot
     # surfaces, and the skip reason must be LOUD, because a passing eval whose result
     # means nothing is a trap. E5 is the sharp half the brief never carried: all three
     # share the two prompts, so under any reading where they keep judging they report
     # numbers and measure nothing.

  - {id: retired_knobs_dead_for_learning_live_for_evals, kind: survival, form: test,
     discharged_by: test_791_the_oracle_knobs_are_dead_for_learning_and_live_for_the_replay,
     binds: ["ORACLE_EFFORT", "ORACLE_MAX_CONCURRENCY",
             "interacts(run_direction->ORACLE_EFFORT)",
             "interacts(run_direction->ORACLE_MAX_CONCURRENCY)",
             "interacts(oracle_golden_replay->ORACLE_EFFORT)"]}
     # Two consensus assertions land here: the knobs are dead for the learning cycle and
     # still live for the surviving measurement path, and one of them is folded into that
     # path's own output identity (the replay's audit tag spells model + effort + prompt).

  # =========================================================================
  # BULLET 6a — catalog curation gets its own trigger at the investigation boundary
  # =========================================================================

  - {id: investigation_tail_has_an_injection_seam, kind: seam, form: test,
     discharged_by: test_791_the_investigation_tail_takes_its_dependencies_through_a_seam,
     binds: ["run_investigation", "investigation_tail_seam"]}
     # R22 (§7 round 4). The entrypoint's tail takes its three undrivable dependencies — the
     # credentialed investigation lifecycle, the HTML render, the case-ticket endpoint —
     # through an injection seam, each defaulting to production. Without it FIVE demands about
     # what the tail DOES are read off `main`'s statement sequence, and a test that reads
     # source cannot fail when the behaviour changes; the exit-status half of R4's isolation
     # has no source form at all. The same argument #741 made one layer in, where
     # `_run_investigation_lifecycle` already carries `investigate=`/`start_box=`/`scrub=`.
     # Accepted cost: a SEVENTH widening — a structural change to the entrypoint, demanded
     # before the code exists because it is far cheaper to add with the code than after it.
     # The curation trigger is deliberately NOT injectable: it is what the demands observe.

  - {id: curation_trigger_at_the_investigation_boundary, kind: behavior, form: test,
     discharged_by: test_791_finished_investigation_drives_catalog_curation,
     binds: ["interacts(run_investigation->enqueue_curation)", "enqueue_curation",
             "interacts(run_investigation->author_queue)", "lead_author_drain",
             "interacts(run_investigation->enqueue_for_authoring)"]}
     # The brief's F3 forces the second half of the assertion: the lane's ONLY other
     # trigger (pending pitfalls) is written from inside its own run, so a threshold that
     # COULD fire is not evidence the lane is alive. The lane must be observed RUNNING.
     # E9 (now executed as PR5) is what makes the placement cheap: the marker is
     # byte-identical, the lane already consumes the INVESTIGATION run dir.

  - {id: curation_marker_shape, kind: shape, form: test,
     discharged_by: test_791_the_curation_marker_names_the_case_and_the_run_dir,
     binds: ["interacts(run_investigation->author_queue).payload"]}
     # R4's accepted cost made observable: keying on the case means the marker's identity
     # stops matching the run dir it points at. The marker must still carry a resolvable
     # run dir, because that is the only thing the drain hands the curator.

  - {id: curation_request_is_keyed_on_the_case, kind: uniqueness, form: test,
     discharged_by: test_791_a_retried_investigation_coalesces_onto_one_curation_request,
     binds: ["author_queue.identity", "drives(operator->run_investigation)",
             "interacts(run_investigation->author_queue)"]}
     # R4 (identity), human-answered: KEY ON THE CASE, NOT THE RUN, so a retry coalesces
     # rather than adding. Bound at the COMPOSITION frame — `operator` driving the
     # investigation twice — because a single-investigation test cannot see the collision.
     # P3 is what this overturns: today identity is the marker's FILE NAME (derived from
     # the run dir's name), the `run_id` field is never read for it, and two run ids for
     # one case drive two curations. Accepted cost, recorded: a legitimate later
     # re-investigation needs its own way to ask.

  - {id: curation_claim_and_serve_is_atomic, kind: uniqueness, form: test,
     discharged_by: test_791_a_curation_re_ask_issued_mid_drain_is_not_destroyed,
     binds: ["author_queue.identity", "interacts(lead_author_drain->author_queue)",
             "drives(operator->run_investigation)"]}
     # R18 (§7 round 4), and the composition of two facts each recorded alone. The lane reads a
     # marker at the top of its pass and unlinks it BY PATH at the bottom (P2); R4 makes both
     # requests of one case land on that one path. Today identity is the run dir's name, so a
     # re-investigation writes a DIFFERENT marker and survives as a duplicate — case-keyed it
     # lands on the path the serving drain is about to remove, and the re-ask is destroyed
     # deterministically. Invisible by construction: the count is right and the lane reports
     # success. Either the claim is atomic — the marker leaves the queue before it is served —
     # or the unlink is of the contents that were read. Bound at the composition frame,
     # because the collision is between an operator's second investigation and a drain pass.

  - {id: curation_write_is_isolated, kind: behavior, form: test,
     discharged_by: test_791_a_failed_curation_write_costs_the_investigation_nothing,
     binds: ["interacts(run_investigation->author_queue)", "run_investigation",
             "enqueue_curation"]}
     # R4 (isolation), taken on the judge's recommendation: BEST-EFFORT and explicitly
     # isolated — its failure must not change the investigation's exit status or suppress
     # any later tail step. The old trigger sat inside the learning run cycle; the new one
     # sits in the investigation's own tail, behind the step that certifies the tree and
     # AHEAD of the steps that render the run for a human, so it is newly able to cost the
     # investigation its human-facing output. The dropped two-marker premise's surviving
     # question lands here.
     # R22 widens what this pins to what R4 actually says. The helper returning rather than
     # raising was the whole assertion; an entrypoint written as
     # `if not enqueue_curation(...): return 1` satisfied it and still failed the run for a
     # corpus optimisation. With the tail seam the EXIT STATUS is observable, and it is now
     # asserted beside the render step still running.

  - {id: refusals_have_one_owner_across_both_enqueues, kind: parity, form: test,
     discharged_by: test_791_both_enqueues_consult_the_same_refusal_predicate,
     binds: ["learning_refusal_gate.access[learn-enqueue]",
             "learning_refusal_gate.access[curation-enqueue]",
             "learning_refusal_gate"]}
     # R3, and the reason FK3's provisional ("all four carry over") could not simply be
     # confirmed. PR1-PR3: all three run-dir refusals are welded INSIDE the learn-enqueue
     # helper as early returns, and that helper signals "not refused" BY PERFORMING THE
     # ENQUEUE — asking it "would this run be refused?" enqueues the run. There is no
     # predicate to share, so extracting one is a PREREQUISITE, not a nicety. A copied
     # guard drifts; a shared predicate cannot, and this parity demand is what keeps the
     # corpus protection from silently diverging from the thing that documents it.
     # PINNED STRUCTURALLY, not behaviourally (§7 round 4, finding 6). R3's words are "extract
     # a shared predicate, NOT A COPY", and a matrix of matching outcomes is satisfied by two
     # hand-copied guards on the day they are written — the precise implementation the
     # resolution rejects. The test asserts both enqueue BODIES call the one predicate, with
     # the composition instrument this suite already sanctions, and keeps the per-condition
     # matrix as proof the shared owner is consulted for its answer rather than merely called.

  - {id: curation_refuses_the_copy_keyed_held_out_alert, kind: behavior, form: test,
     discharged_by: test_791_curation_refuses_a_held_out_alert_copy_by_content,
     binds: ["learning_refusal_gate",
             "interacts(run_investigation->learning_refusal_gate)",
             "interacts(run_investigation->investigation_run_tree)"]}
     # R3's sharpening, and the whole reason "carry the four refusals" is the wrong
     # instruction. PR2: curation is gated by FIVE checks today, not four. The boundary's
     # held-out net is PATH CONTAINMENT on the operator's argv path; the one sitting
     # immediately above the curation enqueue is a CONTENT DIGEST over the run's own alert
     # copy. Only the second catches a copy — which is how the refusal is worded — and
     # carrying the boundary's four forward literally drops it out of the curation path
     # with nothing going red. It would surface later, silently, as contamination.
     # PR2b: that net is VACUOUS today because the shipped fixture corpus holds one README,
     # so the test must plant a digest or it asserts nothing.

  - {id: curation_honours_no_learn, kind: domain-outcome, form: test,
     discharged_by: test_791_no_learn_suppresses_curation_too,
     binds: ["no_learn_flag.domain.distinguished[true]",
             "no_learn_flag.domain.alternatives[held-out-scoring-run]",
             "interacts(run_investigation->no_learn_flag)"]}
     # THE ONE REFUSAL R3 DOES NOT NAME — SETTLED by R14 (71-resolutions): the operator's
     # opt-out governs curation as well as learning, and the assembler's fail-closed pin is
     # now the decided reading rather than a placeholder held open for §7. PR4: the flag has
     # exactly one reader in the whole production tree and is never persisted, so siting the
     # trigger anywhere but `main`'s own tail puts it permanently out of reach. Today
     # `--no-learn` suppresses curation COMPLETELY (the author queue's one production
     # producer is unreachable with an empty learn queue), and the held-out eval procedure
     # DOCUMENTS `--no-learn` as its way of running a scored alert. A trigger that ignores
     # the flag makes the eval's own documented invocation start feeding the committed
     # catalog, leaving the copy-keyed digest as the sole net — one protection load-bearing
     # alone. R14's accepted cost: an operator who wants to skip learning while keeping
     # curation loses that, and the flag's name no longer describes everything it governs —
     # which is what the help-text demand below exists to repair.
     # EXECUTED as of R22: all three columns are driven over the operator's own argv through
     # the entrypoint, so "the flag reaches the trigger" is observed rather than read off the
     # keyword `main` hands the call — the half of this demand that had no behavioural form.

  - {id: no_learn_help_names_curation, kind: behavior, form: test,
     discharged_by: test_791_the_no_learn_flag_says_it_governs_curation,
     binds: ["no_learn_help", "no_learn_flag"]}
     # R14's SECOND half, and its accepted cost made into an obligation rather than left as a
     # note. PROMOTED from clause by R20 (§7 round 4). The downgrade rationale was that pinning
     # help prose hardens a paragraph nobody wants frozen; the test asserts ONE WORD inside one
     # flag's own help block, which freezes nothing, and the failure it guards is the ordinary
     # one — the behaviour ships, the documentation does not, and nothing goes red. The flag
     # has exactly one reader in the whole production tree (PR4), so this text is the only
     # place an operator could learn that it now governs curation too.

  - {id: curation_reads_the_tree_only_after_certification, kind: parity, form: test,
     discharged_by: test_791_the_curation_trigger_joins_the_scrub_ordering_property,
     binds: ["investigation_run_tree.access[pre-certification-consumers]",
             "investigation_run_tree.access[curation-enqueue]",
             "investigation_run_tree.access[ticket-close]"]}
     # R6: EXTEND the membership to the new consumer. The property is a hand-written list
     # of the tree's consumers (H3) and the change both removes a member (the departing
     # learn enqueue) and adds one, which is exactly the moment the list is meant to be
     # re-examined. Ordering is fine on the facts (PR3: the scrub verdict is written in the
     # lifecycle's `finally`, before the boundary is reached) — the demand is about the
     # PROPERTY covering the new consumer, not about discovering a violation.
     # R17 (71-resolutions) closes the hole the assembler confessed here: the TICKET-CLOSE
     # step reads the tree (H2) and is not on the list, so its ordering holds by POSITION
     # and by no check. It joins the membership now, and this demand's third cell is what
     # carries it — R3's per-cell discharge means the other two cells' credit never extended
     # to it. Accepted cost, stated plainly: a PRE-EXISTING gap is fixed under this issue's
     # name, which is the fifth place this change runs wider than "a wiring change".
     # EXECUTED as of R22, both new cells: the tail is driven and each consumer is observed
     # running against a tree the lifecycle had already certified, with the fail-closed
     # control driving an UNCERTIFIED tree, where the request must be refused rather than
     # written. MEMBERSHIP stays a source read, because the property IS an inline tuple
     # inside another test — that half is a claim about a file's shape, not about a run.

  - {id: shrinking_the_consumer_property_states_a_reason, kind: behavior, form: test,
     discharged_by: test_791_removing_a_consumer_from_the_scrub_property_states_a_reason,
     binds: ["tree_consumer_property", "spec_graph_540"]}
     # R6's second half. When this property goes red the CHEAPEST repair is to delete the
     # departed name, and that repair leaves a security guarantee quietly covering less
     # than it did with no test failing. Without the guard, shrinking the list is the
     # cheapest path to green — which is the definition of an unfalsifiable demand.

  # =========================================================================
  # BULLET 6b — the oracle model leaves the run cycle's key-sourcing set
  # =========================================================================

  - {id: key_sourcing_no_longer_names_the_oracle_model, kind: seam, form: test,
     discharged_by: test_791_run_cycle_sources_no_key_for_the_oracle_model,
     binds: ["interacts(run_one->ORACLE_MODEL)", "run_one"]}
     # FK4/R13: PIN THE RUN CYCLE'S PATH ONLY. The shared preparation helper's model set is
     # untouched and the secondary eval keeps sourcing its own key — removing it there
     # breaks that eval in exactly the non-default configuration that makes the end-to-end
     # demand observable at all. Accepted cost, stated: this pins the WIRING, not the
     # end-to-end outcome the human originally asked for.

  - {id: oracle_model_on_another_provider_still_runs, kind: domain-outcome, form: test,
     discharged_by: test_791_learning_run_completes_with_no_oracle_provider_key,
     binds: ["ORACLE_MODEL.domain.alternatives[claude-*]"]}
     # E4 + R13, and the trap this demand exists to avoid: keys are sourced PER PROVIDER,
     # and at shipped defaults the oracle, actor and judge models are all aliases of ONE
     # provider — so "a learning run completes with no oracle key" IS TRUE OF THE UNCHANGED
     # TREE. The test must point the retired stage's model at the other provider and
     # withhold that provider's key, or it passes against HEAD and pins nothing.

  - {id: single_provider_run_is_the_paired_control, kind: domain-outcome, form: test,
     discharged_by: test_791_a_single_provider_learning_run_completes,
     binds: ["ORACLE_MODEL.domain", "interacts(run_one->ORACLE_MODEL)"]}
     # The paired control for the demand above: at shipped defaults the run completes and
     # PROVES NOTHING, which is precisely why it has to be written down next to the one
     # that does. A reader who sees only the green default column cannot tell the two apart.

  # =========================================================================
  # THE QUEUE THE CHANGE MAKES PRODUCTION-FACING (R10, R11) — inherited defects, in scope
  # =========================================================================

  - {id: orphaned_inflight_marker_is_reclaimed, kind: behavior, form: test,
     discharged_by: test_791_a_marker_orphaned_by_a_crashed_drain_is_reclaimed,
     binds: ["interacts(learn_drain->learn_queue)", "learn_queue.identity", "learn_drain"]}
     # R10, and the second place this change is wider than "a wiring change". P1
     # (executed): the drain enumerates `<queue>/*.json` only, `inflight/` is a
     # subdirectory and therefore outside the glob BY CONSTRUCTION — no age-out, no reaper,
     # no quarantine — and the operator's own count line reports 0 QUEUED while the marker
     # exists. The orphan is invisible to the only instrument the operator has.
     # RATIONALE CORRECTED by C3, demand unchanged. R10 said "#791 is what makes the queue
     # production-facing" — true of the CURATION queue, which gains an automatic feed from
     # the new investigation-boundary trigger, and BACKWARDS for the learn queue, whose only
     # writer this change deletes with no replacement (H1c). What still earns the fix here is
     # the CUTOVER: markers already on disk when the change ships can crash a drain mid-claim
     # and land in `inflight/` where nothing ever reclaims them.
     # The de-duplication half of P1/P3 is answered by R4's case-keyed identity, not here.

  - {id: drain_distinguishes_absent_from_empty, kind: behavior, form: test,
     discharged_by: test_791_the_drain_tells_an_absent_queue_from_an_empty_one,
     binds: ["learn_drain", "learn_queue", "interacts(learn_drain->learn_queue)"]}
     # R11, 3/3 convergence — SUBSTANCE UNCHANGED, rationale corrected by C3. Cutting the
     # automatic feed converts a meaningful number into a permanent constant: the operator
     # is told how much was queued and the answer is now always the same. The earlier
     # wording said that number could still mean "the hand-enqueue they depend on has
     # quietly broken" — there is no hand-enqueue and never was (H1 refuted, H1c). That
     # STRENGTHENS this demand rather than weakening it: the drain must distinguish absent
     # from empty precisely because the queue is now PERMANENTLY EMPTY BY DESIGN, so the
     # count carries no information at all and only the absent/empty signal does. H4: the
     # learn drain has no has-work probe — it globs the directory — so absent and empty are
     # the same output today. Say once that the feed is gone; it is the only instrument left.

  - {id: queues_survive_the_cutover, kind: survival, form: test,
     discharged_by: test_791_markers_queued_before_the_change_still_drain_after_it,
     binds: ["learn_queue", "author_queue", "lead_author_drain",
             "interacts(lead_author_drain->author_queue)"]}
     # The cutover the consensus named twice: markers already on disk when the change ships,
     # and the lead-author lane running down its existing backlog while the new supply
     # arrives. C9 is why this is not academic — with no markers arriving the lane runs its
     # pitfalls backlog once and then goes PERMANENTLY quiet; the silencing is total, not
     # eventual.

  # =========================================================================
  # THE NAME THE CHANGE TAKES OUT OF CIRCULATION, AND THE SWEEP (R8, R9, R19)
  # The retirement is only complete when the word means one thing again — in the product
  # first (R19), then in the artifacts that address it by name.
  # =========================================================================

  - {id: dead_code_baseline_names_the_issue, kind: behavior, form: test,
     discharged_by: test_791_every_new_dead_code_baseline_entry_names_this_issue,
     binds: ["dead_code_baseline"]}
     # R9. Leaving code uncalled trips a CI gate that blocks on newly-unreachable code, and
     # deletion is out of scope by an explicit sentence. The baseline maps a finding
     # fingerprint to a REASON STRING with "" meaning un-triaged (H5), so "with a stated
     # reason pointing at #791" is a real assertion, not prose. The gate keeps blocking on
     # genuinely new dead code; this change's deliberate dead code is on record.
     #
     # AMENDED at implementation (see the test's own docstring). The demand was written
     # expecting the corpses inside `pipeline/oracle/`, and predicted a producer move (R1)
     # to make that honest. Neither survived: the package keeps EVERY symbol live, because
     # the secondary eval goes on projecting — its own sibling demand says so in as many
     # words — and the golden replay binds the per-lead seam. The corpses are the queue API
     # the curation request replaced and the A/B harness's verdict parser, so the demand is
     # located by SYMBOL now, which is also stricter than the package scan it replaces.
     #
     # The second arm is new and is the load-bearing one: "" meaning un-triaged was
     # DOCUMENTED by the shared ratchet and enforced by nothing, so --update-baseline could
     # bury any corpse in silence. That is the same shape that let the gate run blind for a
     # month after #744's squash merge reverted #721's confidence threshold. A per-issue
     # demand cannot hold it; the ratchet now refuses an un-triaged entry for every change,
     # and this node pins that refusal.

  - {id: live_projection_stage_sheds_the_retired_name, kind: behavior, form: test,
     discharged_by: test_791_the_live_projection_stage_sheds_the_retired_stages_name,
     binds: ["projection", "review_live_trace",
             "interacts(challenge_gate->review_live_trace)"]}
     # R19 (§7 round 4), and the finding that the re-key's own stated goal was false of the
     # product. The graph gets re-keyed; the LIVE review gate goes on spelling its surviving
     # projection stage `oracle` — the key it dispatches under, the fault tuple it reports,
     # the trace-row label, and the trace filename written into every run dir. #791 is what
     # makes that spelling wrong, because it is what removes the other thing the word could
     # mean, and the operator opening a post-#791 run dir is the reader who pays. This run's
     # own phrase — "the worst kind of wrong join, because it resolves" — relocated from a
     # spec artifact into the product. Accepted cost: a SIXTH widening, and it reaches the two
     # shipped #774 tests that assert the retired spelling in a trace filename (the
     # blast-radius clause below is what carries them).

  - {id: rekey_live_projection_graph_id, kind: uniqueness, form: test,
     discharged_by: test_791_the_older_graph_stops_addressing_the_retired_id,
     binds: ["spec_graph_774", "projection"]}
     # R8, confirming FK5 (folded in as a stated assumption, not inherited on trust). C14:
     # six demands and four pre-discharged entries still address `oracle` in that graph, and
     # #791 is the run that makes the collision consequential. PROMOTED from clause by R20:
     # the downgrade rested on "an edit to a spec artifact, not to the product", which two
     # tests in this suite already refute by asserting on a committed lint baseline and on
     # another test module's source. The test asserts over ADDRESSES only — element ids and
     # the addresses demands and gate entries bind — so that graph's prose may go on
     # discussing the offline oracle; it is the machine-joined half that must stop naming it.

  - {id: profile_census_drops_the_retired_writer, kind: uniqueness, form: test,
     discharged_by: test_791_the_project_profile_census_drops_the_retired_writer,
     binds: ["project_profile_census"]}
     # R8 + C16. A stale census entry fails open BY CONSTRUCTION — a name that resolves to
     # nothing reads exactly like a row that was never written — and this file seeds the
     # next change's grounding pass, which is the failure this very run hit in its own first
     # hour. PROMOTED from clause by R20, same rationale as above; the assertion is one absent
     # substring, with the rest of the census as its control so a census emptied into green
     # fails here.

  - {id: loop_cli_help_drops_the_oracle, kind: behavior, form: clause,
     outcome: {nl: "The learning CLI's own help text no longer describes a run as
       actor to oracle to judge, no longer advertises the three oracle environment knobs as
       run-cycle configuration, and no longer lists the projected-telemetry files among a
       run's outputs."},
     binds: ["loop_cli_help"]}
     # E6. The operator-facing surface bullet 3 falsifies and the issue never names.
     # Downgrade recorded: pinning help prose in an assertion hardens a paragraph nobody
     # wants frozen.

  - {id: every_affected_test_is_updated_or_skipped_with_a_reason, kind: survival,
     form: clause,
     outcome: {nl: "Every test module naming the oracle, the projected telemetry, or
       either enqueue seam either still asserts something that is true after the change or
       carries an explicit skip with its reason written down — none is left passing over a
       call path that no longer runs."},
     binds: ["oracle", "learn_queue", "author_queue", "enqueue_learning"]}
     # The issue's own last blast-radius sentence, and F5 is why it lands hardest on the
     # fail-CLOSED nets: unhooking the call site leaves the guards intact and their tests
     # green over nothing. Treat the census as a SEARCH RADIUS: 60 test modules name the
     # oracle or its telemetry (reproduces exactly), 8 name the enqueue seams (reproduces),
     # and the issue's "3 spec-coverage graphs" is 15, of which 6 model it as an addressable
     # element — understated 5x (C13b, REFUTED). A radius understated 5x is the shape that
     # leaves a graph un-updated and its gate green over a stale address. A clause does NOT
     # discharge this at the gate; a sweep over 60 modules is a review obligation, and
     # inventing a proxy test would be worse than recording it honestly.
     # R19 adds two KNOWN members to that radius rather than leaving them to the sweep: the
     # two #774 tests that assert the live stage's trace filename under the retired spelling
     # go red on the re-key, and the honest repair is to update them, not to widen the match.

  # =========================================================================
  # GATE-MINTED (phase D step 6) — five test obligations spec-graph gate --residue found
  # with no discharging demand. ALL FIVE ACCEPTED at §7's second seam by R16
  # (71-resolutions): three are security-shaped and cost far more to add once the code
  # exists, and one is PROVEN rather than hypothesized. Full witness and route rationale
  # for each is in 60-residue.md. No waivers; nothing was declined.
  # =========================================================================

  - {id: judge_turn_payload_is_well_formed, kind: shape, form: test,
     discharged_by: test_791_judge_turn_payload_is_well_formed,
     binds: ["interacts(run_direction->judge).payload"]}
     # R1. judge_call_carries_no_projection (kind: seam) pins the wiring change but not the
     # facet's own invariants (roles-disjoint-sources, all-slots-bound) over the two rendered
     # parts (system: const JUDGE_PROMPT, user: comparison_dir template) — R1's canonical
     # dual-prompt escape shape. See 60-residue.md for the full witness.

  - {id: learn_queue_claim_is_idempotent_under_retry, kind: uniqueness, form: test,
     discharged_by: test_791_learn_queue_claim_is_idempotent_under_retry,
     binds: ["learn_queue.identity", "interacts(learn_drain->learn_queue)"]}
     # R2. P2 (executed, refuted): a retry after the top-level slot frees lands unobstructed
     # and the next drain learns the same run a second time. R10 fixed P1's reclaim and P3's
     # author-queue de-dup but never picked up P2's learn-queue half. See 60-residue.md.

  - {id: concurrent_direction_legs_write_distinct_artifacts, kind: uniqueness, form: test,
     discharged_by: test_791_concurrent_direction_legs_write_distinct_artifacts,
     binds: ["comparison_dir.identity", "learning_run_dir.identity"]}
     # The second address was `judge_manifest.identity` until §7 round 4 (finding 8) dropped
     # that facet: the manifest is a rendered string, not a written file. The test's second
     # sink was always the per-direction judge doc in the shared learning run dir, which is a
     # real per-leg write with a real key — so the demand now binds what it asserts on.
     # R2. Both sinks have full key coverage on paper but no demand drives two concurrent
     # direction legs and asserts distinct, uncollided real content — R2's canonical
     # per-key-collision-across-two-legs escape. A sibling test was dropped at
     # 45-dispositions.md "behind a standing probe" this ledger does not carry. See
     # 60-residue.md. R16 keeps it and says why: the drop rested on a probe CITATION NOT
     # PRESENT in the ledger, so it could not be verified, so the demand stands. Its
     # dispositions-frontier twin stays in handoff.drops — the drop is superseded here, not
     # re-litigated there.

  - {id: enqueue_curation_cannot_be_called_unguarded, kind: behavior, form: test,
     discharged_by: test_791_enqueue_curation_cannot_be_called_unguarded,
     binds: ["enqueue_curation", "learning_refusal_gate.access[curation-enqueue]"]}
     # R5 judgment extension. enqueue_curation is the one new caller touching
     # attacker-influenced content; assert the refusal predicate is welded inside it (PR1's
     # weld pattern for enqueue_learning), not left to caller discipline. See 60-residue.md.

  - {id: rendered_frames_reject_hostile_identifiers, kind: behavior, form: test,
     discharged_by: test_791_rendered_frames_reject_hostile_identifiers,
     binds: ["comparison_dir.payload", "judge_manifest"]}
     # R6 trust walk. Neither comparison_dir's markdown frame nor judge_manifest's heading
     # frame (unmodeled payload facet) pairs its chooser (lead_id, direction) with a
     # sanitizer — R6's canonical raw-frame escape. See 60-residue.md.

structure:

  axes: [run_id, case_id, direction, lead_id]
  # `run_id` and `direction` are read off path templates in the code; `lead_id` off the
  # per-lead comparison filename; `case_id` is the axis R4 PROMOTES — today nothing keys
  # on it, which is why a retry adds a second curation request instead of coalescing.

  actors:
    - {id: operator, frame: composition, provenance: code}
      # F10: every drain and every learning run is an operator running the loop CLI by
      # hand — no cron, no CI job, no shell script. Modelled because it is the composition
      # frame the retry-coalescing demand has to be bound at, and because every marker
      # census in this graph has a hand-classified floor at the CLI's flag dispatch.
    - {id: run_investigation, frame: leg, provenance: code}
    - {id: loop_cli, frame: composition, provenance: code}
    - {id: run_one, frame: composition, provenance: code}
    - {id: run_direction, frame: leg, provenance: code}
    - {id: build_comparison, frame: leg, provenance: code}
    - {id: render_manifest, frame: leg, provenance: code}
    - {id: learn_drain, frame: composition, provenance: code}
    - {id: lead_author_drain, frame: composition, provenance: code}
    - {id: transcript_view, frame: leg, provenance: code}
    - {id: secondary_eval, frame: composition, provenance: code}
    - {id: oracle_golden_replay, frame: composition, provenance: code}
    - {id: judge_equivalence, frame: composition, provenance: code}
    - {id: run_judge_ab, frame: composition, provenance: code}
    - {id: challenge_gate, frame: composition, provenance: code}
      # The LIVE review gate (#774). Present because R19 re-keys the stage it dispatches, the
      # fault it reports and the trace it writes — not because #791 changes what it does.

  boundaries:

    # ---- the retired stage and the producer that has to leave it (R1) -------------
    - {id: oracle, provenance: code, facets: {}}
      # The OFFLINE stage. Not `projection` — see the name-reconciliation header.
    - {id: real_sample_text, provenance: code, facets: {}}
      # MODIFY: same symbol, new home. P5 (executed): defined in the oracle package, its
      # sole production caller is the judge's comparison builder, and the oracle's own
      # stage driver does NOT call it — it takes the redacted sibling. So it is a
      # judge-only function merely FILED inside the retired stage.
    - {id: projection, provenance: code, facets: {}}
      # The LIVE stage that survives, and MODIFY as of R19: #791 does not touch what it does,
      # it takes back the word it is spelled with. The review gate keys it `oracle` in the
      # dispatch, the fault tuple and the trace-row label; after this change the only stage
      # that word could name is gone.
    - {id: review_live_trace, provenance: code, facets: {}}
      # MODIFY (R19): the per-stage execution trace the live review writes into EVERY run dir.
      # Facetless deliberately — the change alters the NAME the projection stage's trace is
      # written under, and decides nothing about the trace's contract. This is the surface an
      # operator actually meets: a post-#791 run dir advertising `oracle` artifacts for a
      # stage the spec says was retired.

    # ---- the two marker roots ------------------------------------------------------
    - id: learn_queue
      provenance: code
      facets:
        identity:
          key_axes: [run_id]
          evidence: {nl: "One marker per run at `<state root>/learn-queue/<run_id>.json`,
            read off the enqueue's own path template and confirmed by
            `spec-graph trace resource learn_queue` after declaring the root."}
          derivations: []
          sharing: unique-key
    - id: author_queue
      provenance: code
      facets:
        identity:
          # MODIFY (R4): the key moves from the run to the CASE. Today the marker's file
          # name is derived from the run directory's name and the `run_id` field inside is
          # never read for identity (P3, executed) — so two run ids for one case drive two
          # curations, and a retry adds rather than coalesces.
          key_axes: [case_id]
          evidence: {nl: "The drain de-duplicates on nothing: identity is the marker's file
            name, established by queuing one case under two run ids and observing two
            curations (P3). R4 re-keys that name on the case, which is what makes a retry
            coalesce."}
          derivations: [{value: marker_name, fn_of: case_id, injective: true}]
          sharing: unique-key
        payload:
          parts:
            - {role: identity, source: const:case_id}
            - {role: location, source: template:investigation_run_tree}
          invariants: [all-slots-bound]
          nl: "The curation marker: the case it speaks for, and the investigation run
            directory the drain hands straight to the curator. R4's accepted cost is that
            the first no longer determines the second."

    # ---- the two enqueue seams, old and new -----------------------------------------
    - {id: enqueue_learning, provenance: code, facets: {}}
      # The guarded tail helper (run_common). Its success path IS the learn-queue write,
      # which is precisely why it cannot be reused as a predicate (PR1).
    - {id: enqueue_for_authoring, provenance: code, facets: {}}
      # The marker writer the new trigger REUSES rather than replacing (E9/PR5): a marker
      # written at the investigation boundary is byte-identical to today's.
    - {id: enqueue_curation, provenance: design, facets: {}}
      # ADD. Coined — no symbol exists. A guarded post-step wrapper in `main`'s own tail,
      # mirroring the learn enqueue's shape.
    - {id: investigation_tail_seam, provenance: design, facets: {}}
      # ADD (R22). The entrypoint's own injection point for the three tail dependencies a
      # hermetic test cannot drive: the credentialed investigation lifecycle, the HTML render,
      # the case-ticket endpoint — each keyword-only with a production default, the shape
      # `_run_investigation_lifecycle` already uses one layer in. Coined like the two above;
      # the graph follows the code if the implementation spells it otherwise.

    # ---- the shared refusal predicate R3 demands ------------------------------------
    - id: learning_refusal_gate
      provenance: design
      facets:
        access:
          constraints_by_via:
            learn-enqueue:
              trust: attacker-influenced
              constraints: [refuse-truncated-run, refuse-held-out-alert-copy,
                            require-scrub-verdict]
            curation-enqueue:
              trust: attacker-influenced
              constraints: [refuse-truncated-run, refuse-held-out-alert-copy,
                            require-scrub-verdict]
      # ADD. Trust is `attacker-influenced` on both cells because the thing being judged is
      # the run's own alert copy and the model-authored text derived from it — PR5 confirms
      # the curator receives the investigation's goal text, bound parameters and rendered
      # queries VERBATIM, into a committed corpus every later investigation reads at
      # planning time. Note which held-out net is listed: the COPY digest, not the
      # boundary's path containment (PR2).
      # C1/C2: the `learn-enqueue` cell has NO LIVE INVOKER after bullet 1 — the loop CLI
      # never called the learn enqueue (H1 refuted) and the investigation tail's call site
      # is the one bullet 1 removes. The cell stays and the parity demand stays with it,
      # because the extracted predicate is shared SOURCE, not a shared call path: with only
      # one live caller left, drift between the two enqueues is exactly what nothing else
      # would catch.

    # ---- the investigation tree and the property that orders its consumers -----------
    - id: investigation_run_tree
      provenance: code
      facets:
        access:
          constraints_by_via:
            pre-certification-consumers:
              trust: attacker-influenced
              constraints: [no-read-before-scrub-verdict]
            curation-enqueue:
              trust: attacker-influenced
              constraints: [no-read-before-scrub-verdict]
            ticket-close:
              trust: attacker-influenced
              constraints: [no-read-before-scrub-verdict]
              # WAS the R0 hole, grounded not guessed (H2): the ticket-close step reads the
              # run dir and was NOT a member of the hand-written property, so its ordering
              # held BY POSITION rather than by any check. SETTLED by R17 — it joins the
              # membership, and the cell carries the same constraint as its two siblings.
              # The gate.holes entries below stay as the record of the firing and its
              # answer; the `unknown` they were raised on is gone.
    - {id: tree_consumer_property, provenance: code, facets: {}}
      # H3: an INLINE TUPLE inside the ordering test, not a module-level constant — there
      # is no identifier to rename and no import to follow. Its members were the artifact
      # listing, the table cross-check, the departing learn enqueue, and the visualization
      # step. Under this change the learn enqueue LEAVES and two join: the curation enqueue
      # (R6) and the ticket close (R17). A test asserting membership has to walk that tuple.
    - {id: spec_graph_540, provenance: code, facets: {}}
      # The shipped graph whose demand binds that property.

    # ---- the operator's opt-out ------------------------------------------------------
    - id: no_learn_flag
      provenance: code
      facets:
        domain:
          type: bool
          refinement: {nl: "the operator's explicit `--no-learn`; absent by default,
            never persisted to the run dir, the summary or the session store"}
          default: false
          distinguished: ["true"]
          falsy_valid: true
          documented_alternatives:
            - {value: held-out-scoring-run, crosses_validation: true}
              # The held-out eval procedure DOCUMENTS `--no-learn` as its way of running a
              # scored alert. It crosses validation: under the shipped default the flag
              # suppresses curation completely, and a trigger that ignores it makes that
              # documented invocation start feeding the committed catalog. R14 settles the
              # branch fail-closed, so this column is now a decided contract, not an open one.
    - {id: no_learn_help, provenance: code, facets: {}}
      # MODIFY (R14). The `--no-learn` flag's own help text on the investigation entrypoint —
      # a distinct surface from the learning CLI's help (`loop_cli_help`, a different
      # program). Facetless: the change alters what the text SAYS, and decides nothing about
      # a contract. R14 makes the flag govern a lane its name does not name, and this is the
      # only place an operator could find that out.

    # ---- the retired stage's three knobs ---------------------------------------------
    - id: ORACLE_MODEL
      provenance: code
      facets:
        domain:
          type: str
          refinement: {nl: "a claude-* model id or a Fireworks alias; anything else raises
            at provider resolution, and an empty value is passed through unchanged rather
            than coerced to the default"}
          default: glm-5.2
          distinguished: []
          falsy_valid: false
          documented_alternatives:
            - {value: claude-*, crosses_validation: true}
              # E4/R13: keys are sourced PER PROVIDER. The shipped default and both other
              # models are aliases of the SAME provider, so the oracle contributes no key
              # var the actor does not already contribute — and the end-to-end demand is
              # observable ONLY in this column. It crosses validation because the run then
              # needs a second provider's key that the shipped default never needed.
    - {id: ORACLE_EFFORT, provenance: code, facets: {}}
    - {id: ORACLE_MAX_CONCURRENCY, provenance: code, facets: {}}
      # Facetless deliberately: the change removes the learning cycle's READ of them and
      # decides nothing about their contracts. The schema stays quiet where there is no
      # contract; the survival demand carries the "dead here, live there" assertion.

    # ---- the learning run dir, the artifact that leaves, and the signal that replaces it
    - id: learning_run_dir
      provenance: code
      facets:
        identity:
          key_axes: [run_id, direction]
          evidence: {nl: "`<state root>/runs/<run_id>/`, with each leg's artifacts named
            per direction — read off the path template and the direction record's own name
            fields, and re-confirmed at this base by
            `spec-graph trace resource learning_run_dir` (C16)."}
          derivations: []
          sharing: unique-key
    - {id: projected_telemetry, provenance: code, facets: {}}
      # REMOVE from the learning cycle. Facetless: the change deletes the write rather than
      # altering a contract, and the surviving eval's staging copy keeps its own geometry —
      # asserting a key here would be a fabricated invariant.
    - {id: telemetry_name, provenance: code, facets: {}}
      # REMOVE. Today a NON-optional field on the direction record (E8), which is what
      # forces FK1 to be a decision rather than a deletion.
    - id: artifact_names
      provenance: code
      facets: {}
      # MODIFY: the declared tuple loses the telemetry name and its `.raw.txt` fallback.
      # E8: the leg-ran check asks whether ANY declared name exists, so a declared-but-
      # unwritten name cannot make the check FAIL — it can only render an empty section.
    - id: leg_status
      provenance: design
      facets:
        domain:
          type: str
          refinement: {nl: "the leg's own record of whether it was never selected, ran to
            completion, or started and died — a per-leg status field the leg writes into the
            run's record, replacing the inference of 'this leg ran' from the presence of any
            declared file"}
          default: unrecorded
          # WAS the R0/R4 hole: R2 said "a status field or a written marker" without
          # choosing. SETTLED by R15 — a STATUS FIELD, because a marker leaves a leg that
          # died mid-write indistinguishable from one never selected. The default is the
          # value the viewer reads for a run dir written BEFORE the field existed; R15's
          # accepted cost is that such run dirs carry nothing, so the viewer needs this
          # stated rather than inferring one of the two real states. The token is the
          # graph's (recorded in handoff.deviations, like the other coined ids) — the graph
          # follows the code if the implementation spells it otherwise.
          distinguished: [never-selected, started-and-died, unrecorded]
          falsy_valid: false
          documented_alternatives: []

    # ---- the judge's inputs and outputs ------------------------------------------------
    - id: judge
      provenance: code
      facets:
        payload:
          parts:
            - {role: system, source: const:JUDGE_PROMPT}
            - {role: user, source: template:comparison_dir,
               slots: {evidence: comparison_dir}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "MODIFY: the judge's turn after the cut is the direction's prompt plus the
            per-lead comparison text — and nothing else. The projection path leaves the
            signature, which is a change to the subagents PROTOCOL every hermetic fake in
            the suite implements (E7), not an internal edit."
    - id: comparison_dir
      provenance: code
      facets:
        identity:
          key_axes: [run_id, direction, lead_id]
          evidence: {nl: "one `<lead_id>.md` per executed lead, under the direction's
            comparison directory inside the learning run dir — read off the per-lead
            writer's own filename template."}
          derivations: []
          sharing: unique-key
        payload:
          parts:
            - {role: executed_evidence, source: template:real_sample_text,
               slots: {events: real_sample_text}}
            - {role: defender_reasoning, source: template:investigation_run_tree,
               slots: {invlang: investigation_run_tree}}
          invariants: [roles-disjoint-sources, all-slots-bound]
          nl: "MODIFY, three parts to two: the run's own executed queries and raw sample
            events for shape orientation, and the defender's own invlang reasoning. The
            projection column and any placeholder standing in for it are gone. Both
            surviving parts are model- or alert-derived text rendered into a fenced block
            inside a markdown frame — the chooser of every value here is the run itself,
            not the author."
    - {id: judge_manifest, provenance: code, facets: {}}
      # FACETLESS as of §7 round 4 (finding 8). It carried an identity facet keyed on run and
      # direction, on evidence that read the renderer's call site as a write. It is not: the
      # renderer RETURNS a string and the invocation builder splices it into the judge's turn.
      # No manifest file is written anywhere in the tree, and a boundary describing a sink
      # that is never written flags downstream as an unrealized address in exactly the
      # reconciliation write-code-from-spec runs. Its coverage content is pinned where it
      # really lives — inside the judge's rendered turn.
    - {id: JUDGE_PROMPT, provenance: code, facets: {}}
    - {id: JUDGE_BENIGN_PROMPT, provenance: code, facets: {}}
      # MODIFY, both: C12 — each defines EVERY verdict value in terms of the projection,
      # roughly a dozen sites apiece, and keys `undecidable` on an empty projection. Shared
      # by the run cycle and all three eval callers (E5), which is why the rewrite reaches
      # the evals bullet 5 promised to leave working.

    # ---- artifacts outside the product -------------------------------------------------
    - {id: loop_cli_help, provenance: code, facets: {}}
    - {id: dead_code_baseline, provenance: code, facets: {}}
    - {id: spec_graph_774, provenance: code, facets: {}}
    - {id: project_profile_census, provenance: code, facets: {}}

  interacts:

    # ---- bullet 1: the investigation stops feeding the offline pipeline ---------------
    - {from: run_investigation, to: enqueue_learning, mode: remove, via: api,
       provenance: design}
    - {from: run_investigation, to: learn_queue, mode: remove, via: fs,
       provenance: design, interpolates: [run_id]}
      # DELETED by C1/C2: `interacts(loop_cli->enqueue_learning)` used to sit here, declared
      # as the surviving hand path on the strength of the then-unprobed H1. The probe
      # refuted it — the CLI's positional makes ZERO calls to the enqueue helper and never
      # creates the queue directory. The real surviving path is `drives(loop_cli->run_one)`
      # below, which this graph already carried with code provenance. With this edge gone
      # `enqueue_learning` has no live in-edge at all, which is the structural statement C1
      # is making: post-change the learn queue has no feed, hand or automatic.

    # ---- bullet 2: the run cycle stops enqueuing for authoring ------------------------
    - {from: run_one, to: enqueue_for_authoring, mode: remove, via: api,
       provenance: design}
    - {from: run_one, to: author_queue, mode: remove, via: fs, provenance: design,
       interpolates: [marker_name]}

    # ---- bullet 3: the oracle stage and its artifact leave the leg --------------------
    - {from: run_direction, to: oracle, mode: remove, via: api, provenance: design}
    - {from: run_direction, to: projected_telemetry, mode: remove, via: fs,
       provenance: design, interpolates: [direction]}
    - {from: run_direction, to: telemetry_name, mode: remove, via: api,
       provenance: design}
    - {from: run_direction, to: ORACLE_EFFORT, mode: remove, via: env,
       provenance: design}
    - {from: run_direction, to: ORACLE_MAX_CONCURRENCY, mode: remove, via: env,
       provenance: design}
    - {from: run_direction, to: artifact_names, mode: write, via: api,
       provenance: design}
    - {from: run_direction, to: leg_status, mode: write, via: fs, provenance: design,
