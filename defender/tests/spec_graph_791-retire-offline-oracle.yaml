  - id: H4
    kind: referential
    claim: "The learn drain has no has-work probe: it globs the queue directory directly, so
            an absent root and an empty one produce the same output."
    probe: "Read all three drains and their has-work gates."
    probe_kind: read
    observed: "The other two drains have has-work probes; the learn drain does not, and its
               count line is computed from the glob. The inflight subdirectory is created
               only when markers exist."
    verdict: holds
    note: "Grounds the operator-liveness demand. The asymmetry between the three drains is
           real, not a modelling artifact."

  - id: H5
    kind: referential
    claim: "The dead-code lint baseline maps a finding fingerprint to a reason string, with
            the empty string meaning un-triaged, and CI fails on a finding absent from it."
    probe: "Read the baseline file's header and entry shape."
    probe_kind: read
    observed: "A JSON object whose entries map the finding text with its line number stripped
               to an annotation; the header instructs annotating intentional entries and
               marks empty strings as un-triaged."
    verdict: holds
    note: "This is what makes 'baseline the new findings with a stated reason pointing at
           #791' a real assertion rather than prose — and what makes R1's producer move
           necessary for the entry to be honest."

  - id: H6
    kind: referential
    claim: "The retired stage's model knob defaults to a Fireworks alias, and a claude-* id
            resolves to the other provider with a different key variable."
    probe: "Read the config default, the provider registry, its alias map and the key-var
            accessor."
    probe_kind: read
    observed: "The default is a Fireworks alias; the two providers are Anthropic and
               Fireworks, each with its own key var, and resolution is by alias then by
               prefix. An unknown name raises."
    verdict: holds
    note: "Grounds the knob's domain facet and the crossing alternative — the only column in
           which the key-sourcing demand has a witness."

  - id: H7
    kind: referential
    claim: "The environment-string helper returns an empty value unchanged rather than
            coercing it to the default."
    probe: "Read the helper."
    probe_kind: read
    observed: "It is a plain environment lookup with a default for the ABSENT case only; an
               empty value passes through and then raises at provider resolution."
    verdict: holds
    note: "So the falsy member is not the classic swallow shape here — which is why the knob
           declares no distinguished falsy member and the consensus premise about an unset
           value belongs to the DEFAULT column instead."

