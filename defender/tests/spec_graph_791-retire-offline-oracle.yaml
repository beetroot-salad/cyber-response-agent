      # `refusals_have_one_owner_across_both_enqueues` still answers it. What is gone is the
      # claim that anything in production still WALKS that path.
    - {from: run_investigation, to: investigation_run_tree, mode: read,
       via: curation-enqueue, provenance: design}
    - {from: run_investigation, to: no_learn_flag, mode: read, via: argv,
       provenance: design}
    - {from: lead_author_drain, to: author_queue, mode: write, via: fs,
       provenance: code, interpolates: [marker_name]}
      # Quarantine and retry-rewrite, both from inside the lead-author leg.
    - {from: lead_author_drain, to: author_queue, mode: read, via: fs, provenance: code}
      # The serve: the lane reads a marker's contents at the top of its pass and unlinks it by
      # PATH at the bottom. Modelled as of R18 because rules.md's own sharpening applies —
      # an identity boundary that is also READ makes an under-covering or reused key a
      # read-path defect, not merely a lost write, and here the reader deletes what it never
      # read. R4's case-keying is what puts a second request on that path.

    # ---- the live stage that keeps the retired name (R19) -----------------------------
    - {from: challenge_gate, to: projection, mode: invoke, via: api, provenance: code}
      # MODIFY: the dispatch key and the fault tuple this call is recorded under.
    - {from: challenge_gate, to: review_live_trace, mode: write, via: fs, provenance: code}
      # MODIFY: the filename the projection stage's trace lands under in every run dir.

    # ---- the entrypoint's tail seam (R22) ----------------------------------------------
    - {from: run_investigation, to: investigation_tail_seam, mode: invoke, via: api,
       provenance: design}

    # ---- bullet 6b: the key-sourcing path ---------------------------------------------
    - {from: run_one, to: ORACLE_MODEL, mode: remove, via: env, provenance: design}

    # ---- the queue R10/R11 make production-facing --------------------------------------
    - {from: learn_drain, to: learn_queue, mode: write, via: fs, provenance: design,
       interpolates: [run_id]}
      # MODIFY + ADD: the claim into `inflight/`, the unlink on success, the quarantine —
      # and the reclaim R10 puts in scope, which today does not exist.

  drives:
    - {from: operator, to: run_investigation, provenance: code, multiplicity: serial}
      # The retry frame. Two investigations of one case is the composition R4's identity
      # decision is about, and a single-investigation test cannot see it.
    - {from: operator, to: loop_cli, provenance: code, multiplicity: serial}
    - {from: loop_cli, to: run_one, provenance: code, multiplicity: serial}
    - {from: loop_cli, to: learn_drain, provenance: code, multiplicity: serial}
    - {from: loop_cli, to: lead_author_drain, provenance: code, multiplicity: serial}
    - {from: learn_drain, to: run_one, provenance: code, multiplicity: serial}
    - {from: run_one, to: run_direction, provenance: code, multiplicity: concurrent}
      # Inherited from #774: the direction legs run concurrently into the shared run dir.
    - {from: run_direction, to: build_comparison, provenance: code, multiplicity: serial}
    - {from: run_direction, to: render_manifest, provenance: code, multiplicity: serial}

claims:

  # ===========================================================================
  # INHERITED FROM THE GROUNDING BRIEF (ids kept). Two are REFUTED and both
  # refutations are load-bearing: S4 halted the run and re-scoped it; C13b
  # multiplied the sweep radius fivefold.
  # ===========================================================================

  - id: S1
    kind: referential
    claim: "`AgentRole.PROJECTION` exists as a distinct enum member at the base commit,
            with its own definition bound at the live projection call site."
    probe: "Read the role enum, the review-roles module's deps classes and definitions,
            and the live-stage factory that binds each definition to a trace name."
    probe_kind: read
    observed: "The enum carries PROJECTION = \"projection\". The definition is its own
               AgentDefinition with its own deps class, an empty tool set and the shared
               review-model resolver, bound at the projection slot."
    verdict: holds

  - id: S2
    kind: referential
    claim: "The live projection input builder passes run_dir, counter-story and bare lead
            ids and asks for a three-value tag per executed lead; no query envelope, no
            sample event."
    probe: "Read the builder in full and its single call site in the challenge gate."
    probe_kind: read
    observed: "Four lines and one instruction naming the three tags. No envelope, no
               sample, no what-to-summarize."
    verdict: holds

  - id: S3
    kind: referential
    claim: "The offline oracle prompt is a 114-line baseline-diff contract over per-lead
            query envelopes — a different input shape from the live stage's."
    probe: "Line count and a read of the prompt's opening contract and its four-way delta
            frame."
    probe_kind: read
    observed: "114 lines. It demands a signed diff over the baseline keyed to four
               movements, and its stated inputs are the story, the what-to-summarize, the
               lead's queries with params and window, and one scrubbed sample event —
               none of the last three reach the live builder."
    verdict: holds
    note: "This is what makes fork 1's rejected port expensive, and the rejection sound.
           probe_kind normalized from `executed` to `read`: a referential claim closes on
           an inspection, and the line count is one."

  - id: S4
    kind: census
    claim: "One queue directory is drained by two consumers — the lesson/corpus author
            drain and the lead-author drain — and a single authoring enqueue feeds both."
    probe: "Resolved references on the authoring enqueue (24 refs, 4 files); an exhaustive
            queue-directory reference sweep over the whole tree including tests; a read of
            both drains' has-work gates and both bodies; `spec-graph trace resource
            author_queue` after declaring the root."
    probe_kind: search
    observed: "The queue directory is referenced in exactly three production modules, and
               all five drain-side sites are inside the LEAD-AUTHOR leg. The lesson/corpus
               drain's has-work gate counts rows in each curator's pending JSONL against a
               threshold env and opens no directory. ONE reader, not two."
    verdict: refuted
    note: "THE RUN'S HALT. The design's fork-2 trade-off and the issue's collateral note
           both rested on a shared queue that does not exist. Re-settled by 01-resolutions
           F2: curation gets its own trigger at the investigation boundary."

  - id: S5
    kind: census
    claim: "Two enqueue seams are in scope: the investigation's learning enqueue and the
            run cycle's authoring enqueue."
    probe: "Resolved references on both marker functions and on the run-cycle entry point."
    probe_kind: search
    observed: "Both exist and each has exactly one production call site — but they are not
               peers: the second is downstream of the first (C7)."
    verdict: holds

  - id: C6
    kind: census
    claim: "The author queue has exactly one reader in the whole tree — the lead-author
            drain — and one production writer."
    probe: "As S4, cross-checked against the raw grep floor: the resolver saw 4 files where
            grep saw 4, so no lexical hit was dropped."
    probe_kind: search
    observed: "Writer: the authoring enqueue at the run cycle's tail, OUTSIDE the
               directions guard. Readers: the lead-author marker drain and its has-work
               probe. Quarantine and retry-rewrite also write, from inside that same leg."
    verdict: holds

  - id: C7
    kind: census
    claim: "The author queue is reachable in production ONLY through the learn queue; the
            run cycle's entry point has two production callers, the learn drain's default
            worker and the operator's bare-run-dir CLI invocation. No cron, no CI, no
            subprocess re-exec."
    probe: "Resolved references on the run-cycle entry point (17 refs, 6 files; the grep
            floor was 16 files, so 10 were lexical false positives); read the CLI's flag
            dispatch end to end; searched shell, workflow, docs and Makefile surfaces for
            every drain flag."
    probe_kind: search
    observed: "Every invocation is an operator running the loop CLI by hand; CI runs tests
