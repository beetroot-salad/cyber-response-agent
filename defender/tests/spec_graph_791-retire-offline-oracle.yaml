    - {from: run_direction, to: JUDGE_PROMPT, mode: read, via: fs, provenance: design}
    - {from: run_direction, to: JUDGE_BENIGN_PROMPT, mode: read, via: fs,
       provenance: design}

    # ---- bullet 5: the eval entry points that keep driving the retired machinery ------
    - {from: secondary_eval, to: oracle, mode: invoke, via: api, provenance: code}
    - {from: secondary_eval, to: projected_telemetry, mode: write, via: fs,
       provenance: code}
    - {from: secondary_eval, to: ORACLE_MODEL, mode: read, via: env, provenance: code}
    - {from: secondary_eval, to: JUDGE_PROMPT, mode: read, via: fs, provenance: code}
    - {from: oracle_golden_replay, to: oracle, mode: invoke, via: api, provenance: code}
    - {from: oracle_golden_replay, to: ORACLE_MODEL, mode: read, via: env,
       provenance: code}
    - {from: oracle_golden_replay, to: ORACLE_EFFORT, mode: read, via: env,
       provenance: code}
    - {from: oracle_golden_replay, to: ORACLE_MAX_CONCURRENCY, mode: read, via: env,
       provenance: code}
    - {from: judge_equivalence, to: judge, mode: invoke, via: api, provenance: code}
    - {from: judge_equivalence, to: JUDGE_PROMPT, mode: read, via: fs, provenance: code}
    - {from: run_judge_ab, to: judge, mode: invoke, via: api, provenance: code}
    - {from: run_judge_ab, to: JUDGE_BENIGN_PROMPT, mode: read, via: fs,
       provenance: code}

    # ---- bullet 6a: the curation trigger at the investigation boundary ----------------
    - {from: run_investigation, to: enqueue_curation, mode: invoke, via: api,
       provenance: design}
    - {from: run_investigation, to: enqueue_for_authoring, mode: invoke, via: api,
       provenance: design}
    - {from: run_investigation, to: author_queue, mode: write, via: fs,
       provenance: design, sends: payload, interpolates: [case_id]}
    - {from: run_investigation, to: learning_refusal_gate, mode: invoke,
       via: curation-enqueue, provenance: design}
      # DELETED by C1/C2 for the same reason: `interacts(loop_cli->learning_refusal_gate)`
      # via `learn-enqueue` attributed the learn-enqueue refusal path to the CLI, which is
      # the same refuted hand feed one layer down. The `learn-enqueue` access cell survives
