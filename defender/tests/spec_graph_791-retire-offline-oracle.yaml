handoff:

  forks:
    - "S4 (the shared author queue) REFUTED at grounding and re-settled: catalog curation
       gets its own trigger at the INVESTIGATION boundary, where bullet 1 cuts, and bullet 2
       removes the old call site so curation has exactly one trigger rather than a live one
       plus a dead one. Rejected: keeping both (a dormant second trigger that double-enqueues
       if offline learning is ever re-enabled), and letting curation go quiet."
    - "FK1 (the declared artifact list) settled by R2: DROP the name and give the viewer a
       positive signal. Rejected: leaving it declared with nothing writing it — invisible by
       construction, and run dirs already on disk render old bytes as this run's projection."
    - "FK2 settled by 02-resolutions: rewrite both judge prompts against real data only and
       explicitly skip the three prompt-sharing eval callers with a stated reason. Rejected:
       forking the prompts (two vocabularies that drift, destroying the one property
       judge-equivalence exists to check) and leaving the evals running against a prompt that
       ignores their input (green tests measuring nothing)."
    - "FK3 (which refusals the new trigger inherits) RE-OPENED by probe and settled by R3:
       extract a shared predicate rather than copy, and carry the COPY-KEYED held-out net
       instead of the boundary's path containment. Both the design's 'all four carry over'
       and the strong author's 'two cannot carry over' were refuted."
    - "FK4 settled by R13: pin the run cycle's key-sourcing path only; the shared preparation
       helper's model set is untouched and the secondary eval keeps sourcing its own key."
    - "FK5 confirmed by R8: re-key the live projection stage's graph id rather than inheriting
       the spelling."
    - "SETTLED by R14 — `--no-learn`. R3 named three constraints for the shared predicate and
       did not say whether the operator's opt-out is a fourth. It is: the flag governs
       CURATION as well as learning, and the assembler's fail-closed pin
       (`curation_honours_no_learn`) is the decided reading. Rejected: leaving the branch
       open, which makes the held-out eval's own documented invocation feed the committed
       catalog and leaves the copy-keyed digest as the sole net. Accepted cost: an operator
       who wants to skip learning while keeping curation loses that, and the flag's name no
       longer describes what it governs — repaired by `no_learn_help_names_curation`."
    - "OPEN, and genuinely so — R5 settles that an empty comparison set is RECORDED as an
       observable state. It does not settle whether the judge is driven over one. Both later
       seams left it open deliberately; the suite asserts nothing about it, which is the
       correct shape for an undecided branch. It transfers to write-code-from-spec."
    - "SETTLED by R21 — the curation trigger sits ABOVE the render step, ratified rather than
       inherited. The suite had encoded that placement and nobody had chosen it, which made a
       test author's ordering a spec requirement. It is the riskier of the two placements: the
       alternative (below the render) removes the hazard instead of guarding it, and with it
       most of what R4's isolation demand protects. Taken because a corpus optimisation must
       never be the reason an investigation loses its human-facing output, and the isolation
       demand — now including the EXIT STATUS half, driven through R22's seam — is what makes
       that guarantee checkable rather than positional."
    - "SETTLED by R15 — `leg_status`'s value vocabulary. R2 said 'a status field or a written
       marker' and did not choose; it is a per-leg STATUS FIELD in the run's record, so the
       viewer reads one place to separate never-selected from started-and-died. Rejected: the
       presence-based marker, which leaves a leg that died mid-write indistinguishable from
       one never selected. Accepted cost: every existing reader must tolerate the new field,
       and pre-change run dirs carry none, so the viewer needs a stated default."
    - "SETTLED by R17 — the pre-certification consumer property DOES cover the ticket-close
       step. R6 made the membership the property; the assembler found the list omits a step
       that reads the tree (H2), so it joins. Accepted cost: a pre-existing gap is fixed under
       this issue's name."
    - "SETTLED by R16 — all five gate-minted demands are accepted, none waived. Three are
       security-shaped and cost far more once the code exists; one is proven by an executed
       probe rather than hypothesized. The filename-collision demand was RE-OPENED after an
       earlier drop that rested on a probe citation not present in this ledger — an
       unverifiable citation is not a pass, so the demand stands."
    - "CLOSED by probe, not by decision — the surviving hand path onto learning. There is no
