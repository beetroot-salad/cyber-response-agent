    # ---- valued inputs -----------------------------------------------------
    - id: user_version
      provenance: design
      facets:
        domain:
          type: int
          refinement: {nl: "PRAGMA user_version. O2 refuses an unknown version rather than migrating (runs are disposable). is:PO1 probed the real default: a never-versioned file reads 0."}
          default: unknown     # UNKNOWN — FK21(i): is 0 'the first version' or 'unknown'? If the writer stamps 1, creating a store and opening one need different entry points, or a fresh file is unreadable. A finding, not a null.
          distinguished: [0, 1, 2]
          falsy_valid: false
          documented_alternatives: []
    - id: exit_reason
