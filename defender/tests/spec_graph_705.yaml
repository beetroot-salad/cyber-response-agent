schema_version: 1
design: "705"
base: 4e4645aa   # the fork commit write-code-from-spec's gate diffs against

# ---------------------------------------------------------------------------
# The spec is written against the AMENDED contract, not #705's body:
#   R1/R2 (00-entry-resolutions), R3/R4/R5 (15-refutation-resolutions) — all binding,
#   all superseding the doc on conflict — plus the phase-C re-ground probes
#   (47-reground-{sqlite,runtime,adversarial}.md), which OVERTURN several dispositions
#   45-dispositions.md recorded. Where a probe refuted a disposition, the artifact
#   carries the PROBED reality; the superseded classification is named in `handoff.refuted`.
#
# Name reconciliation applied here (grounding × demand-extraction × dispositions coined
# ids independently; unified by role+origin):
#   store_path + session_store    -> `session_store`   (one file, two names; the resolver
#                                     became the actor `resolve_store_path`)
#   run_stage (brief) + pydantic_stage (demands) -> `pydantic_stage`
#   actor (demands, two senses)   -> `boxed_agent` (the runtime agent in the box) and
#                                     `actor_agent` (the gray-box malicious/benign actor)
#   RequestLogger (brief)         -> folded into `run_investigation` (driver.py:143-144, :391
#                                     construct and drive it; the demands name run_investigation)
#   DEFENDER_COMPACTION "1"       -> one distinguished cell, not distinguished + alternative
#
# Change kinds (rules.md Procedure 1 — assigned FROM THE DESIGN; no implementation exists,
# so no code diff can supply them) are carried in the per-element comments below:
# `add` on every provenance: design element, `remove` on the two `mode: remove` edges,
# `modify` where a code element's semantics change (marked MODIFY).
# ---------------------------------------------------------------------------

demands:

  # =========================================================================
  # #0 — THE RETURN-VALUE CONTRACT (R5 closed F1: one reader entry point, two
  #      return shapes). Resolve first; every assertion below depends on it.
  # =========================================================================

  - {id: render_ignores_its_input_and_returns_the_store_render, kind: behavior, form: test,
     discharged_by: test_render_ignores_its_input_and_returns_the_store_render,
     binds: ["interacts(render->session_store).response", "drives(run_investigation->render)"]}
     # fork: FK4 — O16 ("ignores its input") vs O20 ("identity with DEFENDER_COMPACTION unset").
     # auth:P5 CONFIRMS the mechanism is wire-identical with the fold off, but SCOPED: the
     # stand-in was a round-trip processor, not the real hydrate. FK4 stays open.

  - {id: hydrate_returns_the_root_to_tip_path_in_order, kind: behavior, form: test,
     discharged_by: test_hydrate_returns_the_root_to_tip_path_in_order,
     binds: ["interacts(render->message)", "message.identity"]}

  - {id: open_store_returns_a_per_case_handle, kind: seam, form: test,
     discharged_by: test_open_store_returns_a_per_case_handle,
     binds: ["session_store", "interacts(run_investigation->session_store)"]}
     # fork: FK1 — `case_id` has no runtime carrier; O11/O13 cannot both hold under
     # `case_id == run_dir.name` (the reading six live sites use). Coupled to FK3.

  - {id: store_reader_return_shape_is_role_scoped, kind: behavior, form: test,
     discharged_by: test_store_reader_return_shape_is_role_scoped,
     binds: ["store_reader", "interacts(store_reader->message_payload).response",
             "store_reader.access[send]", "store_reader.access[analysis]",
             "store_reader.access[actor]"]}
     # R5 as AMENDED BY R8 settles the shape, so this demand is no longer provisional: one
     # entry point takes a role from the closed set {send, analysis, actor}; send/analysis
     # return list[ModelMessage]; actor returns a payload-free (coord, agent_id, kind,
     # tool_name) row projection; truncation belongs to `send` ALONE; the user_version
     # refusal applies to all three. FK6 -> R8, FK14 -> R17 (closed vocabulary, unknown
     # roles refused), FK20 -> R17 (provenance IS surfaced — see
     # the_synthesized_flag_is_surfaced_to_the_analysis_shape). The `send` access member is
     # NEW: 75-reclassification red flag 4 found the role vocabulary grew from two names to
     # three with no boundary member naming the third.

  # =========================================================================
  # STORE — schema, identity, durability  (O1–O5, O13, O14, O33, O34)
  # =========================================================================

  - {id: store_connection_is_strict_fk_wal_with_a_busy_timeout, kind: seam, form: test,
     discharged_by: test_store_connection_is_strict_fk_wal_with_a_busy_timeout,
     binds: ["session_store", "session_store.identity"]}
     # PR1 REFUTES the 3/3 consensus that STRICT rejects a wrong-typed value: a Python bool,
     # a numeric str and an integer-valued float all silently coerce to INTEGER; only a
     # fractional REAL and BLOB are rejected. The demand pins that STRICT/FK/WAL/busy_timeout
     # are SET; it must NOT be written to assert STRICT is the coordinate type guard.

  - {id: reader_refuses_an_unknown_user_version, kind: domain-outcome, form: test,
     discharged_by: test_reader_refuses_an_unknown_user_version,
     binds: ["user_version.domain.distinguished[0]", "user_version.domain.distinguished[1]",
             "user_version.domain.distinguished[2]", "store_reader"]}
     # binds RE-POINTED from the phase-A `[known]`/`[unknown]` labels to the probed members:
     # is:PO1 CONFIRMS a never-versioned file reads 0, so 0 is the un-set sentinel and the
     # refusal must be symmetric above the known range. fork: FK21(i) — is 0 "version 0" or
     # "unknown"? (creating a store and opening one then need different entry points).

  - {id: synthesized_rows_occupy_their_own_seq_address_space, kind: uniqueness, form: test,
