handoff:
  # PHASE E (step 8) — every fork below was RESOLVED at §7 (70-resolutions.md, R6-R17) and
  # every resolution is carried into a demand above. The fork entries are kept VERBATIM as
  # the decision record; read each with its resolution:
  #   FK1+FK3+FK1b -> R6 (minted case_id + a {case_id, store_path} run-dir pointer file)
  #   FK2  -> R7  (two digests joined on (session_id, run_step); equality asserted NOWHERE)
  #   FK4  -> R10 (store-authoritative in both configurations; the flag gates only the fold)
  #   FK5  -> R17 ("fold off" and "render off" separated)
  #   FK6  -> R8  (truncation is a property of the `send` role ONLY — AMENDS R5)
  #                RATIFIED AT THE PHASE-E REPAIR ROUND (F6): R8 permitted EITHER "three roles"
  #                OR "an equivalent `truncate` flag defaulting on for send and off for
  #                analysis", and phase E closed the second off in the suite by asserting
  #                `tuple(ss.ROLES) == ("send", "analysis", "actor")` — deciding in the tests
  #                what §7 left open. The narrowing is ratified explicitly rather than assumed:
  #                THE THREE ROLES ARE THE CONTRACT AND THE `truncate`-FLAG VARIANT IS OUT.
  #                Ground: the flag variant leaves `actor`'s default unstated (75-reclassification
  #                red flag 2 caught exactly this and recorded it undecided), while roles carry
  #                FK14/R17's closed-vocabulary refusal of an unknown value naturally. The
  #                existing assertion stands unchanged; this ratification narrows R8 to one of
  #                the two formulations R8 itself offered and re-opens no §7 decision.
  #   FK7  -> R11 (a true `finally`; truncated_by widened; visualize() ordered after)
  #   FK8  -> R12 (a fifth harness seam: a store factory on run_investigation)
  #   FK9  -> R17 (O6's unreachable second discharge dropped)
  #   FK10 -> R17 (frontier identity keyed in the STORE on (session, boundary))
  #   FK11 -> R13 (wire-position dedupe; compaction_dryrun stays on the log; the SAVINGS
  #                FIGURE is the invariant being preserved)
  #   FK12 -> R14 (consumed-field equivalence per reader, reader list frozen; coordinate
  #                re-minted as {session_id}/{agent_id}#{seq} as an ACCEPTED, TESTED change)
  #   FK13 -> R17 (O26's exemption clause NAMES `_pydantic_stage`; the read is control flow)
  #   FK14 -> R17 (role vocabulary closed, unknown roles refused, no row-id entry point)
  #   FK15 -> R17 (one commit per render boundary)
  #   FK16 -> R17 + this phase (args family probed and the domain extended; the session
  #                predicate decided as a design question — gather_boundary_is_scoped_to_one_session)
  #   FK17 -> R16 (case_id validated as a slug at the resolver; escaping demand on the
  #                store-backed HTML path)
  #   FK18 -> R17 (the last-render cursor persisted on the session row)
  #   FK19 -> R17 (canonical JSON for config_sha, all four fields required)
  #   FK20 -> R17 (synthesized provenance surfaced to the analysis shape)
  #   FK21 -> R17 ((i) 0 is the un-set sentinel; (ii) an application-level coordinate type
  #                guard, PR1 having refuted STRICT as one; (iii) retention/X9 pinned)
  # Waivers: 0. Declined obligations: 0. All four `gl*` obligations carried (gl1 at ordinary
  # priority — an examined non-selection, not a drop).
  forks:
    - "FK1 — `case_id` has no runtime carrier. run.py passes an alert path, a run dir, a run id and a salt; six live sites already read `case_id = run_dir.name`. Under that reading two executions of one investigation get two store FILES, so O13's inheritance and O11's single file are unsatisfiable and every fork demand passes vacuously. Coupled to FK3: the only shape satisfying both is a case id minted per investigation and written into the run dir as a POINTER a run_dir-only child can resolve. Probe auth:P11 first. OPEN."
    - "FK1b — identity uniqueness and the ticket screen. O13 asserts `ticket_screen.self_case_key` keys on case_id; it returns `deps.run_id` and its docstring pins that deliberately. Either O13's clause is corrected (and a fork CAN reach its source's ticket — a real #696 gap) or the re-point is pulled into scope with its own demand. It cannot stay as written, and it sits on a security boundary. OPEN."
    - "FK2 — `wire_sha` cannot be the join key O22 gives it. auth:P1 (EXECUTED) found three transforms between the processor returning and the bytes leaving, so a renderer-stamped digest never equals the wire line and O4 forbids updating the row. Recommendation: keep the renderer's stamp, add a wire-side digest, join on (session_id, run_step), and let INEQUALITY name the merge. OPEN. See handoff.refuted."
    - "FK3 — the store-path resolver across a process boundary: R1 and R4 collide. G28 was deferred at phase A and not re-decided; R4 then moved runtime.html's three data layers onto the store, and that page is rendered by `subprocess.run([sys.executable, visualize_run.py, run_dir])` — a process holding a run dir and nothing else. Also carries a THIRD failure posture (visualize()'s swallowed non-zero exit) beside O19's fail-closed and O27's log guard. Conserves the brief's G25/G26/G27/G28 questions. OPEN."
    - "FK4 — is main store-rendered with DEFENDER_COMPACTION unset? O16 ('ignores its input, store authoritative by construction') and O20 ('the renderer is identity-plus-ingest') describe the same moment differently, and unset is the configuration CI actually runs. auth:P5 confirms the MECHANISM is wire-identical but is SCOPED to a stand-in — it does not close FK4. OPEN."
    - "FK5 — 'fold off' and 'render off' are not the same switch. O15/O20 attach the same capability to gather with the fold off; O21 pins as an explicit non-obligation that gather's history is NOT store-rendered. Recommendation: two parameters, gather takes both off, stated so the sentence cannot be re-collapsed at implementation time. OPEN."
    - "FK6 — which entry point truncates, and does the last-complete-pair rule apply to reads that are not sends? R5 says it applies to BOTH shapes; O10 scopes it to sending. Under R5's wording an analysis/judge read cannot see the orphan terminal response M3's run-end flush exists to capture — so the moved projections would silently drop the last response of every truncated run. R5 as literally worded is the thing being amended: needs the human. OPEN."
    - "FK7 — the run-end flush does not cover the exits it claims to. There is no `finally:` and `run` is bound only by the async-with header (G14/F7); `truncated_by` is written only in `except BudgetKill` (G13/F6). The atomicity half (a crash between the truncated_by write and the flush) is genuinely undecided. The R4 firing on exit_reason.domain.distinguished[UnexpectedModelBehavior] is this fork reaching the gate. OPEN."
    - "FK8 — fail-closed's blast radius: does a permission failure and contention past busy_timeout stop the run; does the exception reach the driver unwrapped (ANSWERED by auth:P4 — it does, and nothing catches it); and how does the suite make the store fail at all, given four harness seams, no store seam on run_investigation, and a profile that forbids monkeypatch.setattr? The third is the largest diff on the list and a human call. OPEN (sub-decision (ii) closed)."
    - "FK9 — O6 offers two discharges and one is unreachable: its own last sentence ('a minted row is never in the ingest tail') kills the 'or persisted on the following ingest' branch. Mint-with-RunContext is the only executable reading. Recommendation: delete the 'or' clause rather than leave both in the spec. OPEN."
    - "FK10 — frontier identity: what the reuse lookup is keyed on ((session_id, boundary) vs the boundary's own anchor row) and what a retry does to it. O11 implies the second; the first would be a prefix copy for exactly one row kind. dep:PO6 settles the retry half (once per logical node; a real ModelRetry appends a genuinely new pair). OPEN on the key."
    - "FK11 — compaction_dryrun's migration route: R4 named two options that are NOT equivalent. The store changes both the ordering key the script sorts on and the usage-key shape it sums (X9); a wire-position dedupe changes neither, and `compaction_dryrun_still_runs_end_to_end`'s own seed demands the SAME savings figure. Decide separately whether experiments/.../run_arms.py is in scope; if it is, note that no mechanical check covers it. OPEN."
    - "FK12 — the equivalence bar (F4) and the projected coordinate (F2). Bit-for-bit is unachievable (X2's usage reshape; the two seq counters disagree), so consumed-field equivalence per reader is the bar — but that means something only once the reader list is CLOSED, and R4 enlarged it to runtime.html's six layers, run_stats.py (outside defender/), _replay_harness and visualize_runtime's footer check. Under FK6's truncation reading there is a SECOND exception (the terminal response), so 'equivalent except the coordinate' is already two exceptions. OPEN."
    - "FK13 — the wording of O26's exemption clause. 3/3 agree it must name `_pydantic_stage` by path and say the read survives as CONTROL FLOW; routed only because phase B marked both premises. The cheapest fork on the list; the human can close it in one line."
    - "FK14 — the reader's role vocabulary: what an unrecognized role does, what a missing/None role does, who is trusted to supply the value, whether a direct row-id read of an off-path (folded) row is refused, and whether the CURATOR (G16's second gray-box boundary) reads the store at all. R5 makes the leak preventable by a BRANCH, so a fail-open default would put a security boundary on a caller-supplied value with no enumeration. OPEN."
    - "FK15 — the transaction granularity of an append. O33 splits payload into its own table; O10 says the pair is NOT a storage transaction; nothing says what IS one. The message->message_payload FK makes an untorn row pair a schema requirement, not a preference — under no wrapping transaction the store can hold rows that violate O5 with no writer at fault. The resume half (append atop an orphan vs refuse) is a real ought. OPEN."
    - "FK16 — args shapes outside the enumerated three (now PROBED — see RG-2/RG-3) and whether gather_boundary scopes by session. The second half is NOT a probe question: O3 keys rows by session_id, O1 keys the FILE by case_id, and O11 puts a fork's rows in the same file, so the view as published cannot be correct for a forked case. Either the view takes a session parameter or the demand states that a multi-session file is out of its contract. OPEN."
    - "FK17 — the trust walk. Four values reach a sink whose sanitizer nobody named. TWO are new surfaces this PR creates and stay open: `case_id` interpolated into a filesystem path by R1's resolver (nothing states it is validated against path-composing characters), and message payload text rendered into transcript.html through a NEW store-backed path (the log-derived renderer's escaping is not inherited by the store-derived one, and R4 makes that path carry every payload the model ever saw). The other two are CORRECTED by probe: adv:PO7 refutes 'nobody asserts a sanitizer exists' for lead_id, and adv:PO5 closes the symlink half on the mount set while opening the host-side leg (RG-1). OPEN on the two new surfaces."
    - "FK18 — the ingest tail across a restart, and the duplicate trailing flush. `len(last_render)` lives only in the driving process's memory; a fresh process recomputes it from nothing, and PR4 confirms a shorter live list silently ingests NOTHING with no diagnostic possible from the slice. Recommendation: persist the last-render length (or last-appended row id) on the session row. OPEN."
    - "FK19 — the config_sha hashing discipline: canonicalised (sorted-key) vs literal serialisation, and whether all four fields are required. A literal serialisation makes the sha depend on dict insertion order across two code paths, defeating O14's stated purpose with no warning signal. OPEN."
    - "FK20 — a synthesized row's provenance is not surfaced to any consumer. The schema records it (`synthesized` is part of O3's UNIQUE key) but nothing propagates it, and R5's analysis shape is `list[ModelMessage]`, which has NOWHERE to carry the flag. A frontier row is the model's own paraphrase of turns that may carry attacker-derived content. OPEN."
    - "FK21 — store housekeeping: eighteen small oughts on the schema, the connection and the file. Three are load-bearing and must not be bundled away: (i) is `user_version 0` 'the first version' or 'unknown' (if the writer stamps 1, creating and opening need different entry points); (ii) STRICT typing — PR1 REFUTES the 3/3 consensus, so the design has no coordinate type guard at all; (iii) retention — X9 settles that dropping payload bodies destroys every per-response cost fact, and the ought is whether the projection degrades gracefully or fails loud. The rest can close under one rule: the store refuses what it did not write and creates what it owns. OPEN."
    - "F2 / F3 / F4 (20-demands.md) — carried OPEN from phase A. F1 was CLOSED by R5. F3's scope half was settled by R4 (compaction_dryrun's reader migrates, `_pydantic_stage` is a named exemption); what survives is FK13's wording. F2 is inside FK12; F4 is inside FK12."
    - "NEW, opened by the re-ground, not present in 45-dispositions.md — (a) the store append's ENCODING: whether a lone surrogate halts the run is decided entirely by an unstated `ensure_ascii` argument (adv:PO4), and a security-relevant availability property must not rest on a keyword nobody wrote down; (b) the HOST-side symlink policy: RG-1 pins that host readers must not dereference out of run_dir, but re-siting the store, or refusing at the walk, is the human's call, because R1 chose the sibling layout precisely to close this leg (adv:PO5b); (c) `lead_id`'s `$` vs `\\Z` and the ENAMETOOLONG evidence-drop (adv:PO7/adv:PO7b) are PRE-EXISTING surfaces — in or out of #705's scope is a scope call, not a design one."
  refuted:
    - "O26's census — REFUTED by G1. The wire log has THREE application consumers, not zero: tool_trace.jsonl (via logger.messages, in-process), runtime.html (via the FILE, in the visualizer subprocess, reachable only through visualize_data.py's re-export), and _pydantic_stage.py:109/115 (control flow). Correction: R4 grew M8 to all three of runtime.html's data layers and migrated compaction_dryrun's reader; `_pydantic_stage` is a NAMED exemption whose read survives as control flow."
    - "O24-as-an-independent-change — REFUTED by G3 (executed). build_transcript has no dedup and no seen-set, so the delta encoding is the only thing making a request row appear once: 12 rows/5 tool-results today vs 42 rows/15 under the verbatim dump, over a 6-request run with ground truth 5. O(N^2) in requests. Correction: O24 and O26 ship together."
    - "O10/O18/C27's `ForkStop` — REFUTED as code by G12 (zero hits repo-wide). It binds a DESIGN-provenance symbol; #696 owns it, and the demands that name it are typed that way."
    - "O10's 'incomplete pair iff truncated_by is set' — REFUTED by G13 of TODAY's driver: truncated_by is written only inside `except BudgetKill`, while UsageLimitExceeded and RunAborted also cut mid-pair. Correction: M3 must WIDEN the write, not merely add the ingest (FK7)."
    - "O28's survival list — CORRECTED by G4: `payload_chars` is not a compaction_dryrun consumer (its only hit is the JSON output key \"history_payload_chars\" at :188). Real surface: compact, FrozenState, CompactionStep, apply_writes, history_chars."
    - "C29 — REFUTED as a complete census (it is true but thin; G2 narrows transcript.html's own wire-log dependency to three header numbers off tool_trace.jsonl)."
    - "U6 — REFUTED AS FRAMED by X1: actor_view projects executed_queries.jsonl, not message history, so M7 cannot subsume it and the question 'can it express actor_view without loss' is malformed as posed. O31/O32 rest on a plain leak test and its positive control."
    - "O22's wire_sha join key — REFUTED by auth:P1 (executed): three transforms stand between the processor returning and the bytes leaving, so a mismatch is the NORMAL case and carries no information. A test asserting digest equality is red against every correct implementation (FK2)."
