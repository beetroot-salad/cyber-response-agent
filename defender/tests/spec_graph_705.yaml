  - {id: "adv:PO6", kind: reachability, claim: "_last_response_is_empty_text's classification is manipulable by crafted content", probe: "probe_po4_po6.py — records built from REAL ModelResponse objects dumped through the same dump_python call observe.py:87 uses and wrapped in observe.py:60-70's record shape, with three positive controls (genuinely empty -> True, ordinary text -> False, ASCII whitespace -> True)", probe_kind: executed, observed: "U+00A0/3000/2028/1680/0085/001C/001F all classify True (visible text read as EMPTY); U+200B/FEFF/NUL classify False (invisible text read as NON-EMPTY); an empty TextPart accompanied by a ThinkingPart or ToolCallPart is False; parts==[] is False. isspace() ground truth confirms the mechanism", verdict: refuted, note: "BREACHED in both directions. THE BOUND nobody in phase B or C noticed: at BOTH call sites (:109-111, :115-117) both branches raise RunUnprocessable — the classifier selects only the MESSAGE, and nothing in the tree matches on 'returned empty output'. The genuinely load-bearing predicate is its neighbour at :119 (`require_output and not out.strip()`), which shares the defect exactly. A test asserting 'the classification gates RunUnprocessable' is NON-DISCRIMINATING"}
  - {id: "adv:PO7", kind: reachability, claim: "a model-authored lead_id can carry traversal or shell metacharacters into the three filesystem compositions", probe: "probe_po7.py — 23 hostile values through the shipped path AND through a POSITIVE CONTROL with the validator removed; provenance established first (gather(ctx, lead_id: str, ...) at tools_gather.py:316-326, reaching query_tool.py:361-362, tools_gather.py:244 and record_lead.py:35-36 by pathlib join, never a shell)", probe_kind: executed, observed: "LEAD_ID_RE = ^l-[A-Za-z0-9]+$ is ONE shared compiled object at all three sites (`is` identity verified) and rejects ../, absolute paths, NUL, newline-mid, CR, ; ` $( | space tab, fullwidth solidus, NFKC-normalising solidus, windows sep and dot-prefix. Control (validator removed): 'l-../../../etc' escapes gather_raw and writes run-1/etc.md; a bare absolute path lands /etc/passwd.md", verdict: unrefuted, note: "HOLDS on a validator, reject-not-sanitise — which REFUTES FK17's 'Nobody asserts a sanitizer exists'. The finding is not 'add a validator', it is 'change $ to \\Z': 'l-abc\\n' passes .match() where .fullmatch() rejects it, creating files whose names end in a newline that judge/compare.py:148 renders into markdown SPLIT ACROSS TWO LINES. FK17's other three values (case_id->path, payload->HTML, lead_id->JSON-path) are untouched by this probe"}
