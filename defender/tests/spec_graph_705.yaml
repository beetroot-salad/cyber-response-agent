             "interacts(gather_dispatch->message)", "interacts(gather_dispatch->gather_raw)"]}
     # positive control: main_history_is_store_rendered. Gather still WRITES rows.
     # fork: FK5 — "fold off" and "render off" are not the same switch; O21 is a pinned
     # non-obligation and wins over the convenience reading of "the same capability".
     # REWRITTEN AT THE PHASE-E REPAIR ROUND (91-blind.md red flag 1). The negative asserted
     # the substring "investigate" absent from gather's model inputs past the first — and that
     # word appears NOWHERE in the conversation this test drives (verified by driving it: zero
     # hits across both arms; the real prompt says "Begin the investigation"), so it was green
     # whether isolation held or not. Worse, the scripted gather answered exactly ONE request,
     # so `gather.seen[1:]` was empty and the assertion loop never ran at all. It now uses a
     # marker the MAIN agent emits into its own history, read back out of main's own next
     # request as the observation channel's positive control, and it binds EVERY out-edge of
     # the gather leg the content could reach — every one of gather's requests, gather's rows
     # under its own agent_id, and the raw payloads it writes under `gather_raw` — rather than
     # only the obvious one.

