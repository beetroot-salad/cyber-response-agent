# ===========================================================================
# THE GATE RECORD IS THE GATE LEAF'S (phase D, step 6) — NOT THE ASSEMBLER'S.
# Its place is kept and deliberately left EMPTY: a fabricated `evaluated` entry
# would certify a rule nobody ran, and `spec-graph gate` reads a missing entry as
# skipped, which is exactly the signal the next leaf needs. The gate leaf runs
# `spec-graph gate <artifact> --residue`, writes a witness per computed firing,
# runs the three judgment halves (R0's bidirectional prose reconciliation, R5's
# tightening extension, R6's chooser/sanitizer walk), and routes the typed residue.
#
# Deliberate inputs the assembler leaves for it (each is a finding, not an oversight):
#   * `message_payload.payload_sha` is bound by no_position_or_payload_hash_diffing_on_ingest
#     and resolves to NOTHING — no obligation defines the column (45-dispositions red flag 5).
#   * `exit_reason.domain.distinguished[UnexpectedModelBehavior]` is bound by no demand — FK7.
#   * five `default: unknown` invariants (user_version, exit_reason, args, stage_output,
#     lead_id) — no slot predicate computes these, so they are named here and in
#     50-graph-digest.md's Red flags so they cannot pass as silent nulls.
#   * `tool_trace.identity` gains a driven writer under M8 with no uniqueness demand (F11/G24).
#   * `run_visualizations` is written by a subprocess whose failure is swallowed (F10/FK3).
#     ^ THE FIFTH INPUT WAS ROUTED NOWHERE by phase D (no obligation, no hole, no drop) and is
#       closed at the phase-E repair round: F1 -> the R0 hole below -> `rp1_the_visualizer_fails
#       _closed_when_it_cannot_resolve_the_store`, and its neighbour F2 -> the R2 obligation on
#       `run_visualizations.identity` -> `gl5`. F3 (the brief's one `no-consequence`, conditioned
#       on a scope §7 grew three times) is re-dispositioned by those same two demands.
# ===========================================================================
gate:
  # `spec-graph gate <artifact> --residue` computed 41 mechanical firings (R1x6, R2x3, R3x9,
  # R4x21, R5x2) plus the three judgment halves below. Every firing is accounted for in
  # obligations/holes/pre_discharged; none is dropped from the tool's list.
  # REPAIR ROUND (93-verify-resolutions.md R18): 42 firings — R2 now fires FOUR times. Modelling
  # `render_and_mirror`'s second driver as structure and marking R4's modification of the write
  # edge as delta membership is what let the fourth fire; nothing about the code changed, only
  # what the graph lets a rule see. Re-verified with `spec-graph gate --residue`.
  evaluated:
    - {rule: R0, fired: true}
      # bidirectional reconciliation ran. One real dangle (message_payload.payload_sha, a
      # binds: target resolving to nothing) and five uncited `default: unknown` invariants —
      # the tool only mechanises `unknown` for access.constraints/crosses_validation, so these
      # five pass its own check silently; recorded as R0 holes below so they are not silent nulls.
    - {rule: R1, fired: true}
      # 6 firings, one per `sends:` edge (render->message, render->message_payload,
      # ingest->message_payload, run_investigation->config, run_investigation->wire_log,
      # write_trace->tool_trace) — all 6 pre_discharged by a kind:shape demand at the exact
      # bound address, except render->message_payload, discharged by a kind:behavior demand
      # (minted_row_round_trips_after_fill_run_metadata) whose assertion content IS shape-
      # equivalent (byte round-trip of the minted payload) even though its `kind` tag is loose;
      # noted, not blocked — the channel is exercised, not unread.
    - {rule: R2, fired: true}
      # REPAIR ROUND: 4 firings, not 3. run_visualizations.identity is the fourth — one writer
      # edge (render_and_mirror) driven from TWO execution contexts (run_investigation's
      # subprocess and _render_transcript's in-process call), which is rules.md R2's "one writer
      # driven over multiple invocations" clause exactly. It did not fire at phase D because the
      # second driver was recorded only in an `nl:` evidence string and the write edge was not in
      # the delta; both are corrected in structure above. Routed as an obligation below (gl5).
      # Also at the repair round: the message.identity obligation gains a SECOND demand, gl2b —
      # gl2 races two DISTINCT agent_ids with caller-supplied seqs, so the composite key
      # separates the legs by construction; one writer racing ITSELF was untested (91-blind.md).
      # 3 firings at phase D. message.identity: partially pre_discharged (render/ingest/fork_constructor,
      # the serial writers) but the concurrent writer (gather_dispatch, multiplicity: concurrent,
      # auth:P2 confirms this is reachable from ordinary fan-out) has a supporting PROBE
      # (life:po7, EXECUTED, confirms no lost writes across two concurrent legs) that NO DEMAND
      # cites — rules.md is explicit that a probe does not discharge an obligation. wire_log.identity
      # and tool_trace.identity: both are shared TRUNCATING sinks (G24/F11/F3 — RequestLogger
      # opens mode 'w', write_trace uses write_text) with no kind:uniqueness demand pinning that
      # a second construction/invocation under the same key does not silently clobber the first.
      # All three routed as obligations below.
    - {rule: R3, fired: true}
      # 9 access-facet firings (session_store x5, store_reader x4) — all 9 pre_discharged.
      # Two are cross-boundary aliases worth a human spot-check, not a block: session_store's
      # `defender-sql`/`bash` cells and store_reader's `defender-sql` cell lean partly on
      # the_store_is_unreachable_from_inside_the_box (a session_store-boundary deny test) rather
      # than a dedicated store_reader-boundary parity cell; noted in the residue, not re-derived.
    - {rule: R4, fired: true}
      # 21 distinguished-member firings. 20 pre_discharged (user_version x3, exit_reason x5 of
      # 6, args x9, DEFENDER_COMPACTION x2, sqlite_version x1). One hole:
      # exit_reason.domain.distinguished[UnexpectedModelBehavior] — DELIBERATELY left unbound by
      # the assembler; FK7's open decision (does the run-end flush's coverage extend to this
      # reachable, currently-uncaught exit type) gates it, not a test-writing choice.
    - {rule: R5, fired: true}
      # 2 removal firings (seen_delta_encoding, compaction_glue), both pre_discharged by
      # survival demands covering every live dependent. Judgment extension (tightening/
      # safe-by-construction) CONSIDERED: deleting the catch-all (M5) is exactly a tightening —
      # a caller that used to fail silently now fails loud — and RG-4
      # (rg4_store_append_failure_stops_the_run_through_a_handled_exit, citing auth:P4) is
      # already the safe-by-construction-shaped demand this extension would mint: it asserts
      # the append failure surfaces as a HANDLED exit, not merely "behaves when configured
      # right." No new obligation; the extension's answer is a citation, not a gap.
    - {rule: R6, fired: true}
      # chooser/sanitizer walk ran over every value reaching a rendered/parsed sink in the
      # delta. Two surfaces CLOSED by probe: lead_id into three fs compositions (adv:PO7 —
      # reject-not-sanitise, one shared compiled validator) and the run_dir symlink leg
      # (adv:PO5/adv:PO5b, mints RG-1). Two surfaces OPEN, both from FK17: case_id
      # interpolated into session_store's path with no stated character validation, and —
      # the sharper one — model-authored message payload text rendered into transcript.html
      # through R4's NEW store-backed path, whose escaping is not inherited from the
      # log-derived renderer. Both routed as obligations/holes below.
  obligations:
    - {rule: R6, element: "interacts(visualize_run->message_payload) rendered into transcript.html",
       witness: "R4 moved transcript.html onto the store; the model-authored payload text
         (fully attacker-influenced, per session_store's own access table) reaching the NEW
         store-backed render path has no demand asserting the log-derived renderer's HTML
         escaping is inherited or re-applied. Highest-impact gap in this residue: a crafted
         payload could break out of its rendered container with no test to catch it.",
       discharged_by: gl1_transcript_html_escapes_message_payload_content_reaching_the_store_backed_render}
    - {rule: R2, element: message.identity,
       witness: "gather_dispatch writes message under multiplicity: concurrent (auth:P2:
         ordinary gather fan-out reaches this in THIS PR, not only #696's forks); life:po7
         (EXECUTED) confirms no lost writes across two concurrent legs (leg-a=20, leg-b=10,
         monotonic cross-visibility) but no demand cites it — the probe is not a substitute
         for the pinned test rules.md requires.",
       discharged_by: gl2_message_writes_from_concurrent_gather_legs_do_not_collide_or_lose_rows}
    - {rule: R2, element: wire_log.identity,
       witness: "three writers (run_investigation, pydantic_stage, experiment_driver) share a
         TRUNCATING sink (G24/F3 — RequestLogger.__init__ opens mode 'w'); the evidence note
         on this boundary names the truncation as 'the sharing hazard a store-backed rewrite
         must not inherit', and no kind:uniqueness demand pins that two constructions under one
         (run_id, trace_name) key do not silently clobber each other.",
       discharged_by: gl3_two_wire_log_constructions_under_one_key_do_not_silently_clobber_each_other}
    - {rule: R2, element: tool_trace.identity,
       witness: "write_trace is the delta's sole writer (driver.py:422 is the only call site
         read at 4e4645aa) and tool_trace.jsonl is a TRUNCATING writer (G24/F11 — write_text,
         not append); no demand states the single-invocation-per-run_id cardinality the current
         code happens to have, so a second call site (e.g. G7's second caller, run_arms.py:158,
         under a shared run_id) would silently clobber with nothing to catch it.",
       discharged_by: gl4_tool_trace_is_written_at_most_once_per_run_id_or_fails_loud_on_a_second_write}
    - {rule: R2, element: run_visualizations.identity,
       witness: "MINTED AT THE REPAIR ROUND (F2). `render_and_mirror` writes both HTML pages with
         a truncating write_text under one `run_id` key, and it is driven from TWO execution
         contexts — run_investigation's subprocess hop and _render_transcript's in-process call
         (G23, pyrefly-resolved to orchestrate.py:607-610 by auth:P3 F7). This is the one identity
         boundary with a truncating writer that phase D left without a uniqueness demand while all
         three of its siblings got one; the rule could not fire because the second driver lived in
         an `nl:` slot no rule may read and the write edge was not marked as delta.",
       discharged_by: gl5_the_two_render_drivers_under_one_run_id_do_not_clobber_each_other}
  holes:
    - {rule: R0, element: "interacts(render_and_mirror->run_visualizations)",
       resolution: "MINTED AT THE REPAIR ROUND (F1) — R0's bidirectional half: FK3's stated THIRD
         failure posture (`visualize()`'s swallowed non-zero exit) is a normative sentence in the
         run's own record that binds no element. The assembler handed it to the gate leaf as one
         of five deliberate inputs; four became obligations or holes and this one was routed
         nowhere — no obligation, no hole, no drop — so §7 never saw it. R4 is what makes it bite:
         all three of runtime.html's data layers now come from the store, so the child process
         must resolve the store to render at all, and auth:P3 F9 (EXECUTED) measured that a
         failure there is written to stderr and the parent exits 0. RESOLVED AT THE REPAIR ROUND:
         the read/render side is FAIL-CLOSED, symmetric with O19's write side.",
       resolved_to: rp1_the_visualizer_fails_closed_when_it_cannot_resolve_the_store,
       cites: ["auth:P3"]}
    - {rule: R0, element: message_payload.payload_sha,
       resolution: "DELIBERATE R0 dangle (45-dispositions red flag 5), independently verified:
         no obligation in 05-typed-doc.md defines this column, and it is not declared as a
         structure element anywhere in this artifact (unlike message.wire_sha, which is), yet
         no_position_or_payload_hash_diffing_on_ingest binds it. Human call at §7: either the
         column is out of scope (repoint the bind to nothing, or drop it) or it needs its own
         shape demand. RESOLVED AT §7 BY R15: the column is KEPT and the missing shape demand
         is minted.", resolved_to: payload_sha_digests_the_stored_payload_text_at_write_time,
       cites: ["gl-c1"]}
    - {rule: R0, element: "exit_reason.domain.distinguished[UnexpectedModelBehavior]",
       resolution: "same element as the R4 obligation above, filed once here as the design
         decision it actually is: FK7 (open) — does run_investigation's except-set widen to
         catch this reachable, currently-uncaught type, and does the run-end flush then cover
         it? Resolving FK7 spawns the R4 test. RESOLVED AT §7 BY R11: a true `finally` with
         `run` pre-bound covers every exit including an uncaught type, so the member is bound
         by the run-end-flush demand and its test drives an uncaught type.",
       resolved_to: run_end_flush_captures_the_terminal_response_on_every_exit,
       cites: ["G14"]}
    - {rule: R0, element: "user_version.domain.default",
       resolution: "cross-referenced to FK21(i) (already at §7 in handoff.forks), not a new
         finding: is:PO1 established the fact (a never-versioned file reads 0); the open
         question is whether 0 means 'version 0' or 'the un-set sentinel'. RESOLVED AT §7 BY
         R17 (FK21(i), judge recommendation adopted): 0 is the UN-SET sentinel; the writer
         stamps a non-zero version and the reader refuses 0 symmetrically with an out-of-range
         version.", resolved_to: reader_refuses_an_unknown_user_version,
       cites: ["is:PO1"]}
    - {rule: R0, element: "exit_reason.domain.default",
       resolution: "self-resolving, no §7 needed: a run has no default exit reason by
