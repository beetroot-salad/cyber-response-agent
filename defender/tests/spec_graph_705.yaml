     discharged_by: test_the_store_refuses_a_wrong_typed_coordinate_at_its_own_boundary,
     binds: ["message.identity", "interacts(render->message)", "session_store"],
     cites: ["PR1"]}
     # FK21(ii) via R17. PR1 (executed) REFUTED the 3/3 consensus that STRICT rejects a
     # wrong-typed value: a Python bool, a numeric str and an integer-valued float ALL
     # silently coerce to INTEGER; only a fractional REAL and a BLOB are rejected. The design
     # has no coordinate type guard to fall back on, so the guard is minted at the
     # application boundary and store_connection_is_strict_fk_wal_with_a_busy_timeout says
     # NOTHING about type rejection.

  - {id: payload_sha_digests_the_stored_payload_text_at_write_time, kind: shape, form: test,
     discharged_by: test_payload_sha_digests_the_stored_payload_text_at_write_time,
     binds: ["message_payload.payload_sha", "interacts(ingest->message_payload).payload"],
     cites: ["gl-c1"]}
     # R15 resolves the R0 dangle: the column is KEPT and this is the shape demand nobody
     # wrote. An integrity check, never an identity and never a diffing key — two rows with
     # identical payload text carry identical digests and remain two distinct rows, so the
     # digest can never be used to deduplicate or to match on ingest (invariant 3).

  - {id: the_store_append_encoding_is_pinned_against_a_lone_surrogate, kind: shape, form: test,
     discharged_by: test_the_store_append_encoding_is_pinned_against_a_lone_surrogate,
     binds: ["message_payload.payload", "interacts(ingest->message_payload).payload"],
     cites: ["adv:PO4", "PR3"]}
     # R9 pins adv:PO4's SECOND breach — the one nobody expected. The only content-triggered
     # halt that really exists sits at the SQLite bind, and whether it fires is decided
     # entirely by an unstated `ensure_ascii`: with the default a lone surrogate (reachable
     # via json.loads of a provider body, no decoder involved) survives end-to-end; with
     # False the same content raises UnicodeEncodeError. A security-relevant availability
     # property must not rest on a keyword nobody wrote down. PR3 supplies the positive
     # control (NUL + non-BMP survive as escapes).

  - {id: the_last_render_length_is_persisted_on_the_session_row, kind: behavior, form: test,
     discharged_by: test_the_last_render_length_is_persisted_on_the_session_row,
     binds: ["session.session_id", "interacts(ingest->session)", "interacts(ingest->message)"],
     cites: ["PR4"]}
     # FK18 via R17. PR4 (executed) confirmed live[len(last_render):] on a SHORTER live list
     # returns [] and never raises, so a fresh process recomputing the cursor from nothing
     # ingests NOTHING with no diagnostic possible from the slice. Persisting the cursor is
     # what makes the tail recomputable.

  - {id: an_append_is_one_commit_per_render_boundary, kind: behavior, form: test,
     discharged_by: test_an_append_is_one_commit_per_render_boundary,
     binds: ["interacts(ingest->message)", "interacts(ingest->message_payload).payload",
             "message_payload"],
     cites: ["life:po7"]}
     # FK15 via R17: one transaction per appended message (row + payload), no transaction
     # spanning a pair. The message->message_payload FK makes an untorn pair a SCHEMA
     # requirement, not a preference. Observed through a real second connection sampling
     # mid-append — life:po7 shape (3) established that an uncommitted row is never visible,
     # which is what makes a torn pair observable if it exists.

  - {id: an_analysis_read_is_not_stopped_at_the_last_complete_pair, kind: behavior, form: test,
     discharged_by: test_an_analysis_read_is_not_stopped_at_the_last_complete_pair,
     binds: ["store_reader.access[analysis]", "store_reader.access[send]",
             "interacts(store_reader->message).response"]}
     # THE NEGATIVE CONTROL R8 requires for sendable_history_stops_at_the_last_complete_pair_
     # on_every_terminator (75-reclassification red flag 1, "the single most important output
     # of this pass"). Under the rejected clause an analysis read could not observe the
     # orphan terminal response M3's run-end flush exists to capture, so the moved
     # transcript.html would silently drop the last response of every truncated run.

  - {id: the_actor_row_projection_over_a_session_that_ends_mid_pair, kind: behavior, form: test,
     discharged_by: test_the_actor_row_projection_over_a_session_that_ends_mid_pair,
     binds: ["store_reader.access[actor]", "interacts(actor_agent->message).response"]}
     # 75-reclassification P3 — the outright FLIP. Two of three phase-C answers asserted the
     # actor projection truncates, both citing R5's rejected "applies to both shapes" clause
     # as their SOLE ground; an author consuming them would have written a red-against-
     # correct-code assertion. Truncation and payload-exclusion are two INDEPENDENT
     # properties and the test must not let one stand in for the other.

  - {id: actor_role_read_over_a_session_containing_only_synthesized_frontier_rows, kind: behavior, form: test,
     discharged_by: test_actor_role_read_over_a_session_containing_only_synthesized_frontier_rows,
     binds: ["store_reader.access[actor]", "interacts(actor_agent->message_payload)",
             "message.identity"]}
     # 75-reclassification P11. Under the rejected clause the actor read truncated to the
     # last complete pair, and a session whose every row is synthesized has NO complete pair,
     # so the read could legitimately return EMPTY and the payload-absence assertion would
     # pass VACUOUSLY — the exact failure test_actor_role_read_against_a_session_with_zero_
     # rows was minted to guard, arriving through a different door. Non-emptiness is the
     # load-bearing half.

  - {id: actor_role_read_against_a_session_with_zero_rows, kind: behavior, form: test,
     discharged_by: test_actor_role_read_against_a_session_with_zero_rows,
     binds: ["store_reader.access[actor]", "interacts(actor_agent->message).response"]}
     # consensus (O31): the vacuity control. Informative only when paired with the non-empty
     # positive control — which is why it is a demand rather than a line inside another test.

  - {id: reader_serves_three_roles_against_the_same_session_id_back_to_back, kind: behavior, form: test,
     discharged_by: test_reader_serves_three_roles_against_the_same_session_id_back_to_back,
     binds: ["store_reader", "store_reader.access[send]", "store_reader.access[analysis]",
             "store_reader.access[actor]"]}
     # consensus (R5), STRENGTHENED by R8 (75-reclassification P7): under R5-as-worded the
     # back-to-back calls differed only in SHAPE; under R8 they also differ in LENGTH, and a
     # reader that ignores its role argument entirely is caught by the length, not the shape.

  - {id: reader_role_vocabulary_is_closed_and_unknown_roles_are_refused, kind: domain-outcome, form: test,
     discharged_by: test_reader_role_vocabulary_is_closed_and_unknown_roles_are_refused,
     binds: ["store_reader", "store_reader.access[send]", "store_reader.access[analysis]",
             "store_reader.access[actor]"]}
     # FK14 via R17 (refusal), with the set being closed over CORRECTED by R8 from two names
     # to three (75-reclassification P8/P9). A reader that refused `send` would break the
     # renderer — the one caller whose output reaches a provider. The positive control must
     # enumerate all THREE accepted values, or "refuses everything" passes.

  - {id: a_role_argument_supplied_by_agent_authored_content_is_not_honoured, kind: negative, form: test,
     discharged_by: test_a_role_argument_supplied_by_agent_authored_content_is_not_honoured,
     binds: ["store_reader.access[actor]", "store_reader.access[analysis]",
             "interacts(actor_agent->message_payload)"]}
     # FK14 via R17: the role comes from the caller's CONSTRUCTION SITE, never from content.
     # positive control: the_analysis_role_reaches_the_payloads_through_the_same_reader —
     # the same reader called with `analysis` from the construction site DOES return the
     # payloads, so the refusal is a trust rule and not a broken reader.

  - {id: the_reader_exposes_no_row_id_entry_point, kind: negative, form: test,
     discharged_by: test_the_reader_exposes_no_row_id_entry_point,
     binds: ["store_reader", "store_reader.access[api]", "store_reader.access[send]",
             "store_reader.access[analysis]", "store_reader.access[actor]",
             "interacts(store_reader->message).response",
             "interacts(store_reader->message_payload).response"]}
     # FK14 via R17: an audit read takes the analysis role and WALKS; a by-row-id door would
     # put a security boundary on a caller-supplied row id with no role enumeration behind
     # it. positive control: the same row IS reachable through an analysis read of a session
     # it lies on a path of.
     # REWRITTEN AT THE PHASE-E REPAIR ROUND (91-blind.md red flag 2). The negative was a
     # NAME-PATTERN guard — `not hasattr(ss, "read_message")` plus a scan of `dir(ss)` for the
     # substrings "by_id"/"row_id" — which any differently-named accessor (`peek`, `fetch_one`,
     # `get_message`) walks straight past, and which asserts nothing about behaviour at all.
     # It now DRIVES the reader: an off-path folded row is given a marker body by the fixture
     # that writes it, every public callable is called with that raw row id in each position a
     # door could take, and the assertion is that no return carries the body. Two positive
     # controls, because the probe is itself an observation channel: the same body IS returned
     # when it lies on a real path, and the probe demonstrably FINDS it when pointed at a
     # deliberately-leaky stand-in reader. The binds now name every via of the reader surface
     # and the payload response edge, because those are the surfaces the body could come back
     # through.

  - {id: run_end_flush_on_a_forked_sessions_own_terminal_turn, kind: behavior, form: test,
     discharged_by: test_run_end_flush_on_a_forked_sessions_own_terminal_turn,
     binds: ["interacts(fork_constructor->message)", "session.parent_session_id",
             "store_reader.access[send]", "interacts(ingest->message)"]}
     # 75-reclassification P4 — settled BY DERIVATION from R8's "one rule, in the reader,
     # once" over a path-shaped input, NOT from R8's text (that frontier's red flag 3 says so
     # plainly). The discriminating fixture is a pair that STRADDLES the session boundary:
     # an implementation computing completeness within the fork's own rows would wrongly
     # truncate it away.

  - {id: the_synthesized_flag_is_surfaced_to_the_analysis_shape, kind: behavior, form: test,
     discharged_by: test_the_synthesized_flag_is_surfaced_to_the_analysis_shape,
     binds: ["store_reader.access[analysis]", "message.identity",
             "interacts(store_reader->message).response"]}
     # FK20 via R17. The schema records `synthesized` (it is part of O3's UNIQUE key) but
     # nothing propagated it, and list[ModelMessage] has NOWHERE to carry the flag — while a
     # frontier row is the model's own paraphrase of turns that may carry attacker-derived
     # content. R17's recommendation: decide whether the analysis shape carries provenance
     # and, if it does not, say so explicitly. This demand pins that it DOES.

  - {id: the_renderer_applies_no_truncation_of_its_own, kind: behavior, form: test,
     discharged_by: test_the_renderer_applies_no_truncation_of_its_own,
     binds: ["drives(render->selection)", "store_reader.access[send]",
             "interacts(render->session_store).response"]}
     # 75-reclassification P2: `hydrate` IS the reader called with a role, not a third entry
     # point — the only reading under which O10's "one rule, in the reader, once" is
     # literally true. The discriminating fixture is a mid-pair session, where a renderer
     # that skipped the rule emits one message MORE than the reader does.

  - {id: gather_boundary_is_scoped_to_one_session, kind: behavior, form: test,
     discharged_by: test_gather_boundary_is_scoped_to_one_session,
     binds: ["gather_boundary", "session.session_id", "message.identity"]}
     # FK16's SECOND half, a design gap rather than a probe question (R17 adopted the judge's
     # sequencing; the recommendation was to decide the session predicate as a design
     # question). O3 keys rows by session_id, O1 keys the FILE by case_id, and O11 puts a
     # fork's rows in the same file — so the view as published cannot be correct for a
     # forked case.

  - {id: a_thinking_part_shaped_like_a_sql_fragment_round_trips_inert, kind: negative, form: test,
     discharged_by: test_a_thinking_part_shaped_like_a_sql_fragment_round_trips_inert,
     binds: ["message_payload.payload", "gather_boundary", "store_reader.access[defender-sql]"]}
     # consensus (O5, O32): stored and returned as inert text; the reader never concatenates
     # content into a query. positive control: an ordinary lead still extracts through the
     # same view in the same call.

  - {id: the_pre_change_construction_assertions_are_overturned, kind: behavior, form: test,
     discharged_by: test_the_pre_change_construction_assertions_are_overturned,
     binds: ["extra_capabilities", "DEFENDER_COMPACTION.domain.distinguished[unset]",
             "DEFENDER_COMPACTION.domain.distinguished[1]"],
     cites: ["C18", "auth:P5"]}
     # consensus 3/3: both pre-change assertions in test_harness_b_construction.py
     # (_main_extra_capabilities is [] when off; exactly one ProcessHistory when on) are
     # OVERTURNED and must be rewritten, not preserved (O20, R2/M8, R10). Leaving them green
     # would pin the branch-on-the-flag reading R10 rejected.

  - {id: the_moved_projection_preserves_the_runtime_html_event_stream, kind: shape, form: test,
     discharged_by: test_the_moved_projection_preserves_the_runtime_html_event_stream,
     binds: ["interacts(visualize_run->session_store).response",
             "interacts(visualize_runtime->tool_trace).response", "run_visualizations"],
     cites: ["G1", "X2"]}
     # R14's FOURTH frozen reader — runtime.html's six data layers plus visualize_runtime's
     # footer check. It is the ONE demand of the four that carries the coordinate exception,
     # and that exception is an ACCEPTED, TESTED value change rather than a blanket
     # tolerance: the other three assert consumed-field equality outright
     # (75-reclassification's R14 interaction check).

  - {id: the_moved_projection_is_built_after_the_run_end_flush, kind: behavior, form: test,
     discharged_by: test_the_moved_projection_is_built_after_the_run_end_flush,
     binds: ["drives(run_investigation->render_and_mirror)", "drives(run_investigation->write_trace)",
             "interacts(ingest->message)", "store_reader.access[analysis]"],
     cites: ["G14"]}
     # R11's ordering rule (visualize()/render_and_mirror run AFTER the flush) x R8
     # (75-reclassification P6). R8 is what makes the ordering OBSERVABLE: under the rejected
     # reading the projection is an analysis-role consumer that would truncate the orphan
     # away whether the flush had landed or not, so R11's fix would change nothing a test
     # could see. The negative control is the same store projected from its pre-flush state.

  - {id: the_reader_sits_beside_actor_view_and_takes_nothing_away_from_it, kind: survival, form: test,
     discharged_by: test_the_reader_sits_beside_actor_view_and_takes_nothing_away_from_it,
     binds: ["interacts(actor_agent->queries_table)", "queries_table"],
     cites: ["X1", "G15"]}
     # U6 REFUTED AS FRAMED by X1: actor_view projects executed_queries.jsonl, never message
     # history, so a store reader cannot take anything away from it and the question "can it
     # express actor_view without loss" is malformed as posed. What survives is the surface
     # the actor actually consumes, pinned here.

  - {id: two_investigations_of_the_same_case_land_in_one_per_case_database, kind: uniqueness, form: test,
     discharged_by: test_two_investigations_of_the_same_case_land_in_one_per_case_database,
     binds: ["session_store.identity", "interacts(resolve_store_path->session_store)",
             "session.session_id"]}
     # consensus (O1/M1), recorded as conditional on FK1 and now settled by R6. Under the
     # rejected `case_id := run_dir.name` alias this demand is UNSATISFIABLE, which is what
     # made FK1 self-refuting.

  - {id: run_dir_case_id_and_session_id_deliberately_diverge, kind: behavior, form: test,
     discharged_by: test_run_dir_case_id_and_session_id_deliberately_diverge,
     binds: ["session.case_id", "session.session_id", "run_dir",
             "interacts(fork_constructor->session)"]}
     # consensus (O13), conditional on FK1 and now settled by R6. The fixture must make all
     # three DIFFER, or a consumer that reached for the wrong one reads as accidentally
     # correct. FK1b/R17 corrects O13's `ticket_screen.self_case_key` clause — it returns
     # deps.run_id and its docstring pins that deliberately — so nothing here asserts a
     # keying the code contradicts; the fork-era gap is recorded as #696's.

  # =========================================================================
  # R18-R21 — MINTED AT THE PHASE-E REPAIR ROUND (93-verify-resolutions.md).
  # Phase F's three readers produced ten findings and the human closed all ten;
  # these six demands are the four resolutions' executable and clause forms.
  # Nothing here re-opens a §7 decision: R21's F6 entry RATIFIES one of the two
  # formulations R8 itself offered, and the rest close gaps R8-R17 left open.
  # =========================================================================

  - {id: gl5_the_two_render_drivers_under_one_run_id_do_not_clobber_each_other,
     kind: uniqueness, form: test,
     discharged_by: test_the_two_render_drivers_under_one_run_id_do_not_clobber_each_other,
     binds: ["run_visualizations.identity", "interacts(render_and_mirror->run_visualizations)",
             "drives(run_investigation->render_and_mirror)",
             "drives(_render_transcript->render_and_mirror)"],
     cites: ["G23", "auth:P3"]}
     # R18 / F2. `run_visualizations` was the ONE identity boundary with a truncating writer and
     # no uniqueness demand while all three siblings (message, wire_log, tool_trace) got one at
     # phase D. The reason no rule could fire: `render_and_mirror`'s SECOND driver lived only in
     # this boundary's `identity.evidence` nl string, and schema.md forbids a rule reading an
     # `nl:` slot. The driver is now structure (`_render_transcript`, orchestrate.py:607-610,
     # plus the design-provenance write edge R4 modifies), so R2 fires on run_visualizations.
     # R2's unique-key/serial form: drive the writers IN TURN over one run_id, with a positive
     # control that each driver alone lands real content, so "the pages survived" is not the
     # empty-page pass.

  - {id: rp1_the_visualizer_fails_closed_when_it_cannot_resolve_the_store,
     kind: behavior, form: test,
     discharged_by: test_the_visualizer_fails_closed_when_it_cannot_resolve_the_store,
     binds: ["interacts(visualize_run->session_store)", "run_visualizations",
             "drives(run_investigation->render_and_mirror)"],
     cites: ["G23", "auth:P3", "auth:P8"]}
     # R18 / F1 — FK3's THIRD failure posture, handed to the gate leaf as a deliberate input and
     # routed nowhere (no obligation, no hole, no drop). auth:P3 (EXECUTED) measured today's
     # posture: visualize_run.main() returns 1 and prints to stderr, run_common.visualize()
     # writes that to stderr and NEVER raises, and the outer process exits 0 — while
     # store_append_is_fail_closed and rg4 demand the opposite posture on the write side.
     # After R4 the child must open the store to render at all, and auth:P8 (EXECUTED) shows run
     # dirs really are relocated by an allowlist copy that carries no pointer. §7 CHOSE (a): the
     # read/render side is FAIL-CLOSED — the child exits non-zero AND run_common.visualize()
     # surfaces it. REJECTED: (b) a clause tolerating a logged failure, and (c) a handoff drop —
     # both leave runtime.html silently stale or unwritten on a run the operator believes
     # succeeded, the exact regression FK3 was raised about.

  - {id: gl2b_one_writer_racing_itself_under_one_agent_id_allocates_distinct_seqs,
     kind: uniqueness, form: test,
     discharged_by: test_one_writer_racing_itself_under_one_agent_id_allocates_distinct_seqs,
     binds: ["message.identity", "interacts(gather_dispatch->message)",
             "drives(run_investigation->gather_dispatch)"],
     cites: ["life:po7", "auth:P2"]}
     # 91-blind.md's concurrency gap, riding with R18. `gl2` races two DISTINCT agent_ids and
     # hands each leg its own pre-computed `seq`, so `message`'s composite key separates them by
     # construction and the collision it is named for cannot occur. One writer racing ITSELF —
     # same session, same agent_id, no caller-supplied seq — is the case where the store must
     # allocate the coordinate under contention, and it was untestable-from-the-suite (the blind
     # reader's one UNANSWERABLE). Same claims as gl2: life:po7 observed WAL cross-visibility,
     # auth:P2 that ordinary gather fan-out reaches this in THIS PR.

  - {id: the_crash_window_between_the_truncated_by_write_and_the_flush_is_an_accepted_tolerance,
     kind: behavior, form: clause,
     binds: ["session.truncated_by", "interacts(ingest->message)"],
     outcome: {nl: "A crash landing between the `truncated_by` write and the run-end flush leaves a session whose last row is an unanswered response with `truncated_by` unset; that window is an accepted, stated tolerance of this design and no test pins it, so a reader meeting such a session must treat the pair-completeness of the path as authoritative and `truncated_by` as advisory."},
     rejected: [{nl: "Making the `truncated_by` write and the run-end flush one transaction — a commit spanning more than one render boundary, which contradicts FK15's one-commit-per-render-boundary granularity."}]}
     # R21 / F5. R11 recorded this as an accepted, STATED tolerance; the artifact carried it as a
     # `#` comment on an unrelated demand, invisible to check_binds's prose-not-in-binds scan, to
     # write-code-from-spec's structure reconciliation, and to the demand list a human reviews.
     # This is the spec's first non-test form: a suite with zero clauses and zero waivers reads
     # to every downstream consumer as "nothing was deliberately left untested", which is not
     # what §7 decided.

  - {id: the_ticket_and_corpus_sites_keep_run_dir_name_while_the_store_keys_on_the_minted_case_id,
     kind: behavior, form: clause,
     binds: ["session.case_id", "run_dir"],
     cites: ["auth:P11"],
     outcome: {nl: "Two case identities coexist deliberately for the span of this change: the store, its pointer file and every demand above key on the `case_id` R6 mints at entry, while `ticket_writer.py:99` and `case_ticket.py:127` keep taking `run_dir.name` — so a ticket opened by a forked execution does NOT correlate with its source's ticket, and no demand here asserts that it does."},
     rejected: [{nl: "Substituting the minted `case_id` at the two investigation-identity-shaped ticket sites in this change: `case_ticket.read_case_record` is pinned by a live green test (tests/test_case_ticket.py:139 test_read_case_record_case_id_is_run_dir_not_frontmatter) to ignore a frontmatter `case_id` and take `run_dir.name`, so the substitution would have to overturn an existing contract this issue never scoped — and ticket continuity across a fork only becomes observable once forking exists, which is #696's."}]}
     # R19 / F4 consequence (b). auth:P11's EXECUTED result was dispositioned NOWHERE: its F2
     # refuted the framing that all seven `case_id = <dir>.name` sites must change (four are
     # per-run display/learning-YAML and are inert) and, in doing so, made the three that DO
     # carry investigation-identity weight a live decision under R6's chosen shape. Left
     # undecided, write-code-from-spec picks one silently and the divergence is invisible until
     # a fork actually happens. The corpus-lineage half (corpus.py:111 -> advisory.py:274) is a
     # reasoned DROP — see handoff.drops.

# ===========================================================================
structure:

  # The axis registry. Every key_axes / interpolates member below is drawn from it.
  # `fold_boundary` is declared and interpolated by NOBODY — that is FK10's open decision
  # (what the frontier-reuse lookup is keyed on) made visible rather than assumed.
  axes: [run_id, case_id, session_id, agent_id, seq, synthesized, fold_boundary,
         trace_name, lead_id]

  actors:
    # --- the delta (provenance: design == ADD; nothing here exists at 4e4645aa) ---
    - {id: render,             frame: leg,         provenance: design}   # M2's ProcessHistory processor (ADD)
    - {id: ingest,             frame: leg,         provenance: design}   # the append path + M3's run-end flush (ADD)
    - {id: store_reader,       frame: leg,         provenance: design}   # M7, the role-scoped read API (ADD) — see the boundary of the same name
    - {id: fork_constructor,   frame: leg,         provenance: design}   # M10 (ADD)
    - {id: resolve_store_path, frame: leg,         provenance: design}   # M1's path resolver (ADD) — FK1/FK3/G28 undecided
    - {id: selection,          frame: leg,         provenance: design}   # runtime/selection.py: the path walk + the fold (ADD)
    # --- the grounded neighborhood (provenance: code) ---
    - {id: run_investigation,  frame: composition, provenance: code}     # driver.py:371 (MODIFY: opens the store, attaches unconditionally, run-end flush, log encoding) — profile alias run/driver
    - {id: build_agent_core,   frame: leg,         provenance: code}     # driver.py:159 — the extra_capabilities seam M4 uses
    - {id: gather_dispatch,    frame: composition, provenance: code}     # tools_gather.py:287 (profile alias tools_gather)
    - {id: pydantic_stage,     frame: composition, provenance: code}     # learning/pipeline/_pydantic_stage.py:78 run_stage — the brief's `run_stage`
    - {id: write_trace,        frame: leg,         provenance: code}     # observe.py:192 (MODIFY: sources from the store)
