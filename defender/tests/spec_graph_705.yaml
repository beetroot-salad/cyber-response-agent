        access:
          constraints_by_via:
            fs:           {trust: operator,            constraints: [confine]}            # the writer's connection; O19 fail-closed
            api:          {trust: derived,             constraints: [confine, projection]} # the reader's connection — dep:PO2: FK pragma is per-connection
            bash:         {trust: attacker-influenced, constraints: [confine]}            # the box shell lane — adv:PO5 UNREFUTED on the mount set
            defender-sql: {trust: attacker-influenced, constraints: [confine, denylist]}   # sql.py:119 enable_external_access=false before user SQL
            host-walk:    {trust: attacker-influenced, constraints: []}                   # adv:PO5b: NOTHING stands between a box-authored symlink in run_dir and a host reader that follows it (probed, not assumed)
