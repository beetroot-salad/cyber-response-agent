      facets:
        identity:
          key_axes: [case_id]
          evidence: {nl: "one sessions/<case_id>.db per investigation, a SIBLING of the runs base and never a child (R1, binding; the body's $DEFENDER_RUNS_BASE/<store-dir> wording is superseded). Two executions of one case land in one file (O1/M1). What supplies case_id is FK1 — run.py passes an alert path, a run dir, a run id and a salt, and six live sites already read case_id = run_dir.name."}
