  - {id: run_end_flush_captures_the_terminal_response_on_every_exit, kind: domain-outcome, form: test,
     discharged_by: test_run_end_flush_captures_the_terminal_response_on_every_exit,
     binds: ["exit_reason.domain.distinguished[UsageLimitExceeded]",
             "exit_reason.domain.distinguished[RunAborted]",
             "exit_reason.domain.distinguished[BudgetKill]",
             "exit_reason.domain.distinguished[ForkStop]",
             "exit_reason.domain.distinguished[UnexpectedModelBehavior]",
             "interacts(ingest->message)"]}
     # fork: FK7 — there is no `finally:` today and `run` is bound only by the async-with
     # header (G14/F7), so an uncaught type skips the flush entirely; `truncated_by` is
     # written only in `except BudgetKill` (G13/F6). `ForkStop` binds a DESIGN-provenance
     # symbol: G12 proved zero hits repo-wide; #696 owns it.
     # UnexpectedModelBehavior is NOW BOUND: R11 closed FK7 by putting the flush in a TRUE
     # `finally` with `run` pre-bound, and REJECTED covering only the three named exits
     # (a run killed by an uncaught type loses its terminal exchange with no observable
     # trace). The test drives an uncaught type as its fourth case for exactly that reason.
     # The atomicity tolerance (a crash between the truncated_by write and the flush) is a
     # STATED tolerance, not a silent one, and no test pins it.

  - {id: store_append_is_fail_closed, kind: behavior, form: test,
     discharged_by: test_store_append_is_fail_closed,
     binds: ["interacts(render->session_store)", "session_store.access[fs]"],
     cites: ["auth:P4", "rp-c1"]}
     # fork: FK8 — three sub-decisions (does permission/post-timeout contention count; does
     # the exception reach the driver unwrapped; how does the suite steer the failure at all,
     # given the profile forbids monkeypatch.setattr and run_investigation has no store seam).
     # auth:P4 answers the middle one — see RG-4.
     # REPAIR ROUND (F7): the fault domain gains its FOURTH mode, `disk-full`. It was a 3/3
     # phase-C consensus (`test_disk_fills_partway_through_a_fail_closed_append`) with no
     # discount, no promotion and no drop, absent from a three-member parametrization while the
     # author digest reported 32/32 consensus covered — and the subsumption argument that would
     # have justified its absence was stated nowhere. The mode is tier 1 like the other three:
     # the real file is taken to its own real growth ceiling and the real sqlite3 raises its own
     # SQLITE_FULL (rp-c1, EXECUTED — including the measurement that makes the fault land on the
     # very next append rather than some later one). auth:P7 stays unprobed and is not cited.

