# The tenant's case-record settings (#1359): which system records the run's findings as a
# comment on the alert's case. The run only ever adds one comment, to the ticket the alert names
# (the alert mapping's `case_key`); it never creates a ticket or changes its fields or status.
# The comment's wording is the host's own (#1471 P-6, W7: no `comment:` template). A tenant with
# no case system leaves this file out.
#
# `system`  the system folder (under systems/) whose adapter adds the comment.
system: ticket
