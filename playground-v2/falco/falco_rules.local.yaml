# Playground-specific Falco rule overrides.
#
# These suppress signals from known-benign infrastructure activity that
# would otherwise drown the alert stream — agent-internal probes, Docker
# healthchecks, and DNS lookups from healthcheck curl commands. Each
# override appends a `not <pattern>` clause to the upstream rule's
# condition rather than redefining the rule, so any future tightening
# in falco-sandbox / falco-incubating still applies. Where upstream
# ships a macro meant to be overridden for this purpose, that is used
# instead — same intent, and it leaves the rule itself untouched.
#
# Scoping principle: match on the durable identity, not the chosen name
# — `proc.exepath` (absolute binary path) rather than `proc.name`, so an
# attacker dropping a binary named "curl" at a non-system path doesn't
# inherit the suppression, and `container.image.repository` rather than
# `container.name`.

# elastic-agent runs as elastic-otel-collector and routinely probes
# 169.254.169.254 for EC2/cloud metadata + reads /proc/<pid>/environ for
# its supervised child processes. Both of these are non-suspicious agent
# behavior and account for the bulk of residual noise after the
# healthcheck-driven sshd accept events were cut.
- rule: Contact EC2 Instance Metadata Service From Container
  override:
    condition: append
  condition: and not proc.exepath endswith /components/elastic-otel-collector

- rule: Read environment variable from /proc files
  override:
    condition: append
  condition: and not proc.exepath endswith /components/elastic-otel-collector

# Keycloak's container healthcheck opens /dev/tcp/127.0.0.1/9000 from a
# bash subshell — fires `Redirect STDOUT/STDIN to Network Connection in
# Container` on every probe (10s interval). Replacing the healthcheck
# upstream would require rewriting it to not use bash's /dev/tcp magic
# (see playground-v2/CLAUDE.md "Keycloak healthcheck needs CMD exec +
# bash + printf"). Suppressing here is simpler and keeps the rule firing
# on any other bash-driven /dev/tcp redirect, which is still suspicious.
- rule: Redirect STDOUT/STDIN to Network Connection in Container
  override:
    condition: append
  condition: and not (proc.name = bash and fd.lport = 9000 and fd.sip = 127.0.0.1)

# Container healthchecks issue `curl http://kibana:5601/...`,
# `curl https://elasticsearch:9200/...`, etc., which trigger UDP DNS
# lookups. Falco fires `Unexpected UDP Traffic` on every such lookup.
# Curl run from a system path is benign here; an attacker-dropped curl
# at a non-system path would still trip the rule.
- rule: Unexpected UDP Traffic
  override:
    condition: append
  condition: and not proc.exepath = /usr/bin/curl

# The SOAR mounts /var/run/docker.sock into shuffle-backend and
# shuffle-orborus, and Orborus mounts it into one ephemeral worker per
# workflow run — each of which trips `Launch Sensitive Mount Container`
# (falco-sandbox) at container start. falco.alerts is tailed into the
# defender's own Elasticsearch, so left alone the defender finds its own
# tooling in the telemetry, shaped like a container escape, at a rate
# that tracks SOAR activity. The `soar` network keeps the SOAR out of
# Zeek's conn.log; this is the syscall half of that same isolation.
#
# Overriding `user_sensitive_mount_containers` is what upstream provides
# for this — it ships as `never_true` with a comment saying to redefine
# it in a local file. Suppressing here rather than on the rule keeps
# `Launch Sensitive Mount Container` firing for every OTHER container
# that mounts a sensitive path, which is the signal worth having.
#
# Listed by image because the pinned image is what legitimately holds
# the socket; a container name is chosen by whoever starts it. The
# worker is included (Orborus bind-mounts the socket into it); the
# Shuffle app containers the worker then spawns are not, so an app
# container that acquires a sensitive mount still alerts.
- list: soar_socket_mount_images
  items:
    - ghcr.io/shuffle/shuffle-backend
    - ghcr.io/shuffle/shuffle-orborus
    - ghcr.io/shuffle/shuffle-worker

- macro: user_sensitive_mount_containers
  override:
    condition: replace
  condition: (container.image.repository in (soar_socket_mount_images))

# Custom rule: every sudo execve in a container emits a NOTICE. The Kibana
# detection rule `v2-off-hours-sudo` thresholds on this stream (>=3 per host
# per 10min) to surface burst-shaped sudo activity — legitimate oncall response
# and post-compromise interactive privilege use both look like bursts. Scoped
# to direct execve of /usr/bin/sudo to avoid PAM-internal sudo invocations
# (e.g. sshd's PAM stack briefly exec'ing sudo on some images).
- rule: Sudo execution
  desc: A process invoked sudo to gain elevated privileges inside a container
  condition: >
    spawned_process and
    proc.exepath = /usr/bin/sudo and
    container.id != host
  output: >
    Sudo invoked (user=%user.name container=%container.name
    cmd=%proc.cmdline parent=%proc.pname)
  priority: NOTICE
  tags: [process, sudo, mitre_privilege_escalation]
  source: syscall
