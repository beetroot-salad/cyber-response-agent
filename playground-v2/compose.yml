  # Batch 9 stubs: CMDB, threat intel, change management, ticketing.
  # All auth-less FastAPI servers on 8080 internal. Exposed on loopback
  # 127.0.0.1:8001-8005 on the VPS for debugging; the credential proxy reaches
  # them only through the edge (#1391), with a key; in-cluster access via
  # Docker DNS (http://cmdb:8080, etc.). Shared healthcheck below uses
  # python's urllib — python:3.12-slim has no curl, and adding one bloats
  # the image for a single liveness probe.

  cmdb:
    # Build context widened to playground-v2/ root so the image can COPY
    # hosts/inventory.yaml — same pattern as hosts/Dockerfile. The root
    # .dockerignore whitelists hosts/** and cmdb/** to keep the tar small.
    build:
      context: .
      dockerfile: cmdb/Dockerfile
    image: soc-playground/cmdb:local
    container_name: cmdb
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8001:8080"
    # All five stubs are on `soar` so Shuffle apps can call them, and on
    # `ingress` so the lab's edge can forward the credential proxy's calls to them
    # (#1391). `default` is listed explicitly or the stub drops off the network the
    # role hosts and the baseline generators reach it on.
    networks: &stub-networks
      - default
      - soar
      - ingress
    healthcheck: &stub-health
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8080/health\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  threat-intel:
    build: ./threat-intel
    image: soc-playground/threat-intel:local
    container_name: threat-intel
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8002:8080"
    networks: *stub-networks
    healthcheck: *stub-health

  change-mgmt:
    build: ./change-mgmt
    image: soc-playground/change-mgmt:local
    container_name: change-mgmt
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8003:8080"
    networks: *stub-networks
    healthcheck: *stub-health

  ticket-server:
    # FastAPI ticket stub (see v2 §Data: "keep stub over Elastic Cases").
    # `build:` packages the context into a tar locally before sending to the
    # remote daemon, so the relative path resolves on the client side and
    # works against --context soc-playground.
    build: ./ticket-server
    image: soc-playground/ticket-server:local
    container_name: ticket-server
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      # Bind-mounted so seed edits apply with `compose up -d` alone — no
      # rebuild needed. ticket-server's Dockerfile doesn't COPY the seed dir,
      # and the default TICKET_SEED_PATH points here.
      - ./ticket-server/seed:/app/seed:ro
    ports:
      - "127.0.0.1:8004:8080"
    networks: *stub-networks
    healthcheck: *stub-health

  alert-ticket-watcher:
    # Opens each new security alert's ticket in ticket-server, keyed by the alert's
    # id (#1400) — standing in for the customer's alert automation. Polls the alerts
    # index as `alert-ticket-watcher`, a read-only user es-init creates. Not a Kibana
    # rule action: the webhook connector needs a Gold licence and this stack is Basic.
    build: ./alert-ticket-watcher
    image: soc-playground/alert-ticket-watcher:local
    container_name: alert-ticket-watcher
    depends_on:
      es-init:
        condition: service_completed_successfully
      ticket-server:
        condition: service_healthy
    environment:
      - WATCHER_ES_PASSWORD=${V2_ALERT_WATCHER_PASSWORD:?set V2_ALERT_WATCHER_PASSWORD in .env}
    volumes:
      # Read-only, for ca.crt (same mount Kibana has).
      - certs:/certs:ro
    # `default` only: it reaches Elasticsearch and ticket-server there, and nothing
    # needs to reach it.
    networks:
      - default
    mem_limit: 64m
    restart: unless-stopped

  identity:
    # Authz API over keycloak/realm.yaml × hosts/inventory.yaml. Root build
    # context so the image can COPY both source files (same pattern as cmdb/).
    build:
      context: .
      dockerfile: identity/Dockerfile
    image: soc-playground/identity:local
    container_name: identity
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8005:8080"
    networks: *stub-networks
    healthcheck: *stub-health

  # The lab's one ingress (#1391 r6 L1): every port the credential proxy reaches, published on
  # the server's PUBLIC address only (the loopback debug ports above stay), behind the cloud
  # firewall's rule for the SSH source addresses (infra/firewall.tf). It admits only the lab
  # tenant's declared surface (lab-surface.json) with the lab key, and passes 9200 through to
  # Elasticsearch as bytes. On `ingress` only: never `default`, so the defender's own calls stay
  # out of Zeek and no role host reaches it from inside.
  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    image: soc-playground/edge:local
    container_name: lab-edge
    environment:
      - V2_LAB_API_KEY=${V2_LAB_API_KEY:?set V2_LAB_API_KEY in .env}
    ports:
      - "${V2_LAB_PUBLIC_ADDRESS:?set V2_LAB_PUBLIC_ADDRESS in .env (terraform output ipv4)}:8001-8005:8001-8005"
      - "${V2_LAB_PUBLIC_ADDRESS}:8007:8007"
      - "${V2_LAB_PUBLIC_ADDRESS}:9200:9200"
    networks:
      - ingress
    mem_limit: 128m
    restart: unless-stopped

  # host-state's endpoint-query service (#1391 O5, r6 O8): an endpoint-security product's query
  # API over the role hosts, answered live through the Docker socket. Enrolls the inventory's
  # hosts (baked in at build), inspect limited to them. Unpublished: reached only through the
  # edge on 8007. On `ingress` only, so no role host can reach the socket holder. Its image is
  # excused in falco/falco_rules.local.yaml (a socket mount is its job).
  endpoint-query:
    build:
      context: .
      dockerfile: endpoint-query/Dockerfile
    image: soc-playground/endpoint-query:local
    container_name: endpoint-query
    command: ["--hosts", "/etc/endpoint-query/hosts.txt", "--inspectable", "/etc/endpoint-query/hosts.txt"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ingress
    mem_limit: 128m
    restart: unless-stopped

networks:
  # `default` is left undeclared on purpose: declaring it forces Compose to
  # recreate it, stopping every one of the ~30 containers on the stack.
  #
  # soar — carries Shuffle plus the services it orchestrates.
  #
  #  * The bridge name is pinned. Otherwise Docker derives `br-<12 hex>`, and
  #    zeek/entrypoint.sh picks its capture interface with
  #    `awk '/^br-/ {print $1; exit}'` — the FIRST matching bridge, so a second
  #    br-* makes it a coin flip and Zeek may silently capture the SOAR network
  #    instead of the playground. `soar0` is skipped by that awk by
  #    construction, so Zeek needs no change. Max 15 chars (IFNAMSIZ).
  #
  #  * The subnet sits outside Docker's default 172.17.0.0/12 pool, so it can
  #    never collide with an auto-allocated network and is obvious in a log
  #    line or a pcap.
  #
  # Consequence: SOAR traffic never crosses the captured bridge, so none of it
  # appears in Zeek's conn.log — intended, so the defender does not find its own
  # tooling in the telemetry.
  soar:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: soar0
    ipam:
      config:
        - subnet: 10.77.0.0/24

  # ingress — the edge and what it forwards to (#1391 r6 L2): Elasticsearch, the five stubs and
  # the endpoint-query service. Pinned like `soar`, for the same two reasons: Zeek's `^br-`
  # capture choice skips `ingress0`, and the subnet sits outside Docker's default pool. So the
  # credential proxy's calls never appear in the telemetry the defender investigates.
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ingress0
    ipam:
      config:
        - subnet: 10.78.0.0/24

volumes:
  certs:
    driver: local
  es_data:
    driver: local
  kibana_data:
    driver: local
  fleet_data:
    driver: local
  keycloak_data:
    driver: local
  keycloak_import:
    driver: local
  zeek_logs:
    driver: local
  # Squid access log — tailed by the host-side elastic-agent's squid Custom Logs
  # integration into Elastic. Symmetric to zeek_logs in shape.
  squid_logs:
    driver: local
  # Unbound query/reply log — tailed by the host-side elastic-agent's unbound
  # Custom Logs integration. Same pattern as squid_logs.
  unbound_logs:
    driver: local
  # Per-role Fleet enrollment tokens — written by fleet-host-policies init,
  # mounted read-only into each host at /fleet-tokens/<role>.token.
  fleet_tokens:
    driver: local
  # Per-host elastic-agent state (agent.id, fleet.enc, vault). One volume per
  # host keeps agent identities stable across container recreates — without
  # this, every recreate would mint a new agent.id and pile up offline ghosts
  # in Fleet.
  agent_state_web_1:
    driver: local
  agent_state_web_2:
    driver: local
  agent_state_db_1:
    driver: local
  agent_state_jump_box_1:
    driver: local
  agent_state_dev_ws_1:
    driver: local
  agent_state_office_ws_1:
    driver: local
  agent_state_office_ws_2:
    driver: local
  agent_state_canary_1:
    driver: local
  agent_state_config_mgmt_1:
    driver: local
  agent_state_ci_1:
    driver: local
  agent_state_scanner_1:
    driver: local
  # Per-host /var/log. The agent remembers how far it read a file by device + inode;
  # a container's own filesystem gets a new device number on every restart (and every
  # lever-up), so without this each restart re-shipped every log file from line one.
  # A named volume sits on the VPS disk, whose device number is stable.
  # Check: python3 scripts/check_log_reingest.py <host>
  var_log_web_1:
    driver: local
  var_log_web_2:
    driver: local
  var_log_db_1:
    driver: local
  var_log_jump_box_1:
    driver: local
  var_log_dev_ws_1:
    driver: local
  var_log_office_ws_1:
    driver: local
  var_log_office_ws_2:
    driver: local
  var_log_canary_1:
    driver: local
  var_log_config_mgmt_1:
    driver: local
  var_log_ci_1:
    driver: local
  var_log_scanner_1:
    driver: local
