name: soc-playground

# Shuffle SOAR lives in its own file so it can be levered down independently.
#
# `env_file: .env` is NOT here for interpolation — measured on Compose v5.3.1,
# an included file resolves ${...} from the project .env (playground-v2/.env)
# with or without this key; a .env in soar/ is consulted only if the project
# has none. It is here to make a MISSING .env loud. Without it, no .env yields
# warnings and a stack that boots anyway — which for Shuffle means its code
# defaults, one of which polls uk.shuffler.io. With it, every subcommand (`ps`,
# `logs`, `down`, `config`) fails first with `stat .../.env: no such file or
# directory`. env_file entries are mandatory and the short form takes no
# `required: false`, so that loudness is the whole point, not a side effect.
# `project_directory: .` resolves relative paths in the included file against
# playground-v2/ rather than soar/.
include:
  - path: ./soar/compose.yml
    project_directory: .
    env_file: .env

# Services:
#  setup         — one-shot: generates self-signed CA + ES/fleet-server certs, exits. Offline by design (see es-init)
#  elasticsearch — single-node, TLS on (HTTP + transport), xpack.security.enabled
#  es-init       — one-shot: sets the kibana_system password once ES is healthy, exits
#  kibana        — auth via kibana_system over TLS
#  fleet-init    — one-shot: fleet setup + fleet-server-policy
#  fleet-server  — Fleet Server + self-enrollment
#  keycloak-init — one-shot: converts keycloak/realm.yaml → realm.json on shared import volume
#  keycloak      — IdP (start-dev + --import-realm); H2 state persisted in keycloak_data volume
#  unbound       — recursive DNS resolver with query logs to stdout (playground-internal resolver)
#  squid         — forward HTTP(S) proxy with basic-auth attribution; access log to stdout
#  zeek          — passive network monitor (host netns); JSON conn/dns/http/ssl/files logs to volume
#  Role-clustered host population (8 containers — playground-v2/docs/playground-environment-v2.md §Environment population):
#    web-1, web-2     — nginx, ubuntu 22.04, prod
#    db-1             — postgres, ubuntu 22.04, prod
#    jump-box-1       — plain, ubuntu 24.04, prod (SSH hub)
#    dev-ws-1         — plain, ubuntu 24.04, dev (developer workstation)
#    office-ws-1, -2  — plain, ubuntu 22.04 / 24.04, preprod (office-user workstations)
#    canary-1         — plain, ubuntu 22.04, sandbox (designated attack target)
#  Stubs (batch 9 — playground-v2/docs/playground-environment-v2.md §Data):
#    cmdb             — FastAPI over hosts/inventory.yaml + in-mem mutation overlay
#    threat-intel     — FastAPI over offline VT/OTX-shaped indicator seed
#    change-mgmt      — FastAPI over authorized-change seed tied to inventory change_windows
#    ticket-server    — FastAPI over a curated ticket seed (moved in from the retired v1 lab)
#    identity         — FastAPI authz API over keycloak/realm.yaml × hosts/inventory.yaml
#  Shuffle SOAR (defined in soar/compose.yml, see the include: above):
#    shuffle-frontend   — UI on 8006; shuffle-backend — API/scheduler on 5001
#    shuffle-orborus    — execution supervisor; shuffle-opensearch — Shuffle's own state store
# Exposed on loopback only. External access via SSH tunnel:
#   ssh -L 9200:localhost:9200 -L 5601:localhost:5601 -L 8220:localhost:8220 -L 8080:localhost:8080 \
#       -L 8001:localhost:8001 -L 8002:localhost:8002 -L 8003:localhost:8003 -L 8004:localhost:8004 \
#       -L 8005:localhost:8005 -L 8006:localhost:8006 -L 5001:localhost:5001 soc-playground

x-es-image: &es-image docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}

# Role-host defaults. Anchored here so the 8 host services below stay thin —
# they differ only in image target, BASE_OS, hostname, HOST_NAME/HOST_ROLE env,
# and a per-host agent-state volume. Shared bits (restart policy, healthcheck,
# dependencies on Fleet readiness) live here; per-service volume lists are
# NOT anchored because YAML <<: replaces lists rather than merging them, and
# each host needs both the shared mounts (certs, fleet_tokens) and its own
# agent state volume.
x-host-defaults: &host-defaults
  restart: unless-stopped
  # elastic-agent 9.3 + default beats + otel collector + sshd needs ~350-450MB
  # resident once everything is warm. 256m caused flappy "degraded" status and
  # metricbeat self-stats socket timeouts because beats were being OOM-nudged.
  # VPS has ~30GB so 512m × 8 hosts (= 4GB) is comfortable headroom.
  mem_limit: 512m
  depends_on:
    fleet-server:
      condition: service_healthy
    fleet-host-policies:
      condition: service_completed_successfully
  # Process-existence check, not `nc -z 127.0.0.1 22`. Every nc connection
  # to port 22 makes sshd dup2(fd, 0/1) on accept, which Falco's
  # "Redirect STDOUT/STDIN to Network Connection in Container" rule fires on
  # — 8 hosts × every 10s drowned the falco.alerts stream in healthcheck
  # noise (~99% of all events). Process check has the same operational
  # intent (sshd is alive) without opening a socket.
  healthcheck:
    test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  setup:
    image: *es-image
    container_name: soc-playground-setup
    user: "0"
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -c '
        # CA is pinned in the certs named volume. Regenerate only if the CA
        # itself is missing — never as a side effect of a leaf being missing.
        # Explicit rotation: `docker volume rm <project>_certs && compose up setup`.
        # Drift between this CA and any out-of-volume copies (e.g. the
        # host-side elastic-agent at /etc/elastic-agent/ca.crt on the VPS) is
        # exactly the failure mode that broke Falco ingest for 14 days on
        # 2026-05-10 — keeping the CA stable across normal setup re-runs
        # prevents that recurrence.
        CA_REGENERATED=0;
        if [ ! -f config/certs/ca/ca.crt ] || [ ! -f config/certs/ca/ca.key ]; then
          echo "-> generating CA (no existing CA in certs volume)";
          rm -rf config/certs/ca config/certs/ca.zip;
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -q config/certs/ca.zip -d config/certs;
          CA_REGENERATED=1;
        else
          echo "-> reusing pinned CA from certs volume";
        fi;
        if [ "$$CA_REGENERATED" = "1" ] || [ ! -f config/certs/elasticsearch/elasticsearch.crt ] || [ ! -f config/certs/fleet-server/fleet-server.crt ]; then
          echo "-> (re)issuing leaf certs from pinned CA";
          rm -rf config/certs/elasticsearch config/certs/fleet-server config/certs/certs.zip;
          printf "instances:\n  - name: elasticsearch\n    dns:\n      - elasticsearch\n      - localhost\n    ip:\n      - 127.0.0.1\n  - name: fleet-server\n    dns:\n      - fleet-server\n      - localhost\n    ip:\n      - 127.0.0.1\n" > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip -q config/certs/certs.zip -d config/certs;
        fi;
        # Ensure leaf certs ship the CA in the chain so clients using
        # `ca_trusted_fingerprint` (no CA file) can walk up to the trust root.
        # Without this, elastic-agent drops data with x509: certificate signed
        # by unknown authority. Idempotent: only appends if not already chained.
        for leaf in config/certs/elasticsearch/elasticsearch.crt config/certs/fleet-server/fleet-server.crt; do
          if [ "$$(grep -c "BEGIN CERTIFICATE" "$$leaf")" = "1" ]; then
            cat config/certs/ca/ca.crt >> "$$leaf";
          fi;
        done;
        echo "-> fixing permissions";
        chown -R 1000:0 config/certs;
        find config/certs -type d -exec chmod 750 {} \;;
        find config/certs -type f -exec chmod 640 {} \;;
        echo "-> setup complete";
      '
    # Deliberately no healthcheck. Nothing gates on `setup: service_healthy`
    # and nothing may: a probe on a one-shot that exits in under a second is a
    # race the dependent loses (see the note on elasticsearch's depends_on).
    restart: "no"

  elasticsearch:
    depends_on:
      setup:
        # Safe only because `setup` is now purely offline (cert generation, no
        # network wait) and so always exits. It previously also waited for ES,
        # which deadlocked every cold start: ES gated on setup exiting while
        # setup gated on ES answering. Neither condition on this edge fixes
        # that — service_healthy just moves the hang to the case where setup's
        # fast path exits before the 2s healthcheck fires. The fix is the
        # es-init one-shot below; keep ES-dependent work out of `setup`.
        condition: service_completed_successfully
    image: *es-image
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${V2_ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - "ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}"
      # The frozen held-out cases' snapshot repository (#1347): only this live node writes it; the
      # frozen engine mounts the same lab-disk directory read-only and registers it `readonly`.
      - path.repo=/srv/lab/frozen-cases
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - es_data:/usr/share/elasticsearch/data
      - /srv/lab/frozen-cases:/srv/lab/frozen-cases
    ports:
      - "127.0.0.1:9200:9200"
    # `ingress` is how the lab's edge reaches it for the credential proxy (#1391 r6 L1, L2).
    # `default` must be listed: a networks: key drops the implicit default. See the invariant
    # under kibana's networks.
    networks:
      - default
      - ingress
    mem_limit: 3g
    healthcheck:
      test:
        - CMD-SHELL
        # The credential reaches curl as config on stdin (-K -), never as an argument: an
        # argument is readable by every process monitor on the host (metricbeat's
        # system.process samples full command lines into Elasticsearch).
        - "printf 'user = \"elastic:%s\"\\n' \"$$ELASTIC_PASSWORD\" | curl -fsS -K - --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(yellow|green)\"'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # The ES-dependent half of what `setup` used to do. It must live in its own
  # one-shot gated on elasticsearch being healthy: folding it back into `setup`
  # recreates the cold-start deadlock described above.
  es-init:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: *es-image
    container_name: soc-playground-es-init
    user: "0"
    environment:
      - ELASTIC_PASSWORD=${V2_ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${V2_KIBANA_PASSWORD}
      - WATCHER_PASSWORD=${V2_ALERT_WATCHER_PASSWORD:?set V2_ALERT_WATCHER_PASSWORD in .env}
      - DEFENDER_PASSWORD=${V2_DEFENDER_READONLY_PASSWORD:?set V2_DEFENDER_READONLY_PASSWORD in .env}
      - DEFENDER_EVENTS_INDEX=${V2_DEFENDER_EVENTS_INDEX:?set V2_DEFENDER_EVENTS_INDEX in .env (the lab tenant's ELASTIC_EVENTS_INDEX)}
      - DEFENDER_ALERTS_INDEX=${V2_DEFENDER_ALERTS_INDEX:?set V2_DEFENDER_ALERTS_INDEX in .env (the lab tenant's ELASTIC_ALERTS_INDEX)}
    volumes:
      # Read-only: this one-shot only reads ca.crt, and the volume also holds
      # ca.key. `setup` is the sole writer.
      - certs:/usr/share/elasticsearch/config/certs:ro
    command: >
      bash -c '
        set -eu;
        # `elasticsearch: service_healthy` already proves ES answers over TLS
        # with this CA, so the password POST is its own readiness probe — no
        # separate wait loop. Bounded on purpose: kibana, fleet-init,
        # fleet-server and all 11 role hosts sit behind this one-shot, so an
        # unbounded retry stalls the whole `up` with nothing in the logs to
        # say why. That is the failure shape this service was split out to end.
        echo "-> setting kibana_system password";
        ok=0;
        for i in $$(seq 1 60); do
          if printf "user = \"elastic:%s\"\ndata = {\"password\":\"%s\"}\n" "$${ELASTIC_PASSWORD}" "$${KIBANA_PASSWORD}" | curl -s -K - -X POST --cacert config/certs/ca/ca.crt -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/kibana_system/_password | grep -q "^{}"; then ok=1; break; fi;
          sleep 5;
        done;
        [ "$$ok" = 1 ] || { echo "FAIL: kibana_system password not set after 5m - check V2_ELASTIC_PASSWORD against the elastic user stored in es_data"; exit 1; };
        # The alert-ticket-watcher (#1400): read on the security alerts and nothing else.
        # Both PUTs are upserts, so every `up` re-asserts them. Credentials ride curl config
        # on stdin, never the command line, like the kibana_system call above.
        echo "-> alert-ticket-watcher role + user";
        printf "user = \"elastic:%s\"\ndata = {\"indices\":[{\"names\":[\".alerts-security.alerts-default*\",\".internal.alerts-security.alerts-default-*\"],\"privileges\":[\"read\"]}]}\n" "$${ELASTIC_PASSWORD}" | curl -s -K - -X PUT --cacert config/certs/ca/ca.crt -H "Content-Type: application/json" https://elasticsearch:9200/_security/role/alert_ticket_watcher | grep -q "\"role\"" || { echo "FAIL: alert_ticket_watcher role not written"; exit 1; };
        printf "user = \"elastic:%s\"\ndata = {\"password\":\"%s\",\"roles\":[\"alert_ticket_watcher\"]}\n" "$${ELASTIC_PASSWORD}" "$${WATCHER_PASSWORD}" | curl -s -K - -X PUT --cacert config/certs/ca/ca.crt -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/alert-ticket-watcher | grep -q "\"created\"" || { echo "FAIL: alert-ticket-watcher user not written"; exit 1; };
        # The defender read-only user (#1391 r6), reached through the credential proxy: read on
        # the two index patterns of the lab tenant (copied here; a mismatch is a loud 403 at run
        # start) and the cluster `monitor` privilege health-check needs. The frozen engine creates
        # the same user with the same password (scripts/lab_ops.py). No apostrophes in this
        # script: it is one single-quoted bash -c argument.
        echo "-> defender-readonly role + user";
        printf "user = \"elastic:%s\"\ndata = {\"cluster\":[\"monitor\"],\"indices\":[{\"names\":[\"%s\",\"%s\"],\"privileges\":[\"read\"]}]}\n" "$${ELASTIC_PASSWORD}" "$${DEFENDER_EVENTS_INDEX}" "$${DEFENDER_ALERTS_INDEX}" | curl -s -K - -X PUT --cacert config/certs/ca/ca.crt -H "Content-Type: application/json" https://elasticsearch:9200/_security/role/defender_readonly | grep -q "\"role\"" || { echo "FAIL: defender_readonly role not written"; exit 1; };
        printf "user = \"elastic:%s\"\ndata = {\"password\":\"%s\",\"roles\":[\"defender_readonly\"]}\n" "$${ELASTIC_PASSWORD}" "$${DEFENDER_PASSWORD}" | curl -s -K - -X PUT --cacert config/certs/ca/ca.crt -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/defender-readonly | grep -q "\"created\"" || { echo "FAIL: defender-readonly user not written"; exit 1; };
        echo "-> es-init complete";
      '
    restart: "no"

  kibana:
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      # Kibana authenticates as kibana_system, whose password es-init sets.
      es-init:
        condition: service_completed_successfully
    build:
      context: ./kibana
      args:
        STACK_VERSION: ${STACK_VERSION}
    image: soc-playground/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
      # Secrets go through kibana/kibana.yml's ${VAR} substitution, under names the image
      # entrypoint does not recognise: it turns ELASTICSEARCH_PASSWORD and XPACK_*_ENCRYPTIONKEY
      # into --flags on Kibana's command line, which host process monitoring then ships into
      # Elasticsearch. Never put a secret back in a recognised name.
      - KBN_ES_PASSWORD=${V2_KIBANA_PASSWORD}
      - KBN_ENCRYPTION_KEY=${V2_KIBANA_ENCRYPTION_KEY}
      # The key saved objects were encrypted with before the last rotation (decrypt-only).
      # Unset on a stack that never rotated; kibana/with-previous-key.sh declares it only when set.
      - KBN_ENCRYPTION_KEY_PREVIOUS=${V2_KIBANA_ENCRYPTION_KEY_PREVIOUS:-}
    volumes:
      - certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5601:5601"
    # Dual-homed onto `soar`: the webhook connector fires FROM Kibana, so Kibana
    # is what has to resolve shuffle-backend. `default` must be listed
    # explicitly — a networks: key drops a service off the implicit default
    # network, which would cut Kibana off from Elasticsearch.
    #
    # Elasticsearch is NOT on `soar`: Shuffle reaches Elastic data through
    # Kibana's API on :5601, so it never needs the CA from the certs volume.
    # The invariant that matters: no talking pair may share two networks — if
    # both ends did, Docker's embedded DNS would return an address on each and
    # the traffic could take the uncaptured bridge, silently vanishing from
    # Zeek's conn.log. Elasticsearch's second network is `ingress` (#1391), which
    # only the edge shares with it; Kibana, Fleet, the watcher and the role hosts
    # reach it on `default` alone.
    networks:
      - default
      - soar
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  fleet-init:
    # One-shot: initializes Fleet plugin + creates fleet-server-policy.
    # KIBANA_FLEET_SETUP=1 on the fleet-server container does NOT create this policy in 9.x —
    # see memory reference_fleet_server_docker_9x.md.
    depends_on:
      kibana:
        condition: service_healthy
    image: curlimages/curl:latest
    container_name: soc-playground-fleet-init
    environment:
      - ELASTIC_PASSWORD=${V2_ELASTIC_PASSWORD}
    command: >
      sh -c '
        set -e;
        echo "-> fleet setup";
        cred() { printf "user = \"elastic:%s\"\n" "$$ELASTIC_PASSWORD"; };
        cred | curl -fsS -K - -H "kbn-xsrf: x" -X POST http://kibana:5601/api/fleet/setup > /dev/null;
        echo "-> fleet-server-policy (idempotent: 409 on re-run is fine)";
        HTTP=$$(cred | curl -sS -K - -o /tmp/resp.json -w "%{http_code}" -H "kbn-xsrf: x" -H "Content-Type: application/json" -X POST "http://kibana:5601/api/fleet/agent_policies?sys_monitoring=true" -d "{\"id\":\"fleet-server-policy\",\"name\":\"Fleet Server policy\",\"namespace\":\"default\",\"has_fleet_server\":true,\"monitoring_enabled\":[\"logs\",\"metrics\"]}");
        case "$$HTTP" in
          200|201) echo "created" ;;
          409) echo "already exists" ;;
          *) echo "FAIL http=$$HTTP"; cat /tmp/resp.json; exit 1 ;;
        esac;
      '
    restart: "no"

  fleet-host-policies:
    # One-shot: creates one agent policy per host role and mints an enrollment
    # token for each. Tokens land on the `fleet_tokens` shared volume so each
    # host container can read its role's token at entrypoint time without
    # holding a Kibana credential itself.
    #
    # sys_monitoring=true auto-attaches the system integration (logs+metrics)
    # to each new policy. Role-specific integrations (nginx, postgres, endpoint)
    # are layered in batches 7c+. Policies are upserted: POST returns 409 if
    # already present, enrollment-key fetch is always refreshed (token write
    # is idempotent, last writer wins).
    depends_on:
      kibana:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    image: curlimages/curl:latest
    container_name: soc-playground-fleet-host-policies
    # curlimages/curl runs as the `curl_user` (uid 100) by default; named
    # volumes are created root-owned on first attach, so writes to /tokens
    # fail with EACCES. Running as root here is fine — it's a one-shot and
    # the tokens are read-only-mounted into host containers anyway.
    user: "0"
    environment:
      - ELASTIC_PASSWORD=${V2_ELASTIC_PASSWORD}
    volumes:
      - fleet_tokens:/tokens
    command: >
      sh -c '
        set -eu;
        ROLES="web db jump-box dev-ws office-ws canary config-mgmt ci-host scanner-host";
        cred() { printf "user = \"elastic:%s\"\n" "$$ELASTIC_PASSWORD"; };
        for role in $$ROLES; do
          policy_id="host-$${role}-policy";
          echo "-> creating policy $${policy_id}";
          HTTP=$$(cred | curl -sS -K - -o /tmp/resp.json -w "%{http_code}" \
            -H "kbn-xsrf: x" \
            -H "Content-Type: application/json" \
            -X POST "http://kibana:5601/api/fleet/agent_policies?sys_monitoring=true" \
            -d "{\"id\":\"$${policy_id}\",\"name\":\"Host role: $${role}\",\"namespace\":\"default\",\"monitoring_enabled\":[\"logs\",\"metrics\"]}");
          case "$$HTTP" in
            200|201) echo "   created" ;;
            409)     echo "   already exists" ;;
            *)       echo "   FAIL http=$$HTTP"; cat /tmp/resp.json; exit 1 ;;
          esac;
          echo "-> fetching enrollment token for $${policy_id}";
          TOKEN=$$(cred | curl -fsS -K - -H "kbn-xsrf: x" \
            "http://kibana:5601/api/fleet/enrollment_api_keys?kuery=policy_id:$${policy_id}" \
            | sed -n "s/.*\"api_key\":\"\\([^\"]*\\)\".*/\\1/p" | head -n1);
          if [ -z "$$TOKEN" ]; then
            echo "   FAIL: no enrollment_api_key returned for $${policy_id}"; exit 1;
          fi;
          # Atomic-replace write — host agents poll for non-empty token file
          # and would race against a partial write otherwise.
          printf "%s" "$$TOKEN" > /tokens/$${role}.token.tmp;
          mv /tokens/$${role}.token.tmp /tokens/$${role}.token;
          echo "   wrote /tokens/$${role}.token";
        done;
      '
    restart: "no"

  fleet-outputs-reconciler:
    # Always-on sidecar that keeps `fleet-default-output` aligned with the
    # current ES CA. The CA fingerprint is pinned in the Fleet output config
    # (stored in `.fleet-*` indices on the `es_data` volume), but the CA
    # itself lives in the `certs` volume. If either volume is reset while
    # the other survives, the pinned fingerprint diverges from the live CA
    # and every agent silently fails with `x509: certificate signed by
    # unknown authority` — no telemetry lands in ES. The setup one-shot is
    # idempotent on cert generation, so nothing else reconciles the drift.
    #
    # This loop reads /certs/ca/ca.crt every 60s, computes its SHA-256
    # fingerprint, GETs the current Fleet output, and PUTs a fresh config
    # if the fingerprint or ES host has drifted. Silent on match.
    depends_on:
      kibana:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    image: alpine:3.20
    container_name: fleet-outputs-reconciler
    environment:
      - ELASTIC_PASSWORD=${V2_ELASTIC_PASSWORD}
      - INTERVAL_S=60
      - CA_PATH=/certs/ca/ca.crt
      - KIBANA_URL=http://kibana:5601
      - ES_URL=https://elasticsearch:9200
    volumes:
      - certs:/certs:ro
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl openssl >/dev/null
        log() { printf "%s %s\n" "$$(date -u +%FT%TZ)" "$$*"; }
        # Credential as curl config on stdin, never an argument: this loop runs every
        # INTERVAL_S forever, and an argument lands in Falco and process metrics each time.
        cred() { printf 'user = "elastic:%s"\n' "$$ELASTIC_PASSWORD"; }
        log "reconciler starting; interval=$${INTERVAL_S}s ca=$${CA_PATH}"
        while true; do
          if [ ! -f "$$CA_PATH" ]; then
            log "ca not found at $$CA_PATH; retrying"
            sleep "$$INTERVAL_S"; continue
          fi
          WANT_FP=$$(openssl x509 -in "$$CA_PATH" -fingerprint -sha256 -noout \
            | sed 's/.*=//; s/://g' | tr '[:upper:]' '[:lower:]')
          GOT=$$(cred | curl -fsS -K - -H 'kbn-xsrf: x' \
            "$$KIBANA_URL/api/fleet/outputs/fleet-default-output" 2>/dev/null || true)
          if [ -z "$$GOT" ]; then
            log "kibana fleet output endpoint unreachable; retrying"
            sleep "$$INTERVAL_S"; continue
          fi
          GOT_FP=$$(printf '%s' "$$GOT" \
            | sed -n 's/.*"ca_trusted_fingerprint":"\([a-f0-9]*\)".*/\1/p' \
            | tr '[:upper:]' '[:lower:]')
          GOT_HOSTS=$$(printf '%s' "$$GOT" \
            | sed -n 's/.*"hosts":\(\[[^]]*\]\).*/\1/p')
          if [ "$$GOT_FP" = "$$WANT_FP" ] && \
             printf '%s' "$$GOT_HOSTS" | grep -q "$$ES_URL"; then
            sleep "$$INTERVAL_S"; continue
          fi
          log "drift detected — want_fp=$$WANT_FP got_fp=$$GOT_FP hosts=$$GOT_HOSTS"
          BODY=$$(printf '{"hosts":["%s"],"ca_trusted_fingerprint":"%s"}' \
            "$$ES_URL" "$$WANT_FP")
          HTTP=$$(cred | curl -sS -K - -o /tmp/resp -w '%{http_code}' \
            -H 'kbn-xsrf: x' \
            -H 'Content-Type: application/json' \
            -X PUT "$$KIBANA_URL/api/fleet/outputs/fleet-default-output" \
            -d "$$BODY")
          if [ "$$HTTP" = "200" ]; then
            log "fleet-default-output updated fp=$$WANT_FP"
          else
            log "update FAILED http=$$HTTP body=$$(cat /tmp/resp)"
          fi
          sleep "$$INTERVAL_S"
        done
    mem_limit: 64m
    restart: unless-stopped

  fleet-server:
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: fleet-server
    user: "0"
    environment:
      # Fleet Server mode — self-bootstraps via Kibana Fleet API on first start.
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/usr/share/elastic-agent/certs/ca/ca.crt
      - FLEET_SERVER_CERT=/usr/share/elastic-agent/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/usr/share/elastic-agent/certs/fleet-server/fleet-server.key
      - FLEET_URL=https://fleet-server:8220
      # Agent side: trust our self-signed CA when enrolling back into this same Fleet Server.
      - FLEET_CA=/usr/share/elastic-agent/certs/ca/ca.crt
      # Run Kibana Fleet setup + auto-generate service token on first boot.
      - KIBANA_FLEET_SETUP=1
      - KIBANA_HOST=http://kibana:5601
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=${V2_ELASTIC_PASSWORD}
    volumes:
      - certs:/usr/share/elastic-agent/certs:ro
      - fleet_data:/usr/share/elastic-agent/state
    ports:
      - "127.0.0.1:8220:8220"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8220/api/status | grep -q '\"status\":\"HEALTHY\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  keycloak-init:
    # One-shot: converts realm.yaml → realm.json on the shared import volume.
    # Idempotent — runs every `compose up` and rewrites the JSON; Keycloak's
    # --import-realm skips if the realm already exists, so re-imports are safe no-ops.
    # Built from ./keycloak/Dockerfile so realm.yaml + seed.py ship via the build
    # context (compose `configs:` resolves paths on the remote daemon, which
    # doesn't have /workspace/; a build-and-upload sidesteps that).
    build: ./keycloak
    image: soc-playground/keycloak-init:local
    container_name: soc-playground-keycloak-init
    volumes:
      - keycloak_import:/import
    command: ["python", "/config/seed.py", "/config/realm.yaml", "/import/realm.json"]
    restart: "no"

  keycloak:
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${V2_KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${V2_KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      # Raise org.keycloak.events to DEBUG so the jboss-logging listener actually
      # writes LOGIN/LOGOUT/etc. lines to stdout. Root stays INFO — we only want
      # the events stream, not all of Keycloak's internals.
      - KC_LOG_LEVEL=INFO,org.keycloak.events:debug
      # Also write to a file in JSON format so the host-side elastic-agent can
      # tail it into logs-keycloak.events via Custom Logs + decode_json_fields.
      # File lands inside the existing keycloak_data named volume — on the VPS
      # at /var/lib/docker/volumes/soc-playground_keycloak_data/_data/keycloak.log
      # — the host agent reads it from there. No extra volume needed.
      - KC_LOG=console,file
      - KC_LOG_FILE=/opt/keycloak/data/keycloak.log
      - KC_LOG_FILE_OUTPUT=json
    command: ["start-dev", "--import-realm"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - keycloak_import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    healthcheck:
      # Keycloak 26 management/health port is 9000; no curl in the image, so use
      # bash + /dev/tcp. CMD-SHELL's /bin/sh doesn't honor `echo -e`'s escapes
      # portably — force bash + printf, which reliably emits real CRLF (without
      # that, Vert.x rejects the request with "Host header required").
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && timeout --preserve-status 2 cat <&3 | grep -q ''"status": "UP"'''
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  unbound:
    build: ./unbound
    image: soc-playground/unbound:local
    container_name: unbound
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      # /var/log/unbound is created in the image with unbound:unbound ownership;
      # the named volume preserves those perms on first init. Host-side
      # elastic-agent reads /var/lib/docker/volumes/soc-playground_unbound_logs/_data/unbound.log.
      - unbound_logs:/var/log/unbound
    healthcheck:
      # pgrep is in the alpine base; confirms the daemon is up. (No netcat in minimal
      # alpine for a proper `dig`-style probe; pgrep is enough for a playground.)
      test: ["CMD", "pgrep", "unbound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  squid:
    build: ./squid
    image: soc-playground/squid:local
    container_name: squid
    restart: unless-stopped
    mem_limit: 256m
    # /var/log/squid is a VOLUME in the ubuntu/squid image. We use a **named** volume
    # (not anonymous) so the host-side elastic-agent can tail /var/lib/docker/volumes/
    # soc-playground_squid_logs/_data/access.log into Elastic — symmetric to zeek_logs.
    # Image-time volume init handles perms (proxy:proxy / uid=13) automatically.
    # /var/spool/squid stays tmpfs — cache dir, no value in persisting it.
    volumes:
      - squid_logs:/var/log/squid
    tmpfs:
      - /var/spool/squid:uid=13,gid=13,mode=0755
    healthcheck:
      # Squid's PID file is at /run/squid.pid in the ubuntu/squid image; presence
      # alone is enough to confirm the master process is up.
      test: ["CMD-SHELL", "test -f /run/squid.pid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  falco:
    # Shared syscall monitor (modern eBPF / CO-RE). Sees every container on
    # the daemon; per-host attribution is via the container plugin's
    # `container.name` field on each event. Output JSON lands on the VPS
    # host filesystem so the existing host-side elastic-agent (enrolled into
    # `vps-host-policy` in batch 4e) can tail it via a custom-logs integration
    # — see playground-v2/CLAUDE.md §Syscall monitoring (Falco).
    #
    # CA dependency: the host-side agent reads `/etc/elastic-agent/ca.crt` —
    # a copy made at enrollment time, not a mount of the `certs` named volume.
    # If you ever rotate the CA (`docker volume rm <project>_certs && compose
    # up setup`), the host-side agent's copy must be refreshed manually:
    #   docker --context soc-playground exec elasticsearch \
    #     cat /usr/share/elasticsearch/config/certs/ca/ca.crt > /tmp/ca.crt
    #   scp /tmp/ca.crt soc-playground:/etc/elastic-agent/ca.crt
    #   ssh soc-playground sudo systemctl restart elastic-agent
    # The `setup` script's pinned-CA logic prevents this drift under normal
    # re-runs; an explicit rotation still requires this manual step.
    build:
      context: ./falco
      args:
        FALCO_VERSION: ${FALCO_VERSION}
        # Pinned together with FALCO_VERSION — an unpinned plugin install makes
        # a later rebuild pull a plugin the pinned Falco cannot load.
        CONTAINER_PLUGIN_VERSION: ${CONTAINER_PLUGIN_VERSION}
    image: soc-playground/falco:local
    container_name: falco
    restart: unless-stopped
    mem_limit: 512m
    # Avoid `privileged: true` — we only need the BPF-adjacent caps. Matches
    # v1's footprint.
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    volumes:
      # Kernel surface for CO-RE BPF.
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/host/proc:ro
      - /dev:/host/dev:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      # Container metadata for the container plugin. Falco 0.43+'s plugin
      # needs RW because some name/image lookups go through write endpoints;
      # :ro yields container.id populated but container.name=<NA>.
      - /var/run/docker.sock:/host/var/run/docker.sock
      # Output — bind-mounted to the VPS host so the host agent can tail it
      # without going through a docker volume.
      - /var/log/falco:/var/log/falco
    # Engine selection is in /etc/falco/falco.yaml (engine.kind: modern_ebpf).
    # Falco 0.39 dropped the `--modern-bpf` CLI flag in favor of config-only;
    # rely on the image's default ENTRYPOINT which reads falco.yaml.
    healthcheck:
      # Falco image ships neither pgrep nor ps, so inspect its output file
      # instead — once Falco has emitted a single event, the file is non-empty
      # and we know the pipeline works end-to-end (engine + rules + file
      # output). start_period gives BPF load + initial rule-load time.
      test: ["CMD-SHELL", "[ -s /var/log/falco/falco.json ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  zeek:
    build: ./zeek
    image: soc-playground/zeek:local
    container_name: zeek
    # Host netns so Zeek's libpcap sees real interfaces (eth0, docker0, all br-* bridges).
    # Bridge-mode would only let it sniff its own veth, which is useless for passive monitoring.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - zeek_logs:/usr/local/zeek/logs
    # entrypoint.sh picks the soc-playground compose bridge (br-*) if one is UP,
    # else eth0. It uses the AF_PACKET plugin — libpcap rejects promisc mode on
    # the `any` pseudo-interface on recent Linux kernels, AF_PACKET sidesteps it.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'zeek -C -i af_packet' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────────────
  # Role-clustered host population (batch 7a + 7b).
  # All 8 services share playground-v2/hosts/Dockerfile via target+BASE_OS args;
  # BuildKit caches identical (target, BASE_OS) combinations across services.
  # Identities + user shells are seeded at container start from inventory.yaml.
  # Each host ships elastic-agent (installed in the base stage), enrolled at
  # first boot into its HOST_ROLE policy using the token fleet-host-policies
  # wrote to /fleet-tokens/<role>.token. State (agent.id, fleet.enc) persists
