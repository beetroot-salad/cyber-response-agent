      - certs:/fleet-certs:ro
      - fleet_tokens:/fleet-tokens:ro
      - agent_state_web_1:/var/lib/elastic-agent
      - var_log_web_1:/var/log
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null && pgrep -x nginx >/dev/null"]
