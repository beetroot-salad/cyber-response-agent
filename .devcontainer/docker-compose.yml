name: cyber-response-agent_devcontainer

services:
  # Pure development environment - "coding machine"
  devcontainer:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile.dev
      args:
        # Team-baseline pins. Override per-machine by setting these in
        # .devcontainer/.env (gitignored) — no tracked diff required.
        HCLOUD_VERSION: ${HCLOUD_VERSION:-1.62.2}
        CODEX_VERSION: ${CODEX_VERSION:-0.137.0}
    container_name: response-devcontainer
    env_file:
      - ../.env
    environment:
      # Cap what pytest's `-n auto` means. `auto` is one worker per host CPU (12
      # here) and xdist workers share almost nothing — a live worker measured
      # 292 MB resident, 246 MB of it private-dirty — so the bill is linear in
      # worker count. Two agent sessions running fleets at once (12 + 8) pinned
      # this container at its memory ceiling and got workers OOM-killed.
      # pytest-xdist >= 3.8 reads this var as the cap for `auto`.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "6"
      # Every run names its tenant, and there is no default data root (#1078, §7 J01) — this is
      # the devcontainer's ONLY data root, not an alternative to a code default. It must be a
      # path this container shares with the host docker daemon (DooD, C46), which /workspace is.
      DEFENDER_DATA_ROOT: /workspace/.defender-data
      # This box is a dev deployment: each run page and learning page is also
      # published under DEFENDER_RUN_VISUALIZATIONS_DIR (#1110, #1279). Unset means
      # `production`, which the runtime image deliberately leaves it as.
      DEFENDER_DEPLOYMENT: dev
      # Where dev publishes (#1279 A11): named here, never worked out from a checkout.
      # No box mounts the workspace root, so a folder at its top level is safe.
      DEFENDER_RUN_VISUALIZATIONS_DIR: /workspace/run-visualizations
    volumes:
      - ../:/workspace # Mount full workspace directory
      # Docker-outside-of-Docker: hand the dev container the HOST daemon so it can
      # build and run the runtime image (Dockerfile.runtime) as a *sibling*
      # container — keeping the actual investigation runtime separate from this
      # dev/tooling container. NOTE: this makes the dev container effectively
      # root-equivalent on the host daemon; acceptable because the dev container
      # is the trusted "coding machine", and it is the seam by which the SEPARATE,
      # minimal runtime container gets spawned (and, later, given the privilege
      # runsc needs — which this dev container deliberately does not have).
      - /var/run/docker.sock:/var/run/docker.sock
    # PID 1 must reap orphaned children. Without an init, `sleep infinity`
    # becomes PID 1 and never reaps — every detached process (run.py
    # launchers, backgrounded ssh/git/gh) leaks as a permanent zombie, and
    # kill -0 / wait-on-pid liveness checks see zombies as still-alive.
    # `init: true` injects tini as PID 1 to reap them.
    init: true
    # Memory ceiling, deliberately LOWER than the 10 GiB this container had been
    # running with. That 10 GiB was never declared here — it was applied
    # out-of-band to the live container — so this line is also the first time the
    # limit is written down. It is NOT a mistake and must not be "corrected"
    # upward: the kill that actually hurt was the HOST running out globally and
    # the kernel taking down the user's VS Code. The host has 14 GiB and also
    # carries a desktop, an editor and a browser. A ceiling the container hits
    # BEFORE the host does means the container kills its own test worker instead
    # of the user's session — the container is the cheaper thing to lose.
    # memswap_limit is pinned to the same value on purpose: it keeps the
    # container's swap allowance at zero, which is the posture it already had
    # (HostConfig.MemorySwap == HostConfig.Memory). Without it Docker defaults
    # memswap to 2x mem_limit and the container could spill 8 GiB onto the
    # host's 4 GiB swap file — reintroducing the host-side pressure this exists
    # to remove.
    mem_limit: 8g
    memswap_limit: 8g
    command: ["sleep", "infinity"]

  # Self-hosted git service for tenant knowledge repos (#1108, #1120): each tenant's
  # `settings/` + `agent/` live in their own repo here, never in this product repo or on
  # GitHub. Operator-side infrastructure, like the data root — NOT part of the playground
  # (that is the simulated client estate, and is destroyed on lever-down).
  #
  # From the dev container: http://forgejo:3000; from the host's browser:
  # http://localhost:${FORGEJO_HTTP_PORT:-3000}. Each tenant has a non-admin bot and a
  # repository-restricted Authorized Integration whose issuer is the `openbao` service below.
  # Host delivery processes log in to it themselves (AppRole) and present its short-lived JWTs;
  # see defender/docs/development-operations.md for provisioning and scope. Runtime boxes
  # receive exported files and never receive Forgejo or issuer credentials.
  forgejo:
    # Authorized Integrations authenticate short-lived Vault identities for API and git.
    # Override per machine in .devcontainer/.env.
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-17.0.0}
    container_name: response-forgejo
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      # Skip the web install wizard; accounts are created with `forgejo admin user create`.
      FORGEJO__security__INSTALL_LOCK: "true"
      # Accounts are created by the admin only: one per person, plus one bot per tenant.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__server__DOMAIN: localhost
      # The URL shown in the UI and in API responses (PR links): the one the host's browser opens.
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_HTTP_PORT:-3000}/
      FORGEJO__server__HTTP_PORT: "3000"
      # SSH is reachable only on the compose network (not published to the host).
      FORGEJO__server__SSH_DOMAIN: forgejo
      FORGEJO__server__SSH_PORT: "22"
      # Authorized Integrations may name only the dev issuer (#1108 P4). Forgejo fetches its
      # discovery and JWKS over HTTPS on the compose network, trusting the dev CA added below.
      FORGEJO__authorized_integration__ALLOWED_DOMAINS: openbao
      SSL_CERT_DIR: /etc/ssl/certs:/etc/ssl/dev-issuer-ca
    volumes:
      # A host folder, gitignored (#1108 P4, U2), so repos survive a rebuild AND
      # `docker compose down -v`. The old `forgejo-data` named volume is no longer declared, so
      # `down -v` cannot remove it; it stays until the operator deletes it. Migrate it once with
      # `.devcontainer/provision-dev-issuer.sh migrate-forgejo-data`.
      - ../playground-knowledge:/data
      # The dev CA's certificate only (never its key).
      - ../playground-issuer/trust:/etc/ssl/dev-issuer-ca:ro
    ports:
      # Loopback only: the UI is for this machine's browser, not the network.
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3000}:3000"
    # A git service with sqlite idles around 150 MB; the cap keeps it from competing with the
    # dev container's 8g on a 14 GiB host.
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

  # The dev issuer (#1108 P4, U1): OpenBao signs the identity tokens Forgejo accepts from host
  # delivery processes (drains, `tenant.py`, the launch-time publish child). File storage and a
  # static seal (`openbao/openbao.hcl`) keep it unsealed across restarts with no human (O12).
  # Its storage, seal key, TLS material and the AppRole client config live under
  # <repo>/playground-issuer/ (gitignored, U4): prepare and provision them with
  # `.devcontainer/provision-dev-issuer.sh` (it restarts this service once the files exist).
  # No host port: it is reachable only on the compose network, at https://openbao:8200.
  openbao:
    image: openbao/openbao:${OPENBAO_VERSION:-2.4.1}
    container_name: response-openbao
    hostname: openbao
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ../playground-issuer/storage:/openbao/file
      - ../playground-issuer/seal:/openbao/seal:ro
      - ../playground-issuer/tls:/openbao/tls:ro
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped

  # The identity provider for the platform API (#1306): Keycloak signs people in and holds their
  # passwords and one-time codes; the API keeps everything else. Dev posture only: `start-dev`,
  # plain HTTP, and the dev-only placeholder secrets in `keycloak/realm-defender.json` (realm
  # `defender`, clients `defender-api` and `defender-api-admin`) and below.
  # `--import-realm` creates the realm on first start only; an existing realm is left as it is, so
  # after editing the export run `docker compose down -v` (drops the database volume) and `up`.
  # From the dev container: http://keycloak:8080; from the host's browser:
  # http://localhost:${KEYCLOAK_HTTP_PORT:-8080}. Keycloak's own mail goes to `mailpit`.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4.0}
    container_name: response-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: defender
      KC_DB_PASSWORD: dev-only-change-me
      # The URL the host's browser opens, so the token issuer is the one the API is configured with.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HTTP_PORT:-8080}
      KC_HTTP_PORT: "8080"
      # The master realm's first administrator, for the admin console only.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-change-me
    volumes:
      - ./keycloak/realm-defender.json:/opt/keycloak/data/import/realm-defender.json:ro
    ports:
      # Loopback only: the sign-in pages are for this machine's browser, not the network.
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped

  # Keycloak's database (#1306): a `keycloak` database owned by the `defender` role, which is also
  # the dev cluster's superuser, so the API can `createdb` its own beside it. Compose network only.
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.6}
    container_name: response-postgres
    environment:
      POSTGRES_USER: defender
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defender -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped

  # The dev mail catcher (#1306): accepts Keycloak's mail (SMTP on mailpit:1025, the compose
  # network only) and shows it, set-password links included, at http://localhost:${MAILPIT_HTTP_PORT:-8025}.
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.20}
    container_name: response-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped

volumes:
  postgres-data:
