name: cyber-response-agent_devcontainer

services:
  # Pure development environment - "coding machine"
  devcontainer:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile.dev
      args:
        # Team-baseline pins. Override per-machine by setting these in
        # .devcontainer/.env (gitignored) — no tracked diff required.
        HCLOUD_VERSION: ${HCLOUD_VERSION:-1.62.2}
        CODEX_VERSION: ${CODEX_VERSION:-0.137.0}
    container_name: response-devcontainer
    env_file:
      - ../.env
    environment:
      # Cap what pytest's `-n auto` means. `auto` is one worker per host CPU (12
      # here) and xdist workers share almost nothing — a live worker measured
      # 292 MB resident, 246 MB of it private-dirty — so the bill is linear in
      # worker count. Two agent sessions running fleets at once (12 + 8) pinned
      # this container at its memory ceiling and got workers OOM-killed.
      # pytest-xdist >= 3.8 reads this var as the cap for `auto`.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "6"
      # Every run names its tenant, and there is no default data root (#1078, §7 J01) — this is
      # the devcontainer's ONLY data root, not an alternative to a code default. It must be a
      # path this container shares with the host docker daemon (DooD, C46), which /workspace is.
      DEFENDER_DATA_ROOT: /workspace/.defender-data
      # This box is a dev deployment: each run page is also copied to the main
      # checkout's `run-visualizations/` (#1110). Unset means `production`, which
      # the runtime image deliberately leaves it as.
      DEFENDER_DEPLOYMENT: dev
    volumes:
      - ../:/workspace # Mount full workspace directory
      # Docker-outside-of-Docker: hand the dev container the HOST daemon so it can
      # build and run the runtime image (Dockerfile.runtime) as a *sibling*
      # container — keeping the actual investigation runtime separate from this
      # dev/tooling container. NOTE: this makes the dev container effectively
      # root-equivalent on the host daemon; acceptable because the dev container
      # is the trusted "coding machine", and it is the seam by which the SEPARATE,
      # minimal runtime container gets spawned (and, later, given the privilege
      # runsc needs — which this dev container deliberately does not have).
      - /var/run/docker.sock:/var/run/docker.sock
    # PID 1 must reap orphaned children. Without an init, `sleep infinity`
    # becomes PID 1 and never reaps — every detached process (run.py
    # launchers, backgrounded ssh/git/gh) leaks as a permanent zombie, and
    # kill -0 / wait-on-pid liveness checks see zombies as still-alive.
    # `init: true` injects tini as PID 1 to reap them.
    init: true
    # Memory ceiling, deliberately LOWER than the 10 GiB this container had been
    # running with. That 10 GiB was never declared here — it was applied
    # out-of-band to the live container — so this line is also the first time the
    # limit is written down. It is NOT a mistake and must not be "corrected"
    # upward: the kill that actually hurt was the HOST running out globally and
    # the kernel taking down the user's VS Code. The host has 14 GiB and also
    # carries a desktop, an editor and a browser. A ceiling the container hits
    # BEFORE the host does means the container kills its own test worker instead
    # of the user's session — the container is the cheaper thing to lose.
    # memswap_limit is pinned to the same value on purpose: it keeps the
    # container's swap allowance at zero, which is the posture it already had
    # (HostConfig.MemorySwap == HostConfig.Memory). Without it Docker defaults
    # memswap to 2x mem_limit and the container could spill 8 GiB onto the
    # host's 4 GiB swap file — reintroducing the host-side pressure this exists
    # to remove.
    mem_limit: 8g
    memswap_limit: 8g
    command: ["sleep", "infinity"]

  # Self-hosted git service for tenant knowledge repos (#1108, #1120): each tenant's
  # `settings/` + `agent/` live in their own repo here, never in this product repo or on
  # GitHub. Operator-side infrastructure, like the data root — NOT part of the playground
  # (that is the simulated client estate, and is destroyed on lever-down).
  #
  # From the dev container: http://forgejo:3000 (clone the lab with
  # `git clone http://forgejo:3000/tenants/playground.git $DEFENDER_DATA_ROOT/playground/knowledge`,
  # credentials through a git credential helper, never in the URL). Each tenant's clone uses
  # its OWN bot account (`bot-<id>-<salt>`, write on that one repo only), whose token lives at
  # $DEFENDER_DATA_ROOT/<id>/forge/git-credentials — never an admin token. From the host's browser:
  # http://localhost:${FORGEJO_HTTP_PORT:-3000}. Runs and the runtime image never reach it:
  # the operator clones, and runs read the clone.
  forgejo:
    # 15.x is the LTS line (supported to 2027-07). Override per machine in .devcontainer/.env.
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15.0.9}
    container_name: response-forgejo
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      # Skip the web install wizard; accounts are created with `forgejo admin user create`.
      FORGEJO__security__INSTALL_LOCK: "true"
      # Accounts are created by the admin only: one per person, plus one bot per tenant.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__server__DOMAIN: localhost
      # The URL shown in the UI and in API responses (PR links): the one the host's browser opens.
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_HTTP_PORT:-3000}/
      FORGEJO__server__HTTP_PORT: "3000"
      # SSH is reachable only on the compose network (not published to the host).
      FORGEJO__server__SSH_DOMAIN: forgejo
      FORGEJO__server__SSH_PORT: "22"
    volumes:
      # A named volume, so repos survive a devcontainer rebuild (`docker compose down` keeps
      # it; only `down -v` deletes it). Back it up before any `-v`.
      - forgejo-data:/data
    ports:
      # Loopback only: the UI is for this machine's browser, not the network.
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3000}:3000"
    # A git service with sqlite idles around 150 MB; the cap keeps it from competing with the
    # dev container's 8g on a 14 GiB host.
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

volumes:
  forgejo-data:
